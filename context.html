<header class="bar"><nav class="crumbs"><a href="index.html">blueprint</a><i>›</i><span>context</span></nav><div class="spacer"></div><a class="ghost" id="home" href="dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Context — what is in force</h1><div id="doc"></div></main><script>const SRC = "\n[DAG index](dag.html) · [appendix of objects](appendix/index.html) · [pipeline](process/pipeline.html)\n\nDistilled from `main.tex` (canonical) — abstract, [`assum:intro`](appendix/assum-intro.html), Conventions (§ lines 232–1011) — and `Letter_to_Ruotao.tex` (proof outline).\n\nThis file states **what is in force**: the setting, the standing hypotheses, the shape of the argument, and the seed question. It does not restate objects. Every definition, convention, theorem and black box lives as one entry in the [appendix of objects](appendix/index.html), and is referred to here by link. If a result is not in the appendix, the pipeline may not invoke it.\n\n## Standing assumptions\n\nBase field $k$ algebraically closed of characteristic $0$. $G$ a connected reductive group over $k$ with Borel $B\\supset T$; $I\\subset K := L^+G$ the Iwahori corresponding to $B$; $\\check G$ the Langlands dual group, $\\check{\\mathfrak{g}}$ its Lie algebra. The full standing notation is [`subsec:notations`](appendix/subsec-notations.html).\n\n$X$ is a smooth affine **spherical** $G$-variety with connected $B$-stabilizers on the open orbit, as in [`def:polarized_hyperspherical`](appendix/def-polarized-hyperspherical.html); then $M = T^*(2)X$ is polarized hyperspherical with hyperspherical dual $(\\check G,\\check M)$.\n\nThe three standing hypotheses are [`assum:intro`](appendix/assum-intro.html):\n\n- **(a)** the colimit of $L^+G$-orbit closures presents $LX$ as an $L^+G$-placid ind-scheme — automatic in this generality by [`thm:chen_Ti`](appendix/thm-chen-ti.html);\n- **(b)** $LX$ admits a dimension theory [[raskin_dmodules_infinite_var](../papers/raskin_dmodules_infinite_var.pdf)], which is what identifies $\\mathcal{D}^!$ with $\\mathcal{D}^*$ ([`ex:sheaf_placid_ind`](appendix/ex-sheaf-placid-ind.html));\n- **(c)** the unramified conjecture [`Conj:intro`](appendix/conj-intro.html) = [`conj:relative_Langlands_unramified`](appendix/conj-relative-langlands-unramified.html) holds for $X$.\n\nUnder these, the main theorem [`thm:iwahori_proof`](appendix/thm-iwahori-proof.html) asserts\n\n$$\n\\mathbb{L}^{\\mathrm{Sat}}\\colon \\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}} \\simeq \\mathrm{Perf}\\left(\\mathrm{sh}^{1/2}\\left(\\tilde{\\check{\\mathfrak{g}}}^*(2)\\times_{\\check{\\mathfrak{g}}^*(2)}\\check M\\right)/\\check G\\right).\n$$\n\nEvery node of the DAG inherits this setting unless it says otherwise.\n\n## Notation\n\nEvery symbol whose meaning depends on an ambient category names that category.\n\n- **Generation.** $\\langle S\\rangle_{\\mathcal{C}}$, the operation of [`def:generation`](appendix/def-generation.html), is the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing $S$. The subscript is not optional: the ambient is part of the data, and main.tex leaving it off at the point of use is exactly the defect that [`def:satake_subcategory`](appendix/def-satake-subcategory.html) had to ratify away.\n- **Mapping spaces.** $\\operatorname{Map}_{\\mathcal{C}}(-,-)$, likewise.\n- **Equalities and equivalences.** $=$ and $\\simeq$ carry as a subscript the category in which the assertion is made — the ambient whose full subcategories the two sides are, or, for two objects, the category they live in. So\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\n$$\n\nasserts equality of full subcategories of $\\mathcal{D}_c(K\\backslash LX)$, which is a different claim from the same two symbols compared inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\nTwo exceptions keep the subscript informative rather than decorative. It is dropped when the ambient is already one of the two sides — $\\langle S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ needs no further label — and when the two sides live in no common ambient, as for an equivalence of categories ($\\mathcal{D}_c(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda)$) or of stacks ($K\\backslash LX_\\lambda\\simeq BK_\\lambda$).\n\n`tools/check_render.py` enforces the first rule: a generation bracket with no ambient subscript fails the render gate.\n\n## Two conventions that silently break proofs\n\nBoth are stated in the appendix; they are repeated here because a proof that gets them wrong still typechecks.\n\n**Cohomological degrees.** $(M[n])^i = M^{i+n}$, so $k[n]$ sits in degree $-n$ — see [cohomological degrees and graded objects](appendix/conv-cohomological-degrees.html).\n\n**Coherent is not compact.** On a stack, $\\mathcal{D}_c$ and $\\mathcal{D}^\\omega$ differ: the constant $\\mathcal{D}$-module on $BG$ is coherent and not compact. Compactness arguments must therefore be run in $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$, where $\\mathcal{D}_c$ is by construction the subcategory of compacts. See [`defn:coherent_D_mod`](appendix/defn-coherent-d-mod.html) and [`def:renormalized`](appendix/def-renormalized.html).\n\n## Ratified readings\n\nPoints where main.tex is ambiguous and the blueprint has fixed a reading. A ratified reading binds every node; changing one invalidates the proofs downstream of it.\n\n1. **Test schemes in [`defn:coherent_D_mod`](appendix/defn-coherent-d-mod.html) are of finite type** — forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$, see [$\\mathcal{D}^!$, $\\mathcal{D}^*$](appendix/conv-d-shriek-d-star.html). Ratified at [Q1-L1](nodes/Q1-L1/index.html).\n2. **Satake generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$** — the $\\langle-\\rangle_{\\mathcal{C}}$ of [`def:generation`](appendix/def-generation.html) in [`def:satake_subcategory`](appendix/def-satake-subcategory.html) has no ambient category in the manuscript; $\\mathcal{D}_c$ itself is small and not cocomplete. Forced by the essential-image step of [`thm:F_cstr_Sat`](appendix/thm-f-cstr-sat.html) (main.tex:1391–1392). Ratified at [Q1-L1](nodes/Q1-L1/index.html), recorded as [ADR 0001](process/decisions/0001-satake-generation-ambient-category.html).\n3. **The orbit strata of [`def:orbits_iwahori_spherical`](appendix/def-orbits-iwahori-spherical.html) are fpqc-sheaf images** — main.tex:737 posits the orbit posets without defining \"orbit\"; the blueprint reads the orbit through a $k$-point as the fpqc-sheaf image of its orbit map, the strata being exactly these images, with representability by the named locally closed sub-ind-schemes the entry's definitional content. The reading does *not* identify the image with any pro-scheme presentation — that stays a theorem where a node needs it. Ratified at [Q1-L4-L1](nodes/Q1-L4/Q1-L4-L1/index.html), recorded as [ADR 0028](process/decisions/0028-orbit-strata-are-fpqc-images.html).\n\n## What the pipeline may invoke\n\nExactly three things, and nothing else:\n\n1. the entries of the [appendix of objects](appendix/index.html) — definitions, conventions, black boxes, results proved in main.tex;\n2. the node's own `depends-on` list;\n3. standard mathematics that needs no citation.\n\nA proof leaning on anything else is circular, and the critic marks it so even when the claim is true. A manuscript result that has not been given an appendix entry is invisible to the pipeline; the fix is to add the entry, not to argue.\n\nWhere to look, by subject:\n\n- higher-categorical language, $\\mathrm{Pr}^L$, $\\mathrm{DGCat}$ — [appendix §2](appendix/index.html#s2);\n- generation, compactness, relative tensor products — [appendix §3](appendix/index.html#s3);\n- shearing and graded geometry — [appendix §4](appendix/index.html#s4);\n- placidity, sheaves on loop spaces, orbits, coherence — [appendix §5](appendix/index.html#s5);\n- invariants, the Campbell–Dhillon counit — [appendix §6](appendix/index.html#s6);\n- spherical varieties, $\\mathrm{IC}_0$, Satake subcategories, known unramified cases — [appendix §7](appendix/index.html#s7);\n- results proved inside main.tex — [appendix §8](appendix/index.html#s8);\n- external black boxes — [appendix §9](appendix/index.html#s9).\n\n## Proof architecture of the main theorem (for orientation)\n\nStrategy section main.tex:148–201. The chain:\n\n1. the Campbell–Dhillon counit [`thm:CD_counit`](appendix/thm-cd-counit.html), applicable because $\\mathrm{Gr} = LG/L^+G$ is ind-proper, gives a fully faithful $F$;\n2. full faithfulness of $\\iota$ on small relative tensor products, via the monad calculation [`prop:monad_map_space`](appendix/prop-monad-map-space.html) and Künneth [`lem:kunneth_property`](appendix/lem-kunneth-property.html);\n3. matching generators yields [`thm:F_cstr_Sat`](appendix/thm-f-cstr-sat.html);\n4. the spectral side follows from [ABG](appendix/bb-abg.html) + [derived Satake](appendix/bb-derived-satake.html) + [`assum:intro`](appendix/assum-intro.html)(c) + [BZFN](appendix/bb-bzfn.html).\n\n## Seed question (Q1)\n\nDetermine when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX),\n$$\n\ni.e. when the Satake subcategory exhausts all coherent $\\mathcal{D}$-modules. The known extreme is the group case $X = G$, where equality holds by derived Satake — [`exam:hyperspherical_duality`](appendix/exam-hyperspherical-duality.html)(1). The tools are the orbit stratification [`def:orbits_iwahori_spherical`](appendix/def-orbits-iwahori-spherical.html), placidity [`thm:chen_Ti`](appendix/thm-chen-ti.html), and the compact-generation machinery of [appendix §3](appendix/index.html#s3). The decomposition is [Q1 in the DAG index](dag.html).\n\n## Citation policy\n\n- Cite only bib keys present in `refs.bib` (grep before citing).\n- Reference main.tex only via `\\label`s that exist (grep before referencing); unlabelled objects are cited by line number.\n- Facts not in the [appendix](appendix/index.html) and not in the node's `depends-on` list must be proved, or flagged `GAP`.\n- Math in this file, and in all blueprint and critique markdown, is standard KaTeX/MathJax LaTeX — house macros are `.tex`-only.\n";</script>
