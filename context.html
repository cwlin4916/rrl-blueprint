<header class="bar"><nav class="crumbs"><a href="dag.html">the DAG</a><i>›</i><span>context</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Context — what is in force</h1><div id="doc"></div></main><script>const SRC = "\n[DAG index](dag.html) · [appendix of objects](appendix/index.html) · [pipeline](process/pipeline.html)\n\nDistilled from `main.tex` (canonical) — abstract, [the three standing hypotheses](appendix/assum-intro.html), Conventions (§ lines 232–1011) — and `Letter_to_Ruotao.tex` (proof outline).\n\nThis file states **what is in force**: the setting, the standing hypotheses, the shape of the argument, and the seed question. It does not restate objects. Every definition, convention, theorem and black box lives as one entry in the [appendix of objects](appendix/index.html), and is referred to here by link. If a result is not in the appendix, the pipeline may not invoke it.\n\n## Standing assumptions\n\nBase field $k$ algebraically closed of characteristic $0$. $G$ a connected reductive group over $k$ with Borel $B\\supset T$; $I\\subset K := L^+G$ the Iwahori corresponding to $B$; $\\check G$ the Langlands dual group, $\\check{\\mathfrak{g}}$ its Lie algebra. The full standing notation is [the standing notation](appendix/subsec-notations.html).\n\n$X$ is a smooth affine **spherical** $G$-variety with connected $B$-stabilizers on the open orbit, as in [untwisted polarized hyperspherical varieties](appendix/def-polarized-hyperspherical.html); then $M = T^*(2)X$ is polarized hyperspherical with hyperspherical dual $(\\check G,\\check M)$.\n\nThe three standing hypotheses are [the three standing hypotheses](appendix/assum-intro.html):\n\n- **(a)** the colimit of $L^+G$-orbit closures presents $LX$ as an $L^+G$-placid ind-scheme — automatic in this generality by [orbit closures present $LX$ as a placid ind-scheme](appendix/thm-chen-ti.html);\n- **(b)** $LX$ admits a dimension theory [[raskin_dmodules_infinite_var](../papers/raskin_dmodules_infinite_var.pdf)], which is what identifies $\\mathcal{D}^!$ with $\\mathcal{D}^*$ ([sheaves on a placid ind-scheme](appendix/ex-sheaf-placid-ind.html));\n- **(c)** the unramified conjecture [unramified conjecture, de Rham setting](appendix/conj-intro.html) = [unramified relative local Langlands](appendix/conj-relative-langlands-unramified.html) holds for $X$.\n\nUnder these, the main theorem [main theorem](appendix/thm-iwahori-proof.html) asserts\n\n$$\n\\mathbb{L}^{\\mathrm{Sat}}\\colon \\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}} \\simeq \\mathrm{Perf}\\left(\\mathrm{sh}^{1/2}\\left(\\tilde{\\check{\\mathfrak{g}}}^*(2)\\times_{\\check{\\mathfrak{g}}^*(2)}\\check M\\right)/\\check G\\right).\n$$\n\nEvery node of the DAG inherits this setting unless it says otherwise.\n\n## Notation\n\nEvery symbol whose meaning depends on an ambient category names that category.\n\n- **Generation.** $\\langle S\\rangle_{\\mathcal{C}}$, the operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](appendix/def-generation.html), is the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing $S$. The subscript is not optional: the ambient is part of the data, and main.tex leaving it off at the point of use is exactly the defect that [the Satake subcategories](appendix/def-satake-subcategory.html) had to ratify away.\n- **Mapping spaces.** $\\operatorname{Map}_{\\mathcal{C}}(-,-)$, likewise.\n- **Equalities and equivalences.** $=$ and $\\simeq$ carry as a subscript the category in which the assertion is made — the ambient whose full subcategories the two sides are, or, for two objects, the category they live in. So\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\n$$\n\nasserts equality of full subcategories of $\\mathcal{D}_c(K\\backslash LX)$, which is a different claim from the same two symbols compared inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\nTwo exceptions keep the subscript informative rather than decorative. It is dropped when the ambient is already one of the two sides — $\\langle S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ needs no further label — and when the two sides live in no common ambient, as for an equivalence of categories ($\\mathcal{D}_c(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda)$) or of stacks ($K\\backslash LX_\\lambda\\simeq BK_\\lambda$).\n\n`tools/check_render.py` enforces the first rule: a generation bracket with no ambient subscript fails the render gate.\n\n## Two conventions that silently break proofs\n\nBoth are stated in the appendix; they are repeated here because a proof that gets them wrong still typechecks.\n\n**Cohomological degrees.** $(M[n])^i = M^{i+n}$, so $k[n]$ sits in degree $-n$ — see [cohomological degrees and graded objects](appendix/conv-cohomological-degrees.html).\n\n**Coherent is not compact.** On a stack, $\\mathcal{D}_c$ and $\\mathcal{D}^\\omega$ differ: the constant $\\mathcal{D}$-module on $BG$ is coherent and not compact. Compactness arguments must therefore be run in $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$, where $\\mathcal{D}_c$ is by construction the subcategory of compacts. See [coherent $\\mathcal{D}$-modules](appendix/defn-coherent-d-mod.html) and [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](appendix/def-renormalized.html).\n\n## Ratified readings\n\nPoints where main.tex is ambiguous and the blueprint has fixed a reading. A ratified reading binds every node; changing one invalidates the proofs downstream of it.\n\n1. **Test schemes in [coherent $\\mathcal{D}$-modules](appendix/defn-coherent-d-mod.html) are of finite type** — forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$, see [$\\mathcal{D}^!$, $\\mathcal{D}^*$](appendix/conv-d-shriek-d-star.html). Ratified at [Q1-L1](nodes/Q1/Q1-L1/index.html).\n2. **Satake generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$** — the $\\langle-\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](appendix/def-generation.html) in [the Satake subcategories](appendix/def-satake-subcategory.html) has no ambient category in the manuscript; $\\mathcal{D}_c$ itself is small and not cocomplete. Forced by the essential-image step of [the small Satake comparison](appendix/thm-f-cstr-sat.html) (main.tex:1391–1392). Ratified at [Q1-L1](nodes/Q1/Q1-L1/index.html), recorded as [ADR 0001](process/decisions/0001-satake-generation-ambient-category.html).\n3. **The orbit strata of [Iwahori and spherical orbits on $LX$](appendix/def-orbits-iwahori-spherical.html) are fpqc-sheaf images** — main.tex:737 posits the orbit posets without defining \"orbit\"; the blueprint reads the orbit through a $k$-point as the fpqc-sheaf image of its orbit map, the strata being exactly these images, with representability by the named locally closed sub-ind-schemes the entry's definitional content. The reading does *not* identify the image with any pro-scheme presentation — that stays a theorem where a node needs it. Ratified at [Q1-L4-L1](nodes/Q1/Q1-L4/Q1-L4-L1/index.html), recorded as [ADR 0028](process/decisions/0028-orbit-strata-are-fpqc-images.html).\n4. **The Hecke action is computed in $\\mathcal{D}^!$ as $q_{*,!-\\mathrm{dR}}\\,p^{!}$.** [The spherical Hecke action $\\ast$](appendix/conv-hecke-action.html) is defined there — following main.tex:922 and main.tex:1096–1102 — by $*$-pullback and $*$-pushforward along the convolution diagram, and the manuscript never says in which of the two sheaf theories of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](appendix/conv-d-shriek-d-star.html) those functors are taken. The blueprint reads the action, for $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)$, as\n\n   $$\n   \\mathcal{F}\\ast\\mathcal{G}\\ \\simeq\\ q_{*,!-\\mathrm{dR}}\\,p^{!}\\left(\\mathcal{F}\\boxtimes\\mathcal{G}\\right)\n   $$\n\n   along that entry's diagram $K\\backslash\\mathrm{Gr}\\times K\\backslash LX\\xleftarrow{p}K\\backslash LG\\times^{K}LX\\xrightarrow{q}K\\backslash LX$, with $q_{*,!-\\mathrm{dR}}$ the pushforward of [Raskin: pushforward along a finitely presented morphism](appendix/bb-raskin-fp-pushforward.html) and $p^!$ the $!$-pullback, both on quotient prestacks by clause (iv) of that entry.\n\n   What forces it: the whole of Q1 computes in $\\mathcal{D}^!$, and $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ is available on $LX$ by [the three standing hypotheses](appendix/assum-intro.html)(b)'s dimension theory ([sheaves on a placid ind-scheme](appendix/ex-sheaf-placid-ind.html)), so a $\\mathcal{D}^!$-side formula for $\\ast$ has to exist; and $q$ restricted to the $F$-bounded pieces is finitely presented, which is what makes the right-hand side defined at all ([$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](appendix/fp-convolution-morphism.html)).\n\n   **This is the repository choosing, not the literature supplying.** The second note of [Raskin](appendix/bb-raskin-fp-pushforward.html) states in terms that the identification of $f_{*,!-\\mathrm{dR}}$ with the $\\mathcal{D}^*$-pushforward $f_{*,\\mathrm{dR}}$ across the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ is **not licensed** by the source — which introduces the subscript precisely to keep the two apart — and that \"a node needing that identification still owes it\". The debt is not discharged by this reading; it is *converted into* it. Ratified at [Q1-L3-L2](nodes/Q1/Q1-L3/Q1-L3-L2/index.html) on 2026-08-08, out of commission **E4** of Flaw 35 of [round 4](nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r4.html) of its critique, which found that the identification is a fact and not a reading and therefore could not be left standing as a hypothesis of one child. It binds [Q1-L3-L2-L1](nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L1/index.html), [Q1-L3-L2-L3](nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L3/index.html) and every other node that computes $\\ast$; changing it invalidates them all.\n\n## What the pipeline may invoke\n\nExactly three things, and nothing else:\n\n1. the entries of the [appendix of objects](appendix/index.html) — definitions, conventions, black boxes, results proved in main.tex;\n2. the node's own `depends-on` list;\n3. standard mathematics that needs no citation.\n\nA proof leaning on anything else is circular, and the critic marks it so even when the claim is true. A manuscript result that has not been given an appendix entry is invisible to the pipeline; the fix is to add the entry, not to argue.\n\nWhere to look, by subject:\n\n- higher-categorical language, $\\mathrm{Pr}^L$, $\\mathrm{DGCat}$ — [appendix §2](appendix/index.html#s2);\n- generation, compactness, relative tensor products — [appendix §3](appendix/index.html#s3);\n- shearing and graded geometry — [appendix §4](appendix/index.html#s4);\n- placidity, sheaves on loop spaces, orbits, coherence — [appendix §5](appendix/index.html#s5);\n- invariants, the Campbell–Dhillon counit — [appendix §6](appendix/index.html#s6);\n- spherical varieties, $\\mathrm{IC}_0$, Satake subcategories, known unramified cases — [appendix §7](appendix/index.html#s7);\n- results proved inside main.tex — [appendix §8](appendix/index.html#s8);\n- external black boxes — [appendix §9](appendix/index.html#s9).\n\n## Proof architecture of the main theorem (for orientation)\n\nStrategy section main.tex:148–201. The chain:\n\n1. the Campbell–Dhillon counit [Campbell–Dhillon: the counit is fully faithful](appendix/thm-cd-counit.html), applicable because $\\mathrm{Gr} = LG/L^+G$ is ind-proper, gives a fully faithful $F$;\n2. full faithfulness of $\\iota$ on small relative tensor products, via the monad calculation [$\\vartheta$ is an equivalence](appendix/prop-monad-map-space.html) and Künneth [Künneth for enriched mapping spaces](appendix/lem-kunneth-property.html);\n3. matching generators yields [the small Satake comparison](appendix/thm-f-cstr-sat.html);\n4. the spectral side follows from [ABG](appendix/bb-abg.html) + [derived Satake](appendix/bb-derived-satake.html) + [the three standing hypotheses](appendix/assum-intro.html)(c) + [BZFN](appendix/bb-bzfn.html).\n\n## Seed question (Q1)\n\nDetermine when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX),\n$$\n\ni.e. when the Satake subcategory exhausts all coherent $\\mathcal{D}$-modules. The known extreme is the group case $X = G$, where equality holds by derived Satake — [known cases of the unramified equivalence](appendix/exam-hyperspherical-duality.html)(1). The tools are the orbit stratification [Iwahori and spherical orbits on $LX$](appendix/def-orbits-iwahori-spherical.html), placidity [orbit closures present $LX$ as a placid ind-scheme](appendix/thm-chen-ti.html), and the compact-generation machinery of [appendix §3](appendix/index.html#s3). The decomposition is [Q1 in the DAG index](dag.html).\n\n## Citation policy\n\n- Cite only bib keys present in `refs.bib` (grep before citing).\n- Reference main.tex only via `\\label`s that exist (grep before referencing); unlabelled objects are cited by line number.\n- Facts not in the [appendix](appendix/index.html) and not in the node's `depends-on` list must be proved, or flagged `GAP`.\n- Math in this file, and in all blueprint and critique markdown, is standard KaTeX/MathJax LaTeX — house macros are `.tex`-only.\n";</script>
