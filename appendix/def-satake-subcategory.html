kslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n- **role:** definition\n- **used by:** [Q1-L1](../nodes/Q1-L1/index.html), [Q1-L2](../nodes/Q1-L2/index.html), [Q1-L2-L3](../nodes/Q1-L2/Q1-L2-L3/index.html), [Q1-L3](../nodes/Q1-L3/index.html), [Q1-L6](../nodes/Q1-L6/index.html), [Q1-e7](../nodes/Q1-e7/index.html), [Q1-L5-e1](../nodes/Q1-L5/Q1-L5-e1/index.html), [Q1-L5-e2](../nodes/Q1-L5/Q1-L5-e2/index.html), [Q1-a1](../nodes/Q1-a1/index.html), [Q1-e1](../nodes/Q1-e1/index.html), [Q1-e4](../nodes/Q1-e4/index.html), [Q1-L3-a1](../nodes/Q1-L3/Q1-L3-a1/index.html), [Q1-L3-a3](../nodes/Q1-L3/Q1-L3-a3/index.html), [Q1-L3-a4](../nodes/Q1-L3/Q1-L3-a4/index.html)\n- **note:** **Ratified reading.** main.tex names no ambient cocomplete category for the $\\langle-\\rangle_{\\mathcal{C}}$ of [`def:generation`](#def-generation), while $\\mathcal{D}_c$ itself is small and not cocomplete, so the definition as printed is incomplete. The blueprint fixes the reading\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\n  the generation being formed inside $\\mathcal{D}^{\\mathrm{ren}}$. This is forced by the essential-image assertion in the proof of [`thm:F_cstr_Sat`](#thm-f-cstr-sat) (main.tex:1391–1392). Ratified in round 2 of [Q1-L1](../nodes/Q1-L1/index.html); every downstream node presupposes it. See [ADR 0001](../process/decisions/0001-satake-generation-ambient-category.html).";</script>
