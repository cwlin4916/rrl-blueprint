<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Raskin: descent for D^! along a torsor under a quasi-compact group scheme</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Raskin: descent for <span class="math" data-display="0" data-tex="\mathcal{D}^!"></span> along a torsor under a quasi-compact group scheme</h1><p class="lead">7. Functoriality and descent for sheaves</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L3/Q1-L3-L2/index.html">Q1-L3-L2</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L1/index.html">Q1-L3-L2-L1</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L4/index.html">Q1-L3-L4</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-L4/index.html">Q1-L4-L4</a>, <a href="../nodes/Q2/Q2-L5/index.html">Q2-L5</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.17 and Prop. 3.17.2](../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). Let $S$ be a quasi-compact quasi-separated base scheme and let $\\mathcal{G}\\rightarrow S$ be a quasi-compact quasi-separated group scheme over $S$; no finite-type hypothesis is placed on $\\mathcal{G}$. For a quasi-compact quasi-separated $S$-scheme $\\mathcal{P}$ carrying an action of $\\mathcal{G}$, the bar complex of the action,\n\n$$\n\\cdots\\ \\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{P},\n$$\n\ninduces a diagram of $!$-pullbacks, and the *$\\mathcal{G}$-equivariant derived category of $\\mathcal{P}$* is defined to be its limit:\n\n$$\n\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}} := \\varprojlim\\left(\\mathcal{D}^!(\\mathcal{P})\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\cdots\\right).\n$$\n\nCall $\\mathcal{P}\\rightarrow S$ a *$\\mathcal{G}$-torsor* if $\\mathcal{G}$ acts on $\\mathcal{P}$ and there is an fppf base change $S'\\rightarrow S$ admitting a $\\mathcal{G}$-equivariant identification $\\mathcal{P}\\times_S S' = \\mathcal{G}\\times_S S'$. Then for every $\\mathcal{G}$-torsor $\\mathcal{P}\\rightarrow S$ the canonical functor, given by $!$-pullback along $\\mathcal{P}\\rightarrow S$,\n\n$$\n\\varphi\\colon\\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}}\n$$\n\nis an equivalence.\n\n- **role:** external black box\n- **hypotheses:** $S$ quasi-compact quasi-separated, $\\mathcal{G}\\rightarrow S$ a quasi-compact quasi-separated $S$-group scheme, and $\\mathcal{P}$ a quasi-compact quasi-separated $S$-**scheme** — representability of $\\mathcal{P}$ is part of the hypothesis, while finite type on $\\mathcal{G}$ is not required. The action must exhibit $\\mathcal{P}\\rightarrow S$ as an fppf-locally trivial torsor as displayed, and the conclusion concerns $\\mathcal{D}^!$ alone: nothing is asserted about $\\mathcal{D}_c$ ([`defn:coherent_D_mod`](defn-coherent-d-mod.html)), about $\\mathcal{D}^{\\mathrm{ren}}$ ([`def:renormalized`](def-renormalized.html)), or about the $\\mathcal{D}^*$-coinvariant analogue, which is the source's §3.24.\n- **note:** **The base is a scheme, never a stack — the gap a user must bridge.** The source's $S$ is a scheme and $\\mathcal{P}\\rightarrow S$ an honest torsor of schemes, so this entry does *not* by itself evaluate $\\mathcal{D}^!$ on a quotient stack $B\\mathcal{G}=\\mathrm{pt}/\\mathcal{G}$.\n\n  The dictionary a node must supply is this. $\\mathcal{D}^!$ is a right Kan extension from $\\mathrm{AffSch}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html)), so $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{T\\rightarrow B\\mathcal{G}}\\mathcal{D}^!(T)$ over the affine tests, and each test pulls the atlas $\\mathrm{pt}\\rightarrow B\\mathcal{G}$ back to an honest $\\mathcal{G}$-torsor $\\mathcal{P}_T\\rightarrow T$ to which the entry applies; assembling those pointwise equivalences into the single statement $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(\\mathcal{G}^{\\times n})$ is the citing node's own work.\n- **note:** *Provenance.* Read on the page in `papers/raskin_dmodules_infinite_var.pdf`: the setting and the definition of $\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}}$ are §3.17, p. 15; the equivalence is Prop. 3.17.2, p. 16, proved there by reduction along an fppf base change to a trivial bundle, where the bar complex splits. The standing base field has characteristic $0$ (§1.13, p. 4), and §3.14, p. 14 is what licenses writing $\\mathcal{D}^!$ for the $\\widetilde{\\mathcal{D}}^!$ of §3.12.\n\n  *Why the $h$-descent statements do not suffice.* In the source $h$-coverings are **finitely presented** (§3.12 with footnote 2, p. 12), so neither Prop. 3.12.1, p. 12 nor its indschematic form Prop. 6.6.1, p. 35 reaches an atlas whose fibres are placid and not of finite type. The entry above is the statement that does, because its $\\mathcal{G}$ is only quasi-compact quasi-separated.\n\n  *Companion checks, same source.* Any affine group scheme over a characteristic-$0$ field is placid (Ex. 4.2.2, p. 19); a placid scheme is automatically quasi-compact and quasi-separated (Rem. 4.2.7, p. 20); and for $S$ of finite type and $\\mathcal{G}\\rightarrow S$ a projective limit of smooth $S$-group schemes under smooth surjective affine maps, every $\\mathcal{G}$-torsor over $S$ is placid (Ex. 4.2.3, p. 19). These are the pages a node cites when discharging the quasi-compactness hypotheses above.\n\n  *The indscheme rendering.* §6.7, p. 36 repeats the definition for a group indscheme over an indscheme base, and Prop. 6.7.1 asserts the same equivalence $\\mathcal{D}^!(S)\\simeq\\mathcal{D}^!(\\mathcal{P}_{\\mathcal{G}})^{\\mathcal{G}}$ there — the statement main.tex:1217 already cites. It moves the base from a scheme to an indscheme and still not to a stack, so it closes no part of the gap named above.\n\n  *Orientation, not licensed.* Remark 2.3.1, p. 5 says that \"for a nice enough stack $\\mathcal{Y}$\" with a hypercovering by affine schemes $Y_n$ one has $\\mathcal{D}^!(\\mathcal{Y})=\\varprojlim_{[n]\\in\\Delta}\\mathcal{D}^!(Y_n)$; it is unnumbered and \"nice enough\" is never made precise, so it is recorded here for orientation only and is not part of what this entry licenses.\n\n  *Index category.* The source calls the displayed bar complex *semisimplicial* and draws only its face maps, leaving the index category of the limit unnamed; a node needing $\\Delta$ rather than $\\Delta_{\\mathrm{inj}}$, or the reverse, supplies that cofinality itself.\n- **note:** *Commissioned by* the round-1 critique of [Q1-L4-L4](../nodes/Q1/Q1-L4/Q1-L4-L4/critiques/r1.html), Flaw 3: an entry asserting $\\mathcal{D}^!(BH)\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m)$ would assume that node's own conclusion, so what was asked for was the primitive descent statement one level below. Beraldo's pro-unipotent results are *not* that primitive and are not black-boxed here: [[beraldo2017loop, Cor. 4.3.1, Thm. 4.3.2](../../papers/beraldo2017loop.pdf)] assume $H$ pro-unipotent, and the surrounding §4.2 assumes a Levi decomposition $H\\simeq H^r\\ltimes H^u$ — hypotheses no node in Q1 currently has.";</script>
