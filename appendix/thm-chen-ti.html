<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>thm:chen_Ti</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>thm:chen_Ti</code> — orbit closures present $LX$ as a placid ind-scheme</h1><p class="lead">5. Sheaf theory on infinite-dimensional spaces</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L3/index.html">Q1-L3</a>, <a href="../nodes/Q1-L3/Q1-L3-a2/index.html">Q1-L3-a2</a>, <a href="../nodes/Q1-L4/index.html">Q1-L4</a>, <a href="../nodes/Q1-L4/Q1-L4-L1/index.html">Q1-L4-L1</a>, <a href="../nodes/Q1-L4/Q1-L4-e1/index.html">Q1-L4-e1</a>, <a href="../nodes/Q1-L4/Q1-L4-e4/index.html">Q1-L4-e4</a>, <a href="../nodes/Q1-L5/index.html">Q1-L5</a>, <a href="../nodes/Q1-L5/Q1-L5-L3/index.html">Q1-L5-L3</a>, <a href="../nodes/Q1-L5/Q1-L5-L4/index.html">Q1-L5-L4</a>, <a href="../nodes/Q1-L5/Q1-L5-L5/index.html">Q1-L5-L5</a>, <a href="../nodes/Q1-L5/Q1-L5-L6/index.html">Q1-L5-L6</a>, <a href="../nodes/Q1-L5/Q1-L5-e4/index.html">Q1-L5-e4</a></dd></dl></div></main><script>const SRC = "**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [`def:orbits_iwahori_spherical`](#def-orbits-iwahori-spherical) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](#def-orbit-closure).\n\n**(a) Placidity of the closures, finite presentation of the embeddings** (the source's Theorem 36).\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([`placid_ind_scheme`](#placid-ind-scheme)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **role:** black box\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and a node must say which it uses.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](#ex-loops-placid) — are valid for general spherical varieties, Theorem 36 remains true for them.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n- **used by:** [Q1-L3](../nodes/Q1-L3/index.html), [Q1-L4](../nodes/Q1-L4/index.html), [Q1-L5](../nodes/Q1-L5/index.html), [Q1-L5-e4](../nodes/Q1-L5/Q1-L5-e4/index.html), [Q1-L3-a2](../nodes/Q1-L3/Q1-L3-a2/index.html), [Q1-L4-e1](../nodes/Q1-L4/Q1-L4-e1/index.html), [Q1-L4-e4](../nodes/Q1-L4/Q1-L4-e4/index.html), [Q1-L4-L1](../nodes/Q1-L4/Q1-L4-L1/index.html), [Q1-L5-L3](../nodes/Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L4](../nodes/Q1-L5/Q1-L5-L4/index.html), [Q1-L5-L5](../nodes/Q1-L5/Q1-L5-L5/index.html), [Q1-L5-L6](../nodes/Q1-L5/Q1-L5-L6/index.html)\n- **note:** this is what makes [`assum:intro`](#assum-intro)(a) automatic in the paper's generality, and it is the source of every stratification argument in Q1. Which clause the citing nodes actually consume: [Q1-L5-L3](../nodes/Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L4](../nodes/Q1-L5/Q1-L5-L4/index.html) and [Q1-L5-L6](../nodes/Q1-L5/Q1-L5-L6/index.html) need the finite presentation of $j_\\lambda$, of $\\overline{i}_\\mu$ and of $\\overline{LX}_\\mu\\hookrightarrow\\overline{LX}_{\\mu'}$ — that is clause (a) — while the indexing of the limit in [Q1-L5](../nodes/Q1-L5/index.html)(H2) is clause (b).\n- **note:** *Provenance, checked at page level on 2026-08-05 against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025).* In v4, Theorem 36 (§5.2, p. 21) is clause (a) above and **not** the presentation; the presentation is Proposition 39(ii) (§5.3, p. 23), whose part (i) is the $I_0$-statement. Proposition 39 states the steps as the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$, indexed by tuples $\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}$ and called *locally equidimensional* placid presentations; the single-index form displayed above is the manuscript's (main.tex:772), and the two agree when $LX$ is connected. The proof of Thm 36 (pp. 21–22) also fixes the mechanism: $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ is the Noetherian-descent factorization of a finitely presented morphism **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$, with $j_\\lambda$ a placid fp-open and $i_\\lambda$ a placid fp-closed embedding.\n\n  *The manuscript's numbers are another version's.* main.tex:772 cites the presentation as \"[Theorem 36]\" and main.tex:1227 cites $K$-placidity of $\\overline{LX}_\\beta$ as \"[Prop. 29.(ii)]\"; neither matches v4, where those are Prop. 39(ii) and Thm 36(i). Recorded as provenance for whoever reads the source alongside the manuscript — not as a correction to main.tex, which no agent edits.";</script>
