<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>omega_Y</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="\omega_{\mathcal{Y}}"></span> — the dualizing object of a prestack</h1><p class="lead">6. Placid spaces and the sheaves on them</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L3/Q1-L3-L2/index.html">Q1-L3-L2</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L4/index.html">Q1-L3-L2-L4</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L4/index.html">Q1-L3-L4</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L3/index.html">Q2-L5-L3</a>, <a href="../nodes/Q2/Q2-L8/Q2-L8-L2/index.html">Q2-L8-L2</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Notation** (blueprint notation; main.tex uses no symbol for this object — the letter $\\omega$ appears in the manuscript only as the compactness superscript $(-)^\\omega$ of [`def:compact_objects`](def-compact-objects.html), main.tex:523. What the notation names is the $!$-pullback of the unit along the structure map in the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html), main.tex:651–668). Let $\\mathcal{Y}\\in\\mathrm{PreStk}$ with structure map $p_{\\mathcal{Y}}\\colon\\mathcal{Y}\\rightarrow\\mathrm{pt}$, and identify $\\mathcal{D}^!(\\mathrm{pt}) = \\mathrm{Vect}$ with unit $k$ ([`DGCat`, `Vect`](conv-dgcat.html)). The **dualizing object** of $\\mathcal{Y}$ is\n\n$$\n\\omega_{\\mathcal{Y}} := p_{\\mathcal{Y}}^!(k)\\ \\in\\ \\mathcal{D}^!(\\mathcal{Y}).\n$$\n\nSince $\\mathcal{D}^!$ is a functor on $\\mathrm{PreStk}^{op}$, every morphism $f\\colon\\mathcal{Y}'\\rightarrow\\mathcal{Y}$ satisfies $p_{\\mathcal{Y}'} = p_{\\mathcal{Y}}\\circ f$ and hence carries a canonical identification\n\n$$\nf^!\\,\\omega_{\\mathcal{Y}}\\ \\simeq\\ \\omega_{\\mathcal{Y}'} .\n$$\n\nFor $S$ a nonempty scheme of finite type this is the usual dualizing complex: $\\omega_S\\in\\mathcal{D}_c(S)$ ([`defn:coherent_D_mod`](defn-coherent-d-mod.html)) and $\\omega_S\\neq 0$.\n\n- **role:** notation\n- **note:** *What the entry does and does not supply.* The definition and the $!$-pullback compatibility are formal consequences of $\\mathcal{D}^!$ being contravariantly functorial on prestacks, and hold for every $\\mathcal{Y}$ with no placidity or finiteness hypothesis. The closing sentence, about finite-type schemes, is standard and is recorded so that a node may lower a statement about $\\omega_{\\mathcal{Y}}$ to a finite-type test scheme and finish there. Nothing here asserts that $\\omega_{\\mathcal{Y}}$ is coherent, or nonzero, for an infinite-dimensional $\\mathcal{Y}$ such as $K\\backslash\\overline{LX}_\\lambda$: that is a claim a node proves, and it is the content of [Q1-L3-L4](../nodes/Q1/Q1-L3/Q1-L3-L4/index.html).\n- **note:** *Not the same as a dimension theory.* [`ex:sheaf_placid_ind`](ex-sheaf-placid-ind.html) and [`assum:intro`](assum-intro.html)(b) supply the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ on $LX$; they are what let a node stop distinguishing $!$- and $*$-versions, and they are not needed to write down $\\omega_{\\mathcal{Y}}$, which lives on the $\\mathcal{D}^!$ side by construction.\n- **note:** **Open tension on ind-schemes, flagged and not resolved.** Two readings in this appendix cannot both be taken literally on an ind-scheme, and the conflict is recorded at [Q1-L3](../nodes/Q1/Q1-L3/history.html) and ranked on [Q1's pipeline](../nodes/Q1/index.html#pipeline). Taking $\\mathcal{D}^!$ as the Kan extension of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html), the structure map $p_{\\mathcal{Y}}$ is a morphism of prestacks like any other, so $\\omega_{\\mathcal{Y}} = p_{\\mathcal{Y}}^!(k)$ exists for $\\mathcal{Y} = \\mathrm{Gr}$ or $\\mathcal{Y} = LX$; and since $f^!\\omega_{\\mathcal{Y}} = \\omega_S$ for every smooth finite-type test $f\\colon S\\rightarrow\\mathcal{Y}$, the letter of [`defn:coherent_D_mod`](defn-coherent-d-mod.html) then makes it *coherent with support everything*. That contradicts the colimit presentations of [`ex:sheaf_placid_ind`](ex-sheaf-placid-ind.html) and of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)(4), under which every object comes from a stage and so has bounded support. The likely resolution is that the colimit categories are not the Kan-extended $\\mathcal{D}^!(\\mathcal{Y})$ but a subcategory of it, and $\\omega_{\\mathcal{Y}}$ lies outside for ind-infinite $\\mathcal{Y}$. **Until it is settled, use this entry only for $\\mathcal{Y}$ an ind-scheme that is one stage — a placid scheme, or a $K$-quotient of one, such as $K\\backslash\\overline{LX}_\\lambda$** — which is the only use [Q1-L3-L4](../nodes/Q1/Q1-L3/Q1-L3-L4/index.html) makes of it, and never for $\\mathcal{Y} = \\mathrm{Gr}$ or $\\mathcal{Y} = LX$.";</script>
