<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>the spherical Hecke action ast on D_c(Kbackslash LX)</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>the spherical Hecke action <span class="math" data-display="0" data-tex="\ast"></span> on <span class="math" data-display="0" data-tex="\mathcal{D}_c(K\backslash LX)"></span></h1><p class="lead">7. Spherical varieties, Satake subcategories, the unramified conjecture</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L1/index.html">Q1-L1</a>, <a href="../nodes/Q1-L2/Q1-L2-L3/index.html">Q1-L2-L3</a>, <a href="../nodes/Q1-L3/Q1-L3-a1/index.html">Q1-L3-a1</a>, <a href="../nodes/Q1-L3/Q1-L3-a3/index.html">Q1-L3-a3</a>, <a href="../nodes/Q1-L5/Q1-L5-L1/index.html">Q1-L5-L1</a>, <a href="../nodes/Q1-L5/Q1-L5-L2/index.html">Q1-L5-L2</a>, <a href="../nodes/Q1-L5/Q1-L5-e1/index.html">Q1-L5-e1</a>, <a href="../nodes/Q1-L5/Q1-L5-e2/index.html">Q1-L5-e2</a>, <a href="../nodes/Q1-L5/Q1-L5-e3/index.html">Q1-L5-e3</a>, <a href="../nodes/Q1-e1/index.html">Q1-e1</a>, <a href="../nodes/Q1-e2/index.html">Q1-e2</a>, <a href="../nodes/Q1-e4/index.html">Q1-e4</a></dd></dl></div></main><script>const SRC = "**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [`subsec:notations`](#subsec-notations) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](#conv-module-categories)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](#ic-0) and [`def:satake_subcategory`](#def-satake-subcategory). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([`def:small_relative_tensor`](#def-small-relative-tensor)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n- **role:** convention\n- **used by:** [Q1-L1](../nodes/Q1-L1/index.html), [Q1-L2-L3](../nodes/Q1-L2/Q1-L2-L3/index.html), [Q1-L5-e1](../nodes/Q1-L5/Q1-L5-e1/index.html), [Q1-L5-e2](../nodes/Q1-L5/Q1-L5-e2/index.html), [Q1-L5-e3](../nodes/Q1-L5/Q1-L5-e3/index.html), [Q1-e1](../nodes/Q1-e1/index.html), [Q1-e2](../nodes/Q1-e2/index.html), [Q1-e4](../nodes/Q1-e4/index.html), [Q1-L3-a1](../nodes/Q1-L3/Q1-L3-a1/index.html), [Q1-L3-a3](../nodes/Q1-L3/Q1-L3-a3/index.html), [Q1-L5-L1](../nodes/Q1-L5/Q1-L5-L1/index.html), [Q1-L5-L2](../nodes/Q1-L5/Q1-L5-L2/index.html)\n- **note:** main.tex writes the convolution diagram only for the Hecke category itself (main.tex:1096–1102) and describes the action on $LX$ in words — \"which are given by the convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\", main.tex:922. This entry records the reading that the two are the same pull–push construction, which is how every node in the DAG uses $\\ast$.";</script>
