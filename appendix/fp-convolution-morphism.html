<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>L^+Xhookrightarrow LX and the bounded convolution morphism m_F are finitely presented</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="L^+X\hookrightarrow LX"></span> and the bounded convolution morphism <span class="math" data-display="0" data-tex="m_F"></span> are finitely presented</h1><p class="lead">7. Functoriality and descent for sheaves</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L3/index.html">Q1-L3</a>, <a href="../nodes/Q2/Q2-L5/index.html">Q2-L5</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L1/index.html">Q2-L5-L1</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L2/index.html">Q2-L5-L2</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Proposition** (derived inside this appendix from [loops, jets and positive loops are placid](ex-loops-placid.html) (main.tex:694–718), [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](bb-zhu-pi0-cartan.html)(2) and the prestack definition of [Raskin: pushforward along a finitely presented morphism of ind-schemes](bb-raskin-fp-pushforward.html)(iv); no main.tex label, and no page of `papers/` states it — the argument is written out in the second note below). Let $k$, $G$, $T\\subseteq B\\subseteq G$ and $K = L^+G$ be as in [`subsec:notations`](subsec-notations.html), let $X$ be a smooth affine $G$-variety of finite type over $k$, and write $\\Lambda^+ := X_*(T)^+$. For a finite subset $F\\subseteq\\Lambda^+$ put\n\n$$\n\\mathrm{Gr}_F := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu\\ \\subseteq\\ \\mathrm{Gr},\n$$\n\nwith $\\overline{\\mathrm{Gr}}_\\mu$ the Schubert closures of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)(2), let $\\overline{LG}_F\\subseteq LG$ be the preimage of $\\mathrm{Gr}_F$ under $LG\\rightarrow\\mathrm{Gr}$, let $\\overline{LG}_F\\times^{K}(-)$ denote the fppf quotient of $\\overline{LG}_F\\times(-)$ by $(g,x)\\cdot\\kappa = (g\\kappa,\\kappa^{-1}x)$, and let\n\n$$\nm_F\\colon\\ \\overline{LG}_F\\times^{K}L^+X\\longrightarrow LX,\\qquad [g,x]\\longmapsto g\\cdot x .\n$$\n\nThen, all three in the prestack sense of [Raskin](bb-raskin-fp-pushforward.html)(iv) — schematic in the classical sense, with finitely presented base change along every affine scheme over the target:\n\n**(1) The jet embedding.** The canonical monomorphism $L^+X\\hookrightarrow LX$ is finitely presented, and its base change along any morphism of prestacks $\\mathcal{Z}\\rightarrow LX$ is a finitely presented closed embedding.\n\n**(2) The bounded convolution morphism.** For every finite $F\\subseteq\\Lambda^+$ the morphism $m_F$ is finitely presented.\n\n**(3) The quotient morphism.** For every finite $F\\subseteq\\Lambda^+$ the induced morphism of quotient prestacks\n\n$$\nK\\backslash\\left(\\overline{LG}_F\\times^{K}L^+X\\right)\\longrightarrow K\\backslash LX\n$$\n\nis finitely presented, so [Raskin](bb-raskin-fp-pushforward.html)(iv) applies to it directly.\n\n- **role:** derived inside the appendix — usable as a black box subject to the hypotheses below, with the argument written out in the second note rather than cited, so that a referee checks it there instead of taking it on trust.\n- **hypotheses:** $X$ **smooth affine of finite type** over $k$ — the hypothesis of [loops, jets and positive loops are placid](ex-loops-placid.html), which supplies the presentation $LX = \\varinjlim_i LX^i$ the argument runs on; the standing $X$ of [context](../context.html) is smooth affine spherical, hence covered. $G$ **connected reductive** over the standing algebraically closed $k$, which is what [Zhu](bb-zhu-pi0-cartan.html)(2) needs in order to make each $\\overline{\\mathrm{Gr}}_\\mu$ projective; $F\\subseteq\\Lambda^+$ **finite**, which is what makes $\\mathrm{Gr}_F$ a scheme rather than an ind-scheme; clauses (2) and (3) are not asserted for infinite $F$, and they fail for $F = \\Lambda^+$, where $\\mathrm{Gr}_F = \\mathrm{Gr}$ is an ind-scheme not of finite type and step (c) of the argument below has nothing to say. Nothing here asserts **properness** of $m_F$, so clause (iii) of [Raskin](bb-raskin-fp-pushforward.html) — the adjunction $m_{F,*,!-\\mathrm{dR}}\\dashv m_F^!$ — is *not* reached: $\\mathrm{Gr}_F$ is proper but $L^+X\\hookrightarrow LX$ is not, and the composite in the argument below is a closed embedding followed by a proper projection only after the untwisting, which does not make it proper. Nothing is asserted about $\\mathcal{D}_c$ ([`defn:coherent_D_mod`](defn-coherent-d-mod.html)) or $\\mathcal{D}^{\\mathrm{ren}}$ ([`def:renormalized`](def-renormalized.html)).\n- **note:** *Which appendix entry each ingredient comes from.* Clause (1) is the only one with content beyond bookkeeping, and the two entries the appendix already carries that look as if they cover it do **not**. [loops, jets and positive loops are placid](ex-loops-placid.html) gives the presentation $LX = \\varinjlim_i LX^i$ with $LX^i = LX\\cap t^{-i}L^+\\mathbb{A}^N$ and asserts placidity; it says nothing about finite presentation, of the transitions or of the $i = 0$ stage. [`thm:chen_Ti`](thm-chen-ti.html)(a) gives finite presentation of the closed embeddings $\\overline{LX}_\\lambda\\rightarrow LX$ of **orbit closures**, which is a different family: $L^+X$ is not one of them unless a node proves it is, and no node should assume so.\n- **note:** *Why this holds. Written out here because no page of `papers/` located by this transcription states clauses (1)–(3); a citing node cites the entry and does not repeat the argument.* Throughout, a morphism of prestacks is *finitely presented* in the sense of [Raskin](bb-raskin-fp-pushforward.html)(iv), and two formal facts about that notion are used and are immediate from its definition together with the corresponding facts for schemes: it is stable under base change and under composition, and — since the defining condition is tested on affine schemes over the target — it is fppf-local on the target.\n\n  **(a) Clause (1).** Fix a closed embedding $X\\subseteq\\mathbb{A}^N$, available because $X$ is affine of finite type. Then $L^+X = LX\\times_{L\\mathbb{A}^N}L^+\\mathbb{A}^N$, so $L^+X = LX^0$ in the notation of [loops, jets and positive loops are placid](ex-loops-placid.html), and inside the stage $LX^i$ the subscheme $LX^0$ is cut out by the $Ni$ coefficient functions $a_{j,m}$, $1\\le j\\le N$ and $-i\\le m\\le-1$, of the coordinates $x_j = \\sum_{m\\ge-i}a_{j,m}t^m$. A closed subscheme defined by a finitely generated ideal is a finitely presented closed embedding, so $LX^0\\hookrightarrow LX^i$ is one for every $i$. Any morphism to $LX$ from a quasi-compact scheme — in particular from an affine one — factors through some stage of the presentation, whose transitions are closed embeddings. Hence for affine $S\\rightarrow LX$ one has $L^+X\\times_{LX}S = LX^0\\times_{LX^i}S$ for some $i$, a base change of a finitely presented closed embedding: an affine scheme, finitely presented and closed over $S$. That is clause (1), classical schematicity included, and the parenthetical about a general $\\mathcal{Z}\\rightarrow LX$ is the same computation after base change.\n\n  **(b) The untwisting isomorphism.** The $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\mathrm{Gr}_F\\times LX$, $(g,y)\\mapsto(gK,gy)$, descends to $\\theta\\colon\\overline{LG}_F\\times^{K}LX\\rightarrow\\mathrm{Gr}_F\\times LX$; the $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\overline{LG}_F\\times^{K}LX$, $(g,y)\\mapsto[g,g^{-1}y]$, descends along the $K$-torsor $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$ to a morphism inverse to $\\theta$. No trivialization is chosen and no local statement is used: both formulas are globally defined on the covers, and both invariances are one line. Under $\\theta$ the morphism $m_F$ becomes $\\mathrm{pr}_2\\circ\\theta\\circ\\iota$, where $\\iota\\colon\\overline{LG}_F\\times^{K}L^+X\\hookrightarrow\\overline{LG}_F\\times^{K}LX$ is the inclusion induced by $L^+X\\subseteq LX$.\n\n  **(c) The projection.** By [Zhu](bb-zhu-pi0-cartan.html)(2) each $\\overline{\\mathrm{Gr}}_\\mu$ is a projective $k$-variety, so the finite union $\\mathrm{Gr}_F$ is a projective $k$-scheme, in particular of finite presentation over $k$. Base change of $\\mathrm{Gr}_F\\rightarrow\\operatorname{Spec}k$ along an affine $S\\rightarrow LX$ gives $\\mathrm{Gr}_F\\times S\\rightarrow S$, so $\\mathrm{pr}_2\\colon\\mathrm{Gr}_F\\times LX\\rightarrow LX$ is schematic and finitely presented.\n\n  **(d) The incidence inclusion.** The square with top arrow $\\mathrm{id}\\times(L^+X\\hookrightarrow LX)$, bottom arrow $\\iota$, and the two quotient maps as verticals is Cartesian, and the verticals are $K$-torsors — the pullbacks of $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$, which is the restriction of $LG\\rightarrow\\mathrm{Gr}$ and is even Zariski-locally trivial for a constant reductive $G$ ([[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../papers/zhu2016introduction.pdf)]). For affine $S\\rightarrow\\overline{LG}_F\\times^{K}LX$ the pulled-back torsor $P\\rightarrow S$ is an fppf cover with $P$ affine, since $K$ is an affine group scheme and affineness is fppf-local; over $P$ the pullback of $\\iota$ is a base change of the top arrow, hence of clause (1), hence finitely presented. Finite presentation being fppf-local on the target, $\\iota$ is finitely presented.\n\n  **(e) Clauses (2) and (3).** Clause (2) is (b) + (c) + (d) and the stability of finite presentation under composition. For clause (3), let $S\\rightarrow K\\backslash LX$ be affine and let $P := LX\\times_{K\\backslash LX}S$, again an affine $K$-torsor over $S$. Because $\\overline{LG}_F\\times^{K}L^+X\\rightarrow LX$ is $K$-equivariant and $LX\\rightarrow K\\backslash LX$ is a $K$-torsor, the base change of the clause-(3) morphism along $P\\rightarrow K\\backslash LX$ is $(\\overline{LG}_F\\times^{K}L^+X)\\times_{LX}P\\rightarrow P$, finitely presented by clause (2); descend along $P\\rightarrow S$.\n- **note:** *Provenance.* The one page-level citation in the argument is [[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../papers/zhu2016introduction.pdf)], read in `papers/zhu2016introduction.pdf` on 2026-08-08: Proposition 1.3.6 identifies $\\mathrm{Gr}_{\\underline{G}}$ with the fpqc quotient $[L\\underline{G}/L^+\\underline{G}]$ and Remark 1.3.8 records that the $L^+\\underline{G}$-torsor $L\\underline{G}\\rightarrow\\mathrm{Gr}_{\\underline{G}}$ \"is locally trivial for the étale topology. If $\\underline{G} = G\\otimes\\mathcal{O}$ is constant reductive … it is even locally trivial for the Zariski topology\". Everything else is the appendix entries named in the attribution line, plus standard scheme theory. The statement was **commissioned by** [round 4 of Q1-L3-L2's critique](../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r4.html), commission **E1**, which asked for exactly clause (2); clauses (1) and (3) are what the argument for (2) needs and what the citing nodes use separately.";</script>
