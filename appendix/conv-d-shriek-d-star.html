<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>D^!, D^*</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="\mathcal{D}^!"></span>, <span class="math" data-display="0" data-tex="\mathcal{D}^*"></span> — Kan extension to prestacks</h1><p class="lead">5. Sheaf theory on infinite-dimensional spaces</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L1/index.html">Q1-L1</a>, <a href="../nodes/Q1-L2/Q1-L2-L1/index.html">Q1-L2-L1</a>, <a href="../nodes/Q1-L4/Q1-L4-L3/index.html">Q1-L4-L3</a>, <a href="../nodes/Q1-L4/Q1-L4-L4/index.html">Q1-L4-L4</a>, <a href="../nodes/Q1-L5/Q1-L5-L3/index.html">Q1-L5-L3</a>, <a href="../nodes/Q1-L5/Q1-L5-L4/index.html">Q1-L5-L4</a></dd></dl></div></main><script>const SRC = "**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **role:** convention\n- **used by:** [Q1-L1](../nodes/Q1-L1/index.html), [Q1-L2-L1](../nodes/Q1-L2/Q1-L2-L1/index.html), [Q1-L4-L3](../nodes/Q1-L4/Q1-L4-L3/index.html), [Q1-L4-L4](../nodes/Q1-L4/Q1-L4-L4/index.html), [Q1-L5-L3](../nodes/Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L4](../nodes/Q1-L5/Q1-L5-L4/index.html)\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [`defn:coherent_D_mod`](#defn-coherent-d-mod), ratified at [Q1-L1](../nodes/Q1-L1/index.html).";</script>
