<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>supp</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="\operatorname{supp}"></span> — the support of a sheaf</h1><p class="lead">6. Placid spaces and the sheaves on them</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q2/Q2-L5/Q2-L5-L3/index.html">Q2-L5-L3</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Notation** (blueprint notation, coined in the Setup of [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) and repeated at [Q1-L3-L3-L1](../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html), and recorded here so that no node coins it again. main.tex writes no support operator; what the definition below uses is the contravariant functoriality of $\\mathcal{D}^!$ on prestacks at main.tex:651–668 ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html)) and the renormalized category at main.tex:794 ([`def:renormalized`](def-renormalized.html))).\n\nLet $K$ be a placid group scheme acting on a placid scheme or a placid ind-scheme $\\mathcal{Y}$ ([`placid_ind_scheme`](placid-ind-scheme.html)). For a $K$-stable open sub-ind-scheme $U\\subseteq\\mathcal{Y}$ write $j_U\\colon K\\backslash U\\hookrightarrow K\\backslash\\mathcal{Y}$ for the induced morphism of prestacks. The **support** of $\\mathcal{G}\\in\\mathcal{D}^!(K\\backslash\\mathcal{Y})$ is\n\n$$\n\\left|\\operatorname{supp}\\mathcal{G}\\right|\\ :=\\ |\\mathcal{Y}|\\ \\smallsetminus \\bigcup\\left\\{\\,|U|\\ \\middle|\\ U\\subseteq\\mathcal{Y}\\ K\\text{-stable open},\\ j_U^{!}\\mathcal{G} = 0\\,\\right\\}\\ \\subseteq\\ |\\mathcal{Y}| .\n$$\n\nBeing the complement of a union of $K$-stable opens, it is a closed $K$-stable subset of $\\left|\\mathcal{Y}\\right|$.\n\n**The $\\left|\\cdot\\right|$ convention: a subset, never a subscheme.** The support is a subset of the underlying topological space and carries no scheme structure. When a sub-ind-scheme $Z\\subseteq\\mathcal{Y}$ — an orbit closure of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](def-orbit-closure.html), a Schubert closure of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html), a clopen piece — stands on the other side of a containment or an equality, the bars may be dropped on both sides:\n\n$$\n\\operatorname{supp}\\mathcal{G}\\subseteq Z \\quad\\text{abbreviates}\\quad \\left|\\operatorname{supp}\\mathcal{G}\\right|\\subseteq\\left|Z\\right|,\n\\qquad\n\\operatorname{supp}\\mathcal{G} = Z \\quad\\text{abbreviates}\\quad \\left|\\operatorname{supp}\\mathcal{G}\\right| = \\left|Z\\right| .\n$$\n\nA bar-free equality therefore asserts equality of subsets of $\\left|\\mathcal{Y}\\right|$ and never an equality of schemes, and it fixes no scheme structure on the left-hand side; that a support subset is the space of a reduced closed sub-ind-scheme is a hypothesis a node states, as clause (iv) of [Q1-L3](../nodes/Q1/Q1-L3/index.html) states it.\n\n**(R) Which restriction functor.** For $\\mathcal{G}\\in\\mathcal{D}^!(K\\backslash\\mathcal{Y})$ the functor $j_U^{!}$ above is the Kan-extended one of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html), which exists for every morphism of prestacks and needs no hypothesis. For $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y}) = \\mathrm{Ind}\\left(\\mathcal{D}_c(K\\backslash\\mathcal{Y})\\right)$ ([`def:renormalized`](def-renormalized.html)) it is instead the ind-extension of the restriction of $j_U^{!}$ to coherent objects ([`defn:coherent_D_mod`](defn-coherent-d-mod.html)), which presupposes that $j_U^{!}$ preserves coherence. This entry does not supply that; it is clause (1) of [Q1-L3-L3-L1](../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html), proved there for the opens that node builds and for no others.\n\n**(F) What follows from the definition, and what does not.** If $\\mathcal{G}$ restricts to zero along the $K$-stable open complement $U_Z$ of a closed $K$-stable $Z\\subseteq\\left|\\mathcal{Y}\\right|$, then $\\operatorname{supp}\\mathcal{G}\\subseteq Z$, since $U_Z$ is one of the opens in the union. The converse is **not** part of the definition: $\\left|\\operatorname{supp}\\mathcal{G}\\right|\\subseteq Z$ says only that $U_Z$ is *covered* by opens on which $\\mathcal{G}$ restricts to zero, so it gives $\\ker(j_{Z}^{!})\\subseteq\\{\\mathcal{G} : \\operatorname{supp}\\mathcal{G}\\subseteq Z\\}$ and not the reverse inclusion.\n\n**(P) Where the definition is anchored.** On a scheme of finite type, and on a placid scheme or a $K$-quotient of one ([`ex:sheaf_on_placid_scheme`](ex-sheaf-on-placid-scheme.html)) — a single stage of a presentation, such as $K\\backslash\\overline{LX}_\\lambda$ — the display above is the usual support and the entry may be used as it stands. On a placid ind-scheme $\\mathcal{Y} = \\varinjlim_i\\mathcal{Y}_i$ ([`ex:sheaf_placid_ind`](ex-sheaf-placid-ind.html)) it is available for an object that comes from one stage; for an object of the Kan-extended $\\mathcal{D}^!(\\mathcal{Y})$ that does not, the display still writes down a closed subset and nothing in this appendix says that subset behaves — see the first note.\n\n- **role:** notation\n- **note:** **The boundary on ind-schemes of infinite type, deferred and not resolved.** The third note of [$\\omega_{\\mathcal{Y}}$](not-dualizing-object.html) records an open tension: under the Kan-extended reading of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html) the dualizing object of an ind-infinite $\\mathcal{Y}$ is *coherent with support everything*, which contradicts the colimit presentations of [`ex:sheaf_placid_ind`](ex-sheaf-placid-ind.html) and [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)(4), under which every object comes from a stage and so has bounded support. **This entry neither resolves that tension nor takes a side in it**, and it must not be read as licensing either horn. A node that needs the support of an arbitrary object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y})$ for $\\mathcal{Y} = LX$ or $\\mathcal{Y} = \\mathrm{Gr}$ — rather than of an object it has already placed on a stage — is leaning on something this entry does not supply, and owes the argument itself or a `GAP`. That is the standing status of clause (2) of [Q1-L3-L2-L4](../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L4/index.html), which evaluates $\\left|\\operatorname{supp}\\ \\omega_{K\\backslash\\mathrm{Gr}}\\right| = \\left|\\mathrm{Gr}\\right|$ under an explicitly hypothetical reading, and of clause (4) of [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html), which is stated so as to record the two answers rather than choose one.\n- **note:** *What the notation does not assert.* Nothing here says how support behaves under any operation. That $\\operatorname{supp}\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\subseteq\\overline{LX}_\\lambda$ — for [the spherical Hecke action $\\ast$](conv-hecke-action.html) on [$\\mathrm{IC}_0$](ic-0.html) — is a claim a node proves and never a consequence of this entry: it is hypothesis (a) of [Q1-L6](../nodes/Q1/Q1-L6/index.html), clause (1) of [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) and the conclusion of [Q2-L5](../nodes/Q2/Q2-L5/index.html). The same holds for support along a fibre sequence — that the cofibre in clause (1) of [Q2-e2-L3](../nodes/Q2/Q2-e2/Q2-e2-L3/index.html) is boundary-supported is proved there — for support under $\\ast$ in clause (B) of [Q2-e3-L3](../nodes/Q2/Q2-e3/Q2-e3-L3/index.html), for the $\\supseteq$ half of the equality in [Q1-L3-L4](../nodes/Q1/Q1-L3/Q1-L3-L4/index.html), and for finite-dimensionality or coherence of anything. Support is also **not** asserted to detect vanishing: $\\operatorname{supp}\\mathcal{G} = \\emptyset$ does not give $\\mathcal{G} = 0$ without the locality hypothesis of the next note.\n- **note:** **Locality is a hypothesis, and this entry is where it is refused.** The reverse inclusion of **(F)** — that $\\operatorname{supp}\\mathcal{G}\\subseteq Z$ forces $j_Z^{!}\\mathcal{G} = 0$ — asks vanishing of a $!$-restriction to be local on $\\mathcal{Y}$ and to survive the passage to the $K$-quotient. It is hypothesis **(A)** of [Q1-L3-L3-L1](../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html), assumed there and cited from nowhere, and it is what stands between the support convention and hypothesis **(B)** of [Q1-L3](../nodes/Q1/Q1-L3/index.html) that the support-bounded subcategories $\\mathcal{S}_F$ are closed under colimits. A proof that slides from \"support inside $Z$\" to \"restricts to zero off $Z$\" has used that hypothesis and must say so.\n- **note:** **The uses in the node statements are not all the same notion, and this entry fixes one reading.** Three variants are in circulation. *(i) With bars, as a subset of $\\left|\\mathcal{Y}\\right|$ for $\\mathcal{Y}\\in\\{\\mathrm{Gr}, LX\\}$* — [Q1-L3](../nodes/Q1/Q1-L3/index.html), [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html), [Q1-L3-L2-L1](../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L1/index.html), [Q1-L3-L2-L3](../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L3/index.html), [Q1-L3-L2-L4](../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L4/index.html), [Q1-L3-L3-L1](../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html), [Q1-L3-L4](../nodes/Q1/Q1-L3/Q1-L3-L4/index.html), [Q1-L3-L6](../nodes/Q1/Q1-L3/Q1-L3-L6/index.html). *(ii) Bar-free, contained in a sub-ind-scheme* — [Q1-L6](../nodes/Q1/Q1-L6/index.html), [Q2-L5](../nodes/Q2/Q2-L5/index.html), [Q2-e1-L3](../nodes/Q2/Q2-e1/Q2-e1-L3/index.html), [Q2-e1-L5](../nodes/Q2/Q2-e1/Q2-e1-L5/index.html), [Q2-e2-L3](../nodes/Q2/Q2-e2/Q2-e2-L3/index.html), [Q2-e3-L3](../nodes/Q2/Q2-e3/Q2-e3-L3/index.html). *(iii) Bar-free, set equal to a sub-scheme* — $\\operatorname{supp}(P_m) = t^m\\mathcal{O}$ in clause (i) of [Q2-e2](../nodes/Q2/Q2-e2/index.html) and clause (3) of [Q2-e2-L2](../nodes/Q2/Q2-e2/Q2-e2-L2/index.html). The $\\left|\\cdot\\right|$ convention above reconciles (ii) and (iii) with (i) as abbreviations, so all sixteen uses are readable as the one notion — at the price that (iii) asserts only an equality of subsets, which is less than its wording suggests.\n- **note:** *One divergence the convention does not absorb: $K$-stability of the test opens.* The Setup of [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) quantifies over *all* open sub-ind-schemes $U\\subseteq\\mathcal{Y}$, while [Q1-L3-L3-L1](../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html) forms only $K$-stable ones. This entry fixes the $K$-stable reading, for the reason that a non-stable $U$ gives no morphism $K\\backslash U\\rightarrow K\\backslash\\mathcal{Y}$ along which to restrict an object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y})$, so the unrestricted quantifier does not typecheck. The two readings agree as soon as vanishing on $U$ implies vanishing on the $K$-sweep of $U$; that implication is not in the appendix, and until it is, the $K$-stable support is the larger of the two, so every claim of the form $\\operatorname{supp}\\mathcal{G}\\subseteq Z$ is read here at its stronger value.";</script>
