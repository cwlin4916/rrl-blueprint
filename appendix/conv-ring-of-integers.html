nvention\n- **used by:** [Q1-L4-L1](../nodes/Q1-L4/Q1-L4-L1/index.html)\n- **note:** main.tex itself works with the loop functors throughout and never names $F$, $\\mathcal{O}$ or a uniformizer; the variable $t$ enters only through the jet rings $R[t]/t^n$ and the pieces $LX\\cap t^{-i}L^+\\mathbb{A}^n$ of main.tex:694–718, transcribed in [loops, jets and positive loops are placid](#ex-loops-placid). Do not confuse the ring $\\mathcal{O}$ with the subscripted orbit notation of [`def:orbits_iwahori_spherical`](#def-orbits-iwahori-spherical): $\\mathcal{O}_v$ and $\\overline{\\mathcal{O}}_v$ (main.tex:750–772) are $I$-orbits and their closures in $LX$, never the ring.";</script>
