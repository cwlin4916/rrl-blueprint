due field $k$. This is the field underlying the loop-space notation: for $X$ affine of finite type, the functors named at main.tex:218 are\n\n$$\nL^+X(R) = X\\left(R[[t]]\\right), \\qquad LX(R) = X\\left(R((t))\\right),\n$$\n\nso on $k$-points $L^+X(k) = X(\\mathcal{O})$ and $LX(k) = X(F)$.\n\nBlueprint markdown writes the ring as $\\mathcal{O}$; spelling out $k[[t]]$ (or $k((t))$ for $F$) is allowed where the explicit model is the point. A corroboration file (a node's examples file, or an example or analogy node) quoting a function-theoretic source over a general nonarchimedean local field may keep the source's $\\mathfrak{o}$, $\\varpi$ for its ring of integers and uniformizer only when the same file declares that notation locally before first use.\n\n- **role:** convention\n- **note:** main.tex itself works with the loop functors throughout and never names $F$, $\\mathcal{O}$ or a uniformizer; the variable $t$ enters only through the jet rings $R[t]/t^n$ and the pieces $LX\\cap t^{-i}L^+\\mathbb{A}^n$ of main.tex:694–718, transcribed in [loops, jets and positive loops are placid](ex-loops-placid.html). Do not confuse the ring $\\mathcal{O}$ with the subscripted orbit notation of [`def:orbits_iwahori_spherical`](def-orbits-iwahori-spherical.html): $\\mathcal{O}_v$ and $\\overline{\\mathcal{O}}_v$ (main.tex:750–772) are $I$-orbits and their closures in $LX$, never the ring.";</script>
