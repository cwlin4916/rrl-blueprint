<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>^perp_DM is a cocomplete stable subcategory, and contains langle Trangle_D whenever it contains T</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="{}^{\perp_{\mathcal{D}}}M"></span> is a cocomplete stable subcategory, and contains <span class="math" data-display="0" data-tex="\langle T\rangle_{\mathcal{D}}"></span> whenever it contains <span class="math" data-display="0" data-tex="T"></span></h1><p class="lead">3. Generation, compactness and orthogonality</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L5/Q1-L5-z1/index.html">Q1-L5-z1</a>, <a href="../nodes/Q2/Q2-L1/index.html">Q2-L1</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Lemma** (formal; no main.tex label, and no numbered source — see the role line). Let $\\mathcal{D}$ be a stable category admitting all small colimits and let $M\\in\\mathcal{D}$. Write $[1]$ for the suspension of $\\mathcal{D}$, so that $[-i]$ is the $i$-fold loop functor $\\Omega^i$ for $i\\ge 0$, let $\\operatorname{Map}_{\\mathcal{D}}(-,-)$ be the mapping anima of [`Map`](conv-anima.html), and set\n\n$$\n{}^{\\perp_{\\mathcal{D}}}M \\ := \\ \\left\\{ X\\in\\mathcal{D} \\ \\middle|\\ \\operatorname{Map}_{\\mathcal{D}}(X[n], M) = 0 \\ \\text{ for all } n\\in\\mathbb{Z} \\right\\} .\n$$\n\n**(1) The two shift ranges agree.** For $X\\in\\mathcal{D}$, one has $X\\in{}^{\\perp_{\\mathcal{D}}}M$ if and only if $\\operatorname{Map}_{\\mathcal{D}}(X[-i],M) = 0$ for all $i\\ge 0$. Hence for a collection $T$ of objects of $\\mathcal{D}$ the inclusion $T\\subseteq{}^{\\perp_{\\mathcal{D}}}M$ is *verbatim* the hypothesis of the criterion of [`def:generation`](def-generation.html), taken for the collection $T$ and the test object $M$.\n\n**(2) The left orthogonal is a cocomplete stable subcategory.** ${}^{\\perp_{\\mathcal{D}}}M$ is a full subcategory of $\\mathcal{D}$, closed under equivalence, containing $0$, closed under $X\\mapsto X[m]$ for every $m\\in\\mathbb{Z}$, and closed under all small colimits formed in $\\mathcal{D}$ — in particular under cofibers, and with the shifts under fibers. It is therefore a cocomplete stable subcategory of $\\mathcal{D}$ in the sense of [`def:generation`](def-generation.html).\n\n**(3) Orthogonality passes from a set to the subcategory it generates.** Let $T$ be a set of objects of $\\mathcal{D}$ with $T\\subseteq{}^{\\perp_{\\mathcal{D}}}M$. Then\n\n$$\n\\langle T\\rangle_{\\mathcal{D}} \\ \\subseteq \\ {}^{\\perp_{\\mathcal{D}}}M .\n$$\n\n- **role:** black box — usable as it stands, subject to the hypotheses below. It is formal: the three clauses are elementary consequences of the definitions already in this appendix, and no numbered result of any source stands behind them, so a node citing it is not citing the literature.\n- **hypotheses:** $\\mathcal{D}$ stable and admitting all small colimits; $M$ an object of $\\mathcal{D}$; in (3), $T$ a **set** of objects of $\\mathcal{D}$, so that $\\langle T\\rangle_{\\mathcal{D}}$ is formed on a small collection. **No presentability, at any clause.** The entry consumes [`def:generation`](def-generation.html) through its minimality description alone — the half of that entry that carries no hypothesis — and never through its criterion; that is what distinguishes it from the criterion and is the reason it is stated separately.\n- **note:** **Left, not right.** The superscript sits on the left, so ${}^{\\perp_{\\mathcal{D}}}M$ is the *left* orthogonal of $M$: it collects the $X$ that admit no non-trivial map into $M$ in any degree, not the objects $M$ maps into. A write-up that reads membership in it as \"$X$ is right-orthogonal\" has the word pointing the opposite way to the notation; the entry fixes the notation and leaves the name unused.\n- **note:** **The range in the definition is $n\\in\\mathbb{Z}$, and clause (1) is what licenses moving between the ranges.** [`def:generation`](def-generation.html) tests non-positive shifts only, its display quantifying over $i\\ge 0$ with $[-i]=\\Omega^i$; the orthogonal above quantifies over all of $\\mathbb{Z}$, which is the range clause (2) needs in order to be closed under shifts and hence stable. Clause (1) is the reconciliation, and a node that states one range and uses the other should cite it rather than pass between them silently.\n- **note:** *Provenance.* Factored out of the round-1 write-up of [Q1-L5-z1](../nodes/Q1/Q1-L5/Q1-L5-z1/index.html), where the three clauses appear as Steps 1–3 and were checked at [round 1](../nodes/Q1/Q1-L5/Q1-L5-z1/critiques/r1.html); the entry does not rest on that node, and that node's standing flaw is in a different step. Every dévissage of the shape \"the generators are orthogonal to $M$, therefore so is everything they generate\" runs exactly these clauses, which is why they are written once here instead of once per write-up.";</script>
