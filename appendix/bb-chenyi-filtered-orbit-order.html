<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Chen–Yi: the closure order is filtered on each component, and pi_0(LX)</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Chen–Yi: the closure order is filtered on each component, and <span class="math" data-display="0" data-tex="\pi_0(LX)"></span></h1><p class="lead">10. Orbits, closures and standard objects on $LX$</p><div id="doc"></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, §5.3: the exact sequences (7), Lemma 38, and Proposition 39](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety with $G^\\theta$ connected, $S$ a maximal $\\theta$-split torus, and $\\Lambda_S^+\\cong\\Lambda_X^+$ the index set of $L^+G$-orbits with the closure order of [Chen–Yi symmetric orbit parametrization and closure relation](bb-chenyi-symmetric-orbits.html). Write\n\n$$\nLX = \\bigsqcup_{\\beta\\in\\pi_0(LX)} LX_\\beta\n$$\n\nfor the decomposition into connected components, and set $\\Lambda_{S,\\beta}^+ = \\{\\lambda\\in\\Lambda_S^+\\mid LX_\\lambda\\subseteq LX_\\beta\\}$ and $\\underline{\\Lambda}_S^+ = \\{\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}\\mid \\lambda_\\beta\\in\\Lambda_{S,\\beta}^+\\}$. Then:\n\n**(a) The component group** *(the isomorphisms of exact sequences (7), p. 22)*. With $Q\\subseteq\\Lambda_T$ the coroot lattice and $\\tau(\\lambda) = -\\theta(\\lambda)+\\lambda$, there are isomorphisms of exact sequences\n\n$$\n\\left(\\pi_0(LG)\\rightarrow\\pi_0(LX)\\rightarrow 0\\right)\\ \\cong\\ \\left(\\pi_1(G)\\rightarrow\\pi_1(X)\\rightarrow\\pi_0(G^\\theta)\\right)\\ \\cong\\ \\left(\\Lambda_T/Q\\xrightarrow{\\ \\tau\\ }\\Lambda_S/(\\Lambda_S\\cap Q)\\rightarrow 0\\right),\n$$\n\ninduced by the fibration $G^\\theta\\rightarrow G\\rightarrow G/G^\\theta = X$. In particular $\\pi_0(LX)\\cong\\Lambda_S/(\\Lambda_S\\cap Q)$.\n\n**(b) Filteredness one component at a time** *(Lemma 38, p. 22, and the paragraph after its proof, p. 23)*. For each $\\beta\\in\\pi_0(LX)$ the set $\\Lambda_{S,\\beta}^+$, partially ordered by $\\lambda\\le\\lambda'$ if $LX_\\lambda\\subseteq\\overline{LX}_{\\lambda'}$, is a filtered set; likewise $\\mathcal{V}_\\beta = \\{v\\mid\\mathcal{O}_v\\subseteq LX_\\beta\\}$ under $v\\le v'$ if $\\mathcal{O}_v\\subseteq\\overline{\\mathcal{O}}_{v'}$. Consequently $\\underline{\\Lambda}_S^+$, partially ordered by $\\underline{\\lambda}\\le\\underline{\\lambda}'$ if $\\lambda_\\beta\\le\\lambda'_\\beta$ for every $\\beta$, is a filtered set.\n\n**(c) The presentation is indexed by tuples** *(Prop. 39, p. 23)*. The disjoint union $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$ is a locally equidimensional placid scheme, and\n\n$$\nLX\\ \\cong\\ \\operatorname*{colim}_{\\underline{\\lambda}\\in\\underline{\\Lambda}_S^+}\\ \\overline{LX}_{\\underline{\\lambda}}\n$$\n\nis a locally equidimensional $L^+G$-placid presentation; the same statement holds for $I_0$-orbits with $\\overline{\\mathcal{O}}_{\\underline{v}} = \\bigsqcup_\\beta\\overline{\\mathcal{O}}_{v_\\beta}$.\n\n- **role:** external black box\n- **hypotheses:** $X = G/G^\\theta$ **symmetric with $G^\\theta$ connected** — the source writes \"note that we assume $K$ is connected\" at (7), and clause (a) uses the restricted root datum of its §3.1, so the entry does not extend to general spherical $X$. Remark 37 of the source extends Theorem 36 — the content of [`thm:chen_Ti`](thm-chen-ti.html)(a) — and says nothing about §5.3. A node using clause (b) must say **which** $\\beta$ it works over: filteredness is asserted per connected component and for the tuple set $\\underline{\\Lambda}_S^+$, and for no other index. A node using clause (c) must use the tuple index $\\underline{\\Lambda}_S^+$; the steps are the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}}$, which are single orbit closures exactly when $\\pi_0(LX)$ is a single point.\n- **note:** *Provenance, verified on the page.* Read in `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025) on 2026-08-06 by the lead-researcher for `/decompose Q3`. §5.3 *Filtered structures on orbits* opens on p. 22 with the sentence \"We shall show that, **on each connected component of $LX$**, the orbits closure relation defines filtered partial orders on the sets of $I_0$-orbits and $L^+G$-orbits\"; the exact sequences (7) and Lemma 38 are on p. 22, the tuple corollary and Proposition 39 on p. 23. The proof of Lemma 38(i) runs through $\\mu = 2\\check\\rho - 2\\check\\rho_M$ for $M = Z_G(S)$ and shows that $\\gamma = \\lambda + n\\mu$ dominates both $\\lambda$ and $\\lambda'$ for $n$ large, which is available only when $\\lambda-\\lambda'\\in\\Lambda_S\\cap Q$ — that is, within one component.\n- **note:** *What this entry adds to [`thm:chen_Ti`](thm-chen-ti.html).* That entry black-boxes the presentation in the manuscript's single-index form $LX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ (main.tex:772) and records in its own provenance note that the source states it over tuples. This entry carries the reason: the single-index family is filtered exactly when $\\pi_0(LX)$ is trivial, and by clause (a) that is the condition $\\Lambda_S = \\Lambda_S\\cap Q$. For $X = T$ under $G = T\\times T$ one has $Q = 0$ and $\\Lambda_S = X_*(T)$, so $\\pi_0(LX)\\cong X_*(T)$ is infinite as soon as $\\dim T\\ge 1$.";</script>
