<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Gr^lambda, overlineGr_lambda = Gr_lelambda</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="\mathrm{Gr}^\lambda"></span>, <span class="math" data-display="0" data-tex="\overline{\mathrm{Gr}}_\lambda = \mathrm{Gr}_{\le\lambda}"></span> — the affine Grassmannian by Schubert closures</h1><p class="lead">9. The affine Grassmannian</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L3/Q1-L3-L1/index.html">Q1-L3-L1</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L2/index.html">Q1-L3-L2</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L1/index.html">Q1-L3-L2-L1</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L2/index.html">Q1-L3-L2-L2</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L3/index.html">Q1-L3-L2-L3</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L2/Q1-L3-L2-L4/index.html">Q1-L3-L2-L4</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L6/index.html">Q1-L3-L6</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L1/index.html">Q2-L5-L1</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L2/index.html">Q2-L5-L2</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L4/index.html">Q2-L5-L4</a>, <a href="../nodes/Q4/Q4-e3/index.html">Q4-e3</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2, p. 4: the paragraph on $G_{\\mathcal{O}}$-orbits, together with (2.1) and (2.2)](../../papers/mirkovic2007geometric.pdf)] for clauses (1)–(3); main.tex:831 and main.tex:1100 for the ind-properness in clause (3); main.tex:1208 and main.tex:1221 for clause (4)). Let $G$, $T$, $W$, $K = L^+G$ and $\\mathrm{Gr}$ be as in [`subsec:notations`](subsec-notations.html), write $X_*(T)$ for the cocharacter lattice and $\\Lambda^+ := X_*(T)^+$ for the dominant cone.\n\n**(1) Orbits.** The group scheme $K$ acts on $\\mathrm{Gr}$ with finite-dimensional orbits, and the $K$-orbits are parameterized by the $W$-orbits in $X_*(T)$ — equivalently by $\\Lambda^+$. The orbit attached to $\\lambda$ is\n\n$$\n\\mathrm{Gr}^\\lambda = K\\cdot L_\\lambda\\ \\subset\\ \\mathrm{Gr},\n$$\n\nwhere $L_\\lambda$ is the image in $\\mathrm{Gr}$ of the point $\\lambda\\in X_*(T)\\subset LG$.\n\n**(2) Closure order.** For $\\lambda,\\mu\\in\\Lambda^+$,\n\n$$\n\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}\\quad\\text{if and only if}\\quad \\lambda-\\mu\\ \\text{is a sum of positive coroots.}\n$$\n\nThe blueprint writes $\\overline{\\mathrm{Gr}}_\\lambda := \\overline{\\mathrm{Gr}^\\lambda}$ for the closure, taken reduced.\n\n**(3) Presentation and ind-properness.** $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$, where the $\\mathrm{Gr}_n$ are finite-dimensional $K$-invariant schemes and every transition map is a closed embedding, and $\\mathrm{Gr}$ is ind-proper.\n\n**(4) Coherent sheaves come from a stage.** With $\\mathrm{Gr}_{\\le\\alpha}$ the manuscript's name for $\\overline{\\mathrm{Gr}}_\\alpha$,\n\n$$\n\\mathcal{D}(\\mathrm{Gr})\\simeq\\varinjlim_{\\alpha\\in\\Lambda^+}\\mathcal{D}\\left(\\mathrm{Gr}_{\\le\\alpha}\\right),\n$$\n\nand every $\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$ may be written $\\mathcal{F} = \\iota_*c$ with $\\iota\\colon\\mathrm{Gr}_{\\le\\alpha}\\hookrightarrow\\mathrm{Gr}$ the closed embedding and $c\\in\\mathcal{D}_c(\\mathrm{Gr}_{\\le\\alpha})^I$, for some $\\alpha\\in\\Lambda^+$.\n\n- **role:** black box\n- **hypotheses:** $G$ connected reductive. Three caveats a citing node must carry. *Ground field.* The source works over $\\mathbb{C}$, with $\\mathcal{O} = \\mathbb{C}[[z]]$ and $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing $k$ is any algebraically closed field of characteristic $0$ ([`subsec:notations`](subsec-notations.html), [$F = k((t))$](conv-ring-of-integers.html)); the presentation in clause (4) is asserted over the standing $k$ by main.tex:1208, and clauses (1)–(3) are used at that generality on the manuscript's authority, not on the source's page. *Equivariance in clause (4).* main.tex:1221 prints the reduction $\\mathcal{F} = \\iota_*c$ for **Iwahori**-equivariant coherent objects. A node needing the spherical form — $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ written as $\\iota_*c$ with $c\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}_{\\le\\alpha})$ — is making the same reduction one parahoric up, out of the same colimit presentation, and must say that it is doing so. *Two defects in the index and the category of clause (4), which a citing node must carry.* The colimit is indexed by $\\alpha\\in\\Lambda^+$ under the closure order of clause (2), and that poset is **not directed** once $\\mathrm{Gr}$ is disconnected: $\\lambda-\\mu$ a sum of positive coroots forces $\\lambda\\equiv\\mu$ modulo the coroot lattice, so a single $\\overline{\\mathrm{Gr}}_\\alpha$ lies in one connected component. Finite unions $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ are the directed replacement, and they are cofinal among the stages of clause (3) — [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html)(2). Separately, \"$\\mathcal{F} = \\iota_*c$ for some $\\alpha$\" is a statement about **compact** objects, whereas $\\mathcal{D}_c$ is defined pointwise by [`defn:coherent_D_mod`](defn-coherent-d-mod.html) and coherent is not compact on a stack: $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support and comes from no stage — [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html)(4). So clause (4) may be invoked to move an object *off* a stage, never to put an arbitrary coherent object *onto* one.\n- **note:** *Provenance, verified on the page.* Read in `papers/mirkovic2007geometric.pdf` on 2026-08-06. Printed p. 4 carries: \"For us an ind-scheme means a direct limit of family of schemes where all the maps are closed embeddings\", the display (2.1) $\\mathrm{Gr} = \\varinjlim\\mathrm{Gr}_n$ with \"the $\\mathrm{Gr}_n$ are finite dimensional schemes which are $G_{\\mathcal{O}}$-invariant\"; \"The group scheme $G_{\\mathcal{O}}$ acts on $\\mathrm{Gr}$ with finite dimensional orbits ... the $G_{\\mathcal{O}}$-orbits on $\\mathrm{Gr}$ are parameterized by the $W$-orbits in $X_*(T)$, and given $\\lambda\\in X_*(T)$ the $G_{\\mathcal{O}}$-orbit associated to $W\\lambda$ is $\\mathrm{Gr}^\\lambda = G_{\\mathcal{O}}\\cdot L_\\lambda\\subset\\mathrm{Gr}$\"; and the display (2.2) transcribed above, stated there \"for dominant $\\lambda$ and $\\mu$\". Printed p. 5 adds $\\dim(\\mathrm{Gr}^\\lambda) = 2\\rho(\\lambda)$ for dominant $\\lambda$, and the same printed p. 4 adds, in sentences this entry does not transcribe, that $\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$ and that $\\mathrm{Gr}$ is discrete for a torus. **This entry needs and carries none of those three**, and neither the $\\pi_0$ statement nor the torus statement is to be read out of clauses (1)–(4) above: all three are transcribed in [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](bb-mv-components-dimension.html), which is where a node wanting them cites.\n- **note:** *Ind-properness is the manuscript's, not the source's.* Mirković–Vilonen's p. 4 states the ind-scheme presentation and finite-dimensionality of the stages, and does not say \"proper\" on that page. The assertion in clause (3) is main.tex's: main.tex:831 states [`thm:CD_counit`](thm-cd-counit.html) for ind-proper $H/K$ and applies it to $\\mathrm{Gr} = LG/L^+G$, and main.tex:1100 calls the convolution morphism $q$ of [the spherical Hecke action $\\ast$](conv-hecke-action.html) \"the ind-proper convolution morphism\". That each individual $\\overline{\\mathrm{Gr}}_\\lambda$ is therefore a proper scheme — a closed subscheme of a stage of an ind-proper presentation — is a deduction the citing node makes, not a line of this entry.";</script>
