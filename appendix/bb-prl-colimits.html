<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Colimits of presentable categories, and the subcategory generated by a small set</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>Colimits of presentable categories, and the subcategory generated by a small set</code></h1><p class="lead">2. Higher-categorical conventions</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q2/Q2-L4/index.html">Q2-L4</a>, <a href="../nodes/Q2/Q2-L4/Q2-L4-L2/index.html">Q2-L4-L2</a>, <a href="../nodes/Q3/Q3-L4/index.html">Q3-L4</a>, <a href="../nodes/Q4/Q4-e1/index.html">Q4-e1</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** ([[HTT, Prop. 5.5.3.13 and Thm. 5.5.3.18](../../papers/HTT.pdf)]; [[HA, Thm. 1.1.4.4, Prop. 1.1.4.6 and Prop. 1.4.4.11](../../papers/HA.pdf)]; external, no main.tex label). Write $\\mathrm{Pr}^L$ as in [`Pr^L`](conv-prl.html), $\\mathrm{Pr}^R$ for the $\\infty$-category of presentable $\\infty$-categories and accessible limit-preserving functors, and $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty$ for the $\\infty$-category of small stable $\\infty$-categories and exact functors. Then:\n\n**(1) Limits of presentables** *([[HTT, Prop. 5.5.3.13](../../papers/HTT.pdf)], p. 470)*. The $\\infty$-category $\\mathrm{Pr}^L$ admits all small limits, and the inclusion functor $\\mathrm{Pr}^L\\subseteq\\widehat{\\mathrm{Cat}}_\\infty$ preserves all small limits.\n\n**(2) Colimits of presentables** *([[HTT, Thm. 5.5.3.18](../../papers/HTT.pdf)], p. 472)*. The $\\infty$-category $\\mathrm{Pr}^R$ admits small limits, and the inclusion functor $\\mathrm{Pr}^R\\subseteq\\widehat{\\mathrm{Cat}}_\\infty$ preserves small limits. The source states its purpose on p. 470: proving the analogue of (1) for $\\mathrm{Pr}^R$ \"will show that $\\mathrm{Pr}^L$ is equipped with all small *colimits* as well as all small limits\", the passage between the two being by right adjoints. So a small colimit in $\\mathrm{Pr}^L$ exists and is computed in $\\widehat{\\mathrm{Cat}}_\\infty$ as the limit of the diagram of right adjoints.\n\n**(3) Limits and filtered colimits of stable categories** *([[HA, Thm. 1.1.4.4 and Prop. 1.1.4.6](../../papers/HA.pdf)], p. 35)*. The $\\infty$-category $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty$ admits small limits, and the inclusion $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty\\subseteq\\mathrm{Cat}_\\infty$ preserves small limits. The $\\infty$-category $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty$ admits small filtered colimits, and the inclusion $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty\\subseteq\\mathrm{Cat}_\\infty$ preserves small filtered colimits.\n\n**(4) The subcategory generated by a small set** *([[HA, Prop. 1.4.4.11](../../papers/HA.pdf)], p. 160)*. Let $\\mathcal{C}$ be a presentable stable $\\infty$-category.\n\n1. If $\\mathcal{C}'\\subseteq\\mathcal{C}$ is a full subcategory which is presentable, closed under small colimits, and closed under extensions, then there exists a t-structure on $\\mathcal{C}$ such that $\\mathcal{C}' = \\mathcal{C}_{\\ge 0}$.\n2. Let $\\{X_\\alpha\\}$ be a small collection of objects of $\\mathcal{C}$, and let $\\mathcal{C}'$ be the smallest full subcategory of $\\mathcal{C}$ which contains each $X_\\alpha$ and is closed under extensions and small colimits. Then $\\mathcal{C}'$ is presentable.\n\n- **role:** external black box\n- **hypotheses:** for (1) and (2), nothing beyond presentability — the diagrams are small and indexed arbitrarily. For (3), the objects are **small** stable categories: a node applying it to large ones (as every category in this blueprint is) works in $\\widehat{\\mathrm{Cat}}_\\infty$ and supplies the size bookkeeping itself. For (4), $\\mathcal{C}$ presentable *and* stable, and the collection $\\{X_\\alpha\\}$ genuinely **small**.\n- **note:** **What (4)(2) generates is not $\\langle-\\rangle_{\\mathcal{C}}$.** The subcategory Lurie produces is the smallest one closed under *extensions and small colimits*, which is the connective half of a t-structure by (4)(1) and is in general strictly smaller than the $\\langle X_\\alpha\\rangle_{\\mathcal{C}}$ of [`def:generation`](def-generation.html), that being the smallest *cocomplete stable* subcategory and so closed under desuspension as well. Passing from one to the other — by feeding the small collection $\\{X_\\alpha[-n] \\mid n\\ge 0\\}$ to (4)(2), or by exhausting $\\langle X_\\alpha\\rangle_{\\mathcal{C}}$ by the shifts of the connective piece — is the citing node's own work, not part of what this entry licenses.\n- **note:** **\"$\\mathrm{Pr}^L_{\\mathrm{st}}$ is closed under small colimits in $\\mathrm{Pr}^L$\" is not printed as a numbered result in either source.** It is the combination of (2) with (3): a colimit in $\\mathrm{Pr}^L$ is the limit in $\\widehat{\\mathrm{Cat}}_\\infty$ of the right adjoints, the right adjoint of a colimit-preserving functor between stable presentables is exact, and a limit of stable categories along exact functors is stable. The entry records the three ingredients separately, each as printed, so that a node making the combination says that it is making it.\n- **note:** *Provenance, verified on the page.* Read in `papers/HTT.pdf` and `papers/HA.pdf` on 2026-08-06: HTT Prop. 5.5.3.13 and the paragraph of purpose are on printed p. 470, HTT Thm. 5.5.3.18 on p. 472; HA Thm. 1.1.4.4 and Prop. 1.1.4.6 are both on printed p. 35, HA Prop. 1.4.4.11 on p. 160 with the proof of its part (2) deferred to p. 161. Both bib keys, `HTT` and `HA`, are present in `refs.bib`.";</script>
