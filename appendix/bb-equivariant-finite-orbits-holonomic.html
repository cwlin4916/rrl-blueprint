<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>An equivariant coherent D-module on a space with finitely many orbits is holonomic</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>An equivariant coherent <span class="math" data-display="0" data-tex="\mathcal{D}"></span>-module on a space with finitely many orbits is holonomic</h1><p class="lead">8. Coherence, renormalization and holonomicity</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/index.html">Q1-L5-L3-L4</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** (Hotta, Takeuchi, Tanisaki, *D-Modules, Perverse Sheaves, and Representation Theory*, Progress in Mathematics **236**, Birkhäuser 2008, §11.6; external, no main.tex label, no `refs.bib` key, and **not verified at page level** — see the notes). Let $H$ be an affine algebraic group of finite type over $k$, with Lie algebra $\\mathfrak{h}$, acting on a smooth finite-type $k$-variety $\\tilde S$, and let\n\n$$\n\\mu\\colon T^{*}\\tilde S\\longrightarrow\\mathfrak{h}^{*}\n$$\n\nbe the moment map of the induced Hamiltonian action, $\\mu(y,\\xi)(v)=\\xi\\left(v_y\\right)$ for $v\\in\\mathfrak{h}$ with induced vector field $v_y\\in T_y\\tilde S$. Let $M$ be an $H$-equivariant coherent $\\mathcal{D}$-module on $\\tilde S$, and let $\\mathrm{Ch}(M)\\subseteq T^{*}\\tilde S$ be its characteristic variety. Then:\n\n1. $\\mathrm{Ch}(M)\\subseteq\\mu^{-1}(0)$;\n\n2. $\\mu^{-1}(0)=\\bigcup_{\\mathcal{O}}T^{*}_{\\mathcal{O}}\\tilde S$, the union taken over the $H$-orbits $\\mathcal{O}\\subseteq\\tilde S$ of their conormal bundles, each of pure dimension $\\dim\\tilde S$;\n\n3. if $H$ has only finitely many orbits on $\\tilde S$, then $\\dim\\mu^{-1}(0)=\\dim\\tilde S$, hence $\\dim\\mathrm{Ch}(M)=\\dim\\tilde S$ and $M$ is holonomic.\n\n- **role:** black box\n- **hypotheses:** $H$ affine of finite type and $\\tilde S$ smooth of finite type, both over $k$ algebraically closed of characteristic $0$ ([`subsec:notations`](subsec-notations.html)). $M$ must be **equivariant in the strong sense** — the $\\mathfrak{h}$-action differentiating the $H$-action agrees with the one through the vector fields in $\\mathcal{D}_{\\tilde S}$ — which is what makes clause 1 true; a merely weakly equivariant module is not covered, and neither is a coherent module carrying no equivariant structure at all ($\\mathcal{D}_{\\tilde S}$ itself has $\\mathrm{Ch}=T^{*}\\tilde S$, of dimension $2\\dim\\tilde S$, so for $\\dim\\tilde S\\ge1$ it is excluded by clause 1 whenever clause 3's finiteness holds). Clause 3 needs the finiteness of the orbit set and nothing else: with $H$ trivial, $\\mu^{-1}(0)=T^{*}\\tilde S$ and the conclusion is false. Nothing is asserted here about $\\mathcal{D}_c$ on a quotient prestack — the identification of $\\mathcal{D}_c(H\\backslash\\tilde S)$ ([`defn:coherent_D_mod`](defn-coherent-d-mod.html)) with the $H$-equivariant coherent $\\mathcal{D}$-modules on $\\tilde S$ is the citing node's own work.\n- **note:** *The mechanism, so that a reader can see what is being black-boxed.* Clause 1 is equivariance read on symbols: for $v\\in\\mathfrak{h}$ the vector field $v_{\\tilde S}$ acts on $M$ by an operator that the equivariant structure makes zero on the associated graded, so its symbol vanishes on $\\mathrm{Ch}(M)$, and those symbols are exactly the components of $\\mu$. Clause 2 is the identity $\\mu(y,\\xi)=0\\iff\\xi$ annihilates $T_y\\left(H\\cdot y\\right)$, i.e. $(y,\\xi)\\in T^{*}_{H\\cdot y}\\tilde S$; a conormal bundle to a locally closed smooth $\\mathcal{O}$ of dimension $d$ has dimension $d+\\left(\\dim\\tilde S-d\\right)=\\dim\\tilde S$. Clause 3 is the dimension count over a finite union, together with Bernstein's inequality $\\dim\\mathrm{Ch}(M)\\ge\\dim\\tilde S$ for $M\\ne0$ coherent.\n- **note:** **Not verified at page level, and the bibliography key is absent.** Two separate defects, both recorded rather than worked around.\n\n  The book is not in `papers/` — the key `HTT` and the file `papers/HTT.pdf` are **Lurie, *Higher Topos Theory*, Annals of Mathematics Studies 170**, a different book, verified on p. 1 of that PDF on 2026-08-06 — so the run that wrote this entry could not open the page. §11.6 is named above as the natural home in print for the equivariant theory this statement belongs to, and it is a *pointer, not a transcription*: no numbered result of the source is being quoted, and until a page is verified the three clauses above are the closed world's own statement of a standard fact, with its argument recorded in the note above. A node citing this entry inherits that status, and a page-level check is owed.\n\n  `refs.bib` has no key for the book, and `refs.bib` is manuscript territory that no agent writes; hence the full bibliographic data in prose above and no key anywhere. Adding a key is the user's call.";</script>
