<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Lambda_X^+</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="\Lambda_X^+"></span> — the index poset of spherical orbits</h1><p class="lead">5. Sheaf theory on infinite-dimensional spaces</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L4/Q1-L4-L1/index.html">Q1-L4-L1</a></dd></dl></div></main><script>const SRC = "**Notation** (main.tex:734–747, inside [`def:orbits_iwahori_spherical`](#def-orbits-iwahori-spherical)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [`thm:chen_Ti`](#thm-chen-ti).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **role:** notation\n- **used by:** [Q1-L4-L1](../nodes/Q1-L4/Q1-L4-L1/index.html)\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](#bb-chenyi-symmetric-orbits) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.";</script>
