<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>k_Y</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="k_{\mathcal{Y}}"></span> — the constant object, and where this appendix stops defining it</h1><p class="lead">6. Placid spaces and the sheaves on them</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q2/Q2-L5/Q2-L5-L2/index.html">Q2-L5-L2</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L4/index.html">Q2-L5-L4</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Notation** (blueprint notation; main.tex names the object three times and defines it nowhere — main.tex:79–80, \"the $!$-extension of constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$\"; main.tex:788, \"the constant $\\mathcal{D}$-modules on the classifying stack for a complex reductive group $G$ is coherent but not compact\"; main.tex:953, \"the constant $\\mathcal{D}$-module on $L^+X$\". Recorded here so that no node coins it again, and so that the place where it is *not* available is written down once instead of being assumed at each use).\n\nLet $S$ be a scheme of finite type over $k$, with structure morphism $a_S\\colon S\\rightarrow\\mathrm{pt}$. The **constant object** of $S$ is\n\n$$\nk_S\\ :=\\ a_S^{*}(k)\\ \\in\\ \\mathcal{D}(S),\n$$\n\nthe $*$-pullback of the unit $k\\in\\mathcal{D}(\\mathrm{pt}) = \\mathrm{Vect}$ ([`DGCat`, `Vect`](conv-dgcat.html)) along the structure morphism, taken in the $\\mathcal{D}$-module theory of finite-type schemes that [$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html) Kan-extends. For an affine group scheme $H$ acting on such an $S$, the constant object of the quotient prestack is\n\n$$\nk_{H\\backslash S}\\ \\in\\ \\mathcal{D}(H\\backslash S),\n$$\n\nnamely $k_S$ carrying its canonical $H$-equivariant structure.\n\n**Comparison with the dualizing object, on the smooth locus only.** If $S$ is in addition smooth of pure dimension $d$ over $k$, then in the normalization of [$\\omega_{\\mathcal{Y}}$](not-dualizing-object.html), where $\\omega_S$ is the usual dualizing complex of a finite-type scheme,\n\n$$\n\\omega_S\\ \\simeq\\ k_S[2d] .\n$$\n\nFor a singular $S$ nothing of the kind is asserted: the two objects are then not shifts of one another in general, and a comparison between them on such an $S$ — on a Schubert closure $\\overline{\\mathrm{Gr}}_\\nu$ with $\\nu$ not minuscule, say ([$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)) — is a claim its user owes.\n\n- **role:** notation\n- **note:** **Where this appendix stops, and what a node must therefore do.** Nothing above defines $k_{\\mathcal{Y}}$ for a prestack $\\mathcal{Y}$ that is neither a finite-type scheme nor a group quotient of one. In particular it defines no constant object on $L^{+}X$, on $LX$, on $K\\backslash L^{+}X$, on a twisted product with $L^{+}X$ in it, or on $\\mathrm{Gr}$ — although main.tex:79–80 and main.tex:953 name the third of these. The reason is structural rather than an omission: [$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html) Kan-extends $\\mathcal{D}^!$ contravariantly through $f^{!}$ and $\\mathcal{D}^{*}$ covariantly through $f_{*}$, so neither extended theory carries a $*$-pullback along the structure morphism of an infinite-dimensional prestack; and the displayed comparison with $\\omega$ is by $2\\dim$, which such a prestack does not have — the same point [$\\omega_{\\mathcal{Y}}$](not-dualizing-object.html) records in its second note and [`ex:sheaf_placid_ind`](ex-sheaf-placid-ind.html) meets as the need for a dimension theory. A node that needs \"the constant object\" on such a prestack therefore names the object it means and states the property that pins it down; a node that needs it compared with $\\omega$ there states the comparison as a hypothesis and carries the integer it produces.\n- **note:** *What this entry does not do to $\\mathrm{IC}_0$.* [$\\mathrm{IC}_0$](ic-0.html) is described there as the $!$-extension of the constant $\\mathcal{D}$-module on $L^{+}G\\backslash L^{+}X$, and its membership in $\\mathcal{D}_c(L^{+}G\\backslash LX)$ is a ratified import. That import stands on its own and is untouched here: the present entry does not construct the object being extended, and is not a prerequisite of citing $\\mathrm{IC}_0$.\n- **note:** *The one property of $k$ this appendix already asserts elsewhere.* [`defn:coherent_D_mod`](defn-coherent-d-mod.html) records main.tex:786–793's example that the constant $\\mathcal{D}$-module on $BG$, for $G$ reductive, is coherent and not compact. That is a statement about $k_{H\\backslash S}$ in the sense fixed above, with $S = \\mathrm{pt}$, and it is the reason compactness arguments in this project are run in $\\mathcal{D}^{\\mathrm{ren}}$ ([`def:renormalized`](def-renormalized.html)) rather than against $k$ directly.";</script>
