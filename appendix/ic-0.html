<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>IC_0</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="\mathrm{IC}_0"></span> — the unramified basic object</h1><p class="lead">7. Spherical varieties, Satake subcategories, the unramified conjecture</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L1/index.html">Q1-L1</a>, <a href="../nodes/Q1-L2/Q1-L2-L3/index.html">Q1-L2-L3</a>, <a href="../nodes/Q1-L3/Q1-L3-a1/index.html">Q1-L3-a1</a>, <a href="../nodes/Q1-L3/Q1-L3-a3/index.html">Q1-L3-a3</a>, <a href="../nodes/Q1-L3/Q1-L3-a4/index.html">Q1-L3-a4</a>, <a href="../nodes/Q1-L5/Q1-L5-L1/index.html">Q1-L5-L1</a>, <a href="../nodes/Q1-L5/Q1-L5-L2/index.html">Q1-L5-L2</a>, <a href="../nodes/Q1-L5/Q1-L5-e1/index.html">Q1-L5-e1</a>, <a href="../nodes/Q1-L5/Q1-L5-e2/index.html">Q1-L5-e2</a>, <a href="../nodes/Q1-L5/Q1-L5-e3/index.html">Q1-L5-e3</a>, <a href="../nodes/Q1-a1/index.html">Q1-a1</a>, <a href="../nodes/Q1-e1/index.html">Q1-e1</a>, <a href="../nodes/Q1-e2/index.html">Q1-e2</a>, <a href="../nodes/Q1-e4/index.html">Q1-e4</a></dd></dl></div></main><script>const SRC = "**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n- **role:** definition\n- **used by:** [Q1-L1](../nodes/Q1-L1/index.html), [Q1-L2-L3](../nodes/Q1-L2/Q1-L2-L3/index.html), [Q1-L5-e1](../nodes/Q1-L5/Q1-L5-e1/index.html), [Q1-L5-e2](../nodes/Q1-L5/Q1-L5-e2/index.html), [Q1-L5-e3](../nodes/Q1-L5/Q1-L5-e3/index.html), [Q1-a1](../nodes/Q1-a1/index.html), [Q1-e1](../nodes/Q1-e1/index.html), [Q1-e2](../nodes/Q1-e2/index.html), [Q1-e4](../nodes/Q1-e4/index.html), [Q1-L3-a1](../nodes/Q1-L3/Q1-L3-a1/index.html), [Q1-L3-a3](../nodes/Q1-L3/Q1-L3-a3/index.html), [Q1-L3-a4](../nodes/Q1-L3/Q1-L3-a4/index.html), [Q1-L5-L1](../nodes/Q1-L5/Q1-L5-L1/index.html), [Q1-L5-L2](../nodes/Q1-L5/Q1-L5-L2/index.html)\n- **note:** the pointing condition of [`conj:relative_Langlands_unramified`](#conj-relative-langlands-unramified) is exactly the requirement that $\\mathrm{IC}_0\\mapsto\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n  **Ratified reading.** The displayed membership is a genuine finiteness statement — it says the $!$-extension is coherent — and no node in the blueprint derives it. It is imported from main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action, which presupposes it; the same presupposition is what lets [the spherical Hecke action $\\ast$](#conv-hecke-action) accept $\\mathrm{IC}_0$ in the second slot of its module action. Before 2026-08-05 it was carried only by the grammar of those two entries, and round 1 of [Q1-L2-L3](../nodes/Q1-L2/Q1-L2-L3/critiques/r1.html) asked for it to be stated; it is stated here so that a proof may cite it rather than infer it from a typing argument. Anyone who later wants it *proved* wants a node about coherence of $!$-extensions on $K\\backslash LX$, which is not in the closed world.";</script>
