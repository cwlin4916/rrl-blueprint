<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Chen–Yi symmetric orbit parametrization and closure relation</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>Chen–Yi symmetric orbit parametrization and closure relation</code></h1><p class="lead">7. Spherical varieties, Satake subcategories, the unramified conjecture</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L4/Q1-L4-e4/index.html">Q1-L4-e4</a>, <a href="../nodes/Q1-L6/Q1-L6-L1/index.html">Q1-L6-L1</a></dd></dl></div></main><script>const SRC = "**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 17(i) and Thm. 18](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$ whose fixed-point subgroup $G^\\theta$ is connected. Let $S$ be a maximal $\\theta$-split torus of $G$, and let $\\Lambda_S^+$ and $\\check\\Phi^+$ be the dominant coweights of $S$ and the positive coroots, both taken for the restricted root data of §3.1 of the source. Then:\n\n1. *(Prop. 17(i))* The $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$; that is, the index set $\\Lambda_X^+$ of [`def:orbits_iwahori_spherical`](#def-orbits-iwahori-spherical) is identified with $\\Lambda_S^+$.\n2. *(Thm. 18)* For every $\\mu\\in\\Lambda_S^+$,\n\n$$\n\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu} LX_\\lambda, \\qquad\\text{where}\\quad \\lambda\\le\\mu \\iff \\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+,\n$$\n\ni.e. $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative integral sum of positive coroots.\n\n- **role:** external black box\n- **hypotheses:** $X$ symmetric with $G^\\theta$ connected — **not** general spherical. The proofs run through $\\theta$-twisted $\\mathrm{SL}_2$-computations ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 20, Cor. 21](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]), and no remark in the source extends them beyond the symmetric case — unlike the placidity theorem (Thm 36 with Rem 37) black-boxed as [`thm:chen_Ti`](#thm-chen-ti), which the source does extend to general spherical $X$.\n- **used by:** [Q1-L6-L1](../nodes/Q1-L6/Q1-L6-L1/index.html), [Q1-L4-e4](../nodes/Q1-L4/Q1-L4-e4/index.html)\n- **note:** *Provenance, verified on the page.* The PDF is on disk as `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025), and both statements were re-checked there on 2026-08-05 by the lead-researcher for `/update Q1-L5`. **Proposition 17(i)**, p. 10: the $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$ — for each $\\mu\\in\\Lambda_S^+$ there is $x_\\mu\\in LX(k) = X(F)$ with $\\tau(x_\\mu) = t^\\mu\\in S(F)$, and $LX_\\mu = L^+G\\cdot x_\\mu$ is the corresponding orbit. **Theorem 18**, p. 10: for every $\\mu\\in\\Lambda_S^+$, $\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$; the order is the one the source fixes on $\\Lambda_S$ just above Prop. 17 on the same page, by restriction from $\\Lambda_T$ — $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative sum of positive coroots. Both check out as transcribed above.\n\n  Same page, Remark 19: for $k = \\mathbb{C}$ the closure relation is the source's [Nad04, Thm. 10.1], proved there through real affine Grassmannians, whereas the source's own argument is algebraic and valid over any algebraically closed field of characteristic $\\ne 2$ — so it covers the blueprint's standing $k$ of characteristic $0$ ([`subsec:notations`](#subsec-notations)). Prop. 17(ii), the bijection $G(F)/K(F)\\cong X(F)$, is the part that needs $G^\\theta$ connected on the page; the reading record in [`papers/guideline.md`](../papers/guideline.html) notes that in [Nad04] part (i) holds without that hypothesis.\n\n---\n\n<a id=\"s8\"></a>\n\n## 8. Results established inside main.tex\n\nThese are proved in the manuscript. A node may invoke them without reproof, but must check the stated hypotheses.";</script>
