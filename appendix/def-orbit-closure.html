<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>overlineLX_lambda, overlineO_v</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><span class="math" data-display="0" data-tex="\overline{LX}_\lambda"></span>, <span class="math" data-display="0" data-tex="\overline{\mathcal{O}}_v"></span> — the orbit closures, taken reduced</h1><p class="lead">5. Sheaf theory on infinite-dimensional spaces</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L5/Q1-L5-L6/index.html">Q1-L5-L6</a></dd></dl></div></main><script>const SRC = "**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [`def:orbits_iwahori_spherical`](#def-orbits-iwahori-spherical).\n\n- **role:** definition\n- **used by:** [Q1-L5-L6](../nodes/Q1-L5/Q1-L5-L6/index.html)\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](#ex-loops-placid)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [`thm:chen_Ti`](#thm-chen-ti)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [`def:orbits_iwahori_spherical`](#def-orbits-iwahori-spherical), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.";</script>
