[Q1-L4-e2](../nodes/Q1-L4/Q1-L4-e2/index.html), [Q1-L4-L1](../nodes/Q1-L4/Q1-L4-L1/index.html), [Q1-L4-L2](../nodes/Q1-L4/Q1-L4-L2/index.html), [Q1-L4-L4](../nodes/Q1-L4/Q1-L4-L4/index.html), [Q1-L5-L3](../nodes/Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L4](../nodes/Q1-L5/Q1-L5-L4/index.html), [Q1-L5-L6](../nodes/Q1-L5/Q1-L5-L6/index.html)\n- **note:** $H$-placidity is a property *of a chosen presentation*, not of $X$ alone. Two presentations of the same $LX$ — the $K$-orbit-closure one and the $I$-orbit-closure one — are both supplied by [`thm:chen_Ti`](#thm-chen-ti).";</script>
