<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Zhu: the Cartan decomposition, dimGr^mu and pi_0(Gr), over the standing k</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Zhu: the Cartan decomposition, <span class="math" data-display="0" data-tex="\dim\mathrm{Gr}^\mu"></span> and <span class="math" data-display="0" data-tex="\pi_0(\mathrm{Gr})"></span>, over the standing <span class="math" data-display="0" data-tex="k"></span></h1><p class="lead">9. The affine Grassmannian</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q2/Q2-L5/Q2-L5-L1/index.html">Q2-L5-L1</a>, <a href="../nodes/Q2/Q2-L5/Q2-L5-L4/index.html">Q2-L5-L4</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** ([[zhu2016introduction, Thm. 1.3.11(1) printed p. 15; §2.1 (2.1.1)–(2.1.2) printed p. 23; Prop. 2.1.5 printed pp. 24–25; (2.1.10) with Cor. 2.1.11 printed p. 26](../../papers/zhu2016introduction.pdf)]; external, no main.tex label). Let $k$ be algebraically closed, $F = k((t))$, $\\mathcal{O} = k[[t]]$, let $G$ be a connected split reductive group over $k$ with $T\\subseteq B\\subseteq G$, let $\\underline{G} = G\\otimes_k\\mathcal{O}$ be the constant group scheme, and let $\\mathrm{Gr} = \\mathrm{Gr}_{\\underline{G}} = LG/L^+G$. Write $X_*(T)$ for the cocharacter lattice, $\\Lambda^+ := X_*(T)^+$ for the dominant cone, $Q\\subseteq X_*(T)$ for the coroot lattice, and $L_\\mu\\in\\mathrm{Gr}$ for the image of $t^\\mu = \\mu(t)\\in T(F)\\subseteq G(F)$. The clauses are **separately citable**; see the hypotheses line for what each needs and for what this entry does not carry.\n\n**(1) Cartan decomposition and the orbit parametrization** *(printed p. 23)*. There is a canonical bijection\n\n$$\nG(\\mathcal{O})\\backslash G(F)/G(\\mathcal{O})\\ \\cong\\ X_*(T)/W\\ \\cong\\ \\Lambda^+,\n$$\n\nrealized by the Cartan decomposition $G(F) = \\bigsqcup_{\\mu\\in\\Lambda^+}G(\\mathcal{O})\\,t^\\mu\\,G(\\mathcal{O})$. The double coset $G(\\mathcal{O})t^\\mu G(\\mathcal{O})$ depends on neither the uniformizer $t$ nor the embedding $T\\subseteq G$, and the image of $t^\\mu$ in $\\mathrm{Gr}$ — the point $L_\\mu$ — is independent of the uniformizer.\n\n**(2) The Schubert cell and the Schubert variety** *(Prop. 2.1.5, printed pp. 24–25)*. For $\\mu\\in\\Lambda^+$ the cell $\\mathrm{Gr}^\\mu$ forms a single $L^+G$-orbit and is a smooth quasi-projective variety with\n\n$$\n\\dim\\mathrm{Gr}^\\mu\\ =\\ \\langle 2\\rho,\\mu\\rangle ,\n$$\n\nand $\\overline{\\mathrm{Gr}}_\\mu$ is the Zariski closure of $\\mathrm{Gr}^\\mu$, hence a **projective** variety. Both are taken with the reduced scheme structure, as the source's definition on printed p. 24 does.\n\n**(3) The component group** *(Thm. 1.3.11(1), printed p. 15)*. Let $I = \\mathrm{Gal}(\\bar F/F)$, acting on the fundamental group $\\pi_1(G_F)$ of $G_F = G\\otimes_k F$, and let $\\pi_1(G_F)_I$ be the coinvariants. Then there is a canonical isomorphism $\\pi_0(LG)\\cong\\pi_1(G_F)_I$, and the projection $LG\\rightarrow\\mathrm{Gr}$ induces an isomorphism\n\n$$\n\\pi_0(LG)\\ \\cong\\ \\pi_0(\\mathrm{Gr}).\n$$\n\n**(4) The split reduction** *(the transcriber's display of a reduction the source performs on printed p. 26; see the notes)*. For the split $G$ of the setting above, $I$ acts trivially on $\\pi_1(G_F)$, so $\\pi_1(G_F)_I = \\pi_1(G)$, and the algebraic fundamental group of a split connected reductive group is by definition $X_*(T)/Q$. Hence\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ \\pi_1(G)\\ \\cong\\ X_*(T)/Q .\n$$\n\n**(5) Parity** *((2.1.10) with Cor. 2.1.11, printed p. 26)*. The map $\\mathfrak{p}\\colon X_*(T)\\rightarrow\\mathbb{Z}/2$, $\\mu\\mapsto(-1)^{\\langle2\\rho,\\mu\\rangle}$, factors as $X_*(T)\\rightarrow\\pi_1(G)\\rightarrow\\mathbb{Z}/2$ and therefore induces, through clause (3), a map $\\mathfrak{p}\\colon\\pi_0(\\mathrm{Gr})\\rightarrow\\mathbb{Z}/2$; and the cell $\\mathrm{Gr}^\\mu$ lies in the even, respectively odd, components exactly when $\\dim\\mathrm{Gr}^\\mu$ is even, respectively odd.\n\n- **role:** external black box\n- **hypotheses:** *Per clause.* Clauses (1), (2) and (5) need the §2 standing setting — $k$ algebraically closed, $F = k((t))$, $\\mathcal{O} = k[[t]]$, $\\underline{G} = G\\otimes_k\\mathcal{O}$ **constant** reductive — and clause (2) needs in addition $\\mu$ **dominant** for the chosen $B$. Clause (3) needs $k$ algebraically closed and $G_F$ connected reductive, and nothing more; it is stated for a possibly non-constant $\\underline{G}$, which is why the coinvariants appear. Clause (4) needs $G$ **split**, which is automatic here. *Ground field — this entry is the one that does not narrow.* The source's standing base field in §1.3 and §2 is any algebraically closed $k$; no characteristic hypothesis is placed on the clauses transcribed above (the characteristic exponent $p$ enters only Thm. 1.3.11(3)–(4), which this entry does not carry). The blueprint's standing $k$ — algebraically closed of characteristic $0$ ([`subsec:notations`](subsec-notations.html), [$F = k((t))$](conv-ring-of-integers.html)) — is therefore inside the source's generality, and a node citing this entry over $k$ is making **no** declared widening. That is the whole reason the entry exists beside [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](bb-mv-components-dimension.html), whose clauses are stated over $\\mathbb{C}$: clause (2) here supersedes that entry's clause (3) with no widening, and clause (4) here supersedes the *non-routine* widening of that entry's clause (1). **What this entry does not carry is the labelling** — see the note below; a node needing it is in exactly the position [Mirković–Vilonen](bb-mv-components-dimension.html)'s second note (ii) describes, and this entry does not improve it.\n- **note:** **What this entry does not carry, and a citing node must supply.** *(i) The labelling of the components by coweights.* The step \"the connected component of $\\mathrm{Gr}$ containing $L_\\mu$ is the class $\\mu + Q$\" — equivalently, that the composite $X_*(T)\\rightarrow\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ of clauses (1), (3) and (4) is the canonical projection — is **not on any page of the source located by this transcription**, and is not asserted by any clause above. Clause (3) says the isomorphism is *canonical* and does not say what it does to $t^\\mu$; clause (4) identifies the target and not the map. The closest the source comes is clause (5), which is precisely the labelling composed with $X_*(T)/Q\\rightarrow\\mathbb{Z}/2$ — its mod-$2$ shadow, and strictly weaker. *(ii) Openness or finiteness of the components.* Clause (3) counts and names them; that a quasi-compact subscheme meets finitely many is the citing node's deduction, and $\\pi_0(\\mathrm{Gr})$ is infinite whenever $X_*(T)/Q$ is (for $G = T$ a torus it is $X_*(T)$). *(iii) Anything about $LX$* for a spherical $X$: every clause is about $\\mathrm{Gr}$ for a group.\n\n  *What page-level check is still owed on (i).* Zhu attributes Thm. 1.3.11 to \"various places\" and names six references, of which his bibliography (printed p. 94) resolves the one he calls ultimate to **G. Pappas and M. Rapoport, *Twisted loop groups and their affine flag varieties*, Adv. Math. 219 (2008), no. 1, 118–198**, with an appendix by T. Haines and Rapoport. That is where the isomorphism of clause (3) is constructed as the Kottwitz homomorphism, and the normalization to check is that its restriction along $X_*(T)\\rightarrow T(F)\\rightarrow G(F)$, $\\mu\\mapsto t^\\mu$, is the valuation map followed by $X_*(T)\\twoheadrightarrow X_*(T)/Q$. **That paper is not in `papers/` and has no key in `refs.bib`**, so it cannot be cited from the blueprint as things stand; the check is owed, and closing it means fetching the PDF, giving it a key, and amending this entry with a clause (6). Pages searched and found not to carry the labelling, all in `papers/zhu2016introduction.pdf`: printed pp. 14–17 (§1.3 through Thm. 1.4.3, including Ex. 1.3.12), pp. 21–22 (§1.6–§1.7), pp. 23–27 (§2.1 entire), pp. 29–31 (§2.2–§2.3), pp. 58–61 (§5.1–§5.2). `pappas2013local` is in `refs.bib` and is **not** this paper — it is Pappas–Zhu on local models of Shimura varieties.\n- **note:** *What this entry supplies that the other $\\mathrm{Gr}$ entries leave to the citing node.* The second note of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html) records that \"each individual $\\overline{\\mathrm{Gr}}_\\lambda$ is therefore a proper scheme … is a deduction the citing node makes, not a line of this entry\", the ind-properness there being the manuscript's rather than Mirković–Vilonen's. Clause (2) above makes it a line: $\\overline{\\mathrm{Gr}}_\\mu$ is a projective variety, on the source's own page and over the standing $k$, so a finite union $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ is a projective $k$-scheme with no deduction owed. What this does **not** settle is whether the stages $\\mathrm{Gr}_n$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)(3) are the same family as the Schubert closures, or proper — that is a separate reading, and this entry does not touch it.\n- **note:** *Dictionary with the blueprint, and with the other $\\mathrm{Gr}$ entries.* The source writes $\\mathrm{Gr}_\\mu$ for the $L^+G$-orbit and $\\mathrm{Gr}_{\\le\\mu}$ for its closure; the blueprint writes $\\mathrm{Gr}^\\mu$ and $\\overline{\\mathrm{Gr}}_\\mu$ respectively ([$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)(1)–(2)), and the clauses above are transcribed into the blueprint's names. The source writes $t^\\mu$ for the point the blueprint calls $L_\\mu$, $\\mathbb{X}_\\bullet(T)$ for $X_*(T)$, $\\mathbb{X}_\\bullet(T)^+$ for $\\Lambda^+$, $L^+\\underline{G}$ for $K$, and $(2\\rho,\\mu)$ for the pairing $\\langle2\\rho,\\mu\\rangle$ — the last of these a reading, as in [Mirković–Vilonen](bb-mv-components-dimension.html). The source's $T$ is the *abstract Cartan* $B/[B,B]$ of its §0.3.5, embedded as a maximal torus when an embedding is needed, and §2.1 fixes such an embedding $T\\subseteq B\\subseteq G$; the blueprint's $T\\subseteq B\\subseteq G$ of [`subsec:notations`](subsec-notations.html) is that embedded torus. Over an algebraically closed field a connected reductive group is split, so the standing $G$ satisfies the source's §0.3.5 hypothesis; that sentence is the transcriber's, not the page's.\n\n  *Reducedness — the one place this source and [Mirković–Vilonen](bb-mv-components-dimension.html) disagree.* That entry declares $\\mathrm{Gr}$ reduced throughout, as its source does. This source does **not**: Remark 1.3.10 and Example 1.3.12(i), printed p. 15, record that $\\mathrm{Gr}_{\\mathbb{G}_m}$ is non-reduced, with $(\\mathrm{Gr}_{\\mathbb{G}_m})_{\\mathrm{red}} = \\pi_0(\\mathrm{Gr}_{\\mathbb{G}_m}) = \\mathbb{Z}$, and this is not a characteristic phenomenon. Nothing above is affected — $\\pi_0$ and dimension do not see nilpotents, and clause (2)'s cell and closure are declared reduced on the source's own page — but a node that needs $\\mathrm{Gr}$ itself reduced may not read that out of this entry.\n- **note:** *Provenance, verified on the page.* Read in `papers/zhu2016introduction.pdf` (arXiv:1603.05593**v2**, 4 Apr 2016; IAS/Park City Mathematics Series) on 2026-08-08 by the lead-researcher. Printed p. 15 carries verbatim: \"Here is a deeper application of loop groups. We assume that $k$ is algebraically closed and $\\underline{G}_F = \\underline{G}\\otimes F$ is connected reductive. Let $I = \\mathrm{Gal}(\\bar F/F)$ be the Galois group of $F$. It acts on the fundamental group $\\pi_1(\\underline{G}_F)$ of $\\underline{G}_F$. Let $\\pi_1(\\underline{G}_F)_I$ denote the group of coinvariants\", and then \"Theorem 1.3.11. (1) There is a canonical isomorphism $\\pi_0(L\\underline{G})\\cong\\pi_1(\\underline{G}_F)_I$. The map $L\\underline{G}\\rightarrow\\mathrm{Gr}_{\\underline{G}}$ induces an isomorphism $\\pi_0(L\\underline{G})\\cong\\pi_0(\\mathrm{Gr}_{\\underline{G}})$.\" Printed p. 23 opens §2: \"Let $F = k((t))$ and $\\mathcal{O} = k[[t]]$. Unless otherwise noted, we assume that $k$ is algebraically closed and $\\underline{G} = G\\otimes_k\\mathcal{O}$ is a constant reductive group scheme and write $\\mathrm{Gr}$ for $\\mathrm{Gr}_{\\underline{G}}$\", and carries (2.1.1), (2.1.2) and the definition of $t^\\mu$ transcribed in clause (1). Printed p. 24 defines $\\mathrm{Gr}_{\\le\\mu}$ \"endowed with the reduced scheme structure\" and $\\mathrm{Gr}_\\mu$ as the open complement of the smaller closures, and states Prop. 2.1.5(1); printed p. 25 states (2) and computes $\\dim\\mathrm{Gr}_\\mu = (2\\rho,\\mu)$ inside the proof. Printed p. 26 carries (2.1.10) and Corollary 2.1.11 verbatim as transcribed in clause (5), including the phrase \"and therefore induces a map $\\mathfrak{p}\\colon\\pi_0(\\mathrm{Gr}_G)\\rightarrow\\mathbb{Z}/2$ by Theorem 1.3.11\" — which is the source, in the constant split setting of its §2, using the reduction $\\pi_1(\\underline{G}_F)_I = \\pi_1(G)$ that clause (4) displays.";</script>
