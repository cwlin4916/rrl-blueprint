<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>def:shifted_vector_bundles</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>def:shifted_vector_bundles</code> — shifted vector bundles $V[n]$, $T^*[n]X$</h1><p class="lead">4. Shearing and graded geometry</p><div id="doc"></div></main><script>const SRC = "**Definition** (main.tex:468). Let $V$ be a finite-dimensional $k$-module and $(-)^*$ the $k$-linear dual. Set $V[n] := \\mathrm{sh}^{1/2}V(n)$, the derived affine $k$-scheme with coordinate ring\n\n$$\n\\mathrm{sh}^{1/2}\\left(\\mathrm{Sym}^\\bullet V(n)^*\\right) = \\bigoplus_{j\\ge 0}\\mathrm{sh}^{1/2}\\mathrm{Sym}^j(V^*)(-nj) = \\bigoplus_{j\\ge 0}\\mathrm{Sym}^j(V^*)[-nj].\n$$\n\nFor a scheme $X$ and $n\\in\\mathbb{Z}$, $T^*[n]X$ (cf. [[pantev2013shiftedsymplecticstructures, Def. 1.20](../../papers/pantev2013shiftedsymplecticstructures.pdf)]) is the relative spectrum $\\underline{\\mathrm{Spec}}_X$ of\n\n$$\n\\mathrm{sh}^{1/2}\\left(\\mathrm{Sym}^\\bullet\\mathcal{T}_X(-n)\\right) = \\bigoplus_{j\\ge 0}\\mathrm{Sym}^j\\mathcal{T}_X[-nj].\n$$\n\n- **role:** definition\n\n---\n\n<a id=\"s5\"></a>\n\n## 5. Sheaf theory on infinite-dimensional spaces";</script>
