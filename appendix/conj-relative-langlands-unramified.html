ified basic object $\\mathrm{IC}_0$, the $!$-extension of the constant $\\mathcal{D}$-module on $L^+X$, is sent to $\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n- **role:** standing hypothesis (the expanded form of [`Conj:intro`](conj-intro.html))\n- **note:** known cases are catalogued in [`exam:hyperspherical_duality`](exam-hyperspherical-duality.html).";</script>
