 exhibits the positive loop space $L^+X$ as a placid scheme ([`placid_ind_scheme`](placid-ind-scheme.html)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **role:** proved in main.tex — usable as a black box\n- **hypotheses:** $X$ smooth affine of finite type\n- **note:** applied to $X = G$ this presents $K = L^+G$ ([`subsec:notations`](subsec-notations.html)) as $\\varprojlim_m L^mG$ with the jet groups $L^mG$ as levels and homomorphic transitions; $L^1G = G$, so the level-one evaluation is evaluation at $t = 0$. Caveat transcribed from main.tex:710–717: if placid presentations are required to have *surjective* transitions, as in [[raskin_dmodules_infinite_var, §4.2](../../papers/raskin_dmodules_infinite_var.pdf)], the pieces $LX^i$ need not be placid in that stricter sense (see [[BZSV, Example 7.2.2](../../papers/BZSV.pdf)]).";</script>
