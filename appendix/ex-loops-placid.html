<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>loops, jets and positive loops are placid</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>loops, jets and positive loops are placid</code> — $L^nX$, $L^+X$, $LX$</h1><p class="lead">5. Sheaf theory on infinite-dimensional spaces</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L4/Q1-L4-L1/index.html">Q1-L4-L1</a>, <a href="../nodes/Q1-L4/Q1-L4-L2/index.html">Q1-L4-L2</a></dd></dl></div></main><script>const SRC = "**Example** (main.tex:694–718, unlabelled; cite by line). Let $X\\in\\mathrm{AffSch}^{f.t.}$ be smooth affine of finite type. The $n$-jets $L^nX$, defined on $k$-algebras by\n\n$$\nL^nX(R) := X\\left(R[t]/t^n\\right),\n$$\n\nare represented by affine schemes of finite type, and the presentation $L^+X\\simeq\\varprojlim_n L^nX$ exhibits the positive loop space $L^+X$ as a placid scheme ([`placid_ind_scheme`](#placid-ind-scheme)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **role:** proved in main.tex — usable as a black box\n- **hypotheses:** $X$ smooth affine of finite type\n- **used by:** [Q1-L4-L1](../nodes/Q1-L4/Q1-L4-L1/index.html), [Q1-L4-L2](../nodes/Q1-L4/Q1-L4-L2/index.html)\n- **note:** applied to $X = G$ this presents $K = L^+G$ ([`subsec:notations`](#subsec-notations)) as $\\varprojlim_m L^mG$ with the jet groups $L^mG$ as levels and homomorphic transitions; $L^1G = G$, so the level-one evaluation is evaluation at $t = 0$. Caveat transcribed from main.tex:710–717: if placid presentations are required to have *surjective* transitions, as in [[raskin_dmodules_infinite_var, §4.2](../../papers/raskin_dmodules_infinite_var.pdf)], the pieces $LX^i$ need not be placid in that stricter sense (see [[BZSV, Example 7.2.2](../../papers/BZSV.pdf)]).";</script>
