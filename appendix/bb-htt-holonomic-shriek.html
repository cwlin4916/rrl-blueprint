it need not be smooth, proper, flat, or non-characteristic for the object being restricted.\n\n- **role:** black box\n- **hypotheses:** $X$ and $Y$ smooth algebraic varieties and $f$ an arbitrary morphism between them. The hypothesis that carries the theorem is on the **object**, not on the morphism: the complex must have *holonomic* cohomology. Coherence alone does not suffice, and the source says so in as many words — §3.2.1, p. 84: \"neither $\\int_f$ nor $f^{\\dagger}$ preserves the coherency for general morphisms $f$\", with the witness at Remark 1.5.10, p. 33, where $f$ is a closed embedding with $\\dim X<\\dim Y$ and $D_{X\\rightarrow Y}=Lf^{*}D_Y$ is locally free of infinite rank over $D_X$. Since a holonomic complex is in particular coherent, the conclusion gives $f^{\\dagger}M\\in D^b_c(\\mathcal{D}_X)$ as a corollary, and that corollary is what a citing node uses.\n- **note:** *Dictionary with the blueprint's conventions.* Three lines, each of which a citing node inherits.\n\n  $f^{\\dagger}$ **is** the blueprint's $f^{!}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html) on $\\mathrm{AffSch}^{f.t.}$: the source's Prop. 1.5.16 identifies $i^{\\dagger}$ with $Ri^{\\flat}$, the right adjoint of $\\int_i$, which is the $!$-pullback the blueprint's Kan extension is built from. A degree shift affects neither coherence nor holonomicity, so the two may be used interchangeably inside this entry.\n\n  $D^b_c(\\mathcal{D}_Y)$ **is** $\\mathcal{D}_c(Y)$ of [`defn:coherent_D_mod`](defn-coherent-d-mod.html) for $Y$ smooth of finite type: the test $f=\\mathrm{id}$ gives one inclusion, and the source's Prop. 1.5.13(ii) — for $f$ smooth, $f^{*}$ is exact and carries coherent modules to coherent modules — gives the other. A scheme smooth over a smooth $Y$ is itself smooth, so admitting dg-scheme tests adds nothing here.\n\n  The source works over $\\mathbb{C}$, the blueprint over $k$ algebraically closed of characteristic $0$ ([`subsec:notations`](subsec-notations.html)). Nothing in the statement or in the dimension estimate behind it is sensitive to the difference; the transfer is declared by this entry rather than read off a line of the source.\n- **note:** **The bibliography key is absent, and adding one is the user's call.** `refs.bib` has no entry for this book. The key `HTT` and the file `papers/HTT.pdf` are **Lurie, *Higher Topos Theory*, Annals of Mathematics Studies 170** — a different book, verified on p. 1 of that PDF on 2026-08-06. `refs.bib` is manuscript territory and no agent writes it, so this entry carries the full bibliographic data in prose above and cites no key; a node invoking it must do the same.\n- **note:** *Provenance, and what is owed.* The book is not in `papers/`, so the page could not be opened on the run that wrote this entry. The theorem number, the page and the two quoted sentences reproduce a page-level reading made inside this repository on 2026-08-06 by an operator that had the book to hand; they were not re-verified here. A page-level check is owed before a write-up leans on the entry, and the cheapest way to discharge it is to put the PDF in `papers/` under whatever key the user chooses.";</script>
