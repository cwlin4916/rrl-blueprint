<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>def:generation</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>def:generation</code> — the generation operation $\langle-\rangle_{\mathcal{C}}$</h1><p class="lead">3. Generation, compactness and relative tensor products</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L1/index.html">Q1-L1</a>, <a href="../nodes/Q1-L2/index.html">Q1-L2</a>, <a href="../nodes/Q1-L2/Q1-L2-L2/index.html">Q1-L2-L2</a>, <a href="../nodes/Q1-L2/Q1-L2-L4/index.html">Q1-L2-L4</a>, <a href="../nodes/Q1-L5/index.html">Q1-L5</a>, <a href="../nodes/Q1-L5/Q1-L5-L1/index.html">Q1-L5-L1</a>, <a href="../nodes/Q1-L5/Q1-L5-L2/index.html">Q1-L5-L2</a>, <a href="../nodes/Q1-L5/Q1-L5-e2/index.html">Q1-L5-e2</a>, <a href="../nodes/Q1-L5/Q1-L5-e3/index.html">Q1-L5-e3</a>, <a href="../nodes/Q1-L6/index.html">Q1-L6</a></dd></dl></div></main><script>const SRC = "**Definition** (main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../context.html). Equivalently, by [[GR17vol1, Prop. 5.4.5](../../papers/GR17vol1.pdf)],\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0 \\ \\ \\forall i\\ge 0 \\implies c = 0 .\n$$\n\n- **role:** definition\n- **used by:** [Q1-L1](../nodes/Q1-L1/index.html), [Q1-L2](../nodes/Q1-L2/index.html), [Q1-L2-L2](../nodes/Q1-L2/Q1-L2-L2/index.html), [Q1-L2-L4](../nodes/Q1-L2/Q1-L2-L4/index.html), [Q1-L5](../nodes/Q1-L5/index.html), [Q1-L6](../nodes/Q1-L6/index.html), [Q1-L5-e2](../nodes/Q1-L5/Q1-L5-e2/index.html), [Q1-L5-e3](../nodes/Q1-L5/Q1-L5-e3/index.html), [Q1-L5-L1](../nodes/Q1-L5/Q1-L5-L1/index.html), [Q1-L5-L2](../nodes/Q1-L5/Q1-L5-L2/index.html)\n- **note:** *the ambient $\\mathcal{C}$ is part of the data and main.tex does not name it at the point of use, which is why the blueprint writes it as a subscript everywhere.* See the ratification recorded at [`def:satake_subcategory`](#def-satake-subcategory) and in [Q1-L1](../nodes/Q1-L1/index.html): for Satake subcategories the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$. \"Cocomplete stable\" is strictly stronger than \"thick\"; $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits, not merely finite ones and retracts.";</script>
