T$, write $X_*(T)$ for the cocharacter lattice, and let $\\mathrm{Gr}^\\lambda$ be the $G_{\\mathcal{O}}$-orbits of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)(1). The three clauses are **separately citable** and are stated at the source's generality; see the hypotheses line for the ground field.\n\n**(1) Components.** The connected components of $\\mathrm{Gr}$ are exactly parameterized by the component group of $G_{\\mathcal{K}}$, and that group is isomorphic to the topological fundamental group of $G$:\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ G_{\\mathcal{K}}/(G_{\\mathcal{K}})^0\\ \\cong\\ \\pi_1(G).\n$$\n\n**(2) The torus case.** If $G = T$ is a torus of rank $r$ then, as a reduced ind-scheme,\n\n$$\n\\mathrm{Gr}\\ \\cong\\ X_*(T) = \\mathrm{Hom}(\\mathbb{C}^*, T),\n$$\n\nthe right-hand side regarded as a discrete ind-scheme — a disjoint union of reduced points indexed by the lattice $X_*(T)$. In the source's words, \"in this case the loop Grassmannian is discrete\".\n\n**(3) Dimension.** If the parameter $\\lambda\\in X_*(T)$ of the orbit $\\mathrm{Gr}^\\lambda$ is chosen dominant, then\n\n$$\n\\dim\\left(\\mathrm{Gr}^\\lambda\\right)\\ =\\ \\langle 2\\rho,\\lambda\\rangle,\n$$\n\nwhere $\\rho\\in X^*(T)$ is half the sum of the positive roots with respect to $B$. (The source writes the right-hand side as $2\\rho(\\lambda)$.)\n\n- **role:** external black box\n- **hypotheses:** *Per clause.* Clause (1) needs $G$ connected reductive; it asserts a bijection onto a group and **not** that the group is finite — clause (2) exhibits $\\pi_0(\\mathrm{Gr})\\cong X_*(T)\\cong\\mathbb{Z}^r$, infinite for $r\\ge1$. Clause (2) needs $G = T$ a torus, and is an isomorphism of **reduced** ind-schemes only: p. 4 declares \"it suffices for our purposes to consider the spaces $G_{\\mathcal{O}}$, $G_{\\mathcal{K}}$, and $\\mathcal{G}r$ as reduced ind-schemes. We will do so for the rest of the paper\", so no non-reduced structure is asserted; a product of tori is a torus, so $G = T\\times T$ is covered. Clause (3) needs $G$ connected reductive, a choice of $B\\supset T$, and $\\lambda$ **dominant** for that choice — the formula is false for non-dominant $\\lambda$, whose orbit is $\\mathrm{Gr}^{\\lambda^+}$ for the dominant $W$-conjugate. *Ground field — a genuine narrowing, not a formality.* The source fixes $G$ **complex** with $\\mathcal{O} = \\mathbb{C}[[z]]$, $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing base field is any algebraically closed $k$ of characteristic $0$ ([`subsec:notations`](subsec-notations.html), [$F = k((t))$](conv-ring-of-integers.html)). **This entry is stated over $\\mathbb{C}$, at the source's generality, and is not asserted over the standing $k$**; unlike [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html), no line of main.tex re-asserts any of these three facts at the standing generality, so there is no manuscript authority to lean on. A node citing any clause over $k\\neq\\mathbb{C}$ is making a **declared widening** and must say so. For clauses (2) and (3) the widening is the routine one — read $\\mathbb{G}_m$ for $\\mathbb{C}^*$ and $k[[t]]$, $k((t))$ for $\\mathcal{O}$, $\\mathcal{K}$. For clause (1) it is not routine: \"the topological fundamental group of $G$\" has no meaning over a general $k$, so over $k$ the right-hand side must be replaced by the algebraic fundamental group, equivalently by $X_*(T)/Q$ with $Q$ the coroot lattice — and that replacement is not on the source's page and is **not carried by this entry**.\n- **note:** *Which combination buys what, and why neither half may be dropped.* Clauses (1) and (3) are what a finiteness argument for the stages of $\\mathrm{Gr}$ needs **together**: a quasi-compact stage meets only finitely many components, which is clause (1) doing its work, and inside one component the bound $\\langle2\\rho,\\mu\\rangle\\le\\dim\\mathrm{Gr}_n$ of clause (3) confines the dominant $\\mu$ to a bounded region of the dominant cone. Clause (2) **alone** suffices for a weaker but separately useful conclusion: when $G$ is a torus the components are single reduced points, so a quasi-compact stage meets finitely many of them and the dimension formula is not needed at all. The trap this note exists to close: **this is not a dimension argument alone.** For a torus every orbit is $0$-dimensional, so clause (3) is vacuous there and the finiteness is carried entirely by the $\\pi_0$ half — which is why neither clause (1) nor clause (3) can be dropped from the general argument. Commissioned by [round 2 of Q1-L3-L2's critique](../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r2.html) §B.\n- **note:** *What this entry does not carry, and a citing node must supply.* Four things the clauses above stop short of. (i) **Openness of the components**: clause (1) counts and names them and says nothing about whether they are open, so the step \"a quasi-compact subscheme meets finitely many components\" is the citing node's deduction — the usual route is that each stage is of finite type, hence has finitely many connected components, all open in it. (ii) **The labelling of components by coweights**: the step \"inside one component the dominant $\\mu$ lie in a single coset of the coroot lattice\" needs the algebraic identification $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ **under which the component of $L_\\mu$ is the class of $\\mu$**, and clause (1) as printed gives neither the lattice description nor the labelling. [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](gr-schubert.html)(2) supplies only the converse implication — comparable in the closure order forces congruence mod $Q$. The nearest thing the appendix carries is the left-hand column of [Chen–Yi filtered orbit order and $\\pi_0(LX)$](bb-chenyi-filtered-orbit-order.html)(a), $\\pi_0(LG)\\cong\\pi_1(G)\\cong\\Lambda_T/Q$, which is stated there under that entry's own symmetric-variety hypotheses and about $LG$ rather than $\\mathrm{Gr}$. (iii) **Finiteness of $\\pi_0(\\mathrm{Gr})$** — false in general, see the hypotheses line. (iv) **Any statement about $LX$** for a spherical $X$: all three clauses are about $\\mathrm{Gr}$ for a group.\n- **note:** *Provenance, verified on the page.* Read in `papers/mirkovic2007geometric.pdf` on 2026-08-07 by the lead-researcher, pages carrying the printed numbers 4 and 5 (running heads \"I. MIRKOVIĆ AND K. VILONEN\" and \"LANGLANDS DUALITY AND ALGEBRAIC GROUPS\"). Printed p. 4 opens \"Let $G$ be a complex, connected, reductive algebraic group. We write $\\mathcal{O}$ for the formal power series ring $\\mathbb{C}[[z]]$ and $\\mathcal{K}$ for its fraction field $\\mathbb{C}((z))$\", and carries verbatim: \"If $G=T$ is torus of rank $r$ then, as a reduced ind-scheme, $\\mathcal{G}r\\cong X_*(T)=\\mathrm{Hom}(\\mathbb{C}^*,T)$, i.e., in this case the loop Grassmannian is discrete\"; and \"Note also that the connected components of $\\mathcal{G}r$ are exactly parameterized by the component group of $G_{\\mathcal{K}}$, i.e., by $G_{\\mathcal{K}}/(G_{\\mathcal{K}})^0$. This latter group is isomorphic to $\\pi_1(G)$, the topological fundamental group of $G$.\" Printed p. 5 carries: \"If we choose a Borel $B$ containing $T$ and if we choose the parameter $\\lambda\\in X_*(T)$ of the orbit $\\mathcal{G}r^\\lambda$ to be dominant, then $\\dim(\\mathcal{G}r^\\lambda)=2\\rho(\\lambda)$, where $\\rho\\in X^*(T)$, as usual, is half the sum of positive roots with respect to $B$.\" The source writes $\\mathcal{G}r$ where the blueprint writes $\\mathrm{Gr}$ and $G_{\\mathcal{O}}$ where the blueprint writes $K = L^+G$. Two readings are the transcriber's and not the page's: that \"$\\mathcal{G}r\\cong X_*(T)$\" means the discrete ind-scheme on the lattice, and that $2\\rho(\\lambda)$ means the pairing $\\langle2\\rho,\\lambda\\rangle$.";</script>
