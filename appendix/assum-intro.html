<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>assum:intro</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>assum:intro</code> — `assum:intro`</h1><p class="lead">1. Standing setup, assumptions and main statements</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L3/index.html">Q1-L3</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html">Q1-L3-L3-L1</a>, <a href="../nodes/Q1/Q1-L3/Q1-L3-L5/index.html">Q1-L3-L5</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-e1/index.html">Q1-L4-e1</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-e2/index.html">Q1-L4-e2</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-e3/index.html">Q1-L4-e3</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-e4/index.html">Q1-L4-e4</a>, <a href="../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L3/index.html">Q1-L5-L3-L3</a>, <a href="../nodes/Q1/Q1-L5/Q1-L5-e1/index.html">Q1-L5-e1</a>, <a href="../nodes/Q1/Q1-L5/Q1-L5-e2/index.html">Q1-L5-e2</a>, <a href="../nodes/Q1/Q1-L5/Q1-L5-e3/index.html">Q1-L5-e3</a>, <a href="../nodes/Q1/Q1-L5/Q1-L5-e4/index.html">Q1-L5-e4</a>, <a href="../nodes/Q1/Q1-e4/index.html">Q1-e4</a>, <a href="../nodes/Q2/Q2-e1/Q2-e1-L5/index.html">Q2-e1-L5</a>, <a href="../nodes/Q2/Q2-e2/Q2-e2-L2/index.html">Q2-e2-L2</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [`Conj:intro`](conj-intro.html) holds for $X$.\n\n- **role:** standing hypothesis — in force for every node of the DAG unless a node says otherwise\n- **note:** (a) is exactly the conclusion of [`thm:chen_Ti`](thm-chen-ti.html) for $X$ smooth affine spherical, so it is not an extra restriction in that generality; it is stated as an assumption because main.tex wants it available before the sheaf-theoretic section. (b) is what makes $\\mathcal{D}^!$ and $\\mathcal{D}^*$ agree ([`ex:sheaf_placid_ind`](ex-sheaf-placid-ind.html)). (c) is the input the whole paper is conditional on.\n\n**Key spherical varieties.** The class these hypotheses carve out is abstract, so the rows below fix the concrete $(G,X)$ this project keeps in mind — simplest first, then the two instructive ways to fall out of the class. \"(c)\" is hypothesis (c) above. The rows are orientation pointers, at the user's direction (2026-08-04): each writes its action out and its period name links to where the case is developed — the example node when the tree has one, the catalogue [`exam:hyperspherical_duality`](exam-hyperspherical-duality.html) otherwise — but the duals, the hypotheses and the sources live in the catalogue and the nodes, never in a row, and no proof may cite one. [`def:polarized_hyperspherical`](def-polarized-hyperspherical.html) fixes right actions; the two rows presented as left quotients say so and act by left translation.\n\n| $X$ | acted on by — the action | period | where (c) stands | in the tree |\n|---|---|---|---|---|\n| $G$ | $G\\times G$ — two-sided translation, $x\\cdot(g_1,g_2)=g_1^{-1}x\\,g_2$ | [group case](../nodes/Q1/Q1-e1/index.html) | **proved** — derived Satake [[bezrukavnikov2008equivariant, Thm 5](../../papers/bezrukavnikov2008equivariant.pdf)] | [Q1-e1](../nodes/Q1/Q1-e1/index.html) |\n| $\\mathbb{A}^1$ | $\\mathbb{G}_m$ — scaling, $x\\cdot t=tx$ | [Iwasawa–Tate](../nodes/Q1/Q1-e2/index.html) | **verified by hand** — [[BZSV, Ex. 7.6.1](../../papers/BZSV.pdf)] | [Q1-e2](../nodes/Q1/Q1-e2/index.html) |\n| $M_n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — two-sided translation on $n\\times n$ matrices, $m\\cdot(g_1,g_2)=g_1^{-1}m\\,g_2$ | [Godement–Jacquet](../nodes/Q1/Q1-e4/index.html) | **proved** — [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] | [Q1-e4](../nodes/Q1/Q1-e4/index.html) |\n| $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation on cosets, $\\mathrm{Sp}_{2n}x\\cdot g=\\mathrm{Sp}_{2n}xg$ | [symplectic (Jacquet–Rallis)](../nodes/Q1/Q1-e5/index.html); its dual is the Shalika side | **proved** — quaternionic Satake [[chen2022quaternionic](../../papers/chen2022quaternionic.pdf)]; the $B$-stabilizer connectedness of the standing class is not discharged in those sources | [Q1-e5](../nodes/Q1/Q1-e5/index.html) |\n| $(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation, $Hx\\cdot g=Hxg$ for $H=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ block-diagonal | [linear periods](exam-hyperspherical-duality.html) | **upcoming** work of Chen–Yi; the orbit geometry is already in print ([Chen–Yi orbit parametrization](bb-chenyi-symmetric-orbits.html)) | — |\n| $\\mathrm{SO}_{n-1}\\backslash(\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n)$ | $\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n$ — right translation, $Hx\\cdot g=Hxg$, where $H=\\mathrm{SO}_{n-1}$ sits diagonally, $h\\mapsto(h,h)$, via $\\mathrm{SO}_{n-1}\\subset\\mathrm{SO}_n$ | [Gan–Gross–Prasad / theta](exam-hyperspherical-duality.html) | **proved** — [[BFT_orthosymplectic_satake](../../papers/BFT_orthosymplectic_satake.pdf)] | — |\n| rank-$1$ affine homogeneous $X=H\\backslash G$ | various $G$ — right translation, $Hx\\cdot g=Hxg$ | [rank one](exam-hyperspherical-duality.html) | **proved under hypotheses** — [[devalapurkar2024kutheoreticspectraldecompositionsspheres, Table 4](../../papers/devalapurkar2024kutheoreticspectraldecompositionsspheres.pdf)] | — |\n| $G/_{\\psi}U$ | $G$ — left translation through $G/U$, $g:xU\\mapsto gxU$, $U$ maximal unipotent; the twist is the generic character $\\psi$ of $U$ | [Whittaker](../nodes/Q1/Q1-e3/index.html) | *outside the untwisted class* — twisted polarization; the equivalence per [[BZSV, §7.6.4](../../papers/BZSV.pdf)]; kept because it supplies [ABG](bb-abg.html) at Iwahori level | [Q1-e3](../nodes/Q1/Q1-e3/index.html) |\n| $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | $\\mathrm{PSL}_2$ — left translation, $g:x\\,\\mathrm{PO}_2\\mapsto gx\\,\\mathrm{PO}_2$ | [boundary case](../nodes/Q1/Q1-e6/index.html) | *outside the class* — a type-$N$ spherical root breaks connected stabilizers, and the expected statement itself changes shape | [Q1-e6](../nodes/Q1/Q1-e6/index.html) |\n\nThe first four rows are where (c) is a theorem or a verified computation — the working instances of the standing class — with the linear periods next in line. $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, the linear periods and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ are symmetric, the territory where the [Chen–Yi orbit machinery](bb-chenyi-symmetric-orbits.html) applies and [Q1-L6](../nodes/Q1/Q1-L6/index.html)'s induction closes. The last two rows are kept deliberately: Whittaker for the Iwahori-level black box it supplies, and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ because it shows clause (2) of [`def:polarized_hyperspherical`](def-polarized-hyperspherical.html) is load-bearing.";</script>
