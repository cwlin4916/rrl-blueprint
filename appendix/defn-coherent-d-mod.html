<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>defn:coherent_D_mod</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>defn:coherent_D_mod</code> — coherent $\mathcal{D}$-modules</h1><p class="lead">5. Sheaf theory on infinite-dimensional spaces</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1-L1/index.html">Q1-L1</a>, <a href="../nodes/Q1-L2/Q1-L2-L1/index.html">Q1-L2-L1</a>, <a href="../nodes/Q1-L3/index.html">Q1-L3</a>, <a href="../nodes/Q1-L4/Q1-L4-L3/index.html">Q1-L4-L3</a>, <a href="../nodes/Q1-L4/Q1-L4-L4/index.html">Q1-L4-L4</a>, <a href="../nodes/Q1-L5/Q1-L5-L1/index.html">Q1-L5-L1</a>, <a href="../nodes/Q1-L5/Q1-L5-L2/index.html">Q1-L5-L2</a>, <a href="../nodes/Q1-L5/Q1-L5-L3/index.html">Q1-L5-L3</a>, <a href="../nodes/Q1-L5/Q1-L5-L4/index.html">Q1-L5-L4</a>, <a href="../nodes/Q1-L5/Q1-L5-L5/index.html">Q1-L5-L5</a>, <a href="../nodes/Q1-L5/Q1-L5-L6/index.html">Q1-L5-L6</a></dd></dl></div></main><script>const SRC = "**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **role:** definition\n- **used by:** [Q1-L1](../nodes/Q1-L1/index.html), [Q1-L2-L1](../nodes/Q1-L2/Q1-L2-L1/index.html), [Q1-L3](../nodes/Q1-L3/index.html), [Q1-L4-L3](../nodes/Q1-L4/Q1-L4-L3/index.html), [Q1-L4-L4](../nodes/Q1-L4/Q1-L4-L4/index.html), [Q1-L5-L1](../nodes/Q1-L5/Q1-L5-L1/index.html), [Q1-L5-L2](../nodes/Q1-L5/Q1-L5-L2/index.html), [Q1-L5-L3](../nodes/Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L4](../nodes/Q1-L5/Q1-L5-L4/index.html), [Q1-L5-L5](../nodes/Q1-L5/Q1-L5-L5/index.html), [Q1-L5-L6](../nodes/Q1-L5/Q1-L5-L6/index.html)\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](#conv-d-shriek-d-star)); ratified at [Q1-L1](../nodes/Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.";</script>
