tor of an object $a\\in\\mathcal{A}$ on a module $\\mathcal{M}$ is $k$-linear and exact, so for $m\\in\\mathcal{M}$ and $n\\in\\mathbb{Z}$\n\n$$\na\\ast(m[n])\\ \\simeq_{\\mathcal{M}}\\ (a\\ast m)[n]\\ \\simeq_{\\mathcal{M}}\\ (a[n])\\ast m .\n$$\n\n- **role:** convention\n- **used by:** [Q1-L1](../nodes/Q1-L1/index.html), [Q1-L2-L3](../nodes/Q1-L2/Q1-L2-L3/index.html)\n- **note:** the last display is only $k$-linearity of the action bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$, but it is what makes a Hecke-generated family stable under shifts, so it is recorded here rather than re-derived at each use.";</script>
