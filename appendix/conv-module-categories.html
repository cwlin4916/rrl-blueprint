<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>module categories over a monoidal category</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>module categories over a monoidal category</code></h1><p class="lead">4. Module categories, relative tensor products and rigidity</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L1/index.html">Q1-L1</a>, <a href="../nodes/Q1/Q1-L2/Q1-L2-L3/index.html">Q1-L2-L3</a>, <a href="../nodes/Q1/Q1-L2/Q1-L2-L3/Q1-L2-L3-z1/index.html">Q1-L2-L3-z1</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Convention** (main.tex:589–602, an unlabelled subsection; cite by line). Following [[HA](../../papers/HA.pdf)], a *monoidal category* is an algebra object of $\\mathrm{DGCat}$ ([`DGCat`, `Vect`](conv-dgcat.html)). For $\\mathcal{A}$ monoidal, $\\mathrm{LMod}_{\\mathcal{A}}$ (resp. $\\mathrm{RMod}_{\\mathcal{A}}$) is the category of left (resp. right) $\\mathcal{A}$-module objects in $\\mathrm{DGCat}$ [[HA, §4.2–4.3](../../papers/HA.pdf)], and\n\n$$\n\\mathrm{LMod}_{\\mathcal{A}}\\simeq\\mathrm{RMod}_{\\mathcal{A}^{\\mathrm{rev}}},\\qquad {}_{\\mathcal{A}}\\mathrm{BMod}_{\\mathcal{B}}\\simeq\\mathrm{LMod}_{\\mathcal{A}\\otimes\\mathcal{B}^{\\mathrm{rev}}};\n$$\n\nfor $\\mathcal{M}\\in{}_{\\mathcal{A}}\\mathrm{BMod}_{\\mathcal{B}}$, Lurie's relative tensor product [[HA, §4.8.1](../../papers/HA.pdf)] gives $\\mathcal{M}\\otimes_{\\mathcal{B}}(-)\\colon\\mathrm{LMod}_{\\mathcal{B}}\\rightarrow\\mathrm{LMod}_{\\mathcal{A}}$. The same definitions are used with $\\mathrm{DGCat}$ replaced by $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$ for the small categories ([`def:small_relative_tensor`](def-small-relative-tensor.html)), the two matching under $\\mathrm{Ind}$. In either ambient the action functor of an object $a\\in\\mathcal{A}$ on a module $\\mathcal{M}$ is $k$-linear and exact, so for $m\\in\\mathcal{M}$ and $n\\in\\mathbb{Z}$\n\n$$\na\\ast(m[n])\\ \\simeq_{\\mathcal{M}}\\ (a\\ast m)[n]\\ \\simeq_{\\mathcal{M}}\\ (a[n])\\ast m .\n$$\n\n- **role:** convention\n- **note:** the last display is only $k$-linearity of the action bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$, but it is what makes a Hecke-generated family stable under shifts, so it is recorded here rather than re-derived at each use.";</script>
