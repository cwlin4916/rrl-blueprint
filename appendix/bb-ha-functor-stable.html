<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>functor categories and products of stable categories are stable</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>functor categories and products of stable categories are stable</code></h1><p class="lead">2. Higher-categorical conventions</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q4/Q4-e1/index.html">Q4-e1</a>, <a href="../nodes/Q4/Q4-e2/index.html">Q4-e2</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** ([[HA, Prop. 1.1.3.1 and Prop. 1.1.4.3](../../papers/HA.pdf)]; external, no main.tex label).\n\n**(1) Functor categories** *([[HA, Prop. 1.1.3.1](../../papers/HA.pdf)], printed p. 30)*. Let $\\mathcal{C}$ be a stable $\\infty$-category, and let $K$ be a simplicial set. Then the $\\infty$-category $\\mathrm{Fun}(K,\\mathcal{C})$ is stable. The source's proof is one sentence: *\"This follows immediately from the fact that fibers and cofibers in $\\mathrm{Fun}(K,\\mathcal{C})$ can be computed pointwise (Proposition HTT.5.1.2.2).\"*\n\n**(2) Products** *([[HA, Prop. 1.1.4.3](../../papers/HA.pdf)], printed p. 34)*. Let $\\{\\mathcal{C}_\\alpha\\}_{\\alpha\\in A}$ be a collection of stable $\\infty$-categories. Then the product\n\n$$\n\\mathcal{C} = \\prod_{\\alpha\\in A}\\mathcal{C}_\\alpha\n$$\n\nis stable. Moreover, for any stable $\\infty$-category $\\mathcal{D}$, a functor $F\\colon\\mathcal{D}\\rightarrow\\mathcal{C}$ is exact if and only if each of the compositions $\\mathcal{D}\\xrightarrow{F}\\mathcal{C}\\rightarrow\\mathcal{C}_\\alpha$ is an exact functor. The source's proof is again one sentence: *\"This follows immediately from the fact that limits and colimits in $\\mathcal{C}$ are computed pointwise.\"*\n\n- **role:** external black box\n- **hypotheses:** for (1), $\\mathcal{C}$ stable and $K$ an arbitrary simplicial set — no smallness of $K$, no presentability of $\\mathcal{C}$, and no hypothesis on $\\mathcal{C}$ beyond stability. For (2), each $\\mathcal{C}_\\alpha$ stable, with the index set $A$ arbitrary.\n- **note:** **Neither clause supplies presentability, and for a functor category this appendix cannot.** That $\\mathrm{Fun}(K,\\mathcal{C})$ is presentable when $K$ is small and $\\mathcal{C}$ is presentable is [[HTT, Prop. 5.5.3.6](../../papers/HTT.pdf)], and the key `HTT` has **no entry in `refs.bib`** — a gap recorded in the \"Known gaps\" section of [`papers/guideline.md`](../papers/guideline.html) — so no entry here may carry it. A node needing a functor category to be presentable owes that hypothesis and must say so at the point of use. For a **product** the situation is different and presentability is available: a product is a small limit, and clause (1) of [Colimits of presentable categories, and the subcategory generated by a small set](bb-prl-colimits.html) states that $\\mathrm{Pr}^L$ admits all small limits with the inclusion $\\mathrm{Pr}^L\\subseteq\\widehat{\\mathrm{Cat}}_\\infty$ preserving them, so a product of presentable categories, formed in $\\widehat{\\mathrm{Cat}}_\\infty$, is presentable.\n- **note:** **What the two clauses are for.** Clause (1) is what makes the arrow category $\\mathrm{Fun}(\\Delta^1,\\mathcal{C})$ — the smallest category carrying a genuinely glued two-member coreflective family, as against a split one — available as a model; clause (2) is what makes a product available as the split model against which the glued one is contrasted. Colimits in both are computed pointwise, which is the same sentence the source's two proofs use, so cocompleteness of either transfers from $\\mathcal{C}$ without further citation.\n- **note:** *Provenance.* Read in `papers/HA.pdf` on 2026-08-08. In that file the printed page number and the PDF page number coincide: Prop. 1.1.3.1 is on p. 30, in §1.1.3 *Closure Properties of Stable $\\infty$-Categories*, and Prop. 1.1.4.3 on p. 34, in §1.1.4 *Exact Functors*. The bib key `HA` is present in `refs.bib`.";</script>
