<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Chen–Yi: an orbit closure in LX contains only finitely many orbits</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Chen–Yi: an orbit closure in <span class="math" data-display="0" data-tex="LX"></span> contains only finitely many orbits — symmetric $X$ only</h1><p class="lead">10. Orbits, closures and standard objects on $LX$</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/index.html">Q1-L5-L3-L4</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Cor. 27, p. 17](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/K$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$, $K = G^\\theta$ its fixed-point subgroup, assumed **connected**, and $I_0\\subseteq L^{+}G$ the Iwahori subgroup attached to the $\\theta$-stable Borel $B_0$. Then, in the source's own words:\n\n1. *(Cor. 27(i))* The closure of each $I_0$-orbit contains only finitely many $I_0$-orbits.\n2. *(Cor. 27(ii))* Each $L^{+}G$-orbit on $LX$ is a union of finitely many $I_0$-orbits.\n\n**Usable form, obtained here by derivation and not quoted from the source.** For every $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](def-orbit-closure.html)) contains only finitely many $L^{+}G$-orbits; that is, the set $\\{\\mu\\in\\Lambda_X^+\\mid LX_\\mu\\subseteq\\overline{LX}_\\lambda\\}$ is finite.\n\n- **role:** external black box; the displayed usable form is a derivation of this entry, flagged as such below\n- **hypotheses:** three, of which the first does the work.\n\n  ***$X$ is symmetric.*** This is the hypothesis the statement rests on, and it is not removable by any remark in the source. Cor. 27 sits in §4 *Iwahori orbits* (pp. 14–20) and its proof is two lines, each of which invokes Lemma 26, p. 17 — \"The map $p\\colon\\mathcal{V}\\rightarrow\\mathcal{I}$ has finite fibers\" — whose own proof runs through the twisted-conjugation map $\\tau(g) = g\\theta(g)^{-1}$, the set $\\mathcal{V} = \\{g\\in LG\\mid\\tau(g)\\in N_{LG}(LT_0)\\}$ of §4.1, p. 15, the representatives $\\tau(\\dot v) = \\bar n_v t^\\lambda$ of Lemma 25, p. 17, the involutions $\\psi_{\\bar v} = \\mathrm{Ad}_{\\bar n_v}\\circ\\theta$, and the finiteness of $\\pi_0\\left(T_0^{\\mathrm{inv}\\circ\\psi_{\\bar v}}\\right)$. Every one of these objects presupposes the involution $\\theta$ and the presentation $X = G/K$. **So finitely many $L^{+}G$-orbits in a closure is sourced for symmetric $X$ only, and is not available for general spherical $X$.**\n\n  *$K = G^\\theta$ is connected.* The source declares this at the head of §4, p. 14: \"We will assume $K$ is connected from Section 4-Section 10. In the last Section 11, we discuss the case when $K$ is disconnected.\" Cor. 27 is inside that range, so the hypothesis is in force for it and a node may not drop it on the strength of §11 without reading §11.\n\n  *$\\Lambda_X^+$ is the source's $\\Lambda_S^+$.* The derived form above is stated in the blueprint's index set ([`def:orbits_iwahori_spherical`](def-orbits-iwahori-spherical.html)); the identification with the dominant restricted coweights $\\Lambda_S^+$ is clause 1 of [Chen–Yi symmetric orbit parametrization and closure relation](bb-chenyi-symmetric-orbits.html), which carries the same symmetric hypothesis.\n- **note:** *The derivation, in full, so a reader can audit it.* By Cor. 27(ii) write $LX_\\lambda = \\mathcal{O}_{v_1}\\cup\\cdots\\cup\\mathcal{O}_{v_n}$, a finite union of $I_0$-orbits. Closure commutes with a finite union, so $\\overline{LX}_\\lambda = \\overline{\\mathcal{O}}_{v_1}\\cup\\cdots\\cup\\overline{\\mathcal{O}}_{v_n}$, and by Cor. 27(i) each $\\overline{\\mathcal{O}}_{v_i}$ contains only finitely many $I_0$-orbits; hence $\\overline{LX}_\\lambda$ contains only finitely many $I_0$-orbits. Now $I_0\\subseteq L^{+}G$, so every $L^{+}G$-orbit contained in $\\overline{LX}_\\lambda$ contains at least one $I_0$-orbit contained in $\\overline{LX}_\\lambda$, and distinct $L^{+}G$-orbits are disjoint. Finiteness follows. **This is an inference of the entry, not a corollary printed in the source**, and a node relying on it is relying on the entry rather than on a page.\n\n  *An immediate consequence when combined with the closure relation.* [Chen–Yi symmetric orbit parametrization and closure relation](bb-chenyi-symmetric-orbits.html), clause 2 (the source's Thm. 18) gives $\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$ for symmetric $X$, so under that entry's hypotheses the derived form says exactly that each down-set $\\{\\lambda\\in\\Lambda_S^+\\mid\\lambda\\le\\mu\\}$ is finite. That is a statement about the closure order alone, and it inherits both entries' symmetric hypothesis.\n- **note:** **Two distinct scope limits ride on the same Remark 37, and they must not be conflated.** [[chenyi_2025singularitiesorbitclosuresloop, Rem. 37, p. 22](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] reads in full: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites, Theorem 36 remains true for general spherical varieties.\" It extends Theorem 36 and nothing else.\n\n  The limit recorded on [`thm:chen_Ti`](thm-chen-ti.html) is that Remark 37 reaches clause (a) — placidity of the closures and finite presentation of the embeddings — and does **not** reach clause (b), the placid presentation of $LX$, because that is deduced from Lemma 38 (filteredness, p. 22), which the remark does not mention and whose proof is symmetric.\n\n  The limit recorded here is different in kind: Cor. 27 is not a clause of Theorem 36 at all. It lives two sections earlier, is proved by the symmetric-space machinery of §4, and Remark 37 says nothing whatever about it. So a node may not argue \"Remark 37 extends the results of the source to general spherical $X$\" and thereby acquire finiteness of the orbit set in a closure. The two limits share a remark and share nothing else.\n- **note:** *The source's own Appendix A.8 treats this as a hypothesis, not a theorem.* [[chenyi_2025singularitiesorbitclosuresloop, §A.8 *Pointwise purity*, p. 62](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] opens by fixing a locally equidimensional $H$-placid scheme $Y$ and assuming, among three standing conditions, \"(2) $Y$ is a union of finitely many $H$-orbits and for any orbit $\\mathcal{O}\\subset Y$ the inclusion $j\\colon\\mathcal{O}\\rightarrow Y$ is finitely presented.\" The source therefore assumes finiteness of the orbit set where it needs it rather than deriving it in that generality — which corroborates that it is a hypothesis and not a general theorem about placid orbit closures.\n- **note:** *Dictionary with the blueprint's conventions.* Three lines, one of which is a declared transfer.\n\n  **The Iwahori.** The source's $I_0$ is the Iwahori attached to the **$\\theta$-stable** Borel $B_0$ (§4.1, p. 14), while the blueprint's $I$ is the Iwahori attached to a chosen Borel $B$ ([`subsec:notations`](subsec-notations.html), main.tex:212). Reading the statement with the blueprint's $\\mathcal{O}_v$ of [`def:orbits_iwahori_spherical`](def-orbits-iwahori-spherical.html) requires taking $B = B_0$; that choice is available in the symmetric setting and is **declared here**, not read off a line of either text. The same identification is already in force in [Chen–Yi filtered orbit order and $\\pi_0(LX)$](bb-chenyi-filtered-orbit-order.html).\n\n  **Field.** The source's standing field is $k = \\overline{\\mathbb{F}}_p$ of characteristic $p\\ne 2$ (§2.1, p. 9, repeating the opening of §1, p. 2), whereas the blueprint's $k$ is algebraically closed of characteristic $0$ ([`subsec:notations`](subsec-notations.html)). The source addresses this itself at §1.2.6, p. 9: \"In this paper, we work with $\\ell$-adic sheaves on schemes over fields of positive characteristic since Deligne's theory of weights plays a crucial role. The proofs are all geometric and hence are applicable in the setting of $D$-modules on schemes over complex numbers where one uses Saito's theory of mixed Hodge modules.\" That sentence is about the *sheaf-theoretic* arguments; Cor. 27 is not one of those — its proof is group-theoretic throughout, using only $\\tau$, $N_{LG}(LT_0)$, the Bruhat decomposition of $I_0$-double cosets and $\\pi_0$ of a fixed-point torus. **The transfer to the blueprint's characteristic-$0$ $k$ is declared by this entry rather than read off a line of the source**, in the same terms as the transfer declared on [$!$-restriction preserves holonomicity](bb-htt-holonomic-shriek.html). A closely related but weaker sourced statement is the source's Rem. 19, p. 10, which says its argument for Thm. 18 \"is algebraic and works over an arbitrary algebraically closed field whose characteristic is not two\"; that remark is attached to Thm. 18 and not to Cor. 27.\n\n  **Orbit strata.** \"Orbit\" in the blueprint is fixed by the ratified reading on [`def:orbits_iwahori_spherical`](def-orbits-iwahori-spherical.html) as the fpqc-sheaf image of an orbit map, represented by a locally closed stratum; the finiteness assertions above are counts of those strata, and closures are the reduced ones of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](def-orbit-closure.html).\n- **note:** *Provenance, verified on the page.* Read in `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025, dated July 11 2025). Corollary 27 with its two-line proof is on **p. 17**, immediately after Lemma 25 and Lemma 26 on the same page; §4 *Iwahori orbits* opens on p. 14 and §5 opens on p. 20, so §4 occupies pp. 14–19. Remark 37 is on p. 22, Theorem 36 on p. 21, §A.8 on p. 62, §1.2.6 and §2.1 on p. 9. One notational flattening: the source distinguishes a script $V$, the quotient $L^{+}T_0\\backslash\\mathcal{V}/LK$ indexing $I_0$-orbits, from the calligraphic $\\mathcal{V}\\subseteq LG$ of §4.1, and writes the twisted involutions in the extended affine Weyl group with a script $I$; all of these are written $\\mathcal{V}$ and $\\mathcal{I}$ above, so a node needing the distinction should go to pp. 15–17 rather than take it from here.";</script>
