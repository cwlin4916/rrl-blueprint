<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">appendix</a><i>›</i><span>Raskin: in infinite type, holonomic does not imply coherent</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1><code>Raskin: in infinite type, holonomic does not imply coherent</code></h1><p class="lead">8. Coherence, renormalization and holonomicity</p><div id="doc"></div><div class="meta"><dl><dt>used by</dt><dd><a href="../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/index.html">Q1-L5-L3-L4</a></dd></dl></div></main><script>const SRC = "[appendix](index.html) · [DAG index](../dag.html) · [context](../context.html)\n\n**Definition, and the warning it carries** ([[raskin_dmodules_infinite_var, §5.1–§5.2, pp. 30–31, with §6.19, p. 44](../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). Let $S$ be a scheme of finite type, let $D_{coh}(S)\\subseteq D(S)$ be the compact objects, and let $D_{coh,hol}(S)\\subseteq D_{coh}(S)$ be the full subcategory of those coherent complexes whose cohomologies are holonomic in the usual sense. The source **defines** the holonomic category to be the ind-completion\n\n$$\nD_{hol}(S) := \\mathrm{Ind}\\left(D_{coh,hol}(S)\\right)\\subseteq D(S),\n$$\n\nand extends it to a quasi-compact quasi-separated $S$ by Kan extension, as $D^!_{hol}(S)$ and $D^*_{hol}(S)$, and to an indscheme likewise in §6.19. Consequently\n\n$$\nD_{hol}(S)\\not\\subseteq D_{coh}(S)\n$$\n\n**by construction**: an ind-completion has non-compact objects, and for $S$ of finite type $D_{coh}(S)$ *is* the subcategory of compact objects. The source states the intent in as many words at Rem. 5.1.1, p. 30 — \"Since many 'standard' $D$-modules in infinite type are not compact (e.g., the delta $D$-module concentrated at a point in an infinite type placid scheme), it is convenient to break conventions with the usual $D$-module theory and allow some non-compact $D$-modules to be counted as holonomic\" — and states the cost at footnote 6, p. 31: this \"completely ruins all the nice finiteness conditions that 'usual' (coherent) holonomic complexes satisfy, e.g., finiteness of de Rham cohomology.\"\n\n- **role:** external black box (a **negative** entry: it licenses no inference, it withdraws one)\n- **hypotheses:** none to check, because nothing is being concluded. The entry is a definition of the source together with the boundary that definition draws, and it is cited to **block** a step rather than to take one. What a node must instead check are the hypotheses of the two positive statements recorded below.\n\n  *Prop. 5.2.1, p. 31*, in the source's own words: \"For $f\\colon S\\rightarrow T$ a morphism of quasi-compact quasi-separated schemes, the morphism $f_{*,dR}\\colon D^*_{hol}(S)\\rightarrow D^*_{hol}(T)$ admits a left adjoint $f^{*,dR}$. If $T$ is placid and $f$ is finitely presented, then the morphism $f^{!}\\colon D^!_{hol}(T)\\rightarrow D^!_{hol}(S)$ admits a left adjoint $f_!$.\" So the $f_!$ half carries two hypotheses that the $f_{*,dR}$ half does not — **$T$ placid and $f$ finitely presented** — and the source repeats them at the end of the same proposition (\"Of course, we are assuming $f$ finitely presented and $T$ placid when discussing $f_!$\"). Its proof is deferred to §5.4.\n\n  *§6.19, p. 44*, the indscheme rendering. $D^!_{hol}$ and $D^*_{hol}$ are defined for an indscheme by Kan extension \"as in the definition of $D^!$ and $D^*$\"; there are forgetful functors $D^!_{hol}(S)\\rightarrow D^!(S)$ and $D^*_{hol}(S)\\rightarrow D^*(S)$, and \"For $S$ reasonable (resp. placid), $D^*_{hol}(S)\\rightarrow D^*(S)$ (resp. $D^!_{hol}(S)\\rightarrow D^!(S)$) is fully-faithful.\" Prop. 6.19.2 gives the partially-defined left adjoints, for $f$ a reasonable morphism of reasonable indschemes and, for the $f_!$ half, for $f$ of ind-finite presentation between placid indschemes. Cor. 6.19.4 reads: \"For $S$ and $T$ placid indschemes with a dimension theories and $f\\colon S\\rightarrow T$ a morphism, $f_{*,ren}$ and $f^{!,ren}$ preserve holonomic objects in $D^!$ and $D^*$ respectively.\"\n- **note:** **Why this entry exists: the finite-type chain breaks at its last link.** The standard argument in finite type runs\n\n  $$\n  \\text{finitely many orbits}\\ \\Rightarrow\\ \\text{coherent is holonomic}\\ \\Rightarrow\\ f^{!}\\ \\text{preserves holonomic}\\ \\Rightarrow\\ f^{!}\\ \\text{preserves coherent},\n  $$\n\n  which is exactly [Gunningham: $!$-restriction preserves coherence along a closed immersion of finite-orbit quotient stacks](bb-gunningham-finite-orbit-stack-shriek.html), and whose last implication is also what the hypotheses note of [$!$-restriction preserves holonomicity](bb-htt-holonomic-shriek.html) currently hands a citing node as a free corollary — \"Since a holonomic complex is in particular coherent, the conclusion gives $f^{\\dagger}M\\in D^b_c(\\mathcal{D}_X)$ as a corollary, and that corollary is what a citing node uses.\" That last implication is *definitionally true* in finite type, where $D_{hol}\\subseteq D_{coh}$, and it is *false* in the source's infinite-type theory, where $D_{hol}$ is an ind-completion and $D_{coh}$ is the compacts inside it.\n\n  The operative consequence: **nothing proved at the level of finite-dimensional charts may be lifted to an $L^{+}G$-quotient of a placid ind-scheme ([`placid_ind_scheme`](placid-ind-scheme.html), [loops, jets and positive loops are placid](ex-loops-placid.html)) on the strength of holonomicity.** Cor. 6.19.4 does say that $f^{!,ren}$ preserves holonomic objects there, and that statement is of no use for coherence, because the word \"holonomic\" in it has been redefined to include non-compact objects. A node that wants $f^{!}\\mathcal{F}\\in\\mathcal{D}_c$ ([`defn:coherent_D_mod`](defn-coherent-d-mod.html)) on an infinite-type space must obtain it some other way, and citing holonomicity is not a way.\n- **note:** *Dictionary with the blueprint's conventions.* Three lines.\n\n  The source's $D^!$ and $D^*$ are the blueprint's ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](conv-d-shriek-d-star.html)); §5.2 and §6.19 build $D^!_{hol}$ and $D^*_{hol}$ by the same Kan extension from finite type, so the holonomic categories sit over the blueprint's categories by the same construction and no transfer is being declared here.\n\n  The source's $D_{coh}(S)$ for $S$ of finite type is the compact objects — the parenthetical is the source's own, at §5.2, p. 30 — and it is that identification, valid in finite type, which makes \"non-compact\" and \"non-coherent\" the same word in the display above. On a stack the two part company, which is note (ii) of [`defn:coherent_D_mod`](defn-coherent-d-mod.html); nothing in this entry depends on the stacky case.\n\n  The source works over a field $k$ of characteristic $0$ (§1.13, p. 4: \"We work always over a field $k$ of characteristic 0\"), not assumed algebraically closed; the blueprint's $k$ is algebraically closed of characteristic $0$ ([`subsec:notations`](subsec-notations.html)), so the blueprint's setting is a special case of the source's and there is nothing to declare.\n- **note:** *Provenance, verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf`: §5 *Holonomic D-modules* opens on p. 30 with §5.1 and Rem. 5.1.1; the definition of $D_{hol}(S)$ is §5.2 on the same page; the sentence \"We refer to objects of $D_{hol}(S)$ simply as holonomic objects\", its footnote 6, the Kan extension to quasi-compact quasi-separated $S$ and Prop. 5.2.1 are all on p. 31; §6.19 with Def. 6.19.1, Prop. 6.19.2, Prop. 6.19.3 and Cor. 6.19.4 is on p. 44. Two transcription details kept as the source has them: footnote 6 reads \"This loss is obvious necessary for the infinite dimensional setting\", and §6.19 opens \"For $T$ an indscheme\" and then writes $S$ throughout.";</script>
