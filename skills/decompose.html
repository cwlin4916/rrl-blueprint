<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>decompose</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/decompose &lt;question | node-id&gt;</h1><p class="lead">Generated from <code>.claude/skills/decompose/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /decompose <question | node-id>\n\nTwo modes. Decide from `$ARGUMENTS` before doing anything else:\n\n- **New question** — the argument is prose, or an existing `Q<n>`. Adds a new question section and its lemmas.\n- **Expand a lemma** — the argument is a node id such as `Q1-L5`. Decomposes *that lemma* into sub-lemmas, which become its dependencies. The id may be an example, analogy or consequence node — `Q2-e1`, `Q1-L5-e3`, `Q1-L3-c1` — and nothing about the mode changes: an e/a/c node is a proposition and decomposes like any other ([ADR 0047](../process/decisions/0047-an-example-node-is-a-proposition.html), [ADR 0073](../process/decisions/0073-a-consequence-is-a-node-class.html)). Its children are `<p>-L1`, `<p>-L2`, … and they inherit its role, never `proof`.\n- **Ambiguous** — a bare `Q1` could mean either; ask which is wanted before launching anything.\n\n**Where a node lives.** Expanding a node writes the children *inside* it, so a node's id is its path: split it into its `-L<k>` / `-e<k>` / `-a<k>` segments, take the successive prefixes, join with `/`. Write `dir(id)` for the result.\n\n```\ndir(Q1-L2)       = Q1-L2                       -> blueprint/nodes/Q1-L2/\ndir(Q1-L2-L1)    = Q1-L2/Q1-L2-L1              -> blueprint/nodes/Q1-L2/Q1-L2-L1/\ndir(Q1-L2-L1-L1) = Q1-L2/Q1-L2-L1/Q1-L2-L1-L1\ndir(Q2-e1)       = Q2-e1                       -> blueprint/nodes/Q2-e1/\ndir(Q2-e1-L1)    = Q2-e1/Q2-e1-L1              -> blueprint/nodes/Q2-e1/Q2-e1-L1/\n```\n\n- Every directory is named with the full id of the node it holds.\n- Resolve the argument to `dir(<id>)` once, here, and pass the resolved path to the subagent — never let it reconstruct one.\n\n## 1. Guard\n\n- `blueprint/context.md` and `blueprint/appendix/` must both exist and be non-trivial. If either is missing: stop and tell the user to run the context bootstrap first (distill `context.md` from the main.tex Conventions sections, and give every invocable object an appendix entry).\n\nFor expand mode, additionally:\n\n- The node directory must exist. If not, stop.\n- **status:** `proved` → stop and ask. A proved lemma does not need decomposing, and expanding it means its write-up no longer stands on its own — the page is now a claim about how the children combine, and nobody has checked it against the children. That invalidates nothing mathematically. Proceed only if the user says so.\n- **status:** `drafted` or `failing` → say so: there is an existing write-up that the expansion will make obsolete. It stays on disk; the prover will replace it.\n- **Count the container first — the cap is ten** ([ADR 0050](../process/decisions/0050-a-node-has-at-most-ten-children.html)). A question or a node holds at most ten direct children, because past that the card stops being a picture and becomes a list, and `blueprint/main_dag.md` is already the list. Count what is there and subtract:\n\n```\nls -d blueprint/nodes/<dir(p)>/*/ | wc -l          # expand mode: the node's children\nls -d blueprint/nodes/Q<n>-*/ | wc -l              # new-question mode: the question's layer\n```\n\n  If the expansion would cross ten, **do not create the eleventh** — regroup instead, and the two regroupings are the same two either way. A child written to serve one sibling goes *under* that sibling: a lemma the example needs is `<e-node>-L1`, not a second node in the parent's layer ([ADR 0047](../process/decisions/0047-an-example-node-is-a-proposition.html) made this possible, and it is the reason twenty new sub-lemmas did not land in `Q2`'s layer). A family of siblings that share a job gets a node naming the job, and they become its decomposition. Neither move loses a claim; both change which layer it sits in. Report the regrouping to the user rather than silently cutting the decomposition short — eleven pieces that genuinely want stating are eleven pieces, and what is wrong is the flat layer, not the count.\n- **The dependencies' statuses are not a guard.** There is no `blocked` ([ADR 0045](../process/decisions/0045-there-is-no-blocked-node.html)): nothing about this run turns on whether the node's dependencies are proved.\n\n## 2. Launch\n\nLaunch the **lead-researcher** subagent (Agent tool, `subagent_type: lead-researcher`) with:\n\n- `$ARGUMENTS` and the mode;\n- a reminder to follow the schema at the top of `blueprint/main_dag.md`;\n- the pointer to the local library: an appendix entry that black-boxes a literature result is transcribed from the source PDF in `papers/` — named by its `refs.bib` key, indexed by `papers/guideline.md`, opened with Read and its `pages` parameter — never from memory of the paper;\n- the fan-out cap and the room left under it — \"this container holds N children and the cap is ten, so at most 10 − N new nodes; past that, group\" ([ADR 0050](../process/decisions/0050-a-node-has-at-most-ten-children.html));\n- the notice that **every node it creates will be sent to an example-finder in step 4**, so a statement it cannot imagine a single instance of is a statement to reconsider now rather than one to defend later.\n\n**New question.** It writes:\n\n- one node directory per new node — `blueprint/nodes/<id>/`, at the top level, since a question's lemmas have no parent — containing `<id>_node.md`:\n  - the H1 title line and the breadcrumb;\n  - the field block: **type:**, **role:**, **created:**, **status:**, **human:**, **depends-on:**, **required-by:**, **draft:**, **critique:**, **objects:**;\n  - **human:** is written `—` and left alone — it is the user's judgement and no agent may write it ([ADR 0014](../process/decisions/0014-confidence-is-three-signed-channels.html));\n  - **role:** is `proof` unless the node corroborates rather than advances the argument, the corroborating roles differing by *direction*: `example` a worked instance of the claim, `analogy` a matching claim from another setting, `consequence` a claim that **follows from** its host rather than feeding it ([ADR 0073](../process/decisions/0073-a-consequence-is-a-node-class.html)), `evidence` corroboration whose relation is none of those and which therefore takes no id suffix, `thought` exploration ([ADR 0015](../process/decisions/0015-every-node-declares-its-role.html), [ADR 0018](../process/decisions/0018-example-and-analogy-nodes.html)). Expanding an e/a node is the one case where the role is forced: **nothing below an example or an analogy may be `proof`**, since the tallies and the weakest-link aggregate range over the proof chain alone, and a computation in one variety must not enter the count of the argument or cap a question ([ADR 0047](../process/decisions/0047-an-example-node-is-a-proposition.html));\n  - the `## Statement` section — and **nothing but the statement**. What the node claims is what every readout shows: the node page renders this file, and the graph panel a reader opens by clicking the node carries the statement and links everything else ([ADR 0037](../process/decisions/0037-the-node-panel-carries-the-statement.html)). Prose that is not the claim, put here, is prose rendered where only the claim belongs. `## Statement` is the only section a node file may have, and the render gate fails on any other ([ADR 0074](../process/decisions/0074-the-decomposition-paragraph-is-removed.html));\n  - **a definition carries no claim** (invariant I28, [ADR 0052](../process/decisions/0052-a-definition-inside-a-statement-carries-no-claim.html)). Where a statement coins notation, the coining clause says what the object *is*. A property asserted in apposition to it — closed, reduced, representable, placid, finite type, ind-proper, attached to a symbol at the moment it is introduced with a one-word reason drawn from the pieces — is a claim nobody is on the hook for: not a clause, so no prover proves it; not a dependency, so no node carries it; not a hypothesis, so nothing warns the node stands or falls with it. Make it a clause, a labelled hypothesis, or a sub-lemma, or leave it out. A property of the pieces is not a property of the assembly, and a union, a colimit or an image is where that gap opens;\n  - **conditions one per paragraph, always** (invariant I23). A statement that carries hypotheses states each on its own paragraph, opening with a bolded label and, where it helps, a short name: `**(A) Well-founded closure order.** …`, then a blank line, then `**(B) …**`. Never run two conditions together in a sentence — the gate counts bolded labels per paragraph and fails at two. Display math belonging to a condition goes in its own `$$ … $$` block inside that condition's paragraph run, with a blank line each side;\n  - a sibling `<id>_history.md` — breadcrumb, one lead sentence, then `## History` opening with its dated creation entry: which operator cut the node out and why it exists ([ADR 0027](../process/decisions/0027-a-node-carries-its-history.html)). The node's life goes here and only here, append-only, oldest first; standing commentary a reader needs lives inside the entry it belongs to. It gets its own generated page, which the node page and the graph panel link;\n  - the write-up `proof.md` arrives later from `/prove`; `examples.md` or `prompts/examples.md` arrives in step 4 of *this* run; `<id>_prompt.md` arrives mechanically in step 6 from `tools/build_dag_site.py` and is never written by the lead-researcher;\n- for a new question, its section in `blueprint/main_dag.md`: the `<a id=\"q<n>\"></a>` anchor, the question H1, the **Setting.**, **Problem statement.** and **Conjecture.** paragraphs, and an empty `<!-- BEGIN INDEX q<n> -->` / `<!-- END INDEX q<n> -->` pair — the bullets and the tally inside those markers are generated in step 6, never written by hand. If the new question supplies an existing one, add a **Feeds.** paragraph naming it with a `#q<n>` link ([ADR 0039](../process/decisions/0039-one-graph-for-every-question.html)): the site draws the arrow between the two cards. The relation is between the *questions* — never give a node of one question a `depends-on` in another;\n- a new entry in `blueprint/appendix/` for any object a node needs that is not already there.\n\n**Expand a lemma.** Given parent `<p>`, it writes:\n\n- sub-lemma directories **inside the parent's own directory**: `blueprint/nodes/<dir(p)>/<p>-L1/`, `<p>-L2/`, … — same schema, each with **required-by:** `<p>`. A decomposition grows the tree downwards, so the children are written where they belong, under the lemma they refine. Concretely, `/decompose Q1-L2` writes `blueprint/nodes/Q1-L2/Q1-L2-L1/<id>_node.md`, not `blueprint/nodes/Q1-L2-L1/<id>_node.md`;\n- the parent's **depends-on:** extended with every new sub-lemma;\n- appendix entries for any new object.\n\nUntouched either way:\n\n- **No status changes.** The parent's **status:** stays exactly what it was, and the lead-researcher changes no status on any node ([ADR 0045](../process/decisions/0045-there-is-no-blocked-node.html)).\n- The parent's `## Statement` is never touched. Statements are frozen once written (invariant I2); expanding a lemma changes how it will be proved, never what it claims.\n- **The parent's node file gains no prose.** There is no `## Decomposition` section ([ADR 0074](../process/decisions/0074-the-decomposition-paragraph-is-removed.html)) — `## Statement` is the only section a node file may have, and a parent that gained one fails the render gate. How the children reassemble is carried by their statements and their declared hypotheses; what needs saying about this cut goes in the parent's dated `<id>_history.md` entry.\n\n## 3. Validate (yourself, after it returns)\n\n- **Files** — every new node has a `<id>_node.md`, and its id begins with the question it belongs to. In expand mode each one is *inside* the parent's directory: `find blueprint/nodes/<dir(p)> -name '*_node.md'` must list the parent and all its new children and nothing else.\n- **Statements fit a page** — a node whose write-up could not fit on one page (invariant I9) is really several nodes. Split it now, at statement time, not later when a prover discovers it.\n- **Schema** — each node file has the full field block in order, the breadcrumb line, and a non-empty `## Statement`.\n- **Expansion only** — in expand mode, `git diff` on the parent's `## Statement` must be empty. Any change there is a violation — revert it and send back.\n- **Reassembly** — in expand mode, check yourself that the children's statements, together with the hypotheses they declare, actually entail the parent's, and say so in the return. There is no `## Decomposition` paragraph to assert it for you ([ADR 0074](../process/decisions/0074-the-decomposition-paragraph-is-removed.html)): a paragraph claiming the entailment never established it, and one that claimed it falsely stood for two critique rounds.\n- **Naming and position** — sub-lemmas of `<p>` are `<p>-L1`, `<p>-L2`, …, and each directory carries that full id. The id *is* the path — split it into segments, take the successive prefixes, join with `/` — so `Q1-L2-L1` can only live at `blueprint/nodes/Q1-L2/Q1-L2-L1/`, and `Q2-e1-L1` at `blueprint/nodes/Q2-e1/Q2-e1-L1/`. Never renumber an existing node, and never move one: only new directories appear, always beneath their parent, so every link written before today still resolves.\n- **Width** — no container gained an eleventh child. `tools/build_dag_site.py --check` prints a `NOTE` naming any container over the cap, its count and its children; a note this run *caused* is a violation to fix now, while nothing links the new nodes yet and regrouping is free. A note that was already there is `Q1` or `Q2`, and clearing those is a migration the user commissions ([ADR 0050](../process/decisions/0050-a-node-has-at-most-ten-children.html)).\n- **Acyclicity** — topologically sort the `depends-on` graph; any cycle → send back to fix.\n- **New appendix entries** — grep each new entry's `\\label` against `main.tex` and its bib keys against `refs.bib`; nonexistent references → send back to fix.\n- **A leaf that assumes nothing** — at least one new node has no dependencies (`— *(ready leaf)*`). This is a shape check, not a permission: every node is workable from the day it exists ([ADR 0045](../process/decisions/0045-there-is-no-blocked-node.html)). A decomposition all of whose pieces lean on another piece has not bottomed out, and that is worth seeing.\n- **Everything else** is checked for you — run this and read the output:\n\n```\npython3 tools/check_render.py\n```\n\nIt renders every math fragment in the new statements through KaTeX — which is how a house macro or a malformed display block is caught before a prover ever sees it — and checks links, then runs `tools/build_dag_site.py --check`, which reports a node whose question has no section in the index, a missing or stale self-contained prompt, a generated index block that is out of date, dependencies that name a node with no directory, `required-by` that is not the exact transpose of `depends-on`, sub-lemmas whose parent does not exist, and objects pointing at appendix anchors that do not exist. Fix or send back until it prints `OK`.\n\n## 4. One example per node — the grounding pass\n\n**Every node this run created leaves it carrying at least one example** ([ADR 0048](../process/decisions/0048-a-decomposition-is-grounded-node-by-node.html)). A statement nobody has instantiated is a statement nobody has tested against a case, and the cheapest moment to find that out is now — before a prover spends a round on it, and while the decomposition can still be re-cut.\n\nLaunch one **example-finder** subagent (`subagent_type: example-finder`) **per new node**, in parallel, one node per agent and never batched. Scope: every new node whose **role:** is `proof` or `evidence`. A node whose role is already `example` or `analogy` *is* an instance, so this stage skips it — not because `/examples` is unavailable there (it is available, and `Q2-e1-e1` is a legitimate id: an example node states a *kind* of instance and a run on it finds further instances of that kind, [ADR 0047](../process/decisions/0047-an-example-node-is-a-proposition.html)), but because one instance need not be automatically issued another. A `thought` is exploration and is skipped.\n\nEach gets the resolved node path, the node's `## Statement` quoted inline, its `objects:` links with the appendix entries quoted, and the standing instructions of `/examples`: the two-part search — whether the statement, or one entailing or contradicting it, has appeared in print, then explicit instances that make it concrete, simplest first — the local library first ([ADR 0017](../process/decisions/0017-operators-read-the-local-library.html)), and the rule that every finding names **which part of the statement it matches**, under what specialisation or sourced dictionary, and what it does not reach ([ADR 0036](../process/decisions/0036-an-example-says-what-it-matches.html)).\n\nThen gate the result, per node:\n\n- exactly one of `<dir>/examples.md` (with its closing `EVIDENCE:` line) or `<dir>/prompts/examples.md` exists. Both, or neither, is a failure — send that one agent back;\n- **an honest empty hand is an acceptable outcome and an invented example is not.** A finder that searched and found nothing writes the self-contained prompt under `prompts/`, and the run goes on. An example with no verifiable source is worse than no example;\n- `EVIDENCE: counterexample` on a node this very run created is a **stop**. The decomposition just cut a piece the literature refutes. Do not commit it as if it were sound: report it, quote the counterexample, and tell the user the statement wants re-cutting before anything is proved against it.\n\nExamples stay outside the closed world. Nothing here justifies anything — no proof, node or appendix entry may cite `examples.md`. What the pass buys is knowing the statement is not vacuous and that its hypotheses are load-bearing, and it buys it before the expensive operator runs.\n\n## 5. Presentation pass\n\nEvery command tidies what it wrote; there is no separate `/check` to remember ([ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html)). Launch one **checker** subagent (`subagent_type: checker`) per file this run wrote — every new `<id>_node.md` and `<id>_history.md`, every `examples.md` or `prompts/examples.md` from step 4, the parent's `<id>_node.md` in expand mode, any new appendix entry — one path per agent, never batched.\n\nThen gate them mechanically, because content-preservation is yours to enforce and not theirs to promise:\n\n```\ngit diff -U0 -- <files> | grep -E '^[+-]' | grep -E 'VERDICT:|EVIDENCE:|\\*\\*status:\\*\\*|\\*\\*type:\\*\\*|\\*\\*role:\\*\\*|\\*\\*human:\\*\\*|\\*\\*created:\\*\\*|\\*\\*depends-on:\\*\\*|\\*\\*required-by:\\*\\*|<a id='\n```\n\nAny output is a violation: `git checkout -- <path>` that file and report it reverted. Then re-run step 3, since reformatting is exactly the operation that breaks a `$$` fence or a link.\n\n## 6. Regenerate, and do not commit\n\n```\npython3 tools/batch.py close      # canonical, pages, full gate, consistency\n```\n\nThe canonical half creates each new node's tracked `<id>_prompt.md` before the pages half\nrenders it, which is why `close` runs them in that order rather than as one build.\n\n**No operator commits** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). Leave the new directories in the working tree; name any new appendix entries and any node that came back with a prompt rather than an example in the report, where the user reads them before deciding what to keep.\n\n## 7. Report\n\n- List the new nodes: id + one-line title + path.\n- Flag the leaves that assume nothing.\n- **Per node, what step 4 found**: the `EVIDENCE:` verdict, the simplest instance in one clause, or — where the search came back empty — the fact that it did and where the prompt is. A decomposition where several nodes came back empty is worth saying out loud as one sentence; it usually means the statements are cut above the level anything is written about.\n- State the closure — for a new question, quote the **Conjecture.** paragraph; for an expansion, say in one or two sentences how the children reassemble into the parent and under which of their declared hypotheses. It goes here and in the parent's history entry, not in the parent's node file ([ADR 0074](../process/decisions/0074-the-decomposition-paragraph-is-removed.html)).\n- Remind the user to review the statements before running `/prove`.\n";</script>
