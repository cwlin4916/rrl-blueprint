<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>create</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/create &quot;&amp;lt;claim&amp;gt;&quot;</h1><p class="lead">Generated from <code>.claude/skills/create/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /create \"&lt;claim&gt;\"\n\nYou (the main thread) own the placement decision; the lead-researcher writes the directory, as it does for every node.\n\nEvery other operator here works **inside a fixed presentation of the problem**. `/decompose` searches it, `/prove` traverses it, `/update` corrects a statement inside it, `/generalize` widens one. This operator is for the other move:\n\n```\nresearch is not only     search inside  P\n\nit is also               P₀ ⟶ P₁ ⟶ P₂ ⟶ ⋯\n```\n\nwhere each $P_i$ is a different account of what the problem *is*. Between one and the next a mathematician may change the **objects**, the **morphisms**, the **ambient category**, the **equivalence relation**, the **invariants**, or **what counts as a solution** — which is why it is easier to hold $P$ as a category than to fix what its objects are. The objects are one of the things that move.\n\nThat move happens in this repository already, and until now nothing wrote it down. A statement quietly starts quantifying over a different category and the record shows an `/update` with a plausible reason.\n\n## What it is not\n\n- **Not `/decompose`.** That takes a parent and cuts *its* claim into smaller ones inside the same presentation. If the new claim is a step toward an existing node's statement, stop and run `/decompose` on that node.\n- **Not `/generalize`.** That takes a *verified* claim strictly more general than a node and leaves the node standing as its specialization. If the new claim is the same claim with a hypothesis dropped, stop and run `/generalize`.\n- **Not `/update`.** That corrects a statement that is wrong. If the old statement is simply false, stop and run `/update` — a re-presentation does not repair anything.\n\nSay which one you are sending the user to, and write nothing.\n\n## 1. The claim gate\n\n- The claim is a **required argument** and it must be a statement, not a topic. \"Something about the Iwahori case\" is not a claim; the operator refuses it and asks for one.\n- Write the claim out in full first, in your own message, before you look for anywhere to put it. A claim you cannot state is a claim you cannot place.\n\n## 2. Find the layer\n\nThe rule is one line:\n\n> **The layer is the deepest node whose `## Statement` still holds unchanged under the new claim's presentation.** The new node is created as its child. If no node survives, the layer is a new question.\n\nWalk it explicitly and show your work:\n\n1. Start at each question's node file, `blueprint/nodes/Q<n>/Q<n>_node.md`, and read its `## Setting` and `## Problem statement`.\n2. Descend. At each node, ask whether its statement is still *true and meaningful* when read in the new claim's terms. A statement that quantifies over objects the new presentation does not have is a statement that does not survive.\n3. Stop at the last node that survives. That is the parent.\n4. **Nothing survives at the top** — the setting itself has changed — and the claim is a new question. Run `/decompose \"<the claim>\"` instead, which is the operator that opens one, and say so.\n\nTwo failures this step exists to catch. Placing the claim too deep, where its parent's statement no longer holds, produces a node whose `depends-on` edge is a lie. Placing it too shallow makes a sibling of the whole question out of something that is one refinement away from an existing node.\n\n## 3. Name what changed\n\nThe new node's first history entry **must** say which of the six moved, and to what. One line each, and only the ones that actually moved:\n\n```\nobjects          from  <what P_i quantified over>   to  <what P_{i+1} does>\nmorphisms        …\nambient category …\nequivalence      …\ninvariants       …\nsolution         <what would now count as an answer, if it changed>\n```\n\n**If none of the six moved, this is not a `/create`.** The claim lives inside the current presentation, so it is a `/decompose` on the parent you found in §2. Stop and say so.\n\nAt most two of the six in one invocation. A claim that changes four of them at once is a new question, not a node.\n\n## 4. Create it\n\nLaunch the **lead-researcher** subagent (Agent tool, `subagent_type: lead-researcher`) with the claim, the parent id from §2, and the six-line record from §3. It writes, and nothing else:\n\n- `blueprint/nodes/<parent-path>/<parent>-L<k>/<parent>-L<k>_node.md` at the next free `k`, with `role:`, `status: open`, `created:` today, `depends-on:` empty, `required-by: <parent>`, and the `## Statement`;\n- the parent's `required-by`/`depends-on` transpose;\n- `<id>_history.md`, whose first entry is dated, says the node was created by `/create`, quotes the claim, and carries the §3 record verbatim.\n\n**The id carries no new segment.** A re-presentation is an ordinary `-L<k>` child, and the fact that it *is* one lives in the history entry. Adding a seventh id letter would mean changing the id grammar in two tools, three regexes and the tests, and the record is the thing that has to be reliable, not the filename.\n\n**Ten children is the cap** ([ADR 0050](../process/decisions/0050-a-node-has-at-most-ten-children.html)). A parent already at ten does not get an eleventh: report which grouping you want instead and write nothing.\n\n## 5. Gates\n\n```\npython3 tools/check_render.py --only blueprint/nodes/<parent-path>\npython3 tools/build_dag_site.py --canonical\n```\n\nCheck yourself, and reject the directory if any of these is wrong:\n\n- the parent's `required-by` and the child's `depends-on` are exact transposes;\n- the statement's hypotheses are one paragraph each, opening with a bolded label ([ADR 0074](../process/decisions/0074-the-decomposition-paragraph-is-removed.html));\n- no bare backticked appendix label anywhere, and every relative link resolves from the new node's own depth;\n- the history entry carries the §3 record, and the six lines say *from what* and *to what* rather than naming the six.\n\n## 6. Presentation pass\n\nOne `checker` subagent on the files this run wrote, per [ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html). Run the content-preservation gate yourself; the `## Statement` and the §3 record are frozen, because both are what the run is for.\n\n## 7. Report\n\nThe claim; the parent and **why it is the deepest surviving node**, naming the first node below it that did not survive and what killed it; which of the six moved; and the next operator on the new node, which is normally `/check-goal` before `/prove`. Do not commit ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)).\n";</script>
