ator's to-do, which has a page of its own at\n[`process/todo2.md`](../todo2.html), and it is open to\nwhoever answers it first.\n\n- What comprehensible means here, stated so that a run can fail against it.\n- [`process/pipeline/writing-a-skill.md`](../process/pipeline/writing-a-skill.html) —\n  the guideline, and the six things every skill file states.\n- [`.claude/skills/decompose/SKILL.md`](decompose.html) — the worked example.\n- [`process/pipeline/operators/tighten.md`](../process/pipeline/operators/tighten.html) —\n  what this operator is for, and the constraints any specification of it has to meet.\n\nTwo constraints hold whatever the specification turns out to be, because they are the\nrepository's and not this command's:\n\n- **No claim leaves the page.** Whatever the run does to the prose, every claim that was\n  in the write-up is still in it, and that has to be checkable by something other than the\n  run's own report.\n- **The statement is not this command's.** `## Statement`, `status:`, `depends-on:` and\n  `needs:` belong to [`/update`](update.html). A run that wants one of them is the\n  wrong command.\n";</script>
