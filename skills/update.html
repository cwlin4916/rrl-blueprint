<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>update</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/update [target] [with input]</h1><p class="lead">Generated from <code>.claude/skills/update/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /update [target] [with input]\n\nYou are the operator and the orchestrator both: there is no update subagent, because here the gate *is* the work — what gets written is exactly what survived your own verification ([ADR 0019](../process/decisions/0019-the-update-operator.html)). It is the pipeline's one lawful way to change a `## Statement`, the only maintainer of each question's `## Pipeline` ([ADR 0085](../process/decisions/0085-the-pipeline-replaces-the-priority-panel.html)), and since [ADR 0022](../process/decisions/0022-update-proposes-nodes-from-failures.html) the command that turns the record's failures into commissioned nodes.\n\nIt is **not** the generalizer. When a verified claim turns out to be strictly more general than the target, that is [`/generalize <id>`](generalize.html) — a separate command, a separate node, a separate run ([ADR 0078](../process/decisions/0078-generalize-is-its-own-operator.html)). Stop, say so, and do not widen a statement in place.\n\n## The order, and it is the whole skill\n\n```\n/update <id>                                          node-local, §1–§6\n├── 1 read ......... <id>_node.md — the statement and the standing flaw\n├── 2 verify ....... every input claim → verified | refuted | unverified\n├── 3 revise ....... the minimal correct statement + updates/u<n>.md\n├── 4 record ....... history, status, and the needs: line — NEVER a no-op\n├── 5 propagate .... the neighbours whose statements cite the revised one\n└── 6 close ........ presentation, batch.py close, the route, the report\n\n/update                                               repo-wide, adds §7–§9\n├── 7 propose ...... the failure audit → the lead-researcher materializes\n├── 8 improve ...... the machinery that let the defect through\n└── 9 rank ......... each question's ## Pipeline, five rows at most\n```\n\nA turn with nothing to do is **reported empty, never skipped in silence** — except §4, which cannot be empty.\n\n## Which shape of run you are\n\nThe argument decides more than the reading order: it decides which files this run may write ([ADR 0072](../process/decisions/0072-a-run-is-node-local-or-repo-wide.html)).\n\n**`/update <id>` is node-local.** It writes inside `<dir>` and nowhere else. Everything it finds that reaches past the node — a framing paragraph to correct, a node to commission, a priority row, a pipeline defect — is **written down in its `u<n>.md`** under a heading the repo-wide run reads, and not acted on. That is what makes two `/update` runs on disjoint subtrees safe at the same time.\n\n**`/update` with no argument is repo-wide.** It walks everything, and it is the only shape that may write `blueprint/main_dag.md`, a question's node file, `process/`, or launch the lead-researcher.\n\nThe escape hatch, because a rule with no exit gets ignored: a node-local run **may** touch its own question's framing if it first holds a claim on the question (`python3 tools/batch.py claim Q<n>`), which locks that whole question and is the honest price. Prefer recording it.\n\n## What may change\n\nA question's Setting / Problem statement / Conjecture; a node's `## Statement`, its `needs:` field, its `<id>_history.md` and its `status:` (only to `open`, only when a `drafted` or `proved` statement materially changed); and each question's `## Pipeline` — the first and last of those in a repo-wide run only.\n\nNever by your own hand: `human:` and `human` priority rows, `created:`, ids, directories, `depends-on` / `required-by` / `instances:` edges, critiques, `examples.md`, the appendix, and `main.tex`, which is never written by any path. New nodes and entries reach disk only through the lead-researcher of §7.\n\n## 1. Claim, then read the node summary\n\n**Take the lock first**, and take it on the target: `python3 tools/batch.py claim <id>` (a repo-wide run claims each question it will touch). A claim covers the whole subtree, so a `BUSY` line means another session is working on this node, on an ancestor whose operator reads this statement, or on a descendant whose statement this run might rewrite under it. Stop and report who holds it. Release with `tools/batch.py release <id>` at §6.\n\nThen read **`<dir>/<id>_node.md` and start there**. It is the node summary, and it already carries the two things this command judges:\n\n- the `## Statement` — what the node actually claims, with every object a link into the appendix;\n- the generated **flaw block**, which quotes *the record's own words* ([ADR 0062](../process/decisions/0062-a-node-states-its-own-flaw.html)): every standing FATAL/MAJOR of the last critique for a `failing` node, the defect sentence of the supersession for one revised and not re-proved, the `EVIDENCE:` line, the gap commission. **You do not need to re-read the critique, the update record or `examples.md` to learn what is wrong.** That was the old §1's \"read the whole repo\", and it paid for the whole repository's context to recover a paragraph the node file already prints.\n\nFour things the node summary does **not** carry, and each is read only when the run actually needs it:\n\n| read | when |\n|---|---|\n| the appendix entries the `## Statement` links | always — §2 verifies against the entry, never against a paraphrase |\n| the direct neighbours' `<id>_node.md` (statements only) | §5, and only for those whose statement cites this one |\n| `proof.md`'s `## Lemma` block | §4, and only when the node has a write-up and the statement moved |\n| `<id>_history.md`, `critiques/`, `updates/`, `examples.md` in full | only when the flaw block's quotation is genuinely not enough to state the defect — say in the report that it was not |\n\nA repo-wide run reads every question section of `blueprint/main_dag.md` and [`context.md`](../context.html) first, then walks each question's nodes root-first on the same discipline.\n\n**Never the generated `<id>_prompt.md`.** It is a readout and may not become a second source for a judgement ([ADR 0029](../process/decisions/0029-every-node-has-a-generated-self-contained-prompt.html)).\n\n## 2. Verify the input\n\nAn input passage is a **lead, never a source**: recompute each example, re-run each adjunction, and check each counterexample against the appendix entry rather than the passage's paraphrase of it — what a node claims is its `## Statement`, what the manuscript defines is `main.tex` at a line you have opened, and a cited result says what the numbered result says.\n\n**A coining clause is a claim** (invariant I28, [ADR 0052](../process/decisions/0052-a-definition-inside-a-statement-carries-no-claim.html)): read the sentence that introduces a symbol with the same suspicion as a numbered one, because a property asserted in apposition to a definition has no prover, no critic and no dependency behind it, and that is how `Q1-L3` carried an invalid closedness assertion through three operators.\n\nSort every claim into **verified**, **refuted** or **unverified**, record all three columns in the `u<n>.md` of §3, and act on the first column only.\n\n**If a verified claim is strictly more general than the target** — the target's hypotheses are one instance of it, or the target is the general theorem with a parameter set to zero — stop and hand to [`/generalize <id>`](generalize.html). Do not widen the statement in place, and do not propose the abstraction yourself.\n\n## 3. Revise\n\nState the defect in **one sentence against the current statement**, not a paraphrase of it. If you cannot state the defect, there is no defect: do not revise, and go to §4, which still has work to do.\n\nThen draft the minimal correct statement — short hypotheses, appendix links instead of restatements, no new notation — and write `<dir>/updates/u<n>.md` at the next free number, append-only and never renumbered, carrying: the defect, the old statement verbatim, the new one, §2's three columns, and what was considered and *not* adopted with reasons. Then edit `<id>_node.md`.\n\n## 4. Record — and this section is never empty\n\n**a. A revision under a write-up is settled explicitly, never by silence.** When the node has a `proof.md` and this run changed one character of the `## Statement`, the write-up now states a different lemma from the node, and neither `check_render.py` §11 nor the site's flag can tell a renotation from a new claim. So decide, in the `u<n>.md`, in one labelled sentence:\n\n- **material** → reset `status:` to `open`, and say the write-up is superseded and the next `/prove` is a rebuild. The draft and its critiques stay on disk as history.\n- **immaterial** — a renotation, a symbol rebound, a hypothesis made explicit that the argument already used — → the status stands, **and you re-sync the write-up's `## Lemma` block yourself**, verbatim from the new `## Statement`, in this run. That is the one case where re-syncing is honest: you have just certified that no step depends on the difference.\n\nDoing neither is what left four `proved` nodes holding a write-up that states a different lemma (2026-08-07). A `proved` node whose draft proves something else is the worst readout the repository can produce, because every other mechanism trusts the status.\n\n**b. Every node this run judged gets a dated `<id>_history.md` entry** — what changed and why, linking the new `u<n>.md` — **including those re-read and found sound**, since \"examined and unchanged\" is a fact about a node and its absence reads as an omission.\n\n**c. A node this run leaves negative says what would clear it, in one line.** This is the section that makes a run of this command never a no-op ([ADR 0077](../process/decisions/0077-the-ask-is-a-line-on-the-node.html), [I41](../process/pipeline.html#4-invariants)). Whenever this run leaves — or finds — a node at negative confidence with nothing beneath it weaker, set its `needs:` field:\n\n```\n- **needs:** <what is missing, and what the repair is worth>\n```\n\nOne line, authored, and it names **facts, not flaws** — the appendix entry nobody has written, the hypothesis stated over the wrong field, the computation no source on disk performs, with the source you suspect carries it. The flaws are already in the critique and in the generated flaw block; restating them stores the same fact twice. Close it with the arithmetic, which is cheap and pre-empts the commonest wasted run: what a `PASS` on this node alone buys against `confidence()` in `tools/build_dag_site.py`, and what else has to move first.\n\n`tools/build_dag_site.py` carries the line into `<id>_prompt.md`, so it is the packet's ask and a reader outside this repository is the one who can answer it. It sits outside the closed world, like the prompt that carries it: a request for information, never a premise, and nothing in it may discharge a step.\n\nSet the field to `—` when the node goes non-negative, and cut the part of the ask this run met. So: **a `/update` on a node either changes its statement or changes its `needs:` line.** A run that does neither, and reports neither, has told the reader nothing and left the number exactly where it found it.\n\n## 5. Propagate\n\nRe-read every neighbour whose statement cites the revised one, and the question's Conjecture, revising what breaks under the same discipline or flagging it amber in §9. A node-local run that finds breakage outside `<dir>` records it in the `u<n>.md` and does not act.\n\n## 6. Close\n\nPresentation first, then the gates, then the route, then the report.\n\n**Presentation** ([ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html)) — one **checker** subagent (`subagent_type: checker`) per file this run wrote, one path each, then the content-preservation gate you run yourself and never the checker's word for it:\n\n```\ngit diff -U0 -- <files> | grep -E '^[+-]' | grep -E 'VERDICT:|EVIDENCE:|\\*\\*status:\\*\\*|\\*\\*type:\\*\\*|\\*\\*role:\\*\\*|\\*\\*human:\\*\\*|\\*\\*created:\\*\\*|\\*\\*depends-on:\\*\\*|\\*\\*required-by:\\*\\*|\\*\\*needs:\\*\\*|<a id='\n```\n\nEvery line of that output is a violation — `git checkout -- <path>` and report it reverted.\n\n**Gates:**\n\n```\npython3 tools/batch.py close\npython3 tests/run_tests.py\n```\n\n**Do not commit** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). Every statement revision is already recorded twice on disk, in `updates/u<n>.md` and in the node's `<id>_history.md`, so what the commit body used to carry goes in the report and in a `process/journal/YYYY-MM-DD_NN_slug.md` entry with its one line in [`process/journal.md`](../process/journal.html). Say plainly which statements changed and that the changes are uncommitted.\n\n**The recommended route**, three lines at most ([ADR 0057](../process/decisions/0057-update-recommends-a-route.html)). You have just read the node, its flaw and its failure surface, so you are better placed than the user to say *where* the next piece of work should happen, and throwing that judgement away costs them the decision every run. Name the cheapest route that could work, not the most thorough:\n\n- **in Claude Code** — the obstacle is inside the repository: a statement to sharpen, a dévissage to write, a hypothesis to trace to its appendix entry. Name the commands in order and what each is expected to close.\n- **to an external model** — the obstacle is in the literature or in the choice of generality. Running that here pays for the repository's context on every turn to answer a question the repository does not contain. Name the packet: `<id>_prompt.md` is already generated, self-contained and non-citable, and it now carries the `needs:` line as its ask.\n- **the user's own judgement** — `human:` is nobody else's field. Name the node waiting on it.\n\n**Report**, in this order: every claim of the input **refuted or left unverified** (the user gave you the passage and needs to know what did not survive); every statement revised, as old defect and new statement in one line each; **every node whose `needs:` line this run set or changed**; anything handed to `/generalize`; every node commissioned with its justification and every failure that earned none; what changed in the pipeline; the top of the priority panel; and the next commands to run.\n\n---\n\n# Repo-wide only\n\nThe three sections below write files shared by every concurrent session. A node-local run records what it found for them and launches nothing.\n\n## 7. Propose, never create\n\nCollect the failure surface — every `failing` node, standing `VERDICT: FAIL`, `EVIDENCE: gap` or `counterexample`, `human: doubted`, undischarged hypothesis, and every statement revised this run — and beside it what *succeeded*, because a proposal must say why the machinery that already works does not cover the gap.\n\nWrite each proposal in full before commissioning it (attach point, id class, `role:`, the exact statement, and the justification as links into the record), then hand all of them verbatim in **one** launch to the **lead-researcher** (Agent tool, `subagent_type: lead-researcher`), which creates the directories, edges and appendix entries under its own unchanged write discipline. A failure naming no crisp claim earns a priority row instead, and the report says which and why.\n\n## 8. Improve the pipeline\n\n[`process/pipeline.md`](../process/pipeline.html) goes stale silently — nothing breaks when it is wrong, which is why it is checked here every run. Reread it against what the repo now does and correct the actors' real writes and tool grants, the invariants, the node lifecycle and the file paths.\n\nThen ask what this run's failures say about the *machinery* rather than the mathematics — a gate that passed something wrong, a stage done by hand, a rule two readings fit — and fix it: a rule now in force becomes a numbered invariant, a choice someone could reasonably have made differently becomes a `process/decisions/` record, and anything altering what an agent may do goes in `CLAUDE.md`.\n\n## 9. Rank\n\nRe-rank each question's `## Pipeline` to reflect the run: at most five actions, numbered 1..n, each `- **<k>.** `<operator> <target>` · [<target>](<link>) — <why>`. Say what the action buys that question's confidence and which record you read; store no severity and no confidence number, because both are derived at build time ([ADR 0085](../process/decisions/0085-the-pipeline-replaces-the-priority-panel.html)).\n\nA row is **one sentence and at most 50 words**, and it says what is wrong or what to do and never what the target claims: the panel quotes that from the target's own title at build time, so restating it stores it twice. Write mathematics as `$…$` and every reference as a markdown link — the panel renders both, and the build gate fails a row that runs long or leaves a `$` unclosed.\n";</script>
