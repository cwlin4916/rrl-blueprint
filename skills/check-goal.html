<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>check-goal</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/check-goal &lt;node-id&gt;</h1><p class="lead">Generated from <code>.claude/skills/check-goal/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /check-goal <node-id>\n\nYou (the main thread) are the orchestrator: the subagent tests one statement against the bench and writes one file, you own the gate and git.\n\nThe command asks the cheapest question in the pipeline:\n\n> If this statement is true, what does it say about each case where the answer is already known — and is what it says true?\n\nThat question costs one subagent and can kill a statement that would otherwise survive three rounds of critique. It is worth running **before** `/prove`, not after.\n\nWhat it can and cannot change:\n\n- **Nothing here enters the closed world.** [`blueprint/key_examples.md`](../key_examples/index.html) and the `goalcheck.md` it produces are outside it, exactly like a node's `examples.md`. No proof, node or appendix entry may cite either. So this is safe on a node in any state, including `proved`.\n- **What it does change is a ceiling.** The `GOALCHECK:` line is the goal channel of [ADR 0040](../process/decisions/0040-the-key-example-register.html): `tension` caps the node's confidence at $+0.25$, `contradicted` at $-0.5$, and `consistent` and `untested` cap nothing. There is no verdict that *raises* a number — surviving the bench is the absence of evidence against a statement, not evidence for it.\n- **It also changes the generated prompt.** Every `<id>_prompt.md` carries the whole register and this node's verdict, so the packet is testable against the same bench outside this repository. That regeneration is automatic; never hand-edit a prompt.\n\n## 1. Goal and register gate\n\nBefore anything else, establish that there *is* a bench.\n\n- One question in `blueprint/main_dag.md` carries a `**Goal.**` paragraph. Find it. If none does, or more than one does, stop and report — `python3 tools/build_dag_site.py --check` fails on both, and running a goal check against no goal is meaningless.\n- Read `blueprint/key_examples.md` in full. Note how many entries it has and how many are `KEY: positive`. An entry whose source has not been read at page level says so in its own text (`K7` does); it is carried and it is not usable as a positive.\n- The node's question need not be the goal question. A node of another question is checked against the same bench, and the entries will simply be silent more often — which is a result, not a failure.\n\n## 2. Node gate\n\nResolve the id to its directory: split it at each `-L`, take the successive prefixes, join with `/`. `Q1-L5` gives `blueprint/nodes/Q1-L5/`; `Q1-L2-L1` gives `blueprint/nodes/Q1-L2/Q1-L2-L1/`, because a sub-lemma is written inside its parent. Write `<dir>` for that path below.\n\n- `<dir>/<id>_node.md` absent → report and stop.\n- `role: thought` → refuse, as `/prove` does. There is nothing to specialize.\n- The node's status does not matter. An `open` node is the best time to run this; a `proved` node is worth running because a proof of a statement that is false on a known case is a proof with a mistake in it.\n- If `<dir>/goalcheck.md` already exists: say so and ask before re-running. It is dated evidence and it moves a ceiling; overwriting it silently loses the first reading *and* silently moves the number.\n\nThen **read the `## Statement` yourself and list its clauses** — each numbered clause, each hypothesis, the conclusion. That list is the yardstick §4 checks the agent against, and you do not delegate it: an agent that writes its own yardstick finds that everything it checked was covered.\n\n## 3. Packet\n\nLaunch the **goal-checker** subagent (Agent tool, `subagent_type: goal-checker`) with, inline:\n\n- the node id, its `role`, and the full text of its `## Statement`;\n- **your clause list from §2**, numbered;\n- the **full text of `blueprint/key_examples.md`** — every entry, including the `weak`, `degenerate`, `out-of-class` and `negative` ones, because those are what stop a vacuous pass from reading as a real one;\n- the **full text of each appendix entry** the node's `objects:` line names, so the hypotheses being specialized are in front of it;\n- the statements of the node's direct prerequisites, and the question's `**Setting.**` and `**Problem statement.**` paragraphs;\n- the instruction that a `degenerate` entry can never on its own produce `consistent`, and that a pair where the entry cannot see the clause is reported `silent` rather than resolved;\n- the requirement of exactly one `GOALCHECK:` line, choosing the *worst* outcome any entry produced.\n\nOne node per invocation. Do not batch: the value of this command is that the orchestrator reads the result.\n\n## 4. Goal gate (you, not the agent)\n\nThe failure mode here is not a fabricated citation — the register's sources are already read. It is a **manufactured verdict**: an agent that reports `consistent` because the statement survived twelve entries that could not see it. So gate the verdict against the reasoning under it.\n\n**a. Exactly one verdict**, on its own line, one of the four values:\n\n```\ngrep -c '^GOALCHECK:' <dir>/goalcheck.md\ngrep -E '^GOALCHECK: (consistent|untested|tension|contradicted)$' <dir>/goalcheck.md\n```\n\n**b. Every register entry appears in §1 of the file, and no others.** Count them against §1 of this run. An entry the agent skipped is a gap in the check; an entry it invented is worse, and the fix is to reject the file, not to add the entry to the register.\n\n**c. The verdict is earned** — read §1 and check the line against what is under it:\n\n| Line | What has to be there |\n|---|---|\n| `contradicted` | at least one entry marked **fails**, with the failure exhibited — the object, the orbit, the category, the computation. A suspicion is `tension`, not this |\n| `tension` | at least one **strains**, naming the specific thing the statement would need and does not claim |\n| `consistent` | at least one **holds** *non-vacuously*, and no `strains` or `fails` anywhere |\n| `untested` | every hit was `silent` or `holds vacuously` |\n\n**The check that matters most:** if the only positive hits are on entries whose register verdict is `degenerate`, the line must be `untested`. A statement that passes only where $\\mathrm{IC}_0$ is the monoidal unit has not been tested — that is precisely why the group case is on the bench as `K9` and not as a positive.\n\n**d. Specializations are concrete.** Each non-silent row names the group, the variety and the objects the clause quantifies over. \"The statement holds here\" with no substitution is an assertion, which is what you sent the agent to check.\n\n**e. §2 is complete.** Take the union of the clauses §1 reports on, against your §2 clause list. Whatever is left over must appear in the file's §2 as untouched. A clause the agent silently dropped is the one thing this command exists to surface.\n\n**f. Nothing outside the one file changed.** `git status` — the run writes `<dir>/goalcheck.md` and nothing else. A modified `<id>_node.md` is a violation with no exception: the goal checker never edits a statement, a field or `human:`.\n\n**g. Closed-world hygiene** — no bare backticked appendix label, no house macros, math renderable by KaTeX. §6 catches these mechanically; read for them anyway.\n\nAny violation: reject the file (`git checkout --` if tracked, delete if new) and report. Nothing about the DAG changes either way.\n\n## 5. Referral, not action\n\nA `contradicted` verdict is the most valuable outcome this command has, and it is **not** a refutation. Two things follow, and neither is automatic:\n\n- The ceiling applies on the next build. That is the whole of what the machinery does.\n- The statement is not revised, the status is not reset, and `human:` is not touched. Report it at the top of your message as a referral, with the next action named: `/update <id>` to correct the statement (which records the correction in `updates/u<k>.md` and resets a `drafted`/`proved` node to `open`), or `/prove <id>` so the critic sees it, or the user setting `human: doubted`.\n\nIf §4 of the agent's file proposes a key example that would decide an untouched clause, report that too: a new register entry is written by hand and read at page level, and the register is the user's and `/update`'s to extend — never the goal checker's.\n\n## 6. Verify and regenerate\n\n```\npython3 tools/build_dag_site.py\npython3 tools/check_render.py\n```\n\n- `--check` rejects a `goalcheck.md` with no parsable `GOALCHECK:` line, a register entry whose id or anchor is malformed, a register entry naming a node that does not exist, a goal with no register, and a register with no goal.\n- The rebuild regenerates every `<id>_prompt.md` — the register and this node's verdict travel in the packet — and the node's `goalcheck.html`, and the yellow key-example marks on the graph.\n- **Read the node's confidence line in the rebuilt output and report it.** If a ceiling now binds, `conf_note` says so in as many words: *capped by the key examples (tension)*.\n- All of `blueprint_site/` and every `<id>_prompt.md` are generated. Never hand-edit them.\n\n## 7. Presentation pass\n\nOne `checker` subagent on the one file this run wrote, per [ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html): reformat for clarity, display-math separation, notation consistency and working links, changing no claim. Then run the content-preservation gate yourself — diff the claims, not the agent's word for it — and in particular confirm the `GOALCHECK:` line is byte-identical afterwards. The checker may never touch a verdict line.\n\n## 8. Record and close\n\n- Append a dated entry to `<dir>/<id>_history.md`: what the check found, which entries it touched, the verdict, and the ceiling it now imposes. Link `goalcheck.md`.\n- Add a `process/journal/YYYY-MM-DD_NN_slug.md` entry with its one line in [`process/journal.md`](../process/journal.html).\n- `python3 tools/batch.py close`. **Do not commit** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)) — leave the changes in the tree and put the ceiling and the referral in the report.\n\n## 9. Report\n\nState, in this order: the verdict and the ceiling it imposes; the node's confidence before and after; which entries could see the statement and what they said; **which clauses nothing on the bench touched**; and the referral, if any, with its next action named.\n";</script>
