<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>prove</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/prove &lt;node-id&gt;</h1><p class="lead">Generated from <code>.claude/skills/prove/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /prove <node-id>\n\nYou (the main thread) are the orchestrator. Subagents never touch `<id>_node.md` or `blueprint/main_dag.md` — all DAG edits happen here.\n\n## 0. Scout the closed world (before spending anything)\n\nCheapest check in the loop, and it addresses the pipeline's dominant stall: of the flaws carrying a kind letter, `G` — *a step has no reason available* — is the largest class, and a one-round `/prove` costs ~270k subagent tokens. Discovering at Step 8 that the appendix cannot reach the argument is the most expensive moment available to find out.\n\nSo, before the prover packet: read the node's `## Statement` against `blueprint/appendix/index.md` and ask *which steps will want a cited fact, and is it there?* This is your own reading — no subagent, a few thousand tokens.\n\nIf something is plainly missing, do not launch the prover. Write `blueprint/nodes/<id>/gaps/g<n>.md` yourself in the format of [ADR 0076](../process/decisions/0076-a-gap-is-a-prompt.html), set **status:** `gapped`, and report — the node is waiting on the appendix, and a prover run against a closed world that cannot reach the claim buys a critique round saying so and nothing else.\n\nBeing unsure is not a reason to stop: scouting is a cheap way to skip a doomed run, not a gate the node has to pass. When the answer is \"probably there\", continue to §1.\n\n## 1. Node gate\n\nRead `<dir>/<id>_node.md`, where `<dir>` is the node's directory. Resolve the id to its directory first: split it at each `-L` / `-e` / `-a` / `-z`, take the successive prefixes, join with `/`, and **open the chain with the node's question**, which is a container directory of its own ([ADR 0059](../process/decisions/0059-a-container-is-a-directory.html)). `Q1-L3` gives `blueprint/nodes/Q1/Q1-L3/`; `Q1-L2-L1` gives `blueprint/nodes/Q1/Q1-L2/Q1-L2-L1/`, because a sub-lemma is written inside its parent, inside its question. Write `<dir>` for that path below.\n\n**Take the lock before reading further.**\n\n```\npython3 tools/batch.py claim <id>\n```\n\nA claim covers the node's whole subtree, so a `BUSY` line means another session holds a run that would race this one — on the same node, on an ancestor whose prover is reading this statement, or on a descendant whose `/update` may be rewriting one this run depends on. Stop and report who holds it; do not work around it.\n\n- File absent → report the error and stop.\n- **The write-up on disk proves a superseded statement** — `check_render.py` §11 reports a kind-`S` drift labelled *superseded by u\\<n\\>*, and the node's flaw block says so too. This is not a starting point and must not be handed to the prover as one: `/update` moved the statement under it, so its steps argue for a claim that is no longer the node's, and the standing flaws of the last round were raised against the old wording. Read the `u<n>.md` first, and pass the prover **the current statement, the superseded one, and what changed**, with the instruction to rebuild rather than patch. The round numbering continues as always.\n- **role:** `thought` → stop: a thought node states nothing a referee could certify. Reclassifying it is the user's decision ([ADR 0015](../process/decisions/0015-every-node-declares-its-role.html)).\n- **An unproved dependency never stops the run** ([ADR 0045](../process/decisions/0045-there-is-no-blocked-node.html)). There is no `blocked`. A dependency contributes its **statement**, and a statement is as usable before it is established as after — that is what it means for the DAG to carry statements rather than write-ups. What the run owes instead is *disclosure*: resolve each `depends-on` node, note which are `proved` and which are not, and carry that split into the packet (§2) and the report (§8). The confidence derivation already caps this node by the weakest node beneath it, so nothing here can overstate what the write-up is worth.\n- **The latest critique closes `VERDICT: REFUTED`** → stop. The statement is on record as false and `/prove` cannot repair it; what is owed is `/update <id>`, which is the only operator that writes a `## Statement` ([ADR 0046](../process/decisions/0046-a-refuted-statement-needs-a-change.html)). Point the user at the node's `<id>_history.md` entry and the suggested correction in it.\n- Already `proved` → stop and ask, unless the user has said to re-prove. Re-proving is a real operation — a renotated statement, a widened appendix — but it discards a write-up that passed. If the user confirms:\n  - `git rm` the existing `proof.md`;\n  - set **status:** back to `open` and **draft:** to `—`;\n  - leave **critique:** pointing at the last round — the existing rounds under `critiques/` stay on disk, and the numbering continues from them (§3d).\n\n## 2. Prover packet\n\nLaunch the **prover** subagent (Agent tool, `subagent_type: prover`) with a prompt containing, inline:\n\n- the node id, the resolved path `<dir>/<id>_node.md`, the full text of that file's `## Statement` section, and its `objects:` links. Pass the resolved path — the subagent must not have to work the depth out for itself;\n- the **full text of each appendix entry** those links name, quoted inline from `blueprint/appendix/`, so the prover has the statement and the hypotheses without hunting for them;\n- the `## Statement` text *only* of each `depends-on` node, **in two labelled groups**:\n\n  - **Facts (established)** — the dependencies whose node file says `proved`;\n  - **Facts (assumed — not yet proved)** — every other dependency, each one carrying its id and its current status.\n\n  Both groups are usable in the argument on equal terms: this node's job is the step from those statements to its own, not the establishment of the statements. The one thing the prover owes is that the write-up **names, in a closing line, which assumed facts it actually used** — a proof that leans on an assumed statement is sound, and a proof that leans on one silently is not ([ADR 0045](../process/decisions/0045-there-is-no-blocked-node.html));\n- instructions to read `blueprint/context.md` (setting, standing hypotheses, ratified readings, and the **## Notation** section) and to copy `blueprint/nodes/_template.md`;\n- the notation convention, quoted: every symbol whose meaning depends on an ambient category names it — generation brackets, mapping spaces, and `=` / `\\simeq` between objects or subcategories of a common ambient. A prover who does not see this writes bare relations and spends a round being told about it;\n- a reminder of the closed world: **the whole of `blueprint/appendix/`** plus `depends-on` statements, nothing else. The node's `objects:` is a starting point and not a fence — an entry elsewhere in the appendix may be linked and used, and named in the write-up's closing line so you can add it to the field. A fact **no** entry supplies is a `GAP`, not a citation to invent ([ADR 0071](../process/decisions/0071-the-closed-world-is-the-appendix.html));\n- **the standing instruction on falsity.** If the statement cannot be proved because it is *false as written* — a missing hypothesis, a quantifier the wrong way round, a counterexample the prover can exhibit — the prover must say so explicitly and stop, rather than produce an argument with a hole in it. Write the failing case out. That report is what opens §3f, and it is a more valuable run than a strained proof;\n- the pointer to the local library: the sources behind the black boxes are PDFs in `papers/`, each named by its `refs.bib` key and indexed by `papers/guideline.md`, and a hypothesis \"as cited\" is checked against the PDF with Read (the `pages` parameter), not recalled;\n- the length constraint — **at most 1500 words**, with a **split signal at 1000** ([ADR 0060](../process/decisions/0060-a-write-up-has-two-budgets.html)) — and that restating an appendix entry instead of linking it is what breaks it;\n- the markdown rules: standard KaTeX only, no house macro from `preamble.tex`, display math in `$$` blocks, and every appendix object written as a *link* into `blueprint/appendix/` rather than a bare backticked label;\n- **if `critiques/` is not empty**, the instruction to read every round already there. On a re-proof those are about an earlier write-up of the same statement; a flaw two referees already caught, reintroduced, is worse than a new one;\n- on rounds ≥ 2: the path of the latest critique file and \"address every numbered flaw\".\n\n## 3. Rounds r = 1, 2 — the budget cap\n\n**Two rounds *per invocation*, and at most one widening ([ADR 0030](../process/decisions/0030-the-prove-budget-cap.html)).** The round **numbering on disk** is a different thing: it continues from whatever `critiques/` already holds (§3d).\n\nThe cap is a spending decision, not a claim about mathematics. Measured over the four children of Q1-L4: a node that passes in one round costs ~270k subagent tokens, and a second round roughly triples it — the r2 prover packet is larger than r1's, and it usually pulls a lead-researcher widening and a second critic in behind it. Round 3 was never reached on any node. So the third round bought nothing and stood to cost the most.\n\n**a. Draft** — the prover writes/revises `<dir>/proof.md` and self-checks.\n\n**b. Render gate** (re-verify yourself):\n\n```\npython3 tools/check_render.py\n```\n\n- Sections 1–5 are about the new file: every math fragment renders under KaTeX, no house macro from `preamble.tex` leaked in, `$$` blocks are balanced, every link and anchor resolves, and the write-up is inside the word budget.\n- A write-up used to be LaTeX and this was a compile; markdown does not fail to build, so what would once have been a compile error is now a fragment that silently renders as literal text — which is why the gate runs on every round rather than at the end.\n- On failure: send the reported lines back to the prover — max 2 fix attempts per round; render fixes do not consume rounds.\n- Still failing → set status `failing` (§4), note \"render failure\" in the node file, commit, report, stop.\n\n**b′. Closed-world gate** — check 11 of the same run, and it runs **before the critic**, which is the whole point of it ([ADR 0071](../process/decisions/0071-the-closed-world-is-the-appendix.html)).\n\n- A **statement drift** note (kind `S`) means the write-up's `## Lemma` is not the node's `## Statement`, and the gate says which of two things caused it.\n  - *prover drift* — the node has no `updates/`, so the prover mistranscribed. Send the printed difference back with the instruction to paste the node's statement verbatim. This does **not** consume a round: it is a `diff`, the referee should never see it, and it is what produced the only FATAL standing in the repository.\n  - *superseded by `u<n>`* — the node has an update, so `/update` moved the statement under a write-up that was correct when it was written. **Do not re-sync the `## Lemma`**: pasting the new statement over the old one leaves the steps proving the old claim under the new heading, which is the same defect with the evidence removed. This is §1's superseded case; treat the draft as a rebuild.\n- An **undeclared entry** note (kind `W`) means the draft used an appendix entry the node's `objects:` does not name. Read the entry, confirm it says what the draft uses it for, and add the link to `objects:` yourself. No round, no lead-researcher, no widening.\n- **A widened `objects:` has no second half.** The entry is not edited back: who cites it is derived from the nodes' `objects:` fields at build time ([ADR 0080](../process/decisions/0080-who-cites-an-entry-is-derived.html)). The one edit to the node's field is the whole of the work.\n- Neither §11 note fails the gate, so `check_render.py` still prints `PASS` with them outstanding. Read the notes; do not rely on the exit code for these two.\n\n**c. Page gate** — check 5 of the same run reports the word count against the budget.\n\n- Over budget → back to the prover once, with the instruction to link appendix entries rather than restate them.\n- Still over → accept the draft, continue the round, and report the overflow to the user as a signal that the node should be split. **Do not spend a round on compression**: a prover that has already compressed once buys tens of words, not hundreds, and the gate stays red either way. Ask the prover which self-contained piece makes the cleanest sub-lemma and put that recommendation in the report — the split is the user's call, because it costs a decompose plus a fresh prove run.\n\n**d. Critique** — launch the **critic** subagent (`subagent_type: critic`) with: the draft path, the node's Statement, the **two labelled dependency groups exactly as §2 passed them**, its `objects:` links, the round number, and the pointer that the cited sources are on disk in `papers/` (PDFs named by `refs.bib` key) so a black box's hypotheses can be checked against the paper itself.\n\n- Tell it what the assumed group means: leaning on an assumed statement is **not** a flaw, and leaning on one the write-up does not disclose **is**.\n- Tell it the three verdicts and what separates them: `PASS`, `FAIL` (the argument does not establish the claim — send it back), and `REFUTED` (**the statement is false as written**, with the counterexample or failing case exhibited in the report). `REFUTED` is not a strong `FAIL`; it is a claim about the statement rather than about the write-up, and a critic that suspects falsity without being able to exhibit it issues `FAIL` with the doubt as a FATAL flaw ([ADR 0046](../process/decisions/0046-a-refuted-statement-needs-a-change.html)).\n- It writes `<dir>/critiques/r<n>.md`, where `<n>` is the next free number — if the directory already holds `r1`–`r3` from an earlier attempt, this round is `r4`. Numbering never restarts.\n\n**e. Verdict** — read the critique's final `VERDICT:` line:\n\n- `PASS` → exit the loop.\n- `REFUTED` → leave the loop immediately for §3f. It does not consume a round and does not open one: there is nothing a second round could do about a false statement.\n- `FAIL` and r = 1 → round 2 (prover gets the critique path).\n- `FAIL` at r = 2 → exit the loop as failed. Do **not** open a third round: set `failing` (§4), report the unresolved flaws, and let the user decide whether the node is worth more.\n\n**Undeclared entries are yours to fix, and they are not a FAIL** ([ADR 0071](../process/decisions/0071-the-closed-world-is-the-appendix.html)). The closed world is the whole of `blueprint/appendix/`; a node's `objects:` records what its write-up used. When the draft links an entry the field does not name:\n\n- check the entry exists and that the draft's use matches what it says — that is the whole check, and it takes one Read;\n- **add the link to `objects:` yourself.** No lead-researcher, no round consumed, no widening spent. §5's gate reports the same difference, so this is bookkeeping you were going to do anyway;\n- a `W` flaw from the critic is at most a MINOR by its own spec. If one arrives graded higher, treat it as the MINOR it is and say so in the report.\n\n**A real widening is a new appendix entry, and the cap is on those.** When the proof needs a fact **no entry supplies**, the prover has reported a `GAP` and the closed world has to grow:\n\n- writing the entry is the **lead-researcher's** job: launch it for that one edit, with the gap, and have it transcribe the statement and hypotheses from the source PDF before declaring it. Then continue the round;\n- never invent an entry to close a flaw, and never let a proof assume a result the repository has not written down;\n- **one new entry per invocation.** A second `GAP` after one has already been discharged is a stop: report what the second one needs and let the user decide. Two new entries in one run means the node was cut against the wrong world, and a third is not the fix;\n- when the citable route is closed — the source has no `refs.bib` key, and only the user adds keys — a **ratified reading** is the honest fallback, recorded on the appendix entry and in `context.md`. It is still a widening and still counts against the one.\n\n**f. The refutation branch** — entered from a `REFUTED` verdict, or from a prover that reported the statement false under §2's standing instruction and refused to draft. The statement is wrong, and `/prove` may not fix it: a `## Statement` is written by `/update` and by nobody else ([ADR 0019](../process/decisions/0019-the-update-operator.html)). What this run does is **check it, record it, and hand it over** ([ADR 0046](../process/decisions/0046-a-refuted-statement-needs-a-change.html)).\n\n1. **Read the literature before believing it.** Launch the **example-finder** subagent (`subagent_type: example-finder`) on the node with the refutation quoted, asking three things: does the published record contain the statement, or one entailing or contradicting it; is it false only *as stated* — a missing hypothesis, a quantifier the wrong way round, a scope too wide — or false in substance; and does the literature already carry the corrected form, with the source read from the PDF in `papers/` rather than recalled. It writes `examples.md` or `prompts/examples.md` under its own write discipline, never the node file. A refutation that has not been read against the record is one agent's opinion, and the corrections most worth having are already in print.\n2. **Record the false version, in the node's history and nowhere else.** Append a dated entry to `<dir>/<id>_history.md`:\n   - what the run was doing and which round refuted it, linked;\n   - the refuted statement **quoted verbatim** — the whole `## Statement`, in a blockquote. This is the point of the entry. The claim the project believed is preserved where a reader can find it, because the statement itself is about to be replaced;\n   - the failing case or counterexample, stated concretely;\n   - what the literature pass found, linked;\n   - a **suggested corrected statement**, written out in full and *labelled as a suggestion*. It is not adopted, it is not copied into the node file, and no proof may cite it. `/update` decides.\n3. **Leave the `## Statement` untouched.** Verify this yourself before committing: `git diff -- <dir>/<id>_node.md` must show a change to **status:** and to nothing else.\n4. Set **status:** `failing` (§4). Skip §6's presentation pass on `proof.md` — there is no write-up.\n5. Report under §8 as `refuted`, and tell the user the next action is `/update <id>`, not another `/prove`.\n\nThe site will now show this node with a red **needs change** chip rather than the amber **needs update** one, derived from the round's verdict. The two mean different things: *needs update* is the record moving and the statement wanting a fresh look; *needs change* is the statement being wrong.\n\n**g. Reconcile — the run ends by owning the statement it just tested.** Whatever the verdict, the round has produced findings, and they do not all belong to the prover. Sort every standing flaw of the last round — plus anything the prover reported under §2's standing instruction — into four owners, and act on each in the same invocation:\n\n| what the finding says | owner | what this run does |\n|---|---|---|\n| the **write-up** does not establish the claim | prover | already handled: another round, or `failing` at the cap |\n| the **statement** is defective — a hypothesis it uses and does not declare, a symbol bound twice, a clause whose scope contradicts its own opening, a quantifier the wrong way round | `/update` | **run it now**, below |\n| an **appendix entry** is missing | lead-researcher | the widening of §3b′, or a `GAP` that stops the run |\n| the statement is **unreachable** as cut — the referee names claims the tree does not carry | `/decompose` | commission it in the report; do not cut nodes here |\n\nRow two is why this stage exists. A `/prove` that ends by reporting \"the statement has three defects\" and stops leaves the node `failing` against a statement everybody already knows is wrong, and the next operator to touch it is a separate `/update` invocation that has to re-read the whole record to find out what this run already knew. Worse, when that `/update` does run, it moves the statement out from under a write-up nobody re-syncs — which is exactly how a `failing` node comes to hold a superseded draft.\n\nSo: when a standing flaw is statement-owned, run **§2, §4 and §5 of [`/update`](update.html)** on this node — verify the flaw against the repository rather than taking the referee's word for it, write `<dir>/updates/u<n>.md` at the next free number, edit the `## Statement`, and append the dated `<id>_history.md` entry. You are already the orchestrator and `/update` has no subagent, so this costs no agent budget.\n\nThree limits on it, and they matter:\n\n- **Do not re-prove.** The statement has just changed, so a fresh round wants a fresh packet and is a fresh invocation — that is the budget cap of [ADR 0030](../process/decisions/0030-the-prove-budget-cap.html), which counts rounds per invocation and not per node. Report `/prove <id>` as the next action.\n- **Do not run §6–§8 of `/update`.** Proposals, `process/`, a question's `## Pipeline` and its framing sections are repo-wide writes and belong to a repo-wide run ([ADR 0072](../process/decisions/0072-a-run-is-node-local-or-repo-wide.html)). A statement correction this run needs to propagate outward is *recorded in the `u<n>.md`* for that run to pick up, not made here.\n- **Verify before adopting.** A referee's flaw is a lead, not a source, exactly as an external passage is. A flaw you cannot confirm against the node's own dependencies and the appendix is reported and not acted on.\n\nSkip the stage silently when the verdict is `PASS` with no statement-owned MINOR outstanding, and when the verdict is `REFUTED` — §3f already hands the whole statement to `/update`, and doing it twice would write two records of one change.\n\n**h. Say what would clear it — when the node ends negative on its own record.** A round that closes `FAIL` or `REFUTED` leaves the node at negative confidence. Before you finish, set the node's `needs:` field ([ADR 0077](../process/decisions/0077-the-ask-is-a-line-on-the-node.html), [I41](../process/pipeline.html#4-invariants)) — one line in the field block of `<dir>/<id>_node.md`, carrying two things:\n\n- **What is missing** — the facts, not the flaws. Row three and row four of §3g's table are the source: the appendix entries nobody has written, the hypothesis stated over the wrong field, the computation no source on disk performs. Name each one, and name the source you suspect carries it if you suspect one. The flaws themselves are already in the critique and in the generated flaw block; restating them stores the same fact twice.\n- **What the repair is worth** — run `confidence()` from `tools/build_dag_site.py` against the node tree and say what a `PASS` on this node alone buys, and what else has to move first. This is cheap and it pre-empts the commonest wasted run: proving a node whose ceiling is held by an `open` child.\n\nThe line is authored, never generated, and `tools/build_dag_site.py` carries it into `<id>_prompt.md` — so it is the packet's ask, and the reader outside this repository is the one who can answer it. Nothing in it is established and nothing in it may discharge a step. Where the missing thing is an appendix entry, link the `gaps/g<n>.md` that commissions it rather than restating the commission.\n\nSkip when the verdict is `PASS`. Set the field to `—` when the node has gone non-negative, and cut the part of the ask this round met rather than leaving it standing.\n\n## 4. DAG write-back (you only)\n\n**One file.** A status is written in exactly one place:\n\n- `<dir>/<id>_node.md`: **status:** (`proved`, `gapped` or `failing`), **draft:** `[proof.md](proof.md)`, **critique:** the latest round as a `[r<n>.md](critiques/r<n>.md)` link.\n- **`gapped` when, and only when, the closed world is the sole thing standing** ([ADR 0076](../process/decisions/0076-a-gap-is-a-prompt.html)). Read the critic's closing sort of the standing FATAL/MAJOR flaws. If *every* one of them is the closed world coming up short, the status is `gapped`, `gaps/g<n>.md` must be on disk, and the node scores **silent** on the mathematical channel rather than −1.0 — because the statement stands, the argument stands, and nobody has refuted anything. If *any* standing FATAL/MAJOR is an ordinary defect — an unchecked hypothesis, a step asserted rather than derived, a scope mismatch — the status is `failing`, whatever else is also true. A node may carry `gaps/` and be `failing`; the record and the status are independent, and `Q1-L5-L3-L4` is the worked case: a real gap, a written commission, and three argument defects that keep it `failing` regardless.\n- A refuted node is `failing` with **critique:** pointing at the refuting round and **draft:** left at `—`. There is no separate stored status for it: what kind of defect stands is what the verdict line already records.\n- The index bullets and the tally in `blueprint/main_dag.md` are generated from the node files in §5 — never edit inside the `BEGIN INDEX` markers by hand.\n- `ready` is derived, not stored, so a dependent node needs no edit when this one becomes `proved`. Leave its status `open`; the index and the graph work out that it is now ready.\n\n## 5. Regenerate and re-check\n\n```\npython3 tools/build_dag_site.py --canonical      # prompts, flaw blocks, main_dag index — 9 s\npython3 tools/check_render.py --only <dir>       # this node's files — under a second\n```\n\nClose the batch when the run — or the last of several parallel runs — is done:\n\n```\npython3 tools/batch.py close                     # canonical, pages, full gate, consistency\n```\n\n- **Regeneration is a gate, not a courtesy: the run is not finished until `close` prints `OK`.** It is what puts the new write-up, the new critique and the refreshed index into the record.\n- `--only` and `--canonical` exist so that several `/prove` runs can hold the gate at once ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). The per-file checks are correct on a subset; the DAG-page and site checks are about the generated artifact and belong to `close`. **Never report a scoped pass as a repository pass** — the scoped run says `(scoped)` on its last line for exactly that reason.\n- Working in parallel with another run: `python3 tools/batch.py claim <id>` before §2 and `release <id>` after §8. The claim is advisory and costs nothing; it exists because two sessions in one working tree is this repository's recurring operational hazard.\n- All of `blueprint_site/` and every `node_prompt.md` are generated readouts; never hand-edit any of them.\n- Running the render check again here catches what §3b could not yet see: house macros in the new critique (the critic is told to write standard KaTeX and does not always), a link that no longer resolves, and a generated prompt or page that no longer matches its canonical sources.\n- If the write-up is visually load-bearing — a table, a long display, a step that leans on how it is laid out — open the write-up's page and look at it. The site mirrors the source tree (ADR 0016), so the page for `blueprint/nodes/<chain>/proof.md` is `blueprint_site/nodes/<chain>/proof.html`. Checks have twice passed on a page that was visibly wrong.\n\n## 6. Presentation pass\n\nEvery command tidies what it wrote; there is no separate `/check` to remember ([ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html)). Launch one **checker** subagent (`subagent_type: checker`) per file this run wrote — the write-up, the new critique, the node file, and on a refutation the history entry — one path per agent, never batched. Skip the pass only when the run ended in a render failure.\n\nThen gate them mechanically, because content-preservation is yours to enforce and not theirs to promise:\n\n```\ngit diff -U0 -- <files> | grep -E '^[+-]' | grep -E 'VERDICT:|EVIDENCE:|\\*\\*status:\\*\\*|\\*\\*type:\\*\\*|\\*\\*role:\\*\\*|\\*\\*human:\\*\\*|\\*\\*created:\\*\\*|\\*\\*depends-on:\\*\\*|\\*\\*required-by:\\*\\*|<a id='\n```\n\nAny output is a violation: `git checkout -- <path>` that file and report it reverted. Then re-run step 5, since reformatting is exactly the operation that breaks a `$$` fence or a link.\n\nExamples are still a separate operation. A node that just reached `proved` is the best moment to run `/examples <id>` — suggest it in your report rather than running it here, because literature work has its own gate and does not belong inside a proof loop. The one exception is §3f, where the literature pass is part of the branch.\n\n## 7. Close, and do not commit\n\n```\npython3 tools/batch.py close\npython3 tools/batch.py release <id>\n```\n\n**If this run is one of several going at once, do not close.** `close` is the join for the whole batch, not for one run: it is a whole-repo canonical build, page build, gate and consistency check, and running it while a sibling session is mid-write reports that session's half-finished files as failures of yours. Release your claim, say in the report that the batch is still open, and let the last run standing — or the user — close once. During the run use the scoped forms instead, which touch only what you wrote:\n\n```\npython3 tools/check_render.py --only <dir>\npython3 tools/build_dag_site.py --canonical\n```\n\n**No operator commits** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). `git add blueprint/` was the stage that swept a concurrent run's half-written files into this run's commit, and the value it bought — a tidy history — is the user's to collect when they choose, on a working tree they can see. Leave the changes in the tree and say in the report what is uncommitted.\n\nAdd a `process/journal/YYYY-MM-DD_NN_slug.md` entry when the run taught you something — a gate that missed a defect, a flaw pattern that recurred, an appendix entry that had to be widened — with its one line in [`process/journal.md`](../process/journal.html) ([ADR 0067](../process/decisions/0067-the-journal-is-a-directory.html)).\n\nOn a refutation, the report quotes the refuted statement's first line and names the suggested correction.\n\n## 8. Report to the user\n\n- Node id, rounds used (and the round *numbers* written, if they did not start at 1), final verdict, word count against the budget, files written, and anything the prover appended to `papers/guideline.md`.\n- **Which assumed dependencies the write-up used**, by id and current status, quoted from the write-up's closing line. This is the disclosure ADR 0045 traded the old gate for; a run that does not report it has not paid for it.\n- On failure: quote the top unresolved FATAL/MAJOR flaws from the last critique, **each labelled with its owner from §3g's table** — a report that lists six flaws without saying which three were the statement's has handed the user the sorting job this stage exists to do.\n- **What §3g reconciled**: the `u<n>.md` it wrote, the defect in one sentence, and the fact that the write-up on disk now predates the revision. Say plainly that the next `/prove` is a rebuild and not a patch.\n- Whether the batch was closed or left open, and which claims are still held.\n- On a refutation: the failing case in one sentence, what the literature pass found, the suggested corrected statement, and `/update <id>` as the next action — never `/prove` again.\n- Surface any MINOR the critic flagged as worth acting on even under a `PASS`.\n- Suggest `/examples <id>` on a pass, and the next node worth doing if the DAG suggests one.\n";</script>
