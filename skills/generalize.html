<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>generalize</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/generalize &lt;node-id&gt; [with input]</h1><p class="lead">Generated from <code>.claude/skills/generalize/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /generalize <node-id> [with input]\n\nYou (the main thread) are the orchestrator: you decide whether the generality is real and write the general statement; the lead-researcher materializes the directory, because only it creates nodes.\n\nThe command answers one question:\n\n> Is the thing we now believe *strictly more general* than the node — and if so, what is the general statement, with the node as one instance of it?\n\nIt is the half of `/update` that used to be its §3 ([ADR 0078](../process/decisions/0078-generalize-is-its-own-operator.html)). It was split out because generalizing is **not** part of revising and must not happen by default: `/update` corrects what is wrong, and a node that is merely *narrow* is not wrong. Widening in place was the failure this guards against — it silently discards the referee rounds the old statement survived.\n\n**The rule this exists to enforce, and it is the whole command:** a statement is never widened in place. The general claim becomes a new node; the target is left standing, unedited, as its specialization; and the work already proved under the old statement stays proved.\n\n## 1. Claim and read\n\n```\npython3 tools/batch.py claim <id>\n```\n\nA `BUSY` line means another session holds this node or an ancestor. Stop and report who.\n\nRead `<dir>/<id>_node.md` — the `## Statement`, the field block, the generated flaw block — and the appendix entries the statement links. That is the node summary and it is where you start; read further only when the flaw block's own words are not enough.\n\nResolve the id to its directory by the id-is-path rule: split at each segment, take the successive prefixes, join with `/`, and open the chain with the question. `Q1-L2` gives `blueprint/nodes/Q1/Q1-L2/`.\n\n## 2. The generality gate — where this command stops\n\nMost invocations should stop here. Three tests, and **all three** must pass:\n\n**a. Strictly more general, and demonstrated.** The target's hypotheses are one instance of the general ones, or the target is the general theorem with a parameter set to zero. Write the specialization out — which substitution carries the general statement to the target's — in **one line**. If you cannot write that line, there is no abstraction: report it and stop.\n\n**b. Verified, not merely suggested.** An input passage is a lead, never a source ([`/update` §2](update.html)). Recompute the general claim against the appendix and the manuscript, not against the passage's paraphrase of it. An unverified generality is a priority row, not a node.\n\n**c. It buys something.** A general statement that no second node instantiates and no argument gets shorter under is notation, not mathematics. Name either a second instance already in the tree, or the step of an existing proof that the general form discharges. If you can name neither, report it and stop — the honest outcome here is usually \"the node is narrow and that is fine\".\n\nStop also, with no exception, when the claim is that the target is **wrong**. That is a defect, and defects go to `/update`.\n\n## 3. The id, the edge, and what stays untouched\n\nThe id names the instance and the number is the layer ([ADR 0064](../process/decisions/0064-an-abstractions-id-names-what-it-generalizes.html)):\n\n```\nQ1-L2       level 0     the special case                          untouched by this command\nQ1-L2-z1    level 1     the statement Q1-L2 specializes           ← what this command creates\nQ1-L2-z2    level 2     the statement Q1-L2-z1 specializes\n```\n\n`Q1-L2-z1` sits at `blueprint/nodes/Q1/Q1-L2/Q1-L2-z1/`. A second layer sits **beside** the first, not inside it — `parent_of(Q1-L2-z2)` is `Q1-L2`, not `Q1-L2-z1` — because both are abstractions *of the same instance* at different heights.\n\nThe edge is **specialization, not dependency**, and that has four consequences the gate checks or relies on:\n\n- the new node carries `instances:` naming every node it generalizes, each a link, each at a strictly lower z level. It is the only place the edge is stored — there is no transpose, and the instance node gains no field;\n- the instance does **not** acquire a dependency. A node with a proof does not take on an obligation by being recognized as a special case of something;\n- an abstraction is **not** a member of anybody's decomposition: it does not count against the parent's sub-lemma tally, it does not count against the ten-wide fan-out cap ([ADR 0050](../process/decisions/0050-a-node-has-at-most-ten-children.html)), and it does not fold into the instance's card;\n- `role:` is **`proof`**, always. `--check` fails an abstraction with any other role, and one whose `instances:` is missing, names a node that does not exist, or names one not strictly lower.\n\n**Nothing about the target changes**: not its `## Statement`, not its `status:`, not its `depends-on`, not its write-up, not its critique rounds. If this run wants to change the target, it is the wrong command.\n\n## 4. Commission it\n\nWrite the general `## Statement` yourself, in full, before launching anything — hypotheses as separate labelled paragraphs, appendix links instead of restatements, no new notation, and no hypothesis carried over that the general case does not need. Then hand it verbatim in **one** launch to the **lead-researcher** (Agent tool, `subagent_type: lead-researcher`), with:\n\n- the new id and the directory it goes in;\n- the full general statement, and the one-line specialization from §2a;\n- `type:` (usually `prop`), `role: proof`, `status: open`, `human: —`, today's `created:`, `instances:` as links, `depends-on:` its own prerequisites, `required-by: —`;\n- the appendix entries its `objects:` must link;\n- the justification — what verified it, what it buys — for the new node's `<id>_history.md`.\n\nRelative links are worked out from the **new node's own depth**: `../` repeated `s+2` times reaches `blueprint/`, where `s` counts all the id's segments, `-z` included.\n\n## 5. Record on the target — without editing its statement\n\nAppend a dated entry to `<dir>/<id>_history.md`: that `<id>-z<k>` now states the general case, the one-line specialization, and what verified it. Link the new node. This is the only write this command makes inside the target's directory, and it is a history entry, never a statement edit.\n\n## 6. Gates, and close\n\n```\npython3 tools/check_render.py --only blueprint/nodes/<path-to-new-node>\npython3 tools/build_dag_site.py --canonical\npython3 tools/batch.py close\n```\n\n`--check` is the one that matters here: it enforces the `instances:` rules of §3 and the id-is-path rule for the new directory. Then one **checker** subagent per file this run wrote, with the content-preservation gate you run yourself ([ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html)).\n\n**Do not commit** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). Release the claim.\n\n## 7. Report\n\nThe general statement in one line; the specialization in one line; what it buys, naming the second instance or the shortened step; the new node's id and status; and the next action, which is `/prove <id>-z<k>` — an abstraction is a proof node like any other and is proved, critiqued and exampled the same way.\n\nIf §2 stopped the run, say which of the three tests failed and what the honest outcome is: usually that the node is narrow, that this is not a defect, and that nothing is owed.\n";</script>
