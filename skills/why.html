<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>why</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/why &amp;lt;node-id&amp;gt; &quot;&amp;lt;question&amp;gt;&quot;</h1><p class="lead">Generated from <code>.claude/skills/why/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /why &lt;node-id&gt; \"&lt;question&gt;\"\n\nYou (the main thread) are the whole operator. There is **no subagent**: the work is reading what is already on disk and deciding which pointer answers the question, and an agent that has not read the record will write a plausible paragraph instead of a citation.\n\nThe command answers one thing:\n\n> A reader is looking at this node and wants to know **why** — why this statement, why this hypothesis, why this route. What is the shortest honest answer, and where does it come from?\n\n`status: failing` says *what is wrong*. The `needs:` line says *what would make it right*. Neither says **why the node is there**, and that is the gap this fills. See [ADR 0062](../process/decisions/0062-a-node-states-its-own-flaw.html) and [ADR 0077](../process/decisions/0077-the-ask-is-a-line-on-the-node.html) for the two it sits beside.\n\nWhat it can and cannot change:\n\n- **Nothing here enters the closed world.** A `why/w<n>.md` is outside it exactly as `examples.md` is. No proof, node or appendix entry may cite one, so a wrong answer costs a reader some minutes and can never corrupt an argument.\n- **It changes no number and no field.** Not the status, not the statement, not `needs:`, not `human:`, not a confidence channel. There is no verdict line in the file for the same reason: a scoring rule attached to an explanation would make explanations worth gaming.\n- **It is append-only.** `w1`, `w2`, … never restart and are never rewritten, exactly like a critique round. A second question about the same node is a second file.\n\n## 1. Question gate\n\n**The question is a required argument, and you may not invent it.** Explanation is contrastive — a reader asks why *this* rather than *that*, and the foil is theirs. An operator that guesses the foil answers a question nobody asked.\n\n- No question supplied → stop and ask for one. Do not run on the node alone, and do not offer a menu of questions you made up.\n- The question must be about **this node**: its statement, a hypothesis in it, its place in the decomposition, or a choice recorded in its history. A question about the mathematics of the field is a question for `/examples`; a question about whether the statement is *true* is a question for `/prove` or `/check-goal`. Say which and stop.\n- Record the question **verbatim**. Not a tidied version — the phrasing is evidence about what was unclear, and a later reader comparing the question to the answer is the only test this operator has.\n\n## 2. Node gate\n\nResolve the id to its directory: split it at each `-L` / `-e` / `-a` / `-c` / `-z` segment, take the successive prefixes, join with `/`, and open the chain with the question. `Q1-L5-L3` gives `blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/`. Write `<dir>` for that path.\n\n- `<dir>/<id>_node.md` absent → report and stop.\n- The status does not matter. A `proved` node is a good target — \"why is this hypothesis needed\" is exactly the question a finished proof provokes.\n- Next free number: `ls <dir>/why/` and take the successor. **Never overwrite `w<n>`.**\n- `python3 tools/batch.py claim <id>` before writing, and release at the end.\n\n## 3. Repository pass — always first, and usually sufficient\n\nMost \"why\" questions are already answered on disk, and the answer is a link rather than a paragraph. Read, in this order, and stop as soon as the question is answered:\n\n1. `<dir>/<id>_history.md` — every dated entry, oldest first. A node's reason for existing is almost always in its first entry, and a hypothesis's reason is in the entry for the update that added it.\n2. `<dir>/updates/u<n>.md` — what the statement used to say and why it changed. A question of the form \"why does it assume X\" is usually answered by the supersession that put X there.\n3. `<dir>/critiques/r<n>.md` — a hypothesis added to survive a referee is explained by that referee's flaw, in the referee's own words.\n4. `<dir>/gaps/g<n>.md` — why a step is not finished.\n5. The question's framing in `blueprint/nodes/Q<n>/Q<n>_node.md`, and `blueprint/context.md` — why the whole family is being asked.\n6. The appendix entries the node's `objects:` line names, **read in full**. \"Why this hypothesis\" is very often \"because the entry it invokes requires it\", and the entry says so.\n7. `process/decisions/` — when the question is about the machinery rather than the mathematics.\n\nQuote the record's own words where they answer it. A sentence lifted from a critique with a link to the critique is worth more than three sentences of yours.\n\n## 4. Literature pass — local library first\n\nOnly if §3 came back short. **The literature is local-first** ([ADR 0017](../process/decisions/0017-operators-read-the-local-library.html)): read the PDFs in `papers/` with the `pages` parameter before memory and before the web, using `papers/guideline.md` as the index. Reading widens nothing — it never makes anything citable.\n\nThe web is the last resort and every hit needs a URL a reader can open. **An unverifiable reference is worse than \"we do not know\"**, and this file is the one place in the repository where \"nobody here has written this down\" is an acceptable answer.\n\n## 5. Write the note\n\n`<dir>/why/w<n>.md`, with exactly these three `##` sections and nothing else:\n\n```markdown\n# Why w1 — <id>: <the question, shortened to a title>\n\n[node](../<id>_node.md) · [history](../<id>_history.md) · <ISO date>\n\n## Question\n\n<the user's question, verbatim>\n\n## Short answer\n\n<the answer — see the gate below>\n\n## Where to read further\n\n- [`label`](../../../../appendix/<section>/<stem>.md) — what it settles\n- [r2](../critiques/r2.md) — the referee flaw that put the hypothesis there\n- Author, *Title*, §4.2 — `papers/<key>.pdf`, read at page level\n```\n\nMechanics, all of them checked by the render gate:\n\n- **Under 300 words, whole file.** Not a target — a ceiling with a wide margin under it. Most good answers are eighty.\n- Relative links are worked out from **this file's own depth**: `why/` is one level below the node directory, so `../` repeated *s* + 3 times reaches `blueprint/`, where *s* counts **all** the id's segments. Do not copy a path from a sibling node at a different depth.\n- Objects are linked, never named: no bare backticked appendix label, no house macros, math renderable by KaTeX.\n- No `VERDICT:`, `EVIDENCE:`, `GOALCHECK:` or any other machine-readable line. This file feeds no channel.\n\n## 6. The delegation gate — the one that matters\n\nRun this on your own draft before saving it.\n\n**a. Every claim ends in a pointer.** A sentence that asserts something about the mathematics and cites nothing is the failure mode this operator exists to avoid. A post-hoc explanation of a process you did not observe is a second model that can simply be wrong about the first; delete the sentence or find the record it came from.\n\n**b. If it needs an argument, it is not a `/why`.** An answer that has to *establish* something has become a proof, and there is already an operator for that. Stop, write nothing, and report which operator is wanted: `/prove` for a claim, `/decompose` for a missing sub-lemma, `/examples` for whether it has appeared in print, `/update` for a statement that is wrong.\n\n**c. \"Nobody here knows\" is a legitimate answer, and it has a next action.** Write the file with the honest answer, then hand the user the node's generated packet — `blueprint/nodes/<path>/<id>_prompt.md` — as the thing to paste into a deep-research model that has never seen this repository. That packet is self-contained by construction ([ADR 0029](../process/decisions/0029-every-node-has-a-generated-self-contained-prompt.html), [ADR 0063](../process/decisions/0063-a-prompt-carries-what-is-needed-to-work.html)); whatever comes back is a lead and not a source, and it re-enters through `/update` or the appendix, never through this file.\n\n**d. Nothing outside the one file changed.** `git status` — this run writes `<dir>/why/w<n>.md` and appends to `<dir>/<id>_history.md`. A modified `## Statement`, status, `needs:` or `human:` is a violation with no exception.\n\n## 7. Verify and regenerate\n\n```\npython3 tools/check_render.py --only blueprint/nodes/<path>\npython3 tools/build_dag_site.py --canonical\n```\n\nThe render gate fails a `why/w<n>.md` that is over 300 words, is missing one of the three sections, carries a verdict line, or has a link that does not resolve. The site build draws the note as a `<details>` panel **above the node's statement** on its page, in the place an example would hang, and adds it to the node's Pages list.\n\n`<id>_prompt.md` does **not** carry it, and that is deliberate: the packet carries what a reader needs to *work* on the node, and an explanation of why the node exists is not a working input.\n\n## 8. Presentation pass\n\nOne `checker` subagent on the one file this run wrote, per [ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html). Then run the content-preservation gate yourself, and confirm the `## Question` section is **byte-identical** afterwards — the checker may improve the answer's prose and may never touch the question, because the question is the record of what was unclear.\n\n## 9. Record and close\n\n- Append a dated entry to `<dir>/<id>_history.md`: the question, one line of the answer, and where it came from — the record, the library, or nowhere.\n- If the answer came from nowhere, say so in the entry. A tally of unanswerable \"why\"s is the most useful thing this operator produces.\n- `python3 tools/batch.py release <id>`, or `close` if this is the last run standing. **Do not commit** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)).\n\n## 10. Report\n\nThe question; the answer in one sentence; **where it came from** — the repository, the local library, the web, or nowhere; and if nowhere, the path to the node's packet with the instruction to run it through a deep-research model. If the run stopped at §6b, name the operator that is actually wanted and say nothing else.\n";</script>
