<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>research-status</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/research-status</h1><p class="lead">Generated from <code>.claude/skills/research-status/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /research-status\n\n## 1. Parse\n\n- The node files are the source. Node directories nest — a sub-lemma sits inside its parent — so enumerate them with `find blueprint/nodes -name '*_node.md'`, never a one-level `*/` glob, which would silently report on the top-level lemmas only.\n- Read each for its fields: type, role, created, status, human, depends-on, required-by, draft, critique, objects.\n- Note which node directories carry a write-up (`proof.md`), rounds under `critiques/`, an `examples.md`, or open prompts under `prompts/`.\n- Do not read `node_prompt.md` as state. It is a generated self-contained readout whose presence and freshness the check below verifies.\n- Read `blueprint/main_dag.md` only for what a human wrote there: the question headings, the **Setting.**, **Problem statement.** and **Conjecture.** paragraphs. The bullets and tally inside the `BEGIN INDEX` markers are generated — read them if you like, but never treat them as evidence and never edit them.\n- `status:` in a node file is one of `open`, `drafted`, `failing`, `proved`. **`ready` is not stored**: a node is ready when it is `open` with all dependencies proved. Compute it; never write it down. **There is no `blocked`** ([ADR 0045](../process/decisions/0045-there-is-no-blocked-node.html)) — an open node with unproved dependencies is just `open`, and is workable today. Never report a node as unavailable.\n\n## 2. Check (report, do not paper over)\n\n```\npython3 tools/build_dag_site.py\npython3 tools/build_dag_site.py --check\n```\n\nRegenerate first, then check: every command ends with the generator, so neither a self-contained prompt nor the site is older than the state it reports on (invariants I17–I18) — a status readout over stale generated material is a readout about a repository that no longer exists.\n\nThe check is the machine half. It reports:\n\n- a node whose question has no section in the index;\n- a generated index block that is out of date;\n- a missing, stale or stray `node_prompt.md`;\n- `required-by` that is not the exact transpose of `depends-on`;\n- a dependency naming a node with no directory;\n- a sub-lemma whose parent does not exist;\n- an object pointing at an appendix anchor that does not exist;\n- a stored status that should have been derived;\n- a missing or malformed `created:`;\n- a node marked `proved` with no write-up or no critique on record;\n- any generated page that no longer matches the blueprint.\n\nActing on the output:\n\n- Fix only what is unambiguous and mechanical — a `required-by` that is missing its transpose, a stale generated page (rerun the build).\n- Anything that needs a judgement, including a dangling object link, is reported, not invented: `/decompose` adds appendix entries, you do not.\n- **Never commit** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). A readout that writes to history is not a readout. Report what changed and leave it in the tree.\n\n## 3. Report\n\nOne list per question, one line per node, no table:\n\n```\n- [Q1-L1](blueprint/nodes/Q1-L1/Q1-L1_node.md) — <title> — **proved**\n- [Q1-L5](blueprint/nodes/Q1-L5/Q1-L5_node.md) — <title> — **open** · would assume Q1-L2\n- [Q1-L2-L1](blueprint/nodes/Q1-L2/Q1-L2-L1/Q1-L2-L1_node.md) — <title> — **ready**\n```\n\n- The id links to the node file so it is clickable from the repo root.\n- Sub-lemmas are indented under their parent, two spaces per level.\n- After the status, add the note that applies: for `failing`, the count of FATAL/MAJOR flaws in the latest round under `critiques/`; for `open`, the dependencies a run would have to *assume*, phrased that way and never as a blocker; for `ready`, mark ✅ ready.\n- A node whose latest critique closed `VERDICT: REFUTED` is reported as **needs change**, not as work outstanding: its statement is false and the next action is `/update <id>`, never `/prove` ([ADR 0046](../process/decisions/0046-a-refuted-statement-needs-a-change.html)).\n\n## 4. Suggested next action\n\n- The ready node with the most downstream dependents — read them off **required-by:**, transitively; break ties by lowest id.\n- If none are ready and none failing: suggest a `/decompose` target.\n- If a node is `failing`: suggest reviewing its latest critique.\n";</script>
