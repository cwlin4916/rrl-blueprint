<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">skills</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>/examples &lt;node-id&gt;</h1><p class="lead">Generated from <code>.claude/skills/examples/SKILL.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n# /examples <node-id>\n\nYou (the main thread) are the orchestrator: the subagent reads the literature and writes one file, you own the gate and git.\n\nThe command answers two questions about one node, and the first is the one that has teeth:\n\n1. **Precedent** — has the statement, or one that entails it, or one that *contradicts* it, appeared in print?\n2. **Instances** — explicit examples that make it concrete, simplest first.\n\nAnd every answer to either question owes a third thing:\n\n3. **The match** — which part of the node's statement this finding matches, under what specialisation or dictionary, and what it does not reach ([ADR 0036](../process/decisions/0036-an-example-says-what-it-matches.html)). A finding that is merely *about the same objects* as the node is not evidence for it, and until the match is written down nobody can tell the two apart.\n\nWhat it can and cannot change:\n\n- Nothing this command does can change what any node may assume. `examples.md` is outside the closed world — no proof, node, or appendix entry may cite it, and a precedent in print is still not citable here; only an appendix entry is, and only `/decompose` writes those. So this is safe to run on a node in any state, including `proved`.\n- What it *does* change is the node's confidence. The `EVIDENCE:` line the agent writes is the literature channel of [ADR 0014](../process/decisions/0014-confidence-is-three-signed-channels.html), worth 25 of 100, and it is signed: `gap` and `counterexample` push the node negative and turn its card red. That line is the only part of `examples.md` that anything reads, which is why §3 gates it harder than the prose around it.\n\n## 1. Node gate\n\nRead `<dir>/<id>_node.md`, where `<dir>` is the node's directory. Resolve the id to its directory first: split it at each `-L`, take the successive prefixes, join with `/`. `Q1-L3` gives `blueprint/nodes/Q1-L3/`; `Q1-L2-L1` gives `blueprint/nodes/Q1-L2/Q1-L2-L1/`, because a sub-lemma is written inside its parent. Write `<dir>` for that path below.\n\n- File absent → report and stop.\n- The node's status does not matter. An `open` node is worth examining precisely because a decomposition can be consistent, survive the critic, and be about the empty set; a `proved` node is worth examining because a proof of a vacuous statement is still a proof, and because a precedent found afterwards can turn a lemma into a corollary.\n- If the directory already holds `examples.md` or `prompts/examples.md`: say which, and ask before re-running. A second pass a month later will find different sources — this is dated evidence, not a fixture, and overwriting it silently loses the first search *and* silently moves the confidence.\n\nThen **read the `## Statement` yourself and list the pieces a finding could match** — each numbered clause, each hypothesis, the conclusion. That list goes into the packet, and it is what §3c and §8 check against. Do not delegate it: it is the yardstick, and an agent that writes its own yardstick will find that everything it found fits.\n\n## 2. Packet\n\nLaunch the **example-finder** subagent (Agent tool, `subagent_type: example-finder`) with, inline:\n\n- the node id and the full text of its `## Statement`;\n- **the list of matchable pieces from §1**, numbered, with the instruction that every finding names the ones it matches and the ones it leaves untouched;\n- the **full text of each appendix entry** its `objects:` links name, so the hypotheses to discharge are in front of it rather than one hop away — an instance that \"satisfies the hypotheses\" without the agent having read them is a guess, and a precedent that \"is the same statement\" without them is a worse one;\n- the standing hypotheses from `blueprint/context.md`, which in this project are strong enough that whether the class is non-empty is a real question;\n- the node's `depends-on` statements, because a precedent for the node is often stated in the literature as a precedent for one of its dependencies;\n- the instruction to read `papers/guideline.md` first — and to search the local library first: the PDFs beside it are named by `refs.bib` key and are opened with Read (the `pages` parameter) before any web search — then to append to the reading list what turned out to matter;\n- **both halves, explicitly**: the four precedent targets (the statement itself, a strictly stronger statement, a special case in print, a contradiction) and the instance ordering (degenerate case, classical case, published computation, boundary case where a hypothesis fails);\n- **the match requirement**: each entry labelled *instance* or *analogue* in its heading; an explicit `**What it matches.**` field naming the clause or hypothesis, the specialisation or dictionary line it matches under, and what it does not reach; and, when the run works under a dictionary at all, that dictionary written out once with a source for each line of it that is in print;\n- the standard of evidence: a real citation with a numbered result, `(constructed, unsourced)` for a routine specialisation, never an invention, and **no unsourced precedent ever**;\n- the requirement of exactly one `EVIDENCE:` line, choosing the strongest claim the sources support, with the negative verdict winning a tie — and that a source matching one clause of several is not a precedent for the node.\n\nOne node per invocation. Do not batch.\n\n## 3. Example gate (you, not the agent)\n\nA fabricated citation with a plausible result number is the single worst artifact this repo could produce, because it is exactly the kind of thing a reader believes without checking. A fabricated *precedent* is worse still, because it now moves a number. So the agent's output is gated, not trusted.\n\n**a. Exactly one file** — exactly one of `examples.md`, `prompts/examples.md` exists in the node directory. Both, or neither, is a violation — delete nothing, report it.\n\n**b. Exactly one verdict** — `examples.md` carries exactly one `EVIDENCE:` line, on its own, with one of the five values. Zero or two is a violation. Check it yourself:\n\n```\ngrep -c '^EVIDENCE:' <dir>/examples.md\ngrep -E '^EVIDENCE: (precedent|instances|gap|counterexample|—)$' <dir>/examples.md\n```\n\n**c. The verdict must be earned** — read the file and check the line against what is under it:\n\n| Line | What has to be there |\n|---|---|\n| `precedent` | a source, a numbered result, and the argument that it entails the statement — with the parts of the statement it covers named |\n| `instances` | at least one instance with all four parts |\n| `gap` | the named source that should have contained it, or the named undischarged hypothesis |\n| `counterexample` | a source, and which hypothesis of the node its setting satisfies |\n| `—` | the searches, so the next run does not repeat them |\n\nA `precedent` with no result number, or a `counterexample` that does not say which hypothesis the source's setting satisfies, is a violation. So is a `precedent` earned by analogues alone, or by a source that matches one clause of several without saying so. This check is the whole reason the orchestrator reads the file.\n\n**d. Sources resolve** — every instance carries a source with a resolvable identifier (arXiv id, DOI, or full bibliographic data) and a numbered result. An instance with no source and no `(constructed, unsourced)` label is a violation. A *precedent* carrying `(constructed, unsourced)` is a violation with no exception.\n\n**e. Hypotheses discharged** — every instance has all four parts: what it is, why it is an instance *hypothesis by hypothesis*, **what it matches**, and what the statement says for it. An entry with no hypothesis discharge is an assertion that something is an example, which is what you sent the agent to establish.\n\n**f. Every finding names its match** ([ADR 0036](../process/decisions/0036-an-example-says-what-it-matches.html)) — the one check that is about the mathematics rather than the sourcing, so it is yours and not a grep's. For each entry, and for each precedent hit:\n\n- it says **which part** of the statement it matches, in the statement's own terms — a clause number, a named hypothesis, the conclusion. \"Related to the node\" is a violation;\n- it says **under what correspondence** — the specialisation for an instance, the dictionary line for an analogue. An entry that is an analogue and does not say so in its first sentence is a violation: the reader will otherwise take a decategorified shadow for a case of the statement;\n- it says **what it does not reach** — the clause it is silent on, the structure the dictionary drops, the hypothesis the source's setting fails;\n- and where the file uses a dictionary at all, the dictionary is written out once, with a source for each line of it that is in print and a plain label where the agent extended it.\n\nThen take the union of the matched parts against your §1 list. **Whatever is left over is a finding**, and it goes in the report: those are the parts of the statement the literature does not touch.\n\n**g. Bib keys** — spot-check the claimed keys:\n\n```\ngrep -o '`[a-zA-Z0-9_]*`' <dir>/examples.md | tr -d '`' | sort -u | \\\n  while read k; do grep -q \"{$k,\" refs.bib || echo \"not in refs.bib: $k\"; done\n```\n\nA key the agent claimed is in `refs.bib` but is not is a violation: revert the file with `git checkout --` if tracked, or delete it if new, and report.\n\n**h. One citation, yourself** — spot-check one citation by `WebFetch` on the arXiv id or DOI: does the source exist, and does the numbered result say what the entry claims? **If the verdict is `precedent` or `counterexample`, check that one** — those are the two that move the number furthest, and the agent cannot know which you will check. Otherwise one at random is enough.\n\nAny violation: report the example file as rejected. Nothing about the DAG changes either way.\n\n## 4. Vacuity or falsity referral\n\nIf the agent reports that no instance satisfies the hypotheses, or that a published result contradicts the statement, that is the most valuable outcome this command has. Two things follow and neither is automatic:\n\n- The `EVIDENCE:` line records it and the confidence goes negative on the next build. That is the whole of what the machinery does.\n- **The node is not refuted.** Only a critic round or the user's own `human:` judgement can act on it. Report it at the top of your message as a referral: the next action is `/prove` (for the critic to see it), `/decompose` (for the statement to be revised), or the user setting `human: doubted` or `human: refuted` — which you may not do for them.\n\n## 4b. Promotion to nodes (ADRs 0018, 0021, 0047)\n\n`examples.md` stays the digest and the only confidence input. But when the search surfaces an instance or an analogue that deserves a directory of its own — its own hypotheses, its own literature trail, room to be worked on later — report it as a **promotion candidate**.\n\n**A node made from an instance is a proposition, not an exhibit** ([ADR 0047](../process/decisions/0047-an-example-node-is-a-proposition.html)). This is the thing to get right, because everything else follows from it. `Q2-e1` does not say \"here is the group case, look at it\"; it asserts that in the group case every hypothesis of the general statement holds, and that assertion is true or false. So every operator applies to it at the same bar as to a lemma:\n\n- `/prove` runs prover → gate → critic on it, and it reaches `proved` when the instance is verified against the closed world — which usually means the lead-researcher first black-boxes the citing theorem in the appendix;\n- `/decompose` cuts it into sub-claims when it carries more than one — `Q2-e1-L1`, `Q2-e1-L2`, … inside its own directory, an ordinary dependency edge, exactly like a lemma's family. An e/a segment no longer ends an id;\n- **`/examples` runs on it again**, and this is the case the class exists for: an example node states a *kind* of instance, and a further run finds further instances of that kind. `Q2-e1-e1` is a legitimate id;\n- `/check-goal` tests it against the key-example register like anything else.\n\nA candidate is reported with four things, and the first two are what make the node stand on its own:\n\n- **the parent claim, quoted.** The statement it instantiates goes *into* the candidate statement verbatim, not behind a link. A node whose whole use is to be read beside a general claim must show that claim, or the reader is opening two files to learn one fact;\n- **its polarity** — `positive`, `negative`, `boundary` or `normalization`: does the instance confirm the claim, refute it, sit on the edge where a hypothesis is dropped, or fix a convention? Say it in the parent statement's own terms, and say it *first*. Where the answer is genuinely unknown, the polarity is the conditional — \"*negative if the sign local system is unreachable, positive if it is not*\" is a proposition with a polarity; \"two questions to settle\" is not. An instance whose polarity is unwritten is one every reader silently takes for positive, which is the failure [ADR 0036](../process/decisions/0036-an-example-says-what-it-matches.html) named for findings and which nodes inherit;\n- **its match**, carried across: which part of the parent's statement it mirrors and where it is loose. That sentence is what the promoted node's creation entry in `<id>_history.md` has to say, and reconstructing it later means reading the sources again;\n- **role and id.** Role `example` for an instance of the theory, `analogy` for a matching claim from another setting. The id nests where the illustration belongs ([ADR 0021](../process/decisions/0021-example-and-analogy-nodes-nest.html)): question-level `Q<n>-e<k>` / `Q<n>-a<k>` directly under `blueprint/nodes/`, or `<parent>-e<k>` / `<parent>-a<k>` inside the lemma it illustrates. Nothing below an e/a node ever has role `proof` — a computation in one variety must not enter the tally of the argument or cap a question by weakest link ([ADR 0047](../process/decisions/0047-an-example-node-is-a-proposition.html) rule 3).\n\n- **its parent, which is the container its id names — never the node whose run found it.** A finding surfaced by `/examples Q1-L1` and promoted to question level becomes `Q1-e<k>`, and its parent is **Q1**: the statement it quotes and relates itself to is that question's Problem statement, not the lemma that happened to produce the run. A closing line naming the sibling lemma asserts a relation the id does not carry and no `depends-on` edge records, and it sends every later reader to the wrong file. Where the sibling really is the right cross-reference, name it as one — \"the family [Q1-L1] constructs in general\" — and say in the same breath that the node is not a member of its decomposition and discharges nothing in it. Seven of Q1's question-level examples carried this defect from their promotion out of the `Q1-L1` run until `/update` on 2026-08-07 (invariant I40).\n\n- **whether it is an instance of the main theorem.** Under the goal question, every promoted example says in its own paragraph which of [the three standing hypotheses](../appendix/assum-intro.html)(a), (b), (c) hold for its $X$, which are in doubt, and on whose authority — so a reader can tell at once whether the manuscript's theorem applies to the case unconditionally, conditionally, or not at all. The interesting answers are the asymmetric ones: an $X$ whose unramified input (c) is a published theorem while its placidity (a) is contested by a node of the repository is a sharper finding than either half alone.\n\n**A non-example is a promotion, not a failed search.** An $X$ the node's statement does not reach — outside the standing class, or inside it with every available result silent — earns a directory whenever it shows *where* the theory stops. Its polarity is `boundary`, its statement names the hypothesis it violates or the node that declines to apply to it, and it says outright that it refutes nothing: what it establishes is that covering the case would take a new conjecture, which is a research finding and not an absence of one. Do not suppress such a candidate for failing to instantiate the statement, and do not dress it up as an instance.\n\nYou do not create it: only the lead-researcher creates node directories, so the orchestrator dispatches the lead-researcher with the found statement, its sources, its match and its polarity. A proof node never depends on either kind ([ADR 0018](../process/decisions/0018-example-and-analogy-nodes.html)).\n\n## 5. Verify and regenerate\n\n```\npython3 tools/build_dag_site.py\npython3 tools/check_render.py\n```\n\n- The new file is markdown in the reasoning tree, so it is subject to everything the tree is subject to: KaTeX-renderable math, no house macros from `preamble.tex`, balanced `$$` blocks, resolving links.\n- `--check` additionally catches a node holding both `examples.md` and `prompts/examples.md`, an `EVIDENCE:` value outside the five, and — as an advisory note — an `examples.md` with no `EVIDENCE:` line at all, whose literature channel is therefore silent.\n- Read the node's confidence line in the rebuilt output and report it. A run that moved the number and did not say so is a run the user has to go looking for.\n- All of `blueprint_site/` and every `<id>_prompt.md` are generated readouts. Never hand-edit them.\n\n## 5b. Into the record (ADR 0054)\n\n`examples.md` is a file the run wrote; it is not yet part of what the node *says about\nitself* until two things name it. Do both, in the node's own directory, and do them\nyourself — the example-finder writes `examples.md` and nothing else.\n\n**The field.** In `<dir>/<id>_node.md`, set the `examples:` line of the field block:\n\n```\n- **examples:** [examples.md](examples.md)\n```\n\nor leave it `—` when the run ended in a `prompts/examples.md` instead. The field is a\n**pointer and never a copy**: the `EVIDENCE:` verdict stays in `examples.md` alone, because\nit is read from there by the confidence derivation and a second copy is a second thing to\ndrift. `build_dag_site.py --check` fails when the field and the disk disagree.\n\n**The history entry.** Append one dated bullet to `<dir>/<id>_history.md`:\n\n```\n- **YYYY-MM-DD — literature examined** by `/examples <id>`, verdict `EVIDENCE: <verdict>`,\n  recorded in [examples.md](examples.md). <What was found, in one or two sentences, and —\n  the part worth writing down — which clauses of the statement nothing found touches.>\n```\n\nThe coverage line from §3f goes here and not only in your report: a run that establishes\nthat nothing in print matches clause (ii) has produced a finding, and a finding that lives\nonly in a chat message is a finding the next reader does not have. A second `/examples` run\na month later appends its own entry; neither is rewritten.\n\n## 6. Presentation pass\n\nEvery command tidies what it wrote; there is no separate `/check` to remember ([ADR 0031](../process/decisions/0031-presentation-is-a-stage-not-a-command.html)). Launch one **checker** subagent (`subagent_type: checker`) on the `examples.md` or `prompts/*.md` this run wrote, plus any node file it touched — one path per agent, never batched. Skip the pass when the run ended in a render failure.\n\nThen gate them mechanically, because content-preservation is yours to enforce and not theirs to promise:\n\n```\ngit diff -U0 -- <files> | grep -E '^[+-]' | grep -E 'VERDICT:|EVIDENCE:|\\*\\*status:\\*\\*|\\*\\*type:\\*\\*|\\*\\*role:\\*\\*|\\*\\*human:\\*\\*|\\*\\*created:\\*\\*|\\*\\*depends-on:\\*\\*|\\*\\*required-by:\\*\\*|<a id='\n```\n\nThe `EVIDENCE:` line is in that list for a reason: it is the literature channel of the confidence derivation, and a checker that rewords it has changed a number. Any output is a violation — `git checkout -- <path>` and report it reverted, then re-run step 5.\n\nA `**What it matches.**` field is prose the checker may reformat and may not weaken: \"matches clause (ii) only, decategorified\" must not come back as \"matches the statement\". Re-read those fields in the diff yourself.\n\n## 7. Close, and do not commit\n\n```\npython3 tools/batch.py close\n```\n\n**No operator commits** ([ADR 0069](../process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). Leave the changes in the working tree and name them in the report; the user commits when they choose. Where several runs are in flight, `close` once at the end of the batch rather than once per run.\n\nAdd a `process/journal/YYYY-MM-DD_NN_slug.md` entry when the run taught you something — a hypothesis nothing in the literature discharges, a source that should have had the statement and did not, a statement that turned out to be about a class of one, a precedent that means the node should have been a corollary, a clause of the statement that nothing in the literature matches — with its one line in [`process/journal.md`](../process/journal.html).\n\n## 8. Report\n\n- Any vacuity or falsity referral, from §4, **first**.\n- The `EVIDENCE:` verdict, and the node's confidence before and after.\n- What the precedent search established, in two lines — including what was *not* found and where it should have been. A negative precedent result is the finding this command was extended to produce; do not bury it under the instances.\n- **The coverage line, from §3f**: which parts of the statement the findings between them match, and which parts nothing found touches. One line each. This is the reason the command exists — a node whose clause (ii) nothing in the literature matches is a node whose clause (ii) is either new or wrong, and either way the user wants to know now.\n- The node id and what was written, with the simplest instance in one line — that one is the reader's entry point, so it is the one worth quoting — and whether it is an instance or an analogue.\n- Any hypothesis the agent could not discharge for any instance. This is a research finding: it is either a gap in the literature or a hypothesis that is too strong.\n- Sources appended to `papers/guideline.md`.\n- A `prompts/examples.md` outcome, stated prominently: it is an open question the pipeline could not answer, in a form someone outside the repo can act on.\n";</script>
