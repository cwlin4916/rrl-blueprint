<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">process</a><i>›</i><span>problem_generation_pipeline</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>The problem-generation pipeline</h1><p class="lead">Generated from <code>process/problem_generation_pipeline.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nA research question is decomposed into a DAG of frozen claim statements. Each claim is drafted by one agent, built by a gate the orchestrator runs itself, and refereed by a second agent that cannot edit what it judges. The verdict is written back into the DAG and committed.\n\nThe repo *is* the state. No database, no server, no memory between sessions beyond the files.\n\nThe target is **auditability**, not autonomy. At any moment you can point at a node and say what it claims, what it may assume, which artifact supports it, which referee reports it survived, and when each of those changed. A pipeline that establishes things you cannot check is worse than no pipeline.\n\nThis is the domain-independent form of that machine, written to be instantiated in a repo with nothing to do with mathematics.\n\n[design doc](pipeline.html) · [journal](journal.html) · [decisions](../../process/decisions) · [repo README](../readme.html)\n\n- [1. The abstraction](#1-the-abstraction)\n- [2. The role algebra](#2-the-role-algebra)\n- [3. The five kinds of directory](#3-the-five-kinds-of-directory)\n- [4. The invariants](#4-the-invariants)\n- [5. The lifecycle](#5-the-lifecycle)\n- [6. The gates](#6-the-gates)\n- [7. Instantiating it in a new repo](#7-instantiating-it-in-a-new-repo)\n- [8. What it deliberately does not do](#8-what-it-deliberately-does-not-do)\n\n---\n\n## 1. The abstraction\n\nFour objects. Everything else is a rule about how they may be written.\n\n### The closed world\n\nA set $A$ of admissible premises, each stated in full in one place, each with an attribution a reader can follow. For a node $v$:\n\n$$\n\\mathrm{admissible}(v) \\;=\\; A \\;\\cup\\; \\mathrm{deps}(v) \\;\\cup\\; S,\n$$\n\nwhere $\\mathrm{deps}(v)$ is the node's declared dependency list and $S$ is background so standard it needs no citation. Nothing else.\n\nA fact that is true, published, and sitting in the manuscript but *not* in $A$ is **not available**, and a reviewer marks its use as a gap.\n\nThe registry realizing $A$ carries one entry per object:\n\n```\nentry : (anchor, kind, attribution, source-locator, full-statement,\n         role, preconditions, used-by, note)\nrole  ∈ {definition, convention, black box, established here, external}\n```\n\n`source-locator` is whatever makes the attribution checkable — a file and line, a DOI, a commit hash. `preconditions` is filled only for black boxes, and says what must be verified at each use. `used-by` is cross-checked against the citing nodes in both directions.\n\nDistilling a result into $A$ is manual work, and that cost is the point: it forces a human decision about what is being assumed.\n\n### The node\n\nA claim with a frozen statement.\n\n```\nnode : (id, type, created, statement, depends-on, required-by,\n        draft, review, objects, status)\n\nid          stored, immutable, encodes position in the tree (Q1-L5-L2)\ntype        stored, from a small closed set\ncreated     stored, ISO date, written once, never changed\nstatement   stored, FROZEN once written\ndepends-on  stored, list of node ids\nrequired-by stored, exact transpose of depends-on\ndraft       stored, link to the artifact or \"—\"\nreview      stored, link to the LATEST review round only\nobjects     stored, links into the registry, never bare names\nstatus      stored, from a closed set of four\nready       DERIVED, never stored\nblocked     DERIVED, never stored\nconfidence  DERIVED, never stored\n```\n\n$$\n\\mathrm{ready}(v) \\iff \\mathrm{status}(v)=\\texttt{open} \\;\\wedge\\; \\forall u \\in \\mathrm{deps}(v):\\ \\mathrm{status}(u)=\\texttt{proved}\n$$\n\n$$\n\\mathrm{blocked}(v) \\iff \\exists\\, u \\in \\mathrm{deps}(v):\\ \\mathrm{status}(u) \\neq \\texttt{proved}\n$$\n\nStoring either would create another place for status to drift.\n\n### The confidence\n\nStatus says what stage a node is at. **Confidence** says how much to believe it, and the two come apart: a node that passed on its fifth report after two failures carries the same word as one that passed cleanly on its first, and so does a passed node resting on an unstarted one.\n\nConfidence is a Baconian ratio over defeaters — belief grows with the number of reasons for doubt identified and eliminated. Write $e(v)$ for the flaws raised in every review round but the latest, all disposed of before the node reached its current verdict, and $r(v)$ for those still standing in the latest round. Then\n\n$$\ns(v)=\\frac{e(v)+1}{e(v)+r(v)+2}, \\qquad c(v)=\\min\\Big(s(v),\\ \\min_{u\\in\\mathrm{deps}(v)}c(u)\\Big),\n$$\n\nwith $s(v)$ pinned to $0$ for a node nobody has worked on or whose last verdict was `FAIL`, and $\\min\\emptyset=1$.\n\nThe smoothing stands for the defeaters nobody has looked for yet, so an unexamined claim sits at a half rather than at certainty and nothing reaches $1$. The minimum is the weakest-link rule, and it is what makes an aggregate honest: a set of nodes is its weakest member, so a question is its weakest node and a repository is its weakest question.\n\nIt is displayed as an ordinal band and a tint, never a decimal. The space of defeaters cannot be enumerated, so this is a ranking, and a number carried past the precision of its derivation suppresses the judgment it was meant to inform.\n\n### The DAG\n\n$G=(V,E)$ with $u \\to v \\in E$ meaning $u$ is a prerequisite used in establishing $v$. Acyclic, and the induced partial order is the derivation order.\n\nTwo consequences are load-bearing. Positions in any rendering are derived from $E$ on every build, never stored, so the picture cannot disagree with the DAG. And an arrow points from a prerequisite **up** to the result it supports, so it reads as implication — the first version here pointed the other way, and read as \"depends on\" to a programmer and backwards to everyone else.\n\n### The verdict\n\n$$\n\\mathrm{verdict} : (\\text{statement}, \\text{artifact}, A) \\longrightarrow \\{\\textsf{PASS},\\ \\textsf{FAIL}\\}\n$$\n\ncomputed by an actor with **no write access to any of its three inputs**. Its only output is its own report, whose last line is exactly `VERDICT: PASS` or `VERDICT: FAIL`. `FAIL` if and only if some flaw is FATAL or MAJOR; a `PASS` must still list every MINOR.\n\nA verdict is a referee report, not a certificate. It means one hostile reader with the registry in hand found no gap.\n\n---\n\n## 2. The role algebra\n\nFive roles. Four are agents; the fifth deliberately is not.\n\n| Actor | May write | May never touch | Why |\n|---|---|---|---|\n| **planner** (`/decompose`) | node directories and each `node.md`; the per-question anchor, heading, **Setting.** and **Conjecture.** paragraphs, and the empty index-marker pair; new registry entries; on expansion, the parent's `depends-on` and a `## Decomposition` section | a proof or draft of any kind; any write-up file; index bullets or the tally (generated); the manuscript; a parent's `## Statement` | it is the only actor that defines what is to be shown; letting it also show it collapses statement-freezing |\n| **producer** (`/prove`) | exactly one path: the node's own write-up | `node.md`, the index, the context file, the registry, the manuscript, any other node's directory | it is the only actor with an incentive to make the claim easier; the grant is per-path, not per-directory |\n| **reviewer** (`/prove`) | exactly one path: the node's review for the round it was handed, never an earlier one | everything. No `Edit` and no `Bash` at all: it cannot fix, cannot run, cannot commit | a referee that can edit the proof stops being a referee |\n| **editor** (`/check`) | markdown prose in the reasoning and process trees, `README.md`, `CLAUDE.md`, one target file per invocation; on a node target, exactly one of the examples file or the open prompt | any `**status:**`, `**type:**` or `**depends-on:**` field; any `VERDICT:` line; any `<a id=\"…\"></a>` anchor; the statement of a registry entry; any manuscript source. No `Bash` | a verdict must mean one thing, and an agent licensed to rewrite prose for clarity is one prompt away from rewriting a claim for clarity |\n| **orchestrator** (the main thread — *not* an agent) | every `status`, `draft` and `critique` field; runs every gate; regenerates the generated tree; owns git; maintains the design doc | by construction of the loop, it never produces the artifacts it judges | subagents produce artefacts; only the orchestrator changes the record of what is true |\n\nThe grants here, verbatim from the agent frontmatter: planner `Read, Grep, Glob, Edit, Write`; producer `Read, Grep, Glob, Write, Edit, Bash`; reviewer `Read, Grep, Glob, Write`; editor `Read, Edit, Write, Grep, Glob, WebSearch, WebFetch`. The producer has `Bash` to self-build before handing over, and for nothing else.\n\n### The one load-bearing constraint\n\nThe reviewer has no write access outside its own report. Every other guarantee is downstream: if the reviewer can edit the draft, `PASS` stops being a judgment and becomes a description of what the reviewer felt like fixing.\n\n**Separation is enforced by tool grants, not by instruction.** A prompt saying \"do not edit the proof\" is a suggestion; a frontmatter line omitting `Edit` is a constraint. The reviewer's prompt has demanded standard KaTeX since the day it was written, and the reviewer wrote house macros into its report anyway, because nothing was checking.\n\nTwo corollaries. **Write the separation down in three places and keep them equal:** the agent's tool grant, the actors section of the design doc, and the write-discipline paragraph in the repo instructions. An agent whose powers are not recorded everywhere will drift ([ADR 0004](decisions/0004-checker-separate-from-critic.html)).\n\nAnd **name the weakest link out loud.** The editor's content-preservation guarantee is by construction and review, not by tooling, so it is compensated by an orchestrator-run diff gate ([§6](#6-the-gates)) rather than by trust.\n\n---\n\n## 3. The five kinds of directory\n\nWhich kind a directory is decides who may write in it, and \"is this generated?\" must be answerable from the path alone.\n\n| Kind | Contents | Write rule |\n|---|---|---|\n| **manuscript** | the deliverable a human signs: the paper source, the shared preamble, the bibliography, drafting prose | **humans only.** Nothing the pipeline produces enters it without a human moving it there |\n| **reasoning** | everything the argument lives in: the registry, the context file, the DAG index, one directory per node, reading notes, seed questions | agents write here, under per-path write discipline ([§2](#2-the-role-algebra)) |\n| **process** | how the pipeline is designed, how it got built, and the numbered decision records | the orchestrator maintains the design doc and the journal; decision records are append-only — a decision that turns out wrong gets a new record superseding it, and the old one stays with its status changed |\n| **generated** | the rendered site, the build artifacts | **never edited by hand, never read back.** Reproduced in full by one command |\n| **machinery** | the generator, the gates, vendored dependencies, agent definitions, skill definitions | changed deliberately; a change to an agent's powers must land in all three places named in [§2](#2-the-role-algebra) at once |\n\nFive kinds occupy six top-level trees here: the site and the build directory are both *generated*.\n\n### The test for a new directory\n\n1. **Can one command delete it and reproduce it byte-for-byte?** Then it is *generated*. \"Yes, except for one file someone placed by hand\" means no — fix that first.\n2. **Is it the artifact a human puts their name on?** *manuscript*.\n3. **Does it hold claims and evidence that gates run over?** *reasoning*.\n4. **Does it describe how the system works, or why it was built that way?** *process*.\n5. **Does it execute?** *machinery*.\n\nNo directory may be two kinds — a repaired defect, not fastidiousness. Before [ADR 0009](decisions/0009-one-tree-per-kind.html) the site tree held four hand-written documents, eighty-five generated pages and a vendored library that was never regenerated, so no sentence described it truthfully and \"nothing is read from a generated artifact\" could not be applied by looking at a path.\n\nThe fix moved the vendored library into the machinery tree and copies it in on every build, leaving **zero** hand-placed files in the generated tree. One exception destroys the property that a path alone tells you what something is, and nobody will remember the exception by the time it matters.\n\n---\n\n## 4. The invariants\n\nThese must hold after every step. If one is violated the output is not trustworthy, however good the work looks.\n\nEach is stated once, justified once, and ported once to an empirical repo — a LaTeX write-up, figure-generating Python, a pytest suite, dated exploration notes. The worked instance is [§7](#7-instantiating-it-in-a-new-repo); the ports here say only what changes.\n\n**I1 — Closed world.** A claim may invoke exactly: registry entries, the node's own `depends-on` list, and background needing no citation.\n\n*Why:* otherwise \"assume the theorem\" is indistinguishable from \"cite the theorem\", and the DAG stops encoding a derivation order.\n\n*Port:* the closed world becomes admissible **evidence**, with one entry per dataset or generator with its parameters, logged run with its config and commit, figure with its producing script and revision, external number with a DOI, and convention. `role` becomes `{measured here, assumed, external black box, convention}`; `preconditions` becomes what must hold for reuse: license, distribution match, eval protocol, seed policy, environment pin. **A number not in the registry is not available, however true.** A bibliography will not do: it has no `used-by`, no preconditions, and nowhere to put a seed.\n\n**I2 — Statements are fixed before work is attempted.** Decomposition produces statements only; the producer reproduces the statement verbatim and may neither weaken nor strengthen it. Enforced mechanically: in expansion mode the diff on the parent's statement must be empty, and any change there is reverted and sent back.\n\n*Why:* an agent that can edit the goal will establish something adjacent and report success. This is the invariant the others rest on.\n\n*Port:* preregistration, with a larger frozen object — **hypothesis, metric definition, decision rule, and the population claimed over.** The run agent may edit the script and none of those four. A run that changes the metric and reports agreement has established nothing, and without the freeze there is no way to see that it did.\n\n**I3 — The build gate is run by the orchestrator, not self-reported by the producer.** The producer self-builds; the orchestrator then builds it again itself before any reviewer is invoked, in **every environment a human will run it in** — here the repo root *and* the node's own directory, because an editor builds in place and the pipeline builds from the root.\n\n*Why:* self-reported build success is the cheapest thing for an agent to get wrong. The gate is also a free vocabulary check: an undefined symbol means the artifact left the declared world. [ADR 0009](decisions/0009-one-tree-per-kind.html) records the failure behind the two-environment rule — two configurations routed one artifact to two output directories, and the second build tripped over the first's stale metadata.\n\n*Port:* the script runs end-to-end and reproduces the figure, the tests pass, the report renders. Add an axis LaTeX does not have: **a fresh environment from the pinned dependency file, as well as the cached one.** A gate that runs only in the author's cached environment cannot see a floor-version bug that degrades output silently instead of raising.\n\n**I4 — Reviews are append-only, and the numbering never restarts.** Round 2 is a new file beside round 1, no review is ever rewritten, and a node re-opened and re-worked continues at the next free number.\n\n*Why:* the sequence of verdicts is the audit trail for how a node reached its status. A node that passed on round 3 after two failures is a different epistemic object from one that passed immediately.\n\nTwo clocks, and keeping them distinct is what allows re-opening without erasing history: the **cap** is per invocation, three rounds; the **numbering on disk** is monotone forever. One node here carries `r1` through `r5` across two invocations, and exactly one edit has ever been made to a review file — a link repointed during a file move, changing no claim.\n\n*Port:* identical. An empirical repo has more reason to keep the trail, because the failed runs are where the researcher degrees of freedom went.\n\n**I5 — Every fact is stored once.** A node's status lives in its own file and nowhere else; indexes, tallies and rollups are generated between explicit markers.\n\n*Why:* this invariant used to read \"status is written twice and checked\", on the theory that checked redundancy is documentation. It is not — it is a second thing to keep right, and deriving the index deleted a check, two write-back steps and a whole reconciliation phase. Record it as a **reversal**: checked redundancy is a cost, derivation is the fix.\n\n*Port:* every hand-typed count in a document that gates behaviour is a violation waiting to happen — the live input set, the figure inventory, the script list, the test count. Put them between markers and generate them.\n\n**I6 — Objects are linked, never named.** No file outside the registry entry defining an object may contain a bare identifier for it.\n\n*Why:* a bare identifier is unreadable to a human skimming the tree, unresolvable to an agent that has not been handed the source, and silently tolerant of typos — a misspelled label with a stray space sat in the index here for a week and referred to nothing. A link either resolves or the link checker catches it.\n\nTwo deliberate exemptions: append-only reviews are never rewritten to match a later convention, and documentation *about* a convention may quote what it forbids.\n\n*Port:* every mention of a dataset, metric, model, script or prior number is a link into its registry entry. The code side is *one definition, imported* — a helper copied into seven scripts will diverge in one of them, and a name meaning two things is the same defect as a name resolving to nothing: neither can be checked by following it.\n\n**I7 — Authored source renders in the lowest-common-denominator viewer, with no local expansion layer.** House macros exist only in the typeset source; every markdown file renders on GitHub with no preview shim.\n\n*Why:* the readers are a human in a browser and an agent reading raw text, and neither expands the shared preamble.\n\nA corollary, from [ADR 0008](decisions/0008-one-page-per-object.html): the generator hands those macros to the typeset write-up pages **only**, because supplying them site-wide would mask the leakage the gate exists to catch. Do not give the rendering escape hatch to the layer whose leakage you are detecting.\n\n*Port:* figures are committed and embedded, not generated on view. Extend it to the filesystem, the expansion layer people forget — a relative link that resolves on the author's laptop and nowhere else is the same defect one layer down.\n\n**I8 — Nothing is ever read from a generated artifact.** Generated trees are outputs, never inputs, reproducible in full by one command, with **zero exceptions inside them** ([§3](#3-the-five-kinds-of-directory)).\n\n*Why:* a workflow needing a fact from a build artifact is misdesigned — the fact belongs in the registry. Reproducibility is what lets you delete the whole tree at any time without losing anything.\n\n*Port:* no script and no claim may read a number back out of a committed CSV or a log unless that number has a registry entry with its own provenance. Route artifacts into a build directory first: making the property visible from the path is a precondition for the rule, not a tidiness preference.\n\n**I9 — One node, one directory, one bounded artifact.** Everything about a node lives in its directory, and its write-up fits one page. Overflow routes to the planner, never to a longer artifact.\n\n*Why:* the limit is what forces citation instead of restatement — before the registry existed, one node's round-2 draft ran to ten pages, roughly seven of them quotation. The page count is also an alarm: a node that will not fit is usually several nodes, which is a decomposition defect rather than a writing problem.\n\n**This invariant has a prerequisite.** The cap is only enforceable once a registry makes citation-instead-of-restatement possible. Ship the registry first.\n\n*Port:* one claim, one directory, one bounded report — a fixed budget such as one figure plus a line count, holding the frozen claim, the config, the run log, the metrics file, the report and the reviews. A long note carrying a standing cross-document notation contract is registry work being done in prose, and its rename tables are the second copy this invariant exists to prevent.\n\n**I10 — Examples illustrate, never justify.** The examples file is outside the closed world and nothing may cite it. Every example carries a source with a resolvable identifier and a numbered result; an unsourced one is labelled as constructed.\n\n*Why:* an example is evidence a statement is non-vacuous and understood, not evidence it is true. Formally inert means the worst case is a misleading illustration, not an unsound DAG.\n\n**The escape hatch is the load-bearing half.** An agent told to find examples with no acceptable way to fail will invent one, and a fabricated citation with a plausible result number is the worst artifact this pipeline could produce, because it is what a reader believes without checking. So \"none found\" is a **first-class output with its own deliverable**: a self-contained prompt carrying the background, the statement, what is wanted, and what searches were tried. Writing a good prompt is real work, so failing honestly is not the lazy path. Exactly one of the two files exists per node, and a gate checks it. [ADR 0006](decisions/0006-examples-from-the-literature.html) notes the prompts directory is the only place the system records its own ignorance in a form someone else can act on.\n\n*Port:* qualitative samples, demos, cherry-picked outputs and anecdotal logs are inert and may never be cited — only registry-backed measurements may. And every search-type task gets a negative deliverable that costs real work: \"not found\" and \"no effect\" must be as publishable inside the repo as the positive result, or the agent will manufacture one.\n\n**I11 — Every cited thing has a rendered page, and there is exactly one renderer.** One page per object a link can point at — registry entry, node, write-up, examples file, open prompt, review, reading note — and the gate fails on a dangling link between them.\n\n*Why:* [I6](#4-the-invariants) says an object is linked and never named, which only pays off if the link lands somewhere readable; a link into a 3,000-line markdown file is a link GitHub will render and nothing else will. Going from one page to eighty here turned three latent reference defects into build failures at once, so budget for a burst at that transition rather than reading it as regression.\n\nOne corollary needs a rule of its own. **Keep one renderer implementation in the repo.** A statement that renders differently in two places is a statement the reader must reconcile, and there is nothing to reconcile if there is one implementation.\n\n*Port:* the one-renderer rule bites harder, because there are more renderers to accumulate — the figure a script writes, the figure the report embeds and the figure the site shows must be the same file, produced once.\n\n**I12 — Confidence is derived from the record, and displayed as a ranking.** How much to believe a node is computed from its review rounds and its dependencies at build time, never written down, and never printed finer than its band.\n\n*Why:* status is a stage, not a credence, and a reader needs both. Deriving rather than storing is [I5](#4-the-invariants) again — a stored confidence goes stale the moment a new review lands, and nothing could check it.\n\nComputing it is the first thing in the pipeline that treats the audit trail as data, and that alone made two gaps in the consistency gate visible: a node marked passed whose latest report ends in `FAIL`, and a report carrying no verdict line at all. Confidence itself stays outside the closed world on the same footing as examples under [I10](#4-the-invariants): derived *from* the trail, so never evidence *in* it, and no gate passes or fails on it.\n\n*Port:* same formula, more defeaters. Add the mechanical checks, which in an empirical repo carry information a write-up's build gate does not: the run reproduces from the pinned environment as well as the cached one, the tests pass from two working directories, the embedded figure is the file the script wrote. Each is a way the claim could have been wrong that was checked and ruled out. A claim resting on an unvalidated dataset entry inherits that entry's confidence, which a headline number hides.\n\n### The one mathematics-specific rule\n\nThe eighth check in the render gate fails on a generation bracket that does not name the category it is formed in. Its content is mathematics and does not port. Drop it.\n\nKeep its **shape**: *a notation gate*, one regex per convention the domain ratifies after a review catches its violation. A ratified reading becomes a grep-level gate the day it is decided, and is written in three places that must agree — the registry entry it constrains, the remark on the node that ratified it, the context file's ratified-readings list. If they disagree the registry entry wins ([ADR 0001](decisions/0001-satake-generation-ambient-category.html)).\n\nFor an empirical repo the candidates are the conventions your own reviews surface: every reported number names its estimator and sample size, every caption names its generating script, every $\\sigma$ names its noise-scale parameterization. Do not write these gates before the review that motivates them — a gate with no incident behind it is a rule nobody can defend when it fires.\n\n---\n\n## 5. The lifecycle\n\n```\nopen ──(all dependencies proved)──> ready ──/prove──> drafted\n                                                         │\n                                     build + size gates ─┤\n                                                         ▼\n                                                      reviewer\n                                                    ┌────┴────┐\n                                                  PASS      FAIL\n                                                    │          │\n                                                 proved     failing\n```\n\n**Stored — exactly four, and the consistency gate rejects anything else:**\n\n| Status | Meaning |\n|---|---|\n| `open` | statement exists, no work attempted |\n| `drafted` | an artifact exists and builds; verdict pending |\n| `failing` | a gate failed, or the last verdict was `FAIL` |\n| `proved` | builds within budget, and the latest review ends in `VERDICT: PASS` |\n\n**Derived, never written down:** `blocked`, `ready`, and confidence.\n\nOne consequence is counterintuitive at write-back time: **when a node becomes `proved`, its dependents need no edit.** They stay `open`, and every view works out on its own that they are now ready.\n\n### The round cap\n\nThree rounds per invocation; `FAIL` at round 3 exits as failed. Build failures do not consume rounds — two fix attempts per round, then the node goes to `failing` with the reason recorded.\n\nThe cap is **diagnostic, not punitive**. A node that fails three times is a signal about the *statement*, not the producer, and the usual cause is a missing registry entry or a decomposition that skipped a step. Two correct responses: widen the node's declared objects, which is the planner's job launched for that one edit with the review in hand, or split the node. Never let an artifact reach outside its declared world, and never invent a registry entry to close a flaw.\n\nRe-opening is explicit and lossy by declaration: remove the artifact, set the status back to `open`, blank the draft field, leave the review field pointing at the last round. Existing rounds stay on disk and the numbering continues from them.\n\n### One recorded lifecycle debt\n\n[ADR 0005](decisions/0005-node-directories.html) records a ten-page refereed draft condensed to one page during a structural change, so the `proved` status attached to a text no reviewer had read. The earlier draft is preserved in git and the debt is written down in the open.\n\nFor a port, the lesson is that **a structural refactor can silently detach a verdict from the artifact it certified.** Either bind the verdict to a content hash, or record the debt where someone will trip over it.\n\n---\n\n## 6. The gates\n\nA rule with no gate is a suggestion. Each gate is (what it reads, what it fails on, the general principle).\n\n| Gate | Reads | Fails on | General principle |\n|---|---|---|---|\n| **DAG gate** (before any work) | the node file and every dependency's node file | node file absent; any dependency not `proved`; the node already `proved` without an explicit re-open | never start work whose premises are not on the record. It writes nothing when it stops |\n| **Build gate** | the produced artifact | build failure from the repo root, or in the artifact's own directory — both must pass | run the verification in every environment a human will run it in; divergence between environments is a real defect class |\n| **Size gate** | the built artifact | more than one page | over-budget goes back to the producer once with \"cite, do not restate\"; still over, accept and report the overflow as a decomposition signal. Graceful degradation, not a hard stop |\n| **Render gate** (eight layers) | every markdown file, every write-up, every generated page | a math fragment KaTeX cannot render; a preamble-only macro leaked into markdown; unbalanced `$$` or a forbidden display form; a relative link or anchor that does not resolve; a write-up over budget or leaving artifacts in its directory; blueprint inconsistency; a generated page that fails to render or links nowhere; a notation-convention violation | one command, one exit code, and each section names the layer that broke |\n| **Consistency gate** (the generator's `--check`) | the node files, the registry, the index | a node whose question has no index section; a malformed `created:` date; a dependency naming a node with no directory; a `required-by` that is not the exact transpose of `depends-on`; a stored status outside the closed set; `proved` with no review, no artifact, or a latest review ending in `FAIL`; a sub-node whose parent does not exist; an object link pointing at a nonexistent registry anchor; a registry entry cited by a node but missing it from `used by`; a node holding both the examples file and the \"none found\" prompt; a stale generated index block | it writes nothing and answers two questions — *is the source self-consistent* and *are the generated pages current*. Emits `INCONSISTENT` and `STALE` as distinct tokens because they need different responses |\n| **Execution gate** | every generated graph page, in a stub DOM with the real renderer, one fresh DOM each | the graph not drawn; breadcrumbs missing; the panel filled with the wrong node; a missing drill-down where a node has children | **a syntax check is not a render check.** A page whose script dies on its first statement passes a syntax check cleanly. Run *every* page — running only the root leaves every sub-page as untested as it is breakable, and the first sub-graph ever generated failed this, on titles containing mathematics |\n| **Site render gate** | every math span and every embedded markdown source on non-graph pages, with `throwOnError` on | anything the real renderer refuses | a macro that exists only in a preamble fails here rather than in front of a reader |\n| **Content-preservation gate** (orchestrator-run against a git snapshot) | the diff over the editor's targets | any added or removed line matching `VERDICT:`, `**status:**`, `**type:**`, `**depends-on:**` or `<a id=`; any display-math line present before and absent after | the editor is not trusted to preserve content; a mechanical diff is. New display lines are allowed (inline promoted to display); removed ones are not. Violation → revert the file and report it as reverted |\n| **Example gate** (node targets only) | the node directory and the bibliography | both or neither of the examples file and the prompt existing; an example with no resolvable identifier and no `(constructed, unsourced)` label; a claimed bibliography key that is not in the bibliography | a fabricated citation is the one failure that would poison the record. A false key reverts or deletes the file. Nothing about the DAG changes either way — the examples file is never a dependency |\n| **Decomposition gate** (after the planner returns) | the new node files, the parent's diff, the registry, the bibliography | a missing node file or a wrongly-prefixed id; a statement that plainly cannot fit the budget; a missing or out-of-order field block; **a non-empty diff on an expanded parent's statement**; a parent with no decomposition section naming every new sub-node; a renumbered id; a cycle in the dependency graph; a new registry entry whose label or bibliography key does not exist in the source; **no new node that is a ready leaf** | an expansion with no ready leaf cannot be started, so it is not an expansion |\n| **Regeneration gate** | the regenerated tree | anything that stops `--check` printing `OK` | regeneration is a gate, not a courtesy: do not commit until it prints `OK`. Plus a human-eye clause for visually load-bearing output — checks have twice passed here on a page that was visibly wrong |\n\n### Rules about gates themselves\n\n**A check which cannot fail on the bug you actually shipped is not a check.** After writing one, reintroduce the bug and confirm it fails. This came from a generator patch that deleted the block creating a card and left the line referencing it: the page threw a `ReferenceError` on its first statement and rendered nothing, and the syntax checker passed, because the syntax was perfect.\n\n**A check that fires on correct input is worse than no check**, because a finding nobody can act on trains everyone to ignore the gate. Where a defect cannot be told from a legitimate case by the data available, do not write the check — write down why it cannot be written.\n\n**A gate over a repo that documents its own conventions must distinguish quoted from live before it can distinguish right from wrong.** The render gate opened with 32 findings, most of them in the instruction files whose whole purpose is to say \"never write this\", and the same bug recurred twice more at higher levels. Expect this class at each new level of the stack. The mechanism is one function stripping HTML comments, fenced blocks and inline code spans before anything looks at the text.\n\n**Append-only trails get an advisory-only lint tier.** Findings inside the reviews directory print as notes and do not fail the run, because a review is never rewritten to match a convention adopted after it.\n\n**A generator's output-path function must be injective, and the staleness check must compare every generated artifact, not the one it just wrote.** Two source files here mapped to one output page; on a case-insensitive filesystem the second silently overwrote the first, and the only symptom was a page reporting itself perpetually stale.\n\n---\n\n## 7. Instantiating it in a new repo\n\n### The checklist\n\nOrder matters in two places, marked. Everything else can be done in any order.\n\n1. **Write the design doc first** — what the pipeline is, the loop as an ASCII diagram, actors and their powers, the invariants each with its *why*, the lifecycle, the non-goals, how to extend it, an honest failure log. Writing it first forces the decisions, and it is the file a later gate checks for staleness, because nothing breaks when it is wrong.\n\n2. **Create the five trees**, one sentence each in the repo instructions saying who may write there. Apply the [§3](#3-the-five-kinds-of-directory) test to every existing directory and fix any that is two kinds *before* writing a gate, because a gate cannot enforce a rule whose subject is ambiguous.\n\n3. **Write the registry, schema in an HTML comment at the top.** *(Before step 8.)* The schema fixes the entry layout, the anchor derivation rule, each `role`, the ordering convention and the write discipline. Anchors must be derived by a stated mechanical rule from the entry's id, because headings carrying mathematics or code do not slugify stably.\n\n4. **Write the node schema and one real node** — field block first in a fixed order, then the statement, then optional sections, every field marked stored or derived. Fill one in by hand end to end; the schema is wrong in ways you will only see by using it.\n\n5. **Write the index file** with the anchor, heading, setting and closure prose by hand and an empty marker pair. Nothing inside the markers is ever typed.\n\n6. **Write the agents**, each with the narrowest tool grant that lets it work. Put the omissions in a comment — state *why* the reviewer has no `Edit` and no `Bash`, so nobody helpfully adds them later. Consider pinning the reviewer to a different model than the producer to decorrelate blind spots.\n\n7. **Write the skills**: decompose, the work command with its round loop, check, status. The work command's file is where the loop, the round cap, the gate order and the write-back rules live. The orchestrator is the main thread and gets no agent file.\n\n8. **Write the render gate** — one command, one exit code, one section per layer, a `--fast` flag to skip the slow layers. Include the strip-quoted-text function from day one ([§6](#6-the-gates)).\n\n9. **Write the generator with a `--check` mode** that writes nothing and answers the two questions in [§6](#6-the-gates). It vendors its own dependencies from the machinery tree, so the generated tree has zero hand-placed files.\n\n10. **Write the first decision record**, for the first choice that would be expensive to reverse: context, decision, justification where non-obvious, consequences including costs accepted, alternatives and why they lost. Append-only and numbered; a superseded record keeps its number and changes its status. Add a README with one bullet per record.\n\n11. **Write the write-discipline paragraph in the repo instructions** — the third of the three places an agent's powers are recorded ([§2](#2-the-role-algebra)). All three must agree.\n\n12. **Start the journal.** A choice you had to make → a decision record. Something that happened → a journal entry. A rule now in force → an invariant in the design doc.\n\n13. **Only now impose the size cap** (I9). It is unenforceable before step 3, and imposing it early just produces artifacts that are short and wrong.\n\n14. **Add confidence last** (I12). It is a function of the review trail, so over an empty trail it produces a column of identical numbers that reads as information and is not.\n\n### Worked mapping for `diffusion-transfer-risk`\n\nA LaTeX write-up (`directed-diffusion-score-discrepancy.tex`, inputting `sections/introduction.tex` and `sections/stein.tex`, with seven section files dark), seven figure scripts and seven test files under `code/` (153 tests), a `figures/` tree, five dated notes under `exploration/`.\n\n| Abstract slot | What plays it | Notes on the fit |\n|---|---|---|\n| **manuscript** | `directed-diffusion-score-discrepancy.tex`, `sections/*.tex`, `refs.bib` | humans only. Two prerequisites first: the live section files must be tracked (a clone of HEAD plus the working-tree root file fails to build), and the preamble must be split out of the root file's first 241 lines so a section is independently compilable |\n| **closed world** | a new `blueprint/evidence.md` | one entry per dataset or generator, logged run, figure, external number, convention. `refs.bib` is a bibliography, not a registry: 55 entries of which 19 are uncited, and no key at all for `papers/GM96.pdf`, which an exploration note cites as a bare URL |\n| **node** | `blueprint/claims/<id>/claim.md` | `type` ∈ {empirical, analytic, def-check}; `created`; `status`; `depends-on`; `required-by`; `report`; `review`; `objects`. `ready` and `blocked` derived |\n| **statement (frozen)** | the `## Claim` block: hypothesis, estimator, decision rule, population | the order-concordance claim and the disagreement-wedge claim, one node each. Frozen at decomposition; the diff must be empty across the run |\n| **producer** | an agent writing exactly one path, `blueprint/claims/<id>/report.md`, plus its run under `run/` | it may edit the analysis script; it may not edit `claim.md`, the registry, the index, or another claim's directory |\n| **build gate** | the plotting script reproduces the figure within a stated tolerance; `pytest code/ -q` passes; the report renders | run from the repo root and from `code/`, and in a fresh environment from a **pinned** `requirements.txt` as well as the cached one. The scripts already anchor output on `Path(__file__).resolve().parents[1]`, which is what makes both ways possible — check it rather than assume it |\n| **size gate** | one figure plus a fixed line budget | overflow routes to decomposition, never to a longer report |\n| **reviewer** | an agent with `Read, Grep, Glob, Write` and nothing else, writing only `reviews/r<n>.md` | it reviews the inference, not the code style: unstated assumptions, an estimator that does not match the claim, a comparison the figure does not support, a seed or sweep not on the record. It cannot run the code, which is the point — it must reason from the report and the registry |\n| **editor** | the presentation agent, no `Bash` | reformats prose; never touches a status field, a `VERDICT:` line, an anchor, or any `.tex` |\n| **examples** | `blueprint/claims/<id>/examples.md` | formally inert. The six PNGs under `circle_score_undefined/`, `extension_projection/`, `line_score_undefined/` and `smoothing_cancellation/`, referenced by no `.tex`, belong on this side of the line. When a search finds nothing, `prompts/examples.md` instead — exactly one of the two exists |\n| **exploration notes** | `exploration/*.md`, kept, indexed, demoted to *reasoning* | they are where claims come from, not claims. Add a README naming the five documents, their sigla and their reading order; move the cross-document notation contract into registry entries with `role: convention`, and each note's rename table becomes redundant |\n| **generated tree** | a new site directory and a new `build/`, via `.latexmkrc` with `$out_dir = 'build';` | one page per registry entry, claim, report, review and exploration note. Today ten LaTeX artifacts sit in the repo root and there is no site, so the kind of a path is invisible |\n| **machinery** | a new `code/plotstyle.py` holding the duplicated style and CSV helpers, plus the gates and agent definitions | the code side of I6. `_style_name` is byte-identical in all seven `make_*.py`, `_RC` is duplicated seven times and already divergent at `make_smoothing_cancellation_plots.py:93`, and `sigma_star` exists in two scripts with the same name and genuinely different formulas |\n| **process** | design doc, journal, decision records, all new | the first record writes itself: *why the dated notes are reasoning and not claims* |\n| **provenance** | `savefig_with_provenance(fig, path, params)` in the shared module | PNG metadata carries only the matplotlib version and dpi; figure CSVs carry a column header and no provenance; the one params record is written into a gitignored directory that does not exist |\n| **derived counts** | the README's input set, figure inventory, script list and test count, generated between markers | all four are wrong today. Generating them is the cheapest possible demonstration that the pipeline is running |\n\nFour audit findings, each an instance of an invariant and none visible from the table:\n\n- **I1** — the only seed in the codebase, `SEED = 20260703` at `code/make_margin_law_plots.py:68`, is a registry fact recorded nowhere but the source.\n- **I3** — three of the seven `test_*.py` insert their own `sys.path` and four rely on pytest's rootdir insertion; both work today and they are not the same environment. Worse, `requirements.txt` says `matplotlib>=3.5` while all seven scripts select `seaborn-v0_8-whitegrid`, which did not exist before 3.6. Under a permitted version every figure renders in the default style with no warning, because the lookup returns `\"default\"` rather than raising.\n- **I7** — all fifteen relative links inside `exploration/*.md` resolve on the author's laptop and **none** in a clone: two point at PDFs killed by the unanchored `*.pdf` on `.gitignore:27`, thirteen at untracked files.\n- **I5** — the README claims inputs the tree does not have, eleven figures where the built PDF contains none, three scripts where there are seven, and 110 tests where collection reports 153.\n\nTwo ordering constraints specific to that repo. **Get it into git before anything else** — one commit, no remote, nineteen days of work on one laptop. And **fix `.gitignore:27`** before writing any link gate, or the gate's first act will be to fail on links to files git was never allowed to see.\n\n---\n\n## 8. What it deliberately does not do\n\nStated plainly, because the failure mode of such systems is quiet scope creep. Every port should enumerate its non-goals in the same place, at the same length.\n\n- **It does not decide whether a question is worth asking.** Decomposition takes the question as given, which is why a human reviews the statements before any work starts.\n- **It does not verify.** `VERDICT: PASS` means one hostile reader with the registry in hand found no gap — a referee report, not a machine-checked proof. In an empirical port: a referee report on the inference, not a replication. Nothing here establishes that a measured effect is real, only that the claim, the evidence and the reasoning connecting them are on the record and survived a hostile read.\n- **It does not touch the manuscript.** Nothing the pipeline produces enters the deliverable without a human moving it there.\n- **It does not judge novelty.** The check command searches the literature for examples *of* a statement, not for whether the statement is already known.\n- **It does not remember.** There is no state outside the files. Every session starts by reading the repo, which is the price of the audit trail and the reason the trail has to be complete.\n\n$n$ is small here, and the entries in the failure log are correlations, not laws. At the time of writing the design has been exercised on over ten nodes, two proved, five review rounds on a single node, some twenty decision records, about a hundred generated pages, five agents, five skills and five tool scripts.\n\nEvery rule above exists because something went wrong without it, or because a specific failure was anticipated and labelled as anticipated.\n";</script>
