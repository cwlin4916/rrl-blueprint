batim \"is not surjective in this case\"; the fiber-multiplicity sentence of\npp. 65–66; the standing hypotheses — §1.1 characteristic zero, §7 no type-$N$ roots\nwith classical Levis, Statement 7.1.5, §8 homogeneous affine with a unique open\n$B$-orbit — and an independent computation of the fused locus, $(a,b,\\pm a)$\nconjugate to $(b,a,\\pm b)$ under $W$ but never under $W_X$. Verdict: counterexample\nconfirmed, and sharper — at a fused parameter the fiber over $\\mathcal{H}_X$ has\ndimension $>1$, so no vector generates at all. What was false was the node's closing\nsentence: generation IS answered in print, both ways, the criterion being\nsurjectivity of the restriction map. Statement revised (its updates/u1.md);\nQ1-L3-a3's History gained the evidence swing, its statement already posing the\ncriterion. The failure audit commissioned Q1-e8 through the lead-researcher — the\ncounterexample variety lies in the standing class, via the no-type-$N$ ⇒\nconnected-stabilizers note on def:polarized_hyperspherical — because if that holds,\nthe class contains function-level failure of generation and the examples.md fork\nresolves toward \"trace of Frobenius does not carry categorical generation to module\ngeneration\", compatible with BZSV p. 163's generation under colimits. Rejected for\na node: the equal-characteristic transfer of Theorem 8.0.2 — a literature gap\n(amber P9), not a crisp claim of ours. Untouched by discipline: examples.md (the\nverdict survives verification), refs.bib and papers/ (human's — a Sak13 key would\nlet the fetched PDF join the library). A concurrent session was mid-batch on the\ne/a notation audit throughout, so this commit stages filtered hunks of appendix.md\n(the used-by line) and main_dag.md (the tally and the Q1-e8 index line), never a\nwhole mixed file; the three test failures standing at commit time (the assum:intro\ntable, the two historical L1 walks, Q1-L2-L2's P6 citation) all predate the run.\n\n## 2026-08-04 — test_record: the record's shape, checked\n\nSeven tests for the rules the newest ADRs added and nothing was checking: History\nis dated, oldest-first, and opens with the creation entry matching `created:`\n(ADR 0027); `updates/u<n>.md` numbering is consecutive from u1 and every update is\nlinked from the node's own History (ADR 0019); every node declares a role the\nschema comment knows, proof nodes depend only on proof nodes, and nothing is\nrequired-by corroboration or exploration (ADR 0015, 0018); `human:` stores one of\nthe user's five values, with the schema comment and the generator's HUMAN_SCALE\npinned equal (ADR 0014); and the priority panel parses row by row against its own\nschema, targets resolving, P-numbers unique (ADR 0020). One test pins the\nstored-status vocabulary across its three copies — the schema comment, the\ngenerator's STORED_STATUS, and test_operations.STATUSES — and writing it found the\nthird copy already drifted: it allowed \"retired\", which no schema, generator or\nnode ever stored, and omitted \"drafted\", the schema's own value, so a lawfully\ndrafted node would have failed L4 the day /prove produced one. Fixed in the same\nchange. Fault-injection before committing: a renamed update file, a nonsense role\nand the transiently missing panel target each failed exactly the right test, and\nthe restore left the suite at 74 passing with the three standing failures\n(assum:intro table, the historical L1 walks, Q1-L2-L2's P6 citation) untouched.\n\n## 2026-08-04 — $\\Lambda_X^+$ gets its own appendix entry; Q1-L4-L1's statement opens up\n\nTwo presentation changes at the user's request, neither touching mathematical content.\n\n$\\Lambda_X^+$ had no entry of its own: it lived implicitly inside `def:orbits_iwahori_spherical`, so Q1-L4-L1's opening \"fix $\\lambda\\in\\Lambda_X^+$\" had nowhere to point. A short notation entry now sits between that definition and `thm:chen_Ti` — what the poset indexes, that main.tex gives it no lattice or monoid structure, why the superscript $+$, and the symmetric-case identification with $\\Lambda_S^+$.\n\nWriting it surfaced a stale pointer. The definition's note cited the naming footnote at main.tex:317; the footnote sits at main.tex:747, and the note now defers to the new entry, which carries the correct line.\n\nQ1-L4-L1's statement was one dense setting sentence with run-on clauses. It is now a Setting paragraph and three labelled blocks — (a) Stabilizer, (b) Orbit presentation, (c) Quotient description — with the two displays set off; the claims are unchanged, so no `updates/` record is owed.\n\nA standing preference is recorded in session memory: repo prose well spaced, no paragraph over two sentences, statements in separated labelled blocks.\n\nAt commit time a concurrent `/examples` run had just written Q1-L4-L1's `examples.md`, still untracked. The gate flags its dimension pairing of $2\\rho$ with $\\mu$ as a generation bracket missing an ambient category — a heuristic false positive that belongs to that session, so only this session's files are staged.\n\n## 2026-08-04 — `/examples` Q1-L4-L1: the presentation is in print, and uncitable\n\nThe precedent search came back with the strongest possible answer. Sakellaridis–Wang (JAMS 35, arXiv:2009.03943) Prop. 2.3.7 proves clauses (a)+(b) at the node's own generality — its proof literally opens by defining the orbit as the fpqc sheaf quotient $\\mathsf{L}^+G/S$ and presenting it as $\\varprojlim_n \\mathsf{L}^+_nG/S_n$ along the jet groups.\n\nThe orchestrator verified the citation on the arXiv pages itself, not on the agent's word. The char-$p$ smoothness hypothesis of Prop. 2.3.7 is empty in this project's characteristic-zero setting, and the two deltas to the node — degenerate strata via the boundary variety, and the descent step (b)$\\Rightarrow$(c) — are routine.\n\nThree things the search established by absence. In Chen–Yi the presentation exists only unnumbered inside the proof of Thm. 36, which is exactly why the node had to state it; no general orbit–stabilizer theorem for placid group-scheme actions exists as a standalone numbered result anywhere we looked; and SW22 has no `refs.bib` key and no appendix entry, so the closed world cannot see the precedent — the node must still be proved from `thm:chen_Ti` and finite-type orbit theory.\n\nThe gate caught one render failure in the new file, a weight pairing written with angle brackets that the ambient-subscript check reads as a generation bracket. Rewritten as $(2\\rho,\\mu)$, Zhu's own notation; confidence moved $0\\%\\to+25\\%$, the literature channel at full weight.\n\n## 2026-08-04 — `/decompose` Q1-L5: two directions, three hypotheses isolated\n\nThe expansion u1 commissioned. The dévissage opens into five sub-lemmas: L1 and L2 carry the two directions of the criterion at exactly the parent's hypothesis level, and L3, L4, L5 isolate the three recollement hypotheses the revision recorded — continuity of the costalk restrictions, the fully faithful $!$-extension left adjoints, joint conservativity.\n\nThe load-bearing judgement is L5's scope. The lead-researcher declined to assert joint conservativity on all of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — the product-type tail mechanism in Q1-L5-e1's record makes the unconditional claim likely false — so L5 claims it per closed union with finitely many orbits, and the parent's Decomposition says in so many words that H3 at top level remains the standing hypothesis.\n\nL3 and L4 are stated over every closed union of orbit closures, not only $Z=LX$, because L5's finite recollement induction consumes exactly that generality. L1 and L2 are the ready leaves; both are conditional statements, so neither waits on the discharge nodes.\n\nNo new appendix entries — the children run on nine existing objects, whose used-by lines grew accordingly. Q1-L4's required-by gains L3 and L4, the transpose of the two new dependency arrows into the strata lemma.\n\nA concurrent session's Q1-L4-L1 commits landed mid-run and absorbed the stale Q1-e5 index line this session found at start; the trees never collided, and only this operation's files were staged.\n\n## 2026-08-05 — `/prove` Q1-L4-L1: proved in two rounds, the orbit reading ratified\n\nRound 1 was a closed-world FAIL of the right kind: Steps 1–3 and 5 held line by line, and the single MAJOR was that no entry, reading, or dependency said what \"orbit\" means sheaf-theoretically. The repair is ratified reading 3 ([ADR 0028](../decisions/0028-orbit-strata-are-fpqc-images.html)): strata are the fpqc-sheaf images of their orbit maps, and any identification with a pro-scheme presentation stays a theorem — exactly the distinction the referee's Flaw 2 demanded.\n\nThe referee's preferred route — an SW22 black box — is agent-blocked, since `refs.bib` is the user's file and SW22 has no key. The ADR records the rejection of the smuggle-one-layer-down alternative, and the reading's provenance note leaves the user a clean upgrade path: add the key and the PDF, and `/update` can convert the note into a citable entry.\n\nThe round also surfaced a generator bug: a markdown link whose text contains nested brackets — the display name $F = k((t))$, $\\mathcal{O} = k[[t]]$ — was invisible to both the site relinker and the link checker, so it rendered with a dead `.md` href while section 4 reported nothing. Both regexes now tolerate two nesting levels, and the widened match brought 13 previously unchecked links under the gate, all sound.\n\nA concurrent session ran its own round on the same node in the shared tree, and every fact it stored singly collided: its referee report overwrote this session's `r1.md` after it had been read, its repair added an orbit-presentation black box plus `node.md` edits doing what the ADR had rejected, and its prover overwrote `proof.md` after this session's r2 PASS. The reverts and the restore are recorded in the node's History; critique numbering protected the critique files, and nothing protects `proof.md` or a `node.md` — two `/prove` runs must never share a node, which is now the standing lesson.\n\n## 2026-08-05 — every node gets a generated self-contained prompt\n\nAt the user's direction, all 43 nodes now carry `node_prompt.md`. The artifact is a\nportable problem packet rather than a second node: role-sensitive task, short question\ncontext, DAG purpose and provenance, the canonical statement, direct prerequisites with\ntheir current use status, full declared appendix inputs, the transitive appendix\nvocabulary needed to read those inputs, repository references and the matching raw\n`refs.bib` records. The repetition is intentional and mechanically derived.\n\nThe design choice is [ADR 0029](../decisions/0029-every-node-has-a-generated-self-contained-prompt.html).\nManual prompts were rejected because one statement revision would make dozens of copies\nsuspect. `tools/build_dag_site.py` instead derives every prompt in memory, writes it on a\nnormal build, emits a sibling `prompt.html`, and makes `--check` fail on a missing, stale\nor stray copy. The site is built from the same in-memory prompt rather than reading the\ngenerated markdown back, preserving the no-readback law.\n\nThe first no-readback fault injection deleted all prompt files while a concurrent session\nwas rebuilding the same synced tree. macOS produced `node_prompt 2.md` conflict copies.\nAll obsolete generated copies were moved to Trash, the gate now rejects any\n`node_prompt*.md` name other than the unique canonical one, and the test now copies the\ncanonical inputs to a nonsynced temporary clone before removing the site and poisoning\nthe prompts there. The revised isolation test exercises the same property without\nmutating the working tree.\n\nThe repository-wide audit fixed a live contradiction in `README.md`: it still said\nsub-lemma directories were flat despite the nested-path invariant already enforced by\nthe generator and tests. The workflow and role definitions now exclude `node_prompt.md`\nfrom direct edits, `/update` and `/research-status` ignore it as authority, and the\npipeline, operations model, render-gate description and layout tests all name the new\nderived type. Concurrent `Q1-L4-L4` work — its `node.md`, appendix input, proof, critique\nand `papers/guideline.md` reading note — was left untouched; the generator merely\nrefreshed the derived prompts and site against that current canonical state.\n\n## 2026-08-05 — `/prove` Q1-L4: three children closed, the fourth proved over budget\n\nL1 took two rounds, L2 and L3 one each, and every round that failed failed for a closed-world reason rather than a mathematical one. That is the pipeline working as designed: the referee could not fault the argument, only the world it was allowed to argue in, and both times the repair was a widening the operator could justify on the page.\n\nThe two widenings differed in kind, and the difference is worth keeping. L1's was a **ratified reading** (ADR 0028) because the statement it needed — Sakellaridis–Wang on orbit images — has no `refs.bib` key and no agent may add one; L4-L4's was a **black-box entry** because Raskin is keyed and on disk. When the citable route is closed, ratifying a reading is the honest fallback; inventing an entry is not.\n\nL4-L4 also produced the sharper lesson. Its first draft declared a scoped GAP, and the referee's adjudication split it: half was an unwritten step available under the node's own hypotheses, half a genuine absence. The prover's diagnosis of the available half was itself wrong — it located the obstruction on coface squares when it sits on codegeneracies, which vanish over $\\Delta_{\\mathrm{inj}}$. An honest GAP is worth more than a confident error, and this one was both.\n\nThe node closed at **1281 words against 900**, accepted under the skill's overflow rule after the one compression pass. Prover and referee independently proposed the same cut — Step 2, the scheme-to-stack assembly, whose seam was pre-drawn by its own hypothesis and commissioned by the appendix entry's note. The write-up carries the overflow openly until the split is made.\n\nTwo operational findings. A markdown link whose text contains nested brackets was invisible to both the site relinker and the link checker, so it rendered as a dead `.md` href while the gate reported nothing; both regexes now tolerate two levels, and 13 previously unchecked links came under the gate. And concurrent sessions cost real work: one clobbered `r1.md` after it was read, wrote an appendix entry doing what ADR 0028 had rejected, and overwrote `proof.md` after a PASS, while another `rm -rf blueprint_site` mid-inspection left the user's open page unstyled. Critique numbering survived; `proof.md` and `node.md` have no such protection. Two `/prove` runs must never share a node.\n\n## 2026-08-05 — node files are named for their node, and every page has a door home\n\nTwo changes to the readouts, both small and both about not making a reader work. `node_prompt.md` became `<id>_prompt.md`, and the `## History` section moved out of `node.md` into its own `<id>_history.md`: a node's files now carry its id, so a path lifted out of its directory still says which node it belongs to, and the history of a node is one file rather than a section competing with the statement for the top of the page. `node.md`, `proof.md` and `critiques/` keep their fixed names — they are the same fact in every node, and the id in the directory already says whose.\n\nSplitting the history out broke one check nobody would have predicted: the appendix's `used by` line is validated against \"the node's file\", and a `used by` earned by a History entry vanished the moment History stopped living in `node.md`. The validator now reads both files. That is the second time this month a fact stored in one place was validated by scanning a filename — worth remembering when the next file moves.\n\nThe site half is one line of nav: every generated page — node, proof, prompt, history, critique, listing, appendix entry — now carries a `⌂` back to `dag.html` beside the existing `☰` hub. The crumb trail already encoded the way back, but only for a reader who reads it; a fixed button in the same corner does not move as the depth does, and node pages nest four levels deep.\n\n## 2026-08-05 — a review passage against clause (ii), and `node.md` finishes the rename\n\nA user review passage doubted clause (i) of [Q1-L4](../../nodes/Q1/Q1-L4/index.html): a stabilizer in a placid group scheme need not be placid, because the transition maps of the presentation $S_i = \\operatorname{im}(S \\to G_i)$ are not guaranteed affine. Both halves of that deserve recording, because they come apart — the general worry is right and the objection to this node is not.\n\nRight, in general: `placid_ind_scheme` asks the levels only to be of finite type, so nothing in the definition makes a map between two of them affine, and the sharper failure is smoothness, since in characteristic $p$ a surjective homomorphism of smooth groups can fail to be smooth. Wrong, here: the levels are the jet groups $L^mG$, which are affine, so each $K_{\\lambda,m}$ is a closed subscheme of an affine scheme and every transition is a morphism of affine schemes — affineness is free, exactly as [Q1-L4-L2](../../nodes/Q1/Q1-L4/Q1-L4-L2/index.html)'s draft says in three words, and the hypothesis it actually spends is characteristic $0$, for Cartier.\n\nThe passage was also addressed to the wrong clause, which is the more useful lesson: (i) is the orbit presentation and says nothing about placidity, while the placidity claim is (ii). The disposition is [Q1-L4-L2/u1](../../nodes/Q1/Q1-L4/Q1-L4-L2/updates/u1.html), the one statement edit is notational — the undefined $\\mathrm{ev}_0$ deleted, discharging the r1 flaw the referee had left to `/update` — and the node stays `proved`, because nothing it was refereed on changed.\n\nTwo things the run left standing rather than fixed. The literature gap is real and unchanged: Sakellaridis–Wang exhibit the stabilizer through the same finite-type images without asserting placidity, and the $\\mathcal{D}$-module-setting source for pro-unipotent invariance is still unverified at page level with no PDF on disk — now P13, and the one question worth sending to deep research. And \"any affine group scheme over a characteristic-$0$ field is placid\" sits in a *note* on the Raskin entry rather than being an object, so the one-line route past the whole objection is not citable in a proof — P14.\n\nThen the rename that [ADR 0032](../decisions/0032-a-nodes-own-file-is-named-for-the-node.html) records: `node.md` became `<id>_node.md`, the last file in a node directory not named for its node. Forty-three files moved and 766 links across 136 files were rewritten by resolving each target and renaming its last segment, the generator now discovering nodes by `rglob(\"*_node.md\")` filtered to `p.name == f\"{p.parent.name}_node.md\"` — a sharper rule than the old glob, since a node file that has drifted out of the directory named for it no longer looks like a node.\n\nTwo failures worth keeping. The first rewrite matched on the string `node.md` and so caught `0002-one-file-per-node.md`, whose name ends in those characters by accident; eleven links to that decision record broke and the render gate caught all eleven, which is the argument for resolving a path before renaming it. The second is procedural: a concurrent session committed while this one worked, and its commit swept up the forty-three staged renames under a message about something else — the moves are in `3b324a8` and only the ADR says why, which is the second time this month the shared working tree has crossed two sessions' work.\n";</script>
