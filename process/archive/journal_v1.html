<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>journal_v1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Build journal — v1, the full entry-by-entry record</h1><p class="lead">Generated from <code>process/archive/journal_v1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[journal](../journal.html) · [docs index](../index.html) · [design](../pipeline.html) · [decisions](../../../process/decisions)\n\nThis is the build journal as it stood on 2026-08-05, before it was compacted: one `##`\nentry per step, sixty-nine of them, every word as originally written. Nothing here has\nbeen edited — that is the point of keeping it.\n\n[`journal.md`](../journal.html) is now the reading copy: the lessons at the top, then the same\nhistory folded into phases. When the two disagree about what happened, **this file is\nright** and the compaction lost something; say so in a new entry there rather than editing\neither. Kept under the same convention as [`operations_v1.md`](operations_v1.html), which\npreserved the superseded flat-schema version of the operations document.\n\n---\n\n## 2026-08-02 · `4280e6e` — baseline\n\nManuscripts, preamble and bibliography committed before any automation, so that every later diff separates *research output* from *the machinery that produced it*. `main.tex` declared canonical; `yiannischeck.tex` kept as an older, longer variant to consult when the manuscript is silent. (The manuscript was called `v2.tex` at the time; the entry for today's rename is at the foot of this file.)\n\nDeciding this first turned out to matter more than expected: with the boundary in place, \"did the pipeline change the paper?\" is answerable by looking at whether `main.tex` appears in a diff. It never should.\n\n## 2026-08-02 · `7da76fe` — scaffold\n\nAgent definitions, slash commands, `blueprint/`, `drafts/` and templates. Three agents at this point — lead-researcher, prover, critic — with tool grants chosen to make the write discipline mechanical rather than advisory. The critic was given no edit and no shell tools, only Read/Grep/Glob/Write for its own report.\n\n## 2026-08-02 · `cf5f5e5` — bootstrap the context\n\nHand-distilled `blueprint/context.md` from the Conventions section of `main.tex`: standing assumptions, a notation table, a black-box table, and the citation policy. This was the first statement of the closed-world rule (invariant I1): agents may invoke what is distilled here plus the node's dependencies, and nothing else.\n\nThe distillation was manual and slow, and that was the correct trade. An automatically-scraped context would not have forced the decision about *what is being assumed*.\n\n## 2026-08-02 · `6421ca0` — `/decompose` Q1 → 7 nodes\n\nFirst real use. Q1: when does the Satake subcategory exhaust the coherent $\\mathcal{D}$-modules, $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)$?\n\nThe lead-researcher returned seven nodes with a stated logical closure: Q1-L1 ⟹ Q1-L2; Q1-L2 + Q1-L4 ⟹ Q1-L5 for the exact criterion; Q1-L3 the necessary condition (Hecke saturation); Q1-L6 the sufficient condition (clean costalks); Q1-L7 the group case as a sanity check. Bracketing the answer between a necessary and a sufficient condition, rather than aiming straight at a characterisation, is what made the decomposition provable node by node.\n\nReviewing the statements before proving anything is the step that cannot be skipped — the decomposition *is* the strategy, and a wrong one wastes every prove downstream of it.\n\n## 2026-08-02 · `39193fe` — `/prove` Q1-L1 → proved after 2 rounds\n\nEnd-to-end shakedown, and the first genuine finding.\n\nQ1-L1 is a `def-check`: it pins down what $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ *is*, so that later nodes argue about an unambiguous object. Round 1 came back `VERDICT: FAIL`. The reason was not a flaw in the prover's argument but an ambiguity in the manuscript: `def:satake_subcategory` invokes the generation operation $\\langle-\\rangle$ of `def:generation` without naming the ambient cocomplete category, and $\\mathcal{D}_c$ is small and not cocomplete, so the definition as printed does not determine a subcategory. The prover had silently chosen a reading; the critic caught that the choice was unjustified.\n\nResolved by ratifying the $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$ reading, which is forced by the essential-image step in the proof of `thm:F_cstr_Sat` (main.tex:1391–1392). Round 2 passed. Recorded as [ADR 0001](../decisions/0001-satake-generation-ambient-category.html).\n\nThis is the clearest evidence so far that the hostile-referee step pays for itself: the pipeline's first output was not a proof but a **defect report against the paper**.\n\n## 2026-08-02 · `b5d7809` — standard LaTeX math in all markdown\n\nHouse macros (`\\cD`, `\\Sat`, …) were leaking from `.tex` into blueprint markdown, where nothing expands them: neither GitHub's renderer nor an agent reading raw text. Converted every `.md` file to standard KaTeX/MathJax and added a VS Code preview shim for strays — with the rule that every file must render *without* the shim (invariant I7).\n\n## 2026-08-02 · `59c6210` — build hygiene\n\nAll LaTeX artefacts routed into gitignored `build/` via a root `.latexmkrc`; an older stray `main.tex` removed — not today's manuscript, which was still called `v2.tex` then — recoverable from history; `README.md` written. Stale root-level `*.aux`/`*.bcf` had been breaking latexmk's biber detection.\n\n## 2026-08-02 — node files, and a fourth agent\n\nTwo changes that were in progress uncommitted when the appendix work started.\n\n*One file per node.* `blueprint/main_dag.md` had been carrying full statements inline and was becoming unreadable. Split into `blueprint/nodes/<id>.md`, one file per node holding statement, type, status, dependencies, back-links, draft and critique — making the DAG navigable by clicking, in the GitHub blob view and the VS Code preview alike. The index kept a status table. See [ADR 0002](../decisions/0002-one-file-per-node.html).\n\n*The checker.* The critic kept flagging presentation problems, which is not its job, and the noise was hiding the mathematics. Split presentation into a fourth agent, `/check`, that is content-preserving by construction: it may rewrap a statement, never restate one, and never touches a status field or a `VERDICT:` line. See [ADR 0004](../decisions/0004-checker-separate-from-critic.html).\n\n## 2026-08-02 — appendix of objects; tables retired; these docs\n\nThree related changes.\n\n*Appendix.* Every object the pipeline may invoke — 40-odd definitions, conventions, black boxes and manuscript results — now has one full entry in [`blueprint/appendix.md`](../../appendix/index.html), stated in full with its `main.tex` line, attribution, role, and the hypotheses to check at each use. Objects had previously been compressed into two tables in `context.md` and referenced elsewhere as bare labels like `` `thm:chen_Ti` ``, which neither a human skimmer nor an agent without `main.tex` in hand can resolve. See [ADR 0003](../decisions/0003-appendix-of-objects.html).\n\nWriting the entries surfaced four things the tables had hidden:\n\n- a broken reference, `def:orbits_iwahori_sphe rical`, with a stray space, sitting in the Q1 setting paragraph and pointing at nothing;\n- `\\label{lem:invrariance_lemma}` is misspelled in `main.tex` and must be cited with the typo intact;\n- `\\mathcal{D}^{\\mathrm{ren}}` is defined at main.tex:794 with **no label at all**, so it can only be cited by line;\n- `p:compact_generation_stable_case` as printed omits the conclusion of its clause (2).\n\nNone of these were discoverable from a table row.\n\n*Tables retired.* The status table in `main_dag.md` became one bullet per node; the notation and black-box tables in `context.md` dissolved into the appendix. `context.md` now states only what is *in force* — setting, hypotheses, ratified readings, argument shape — and links for everything else.\n\n*These docs.* `docs/` created with [`pipeline.md`](../pipeline.html) (the design and its invariants), this journal, and [`decisions/`](../../../process/decisions) for the choices that would be expensive to reverse.\n\n## 2026-08-03 — node directories, examples from the literature, a graph you can look at\n\nFour changes, driven by the same complaint: the pipeline was legible to whoever built it and to nobody else.\n\n*One directory per node.* A node was one markdown file, its proof was in `drafts/lemmas/`, its PDF in `build/` — three places, tied together by a naming convention. Now everything is in `blueprint/nodes/<id>/`: `node.md`, the write-up `<id>.tex`, and room for `examples.md` and `prompts/`. See [ADR 0005](../decisions/0005-node-directories.html).\n\n*One page.* Q1-L1's refereed write-up was ten pages, roughly seven of which restated framework results that the appendix now carries. Write-ups are capped at one page, checked with `pdfinfo`. The limit only became possible once [ADR 0003](../decisions/0003-appendix-of-objects.html) gave every object a single home to cite: the old \"Ingredients\" section *was* the appendix, rewritten once per node.\n\nQ1-L1 was condensed accordingly, from ten pages to one, and it still compiles. Worth stating plainly: **the condensed text has not been re-refereed.** Same mathematics, same five steps, but the `proved` status now attaches to a text no critic has read. The ten-page version is at commit `39193fe`. A fresh `/prove Q1-L1` would close this.\n\n*Examples.* Nothing in the pipeline asked whether a statement has any instances — a decomposition can be consistent, survive the critic, and be about the empty set. `/check <node-id>` now searches the literature and writes `examples.md`, or, when it finds nothing, a self-contained prompt under `prompts/`. That escape hatch is the point: an agent told to find examples with no acceptable way to fail will invent one, and a fabricated citation with a plausible result number is the worst thing this repo could produce. See [ADR 0006](../decisions/0006-examples-from-the-literature.html).\n\n*A graph you can look at.* `tools/build_dag_site.py` generates `docs/dag.html` from the index and the node files: layered graph, status colours, click for the statement, hover to see everything a node rests on and everything that falls with it. Self-contained, no network, regenerated by `/prove` and `/check`. [ADR 0002](../decisions/0002-one-file-per-node.html) had rejected generating the DAG *source* from data; generating a *view* has the opposite failure mode — the worst case is visibly stale, and one command fixes it. See [ADR 0007](../decisions/0007-generated-dag-view.html).\n\nThe README was rewritten around the question it had not been answering: not what the four agents are, but what a person types. You never invoke an agent. You type one of four slash commands, and the command drives the agents.\n\n## 2026-08-03 — the graph made legible, and lemmas that decompose\n\nFollow-up to the morning's changes, all from looking at the thing rather than reasoning about it.\n\n*The write-ups did not compile.* Only from the repo root, which is not where anyone builds a file they have open in an editor — and building in place scattered `.aux`/`.log`/`.fls` beside `node.md`. Fixed by giving each write-up an `\\input@path` that walks up to the repo root, and each node directory a four-line `.latexmkrc` that routes artifacts to `build/`. It now compiles from the repo root, from its own directory, and under bare `pdflatex`.\n\n*The graph was unreadable.* Two causes. There was no `<!doctype html>`, so browsers rendered in quirks mode — which KaTeX refuses to work in, and which it had been warning about all along. And statements are markdown, not just TeX: links and numbered items were showing as raw source. Fixed by vendoring KaTeX under `docs/vendor/` (woff2 only, 592K, no network) and writing a small markdown renderer that splits math out, converts links, code, emphasis and lists, then renders each fragment. All 95 math fragments in the current DAG now render; that is checked by running them through KaTeX in node.\n\n*Hierarchy.* The layout ranked by distance from the leaves, which put foundations on top and read backwards. Now the question is the top card and depth is measured from it: the lemmas that answer it directly sit beneath it, their dependencies below those. An arrow points to what a node is proved *with*. Clicking pins — the previous version reset the highlight the moment the pointer left, which made it useless for actually reading anything.\n\n*`--check`.* `tools/build_dag_site.py --check` verifies the blueprint against itself — status drift, dependency transpose, dangling appendix anchors, sub-lemmas with no parent — and reports whether `docs/dag.html` is stale. This is what finally makes invariant I5 more than an intention. `/decompose` and `/check` both run it, and `/check` now also has to bring `docs/pipeline.md` back in line with what the repo actually does: a design doc goes stale silently, since nothing breaks when it is wrong.\n\n*Expanding a lemma.* `/decompose` takes a node id as well as a question, and decomposes that lemma into `<id>-L1`, `<id>-L2`, … This is the escape hatch for the one-page rule: when a write-up will not fit, the node was really several nodes. The parent's statement stays frozen, so I2 survives the DAG growing underneath it.\n\n## 2026-08-03 — Q1-L1 refereed again; the diagram conventions reviewed\n\n*Round 3 on Q1-L1.* The condensed one-page write-up went back to the critic, since `proved` had been attached to a text no referee had read. `VERDICT: PASS` — the two steps most at risk from condensation both survived, and the long version's three remarks turned out to have been delegated (to the node's Remark, to the `def:satake_subcategory` appendix entry, and to ADR 0001) rather than dropped.\n\nOne real defect, and it is the kind only a careful reader finds. Step (1) wrote $\\mathcal{D}(S')^\\omega$ — the *compact* objects — where `defn:coherent_D_mod` defines $\\mathcal{D}_c(S')$ as finite complexes with coherent cohomology. The step therefore assumed compact $=$ coherent on finite-type test schemes, which is true there but is exactly the identification the blueprint's \"coherent is not compact\" warning exists to police, and it had no appendix entry. Repaired by arguing with $\\mathcal{D}_c(S')$ directly, which is thick for its own reasons.\n\nThe other findings were ledger defects worth recording: the node's `objects:` field (3 entries), the draft's \"Uses\" line (6), and the set the proof actually consumed were three different lists. The convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ — the proof's most fragile input, asserted without proof in main.tex and used in three steps — was declared in neither, while `p:compact_generation_stable_case` was declared and never used. Both lists now name what is used. A `/prove` round should probably diff these three sets automatically; for now the critic does it.\n\n*Diagram conventions.* Reviewed Tao's `paper-diagram` viewer and took four things from its format spec: arrows point prerequisite → result (the first version pointed the other way and read backwards), results at top with prerequisites sinking to the bottom, positions derived rather than stored, and category filtering that re-links through hidden nodes instead of disconnecting the graph. The JSON format itself was not adopted — it would be a second source of truth for edges the node files already carry. Reasoning in [ADR 0007](../decisions/0007-generated-dag-view.html).\n\n## 2026-08-03 — the page did not render, and the check that should have caught it\n\n`docs/dag.html` rendered nothing. The cause was a patch to the generator that replaced the block containing both the edge construction *and* the question-card construction, but restored only the edges — leaving `const G = {'__q': qg}` referring to a `qg` that no longer existed. The script threw `ReferenceError` on its first statement, so the graph, the panel and the header were all empty.\n\nI had checked that page with `node --check`, which validates syntax and passed, because the syntax was flawless. That is the whole lesson: a check that cannot fail on the bug you actually shipped is not a check. `tools/dag_smoke.js` now executes the page against a stub DOM with the real KaTeX, clicks every node, and asserts the graph was drawn and the panel filled — and I verified it by reintroducing the exact deletion and watching it fail.\n\nThe repo-wide sweep that followed found one more real defect and a pile of my own false positives. The real one: the critic had written house macros — `\\cD`, `\\bs`, `\\anbr` — into all three of its reports, which render as nothing on GitHub. `.claude/agents/critic.md` has told it to write standard KaTeX from the start. Nothing was checking, so the instruction was decoration. Expanded the macros in the three critiques (presentation, not content) and wired `tools/check_render.py` into `/decompose`, `/prove` and `/check`.\n\nThe false positives were instructive too. My first pass flagged `CLAUDE.md` and every agent prompt, because those files *quote* the macros they forbid — a rule saying \"never write `\\cD` in markdown\" contains `\\cD`. Any linter over a repo that documents its own conventions has to strip inline code spans before it scans, or it will spend its life reporting the rules as violations of themselves.\n\nRepo now: 814 math fragments render, 0 house macros leaked, 0 broken links across 324, the write-up compiles from the repo root and in place at one page, and the DAG page runs.\n\n## 2026-08-03 — `docs/` becomes a site\n\nThe DAG page was one file linking out to files that do not render: an appendix anchor\ninside a 3,000-line markdown document, a write-up whose only readable form was a PDF in a\ngitignored directory, a critique full of mathematics that renders only on github.com. So\n`tools/build_dag_site.py` now generates a page for everything a link can point at —\naround eighty of them — and rewrites every internal link to target the generated page.\nReasoning in [ADR 0008](../decisions/0008-one-page-per-object.html).\n\nThe interesting part was the write-up pages. A node's `.tex` is written in house notation\n(`\\cD`, `\\Sat`, `\\anbr`), and KaTeX takes a `macros` option, so in principle you harvest\nthe preamble and hand it over. In practice almost none of this repo's notation is written\none `\\newcommand` at a time: it is generated by `\\docsvlist` loops — `\\c#1 -> \\mathcal{#1}`\nover the alphabet, `\\f#1 -> \\mathfrak{#1}`, a `\\text{#1}` list several hundred entries\nlong. Harvesting the plain declarations found 79 macros and missed `\\cD`, `\\Sat`, `\\Gr`\nand `\\Ind`. Expanding the loops, in document order so a later `\\renewcommand` wins, finds\n1,063 — and Q1-L1's write-up then renders all 79 of its formulas with nothing left over.\nThe macros go to the write-up pages only: supplying them site-wide would mask exactly the\nleakage I7 exists to catch.\n\nThe graph itself was rebuilt as HTML cards over an SVG edge layer sharing one pan-and-zoom\ntransform. Drawing nodes as SVG text meant hand-placing every line and gave no way to show\na formula; as HTML, in-place expansion is a CSS transition and the card can carry real\nKaTeX. Clicking a node expands it and fills the panel with that node and nothing else;\nclicking again collapses it. The panel collapses too. `dag.html#Q1-L5` opens a node, which\nalso made the expanded state screenshot-testable — worth having, since the last two\nrendering bugs here were both invisible to the checks that were supposed to catch them.\n\nNodes now carry `created:`, set once by the lead-researcher and never changed. The seven\nexisting ones were backfilled to 2026-08-02, the date of the `decompose(Q1)` commit;\n`--check` rejects anything that is not an ISO date.\n\nThree defects surfaced during the work, all of them things a single-file page could not\nhave exposed. Appendix section anchors (`#s2`…`#s9`) pointed at headings no generated page\ndefined. Object labels that are themselves mathematics — `$\\mathrm{IC}_0$` — were rendered\nas raw TeX inside a code span, which the new smoke test caught on its first run. And the\ndeep link was being cleared by the initialisation that ran before it was read, so\n`#Q1-L5` opened nothing; I only noticed because I screenshotted it instead of trusting\nthat it worked.\n\nOne more of the familiar kind: `README.md` and `docs/README.md` both mapped to\n`docs/notes/readme.html`, which on a case-insensitive filesystem is one file. The symptom\nwas a page reporting itself perpetually stale. It was caught only because `--check` now\ncompares every generated page rather than the single one it used to write.\n\nRepo now: seven checks, all passing — 814 markdown math fragments, 0 macro leaks, 324\nmarkdown links and 893 links between generated pages all resolving, the write-up compiling\nboth ways at one page, the graph running, and 83 pages rendering 2,462 fragments.\n\n## 2026-08-03 — one tree per kind, and the index stops being written twice\n\n*The repo had seven top-level directories and no way to tell, from a path, who was allowed\nto write there.* Three trees were keyed by node id — the node directory, `drafts/critiques/`,\nand the generated `docs/nodes/` — so \"one node, one directory\" was true of one of them.\n`docs/` was half hand-written (`pipeline.md`, `journal.md`, `decisions/`, a `README.md`,\nand the vendored KaTeX) and half generated, so no sentence described it truthfully.\n\nNow: `blueprint/` is all reasoning, `process/` is how the pipeline works, `docs/` is the\nsite and nothing else, `tools/` and `.claude/` are machinery. Critiques live at\n`blueprint/nodes/<id>/critiques/r<n>.md`. KaTeX is checked in under `tools/vendor/` and\ncopied at build time, so `rm -rf docs` and a rebuild reproduces the site byte for byte.\n\n*The index was the bigger change.* `main_dag.md` repeated every node's title, type, status\nand dependencies, and said so in its own prose: the two copies \"must agree\", and\n`/research-status` reported drift. That is a duplication we chose, plus a check to police\nit, plus a reconcile step in one skill and a write-back step in another. The bullets and\nthe tally are now generated from the node files into the same file, between `BEGIN INDEX`\nmarkers. `ready` and `blocked` stopped being stored anywhere — they are functions of the\ndependency statuses, so a `node.md` records only `open`, `drafted`, `failing`, `proved`,\nand `--check` rejects anything else. Q1-L5 and Q1-L6 were storing `blocked`; they now\nstore `open` and display as blocked, which is the same fact computed instead of copied.\n[ADR 0009](../decisions/0009-one-tree-per-kind.html).\n\n*Two defects the move exposed.* The root `.latexmkrc` and each node's own sent the same\nwrite-up to different output directories, so whichever compile ran second found the first's\nstale `.bcf` and biber failed — the symptom CLAUDE.md already warned about, now with a\ncause. Both route to `build/nodes/`, and `build/` holds the manuscript alone, which is what\nwas asked for. And the schema comment documenting the new `<!-- BEGIN INDEX -->` markers\ncontained a literal `-->`, terminating itself early and spilling the rest of the schema onto\nthe page as live markdown. The link checker caught it, from a broken link to\n`nodes/Q<n>-L<m>/node.md` — a path that only exists in a template.\n\nThat is the third time a gate has been confused by prose *about* the thing it checks:\n`check_render.py` flagged the rule forbidding house macros, `site_smoke.js` flagged the rule\nabout `$$` blocks, and now an HTML comment could not contain an example of an HTML comment.\nThe pattern is stable enough to plan around: anything in this repo that documents a\nconvention will eventually be read as an instance of it.\n\nRepo now: seven checks, all passing — 814 markdown math fragments, 0 macro leaks, 337\nmarkdown links and 907 links between generated pages all resolving, the write-up compiling\nboth ways at one page, the graph running, and 83 pages rendering 2,462 fragments.\n\n## 2026-08-03 — the ambient category becomes visible\n\n*Notation.* Every symbol whose meaning depends on an ambient category now names it:\n$\\langle S\\rangle_{\\mathcal{C}}$, $\\operatorname{Map}_{\\mathcal{C}}$, and $=$ / $\\simeq$\nsubscripted with the category the assertion is made in. Q1-L1 existed to ratify that the\nSatake generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$; that reading was recorded\nin prose beside a formula that did not show it. Now the formula shows it.\n\nThe subscript is dropped in two places, so that it stays informative: when the ambient is\nalready one of the two sides, and when the two sides live in no common ambient — an\nequivalence of categories or of stacks. Q1-L4 is therefore untouched.\n\nThis edits frozen statements ([I2](../pipeline.html#4-invariants)), which is why it was done as\nrenotation and not restatement: every subscript inserted is the ambient the surrounding\nprose already named. Q1-L4 needed no change at all, which is a small check on the claim.\n\nGate 8 in `check_render.py` fails on a generation bracket with no subscript. The seven\noccurrences in Q1-L1's three critiques are reported as `note:` and do not fail the run —\na critique is an append-only record of what a referee saw, and rewriting one to match a\nconvention adopted afterwards would be falsifying it.\n\n## 2026-08-03 — Q1-L2 expanded, and the sub-DAG renderer meets its first sub-DAG\n\n*Four sub-lemmas.* Q1-L2-L1 (coherent objects are the compacts of\n$\\mathcal{D}^{\\mathrm{ren}}$), L2 (generation by compacts is decided on the compacts),\nL3 (the Hecke family is small, compact and shift-stable), L4 (for shift-stable compact\ngenerators, generation equals detection). Three are ready leaves; L3 waits on L1.\n\nThe decomposition is honest about where the content is. (1) ⟺ (2) needs L1 + L2 and is\nwhere the work sits; (2) ⟺ (3) is L4, which is the node that reconciles the $n\\in\\mathbb{Z}$\nof the parent's clause (3) with the $i\\ge 0$ of the GR17 clause quoted in `def:generation` —\na discrepancy that was sitting in plain sight in the appendix and that nobody had had to\nconfront until the statement was decomposed.\n\nTwo new appendix entries, both cited by line because main.tex leaves them unlabelled:\nmodule categories (main.tex:589–602, on `HA`) and the spherical Hecke action (main.tex:924,\n1096–1102). The second carries an honest note that main.tex gives the convolution diagram\nonly for the Hecke category and describes the $LX$-action in words. Both line references\nwere checked against the manuscript rather than taken on trust.\n\n*The renderer.* Building the sub-DAG pages one commit before the first sub-DAG existed\npaid off immediately: `dag_smoke.js` ran `nodes/Q1-L2/dag.html` and failed with \"raw TeX\ndelimiters reached the panel\". These are the first node titles to contain mathematics, and\ntitles were being escaped rather than rendered — on the card, in the panel heading, in the\nnode listing and in the node page's `<h1>`. Because the renderer had landed separately, it\nwas obvious the fault was in the renderer and not in the decomposition.\n\nAlso corrected: the schema block claimed fields run type/status/created, while all eleven\nnode files write type/created/status, and it still told the reader that expanding a lemma\nsets the parent to `blocked` — a status that no longer exists as a stored value. The parent\nwent to `blocked` on its own, derived, with nobody writing anything.\n\n## 2026-08-03 — Q1-L1 re-proved, and what a re-proof costs\n\n*Rounds r4 and r5, continuing the numbering.* The old write-up was deleted, the node set\nback to `open`, and the statement — renotated in the morning — proved again from scratch.\nr1–r3 stayed on disk, and the prover was told to read them: a flaw two earlier referees\nhad already caught, reintroduced, would be worse than a new one. This is the first time\nthe append-only numbering rule earned its keep; had rounds restarted at r1, the record\nwould now show a node proved in two rounds with no trace of the three that came first.\n\n*r4 FAILed on the closed world, not on the mathematics.* The submodule step justified\nexactness of $\\mathcal{F}'\\ast(-)$ by a composite that did not typecheck — it fed a functor\nlanding in $\\mathcal{H}_c\\otimes\\mathcal{M}_c$ into an action typed out of the *product*.\nThe claim is true, and the entries that establish it exist: `conv:module_categories` and\n`conv:hecke_action`, added days earlier for Q1-L2-L3. They were simply not in Q1-L1's\n`objects:` field. The guardrail worked exactly as designed — the fix is to widen the\ndeclared world, deliberately, not to let a proof reach outside it — and the lead-researcher\nadded five entries after checking each said what the flaw needed.\n\nThe prover had volunteered all three of its own boundary crossings in its round-4 report.\nWorth noting: it knew, and said so, rather than hoping. The critic then judged each\nindependently rather than accepting the self-assessment, and upgraded one to MAJOR.\n\n*Two gaps in the gates, both found by agents rather than by tools.*\n\nThe lead-researcher observed that `used by` on an appendix entry is prose nothing\nrecomputes, so it had drifted — eight lines were wrong — and that `--check` does not\nvalidate it. It does now: a `used by` line must name every node whose `objects:` cites the\nentry, and may name only nodes whose file mentions it at all, which preserves the one\ndeliberate case (`thm:F_cstr_Sat` is cited by Q1-L1 from a Remark, never from the proof).\n\nThe critic observed that the frozen statement still had one unsubscripted relation,\n$\\mathrm{IC}_0 = \\delta\\ast\\mathrm{IC}_0$, missed by the morning's renotation. Gate 8 could\nnot have caught it: it checks generation brackets, and a rule that flagged every bare `=`\nwould fire on $LX^{\\mathrm{sat}} = LX$ and a dozen other legitimate ones. Some conventions\nare only enforceable by a reader.\n\n*The write-up rendered badly before it rendered well.* To fit eleven citations on one page\nthe prover reached for `\\footnotesize`, `\\raggedright`, `\\setlength` and\n`\\emergencystretch`. These carry no meaning in the reading view, so the converter now drops\nthem — but dropping `\\footnotesize` alone left its wrapping braces on the page as literal\n`{` and `}`, which no check noticed and a screenshot did. The first fix for that unwrapped\n`\\textbf{\\large ...}` too and printed `\\textbfQ`; the unwrap is now restricted to a brace\nthat opens a group of its own.\n\n## 2026-08-03 — one manuscript, one preamble\n\n`v2.tex` renamed to `main.tex`; `milton_commands.tex`, `milton_packages.tex` and\n`toan3_style.tex` merged into a single `preamble.tex`. The paper and every node write-up\nnow `\\input{preamble}` and nothing else.\n\nThe merge is a concatenation in the old `\\input` order, not a reorganisation, because\npreamble order here is semantic: `fullpage` (was `toan3_style.tex`) deliberately overrides\n`geometry` (was `milton_commands.tex`), and `cleveref` must load after `hyperref`. Only\nprovably redundant lines were dropped — six duplicate `\\usepackage` lines and a second\nidentical biblatex block, which had been loading `refs.bib` as a resource twice. The\ngenerated file carries section banners naming which of the three each region came from.\n\nVerified rather than assumed, because a preamble merge fails silently: 160 macro\ndefinitions counted in the sources and 160 in the merge, all six `\\docsvlist` payloads\nbyte-identical, and `pdftotext` of the manuscript before and after differing in exactly one\nline, the `\\today` date. The node write-up still compiles to one page from the repo root\nand in place.\n\n178 references across 23 files were swept. Three classes were deliberately left alone:\n`refs.bib`, whose `v2` matches are bib keys (`...ov2008...`) and one arXiv version string;\neverything under `blueprint/nodes/*/critiques/`, which is an append-only audit trail (I4)\nand is never rewritten to match a convention adopted after it; and `docs/`, which is\ngenerated and was rebuilt. A blind substitution also rewrote history it should not have —\nthe `59c6210` entry above records the removal of an *older*, unrelated `main.tex` — so two\nlines in this file name the old and new filenames explicitly.\n\nBoth gates pass: `check_render.py` (1262 math fragments, 542 links, 96 pages, write-up\ncompiling both ways) and `build_dag_site.py --check` (11 nodes consistent, no stale page).\nThe two tools now harvest house macros from `preamble.tex` instead of two separate files.\n\n## 2026-08-03 — the design, stated without the mathematics\n\n[`problem_generation_pipeline.md`](../problem_generation_pipeline.html) added: the same machine\nas [`pipeline.md`](../pipeline.html), stated so it can be instantiated in a repo that has nothing\nto do with mathematics. Four objects (closed world, node, DAG, verdict) with signatures, the\nfive-role algebra with the tool grants quoted verbatim, the five directory kinds with a\nfive-question test for classifying a new one, I1–I11 each with a **Domain instantiation**\nline, the lifecycle, eleven gates, and a thirteen-step instantiation checklist.\n\nTwo files, not one, on purpose. `pipeline.md` says what *this* pipeline is and stays free to\ntalk about lemmas and the appendix; the new file is the portable form and may not assume a\nsubject matter. Merging them would force every invariant to be stated twice anyway, once\nconcretely and once abstractly, in the same paragraph.\n\nWriting it surfaced the one genuinely mathematics-specific rule in the system: gate 8, the\nambient-category subscript check. Its *content* does not port. Its *shape* does — a notation\ngate is one regex per convention the domain ratifies after a review catches its violation —\nand the discipline that goes with it is not to write such a gate before the incident that\nmotivates it, because a gate with no incident behind it is a rule nobody can defend when it\nfires.\n\nThe document was fact-checked against the repo by an adversarial pass that was told to\nrefute rather than approve, and it found two wrong facts in the draft: a claim about CSV\nheaders in the target repo that the code contradicts, and a misattribution of which three\nplaces ADR 0001 says a ratified reading must agree in (the appendix entry, the node remark\nand `context.md` — not the decision record and the gate). Both corrected. The pattern is\nworth keeping: a document *about* the repo needs the same hostile read a proof does, and for\nthe same reason — plausible and wrong is the failure mode, and the author cannot see it.\n\n## 2026-08-04 — the operations, as maps\n\n[`operations_v1.md`](operations_v1.html) added: every command written as a partial map with a domain\nand a codomain, the gates as predicates on named types, ten laws the state satisfies after\neach step, and — the part that justified the exercise — a table of the operations that do not\nexist. The idiom is Wang–Buehler's categorical account of agentic discovery\n(arXiv:2606.01444): a schema category of artifact types, state as a `Set`-valued copresheaf\non it, provenance as the category of elements, and a distinction between updates inside a\nregime and moves that change the regime.\n\nThree things came out of it that prose had not made visible.\n\n**An invariant can be an absence.** I10, \"examples illustrate, never justify\", was a rule four\ndocuments repeated and an agent was trusted to follow. As a claim about the schema it is an\nempty hom-set — there is no morphism from an example into a draft — so the question of\ncompliance does not arise. The same reading covers \"the pipeline does not touch the\nmanuscript\": no operation has `main.tex` in its codomain, which is why that rule has never\nneeded a gate.\n\n**Widening and narrowing the appendix are different moves.** Adding an entry is a fully\nfaithful schema extension: nothing already there changes meaning, so every existing proof\nsurvives, which is what licenses the `/prove` loop to widen a node's objects mid-round.\nRatifying a reading *narrows* an entry, is not fully faithful, and puts every draft written\nagainst the looser reading back in doubt. The repo has run that case once — ADR 0001, and\nQ1-L1's `r4`–`r5` — and there is no gate that notices, though `used by` already holds the\nanswer.\n\n**The missing command is a missing hom-set.** `/decompose` refines a lemma downward; nothing\nmaps a node to a *question*. The seed directory and `/decompose \"<question>\"` both exist, so\nthe sideways move is doable by hand — what is lost is the edge recording which node raised it.\n\n`README.md` rewritten around two tables (command → input → output → example, and the typed\nsignatures) with the prose cut to what the tables cannot carry, and `thoughts.md` added at the\nrepo root for open questions that are not yet decisions. Its first entry argues that the\n`blueprint/`-versus-`docs/` question is misposed: markdown-as-source is load-bearing for four\nspecific mechanisms — derived fields, the content-preservation diff, the human review of a\ndecomposition, and agents reading raw text — but *committing* the generated tree is not, and\nwith no git remote it currently buys nothing. That decision becomes ADR 0010 when it is made.\n\n## 2026-08-04 — the site leaves git, and stops being called `docs`\n\nTwo changes, one record: [ADR 0010](../decisions/0010-site-untracked-and-renamed.html). The\ngenerated site is now gitignored, and `docs/` is renamed `blueprint_site/`.\n\nThe question that prompted it was whether `blueprint/` and `docs/` should both exist —\nwhether to drop the markdown and author the HTML directly, since the browser is where the\nwork is read. Both halves turned out to be answerable, and they have different answers.\n\n**Untracking.** The site stands to the blueprint as the PDF stands to `main.tex`, and the\nrepo already gitignores every PDF and all of `build/` on exactly that reasoning. Storing it\nanyway was costing three things: git's answer to \"what changed?\" was dominated by rebuild\nnoise (94 pages, 121 tracked files, 56% of the repo, 12 of 19 commits), KaTeX was stored\ntwice, and the `STALE` half of `--check` existed only to catch a stored site drifting from\nits source — which cannot happen once the site is always rebuilt. Tracked files fall from\n216 to about 95. The cost accepted is that a fresh clone has no site until the generator\nruns, which is the cost a remote would remove, and the reason to revisit.\n\n**Collapsing to HTML: rejected**, on three mechanisms rather than on taste. Derived fields\n(`required-by` as the transpose of `depends-on`, `ready` and `blocked` computed at display\ntime, the graph geometry from the edges) would become hand-typed in every place they appear.\nThe one step that cannot be delegated — reviewing a decomposition — is performed by reading a\ndiff, and seven `node.md` files diff readably where seven HTML pages do not. And every\n`/prove` packet inlines appendix entries as raw text, which arrive clean from markdown and\nwrapped in navigation from HTML.\n\nWorth recording that the rejected option's strongest form is not weak: roughly 90 of the 94\npages are a nicer rendering of a markdown file GitHub would render for free the moment a\nremote exists, and only the graph pages and the rendered write-ups are irreducible. The\nargument for the split is about how the *source* is edited, reviewed and read by agents, not\nabout what the reader sees.\n\n**The rename** follows from the untracking. `docs` was never a description — it is the folder\nname GitHub Pages serves from, and nothing was serving it. Live references were updated\n(tooling, skills, agent definitions, `CLAUDE.md`, `README.md`, `main_dag.md`, the process\ndocuments); `journal.md`, the earlier decision records and the critiques were not, because\nthey record what was true when written. One trap in the sweep: `build_dag_site.py` contains\n`\\docsvlist`, a LaTeX macro, so the replacement had to key on `docs/` with the slash rather\nthan on the four letters.\n\n`thoughts.md` rewritten around the settled decision, in plain language, for a reader with no\nbackground in version control — the PDF analogy carries almost all of it. Decision records\n0008–0010 added to `process/decisions/README.md`, which had gone two records stale.\n\n\n## 2026-08-04 — the operations, split into commands and readouts\n\nThe flat-schema version became [`operations_v1.md`](operations_v1.html) and the rewrite kept\nthe canonical name, [`operations.md`](../operations.html) — the superseded version takes the\nsuffix, so every inbound link keeps resolving and the next rewrite will not break them\neither. v1 is unchanged apart from a banner; the link in the entry above was repointed at\nit, because the file it described is the file that moved. Four things changed in the\nrewrite, and the last two are the ones that were not visible before.\n\n**The types are written dependently.** $\\mathsf{Draft}(v)$, $\\mathsf{Crit}(v,n)$,\n$\\mathsf{Stmt}(v)$ rather than a flat list with a prose column of cardinality rules. \"At most\none draft per node\" becomes the statement that $\\mathsf{Draft}(v)$ is a subsingleton, and the\npath is then literally the telescope: `nodes/Q1-L1/critiques/r5.md` *is* the term of type\n$\\mathsf{Crit}(\\text{Q1-L1},5)$. The schema and the directory tree turn out to be the base and\nthe total space of one discrete fibration, so the question of which of the two is the real\nformalism does not arise.\n\n**The schema is graded, so \"no command writes upward\" is a law.** Questions at degree 0, nodes\nat 1, drafts and critiques and examples at 2; every containment map strictly decreases degree.\nA command may create only strictly below its input and may update only its input's own fields.\nThis is the type-level form of \"only the orchestrator changes the record of what is true\", and\nit pays off immediately in the missing-operations table: branching a new question off a lemma\nis missing *because* it is the one operation that would have to write upward, and the work is\nnot writing the command but deciding what the edge is — a relation on\n$\\mathsf{Ques}\\times\\mathsf{Node}$, not a containment.\n\n**The tree is the carrier, not the structure.** The proposal that prompted the rewrite was to\ntake a file as a node and a directory as a tree, and read `/decompose` as a morphism of trees.\nRecorded as a boxed remark, with the reason it does not carry: `/prove` and `/check` also\ninject subtrees, so tree morphisms assign all three commands the same type. Worse, the\ndirectory tree is the wrong tree — `blueprint/nodes/` is flat, so `Q1-L2-L1` is a *sibling* of\n`Q1-L2` on disk and a child of it only in the DAG. The hierarchy that matters lives in the\nidentifier, deliberately, so that decomposing a node does not move it and break every link\nwritten before that day.\n\n**Commands and readouts are separated.** v1 listed `/research-status` and `build_dag_site.py`\nin one table with `/prove`. They are not the same kind of thing: a readout is a map out of the\nstate whose value the state does not depend on, and the test is deletion — delete a critique\nand evidence is gone, delete `blueprint_site/` and one command restores it byte-for-byte. The\ngates move into that section too, since a gate is a readout and it is the orchestrator's\n*write* of its value that makes `/prove` a command. Two laws came out of it: L13, every readout\nis a function of $I_t$ alone — which is exactly what `--check` tests when it regenerates every\npage in memory and compares — and the observation that the pipeline's non-determinism is\nconfined to the commands, so its trustworthiness reduces to a question about readouts alone.\n`/research-status` is the honest exception, its tallies derived and its suggested next action\nmodel output, which is why the suggestion is printed and never written into a node.\n\nBoxed remarks are new. They are GitHub alert blockquotes (`> [!NOTE]`), so the same remark is a\ntinted box on GitHub and a tinted box on the site. The shared renderer had to learn two things\nfor it: a blockquote now renders its contents as blocks rather than flattening them into one\nline, so a remark can hold display math and a table, and the display-math stash strips the\nquote marker before KaTeX sees it. `check_render.py` strips it too, in `strip()`, which leaves\nline numbers intact.\n\n\n## 2026-08-04 — a test suite, and what it found\n\n`tests/` added: a zero-dependency runner and four modules, 66 tests. The gap it fills is not\nrendering and not DAG consistency — both already had a gate — but *rules that were written\ndown and then trusted*. Most of `CLAUDE.md` was in that state, and a rule nothing checks is a\nrule that is true until the first time it is not.\n\nThe suite is layout-agnostic about write-ups (`proof.md` or `<id>.tex`) so that it survives\nthe migration it was written during, and every test names the rule it enforces and the failure\nit prevents. Three design points worth keeping:\n\n- **`test_L1` walks git history.** A frozen statement may change only in a commit whose\n  message says it is changing one. Absolute freezing would forbid the ratified notation\n  migration this repo has already run; the testable form is *disclosed, or forbidden*. It\n  found the one real instance — `e92eb87`, a `prove` commit that finished the migration\n  `31ca6b7` began — and that commit discloses it in its body, so it passes.\n- **One test breaks the repo on purpose.** A gate that never fails is not a gate, so\n  `test_check_flags_a_broken_blueprint` injects a dangling dependency edge, confirms `--check`\n  reports it by name, and restores the file, comparing `--check`'s output against a baseline\n  rather than an exit code so an unrelated problem is not misreported as damage.\n- **A skip is not a pass.** Skips are counted and named separately, so a suite that is quietly\n  checking nothing does not look green. `Skip` lives in `repo.py`, not the runner: the runner\n  executes as `__main__`, so a class defined there is a *different* class from the one a test\n  imports, and every skip was being reported as a failure until it moved.\n\nWhat the sweep found, beyond the tests themselves. `blueprint/nodes/_latexmkrc` — the template\nevery new node was copied from — routed its build to `build/` while all seven deployed copies\nrouted to `build/nodes/`, which is exactly the shadowing the root `.latexmkrc` comment says\ncaused a biber failure on a stale `.bcf`; four sub-lemma directories had no `.latexmkrc` at\nall. Both are moot now that write-ups are markdown, and the test that would have caught them\nskips itself when no `.tex` remains. `notes.tex` was still tracked though `CLAUDE.md` records\nit as removed. The appendix schema enumerated five roles where nine were in use, and said\n\"§1–§8\" of nine sections. A count in `problem_generation_pipeline.md` had gone stale, and the\ngenerated-page count was dropped from the checked set rather than fixed — it moves on every\ncontent change, so quoting it exactly is a claim not worth gating on.\n\nTwo findings with no fix yet. The generator does not delete a page whose source is gone: a\n`writeup.html` left over from the LaTeX era kept failing the render gate until the tree was\nremoved and rebuilt, and `--check`'s staleness test does not look for orphans. And\n`check_render.py` now skips files whose name begins with `_`, because a template's relative\nlinks are written to resolve from the directory it is copied into, one level deeper, so\nchecking them where the template sits always reports a break that is not there.\n\n---\n\n## 2026-08-04 — write-ups become markdown, and examples become their own command\n\nThree changes, all of them subtractions from the number of kinds of thing in the tree.\n\n*The last LaTeX in the reasoning tree.* Every artifact under `blueprint/` was markdown\nexcept the write-up, which was `<id>.tex` and was the only thing there that compiled. That\nexception carried a `.latexmkrc` in every node directory, a second output directory\n`build/nodes/`, a compile gate run twice per round, a page gate shelling out to `pdfinfo`,\na 120-line TeX-to-HTML converter in the site generator, and a macro harvester expanding\n`\\docsvlist` loops out of `preamble.tex` so those pages could render `\\cD`. All of it is\ngone. A write-up is `blueprint/nodes/<id>/proof.md`.\n\nThe argument that decided it was not the machinery. It was that the guardrail *objects are\nlinked, never named* had an exception exactly where it mattered most: a `.tex` draft wrote\n`\\texttt{def:generation}`, a bare label, and the generator turned it into a link on the\nrendered page only. The source of the most load-bearing document in the tree was the one\nplace the closed world was named rather than linked. Now the `uses` line is a row of links a\nreferee clicks. See [ADR 0011](../decisions/0011-write-ups-in-markdown.html).\n\nOne page became **900 words**, calibrated rather than guessed: Q1-L1, five steps of category\ntheory and the densest write-up the pipeline has produced, is 713. The number lives in\n`blueprint/nodes/_template.md` and both gates read it from there. Q1-L1's write-up was\nmigrated by hand — every house macro expanded, every `\\texttt{label}` turned into a link,\nthe mathematics unchanged and the `r1`–`r5` critiques still about it.\n\n*The gate that has to run earlier now.* LaTeX fails loudly; markdown does not. What would\nhave been a compile error is now a fragment that renders as literal text and looks like\nprose. So `check_render.py` runs inside every `/prove` round rather than once at the end,\nwhere the prover can still be sent back. This is the one place the change made the pipeline\nstrictly more fragile, and it is why the gate moved rather than being dropped.\n\n*Examples leave the checker.* `/check` had two jobs since [ADR\n0006](../decisions/0006-examples-from-the-literature.html) — reformat prose, and research the\nliterature — which is two maps sharing a name, and meant every presentation pass carried a\n`WebSearch` grant it did not need. Finding examples is now `/examples`, with an\n**example-finder** agent and the citation gate that moved with it. It gained an ordering the\nchecker never had: simplest first, degenerate case before classical case before published\ncomputation, each entry discharging the hypotheses one at a time instead of asserting that\nsomething is an instance. `examples.md` still justifies nothing — it is evidence for\n*believing* a statement, and in the schema an empty hom-set.\n\n*A references directory.* `papers/` gains `guideline.md`: what is here, a reading list ranked\nfrom the manuscript's citation counts and the appendix's black boxes, and the rule that being\nin `papers/` is not being citable. `blueprint/literature/`, which held reading notes and was\nempty, folded into it. The prover and the example-finder append to the reading list when a\nsource turned out to matter; nobody rewrites an entry.\n\nWriting that file surfaced four bib keys cited in the sources with no entry in `refs.bib` —\n`HTT`, `SV17`, `cohn2016differentialgradedcategoriesklinear`,\n`gaitsgory-semiinfinite-intersection-coh` — the last of which is cited from\n`blueprint/appendix.md`, which makes it a live violation of the rule that the blueprint cites\nonly keys that exist. `SV17.pdf` is sitting in `papers/` with nothing to point at. Recorded,\nnot fixed: `refs.bib` and the manuscript are human territory.\n\n## 2026-08-04 — a sub-lemma's directory moves inside its parent's\n\n`/decompose Q1-L2` used to write `blueprint/nodes/Q1-L2-L1/` as a sibling of\n`blueprint/nodes/Q1-L2/`. The id said the node refined `Q1-L2`; the tree said it sat\nbeside it. Now the id *is* the path — split at each `-L`, take the successive prefixes,\njoin with `/` — so the children are written where they belong ([ADR\n0012](../decisions/0012-sub-lemmas-nest-in-their-parent.html), [I12](../pipeline.html#4-invariants)).\n\nThe argument the flat layout was chosen on is recorded in `operations.md`: nesting *\"would\nchange a node's path on the day it was decomposed, breaking every link written before that\nday.\"* Stating it precisely is what dissolved it. A decomposition only ever creates\ndirectories, always beneath a node that already exists; the parent does not move when it\ngains children. `Q1-L2` was at `blueprint/nodes/Q1-L2/` before this change and is there\nafter it. Going forward, nesting is exactly as link-stable as flatness. What cost something\nwas applying the layout retroactively, which is a different operation: four directories\nmoved, and 62 `used by` links in the appendix, four breadcrumbs, four sets of object links\nand the parent's own `depends-on` had to be repaired. They were rewritten by the rule\nrather than by hand, so the script stays correct for the next node decomposed.\n\nThe order mattered more than any individual edit. Every reader was made depth-agnostic\n*first*, while the tree was still flat — `node_dirs()` recurses, `Site.split_node` replaces\na one-segment regex with a longest-prefix match, `index_block` and the appendix rewrite\nboth go through `id_path`. Only then did the directories move, so the only thing that could\nbreak at that point was a link, which is exactly what the gate names by file and line.\n\nThree things this turned up.\n\n*A gate must not assume the rule it is checking.* The first version of the position check\nread each node file from where the id said it should be, so a misplaced node killed the\nchecker with `FileNotFoundError` instead of producing the diagnosis it existed to produce.\nReaders now take the directory from the parsed record — where the file actually is — and\nthe id is compared against it separately. Same shape as the `main_dag.md` schema comment\nthat terminated itself early: a check over a convention, defeated by the convention.\n\n*Nesting created a write hazard flatness did not have.* A parent's directory now contains\nits children's, so \"write only inside your node's directory\" stopped meaning \"write only\nyour node's files\" — the prover for `Q1-L2` could legally have clobbered `Q1-L2-L1`'s\nwrite-up, and the critic for `Q1-L2` a round of its child's append-only critique trail.\nBoth boundaries now say **directly** inside, and say that a path with a further node id in\nit belongs to another node.\n\n*A hardcoded depth in a test fails open.* `test_every_node_object_link_resolves_into_the_appendix`\nmatched `\\(\\.\\./\\.\\./appendix\\.md#…\\)` literally, so once sub-lemmas needed `../../../` it\nstopped checking them — silently, while still passing. The new `test_layout.py` resolves\nevery relative link out of every node file instead, which is the check that actually\ncatches a link copied from a node at another depth. Verified by breaking it: moving a\nchild back out fails three layout tests and `--check` names the node.\n\nThe site was deliberately left flat. `blueprint_site/nodes/<id>/` keeps the bare id at any\nsource depth, so a node's URL does not move when its parent is decomposed; the hierarchy\nwas already carried there by the per-scope graph pages. The URL set is byte-identical\nacross the change.\n\n\n## 2026-08-04 — prove(Q1-L2-L4): proved in one round\n\nFirst run of the `/prove` loop entirely under the markdown regime, and the node directories\nmoved mid-run — the sub-lemmas were nested under their parent between the DAG gate and the\nprover's first write, so the prover found `nodes/Q1-L2/Q1-L2-L4/` where its packet said\n`nodes/Q1-L2-L4/`. It adapted, and the loop held: r1 PASS, no FATAL or MAJOR, four MINORs,\nof which three (ambient subscripts in Step 4, the flow tree's edge structure, a dualization\nflagged at the point of use) were applied as post-verdict presentation polish and the fourth\nis not the draft's to fix.\n\nThat fourth is for the appendix maintainer, recorded in critique r1 as Flaw 4: the\n\"Equivalently\" clause of the generation entry cites Gaitsgory–Rozenblyum by \"Prop. 5.4.5\"\nwith no chapter, and GR numbers per chapter — while main.tex:553 cites \"Lem 7.2.3(4)\" for\nthe neighbouring detection proposition, so the manuscript points at two coordinates for one\ncircle of facts. The referee also recorded that the clause as printed, hypothesis-free, is\nfalse for an arbitrary collection in an arbitrary ambient; the write-up imports only\ndetection ⟹ generation for a small set of compacts in a stable cocomplete ambient, and says\nso in its Caveats. Neither observation blocks the proof; both should eventually reach the\nappendix entry.\n\nTwo write-up requirements arrived with the invocation — enumerated steps under an ASCII\nargument-flow tree, and a references section with precise coordinates — and both survived\nthe referee, who checked the tree against the actual dependencies of the steps and the\ncitations against the claims they annotate. Canonical sources outside `refs.bib` were kept\nout of the write-up and surfaced in the report instead: Schwede–Shipley, *Stable model\ncategories are categories of modules*, Lemma 2.2.1, and Neeman, *Triangulated Categories*,\nDef. 8.1.1 with Thm. 8.3.3 — candidates for `refs.bib` if the manuscript ever wants the\ntriangulated antecedents named.\n\n---\n\n## 2026-08-04 — every node gets a confidence, and it is computed rather than declared\n\nThe four stored statuses answer *what stage is this node at*. They never answered *how much\nshould I believe it*, and the two come apart badly. [Q1-L1](../../nodes/Q1/Q1-L1/index.html)\nreached `proved` on its fifth referee report, after two `FAIL`s, twenty-two flaws raised and\ndisposed of across four earlier rounds, and eight minor flaws still standing in the report\nthat passed it. A node that passed cleanly on `r1` would carry the same word. So would a\n`proved` node resting on an `open` one — a claim whose support does not exist yet, which no\nstatus field says out loud.\n\nThe request was a per-node confidence shown as a light colour, for the repository as well as\nfor each node. Two things had to be decided before any of it could be written: where the\nnumber comes from, and what it is allowed to look like.\n\n**Where it comes from.** Not a human-written field. That was the obvious design and it fails\n[I5](../pipeline.html#4-invariants): a stored confidence is a second place for the record to\ndrift, it goes stale the moment a new critique lands, and nothing could check it. So it is\nderived, like `ready` and `blocked`, from what the repository already records. The literature\non confidence in assurance cases had the shape ready-made — Goodenough, Weinstock and Klein's\neliminative argumentation, where confidence in a claim grows with the number of reasons for\ndoubting it that have been identified and eliminated, measured as a Baconian ratio of\ndefeaters eliminated to defeaters raised. The critique files turned out to already be a\ndefeater log in machine-readable form: every finding is a `**Flaw n** [FATAL|MAJOR|MINOR]`\nheading and every report closes with its verdict. Flaws in the latest round are standing;\nflaws in every earlier round were disposed of before the node reached its current verdict.\nPropagation is the weakest link, also from that literature: a claim can be no better\nsupported than its least-supported premise, so a question is its weakest node and the\nrepository is its weakest node.\n\nThe formula is deliberately simple and it says one counterintuitive thing out loud. Q1-L1,\nwhich took five rounds, scores $23/32 \\approx 0.72$; a node passing clean on its first round\nwould score $1/2$. That is the eliminative-induction answer and it is the right one —\nconfidence comes from doubts *eliminated*, and a claim nobody found anything wrong with has\nnot been probed, it has been glanced at. The smoothing term is what carries it: the $+1$ and\n$+2$ stand for the defeaters nobody has looked for yet, so an unexamined claim sits at a half\nrather than at certainty and nothing ever reaches 1. Reasoning in [ADR 0013](../decisions/0013-confidence-is-derived-baconian-and-weakest-link.html).\n\n**What it may look like.** Six ordinal bands and a tint — the node's existing status colour\nmixed into its card at ten points a band, so the strongest card on the site is at half\nstrength and the hue still says which of the five statuses it is in. No decimal is printed\nanywhere. Baconian probability is ordinal because the defeater space cannot be enumerated,\nand the Assurance 2.0 literature makes the operational version of the point: a number carried\npast the precision of its derivation suppresses the judgment it was meant to inform. A tint\nranks at a glance and refuses to be quoted, which is exactly the resolution the input carries.\n\nWhat it shows today is one tinted card. Q1-L1 sits at band 4; Q1-L2-L4, `proved` in a single\nround with four minor flaws left standing, sits at band 1 — nothing eliminated, four\noutstanding, and that reads correctly. Everything else is `open` at band 0, so both Q1 and the\nrepository are band 0, limited by Q1-L2. The scheme reports the state instead of decorating\nit, and the front page of the site now says so in one line.\n\nThree things came out of the implementation rather than the design.\n\nThe execution gate did its job on the first build: `tools/dag_smoke.js` failed every graph\npage with `d.style.setProperty is not a function`. The stub DOM had `style` as a bare object,\nand a CSS custom property can only be reached through `setProperty` — so a page correct in a\nbrowser failed in the stub. Fixed by making the stub faithful rather than permissive:\n`setProperty`, `getPropertyValue`, `removeProperty`, and an unknown method still throws.\nVerified the way §6 of `problem_generation_pipeline.md` says to — injected\n`setPropertyZ` into the built `dag.js`, confirmed the gate still fails, restored.\n\nReading the critiques for the first time made two gaps in `--check` visible, and both are now\nclosed: a node marked `proved` whose latest report ends in `VERDICT: FAIL` is an inconsistency\nand fails the run, and a round carrying no verdict line prints as a `NOTE` and does not,\nbecause a critique is append-only and is never rewritten to match a convention adopted after\nit. That advisory tier is new to this gate; the render gate had it already.\n\nThe check I first specified in the ADR — flagging a `proved` node whose latest critique parses\nto no flaws — was cut before it shipped. A genuinely clean report parses to no flaws too, so\nit would have fired on correct input, and a check that does that is worse than no check. The\nADR now records what was built instead, together with the honest limitation: a flaw raised\nagain in a later round is counted once per round it appears in, so the eliminated count is an\nupper bound on distinct defeaters. Matching flaws across reports by their prose would be\nguesswork, and the measure is ordinal, so a bound that is consistent across nodes is enough\nfor the ranking it is used for. That is the sharpest reason not to read the number as anything\nfiner than its band.\n\n---\n\n## 2026-08-04 — the portable spec gets shorter, and what would not compress\n\n`problem_generation_pipeline.md` went through `/refine-prose` and then `/no-ai-slop`. The\nconfidence work above landed in it first, as a new sub-section of §1, invariant I12, a\nfourteenth checklist step, and one more failure condition on the consistency gate row.\n\nWhat compressed. Every invariant's **Domain instantiation** paragraph was restating §7's\nworked-mapping table for the same repository at three times the length, so each became a\none-paragraph *Port:* saying only what changes when the domain does, and the handful of\nconcrete findings the table did not already carry moved into a four-item list beneath it.\nThe longest paragraph in the document went from about 250 words to under 100. A table of\ncontents went in, and two stale counts in the closing tally were corrected — one node proved\nbecame two, twelve decision records became thirteen.\n\nThe slop pass found no banned vocabulary at all, which was not the problem. The problem was\nseventy-one em dashes, several colon reveals (*\"The corollary worth spec'ing separately:\"*,\n*\"The lesson for a port:\"*, *\"The honest framing:\"*), and three lines of aphorism that\ncarried no fact — the worst being \"an exception nobody remembers is an exception at exactly\nthe moment it matters\", which says nothing the preceding clause had not.\n\nWhat did not compress, and the honest number. Net of roughly 430 words of new confidence\nmaterial, the prose is down eleven per cent; on the pre-existing material alone it is about\neighteen. That is well short of \"a lot shorter\", and the reason is structural rather than\nstylistic: the document enumerates twelve invariants, eleven gates, a fourteen-step\nchecklist and a seventeen-row mapping table, and the instruction was to keep every rule. The\nprose around those enumerations is now about as tight as it goes.\n\nOne lever is left and was deliberately not pulled. The worked mapping for\n`diffusion-transfer-risk` is roughly 1,900 words about a *different* repository, sitting in a\ndocument whose first paragraph calls itself the domain-independent form of the machine. It\nis an application of the spec, not part of it, and moving it to its own file would take a\nquarter off the length without touching a single rule. That is a change to the shape of the\ndeliverable rather than an edit to it, so it is recorded here as an option rather than made.\n\n---\n\n## 2026-08-04 — confidence gets a human channel, a literature channel, and a sign\n\n`/examples` was asked to do a second job, and doing it exposed that the confidence scheme\nhad nowhere to put the answer.\n\n**What was asked.** Two things, and they turned out to be one thing. First, that `/examples`\nshould critically evaluate whether the statement — or one entailing or contradicting it —\nhas appeared in the literature, not merely illustrate it. Second, that confidence should\nweigh a human judgement at 25, the children at 50 and a model judgement at 25, out of 100\nrather than out of five, and that a node with evidence *against* it should go red while a\nnode with no evidence at all stays empty.\n\n**Why the second forced a reversal.** [ADR 0013](../decisions/0013-confidence-is-derived-baconian-and-weakest-link.html)\nhad ruled out a stored field on I5, every fact stored once. But a human judgement is not a\nsecond copy of anything — there is no first copy to derive it from — so I5 was being read as\nforbidding storage rather than forbidding duplication. The resolution in\n[ADR 0014](../decisions/0014-confidence-is-three-signed-channels.html) stores only the inputs\nthat cannot be derived (`human:` in the node file, `EVIDENCE:` parsed out of `examples.md`\nthe way flaws are already parsed out of critiques) and leaves the aggregate derived. There\nis still no `confidence:` field.\n\n**The change that mattered was the sign, not the weights.** Under 0013 every value lay in\n$[0,1]$, so *nobody has looked* and *there is a published counterexample* both drew an empty\ncard. That is the more valuable of the two signals rendered as the absence of a signal. The\nsigned range is what makes a channel able to stay silent — contributing nothing, without its\nweight being renormalized away — while a different channel says something negative and drags\nthe node below zero. Every other property the request asked for falls out of it: red for\nevidence against, empty for no evidence, and `min` over the dependencies' *full* confidence\nso a refuted sub-lemma poisons what rests on it.\n\n**The 80% cap is the only place the pipeline says what it is.** Three weights summing to one\nmeans the two machine channels alone reach 0.75, and an author's `endorsed` would carry a\nnode to 0.875. The cap holds it at 0.80 until the user writes `human: approved`. Nothing here\nis fully believed because a language model refereed it, and `human:` is now the one field in\nthe repository that no agent writes — not even the `/prove` orchestrator, which owns every\nother status-like field.\n\n**Two pre-existing defects surfaced on the way, both from the id-is-its-path migration and\nneither related to confidence.** The generator wrote node pages at the flat\n`blueprint_site/nodes/<id>/` while `payload()`, `graph_of()` and its own header docstring\naddressed them at the nested `nodes/<id-path>/`; and it wrote the write-up as `writeup.html`\nwhile the relinker and the page list both pointed at `proof.html`. Eighty-five broken links\nin the generated site, invisible to `--check` because that gate compares generated pages\nwith regenerated ones and both were equally wrong. The render gate caught it, which is the\nargument for having a gate that reads the output rather than the process that made it.\n\n**The lesson worth keeping.** A scoring scheme with no negative range cannot represent its\nown most valuable finding. `/examples` was documented from the start as having a falsity\nreferral as its best outcome, and for two ADRs that outcome had no effect on anything the\nreader could see.\n\n## 2026-08-04 — the site mirrors the source tree (ADR 0016)\n\nThe generated site kept the flat `nodes/<bare-id>/` layout after 0012 nested the source,\nand `proof.md` still rendered as `writeup.html`, a name 0011 had retired at the source.\nBoth mismatches went in one refactor: `blueprint_site/nodes/` now takes the same directory\nchains as `blueprint/nodes/`, every rendered file keeps its source name (`node.md` as the\ndirectory's `index.html`), and the critiques index groups a report by the segment before\n`critiques/` instead of a fixed offset that nesting had silently turned into \"the top\nancestor\". `tests/test_layout.py`'s flatness test became a mirror test. ADR 0016 records\nthe decision and answers 0012's URL-stability defence of flatness: under id-is-the-path a\nchain is a function of the id, so a mirrored URL is exactly as stable as a flat one.\n\nTwo things the run taught. First, a live tree edits back: this session's changes raced a\nconcurrent editing stream in the same file, which twice restored regions to an older\nstate — including one window where `Site.url` already linked `proof.html` while the page\nwriter still emitted `writeup.html`, a state in which every write-up link on the site\ndangles. The race resolved by re-reading the file before every mutation, applying the\nremainder as a single atomic in-place rewrite that asserts each anchor occurs exactly\nonce, and rebuilding immediately; `check_render.py`'s link check is what would have caught\nthe half-state, which is an argument for running it after any generator change, not only\nat the ends of pipeline runs. Second, the gates were indifferent to the layout — both\nsmoke tests walk recursively, and the link check resolves from the page that carries the\nlink — so the only code that ever cared about flatness was the translation layer that\nmaintained it.\n\nNoted in passing, not fixed here: `Site.url` drops a `#fragment` on node-page links\n(`node.md#remark` renders as a link to `index.html`, losing the anchor). Pre-existing,\nsmall, and worth a line in the next generator pass.\n\n## 2026-08-04 — a node states what it is (ADR 0015)\n\nQ1-L7 — the group case, a check nothing depends on — was indistinguishable on paper from\nan unproved chain lemma: \"Proved 2/11\" counted it as an obligation, and the weakest-link\nminimum let its untouched record pin Q1 at 0% however much of the actual argument was\nproved. The user asked that every node state its kind. `node.md` now carries a required\n`role: proof | evidence | example | thought`; Q1-L7 is the one `evidence` node and the\nother ten are `proof`. The generator shows the role on every surface (index bullet, graph\ncard, node page), tallies corroboration apart (`· evidence 0/1`), takes every aggregate —\nquestion tally, question confidence, repository confidence — over the proof chain alone,\nand `--check` now rejects an unknown role, a proof node resting on a non-proof node, and\na `proved` thought. `/prove` refuses a thought node at its gate; `/decompose` sets the\nfield at creation. ADR 0015 records the decision; I14 is the invariant.\n## 2026-08-04 — the operators get eyes on the papers (ADR 0017)\n\n`papers/` filled up today — seven PDFs fetched to join the original three, every publicly\navailable source in the guideline, each named by its `refs.bib` key — and the user asked\nthat the operators actually use them. Until now only the example-finder was pointed at\n`papers/` at all, and only at the guideline, not the PDFs beside it: the prover checked\nhypotheses \"as cited\" against memory, the critic checked the prover against the same\nmemory, and the lead-researcher transcribed appendix entries from recollection — the one\ntranscription no downstream gate can catch, since the critic checks the draft against the\nentry, never the entry against the paper. All four operator definitions, the three\nlaunching skills and `CLAUDE.md` now carry the same pointer: a source on disk is read\nfrom disk (Read, with the `pages` parameter), before memory and before the web — and\nreading widens nothing, because the closed world is exactly what it was.\n[ADR 0017](../decisions/0017-operators-read-the-local-library.html) records it.\n\nTwo names checked and deliberately left alone on the way: `BZSV.pdf` and `SV17.pdf`\nalready follow the name-is-the-bib-key rule — `BZSV` is a real key, and `SV17` is the key\n`main.tex` cites whose missing `refs.bib` entry is the recorded gap. Fixed in passing:\n`/decompose` still passed `--fast` to `check_render.py`, a flag that no longer exists.\n\n---\n\n## 2026-08-04 — the first run of the extended /examples finds a false hypothesis, not a missing example\n\n`/examples Q1-L5` was the first invocation of the two-purpose command, and the precedent half\npaid for itself immediately: what it returned was not an illustration but a defect in a\ndependency.\n\n**The finding.** [Q1-L4](../../nodes/Q1/Q1-L4/index.html)(iv) — that\n$\\{\\mu \\mid LX_\\mu\\subseteq\\overline{LX}_\\lambda\\}$ is finite — is false for\n$X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$, which is the appendix's own catalogued\ncase `exam:hyperspherical_duality`(2), the one where the unramified conjecture is a theorem\nrather than a hypothesis. Already at $n=1$: $X=\\mathbb{A}^1$, $G=\\mathbb{G}_m^2$,\n$K=O^\\times\\times O^\\times$ acting by $x\\mapsto ab^{-1}x$, orbits $t^mO^\\times$ and $\\{0\\}$;\n$O\\cong\\mathbb{A}^\\infty$ is irreducible and $O^\\times$ is open dense in it, so\n$\\overline{LX}_0=O$ contains $t^mO^\\times$ for every $m\\ge0$. The orchestrator verified this\nindependently rather than taking the agent's word for it, which is what §3 of the skill is\nfor.\n\n**Why it lands on Q1-L5.** (iv) is exactly the finiteness the dévissage consumes: the\ninduction inside a single $\\overline{LX}_\\lambda$ that (2) $\\Rightarrow$ (1) would run. So a\nnode's own statement can be fine while the premise its proof would inherit is not, and no\ngate in the pipeline was looking at that — the DAG gate checks a dependency's *status*, never\nits *content*.\n\n**A second defect, upstream of both.** `thm:chen_Ti` records its hypothesis as \"$X$ smooth\naffine spherical\". The paper (arXiv:2310.20006) is titled *Singularities of orbit closures in\nloop spaces of **symmetric** varieties*, and its standing setting is $X=G/K$ for\n$K=G^\\theta$. The abstract's \"results for singularities of spherical orbit closures\" does not\nclose the gap: *spherical* there contrasts the $L^+G$-orbits with the Iwahori orbits on a\nsymmetric $X$. `assum:intro`'s note leans on the over-recorded hypothesis to say (a) \"is not\nan extra restriction in that generality\" — so the error has already propagated one hop. The\ncited \"Thm 36\" was also not located in v3 or v4 (the closure theorem is Thm 17 in v3, Thm 18\nin v4), so the result number needs checking against whichever version it was taken from.\n\n**What the machinery did with it.** `EVIDENCE: gap` took Q1-L5 from 0% to **−12%** and turned\nits card red on the first build after the commit. Under\n[ADR 0013](../decisions/0013-confidence-is-derived-baconian-and-weakest-link.html) this run would\nhave been invisible: an `open` node scores 0 before the search and 0 after it, and the most\nvaluable thing the pipeline can produce would have left no trace outside a file nothing reads.\nThat is the case ADR 0014 was written for, and it arrived on the same day.\n\n**The gate caught a malformed verdict, which is the other thing worth recording.** The agent's\nfirst `EVIDENCE:` line was a sentence of prose rather than one of the five values. Rejected\nunder §3b and sent back rather than
