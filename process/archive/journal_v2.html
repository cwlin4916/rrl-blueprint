cope of an \"Assume\" over a numbered list** — the render gate checks that each hypothesis is its own paragraph with one label, which this child satisfies exactly. `/decompose` writes conditionals and metatextual disclaimers into the same \"Then:\" list, and the grammar of that list is unchecked.\n\nTwo smaller things. r1's Flaw 8 — two spellings of the same link target in one file — came back verbatim in a fresh write-up of the same node, having been located and given its fix a run earlier; a critique is read for its verdict and its FATALs, and its MINORs evaporate when the file is rewritten from scratch. And a concurrent session added a whole new question `Q3` to `main_dag.md` during this run, so the commit had to be filtered to the two generated index hunks that were this run's; the third time concurrency has shaped a commit, and the first where the shared file was the *generated* readout rather than a source.\n\nThe `/examples` run on the same node then produced the finding the prove run could not: **hypothesis (D) is satisfied only where the closure order is trivial**. Take the $*$-extension $\\overline{i}_{\\lambda*}j_{\\lambda*}\\omega$ at a stratum with non-empty boundary; the recollement identity $i^!j_*=0$ collapses its stratum support to $\\{\\lambda\\}$, and (D) then forces $j_!\\omega\\simeq j_*\\omega$, which is cleanness. So a node can pass its referee, close inside its declared world, and be about almost nothing — and *nothing in the pipeline would have said so*, because every gate this repository has asks whether the argument is sound and none asks whether the hypotheses are ever jointly met. The `EVIDENCE:` verdict is the only mechanism that registers it, and it registers it as a number rather than as a sentence. Worth noting that `/check-goal` is the cheap check that would also have caught it and is documented as belonging *before* `/prove`; this run reached it from the literature side instead.\n\nThe negative half of the precedent search was the more useful half, again. **No source assumes anything like (D)** — every stratification argument located inducts on the number of strata in a *closed* set, where the third term is allowed to acquire new strata, which is exactly what (D) forbids. And two of the seven pieces the digest was checked against are untouched by anything in print: the $!$-costalk support notion, and finite stratum support for coherent objects. A hypothesis nobody in the literature needs is either new or wrong, and that is a question a proof cannot answer about itself.\n\nOne process note. The digest arrived written entirely in a numbering — \"matches pieces **1**, **5**, **7**\" — that existed only in the packet the orchestrator sent, so the file's `What it matches.` fields, the whole point of [ADR 0036](../decisions/0036-an-example-says-what-it-matches.html), were unresolvable to any reader opening it. The presentation checker found it and correctly refused to fix it, since supplying the key means writing content. The packet should carry the instruction to *reproduce* the yardstick in the file, not merely to use it.\n\n## 2026-08-06 — a container is a directory, and a cap becomes two numbers\n\nTwo layout rules and one gate rule, all user-directed, all mechanical, and one of them wrong in a way worth recording.\n\n**The top layer was the one layer nesting never reached.** [ADR 0012](../decisions/0012-sub-lemmas-nest-in-their-parent.html) made a node's id its path, so a sub-lemma sits inside the lemma it refines — and that handles every layer except the first, because a question is not a node and never had a directory. `ls blueprint/nodes/` returned thirty-seven siblings in string order, interleaving `Q1-L6`, `Q1-a1` and `Q1-e1` and then running into `Q2-L1` with no break. The haystack that 0012 was written against had simply reappeared one level up, where 0012 could not see it. [ADR 0059](../decisions/0059-a-container-is-a-directory.html) gives the question a directory too, and gives an appendix entry its section's directory for the same reason.\n\n**The migration method is the part worth keeping.** 505 files moved and 517 had links rewritten, and the only safe way to do that is to resolve each link against its **old** location, map it through the move table, and re-emit it relative to its **new** one. Adjusting `../` counts by regex is the obvious approach and it silently mangles every link that did not need changing — the sideways ones, within a subtree, which stay correct only if nothing touches them. Resolving and re-emitting handles the depth change and the target change in one step and cannot tell them apart, which is exactly what you want.\n\n**What the migration broke, and how it broke, is the finding.** Four code paths assumed an appendix anchor sat directly under `appendix/`. Three failed loudly and were fixed in minutes. The fourth was `re.findall(r\"appendix/([\\w-]+)\\.md\", text)`, which decides whether a node mentions an entry: it captured the *section directory* as the anchor, matched nothing, and reported every entry in the repository as cited by nobody. It did not crash and it did not fail — it ran, and measured the wrong thing. That is the shape to expect from a path migration, and it is the reason the `--check` output has to be read rather than merely exited-on.\n\n**A cap that everything is pressed against is not a cap.** The 900-word write-up budget was calibrated when `Q1-L1` at 713 words was the densest proof the pipeline had produced, and the comment above the constant said so in as many words: \"a real ceiling with room above the worst case rather than a number that will fire on the next proof.\" Measuring all twenty-seven write-ups showed that had quietly stopped being true — **seventeen sat between 866 and 900 words, two at exactly 900**, then a clean gap down to 789. That is not a distribution under a ceiling, it is a distribution against one, and it costs the number its whole job: [ADR 0043](../decisions/0043-a-proof-step-is-one-claim.html) wants the cap to be a *split signal*, and a signal everything triggers distinguishes nothing.\n\n[ADR 0060](../decisions/0060-a-write-up-has-two-budgets.html) splits it in two — a hard cap at 1500, a split signal at 1000 that fails nothing — and the reason it is two numbers rather than one larger number is that raising a lone cap re-runs the same experiment three hundred words later. The signal's note names both remedies, and names them in order, because they are not equally good: `/decompose` helps the node you split, while moving what a write-up *restates* into an appendix entry shortens every other write-up that was restating the same object. The compounding one is the one that has to be said out loud, because the local one is the one that occurs to you first.\n\n**A pre-existing defect the cleanup happened to find.** `process/pipeline.md` carries five `<a id=\"i…\"></a>` anchors and the generated `pipeline.html` carried none: the client-side renderer had no rule for a standalone anchor line, so it escaped them into visible text. Every `#i<n>` deep link in the repository had been landing nowhere, on a page that still looked right. The gate could not see it either, because its anchor sweep read `id=\"…\"` out of the markup and these live inside the JSON string the page mounts, where the quotes are escaped. Both halves are fixed. The lesson is [the one already in this file](#what-this-cost-us-to-learn): a check that cannot fail on the bug you shipped is not a check, and here the check and the renderer shared the same blind spot, which is how it survived.\n\n**One thing this run did not fix.** `Q1-L3-L2`'s write-up is 1818 words and fails even the raised cap. It is `failing` on its mathematics already and needs a `/decompose`, which is not something a layout migration gets to invent.\n\n## 2026-08-06 — a third axis, and what looking for it turned up\n\n**The question was about the mathematics and the answer was about the machinery.** The ask was whether the nodes under `Q1-L6` and `Q1-L3` are formal consequences of stratified spaces. Reading them says: mostly, but the partition does not fall where the question put it. Thirteen of Q1's thirty-four nodes have no $X$, no $G$, no $LX$ and no Hecke action anywhere in their statements, and they split along **two** independent axes rather than one — compact generation in a stable category (`Q1-L2`'s four children, `Q1-L3-L3`), which has no space in it at all, and recollement on a locally finite stratification (`Q1-L5-L1/L2/L5`, `Q1-L6`, `Q1-L3-L5`), which does. The two meet only at the top, in Q1 itself.\n\n**The residue is the finding.** What is left over after both abstractions is not stratified-space theory and never was: it is renormalized sheaf theory on an infinite-dimensional ind-scheme. All three `failing` nodes of Q1 sit there — `Q1-L3-L2` on the two readings of $\\mathcal{D}_c$ on an ind-scheme, `Q1-L5-L3` on coherence under costalk restriction, `Q1-L4-L1-L3` on local closedness in infinite dimensions — and so does the hardest open one, `Q1-L5-L6`, on `Ind` against a limit. Stratification is the part the pipeline has already essentially done. What is unproved is that $LX$ **behaves like a stratified space at all**, which reframes the standing class: it is whatever satisfies the checklist, and `def:polarized_hyperspherical` is only known to satisfy part of it.\n\n**The graph could not record any of that, and the reason is worth keeping.** The only relation on offer was `depends-on`, and it is wrong twice. The general statement is not a prerequisite of the special one — `Q1-L2` is already `proved` by a route that does not pass through it — and under [I13](../pipeline.html#4-invariants) the edge would have capped a proved node's confidence at the new node's, so recording *this is an instance of that* would have driven a number down for stating a fact about the node's own generality. [ADR 0061](../decisions/0061-the-z-axis-is-abstraction-level.html) gives it its own edge, `instances:`, stored once on the general node and never followed by the confidence derivation, so nothing that already existed moved.\n\n**Off by default is the whole design.** At rest a level node is *absent* — not dimmed, not folded behind a chip — so the flat graph is byte-for-byte what it always was and an axis a reader never asks for cannot clutter the one they came for. That is also what made the change safe: the smoke test asserts the flat edge count is restored exactly after a tilt and back, which is a much stronger property than \"the new thing works\".\n\n**2.5D, not 3D, and not by taste.** Full 3D node-link drawings on a flat screen pay for depth in occlusion and rotated text, the two things that make a graph unreadable. The settled remedy — Hong, Nikolov and Tarassov, *A 2.5D hierarchical drawing of directed graphs* (JGAA 11(2), 2007) — is to draw each subgraph in its own 2D plane and stack only the planes, and to measure a drawing by the crossings visible from two orthogonal angles. Bach *et al.*'s generalized space-time cube (CGF 2016) supplies the rest: of the operations on a stack of planes, the two that stay readable are flattening and juxtaposition, which is exactly the tilt at 0 and the tilt at the preset, and why there is one degree of freedom on the button.\n\n**A stub without `remove()` turned a working page into a mount error.** `tools/dag_smoke.js` models the DOM well enough to run the graph engine, and the new code drops a control a page has no use for. The stub had `removeChild` and no `remove`, so 106 pages failed on a method the real DOM has had forever. It also had no `requestAnimationFrame`, which would have let the tilt be tested by its click rather than by its result — the clock now jumps a whole tween per frame so the assertions see the finished state. Both are the same lesson this file already carries about the anchor sweep: a harness that cannot see the thing you shipped is not a gate.\n\n**Still not fixed.** `Q1-L3-L2`'s write-up is 1818 words against the 1500-word cap and fails the gate, exactly as it did before this run. It is `failing` on its mathematics and wants a `/decompose`.\n\n## 2026-08-06 — the second axis gets nodes, and a half-deletion gets caught\n\n**The axis existed and was empty on the side the question had actually been about.** The previous phase found two abstraction axes and built the machinery for both, then put both of its test-bed nodes — `Q1-L2-z1`, `Q1-L2-L3-z1` — on the compact-generation side. The question that started it was about `Q1-L6` and `Q1-L3`, which are on the *other* side. So the axis that got drawn was the one the reader had not asked about, and the gap survived because the machinery was what the phase was measured on. `Q1-L5-z1` and `Q1-L6-z1` close it: the dévissage package, and the clean-costalk criterion that feeds it.\n\n**Abstracting `Q1-L5` found the abstraction already written inside `Q1-L5`.** Its statement carries a \"Moreover\" paragraph accounting for which hypothesis each direction consumes — the forward one needs only continuity and the section $i_\\lambda^!\\,i_{\\lambda!}\\simeq\\mathrm{id}$, and what the backward one needs of **(H2)** and **(H3)** is joint conservativity, which they *supply*. `Q1-L5-z1` is that paragraph with the geometry deleted, which is why it cost no new mathematics. The lesson generalizes past this node: **a hypothesis-accounting remark is a level-1 statement that has not been given a directory yet**, and the pipeline has no operator that looks for them.\n\n**The abstraction is weaker than the word the question used.** \"Formal consequence of stratified spaces\" is what was asked, and `Q1-L5-L1`/`L2` turn out not to need a stratification, a topology or a closure order — only a family of continuous functors with fully faithful continuous left adjoints, plus joint conservativity for one direction. A stratification is one *supplier* of that data. Naming the weaker hypothesis is what makes the residue legible: `Q1-L5-L3` and `Q1-L5-L4` are not \"more stratified-space theory\", they are the obligation to produce the family at all, and `Q1-L5-L3` is `failing`.\n\n**`Q1-L6-z1` named a hypothesis `Q1-L6` had been carrying silently.** At level 0, a clean costalk gives stratumwise generation only because $\\omega$ generates the category of a stratum — true because a stratum is $BK_\\lambda$ with reductive finite-type quotient, which is `Q1-L4`, reached through a `depends-on` and stated nowhere as the thing cleanliness is being combined with. Abstracting forced it out as hypothesis **(B)**, standing alone and mentioning neither the ambient category nor the generators. That is the return the abstraction layer is being tested for, and it is not compression: **an implicit reliance became a check an instance either passes or fails.**\n\n**What the axis does not reach, stated once so it is not rediscovered.** `Q1-L6-L1` — per-closure finiteness of orbits for symmetric $X$, citing Chen–Yi — is not a consequence of anything on this axis. It is the *hypothesis the axis needs*, and verifying it is hard geometry. Every abstraction here splits its subtree the same way: a formal implication, plus a check that our $X$ qualifies. The checks are where the failures already are, so the axis buys reuse and not progress on the hard part, and saying so up front is cheaper than finding out at `/prove` time.\n\n**A half-deletion, and the shape that makes it detectable.** The previous phase's three canonical files — both `_node.md`, both `_history.md`, and [ADR 0061](../decisions/0061-the-z-axis-is-abstraction-level.html) — were removed from disk six minutes after being committed, while their generated prompts, their appendix back-references and all of the site code were left in place. A concurrent session then ran a full build against that state, which regenerated `main_dag.md`'s index block without the two nodes and deleted their site pages, so the tally moved from 36 to 34 and nothing announced it. `--check` caught it anyway, and caught it *because the record is stored twice on purpose*: an appendix entry's `used by` naming a node whose file is gone is exactly the ten `INCONSISTENT` lines it printed. The bidirectional edge that looks redundant is the one that survives a partial delete — and a clean `git revert` would have produced no signal at all.\n\n**Not fixed, third phase running.** `Q1-L3-L2`'s write-up is 1824 words against the 1500-word cap and fails the gate, untouched here as in the two phases before. It is `failing` on its mathematics and wants a `/decompose`.\n\n**One defect found and not fixed, because it is not this run's to fix.** The phrase *standing class* appears nine times in `blueprint/main_dag.md` — in Q1's Setting, in three Problem statements, in two Conjectures — and is linked to `def:polarized_hyperspherical` zero times. The definition exists and is precise; the term naming it is unbound everywhere it is used, which is why it reads as undefined to anyone who has not already found the appendix entry. Question framing is `/update`'s and the user's, so this is recorded rather than repaired.\n\n## 2026-08-06 — a node says what is wrong with it, and a prompt stops saying everything\n\nThree changes, all user-directed, none mathematical.\n\n**`Q2-L9` retired.** Nothing depended on it — `required-by: —`, and no node listed it — so its directory went, its `used by:` back-references came out of ten appendix entries, and the three *other* nodes' history entries that named it kept their sentence and lost their link. That last part is the one judgement call: a history is append-only and those entries record a true past fact, so the fact stays and only the link that would now dangle is dropped. `--check` printed nothing, which is the point of the bidirectional edge.\n\n**A node states its own flaw ([ADR 0062](../decisions/0062-a-node-states-its-own-flaw.html)).** `Q2-L4_node.md` said `status: failing` and linked `critiques/r2.md`, and that was the whole of what it said about what was wrong with it. Neither of those is the defect. The block between the new `BEGIN FLAW` / `END FLAW` markers is generated from the record it names, so the fact is still stored once, and it sits before `## Statement` so the defect is read before the claim. **31 of 106 nodes** turned out to have something on record: six `failing`, four with a counterexample or a gap, twenty-one revised and not re-proved. That number is the finding — the flags existed and were being computed on every build, and the file every operator reads first was the one surface they never reached.\n\n**A prompt carries what is needed to work ([ADR 0063](../decisions/0063-a-prompt-carries-what-is-needed-to-work.html)).** `Q2-L4_prompt.md` was 9815 words. 1563 of them were the node's full fourteen-entry history, and the vocabulary harvested from that history dragged in appendix entries the node had never declared. Cutting the history to its latest entry cut twice: once for the words, once for the entries they pulled. With the fine print stripped from undeclared entries and the link list dropped — six files a packet that has left the repository cannot open — the packet is **6489 words, a third gone**, and nothing that was reproduced verbatim is reproduced less.\n\n**The trap in the second change, since it nearly shipped.** A quotation lifted out of `critiques/` and pasted one directory up has every relative link wrong. The first build produced blocks pointing at `updates/u1.md` from a file whose `updates/` is elsewhere, and at a parent's `_history.md` instead of the node's own. `rebase_md_links` already existed for exactly this — the generated prompt had been calling it since [ADR 0055](../decisions/0055-a-flag-names-the-record-it-fired-on.html) — and the lesson is narrow and worth writing down: **an excerpt is a move, and every move rebases.**\n\n**Not fixed, fourth phase running.** `Q1-L3-L2`'s write-up is 1818 words against the 1500-word cap and still fails the gate. It is `failing` on its mathematics and wants a `/decompose`.\n\n## 2026-08-06 — an abstraction's id names what it generalizes\n\n**The four abstractions were named after each other.** `Q1-z1`–`Q1-z4` recorded, in the id, the question they belonged to and the order in which they were written. What each was the general case of lived in `instances:` alone — a field, read by whoever opens the file, where an id is read by everyone else: the DAG index, the site sidebar, every link, every commit message. Two of the four abstract nodes on one axis and two on another, and nothing in `z1, z2, z3, z4` said so. They are now `Q1-L2-z1`, `Q1-L2-L3-z1`, `Q1-L5-z1`, `Q1-L6-z1` ([ADR 0064](../decisions/0064-an-abstractions-id-names-what-it-generalizes.html)), and the number that used to be a serial is the abstraction layer.\n\n**Renaming was the cheap half; not letting the name change the relation was the other.** [ADR 0061](../decisions/0061-the-z-axis-is-abstraction-level.html) had settled that an abstraction is not a member of anybody's decomposition, and giving it a parent in its id put that at risk in three separate places at once — the sub-lemma count on the instance's card, the ten-wide fan-out cap, and the folding rule, which would have hidden every abstraction on every page but its instance's own and left the tilt revealing an empty plane. All three now test `abstracts(id)` rather than the parent link. The identity to hold onto: **the id names the relation, it does not change it.**\n\n**A link is not fixed by counting `../`.** The four directories moved by one or two levels, one of them from depth 2 to depth 4. Every link was resolved against the old home to a repo-absolute path, mapped through the rename, and re-expressed from the new home — the same lesson [ADR 0063](../decisions/0063-a-prompt-carries-what-is-needed-to-work.html)'s run wrote down as *an excerpt is a move, and every move rebases*, except that here the mover is a directory and not a quotation.\n\n**A cap fell without anything being restructured.** `Q1` went from twenty direct children to sixteen, against a cap of ten, because four of the twenty were never members of the layer — they are drawn in their own plane and are absent at rest. The note that had counted them was measuring the id and not the picture.\n\n**Not fixed, fifth phase running.** `Q1-L3-L2`'s write-up is 1818 words against the 1500-word cap and still fails the gate. It is `failing` on its mathematics and wants a `/decompose`.\n\n## 2026-08-06 — a false clause becomes a hypothesis, and a record stops being read as timeless\n\n`/update Q1-L5-L3-L1`, run as the first step of raising [Q1-L5](../../nodes/Q1/Q1-L5/index.html), whose card sits at $-38\\%$.\n\n**Where the $-38\\%$ actually was.** Three channels: human silent at $+0.000$, literature `gap` at $-0.125$, and the mathematical record at $-0.250$ — not from anything about `Q1-L5` itself, which has never been refereed, but from the weakest-link cap taking `Q1-L5-L3` at $-50\\%$. **Two thirds of the deficit was one node two levels down**, and the gap everyone looks at first was the smaller third. Worth saying because the flag is on the parent's card and the defect is not.\n\n**The node at the bottom was created around the one thing in it that is false.** `Q1-L5-L3-L1` concluded that $u^!$ preserves coherence from hypotheses **(A)** and **(B)** that hold for *every* closed immersion of smooth finite-type schemes — and $!$-restriction along such an immersion does not preserve coherence. Recomputed rather than quoted: $D_{\\mathrm{pt}\\rightarrow\\mathbb{A}^1}=k\\otimes_{k[x]}k[x]\\langle\\partial\\rangle\\simeq k[\\partial]$, free of infinite rank, so $i^!\\mathcal{D}_{\\mathbb{A}^1}\\simeq k[\\partial][-1]$ is not coherent.\n\n**The creation entry recorded the error in its own words, six weeks of tree-time before anyone read it that way.** It said the conclusion is reached \"without base change: … so functoriality of $\\mathcal{D}^!$ alone relates $h^!u^!\\mathcal{F}$ to $\\tilde h_\\alpha^!\\mathcal{F}$.\" Functoriality does relate them. Then one still has to know that the chart-level $c_\\alpha^!$ carried a coherent object to a coherent one — a step that was never *stated*, and so was never doubted. The general shape: **an unstated step cannot be attacked**, and a node built around one will pass every gate that checks the proof against the statement.\n\n**The repair is the smallest one that keeps the node's own title true.** *A covering family of closed-immersion charts transfers coherence* — **transfers** is descent, and descent is what (B) is a hypothesis about. (A) and (B) are unchanged word for word; the new **(C)** asks of each chart exactly what the counterexample removes; the conclusion is unchanged. What is left is a real implication and not a tautology, because the composite $u\\circ h$ is not a test, so the conclusion cannot be read off [coherent $\\mathcal{D}$-modules](../../appendix/defn-coherent-d-mod.html) — the argument is written out in [u1](../../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L1/updates/u1.html).\n\n**What was rejected, and why it is the interesting rejection.** Adding \"$\\mathcal{F}$ holonomic\" would make the statement true in one word. It is a hypothesis on the *object*, so it would move the whole of `Q1-L5` from $\\mathcal{D}_c$ to $\\mathcal{D}_h$ — reaching `Q1-L2`, [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../appendix/def-renormalized.html) and the manuscript's $\\mathcal{D}^{\\mathrm{ren}}$, none of which this run examined. **A one-word repair that changes the ambient category is not a small repair.** The route that leaves the category alone is to discharge (C) where it stands, and that is a node.\n\n**`Q1-L5-L3-L4`, commissioned.** Under finitely many $H$-orbits, an equivariant coherent $\\mathcal{D}$-module has $\\mathrm{Ch}(M)\\subseteq\\mu^{-1}(0)=\\bigcup_{\\mathcal{O}}T^*_{\\mathcal{O}}\\tilde S$, a *finite* union of conormal bundles, hence Lagrangian, hence $M$ is holonomic — and $!$-restriction preserves holonomicity along any morphism. That is the first candidate answer to [r1](../../nodes/Q1/Q1-L5/Q1-L5-L3/critiques/r1.html) Flaw 2's three demands at once: equivariant, placidity-free and sourced. And the hypothesis is not a convenience — instance 3 of the node's own `examples.md` had already shown equivariance *alone* fails, by reducing to $K=\\{1\\}$ on $\\mathbb{A}^1$, which is exactly a case with infinitely many orbits.\n\n**The lead-researcher declined to verify what it could not open, which is the behaviour worth recording.** Hotta–Takeuchi–Tanisaki is not in `papers/` — `papers/HTT.pdf` is Lurie's *Higher Topos Theory*, and so is the `refs.bib` key `HTT`, a trap this node's `examples.md` had already flagged. Both new appendix entries carry full bibliographic data in prose, declare the missing key as the user's call, and declare the page-level check as **owed** rather than done.\n\n**A record is a reading of the thing it read ([ADR 0065](../decisions/0065-a-superseded-verdict-is-silenced-not-scored.html)).** With the statement corrected in exactly the way the counterexample demanded, the card went on saying *the statement is false as written* and went on charging the literature channel $-1.00$. The error was not in `examples.md`, which is append-only and correct about the day it was written; it was in reading a verdict about *one statement* as a verdict about *the statement now on disk*. The mathematical channel has never made that mistake — a revised node resets to `open` and its old critiques stop counting. The literature channel simply had no equivalent. It is **silenced and never credited**: a supersession says the literature no longer says what it used to about this statement, not that it now supports it.\n\n**The gate already knew, and told nobody.** `--check` had been emitting *\"reports `EVIDENCE: counterexample` and the node has no `updates/` entry … run /update\"* — computing the supersession, naming the operator, and then handing the result to no consumer. Two functions scored the verdict and neither asked. That is the second time this month a fact was **computed correctly in one place and ignored in the places that used it**; [ADR 0062](../decisions/0062-a-node-states-its-own-flaw.html) was the first.\n\n**Not fixed, sixth phase running.** `Q1-L3-L2`'s write-up is 1818 words against the 1500-word cap and still fails the gate.\n\n## 2026-08-06 — `/update Q2-L3 with input`: a statement that quantified over a word nobody defined\n\nA user-supplied referee report on [Q2-L3](../../nodes/Q2/Q2-L3/index.html), asking for a cleaner statement, a cleaner proof, and the abstract lemma underneath both as a node of its own.\n\n**What the input got right, and what it did not.** Its central reading survives: the whole content of the node is one cofibre sequence $\\Delta_{\\lambda,a}[n_{\\lambda,a}]\\to P_{\\lambda,a}\\to Q_{\\lambda,a}$ with the outer two terms Satake-generated, and hypothesis (C) is consumed only through the single object $Q_{\\lambda,a}$, so the inclusion suffices where an equality was assumed. Its reason for deleting the write-up's preorder caveat does not: the appendix calls $\\Lambda_X^+$ a partially ordered set but introduces the *closure* order separately, so being a poset under one order says nothing about antisymmetry of the other — the caveat still goes, on the round-1 critic's argument instead (a stratum is open and dense in its closure, two dense opens meet). Its Chen–Yi claim, a triangular standard-to-IC transition matrix, is not in the reading list's five recorded readings of that paper and is not adopted. Its Gunningham citation has no `refs.bib` key and no PDF, so the closed world does not contain it; the point it was cited for was already inside the repository as u1's counter-model.\n\n**The real defect was not the one the report led with.** Three of the four hypotheses quantified over $\\operatorname{supp}$ and over \"the full subcategory of objects supported on $\\partial\\overline{LX}_\\lambda$\", which no appendix entry defines. The round-1 critic had found this and correctly ruled it not the write-up's fault — (D)'s support conclusion was (B)'s hypothesis verbatim and (B)'s conclusion was (C)'s left side verbatim, so the argument matched the symbol and never unfolded it. That is how a node reaches `proved` while three of its antecedents are not yet propositions anything could discharge.\n\n**The repair needed no support theory.** (H1) already supplies the restrictions $i_\\mu^!$, so the boundary subcategory is now *defined* as the objects those restrictions kill, indexed by the closure order rather than cut out of a topological complement. All four labels (A)–(D) keep their letters, because eight nodes cite them by letter. Indexing the boundary by the order also deleted the old Step 4 outright, along with the reading of \"$LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda$\" on underlying spaces the critic had to flag. Recorded in [u2](../../nodes/Q2/Q2-L3/updates/u2.html); the node is back to `open` and the next `/prove` continues at `r2`.\n\n**The abstraction.** [Q2-L3-z1](../../nodes/Q2/Q2-L3/Q2-L3-z1/index.html) states the argument with the geometry removed: a well-founded poset, a cocomplete stable subcategory, one cofibre sequence per member of the family. The input asked only for \"$\\mathcal{S}$ a stable subcategory\", which is not enough — $\\langle-\\rangle$ is the smallest *cocomplete* stable subcategory, so the induction needs closure under small colimits and not merely finite ones. It sits on the abstraction axis with `instances:` naming Q2-L3, so it caps nothing and moves no number.\n\n**What the gates learned.** [I33](../pipeline.html#4-invariants) and [ADR 0066](../decisions/0066-an-undefined-notion-in-a-statement-is-a-gate-note.html): `--check` now notes any `\\operatorname{…}` in a `## Statement` whose name is not standard notation. `supp` is deliberately off the allowlist, because a support theory on an ind-scheme of infinite type is a theory and not notation. It fires on eighteen other statements, which is why it is a note and not a failure — [ADR 0050](../decisions/0050-a-node-has-at-most-ten-children.html)'s precedent.\n\n**Left undone, and why.** Hypothesis (B) — the counit-cofibre localization triangle — is still charged to no node. Q2-L4 owns (C) and Q2-L5 owns (D), so by parallel (B) wants a Q2-level sibling; [Q2](../../dag.html) is already thirteen children wide against a cap of ten, and grouping thirteen siblings is a layout decision with the user's name on it. It earned priority row P42 rather than a node, which is what [ADR 0022](../decisions/0022-update-proposes-nodes-from-failures.html) says to do with a failure that names a crisp claim but has no lawful attach point. This is the first time the width cap has blocked the failure audit.\n\n**Not committed.** A concurrent session was mid-run in the same working tree: `blueprint/main_dag.md`, `blueprint/priorities.md`, `tools/build_dag_site.py` and all of `blueprint_site/` carry both sessions' changes, and `Q1-L5-L3-L4` was appearing under it while the gates ran. Staging whole files would have attributed that work to this run. The one standing render-gate failure, `Q1-L3-L2/proof.md` at 1818 words against the 1500-word cap, is that session's and pre-dates this one.\n\n## 2026-08-06 — `/prove Q2-L3`: rounds r2 and r3, and a referee that caught the operator\n\n`proved` at [r3](../../nodes/Q2/Q2-L3/critiques/r3.html), 1257/1500 words, fourteen steps. Two rounds, both this invocation, numbered r2 and r3 because r1 refereed the superseded statement.\n\n**r2 failed the node on a sentence `/update` had written that morning.** The gloss u2 attached to hypothesis (B) said u1's counter-model refutes it. Under u2's own new definition of $\\mathcal{D}^{\\mathrm{ren}}_T$ it does not: the all-identities model makes $\\mathcal{D}^{\\mathrm{ren}}_T=0$ for every proper $T$, so (B) holds there vacuously, and the very strengthening u2 made is what defused the model. Recomputed before the finding was adopted, corrected in [u3](../../nodes/Q2/Q2-L3/updates/u3.html), and worth recording as a pattern: the operator that revises a statement is the one actor with no referee, and the sentence that failed was **commentary inside a `## Statement`** — precisely what `CLAUDE.md` sends to the history file. Had u2 followed its own rule the false sentence would never have been part of a claim.\n\n**What the round bought.** Given (H1) alone, $i_\\lambda^!Q\\simeq0$ is free — full faithfulness of $i_{\\lambda!}$ makes the unit an equivalence and the triangle identity makes $i_\\lambda^!\\varepsilon_P$ one — so (B) is *equivalent* to $i_\\nu^!i_{\\lambda!}i_\\lambda^!P\\simeq0$ for $\\nu\\notin\\overline{\\lambda}$: extension by zero restricted to the image of $i_\\lambda^!$. Strictly smaller than the question u1 closed, still open, and it belongs to whichever node is eventually charged with (B).\n\n**The write-up grew, and one of the two reasons given for that was wrong.** 878 words and ten steps before, 1257 and fourteen after — the opposite of the \"simpler\" the run was asked for. The prover attributed the growth partly to the no-abbreviation convention of [the Satake subcategories](../../appendix/def-satake-subcategory.html); r3 checked and refuted it, since the gate counts whitespace tokens and `$\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$` is one token exactly as `$\\mathcal{S}$` was. The real causes are the ADR 0043 split (120–150 words) and the elaboration r2 demanded. r3 names the seam — Steps 1–4, four structural facts touching none of (B)–(D) — and two of them are generic facts about $\\mathcal{D}^{\\mathrm{ren}}$ and a continuous left adjoint that several Q2 nodes restate. An appendix entry there shortens this write-up and the others, which is the remedy [ADR 0060](../decisions/0060-a-write-up-has-two-budgets.html) says compounds.\n\n**Correction to the entry above this one.** It closed \"Not committed\", which was true when written and is no longer: a concurrent session's commit `757654f` swept up this run's `tools/build_dag_site.py` change, the I33 invariant and that journal entry itself, under a message about a different node. Nothing was lost and history is not being rewritten for it, but it is the second time in one day that two sessions in one working tree have crossed, and the first time the loser was the run that had been careful about it.\n\n## 2026-08-06 — the abstraction layer is refereed for the first time, and three of four statements are wrong\n\n`/prove` on all four level-1 nodes, at the user's direction, immediately after renaming them onto their instances. Four provers concurrently, then four critics. **One `PASS`, two `FAIL`, one refutation** — and in every one of the three failures the defect is in the *statement*, not in the write-up.\n\n**That ratio is the finding, and it is a fact about how the layer was built.** The four abstractions were written by stripping the geometry out of nodes that already had one, in a single `/decompose`-style pass, and none was refereed. Stripping the geometry also strips the hypotheses the geometry was silently supplying — which is exactly what a referee then finds. [ADR 0061](../decisions/0061-the-z-axis-is-abstraction-level.html)'s own journal entry had put it optimistically: *an implicit reliance became a check an instance either passes or fails.* It is the same mechanism read the other way. **Abstracting exposes a hidden hypothesis by deleting it**, and the deletion is invisible until someone proves the abstraction.\n\n**[Q1-L2-z1](../../nodes/Q1/Q1-L2/Q1-L2-z1/index.html) — `PASS` at r1, 977/1500.** Its own **Scope.** paragraph is now known to be false: it says hypothesis **(C)**, shift stability, \"is what turns (2) into the pointwise test (3)\", and (C) is redundant. Vanishing propagates upward in $n$ through the loop functor, using only $Y\\simeq0\\Rightarrow\\Omega Y\\simeq0$ and not its reflection. A redundant hypothesis makes a statement weaker, not wrong, so the node is proved and the paragraph is `/update`'s.\n\n**[Q1-L6-z1](../../nodes/Q1/Q1-L6/Q1-L6-z1/index.html) — refuted, with one index.** Condition (1) proved, condition (2) false, and neither the partial order nor the clean-costalk vanishing is at fault: the counterexample has $|A|=1$, so both are vacuous. In the arrow category with $r=\\mathrm{fib}$ and $e\\colon V\\mapsto(V\\to0)$ and $S=\\{(0\\to k)\\}$, every object of $\\langle S\\rangle_{\\mathcal{C}}$ has first component $0$ while $e\\,r\\,\\sigma=(k[-1]\\to0)$ does not. **The reason is one sentence: (A), (B) and (C) constrain only the right adjoints $r_\\alpha$, and condition (2) is a statement about the left adjoints $e_\\alpha$.** Nothing in the hypotheses reaches $e_\\alpha$ at all. The draft then proves the repair is forced — given (A) and (B), condition (2) at $\\alpha$ is *equivalent* to $e_\\alpha\\omega_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$ — so the suggested hypothesis **(D)** is not a weakening dressed up, it is the only thing (2) can be.\n\n**The counterexample is an arrow category, and so was the last one.** [Q1-L5](../../nodes/Q1/Q1-L5/index.html)'s history already carries a two-stratum arrow-category witness, from `u1`, for the failure of (1)⇒(2). Two independent runs on two different nodes reached for the same object because it is the smallest thing with a stratification and no gluing. Worth noticing rather than filing as coincidence: **the arrow category is this project's standard counterexample**, and a node whose statement survives it has cleared the cheapest real test there is.\n\n**[Q1-L5-z1](../../nodes/Q1/Q1-L5/Q1-L5-z1/index.html) — `FAIL`, and the defect is in the appendix.** Clause (ii) rests on the orthogonality criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../appendix/def-generation.html), and the entry states it without the hypothesis its source's proof consumes. Verified at page level this run: `GR17vol1` printed p. 51 footnote 8, \"*When talking about cocomplete categories we will always assume that they are presentable*\", and the proof of Prop. 5.4.5 opens by producing a right adjoint to an inclusion — the Adjoint Functor Theorem, whose own footnote 3 says presentability \"*is necessary*\" for it. **That entry is invoked by roughly thirty nodes across all three questions.**\n\n**Two rounds on two nodes drew a line nothing in the repository had drawn.** [Q1-L2-z1](../../nodes/Q1/Q1-L2/Q1-L2-z1/index.html) does not inherit the presentability defect and [Q1-L5-z1](../../nodes/Q1/Q1-L5/Q1-L5-z1/index.html) does — and the referees between them established *why*, correcting the first prover on the way: what GR's proof needs is $\\langle S\\rangle_{\\mathcal{C}}$ presentable, supplied by **smallness of the generating set** and not by compact generation of the ambient. So the nodes that are safe are the ones hypothesising a small $S$, and the ones at risk are the ones hypothesising only cocompleteness. **Neither node could have found that alone**, and the concurrency is what made the comparison available: one round hit the footnote and could not discharge it, the other discharged it and named the mechanism.\n\n**[Q1-L2-L3-z1](../../nodes/Q1/Q1-L2/Q1-L2-L3/Q1-L2-L3-z1/index.html) — `FAIL` on a `FATAL`, the same failure mode in its purest form.** Clause 1 says \"$S$ is a **small set**\"; hypothesis (A) supplies only *essential* smallness of $\\mathcal{A}^{\\omega}$, which is strictly weaker. The instance it was abstracted from, [Q1-L2-L3](../../nodes/Q1/Q1-L2/Q1-L2-L3/index.html), earns literal smallness because $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is genuinely small — **the abstraction dropped the hypothesis its own instance has**. The referee also exhibited a counterexample to the strong reading of clause 3 ($\\mathcal{A}=\\mathrm{Vect}$, $\\mathcal{M}=\\mathrm{Vect}\\times\\mathrm{Vect}$, $m_0=(k,0)$) and declined `REFUTED` because a weak reading survives, which is the right call and prices the ambiguity for `/update`.\n\n**A gate that cannot catch this, stated so nobody expects it to.** Every one of the three defects is a statement asserting more than its hypotheses support, and no render check, link check or word count sees that. Only a referee reading the hypotheses against the conclusion does. The layer was created, indexed, drawn on the tilted graph and given generated prompts for a full day at `status: open` with `confidence 0%`, and every gate was green the whole time — correctly, because **`open` means nobody has looked, and three of these four should never have read as merely unexamined.**\n\n**Not fixed, seventh phase running.** `Q1-L3-L2`'s write-up is 1818 words against the 1500-word cap and still fails the gate.\n\n## 2026-08-07 — a statement revision between a draft and its referee invalidates the draft\n\nRunning the red-clearing sweep, `/prove Q1-L3-L2` produced an assembly write-up and, in its\nreport, flagged that the parent's clause (4) was false at $G=1$. The orchestrator repaired the\nclause immediately (`u2`) and sent the *existing* draft to the referee. It failed FATAL, and\ncorrectly: the draft's `## Lemma` transcribed the superseded clause, so it did not establish\nits own stated Lemma. Three of the round's flaws were that one staleness in three places.\n\nThe mathematics was fine and so was the prover. What went wrong is operator ordering, and it is\nworth a rule because the pipeline actively invites it: `/prove`'s standing instruction on\nfalsity *asks* the prover to report a statement it cannot prove, and the natural next move —\nfix the statement — silently invalidates the draft sitting next to it.\n\n**The rule.** `/update` runs before `/prove`, never between a draft and its critique. Where a\nprover discovers the defect mid-round, the redraft is re-run against the corrected statement;\nthe draft is not patched underneath the referee.\n\n**A second lesson from the same node, in the other direction.** The defect had survived r1 and\nr2 — two hostile referees — and was found only when the node was decomposed and the prover was\nasked whether the four children cover the parent. Asking \"does the decomposition cover the\nstatement\" is a different question from \"is the argument correct\", and it caught something two\nrounds of the second question missed. Worth doing at every split.\n\n**A third, on the record correcting itself.** Both `Q1-L4-L1/updates/u1.md` and\n`Q1-L4-L1-L3/critiques/r1.md` assert that Chen–Yi has no `refs.bib` key. It does —\n`chenyi_2025singularitiesorbitclosuresloop` at `refs.bib`:213, with the PDF on disk. The claim\nwas inherited from record to record without anyone grepping `refs.bib`, and it was propagated\nonce more by this run before a prover checked. A claim about what the repository contains is\nthe cheapest kind of claim to verify and should never be quoted from a prior record.\n\n## 2026-08-07 — what the red-clearing sweep cost, and where the time actually went\n\nThe run was stopped by the user partway through, on the grounds that it was making little\nheadway against the size of the blueprint. That judgement is correct and worth writing down\nwith numbers, because the bottleneck is not where it feels like it is.\n\n### What was spent, measured\n\nFourteen subagents completed and one died. Their reported totals:\n\n| stage | agent | tokens | wall-clock |\n|---|---|---|---|\n| Q1-L6-z1 | prover | 71.8k | 7.3 min |\n| Q1-L6-z1 | critic | 109.0k | 10.2 min |\n| Q1-L2-L3-z1 | prover | 110.7k | 13.1 min |\n| Q1-L2-L3-z1 | critic | 122.5k | 10.7 min |\n| Q1-L5-z1 | prover | 101.1k | 12.5 min |\n| Q1-L5-z1 | critic | 106.3k | 10.3 min |\n| Q1-L4-L1-L3 | prover | 106.5k | 13.0 min |\n| Q1-L4-L1-L3 | critic | 125.0k | 10.7 min |\n| `def:generation` | lead-researcher | 126.2k | 10.7 min |\n| `objects:` widening | lead-researcher | 52.4k | 1.5 min |\n| Mirković–Vilonen entry | lead-researcher | 74.1k | 5.6 min |\n| Q1-L3-L2 split | lead-researcher | 180.6k | 15.5 min |\n| Q1-L3-L2 assembly | prover | 130.9k | 30.0 min |\n| Q1-L3-L2 | critic (r3) | 142.5k | 10.6 min |\n| Q1-L3-L2 redraft | prover | — | **died at 10 min, no output** |\n\n**≈1.45M subagent tokens for four nodes moved from `failing` to `proved`** — about **360k\ntokens per node cleared**, and that is the optimistic figure, because all four were nodes whose\ndefect was in the *statement* and therefore cheap. Sixteen reds and sixty-eight zeros remain.\nAt the measured rate the rest of the tree is on the order of **30M tokens**. That number, not\nany individual slowness, is the thing to design against.\n\n### Five specific costs, worst first\n\n**1. The critic is the largest single line item and re-derives mechanical checks every round.**\nEvery critique cost 106–143k tokens and ~10 minutes, and every one of them independently\nre-performed: the verbatim `## Lemma` vs `## Statement` diff, the hallucination sweep over bib\nkeys and `main.tex` labels, relative-link resolution, and the closed-world check that no\nundeclared appendix entry is cited. **All four are decidable mechanically.** The statement diff\nin particular is pure `diff`, and it caught the FATAL of round r3 — a defect a three-line script\nwould have caught before the referee was launched. Moving these into `tools/check_render.py`\nand telling the critic they are already done would cut the largest cost in the pipeline without\nlosing a single mathematical judgement.\n\n**2. Two lead-researcher runs could not run the gates they were told to run.** Both reported\n\"this session has no Bash tool\" and stopped short — one of them *deliberately left a known\n`--check` inconsistency on disk* because the fix was in a file it was not permitted to touch.\n`.claude/agents/lead-researcher.md` grants Read/Edit/Write/Grep/Glob, while the workflow ends\nby asking it to run `build_dag_site.py` and `check_render.py`. Either grant it Bash or stop\nasking; as it stands every such run ends with work the orchestrator must redo.\n\n**3. `build_dag_site.py` does not converge in one pass.** The generated `BEGIN FLAW` block is\nwritten *into* the canonical node files during the build, so after pass 1 the pages it just\nwrote are stale against the node files it just edited, and `--check` reports `STALE`. Every\nstatus change this run needed the build run **twice**. It is the slowest step in the loop and\nit is being paid for twice on every iteration.\n\n**4. `check_render.py` is whole-repo and re-renders everything.** 778 pages and ~197k math\nfragments through KaTeX on every invocation. It was run roughly ten times this session; under\nCPU contention with concurrent subagents one invocation exceeded **600 seconds** and had to be\nbackgrounded. There is no incremental mode — no `--only <path>`, no cache keyed on file hash —\nthough the overwhelming majority of runs touch three or four files.\n\n**5. Agents stall, and the loss is total.** The Q1-L3-L2 redraft died after 600s of no progress\nwith no partial output retained. Its predecessor on the same file had already run 30 minutes.\nNothing about the node was inherently hard; the work was simply lost.\n\n### The structural problem underneath all of it\n\nConfidence is `C = min(cap, ¼H + ½D + ¼L)` with `D` **weakest-link over `depends-on`**, and an\n`open` node is *silent*, contributing 0. So a node cannot exceed its weakest dependency, and\nproving a node whose dependencies are still `open` leaves it at exactly 0. Sixty-eight nodes sit\nthere now.\n\nThis means **the payoff cannot be parallelised**: work must proceed bottom-up, and a proved node\nhigh in the tree shows nothing until everything beneath it is also proved. It is the right\nepistemics and it is a brutal work order. The one channel that escapes it is `L`, the literature\nchannel, which is the node's own and is *not* min'd over dependencies — a node with an\n`EVIDENCE: instances` verdict sits at +12.5% regardless of what is beneath it. Forty-eight of\nthe sixty-eight zeros are example/analogy nodes, where `/examples` is both the correct operator\nand roughly a third the cost of a prove/critique round.\n\n### What to do, in order of return\n\n1. **Move the four mechanical checks out of the critic and into the render gate.** Largest\n   saving, zero loss of judgement, and it would have caught this run's one FATAL for free.\n2. **Fix the lead-researcher tool grant.** It is a one-line config change that currently\n   wastes an entire agent run whenever it fires.\n3. **Make the site build converge in one pass**, or have `--check` tolerate the one-pass state.\n   Halves the cost of the most-repeated step.\n4. **Add an incremental mode to the render gate**, keyed on changed files.\n5. **Only then** resume the mathematics — and resume it with `/examples` across the\n   example/analogy layer, which is the one place the tree gets cheaper rather than deeper.\n\n### What this run did deliver, for the record\n\nFour nodes from `-50%` to `+45/47/46%` and a fifth decomposed; red 20 → 16, positive 23 → 28;\nthe repository's one hard render-gate failure (a 1818-word write-up) removed; two appendix\nentries added and one corrected where it had dropped a hypothesis its source's proof consumes;\nand a false claim about `refs.bib` that had been inherited from record to record without anyone\ngrepping the file corrected in four places. Every one of the nine failing nodes examined turned\nout to be failing on its **statement**, not its argument — in four cases the referee said so in\nas many words. That is the finding most worth carrying forward: `/update` is the operator this\ntree needs, and `/prove` mostly re-certifies afterwards.\n";</script>
