pays for itself immediately.** The pipeline's very first output was not a proof but a *defect report against the manuscript*: `def:satake_subcategory` invokes a generation operation without naming its ambient category, so the definition as printed does not determine a subcategory. The prover had silently chosen a reading; the critic caught that the choice was unjustified rather than that it was wrong.\n- **Check the artefact, not the source.** A page shipped whose mathematics did not render, while every file in the repository was individually correct. A gate that validates the source passes exactly when the thing you ship is broken in a way the source cannot see.\n- **A scoring scheme with no negative range cannot represent its own most valuable finding.** `/examples` was documented from the start as having a *falsity referral* as its best outcome — and for two decision records that outcome had no visible effect on anything. Confidence had to become signed before the machine could say \"we found evidence against\" rather than merely \"we found nothing\".\n- **Absence of evidence and evidence against are different states**, and a display that cannot tell them apart will be read as the wrong one. Hence silent channels that cost nothing, rather than channels that default to zero.\n- **Derived state must never be stored.** Every fact lives in exactly one place; `ready`, `blocked` and confidence are computed at build time. Each stored duplicate found in this repository had already gone stale by the time it was found.\n- **An external passage is a lead, never a source.** Every claim from outside gets recomputed against the appendix and the manuscript before a word of it is adopted, and what could *not* be verified is recorded alongside what could. This caught a paraphrase that had quietly transposed a characteristic-zero theorem into equal characteristic.\n- **Separate presentation from refereeing.** While the critic was responsible for both, it kept flagging formatting, and the noise hid the mathematics. Presentation became a content-preserving stage, gated by a mechanical diff rather than by trust.\n- **Concurrency in a shared working tree is the recurring operational hazard.** Sessions have overwritten each other's referee reports, swept each other's staged files into commits, and re-added statements a parallel run had just withdrawn. Every fact stored singly collides. Re-check git state before every commit and stage only your own paths.\n- **Resolve a path before matching on its name.** A rename done by string match on `node.md` also matched `0002-one-file-per-node.md`, breaking eleven links. The render gate caught all eleven, which is the argument for the gate — and for never doing the next one by substring.\n\n---\n\n## Phase 1 · 2026-08-02 — bootstrap\n\n`4280e6e` `7da76fe` `cf5f5e5` `6421ca0` `39193fe` `b5d7809` `59c6210`\n\nManuscripts, preamble and bibliography committed *before* any automation, so that every later diff separates research output from the machinery producing it. That boundary turned out to matter more than expected: \"did the pipeline change the paper?\" is answerable by looking at whether `main.tex` appears in a diff. It never should.\n\nThen the scaffold — agent definitions, slash commands, `blueprint/`, templates — with three agents (lead-researcher, prover, critic) whose tool grants were chosen to make the write discipline mechanical rather than advisory. The critic got no edit and no shell tools.\n\n`blueprint/context.md` was distilled from the Conventions section of `main.tex` **by hand**, and slowly. That was the correct trade: an automatically-scraped context would not have forced anybody to decide *what is being assumed*. This was the first statement of the closed-world rule.\n\nFirst real use: `/decompose` Q1 into seven nodes, with a stated logical closure, bracketing the answer between a necessary and a sufficient condition rather than aiming straight at a characterisation. Then `/prove` Q1-L1 — two rounds, and the defect report described above.\n\nHousekeeping that stuck: house macros were leaking from `.tex` into blueprint markdown where nothing expands them, so every `.md` file went to standard KaTeX and a gate now refuses a leak. LaTeX artefacts routed into a gitignored `build/`.\n\nLate the same day, two structural moves. A fourth agent, the **checker**, split presentation out of refereeing. And the **appendix of objects** replaced the tables: a row cannot carry a statement or its hypotheses, so an object gets a full entry or it is not available.\n\n## Phase 2 · 2026-08-03 — the tree gets a shape, and a picture\n\nNode directories replaced node files; `/examples` arrived as a way to bring the literature in; the DAG became something you can look at. Arrows point prerequisite → result (the first version pointed the other way and read backwards), results at top, positions derived rather than stored — four things taken from Tao's `paper-diagram` format spec after reviewing it.\n\n`/decompose` learned to take a node id as well as a question, expanding one lemma into sub-lemmas. This is the escape hatch for the one-page rule: when a write-up will not fit, the node was really several nodes. The parent's statement stays frozen.\n\nThe README was rewritten around the question it had not been answering — not what the agents are, but what a person types. You never invoke an agent; you type a command, and the command drives them.\n\n## Phase 3 · 2026-08-03 — the render gate, and the site\n\nA blueprint page shipped that did not render. The response was the gate, and then the harder version of it: not \"is the markdown well-formed\" but \"does the *generated page* render, and does every link between generated pages land\". `docs/` became a generated site; the checks went to seven, then eight when the ambient-category subscript rule was mechanized.\n\nOne tree per kind, and the index stopped being written twice: the per-question bullet list in `main_dag.md` became a generated block between markers, because two copies of a status is one copy that is wrong.\n\nCritiques were exempted from the new notation gate and reported as advisory. A critique is an append-only record of what a referee saw, and rewriting one to match a convention adopted afterwards would falsify it.\n\n## Phase 4 · 2026-08-03 — Q1-L2 expanded, Q1-L1 re-proved\n\nQ1-L2 was decomposed into four sub-lemmas and the sub-DAG renderer met its first sub-DAG. Q1-L1 was refereed again and re-proved, at a cost worth recording: to fit eleven citations on one page the prover reached for `\\footnotesize` and friends, which carry no meaning in the reading view.\n\nAlso this phase: one manuscript, one preamble. `v2.tex` became `main.tex`, three preamble files merged into `preamble.tex`, and both gates learned to harvest house macros from the single file.\n\n## Phase 5 · 2026-08-04 — the design, written down\n\nThree documents in sequence. [`pipeline.md`](../pipeline.html) states the design and its invariants. The portable version states the same machine with the mathematics removed, so it can be instantiated elsewhere; it was fact-checked by an adversarial pass told to *refute* rather than approve, which found two wrong facts in the draft. [`operations.md`](../operations.html) states the repository as a dependently-typed schema and each command as a typed map — then was split so that **readouts are separated from commands**, because only a command changes what is true.\n\nThe site left git and stopped being called `docs` — a decision reversed later ([ADR 0033](../decisions/0033-the-generated-site-is-tracked-again.html)).\n\nA test suite arrived, and found things. Writing the reference guideline surfaced four bib keys cited in the sources with no entry in `refs.bib`, one of them cited from `appendix.md` itself — a live violation of the cite-only-what-exists rule.\n\n## Phase 6 · 2026-08-04 — markdown write-ups, and nesting\n\nWrite-ups became markdown ([ADR 0011](../decisions/0011-write-ups-in-markdown.html)): nothing under `blueprint/` compiles any more, and the render gate checks what latexmk used to. `/examples` became its own command rather than a mode of `/prove`.\n\nA sub-lemma's directory moved **inside its parent's** ([ADR 0012](../decisions/0012-sub-lemmas-nest-in-their-parent.html)), so the id is the path. Decomposing a node now only ever adds directories beneath it.\n\n## Phase 7 · 2026-08-04 — confidence\n\nEvery node got a confidence, computed rather than declared: no `confidence:` field, nothing may cite the number, no gate reads it. First as a Baconian ratio over disposed flaws with weakest-link propagation ([ADR 0013](../decisions/0013-confidence-is-derived-baconian-and-weakest-link.html)), then rebuilt as **three signed channels** — human at 25, the mathematical record at 50, the literature at 25, each able to be silent ([ADR 0014](../decisions/0014-confidence-is-three-signed-channels.html)). The lesson that forced the rebuild is the fourth bullet at the top of this file.\n\nThe site began mirroring the source tree ([ADR 0016](../decisions/0016-the-site-mirrors-the-source-tree.html)), and every node was made to state its **role** ([ADR 0015](../decisions/0015-every-node-declares-its-role.html)). The trigger: Q1-L7, a sanity check nothing depended on, was indistinguishable on paper from an unproved chain lemma — it counted as an obligation, and the weakest-link minimum let its untouched record pin Q1 at 0% however much of the real argument was proved.\n\n## Phase 8 · 2026-08-04 — the operators get eyes, and find things\n\nOperators were required to read the PDFs on disk before memory and before the web ([ADR 0017](../decisions/0017-operators-read-the-local-library.html)). Reading widens nothing: it never makes anything citable.\n\nThen the findings started arriving, and they were not the kind expected.\n\n**The first extended `/examples` run returned a false hypothesis rather than a missing example.** It also produced a malformed `EVIDENCE:` line — prose instead of one of the five values — which the gate rejected and sent back rather than letting the orchestrator repair it, because only the example-finder writes that file.\n\n**Q1-L4 clause (iv) is false, and false in print.** `EVIDENCE: counterexample` put Q1-L4 at −25%, and the weakest-link rule carried it to Q1-L5 and Q1-L6. Three cards went red on one build from one line of one file. The appendix was not the problem — the clause was.\n\n`/update` arrived to handle exactly this ([ADR 0019](../decisions/0019-the-update-operator.html)), with the passage-is-a-lead contract, `updates/u<n>.md` records, and the rule that a strictly more general verified claim becomes a **new node the target specializes** rather than a widened statement in place. Its first run corrected the dévissage; a later one withdrew Q1-L4(iv) and commissioned its symmetric survivor. [ADR 0022](../decisions/0022-update-proposes-nodes-from-failures.html) made proposing nodes from the failure surface part of the contract, and [ADR 0020](../decisions/0020-the-priority-panel.html) gave the run somewhere to put a failure that names no crisp claim.\n\nThe example and analogy layer arrived with it ([ADR 0018](../decisions/0018-example-and-analogy-nodes.html), [ADR 0021](../decisions/0021-example-and-analogy-nodes-nest.html)): nine e/a nodes, then more. `/examples` on Q1-a1 produced **the pipeline's first counterexample verdict** — the function-theoretic generation question was answered in print in 2009, both ways, by the very paper the node cited for its display.\n\nOperationally, this is where concurrency first bit: two sessions working the tree at once, a node file whose statement changed between a read and a commit, and a shared index sweeping one session's staged files into the other's commit.\n\n## Phase 9 · 2026-08-04 — presentation, structure, and a second driver\n\nA run of user-directed structural passes. One graph everywhere, with corroboration folded into side branches ([ADR 0024](../decisions/0024-one-graph-with-side-branched-corroboration.html)); the question block states a versioned, self-contained conjecture ([ADR 0023](../decisions/0023-the-question-block-states-a-conjecture.html), [ADR 0025](../decisions/0025-the-conjecture-is-versioned-and-self-contained.html)); sub-lemma families fold into their parent so the root canvas stays the size of one decomposition ([ADR 0026](../decisions/0026-sub-lemma-families-fold-into-their-parent.html)); and `## Remark` was retired in favour of a dated, append-only `## History` on every node ([ADR 0027](../decisions/0027-a-node-carries-its-history.html)).\n\nA notation audit found the proof spine clean and the e/a layer drifting — an ill-typed $K$, a check-versus-vee mix inside a single node — each repaired under its own `updates/u<n>.md`.\n\nCodex was wired to drive the same pipeline through thin adapters, with `.claude/skills/` and `.claude/agents/` remaining the semantic source of truth.\n\nThe Q1-L2 chain landed in this phase: four nodes, five rounds, one closed-world widening. The widening is worth its own line — Q1-L2-L1's r1 FAIL was not mathematical. The draft used exactness of the test pullbacks $f^!$, correctly, but had never declared the appendix entry that says so. The lead-researcher widened `objects:` by that one entry mid-round, and the r2 referee verified the disposal rather than taking it on faith.\n\n## Phase 10 · 2026-08-05 — prompts, names, and the Q1-L4 chain\n\nEvery node got a **generated self-contained prompt** ([ADR 0029](../decisions/0029-every-node-has-a-generated-self-contained-prompt.html)): a portable readout assembled from the node, its history, the question framing, its prerequisites and the transitive appendix vocabulary — never edited, never cited, and rejected by the gate if stale. The repository-wide audit that produced it also fixed a live contradiction in `README.md`, which still described sub-lemma directories as flat.\n\nA node's own files were renamed for the node ([ADR 0032](../decisions/0032-a-nodes-own-file-is-named-for-the-node.html)), so a path lifted out of its directory still says whose it is; every generated page got a door home. The rename is the source of the tenth lesson above.\n\n`/prove` was capped at two rounds and one widening ([ADR 0030](../decisions/0030-the-prove-budget-cap.html)), and presentation became a stage of every command rather than a command of its own ([ADR 0031](../decisions/0031-presentation-is-a-stage-not-a-command.html)), gated by a mechanical diff over status fields, verdicts and anchors. `/decompose` opened Q1-L4 along its three clauses and Q1-L5 along its two directions; Q1-L4-L1 was proved in two rounds with the orbit reading ratified ([ADR 0028](../decisions/0028-orbit-strata-are-fpqc-images.html)). The site came back into git ([ADR 0033](../decisions/0033-the-generated-site-is-tracked-again.html)).\n\nTwo operational findings. A markdown link whose text contains nested brackets was invisible to both the site relinker and the link checker, so it rendered dead while the gate reported nothing; 13 previously unchecked links came under the gate when both regexes learned to tolerate two levels. And a concurrent session ran its own round on the same node in the shared tree, where every singly-stored fact collided — its referee report overwrote one this session had already read.\n\n## Phase 11 · 2026-08-05 — the machine explains itself\n\n`/update Q1-L2-L3` at the user's reading that the statement is formal and the proof should be three paragraphs. The reading held, and sharpened: every clause is formal *except* the membership $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$, which asserts that a $!$-extension is coherent. That had been carried by the grammar of two appendix entries; it is now ratified explicitly on the manuscript's own presupposition at main.tex:79–80. The proof went from six steps to three paragraphs, the statement's clauses were rewritten into the words its two consumers actually use, and the three MINOR flaws standing from r1 were disposed at source — including two citation drifts caught by opening `main.tex` rather than trusting the entry.\n\nThe family-wide formatting pass found the drift that matters most here: Q1-L2-L2's proof cited \"the node's own Remark\" three times, in load-bearing positions, five records after [ADR 0027](../decisions/0027-a-node-carries-its-history.html) retired that section. The *link* resolved, because it pointed at the node file. The *section* did not exist. Check 4 validates link targets, not prose claims about what is inside them, so nothing caught it — and the reading it invoked was in the closed world all along, as the note on `def:generation`, which is where the three citations now point.\n\nThen [`blueprint/concepts/`](../../concepts/index.html) ([ADR 0035](../decisions/0035-the-concepts-tree.html)): nine pages explaining the machine in plain terms — node, closed world, appendix, DAG, confidence, role, gate, operator, history — each with a worked example from this repository and its ancestors in the literature. The user's report was that \"closed world\" was unexplained anywhere, which was true; the phrase is borrowed from Reiter and does not mean what Reiter means by it, and nothing said so. And this journal was compacted ([ADR 0034](../decisions/0034-the-journal-is-compacted-into-phases.html)).\n\n## Phase 12 · 2026-08-05 — the blueprint goes public\n\nThe site is now readable at <https://cwlin4916.github.io/rrl-blueprint/>, so a collaborator needs a link and not a clone. It is published as *itself*: a second, public repository holding only `blueprint_site/`, with this one staying private. The manuscript has two coauthors and is unpublished, and flipping this repository public would have published `main.tex` along with the reasoning — a decision that is not reversible by making it private again, because indexing is not undone.\n\nThe cost is that the site is now a thing that can go stale in public, which `tools/publish_site.sh` answers: it regenerates, runs `build_dag_site.py --check`, and refuses to mirror a site that does not match the blueprint. Publishing found the site two pages stale at the time, so the guard is not hypothetical.\n\nOne defect the publication surfaced, unfixed: twelve priority rows carry markdown links in their text, and the generator emits that text unrendered, so the front page shows literal `[L2](nodes/…_node.md)` pointing at paths the site does not serve. It was invisible while the only reader was the person who wrote the rows.\n\n## Phase 13 · 2026-08-05 — a referee report separates convention from theorem\n\n`/update Q1-L4-L1 with input`, on an external report whose verdict was that all three clauses are true and whose one charge was logical rather than mathematical: the node is *partially tautological*. Clause (b) read as a geometric theorem — the orbit map presents the stratum — but ratified reading 3 ([ADR 0028](../decisions/0028-orbit-strata-are-fpqc-images.html)) *posits* that the orbit image is represented by the locally closed stratum, so half of (b) was true by terminology. The charge held. Clause (b) is now split at that seam, the node carries a **Scope** section saying what is geometry (only (a), and it needs nothing but affineness), what is formal (orbit–stabilizer and descent, no spherical hypothesis anywhere), and what is convention, and the status stays `proved` because [proof.md](../../nodes/Q1/Q1-L4/Q1-L4-L1/proof.html) already argued exactly that — Step 3 the image, Step 4 the reading.\n\nVerifying the report is what found the thing worth finding. Its recomputable claims all held: the coordinate-ring proof that the stabilizer is closed, the $\\mathbb{G}_m$-on-$\\mathbb{G}_m$ example showing $(K/K_x)(R)\\neq K(R)/K_x(R)$ so that sheafification is load-bearing, and the translation action of $\\varinjlim_n\\mathbb{G}_a^n$ whose orbit is dense and not open, so that local closedness of an infinite-dimensional orbit is a theorem and not a formality. Two of its recommendations were refuted — the geometric input it wanted split into its own node is already the black box [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html)(a), and the placidity it warned against inferring is a different node's clause, disposed of one phase earlier. What survived is a scope fact neither the report nor the repository had stated plainly: reading 3 ranges over every $L^+G$-orbit of $LX$, while the provenance recorded for it — Sakellaridis–Wang Prop. 2.3.7 with Lem. 2.3.10 — is stated over the nondegenerate locus $\\mathsf{L}^\\bullet X$. For non-homogeneous $X$ those differ, and $X=\\mathbb{A}^1$ under $\\mathbb{G}_m$, which is in the standing class, has the orbit of $0$ in one and not the other.\n\nThat is a gate the repository does not have and cannot easily get: the link resolves, the entry exists, and the source says something true and adjacent. Only reading the source against the scope of the claim it is offered for finds it, so it is written down as [I20](../pipeline.html#4-invariants) rather than automated. No node was commissioned — the missing claim is crisp but unprovable inside the closed world by construction, since the reading defines its answer, and a node quoting the reading would reproduce the tautology one level down. It is [P18](../../../blueprint/priorities.md) instead, naming the user action ADR 0028 already left open: the SW22 key in `refs.bib`.\n\nThree invariants were stale and are corrected: I5 and I18 still called the generated packet `node_prompt.md` after [ADR 0032](../decisions/0032-a-nodes-own-file-is-named-for-the-node.html) renamed it `<id>_prompt.md`; I8 still said `blueprint_site/` is untracked after [ADR 0033](../decisions/0033-the-generated-site-is-tracked-again.html) tracked it again; and I13 still described the single Baconian ratio that [ADR 0014](../decisions/0014-confidence-is-three-signed-channels.html) replaced with three signed channels. I19 was also stranded at the bottom of §9 among the failure modes, and has been moved into §4 where the invariants live. Nothing broke while they were wrong, which is the whole reason §7 of `/update` rereads this file every run.\n\n## Phase 14 · 2026-08-05 — evidence says what it matches, and the panel says what the node claims\n\nTwo user-directed changes, both about the same thing: a readout that shows the right thing at the top.\n\n`/examples` was returning sound work that could not be read. [Q1-L3](../../nodes/Q1/Q1-L3/examples.html) is the case that forced the record — five entries, every citation resolvable, every hypothesis discharged, and four of the five not instances at all but decategorified analogues, reached through a function-theoretic dictionary the file stated once in its header and then never used again. Nothing said which of the node's three clauses an entry spoke to. The file was rewritten against [ADR 0036](../decisions/0036-an-example-says-what-it-matches.html): the dictionary lifted into a labelled paragraph with its BZSV §7.5.3 source and an explicit note on what it drops, each entry labelled *instance* or *analogue* in its heading, a `**What it matches.**` field on each naming the clause, the correspondence and what it does not reach, and a closing `## Coverage` paragraph taking the union. No source, result number or `EVIDENCE:` line changed — the sourcing was already sound and the correspondence was the whole of what was missing.\n\nTaking that union is what produced the finding. Clause (ii) — the nonvanishing of $\\overline{i}_{\\lambda,*}\\omega$ on every $\\Lambda_X^+$-stratum — is matched by exactly one entry, the group case, where it collapses to the standard nonvanishing on a Schubert closure. Nothing reached through the dictionary can match it and nothing ever will: a decategorified statement has no object supported on a positive-codimension stratum, which the Tate entry demonstrated (the closed orbit $\\{0\\}$ supports no locally constant function) without anyone drawing the consequence. So the literature channel of that node's confidence is weighing (i) and (iii) and is silent on (ii), which is where the node is new. The pipeline had no mechanism for noticing that; [I21](../pipeline.html#4-invariants) is now that mechanism, and the orchestrator lists the matchable pieces itself before dispatching, because an agent that writes its own yardstick finds that everything fits.\n\nThe second change is the graph panel. Clicking a node opened the statement, then the whole append-only `## History` — dated bullets that [ADR 0027](../decisions/0027-a-node-carries-its-history.html) made grow with every `/update` and `/prove` run, sitting between what the node claims and the dependency list, on a panel whose one job is to say what the node claims. It is now dropped from the panel *and* from the mounted payload ([ADR 0037](../decisions/0037-the-node-panel-carries-the-statement.html)), reached through the Pages list where the node page has always linked it. The root DAG page carried 72 dated bullets and fell from 159 KB as committed to 123 KB. The rule generalizes — a readout shows the statement and links the record, the portable `<id>_prompt.md` being the one exception since it has nothing to link to — so it went into node creation at the other end too: the `/decompose` packet and the lead-researcher now say why the split between `<id>_node.md` and `<id>_history.md` matters, which is that prose in the node file is prose rendered where only the claim belongs.\n\n## Phase 15 · 2026-08-05 — a second question, and the machinery that had assumed one\n\n[Q2](../../dag.html) is the first question the repository has had besides Q1, cut out at the user's direction from an input passage. Its content is the half of Q1 that is geometry rather than sheaf theory: granting the recollement package (H1)–(H3) of [Q1-L5](../../nodes/Q1/Q1-L5/index.html), for which $X$ does every standard object $i_{\\lambda!}E_{\\lambda,a}$ of a stratum lie in the Satake subcategory? Eleven nodes — seven lemmas, of which one is `evidence`, and four examples.\n\nThe node that makes it a question rather than a restatement is [Q2-L1](../../nodes/Q2/Q2-L1/index.html), which collapses Q1-L5's two conditions into one. Two things were sharpened against the input passage while transcribing it, and both are recorded in the nodes' histories rather than here. Q2-L1 was stated under (H1) alone: both directions use only the adjunction, its section and continuity, and (H2)–(H3) enter only when the two conditions are cashed in for the equality, which is Q1-L5's business. [Q2-L3](../../nodes/Q2/Q2-L3/index.html) asks for a well-founded closure order where the passage asked for per-closure finiteness — finiteness is strictly stronger, it is false in the standing class ([Q1-L5-e4](../../nodes/Q1/Q1-L5/Q1-L5-e4/index.html)), and well-foundedness is all a minimal-counterexample induction consumes. That is what leaves room for [Q2-L4](../../nodes/Q2/Q2-L4/index.html) and its $\\mathbb{A}^1$ model [Q2-e2](../../nodes/Q2/Q2-e2/index.html) to reach the infinite-boundary case at all.\n\nWhat the question is really for is [Q2-L2](../../nodes/Q2/Q2-L2/index.html)(ii): at $G_\\lambda=\\mu_2$ the dualizing object is right-orthogonal to the sign representation in every shift, so it does not generate the stratum. [Q1-L6](../../nodes/Q1/Q1-L6/index.html) assumes clean costalks against $\\omega$ at every stratum, and that hypothesis therefore reaches only the trivial-local-system block. Q2 states the mathematics; revising Q1-L6 is `/update`'s to do and was not done here.\n\nThen the machinery. Three places had hard-coded the number one and none of them failed loudly ([ADR 0038](../decisions/0038-one-graph-per-question.html)). The graph's scope card was `questions[0]`, so Q2's eleven nodes hung under a card titled *Q1* showing Q1's conjecture — including on Q2's own node pages. The `BEGIN INDEX` / `END INDEX` regex required a line between the markers, so the empty pair that `/decompose` instructs the lead-researcher to write matched nothing and the first build generated no bullets for the new question, reporting success. And the dag smoke test's stub DOM was a fixed id list whose page walk matched the literal name `dag.html`, so a header element added for a second question crashed all 56 pages, and a second root graph would not have been walked.\n\nThe fix is one graph per question with a pill switcher in the bar, and the two gates taught the same shape. It is worth writing the general form down, because it is the second time in two phases that a readout was wrong in a way nothing checked: **the first of anything is not the shape of it.** Two of the three places that assumed one question were gates.\n\n## Phase 16 · 2026-08-05 — the two questions back on one canvas\n\nThe user's answer to Phase 15's layout was that they wanted to see Q1 and Q2 *together*, with the arrow from Q2 to Q1 drawn. So [ADR 0038](../decisions/0038-one-graph-per-question.html) is superseded one phase after it was accepted, and the reason is worth keeping: it had diagnosed the bug correctly — the scope card was `questions[0]` — and then fixed it at the wrong layer. The card being singular was the defect; the repair made the *reader* singular, one question at a time, which is strictly less than they had, because the two questions are related and the relation is the interesting part. Q2 exists to supply Q1.\n\n[ADR 0039](../decisions/0039-one-graph-for-every-question.html) puts them on one canvas. Each question is a block — its own spine, its own branches, its own card on top — and the blocks tile left to right with a lane between them wider than the shift an opened branch can cause. A node rises to *its own* question's card, which is 0038's bug fixed where it lived. `dag-q2.html` is gone; the pills became jumps rather than page loads, and a scope card is addressable the way a node is, so `dag.html#__q2` is a link anyone can send. The cross-question arrow comes from a new **Feeds.** paragraph in the question section: one `#q<n>` link per target, one thick accent arrow per link. The relation stays between the *questions* — no node gained a `depends-on` in another question, so the transpose check, the tallies, the confidence aggregates and the proof chain are all untouched, and each question stays separately auditable.\n\nThree smaller things the same request named. The side panel is now dragged to width by a grip on its left edge, persisted, double-click to reset: a question's framing is the longest prose on the site and 400px was a guess. The `⌂` and `☰` in the bar became `⌂ DAG` and `☰ pages`, because a glyph you have to hover over to identify is not a shortcut. And node statements are now gated for shape ([I23](../pipeline.html#4-invariants)): a node file may hold `## Statement` and `## Decomposition` and nothing else, and a paragraph may declare at most one bolded condition label, so hypotheses arrive one per paragraph with air between them. Enforcing it found `Q1-L4-L1_node.md` carrying a five-paragraph `## Scope` section — commentary rendered on the node page above the dependency list — which is now the dated history entry it always was.\n\nWhat this phase cost, and it is the same lesson a third time: **a tree that is generated in full is only generated in full if what is no longer generated goes away.** Renaming `dag-q2.html` into a section of `dag.html` left the old page on disk, tracked, reachable, and disagreeing with the blueprint — and the build printed success. There was no orphan removal anywhere in the generator, and there had never needed to be, because until this phase no generated page had ever stopped being generated. The build now deletes what it did not write and prunes the empty directories; `--check` reports an orphan as an inconsistency.\n\n\n## Phase 17 · 2026-08-05 — the number shows its working\n\nA request in two halves: make a node file be nothing but its statement, and make the\nconfidence on the card something a reader can follow back to the record it came from.\n\nThe first half was mostly already law. Invariant I23, written the phase before, says a\nnode file carries the field block and `## Statement` and nothing else — and it had a\nhole in each of its two rules. The heading rule only looked at `##`, so\n[Q1-L5](../../nodes/Q1/Q1-L5/index.html)'s `### Why condition (2) is there` — 466\nwords of motivation, a two-stratum counterexample and an open question, added to the\nstatement at the user's request one day earlier — sat inside the claim and rendered as\npart of it. It has moved verbatim into the node's history, in a dated entry that says\nwhy. The condition rule enumerated roman numerals, single letters and digits, and so\nmatched none of `**(H1)**`, `**(H2)**`, `**(H3)**` — the form the node files use most,\na letter followed by a digit. Both rules now match the shape rather than the vocabulary,\nand the second distinguishes a condition *declared* (heading its own sentence) from one\n*mentioned* (\"assume only hypothesis **(H1)** of Q1-L5\"), because mentioning another\nnode's hypothesis is exactly what a node is supposed to do and the first widening failed\n[Q2-L1](../../nodes/Q2/Q2-L1/index.html) for doing it.\n\nThe second half is [ADR 0042](../decisions/0042-confidence-shows-its-working.html). Clicking a\nnode now gives `Statement`, `Confidence`, `Pages` — and the confidence is decomposed: one\nrow per channel, what it scored, what it contributes, and a link to the record it scored.\nBuilding it is what found the bug. `support()` read the last critique round's flaws as\n*standing* whatever that round returned, but a node reaches `proved` precisely by its last\nround returning `PASS`, so on every proved node in the repository the final referee's\ndisposed-of findings counted against the claim. `Q1-L4-L3` passed its one round having\nraised and disposed of seven MINOR flaws and scored $0.11$; a node whose referee raised\nnothing scores $0.50$. **The harder the last referee looked, the worse the claim did** —\nthe exact inverse of the eliminative reading the function's own docstring states. Fixed,\nalong with `weakest([])` scoring an empty set of nodes at $+100\\%$. Every proved node's\nnumber rose; the repository aggregate did not move, because it is held at $-12\\%$ by an\nunproved node, which is the weakest-link rule behaving correctly.\n\nWhat this phase cost, and it is worth naming: **a derived number nobody can audit is a\nnumber that stays wrong.** The verdict bug survived every build since ADR 0014 — through\na gate suite that grew to nine sections, a smoke test over every graph page, and a\npriority panel that reads the same confidences — because nothing in the repository ever\ndisplayed the arithmetic, only its result. Ten minutes of writing the display found it.\nThe eight defects ADR 0042 does *not* fix are listed there for the same reason: the next\nreader should inherit them written down rather than rediscover them.\n\nA second cost, and a new one: this phase ran **concurrently with another session** in the\nsame working tree, which was building the key-example register and `/check-goal`. Both of\nus edited `tools/build_dag_site.py`; both of us claimed ADR 0040, and the number moved\nunder a `grep` between reading it and writing it. Renumbering to 0042 was cheap; noticing\nwas not. A repository whose conventions are \"next free number\" and \"one canonical\ngenerator\" has no locking, and two agents in one tree will collide on exactly those two\nthings.\n\n---\n\n## Phase 12 · 2026-08-05 — the bench, and the goal check that reads it\n\nThe tree had sixteen example nodes for Q1 and no way to say which of them settled\nanything. `Q1-e1` (the group case), `Q1-e4` (Godement–Jacquet) and `Q1-e5` (the symplectic\nperiod) all read as \"here is a case where the unramified conjecture is a theorem\", and\nnothing on the page distinguished the one that makes Q1 vacuous from the one that is about\nthe dual side from the one that is a real positive.\n\nThe distinction turned out to be sitting in the sources, unread. **BZSV Conjecture 7.5.1\n(p. 161) puts the whole automorphic category on the left**, and §7.5.3 (p. 163) draws the\nconsequence in as many words — \"all sheaves on $X_F/G_{\\mathcal{O}}$ can be generated from\nthe basic object through the action of Hecke functors\". The manuscript's\n`assum:intro`(c) puts the Satake subcategory there instead. **Q1 is exactly the gap between\nthe two forms**, which means \"the unramified conjecture is known for $X$\" is not one fact\nbut two, and only one of them bears on the question.\n\nDevalapurkar makes the point against us in print. His Theorem 1.1.10 (p. 7) proves BZSV\n7.5.1 for every rank-1 affine homogeneous spherical variety — a large family — and footnote\n5 on the same page says the left-hand side is \"replaced by a certain subcategory defined\nusing the action of $\\mathrm{Shv}^c_{G(\\mathbb{C}[[t]])\\times G(\\mathbb{C}[[t]])}$\". That\nis the Satake subcategory. A large family of cases, none of them a positive for Q1, and the\nregister would have carried all of them as positives if the footnote had gone unread.\n\nSo: `blueprint/key_examples.md`, twelve entries, each closing on a machine-readable `KEY:`\nline, each saying what is proved *with the category that actually appears on each side*,\nwhat it reaches, what it does not, and the page it was read on. Six positives (K1–K6, one\nof them — K7, Travkin–Yang — carried as `adjacent` because the paper is not on disk and its\ntheorem has not been read), one `weak`, one `degenerate`, two `out-of-class`, one\n`negative`. `/check-goal <id>` specializes a node's statement to each entry and writes\n`goalcheck.md`; the verdict is a **ceiling** and never a boost, because surviving a bench is\nthe absence of evidence against a statement rather than evidence for it. ADR 0040.\n\nTwo things fell out that were not the point of the exercise. `Q1-e7`, *Group case: equality\nholds*, was removed at the user's direction: it is true, and true because $\\mathrm{IC}_0$ is\nthe monoidal unit, so a *false* node statement would pass there just as happily. It is now\n`K9`, `KEY: degenerate`, recorded so nobody re-adds it. And `exam:hyperspherical_duality`(2)\nattributes BFGT Theorem 3.6.1 to $X = M_n$, while the category BFGT realize is\n$D_{G_{\\mathcal{O}}}(\\mathrm{Gr}\\times\\mathcal{V})$ — the loop quotient of\n$\\mathrm{GL}_n\\times\\mathbb{A}^n$, the *dual* side, which is also how BZSV §7.6.5 list the\ncase. For the unramified conjecture the two are one statement about a dual pair; for Q1 they\nare not, because Q1 asks which side's automorphic category is exhausted. That is `P19`, and\nit wants `/update`, not this session.\n\nWhat this cost: the register is only as good as its page reads, and there is no way to\nautomate that. Seven of the twelve entries changed shape between the first draft and the\nlast because the theorem said something narrower than the survey said it said. The one entry\nwhose source is not on disk says so in its own text and is not usable — which is the only\nhonest thing to do with it, and the reason `K7` is `adjacent` rather than `positive`.\n\nOperationally: this ran **concurrently with another session** in the same tree, which had\nalso claimed ADR 0040 and had left `tools/build_dag_site.py` holding an f-string that needs\nPython 3.12 — every gate in the repository was dead on this machine until it was fixed. Two\nsessions, one generator, no locking; the same finding as last phase, arriving a second time\nin a different disguise.\n\n---\n\n## Phase 18 · 2026-08-05 — the same word in six places, and a budget that was being filled\n\nA full `/update` walk of both questions and all fifty-four nodes, run on two external referee\nreports, one per node, on `Q1-L4-L1` and `Q1-L4-L2`.\n\n**Both reports confirmed the mathematics and asked for reorganization.** Neither found a false\nclaim. What they found was that the two nodes prove more than they say and say less than they\nmean: `Q1-L4-L2`'s Steps 2–7 never touch $X$, $\\lambda$ or sphericality, so they hold for *any*\nclosed subgroup scheme of $L^+G$ with vector-group transition kernels — a theorem gained, taken\nas a new general node the target specializes rather than a statement widened in place (ADR 0019\n§3) — and `Q1-L4-L1` had already been split at its own seam that morning. Six nodes commissioned:\nthree sub-lemmas under `Q1-L4-L1`, one under `Q1-L4-L2`, and two example nodes carrying what the\nreports contributed that is not a theorem — the two nearby statements that are *false* (the\npointwise quotient is not the sheaf quotient; an infinite-dimensional orbit image need not be\nlocally closed) and the characteristic-$p$ subgroup $x\\mapsto u(x^p+xt)$ of $L^+\\mathrm{SL}_2$\nwhose level-two transition is Frobenius.\n\n**The walk earned its keep on one word.** `Q1-L4-L2`(a) said the jet transitions are *surjective*,\nwhich on $R$-points they are not; corrected to *faithfully flat*, which is what its own Step 4\nconcludes. Then the walk found the same word standing in `Q1-L4-L4`'s **hypothesis** — the node\nthat consumes exactly that presentation — and in `Q1-L4-e1`, so the two ends of the joint\n`Q1-L4`'s decomposition composes them at had quietly stopped matching. Likewise the symbol\n$\\mathrm{ev}_0$, deleted from `Q1-L4-L2` as undefined in an earlier `/update`: still standing in\nthree example nodes and in the shared `examples.md`. **A correction applied at the site the\nreferee flagged is not a correction applied to the repository** — that is what a full walk is\nfor, and nothing cheaper would have found it.\n\nA third defect the walk found on its own: `Q2-L2` named its group \"the reductive quotient of the\nstabilizer by its pro-unipotent radical\", which is neither of the two groups `Q1-L4` produces —\nits clause (ii) $G_\\lambda$ is that quotient and is *not* reductive (`Q1-L4-e3` exhibits a\nparabolic), its clause (iii) $G_\\lambda^{\\mathrm{red}}$ is reductive and is a further quotient.\nThe clauses below it did not move, and that is why it survived: $R_u$ is connected in\ncharacteristic $0$, so the two share a component group and connectedness — the whole content of\nthe node — cannot tell them apart.\n\n**The budget was being filled, not nearly missed** (ADR 0043). The four `Q1-L4` write-ups measure\n888, 891, 896 and 896 against a ceiling of 900. Compression is local and splitting needs the\nlead-researcher, so authors compressed; the gate measured the symptom it was built to catch and\nthe cheap route around it was to write worse. Worse still, a `$$` on its own line counted as a\nword, so pulling a definition into a display cost two — the gate that measures length was taxing\nthe rule that makes mathematics readable. Delimiters no longer count; a step is now one claim;\nsplitting is the first response to a full page, not the last.\n\n**Two tool bugs, both surfaced by the same new shape.** These are the repository's first depth-3\nnodes and its first *cross-branch* dependency (`Q1-L4-L2` → `Q1-L4-L1-L1`). The edge parser read\nnode ids out of the whole `depends-on` field, link **targets** included, and a target that crosses\nbranches carries its ancestors' directory names — so `[Q1-L4-L1-L1](../Q1-L4-L1/…)` also matched\n`Q1-L4-L1`, inventing an edge to a node that omitted it from `required-by` and failing the\ntranspose check against a phantom. Ids are now read from link text alone. Separately, the\nconfidence *fill* on a card was the same hue as the ink the percentage is set in, so a 73% node\ncame out near `rgb(102,160,128)` — a slab rather than a tint; the fill now has its own brighter\nhue in the light theme.\n\n**What the first `/check-goal` in the repository actually said.** `Q1-L4-L2` came back\n`consistent`, and the verdict is the least interesting line in the file. Every register entry\nlives in characteristic $0$, where a stabilizer is automatically the points of a smooth model, so\nthe bench never stresses the one fragile clause; and `K1` — Iwasawa–Tate, the example everyone\nreaches for — is *blind* to the node, both its strata being the trivializing extremes\n$K_\\lambda = 1$ and $K_\\lambda = K$. A `consistent` that means *the bench has no purchase* is\nworth exactly as much as the ceiling it imposes, which is none.\n\n**What it cost, and the decision it leaves open.** Decomposing two `proved` nodes drops their\nconfidence to the new `open` sub-lemmas: `Q1-L4-L2` reads 0%, `Q1-L4-L1` +25%, with a PASS on the\nrecord and a draft that still argues the frozen statement line for line. The edges are true and\nthe drop is not a bug, but it conflates what a *future* proof may invoke with what the *existing*\nproof rests on. Whether the weakest-link cap should bind on a **silent** dependency at all — or\nonly on a negative one, as ADR 0014 already rules for the three channels — is left to the user at\nP21 rather than decided here.\n\n---\n\n## Phase 19 · 2026-08-06 — a question states a problem, and an abbreviation is not a name\n\nThe user read Q2 back and said three things: the nodes should be cleanly stated,\nthey should not invent notation, and \"versions, and route status\" should go. All\nthree turned out to be one complaint about the same habit — writing down a fact\nthat is stored somewhere else — and the run that followed found the habit in\nplaces nobody had looked.\n\n**Route status was already wrong when we deleted it.** Q1's paragraph, dated\n2026-08-04, still called `Q1-L4` the weak link. Every one of its four children\nhad been proved since. The generated index block ten lines below said so\ncorrectly. That is the argument for deleting the paragraph rather than\nrefreshing it: a copy of a fact that moves is wrong as soon as it is written,\nand nothing forces a route paragraph to be re-read when a status changes.\n*Versions.* went the same way — the version label says which claim is on the\npage, and git stores the diffs. [ADR 0044](../decisions/0044-a-question-states-a-problem-not-its-route.html).\n\n**The notation half was not Q2's fault.** Q2 coined $\\mathcal{A}_X$, but Q1 had\ncoined $\\mathcal{C}$ three times first, and Q1-L2 called the same Satake\nsubcategory $\\mathcal{A}$ — one object, two names, across two questions, and\nnobody had noticed because no gate looked. The first repair was to give the\nsymbols appendix homes. The user then ruled the other way, and was right: the\nfix for an auxiliary abbreviation is to delete it, not to document it. What\nreplaced $\\mathcal{A}_X$ is $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$\n— no new symbol at all, just the manuscript's own `^{Sat}` convention applied to\na category that already had a name, and parallel to the small\n$\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ it must be distinguished from.\n\n**What this cost us to learn.** Three things, all of them from getting it wrong\nfirst.\n\n*Expanding a definition is not the same as removing it.* The intermediate\nattempt substituted $\\mathcal{A}_X$'s full generation bracket inline. Q2-L1's\nclause (ii) became a 250-character display containing the bracket twice, and was\nharder to read than the version with the abbreviation. Naming an object beats\ninlining its definition; the problem was never the symbol's length but that a\nreader had to learn it before reaching a claim.\n\n*A gate written to catch a habit will catch the legitimate case too.* The first\nversion of the abbreviation check banned $\\mathcal{C}$ outright and failed eleven\ncorrect Q1 lines: $\\mathcal{C}$ is the bound variable of the abstract lemmas\nQ1-L2-L2 and Q1-L2-L4, and the ambient placeholder in `def:generation`'s own\nbracket. The check had to be narrowed to *binding* a short symbol to a category\nthat already has a name. Separately, section 8 was flagging root-system pairings\n$\\langle\\check\\alpha_1,\\alpha_2\\rangle$ as generation brackets with no ambient —\nit fired on the very $A_2$ pairings that refute Q2-L6(i), which is how we found\nit.\n\n*The presentation pass finds mathematics.* Six checkers were sent at the six node\nstatements with a prose paragraph over ninety words, told to change no claim.\nOne came back with the run's best find: Q1-e6 inferred that the\nconnected-stabilizer clause **fails** from the **presence** of a type-$N$ root,\nwhile the appendix note it cited gives \"no type-$N$ roots\" as a criterion under\nwhich the clause **holds**. The node was asserting a sufficient condition's\nconverse, in a file whose whole job is to delimit the standing class. A referee\nhad never seen it because example nodes are not refereed.\n\n**Q2 was then proved, and the proving refuted one of its nodes.** Six write-ups,\nall inside budget. Q2-L1 closed inside the existing closed world and passed at\nr2. The other five ended in honest GAPs, which is the outcome the instructions\nasked for and the more useful one: they name exactly which appendix entry is\nmissing, and one of them — ind-proper pushforward — was verified on the page in\nRaskin's Table 1 while the prover was writing.\n\nQ2-L6 clause (i) is **false**. It claimed every covering relation of the closure\norder is a simple-parahoric move; at $X = \\mathrm{SL}_3$ under\n$\\mathrm{SL}_3\\times\\mathrm{SL}_3$ neither simple coroot is dominant, their sum\nis, nothing dominant lies between, so $0\\lessdot\\check\\alpha_1+\\check\\alpha_2$\nis a covering relation whose difference is not simple — and no simple-coroot move\nleaves the base stratum at all. The counterexample was recomputed from the Cartan\nmatrix before being adopted, per `/update` §2, and the arithmetic is three lines.\nThe rank-one structure the clause wanted is real; it lives on the Iwahori orbits,\nnot the $K$-orbits, which is a different argument and so a new node rather than a\ncorrection.\n\n\n**`blocked` is gone, and a refutation gets its own verdict.** Three decisions in one\nrun, all of them about the pipeline rather than the mathematics.\n\nThe gate first. `/prove` refused to run on a node whose dependencies were not all\n`proved`, and on the day this was written that refusal held six of the eight nodes under\nQ1-L5 behind one unproved Q1-L4 — the whole subtree unavailable, with exactly one\nadmissible action in Q1. The refusal was never sound: a dependency contributes its\n*statement*, and a statement is as usable before it is established as after. What the\ngate was really protecting is that a write-up must not pass off an assumption as an\nestablished fact, and that is a disclosure requirement. So the packet now splits its\nFacts into established and assumed, the write-up names which assumed facts it used, and\nthe confidence cap — which already bounded a node by the weakest node beneath it — does\nthe measuring the gate was pretending to do. `ready` survives; `blocked` does not\n([ADR 0045](../decisions/0045-there-is-no-blocked-node.html)).\n\nWhat made the removal safe to do was noticing that we had no word for the other thing.\n`/prove` could end `proved`, `failing` or render-failure, all three about the *write-up*\n— and the case the journal entry directly above this one describes, Q2-L6 clause (i)\nbeing flatly false, had to be recorded as `failing` and shown with the same amber\n**needs update** chip a node gets when its statement was merely revised. Two opposite\nsituations, one signal. `VERDICT: REFUTED` now names the case where the statement is\nfalse as written, drives a red **needs change** chip, and opens a branch that reads the\nliterature before believing the refutation, quotes the false statement verbatim into the\nnode's history, and *suggests* a correction it is not allowed to adopt — a `## Statement`\nis `/update`'s and nobody else's ([ADR 0046](../decisions/0046-a-refuted-statement-needs-a-change.html)).\n\nThird, `/decompose` now sends every node it creates to an example-finder before it\ncommits ([ADR 0048](../decisions/0048-a-decomposition-is-grounded-node-by-node.html)). The\ncost that motivated it: `/examples` has existed since 0006 and a handful of 62 nodes\ncarry an `examples.md`, because the moment it is most useful — a statement just cut,\nbefore a dozen links point at it and I2 freezes it — is the moment nobody is thinking\nabout it. An honest empty hand still passes; an invented example still does not.\n\nTwo things this cost. The CSS class `open` was already taken by the expanded-card state,\nwhich had to be renamed `opened`, and `tools/dag_smoke.js` asserts on that class in three\nplaces — the site built clean and the render gate failed on 63 graph pages until those\nwere changed with it. And the run collided with a concurrent session on ADR number 0047,\nwhich is why this one is 0048: two sessions sharing a working tree can both pick the next\nfree number, and neither sees the other until the file appears.\n\nAn example node is a proposition, and the Q2 bench was decomposed\n([ADR 0047](../decisions/0047-an-example-node-is-a-proposition.html)). ADR 0021 rule 2 froze\nexample and analogy nodes as leaves — \"an e/a segment is terminal … a corroboration that\nneeds its own decomposition has outgrown the class\" — and Q2-e4 is the case that breaks\nit: five ordered computations in one statement, each certifiable on its own, and the only\nescape 0021 offered was promotion to a lemma, which would have put one variety's orbit\ncombinatorics into the chain the main theorem rests on. So the terminal rule goes, and\n`Q2-e1-L1` and `Q2-e1-e1` are now legal ids. What replaces it is a role rule: nothing\nbelow an e/a node may be `proof`, so no aggregate over the proof chain reaches into an\ninstance and no computation in one variety caps a question by weakest link.\n\nTwo rules came with it, and both were the user's diagnosis rather than mine. An example\nnode **quotes** the claim it instantiates instead of linking it, because a node whose\nwhole use is to be read beside a general claim must show that claim. And it opens on its\n**polarity** — `positive`, `negative`, `boundary`, `normalization`, or the conditional\nitself where the answer is unknown. All four Q2 examples had been written as tasks: \"the\ntwo questions to settle\", \"five things are to be extracted\". A task has no truth value,\nso nobody could tell whether $\\mathrm{GL}_2/\\mathrm{O}_2$ was expected to confirm the\nconjecture or to kill it.\n\nWhat the decompositions then found is the argument for the rule. Two of the four\npolarities I assigned were wrong within the hour, and both were caught by a child node\ncomputing the thing the parent had assumed. `Q2-e3` is **out of class**, not a boundary\ncase: the generic $B$-stabilizer of $\\mathrm{GL}_2/\\mathrm{O}_2$ is $\\mu_2\\times\\mu_2$, so\ncondition (2) of the standing hypotheses fails and the variety cannot be a counterexample\nto a question that quantifies over the class. `Q2-e4`'s conditional resolved negatively\nat two strata, and the distinction doing the work is one nobody had written down:\nChen–Nadler give the IC as a *summand* of a Hecke translate, while the conjecture asks\nfor a word whose convolution has the closure as its *image*. Under the old rule both\nfindings would have been paragraphs inside a leaf, unprovable and uncitable.\n\nThe same run's `/examples Q2-L6` found the matching defect upstream. The index set\nspherical Hecke convolution reaches is $\\sigma(\\Lambda_T)=\\{\\mu-\\theta(\\mu)\\}$\n(Chen–Nadler Cor. 13.8, verified on the page), and Q2's conjecture asserts its conclusion\nat every $\\lambda\\in\\Lambda_X^+$ while carrying no hypothesis that forces\n$\\sigma(\\Lambda_T)=\\Lambda_S$. `EVIDENCE: gap` rather than `counterexample`, because the\nsplit family where the sublattice is proper is exactly where connected $B$-stabilizers\nfail — the same condition that put `Q2-e3` out of class.\n\nTwo things this cost. The four `/decompose` runs were launched before\n[ADR 0048](../decisions/0048-a-decomposition-is-grounded-node-by-node.html) landed, so their\ntwenty children carry no `examples.md` and want a follow-up pass. And the appendix's\n`used by:` lists are a transpose that nothing recomputes, so twenty new nodes meant a\nhundred-odd missing ids and `--check` failing once per pair; a serialized bookkeeping\npass fixed it, but four concurrent lead-researchers cannot each edit `appendix.md`, and\nthe orchestrator has to do that pass itself afterwards.\n\n## Phase 20 · 2026-08-06 — the panel that ranked what nobody could read\n\nThe user's report was one sentence — the priorities are incomprehensible, the cited\nstatements do not render, stop making code citations — and it named three defects that\nhad been shipping together long enough to look like one.\n\nThe panel is assembled in Python and inserted as HTML, and it `esc()`-ed each row rather\nthan rendering it. Every other surface hands markdown to the one client-side renderer, so\nnothing else on the site had this problem and nothing else would have caught it: the\nrender gate checks that math *parses*, and raw `$\\Lambda_X^+$` sitting in a `<span>` as\nliteral characters parses fine because it is never handed to KaTeX at all. A gate that\ntests fragments cannot test a surface that never produces fragments.\n\nThe second defect is the one worth remembering. A row said `Q2-L6` and nothing else, so\ntriage meant opening files — and the fix was already written down. [ADR\n0037](../decisions/0037-the-node-panel-carries-the-statement.html) had settled that a readout\nshows the statement, for the node panel, a year of ADRs ago; the priority panel was the\nsurface the rule had not been carried to. The claim is *quoted* from the target's title\nat build time rather than typed into the row, so I5 holds and the panel cannot drift from\nthe statement it ranks.\n\nThe third followed from the second: rows had grown to 135 words because each was carrying\nthe context its bare id withheld. Once the claim arrives free, the sentence has only the\njudgement left to make, and all 31 rows fit inside a 50-word gate — the longest is 43.\nCompression, not re-judgement: no row was dropped and none was re-ranked on its content.\n\n## Phase 21 · 2026-08-06 — the layer that had become a list\n\nTwo questions had outgrown their cards without anyone counting. `Q1` carries sixteen direct\nchildren — six lemmas, three analogies, seven examples — and `Q2` thirteen, and the graph\ndraws all of them side by side, because [ADR\n0026](../decisions/0026-sub-lemma-families-fold-into-their-parent.html) folds a node's\n*grandchildren* into a chip and had nothing to say about its children. Sixteen tiles admit\nno order at all: a reader cannot tell the spine from the corroboration, cannot find the node\nthey came for, and gets no help from the layout because there is no layout left. The picture\nhad become a list, and `main_dag.md` was already the list.\n\n[ADR 0050](../decisions/0050-a-node-has-at-most-ten-children.html) caps a container at ten\nchildren and records the remedy: **group**, never delete and never fold. A child written to\nserve one sibling belongs under that sibling, which [ADR\n0047](../decisions/0047-an-example-node-is-a-proposition.html) made possible three commits ago —\nhad the terminal-e/a rule still held, the twenty sub-lemmas the four `Q2` examples gained\nwould have landed in `Q2`'s own layer and it would carry thirty-three children today. The\nrule that unblocked a decomposition turns out to be the rule that keeps the card readable.\n\nThe interesting decision was the severity, and it went against the repository's usual\ninstinct. A hard gate failure was the obvious choice — the standing position here is that an\nunchecked rule is violated within a month — and it is wrong, because of what clearing an\ninherited violation costs. Regrouping moves node directories, a node's id is its path (I12),\nso moving it renames it, and the rename breaks the links its append-only critiques (I4)\nalready wrote at the old id. A gate failing on an inherited shape would block every proof in\nthe repository over a layout problem. So the cap binds in `/decompose`, where it is free —\nnothing is written yet and the lead-researcher has the whole decomposition in hand — and\n`--check` emits a note naming the container, its count and its children. `Q1` and `Q2` will\nprint at every build until a migration the user commissions clears them.\n\nThe rule is not about this argument, so it also went into `/dag-blueprint` as invariant 20,\nwith `max_children` in `blueprint.json` and a warning in that builder. Auditing the skill for\ntopic-dependence while there turned up two real leaks: every generated per-node prompt opened\nby telling the reader \"Mathematics is LaTeX\", whether or not the project had any — now\nemitted only when the node actually contains a dollar sign — and the `theory` kind asked\nafter \"a standard theorem\", now \"a standard result\". The rest of the payload was clean: the\nREADME and the node template are `{{PLACEHOLDER}}`s throughout, and the builder's only other\ntopic word is KaTeX, which is a font bundle rather than a subject.\n\n\n## Phase 22 · 2026-08-06 — the fold that was keyed on the wrong thing\n\nUser-reported, one day after Phase 21 and caused by it: the twenty sub-lemmas the four `Q2`\nexamples had gained were being drawn on **every** graph page, in `Q2`'s own layer. Phase 21\nhad counted the tree and found `Q2` at thirteen; the picture was showing thirty-three,\nbecause the tree and the drawing disagreed about what a child of an example is.\n\n[ADR 0026](../decisions/0026-sub-lemma-families-fold-into-their-parent.html) folds a\ndecomposition into its parent's card and names the children it means: *spine children*, as\nagainst *e/a children, behind the chips*. The builder implemented \"spine child\" as **a child\nwhose role is neither `example` nor `analogy`** — unimpeachable while an e/a segment was\nterminal, since then an e/a node had no children to classify. [ADR\n0047](../decisions/0047-an-example-node-is-a-proposition.html) removed that guarantee and the\ntest inverted without a word: an example's sub-lemmas are examples too, so every one of them\nfailed the role test, was read as a branch of a branch, and inherited the visibility rule for\na question-level branch — *draw it wherever its host is not a spine node* — which is true\neverywhere. The two ADRs were each correct and their conjunction was not, which is the\nfailure mode a role-derived test has and an edge-derived one does not.\n\n[ADR 0051](../decisions/0051-a-decomposition-folds-whatever-its-members-are-rolled.html) moves\nthe discriminator onto the relation the node files already record: a child branches iff it is\nan example or analogy **and** its parent does not list it in `depends-on`. That is\n`CLAUDE.md`'s own sentence read off the disk instead of guessed at — containment without\ndependency going down to an e/a child, an ordinary dependency below one. Two clauses came\nout of it rather than being designed: a branch is drawn only where its host is, closed under\nnesting, since a branch can now host a branch; and a page that opens a branch's subtree draws\nthat branch as a **card**, because the first fix left `Q2-e1` as a chip beside the scope card\nwith its five sub-lemmas stranded at the bottom of the grid, attached to nothing. A chip is\nnot something a family can hang from.\n\nThe root graph fell from 61 drawn cards to 41, and the smoke test's totals across all 83\npages from 2718 cards and 2582 edges to 2158 and 1208 — the twenty were carrying edges on\nevery page. `Q2-e1`'s node page now reads *sub-lemmas: 0/5 proved* where it read\n*corroborated by 5 examples*; the five are its decomposition and were never corroboration of\nit. Nothing on disk moved and no statement changed, which is the tell that this was a defect\nin a readout and belonged in the generator (I8).\n\nAuditing the decision record while there: the index at `process/decisions/README.md` had\ndrifted six rows behind — 0040, 0043, 0044, 0047 and 0050 had never been indexed. Backfilled,\nand it now stands at 50 rows for 50 files. Worth a check in `--check` eventually; a file that\nnothing links is exactly the sort of thing that stays missing.\n\n\n## Phase 23 · 2026-08-06 — the sentence nobody read as a claim\n\n`/update Q1-L3` on an external verdict the user supplied. Its headline was that the node's\nnecessary condition is right; its correction was that one sentence of the setup is not, and the\ninteresting part of the run is not the error but why the error kept.\n\nThe sentence coined $LX^{\\mathrm{sat}}$ as the union of the images of the convolution maps and\nthen said, in apposition, that it \"is a $K$-stable closed ind-subscheme of $LX$\", with the\nind-properness of each $m_\\mu$ as the reason. Ind-properness makes each image closed and says\nnothing about their union: an increasing union of closed sets need not be closed, and the\ntwo-line witness is $\\varinjlim_n\\coprod_{j\\le n}\\operatorname{Spec}k\\to\\mathbb{A}^1$ hitting\ninfinitely many but not all points. Clause (iii) then concluded an equality of *ind-schemes*\nfrom a support argument, which sees only reduced loci and could not have proved it in any case.\n\nIt stood four days and three operators. `/decompose` wrote it. `/examples` gave the node the most\ncareful reading it has had — split the statement into four matchable pieces, put the closedness\ninside piece (S), scored six sources against the four and reported the complement — and carried\nthe closedness along as a piece to *match*, never as a claim to check. A full `/update` walk on\n2026-08-05 re-read the node against its appendix entries and logged it \"examined and unchanged\".\nEach read the numbered clauses asking whether they were true. None read the setup that way,\nbecause it was punctuated as a definition, and a definition is not the kind of sentence that is\nfalse. That is [ADR 0052](../decisions/0052-a-definition-inside-a-statement-carries-no-claim.html) and\ninvariant [I28](../pipeline.html#4-invariants): a coining clause carries no property; the property becomes a\nclause, a labelled hypothesis, or a node.\n\nHere it became a node. The statement now defines $LX^{\\mathrm{sat}}$ as a subset of geometric\npoints and nothing more, clause (iii) is the orbitwise containment Q1 actually consumes, and the\nind-scheme conclusion survives as clause (iv), conditional on a representability claim that is\nnow `Q1-L3-L5` and has to be proved by someone. `/decompose Q1-L3` cut five children in all —\nthe ind-properness and closed images, the Schubert-boundedness of each generator, the categorical\nstep from generators to compacts, the orbit-closure witness, and that closedness question.\n\n**What the run turned up that nobody asked for.** Checking the verdict's last recommendation —\nthat assumption (c) is unused by this node — verified easily, and then did not stop there. BZSV\np. 163, read this run: under their conjecture *\"all sheaves on $X_F/G_O$ can be generated from the\nbasic object through the action of Hecke functors\"*. That is Q1's own question, answered\naffirmatively. Q1's **Setting** put (c) in force. `Q1-L2` is proved and carries the equality\nbetween the renormalized and coherent readings. So the goal question, as framed, assumed a\nhypothesis from which its answer follows on the source's own reading — for four days, in the one\nquestion the key-example bench exists to measure. Q1's **Problem statement** now suspends (c) and\nsays why; `assum:intro` is untouched, being the appendix's and not this operator's, and the\nsuspension waits on the user.\n\n**Cost.** The concurrent-session hazard bit again: a second writer was expanding `Q1-L3` at the\nsame time and overwrote the lead-researcher's four commissioned statements with its own five,\nin id order, while the agent was still running. Nothing was lost that mattered — the five on disk\nare a better cut than the four commissioned, and the parent's reconciliation was rewritten to\nmatch them — but the agent's report described files that no longer existed by the time it\nreturned, and the fix was to read the disk rather than the report. Two appendix entries arrived\nfrom that other run, and one of them, the dualizing object $\\omega_{\\mathcal{Y}}$, defines\n$p_{\\mathcal{Y}}^!(k)$ for *every* prestack with no caveat — which read literally makes\n$\\omega_{K\\backslash\\mathrm{Gr}}$ coherent with full support and contradicts `gr:schubert`(4),\nthe entry `Q1-L3-L2` rests on. Flagged red, not fixed: the appendix is not `/update`'s to write.\n\n\n## Phase 24 · 2026-08-06 — the counterexample that was already on disk\n\n`/update Q1-L3-L2`, run on an external referee passage the user supplied. The passage said the node's clause (1) is false: it claimed every coherent Hecke kernel has support in a **single** Schubert closure, and a single Schubert closure lies in one connected component of $\\mathrm{Gr}$, so a finite direct sum straddling two components refutes it. That is correct, and the torus case makes it visible without any $\\mathcal{D}$-module theory at all.\n\nThe finding worth recording is not the counterexample. It is that **the repository had already found it.** This node's own `/examples` run had written the same torus computation into `blueprint/nodes/Q1-L3/Q1-L3-L2/examples.md`, closing on `EVIDENCE: counterexample`, days before the passage arrived. Nothing happened. The literature channel scored the node negative, the card went red, and there it stopped — because a red card is a number and not an instruction, and nothing in the machinery distinguished \"nobody has looked at this node\" from \"we looked and it is false\". So `--check` now emits a note naming any node whose `examples.md` says `counterexample` and which has no `updates/` entry answering it ([I29](../pipeline.html#i29)). On its first run the note found a second node in the same state, `Q1-L5-L3-L1`, refuted by its own examples and never revised.\n\nThe second finding is about the passage rather than the node. Its proposed repair — clause (1) with a *finite* set of Schubert closures — was **not adopted**, because it is not known to be true either: whether a coherent object on an ind-scheme is bounded at all turns on which reading of $\\mathcal{D}_c$ is in force, and the third note of the $\\omega_{\\mathcal{Y}}$ appendix entry already records those two readings as an **open tension** and forbids leaning on either for $\\mathcal{Y} = \\mathrm{Gr}$. The orchestrator wrote the refutation first and caught this only on reading that entry, which is the whole argument for §2 of the operator: an input passage is a lead, and so is one's own reconstruction. Clause (4) now states both readings and picks neither.\n\nWhat the node lost, something else has to carry. Its closing sentence — every generator of the Satake subcategory sits in a single $Z_\\mu$ — was what `Q1-L3`(i) consumed, and it is gone. `Q1-L3-L6` was commissioned in its place: that the *bounded* kernels generate what all the coherent ones do. Under the colimit reading it is immediate; under the other it carries the whole reduction. Proving it under both is what would make `Q1-L3`(i) independent of a question nobody has settled.\n\n`Q1-L3` now has exactly ten children, which is the cap.\n\n## Phase 25 · 2026-08-06 — the route the orchestrator proposed, and the prover refused\n\n`/prove Q1-L3-L2` on the statement Phase 24 corrected. Two rounds, `VERDICT: FAIL` twice, node recorded `failing` with two named gaps. The mathematics is in the write-up and the critiques; what belongs here is how the run behaved.\n\n**r1's FATAL was a real error, and the gate that caught it was the critic and not the prover.** Step 6 inferred a *maximal* stage from Noetherianness. Noetherian gives the descending chain condition, so minimal members, not maximal ones — the finite subsets of $\\mathbb{A}^1$ are a union-closed family of closed subsets with no maximal element. The prover had compressed that draft three times and never re-examined the inference; compression passes look at length, not at validity.\n\n**Then the orchestrator proposed a repair, and the repair was wrong.** Sending r2 back, I named a route: stages proper, Noetherian, finitely many components, $K$ connected so it stabilises each, Chevalley gives each irreducible $K$-stable component a dense orbit. The prover checked every link and refused the last one — a dense orbit is not automatic, and *here* a dense orbit is exactly the finiteness being proved, so the route is circular. The critic then strengthened the refusal: the step is **false**, not merely unproved, and the finite-type-quotient refinement does not save it, since $\\mathbb{G}_m$ scaling one factor of $\\mathbb{P}^1\\times\\mathbb{P}^1$ has infinitely many orbits and no dense one — a *proper* counterexample, closing the loophole the prover's $\\mathbb{A}^1$ left open.\n\nThat is the entry's point. An orchestrator who hands a subagent a route is handing it an unaudited claim with more authority than the subagent's own, and the only reason it did not become a step in the write-up is that both agents were told to report falsity and stop rather than produce an argument with a hole in it. The instruction earned its place twice in one run.\n\n**What the run bought.** The gaps are now named and separated: clause (1) is blocked by a *mathematical* gap — `bb-raskin-fp-pushforward` needs $q$ ind-finitely presented and Q1-L3-L1(1) supplies only ind-properness, verified on Raskin's Table 1 p. 3 by prover and critic independently — and no widening of `objects:` reaches it. Clause (2)'s second half is blocked by orbit combinatorics, and the critic verified on `mirkovic2007geometric` pp. 4–5 that $\\dim\\mathcal{G}r^\\lambda = 2\\rho(\\lambda)$ together with $\\pi_0(\\mathcal{G}r)\\cong\\pi_1(G)$ close it — the two facts `gr-schubert` explicitly records as **not carried**. So a cheap appendix entry finishes clause (2), and clause (3) needs only the torus sentence on p. 4.\n\n**A caution about the split recommendation.** The prover proposed cutting clause (1) off; the critic showed that wrong, because Step 14 puts clause (3) inside Step 2's declared reading. Cut **clause (2)** off instead: it shares no object, no reading and no gap with the other three. A split proposed by whoever wrote the draft is worth less than one proposed by whoever read it against the draft's own dependencies.\n\nThe write-up ended at 1824 words against a 900 budget, having been told to spend the round on flaws rather than compression. That is the budget rule working as intended — and at double budget it is also the clearest signal the node is two nodes.\n\n## Adding an entry\n\nAppend to the newest phase, or open a new `## Phase n · YYYY-MM-DD — title` when the work changes character. Say what changed, *why*, and what it cost or surprised you; an entry that only restates the commit subject is not worth writing, because `git log` already has it.\n\nPhases are append-only in the same sense entries were: correct a past phase with new text at the end of it, never by rewriting what is there. If something you learn belongs in **What this cost us to learn**, add the bullet — that list is the part of this file most likely to be read.\n\n## 2026-08-06 — the appendix becomes a directory, and two verdicts land\n\nThe appendix had reached 1075 lines and 64 entries in one file, and the split that [ADR 0053](../decisions/0053-the-appendix-is-a-directory.html) records was forced less by reading cost than by a collision: a concurrent session was appending `used by` lines to the very file this session was restructuring. The journal already had the complaint on record — *four concurrent lead-researchers cannot each edit `appendix.md`* — and this is the second time it has cost something. 12,901 links repointed, and the migration's own defect surfaced only because a subagent went looking at an unrelated entry: eight files had swallowed the next section's heading at the split boundary. A script that is 99% right across 383 files leaves eight things wrong, and none of the gates could see them, because a stray `## 6. Categorical actions` at the end of a definition is valid markdown pointing nowhere.\n\nTwo external verdicts arrived on `Q2-L8` and `Q2-L4`, and they failed in opposite directions, which is the useful part. The `Q2-L8` verdict was **right against the referee**: three of the node's five hypotheses were derivable inside the closed world, and [r1](../../nodes/Q2/Q2-L8/critiques/r1.html) had explicitly said two of them were not. r1 was not careless — it asked what follows from (A)–(E) alone, and neither does. It just never used the standing hypotheses the node's own opening sentence invokes. A critic that scopes itself to the numbered hypotheses will miss every redundancy that runs through the framing, and this pipeline puts a great deal in the framing.\n\nThe `Q2-L4` verdict was right against the **node's prose**. The formal statement was correct; the sentence explaining it said the union of the stages is all of the boundary category, which is false, and that a filtered-colimit presentation rules out compatible families, which is exactly backwards — the colimit is *computed* as such a limit. Nothing gated that sentence, because it asserted nothing a gate can check. It sat in a `## Statement` for a day. The lesson is the one [ADR 0052](../decisions/0052-a-definition-inside-a-statement-carries-no-claim.html) had just drawn from a different case: prose inside a statement is read as authoritative and checked as decoration.\n\nWhat came out of the two runs, besides the mathematics: a flag now carries the record it fired on ([ADR 0055](../decisions/0055-a-flag-names-the-record-it-fired-on.html)) — found by noticing that `updates/` was the one append-only trail with no page, so the flag pointing at it had nowhere to point; a question's readout is an argument tree ([ADR 0056](../decisions/0056-a-questions-readout-is-a-tree.html)); and `/update` now recommends where the next piece of work should happen ([ADR 0057](../decisions/0057-update-recommends-a-route.html)), because the operator has just read the node and the user was re-making that call every run.\n\n\n`Q2-L8` was then re-proved against the strengthened statement, `PASS` at [r2](../../nodes/Q2/Q2-L8/critiques/r2.html), and the interesting part is that the direct route no longer existed. The superseded write-up was 882 words with three hypotheses granted; re-deriving them costs about 200 more, and one of them needs vocabulary the node does not declare, so the old argument would have shipped both an overflow and a `GAP`. The decomposition [u1](../../nodes/Q2/Q2-L8/updates/u1.html) commissioned is what made the node provable on one page at all. That is the first case in this repository where the one-page budget did not merely *suggest* a split — it made the unsplit node unprovable inside its own declared world, which is the budget working as designed rather than as a nuisance.\n\nThe referee found a defect the decomposition itself had introduced. `Q2-L8-L1` typesets three clauses under a single \"Assume **(F)**\", and clause (ii)'s consequent *is* (F) — so read as scoped it is vacuous, and the write-up had to read it unconditionally to use it at all. The reading is forced, and the decisive argument is grammatical rather than mathematical: clause (iii) says \"**(F)** is not *asserted* to imply **(B)**\", which under the scoped parse becomes \"(F) implies that it is not asserted that (F) implies (B)\" and has no truth value, so the list demonstrably mixes a theorem with clauses outside the assumption. The hazard is concrete: a later prover of `Q2-L8-L1` reading (ii) as scoped is discharged by proving (i) alone, and nobody ever owns the implication the parent consumes. **Nothing gates the s
