<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>operations_v1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>The operation algebra — v1, superseded</h1><p class="lead">Generated from <code>process/archive/operations_v1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Superseded by [`operations.md`](../operations.html)**, which writes the types dependently, grades the schema, separates the readouts from the commands, and shows the appendix to be a second component rather than a part of the node tree. This version is kept unchanged as the record of the flat-schema reading.\n\n[design doc](../pipeline.html) · [domain-independent form](../problem_generation_pipeline.html) · [journal](../journal.html) · [decisions](../../../process/decisions) · [repo README](../index.html)\n\n`README.md` says how to run the pipeline. [`pipeline.md`](../pipeline.html) says how it is built and why. This file says *what each command is*, as a typed map with a domain and a codomain, together with the laws the maps satisfy and the ones they are gated on.\n\nThe idiom is the one Wang–Buehler use for agentic discovery systems (arXiv:2606.01444): a schema category of artifact types, a state that is a $\\mathbf{Set}$-valued copresheaf on it, provenance as the category of elements, fixed-regime updates as endomaps on states, and *discovery* as a change of the schema itself with explicit transport of what was already established. The reason to borrow it is not decoration. It buys three things this repo did not previously have a name for:\n\n1. an invariant can be recorded as an **absence in the schema** rather than as a rule an agent is asked to follow;\n2. widening the appendix is a **different kind of move** from proving a node, and the difference predicts exactly when an existing proof must be re-refereed;\n3. the operations the pipeline is **missing** become visible as unfilled hom-sets.\n\n---\n\n## 1. The state\n\n### The schema\n\nLet $S$ be the small category whose objects are the artifact types the pipeline may produce and whose morphisms are the declared structural maps between them.\n\n| Type | Realized by | Cardinality rule |\n|---|---|---|\n| $\\mathsf{Ques}$ | a question section in [`main_dag.md`](../../dag.html), or a seed in [`questions/`](../../../blueprint/questions) | one per research question |\n| $\\mathsf{Node}$ | `blueprint/nodes/<id>/node.md` | one per lemma |\n| $\\mathsf{Stmt}$ | the `## Statement` section of a node | exactly one per node, frozen |\n| $\\mathsf{Obj}$ | one entry of [`blueprint/appendix/`](../../appendix/index.html) | one per invocable object |\n| $\\mathsf{Draft}$ | `blueprint/nodes/<id>/<id>.tex` | at most one per node |\n| $\\mathsf{Crit}$ | `blueprint/nodes/<id>/critiques/r<n>.md` | zero or more per node, numbered, append-only |\n| $\\mathsf{Ex}$ | `blueprint/nodes/<id>/examples.md` | at most one per node |\n| $\\mathsf{Prompt}$ | `blueprint/nodes/<id>/prompts/*.md` | zero or more per node |\n| $\\mathsf{Lit}$ | `blueprint/literature/*.md` | one per cited paper |\n| $\\mathsf{Page}$ | one file under [`blueprint_site/`](../..) | one per citable artifact |\n\nThe morphisms of $S$ are the structural maps, not the commands: $\\mathsf{Node}\\to\\mathsf{Ques}$ (which question a node answers), $\\mathsf{Stmt}\\to\\mathsf{Node}$, $\\mathsf{Draft}\\to\\mathsf{Node}$, $\\mathsf{Crit}\\to\\mathsf{Node}$, $\\mathsf{Ex}\\to\\mathsf{Node}$, $\\mathsf{Prompt}\\to\\mathsf{Node}$, and the citation maps $\\mathsf{Draft}\\to\\mathsf{Obj}$ and $\\mathsf{Node}\\to\\mathsf{Obj}$. Composition is inclusion of provenance.\n\n### The state, and the commit as a time index\n\nA **state** is a copresheaf\n\n$$\nI_t : S \\longrightarrow \\mathbf{Set},\n$$\n\nwhere $I_t(\\mathsf{A})$ is the set of artifacts of type $\\mathsf{A}$ present in the working tree, and $t$ is a commit. The repo *is* the state; there is no store outside it. The realized provenance graph is the category of elements $\\textstyle\\int_S I_t$: objects are pairs $(\\mathsf{A}, x)$ with $x \\in I_t(\\mathsf{A})$, and a morphism $(\\mathsf{A},x)\\to(\\mathsf{B},y)$ is a structural map $f$ with $I_t(f)(x)=y$. The lemma DAG is the full subgraph on $\\mathsf{Node}$; `blueprint_site/dag.html` draws it.\n\nLet $K$ be the category of states, with a morphism $\\alpha : I \\to J$ a **refinement**: componentwise injective on artifact identity, so a step may add, annotate or supersede an artifact but may never silently merge two accepted ones. Identity is the `<id>` for a node and the anchor for an appendix entry — a status change supersedes the record and keeps the identity, which is why it is a refinement and not a rewrite.\n\n### The closed world\n\nWrite $A_t := I_t(\\mathsf{Obj})$ for the appendix at time $t$. The premises a draft for node $v$ may invoke are\n\n$$\n\\mathrm{adm}_t(v) \\;=\\; A_t \\;\\cup\\; \\mathrm{deps}(v) \\;\\cup\\; S_{\\mathrm{std}},\n$$\n\nwith $S_{\\mathrm{std}}$ standard mathematics needing no citation. Nothing else, which is invariant I1.\n\n---\n\n## 2. The commands, typed\n\nEach command is a **partial** map on states, defined only where its guard holds. Two signatures are worth separating, and confusing them is the usual source of muddle:\n\n- the **type signature**, $\\mathsf{A} \\rightsquigarrow \\mathsf{B}$, saying what kind of artifact goes in and what kind comes out — this is the answer to \"domain and codomain\";\n- the **state action**, $\\Phi_c : \\operatorname{Obj}(K) \\to \\operatorname{Obj}(K)$, saying how the whole repo changes.\n\nA command that returns a set of artifacts has $\\mathcal{P}(-)$ in its codomain. A command whose output is not determined by its input — every command whose body is a language model — is written $\\rightsquigarrow$ rather than $\\to$; see §5.\n\n| Command | Type signature | Guard (refuses otherwise) | State action |\n|---|---|---|---|\n| `/decompose \"<question>\"` | $\\mathsf{Ques} \\rightsquigarrow \\mathcal{P}(\\mathsf{Node}) \\times \\mathcal{P}(\\mathsf{Obj})$ | context and appendix exist and are non-trivial | adds a question section, $n$ node directories, and any new appendix entries |\n| `/decompose <node-id>` | $\\mathsf{Node} \\rightsquigarrow \\mathcal{P}(\\mathsf{Node}) \\times \\mathcal{P}(\\mathsf{Obj})$ | the node exists; if `proved`, asks first | adds sub-lemmas `<p>-L1`, `<p>-L2`, …; extends the parent's `depends-on`; writes the parent's `## Decomposition`; **fixes** the parent's $\\mathsf{Stmt}$ |\n| `/prove <node-id>` | $\\mathsf{Node} \\rightsquigarrow \\mathsf{Draft} \\times \\mathsf{Crit}^{\\le 3}$ | every dependency is `proved`; the node is not already `proved` | writes one draft, one to three critiques, and one status |\n| `/check <target>` | $\\mathsf{Node} \\rightsquigarrow \\mathsf{Ex} + \\mathsf{Prompt}$, and $\\mathsf{Md} \\to \\mathsf{Md}$ on presentation | tree is clean, or the user confirms | reformats prose; adds exactly one of `examples.md`, `prompts/examples.md` |\n| `/research-status` | $\\mathbf{1} \\to \\mathsf{Report}$ | none | **none** — it is the only command that is a pure observation of $I_t$ |\n| `build_dag_site.py` | $I_t \\mapsto I_t(\\mathsf{Page})$ | none | replaces the whole of `blueprint_site/` |\n\nRead the third column as the domain restriction. `/prove` is not defined on a blocked node; the DAG gate is that partiality, made to fail loudly instead of silently producing something.\n\nTwo entries deserve unpacking.\n\n**`/decompose` has a coproduct domain.** Its domain is $\\mathsf{Ques} \\sqcup \\mathsf{Node}$, and the two summands do genuinely different things — one creates a question and its lemmas, the other refines a lemma into sub-lemmas. The command dispatches on which summand the argument lies in, and asks when the argument is ambiguous (a bare `Q1` is in both). The codomain is the same on both summands, which is what makes \"decompose\" one word rather than two.\n\n**`/check` is two maps sharing a name.** On $\\mathsf{Md}$ it is an endomap constrained to be the identity on content (§4, L9). On $\\mathsf{Node}$ it additionally lands in the coproduct $\\mathsf{Ex} + \\mathsf{Prompt}$ — *found an example* and *recorded that none was found* are two branches of one total map, which is the whole reason a fabricated citation is not the path of least resistance.\n\n### The gates\n\nA gate is a predicate on an artifact, run by the orchestrator and never by the agent that produced the input.\n\n$$\nV_{\\text{gate}} : \\mathsf{A} \\longrightarrow \\{\\textsf{PASS}, \\textsf{FAIL}\\}\n$$\n\n| Gate | Domain | Fails on |\n|---|---|---|\n| DAG | $\\mathsf{Node}$ | a dependency that is not `proved`; a node already `proved` |\n| compile | $\\mathsf{Draft}$ | `latexmk` failing from the repo root, or in the node's own directory |\n| page | $\\mathsf{Draft}$ | `pdfinfo` reporting more than one page |\n| critic | $\\mathsf{Draft} \\times \\mathsf{Stmt} \\times \\mathrm{adm}(v)$ | one flaw rated FATAL or MAJOR |\n| render | $\\mathcal{P}(\\mathsf{Md}) \\times \\mathcal{P}(\\mathsf{Draft}) \\times \\mathcal{P}(\\mathsf{Page})$ | any of eight layers |\n| consistency | $I_t$ | the state disagrees with itself, or `blueprint_site/` is stale |\n| content-preservation | a git diff | a changed status, verdict or anchor; a display line that vanished |\n| example | $\\mathsf{Ex}$ | a bib key not in `refs.bib`; a source with no resolvable identifier |\n\nThe critic gate is the one with an interesting domain: it takes the draft **and** the statement **and** the admissible set, and it has no write access to any of the three. That is the type-level statement of the single most load-bearing configuration choice in the repo.\n\n---\n\n## 3. Two kinds of move\n\nThe distinction Wang–Buehler draw between search inside a regime and a change of regime is not a metaphor here; it is the difference between two of these commands, and it has a testable consequence.\n\n**Fixed-regime updates.** `/prove` and `/check` leave $S$ and $A_t$ alone. They add artifacts inhabiting types that already exist, over a closed world that already exists. Every such step is a refinement $\\delta_t : I_t \\hookrightarrow I_{t+1}$, and no existing artifact changes meaning. Iterating them can never produce an artifact of a type outside $S$ — which is the precise form of \"the pipeline does not decide what is worth asking\".\n\n**Regime moves.** `/decompose` is the only command that enlarges the closed world, by writing new appendix entries. That is a schema extension\n\n$$\nu : S_{A_t} \\longrightarrow S_{A_{t+1}},\n$$\n\nand the question that matters is whether $u$ is fully faithful.\n\n- **Adding an entry** is fully faithful. Nothing already in $A_t$ changes, so transporting the old state along $u$ returns it unchanged, and **every existing proof remains valid**. Widening a node's `objects:` to close a critic's complaint is this case, which is why the `/prove` loop is allowed to do it mid-round.\n- **Narrowing an entry** — a ratified reading that fixes a meaning the entry left open — is *not*. Old drafts were written against the looser reading, so transport does not preserve them and **they must be re-refereed**.\n\nThe repo has run the second case exactly once. [ADR 0001](../decisions/0001-satake-generation-ambient-category.html) ratified the ambient category for the generation operation in the Satake entry; the affected node was re-opened and re-proved, and its critique directory holds `r1`–`r5` in one sequence rather than two directories of three. The append-only numbering rule (I4) exists precisely so that a non-fully-faithful regime move leaves a visible seam. **Every ratification is a candidate re-proof, and the entry, not the node that ratified it, is where the reading has to live** — otherwise a later node reads the old meaning.\n\n---\n\n## 4. Laws\n\nEach law is an equation the state must satisfy after every command, the invariant it realizes, and what enforces it. A law with no enforcement is a suggestion; the last column is the difference.\n\n| | Law | Invariant | Enforced by |\n|---|---|---|---|\n| L1 | $\\mathrm{stmt}\\circ\\Phi_{\\texttt{/decompose}\\ \\mathsf{Node}} = \\mathrm{stmt}$ on pre-existing nodes | I2 statements frozen | `git diff` on the parent's `## Statement` must be empty |\n| L2 | $\\mathrm{cites}(\\mathrm{draft}(v)) \\subseteq \\mathrm{adm}_t(v)$ | I1 closed world | the critic, reading the appendix and nothing else |\n| L3 | $\\mathrm{reqby} = \\mathrm{deps}^{\\mathsf{T}}$ | consistency | `build_dag_site.py --check` |\n| L4 | $\\mathrm{ready},\\ \\mathrm{blocked}$ are functions of $(\\mathrm{status},\\mathrm{deps})$, not components of $I_t$ | I5 stored once | no field exists to write them into |\n| L5 | the round map $\\mathsf{Crit}\\to\\mathbb{N}$ is injective and strictly increasing in $t$ | I4 append-only | the next free number, never the next number |\n| L6 | $\\mathrm{pages}(\\mathrm{compile}(\\mathrm{draft}(v))) = 1$ | I9 one page | `pdfinfo`, degrading to a warning after one retry |\n| L7 | $\\mathrm{gen}\\circ\\mathrm{gen} = \\mathrm{gen}$, and $\\mathrm{gen}$ reads no component of $I_t(\\mathsf{Page})$ | I8 nothing read from a generated artifact | `rm -rf blueprint_site && build_dag_site.py` reproduces `blueprint_site/` byte-for-byte |\n| L8 | $\\operatorname{Hom}_S(\\mathsf{Ex},\\ \\mathsf{Draft}) = \\varnothing$ | I10 examples never justify | there is no field to put it in |\n| L9 | $\\Phi_{\\texttt{/check}}$ is the identity on every frozen field and on display-math content | content preservation | an orchestrator-run diff, not the checker's word |\n| L10 | the page map $\\mathsf{A}\\to\\mathsf{Page}$ is total on citable types and injective | I11 every cited thing has a page | the link layer of the render gate |\n\n**L8 is the payoff of writing this down.** \"Examples illustrate, never justify\" was a rule four documents had to repeat and an agent had to be trusted to follow. As a statement about the schema it is a hom-set that is empty: there is no morphism from an example into a draft, so the question of whether an agent will respect the rule does not arise. The same reading applies to the manuscript — the pipeline has no operation whose codomain is `main.tex`, which is why \"it does not touch the manuscript\" needs no gate.\n\n**L7's second clause is the one that bites.** Idempotence alone is cheap; *reading no page component* is what makes `blueprint_site/` deletable. Any workflow that wants a fact from a generated page is misdesigned, and the fact belongs in the appendix.\n\n---\n\n## 5. What is not a function\n\nFour of the six commands have a language model in the body, and the same input does not give the same output. Writing $\\rightsquigarrow$ for those is not decoration.\n\nThe honest signature is a Kleisli arrow $\\mathsf{A} \\to \\mathcal{P}(\\mathsf{B})$ into the *set of outputs the command might commit*. Determinism is recovered one level up, and only where it is needed: the gates are genuine predicates, so while $\\mathrm{draft}(v)$ is not a function of $v$, the composite\n\n$$\nV_{\\text{compile}}\\wedge V_{\\text{page}}\\wedge V_{\\text{critic}} \\;\\circ\\; \\mathrm{draft}\n$$\n\nis a predicate whose value is recorded and auditable whatever the draft happened to be. **The artifact is not reproducible; the judgement on it is on the record.** That is the whole claim the pipeline makes, and stating it in this form is also stating its limit: `VERDICT: PASS` is a referee report, not a machine-checked proof, and no amount of typing changes that.\n\nThe round cap is the other half. Three rounds per invocation is a *diagnostic* bound, not a probability of success: a node that fails three times is evidence about $\\mathsf{Stmt}$, usually a missing appendix entry or a decomposition that skipped a step.\n\n---\n\n## 6. Unfilled hom-sets\n\nFour operations are absent. Two deliberately, two not — and the table is the point of the exercise, because \"what command am I missing?\" is a question about the schema rather than about the interface.\n\n| Wanted | Signature | Status |\n|---|---|---|\n| branch a **new question** off a lemma | $\\mathsf{Node} \\to \\mathsf{Ques}$ | **missing.** Today: write `blueprint/questions/<slug>.md` by hand, then `/decompose` it. Nothing records that the question came from that node, so the provenance edge is lost |\n| retire or supersede a node | $\\mathsf{Node} \\to \\mathsf{Node}$ | **missing.** `/prove` §1 describes re-opening in prose; there is no command, and a node whose statement turned out wrong has nowhere to go |\n| retire an appendix entry | $\\mathsf{Obj} \\to \\mathbf{1}$ | **missing**, and harder than it looks: it is a regime move that is not fully faithful (§3), so every draft citing the entry must be re-refereed |\n| write into the manuscript | $\\mathsf{Draft} \\to \\texttt{main.tex}$ | **deliberately empty** (L8). A human moves it, or it does not move |\n\nThe first is the one to build next. `/decompose Q1-L1` refines Q1-L1 *downward*, into sub-lemmas that prove it; there is no command for the sideways move, where working on a lemma raises a question the lemma does not answer. The seed directory exists and the workflow exists; what is missing is the edge back to the node that raised it.\n\n---\n\n## 7. Where this leaves the design docs\n\nThree files now describe the pipeline, and they are not redundant:\n\n| File | Answers |\n|---|---|\n| [`README.md`](../index.html) | how do I run it |\n| [`pipeline.md`](../pipeline.html) | how is it built, and what went wrong without each rule |\n| this file | what is each operation, formally, and what is missing |\n| [`problem_generation_pipeline.md`](../problem_generation_pipeline.html) | how do I instantiate the same machine in a repo that is not about mathematics |\n\nIf they ever disagree, `pipeline.md` wins on behaviour and this file wins on types — because a type claim here that the behaviour contradicts is a defect in the pipeline, not in the description.\n";</script>
