<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>references — the reading behind (a) and (b)</h1><p class="lead">Generated from <code>process/references/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[to do](../../todo1.html) · [the open operator](../../todo2.html) · [the deck](../../philosophy/index.html) · [process index](../index.html)\n\n\n---\n\n## For (a) — how the goal of this collaborative system should be redefined\n\n\n| № | Reference | What it supplies | On disk |\n|---|---|---|---|\n| 1 | Rittel, Webber. *Dilemmas in a general theory of planning.* [Policy Sciences **4** (1973) 155](https://doi.org/10.1007/BF01405730) | for a wicked problem the formulation **is** the problem — the sentence the whole framing turns on | [rittel1973-dilemmas.pdf](rittel1973-dilemmas.pdf) |\n| 2 | Thurston. *On proof and progress in mathematics.* [Bull. AMS **30** (1994) 161](https://arxiv.org/abs/math/9404236) | progress is understanding, and a finished proof is not a record of it | [thurston1994-proof-and-progress.pdf](thurston1994-proof-and-progress.pdf) |\n| 3 | Licklider. *Man-computer symbiosis.* IRE Trans. Human Factors in Electronics **HFE-1** (1960) 4 | computers to facilitate *formulative* thinking — the original statement of the goal | [licklider1960-man-computer-symbiosis.pdf](licklider1960-man-computer-symbiosis.pdf) (the DEC SRC memorial reprint, which carries this paper and *The computer as a communication device*) |\n| 4 | Engelbart. *Augmenting Human Intellect: A Conceptual Framework.* SRI, 1962 | augmentation as a framework rather than a slogan; §II is the part to read | [engelbart1962-augmenting-human-intellect.pdf](engelbart1962-augmenting-human-intellect.pdf) (scanned, no text layer) |\n| 5 | Collins *et al.* *Building machines that learn and think with people.* [Nature Hum. Behav. **8** (2024) 1851](https://arxiv.org/abs/2408.03943) | **prior art for the goal** — thought partners that model the human | [collins2024-machines-with-people.pdf](collins2024-machines-with-people.pdf) |\n| 6 | Collins, Jiang, Frieder, … Gowers, Li, Weller, Jamnik. *Evaluating language models for mathematics through interactions.* [PNAS **121** (2024)](https://arxiv.org/abs/2306.01694) | the only measurement of mathematicians actually using these systems | [collins2024-evaluating-lms-mathematics.pdf](collins2024-evaluating-lms-mathematics.pdf) |\n| 7 | Bansal *et al.* *Does the whole exceed its parts?* [CHI 2021](https://arxiv.org/abs/2006.14779) | complementarity is not free, and explanations did not buy it | [bansal2021-whole-exceed-parts.pdf](bansal2021-whole-exceed-parts.pdf) |\n| 8 | Equational Theories Project. [arXiv:2512.07087](https://arxiv.org/abs/2512.07087) (2025) | collaboration at scale with a formal referee; 22M implications | [equational-theories-project-2025.pdf](equational-theories-project-2025.pdf) |\n| 9 | Gowers, Nielsen. *Massively collaborative mathematics.* [Nature **461** (2009) 879](https://doi.org/10.1038/461879a) | the first demonstration that many minds can hold one proof | *no local copy* |\n\n**Three to read first, in this order.** **(1)**, because \"the formulation is the problem\" is what the four-kinds figure means and the paper argues it properly. Then **(5)**, which states this project's goal a year before we did. Then **(8)**, which is what the collaboration claim looks like when somebody finishes it.\n\n## For (b) — what a better UI would be, and what here is unnecessary\n\nThe second half of the question is the harder half, and **(11)** and **(12)** are the two papers that take it seriously: one gives an explicit account of when a visualization is worth what it costs, the other says which level of a design a criticism is aimed at.\n\nSeventeen of the twenty are on disk and open from the table; the three with no local copy are behind a publisher that does not serve a script, and are cited by DOI so that nothing here depends on a link staying up more than it has to.\n\n| № | Reference | What it supplies | On disk |\n|---|---|---|---|\n| 10 | Shneiderman. *The eyes have it: a task by data type taxonomy for information visualizations.* [IEEE VL 1996, 336](https://doi.org/10.1109/VL.1996.545307) | overview first, zoom and filter, details on demand — the graph is one reading of this and not the only one | [shneiderman1996-eyes-have-it.pdf](shneiderman1996-eyes-have-it.pdf) |\n| 11 | van Wijk. *The value of visualization.* [IEEE Vis 2005, 79](https://doi.org/10.1109/VISUAL.2005.1532781) | an explicit cost model for whether a visualization earns its keep — **this is the \"what is unnecessary\" paper** | [vanwijk2005-value-of-visualization.pdf](vanwijk2005-value-of-visualization.pdf) |\n| 12 | Munzner. *A nested model for visualization design and validation.* [IEEE TVCG **15** (2009) 921](https://doi.org/10.1109/TVCG.2009.111) | four nested levels, each validated differently; most UI arguments fail by attacking the wrong level | [munzner2009-nested-model.pdf](munzner2009-nested-model.pdf) |\n| 13 | Heer, Robertson. *Animated transitions in statistical data graphics.* [IEEE TVCG **13** (2007) 1240](https://doi.org/10.1109/TVCG.2007.70539) | when animation helps and when it is decoration — four of the deck's figures are animated | [heer2007-animated-transitions.pdf](heer2007-animated-transitions.pdf) |\n| 14 | Jenny, Stephen, Muehlenhaus, Marston, Sharma, Zhang, Josefsson. *Design principles for origin-destination flow maps.* [Cartography and GIS (2017)](https://doi.org/10.1080/15230406.2016.1262280) | direction is best carried by arrowheads sized to the flow | [jenny2017-od-flow-maps.pdf](jenny2017-od-flow-maps.pdf) |\n| 15 | Holten, van Wijk. *A user study on visualizing directed edges in graphs.* [CHI 2009, 2299](https://doi.org/10.1145/1518701.1519054) | animation is among the best cues for edge direction | *no local copy* |\n| 16 | Misue, Eades, Lai, Sugiyama. *Layout adjustment and the mental map.* [J. Visual Lang. & Comp. **6** (1995) 183](https://doi.org/10.1006/jvlc.1995.1010) | why the animated tree computes its layout once and never moves a node | *no local copy* |\n| 17 | Miller. *Explanation in artificial intelligence: insights from the social sciences.* [Artificial Intelligence **267** (2019) 1](https://arxiv.org/abs/1706.07269) | explanation is contrastive — the foil belongs to the asker, which is why `/why` takes the question as an argument | [miller-2019-explanation-in-ai.pdf](miller-2019-explanation-in-ai.pdf) |\n| 18 | Lipton. *The mythos of model interpretability.* [Queue **16** (2018) 31](https://arxiv.org/abs/1606.03490) | the word names four different properties; a UI has to pick one | [lipton-2018-mythos-interpretability.pdf](lipton-2018-mythos-interpretability.pdf) |\n| 19 | Doshi-Velez, Kim. *Towards a rigorous science of interpretable machine learning.* [arXiv:1702.08608](https://arxiv.org/abs/1702.08608) (2017) | no interpretability claim without a stated downstream task | [doshivelez-kim-2017-rigorous-science.pdf](doshivelez-kim-2017-rigorous-science.pdf) |\n| 20 | Rudin. *Stop explaining black box models for high stakes decisions.* [Nature Mach. Intell. **1** (2019) 206](https://arxiv.org/abs/1811.10154) | a post-hoc explanation is a second model that can be wrong — the argument for showing the audit trail rather than a summary of it | [rudin-2019-stop-explaining.pdf](rudin-2019-stop-explaining.pdf) |\n\n**Two to read first.** **(11)**, because it is the only one that gives you a way to say a panel is not worth its cost without just asserting taste. Then **(12)**, so that the answer names which level it is attacking.\n\n---";</script>
