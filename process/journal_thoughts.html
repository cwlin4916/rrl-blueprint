<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">process</a><i>›</i><span>journal_thoughts</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Journal thoughts — five days of human–AI collaboration</h1><p class="lead">Generated from <code>process/journal_thoughts.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nWhat [`journal.md`](journal.html) records, read against Tao's ICM 2026 public lecture (`papers/age-of-ai-icm-2026.pdf`) and the 2026 literature. Commentary, not a journal entry; nothing here is citable or in the closed world.\n\n## The cast\n\nSix things write in this repository. Which one produced a finding is the whole subject of §1, so they are named first.\n\n- **The prover** (`/prove`) — writes `proof.md`, a one-page argument for one node's statement. **The only operator that generates mathematics.** Everything else below checks, reads or reorganizes.\n- **The critic** (also `/prove`) — a hostile referee that reads the write-up and files `critiques/r<n>.md` ending in `PASS`, `FAIL` or `REFUTED`. It has **no file-editing and no shell access**, so it can report a defect and cannot repair one.\n- **The example-finder** (`/examples`) — searches the literature for the node's statement in print, and for concrete instances of it. Files `examples.md` closing on `EVIDENCE: instances | precedent | gap | counterexample`.\n- **The goal-checker** (`/check-goal`) — tests a statement against [`key_examples.md`](../key_examples/index.html), the register of varieties where the answer to the project's goal question is already settled in print. Its verdict **lowers confidence or does nothing; it can never raise it.**\n- **The updater** (`/update`) — re-reads the whole repository, corrects statements, and logs each change in the node's `updates/`. A full walk is a **consistency sweep across all nodes at once**, not a visit to one.\n- **The checker** — a presentation pass at the end of every command. Reformats prose for clarity and **may change no claim**.\n\nTwo more words this file uses:\n\n- **A gate** is an automated check in `tools/check_render.py` — math parses, links resolve, headings are legal, write-ups are inside their word budget. It runs on every command.\n- **Confidence** is derived and never stored: 25% the user's own judgement, 50% the refereeing record, 25% the literature, and **capped by the weakest node a node depends on**. Nothing in the repository may cite the number.\n\n## The closed world\n\nEverything below turns on a word this file has not defined, and it is the single design decision that makes a language model's mathematics checkable here. **The closed world is the list of what a proof is allowed to cite.** It is short, finite, and fits on a page:\n\n```\nwhat a proof of node v may invoke\n├── blueprint/appendix/     69 entries in 9 sections      ✅ citable\n├── v's own depends-on statements, proved or not          ✅ citable\n├── standard mathematics needing no citation at all       ✅ citable\n│\n├── papers/                 the source PDFs on disk       ⛔ not citable\n├── main.tex                the authors' own manuscript   ⛔ not citable\n├── examples.md             illustrates, never justifies  ⛔ not citable\n├── <id>_prompt.md          a generated readout           ⛔ not citable\n└── whatever the model remembers being true               ⛔ not citable\n```\n\nThe second block is the whole of the idea. Being *in the literature* is not being citable, being *on disk and read this morning* is not being citable, and being *in the manuscript this project is written to support* is not being citable — only being transcribed into the appendix is. Seven of the 69 entries are manuscript results that had to be copied out before the pipeline could use them.\n\nAn entry is one file for one object, carrying the statement in full, its hypotheses spelled out, its source named to the page, and a **dictionary note** reconciling the source's conventions with this repository's. [$!$-restriction preserves holonomicity along any morphism](../appendix/bb-htt-holonomic-shriek.html) is the model: three lines saying that the source's $f^{\\dagger}$ *is* this repository's $f^{!}$, that its $D^b_c(\\mathcal{D}_Y)$ *is* $\\mathcal{D}_c(Y)$ for smooth $Y$, and that the base change from $\\mathbb{C}$ to $k$ is declared by the entry rather than read off the source. Those three lines are why the entry is usable at all, and writing that kind of line is where several of §1's findings actually came from.\n\n**Why bother.** A prover with the whole literature in its weights produces citations that sound right and do not say what the step needs, and the failure is invisible on the page — the sentence reads like every other sentence. A whitelist converts it into a name that is not in a file, so hallucination stops being something one hopes against and becomes something a referee greps for.\n\n**What it costs.** When an argument needs a fact that is true, standard and *not in the appendix*, the prover must stop and write `GAP`. That is not a bad proof — it is a prover refusing to invent a citation — and it is the only route by which the closed world grows. §3 is what happens next.\n\n**The rule was mis-scoped for its first week, and the correction is the interesting part.** The grant was originally per node: a proof could invoke the entries its own `objects:` field listed. That field is written by the lead-researcher at decomposition time, before anyone has attempted the proof, so the load-bearing position held a **prediction of which entries an unwritten argument would turn out to need**.\n\n- **46 of 383 flaws are `W`, *undeclared*, and 5 were MAJOR** — correct mathematics failing a round against entries already transcribed and already vetted. One referee's own summary: *\"The mathematics is correct; the declared world does not license it.\"*\n- **It compounded.** A closed-world `FAIL` sent the run to widen the grant, and the cap is one widening per invocation, so a node whose prediction was short in two places could not be proved at all however good the argument.\n- **[ADR 0071](decisions/0071-the-closed-world-is-the-appendix.html) made the whole appendix citable** and demoted `objects:` to a *declaration of what a write-up used*, recomputed by the gate from the draft's own links. The bottom row did not move: a fact no entry supplies is still a hard stop.\n- → **The guarantee was never in the per-node grant; it was in the appendix being finite and written down.** A whitelist scoped tighter than the thing it protects buys nothing and costs rounds.\n\nThe closest analogue is a proof assistant's environment — Lean admits only declarations already present, and the appendix is this repository's environment, maintained by hand because the objects are $\\infty$-categorical and no assistant has them. The closest contrast is retrieval-grounded generation, and the difference is what a *miss* does: grounded generation degrades, answering from memory anyway, whereas here a miss is a hard stop that produces a work item. That is the only reason the guarantee is worth anything, and it is also the entire cost.\n\n## The ledger, 2026-08-06\n\n- **105 nodes** across 3 questions — 19 `proved`, 6 `failing`, 3 `drafted`, 77 `open`\n- **38 critique rounds** — 25 PASS, 13 FAIL\n- **42** update records · **18** `examples.md` · **2** `goalcheck.md`\n- **60** decision records · **30** invariants · **102** commits · **5** days\n- **26k words** of `proof.md`, against **172k** of audit trail and **119k** of `process/`\n- → **Proof is under 7% of what was written.**\n\n---\n\n## 1. What the record shows\n\n**The prover — the one operator that writes mathematics — found the least of it.**\n\n- **The critic's first finding was a defect in the human-written manuscript**, not in a draft. The manuscript defines the Satake subcategory by *generating* it from a set of objects, but never says inside which ambient category the generation happens; different ambients give different subcategories, so the printed definition does not pin down an object. The prover had silently picked a reading. [the Satake subcategories](../appendix/def-satake-subcategory.html).\n- **The critic caught a false inference the prover had compressed three times without re-reading.** A step concluded that an increasing family of closed subsets has a *maximal* member \"by Noetherianness\" — but Noetherian gives the *descending* chain condition, hence minimal members. The finite subsets of a line are closed, closed under union, and have no maximal element.\n- **The example-finder found a clause false in print.** Clause (iv) of [Q1-L4](../nodes/Q1/Q1-L4/index.html) was contradicted by a published result. Its `EVIDENCE: counterexample` drove the node's confidence negative, and because confidence is capped by the weakest dependency, **three cards went red on one build from one line of one file.**\n- **The example-finder found a node that is true and nearly empty.** [Q2-L8](../nodes/Q2/Q2-L8/index.html) carries five hypotheses (A)–(E); (D), \"peeling off a maximal stratum\", turns out to be satisfiable **only when the closure order is trivial**. The node had already passed its referee.\n- **The updater's full walk found one wrong word in three places.** A node asserted certain jet transition maps are *surjective*, which on points they are not — its own proof step concludes *faithfully flat*. The same wrong word was standing in two further nodes that **consume** that statement as a hypothesis, so the two ends of a joint had quietly stopped matching.\n- **The presentation checker — forbidden from changing any claim — found a logical error.** [Q1-e6](../nodes/Q1/Q1-e6/index.html) inferred that a connected-stabilizer condition **fails** from the **presence** of a type-$N$ root, while the note it cited gives \"no type-$N$ roots\" as a criterion under which the condition **holds**. It had asserted a sufficient condition's converse, in the one file whose job is to delimit which varieties are in scope.\n- → *To test: adversarial and clerical passes yield more findings per unit of compute than generative ones.*\n\n**Four rules were written into the pipeline and have never fired.** Naming each, what it is for, and its count:\n\n- **`VERDICT: REFUTED`** ([ADR 0046](decisions/0046-a-refuted-statement-needs-a-change.html)) — the critic's third verdict, for a statement that is **false as written**, as against a write-up that merely has a hole (`FAIL`). It exists so the two are not shown with the same amber flag. **Used 0 times.** Meanwhile clause (i) of Q2-L6 *is* flatly false — a covering relation whose difference is not a simple coroot — and had to be recorded as `FAIL`, which is precisely the case the verdict was created for.\n- **`/check-goal`** — specializes a statement to each settled case in the register and reports what holds, strains or breaks. Documented as **the cheapest check in the pipeline** and as belonging *before* `/prove`. **2 files for 105 nodes**, and both were run after the proofs they were meant to precede.\n- **Ground every new node** ([ADR 0048](decisions/0048-a-decomposition-is-grounded-node-by-node.html)) — every node created by a decomposition must go to the example-finder before the run commits, because the moment a statement is cheapest to fix is the moment it is written. **18 of 105 nodes carry an `examples.md`.**\n- **`human:`** — the one field no agent may write, holding the user's own verdict. Until the user marks a node `approved`, its confidence is **capped at 80%**. **1 node of 105 is approved**, so 104 sit under the cap and the channel worth 25% of every number is silent.\n- → The journal already says *\"a rule with no gate is a suggestion.\"* It never says **a gate nobody runs**, and that is the larger effect: all four of these are written, correct, and inert.\n\n**Every gate checks the shape of a file; none checks the scope of a claim.** The recurring near-miss is a sentence that is valid markdown, with links that resolve and math that parses, and is false.\n\n- **A definition carried a theorem.** A sentence coined a piece of notation and then added, in apposition, that it \"is a closed ind-subscheme\" — justified by each piece being closed. An increasing union of closed sets need not be closed. It survived four days and three operators because **a definition is not the kind of sentence anyone reads as false** ([ADR 0052](decisions/0052-a-definition-inside-a-statement-carries-no-claim.html)).\n- **An `Assume (F)` over a numbered list.** Nothing checks how far the assumption reaches, and under one reading a clause became vacuous. The gate verifies each hypothesis is its own paragraph with one label — which that file satisfied exactly.\n- **Prose inside a statement is read as authoritative and checked as decoration.** An explanatory sentence in a `## Statement` said the opposite of what the formal statement said, and sat there for a day.\n- **The worst case was the root, not a leaf.** Q1 asks whether acting on a basic object generates the *whole* automorphic category. Its **Setting** put assumption (c) in force — and BZSV p. 163 draws from that assumption the statement that all sheaves *can* be so generated. **The question assumed a hypothesis entailing its own answer**, for four days, in the one question the register exists to measure.\n\n**Illegibility was a leading indicator of a defect, not a cosmetic complaint.** Seven phases were user-directed, every one a report that some readout could not be read; three of them turned into mathematics.\n\n- **What each example matched.** Once every entry had to name the clause it spoke to, the union showed clause (ii) of Q1-L3 — nonvanishing of an object on every stratum — is matched by exactly one entry, and **nothing reached through the literature's function-theoretic dictionary can ever match it**, since a decategorified statement has no object supported in positive codimension. The literature channel is silent precisely where the node is new.\n- **Statements over ninety words.** The pass that shortened them is the one that found the Q1-e6 converse above.\n- **Bare ids in the priority list.** Rows had grown to 135 words because each carried context its bare id withheld; making the row quote its target's claim automatically cut the longest to 43 words, with **nothing re-ranked**.\n\n**Goodhart's law, caught in the act.** The per-write-up budget was 900 words.\n\n- **17 of 27 write-ups sat at 866–900 words. Two at exactly 900. Then a clean gap down to 789.** That is a distribution pressed *against* a ceiling, not one living under it.\n- **The cheap way to obey it was to write worse** — compression is local and available to the author, while splitting a node requires a different operator.\n- **The gate taxed the rule that makes mathematics readable**: a `$$` on its own line counted as a word, so pulling a definition into a display cost two.\n- **Fixed with two numbers rather than a bigger one** — a hard cap at 1500 and a non-binding split signal at 1000, because raising a single cap just re-runs the experiment 300 words later ([ADR 0060](decisions/0060-a-write-up-has-two-budgets.html)).\n\n**Two agents in one working tree collided five times, always on the same two conventions.**\n\n- Duplicate decision-record numbers twice; a referee report read and then overwritten; `appendix.md` appended to while it was being restructured; a generated index hunk shared by two runs.\n- **Cause:** *next free number* and *one canonical generator*. Both are single points of write, and neither has any locking.\n\n---\n\n## 2. Against Tao's ICM 2026 lecture\n\nTao takes the goal \"solve as many problems as possible\" and expands it into a five-stage flow — **generation → verification → exposition → publication → canonicalization** — then predicts *impedance mismatches*, his term for work piling up at a join because the next stage is slower: proofs accumulating unverified, verified proofs waiting for a readable write-up, published proofs never absorbed into the field's definitive form. His recommendation is to spend **less** on generation and being first, and **more** on digestion. This repository built stages 2 and 3 as first-class operators and never optimized stage 1 at all, so its 6.6 : 1 ratio of audit trail to proof is that advice followed by accident rather than by design.\n\n**What he predicts → what this tree measured.**\n\n- **Proof indigestion, at community scale** → the same thing inside a single project. The user has personally signed off on **1 node of 105**; the priority list stands at **45 machine-written rows to 5 human ones**; and a counterexample sat on disk, in a node's own `examples.md`, with the card red, for days, with nothing happening — **because a red number is not an instruction.** The fix was a gate note, which on its first run found a *second* node in the same state.\n- **Goodhart's law as the central risk of an AI-assisted metric** → the 900-word distribution above, with the evasion and the second-order damage both identified and dated.\n- **AI polish removes the \"natural friction\" that marks the hard part of an argument** → the converse, found independently: illegibility was a *leading indicator* of a defect, three times for three. Both say friction carries information; he reads it for the reader, this repository read it for the referee.\n- **AI writing \"dwells at length on trivialities, while passing very briefly through the most interesting and novel portions\"** → exactly Q1-L3 clause (ii) above: the clause where the node is new was the clause nothing in print could match, and the file had never said so.\n- **His publication rule of thumb — if the authors cannot give a clear expert-level talk on the result, it should not be published** → implemented here as the `human:` field and its 80% cap, and used once. **The rule is right and the human does not scale to it.**\n- **Disclose tool use (Leiden Declaration rec. 1) and make review easier (rec. 2)** → over-complied with by construction: every run dated, every revision kept, nothing overwritten. And **total disclosure turns out not to be readable**, which is why the priority panel and the confidence breakdown had to be built on top of it.\n\n**Where the record cuts against current papers.**\n\n- *Statistical Proof as a Window into Human-AI Collaboration* reports an **execution–strategy gap**: models reliably execute a strategy they are handed but cannot pick one, so human expertise moves to strategy and verification.\n- One run here inverts it. **The orchestrator handed the prover a route, and the route was false.** The prover checked each link and refused the last as circular — the dense orbit it needed *was* the finiteness being proved — and the critic then showed it outright false: the multiplicative group scaling one factor of $\\mathbb{P}^1\\times\\mathbb{P}^1$ is proper, has infinitely many orbits, and has no dense one.\n- → **A route handed down by the orchestrator carries more authority than its evidence.** The only thing that stopped it becoming a step was a standing instruction to report falsity and stop rather than paper over a hole.\n- The 2026 harness-engineering literature argues that orchestrator-and-critic scaffolding is temporary — built around model weaknesses that are easing, and destined to be trained into the model.\n- But of the 60 decision records, roughly **35 are about the record** — where a fact lives, what is derived rather than stored, what is append-only, which container is a directory — against **~19 about orchestration** and 2 about the mathematics.\n- → **Record discipline survives a model upgrade; orchestration is the half that gets absorbed.** `process/` does not currently mark which of its decisions is which, and it should.\n\n**Where there is no close peer.**\n\n- **Confidence here is a management device, not an evaluation metric** — signed channels, a silent channel costing nothing, negative values allowed, weakest-link propagation, and a number nothing may cite. *Judging What We Cannot Solve* does propose oracle-free credence for research mathematics, but to **score a model's output**, not to decide what a project does next.\n- **Critic independence is structural, not prompted.** The consensus finding (*LLMs Cannot Self-Correct Reasoning Yet*, and the self-verification-limitations line) is that a model critiquing itself degrades and an external critic is needed. Here the separation is a **tool grant** — no edit, no shell — and I found no work measuring that against an identically-prompted second pass.\n- **Lineage in one line:** this keeps the dependency graph of Massot's Lean blueprints and **deletes the verifier**. In a Lean blueprint a node turns green because a proof assistant checked it; here it turns green because one hostile reader found no gap. The entire confidence apparatus exists to occupy the place Lean occupies.\n\n---\n\n## 3. When the proving stops — one gap, and the prompt that answers it\n\n**The closed world's cost is paid at exactly one place, and this is what it looks like there.** [Q1-L5](../nodes/Q1/Q1-L5/index.html) sits at −50%, nothing is wrong with Q1-L5, and it has never been attempted; a `PASS` on it would move its number by **exactly zero**, because [the weakest dependency is a ceiling applied after a node's own channels are summed](decisions/0068-the-weakest-link-is-a-ceiling.html). Two levels down, [Q1-L5-L3-L4](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/index.html) needs $!$-restriction along a closed immersion $c\\colon S\\hookrightarrow\\tilde S$ with $\\tilde S$ smooth and **$S$ not**, and the appendix knows coherence only for smooth targets — so at Step 8 the prover had nothing to stand on and said so.\n\n```\nwhere the argument stops                       who answers it          cost\n├── 1  prover reaches Step 8, writes GAP       prover                  inside the run\n├── 2  referee RESCOPES the gap                critic                  the same run\n│      └── prover named 2 facts; granting both, the proof still cannot finish\n├── 3  the gap becomes gaps/g1.md              /prove, on the FAIL     free\n│      └── Statement · Where it stalls · What to deliver · Rules  ⛔ gate fails on a missing one\n├── 4  the file IS the prompt — paste it out   a model that has never\n│                                              seen this repository    a few k\n├── 5  entries land in appendix/5-sheaf-theory lead-researcher         one pass\n└── 6  /prove Q1-L5-L3-L4, then Q1-L5-L3       the whole loop          ~270k a round\n```\n\n**Step 2 is the one a person skips, and it decides whether step 6 works.** The prover asked for two facts; the referee checked and found that *granting both, the proof still cannot finish* — the two facts live on the scheme $S$ while the conclusion is about the prestack $H\\backslash S$, and the bridge between them is exactly what the smooth case got for free. It named two more, and noticed that one of the four is not a new entry at all. A prompt built from the prover's own sentence therefore commissions the wrong work: the entries land, `r2` fails on the same step, and the round costs another ~270k. **The prompt is built from the critique, not the draft.**\n\nFour things make [`gaps/g1.md`](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/gaps/g1.html) work, and none of them is mathematical.\n\n- **It states the claim in full, so the reader never opens the repository.** The hypotheses, the induced map of quotient prestacks, the definition of coherence being used — and in bold, the asymmetry that is the whole difficulty: $\\tilde S$ is smooth, $S$ is not.\n- **It separates `new entry` from `amends`, and that distinction is load-bearing.** Coherence here is defined by testing along *smooth* maps, which has no content for a singular target, so item 1 is a **ratified reading** in [`context.md`](../context.html) rather than a file placed beside the old one — and it changes what every node mentioning $\\mathcal{D}_c$ asserts. → **Widening the closed world and editing it are different acts, and only the second can invalidate work already passed.** A dozen proved nodes were one careless prompt away from quietly meaning something else.\n- **It carries the known dead ends.** Item 5 wants smooth descent of coherence with both schemes singular, and warns that the obvious shortcut is a trap: the smooth surjection is Zariski-locally split, but restricting along a section is $!$-restriction along a *closed* embedding — precisely the operation that does not preserve coherence. That paragraph is referee time, spent once and reusable.\n- **It names the deliverable format and grants a licence to refuse.** One file per object, an anchor, `role:` / `hypotheses:` / `used by:`, a dictionary note modelled on a named entry, bib keys only from `refs.bib` — so the answer lands citable instead of needing a second pass. And the last rule is *stop rather than paper over*: if item 1 cannot be made to agree with item 2, say so, because then the node needs its **statement** changed and not its appendix widened.\n\n→ **A gap file is not documentation of a failure. It is the failure re-expressed as a unit of work that can leave the building** — which is why [ADR 0076](decisions/0076-a-gap-is-a-prompt.html) makes those four headings mandatory and fails the gate without them.\n\nTwo things the implementation taught that the design did not know. **`gapped` had to stop scoring as a refutation**: nothing is wrong with the statement, the argument or the referee, so flooring every ancestor with $-1.0$ was a category error that cost Q1-L5 three-quarters of its range, and `gapped` now scores silent exactly as `open` does. And **the rule disqualifies the node it was designed around** — Q1-L5-L3-L4 has five standing MAJORs of which only two are the closed world, so it keeps `status: failing` and carries `gaps/g1.md` anyway. The record and the status are independent, and the ordering is the rule working rather than failing: clear the three ordinary defects first, and only then is the appendix the one thing in the way.\n\n---\n\n## 4. Redesign — move the discovery, and make its output a queue\n\n**The failure mode in one line: the appendix is grown reactively, by a prover discovering at Step 8 that it cannot continue.** That is the most expensive possible moment and the least reusable possible form. Recounted on 2026-08-07, `G` — *a step has no reason available* — is 46 of 383 flaws and 8 of the 55 that can fail a round, while 44% of the whole corpus (`S` drift, `W` undeclared, `N` ambient category) is decidable from the files by a gate that answers in under a second and a `/prove` round that costs about 270k tokens.\n\n```\nper node, cheapest first                        cost     what it decides\n├── 0  gate: S drift · W undeclared · N ambient  <1s     44% of all flaws, mechanically\n├── 1  /check-goal against the register          ~5k     does the claim survive the settled cases\n├── 2  appendix scout: which steps need a cited\n│      fact, and is it already in the appendix   ~5k     a round-1 GAP → a round-0 commission\n├── 3  /examples: in print? vacuous?             ~30k    the L channel — and the only vacuity check\n├── 4  /prove                                    ~270k   the only step that writes mathematics\n└── 5  human: one field, one word                  —     lifts the 80% cap · used on 1 node of 113\n```\n\n**1. Scout the appendix before proving.** One small agent reads the node statement and the appendix index and answers a single question: which steps will need a cited fact, and is it there. A few thousand tokens against a 270k run, converting a MAJOR found at round 1 into a commission found at round 0 — the highest-leverage change available and the easiest, a §0 in the `/prove` skill.\n\n**2. `gapped` scores silent, not $-1.0$.** Landed. It is worth −50.0% → −12.5% on Q1-L5 without a single new proof, and it moves the red onto the appendix queue where the work actually is.\n\n**3. The gap is a structured artifact, so the gaps form a queue.** Landed: numbered and append-only like a critique round, indexed at `blueprint_site/gaps/index.html`, and `--check` can flag a node sitting on an unserviced one.\n\n**4. Grow the appendix in batches, by topic.** 69 entries against 113 nodes is roughly one entry per node — the shape of an appendix assembled one stall at a time. The singular-scheme story wanted by Q1-L5-L3-L4 is the story Q1-L5-L3 needs and probably its siblings too: one deliberate pass over the appendix's sheaf-theory section clears four stalls, where four reactive `/prove` runs clear one and cost more. **Gaps batch, and that is the entire argument for the queue.**\n\n**5. Nothing checks whether a node's hypotheses are jointly satisfiable, and that is the largest hole left.** Q2-L8 passed its referee on hypothesis (D), which turns out to hold only when the closure order is trivial. Every gate here asks whether an argument is *sound*; none asks whether it is *about anything*. This is automatable in the same shape as the scout — before `/prove`, an agent whose only job is to **instantiate**: exhibit one object satisfying (A)–(E) simultaneously, or report that it cannot. Cheap adversarial instantiation before expensive generation, one level up from the scout.\n\n**6. The human is the one queue automation cannot shorten, so rank it instead.** 1 node of 113 is approved, so the channel worth 25% of every number is silent almost everywhere, and the priority panel stands at 45 machine-written rows to 5 human ones. The answer is not more automation but a *ranked* ask — importance × confidence-at-stake, batched, one screen — because **a red number is not an instruction** (§2), and the general form of this whole redesign is that **every red must resolve to a named file that is a prompt with an owner.** `gaps/g1.md` is that for the closed world and [`<id>_positive.md`](decisions/0075-a-negative-node-says-what-would-clear-it.html) is that for a negative node; nothing is yet that for an unapproved one.\n\n→ **The actor that discovers a missing fact should not be the most expensive actor in the pipeline, and what it discovers should be a file someone else can act on.** The limit is worth stating in the same breath: the referee's real yield is `F`, `G`, `H`, `M` — a step is false, a step has no reason, a hypothesis is unchecked, a source is misread — with 16 of the 55 blocking-capable flaws being *a step is false*, and none of that is mechanizable. Clearing the other 44% out of the way is not a substitute for the referee. It is how one affords to spend the referee on the part only a reader can do.\n\n---\n\n## 5. Open questions\n\n**Answerable from this tree, and already wanted by others.**\n\n- **Findings per unit of compute, by operator.** 28 proofs, 38 critiques, 18 literature runs, 42 update walks, every finding dated. The comparison has never been computed and the data is all here.\n- **Does a derived confidence calibrate?** The only ground truth available is the 3 `counterexample` and 6 `gap` verdicts. The test: were the nodes the number called weak the nodes that later broke?\n- **Is structural critic independence better** than the same model with the same tools and a hostile prompt? Nobody has separated the two.\n- **Concurrency discipline for a research tree with one canonical generator** and no coordinator — a reproducible bug class for any multi-agent repository.\n\n**Unique to this experiment.**\n\n- **The vacuity gap.** Every gate here asks whether an argument is *sound*; none asks whether its hypotheses are ever *jointly satisfiable*. Q2-L8 passed its referee on a hypothesis that holds only where the closure order is trivial — true, and about almost nothing. **`PASS` and vacuous is a state this pipeline can reach and cannot name**, formalization does not close it either (a vacuous statement compiles), and Tao's five stages have no place for it.\n- **Queue discipline for findings.** They arrive faster than a human consumes them, and the priority list at 45 : 5 is the symptom. This is Tao's impedance mismatch reduced to a project small enough to experiment on.\n- **Illegibility as a verification technique.** If it holds up, exposition is not a stage *downstream* of verification as his diagram draws it, but a **cheap parallel channel into it** — a concrete, testable amendment.\n- **A question's framing has no gate.** The leaves are checked; the root is prose. That is how a question came to assume a hypothesis entailing its own answer, and it generalizes to every blueprint-shaped project.\n- **Is the record the result?** 291k words of process and audit trail against 26k of proof. On present evidence the answer is yes, which is uncomfortable enough to state plainly rather than imply.\n\nTao closes by saying the community will need new workflows and infrastructures, and lists five — a formal library, a discussion forum, a problems site, a constants database, a competition. None of them is a **private, single-project, informal** blueprint: one unpublished manuscript, two coauthors, no proof assistant, one human, and a complete audit trail. That is the niche this repository occupies, and the reason its failures are worth writing down.\n\n---\n\n**Sources.** Tao, *Mathematics in the age of AI*, ICM 2026 (`papers/age-of-ai-icm-2026.pdf`) · [Leiden Declaration](https://leidendeclaration.ai) · [Tao, *Formalizing PFR using Blueprint*](https://terrytao.wordpress.com/2023/11/18/formalizing-the-proof-of-pfr-in-lean4-using-blueprint-a-short-tour/) · Thurston, *On proof and progress in mathematics* (1994) · [De Millo–Lipton–Perlis (1979)](https://www.cs.umd.edu/~gasarch/BLOGPAPERS/social.pdf) · [*LLMs Cannot Self-Correct Reasoning Yet*](https://arxiv.org/pdf/2310.01798) · [*Self-Verification Limitations of LLMs*](https://arxiv.org/pdf/2402.08115) · [*Statistical Proof as a Window into Human-AI Collaboration*](https://arxiv.org/html/2606.23666v1) · [*Judging What We Cannot Solve*](https://arxiv.org/pdf/2602.06291) · [*Hidden Technical Debt: Agent Harness*](https://leehanchung.github.io/blogs/2026/05/08/hidden-technical-debt-agent-harness/)\n";</script>
