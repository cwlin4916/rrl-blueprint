<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>frame1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>frame 1 — the tree at 2026-08-02</h1><p class="lead">Generated from <code>process/visualization/frame1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[visualization design](index.html) · [process index](../index.html) · [blueprint index](../../dag.html)\n\nThe first minimal output of the [timeline builder](index.html#5-the-pipeline), written down before the tool exists so that the tool can be checked against it.\n\nThis is a specification, not a readout. Regenerate nothing from it.\n\n---\n\n## 1. The timestamp\n\n$t_1 = \\textbf{2026-08-02}$, the earliest date carried by any node history.\n\nThe histories resolve to four dates in all — `2026-08-02`, `2026-08-03`, `2026-08-04`, `2026-08-05` — so frame 1 is the first of four.\n\nGit agrees on what happened that day, and names the two runs that did it:\n\n```\n6421ca0  2026-08-02 13:35  decompose(Q1)\n39193fe  2026-08-02 14:15  prove(Q1-L1): proved after 2 rounds\n```\n\nThe first subject is abbreviated here: it goes on to give the count, and records that the decomposition created all seven at once.\n\nWithin the day there is no ordering: the histories carry dates, not times. Frame 1 is therefore the state at the **end** of 2026-08-02, after both runs.\n\n## 2. The expected frame\n\nSeven nodes, five edges, one proved.\n\n| id | status at $t_1$ | depends-on at $t_1$ | events dated $t_1$ |\n|---|---|---|---|\n| `Q1-L1` | **proved** | — | created, proved |\n| `Q1-L2` | open | `Q1-L1` | created |\n| `Q1-L3` | open | — | created |\n| `Q1-L4` | open | — | created |\n| `Q1-L5` | open | `Q1-L2`, `Q1-L4` | created |\n| `Q1-L6` | open | `Q1-L4`, `Q1-L5` | created |\n| `Q1-e7` | open | — | created |\n\nThe five edges, written dependency $\\to$ dependent:\n\n$$\n\\text{Q1-L1} \\to \\text{Q1-L2} \\to \\text{Q1-L5} \\to \\text{Q1-L6}, \\qquad\n\\text{Q1-L4} \\to \\text{Q1-L5}, \\qquad\n\\text{Q1-L4} \\to \\text{Q1-L6}\n$$\n\n`Q1-L3` and `Q1-e7` are isolated. That is not an omission: `Q1-L3` pins the answer from below while `Q1-L6` pins it from above, and neither consumes the other; `Q1-e7` is the group-case sanity check of the decomposition.\n\n**`Q1-e7` was `Q1-L7` on this date.** It was reclassified from lemma to question-level example on 08-04 and `git mv`'d in place, so the directory that holds its history is the old node's. Frame 1 draws it under its current id.\n\n## 3. The check against git\n\nThe frame above is derived from the node histories under the four rules of [README §3](index.html#3-what-a-frame-is). It was then checked against the state git actually recorded that day.\n\nAt `59c6210`, the last commit of 2026-08-02, `blueprint/nodes/` did not yet exist and the nodes were sections of `blueprint/main_dag.md`. That file stored, verbatim:\n\n| id | `status` | `depends-on` |\n|---|---|---|\n| `Q1-L1` | `proved` | `[]` |\n| `Q1-L2` | `open` | `[Q1-L1]` |\n| `Q1-L3` | `open` | `[]` |\n| `Q1-L4` | `open` | `[]` |\n| `Q1-L5` | `blocked` | `[Q1-L2, Q1-L4]` |\n| `Q1-L6` | `blocked` | `[Q1-L4, Q1-L5]` |\n| `Q1-L7` | `open` | `[]` |\n\n**Every edge matches.** All five, in both directions, with no edge present then and absent now — which is exactly the failure mode the edge rule is exposed to, and it does not occur here.\n\n**Every status matches**, once `blocked` is read correctly. `Q1-L5` and `Q1-L6` were *stored* as `blocked` under the old schema; `ready` and `blocked` are now derived from the dependency statuses and never stored, so the histories give `open` and the renderer derives `blocked` from the same two dependency sets. The two records agree on the fact and differ only on which half of it is stored.\n\n**Every node matches**, up to `Q1-L7` $=$ `Q1-e7`.\n\nSo the reconstruction is exact on frame 1, and the reason to trust it is that it was checked, not that the rules look sound.\n\n## 4. What should appear on screen\n\nA tree of seven cards, five edges, one of them coloured proved.\n\n```\n   Q1-L1  ●proved        Q1-L4 ○          Q1-L3 ○      Q1-e7 ○\n     │                    │   │\n   Q1-L2  ○               │   │\n     │                    │   │\n   Q1-L5  ○ ←─────────────┘   │\n     │                        │\n   Q1-L6  ○ ←─────────────────┘\n```\n\nCaption: **2026-08-02 — decompose(Q1) · prove(Q1-L1)**, with a filmstrip of four thumbnails beneath it, this frame first and lit.\n\nPositions come from the `HEAD` layout over all 44 nodes, so these seven sit where they will sit in every later frame, surrounded by empty space that fills in on 08-03 and 08-04.\n\n## 5. How to know it is right\n\nFour checks, in the order they will fail.\n\n**The count.** Seven nodes and five edges. A build that yields 44 nodes read `HEAD` instead of the frame; one that yields 0 read git's `blueprint/nodes/` on a date when it did not exist.\n\n**The proved node.** Exactly one, and it is `Q1-L1`. Two proved nodes means the date filter is `<` where it should be `\\le`, or is comparing strings that are not ISO dates.\n\n**The isolated pair.** `Q1-L3` and `Q1-e7` have no edges. An edge on either means the builder read `required-by` as well as `depends-on` and double-counted, or did not restrict edges to nodes present in the frame.\n\n**The layout.** The seven cards occupy their `HEAD` positions, not a fresh layout of these seven alone. Scrub to frame 4 and back: nothing may move.\n\n## 6. Then, and only then\n\nFrames 2 to 4, by the same rules, each checked against git the way §3 checks this one. The scrubber, the caption and the filmstrip come after all four frames are correct — a wrong tree animates just as smoothly as a right one.\n";</script>
