<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>visualization — the tree over time</h1><p class="lead">Generated from <code>process/visualization/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[repo README](../../readme.html) · [process index](../index.html) · [pipeline](../pipeline.html) · [blueprint index](../../dag.html)\n\nThe site renders one snapshot. [`blueprint/main_dag.md`](../../dag.html) and the graph page built from it show the DAG as it stands at `HEAD`, and nothing anywhere shows how it got there.\n\nThis directory designs the page that does: the tree at a sequence of dates, with a scrubber over them.\n\nDesign status: **not built**. [`frame1.md`](frame1.html) is the first frame, derived and checked against git — build that one frame first, and nothing else until it renders.\n\n---\n\n## 1. Scope\n\nOne view, one source, one encoding. Three things that were in an earlier draft of this design are deliberately out.\n\n**The statement cloud.** A scatter of statements projected by an embedding model. It needed a heavy dependency and a projection whose stability is a research problem in its own right, and it had almost nothing to show — about twenty events in the whole record are genuine statement changes.\n\n**LLM-written summaries per revision.** A new generated artifact, a model call per revision, and a decision record, for a caption.\n\n**Confidence as the colour channel.** Confidence needs the critique files, the evidence verdicts and the `human:` field. The histories alone give status, and status is enough to watch a tree get proved.\n\nWhat is left is a tree, drawn once per date, coloured by status.\n\n## 2. The source is the node histories\n\nThe 44 `<id>_history.md` files carry 108 dated, typed events, oldest-first and append-only per [ADR 0027](../decisions/0027-a-node-carries-its-history.html). Every event line begins `- **YYYY-MM-DD — verb**`, so the record is already machine-readable without a parser worth the name.\n\nThe alternative was git, and git is worse here for a concrete reason.\n\n**At the end of 2026-08-02 the repository contained no node files at all.** `git ls-tree 59c6210 -- blueprint` returns exactly `context.md` and `main_dag.md`; the seven born that day lived as sections of `main_dag.md`, and `blueprint/nodes/` did not exist until `c49e481` on 08-03.\n\nA frame builder that reads node directories out of git therefore finds nothing on the first day of the project. Two later `R100` mass renames compound it — `c49e481` moved `nodes/<id>.md` into `nodes/<id>/`, and `96e557e` renamed every `node.md` to `<id>_node.md` — so without `--follow -M` every node also appears to have been born on 08-05.\n\nThe histories have neither problem. A rename does not rewrite a node's history, so it still says when the node was born and what happened to it, at whatever path the node now sits.\n\nThe cost is resolution. The histories resolve to four dates — 08-02, 08-03, 08-04, 08-05 — so there are four frames, not seventy.\n\nFor a first version that is the right trade: four frames of a tree that is *correct* beat seventy frames of one that starts empty.\n\n## 3. What a frame is\n\nA frame is a date $t$, and the tree as it stood at the end of that day. Four rules build it, and all four are mechanical.\n\n**Nodes.** Every node whose history carries a `created` event dated $\\le t$.\n\n**Edges.** The `depends-on` edges at `HEAD`, restricted to pairs of nodes both present at $t$.\n\n**Status.** The last status-bearing verb dated $\\le t$ in the node's history, under the map\n\n$$\n\\texttt{created} \\mapsto \\mathrm{open}, \\qquad\n\\texttt{proved} \\mapsto \\mathrm{proved}, \\qquad\n\\texttt{statement revised} \\mapsto \\mathrm{open},\n$$\n\ntogether with `proved over budget` reading as proved, `gap recorded` as gap and `counterexample recorded` as refuted. The reset of a revised node to `open` is the `/update` rule, so the map is the pipeline's own and not a new convention.\n\n**Caption.** The verbs that fired on that date, per node.\n\n### The one honest weakness\n\nRule 2 restricts *today's* edges rather than reconstructing that day's. It is wrong exactly when an edge existed at $t$ and was later removed.\n\nThe histories record no such event: `dependency gained` appears once in the whole record, and there is no matching `dependency lost`.\n\nFor frame 1 the reconstruction was checked against git and is exact — see [`frame1.md`](frame1.html) §3. Check each later frame the same way when it is built, and if one disagrees, the fix is an explicit edge-event verb in the histories rather than a cleverer reconstruction.\n\n## 4. Encodings\n\n**Colour is status**, reusing the site generator's existing status colours, so a node's colour at the last frame is its colour on the graph page. The timeline is not a second palette.\n\n**Position is fixed at `HEAD`**, computed once by the generator's existing layout function over the full node set and never recomputed per frame. A node absent from a frame is simply not drawn, and it appears later in the place it will always occupy.\n\nThis is the whole reason the tree stays legible. A geometry that churns between frames makes the colour channel unreadable, and colour is the thing worth reading.\n\n**Size is constant.** Derived centrality was in the earlier draft and buys nothing at seven to forty-four nodes.\n\n## 5. The pipeline\n\nOne script, stdlib only, on the gate path like everything else.\n\n```\nblueprint/nodes/*_history.md ──┐\n                               ├──→ tools/build_timeline.py ──→ blueprint/timeline.json\nblueprint/nodes/*_node.md    ──┘                                     │  (tracked, derived)\n                                                                     ↓\n                                       tools/build_dag_site.py ──→ blueprint_site/timeline.html\n```\n\nDropping the embedding model removes the constraint that shaped the earlier design. There is no model, no cache, no network and no dependency to declare, so the builder runs on every site build and is byte-compared like every other generated page.\n\n`timeline.json` sorts every key and carries no wall-clock timestamp, so re-running reproduces it exactly — the idempotence the test suite already asserts.\n\n## 6. Why a scrubber, and why a filmstrip\n\nAnimation is the obvious interface and the evidence is not kind to it. Archambault, Purchase and Pinaud, [*Animation, Small Multiples, and the Effect of Mental Map Preservation in Dynamic Graphs*](https://inria.hal.science/inria-00472423) (TVCG 2011), found small multiples significantly faster than animation on all five of their graph-comprehension tasks.\n\nThe exception is the task this page exists for. Animation was significantly *more accurate* for identifying which nodes and edges were added in a given slice — which is exactly \"what did this `/decompose` run change\".\n\nSo the controls are a range scrubber over the four dates, a caption naming the date and its verbs, and a filmstrip of four small multiples. Play and pause are a convenience, not the interface.\n\nRendering is hand-rolled SVG and HTML generated from a string in the site builder, exactly as the graph engine already is. [ADR 0007](../decisions/0007-generated-dag-view.html) rejected d3, mermaid and graphviz for the graph, and a range input over four frames is less code than the library that would draw it.\n\n## 7. The repository-wide edit\n\nA page is never just a page here. These are the gates that will reject the change.\n\n**`tests/test_tools.py`** hardcodes the tool script names and asserts both directions, so the new `build_timeline.py` under [`tools/`](../../../tools) must be named there and in the docs.\n\n**The site builder.** The page must be emitted from `build()` and registered in the page collector, or `--check` will not notice it going stale.\n\n**The layout tables.** [`README.md`](../../readme.html) must name the new tool, and [`CLAUDE.md`](../../../CLAUDE.md) needs this directory in its workspace table plus a guardrail line saying `timeline.json` is generated, uncitable and not an agent's to write.\n\n**This directory's indexes.** A bullet in [`process/README.md`](../index.html), a subsection in [`pipeline.md`](../pipeline.html), an invariant saying the artifact is derived and never hand-edited, a decision record with a row in [`decisions/README.md`](../decisions/README.html), and one dated entry in [`journal.md`](../journal.html).\n\n**Two gates that fail quietly.** I8 forbids anything under `blueprint/` from naming the generated site, so `timeline.json` must carry no site-relative path. The graph smoke test walks anything that looks like a graph page, so `timeline.html` must either stay out of that walk or the stub must be extended — the page is not reshaped to satisfy it.\n\n## 8. Open questions\n\nWhether four frames is a timeline or a filmstrip with extra steps. It may be that the filmstrip alone is the whole product and the scrubber is deleted after one look.\n\nWhether frames should stay dates or become events. Dates are what the histories give, the finer clock exists only in git, and §2 is why git is not the source.\n\nWhether a node's identity survives its own restatement. `Q1-L7` became `Q1-e7` on 08-04, and the history says so in prose that no parser reads; frame 1 draws it under its current id.\n";</script>
