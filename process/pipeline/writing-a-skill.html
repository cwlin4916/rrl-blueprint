<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>writing-a-skill</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Writing a skill</h1><p class="lead">Generated from <code>process/pipeline/writing-a-skill.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../pipeline.html) · [operators](operators/index.html) · [actors](../../../process/pipeline/actors) · [flaws](flaws.html) · [decisions](../../../process/decisions)\n\nA skill is one markdown file at `.claude/skills/<name>/SKILL.md`. Typing `/<name>` puts that\nfile in front of the model, and the model does what it says. There is no other mechanism:\nno code, no configuration, no registration step.\n\nSo the file is the whole design, and the design question is always the same one — **what\nmust be true when this run is over, and how does anyone check it without taking the run's\nword for it?** Everything below is downstream of that.\n\n## The shape\n\n```\n.claude/skills/<name>/SKILL.md\n├── frontmatter ..... name + description ...... how the model finds it        REQUIRED\n├── # /<name> <arg> . the signature ........... what it takes                 REQUIRED\n├── goal ............ one sentence ............ what is true when it is over  REQUIRED\n├── guard ........... when to stop before starting                            usually\n├── steps ........... numbered, in order ...... what the run does             REQUIRED\n├── gate ............ the check that can FAIL .. how anyone verifies it       REQUIRED\n└── stops ........... a table: symptom → the other operator                   usually\n```\n\nSix lines of it are the file. The `.agents/skills/<name>/SKILL.md` adapter beside it is\nCodex's, and it says only what differs in vocabulary — never a second copy of the rules.\n\n## The worked example\n\n[`/decompose`](../../skills/decompose.html) is the one to read. It is the\noldest operator here, it has been through the most revisions, and every section of it\nexists because a run went wrong without it.\n\nRead it against the shape above:\n\n```\n§0  two modes, decided from $ARGUMENTS before anything else\n§1  Guard ......... proved node → stop and ask · the ten-child cap counted first\n§2  Launch ........ ONE subagent, given the resolved path and the room under the cap\n§3  Validate ...... the orchestrator checks the subagent — not the reverse\n§4  Grounding ..... one example-finder per new node, in parallel\n§5  Presentation .. one checker per file, then a diff gate the checker cannot pass itself\n§6  Regenerate .... batch.py close · and DO NOT COMMIT\n§7  Report ........ what was made, what came back empty, what to review\n```\n\nThree things in it are worth stealing outright.\n\n**The guard counts before it acts.** §1 runs `ls | wc -l` against the ten-child cap and\nsubtracts, so the run knows how many nodes it may create before it creates one. A cap\nenforced afterwards is a cap enforced by deleting someone's work.\n\n**The orchestrator validates the subagent.** §3 is the main thread re-checking what the\nlead-researcher returned — files in the right directories, statements that fit a page, the\nparent's `## Statement` byte-identical. An agent's report of its own work is evidence, not\nproof, and this is the line the whole pipeline turns on.\n\n**The gate is a command with output.** §3 ends in `python3 tools/check_render.py`, and the\ninstruction is *fix or send back until it prints `OK`*. Not \"make sure it is consistent\".\n\n## What a good gate looks like\n\nThis is the part that is easy to get wrong, so it gets its own list. A gate is worth having\nwhen a run that broke the rule cannot report success.\n\n| gate | why it holds |\n|---|---|\n| `python3 tools/check_render.py --only <dir>` | a program's verdict, not the model's |\n| `git diff` over frozen lines, output = violation | mechanical, and reads what is on disk |\n| a `VERDICT:` / `EVIDENCE:` line a *different* agent wrote | the writer is not the judge |\n| a count that must strictly move | ambiguous only if you pick the wrong ruler |\n\nAnd what does not work, all of it observed here:\n\n- **\"Check that the prose is clear.\"** Nothing fails. Every run passes.\n- **A `git diff` gate on an untracked file.** `/tighten`'s freeze gate emitted nothing on\n  its first run because the node directory was never committed, so the grep passed\n  vacuously. A gate that cannot fail is not a gate.\n- **The agent grading itself.** The presentation pass exists because the checker is\n  content-preserving; the orchestrator runs the content-preservation gate itself and never\n  takes the checker's word for it.\n- **Two rulers.** `/tighten`'s word gate manufactured a failure by measuring with `wc -w`\n  when the ruler was `check_render.py`'s. Name the ruler in the file.\n\n## Best practice\n\nOrdered by how much trouble ignoring each has caused.\n\n1. **One job.** No operator may do another's. `/prove` cannot fix a statement; it stops and\n   says so, and that stop is the run's product. This is what makes a referee's verdict mean\n   something, and it is why the `stops` table is nearly required.\n2. **Say what it may write, and what it may not.** A file tree with ✅ and ⛔ per path. The\n   write-discipline rules in [`CLAUDE.md`](../../../CLAUDE.md) are repository-wide; the skill\n   restates its own row and nothing else.\n3. **Give the reason, once.** Every rule that exists because something went wrong keeps the\n   sentence saying what went wrong. That sentence is what stops a later reader from\n   \"simplifying\" the rule away. It is also the only thing here that may be long.\n4. **Resolve paths in the orchestrator.** Work out the target directory once, in the main\n   thread, and hand the subagent the resolved path. Never let a subagent reconstruct one.\n5. **Fail loudly on ambiguity.** `/decompose Q1` could mean two things, so it asks. Guessing\n   costs a directory tree.\n6. **Do not commit.** No operator commits. The user commits, on a working tree they can see.\n7. **End by regenerating.** `python3 tools/batch.py close`. A run that leaves a stale readout\n   has not finished.\n\n## Anti-patterns\n\n- **A word count standing in for a goal.** `/tighten` measured shortening because\n  shortening is measurable, and comprehensibility is what was wanted. The gate was sound\n  and it was gating the wrong thing. Its specification is now\n  [open](../../skills/tighten.html).\n- **Prose the model must weigh.** If a paragraph does not change what the run does, it is\n  costing attention at the moment the run needs it most.\n- **A rule with no owner.** \"Statements should be precise\" belongs to nobody. \"The\n  lead-researcher writes `## Statement`; nobody else may\" is enforceable.\n- **Restating the repository.** `CLAUDE.md` is loaded already. A skill that repeats it has\n  created a second copy to keep in step.\n";</script>
