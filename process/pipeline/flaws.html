<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>flaws</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Flaws — what a referee report is actually saying</h1><p class="lead">Generated from <code>process/pipeline/flaws.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../pipeline.html) · [actors](../../../process/pipeline/actors) · [operators](../../../process/pipeline/operators) · [statistics](statistics.html) · [decisions](../../../process/decisions)\n\nA `/prove` round ends in a referee report under `blueprint/nodes/<id>/critiques/`. The report is a numbered list of flaws, each graded `FATAL`, `MAJOR` or `MINOR`, and the grade decides everything: **a round fails if and only if at least one flaw is FATAL or MAJOR.** A MINOR blocks nothing.\n\nThat one sentence is most of what a reader needs, and it was nowhere written down. Below is what the 48 reports on disk actually contain.\n\nCounts are from `python3 tools/stats.py`, which recomputes them from the files.\n\n## The shape of the corpus\n\n```\n48 referee reports                              31 PASS · 17 FAIL\n└── 341 flaws\n    ├──   4 FATAL ....... the round fails            ⛔  1%\n    ├──  43 MAJOR ....... the round fails            ⛔ 13%\n    └── 294 MINOR ....... the round fails on none    ✅ 86%\n```\n\n**Six flaws in seven change nothing.** They are written, read, counted and stored, and the round would have ended the same way without them. That is the first thing to know before reading a report, and it is why a report can be alarming and harmless at once.\n\n## The eight kinds\n\nEvery flaw is one of these. The first four are about the mathematics; the last four are about the write-up's relation to the repository, and each has a mechanical fix.\n\n| | kind | what it says | who fixes it |\n|---|---|---|---|\n| **S** | statement drift | the write-up's `## Lemma` is not the node's `## Statement` | the gate — it is a `diff` |\n| **F** | a step is false | the step as written is wrong, and here is the case | prover, or `/update` if the *statement* is what is wrong |\n| **G** | a step has no reason | asserted, elided, or compressed past following | prover |\n| **H** | a hypothesis is unchecked | a quoted entry's own conditions are not verified in this situation | prover |\n| **M** | a source is misread | an entry or dependency is cited for something it does not say | prover |\n| **W** | undeclared | the write-up used an appendix entry the node does not list | the orchestrator — one line in `objects:` |\n| **N** | a symbol is ambiguous | no ambient category, notation coined inline, an antecedent that does not resolve | prover |\n| **B** | bookkeeping | a field, a budget, a link spelling, a heading | orchestrator |\n\nA ninth thing is not a flaw kind: **`GAP`**, the write-up needing a fact *no appendix entry supplies*. That is the one defect a referee cannot dispose of and a prover cannot repair, and it is the only route by which the closed world grows ([`decompose`](operators/decompose.html)). Before [ADR 0071](../decisions/0071-the-closed-world-is-the-appendix.html) it was filed as `W`, which is why `W` used to look dangerous.\n\nAnd how they fall:\n\n| | kind | FATAL | MAJOR | MINOR | all | share |\n|---|---|---:|---:|---:|---:|---:|\n| **N** | a symbol is ambiguous | 0 | 3 | 61 | 64 | 19% |\n| **H** | a hypothesis is unchecked | 0 | 6 | 42 | 48 | 14% |\n| **W** | undeclared | 0 | 5 | 40 | 45 | 13% |\n| **S** | statement drift | 1 | 5 | 34 | 40 | 12% |\n| **F** | a step is false | 2 | 12 | 26 | 40 | 12% |\n| **M** | a source is misread | 0 | 3 | 31 | 34 | 10% |\n| **G** | a step has no reason | 0 | 5 | 27 | 32 | 9% |\n| **?** | unclassified | 1 | 3 | 24 | 28 | 8% |\n| **B** | bookkeeping | 0 | 1 | 9 | 10 | 3% |\n| | **total** | **4** | **43** | **294** | **341** | |\n\nThe classification is inferred, by matching the referee's own words against an ordered rule list in [`tools/stats.py`](../../../tools/stats.py). It is right about the shape and it will misfile individual rows; about one flaw in twelve matches nothing at all. Read it as a distribution, not as a census.\n\n![flaws by kind and severity](../../../process/pipeline/plots/flaws.svg)\n\n## Appendix — one real instance of each kind\n\nEach row links to the report on disk. The quote is the referee's own first sentence.\n\n**S — statement drift.** [Q1-L3-L2 r3, Flaw 20](../../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r3.html) `[FATAL]`\n\n> The `## Lemma` is not the node's `## Statement`. I diffed the two documents line by line. … Clause (4) does not [match]. … Both documents are markdown; the diff is two words plus a comma.\n\nTwo words. It cost a full round, and it is the flaw standing against that node today. A `diff` decides it, which is why it is now a gate check and not a referee finding.\n\n**F — a step is false.** [Q1-L2-L3-z1 r1, Flaw 1](../../nodes/Q1/Q1-L2/Q1-L2-L3/Q1-L2-L3-z1/critiques/r1.html) `[FATAL]`\n\n> Clause 1 says \"$S$ is a small set\". Step 5 does not prove that sentence and cannot. It proves a strictly weaker one.\n\nThis is what a referee is for. Nothing mechanical finds it.\n\n**G — a step has no reason.** [Q1-L3-L2 r1, Flaw 3](../../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r1.html) `[MAJOR]`\n\n> The marker is honest, is placed exactly where the argument stops, and names three distinct debts.\n\nThe prover wrote its own `GAP`. An honest gap is a `FAIL` and a good run; see the note under the table above.\n\n**H — a hypothesis is unchecked.** [Q1-L4-L4 r1, Flaw 3](../../nodes/Q1/Q1-L4/Q1-L4-L4/critiques/r1.html) `[MAJOR]`\n\n> This discharge must not be written as stated. … that display *is* the $\\mathcal{D}^!$ half of this node's conclusion, so an entry asserting it … assumes the conclusion.\n\nThe most valuable kind after `F`: the proposed appendix entry would have swallowed the node.\n\n**M — a source is misread.** [Q1-L3-L2 r3, Flaw 23](../../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r3.html) `[MAJOR]`\n\n> The display drops the load-bearing half of L2's (B).\n\nDecidable only by opening the entry and reading it, so it stays a referee's job.\n\n**W — undeclared.** [Q1-L2-L1 r1, Flaw 1](../../nodes/Q1/Q1-L2/Q1-L2-L1/critiques/r1.html) `[MAJOR]`\n\n> That fact is the content of the appendix entry `conv-d-shriek-d-star` …, which is **not among this node's declared objects**. … Remedy: widen the node's `objects:` … **The mathematics is correct; the declared world does not license it.**\n\nThe referee's last sentence is the whole argument for [ADR 0071](../decisions/0071-the-closed-world-is-the-appendix.html). The entry existed, was already transcribed from the manuscript, and was already vetted. A round failed on a missing line in a field.\n\n**N — a symbol is ambiguous.** [Q1-L2-L1 r1, Flaw 2](../../nodes/Q1/Q1-L2/Q1-L2-L1/critiques/r1.html) `[MINOR]`\n\n> \"the coherent $\\mathcal{D}$-modules on $S$ form an abelian subcategory of the heart … (standard noetherianity for finite-type schemes)\" — of which heart?\n\n61 of its 64 instances are MINOR. Most are the ambient-category convention, which [`tools/check_render.py`](../../../tools/check_render.py) §8 already checks in part.\n\n**B — bookkeeping.** [Q2-L3 r2, Flaw 6](../../nodes/Q2/Q2-L3/critiques/r2.html) `[MAJOR]`\n\n> u2 says \"[Q2-L4] proves the equality and so supplies the inclusion a fortiori\" — and it does not.\n\nA field disagreeing with the node it points at. Ten instances in the whole corpus, and the rarest kind.\n\n## Three readings worth having\n\n**What actually fails a round is `F`.** Of the 47 flaws that can fail anything, 14 — nearly a third — are *a step is false*. Everything else is spread thinly. So the referee's real yield is finding wrong steps, and the other seven categories are the price of the search.\n\n**The most common flaw is the cheapest.** `N`, *a symbol is ambiguous*, is 19% of the corpus and 61 of its 64 instances are MINOR. Almost all of it is the ambient-category convention — a relation between objects of a common category that does not name the category. That is a rule a machine can check.\n\n**Three kinds are decidable from the files, and they are 44% of the corpus.** `S` is a `diff` between the write-up's `## Lemma` and the node's `## Statement`. `W` is a set difference between the entries a draft links and the entries its node declares. `N` is a syntactic property of a relation. Every instance a gate catches is one that does not cost a round: the gate answers in under a second, the round costs six agents and about 270k tokens.\n\n## Why the reports are so long\n\n41 of 48 are over 1000 words; the mean PASS is 1776 and the longest report in the repository is [Q1-L3-L2 r3](../../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r3.html) at 3777.\n\n![critique length against the cap](../../../process/pipeline/plots/critique-length.svg)\n\nThe reason is not verbosity. It is that **length pays.** On a passing round the mathematical channel is the Baconian ratio over flaws raised and disposed of, and every flaw counts the same whatever its severity:\n\n$$\nD \\;=\\; \\frac{e+1}{e+2}, \\qquad e = \\text{flaws raised and disposed of}.\n$$\n\n| flaws disposed of | $D$ | resulting confidence |\n|---:|---:|---:|\n| 0 | 0.500 | 25.0% |\n| 2 | 0.750 | 37.5% |\n| 5 | 0.857 | 42.9% |\n| 10 | 0.917 | 45.8% |\n| 30 | 0.969 | 48.4% |\n\n[Q1-L2-L2](../../nodes/Q1/Q1-L2/Q1-L2-L2/index.html) passed with 2 flaws and sits at 37.5%. [Q1-L1](../../nodes/Q1/Q1-L1/index.html) passed with 30 across five rounds and sits at 73.4%, the highest in the repository. Both passed clean. **The gap between them is a gap in how much was written down, not in how much was checked.**\n\nThis is the eliminative-induction reading working as designed — a claim that survived thirty attempts to break it *is* better tested than one that survived two — and it is also an incentive to nitpick, because a MINOR scores exactly what a MAJOR does. Both are true at once, and the second is why the reports grew.\n\n## The rules now in force\n\n**A referee report is at most 1000 words**, checked by the render gate. A report that needs more is reporting on a node that needs splitting, and it should say so in one line instead of proving it at length.\n\n**A report does not repeat itself.** A flaw already raised on an earlier round of the same node is named and linked, never restated: `see [r1](r1.md) Flaw 4`. The rounds are one sequence and the reader has them all.\n\n**A MINOR is one sentence.** What is wrong, where, and the fix. A MINOR that needs a paragraph is a MAJOR that the referee has not committed to.\n\n**Severity is a claim about the verdict, not about how interesting the flaw is.** FATAL and MAJOR mean *this round fails*. If the round should pass, the flaw is MINOR however much the referee wants to talk about it.\n\n**`W` is never above MINOR, and `S` is never a referee's finding at all.** Both are computed by the render gate before the critic runs ([ADR 0071](../decisions/0071-the-closed-world-is-the-appendix.html)). A referee that reports one is reporting something the gate already fixed.\n\nThese apply going forward. **The 48 reports on disk are not rewritten** — they are an append-only audit trail ([I4](../pipeline.html)), and the gate reports a defect in one as a note rather than a failure. A record that gets tidied is not a record.\n\n## What to relax, and what to keep\n\nThe question this section answers is *which of these eight kinds is worth what it costs*. A round costs about 270k tokens and roughly an hour; a gate check costs under a second. So the test is not \"is this flaw real\" — they nearly all are — but \"did it need a referee\".\n\n| | change | what it buys | what it risks |\n|---|---|---|---|\n| **1** | `W` never fails a round; the gate computes it | ~5 MAJORs a corpus, each one round | nothing: the entry was already vetted |\n| **2** | `S` is a gate `diff`, not a finding | the one FATAL standing today | nothing: it is a string comparison |\n| **3** | a widening means a **new appendix entry**, so declaring an existing one no longer spends the budget | the `/prove` hard stop stops firing on bookkeeping | nothing: the guard was never about the field |\n| **4** | `N` beyond the ambient-category rule stays a MINOR by construction | shorter reports | a genuinely ambiguous symbol reads as tidy-up |\n| **5** | *keep* `F`, `G`, `H`, `M` exactly as they are | the referee's whole yield | — |\n\nChanges 1–3 are [ADR 0071](../decisions/0071-the-closed-world-is-the-appendix.html) and are in force. Change 4 is a judgement the critic spec now states. Change 5 is the point of the exercise: **nothing that requires reading the mathematics has been relaxed.**\n\n### Why the closed world was stopping the search\n\nThe rule was: a proof may invoke the entries its own node lists in `objects:`, its `depends-on` statements, and standard mathematics. Everything else is a breach.\n\nThat put a *guess* in the load-bearing position. `objects:` is written by the lead-researcher at decomposition time, before anyone has tried to prove the node, and it is a prediction of which of the appendix's entries the argument will turn out to need. When the prediction was short — as at [Q1-L2-L1 r1](../../nodes/Q1/Q1-L2/Q1-L2-L1/critiques/r1.html) — the round failed on mathematics that was correct, against an entry that was already in the appendix.\n\nIt then failed twice more. A closed-world `FAIL` sent the run to the lead-researcher for a widening, and [I19](../pipeline.html) allows **one widening per invocation**: a second one ends the run. So a node whose `objects:` was short in two places could not be proved at all, however good the argument.\n\n```\nwhat a prover needed                  before              now\n├── an entry the node lists ........  cite it       ✅    cite it            ✅\n├── an entry in the appendix,\n│   not listed by the node .........  MAJOR, a      ⛔    cite it; the gate  ✅\n│                                     widening,           adds the line\n│                                     maybe a stop\n└── a fact no entry supplies .......  GAP ⛔              GAP                ⛔\n```\n\nThe bottom row is the guard, and it has not moved. The middle row was never a guard: it was a bet that the lead-researcher could predict a proof it had not read. The appendix is the closed world, and it always was — `objects:` is a *declaration of what a write-up used*, which the gate now recomputes and keeps honest.\n\n## What this leaves open\n\nMoving `N` into `tools/check_render.py` past the part §8 already covers is not done. An ambient category is a syntactic property of a relation, and `N` is 19% of what referees spend their words on.\n";</script>
