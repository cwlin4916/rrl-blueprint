<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>statistics</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Statistics — what the pipeline has actually done</h1><p class="lead">Generated from <code>process/pipeline/statistics.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../pipeline.html) · [actors](../../../process/pipeline/actors) · [operators](../../../process/pipeline/operators) · [flaws](flaws.html) · [decisions](../../../process/decisions)\n\n```\npython3 tools/stats.py            print every table\npython3 tools/stats.py --plots    also write process/pipeline/plots/*.svg\npython3 tools/stats.py --json     the underlying records\n```\n\n**The run log is not written; it is counted.** Every operator leaves its runs on disk — a `/prove` round is a file in `critiques/`, an `/update` is a file in `updates/`, an `/examples` is `examples.md`, a `/check-goal` is `goalcheck.md`, a `/decompose` is the directories it created. So there is no run log to keep in step with what happened, which is the same reason confidence is derived and the priority panel's warning layer is stored nowhere.\n\nEvery number below is regenerated by the command. Where this page and the command disagree, the command is right.\n\n## What it measures\n\n| table | question it answers |\n|---|---|\n| node states | how much of the tree is proved, failing, drafted, open |\n| operator runs | how many times each operator has run, and on how many nodes |\n| flaws by kind | which defects the referees actually find — see [flaws](flaws.html) |\n| rounds | PASS/FAIL split, flaws per round, report length against the cap |\n| what a flaw is worth | the Baconian curve, and the incentive it creates |\n\n## As of 2026-08-07\n\n```\n112 nodes                 48 referee reports          341 flaws\n├── open ......... 80     ├── PASS ......... 31       ├── FATAL ....   4\n├── proved ...... 24      └── FAIL ......... 17       ├── MAJOR ....  43\n├── failing ......  5                                 └── MINOR ... 294\n└── drafted ......  3\n```\n\n![node states](../../../process/pipeline/plots/node-states.svg)\n\n**53 of 112 nodes have never been touched by any operator.** That is not neglect — most were created by `/decompose` in the last two days and the tree is deliberately wider than the work done in it. But it is the number to have in mind before asking why the pipeline seems slow: less than half of it has been run at all.\n\n| operator | runs | nodes touched |\n|---|---:|---:|\n| `/update` | 51 | 38 |\n| `/prove` | 48 | 29 |\n| `/examples` | 17 | 17 |\n| `/decompose` | 17 | 17 |\n| `/check-goal` | **2** | **2** |\n\n![operator runs](../../../process/pipeline/plots/operator-runs.svg)\n\nTwo things stand out.\n\n**`/update` has run more often than `/prove`.** More statements have been corrected than proved, which is what an early-stage blueprint should look like and is worth saying out loud, because it reads from the outside like the pipeline failing to prove things.\n\n**`/check-goal` has run twice.** It is the cheapest operator in the pipeline — one agent — and it is the only one that can tell you a node is not worth proving before you spend six. It is the largest unspent lever here.\n\n## The channel that is silent\n\nConfidence has three channels, and two of them are nearly empty across the whole repository:\n\n| channel | weight | nodes where it speaks (of 112) |\n|---|---:|---:|\n| the mathematical record | 50 | 32 |\n| the literature | 25 | 14 |\n| human judgement | 25 | **1** |\n\nThe literature speaks on 14 nodes although `/examples` has written 17 files: three verdicts were superseded by a later statement revision and are silenced rather than scored ([ADR 0065](../decisions/0065-a-superseded-verdict-is-silenced-not-scored.html)).\n\nA proved node with both other channels silent sits at 40%. **Nothing an operator can run raises it past 50%**, because the remaining half is the user's `human:` field and the example-finder's literature verdict. A tree of perfectly proved nodes with nobody's judgement on it is a 40% tree by construction, and that is the honest reading rather than a defect.\n\n## Reading the cost\n\nMeasured over the four children of `Q1-L4`: a node that passes in one round costs about 270k subagent tokens; a second round roughly triples it, because the r2 prover packet is larger and usually pulls a widening and a second critic behind it. Round 3 was never reached on any node.\n\nThat measurement is the whole basis of the two-round cap ([ADR 0030](../decisions/0030-the-prove-budget-cap.html)), and it is the repository's only measurement of what an operator costs. A future bound extends that table rather than guessing.\n";</script>
