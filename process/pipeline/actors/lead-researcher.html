 ratifying a reading that fixes a meaning the entry left open, invalidates every draft written against the looser reading, and those must be re-refereed.\n\n**May not.** Write a proof, a status, an index bullet, or an existing `## Statement` — a decomposition never touches its parent's claim.\n\n## When it stops\n\n| condition | what it does |\n|---|---|\n| the container already has ten children | refuses the eleventh and says which grouping it wants ([ADR 0050](../../decisions/0050-a-node-has-at-most-ten-children.html)) |\n| a proposed node has no crisp statement | reports it as a priority row instead of creating a node |\n| a widening would need a source with no `refs.bib` key | asks for a ratified reading, which the user alone grants |\n";</script>
