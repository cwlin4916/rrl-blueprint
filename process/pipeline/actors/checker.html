  | grep -E 'VERDICT:|EVIDENCE:|\\*\\*status:\\*\\*|\\*\\*role:\\*\\*|\\*\\*human:\\*\\*|<a id='\n```\n\nAny output is a violation — `git checkout -- <path>` and report it reverted.\n\n**Why it exists.** While the critic was responsible for presentation as well as refereeing, it kept flagging formatting and the noise hid the mathematics. Splitting them is what made each report about one thing.\n";</script>
