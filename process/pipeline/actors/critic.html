the node is proved |\n| `FAIL` | *this argument* does not establish the claim | the prover, next round |\n| `REFUTED` | **no argument will** — the statement is false, and here is the case | [`/update`](../operators/update.html), and only `/update` |\n\n`REFUTED` is not a strong `FAIL`. It is a claim about the *statement* rather than the write-up, so a referee that suspects falsity without being able to exhibit it issues `FAIL` with the doubt as a FATAL flaw. It is the one verdict that costs something to be wrong about, because it stops the node until a statement is rewritten.\n";</script>
