<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Actors — who may write what</h1><p class="lead">Generated from <code>process/pipeline/actors/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](../../../../process/pipeline/operators) · [flaws](../flaws.html) · [statistics](../statistics.html) · [decisions](../../../../process/decisions)\n\nSeven actors. One is the main thread; six are subagents. **Write discipline is a path prefix**, so \"only the critic writes `critiques/`\" is a glob and can be checked without reading a file.\n\nThe grants in [`.claude/agents/*.md`](../../../../.claude/agents) are canonical. Claude Code enforces them as a physical tool surface; `.codex/agents/*.toml` translates them into behavioural allowlists over the same boundaries, and the test suite checks both mappings.\n\n```\norchestrator ......... the main thread, all tools     writes every status field\n├── lead-researcher .. no Bash                        writes statements, appendix entries\n├── prover .......... +Bash                           writes proof.md\n├── critic .......... no Edit, no Bash  ⛔             writes critiques/r<n>.md\n├── example-finder .. +WebSearch, WebFetch            writes examples.md, prompts/\n├── goal-checker .... no web                          writes goalcheck.md\n└── checker ......... no Bash                         reformats, changes no claim\n```\n\nThe `⛔` is the one that matters. The critic has no edit tool at all, because a referee that can edit the proof stops being a referee.\n\n| actor | writes | may never | stops when |\n|---|---|---|---|\n| [orchestrator](orchestrator.html) | every status field; nothing else in the tree | produce an artifact it then judges | a gate fails twice, or the round budget is spent |\n| [lead-researcher](lead-researcher.html) | node directories, statements, appendix entries | write a proof or an existing statement | a container already holds ten children |\n| [prover](prover.html) | `proof.md` | touch the DAG or a statement | the statement is false as written |\n| [critic](critic.html) | `critiques/r<n>.md` | edit anything | never — it always returns a verdict |\n| [example-finder](example-finder.html) | `examples.md` or `prompts/examples.md` | write a node file or the bench | never — \"found nothing\" is a successful run |\n| [goal-checker](goal-checker.html) | `goalcheck.md` | write `key_examples.md` | never — `untested` is a verdict |\n| [checker](checker.html) | reformats one file | change a claim, a verdict or an anchor | its diff touches a frozen field |\n\n**Two facts about the last column.** Three of the six subagents never stop early, because their honest empty answer is a real result — a referee that found nothing, a literature search that found nothing, a bench that could not see the statement. The three that do stop are the three that would otherwise have to invent something.\n\n**`human:` is the user's field and no agent's.** It stores one of `approved`, `endorsed`, `—`, `doubted`, `refuted`, and it is the only field in the repository that not even the orchestrator writes. An agent that needs it changed asks.\n";</script>
