<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>example-finder</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>example-finder — reads the literature</h1><p class="lead">Generated from <code>process/pipeline/actors/example-finder.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [actors](index.html) · [operators](../../../../process/pipeline/operators) · [flaws](../flaws.html) · [decisions](../../../../process/decisions)\n\nSpec: [`.claude/agents/example-finder.md`](../../../../.claude/agents/example-finder.md). Runs under [`/examples`](../operators/examples.html).\n\n**Grant.** Read, Grep, Glob, Write, Edit, WebSearch, WebFetch — the only actor with web access, and it reads [`papers/`](../../../papers/guideline.html) on disk first.\n\n**Writes.** `blueprint/nodes/<id>/examples.md`, closing on `EVIDENCE: precedent | instances | gap | counterexample`; or `blueprint/nodes/<id>/prompts/examples.md` when it honestly found nothing.\n\n**Its output is outside the closed world.** No proof, node or appendix entry may cite `examples.md`. It justifies *believing* a statement — that it is not vacuous, that its hypotheses are load-bearing — and never discharges an obligation.\n\n**Every finding says what it matches**: which clause of the statement, under what specialisation or sourced dictionary, and what it does not reach. The run reports the complement — the clauses nothing in print touches. That complement is usually the finding worth having.\n\n**The two-branch shape is the safety property.** *Found an example* and *recorded that none was found* are both successful runs. An operation whose only success branch is \"found one\" makes inventing one the path of least resistance. An example with no verifiable source is worse than no example.\n";</script>
