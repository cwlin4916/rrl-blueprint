 record worth reading, and it is the reason the orchestrator runs the gates itself rather than trusting a report of them.\n\n**It never commits** ([ADR 0069](../../decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)).\n\n## When it stops\n\n| condition | what it does |\n|---|---|\n| a gate fails twice on the same file | sets `failing`, reports, stops |\n| the round budget is spent | stops; the user decides whether the node is worth more |\n| a second closed-world widening is asked for | stops — the node was cut against the wrong world |\n| a checker's diff touches a frozen field | `git checkout` that file, report it reverted |\n";</script>
