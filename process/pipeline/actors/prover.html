appendix may be linked and used, and named in the write-up's closing line. A fact **no entry supplies** is a `GAP`, not a citation to invent. Dependencies come in two labelled groups — established and assumed — and both are usable; the write-up must name in a closing line which *assumed* ones it actually leaned on.\n\n**Budget.** 1500 words hard, 1000 as a split signal.\n\n## When it stops\n\n| condition | what it does |\n|---|---|\n| the statement is **false as written** | says so, exhibits the failing case, and refuses to draft — this is a better run than a strained proof |\n| a needed fact has no appendix entry | writes `GAP:` and hands the widening to the lead-researcher |\n| the argument will not fit the budget | names the self-contained piece that makes the cleanest sub-lemma |\n";</script>
