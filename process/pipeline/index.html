<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>The pipeline, one file at a time</h1><p class="lead">Generated from <code>process/pipeline/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline design](../pipeline.html) · [journal](../journal.html) · [decisions](../../../process/decisions) · [repo README](../../readme.html)\n\n[`../pipeline.md`](../pipeline.html) says what the system **is** and holds the numbered invariants I1–I44, which 54 links across the repository point at and which therefore stay where they are. This directory says what each **part** of it is, one file per part.\n\n```\nprocess/pipeline.md ......... what the system is · the invariants · the shape of the loop\nprocess/pipeline/\n├── actors/ ................. who may write what — 7 files + a table\n├── operators/ .............. what each command does and where it stops — 7 files + a table\n├── flaws.md ................ what a referee report is actually saying\n├── statistics.md ........... what the pipeline has done, counted from disk\n└── plots/ .................. generated by tools/stats.py --plots\n```\n\n## The whole loop\n\nSeven operators, and the arrows between them are the part no single skill file could show.\n\n```\n                    ┌──────────────── the statement was wrong ───────────────┐\n                    │                                                        │\n                    ▼                                                        │\n question ──/decompose──▶ STATEMENTS ──/update──▶ corrected statement ────────┤\n                              │            │                                 │\n              cheapest first  │            └──/generalize──▶ <id>-z1  a NEW node,\n                              │                                the target untouched\n                              ├──/check-goal──▶ goalcheck.md ─── a ceiling    │\n                              │                    1 agent                    │\n                              ├──/examples ───▶ examples.md ──── ±literature  │\n                              │                    1–2 agents                 │\n                              └──/prove ──────▶ prover ─▶ gate ─▶ critic      │\n                                                   ▲            2–6 agents    │\n                                                   │                │         │\n                                     FAIL at r1 ───┘                │         │\n                                     FAIL at r2 ──▶ failing ────────┤         │\n                                     GAP only ────▶ gapped ──▶ gaps/g<n>.md   │\n                                     REFUTED ──────────────────────────────────┘\n                                     PASS ────────▶ proved ─▶ suggest /examples\n```\n\nRead it as: **statements are the hub.** Every operator either creates them, tests them, corrects them or abstracts them, and only [`/update`](operators/update.html) writes an existing one.\n\n## When you cannot just run `/prove`\n\nThis is the question the pipeline gets asked most, so it gets its own table. Each row is a **condition on the node**, how you can tell from the node's own file, and the operator that owns it — the link is the answer.\n\n| the node… | how you can tell | run this instead | on disk right now |\n|---|---|---|---|\n| has a **refuted** statement | last `VERDICT: REFUTED`; the flaw block opens *the statement is false as written* | [`/update`](operators/update.html) — and never `/prove` again until it has | `Q1-L3-L4`, `Q1-e4` |\n| **failed twice** | `status: failing` with two or more rounds in `critiques/` | your call: [`/update`](operators/update.html) the statement, or [`/decompose`](operators/decompose.html) the missing claim | `Q2-L4` (2 rounds), `Q1-L3-L2` (4) |\n| is waiting on **the closed world** | `status: gapped`, a `gaps/g<n>.md` on disk | nothing here — paste the gap file into any model, land the appendix entries, *then* `/prove` | `Q1-L5-L3` |\n| carries a **counterexample** from the literature | `EVIDENCE: counterexample` in `examples.md` | [`/update`](operators/update.html) — the statement is wrong before the proof is | `Q1-L3-L2`, `Q1-L5-L3-L1`, `Q1-a1` |\n| carries a **hypothesis gap** | `EVIDENCE: gap` | [`/update`](operators/update.html) to revise, or [`/decompose`](operators/decompose.html) to commission the missing claim | `Q1-L5`, `Q1-L5-L3-L2`, `Q2-L6` |\n| has a **superseded write-up** | flaw block says *the write-up proves the pre-u‹n› statement* | `/prove` **does** run — but as a rebuild, not a fresh round | `Q1-L3-L2` |\n| is **`human: doubted`** | the field, which no operator may write | only the user lifts it; [`/update`](operators/update.html) acts on the statement meanwhile | none today — one node is `approved` |\n| is **`role: thought`** | the field | [`/prove`](operators/prove.html) refuses: a thought states nothing a referee could certify | none today |\n| is already **`proved`** | the field | `/prove` asks first — re-proving discards a write-up that passed | 27 nodes |\n| is **more general than we thought** | a verified claim whose specialization to this node is one substitution | [`/generalize`](operators/generalize.html) — a new `<id>-z<k>`, never a widened statement | 5 `-z` nodes exist |\n| is **held down by an `open` child** | the confidence panel names another node in `by` | prove the child first — a `PASS` here buys nothing while the ceiling binds | `Q1-L3-L2`, capped by `Q1-L3-L2-L1` |\n| is **locked** | `batch.py claim <id>` returns `BUSY` | stop; another session holds this node or an ancestor | — |\n\nTwo of those rows are not about `/prove` at all and are the point of the table: **a node can be perfectly provable and still not worth proving**, because its ceiling is held elsewhere or because the register already knows the statement is false.\n\nThe one row nobody expects: `status: gapped` is **not** a failure. The statement stands, the argument stands, nobody has refuted anything, and the node scores *silent* rather than −1.0 ([ADR 0076](../decisions/0076-a-gap-is-a-prompt.html)). What it wants is an appendix entry, and `gaps/g<n>.md` is already the prompt that asks for one.\n\n## The two facts that explain most confusion\n\n**No operator can do another's job.** `/prove` cannot fix a statement; when the statement is what is wrong it stops and hands to [`/update`](operators/update.html). That stop is the run's product, not its failure — a referee whose verdict could rewrite the claim is not a referee. Since [ADR 0078](../decisions/0078-generalize-is-its-own-operator.html) `/update` cannot generalize one either: that is [`/generalize`](operators/generalize.html), and it is a command you choose to run rather than a step every correction walks through.\n\n**Cheapest first is also best first.** [`/check-goal`](operators/check-goal.html) costs one agent and can tell you a node is not worth proving. `/prove` costs up to six and cannot tell you that until the last one. The pipeline has written 2 `goalcheck.md` files against 55 critique rounds, which is the wrong way round. See [statistics](statistics.html).\n\n## What a run always leaves behind\n\nA run that changed no statement still owes the reader something. Since [ADR 0077](../decisions/0077-the-ask-is-a-line-on-the-node.html) that is the node's one-line **`needs:`** field — what is missing, and what the repair is worth against `confidence()` — written by `/prove` when a round closes `FAIL` and by `/update` whenever it judged a node and left it negative. It rides into the generated `<id>_prompt.md`, so the ask leaves the repository with the packet.\n\n**An `/update` on a node is therefore never a no-op**: it changes the statement, or it changes this line.\n\n## Where the time goes\n\n```\nper /prove run                             before        now\n├── prover, critic, checker ......... node-local, unchanged\n├── render gate .................... 78 s   ⛔    →   0.6 s  ✅  --only <dir>\n├── site build ..................... 24 s   ⛔    →   deferred to the batch\n└── commit ......................... shared ⛔    →   gone   ✅  the user commits\n                                     ─────              ─────\n                                     ~102 s             ~10 s + one 35 s close per batch\n```\n\n[ADR 0069](../decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html). `python3 tools/batch.py close` is the join; `claim` / `release` is an advisory node lock for when two sessions share the working tree, which is this repository's recurring operational hazard. It is also what makes two node-local `/update` runs on disjoint subtrees **commute** — see the endofunctor laws in [operators/update.md](operators/update.html).\n";</script>
