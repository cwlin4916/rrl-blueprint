<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>research-status</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>`/research-status`</h1><p class="lead">Generated from <code>process/pipeline/operators/research-status.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](index.html) · [actors](../../../../process/pipeline/actors) · [flaws](../flaws.html) · [decisions](../../../../process/decisions)\n\nSkill: [`.claude/skills/research-status/SKILL.md`](../../../skills/research-status.html). **No subagent, no writes to the record.**\n\nA **readout**, not an operator. The test is deletion: delete a readout's output, recompute it, and nothing has been lost. Delete a critique and evidence is gone; delete this report and it was never written down.\n\nPrints, per question: proved / failing / ready / open, the DAG's own consistency, and a suggested next action.\n\n## What it checks\n\n- a `required-by` missing its transpose\n- a dangling object link\n- a node whose question has no section\n- a missing or stale `<id>_prompt.md`\n- a generated page that no longer matches the blueprint\n\n## What it may do about it\n\n| finding | action |\n|---|---|\n| unambiguous and mechanical — a missing transpose, a stale page | fix it |\n| needs a judgement, including a dangling object link | **report, never invent** — `/decompose` adds appendix entries |\n| anything at all | **never commit** ([ADR 0069](../../decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)) |\n\n## The one honest exception\n\nIts tallies are a function of the repository state. Its **suggested next action** is model output and is not. That is why the suggestion is printed and never written into a node: it is advice, not a record.\n\n## See also\n\n[`tools/stats.py`](../../../../tools/stats.py) answers the other question — not *where does the DAG stand* but *what has the pipeline actually done*, counted from the artifacts each operator leaves behind. See [statistics](../statistics.html).\n";</script>
