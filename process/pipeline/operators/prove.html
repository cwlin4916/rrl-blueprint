<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>prove</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>`/prove &lt;node-id&gt;`</h1><p class="lead">Generated from <code>process/pipeline/operators/prove.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](index.html) · [actors](../../../../process/pipeline/actors) · [flaws](../flaws.html) · [decisions](../../../../process/decisions)\n\nSkill: [`.claude/skills/prove/SKILL.md`](../../../skills/prove.html). Actors: [prover](../actors/prover.html), [critic](../actors/critic.html), [checker](../actors/checker.html), sometimes [lead-researcher](../actors/lead-researcher.html) and [example-finder](../actors/example-finder.html).\n\nWrites a one-page argument for one node and puts a hostile referee on it. It is the only operator that changes a `status:`.\n\n```\n/prove <id>\n├── 1 node gate ....... read <id>_node.md                    ✅ parallel\n├── 2 prover .......... write proof.md                       ✅ parallel\n├── 3 render gate ..... check_render.py --only <dir>  <1 s   ✅ parallel\n├── 4 critic .......... write critiques/r<n>.md              ✅ parallel\n├── 5 write-back ...... status: in <id>_node.md              ✅ parallel\n├── 6 presentation .... one checker per file written         ✅ parallel\n└── 7 close ........... batch.py close              ~35 s    ⛔ once per batch\n```\n\n## The budget\n\n**Two rounds per invocation, and at most one widening** ([ADR 0030](../../decisions/0030-the-prove-budget-cap.html)). Round numbering on disk is a different thing: it continues from whatever `critiques/` already holds, so a re-proved node reaches `r6` rather than restarting.\n\nThe cap is a spending decision, not a claim about mathematics. A node that passes in one round costs about 270k subagent tokens; a second round roughly triples it, because the r2 prover packet is larger and usually pulls a widening and a second critic behind it. Round 3 was never reached on any node in this repository, so it bought nothing and stood to cost the most.\n\n## What each verdict means for the node\n\n| verdict | `status:` becomes | next |\n|---|---|---|\n| `PASS` | `proved` | suggest [`/examples`](examples.html) — the literature channel is still silent |\n| `FAIL` at r1 | unchanged | round 2, prover gets the critique |\n| `FAIL` at r2 | `failing` | the user decides whether the node is worth more |\n| `REFUTED` | `failing` | [`/update`](update.html), and never `/prove` again |\n\n## The refutation branch\n\nA `REFUTED` verdict, or a prover that reports the statement false and refuses to draft, does **not** let `/prove` fix anything — a `## Statement` is written by [`/update`](update.html) and by nobody else. What the run does instead is check it, record it, and hand it over:\n\n1. **Read the literature before believing it.** The refutation goes to the example-finder: is the corrected form already in print? A refutation nobody has read against the record is one agent's opinion.\n2. **Record the false version verbatim** in `<id>_history.md`, in a blockquote. The claim the project believed is preserved where a reader can find it, because the statement is about to be replaced.\n3. **Suggest a corrected statement**, labelled as a suggestion. It is not adopted and no proof may cite it.\n4. Verify `git diff` on the node file shows a change to `status:` and nothing else.\n\n## Why it cannot just hand back an updated node\n\nBecause then it would be marking its own work. `/prove` writes the argument *and* records the verdict on it; if it could also rewrite the claim, a run that could not prove the statement would prove an adjacent one and report success. The separation is the whole of what makes `proved` worth reading.\n";</script>
