<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>create</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>`/create &quot;&lt;claim&gt;&quot;`</h1><p class="lead">Generated from <code>process/pipeline/operators/create.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](index.html) · [actors](../../../../process/pipeline/actors) · [flaws](../flaws.html) · [decisions](../../../../process/decisions)\n\nSkill: [`.claude/skills/create/SKILL.md`](../../../skills/create.html). Actor: [lead-researcher](../actors/lead-researcher.html), for the directory only.\n\n**The operator that leaves the current presentation of the problem.** Every other one works inside a fixed $P$.\n\n```\nresearch is not only     search inside  P\n\nit is also               P₀ ⟶ P₁ ⟶ P₂ ⟶ ⋯\n```\n\nBetween one $P_i$ and the next, a mathematician may change the **objects**, the **morphisms**, the **ambient category**, the **equivalence relation**, the **invariants**, or **what counts as a solution**. Since the objects are one of the things that move, it is easier to hold $P$ as a category than to fix what its objects are.\n\n## The two rules\n\n**The layer is the deepest node whose `## Statement` still holds unchanged** under the new claim's presentation, and the new node is its child. A statement quantifying over objects the new presentation does not have is a statement that does not survive. Nothing survives at the top, and the claim is a new question — which is [`/decompose`](decompose.html), not this.\n\n**The first history entry names which of the six moved, from what and to what**, at most two per invocation. If none moved, the claim lives inside the current presentation and the run is a `/decompose` on the parent it just found.\n\n## What it is not\n\n| the claim is | the operator is |\n|---|---|\n| a step toward an existing node's statement | [`/decompose`](decompose.html) on that node |\n| a *verified* claim strictly more general than a node | [`/generalize`](generalize.html) |\n| a correction to a statement that is false | [`/update`](update.html) |\n| inside the current presentation, with none of the six moved | [`/decompose`](decompose.html) |\n\nThree of the operator's four exits write nothing, and each names the operator that is actually wanted. On the evidence of `/generalize`, the commonest outcome of an operator with a real gate in front of it is that the gate fires.\n\n## What it writes\n\nOne node directory at the next free `-L<k>` under the parent, its `## Statement`, the transpose on the parent, and `<id>_history.md` whose first entry carries the six-line record. Nothing else, and no status anywhere changes.\n\n**The id carries no new segment** ([ADR 0088](../../decisions/0088-create-records-a-change-of-presentation.html)). A re-presentation is an ordinary `-L<k>` child, and that it *is* one lives in the history entry rather than in the filename: a seventh id letter would mean changing `Q\\d+(?:-[Leacz]\\d+)+` in two tools, several regexes and the tests, to buy a name that says what the record already says better.\n\nThe ten-child cap holds ([ADR 0050](../../decisions/0050-a-node-has-at-most-ten-children.html)). A parent already at ten does not get an eleventh, and the run reports the grouping it wants instead.\n\n## Why it exists\n\nThe move already happened here and nothing recorded it. A statement quietly started quantifying over a different category, and the record showed an `/update` with a true and uninteresting reason attached. Making the chain visible is the material for the second question this project opens on: whether provenance can carry the thinking rather than only the result.\n";</script>
