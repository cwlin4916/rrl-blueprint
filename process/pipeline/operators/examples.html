gap is on the record | −0.50 |\n| `counterexample` | a published counterexample is on the record | −1.00 |\n| *(no file)* | the search came back empty and wrote a prompt instead | silent — costs nothing |\n\n## Every finding says what it matches\n\nWhich clause of the statement, under what specialisation or sourced dictionary, and **what it does not reach** ([ADR 0036](../../decisions/0036-an-example-says-what-it-matches.html)). An entry that is an analogue rather than an instance says so in its heading and its first sentence, and analogues alone never earn `precedent`.\n\nThe run then reports the complement — **the clauses nothing in print touches**. That is usually the finding worth having: a clause the literature does not reach is either new or wrong, and either way the user wants to know now.\n\n## Where it stops\n\nIt does not. *Found nothing* is a successful run: it writes a self-contained prompt under the node's `prompts/` instead of an examples file, and the node's `examples:` field stays `—`.\n\n**An example with no verifiable source is worse than no example.** A fabricated citation is the one failure that would poison the record, because it is exactly what a reader will believe without checking.\n\n## What it may never do\n\nDischarge an obligation in a proof. `examples.md` is outside the closed world — no proof, node or appendix entry may cite it. It justifies *believing* a statement; it never establishes one.\n";</script>
