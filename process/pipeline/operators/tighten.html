claim could be lost in the\ncutting, and fail the run if the count did not strictly fall. The gate was sound —\nmechanical, and it could actually fail. It was gating the wrong thing. Shortening is one\nguess at what makes a write-up comprehensible, and a short write-up nobody can follow is\nexactly as useless as a long one.\n\nRecover it from git if you want to read it:\n\n```\ngit log --follow -- .claude/skills/tighten/SKILL.md\n```\n\n## What a specification has to do\n\nNot constraints on the mathematics — constraints on the command. Whatever comprehensible\nturns out to mean, four things hold.\n\n| it must | because |\n|---|---|\n| define comprehensible so a **run can fail** | a gate that cannot fail is not a gate — see [writing a skill](../writing-a-skill.html) |\n| leave every claim on the page | otherwise *improved a proof* and *lost one* stop being distinguishable |\n| let something **other than the run** check both | an agent's report of its own work is evidence, not proof |\n| touch no `## Statement` | that is [`/update`](update.html)'s, and freezing statements is what makes a referee's verdict mean something |\n\nThe second and third are why the old version froze the step headlines. A proof step is one\nclaim ([ADR 0043](../../decisions/0043-a-proof-step-is-one-claim.html)), so the list of\nheadlines *is* the argument's skeleton, and a frozen skeleton makes the difference\nmechanically checkable by `git diff`. Any replacement needs its own answer, not necessarily\nthat one.\n\n## Where it stops\n\nUnchanged, and independent of the specification.\n\n| stops when | hand-off |\n|---|---|\n| the statement is wrong | [`/update`](update.html) |\n| the write-up is doing several nodes' work | [`/decompose`](decompose.html) |\n| a step should not be there | that is a re-proof → [`/prove`](prove.html) |\n| a reader's question needs answering, not the prose fixing | [`/why`](why.html) |\n\n## What it may write\n\n```\nblueprint/nodes/<id>/\n├── proof.md          ✅ the target\n├── examples.md       ✅ prose only — EVIDENCE: frozen\n├── <id>_history.md   ✅ one appended dated entry\n├── <id>_node.md      ⛔ /update's alone — statement, status, needs\n├── <id>_prompt.md    ⛔ generated\n├── critiques/r<n>.md ⛔ append-only audit trail\n├── updates/u<n>.md   ⛔ append-only, and no statement moved\n└── gaps/g<n>.md      ⛔ append-only\n```\n\n## Not the checker pass\n\nEvery command that writes prose ends with a checker, and the checker is\n**content-preserving** — it reformats, and reformatting an unclear paragraph leaves an\nunclear paragraph. Whatever this operator becomes, it is the one allowed to change what the\npage says while keeping what it claims, and that is why it needs a gate the checker does\nnot.\n";</script>
