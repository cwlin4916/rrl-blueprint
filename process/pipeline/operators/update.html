<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>update</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>`/update [target] [with input &lt;passage&gt;]`</h1><p class="lead">Generated from <code>process/pipeline/operators/update.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](index.html) · [generalize](generalize.html) · [actors](../../../../process/pipeline/actors) · [flaws](../flaws.html) · [decisions](../../../../process/decisions)\n\nSkill: [`.claude/skills/update/SKILL.md`](../../../skills/update.html). **No subagent** — here the gate *is* the work, so what gets written is exactly what survived the orchestrator's own verification ([ADR 0019](../../decisions/0019-the-update-operator.html)).\n\nThe pipeline's one lawful way to change a `## Statement`, the only maintainer of each question's `## Pipeline`, and the command that turns the record's failures into commissioned nodes.\n\n```\n/update <id>                                       node-local, §1–§6\n├── 1 read ....... <id>_node.md — the statement AND the standing flaw\n├── 2 verify ..... every input claim → verified | refuted | unverified\n├── 3 revise ..... the minimal correct statement + updates/u<n>.md\n├── 4 record ..... history, status, and the needs: line — NEVER empty\n├── 5 propagate .. the neighbours whose statements cite the revised one\n└── 6 close ...... presentation, batch.py close, the route, the report\n\n/update                                            repo-wide, adds §7–§9\n├── 7 propose .... the failure audit → lead-researcher materializes\n├── 8 improve .... the machinery that let the defect through\n└── 9 rank ....... the llm rows, never a human row\n```\n\n## What it may and may not change\n\n| may | may not |\n|---|---|\n| a question's Setting / Problem statement / Conjecture | `human:` and `human` priority rows |\n| a node's `## Statement` | `created:`, ids, directories, edges |\n| a node's `needs:` line and its `<id>_history.md` | critiques, `examples.md`, the appendix |\n| `status:` — **only** to `open`, only when a `drafted`/`proved` statement materially changed | `main.tex`, by any path |\n| each question's `## Pipeline`, five rows at most | create a node directly — that is the lead-researcher's |\n| | **generalize** — that is [`/generalize`](generalize.html) |\n\n## The three rules that do the work\n\n**An input passage is a lead, never a source.** Every claim is recomputed against the appendix and the manuscript before a word of it is adopted, and all three columns — verified, refuted, unverified — are recorded. This caught a paraphrase that had quietly transposed a characteristic-zero theorem into equal characteristic.\n\n**A coining clause is a claim.** A property asserted in apposition to a definition has no prover, no critic and no dependency behind it. That is how `Q1-L3` carried an invalid closedness assertion through three operators.\n\n**A run is never a no-op.** It changes the statement, or it changes the node's one-line `needs:` field saying what the number is waiting on ([ADR 0077](../../decisions/0077-the-ask-is-a-line-on-the-node.html)). A run that did neither told the reader only that somebody had looked.\n\n## Where it stops\n\nIf the defect cannot be stated in one sentence against the current statement, there is no defect and nothing is revised — but §4 still runs, so the run still says what the node needs. A failure naming no crisp missing claim earns a priority row rather than a node. A verified claim that is *more general* than the target is not a defect at all: it stops here and goes to [`/generalize`](generalize.html).\n\n## What it reads\n\n`<id>_node.md` first, and mostly only ([ADR 0079](../../decisions/0079-update-reads-the-node-summary.html)). The node summary carries the `## Statement` **and** the generated flaw block, which quotes the record's own words — so the critique, the supersession record and `examples.md` are not re-read to learn what is wrong. What it does read beyond that: the appendix entries the statement links, *always*, because verification is against the entry and never against a paraphrase; the neighbours' statements, for §5; `proof.md`'s `## Lemma`, when a statement moved under a write-up.\n\n---\n\n# `/update` as an endofunctor\n\nThe command is a map from the tree to the tree, and almost everything the skill file spells out is a property of that map. It is worth writing down once, because the properties are what the gates check.\n\n## The category\n\nLet $\\mathbf{T}$ be the category whose objects are **states of the blueprint tree**. An object $T$ is the finite set of node ids, the containment and dependency edges between them, and for each node $v$ its four components\n\n$$\nv \\ = \\ \\bigl(\\ \\mathrm{stmt}(v),\\ \\mathrm{status}(v),\\ \\mathrm{needs}(v),\\ \\mathrm{rec}(v)\\ \\bigr),\n$$\n\nwhere $\\mathrm{rec}(v)$ is the append-only record: `updates/`, `critiques/`, `gaps/`, `<id>_history.md`. A morphism $T \\to T'$ is a **refinement**: an injection on ids preserving `created:` and every edge, under which each node's record only grows. Morphisms are histories — $T \\to T'$ says $T'$ is a later state of the same repository.\n\nWrite $\\mathrm{ids} \\colon \\mathbf{T} \\to \\mathbf{Set}$ for the functor sending a tree to its set of node ids.\n\n## The functor, and its point\n\n$$\nU \\colon \\mathbf{T} \\longrightarrow \\mathbf{T}, \\qquad \\eta \\colon \\mathrm{Id}_{\\mathbf{T}} \\Longrightarrow U .\n$$\n\n$U$ is the operator; $\\eta_T \\colon T \\to U(T)$ is **the run itself**, and it is a morphism of $\\mathbf{T}$ rather than an arbitrary function because nothing is destroyed — the old statement is in `updates/u<n>.md`, the old write-up and its critique rounds stay on disk. Append-only *is* the statement that $\\eta_T$ exists.\n\n```\n                       η_T\n          T ──────────────────────────▶ U(T)\n          │                              │\n        f │ refinement                   │ U(f)\n          ▼                              ▼\n          T' ─────────────────────────▶ U(T')\n                       η_T'\n```\n\nNaturality is the claim that updating and then carrying the tree forward agrees with carrying it forward and then updating. It is an idealization — a `/prove` round between the two can change what the update finds — and it is the reason [`batch.py claim`](../../decisions/0072-a-run-is-node-local-or-repo-wide.html) exists: the lock is what makes the square commute in practice.\n\n## Law 1 — it lies over the identity\n\n$$\n\\mathrm{ids} \\circ U \\ = \\ \\mathrm{ids}.\n$$\n\n**`/update` creates no node, deletes none, moves none, and rewires none.** This is the law that distinguishes it from every other operator, and the reason it is worth calling an endofunctor at all: every operator is an endofunctor of $\\mathbf{T}$, but only this one is the identity on the id-set. [`/decompose`](decompose.html) and [`/generalize`](generalize.html) come instead with a strict monomorphism\n\n$$\n\\mathrm{ids} \\ \\hookrightarrow \\ \\mathrm{ids}\\circ D, \\qquad \\mathrm{ids} \\ \\hookrightarrow \\ \\mathrm{ids}\\circ G ,\n$$\n\nwhich is exactly why they need the lead-researcher and `/update` does not, and why ADR 0078 took generalizing out of it: a section that added a node was a section that broke this law.\n\n## Law 2 — what moves, and what cannot\n\nPer node, and this is the whole of $U$ in one picture:\n\n```\nnode v                          U(v)\n├── id, created ............ ═   FIXED — Law 1\n├── role, depends-on ....... ═   FIXED — edges are the lead-researcher's\n├── objects ................ ═   FIXED — the closed world is the appendix's\n├── statement .............. →   revised, or left standing\n├── status ................. →   reset to open ⟺ the statement MATERIALLY moved\n├── needs .................. →   set, when the statement did not move\n├── updates/u<n>.md ........ +   appended                    ⊕ monotone\n└── history ................ +   one dated entry             ⊕ monotone\n```\n\nThe three rows marked `═` are fixed points of $U$ by construction, the two marked `→` are where the judgement goes, and the two marked `+` only grow — which is what makes $\\eta_T$ a morphism rather than a replacement.\n\n## Law 3 — $\\eta$ is never an identity on what it judged\n\nFor every node $v$ the run read,\n\n$$\n\\mathrm{stmt}\\bigl(U v\\bigr)\\neq \\mathrm{stmt}(v) \\quad\\text{or}\\quad \\mathrm{needs}\\bigl(U v\\bigr)\\neq \\mathrm{needs}(v),\n$$\n\nand in both cases $\\mathrm{rec}(Uv) \\supsetneq \\mathrm{rec}(v)$. This is [ADR 0077](../../decisions/0077-the-ask-is-a-line-on-the-node.html) stated as a law: a run of $U$ that left every component of a node alone would be $\\eta_T$ restricted to an identity, and a run that reports an identity has spent the reader's attention to say nothing.\n\n## Law 4 — disjoint runs commute\n\nWrite $U_v$ for the node-local run at $v$. For ids $v, w$ of which neither is a **segment**-prefix of the other,\n\n$$\nU_v \\circ U_w \\ = \\ U_w \\circ U_v .\n$$\n\nThat commutation is what [`tools/batch.py claim`](../../decisions/0072-a-run-is-node-local-or-repo-wide.html) enforces, and it is why the rule is *segment*-prefix and not string-prefix: `Q1-L3` blocks `Q1-L3-L2` because a node's directory contains its children's, and blocks neither `Q1-L30` nor `Q1-L5`. The repo-wide $U$ commutes with nothing, which is why it alone may write `main_dag.md`, a question's node file and `process/`.\n\n## Not a monad, but stationary\n\nThere is no useful multiplication $U^2 \\Rightarrow U$: running the operator twice genuinely does more work, because §5 propagates a revision outward one layer at a time. What holds instead is weaker and is the honest claim — **with no new input, the statement component is stationary from the first run**, since §3 revises nothing whose defect it cannot state in one sentence, while the record component grows strictly at every run. So iterating $U$ converges on statements and never on history, which is the correct behaviour for an audit trail and the reason a second `/update` on an unchanged node is cheap rather than idempotent.\n\n---\n\n## The recommended route\n\nEvery run ends by saying where the next piece of work should happen ([ADR 0057](../../decisions/0057-update-recommends-a-route.html)) — **in Claude Code** when the obstacle is in the repository, **to an external model** when it is in the literature (hand it the generated `<id>_prompt.md`, which is self-contained, non-citable, and now carries the `needs:` line as its ask), or **to the user** when the field waiting is `human:`.\n";</script>
