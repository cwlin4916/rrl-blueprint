<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>decompose</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>`/decompose &lt;question&gt;` | `/decompose &lt;node-id&gt;`</h1><p class="lead">Generated from <code>process/pipeline/operators/decompose.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](index.html) · [actors](../../../../process/pipeline/actors) · [flaws](../flaws.html) · [decisions](../../../../process/decisions)\n\nSkill: [`.claude/skills/decompose/SKILL.md`](../../../skills/decompose.html). Actor: [lead-researcher](../actors/lead-researcher.html).\n\nTwo operators sharing a name, because the codomain is the same on both.\n\n| argument | what it does |\n|---|---|\n| a **question** | adds a question section and its first layer of lemma statements |\n| a **node id** | expands that one lemma into `<id>-L1`, `<id>-L2`, … which become its dependencies |\n\n**The parent's statement is never touched.** A decomposition adds children and the edges to them, and nothing else on the parent ([ADR 0074](../../decisions/0074-the-decomposition-paragraph-is-removed.html)); the claim itself is frozen ([ADR 0019](../../decisions/0019-the-update-operator.html) owns that).\n\n## The decomposition is the strategy\n\nThis is the step that cannot be skipped and the one where a mistake is most expensive. A wrong cut wastes every proof downstream of it, and no amount of care in the individual proofs recovers it. Review the statements before running [`/prove`](prove.html) on any of them.\n\n## Where it stops\n\n**Ten children, and no more** ([ADR 0050](../../decisions/0050-a-node-has-at-most-ten-children.html)). Past ten the card stops being a picture and becomes a list, and [`main_dag.md`](../../../dag.html) is already the list. `/decompose` counts the container first and refuses the eleventh, naming the grouping it wants instead:\n\n- a child written to serve one sibling goes **under** that sibling — a lemma an example needs is `<e-node>-L1`;\n- a family of siblings sharing a job gets a node naming the job, and they become its decomposition.\n\nNever delete, and never hide behind a fold. `Q1` at 16 children and `Q2` at 12 are the standing violations, and `--check` names them as notes rather than failures, because clearing one means moving directories and a moved node breaks the links its append-only critiques wrote at it.\n\n## It is the only operator that widens the closed world\n\nNew appendix entries are written here and nowhere else. Adding one is safe — every existing proof stays valid. *Narrowing* one is not: a ratified reading that fixes a meaning the entry left open invalidates every draft written against the looser reading, and those must be re-refereed. That has happened once, and the append-only critique numbering is what leaves the seam.\n";</script>
