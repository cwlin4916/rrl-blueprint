| no entry could see it | nothing |\n| `tension` | an entry strains against it | **+25%** |\n| `contradicted` | an entry falsifies it | **−50%** |\n\n**It can only lower a number, never raise one.** Surviving the bench is the absence of evidence against a statement, not evidence for it — so there is no verdict that adds confidence, and `consistent` merely declines to remove any.\n\nA `degenerate` entry — the group case, where $\\mathrm{IC}_0$ is the monoidal unit — can never on its own earn `consistent` ([ADR 0040](../../decisions/0040-the-key-example-register.html)). A statement that is *empty* at a degenerate case and one that is *true* there are different, and only the second is evidence.\n\n## The distinction the register exists for\n\nA source that realizes the **whole** automorphic category is a positive for the goal question. One that realizes only the Satake subcategory establishes the standing hypothesis and leaves the question untouched. Devalapurkar's own footnote 5 is the case in point.\n\n## Where it stops\n\nIt does not stop early. `untested` is a real verdict, and it says something useful: this statement is invisible to every case where the answer is known, so nothing on the bench will ever tell you whether it is right.\n\n**It never writes the register.** The bench is the user's and [`/update`](update.html)'s, so an operator cannot widen the standard it is judged against.\n";</script>
