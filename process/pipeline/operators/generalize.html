<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>generalize</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>`/generalize &lt;node-id&gt; [with input &lt;passage&gt;]`</h1><p class="lead">Generated from <code>process/pipeline/operators/generalize.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](index.html) · [update](update.html) · [actors](../../../../process/pipeline/actors) · [decisions](../../../../process/decisions)\n\nSkill: [`.claude/skills/generalize/SKILL.md`](../../../skills/generalize.html). Orchestrator owns the judgement; the **lead-researcher** materializes the node, because only it creates directories.\n\nThe command that turns \"this is true more generally\" into a node instead of into a wider statement. It was [`/update`](update.html) §3 until [ADR 0078](../../decisions/0078-generalize-is-its-own-operator.html).\n\n```\n/generalize <id>\n├── 1 read ........ <id>_node.md + the appendix entries its statement links\n├── 2 gate ........ three tests, ALL must pass — and most runs stop here\n├── 3 id .......... <id>-z<k>, the instances edge, and what stays untouched\n├── 4 commission .. the general statement → lead-researcher\n├── 5 record ...... a history entry on the target — never a statement edit\n├── 6 gates ....... --check enforces the z rules\n└── 7 report ...... the specialization in one line, then /prove <id>-z<k>\n```\n\n## The rule, and it is the whole command\n\n**A statement is never widened in place.** The general claim becomes a new node; the target is left standing, unedited, as its specialization. The record then shows a theorem *gained* rather than a statement quietly moved, and the work already proved under the old statement stays proved.\n\nWidening in place discards the referee rounds the old statement survived, without saying that it did — which is the same defect as a superseded write-up under a `proved` status, one level up.\n\n## The three tests\n\nAll three, or the run stops and says which one failed.\n\n| test | passes when | fails to |\n|---|---|---|\n| **strictly more general** | the specialization is written out, as a substitution, in one line | nothing — there is no abstraction |\n| **verified** | recomputed against the appendix and `main.tex`, not against the passage | a priority row |\n| **it buys something** | a second instance already in the tree, or a step of an existing proof it discharges | nothing — the node is narrow, and that is fine |\n\nThe honest outcome of most invocations is the third row. A general statement that no second node instantiates and no argument shortens is notation, not mathematics.\n\n## Where it stops\n\n| stops when | hand-off |\n|---|---|\n| any of the three tests fails | report which; usually nothing is owed |\n| the claim is that the target is **wrong** | that is a defect → [`/update`](update.html) |\n| the run wants to edit the target | wrong command → [`/update`](update.html) |\n| the container is busy | `batch.py claim` said `BUSY`; report who holds it |\n\n## The edge is specialization, not dependency\n\n`instances:` on the new node is the whole of it. There is no transpose, and four things follow ([ADR 0064](../../decisions/0064-an-abstractions-id-names-what-it-generalizes.html)):\n\n```\nQ1-L2       level 0   the special case            ⛔ untouched — statement, status, deps, proof, critiques\nQ1-L2-z1    level 1   what Q1-L2 specializes      ✅ created here, role: proof, instances: Q1-L2\nQ1-L2-z2    level 2   what Q1-L2-z1 specializes      sits BESIDE z1, not inside it\n```\n\n- the instance acquires **no obligation** — a node with a proof does not gain one by being recognized as a special case;\n- the instance contributes **no ceiling** — confidence never follows an `instances` edge;\n- the abstraction is **not a decomposition member** — no sub-lemma tally, no ten-wide fan-out cap, no folding into the instance's card;\n- `role:` is **`proof`**, always. `--check` fails anything else, and fails an `instances:` that is missing, dangling, or not strictly lower.\n";</script>
