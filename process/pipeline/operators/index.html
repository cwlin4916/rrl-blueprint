<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Operators — what each one does, and where it stops</h1><p class="lead">Generated from <code>process/pipeline/operators/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [actors](../../../../process/pipeline/actors) · [flaws](../flaws.html) · [statistics](../statistics.html) · [decisions](../../../../process/decisions)\n\nTen operators. Each takes one node or one question, writes into that node's directory, and hands back to the user. One of them, `/tighten`, currently has a goal and no specification.\n\n**The thing to know first: no operator can do another's job.** `/prove` cannot fix a statement, `/update` cannot prove one, `/update` cannot generalize one, `/decompose` cannot judge one. This is deliberate — it is what makes a referee's verdict mean something — and it is also the answer to *why does `/prove` not just give me an updated node*. When the statement is what is wrong, `/prove` stops and says so. That stop is the run's product.\n\n## The ten\n\n| operator | takes | writes | typical cost | ends in |\n|---|---|---|---|---|\n| [`/decompose`](decompose.html) | a question, or a node | new node directories, appendix entries | 1 agent + n | statements, never proofs |\n| [`/check-goal`](check-goal.html) | a node | `goalcheck.md` | **1 agent** | a ceiling on confidence |\n| [`/examples`](examples.html) | a node | `examples.md` or `prompts/examples.md` | 1–2 agents | an `EVIDENCE:` verdict |\n| [`/prove`](prove.html) | a node | `proof.md`, `critiques/r<n>.md`, one status | **2–6 agents** | `PASS`, `FAIL`, or `REFUTED` |\n| [`/update`](update.html) | a node or question, ± an input | `updates/u<n>.md`, a new `## Statement`, a `needs:` line | 1 orchestrator + n | a corrected statement, or the ask |\n| [`/generalize`](generalize.html) | a node, ± an input | a new `<id>-z<k>` node | 1 orchestrator + 1 | an abstraction, or a stop |\n| [`/tighten`](tighten.html) | a node | **nothing — unspecified** | 0 agents | a referral, and the goal it is owed a specification for |\n| [`/create`](create.html) | **a claim** | one node, at the deepest surviving layer | 1 orchestrator + 1 | a placement, or a referral |\n| [`/why`](why.html) | a node **and a reader's question** | `why/w<n>.md`, ≤ 300 words | **0 agents** | a pointer, or an honest \"nobody here knows\" |\n| [`/research-status`](research-status.html) | nothing | nothing | 0 agents | a report |\n\nCheapest first is also *best* first. `/check-goal` costs one agent and can tell you a node is not worth proving; `/prove` costs up to six and cannot tell you that until the last one.\n\n## Who may change a `## Statement`\n\n```\n/decompose ... creates statements ......... never touches an existing one   ⛔\n/prove ....... reads the statement ........ may not write it                ⛔\n/examples .... reads the statement ........ may not write it                ⛔\n/check-goal .. reads the statement ........ may not write it                ⛔\n/generalize .. writes a NEW statement ..... never the target's              ⛔\n/tighten ..... unspecified ................ but never the statement         ⛔\n/create ...... writes a NEW statement ..... never an existing one            ⛔\n/why ......... reads the statement ........ may not write it, or any field  ⛔\n/update ...... writes the statement ....... the only one                    ✅\n```\n\nA statement is frozen so that a referee reviews a fixed claim. Revision is not forbidden — it goes through `/update`, which leaves a seam: an `updates/u<n>.md` record, a status reset to `open`, and a dated entry in the node's history.\n\n## Where each one stops\n\nEvery stop is a result. None of them is an error.\n\n| operator | stops when | hand-off |\n|---|---|---|\n| `/decompose` | the container already holds ten children | group first, then decompose |\n| | a proposed node has no crisp statement | it becomes a priority row |\n| `/check-goal` | the node's question carries no `**Goal.**` | nothing to check against |\n| | the register cannot see the statement | `GOALCHECK: untested` — a real verdict |\n| `/examples` | nothing is in print | writes `prompts/examples.md`, which is a successful run |\n| `/prove` | **`role: thought`** | a thought states nothing a referee could certify |\n| | **the last critique is `REFUTED`** | → `/update`, and never `/prove` again |\n| | **`FAIL` at round 2** | → the user decides if the node is worth more |\n| | a second `GAP` needs a second new appendix entry | the node was cut against the wrong world → `/decompose` |\n| | the render gate fails twice | `failing`, with \"render failure\" in the node file |\n| | already `proved` | asks first — re-proving discards a write-up that passed |\n| `/update` | it cannot state the defect in one sentence | then there is no defect to fix — but the `needs:` line is still written |\n| | the input claim does not verify against the repo | recorded as refuted or unverified, never adopted |\n| | the verified claim is strictly **more general** | → [`/generalize`](generalize.html); never widen in place |\n| `/generalize` | any of its three tests fails | usually nothing is owed — the node is narrow, and that is fine |\n| | the claim is that the target is **wrong** | that is a defect → [`/update`](update.html) |\n| `/tighten` | **always** — there are no steps to run | say so, and name the operator that is wanted ([ADR 0092](../../decisions/0092-tightens-goal-is-comprehension-and-its-specification-is-open.html)) |\n| `/research-status` | never | it only reads |\n\n**An unproved dependency never stops anything.** There is no `blocked` node ([ADR 0045](../../decisions/0045-there-is-no-blocked-node.html)). A dependency contributes its *statement*, and a statement is as usable before it is established as after — that is what it means for the DAG to carry statements rather than write-ups. What the run owes instead is disclosure: which assumed facts the write-up actually used.\n\n## Every operator ends the same way\n\n```\n1  write the artifact ............... node-local            ✅ parallel\n2  check_render.py --only <dir> ..... node-local, <1 s      ✅ parallel\n3  presentation pass ................ one checker per file  ✅ parallel\n4  content-preservation diff ........ orchestrator's own    ✅ parallel\n5  batch.py close ................... WHOLE REPO, ~35 s     ⛔ once per batch\n6  report ........................... to the user\n```\n\nThere is no step 7. **No operator commits** ([ADR 0069](../../decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)) — `git add blueprint/` staged a tree rather than a run, and swept concurrent work into the wrong commit. The user commits.\n\nStep 5 is the only shared step, which is why several operator runs on different nodes can proceed at once and close together. `python3 tools/batch.py claim <id>` takes an advisory lock when another session is working.\n";</script>
