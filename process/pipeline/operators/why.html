<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">process</a><i>›</i><span>why</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>`/why &lt;node-id&gt; &quot;&lt;question&gt;&quot;`</h1><p class="lead">Generated from <code>process/pipeline/operators/why.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](../../pipeline.html) · [operators](index.html) · [actors](../../../../process/pipeline/actors) · [flaws](../flaws.html) · [decisions](../../../../process/decisions)\n\nSkill: [`.claude/skills/why/SKILL.md`](../../../skills/why.html). Actor: **none** — the main thread is the whole operator.\n\n**The reader-facing operator.** Every other operator here answers a question the *machine* has about a node. This one answers a question a **person** has, and the person supplies it.\n\n## The gap it fills\n\nThree things a node already says about itself, and the one it does not:\n\n| written where | answers |\n|---|---|\n| `status:` and the generated flaw block | **what is wrong** ([ADR 0062](../../decisions/0062-a-node-states-its-own-flaw.html)) |\n| the `needs:` line | **what would make it right** ([ADR 0077](../../decisions/0077-the-ask-is-a-line-on-the-node.html)) |\n| `<id>_history.md` | **what has happened to it**, dated |\n| — | **why it is here at all** |\n\nThe fourth is the one a reader opening a graph of 113 nodes actually wants, and it is answered by different people than the other three: the flaw is in the critique and on disk, and the reason is usually a judgement recorded in prose somewhere nobody thought to look.\n\n## The shape\n\nOne file per question, `why/w<n>.md`, numbered and append-only exactly like a critique round. Three sections and no others — `## Question`, `## Short answer`, `## Where to read further` — and **at most 300 words**, which the render gate *fails* rather than reports.\n\nThe cap is the operator. Past three hundred words an explanation has stopped delegating and started arguing, and an argument belongs in a write-up a referee reads, not in a panel nothing may cite.\n\n## Four rules, and where each comes from\n\n**The question is a required argument.** Explanation is contrastive: a reader asks why *this* rather than *that*, and an operator that guesses the foil answers a question nobody asked. So the user types it, and it is recorded **verbatim** — the phrasing is the evidence about what was unclear, and a later reader comparing the question to the answer is the only test this operator has.\n\n**Every claim ends in a pointer.** A post-hoc explanation of a process nobody observed is a second model that can simply be wrong about the first. The repository is read before the literature and the local library before the web, and the third section must link something or the gate fails.\n\n**If it needs an argument, it is not a `/why`.** The run writes nothing and names the operator that is wanted: [`/prove`](prove.html) for a claim, [`/decompose`](decompose.html) for a missing sub-lemma, [`/examples`](examples.html) for whether it has appeared in print, [`/update`](update.html) for a statement that is wrong.\n\n**\"Nobody here knows\" is a legitimate answer.** It is written down, and its next action is the node's own generated packet — self-contained by construction ([ADR 0029](../../decisions/0029-every-node-has-a-generated-self-contained-prompt.html)) — pasted into a deep-research model that has never seen this repository. Whatever comes back is a lead and re-enters through `/update` or the appendix, never through this file.\n\n## What it cannot do\n\n**It moves no number.** Not a status, not a statement, not `needs:`, not `human:`, not a confidence channel — and there is deliberately **no machine-readable line in the file at all**, which the gate enforces. A verdict attached to an explanation is an explanation worth gaming, and this one has nothing to game.\n\nIt is outside the closed world, like [`examples.md`](examples.html) and for the same reason ([ADR 0071](../../decisions/0071-the-closed-world-is-the-appendix.html)). Nothing may cite a `/why` note, so a wrong one costs a reader some minutes and can never corrupt an argument.\n\n**It has no subagent.** The answer is a pointer into records the main thread has already read, and a delegate that has not read them writes a plausible paragraph in place of a citation — which is exactly the failure the third section exists to catch.\n\n## Where it shows up\n\n`tools/build_dag_site.py` draws each note as a `<details>` panel **above the node's statement**, closed by default, in the place an example hangs. The panel's summary is the reader's question; its body is the note, through the same renderer as every other document; and its footer says, on every panel, that nothing may cite it.\n\nThe generated `<id>_prompt.md` does **not** carry it. The packet carries what a reader needs in order to *work* on the node ([ADR 0063](../../decisions/0063-a-prompt-carries-what-is-needed-to-work.html)), and an explanation of why the node exists is not a working input.\n";</script>
