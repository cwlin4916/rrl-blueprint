the date and reason it went. `tools/check_render.py` and `tools/build_dag_site.py` both read its first column: a link to `blueprint/nodes/**/<id>_node.md` for a listed id resolves to the register instead of failing, and the site renders it at `nodes/removed.html`. It is outside the closed world — nothing may cite it, and it is a record of what is *not* on the DAG.\n\n`GRAPH_QUESTION_ONLY` is deleted. A question with no nodes draws as a card alone and its footer reads **not started**, derived from the tally, so nothing has to be kept in step by hand.\n\n## Why\n\n**A decomposition nobody has attempted is a guess, and fifteen of them read as work.** All fifteen nodes were `open`: no draft, no critique, no example, no goal-check, no history past the commit that made them. [0094](0094-a-question-with-nothing-worked-on-is-drawn-as-a-card-alone.html) stopped drawing them on the graph and argued that the record and the readout are different things. That is true, and it left the repository asserting on disk a shape of argument nobody had tested, in fifteen directories that `/prove` and `/update` would read as prerequisites. The owner's instruction was to start from scratch, and the honest form of that is deletion.\n\n**The reason 0094 did not delete was link breakage, and the register is the answer to it.** Twenty-four files linked into those directories, and twelve of them are append-only — histories, supersession records, a journal entry — which this repository never rewrites. A dangling link is a hard failure in the gate, so deletion looked like it cost either twelve forbidden edits or a permanently red gate. It costs neither: **the link resolves to the register**, which is exactly what [0086](0086-an-appendix-link-resolves-by-stem.html) already does for an appendix entry that has been re-sectioned. Same problem, same shape of answer — a link is a name for a thing, and where the thing has gone is a question the resolver answers, not the record.\n\n**A register is worth more than a tombstone.** `process/todo.md` and `blueprint/priorities.md` are empty files kept so links resolve. One page for every removed node, carrying what each claimed and why it went, is the same trick doing a second job: it is the first thing to read before a `/decompose` reopens either question, and it says in one line why the previous cut was not worth keeping.\n\n**A hand-kept display list is a fact stored twice.** `GRAPH_QUESTION_ONLY` named the questions whose subtree the graph would not draw. With the nodes deleted the set is derivable — a question with no nodes has no subtree — and this repository derives what it can: confidence, importance, `ready`, the flaw block, the index tree.\n\n## Consequences\n\n- The fifteen statements are recoverable from git history and from nowhere else. `git show 164047f:blueprint/nodes/Q3/Q3-L1/Q3-L1_node.md` and its analogues.\n- The gate's §4 reports the count — *83 naming a node that has been removed* — beside the appendix restems, so the resolution is visible rather than silent.\n- Eight canonical references were repointed by hand rather than left resolving to the register: [`key_examples.md`](../../key_examples/index.html) K3, which claimed a removed node was \"the repository's only sufficient condition\", and the fine print of [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html), which listed removed nodes among those leaning on it. A link that resolves is not the same as prose that is true.\n- Six node statements and two records under `process/` still name a removed node in prose. Their links resolve; revising a `## Statement` to chase a deletion is `/update`'s decision and not this one's.\n- The register grows. Every future removal appends a row, dated, under its own heading, and nothing else changes.\n";</script>
