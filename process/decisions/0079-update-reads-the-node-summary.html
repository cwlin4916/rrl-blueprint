<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0079-update-reads-the-node-summary</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0079 — An operator reads the node summary first</h1><p class="lead">Generated from <code>process/decisions/0079-update-reads-the-node-summary.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-08\n**Status:** accepted\n**Amends:** [0019](0019-the-update-operator.html) (the update operator), in its §1\n**Extends:** [0062](0062-a-node-states-its-own-flaw.html) (a node states its own flaw), [0072](0072-a-run-is-node-local-or-repo-wide.html) (a run is node-local or repo-wide)\n\n## Context\n\n`/update` §1 said: read the whole repo, root-first. Per target that meant `main_dag.md`, `context.md`, every appendix entry the target cites, `<id>_node.md`, `<id>_history.md`, `proof.md`, the latest critique, `examples.md`, `updates/`, both neighbour directions, `papers/guideline.md` and `priorities.md`.\n\nThat list was written before [0062](0062-a-node-states-its-own-flaw.html). Since 0062 a node file carries a generated flaw block, between the field block and `## Statement`, which quotes **the record's own words**: every standing FATAL/MAJOR of the last round for a `failing` node, the defect sentence of the supersession for one revised and not re-proved, the `EVIDENCE:` line with what nothing in print touches, the gap commission for a `gapped` one. The block fires on every node that has anything wrong with it — `needs_change`, `gapped`, `human: doubted`, `EVIDENCE: gap`, `superseded`, revised-and-open, and `failing` are the seven triggers, and between them they cover every state in which `/update` has work to do.\n\nSo the read list had a load-bearing redundancy in it: four of its entries were re-read to recover a paragraph the first entry already printed. `/update` paid the repository's whole context on every target to learn something `<id>_node.md` said in the first screen.\n\n## Decision\n\n**Start at `<id>_node.md`. It is the node summary, and it carries the statement and the standing defect.** The critique, the supersession record and `examples.md` are **not** re-read merely to learn what is wrong with a node.\n\nFour things the summary does not carry, each read exactly when the run needs it:\n\n| read | when |\n|---|---|\n| the appendix entries the `## Statement` links | **always**, for any operator that verifies — verification is against the entry, never against a paraphrase |\n| the direct neighbours' `<id>_node.md`, statements only | propagation, and only for those whose statement cites this one |\n| `proof.md`'s `## Lemma` block | only when the node has a write-up and the statement moved |\n| `<id>_history.md`, `critiques/`, `updates/`, `examples.md` in full | only when the flaw block's quotation genuinely is not enough to state the defect — and the run says in its report that it was not |\n\nA repo-wide run still reads `main_dag.md` and `context.md` first, because a question's framing is not in any node file and a repo-wide run may write it.\n\n**The generated `<id>_prompt.md` is still never read as a source**, by this or any other operator. That is unchanged and is not an economy — it is [0029](0029-every-node-has-a-generated-self-contained-prompt.html).\n\n## Why this is not just \"read less\"\n\nBecause the substitution is exact and the gate proves it. The flaw block is generated from the same records it replaces, by `flaw_block()` in `tools/build_dag_site.py`, and `--check` fails a stale one. Reading the block instead of the critique is not a summary standing in for a source; it is the *same words*, quoted by a build that fails when they drift. That is the property the old read list did not have and could not have: nothing checked that a human reading four files reached the same defect the record states.\n\nThe escape hatch matters and is deliberately narrow. When the quotation is not enough — a flaw whose force is in an argument the block truncated — the run reads the full record **and says so**. A silent widening of the read list is how the old §1 got to twelve entries.\n\n## Consequences\n\n- `/update` §1 is rewritten around the node summary and a four-row table of exceptions.\n- The same rule is written into `/generalize` §1 at its creation.\n- [I44](../pipeline.html#4-invariants) is new and is stated for operators generally, not for `/update` alone: `/prove`, `/examples` and `/check-goal` already read the node file first, and the invariant makes that a rule rather than a habit.\n- Nothing about what `/update` may *write* changes. The node-local / repo-wide split of [0072](0072-a-run-is-node-local-or-repo-wide.html) is untouched.\n- The saving is in context, not in correctness, and the correctness argument is the one above: the block is generated from the records, so reading it is reading them.\n";</script>
