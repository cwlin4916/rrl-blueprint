<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0083-tightening-is-its-own-operator</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0083 — Tightening is its own operator, and it freezes the skeleton it cuts around</h1><p class="lead">Generated from <code>process/decisions/0083-tightening-is-its-own-operator.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-08\n**Status:** accepted\n**Completes:** [0060](0060-a-write-up-has-two-budgets.html), whose second remedy never got a command\n**Bounded by:** [0031](0031-presentation-is-a-stage-not-a-command.html), which deleted `/check`\n\n## Context\n\n[ADR 0060](0060-a-write-up-has-two-budgets.html) gave a long write-up two remedies and printed both in the gate's own output:\n\n1. `/decompose` the node.\n2. Move what it *restates* into `blueprint/appendix/` and link it.\n\nIt said the second is the one that **compounds** — an entry is written once and shortens every write-up that was restating the same object, while splitting only ever helps the node you split. Then it built a command for the first and none for the second. A remedy with no operator is a remedy nobody runs, and this one was not run.\n\nMeasuring all thirty-eight write-ups today:\n\n```\nn = 38     mean 1008     median 909     max 1495 / 1500\npast the 1000-word split signal ....... 13\n   of those, past 1200 ................ 11\n   of those, past 1400 ................  2      longest: Q1-L3-L3-L1 at 1495\n```\n\nTwo write-ups sit between 1000 and 1200; eleven sit above 1200. That is not a spread under a ceiling, it is a cluster against one with a gap below it — the same shape [ADR 0060](0060-a-write-up-has-two-budgets.html) found piled against 900, one cap later, and the outcome it named as the risk it could not prevent: *\"the risk is that 1500 becomes the new target, and nothing here prevents that.\"*\n\n0060 also said what the conclusion would be if this happened: *\"it will be that `/prove` is being asked to do work `/decompose` should have done first.\"*\n\n**On the drafting of this record that sentence was judged half wrong, and the first run of the operator showed it was right.** The draft asserted that the longest write-up, [Q1-L3-L3-L1](../../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/proof.html) at 1495 words, was long because Steps 1, 4, 5 and 7 re-derive four facts its own linked entries assert. Checked against the entries rather than against the draft's memory of them, one of the four holds: [presentable categories](../../appendix/conv-prl.html) does define $\\mathrm{Pr}^L$ by colimit-preserving functors, and Steps 1 and 7 each re-derive that. The other three do not. [`DGCat`, `Vect`](../../appendix/conv-dgcat.html) contains no occurrence of *stable* — Step 1's passage from the definition to stability is genuine mathematics; no entry asserts $\\mathcal{D}_c$ is idempotent-complete, so Step 5 proves it; and [small relative tensor product](../../appendix/def-small-relative-tensor.html)(2) does assert the $\\mathrm{Ind}$ adjoint equivalence, which is why Step 7 *cites* it rather than re-deriving it.\n\nThe real restatement in that file is **21 words**, and the run that removed them took it 1495 → 1474. What the other 474 words over the signal are: sixteen proof steps averaging 62 words, and a 359-word `## Lemma` block mirroring the node's statement, which is [`/update`](../pipeline/operators/update.html)'s and not the write-up's to cut. That node wants `/decompose`.\n\nSo the case for this operator is **not** that any one write-up is mostly restatement. It is structural: remedy 2 is the one that compounds, thirteen write-ups are past the signal, and nothing in the pipeline could perform it — the checker is forbidden it, `/update` is about statements, and `/prove` wrote the draft. An operator whose first run cuts 21 words and then says *the honest remedy here is `/decompose`* is the operator working. The alternative was a `/decompose` run on a node nobody had checked for restatement first.\n\nThe checker cannot do it. It is content-preserving by construction and its instructions forbid exactly this move: *\"Never restate the statement of a `blueprint/appendix/` entry. You may reformat it.\"* Reformatting a restatement leaves a restatement, correctly formatted.\n\n`/update` cannot do it either, and should not learn how. A bloated write-up is not a wrong statement, and `/update` §2's business is statements.\n\n## Decision\n\n**A new operator, `/tighten <node-id>`, which cuts a write-up down to what only that node can say.** It rewrites `proof.md` and `examples.md` and nothing else in the directory. Four kinds of cut, in priority order: restatement of an appendix entry becomes the link alone; repetition inside the file becomes its first occurrence; slop becomes nothing; ornament in the mathematics becomes the plain form.\n\n**It freezes the skeleton it cuts around.** The `## Lemma` block byte for byte, and every `**Step n — …**` headline byte for byte — no step deleted, merged, renumbered or reordered. This is the whole safety argument. A proof step is one claim ([ADR 0043](0043-a-proof-step-is-one-claim.html)), so the list of headlines *is* the argument's skeleton, and freezing it makes \"shortened a proof\" and \"lost one\" mechanically distinguishable — by comparison against a copy taken before the first edit, and by `git diff` only where the file is tracked. The first run found its target's whole node directory untracked, which makes a diff-based check pass on anything; the copy is therefore the gate and the diff is the second look. A body may shrink to a single citation; the claim it discharges stays on the page, under its own number, where the critique round that read it can still find it.\n\n**It never grows the closed world.** Cuts land only against an entry already on disk. Where a restatement has no entry to become, it stays, and the run *names the entry it wants* in its report and in the node's history — which is the next `/decompose`'s work, recorded nowhere else today.\n\n**The word count must strictly fall.** A run that shortened nothing did not run. This is the one operator in the pipeline with a numeric success condition, and it has one because its whole subject is a number.\n\n**It has no subagent.** The judgement \"this paragraph restates that entry\" requires the entry read against the write-up, which is the judgement `/generalize` §2 keeps in the main thread for the same reason. The **checker** closes the run, as it closes every run.\n\n**It changes no status.** A `proved` node stays `proved`, and the frozen headlines are why that is honest: the critique rounds still apply to the argument they read, step for step.\n\n## Consequences\n\n**It does not reopen `/check`, and the boundary is the point.** [ADR 0031](0031-presentation-is-a-stage-not-a-command.html) deleted `/check` because presentation is wanted immediately after a command wrote prose, which makes it a stage. This is wanted on a file **nobody just wrote** — one that reached 1495 words across a prover run and a referee round, neither of which was the moment to notice that Steps 1 and 7 both re-derive an entry they cite. 0031 ruled that *\"reformatting a file nobody just wrote is now an ordinary editing request\"*, and that ruling stands for reformatting. Cutting is not reformatting: it removes text, which is why it needs a freeze, a numeric gate and a record, and none of those belong in an ordinary editing request.\n\n**The two commands compose, in one order.** `/tighten` before `/decompose`, always. Splitting a write-up that restates the appendix produces two write-ups that restate the appendix, and the split is then made along whatever seam the padding happened to leave. Tightening first shows what is actually left, and the report says whether a split is still wanted.\n\n**`examples.md` gains a second writer.** It was the example-finder's alone. `/tighten` may cut its prose with the `EVIDENCE:` line frozen; the write-discipline note in `CLAUDE.md` and the table in [`operations.md`](../operations.html) both say so.\n\n**A failure mode this introduces:** a run that judges a justification to be restatement, cuts it, and leaves a step whose body no longer discharges its headline. The freeze does not catch this — the headline is intact and the count fell. Nothing mechanical catches it, and the honest position is that the guard is the requirement to read every linked entry in full before cutting against it, plus the fact that the step is still there to be re-refereed. If it happens, the remedy is the ordinary one: a fresh round on a node that is still `proved` and should not be.\n\n## Alternatives rejected\n\n**Teach the checker to cut.** Rejected. Content-preservation is what makes the checker safe to run automatically at the end of four other commands without a human reading the diff. An agent that may delete a paragraph on the grounds that an entry covers it is not that agent, and giving it both jobs means every presentation pass in the repository acquires the failure mode above.\n\n**Make it a stage of `/prove`.** Rejected on the evidence. The prover writes to a 1500-word cap and the bloat is what it wrote; asking the same run to notice it is asking for the compression [ADR 0060](0060-a-write-up-has-two-budgets.html) already found costs rigour rather than words. The cut wants a separate pass with the entries open, which is a separate invocation.\n\n**Let it write the missing appendix entries.** Rejected, and this is the constraint that keeps the operator small. Growing the closed world is the lead-researcher's through `/decompose` or a gap ([ADR 0076](0076-a-gap-is-a-prompt.html)), it is the one thing in the pipeline that a human decision is supposed to gate ([I1](../pipeline.html#4-invariants)), and an operator whose job is to remove text should not also be the one adding premises.\n\n**Name it `/simplify`.** Rejected for a host reason rather than a repository one: `simplify` is already a built-in Claude Code skill name, and a project skill sharing it is ambiguous at the prompt. `/tighten` also says the thing that is actually gated — the count goes down.\n";</script>
