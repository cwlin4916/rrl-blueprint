<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0010-site-untracked-and-renamed</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0010 — The generated site is untracked, and is called `blueprint_site/`</h1><p class="lead">Generated from <code>process/decisions/0010-site-untracked-and-renamed.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Amends:** [0007](0007-generated-dag-view.html) (the generated view lived at `docs/` and in git),\n[0009](0009-one-tree-per-kind.html) (named `docs/` as the generated tree; the *principle* stands, only the path changes)\n\n## Context\n\nThe question raised was whether `blueprint/` and `docs/` should both exist at all — whether to drop the markdown source tree and author the HTML directly, since the browser is where the work is actually read and one tree is simpler than two.\n\nMeasured at commit `a32c787`:\n\n| | |\n|---|---|\n| `blueprint/` | 21 markdown files, 268 KB |\n| `docs/` | 94 HTML pages, 121 tracked files, 1.3 MB — **56% of the repo by tracked file count** |\n| of which vendored KaTeX | 600 KB, a byte-for-byte second copy of `tools/vendor/` |\n| churn | 12 of 19 commits touched `docs/`; 3,742 lines added and 1,806 removed there, against 2,265 and 524 in `blueprint/` |\n| git remote | none |\n\nThe last row is the one that decided it. `docs/` is the folder name GitHub Pages serves from, and nothing was serving it: the only consumer was a local browser opening `file://`.\n\n## Decision\n\nTwo changes, and no third.\n\n1. **The generated site is no longer tracked.** `blueprint_site/` is in `.gitignore`, alongside `build/` and `*.pdf`. It is still regenerated by `tools/build_dag_site.py` at the end of every `/decompose`, `/prove` and `/check`, exactly as before.\n2. **`docs/` is renamed `blueprint_site/`.** Every reference in the tooling, the skills, the agent definitions, `CLAUDE.md`, `README.md`, `blueprint/main_dag.md` and the live process documents was updated; `journal.md`, the earlier decision records and the critiques were not, because they are append-only records of what was true when written.\n\n**Markdown remains the source.** The collapse-to-HTML proposal is rejected.\n\n## Justification\n\nThe site stands to the blueprint as the PDF stands to `main.tex`, and the repo already gitignores every PDF and the whole of `build/` on exactly that reasoning: an artifact that one command reproduces byte-for-byte is not a thing to store versions of. [I8](../pipeline.html#4-invariants) already required that reproducibility and checks it; tracking the output anyway was storing a derivation the repo can redo on demand.\n\nThree costs were being paid for that. Git's answer to \"what changed?\" was dominated by rebuild noise — a commit adding two lemma statements read as a hundred-file commit. KaTeX was stored twice. And the `STALE` half of `build_dag_site.py --check` existed only to detect a stored site drifting from its source, which cannot happen once the site is always rebuilt.\n\nThe collapse-to-HTML half is rejected on three mechanisms the repo currently relies on, not on taste:\n\n- **Derived fields would become typed fields.** `required-by` is the transpose of `depends-on`; `ready` and `blocked` are computed at display time and stored nowhere; the graph geometry is derived from the edges. With HTML as the source each becomes hand-maintained in every place it appears, inverting [I5](../pipeline.html#4-invariants).\n- **The human review needs a readable diff.** Reviewing a decomposition is the one step that cannot be delegated, and it is performed by reading a diff. Seven `node.md` files diff readably; seven HTML pages plus a regenerated graph payload do not, so the review stops happening.\n- **Agents read raw text.** Each `/prove` packet inlines the node's statement and the full text of every appendix entry it cites. From HTML those arrive with tags and navigation attached, and the model must infer which text is the mathematics.\n\nThe rename follows from the untracking rather than standing on its own: `docs` was never a description, only GitHub's magic folder name, and once the folder is not being served the name is misleading — the actual documentation is `process/` and `README.md`.\n\n## Consequences\n\n**Accepted.** A fresh clone has no site until `python3 tools/build_dag_site.py` runs. The generator and the vendored KaTeX are both tracked, so that build is offline and deterministic. No collaborator can browse the DAG from a clone without Python — which is the cost that a remote would remove, and the reason to revisit this.\n\n**Gained.** Tracked file count falls from 216 to ~95. Commit diffs show research changes and nothing else. The `STALE` class in `--check` becomes vacuous. One copy of KaTeX.\n\n**Unchanged.** Every invariant, every gate, every agent's write discipline, and the whole `blueprint/` schema. This decision is about where an artifact is stored and what it is called, not about how anything is produced.\n\n## Alternatives\n\n**Keep it tracked at `docs/` and publish with GitHub Pages.** The genuinely strong alternative: it is the only way Toan and Jize read the DAG without installing Python, and with three authors and auditability as the design target it is where this may well end up. It lost on the fact that there is no remote today — the tracked tree was paying its full cost for a reader who does not exist yet. Reversing is cheap, and there are two routes: re-track a folder named `docs/`, undoing both decisions, or have GitHub build the site itself and serve the output, which does not care what the folder is called and keeps the history clean. The second is preferred.\n\n**Collapse to HTML, delete the markdown.** Lost on the three mechanisms above. Worth recording that its strongest form is not weak: roughly 90 of the 94 pages are a nicer rendering of a markdown file GitHub would render for free the moment a remote exists, and only the graph pages and the rendered write-ups are irreducible. The argument for the split is about how the *source* is edited, reviewed and read by agents — not about what the reader sees.\n\n**Untrack but keep the name `docs/`.** Lost for being the worse of both: it keeps a name whose only meaning is a publishing convention the repo is no longer using, while a reader still has to be told the folder is not documentation.\n";</script>
