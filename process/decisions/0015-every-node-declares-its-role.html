<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0015-every-node-declares-its-role</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0015 — Every node declares its epistemic role</h1><p class="lead">Generated from <code>process/decisions/0015-every-node-declares-its-role.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Extends:** [0014](0014-confidence-is-three-signed-channels.html) (the confidence channels\nand their aggregation), [I10](../pipeline.html#4-invariants) (examples illustrate, never\njustify)\n\n## Context\n\nThe DAG treated every node as a step of its question's argument, and one of them is not.\nQ1-L7 — the group case — is a check: nothing depends on it, the logical closure cites it\nonly as verification (\"Q1-L7 verifies equality in the group case\"), and its job is to\ncorroborate the expected answer, not to advance it. The user asked that each node state\nwhat it is: a step of a proof, evidence, an example, or a thought.\n\nLeaving the distinction implicit had two costs, one for the reader and one for the number.\nThe reader could not tell: a `prop · ready` index line looked the same for a chain lemma\nand for a sanity check, so \"Proved 2/11\" counted a corroboration as an unmet obligation.\nAnd the aggregate lied: a question's confidence is its weakest node, so an untouched\nQ1-L7 pins Q1 at 0% even in the state where every lemma the answer actually rests on is\nproved — the number would report the argument as unsupported because a check *on* it had\nnot been run.\n\n## Decision\n\n**`node.md` gains a required field, `role: proof | evidence | example | thought`.**\n\n- **proof** — a step of the question's argument. The logical closure cites proof nodes\n  and nothing else. The default: a lemma DAG is made of these.\n- **evidence** — corroboration: a precise, provable claim (a special case, a consistency\n  check, a compatibility) whose truth supports the expected answer without being a step\n  of it. Q1-L7 is the type specimen.\n- **example** — a worked instance promoted to a node of its own, when it needs a\n  directory rather than a line in some node's `examples.md`.\n- **thought** — exploration: a direction stated so it can be developed, not yet a claim\n  a referee could certify.\n\nFour rules give the field its meaning:\n\n1. **A proof node may depend only on proof nodes.** Evidence illustrates, never\n   justifies — [I10](../pipeline.html#4-invariants) at node scale. `--check` fails on a\n   violation.\n2. **Tallies and aggregate confidence range over the proof chain alone.** The question's\n   tally, the question's confidence, and the repository's confidence take their weakest\n   link over proof nodes; corroboration is counted apart (`· evidence 0/1`). Every node\n   still carries its own confidence on its own card.\n3. **`/prove` refuses a thought node** — it states nothing a referee could pass or fail.\n   Evidence and example nodes go through `/prove` unchanged, at the same bar of rigor\n   for their own statements.\n4. **The lead-researcher sets the role at creation; only the user changes it.** A\n   reclassification changes what the question's numbers mean, which is a human call.\n\nQ1-L7 becomes `evidence`; the other ten Q1 nodes are `proof`.\n\n## Justification\n\n**Role is not type and not status.** `type: prop` describes the statement's flavour;\n`status: open` describes the stage. Neither says what the node is *for*, and Q1-L7\nshowed the three axes coming apart: a prop, open, whose openness was no gap in the\nargument.\n\n**The aggregate must range over what the answer rests on.** Weakest-link is the right\nshape for a chain (ADR 0013, kept by 0014) precisely because a chain fails at its\nweakest link. A corroboration is not a link: its absence leaves the argument exactly as\nstrong, and its refutation — which *would* matter — already propagates through the\n`human:` and literature channels of the nodes it contradicts, or arrives as a\n`counterexample` verdict. Ranging the minimum over corroboration conflates \"the argument\nhas an unproved step\" with \"a check on the argument has not been run\".\n\n**Explicit beats inferred.** The role could have been read off the graph — `required-by:\n—` as \"corroboration\". Rejected below; the short form is that a leaf is a position, not\na purpose.\n\n## Consequences\n\n- Every `node.md` carries one more line; the eleven existing nodes gained it, Q1-L7 as\n  `evidence`, the rest as `proof`. `--check` rejects a missing or unknown role, a proof\n  node depending on a non-proof node, and a `proved` thought.\n- The index bullet shows the role when it is not `proof`; the tally line splits —\n  `Proved 2/10 · … · evidence 0/1` — so the denominator is the argument again. The site\n  card and node page show the role the same way.\n- `ready`/`blocked` derivation stays role-blind, so an open thought leaf would display\n  as **ready** — \"ready to prove\" for a node `/prove` refuses. Accepted rough edge: no\n  thought node exists yet; revisit the display when one does.\n- A *proved* evidence node contributes nothing to its question's number. The natural\n  refinement — folding proved corroboration into a question-level literature channel,\n  beside `examples.md`'s `EVIDENCE:` line — is deliberately not taken: the green card is\n  already visible, and 0014's weights were not designed for a fourth input.\n\n## Alternatives considered\n\n**Overload `type:`.** One field, no new line. Rejected: it conflates the statement's\nflavour with its function, and `def-check` already occupies that axis as a full\nproof-chain citizen — Q1-L1 is a def-check and load-bearing.\n\n**Infer the role from the graph** — `required-by: —` means corroboration. Rejected: the\ninference is wrong in both directions. Every chain lemma is born a leaf mid-decomposition,\nand the terminal node of a finished argument is a leaf forever; neither is evidence.\n[I5](../pipeline.html#4-invariants)'s \"derive, don't store\" applies to facts something else\nalready records, and nothing records intent.\n\n**A per-question \"corroboration\" list in `main_dag.md`.** Rejected: the fact belongs to\nthe node it is about (I5 — stored once, where the thing lives), and a hand-written list\nis one more thing to drift out of date.\n";</script>
