<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0012-sub-lemmas-nest-in-their-parent</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0012 — A sub-lemma&#x27;s directory goes inside its parent&#x27;s</h1><p class="lead">Generated from <code>process/decisions/0012-sub-lemmas-nest-in-their-parent.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted; the \"generated site stays flat\" clause is amended by\n[0016](0016-the-site-mirrors-the-source-tree.html)\n**Amends:** [0005](0005-node-directories.html) (node directories were all siblings under\n`blueprint/nodes/`)\n\n## Context\n\n`/decompose Q1-L2` produced four sub-lemmas `Q1-L2-L1` … `Q1-L2-L4`, and wrote them as\n`blueprint/nodes/Q1-L2-L1/`, siblings of `blueprint/nodes/Q1-L2/` rather than children of\nit. The tree was one level deep however deep the mathematics went.\n\nThe id already recorded the whole ancestor chain — that is what `-L` means, and ids are\nnever renumbered precisely so that the chain stays readable. So the parent relation was\nstored twice: once in the name, where it was authoritative, and once in the directory\nlayout, where it was absent. Nothing could check one against the other, because there was\nnothing to check *against*: every node sat at the same depth by construction, and a\ndirectory named `Q1-L2-L1` beside `Q1-L2` was indistinguishable from one that belonged\nthere.\n\nThe generated site had never had this problem. It draws one graph per scope — the root\nquestion at `blueprint_site/dag.html`, then one page per decomposed node holding its direct\nchildren — so the site had modelled the tree correctly since [0007](0007-generated-dag-view.html)\nwhile the source it was built from had not.\n\n`process/operations.md` had argued the flat layout was deliberate, on the grounds that\nnesting *\"would change a node's path on the day it was decomposed, breaking every link\nwritten before that day.\"* That objection does not survive being stated precisely, and\nthe reason is recorded under **Consequences** below.\n\n## Decision\n\n**A node's id is its path.** Split the id at each `-L`, take the successive prefixes, join\nwith `/`. `Q1-L1` sits at `blueprint/nodes/Q1-L1/`; `Q1-L2-L1` at\n`blueprint/nodes/Q1-L2/Q1-L2-L1/`; `Q1-L2-L1-L1` one level below that. This is\n[I12](../pipeline.html#4-invariants), and `tools/build_dag_site.py --check` fails on a node\nthat sits anywhere else.\n\n**Every directory keeps the full id as its name.** `Q1-L2/Q1-L2-L1/`, not `Q1-L2/L1/`. The\npath is then redundant with the name rather than a replacement for it, so \"the directory\nname is the node id\" survives, and with it `proof.md`'s sibling files, the `critiques/`\ntrail, and every tool that reads a directory name.\n\n**The generated site stays flat.** `blueprint_site/nodes/<id>/index.html` keeps its URL at\nany source depth. A URL that moves when a node is decomposed is a URL that cannot be cited,\nand the site already shows the hierarchy through its per-scope graph pages.\n\n**Relative links are worked out, never copied.** A node whose id contains `d` occurrences\nof `-L` sits `d` levels below `blueprint/nodes/`, so `../` repeated `d+1` times reaches\n`blueprint/`. Between nodes the link is the ordinary relative path: the parent is\n`../node.md`, a child `<child-id>/node.md`, a sibling `../<sibling-id>/node.md`.\n\n## Alternatives considered\n\n**Keep the flat tree.** The status quo, and defensible: it made every node's path a\nconstant, and the id was already enough to recover the tree for anyone who knew the\nconvention. Rejected because \"enough to recover for anyone who knew the convention\" is\nwhat a checkable invariant replaces. The concrete gain is that `rm -rf` on a node now\ntakes its sub-lemmas with it and `ls` shows the decomposition — both properties\n[0009](0009-one-tree-per-kind.html) already argued for when it moved critiques inside the\nnode directory, applied one level up.\n\n**Name child directories by the segment alone** — `Q1-L2/L1/`. Shorter, and the path\ncomposes to the id. Rejected: it breaks the identity between a directory's name and the\nnode it holds, so `Q1-L2-L1`'s write-up would sit in a directory called `L1`, and every\nreader — tool or human — would have to reconstruct the id by walking back up the path.\n\n**Mirror the nesting in `blueprint_site/` too.** Consistent, and the relative-link\narithmetic in the generator is already depth-generic. Rejected because it changes every\ndeep node's URL for no reading benefit; the site conveys depth through breadcrumbs and\nper-scope graphs, which is better than conveying it through path length.\n\n## Consequences\n\nThe objection the flat layout was chosen to avoid does not apply to this scheme, and it is\nworth being exact about why. A decomposition only ever *creates* directories, always\nbeneath a node that already exists; the parent does not move when it gains children, and\nneither does anything else. `Q1-L2` was at `blueprint/nodes/Q1-L2/` before this change and\nis there after it. So no link written before a decomposition is invalidated by that\ndecomposition — going forward, nesting is exactly as stable as flatness.\n\nWhat did cost something was applying the layout *retroactively*, which is a different\noperation: four directories moved, and every file pointing at them needed repair — the four\nnode files' own breadcrumbs and appendix links, the parent's `depends-on` and\n`## Decomposition`, and 62 `used by` links in `blueprint/appendix.md`. Those were rewritten\nby the rule rather than by hand, so the same script stays correct for the next node that is\ndecomposed. The generated index in `main_dag.md` needed no repair at all, being generated.\n\nThe real ongoing cost is that a node's depth is now variable, so a relative link out of a\nnode file can no longer be copied from a neighbour — `../../appendix.md` is right for a\ntop-level lemma and wrong for a sub-lemma. This is a new way for an agent to be subtly\nwrong, and it is handled in three places: the rule is stated once in `.claude/agents/checker.md`\nand referenced from the other contracts, each orchestrator resolves the id to a path itself\nand passes the resolved path to its subagent rather than letting it join one, and\n`tools/check_render.py` resolves every relative link and fails on a break.\n\nNesting also created a hazard that flatness did not have: a parent's directory now\n*contains* its children's, so \"write only inside your node's directory\" stopped meaning\n\"write only your node's files\". Without a further word the prover for `Q1-L2` could\nlegally overwrite `Q1-L2-L1`'s write-up, and the critic for `Q1-L2` could overwrite a round\nof its child's append-only critique trail. Both write boundaries now say **directly**\ninside, and say that a path containing a further node id belongs to another node.\n\nOne defect surfaced while making the tools depth-agnostic, and it is the same shape as the\none [0009](0009-one-tree-per-kind.html) recorded. The first version of the position check\nread each node file from where the id *said* it should be, so a misplaced node made the\nchecker die on a missing path instead of reporting the misplacement it existed to find. A\ngate must read the world as it is and compare it to the rule, never assume the rule to\nread the world.\n";</script>
