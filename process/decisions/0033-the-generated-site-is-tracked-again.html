<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0033-the-generated-site-is-tracked-again</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0033 — The generated site is tracked again, in a private repository</h1><p class="lead">Generated from <code>process/decisions/0033-the-generated-site-is-tracked-again.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Amends:** [0010](0010-site-untracked-and-renamed.html) — reverses its first clause only. The name `blueprint_site/` stands, and so does the principle that the site is generated and never hand-edited.\n\n## Context\n\n[ADR 0010](0010-site-untracked-and-renamed.html) untracked the site, and the row of its table that decided the matter was the last one:\n\n| | |\n|---|---|\n| git remote | none |\n\nNothing was serving the site, so the only consumer was a local browser opening `file://`, and tracking 121 files of reproducible HTML bought nothing against 56% of the repository by file count.\n\nBoth halves of that have since changed. There is now a remote — `github.com/cwlin4916/ramifiedrelative`, **private** — and the site is the form in which the blueprint is actually read: 318 pages with the DAG graph, per-node cards, proofs, critiques and the appendix cross-linked, against a markdown tree that a reader has to reconstruct that structure from by hand.\n\nThe cost ADR 0010 measured is real and is not disputed here. It is now a cost the repository accepts, for one thing it buys: a clone carries the readable form of the work without python, without a rebuild, and at the state of the commit rather than the state of the checkout.\n\n## Decision\n\n**`blueprint_site/` is tracked.** The `.gitignore` entry is removed; `build/` and the `papers/` PDFs stay ignored, and nothing else about the generated tree changes.\n\nThe site remains generated in every other respect. `tools/build_dag_site.py` still reproduces it in full, no agent and no human edits a page by hand, and `--check` still rejects a stale readout — which is now also what keeps the tracked copy honest, since a commit whose site does not match its sources is exactly the failure tracking a generated artifact invites.\n\n`tests/test_docs.py::test_the_generated_site_is_tracked` is the mirror of the test it replaces: it asserts the site is present and that a later `.gitignore` edit has not quietly excluded it again.\n\n## What this does not do\n\n**It does not publish anything.** The repository is private, and no GitHub Pages site is configured — the API returns 404 for `repos/cwlin4916/ramifiedrelative/pages`, and enabling Pages was declined. This ADR records a change in what the repository *carries*, not in who may read it.\n\n**It does not make the site viewable on github.com.** GitHub serves `.html` from a repository view as source, not as a rendered page, so the way to read the site is still to open `blueprint_site/index.html` from a checkout. What tracking changes is that the checkout already has it.\n\n## Consequences\n\nChurn returns, and it is worth stating its size rather than leaving it to be discovered. A full rebuild rewrites 318 pages, so any command that ends by regenerating the site — which is all of them, by [I17–I18](../pipeline.html#4-invariants) — can put a large diff in a commit whose mathematical content is one node. Reviewing a commit means reading the source half and letting the generated half follow.\n\nThe 20 vendored KaTeX fonts are 12 MB of the tree and will not change again; the HTML is text and compresses, so growth per commit is bounded by how much of the blueprint a run actually touches.\n\nIf the repository is ever made public, this record is where to look first: at that point the site becomes world-readable along with everything else, and that is a separate decision from this one.\n";</script>
