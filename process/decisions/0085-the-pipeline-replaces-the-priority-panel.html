<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0085-the-pipeline-replaces-the-priority-panel</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0085 — The pipeline replaces the priority panel</h1><p class="lead">Generated from <code>process/decisions/0085-the-pipeline-replaces-the-priority-panel.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-09\n**Status:** accepted\n**Supersedes:** [0020](0020-the-priority-panel.html), whose stored half is removed and whose derived half is kept unchanged\n**Requires:** [0084](0084-a-question-is-a-node.html), which gives a question a file to carry it\n\n## Context\n\n[ADR 0020](0020-the-priority-panel.html) gave the repository one file of ranked judgements, `blueprint/priorities.md`, with rank as line order, a stored severity per row, and two authors — `llm` rows from `/update`, `human` rows from the user alone.\n\nCounted at the last commit before this record:\n\n```\nrows ................. 52          in the working tree, 72\nby llm ............... 52\nby human ..............  0         the two-author split, unexercised\nseverity: amber 22 · yellow 16 · red 9 · info 5\nquestions covered ..... 4          in one flat list, ranked by line order\n```\n\nThree things are wrong with that, and none of them is the file being long.\n\n**Rank across questions is not a quantity anyone has.** `P70` and `P3` sat adjacent. One is about a transcription error in [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html) that weakened a necessary condition in Q1; the other asks for a recollement appendix entry Q1-L5 needs. Both are real, and putting them in one order asserts a comparison nobody made. A reader arriving at the panel could not tell which question a row belonged to without decoding the node id in it.\n\n**A stored severity can go stale silently.** A row could say `red` about a node that had since been proved, and no gate would catch it: severity was authored beside the judgement and never re-read against the target. Confidence and importance in this repository are both derived for exactly this reason ([ADR 0014](0014-confidence-is-three-signed-channels.html), [ADR 0058](0058-importance-is-derived-and-sizes-the-card.html)), and the panel was the one ranking that stored its own.\n\n**A row said what was wrong, never what it would buy.** The schema is *target — why, one sentence*. So the panel recorded attention and not a plan, and the question a reader actually has — *what are the next few things to do, and what does each get me* — was answerable only by reading all seventy-two rows and doing the ranking oneself. Several rows had by then decayed into status reports: `P8` reads \"discharged apart from the proof\", `P11` reads \"**discharged**\", `P12` reads \"superseded by P27\".\n\nThe user's summary was that the panel is not interpretable, and the count is the mechanism: it grew by twenty rows between two commits, monotonically, because nothing in the schema retires one.\n\n## Decision\n\n**Each question carries a `## Pipeline` section: at most five next actions, ranked, each with its justification.** The stored half of the panel moves onto the question whose confidence the action buys. `blueprint/priorities.md` is emptied of rows and kept as a tombstone, because the critiques, supersession records and node histories that link it are append-only and are never rewritten.\n\nOne row:\n\n```\n- **<k>.** `<operator> <target>` · [<target>](<relative link>) — <why, and what it buys>\n```\n\n**The operator is named, and it is a real one.** A slash command, or `appendix` where what is owed is an entry rather than a run. A row a reader cannot execute is a row that ranks nothing.\n\n**The row stores no confidence number.** The current one is derived, and a derived fact is never written down ([ADR 0014](0014-confidence-is-three-signed-channels.html)). The site prints the target's status and confidence beside the row, so the reader sees the live number next to the claim about what would change it.\n\n**Severity is read off the target, not stored.** Red is a node a referee found something wrong with, amber a node whose confidence is negative, yellow work that is merely next. A row is now unable to lie about the state of what it points at.\n\n**Five, and the cap is the point.** A ranking nobody reads to the end ranks nothing, and seventy-two rows is the demonstration. Five per question is twenty across the repository, and each twenty is grouped by the question it serves.\n\n**It is authored, never generated.** Which missing fact would clear a defect is a mathematical judgement no gate can compute — the same reason `needs:` is authored ([ADR 0077](0077-the-ask-is-a-line-on-the-node.html)). `/update` writes it, and the user may overrule any row.\n\n**The derived half is unchanged.** Warnings the record itself implies — failing nodes, negative confidence, revised-but-unproved statements, the ready frontier — are still recomputed at every build and stored nowhere. The site renders both together, at `blueprint_site/pipeline.html`.\n\n## Consequences\n\n**`/update` is never a no-op, and now has a third way not to be.** It either changes a statement, changes a `needs:` line, or re-ranks a pipeline. All three say what the number is waiting on.\n\n**The two-author split is dropped.** Zero `human` rows were ever written in 52. The user's judgement enters where it already does — the `human:` field, which no agent may write — and a user who wants a row reordered edits the pipeline directly.\n\n**`P<k>` numbers are gone.** They were append-only within the file's history and had reached 74 while ranking 52 live rows, so the id told a reader nothing except that the file was old. A pipeline row is identified by its question and its rank.\n\n**The gate checks shape, not judgement:** at most five rows, ranked 1..n without gaps, every target resolving, one to three sentences under a ninety-word budget, balanced `$`. It cannot check whether the ranking is right, and does not pretend to.\n\n## Alternatives rejected\n\n**Keep the panel and prune it.** Rejected: pruning is what nobody did for 52 rows. The schema had no retirement rule and adding one only moves the discipline problem.\n\n**Keep the panel for cross-question work.** Some rows genuinely span questions — a missing `refs.bib` key, a defect in the gate. Rejected, because those have owners already: an appendix problem is a row on the question that needs the entry, and a machinery problem is `process/pipeline.md` and a journal entry. A second ranked list to hold the leftovers is the panel again, smaller.\n\n**Derive the pipeline from the record.** Rejected. The derived warnings layer already does what can be computed, and it was never the missing piece: it can say *this node is failing*, and it cannot say *fixing this one first is worth more than fixing that one, because the second is blocked on an appendix entry nobody has written*. That sentence is the whole value of the section.\n";</script>
