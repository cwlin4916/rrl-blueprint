now several times the length of the\nstatement it belongs to, so the panel answered \"what has happened to this node\" at\nlength before the reader had finished reading what it claims. Meanwhile every graph\npage embedded a full copy of every drawn node's history in its mounted JSON, for a\nsection the reader had to scroll past.\n\nThe node's own page never had this problem: it has always shown the statement and\nput `history` in its meta list as a link to `history.html`.\n\n## Decision\n\n**The panel carries what the node claims, and links what has happened to it.**\n\n- The `History` section is removed from the panel. `<id>_history.md` keeps its own\n  generated page, and the panel's **Pages** list keeps its existing entry —\n  *history — every dated entry in this node's life* — which is now the only route to\n  it from the graph.\n- The history text is dropped from the mounted payload rather than merely hidden, so\n  a graph page carries the statements it draws and nothing it does not render.\n- What stays in the panel is the statement, the decomposition where there is one, and\n  the navigation a reader needs to go anywhere else: sub-lemmas, dependencies,\n  objects, Pages.\n\n**Node creation is where this is documented.** The lead-researcher writes the\ncreation entry into `<id>_history.md` and the statement into `<id>_node.md`, and the\n`/decompose` packet now says why the split matters at the far end: the statement is\nwhat every readout shows, the history is a page the readouts link. A node file that\nabsorbs its own life is not just against [0027](0027-a-node-carries-its-history.html);\nit is text that will be rendered where only the statement belongs.\n\n## Consequences\n\n- A reader who clicks a node gets its claim, immediately, at the top, with no dated\n  bullets between the statement and the dependency list.\n- Nothing is lost: [0027](0027-a-node-carries-its-history.html)'s record is intact, in\n  its own file, on its own page, one click away from every node in the graph and\n  named in the node page's meta list.\n- Every graph page gets smaller by the size of the histories it was carrying, which\n  grows with every `/update` run — the deletion compounds.\n- The rule generalizes and is worth remembering as one: **a readout shows the\n  statement and links the record.** The generated `<id>_prompt.md` is the deliberate\n  exception, since a portable packet has nothing to link to\n  ([0029](0029-every-node-has-a-generated-self-contained-prompt.html)).\n";</script>
