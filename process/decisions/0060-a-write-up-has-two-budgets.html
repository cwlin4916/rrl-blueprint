<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0060-a-write-up-has-two-budgets</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0060 — A write-up has two budgets, and only the larger one is a gate</h1><p class="lead">Generated from <code>process/decisions/0060-a-write-up-has-two-budgets.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Supersedes:** the 900-word figure of [0008](0008-one-page-per-object.html) as applied to `proof.md`\n**Extends:** [0043](0043-a-proof-step-is-one-claim.html) (a proof step is one claim), [0053](0053-the-appendix-is-a-directory.html) (the appendix is a directory)\n\n## Context\n\n`proof.md` was capped at 900 words, and the cap failed the render gate. The number was\ncalibrated when `Q1-L1` at 713 words was the densest write-up the pipeline had produced, and\nthe comment above the constant said so: \"a real ceiling with room above the worst case\nrather than a number that will fire on the next proof.\"\n\nMeasuring all twenty-seven write-ups showed that had stopped being true. Four were over the\ncap, and of the twenty-three under it, **seventeen sat between 866 and 900 words** and two\nsat at exactly 900. The distribution was not spread under a ceiling; it was piled against\none, with a clear gap down to the next cluster at 789.\n\nThat is what writing *to* a limit looks like, and it costs the cap its whole purpose. The\n900 existed to be a **split signal** — [0043](0043-a-proof-step-is-one-claim.html) says a\nproof that will not fit is several nodes, and splitting is the first response to a full\npage rather than the last. A budget that everything is pressed against cannot signal\nanything, because it no longer distinguishes a node that genuinely wants splitting from a\nproof that was compressed until it fit. And compression is the worse of the two outcomes:\na prover that has already compressed once buys tens of words, not hundreds, and pays for\nthem in rigour — a justification that loses its own sentence, a step that concludes two\nfacts.\n\n## Decision\n\n**Two numbers, and only the larger is a gate.**\n\n- `WORD_BUDGET = 1500` — the hard cap. Over it, `tools/check_render.py` fails, as before.\n- `SPLIT_SIGNAL = 1000` — crossing it fails nothing, blocks nothing, and prints a note.\n\nThe note names the two remedies, in order:\n\n1. **`/decompose` the node.** A write-up this long is asserting more than one claim, and\n   each claim is a node that can be proved and critiqued on its own.\n2. **Move what it *restates* into `blueprint/appendix/` and link it.**\n\nThe second is stated in the gate's own output because it is the one that **compounds**. An\nappendix entry is written once and cited by every node that needs it, so lifting a\ndefinition out of one write-up shortens every other write-up that was restating the same\nobject. Splitting only ever helps the node you split.\n\n## Consequences\n\n**Three of the four over-budget write-ups came inside the new cap immediately** — `Q2-L4`\nat 1237, `Q1-L4-L1-L3` and `Q1-L4-L1-L2`, which had been failing the gate on length while\nsaying nothing wrong. The fourth, `Q1-L3-L2`, is at 1818 words and still fails; it is\nalready `failing` on its mathematics, and the gate is now telling the truth about it\ninstead of telling the same thing about four files.\n\n**The signal fires on two write-ups today** — `Q2-L4` at 1237 and `Q1-L4-L2-L1` at 1201 —\nand neither is blocked. `Q2-L4` already has `Q2-L4-L1` and `Q2-L4-L2` written to absorb its\nsplit, which is precisely the state the signal is meant to name.\n\n**The risk is that 1500 becomes the new target**, and nothing here prevents that; the\nsignal is a note and a note can be ignored. What it buys is that the ignoring is now\nvisible in the gate's output on every run, and that the number a write-up is pressed\nagainst is no longer the number the build fails at. If the distribution piles against 1500\nthe same way, the conclusion will not be that the cap is wrong again — it will be that\n`/prove` is being asked to do work `/decompose` should have done first.\n\n## Alternatives rejected\n\n**Raise the single cap to 1500 and stop there.** This is the change the user asked for, and\nit is most of what happened. The second number was added because raising a lone cap\nre-runs the same experiment: the pressure that produced seventeen write-ups at 866–900\nwould produce seventeen at 1466–1500, and the gate would be exactly as uninformative, three\nhundred words later.\n\n**Make the split signal fail the build.** Rejected for [I27](../pipeline.html#i27)'s reason:\nthe work it asks for is a `/decompose` plus a fresh `/prove`, and a build that stayed red\nuntil someone did it would stop every unrelated proof in the repository.\n\n**Count only prose and exempt display math.** Rejected. The math is the claim, and a write-up\nthat is mostly displays is not shorter to check. The existing rule — a line that is only\n`$$` costs nothing, the math inside it costs its words — already removes the one part of the\ncount that penalised good presentation.\n";</script>
