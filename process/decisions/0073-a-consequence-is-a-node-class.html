<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0073-a-consequence-is-a-node-class</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0073 — A consequence is a node class: `Q&lt;n&gt;-…-c&lt;k&gt;`</h1><p class="lead">Generated from <code>process/decisions/0073-a-consequence-is-a-node-class.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Extends:** [0015](0015-every-node-declares-its-role.html) (the `role:` field), [0018](0018-example-and-analogy-nodes.html) (example and analogy get addressable ids), [0021](0021-example-and-analogy-nodes-nest.html) (they nest), [0047](0047-an-example-node-is-a-proposition.html) (an e/a node is a proposition and decomposes), [0051](0051-a-decomposition-folds-whatever-its-members-are-rolled.html) (the edge decides the fold)\n\n## Context\n\nADR 0015 created five roles and ADR 0018 gave two of them ids. `example` became `-e<k>` and `analogy` became `-a<k>`, on the reasoning that a worked instance forced to squat on a lemma id \"had to read as a step of the argument\". **`evidence` was left without one**, and it has the same problem in a sharper form.\n\n`Q2-L7` is the case that surfaced it. Created 2026-08-05 with `role: evidence`, its own creation entry saying the claim \"can never be a step in the categorical argument\"; `required-by:` empty from that day to this, so no node of Q2 ever used it; and clause (i) concluding, in its own words, that \"the answer to Q1 for this $X$ is no\". Three signals, all present from the start, and the id said `Q2-L7` — the seventh lemma of Q2 — for two days. The user read the tree, not the fields, and asked why a node that follows from the question was sitting among the nodes that answer it.\n\nThe id is what gets read. It appears in the tree readout, in every critique that cites the node, in the directory name, in the `depends-on` of everything downstream. A role field one file deep does not compete with it.\n\nThere is a second thing wrong, and it is why `evidence` was not simply given a letter. **`evidence` names the epistemic weight and not the relation.** An example corroborates by instantiating; an analogy corroborates by matching in another setting; but a claim can also corroborate by *following from* the thing it hangs off — a corollary, a decategorification, a specialization tested against a case — and \"evidence\" says nothing about which. The tree needs the relation, because the relation is what decides where the node is drawn and what may depend on it.\n\n## Decision\n\n**A sixth role, `consequence`, and a fourth id suffix, `-c<k>`.**\n\n- `Q<n>-…-c<k>` — a **consequence of the node it hangs off**: a precise provable claim that *follows from* its host rather than feeding it. `role: consequence`.\n\nIt takes ADR 0018's five rules unchanged, with one clause of one of them read the other way round:\n\n1. **It nests, and the id is the path** — ADR 0021's rule, not 0018's original question-level restriction. `Q1-L3-c1` sits at `blueprint/nodes/Q1/Q1-L3/Q1-L3-c1/`, inside the node it follows from. A question-level `Q<n>-c<k>` is a consequence of the question itself and is permitted.\n2. **A proof node may never depend on one**, and it may itself depend on proof nodes and on its own sub-nodes — ADR 0018 rule 2 as amended by 0047, `--check` enforcing it. The direction is the point: a consequence *reads* the argument and the argument never reads it back.\n3. **Which claim it follows from is the edge, not prose.** This is where it differs from an example. ADR 0018 rule 3 made \"which node they speak to\" prose, because an instance can illustrate several nodes at once. A consequence follows from exactly one thing, and that thing is its parent in the id — so containment carries the relation and no field is added.\n4. **It carries the full node contract** and decomposes like any other proposition (ADR 0047): `<id>_node.md`, `created:`, status, `human:`, its own `examples.md`, sub-lemmas of its own. Tallies count it apart (`· consequence 0/1`) and question confidence still aggregates over the proof chain alone.\n5. **Only the lead-researcher creates one**, and — the new part — **`/update` may reclassify an existing node into one**, because that is how this class gets used: a node is written as a lemma, and what it turns out to be is a corollary. The reclassification is a statement revision like any other, recorded in `updates/u<n>.md` with the id before and after.\n\n**It draws on the example side.** `SIDE` sends `consequence` to `r`, beside the examples, on the reasoning that a reader asking \"and so?\" of a card wants instances and corollaries together, while an analogy is the thing that comes from *beside* the claim. A branch chip now names the roles its group actually holds, so a side carrying both says \"3 corroborations\" rather than miscounting them all as examples.\n\n## Justification\n\n**The relation is what the tree draws, so the relation is what the id should carry.** Every id suffix in this repository answers \"where does this sit relative to its parent\": `-L` is *under* (it feeds it), `-z` is *over* (it generalizes it), `-e` and `-a` are *beside* (they illustrate it). Nothing said *after*. A corollary drawn as a lemma inverts an arrow, and an inverted arrow in a dependency graph is not a cosmetic defect: reach flows the wrong way, the fan-out cap counts it against the wrong container, and a question's declared answer strengths can end up resting on a node that follows from the answer rather than supplying it. Q2's Problem statement declared `Q2-L7` the carrier of its **necessary** strength, which is exactly that error, and it stood for two days.\n\n**Reclassification had to be legal, or the class would only ever apply to new nodes.** The failure mode this ADR is about is discovering, after a node is written, that it points the other way. If the only way to get a `-c` id were to create one from scratch, the mis-rolled nodes already on disk would stay mis-rolled. Hence rule 5, and hence the requirement that `updates/u<n>.md` record the id before and after: a moved node breaks the links its append-only critiques wrote at it, and the record of where it went is what makes those links repairable.\n\n**Splitting `consequence` off `evidence` rather than lettering `evidence` itself.** `evidence` keeps its meaning — corroboration whose relation to the argument is not one of the three geometric ones — and keeps having no id, which is now a statement rather than an oversight: a node whose relation to the argument cannot be drawn should not claim a position in the drawing. Every `evidence` node in the tree is a candidate for reclassification, one at a time, on its own merits.\n\n## What it cost\n\nQ1-L3 now has eleven direct children against ADR 0050's cap of ten, and `--check` prints the NOTE. Taken knowingly: the alternative placement, question-level `Q1-e9`, would have put Q1 at seventeen, and the cap exists to keep a card readable, which a consequence hanging off the node it follows from does better than a consequence filed under the question.\n\nThe migration also stranded work. `Q2-L8` — \"the classes of the standard objects span $K_0$\", `proved`, two sub-lemmas — was required by `Q2-L7` and by nothing else, and could not follow it across, because its own `Q2-L8-L2` depends on `Q2-L2`, which stays in Q2; carrying it over would have replaced two forbidden cross-question edges with a third. It is now a terminal proved branch of Q2 with no dependant. And Q2 is left with no node stating a necessary condition for its own membership question. Both are recorded in the Problem statement and in `Q1-L3-c1/updates/u1.md`; neither is repaired here.\n\n## Alternatives rejected\n\n- **Letter the `evidence` role `-i<k>` or `-I<k>` and stop.** Rejected on the naming and on the substance. Uppercase `I` is indistinguishable from lowercase `l` and adjacent to `1` in most terminal fonts — the id that prompted this ADR was mistyped as `Q2-I1` in the request that asked for it, and `grep` could not find what was meant. And lettering `evidence` would have kept a class whose name reports weight while the tree needs direction.\n- **Leave it in Q2 and change only the role.** Rejected: the defect is that the node is in the wrong question, not that it is labelled wrongly inside the right one. Its conclusion is about Q1's equality.\n- **Move it to Q1 as `Q1-e9`, reusing the example class.** Rejected: it is not an instance of anything. Reusing `example` would have made the tree say a false thing to avoid a schema change, and it would have put Q1 at seventeen children.\n- **A `follows-from:` field instead of an id suffix.** Rejected: it stores the relation somewhere the tree readout does not show, which is the failure being fixed.\n";</script>
