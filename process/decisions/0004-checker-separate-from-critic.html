<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0004-checker-separate-from-critic</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>ADR 0004 — Presentation is a separate agent from correctness</h1><p class="lead">Generated from <code>process/decisions/0004-checker-separate-from-critic.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [journal](../journal.html) · [design](../pipeline.html)\n\n- **date:** 2026-08-02\n- **status:** accepted\n- **kind:** agent design\n\n## Context\n\nThe critic is a hostile referee: it reads one lemma draft and decides whether the mathematics is correct. In practice it also kept reporting presentation problems — inconsistent notation, display math run into prose, house macros leaking into markdown, links that did not resolve. Those reports were legitimate but they were not the job, and they diluted the verdict: a `FAIL` mixing a genuine gap with three formatting complaints is hard to act on, and a reader stops trusting which is which.\n\nMerging the two roles is also unsafe in the other direction. An agent empowered to rewrite prose for clarity is one prompt away from rewriting a statement for clarity, and a referee that can edit the proof is not a referee.\n\n## Decision\n\nA fourth agent, the **checker** (`/check`), owns presentation. It reformats markdown prose across `blueprint/`, `drafts/critiques/`, `literature/`, `README.md` and `CLAUDE.md`: display-math separation, macro expansion, notation consistency, structure, links.\n\nIt is content-preserving by construction. It may rewrap a statement; it may never restate one. It never changes a status field, a `VERDICT:` line, or any manuscript `.tex`. Its tool grant is Read/Edit/Write/Grep/Glob and no shell.\n\nThe critic keeps correctness alone, and its verdict means one thing.\n\n## Consequences\n\n- Verdicts are actionable: a `FAIL` is a mathematical gap.\n- Presentation can be fixed in bulk, across files, without touching the prove loop or invalidating a verdict.\n- A content-preservation gate is now required on the checker — the guarantee is by construction and by review, not enforced by tooling. This is the weakest link in the arrangement and worth revisiting if the checker is ever given a wider remit.\n- Four agents is more machinery to keep in sync: each one's powers are written in `.claude/agents/`, in `pipeline.md`, and in `CLAUDE.md`'s write-discipline paragraph, and all three must agree.\n\n## Alternatives considered\n\n**Let the critic report presentation issues in a separate section.** Rejected: it still spends the critic's attention on formatting, and produces no fix — only a complaint the prover must action.\n\n**Run a formatter (prettier, a linter) instead of an agent.** Rejected: the work is notation consistency and display-math judgement across files that must render as mathematics. No formatter has an opinion about whether $\\langle-\\rangle$ is used consistently. A linter for the mechanical part — links, stray macros — is complementary and now exists as a link-check script.\n";</script>
