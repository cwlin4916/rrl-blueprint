<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0013-confidence-is-derived-baconian-and-weakest-link</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0013 — Confidence is derived, Baconian, and weakest-link</h1><p class="lead">Generated from <code>process/decisions/0013-confidence-is-derived-baconian-and-weakest-link.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Extends:** [0009](0009-one-tree-per-kind.html) (every fact stored once; `ready` and `blocked`\nare derived), [0007](0007-generated-dag-view.html) (the DAG view is generated and read-only)\n\n## Context\n\nThe four stored statuses answer *what stage is this node at*. They do not answer *how much\nshould I believe it*, and the two come apart in ways a reader needs to see. `proved` on\n[Q1-L1](../../nodes/Q1-L1/index.html) means the fifth referee report ended in\n`VERDICT: PASS` — after two `FAIL`s, twenty-two flaws raised and disposed of across four\nearlier rounds, and eight minor flaws still standing in the report that passed it. A node\nthat passed cleanly on `r1` would carry the same word. And a `proved` node resting on an\n`open` one is a claim whose support does not exist yet, which no status field records.\n\nThe request was for a per-node confidence, shown as a light colour, for the repository as\nwell as for each node.\n\n## Decision\n\n**Confidence is derived, never stored.** It is a function of the record — the status, the\ncritique rounds, the dependency statuses — computed by `tools/build_dag_site.py` at build\ntime, exactly as `ready` and `blocked` are. There is no `confidence:` field in `node.md`,\nand adding one would violate [I5](../pipeline.html#4-invariants).\n\n**Local support is a Baconian ratio over defeaters.** Confidence in a claim grows with the\nnumber of reasons for doubting it that have been identified and eliminated — eliminative\ninduction, in the form Goodenough, Weinstock and Klein give it for assurance cases. The\ncritique files already record defeaters in a machine-readable form: each is a\n`**Flaw n** [FATAL|MAJOR|MINOR]` heading, and the last line of the file is the verdict. For\na node with rounds $r_1,\\dots,r_R$, write $d_k$ for the number of flaws raised in round\n$k$. The flaws in the latest round are the defeaters still **standing**; every flaw from an\nearlier round was disposed of before the node reached its current verdict, so those are the\ndefeaters **eliminated**:\n\n$$\ne(v) = \\sum_{k<R} d_k, \\qquad r(v) = d_R .\n$$\n\nLocal support is the smoothed ratio of eliminated to total, gated by the stored status:\n\n$$\ns(v) = \\begin{cases}\n0, & \\text{status } \\texttt{open} \\\\\n0, & \\text{status } \\texttt{failing} \\\\\n1/4, & \\text{status } \\texttt{drafted} \\\\\n\\dfrac{e(v)+1}{e(v)+r(v)+2}, & \\text{status } \\texttt{proved.}\n\\end{cases}\n$$\n\n**Confidence propagates by the weakest link.** A claim can be no better supported than the\nleast-supported thing it rests on:\n\n$$\nc(v) = \\min\\Big(s(v),\\ \\min_{u \\in \\mathrm{deps}(v)} c(u)\\Big), \\qquad \\min \\emptyset = 1 .\n$$\n\nThe recursion terminates because the DAG is acyclic. A question's confidence is the minimum\nover every node beneath it, and the repository's is the minimum over the questions — the\nsame rule applied twice more, so the number at the top is the weakest node in the tree.\n\n**It is displayed as an ordinal band, never as a decimal.** Six bands,\n$b(v) = \\lceil 5\\,c(v)\\rceil \\in \\{0,\\dots,5\\}$, rendered as the node's existing status\ncolour mixed into the card background at $10b$ percent — so the strongest tint any card can\ncarry is half-strength, and the hue still says which of the five statuses the node is in.\nThe generated pages print the Baconian fraction and the weakest link by name; nothing prints\n`0.719`.\n\n## Justification\n\nThree choices need defending, and the first is counterintuitive.\n\n**A node that took five rounds outscores one that passed on the first.** Under the formula\n[Q1-L1](../../nodes/Q1-L1/index.html) sits at $23/32 \\approx 0.72$, while a\nhypothetical node passing clean on `r1` sits at $1/2$. That is the eliminative-induction\nanswer and it is the right one: confidence comes from doubts *eliminated*, and a claim\nnobody found anything wrong with has not been probed, it has been glanced at. The smoothing\nterm is what carries this — the $+1$ and $+2$ stand for the defeaters no one has looked for\nyet, so an unexamined claim sits at a half rather than at certainty, and nothing ever\nreaches $1$. The four `FAIL`→fix→re-review cycles behind Q1-L1 are the pipeline's most\nexpensive artifact; a measure that read them as a demerit would be measuring the producer's\nneatness rather than the claim's support.\n\n**Weakest link, not a product.** A composite claim's confidence cannot exceed its\nleast-supported component. This is what makes the number honest at the top of the tree: the\nrepository cannot advertise a confidence its worst node does not support, and today it\ncannot advertise anything at all, because six of seven nodes are `open`. It also makes the\nalready-derived `blocked` state quantitative — a `proved` node resting on an `open` one\nlands at zero, which no status field says out loud.\n\n**Bands, not decimals.** Baconian probability is ordinal: the defeater space cannot be\nenumerated, so $23/32$ ranks Q1-L1 against another node and means nothing on its own. The\nAssurance 2.0 literature makes the operational version of the same point — a number carried\nto more precision than its derivation supports suppresses the judgment it was meant to\ninform, and the worked example is the Challenger estimates. Six bands is about as much\nresolution as the input carries, and the tint is the honest display for it: it ranks at a\nglance and refuses to be quoted.\n\n**Sources.** Goodenough, Weinstock and Klein, [*Eliminative Argumentation: A Basis for\nArguing Confidence in System Properties*](https://www.sei.cmu.edu/documents/1248/2015_005_001_434813.pdf)\n(SEI, 2015) and [*Measuring Assurance Case Confidence using Baconian\nProbabilities*](https://www.sei.cmu.edu/documents/1424/2013_021_001_88002.pdf) (SEI, 2013),\nfor defeater counting, the $n$-of-$m$ notation, its ordinal reading, and the weakest-link\nrule for conjunctive support. Duan et al., [*Reasoning About Confidence and Uncertainty in\nAssurance Cases: A Survey*](https://link.springer.com/chapter/10.1007/978-3-319-63194-3_5),\nfor the qualitative/quantitative split. Bloomfield et al., [*Quantifying Confidence in\nAssurance 2.0 Arguments*](https://arxiv.org/html/2604.00034), for the warning against\nprecision the derivation does not support.\n\n## Alternatives considered\n\n**A stored `confidence:` field, written by a human.** The most expressive option — a\njudgment call is exactly what a number like this is — and rejected on [I5](../pipeline.html#4-invariants).\nA stored confidence is a second place for the record to drift, it goes stale the moment a\nnew critique lands, and nothing could check it. The derived version is recomputed on every\nbuild and cannot disagree with the critiques it is a function of.\n\n**Product of dependency confidences, or a noisy-AND.** Standard in the Dempster–Shafer\ntreatments of the same problem, and arguably better calibrated: five dependencies are more\nways to be wrong than one, and `min` cannot see that. Rejected for this repository because\nthe product punishes decomposition — splitting one node into three sub-lemmas would lower\nthe parent's confidence even when every piece survived review — and decomposition is the\noperation the pipeline exists to encourage. `min` is neutral to how finely a claim is cut.\n\n**Severity weights on defeaters** (a standing `MAJOR` counting for more than a `MINOR`).\nRejected as unmotivated precision: the weights would be invented, not derived, and the\nstatus gate already carries the severity signal, since a standing `FATAL` or `MAJOR` is\nexactly what makes a node `failing` and sends its support to zero. Every defeater standing\non a `proved` node is a `MINOR` by construction.\n\n**Counting rounds rather than flaws** — confidence as a function of how many hostile reads\nthe node survived. Simpler, and it needs no parsing. Rejected because it cannot see the\neight minor flaws still standing in Q1-L1's `r5`, and those are the honest reason its\nconfidence is not higher.\n\n## Consequences\n\nThe tint is nearly invisible today, and that is the correct reading of the repository:\none node of seven is `proved`, so exactly one card carries colour and both the question and\nthe repository sit at band 0. The scheme reports the state rather than decorating it, and\nit will fill in as nodes close.\n\nParsing the critique files makes them load-bearing for the first time. They were an\nappend-only audit trail nothing read; a defeater count now depends on `**Flaw n**` headings\nbeing formatted as the critic's contract already specifies, and a round that numbers its\nflaws some other way silently scores zero defeaters. No gate can tell that apart from a\ngenuinely clean report, so none tries — a check that fires on correct input is worse than\nno check. What reading the critiques did buy is two things `--check` could not see before:\na node marked `proved` whose latest report ends in `VERDICT: FAIL` is now an inconsistency\nand fails the run, and a round carrying no verdict line at all prints as a `NOTE` and does\nnot, because [0009](0009-one-tree-per-kind.html)'s rule that a critique is never rewritten\noutranks a convention adopted after it. That advisory tier is new to this gate; the render\ngate had it already.\n\nThe eliminated count is an upper bound on distinct defeaters, not an exact one: a flaw\nraised again in a later round — `r4`'s Flaw 3 repeats `r3`'s — is counted once per round it\nappears in. Deduplicating would mean matching flaws across reports by their prose, which is\nguesswork. The measure is ordinal, so an upper bound that is consistent across nodes is\nenough for the ranking it is used for, and this is the sharpest reason not to read the\nnumber as anything finer than its band.\n\nConfidence is a reading aid and stays outside the closed world, on the same footing as\n`examples.md` under [I10](../pipeline.html#4-invariants): no proof, node or appendix entry may\ncite it, and no gate passes or fails on it. It is derived from the audit trail, so it can\nnever be evidence *in* the audit trail.\n";</script>
