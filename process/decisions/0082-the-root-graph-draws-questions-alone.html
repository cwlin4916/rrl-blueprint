<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0082-the-root-graph-draws-questions-alone</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0082 — The root graph draws questions alone, and a card is a door</h1><p class="lead">Generated from <code>process/decisions/0082-the-root-graph-draws-questions-alone.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-08\n**Status:** accepted\n**Supersedes:** [0039](0039-one-graph-for-every-question.html), whose tiling put three arguments on one canvas and made all three unreadable\n**Amends:** [0024](0024-one-graph-with-side-branched-corroboration.html), [0026](0026-sub-lemma-families-fold-into-their-parent.html); complements [0016](0016-the-site-mirrors-the-source-tree.html)\n\n## Context\n\n[ADR 0039](0039-one-graph-for-every-question.html) was right about the relation and wrong\nabout the room. It replaced one-page-per-question with every question tiled left to right\non `dag.html`, so that a reader could see that Q2 and Q3 supply Q1.\n\nThey could see it, at the cost of seeing anything else. Q1 alone carries 44 nodes across\nsix levels; Q2 carries 12 and Q3 eight. Tiled at the pitch a spine needs, the three blocks\nspan far more than a screen, and the reader's first act on the page is always to scroll\naway from two-thirds of it. The relation 0039 existed to show — two thick arrows between\nthree cards — is the one thing on that canvas that never fits in the viewport with both\nof its endpoints.\n\nThe relation is also **between questions and not between nodes**: 0039 itself forbids a\ncross-question `depends-on`, so nothing on the tiled canvas needed the nodes in order to\nbe drawn. Three full arguments were being laid out to carry two arrows.\n\n## Decision\n\n**The root graph draws the questions and the Feeds relation, and nothing else. Each\nquestion has its own page, and a card is the door to it.**\n\n- `dag.html` draws one card per question and no nodes at all. Columns are the Feeds\n  relation — a question sits one column right of everything that feeds it — and questions\n  in the same column stack. `place()` has nothing to tile, so this is the whole layout.\n- **A feed arrow says where it lands.** The arrow carries the node of the *fed* question\n  that the source's **Feeds.** paragraph names: `Q1-L2` on the Q2 → Q1 arrow, `Q1-L5` on\n  Q3 → Q1. A paragraph that names no node in the question it feeds yields no label rather\n  than a guess. An arrow that would skip a column bows clear of the card in between,\n  because a straight line through a card reads as an edge to it.\n- **A card is a door.** On the root page a scope card carries `dag/q<n>.html` and clicking\n  it goes there, rather than opening a panel. Everywhere else a card still opens its\n  panel — the root page is the only one where there is nothing else to open.\n- `dag/q<n>.html` is the same skeleton with one question's block on it: spine, branches,\n  chips, filters, panel, all as before. The per-node `nodes/<id>/dag.html` pages are\n  unchanged and now sit under their question in the crumb trail.\n- Every link that used to reach a node through `dag.html#<id>` now goes to that node's\n  question page. A node inside a folded branch has no element to anchor, so the link falls\n  back to its top-level ancestor, which the page always draws.\n\n## Consequences\n\nThe reader arrives at three cards and two labelled arrows, which is the shape of the\nproject, and opens one argument at a time by clicking. What 0038 got right — one question\nper page — comes back, and what 0039 got right — the relation is drawn, not described —\nis kept, because the relation now has a page of its own instead of being an annotation on\na canvas too wide to read.\n\nThe cost is one more click to reach a node from the front page, and one more page kind to\nkeep consistent. The gate covers the second: `tools/dag_smoke.js` asserts the root page's\nown contract — no status filters, every card a door carrying its question's graph — and\nthe existing per-question assertions now run against `dag/q<n>.html`, where they were\nalways the ones that mattered.\n\n0039's actual bug, a node rising to the wrong question's card, stays fixed and stays\ntested: it cannot recur on a page that draws one question.\n";</script>
