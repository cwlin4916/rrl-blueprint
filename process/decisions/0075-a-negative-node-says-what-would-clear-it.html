<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0075-a-negative-node-says-what-would-clear-it</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0075 — A negative node says what would clear it, and the prompt carries the ask</h1><p class="lead">Generated from <code>process/decisions/0075-a-negative-node-says-what-would-clear-it.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Extends:** [0029](0029-every-node-has-a-generated-self-contained-prompt.html) (every node has a generated self-contained prompt), [0055](0055-a-flag-names-the-record-it-fired-on.html) (a flag names the record it fired on), [0062](0062-a-node-states-its-own-flaw.html) (a node states its own flaw)\n\n## Context\n\nSeventeen nodes sit at negative confidence. Every one of them says, in its generated flaw block, **what is wrong**. Not one says **what would make it right**.\n\nThe difference is not cosmetic, because the two are answered by different people. What is wrong is in the critique, and the repository already carries it. What is missing is usually a fact the repository does not have — a numbered result nobody has transcribed, a hypothesis stated over $\\mathbb{C}$ that the standing $k$ needs, a computation that no source on disk performs. [Q1-L3-L2](../../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) is the case in point: its round-4 referee ruled the argument sound and the appendix thin, and named four specific facts. Those four sentences were the most actionable thing produced in that node's four rounds, and they went into a critique that nothing reads back and no packet carries.\n\nThat is the second half of the problem. `<id>_prompt.md` exists to be handed to a model outside this repository ([ADR 0029](0029-every-node-has-a-generated-self-contained-prompt.html)) — and that reader is exactly the one who could supply a numbered result from the literature. The packet told them the statement, the flag and the closed world, and never told them what to bring back.\n\n## Decision\n\n**A node whose confidence is negative on its own record carries `<id>_positive.md` in its own directory: a short, authored statement of what would have to arrive before it can go positive. The generated prompt reproduces it.**\n\nFour parts to the rule.\n\n**It is authored, not generated.** Which missing fact would clear a defect is a mathematical judgement, and no gate can compute it. The builder only carries the file; it never writes it. Written by the `/prove` orchestrator when a round closes `FAIL` and by `/update`, both of which have already sorted the standing flaws into owners.\n\n**Only where the negativity originates.** A node is owed the file when its confidence is negative *and* nothing beneath it is weaker — `by == self` in the panel. A node merely inheriting a ceiling has one answer, \"fix the node named in `by`\", which the panel already gives; writing it out for all seventeen would bury the nine places the cause actually is. Nine nodes are owed one at this decision; eight would be noise.\n\n**It says what is missing and what the repair is worth.** The missing facts, each one named and sourced if a source is suspected, and then the arithmetic: what a `PASS` on this node alone buys, and what else has to move. Simulating it against the builder's own `confidence()` costs one script and pre-empts the commonest wasted run — proving a node whose ceiling is held by something else.\n\n**The gate notes it and does not fail on it.** A `/prove` round writes `status: failing` before anyone has decided what the missing fact is, so a hard gate would make a failing round unclosable. `tools/build_dag_site.py --check` prints a `NOTE` per owing node, and a second `NOTE` for a file left behind on a node that has since recovered.\n\nThe file is outside the closed world, like [`examples.md`](0047-an-example-node-is-a-proposition.html) and like the prompt that carries it. It is a request for information. Nothing in it is established and nothing in it may discharge a step.\n\n## Consequences\n\nThe packet that leaves the repository now ends its own ignorance: it names the statement, the flag, the closed world, and the four facts that would settle the thing. A reader with a library and no access to this tree can act on the last of those, which is the only part they were ever in a position to supply.\n\nThe `NOTE` makes the nine origins of negativity a list, where they were previously derivable only by running the builder's `confidence()` by hand and reading `by` off every node.\n\nThe cost is one authored file per genuinely-failing node, and the standing risk that it goes stale — a repair lands and the file still asks for it. The second `NOTE` catches the recovered case; a partially-answered one is caught by nothing, and is a thing to write into `/prove` §3g rather than to gate.\n";</script>
