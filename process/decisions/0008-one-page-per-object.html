<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0008-one-page-per-object</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0008 — One page per object: `docs/` becomes a site</h1><p class="lead">Generated from <code>process/decisions/0008-one-page-per-object.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-03\n**Status:** accepted\n**Supersedes:** the single-file half of [0007](0007-generated-dag-view.html)\n\n## Context\n\n[I6](../pipeline.html#4-invariants) says an object is linked and never named: a node cites\n`def:generation` as a link into `blueprint/appendix.md#def-generation`, never as a bare\nlabel. That guardrail was working — the link checker caught typos, the appendix stayed\nthe single statement of each object — but the links themselves landed badly.\n\nA reader following one arrives at a 3,000-line markdown file and has to find the anchor.\nGitHub renders it; nothing else does. Worse, the pipeline's other artifacts had no\nrendered form at all: a node's write-up is a `.tex` whose only readable version is a PDF\nin a gitignored `build/`, and a critique is markdown full of mathematics that renders only\nif you happen to be looking at it on github.com. The graph page linked to all of these,\nso the DAG — the thing meant to make the argument legible — was a set of links out of the\nrendered world into the unrendered one.\n\n## Decision\n\n`tools/build_dag_site.py` generates a page for everything a link can point at:\none per appendix entry, node, write-up, examples file, open prompt, critique, reading\nnote and process document, plus index pages and a hub. Every internal link is rewritten\nat generation time to target the generated page. `check_render.py` resolves all of them\nand fails on a dangling one — recorded as [I11](../pipeline.html#4-invariants).\n\nThree consequences worth stating.\n\n**One renderer.** `docs/assets/site.js` holds the only markdown-plus-KaTeX renderer in\nthe repo; the graph's side panel calls the same function the object pages do. A statement\nthat renders differently in two places is a statement the reader must reconcile.\n\n**Write-ups render house macros.** A node's `.tex` is written in `preamble.tex`\nnotation, which KaTeX does not know. The generator harvests those definitions — expanding\nthe `\\docsvlist` loops that produce most of them, in document order so a later\n`\\renewcommand` wins — and hands them to the write-up pages *only*. Supplying them\nsite-wide would mask exactly the macro leakage [I7](../pipeline.html#4-invariants) exists to\ncatch.\n\n**The graph is HTML over SVG.** Nodes are HTML cards in a transformed layer, edges are\nSVG beneath it, sharing one pan-and-zoom transform. This is what makes in-place expansion\na CSS transition and lets a card show a real formula instead of stripped-down SVG text.\n\n## Alternatives considered\n\n**Leave the links pointing at `.md` and `.tex`.** Cheapest, and it is what GitHub expects.\nRejected because the write-ups have no rendered form under it at all, and because the site\nhas to work offline from `file://` — a repo you can only read through one particular web\nhost is a repo with a dependency it did not choose.\n\n**Render the markdown server-side in Python.** Would avoid shipping a renderer. Rejected\nbecause the graph panel needs a client-side renderer regardless, and two implementations\nof \"render a statement\" is the drift this decision is trying to remove.\n\n**Adopt a static-site generator.** Rejected on the same grounds as\n[0007](0007-generated-dag-view.html): a toolchain whose config is a second source of truth\nfor structure the node files already carry, plus a dependency that must be installed\nbefore anyone can read the blueprint.\n\n## Consequences\n\n- `docs/` is ~85 generated files. All of it is regenerable and none of it is read back\n  ([I8](../pipeline.html#4-invariants)); it can be deleted at any time.\n- Node files gain a `created:` field, set once by the lead-researcher and never changed,\n  so the DAG can be read in the order it grew. The seven existing nodes were backfilled\n  to 2026-08-02, the date of the `decompose(Q1)` commit that created them.\n- `--check` now compares every generated page, not one. This immediately surfaced a\n  collision between `README.md` and `docs/README.md` that a single-file check could not\n  have seen.\n- The LaTeX-to-HTML converter understands only the subset the prover is instructed to\n  write. Anything else is emitted as a visible `\\command` and fails `site_smoke.js` —\n  loud rather than silently dropped.\n";</script>
