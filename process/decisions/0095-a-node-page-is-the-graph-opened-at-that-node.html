<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0095-a-node-page-is-the-graph-opened-at-that-node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0095 — A node page is the graph, opened at that node</h1><p class="lead">Generated from <code>process/decisions/0095-a-node-page-is-the-graph-opened-at-that-node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [the graph](../../dag.html) · [pipeline](../pipeline.html)\n\n**Date:** 2026-08-09\n**Status:** accepted\n**Amends:** [0024](0024-one-graph-with-side-branched-corroboration.html), which put an embedded DAG on every node page, and [0016](0016-the-site-mirrors-the-source-tree.html), which decided what a node's `<id>_node.md` renders as.\n\n## Decision\n\n`blueprint_site/nodes/<chain>/index.html` **is** the graph page, focused on that node: the canvas on the left, the node open in the panel on the right, the same skeleton `dag.html` and `dag/q<n>.html` draw. The document rendered from `<id>_node.md` moves beside it as `node.html`, and it is the first row of the panel's **Pages** list.\n\nThere is one layout on this site and clicking never leaves it. A card's *full node →*, a folded family's chip, a breadcrumb and every `[Q1-L2](…_node.md)` written anywhere in the repository all land on a page with a canvas on the left and a panel on the right. What changes between them is which graph is drawn and which node the panel holds.\n\nThe `<iframe>` is gone. `nodes/<chain>/dag.html` is gone with it — one view, one URL — and the ancestry breadcrumbs point at `index.html` instead.\n\n## Why\n\n**A picture of the interface is not the interface.** A reader on `dag.html` clicked a card, and arrived at a document with the graph inside it as a 480-pixel `<iframe>` under the statement: a scaled-down, chrome-stripped copy of the page they had just left, on the page they reached by using it. Every affordance was still there and every one of them was smaller. The reader's own words for it were *another small figure which we have the interface*.\n\n**Two layouts for one kind of thing.** The panel already rendered the statement, the confidence decomposition with its four channels, the importance decomposition, and the Pages list — the whole of what the document page carried, built from the same strings by the same renderer. So the site had two presentations of a node, differing in layout, and the one a click landed on was the one where the graph was a thumbnail.\n\n**Continuity is what a graph is for.** The point of drawing an argument is that a reader can move along it. Landing on a page of a different kind stops that: to keep going they had to find the embed, use it at a quarter size, or navigate back. Now the canvas stays put and the panel changes under it.\n\n**The document is still there and is now reached deliberately.** `node.html` is the node file as written — the field block, the generated flaw block, the statement, and the `/why` panels above it. It is the first Pages row on every node's panel, and the only reader who needs it is one who wants the file rather than the node.\n\n## Consequences\n\n- `Site.url` still maps `blueprint/nodes/**/<id>_node.md` to `<chain>/index.html`, so nothing in the repository has to be rewritten: every existing link now lands on the interface instead of on the document.\n- The prompt, history, proof, critique, gap, update, example, goal-check and `/why` pages are unchanged, and their breadcrumb `<id>` link goes to the graph.\n- A question's `index.html` stays a document. A question has no card of its own to open — its graph is `dag/q<n>.html`, which its card on `dag.html` is the door to — and its framing is the longest prose on the site.\n- `.dagembed` and the `EMB` iframe branch in the graph script are dead weight now. The CSS went; the branch stays, defensively, and costs nothing.\n- Roughly one page per node was added and one removed. The page count is unchanged.\n";</script>
