<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0086-an-appendix-link-resolves-by-stem</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0086 — An appendix link resolves by stem, and the appendix is sectioned by subject alone</h1><p class="lead">Generated from <code>process/decisions/0086-an-appendix-link-resolves-by-stem.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-09\n**Status:** accepted\n**Repairs:** [0053](0053-the-appendix-is-a-directory.html), which promised that moving an entry between sections \"breaks no link anywhere\" and did not make it true\n**Extends:** [0059](0059-a-container-is-a-directory.html), which put each section in its own directory\n\n## Context\n\n[ADR 0053](0053-the-appendix-is-a-directory.html) made an entry a file and wrote down what that bought:\n\n> There is no `appendix.md#thm-chen-ti` any more. The entry is the file, so moving one between sections re-orders this listing and breaks no link anywhere.\n\nThat sentence was false the moment [ADR 0059](0059-a-container-is-a-directory.html) put sections in directories. A citation is written `appendix/5-sheaf-theory/thm-chen-ti.md`, so the section is in the path, so moving the entry strands the link — and the render gate fails it, correctly, as a file that does not exist.\n\nMeasured before this record: **9,296** appendix links. Of those 7,279 sit in generated `<id>_prompt.md` files and cost nothing, because a build rewrites them. The other ~2,000 are authored, and about a thousand of them sit in records that the write discipline says are **never rewritten** — 361 in `critiques/`, 251 in `updates/`, 335 in `<id>_history.md`, 15 in `gaps/`.\n\nSo the appendix had become unmovable, and it showed. Section 5 held 22 of 72 entries, a third of the closed world under one heading. Sections 8 and 9 grouped by **provenance** — *proved in main.tex*, *external black box* — which is a second axis crossing the topical one, so `bb-derived-satake` and `def:satake_subcategory` sat in different sections while being about the same thing, and a reader looking for what the appendix says about Satake had to know in advance where the result was proved.\n\nNobody re-sectioned it, because re-sectioning cost a thousand edits to files nobody is allowed to edit.\n\n## Decision\n\n**An appendix link resolves by stem.** A path of the form\n\n```\nappendix/<any-section>/<stem>.md\n```\n\nnames the entry `<stem>`, wherever that entry currently sits. `tools/check_render.py` resolves it that way before declaring a link broken, and reports the count of links naming a section their entry has left; `tools/build_dag_site.py` already read only the stem, in `object_anchor` and in `Site.url`, so the site half needed nothing.\n\nThe section stays in the written path. It is not load-bearing, but a link with it works when the markdown is read raw on GitHub, and that is where a collaborator without the repository reads it. What changes is only which part of the path is *authoritative*: the stem.\n\n**A section directory is named for its subject, and carries no number.** The reading order is `blueprint/appendix/index.md`'s fact, stated once. A number in the directory name was a second copy of that fact, and it meant that re-ordering the sections renamed the directories — the churn the numbers were supposed to make navigable.\n\n**Provenance is not a subject.** Where a result was proved is the entry's `role:` field, which every entry already carries. So a manuscript lemma and the external black box discharging its hypothesis sit in the section they are both about: `lemma:rigid` and the rigidity of the renormalized spherical Hecke category are now adjacent, which is how they are used.\n\n## What moved\n\n```\n1-standing-setup         -> standing-setup            6\n2-higher-categorical     -> higher-categorical        7\n3-generation-compactness -> generation-compactness    5   split\n                          + relative-tensor           8   + lemma:compact_generation (was §8)\n                                                          + bb-rigidity              (was §9)\n4-shearing               -> shearing                  5\n5-sheaf-theory           -> placid-geometry           6   split five ways\n                          + sheaf-functoriality       5\n                          + coherence-holonomicity    5   + lemma:unrenormalization  (was §8)\n                          + affine-grassmannian       3\n                          + orbits-and-strata         7   + bb-chenyi-symmetric-orbits (was §7)\n6-categorical-actions    -> categorical-actions       4\n7-spherical-satake       -> spherical-satake          6   + thm:F_cstr_Sat           (was §8)\n8-in-main-tex            -> mapping-spaces            4   the four that are one subject\n9-external-black-boxes   -> spectral-side             3\n```\n\nFourteen sections of 3 to 8 entries, against nine of 4 to 22. The largest is `relative-tensor` at 8, which is the guideline: **past about eight entries a section is two subjects.**\n\n## Consequences\n\n- Re-sectioning is now free, so the appendix can be kept tidy instead of being tidied once.\n- The append-only records were **not** rewritten, and did not need to be. Their paths name sections that no longer exist, and they resolve. That is the decision working, not a debt: a critique is evidence of what a referee saw on a date, and a migration script editing it is exactly what the append-only rule exists to prevent.\n- The one-line count the gate prints — *n links naming an appendix entry by a section it has since left* — is the visible cost, and it is a note, never a failure.\n- A cross-check was lost and is worth naming: before this, a link that named the wrong section failed the gate, which caught a citation copied from a neighbour. That is now silent. It was catching path typos, not mathematical errors, and `--check` still fails an `objects:` entry naming a stem that does not exist.\n";</script>
