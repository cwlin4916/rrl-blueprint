<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0088-create-records-a-change-of-presentation</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0088 — `/create` records a change of presentation</h1><p class="lead">Generated from <code>process/decisions/0088-create-records-a-change-of-presentation.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-09\n**Status:** accepted\n**Relates to:** [0078](0078-generalize-is-its-own-operator.html) (widening is its own operator), [0019](0019-the-update-operator.html) (revising is its own operator), [0050](0050-a-node-has-at-most-ten-children.html) (the fan-out cap).\n\n## Context\n\nEvery operator in this repository works inside a fixed presentation of the problem. `/decompose` searches it, `/prove` traverses it, `/update` corrects a statement inside it, `/generalize` widens one, `/tighten` shortens a write-up about one.\n\nResearch does not stay inside one. Newell and Simon's distinction is between the **task environment**, the problem defined from outside, and the **problem space**, the problem as the solver represents it in order to attack it; their theory is about search in the second. In frontier mathematics the second keeps moving:\n\n```\nsearch inside  P              what a solver does\n\n               P₀ ⟶ P₁ ⟶ P₂ ⟶ ⋯     what a research programme does\n```\n\nBetween one and the next a mathematician may change the **objects**, the **morphisms**, the **ambient category**, the **equivalence relation**, the **invariants**, or **what counts as a solution**. Since the objects are one of the things that move, it is easier to hold $P$ as a category than to say what its objects are.\n\nThat move already happens here and nothing writes it down. A statement quietly starts quantifying over a different category, and the record shows an `/update` with a plausible reason attached to it. The reason is true and it is not the interesting fact.\n\n## Decision\n\n**`/create \"<claim>\"` puts one new claim at the layer it belongs to and records which part of the presentation changed.** Two rules carry it.\n\n**The layer is the deepest node whose `## Statement` still holds unchanged under the new claim's presentation**, and the new node is its child. A statement that quantifies over objects the new presentation does not have is a statement that does not survive. Walking that down from each question's setting is the operator's main judgement and it stays on the main thread; the lead-researcher writes the directory, as it does for every node. When nothing survives at the top, the claim is a new question and the run says so rather than creating one.\n\n**The first history entry names which of the six moved, from what and to what**, at most two in one invocation. If none moved, the claim lives inside the current presentation and the run is a `/decompose` on the parent it just found; it writes nothing and says so. The same refusal applies in two other directions: a verified widening goes to `/generalize`, and a false statement goes to `/update`.\n\n**The id carries no new segment.** A re-presentation is an ordinary `-L<k>` child, and the fact that it is one lives in the history entry. A seventh id letter would mean changing the grammar `Q\\d+(?:-[Leacz]\\d+)+` in two tools, several regexes and the tests, and buying a filename that says what the record already says better. The record is the thing that has to be reliable.\n\n## Consequences\n\nThe `P`-chain becomes visible in the repository. A question's history now shows where its presentation moved, which is the material for the second of the two questions this project opens on: whether provenance can carry the thinking rather than only the result.\n\nThe failure this prevents is placement drift. A claim put under whichever parent sounded closest produces a `depends-on` edge that is false, and the edge feeds the confidence derivation and the graph. Requiring the parent to be named *and* the first node below it that did not survive makes the placement checkable by a reader who was not there.\n\nTwo costs. The six-line record is authored, so nothing can gate whether it is honest — only whether it is present, which `--check` can see through. And the operator is refusal-heavy: three of its exits write nothing at all. That is deliberate, and on the evidence of `/generalize` the commonest outcome of an operator with a real gate in front of it is that the gate fires.\n";</script>
