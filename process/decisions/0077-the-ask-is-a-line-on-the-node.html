<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0077-the-ask-is-a-line-on-the-node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0077 — The ask is a line on the node</h1><p class="lead">Generated from <code>process/decisions/0077-the-ask-is-a-line-on-the-node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-08\n**Status:** accepted\n**Supersedes:** [0075](0075-a-negative-node-says-what-would-clear-it.html) (a negative node says what would clear it)\n**Amends:** [0076](0076-a-gap-is-a-prompt.html) (a gap is a prompt), in the one clause that named the retired file\n\n## Context\n\n[0075](0075-a-negative-node-says-what-would-clear-it.html) was right about the fact and wrong about the container. Every negative node said **what is wrong** — the flaw block quotes the critique's own words — and none said **what would make it right**, which is usually a fact the repository does not have and a reader outside it could supply. That gap was real and the answer was correct: an authored statement of the missing facts, their suspected sources, and what a `PASS` would be worth, carried into the generated prompt so the ask leaves with the packet.\n\nThe container was a page, `<id>_positive.md`. Three things went wrong with it in the day it was in force.\n\n**It was a second place a node spoke about itself, kept in sync by nobody.** A node's status is in its node file, its defect is in its node file, its statement is in its node file — and what it needed was in a sibling page that no gate compared against any of them. `--check` could see that the page existed; it could not see that its arithmetic quoted a confidence three builds old.\n\n**Its size invited an essay.** The one written — `Q1-L3-L2`'s — ran to 34 lines with a table, four lettered subsections and its own breadcrumb. It was written once and never refreshed, which is exactly what a page-sized ask gets: too expensive to rewrite on every run, so it is rewritten on none.\n\n**Nine nodes owed one and one had it.** A container that eight of nine owing nodes never received is not a container anybody was going to fill.\n\nMeanwhile the thing it was competing with is one line long. A node's field block already holds `status:`, `human:`, `examples:` — one-line facts, beside each other, read together, cheap to change.\n\n## Decision\n\n**The ask is a `needs:` field in `<id>_node.md`: one line, authored, naming the missing facts and closing with what the repair is worth.**\n\n```\n- **needs:** <the missing facts, sourced where a source is suspected> <what a PASS here buys, and what else has to move first>\n```\n\nEverything 0075 decided about the *content* stands unchanged, and is restated here because the file it was written in is retired:\n\n- **Facts, not flaws.** The flaws are in the critique and quoted in the generated flaw block; restating them stores one fact twice.\n- **Authored, never generated.** Which missing fact would clear a defect is a mathematical judgement, and no gate can compute it. This is why the field is a field and not a derivation.\n- **Owed by a node negative on its own record** — `by == self` in the panel — and not by one merely inheriting a ceiling, whose answer is always \"fix the node named in `by`\" and would bury the places negativity originates under seventeen copies of itself.\n- **Carried into `<id>_prompt.md`**, so the ask leaves with the packet and the reader outside the repository is the one who can answer it. Outside the closed world: a request for information, never a premise, and nothing in it may discharge a step.\n- **Written by `/prove` §3h** when a round closes `FAIL` or `REFUTED`, and by **`/update` §4c**.\n\nTwo things are new.\n\n**An `/update` on a node is never a no-op.** It either changes the statement or changes this line. Before, a run could read a node, find nothing to correct, write a history entry saying so, and leave the number exactly where it found it with no statement of what it was waiting on. The reader learned that somebody had looked. That is the failure this field closes, and it is why the field belongs to `/update` and not only to `/prove`.\n\n**The gate is three-way.** `--check` prints a `NOTE` for a node negative on its own record whose `needs:` is empty, a `NOTE` for a line left standing on a node that has recovered, and a `PROBLEM` — a hard failure — for an `<id>_positive.md` still on disk, because that is a stale second copy of what the field now carries and nothing reads it.\n\n## Why a note and not a failure, still\n\nUnchanged from 0075, for the same two reasons. A `/prove` round that ends `FAIL` writes the status before anyone has decided what the missing fact is, so a hard gate would make a failing round unclosable. And a line left standing on a node that has since recovered is untidy rather than wrong.\n\nThe retired *page* is a hard failure, because that is a migration and not a judgement: there is exactly one correct number of them on disk.\n\n## Consequences\n\n- `positive_note()` in `tools/build_dag_site.py` becomes `needs_line()`, reading the field rather than the file. `—` and the empty string both mean nothing is owed.\n- The prompt section shrinks from a demoted-heading block to a single blockquoted line. It keeps its own `## What this node needs before it can be settled` heading, because a reader outside the repository needs to be told that the line is an ask and not a premise.\n- `Q1-L3-L2`'s page is condensed into its `needs:` line and deleted. Its four missing facts, its two links and its arithmetic survive; its breadcrumb, its section headings and its table do not.\n- Eight nodes are owed a line and `--check` lists them by name, as it listed them before.\n- [I41](../pipeline.html#4-invariants) is rewritten; [I42](../pipeline.html#4-invariants)'s closing clause now says the `needs:` line links a `gaps/g<n>.md` rather than restating it, which was 0076's rule and is unchanged in substance.\n- The content-preservation grep of the presentation pass gains `\\*\\*needs:\\*\\*`: the checker may reformat prose and may not touch an ask.\n";</script>
