<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0065-a-superseded-verdict-is-silenced-not-scored</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0065 — A superseded literature verdict is silenced, not scored</h1><p class="lead">Generated from <code>process/decisions/0065-a-superseded-verdict-is-silenced-not-scored.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Amends:** [0014](0014-confidence-is-three-signed-channels.html) (confidence is three signed channels), [0046](0046-a-refuted-statement-needs-a-change.html) (needs change and needs update are different)\n**Extends:** [0054](0054-examples-are-part-of-the-record.html) (examples are part of the record), [0062](0062-a-node-states-its-own-flaw.html) (a node states its own flaw)\n\n## Context\n\n`/update Q1-L5-L3-L1` corrected a statement that a published counterexample had refuted,\nin exactly the way the counterexample demanded: the clause that was false became a labelled\nhypothesis, and the argument that remained is true and was written out. The node's card then\nwent on saying **⚠ The statement is false as written**, and went on charging the literature\nchannel $-1.00$, which is $-25\\%$ of the node's confidence.\n\nBoth readings came from `examples.md`, which still says `EVIDENCE: counterexample` — and\ncorrectly so. That file is the example-finder's, it is append-only, and no operator may\nrewrite it ([0054](0054-examples-are-part-of-the-record.html)). What it records is true: on\nthe day it was written, the statement on disk was contradicted in print.\n\nThe error is not in the file. It is in reading a verdict about **one statement** as a\nverdict about **the statement now on disk**. The mathematical channel has never made that\nmistake — a revised node is reset to `open`, its old critiques stop counting toward $D$, and\nits write-up is explicitly said to prove the superseded claim. The literature channel had no\nequivalent, so a defect that had been repaired kept being scored.\n\n`tools/build_dag_site.py --check` already knew. It had been emitting *\"reports\n`EVIDENCE: counterexample` and the node has no `updates/` entry … run /update\"* — testing\nfor the supersession, naming the operator, and then handing the result to nobody. The fact\nwas computed correctly in one place and ignored in the two places that scored it.\n\n## Decision\n\n**A counterexample is *answered* when a record under the node's `updates/` names\n`examples.md`.** Not merely when `updates/` is non-empty: a node revised earlier for an\nunrelated reason has not answered anything. The test is the update's own words, which is\nsound because [0019](0019-the-update-operator.html) already requires `/update` to state which\nrecord forced the revision — so an update that answers the literature says so, and one that\ndoes not, does not.\n\n**An answered verdict silences the literature channel.** It scores `SILENT`, not zero and\nnot a positive: under [0014](0014-confidence-is-three-signed-channels.html) a silent channel\ncosts nothing and shares no weight, so the node sits where a node nobody has weighed sits.\n\n**It is never credited.** A supersession is evidence that the literature no longer says what\nit used to say *about this statement*. It is not evidence that the literature supports the\nnew one — nobody has looked. Crediting it would let a node buy confidence by being revised,\nwhich is the precise inversion of what the channel is for.\n\n**The flaw block changes with it.** `needs_change` stops firing, so the generated block\n([0062](0062-a-node-states-its-own-flaw.html)) reads *revised (u1) and not yet re-proved* and\nquotes the supersession's defect sentence, instead of *the statement is false as written*.\nThat is [0046](0046-a-refuted-statement-needs-a-change.html)'s own distinction\napplied one case further along: the statement **was** wrong, an operator changed it, and\nwhat is owed now is a re-proof and a re-reading — not another correction.\n\n**The panel says why.** The literature row reads `superseded`, and its note says the\ncounterexample measures a statement that is no longer on disk, silenced rather than\ncredited, until `/examples` reads the current one. `--check` prints a matching note asking\nfor the re-run. Confidence shows its working ([0042](0042-confidence-shows-its-working.html)),\nand a channel that fell silent for a reason must give the reason.\n\n## Why not have `/update` rewrite `EVIDENCE:`\n\nBecause it is not `/update`'s field, and the reason it is not is good. The literature\nchannel is the one channel scored from a record written by an agent whose whole job was to\nlook for evidence against the node. Letting the operator that repairs a statement also\nrevise the verdict on that statement collapses the check into the thing being checked. The\nverdict stays; only what is *derived* from it moves, which is where every other correction\nof this kind in the repository has been made.\n\n## Consequences\n\n- `Q1-L5-L3-L1` moves from $-25\\%$ to $0\\%$, and its flaw block changes from a refutation to\n  a supersession. No other node in the repository is affected today; the rule is general.\n- `raw_node` gains `evidence_answered`; `needs_change` and the new `evidence_of` consume it.\n  Nothing is stored — the flag is derived from the `updates/` directory on every build, like\n  every other derived fact.\n- The re-run of `/examples` remains owed, and is now the thing the note asks for. A silent\n  channel is the correct state for a statement the literature has not been asked about.\n- The general shape, worth stating once: **a record is a reading of the thing it read.** When\n  the thing changes, the reading is history. The repository already applied this to write-ups\n  and to critiques; this applies it to the third record.\n";</script>
