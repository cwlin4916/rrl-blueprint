<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0027-a-node-carries-its-history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0027 — A node carries its history, not a remark</h1><p class="lead">Generated from <code>process/decisions/0027-a-node-carries-its-history.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Amends:** [0002](0002-one-file-per-node.html) (the node-file shape), [0022](0022-update-proposes-nodes-from-failures.html) (where a commissioned node's justification lives); complements [0019](0019-the-update-operator.html) (whose `updates/u<n>.md` records are unchanged and now always linked)\n\n## Context\n\nThe node file's free-form `## Remark` had become four different things wearing one\nname: the creation justification ADR 0022 routes there, standing mathematical\ncommentary on the statement, the record of a withdrawal or a re-routing after an\n`/update` run, and provenance notes on promoted example nodes. Meanwhile the actual\nstory of a node — why it was cut out, what was found false, why the statement changed\n— was scattered across that remark, the `updates/` seams, the critique rounds and the\njournal, and no page assembled it. The user directed that each node instead carry its\n**history**: an enumeration of how the node has evolved, and why its statements were\nmodified.\n\n## Decision\n\n`## Remark` is retired. Every `node.md` ends with **`## History`**:\n\n- **Append-only dated bullets, oldest first**, one per event:\n  `**YYYY-MM-DD — <event>** <why, linking the primary record>`. Events are the node's\n  identity and statement life: creation, statement revisions, role or id changes,\n  decompositions, relocations, proof outcomes, evidence swings.\n- **The first entry is always the creation**: which operator cut the node out and why\n  it exists. For a node commissioned by `/update`, ADR 0022's justification *is* this\n  entry — same content, dated home.\n- **Entries link the record, never restate it**: a revision entry cites its\n  `updates/u<k>.md`, a proof entry its `critiques/r<k>.md`, an evidence entry its\n  `examples.md`, a schema event its ADR. Standing commentary a reader needs (a caveat,\n  a scope note) lives inside the entry it belongs to, not in a separate section.\n- **Writers, unchanged in spirit**: the lead-researcher writes the creation entry at\n  creation; the `/update` orchestrator appends one entry per revision, beside the\n  `u<n>.md` it writes; the user may append; nobody rewrites an existing entry — like\n  critiques, the section is an audit trail.\n- **Outside the closed world**: no proof may cite a History entry, exactly as I10 says\n  of `examples.md`; a node may still mention an appendix entry from its History\n  without admitting it to its `objects:` field (the `used by` check keeps honoring\n  that case).\n\nThe generator parses and renders `## History` where it parsed `## Remark`; the schema\ncomment in `main_dag.md` documents the format; the `/decompose` and `/update` packets\nand the lead-researcher packet route their justification text to the creation entry.\n\n## Migration\n\nAll 34 nodes were rewritten on 2026-08-04. Existing remark content was folded into\nthe dated entry it belonged to — creation justifications into creation entries,\nwithdrawal records into revision entries — and each node's earlier evolution was\nreconstructed from its `updates/u<k>.md`, its critique rounds, the git log and the\njournal: the decompose waves (08-02 the seven, 08-03 the Q1-L2 four, 08-04 the\nexample/analogy layers), the tree-wide renotation, the ADR 0012 relocations, the\nQ1-L4 withdrawal chain, and the Q1-L7 → Q1-e7 reclassification.\n\n## Consequences\n\n- A node's page now answers \"how did this statement get this way\" in one place, dated,\n  with every seam linked — the supersession trail is readable without opening git.\n- The cost is discipline: an operator that changes what a node claims owes one more\n  bullet. The append-only rule keeps that cheap — no prose to reconcile, only an entry\n  to add.\n- Historical files that *describe* remarks (the journal, critiques, ADRs 0002/0022 as\n  written) stay as they are: they describe the repository as it was.\n";</script>
