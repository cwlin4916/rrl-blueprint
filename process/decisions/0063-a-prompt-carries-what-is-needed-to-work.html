hose statement they read late. Self-containment\nwas the point of [0029](0029-every-node-has-a-generated-self-contained-prompt.html) and stays\nthe point; what had crept in beside it was completeness, which is a different thing.\n\n## Decision\n\nThe prompt carries what someone outside the repository needs in order to work on the node.\nFour cuts, none of which touches the statement, the prerequisites or the entries the node\ndeclared:\n\n1. **The history becomes its latest entry.** The log is repository process; what a reader\n   needs from it is the standing instruction in the most recent entry — that a node must\n   not be discharged by quoting a definition, that `/examples` found a hypothesis nothing\n   in print discharges. Appendix vocabulary is harvested from that entry alone, so the\n   definitions section follows what the packet actually shows.\n2. **An entry the node did not declare loses its fine print.** Declared entries are the\n   node's own vocabulary and are reproduced whole. The ones the closure reached are there\n   so that the declared entries' words can be decoded, and the definition suffices for\n   that; their `role:` and `note:` lines are fine print on an object the node never\n   claimed to use. Every entry loses `role:`, which the entry's own bolded lead already\n   says.\n3. **The link list goes.** `## Relevant references` listed six files a packet that has left\n   the repository cannot open, and each was already linked where it is used. The\n   bibliography records stay — those are content.\n4. **The prose is halved.** The task, the flag and the register lead-ins said the same\n   things twice; the register's gists are trimmed to a line each.\n\n## Consequences\n\n- `Q2-L4`: 9815 → 6489 words, a third gone. `Q1-L1`: 5582 → 3613.\n- What is reproduced is unchanged in kind: statement verbatim, direct prerequisites with\n  their use policy, declared entries whole, `refs.bib` records. The packet is still\n  self-contained and still outside the closed world.\n- [0029](0029-every-node-has-a-generated-self-contained-prompt.html)'s source list now reads\n  *the latest entry of* `<id>_history.md` rather than the file.\n";</script>
