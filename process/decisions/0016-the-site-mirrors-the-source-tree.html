path of a thing on disk no longer predicted the path of its page,\n`ls blueprint_site/nodes/` disagreed with `ls blueprint/nodes/` about the shape of the\nDAG, and a relative link between two source files was a different string from the link\nbetween their pages.\n\n0012 had defended flatness on URL stability: *\"A URL that moves when a node is decomposed\nis a URL that cannot be cited.\"* Stated precisely, the objection dissolves the same way\n0012's own Consequences dissolved it for the source tree: under id-is-the-path, a node's\nchain is a function of its id, the id is never renumbered, and decomposition only ever\nadds directories beneath — so a mirrored URL is exactly as stable as a flat one, going\nforward. The only URLs the mirror breaks are broken once, by this migration, and the site\nis untracked ([0010](0010-site-untracked-and-renamed.html)) and local: nothing outside the\nrepository cites into it.\n\n## Decision\n\n**One tree, one layout.** `blueprint_site/nodes/` takes the same directory chains as\n`blueprint/nodes/`: the page for `blueprint/nodes/Q1-L2/Q1-L2-L1/proof.md` is\n`blueprint_site/nodes/Q1-L2/Q1-L2-L1/proof.html`.\n\n**Names mirror too.** Every rendered file keeps its source name with `.md` → `.html` —\n`proof.html`, `examples.html`, `critiques/r<n>.html`, `prompts/<x>.html` — with one\nconvention: `node.md` renders as the directory's `index.html`, because the directory *is*\nthe node and its landing page should answer for it. `writeup.html` is gone.\n\n**Synthetic pages shadow no source name.** The hub, the listings (`nodes/index.html`,\n`appendix/index.html`, `critiques/index.html`), `dag.html` and the per-node sub-DAG views\nare views, not renderings of a file; they take names no source file can, so the mirror\nrule and the site's navigation never collide.\n\n## Consequences\n\nA relative link between two source files and the link between their pages are now the\nsame path: `../../../appendix.md#def-generation` from a depth-two `proof.md` becomes\n`../../../appendix/def-generation.html` from the depth-two `proof.html`. Link rewriting\nstill goes through one function (`Site.url`), but there is nothing left for it to\ntranslate about *position* — only about names, anchors, and the appendix's\none-page-per-object split ([0008](0008-one-page-per-object.html)).\n\nThe crumbs and listings had assumed depth: the critiques index grouped a report by the\npath segment at a fixed offset, which under nesting named the top ancestor rather than\nthe owning node. Grouping is now by the segment before `critiques/`, at whatever depth\nthe chain put it. `tests/test_layout.py` asserts the mirror (every node's `index.html`\nand `proof.html` at its chain; no node-id-named directory anywhere but its chain), where\nit previously asserted flatness.\n\nThe smoke tests needed nothing: both already walked the site recursively, and\n`check_render.py` resolves every link from the page that carries it — depth was never\ntheir business. That the gates were indifferent is the evidence the translation layer\nwas the only thing flatness was still paying for.\n";</script>
