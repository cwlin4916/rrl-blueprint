<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0080-who-cites-an-entry-is-derived</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0080 — Who cites an appendix entry is derived, and the entry does not say</h1><p class="lead">Generated from <code>process/decisions/0080-who-cites-an-entry-is-derived.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-08\n**Status:** accepted\n**Amends:** [0003](0003-appendix-of-objects.html) (appendix of objects), in the entry schema; [0071](0071-the-closed-world-is-the-appendix.html) (the closed world is the appendix), whose transpose paragraph is withdrawn\n**Extends:** [0014](0014-confidence-is-three-signed-channels.html) and [0058](0058-importance-is-derived-and-sizes-the-card.html) (derived, never stored)\n\n## Context\n\nEvery appendix entry carried a `- **used by:**` line naming the nodes whose `objects:` field cites it. Forty-seven of the sixty-nine entries had one, and the longest — [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../appendix/def-generation.html) — ran to thirty-one links on a single line, longer than the definition it decorated.\n\nThe line stored no fact of its own. It was the transpose of the nodes' `objects:` fields, and it was authored, so it drifted. The repository's own record of it is a record of drift and of the passes spent undoing it:\n\n- a decomposition adding twenty nodes meant a follow-up pass over the entries they cite;\n- a retired node left back-references in ten entries, cleaned up after the fact;\n- splitting the history out of the node file broke the check, because a `used by` earned by a History paragraph no longer lived in the file the check read;\n- moving entries into section directories broke the check twice more, once in the anchor capture and once in the link prefix, and while broken it reported every citing node as missing from a line that in fact named it;\n- a concurrent run was appending `used by` lines to `appendix.md` while another run restructured it — one of the collisions that forced [0053](0053-the-appendix-is-a-directory.html).\n\n**And when this change measured it, the transpose was red.** Replaying the old rule against the tree as it stood gives **37 problems**: 31 entries whose line omitted a node that cites them — `Q1-L3-L3-L1` missing from seven, `Q1-e4` from five, `Q1-L3-c1` from six — and six entries still naming `Q2-L7`, a node retired long enough ago that its directory is gone. The line had not been maintained; it had been assumed.\n\nThe response each time was to repair the checker. [0071](0071-the-closed-world-is-the-appendix.html) then made the transpose doctrine — *\"a widening is two edits and not one\"* — and `/prove` grew a rule saying so.\n\nWhat none of that noticed: **the site never read the line.** `build_dag_site.py` computes the citer list for an entry page directly from the nodes' `objects:` fields and renders it as the page's `used by` panel. The authored line was rendered too, in the body just below, saying the same thing a second time. One of the two was derived and could not be wrong; the other was hand-maintained, had been wrong repeatedly, and existed only to be checked against a computation that was already running.\n\n## Decision\n\n**An appendix entry states its object and says nothing about the argument.** The `- **used by:**` line is removed from all forty-seven entries and from the schema in `blueprint/appendix/index.md`.\n\nWho cites an entry stays visible and stays exactly where a reader already found it: the derived `used by` panel on the entry's page, recomputed on every build from the `objects:` fields, and stored nowhere.\n\nThe `--check` rule inverts. It used to reconcile the authored line against the transpose in both directions; it now fails on the presence of an authored line at all. The invariant is no longer *keep the copy correct* but *do not keep a copy*.\n\n## Consequences\n\n- **A widening is one edit.** `/prove` §3b′ said adding an entry to a node's `objects:` without adding the node to that entry \"turns the repository red at close\"; that rule is gone, and the field edit is the whole of the work. Same for `/decompose`: a new node owes no pass over the entries it cites.\n- **The lead-researcher writes an entry once.** Its instruction and the prover's gap-file format both drop `used by:` from the list of what an entry carries. An entry is now genuinely append-only in practice as well as in principle — nothing that happens downstream of it edits it.\n- **One class of merge conflict disappears.** Two runs decomposing different questions no longer both append to the same entry file.\n- **The derived list is the corrected one.** Removing the authored lines and rebuilding adds the 31 missing citers to the panels and drops the six dead `Q2-L7` references, with no edit to any entry beyond deleting a line.\n- **One annotation is lost.** [the small Satake comparison](../../appendix/thm-f-cstr-sat.html) read `[Q1-L1](…) (remark)` — Q1-L1 speaks about the entry in its history without admitting it to its `objects:`. A derived list is built from declarations, so it carries no such qualifier and does not list that node. This is the whole of what the change gives up, and the mention survives where it was written, in the node's history.\n- **Two directions of check collapse to one.** The old rule reconciled both ways; the new one has a single thing to say, and the direction it drops is now vacuous — a list built from `objects:` cannot name a node that does not cite the entry.\n- The derived panel is a readout, not a source. Like the confidence decomposition and the importance panel it is computed from the record and is therefore never evidence in it: no proof, node or entry may cite it.\n- The entry pages get shorter by exactly the line, and the longest of them by a third.\n\n## Alternatives considered\n\n**Keep the line and keep fixing the checker.** Rejected on the record above: five repairs, and the fifth would have been the fifth. A fact with one authored copy and one derived copy of the same fact does not need a better checker.\n\n**Keep the line and delete the derived panel instead.** This is the choice that keeps the citer list authored, and it is worse in every direction: it re-creates the drift, it makes the panel's correctness depend on an agent's diligence, and it puts the maintenance burden on the operator that can least afford it — the one adding a node, which is every decomposition.\n\n**Delete both.** Rejected. The list has a live use that nothing else covers: when an entry is *narrowed* — a ratified reading pinned down where the entry had left it open — the proofs written against the looser reading are precisely the ones in that list, and they need re-checking. `thoughts.md` names this as an open problem and names the list as its raw material. Deriving it keeps the material and makes it trustworthy; that gate is still unwritten.\n";</script>
