both the record and the reading copy. An append-only record wants every word kept. A reading copy wants one line per event. Holding both means the reader scrolls past 900 lines of the first to find the second.\n\nThis is the third time this repository has hit it. The appendix hit it at 1075 lines and 64 entries ([ADR 0053](0053-the-appendix-is-a-directory.html)); the node tree hit it at thirty-seven siblings in string order ([ADR 0059](0059-a-container-is-a-directory.html)). Both were fixed the same way, and the fix is now the house rule rather than a discovery.\n\nThere is a concurrency cost too, and it is the same one 0053 records. A single file is a single write target: two sessions appending entries collide, and the journal has already been the file a concurrent session was rewriting while another appended to it.\n\n## Decision\n\n**The journal is `process/journal/`, one file per entry, and `process/journal.md` is the generated-by-hand index over it.**\n\n- An entry is `process/journal/YYYY-MM-DD_NN_slug.md`, where `NN` is its order within that day. It opens with `# YYYY-MM-DD — title`, then a nav line, then the entry.\n- `process/journal.md` holds the head, **What this cost us to learn**, the convention for adding an entry, and the index: one line per entry, newest first, each the entry's own title linking to its file. It stores nothing else, so no fact is in two places.\n- The title is the summary. An entry whose title does not say what happened has not been written yet.\n- Entries stay append-only in the sense they always were: correct a past entry with new text at its end.\n\nThe pre-split file is preserved word for word as [`archive/journal_v2.md`](../archive/journal_v2.html), beside the pre-compaction [`archive/journal_v1.md`](../archive/journal_v1.html). 0034's archiving discipline is the part of it that survives.\n\n## Consequences\n\nThe index is 92 lines and answers \"what has happened here\" at a glance, which the 1032-line file did not. `process/journal` was already the prefix `tests/test_docs.py` exempts from the drift checks, so the directory inherits that exemption without a test change.\n\nTwo sessions writing entries on the same day now collide only if they pick the same `NN`, and a collision is a rename rather than a merge conflict.\n\nThe cost is one more directory, and a link depth: entry files sit one level below `process/`, so their relative links carry an extra `../`. The split rewrote them mechanically and the render gate checks them.\n";</script>
