<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0021-example-and-analogy-nodes-nest</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0021 — Example and analogy nodes nest under the lemma they illustrate</h1><p class="lead">Generated from <code>process/decisions/0021-example-and-analogy-nodes-nest.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Extends:** [0018](0018-example-and-analogy-nodes.html) (the e/a classes and their five\nrules), [0012](0012-sub-lemmas-nest-in-their-parent.html) (children live inside their\nparent), [0016](0016-the-site-mirrors-the-source-tree.html) (the site mirrors the tree)\n**Supersedes:** the scope restriction of 0018 rule 1 (\"they live at question level\")\nand its \"not introduced now\" deferral of the nested form\n\n## Context\n\n0018 created addressable example and analogy nodes but pinned them to question level,\ndeferring the nested form `Q1-L5-e1` explicitly: \"it needs the path rule extended in\ntwo tools and the tests' copy of `parent_of`, for no present inhabitant. The suffix\ngrammar admits the extension later without renaming anything.\" The inhabitant arrived.\nThe `/examples` run on Q1-L5 produced four instances — the torus, the group case, a\nGan–Gross–Prasad pair, and the $M_n$ boundary case where a hypothesis inherited from\nQ1-L4 fails — that are instances *of that one lemma*, not of the question: parked at\nquestion level their ids would say nothing about what they instantiate, and Q1-L5's own\npage, where a reader asks \"why believe this?\", would not show them. The user asked for\nexactly the deferred thing: the examples as child nodes, visible on Q1-L5's page.\n\n## Decision\n\n**A terminal `-e<k>` / `-a<k>` segment may end any node id.** `Q1-L5-e1` is an example\nnode sitting at `blueprint/nodes/Q1-L5/Q1-L5-e1/`, inside the lemma it illustrates,\nexactly as a sub-lemma sits inside the lemma it proves. Three rules, two inherited:\n\n1. **The containment edge is not a dependency.** A sub-lemma's nesting comes with\n   `parent depends-on child`; an e/a child's comes with *neither* edge — the parent\n   never lists it in `depends-on:` (0015 rule 1 / I10: an illustration must not\n   justify), and the child does not list the parent in `required-by:`. Which node it\n   speaks to is its statement's prose, as in 0018 rule 3. `--check` and the tests\n   enforce both directions.\n2. **An e/a segment is terminal.** Nothing nests inside an e/a node — no\n   `Q1-L5-e1-L1`, no `Q1-e1-e1`. A corroboration that needs its own decomposition has\n   outgrown the class and should be a lemma or a question.\n3. **Everything else is 0018 unchanged**: the full node contract, roles matching the\n   suffix, `/prove` at the same bar, tallies counting them apart, question and parent\n   confidence aggregating over the proof chain alone, only the lead-researcher\n   creating them.\n\nThe node's page draws them: every node page now opens with its **local DAG** — direct\ndependents above, dependencies below, e/a children dashed beside, each box carrying the\neffective status and the signed confidence bar, the chain's capping node dotted when it\nis not a direct dependency. That is where a nested example is *seen*, and it is why\nnesting pays: the reader of Q1-L5 meets its instances on Q1-L5's own page.\n\n## Justification\n\n**The id should say what the thing instantiates.** `Q1-e3` names a question-level\ninstance; the four Q1-L5 instances are stratification-and-generation instances of one\ndévissage criterion, meaningless at question altitude. The id grammar already encodes\nposition-in-tree for lemmas; using it for corroboration is the same convention, not a\nnew one.\n\n**Containment without dependency is the only new content**, and it is forced: nesting\nis how the tree says \"belongs to\", dependency is how it says \"rests on\", and an example\nbelongs to a lemma precisely without being rested on. 0012 fused the two because for\nsub-lemmas they coincide; e/a children are the case where they come apart, and the\nimplementation (both `parent_of` copies, `validate`, the parent-edge test) now states\nthem separately.\n\n## Consequences\n\n- `tools/build_dag_site.py`: `parent_of` recognises a terminal e/a segment; `validate`\n  drops the question-level-only rule, adds terminal-only, and now also enforces 0018's\n  \"an e/a node depends on nothing or on proof nodes\". `natkey` already ordered mixed\n  ids (a parent's lemmas, then analogies, then examples). The node-page meta row says\n  `sub-lemmas` / `children` / `corroborated by` as the composition warrants.\n- `tests/repo.py` mirrors `parent_of`; `test_layout` accepts the id form;\n  `test_operations` asserts the e/a containment edge is *not* a dependency edge, and\n  scans drafts for cited e/a ids (citing one is I10's forbidden move).\n- The lead-researcher's third mode materializes them, from `/examples`' found instances\n  or `/update`'s commissions ([ADR 0022](0022-update-proposes-nodes-from-failures.html)).\n- First inhabitants: `Q1-L5-e1`–`Q1-L5-e4`, the four instances of the corrected Q1-L5\n  statement, from the `/examples` run recorded in the journal.\n\n## Alternatives considered\n\n**Question-level ids with a \"speaks to Q1-L5\" line.** Rejected: the relation the reader\nneeds is exactly the one 0018 made prose-only, so the site cannot draw it without\nparsing statements, and the ids renumber against every other question-level instance.\n\n**A `## Instances` section in the parent's node.md.** Rejected: 0018's driver verbatim —\nan instance with its own hypotheses, literature trail and open questions is node-shaped;\na section cannot be `/prove`d or pointed at, and the parent's file is the one place its\nown statement must stay alone.\n";</script>
