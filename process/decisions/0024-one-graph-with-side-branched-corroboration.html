to depend on proof nodes — its own dependency structure. Nothing drew that\n   structure: the static SVG on a node page flattened the e/a children into a dashed\n   row, and the canvas drew them as leaves.\n3. \"Each node's own DAG\" was a *different, smaller* graph than `dag.html` — direct\n   children only, a different card on top — so the picture changed shape on every\n   drill-down and the reader re-oriented at every level. The user's direction: a\n   node's DAG should be *the same DAG* as `dag.html`.\n\n## Decision\n\n**One graph.** Every DAG page mounts the same full-depth graph. The spine — proof,\nevidence and thought nodes — is laid out once, with its dependency edges; a decomposed\nparent reaches its sub-lemmas because they are its dependencies, so the whole argument\nis one picture. The page beside each node, `blueprint_site/nodes/<path>/dag.html`, is\nthat same graph auto-opened at the node, and the node's index page embeds it in an\niframe whose chrome the engine hides when framed. \"The node's DAG\" and \"the DAG\"\ncannot disagree, because they are the same artifact.\n\n**Corroboration branches.** Example and analogy nodes are not spine columns. Each\nhangs beside the node it illustrates — its parent, or the question card for a\nquestion-level one — behind a chip on the host card: **examples to the right,\nanalogies to the left, collapsed by default**. Opening a branch shifts the\nneighbouring spine columns aside, draws a dashed arrowless containment edge from the\nhost, and draws each branch node's own `depends-on` edges, dashed with arrowheads,\ninto the graph — an open branch is a sub-DAG with the structure of its argument\nvisible, not a list. Branch cards carry status, role and the signed confidence\nexactly as spine cards do, and are addressable (`dag.html#Q1-L5-e1` opens the branch\nit lives in).\n\nGeometry, for the record: branch offset 245 from a spine host and 380 from the wide\nquestion card, 84 between branch rows, column shift 330 — sized so an open stack\nclears its host, and clears a neighbouring row offset by half a column (160), with\nmargins. The scope card and its question-level branches never shift.\n\n## Consequences\n\n- The reading order of the canvas is the argument: the spine alone by default, the\n  corroboration one click away at the node it speaks to. This is 0021's dashed\n  convention promoted from the node pages to the canvas itself.\n- `local_dag_svg` — the static per-node SVG — and the per-card drill-down chip are\n  gone; the focused pages replace both, and every node now has one, not only the\n  decomposed parents. The site tree still shadows no source name.\n- `tools/dag_smoke.js` exercises every chip on every page and asserts the exact edge\n  count three ways: collapsed (spine dependency edges plus one rise to the scope card\n  per spine node nothing spine-side needs), fully opened (plus one containment edge\n  per branch node plus its dependency edges), and re-collapsed.\n- The scope card is the question on every page — a focused page differs from the root\n  only in `DATA.focus`. The panel, filters and legend range over the spine; branches\n  are chip-governed, so a status filter cannot strand them.\n- 0016's mirror rule is unchanged: the new pages are synthetic, sit at the node's\n  directory chain, and collide with nothing hand-written.\n";</script>
