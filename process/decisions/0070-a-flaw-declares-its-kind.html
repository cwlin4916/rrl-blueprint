<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0070-a-flaw-declares-its-kind</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0070 — A flaw declares its kind, and a referee report is at most 1000 words</h1><p class="lead">Generated from <code>process/decisions/0070-a-flaw-declares-its-kind.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Follows:** [0031](0031-presentation-is-a-stage-not-a-command.html) — presentation left the critic so the mathematics would be visible; this is the same problem one level in\n\n## Context\n\nThe user's report was that flaws kept appearing and nothing said what they meant. Reading all 48 referee reports on disk, the complaint is exact and the numbers say why.\n\n```\n48 referee reports                              31 PASS · 17 FAIL\n└── 341 flaws\n    ├──   4 FATAL ....... the round fails            ⛔  1%\n    ├──  43 MAJOR ....... the round fails            ⛔ 13%\n    └── 294 MINOR ....... the round fails on none    ✅ 86%\n```\n\n**Six flaws in seven change no outcome.** A round fails if and only if some flaw is FATAL or MAJOR, and that sentence was nowhere written down. So a report reads as alarming and is usually harmless, and there was no way to tell which from the outside.\n\nThe reports are also long: 41 of 48 exceed 1000 words, the mean PASS is 1776 and the longest is 3729. That is not verbosity. On a passing round the mathematical channel is the Baconian ratio over flaws raised and disposed of, and **every flaw counts the same whatever its severity**:\n\n$$\nD=\\frac{e+1}{e+2}.\n$$\n\n[Q1-L2-L2](../../nodes/Q1/Q1-L2/Q1-L2-L2/index.html) passed with 2 flaws and sits at 37.5%. [Q1-L1](../../nodes/Q1/Q1-L1/index.html) passed with 30 across five rounds and sits at 73.4%, the highest in the repository. Both passed clean. **Length pays**, and nothing was correcting for it.\n\nSeverity was also the only axis a flaw carried, and severity says how bad a flaw is, not what to do about it. *Outside the closed world* and *a step is false* can both be MAJOR and have nothing in common: the first is a `objects:` widening the lead-researcher grants, the second may be a job for `/update` rather than the prover.\n\n## Decision\n\n**A flaw carries a kind as well as a severity**, one of eight, written as a second bracket:\n\n```\n**Flaw 3** [MAJOR] [W] (location: Step 2, \"…\")\n```\n\n| | kind | who fixes it |\n|---|---|---|\n| `S` | statement drift — the write-up's Lemma is not the node's Statement | prover, as a `diff` |\n| `F` | a step is false — and here is the case | prover, or `/update` if the statement is what is wrong |\n| `G` | a step has no reason — asserted, elided, compressed | prover |\n| `H` | a hypothesis is unchecked — a quoted entry's conditions are not verified here | prover |\n| `M` | a source is misread — an entry cited for something it does not say | prover |\n| `W` | outside the closed world — true, but not declared | lead-researcher, as a widening |\n| `N` | a symbol is ambiguous — no ambient category, notation coined inline | prover |\n| `B` | bookkeeping — a field, a budget, a link spelling | orchestrator |\n\nThe kind says **what to do next**, which is the question a reader of a report actually has.\n\n**A referee report is at most 1000 words**, reported by `tools/check_render.py` and never failed — a critique is append-only under I4, so the remedy for an over-long one is the next report, not a rewrite of this one. Three rules make it fit: a MINOR is one sentence; a flaw an earlier round raised is named and linked rather than restated; the checks that passed get one line between them.\n\n**The classification is recomputed, not stored.** [`tools/stats.py`](../../../tools/stats.py) prefers the referee's own letter and falls back to an ordered rule list for the 48 reports written before the kind existed, so the taxonomy is a readout of the record on the same footing as confidence.\n\n## Consequences\n\n[`process/pipeline/flaws.md`](../pipeline/flaws.html) is the page a reader goes to, and it carries the distribution. Two readings from it are worth acting on and are not acted on here.\n\n**What actually fails a round is `F`.** Of the 47 flaws that can fail anything, 14 are *a step is false* — nearly a third, and no other kind is close. The referee's real yield is finding wrong steps; the rest is the price of the search.\n\n**About a third of what referees write is mechanically checkable.** `N` is 19% of the corpus and 61 of its 64 instances are MINOR, nearly all of it the ambient-category convention. `W` is 13% and never once FATAL, and it is decidable: the set of entries a draft links against the set its node declares. Moving both into `tools/check_render.py` is the work this record makes obvious and does not do.\n\n**The 48 reports on disk are not rewritten.** They are the audit trail, the gate reports a defect in one as a note rather than a failure, and a record that gets tidied is not a record. The rules bind the next report.\n\nOne thing is deliberately not changed. The Baconian ratio still counts every flaw the same, so a thorough referee still scores a node higher than a terse one. That is the eliminative-induction reading working as designed — a claim that survived thirty attempts to break it *is* better tested than one that survived two — and severity-weighting it would mean deciding that a MINOR is worth some fraction of a MAJOR, which is a number nobody can defend. The 1000-word cap bounds the incentive instead of pricing it.\n";</script>
