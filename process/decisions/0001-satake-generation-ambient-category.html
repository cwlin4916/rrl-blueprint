<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0001-satake-generation-ambient-category</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>ADR 0001 — Satake generation is formed inside $\mathcal{D}^{\mathrm{ren}}$</h1><p class="lead">Generated from <code>process/decisions/0001-satake-generation-ambient-category.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [journal](../journal.html) · [appendix entry](../../appendix/def-satake-subcategory.html)\n\n- **date:** 2026-08-02\n- **status:** accepted, binding on every node\n- **kind:** mathematical ratification — fixes a reading of the manuscript\n- **arose in:** [Q1-L1](../../nodes/Q1/Q1-L1/index.html), critic round 1 `FAIL`\n\n## Context\n\n`def:satake_subcategory` (main.tex:917) defines\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle\n$$\n\nusing the generation operation of `def:generation` (main.tex:502). That operation takes the smallest **cocomplete** stable subcategory of an ambient category $\\mathcal{C}$ containing the given objects — and the ambient $\\mathcal{C}$ is part of its data.\n\nThe manuscript never names $\\mathcal{C}$ at this point of use. Taking $\\mathcal{C} = \\mathcal{D}_c(K\\backslash LX)$ is not available: $\\mathcal{D}_c$ is small and not cocomplete, so \"smallest cocomplete subcategory\" does not denote. The definition as printed therefore does not determine a subcategory.\n\nThe prover chose a reading silently in round 1. The critic returned `FAIL` on exactly that: the choice was unjustified, not wrong.\n\n## Decision\n\nThe generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$, and the Satake subcategory is the intersection back into the small category:\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n## Justification\n\nForced by the manuscript itself. The proof of `thm:F_cstr_Sat` asserts an essential image at main.tex:1391–1392 that holds only under this reading. The ratification is therefore a recovery of the intended meaning, not a new mathematical choice — which is why it is recorded as binding rather than left as a per-node assumption.\n\n## Consequences\n\n- Every node downstream of [Q1-L1](../../nodes/Q1/Q1-L1/index.html) presupposes it; [Q1-L2](../../nodes/Q1/Q1-L2/index.html) is stated directly in terms of generation in $\\mathcal{D}^{\\mathrm{ren}}$.\n- Compactness arguments must run in $\\mathcal{D}^{\\mathrm{ren}}$, where $\\mathcal{D}_c$ is by construction the subcategory of compact objects. On stacks coherent $\\ne$ compact, so this is not a formality.\n- Reversing the decision invalidates every proof below Q1-L1.\n- The reading is recorded in three places that must agree: the appendix entry, the Q1-L1 remark, and `context.md`'s ratified-readings list. If they ever disagree, the appendix entry wins.\n\n## Alternatives considered\n\n**Generate inside $\\mathcal{D}(K\\backslash LX)$** (the unrenormalized category). Rejected: it makes the essential-image step of `thm:F_cstr_Sat` false, and it breaks the identification of $\\mathcal{D}_c$ with the compacts.\n\n**Read $\\langle-\\rangle$ as \"smallest thick subcategory\"** — finite colimits and retracts only, which does make sense inside the small $\\mathcal{D}_c$. Rejected: it is not what `def:generation` says, and the two readings differ precisely on the objects the paper needs.\n\n**Leave it open and let each node assume what it needs.** Rejected: this is how a DAG silently stops being a proof.\n";</script>
