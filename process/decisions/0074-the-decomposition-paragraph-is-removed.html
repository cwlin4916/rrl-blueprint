<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0074-the-decomposition-paragraph-is-removed</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0074 — The decomposition paragraph is removed</h1><p class="lead">Generated from <code>process/decisions/0074-the-decomposition-paragraph-is-removed.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Supersedes:** the `## Decomposition` half of [0012](0012-sub-lemmas-nest-in-their-parent.html) (sub-lemmas nest in their parent), and the reassembly requirement `/decompose` has carried since it was written\n**Amends:** [0056](0056-a-questions-readout-is-a-tree.html) (whose §\"`## Decomposition` is unaffected\" no longer has a subject), [0062](0062-a-node-states-its-own-flaw.html) (which reasons about `## Statement` and `## Decomposition` being a node file's only sections)\n\n## Context\n\nExpanding a node with `/decompose` gave the parent a `## Decomposition` section: **one paragraph** saying how the sub-lemmas reassemble into the parent's statement. The rule was explicit that an expansion which does not say how the pieces recombine \"is a list, not a decomposition\".\n\nFifteen nodes carry one. Measured:\n\n| | |\n|---|---|\n| single unbroken paragraph | 11 of 15 |\n| longest | 386 words, one paragraph ([Q1-L3-L2](../../nodes/Q1/Q1-L3/Q1-L3-L2/index.html)) |\n| over 200 words | 10 of 15 |\n\nA 386-word paragraph that names four hypothesis labels across four children, two appendix entries and a residual-debt ledger is not read. It is skipped, which is the user's report and the immediate cause of this record.\n\nLength is the symptom. Three things underneath it:\n\n**The one-paragraph constraint fought the content.** What the section had to carry — which child is which clause, under which hypotheses, and what debt is left over — is a table's worth of claims. Told to be one paragraph, it became a run-on. The rest of the repository had already learned this: [ADR 0043](0043-a-proof-step-is-one-claim.html) split proof steps because a step concluding six facts is six steps, and [ADR 0060](0060-a-write-up-has-two-budgets.html) added a split signal for the same reason. `## Decomposition` was the one place still specified as a single paragraph, and it is the one place that produced 386 words of it.\n\n**Nothing checked it.** The render gate checked its math and its links; no gate, no critic and no verdict ever checked whether what it said was true. It was the only load-bearing prose in a node file with no reader.\n\n**So it drifted, and the drift is on the record.** Three of fifteen have a logged repair:\n\n- [Q1-L3-L2's u4](../../nodes/Q1/Q1-L3/Q1-L3-L2/updates/u4.html) — the paragraph \"still carried [r3](../../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r3.html)'s Flaw 22 error\", naming the wrong residual debt and calling the parent the conjunction of its children, \"both false against the repaired write-up\". It survived two critique rounds saying a false thing about the node it sat in.\n- [Q1-L3's u2](../../nodes/Q1/Q1-L3/updates/u2.html) — the paragraph asserted a compactness identification the node does not establish; corrected to point at hypothesis **(A)** instead.\n- [Q1-L2's history](../../nodes/Q1/Q1-L2/history.html) — the paragraph coined $\\mathcal{A}$ for the object the appendix calls $\\mathcal{A}_X$, leaving one object under two names across Q1 and Q2.\n\nA second copy of edges the node files already store is what [ADR 0056](0056-a-questions-readout-is-a-tree.html) deleted from the question readouts. This is the same defect one level down, and worse: the readout was generated and could not drift, while this was hand-written and did.\n\n## Decision\n\n**`## Decomposition` is removed. `## Statement` is the only section a node file may have.**\n\n1. **The fifteen sections are deleted** from their `<id>_node.md`. Git holds them; each affected node's dated `<id>_history.md` entry records the removal and names this ADR.\n2. **`/decompose` no longer writes one.** An expansion is the children, their statements, their `depends-on`/`required-by` edges and their examples — nothing else on the parent, whose `## Statement` was already frozen and stays so.\n3. **The render gate enforces it.** `NODE_SECTIONS = {\"Statement\"}` in `tools/check_render.py`: a node file with a `## Decomposition` now fails, as any other extra heading already did.\n4. **The site stops rendering it.** The parse, the relink and the panel's `<h3>Decomposition</h3>` come out of `tools/build_dag_site.py`.\n5. **The concept is untouched.** A decomposition is still a node's children — the fan-out cap ([ADR 0050](0050-a-node-has-at-most-ten-children.html)), the fold rule ([ADR 0051](0051-a-decomposition-folds-whatever-its-members-are-rolled.html)), the grounding requirement ([ADR 0048](0048-a-decomposition-is-grounded-node-by-node.html)) all read the edges and none of them read the paragraph. Only the prose section goes.\n\n**Where the reassembly is said instead.** In the children, which is where it was already said twice. A sub-lemma's `## Statement` says what it claims; that it is clause (3) of its parent is visible in the statement, and where a child carries a hypothesis its parent does not, the hypothesis is a labelled paragraph in the child under [I23](../pipeline.html#4-invariants)'s spaced-list rule — a place a gate reads. What genuinely needs saying about a particular expansion, in the run that made it, goes in the dated `<id>_history.md` entry for that expansion, which is where every other \"why we did this\" already lives ([ADR 0027](0027-a-node-carries-its-history.html)).\n\n## Justification\n\n**Prose no gate reads is prose that goes stale, and stale prose in a node file is worse than none.** The node file is the one place a reader is promised the claim and nothing but the claim ([I23](../pipeline.html#4-invariants), [ADR 0037](0037-the-node-panel-carries-the-statement.html)). A paragraph sitting there asserting a false residual debt for two critique rounds is an unforced misdirection: a reader who trusts the file is misled, and one who does not gains nothing from it being there.\n\n**The obligation it was invented for is discharged elsewhere and better.** The worry behind the rule is real — an expansion that is a list of loosely related lemmas has not decomposed anything. But the check for that is whether the children's statements, taken together with their declared hypotheses, actually entail the parent, and that is a *proof* obligation, tested by `/prove` on the parent and by the critic. A paragraph asserting the entailment does not establish it; it is a claim in the position of a check. Q1-L3-L2's case is exactly this: the paragraph said the children reassemble to the parent, and the equally hand-written next sentence said the parent \"is **not** their conjunction\".\n\n**Removing it costs a reader nothing they could not get.** Every fact the paragraph carried is in the tree readout (which child hangs where), the children's statements (what each claims), the flaw blocks and critiques (what is still owed), or the history (why the cut was made there). What was unique to it was the *ordering* of those facts into an argument — and eleven times out of fifteen that argument was one paragraph long enough that nobody read it.\n\n## What it costs\n\n**Three of the fifteen said something real that is now only in git.** Q1-L3-L2's four-fact residual-debt ledger, Q1-L5-L3's account of which draft step the children replace, and Q1-L3-L3's warning that its child is *not* a step in proving it but an instance of its hypothesis **(B)**. The third is the sharpest loss: it corrects a natural misreading of the containment, and containment-is-not-dependency is exactly the thing readers get wrong. Each of the three is carried into the node's `<id>_history.md` in the same run that removes the section, one sentence each, rather than being left to `git log`.\n\n**`/decompose`'s output gets less legible in the short run.** A run that produces six statements and no paragraph tying them together asks more of the next reader than one that produces a paragraph, even a bad one. The bet is that a reader who has to reconstruct the reassembly from the statements will find the gaps in it, and a reader handed a paragraph will not.\n\n## Alternatives rejected\n\n- **Keep it, cap it at 120 words, and let the render gate enforce the cap.** Rejected: it fixes the symptom the user named and none of the three causes. A 120-word unchecked paragraph drifts exactly as a 386-word one does, and the compression would push out the hypothesis bookkeeping, which is the only part with content.\n- **Keep it but require one paragraph per child instead of one per expansion.** The most tempting option, and the closest to what [ADR 0043](0043-a-proof-step-is-one-claim.html) did for proof steps. Rejected because it doubles down on the real defect: it makes the second copy longer and more structured, and a more structured second copy drifts in more places. The `-L` id already says which child; the child's statement already says what it claims.\n- **Move it into the parent's `proof.md`.** Rejected: it is not a proof, the parent's write-up may not exist, and a `proof.md` is under a word budget that this would eat.\n- **Generate it from the children.** Rejected: a generator can list the children, which the tree readout already does, and cannot say why they entail the parent, which is the only part worth having.\n";</script>
