<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0039-one-graph-for-every-question</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0039 — One graph for every question, and an arrow between them</h1><p class="lead">Generated from <code>process/decisions/0039-one-graph-for-every-question.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** superseded by [0082](0082-the-root-graph-draws-questions-alone.html), which keeps the Feeds relation and moves it off a canvas three arguments wide\n**Supersedes:** [0038](0038-one-graph-per-question.html), whose split into one page per question was the right fix to the wrong layer\n**Amends:** [0024](0024-one-graph-with-side-branched-corroboration.html); complements [0016](0016-the-site-mirrors-the-source-tree.html)\n\n## Context\n\n[ADR 0038](0038-one-graph-per-question.html) found a real bug — every graph page mounted\nthe *first* question's scope card, so [Q2](../../dag.html)'s eleven nodes\nhung under a card titled *Q1* and Q2's own framing rendered nowhere — and fixed it by\ngiving each question its own page. That removed the wrong thing. The defect was that the\npage had **one** card; the repair gave the reader **one question at a time**, which is\nstrictly less than they had, because the two questions are related and the relation is\nnow the interesting part.\n\nQ2 exists to supply Q1: under Q1-L5's recollement package, the membership Q2 asks about\nis necessary and sufficient for Q1's equality. A reader who can see only one of them at a\ntime cannot see that at all.\n\n## Decision\n\n**One graph. One card per question, side by side.**\n\n- The root graph `dag.html` draws every question. Each question is a *block*: its spine\n  laid out by dependency depth around its own local origin, its example and analogy\n  branches beside their hosts, its scope card on top. Blocks are tiled left to right with\n  a clear lane between them, wider than the shift an opened branch can cause, so a branch\n  opened at the edge of one block never reaches into the next.\n- **A node rises to its own question's card.** `n.q` names it. This is the bug of 0038,\n  fixed where it lived rather than routed around.\n- The per-question pages `dag-q<n>.html` are gone. A node page still embeds its own\n  question only — an iframe 300px tall is one argument's worth of room — and its\n  breadcrumb, its ⌂ and its caption all point at `dag.html`, which draws them all.\n- The pills in the bar became **jumps**: `Q2` centres and opens Q2's card on the page you\n  are on. From a node page, which draws one question, the other question's pill is a link\n  to `dag.html#__q2`. A scope card is addressable, exactly as a node is.\n- Opening nothing, with more than one question drawn, gives a contents panel — one row\n  per question with its node count and what it feeds, then the nodes grouped by question\n  — instead of the first question's framing standing in for the whole graph.\n\n**A question may feed a question.** A question section in `blueprint/main_dag.md` may\ncarry a `**Feeds.**` paragraph naming the questions it supplies, one `#q<n>` link per\ntarget. The site draws one thick accent arrow per link, card to card.\n\nThe relation is **between questions and not between their nodes**. No Q2 node lists a Q1\nnode in `depends-on`; the transpose check, the tallies, the confidence aggregates and the\n`role: proof` chain all stay exactly as they were, and each question stays separately\nauditable. This is the deliberate opposite of 0038's closing note, which said a\ncross-question edge \"would mean one graph again\" — it does, and one graph is what this\nrecord chooses.\n\n**The panel is the reader's.** A question's Setting, Problem statement and Conjecture are\nthe longest prose the site has, and 400px was a guess about how much of it anyone wants\nbeside the graph. A grip on the panel's left edge drags it between 300px and 72% of the\nviewport; the width persists and a double-click restores the default.\n\n**The way home is labelled.** `⌂` and `☰` in the bar became `⌂ DAG` and `☰ pages`. The\ncrumb trail already encodes the way back, but only for a reader who reads it; a glyph you\nhave to hover over to identify is not a shortcut. Every generated page carries both.\n\n## Consequences\n\n- The root canvas draws 40 cards across two blocks and opens zoomed out on all of it. The\n  fit floor dropped from `.7` to the wheel's own `.28`: at `.7` a two-question graph\n  opened on Q1 with Q2 cut off the right edge, which reads as a graph with one question\n  in it.\n- **A generated tree needs orphan removal, and did not have it.** Renaming `dag-q2.html`\n  into a section of `dag.html` left the old page on disk and tracked, reachable, and\n  contradicting the blueprint — and the build reported success. The generator now deletes\n  anything under `blueprint_site/` it did not write (vendored KaTeX excepted) and prunes\n  the empty directories; `--check` reports an orphan as an inconsistency. This is the\n  general form of the lesson: a tree that is generated *in full* is only generated in full\n  if what is no longer generated goes away.\n- The smoke test asserts the shape rather than the count: as many `.qnode` cards as\n  `DATA.scopes`, every node naming a card the page actually draws, one edge per `Feeds.`\n  link, and each card's panel showing its own question and not another's.\n- 0038's closing lesson stands and is worth repeating with its own counter-example\n  attached: *the first of anything is not the shape of it* — including the first fix.\n";</script>
