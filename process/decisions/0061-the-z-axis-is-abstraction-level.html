<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0061-the-z-axis-is-abstraction-level</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0061 — The z axis is abstraction level, and it is drawn 2.5D</h1><p class="lead">Generated from <code>process/decisions/0061-the-z-axis-is-abstraction-level.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0059](0059-a-container-is-a-directory.html) (a node's id is its path), [0039](0039-one-graph-for-every-question.html) (one graph for every question), [0014](0014-confidence-is-three-signed-channels.html) (confidence is three signed channels)\n\n## Context\n\nReading Q1's subtrees against the question \"which of these are formal?\" turned up a fact the\ngraph had no way to draw. Thirteen of Q1's thirty-four nodes state something in which no $X$,\nno $G$, no $LX$ and no Hecke action appears: they are claims about a compactly generated\nstable category, or about a space with a locally finite stratification, and the geometry\nenters only when they are specialized. [Q1-L2](../../nodes/Q1/Q1-L2/index.html)\nand all four of its children are of this kind, and so, on a different axis, are most of\n[Q1-L5](../../nodes/Q1/Q1-L5/index.html).\n\nThe DAG could record that only by adding a dependency, and a dependency is the wrong\nrelation and has the wrong consequences. A node already proved does not acquire an unmet\nobligation by being recognized as a special case of something more general; under\n[0014](0014-confidence-is-three-signed-channels.html) an edge into `depends-on` caps the\ndependent's confidence at its weakest ancestor, so recording \"this is an instance of that\"\nas a dependency would have driven a `proved` node's number down for stating a **fact about\nthe node's own generality**. The relation is also not containment: the general statement is\nnot inside the special one, and it is not a member of anybody's decomposition.\n\nThe layout could not carry it either. Both existing axes are spoken for — x is the sibling\norder inside a layer, y is the depth from the question — and the plane is full.\n\n## Decision\n\n**A third axis, and the id carries it.** `-z<k>` joins `-L`, `-e` and `-a` as an id segment,\nand a node's **level** is the number of `-z` segments in its id, exactly as its x/y depth is\nthe `-L` chain. There is no `level:` field, for the reason there is no `confidence:` field:\nthe fact is derivable, so storing it is a second copy that can drift. `Q1-L2-z1` sits at\n`blueprint/nodes/Q1/Q1-L2-z1/`, by the same path rule as `Q1-e1`.\n\n**A new edge, stored once and never followed.** A level node carries `instances:`, listing\nthe lower-level nodes it states the general case of. It has no transpose: the fact lives on\nthe general node, and the specialized node's own file is not touched by being abstracted —\nwhich is the point, since it may be proved already. `instances` is **not** `depends-on`: the\nconfidence derivation never follows it, so a level node caps nothing and changes no number\nanywhere in the repository. `--check` verifies only that the target exists, that it is at a\nstrictly lower level, and that a level node's role is `proof`.\n\n**The drawing is 2.5D and off by default.** Each level is laid out in its own plane by the\nsame 2D pass, and only the planes are stacked. At rest the graph is byte-for-byte the\ndrawing it has always been: a level node is **absent**, not dimmed and not folded. One\nbutton (⤢) tweens the planes apart; shift-drag or right-drag gives the two angles directly,\nclamped; the ◎ that resets the zoom resets the tilt too, so a reader who gets lost has one\nthing to find and not two. A page with nothing above level 0 does not mount the button at\nall.\n\n**An abstraction is drawn over what it abstracts.** A level node's x is the centroid of its\ninstances and its y is the highest of them, so tilting lifts the general statement straight\nout of the special case. Where a page folds the instance into an ancestor's card\n([0026](0026-sub-lemma-families-fold-into-their-parent.html)) the nearest drawn ancestor\nstands in for it, and where a level's row would collide it is respread at the spine pitch.\n\n## Why 2.5D and not 3D\n\nThe projection is **oblique**: cards stay upright and axis-aligned at every angle, the base\nplane is left almost undistorted (a cavalier projection — the .22 foreshortening is a token,\nenough to read as a tilt, small enough that the 252px row pitch never collapses into\nitself), and depth is carried by the vertical offset, the yaw parallax and the dashed\nconnectors rather than by perspective.\n\nThis is the settled compromise in the graph-drawing literature and not an invention here.\nFull 3D node-link drawings on a flat screen buy depth with occlusion and rotated text, the\ntwo things that make a graph unreadable, and the standard remedy is to partition the graph\ninto subgraphs each drawn in its own 2D plane and stack only the planes — Hong, Nikolov and\nTarassov's 2.5D hierarchical drawing of directed graphs (JGAA 11(2), 2007), which defines a\ndrawing's *occlusion* as the crossings visible from two orthogonal angles and lays the\nplanes out to minimize it. Bach, Dragicevic, Archambault, Hurter and Carpendale's\ngeneralized space-time cube (Computer Graphics Forum, 2016) is the frame for the rest: a\nstack of 2D planes plus a small set of operations on it, of which the two that stay readable\nare **flattening** (our tilt at 0) and **juxtaposition** (our tilt at the preset). We\nimplement exactly those two and interpolate between them, which is why there is one degree\nof freedom on the button and why the flat view had to remain reachable in one click.\n\nThe z axis is **generality**, not time and not hierarchy: z=0 is this problem, z=1 is the\nstatement it is a special case of.\n\n## Consequences\n\n- Q1 gains [Q1-L2-z1](../../nodes/Q1/Q1-L2/Q1-L2-z1/index.html) and\n  [Q1-L2-L3-z1](../../nodes/Q1/Q1-L2/Q1-L2-L3/Q1-L2-L3-z1/index.html), the minimal test bed: the abstract\n  criterion [Q1-L2](../../nodes/Q1/Q1-L2/index.html) specializes, and the\n  abstract hypothesis-check [Q1-L2-L3](../../nodes/Q1/Q1-L2/Q1-L2-L3/index.html)\n  specializes.\n- No existing node file changed, and no confidence, status or tally moved except the count\n  of Q1's proof nodes.\n- `tools/dag_smoke.js` gains the gate: at rest every level node is hidden, one click brings\n  in each node and one dashed edge per `instances` entry, and a second click restores the\n  flat graph's edge count exactly. The stub gained `remove()` and a virtual frame clock so\n  the tween is tested by its result and not by its click.\n- A level node with an empty `instances` field is a `NOTE`, not a failure: it is a general\n  statement nobody has yet attached to anything.\n";</script>
