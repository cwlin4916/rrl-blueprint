<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0064-an-abstractions-id-names-what-it-generalizes</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0064 — An abstraction&#x27;s id names what it generalizes</h1><p class="lead">Generated from <code>process/decisions/0064-an-abstractions-id-names-what-it-generalizes.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Amends:** [0061](0061-the-z-axis-is-abstraction-level.html) (the z axis is abstraction level)\n**Extends:** [0059](0059-a-container-is-a-directory.html) (a node's id is its path), [0050](0050-a-node-has-at-most-ten-children.html) (a layer is at most ten wide)\n\n## Context\n\n[0061](0061-the-z-axis-is-abstraction-level.html) put the four abstractions at `Q1-z1`–`Q1-z4`,\nquestion-level siblings of `Q1-L1`. The id said which question they belonged to and their\nserial number among each other, and nothing else. What each one is the general case of was\nrecorded only in its `instances:` field, so the id — the thing that names the directory,\nthe site page, every link written at it and every commit message that mentions it — carried\nnone of the one fact that distinguishes an abstraction from any other node.\n\nThe serial number made it worse rather than neutral. `Q1-z1` and `Q1-z2` are abstractions of\ntwo different nodes on the same axis; `Q1-z3` and `Q1-z4` of two nodes on a different one.\nNothing in `z1, z2, z3, z4` says so, and the numbering had already recorded a fact nobody\nwanted it to record — the order in which the four were written.\n\nFour abstractions also cost `Q1` four of its direct children, in a question already at\nsixteen against a cap of ten ([0050](0050-a-node-has-at-most-ten-children.html)), for nodes\nthat are absent from the graph at rest and therefore cost the picture nothing.\n\n## Decision\n\n**The id names the instance, and the number is the layer.** An abstraction of `Q1-L2` is\n`Q1-L2-z1`, and an abstraction of *that* is `Q1-L2-z2`. The `-z` number is no longer a\nserial among siblings; it is the abstraction level, which is what `z` meant everywhere\nelse. So a level is read off the number written in the trailing segment and not off the\ncount of segments:\n\n```\nQ1-L2       level 0     the special case\nQ1-L2-z1    level 1     the statement Q1-L2 specializes\nQ1-L2-z2    level 2     the statement Q1-L2-z1 specializes\n```\n\nThe four existing nodes move accordingly, each onto its primary instance:\n\n| was | is | generalizes |\n|---|---|---|\n| `Q1-z1` | `Q1-L2-z1` | `Q1-L2` |\n| `Q1-z2` | `Q1-L2-L3-z1` | `Q1-L2-L3` |\n| `Q1-z3` | `Q1-L5-z1` | `Q1-L5`, and its two directions `Q1-L5-L1`, `Q1-L5-L2` |\n| `Q1-z4` | `Q1-L6-z1` | `Q1-L6` |\n\n**The id names the relation; it does not change it.** [0061](0061-the-z-axis-is-abstraction-level.html)\nsettled that the general statement is not inside the special one and is not a member of\nanybody's decomposition, and that stands. Only the naming changes. So a `-z` child is\nexcluded, everywhere, from the three things a decomposition member gets:\n\n- **the sub-lemma count** — a parent must not claim a child it does not depend on;\n- **the fan-out cap** — an abstraction is drawn in its own plane and is absent at rest, so\n  it costs the layer nothing, and `Q1` is back to sixteen direct children from twenty;\n- **the folding rule** ([0026](0026-sub-lemma-families-fold-into-their-parent.html)) — an\n  abstraction is drawn wherever its question is, as it was when its id had no parent in it.\n  Folding it into the instance's card would empty the plane that the tilt exists to reveal,\n  on every page except the instance's own.\n\n**The question tree says which arrow it is.** The generated readout\n([0056](0056-a-questions-readout-is-a-tree.html)) draws an abstraction under what it\ngeneralizes, because that is what its id now says, and closes the row with `↑` and its\ninstances where a dependency would carry `←`. A row with neither arrow is a member of its\nparent's decomposition. Three relations, three markings, no field to read.\n\n## Why not leave the ids alone and rely on `instances:`\n\nBecause a field is read by whoever opens the file, and an id is read by everyone else. The\nfirst-order failure was not that the fact was unrecorded — it was recorded correctly — but\nthat the four ids were interchangeable at a glance, in the DAG index, in the site sidebar,\nin `git log`, in this sentence. Making the id carry it costs one rename and removes a class\nof misreading permanently. It is the same argument [0059](0059-a-container-is-a-directory.html)\nmade for paths, applied to the one edge that directory nesting could not already express.\n\n## Consequences\n\n- Four directories move; every link into them is rewritten by resolving it against the old\n  home and re-expressing it from the new one, so the depth change is not hand-arithmetic.\n  No statement, status, verdict, history entry or confidence changes.\n- `zlevel()` and `abstracts()` join `parent_of()` and `id_path()` as the id-reading\n  functions. `z` is `zlevel(id)`; nothing stores it, as before.\n- `--check`'s two z rules are untouched: an abstraction's `instances` must exist and be\n  strictly lower, and its role must be `proof`. Both still hold.\n- The naming has a wrinkle worth writing down before it is discovered: `parent_of` maps\n  `Q1-L2-z2` to `Q1-L2`, not to `Q1-L2-z1`, so a second layer sits beside the first rather\n  than inside it. That is the right picture — both are abstractions *of the same\n  instance*, at different heights — but it means the `-z` chain is not a directory chain\n  the way the `-L` chain is. No second layer exists yet.\n";</script>
