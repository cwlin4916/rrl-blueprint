answer*. A reader of the\nquestion page saw how the pieces would combine, but the claim the tree currently\nbelieves — the thing a referee would call the conjecture — appeared nowhere as a\nsentence. The problem statement (0019) says what would count as an answer; nothing\nsaid what we think the answer is.\n\n## Decision\n\nThe per-question block is a **Conjecture.** paragraph: the current best answer\nstated as a claim, then the status of the route to it — how the proof nodes assemble\ntoward the claim and where each link stands (proved, waiting, at what scope, with\nsupersessions dated). It is the same block in the same position; what changes is\nthat it leads with the mathematics under test and treats the assembly as that\nclaim's support, current as of the date it carries.\n\nThe discipline transfers unchanged: the conjecture's assembly cites proof nodes and\nnothing else (0015's rule, reworded), with corroboration nameable after it and\nmarked as such; `/update` remains the one lawful reviser of the paragraph (0019);\n`/decompose` writes it at question creation. The site generator parses and renders\n**Conjecture** where it parsed **Logical closure**, key renamed to match; nothing\nelse in the derivation pipeline reads the paragraph.\n\n## Consequences\n\n- The schema comment and Q1's section in `main_dag.md` rewritten; Q1's paragraph now\n  opens with the bracketed criterion (exact Q1-L5(1)+(2), necessary Q1-L3(iii),\n  sufficient Q1-L6) and dates its status prose.\n- `tools/build_dag_site.py` (parse, payload key, card heading), both pipeline\n  documents, `README.md`, `CLAUDE.md`, and the decompose / research-status / update\n  packets and the lead-researcher packet reworded — one term everywhere current.\n- The cost accepted: historical records — the journal, critiques, 0002 and 0015 —\n  keep \"logical closure\", since they describe the repository as it was. A reader\n  greps two terms across history; the schema comment is the bridge.\n- A conjecture dated and hedged is a conjecture that goes stale: whoever moves a\n  link's status is re-reading this paragraph anyway under `/update`'s neighbour\n  pass, which now checks the conjecture where it checked the closure.\n\n## Alternatives considered\n\n- **Keep Logical closure and add a separate Conjecture paragraph.** Rejected: the\n  two would share the implication chain, and every supersession would have to be\n  recorded twice or drift. One block that states the claim and then its route keeps\n  the fact stored once.\n- **Put the conjecture in the problem statement.** Rejected: 0019 made the problem\n  statement the criterion for *what counts* as an answer — necessary / sufficient /\n  exact — and that is worth keeping distinct from the answer currently believed;\n  the first is nearly frozen, the second moves with the tree.\n";</script>
