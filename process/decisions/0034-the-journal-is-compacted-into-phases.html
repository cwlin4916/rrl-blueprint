<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0034-the-journal-is-compacted-into-phases</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0034 — The journal is compacted into phases, and the full record is kept beside it</h1><p class="lead">Generated from <code>process/decisions/0034-the-journal-is-compacted-into-phases.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Amends:** the append-only rule the journal declared about itself. Nothing else — [`process/decisions/`](README.html), the node histories, `updates/` and `critiques/` keep their append-only discipline untouched, and this record is not a precedent for compacting any of them.\n\n## Context\n\n`process/journal.md` had reached 1,755 lines and sixty-nine `##` entries over four days. Every entry was worth writing when it was written, and the file's own header said so: \"Entries are append-only: correct a past entry with a new one, do not rewrite it.\"\n\nThe problem was not that the entries were wrong. It is that the file had stopped being read. What a newcomer — or an operator at the start of a run, which is the more frequent case — needs from it is *what this project learned*, and that was distributed across sixty-nine closing paragraphs. The findings that actually changed the pipeline (check the artefact not the source; a scoring scheme with no negative range cannot represent its own best finding; an external passage is a lead) were each one sentence at the end of one entry, indistinguishable in prominence from a note about a CSS gap.\n\nA file that is not read is not an audit trail; it is storage. And the user's report was exactly this: the journal is too long, extract the lessons.\n\n## Decision\n\n**`journal.md` becomes the reading copy.** It carries:\n\n1. **What this cost us to learn** — ten bullets at the top, one per finding that changed how the pipeline works, each naming the failure that paid for it. This is the part meant to be read.\n2. **Eleven phase sections** replacing the sixty-nine entries, each keeping its dates and, where they existed, its commit hashes.\n3. The convention for adding to it: append to the newest phase, or open a new one when the work changes character.\n\n**`journal_v1.md` holds the original, word for word.** Not a summary of the original — the original, every entry, unedited. Its header names `journal.md` as the reading copy and itself as the authority: **when the two disagree about what happened, `journal_v1.md` is right and the compaction lost something.**\n\nThis is the convention [`operations_v1.md`](../archive/operations_v1.html) already established when the operations document was restated over a new schema, so the repository has one way of superseding a process document rather than two.\n\n## Alternatives rejected\n\n**Compress each entry in place, keeping all sixty-nine headings.** Roughly halves the file and loses no entry. Rejected because it does not fix the actual defect: the lessons stay distributed, and sixty-nine two-sentence entries are no more navigable than sixty-nine five-sentence ones. It also destroys the original without preserving it, which is strictly worse than what was done.\n\n**Prepend the lessons and leave everything else.** Honours append-only exactly, and was genuinely tempting. Rejected because the file stays 1,755 lines, so the bullets sit at the top of something nobody scrolls, and the next compaction question arrives at 2,500 lines with the same answer.\n\n**Delete the old entries outright.** Rejected without much thought. The wrong turns are the parts with information in them, and a record that can be tidied is a record that will be tidied.\n\n## Consequences\n\n**The append-only rule now has a stated exception, and its scope is exactly one file.** The reason it is safe here and nowhere else: a journal entry is a *narration* of work, whereas a critique, an `updates/u<n>.md` and a node history entry are *evidence* — the confidence derivation literally counts the flaws in a critique, and the test suite walks the histories. Rewriting evidence changes what the repository claims to know. Rewriting narration does not, provided the narration is preserved, which is why the preservation clause is not optional.\n\n**Compaction is a `/update` §7 action, not a scheduled one.** It happens when the file has stopped being useful, the way this one did, and it produces a new `journal_v<k>.md` each time rather than overwriting `journal_v1.md`.\n\n**Links into the journal survive.** Nothing in the repository linked to a specific journal entry by anchor — checked before the rewrite — so no link broke. Any future link should point at `journal_v1.md` if it means a specific historical entry.\n\nThe cost, stated plainly: a reader who wants the day-by-day texture now opens a second file, and the phase summaries are one operator's reading of what mattered. That reading is checkable against the preserved original, which is the only reason it is acceptable.\n\n**Amendment, 2026-08-05.** The preserved original moved to [`../archive/journal_v1.md`](../archive/journal_v1.html), so that `process/` lists what is current and superseded versions sit together in one place. Every path above should be read with `archive/` in front of it, and the next compaction writes `archive/journal_v2.md`. The entries themselves are untouched; the file's own relative links were rebased one directory up, which is the only edit it has ever had.\n";</script>
