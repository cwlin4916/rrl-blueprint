<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0089-the-argument-is-drawn-in-circles</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0089 — The argument is drawn in circles, about the thing it is about</h1><p class="lead">Generated from <code>process/decisions/0089-the-argument-is-drawn-in-circles.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Status.** Accepted, 2026-08-09.\n**Amends** [0039](0039-one-graph-for-every-question.html), [0058](0058-importance-is-derived-and-sizes-the-card.html), [0061](0061-the-z-axis-is-abstraction-level.html) and [0082](0082-the-root-graph-draws-questions-alone.html).\n**Related** [0016](0016-the-site-mirrors-the-source-tree.html), [0026](0026-sub-lemma-families-fold-into-their-parent.html), [0051](0051-a-decomposition-folds-whatever-its-members-are-rolled.html).\n\n## Decision\n\nEvery DAG page lays its cards on **concentric circles about the thing the page is about**, and draws the circles.\n\nThe root page puts the **goal question at the centre** and every other question on the circle its **Feeds depth** gives it. A question page and a node page put that question's **scope card at the centre** and every lemma on the circle its **dependency depth** gives it. Angle carries the containment tree: a decomposition takes one wedge and its members stay adjacent.\n\nDistance from the centre is therefore one thing and one thing only — **how far from the question you are** — and it is the same thing on every page.\n\n## Why\n\nThe tiling it replaces was a layout that a reader took for a claim.\n\n[ADR 0039](0039-one-graph-for-every-question.html) drew each question as a block and tiled the blocks left to right; [ADR 0082](0082-the-root-graph-draws-questions-alone.html) reduced the root page to the question cards alone but kept them in columns. Four cards in a row says *four peers*, and they are not peers: Q1 is the goal question and carries the bench, and the other three exist because Q1 needed them. Nothing on the page said so.\n\nThe layered form had the same defect one level down. A question's lemmas were rows under its card, so the card was a header and the argument a list, and depth read as *down the page* — a direction that also means \"later\", \"smaller\" and \"less important\" to every reader who has met a page before.\n\n## What is new here, and what is not\n\n**Nothing about what the picture asserts is new.** Both radii are numbers the site already derived and already drew:\n\n```\nroot page       Feeds depth        was the column index in overview_layout()   ✅ unchanged\nquestion page   dependency depth   was the row index y = r * 252 in layout()   ✅ unchanged\nangle           the containment tree, which the row order already sorted by    ✅ unchanged\n```\n\nThat is the whole reason this was drawable now and not in the morning. [`2026-08-09_03`](../../../process/journal/2026-08-09_03_what-hierarchy-do-the-four-questions-stand-in.md) declined to draw rings and sent out a survey instead, on the ground that *drawing rings around a hierarchy nobody has argued for would put a claim in the most visible place on the site and leave it in the one place the repository does not check*. That ground still holds, and it is met rather than waived: the ring index is a re-projection of a derivation that was already on the page. When the survey comes back with a hierarchy that is **not** Feeds depth, adopting it is a change to `overview_layout`'s one line and an argument in a new record — not a redraw.\n\nTwo things the radius is deliberately **not**:\n\n- It is **not importance.** Importance sizes the card ([ADR 0058](0058-importance-is-derived-and-sizes-the-card.html)) and keeps that channel. The sibling blueprint in `interpolation` puts importance on the radius, which is a coherent choice there and would double-encode here.\n- It is **not confidence.** Confidence fills the card. A large red card far out is a peripheral claim believed wrong; a large red card at the centre is the project in trouble. The two read differently only because the channels stayed separate.\n\n## Consequences\n\n**The circles are drawn.** A scale nobody can see is not a scale; without the rings a reader sees scattered cards. They are dashed, faint, labelled at the bottom of each circle, and sit behind everything, outside the tilt — a ring is the plane the argument lies in and must not lean with it.\n\n**Spacing is even within a circle, and the wedge only orders it.** Handing each subtree an angular wedge in proportion to its leaves and leaving the cards where the wedge put them sized the innermost circle at 1172px on `Q1-L5-L3` — a canvas six thousand across holding twenty cards — because two thin wedges side by side are a few degrees apart and the chord that separates them sets the floor for every circle. Each circle now hands its own members equal shares of 360°, rotated to sit where the wedge wanted them, so the cyclic order the tree produced survives and the crowding does not.\n\n**Each circle states its own floor.** The innermost radius is the largest of `need(v) − v · RINGSTEP` over the circles in use, not the largest `need(v)`: an outer circle has an outer circumference to spread over and must not push the whole picture out for a crowd it can already hold.\n\n**Opening a chip moves nothing.** A branch — an example, an analogy, a consequence — hangs outward along its host's spoke, fanned to one side of it, in the gap between two circles, and it is placed whether or not the chip is open. The engine's column-shift is gone: it slid every card past an opened branch aside by 400px, which was right when the spine was a grid and is meaningless when every card has its own x. A layout that moves when a reader looks at something is a layout the reader has to re-read.\n\n**Placement is checked, not computed.** Half a `RINGSTEP` of radial clearance is 134px, which is plenty when the spoke is vertical and not nearly enough when it is horizontal, where two cards need 227px of x between them. Branches are therefore placed greedily against everything already down, walking out along the fan and then to the next band. The build now leaves **zero overlapping pairs** across all 124 graph pages, spine and branch alike, where the first horizontal-offset attempt left 243.\n\n## The alternative that was rejected\n\nKeeping the tiling and adding a ring only to the root page. It would have made the root page honest and left every question page saying, in the most legible channel a diagram has, that an argument is a list. The two pages are read one after the other; a scale that means one thing on one and nothing on the next is worse than no scale.\n";</script>
