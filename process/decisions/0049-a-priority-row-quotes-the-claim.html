<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0049-a-priority-row-quotes-the-claim</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0049 — A priority row is one sentence, and the panel quotes the claim</h1><p class="lead">Generated from <code>process/decisions/0049-a-priority-row-quotes-the-claim.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0020](0020-the-priority-panel.html) (the panel, its stored and derived halves),\n[0037](0037-the-node-panel-carries-the-statement.html) (a readout shows the statement)\n\n## Context\n\nThe panel was unreadable, and for three separate reasons at once.\n\n**It rendered nothing.** Every other surface on the site is markdown handed to the one\nclient-side renderer; the panel is assembled in Python and inserted as HTML, and it\nescaped each row instead of rendering it. A reader got `[Q1-L4](nodes/Q1-L4/Q1-L4_node.md)`\nas literal brackets and a file path, `` `proved` `` with its backticks, and `$\\Lambda_X^+$`\nas raw TeX — in the one place on the site whose job is to say what to do next.\n\n**A row named its target and never said what it claimed.** `Q2-L6` is a code citation:\nthe id is the address of a statement, not the statement, so triage meant opening files.\n[ADR 0037](0037-the-node-panel-carries-the-statement.html) had already settled the same\nquestion for the node panel — a readout shows the statement — and the priority panel was\nthe surface it had not reached.\n\n**A row was a paragraph.** The longest ran 135 words inside a 340px column, and a row\nnobody finishes reading ranks nothing.\n\n## Decision\n\n**A row is one sentence. The claim is quoted, not written.**\n\n- **The row says what is wrong or what to do, in one sentence and at most 50 words**\n  (`PRIO_WORDS`). It never restates what the target claims.\n- **The panel quotes the claim from the target itself**, at build time, storing it\n  nowhere: a node's title is already `# <id> — <claim>`, an appendix entry's is its\n  heading. Each row renders as target, claim, judgement, signature. This is I5 — derive,\n  don't store — and it is why a quoted claim can never drift from the statement it ranks.\n- **Both halves go through a renderer.** `inline_md` renders one line of markdown as\n  HTML — math as the same `.math` span `BP.hydrate` fills everywhere else, plus links,\n  code and emphasis — so the panel needs no second renderer and no page needs new script.\n- **The gate binds**: `build_dag_site.py --check` fails a row over the word budget or\n  with an unbalanced `$`.\n\n## Justification\n\n**Quoting beats restating, for the same reason the confidence number is derived.** A row\nthat retyped its target's claim would store the statement twice, and the copy in the\npanel would be the one nobody re-reads when the statement is corrected. Quoting the\ntitle makes the panel a readout of the record rather than a second record.\n\n**The word budget is what makes the quote affordable.** Rows grew long precisely because\neach one was carrying the context its bare id withheld. Once the claim arrives for free,\nthe sentence has only the judgement left to make, and 50 words is generous for that.\n\n## Consequences\n\n- `blueprint/priorities.md` gains a paragraph stating the rule, and all 31 rows were\n  rewritten to it — the longest now runs 43 words. No judgement was dropped or re-ranked\n  on content: the rewrite is compression plus the ordering already implied by severity.\n- `/update` §8 carries the rule, so the next run writes rows that pass the gate.\n- Two rows target `refs.bib`, which has no title line to quote; they carry no claim and\n  their sentences stand alone. A non-markdown target simply contributes nothing.\n- The claim's own links are rebased from its source file to `blueprint/` before the row\n  is relinked for the page carrying it (`claim_md`), so a title that links its question\n  still resolves from the hub, the graph's side panel and `priorities.html` alike.\n\n## Alternatives considered\n\n**Store the claim in the row.** Rejected as a second copy of a statement (I5): it drifts\non the first correction, and the drift is invisible because nothing compares the two.\n\n**Render the panel client-side by handing the row markdown to `BP.mount`.** Rejected for\nreach: the three surfaces that carry the panel hydrate differently, and `listing` only\nfills `.math` spans. Server-side `inline_md` emits exactly those spans and works on all\nthree unchanged.\n\n**Drop the panel's prose and show ids with severity chips alone.** Rejected: severity\nsays how bad, never what — and \"what\" is the whole of triage.\n";</script>
