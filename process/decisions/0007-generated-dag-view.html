<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0007-generated-dag-view</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>ADR 0007 — The DAG view is generated, self-contained, and read-only</h1><p class="lead">Generated from <code>process/decisions/0007-generated-dag-view.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [journal](../journal.html) · [design](../pipeline.html)\n\n- **date:** 2026-08-03\n- **status:** accepted\n- **kind:** repository structure\n\n## Context\n\n`blueprint/main_dag.md` lists nodes in DAG order with a `depends on` field, which is enough to *store* the graph and useless for *seeing* it. The questions a researcher actually asks are structural: what does this node rest on, what falls if it is wrong, where is the critical path, which ready node unblocks the most work. Answering any of them from the index means reading seven bullets and holding the edges in your head.\n\n## Decision\n\n`python3 tools/build_dag_site.py` reads `blueprint/main_dag.md` and every `node.md` and writes `docs/dag.html`: a layered graph, colour-coded by computed status, click for the full statement and every link the node carries, hover to highlight ancestors and descendants. `/prove` and `/check` regenerate it. It is never edited by hand.\n\nThree constraints:\n\n- **One self-contained file, no external requests.** It opens from `file://`, works offline, and cannot break when a CDN changes. Vendoring KaTeX into `docs/vendor/` is optional; without it the page shows LaTeX source.\n- **Generated, never authored.** A discrepancy with the blueprint is a bug in the generator, not a stale hand-edit to reconcile.\n- **Read-only.** Nothing in the pipeline reads it back (invariant I8).\n\n## Justification\n\n[ADR 0002](0002-one-file-per-node.html) rejected storing the DAG as structured data and rendering markdown from it. This is the opposite direction and the reason it is safe: markdown stays the authored source, and the graph is a projection of it. The two arrangements have different failure modes. Generating the *source* means the thing a human reads and a prover is handed is a build artefact, and there are two representations to keep honest. Generating a *view* means the worst case is that the view is stale — visibly so, and fixed by one command.\n\n## Consequences\n\n- Another artefact to regenerate. Wired into `/prove` and `/check` so it does not depend on anyone remembering.\n- Math renders as LaTeX source unless KaTeX is vendored. Accepted: a network dependency in a research repo is a page that stops working at the worst moment, and node statements are short enough to read as source.\n- The generator parses markdown with regular expressions, so it is coupled to the node-file schema. That schema is written at the top of `blueprint/main_dag.md` and enforced by the lead-researcher; if it drifts, the generator prints nodes with missing fields rather than failing loudly. A field that silently reads as empty is the likely first bug.\n\n## Alternatives considered\n\n**A `leanblueprint`-style toolchain (graphviz plus d3).** This is the closest prior art, and what Tao-style proof graphs are built with. Rejected for a seven-node graph: it adds a build dependency, a CDN, and a layout engine to produce something a 60-line layering pass produces offline. Worth revisiting at 50 nodes.\n\n**Adopting Tao's `paper-diagram` JSON format.** Reviewed after the first version shipped. Its conventions were worth taking and were adopted: arrows point prerequisite → result, results sit at the top and prerequisites sink to the bottom, node positions are derived rather than stored, and hiding a category of node re-links the graph transitively instead of disconnecting it. The *format* was not adopted, because it would mean maintaining a JSON file beside the node files — a second source of truth for the same edges, and I1 exists to stop exactly that. The node files already carry `depends-on` and `required-by`; the generator reads them. If this DAG ever needs to be published as a Tao-style diagram, the right move is a converter, the same way `leanblueprint` graphs are converted into that format, not a second copy of the graph.\n\n**A mermaid diagram in `main_dag.md`.** Cheapest option, renders on GitHub. Rejected: no click-through to statements, no status colour, no ancestor highlighting — it shows the edges and nothing else, and the edges are already in the bullets.\n\n**Publish it as a hosted page.** Rejected for now: the DAG changes on every `/prove`, and a hosted copy is stale the moment it is published. The file in the repo is always current with the commit you are reading.\n";</script>
