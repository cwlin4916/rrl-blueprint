<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0069-the-gates-are-scoped-and-the-batch-closes-once</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0069 — The gates are scoped, the batch closes once, and no operator commits</h1><p class="lead">Generated from <code>process/decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Amends:** every operator's closing step — [`/prove`](../../skills/prove.html), [`/decompose`](../../skills/decompose.html), [`/examples`](../../skills/examples.html), [`/check-goal`](../../skills/check-goal.html), [`/update`](../../skills/update.html), [`/research-status`](../../skills/research-status.html)\n**Follows:** [0031](0031-presentation-is-a-stage-not-a-command.html) — a stage every command ends with, defined once\n\n## Context\n\nThe user asked why two `/prove` runs cannot proceed at once. The mathematics of two independent nodes is independent; the bookkeeping was a global mutex.\n\n```\n/prove <id>                                  scope of the write\n├── 1 node gate ......... read <id>_node.md   node-local   ✅ parallel\n├── 2 prover ............ write proof.md      node-local   ✅ parallel\n├── 3 render gate ....... check_render.py     WHOLE REPO   ⛔ 78 s, no incremental mode\n├── 4 critic ............ write critiques/    node-local   ✅ parallel\n├── 5 write-back ........ status: in node.md  node-local   ✅ parallel\n├── 6 regenerate ........ build_dag_site.py   WHOLE REPO   ⛔ 24 s, 784 pages, 112 prompts\n├── 7 presentation ...... checker subagents   node-local   ✅ parallel\n└── 8 commit ............ git add blueprint/  WHOLE REPO   ⛔ stages the other run's work\n```\n\nFive of eight stages were already parallel. Three were not, and each failed differently.\n\n**Step 3 read everything to check one file.** The render gate has ten sections; eight of them read one file at a time — math fragments, house macros, fence balance, link resolution, the write-up budget, ambient subscripts, statement shape, question framing. Only the DAG-page and site checks need the whole repository, and those are about the *generated artifact*, not the file the prover just wrote.\n\n**Step 6 wrote everything, and did not converge.** The builder writes a generated flaw block *into* each canonical node file ([ADR 0062](0062-a-node-states-its-own-flaw.html)), and each node's page is rendered from that same file read off disk. It rendered before it wrote, so a build that changed a flaw block shipped the previous run's copy and then reported itself stale — every status change paid for the slowest step twice.\n\n**Step 8 stole from its neighbours.** `git add blueprint/` stages a tree, not a run. A concurrent session's half-written files went into this run's commit, which is the named mechanism behind the hazard the journal already records as *concurrency in a shared working tree*.\n\n## Decision\n\n**Three changes, one per stage.**\n\n`tools/check_render.py --only <path> …` restricts every per-file check to those paths and skips the two whole-repo checks, printing `(scoped)` on its verdict line so a scoped pass can never be reported as a repository pass. One node: 78 s → 0.6 s.\n\n`tools/build_dag_site.py --canonical | --pages` splits the builder. The canonical half writes the node prompts, the flaw blocks and `main_dag.md`'s index; the pages half writes `blueprint_site/`. With no flag it runs both — **canonical first**, then re-reads the node files it just wrote before rendering, which is what makes a single run converge.\n\n`tools/batch.py` is the join: `claim` / `release` for an advisory node lock between concurrent sessions, and `close` for the one canonical build, one page build and one full gate that a batch of runs shares.\n\n**And no operator commits.** The commit stage is deleted from all six, and nothing replaces it.\n\n## Consequences\n\n`N` proofs now cost `N` prover–critic pairs plus one close, instead of `N` full builds serialised behind each other. The per-run bookkeeping falls from about 102 s to under 10 s, and the part that is left is node-local.\n\nRemoving the commit is the change with the most in it, so it is worth being explicit about what is traded.\n\n**What is lost.** `git log` stops being a per-operation record. A run that used to leave a `prove(Q1-L4-L2): proved after 1 round` commit now leaves the same information in the report and, when it taught something, in a journal entry.\n\n**Why that is affordable.** Every fact the commit subject carried is already stored where it belongs: the status in `<id>_node.md`, the verdict in `critiques/r<n>.md`, the statement revision in `updates/u<n>.md` and the node's `<id>_history.md`. The commit was a fourth copy — the one that could not be checked against the other three, and the one whose staging rule could not tell this run's work from another's.\n\n**What replaces it.** The user commits, on a working tree they can see, at whatever granularity they want. That is also the answer to the question that prompted this: an operator that does not write to history has nothing to collide over, so two runs on two nodes now interfere in exactly one place, which is the closing build they are meant to share.\n\nOne caveat stands and is not fixed here. `/update`'s statement revisions used to be disclosed in a commit body, and a test walks the history for that disclosure. The disclosure now lives in `updates/u<n>.md` and the node history, which is where the L1 test should read it; until that test is repointed it will pass vacuously rather than fail, because a run that writes no commit writes no undisclosed one either.\n";</script>
