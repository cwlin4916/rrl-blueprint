<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0076-a-gap-is-a-prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0076 — A gap is a prompt, and a gapped node is not failing</h1><p class="lead">Generated from <code>process/decisions/0076-a-gap-is-a-prompt.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Divides with:** [0075](0075-a-negative-node-says-what-would-clear-it.html) (a negative node says what would clear it) — see *Division with 0075* below\n**Extends:** [0071](0071-the-closed-world-is-the-appendix.html) (the closed world is the appendix, and a `GAP` is the only way it grows), [0014](0014-confidence-is-three-signed-channels.html) (the mathematical channel), [0068](0068-the-weakest-link-is-a-ceiling.html) (the weakest link is a ceiling), [0030](0030-the-prove-budget-cap.html) (two rounds per invocation)\n\n## Context\n\nADR 0071 settled what a proof may cite: the appendix, the node's own `depends-on` statements, and standard mathematics needing no citation. A step wanting a fact **no appendix entry supplies** is a `GAP`; the prover writes it out and stops; the closed world grows by someone writing the entry.\n\nThat rule is right and this ADR does not touch it. What is wrong is everything that happens *after* the prover writes `GAP:`.\n\n**The status is a lie.** An honest `GAP:` is automatically `FAIL` at MAJOR, and `/prove` then sets `status: failing`. `support()` scores `failing` at $-1.0$, and under 0068 that value becomes a floor on every ancestor. So a node whose statement is fine, whose argument is fine, and whose only defect is that nobody has yet transcribed a standard theorem, is scored as though a referee had found it *wrong* — and it drags a whole subtree down with it.\n\n[Q1-L5](../../nodes/Q1/Q1-L5/index.html) is the case that surfaced it. Its own statement has never been disputed and it has never been attempted, yet it reads **−37.5%**, floored two levels down by `Q1-L5-L3-L4`, which is `failing` for exactly one reason: the appendix defines coherence only for smooth targets, and that node's closed immersion has a singular source. Nobody thinks the statement is false. The prover said so in its own caveats — \"I have no counterexample and expect the Lemma true as stated\". The number says refuted.\n\n**The record is unusable.** The prover writes the gap as a paragraph of prose inside `proof.md`. Being prose, it is scoped by whatever the prover happened to see from the step it stalled on — and the referee caught that this is not enough. On `Q1-L5-L3-L4` the prover named two missing facts; the critic checked, found that **granting both, the proof still cannot finish**, named two more, and observed that one of the four is not a new entry at all but a change to a *ratified reading* binding every node in the repository that mentions $\\mathcal{D}_c$. A commission built from the prover's sentence would have written the wrong thing, landed it, and failed `r2` on the same step.\n\n**The discovery is late and unreusable.** Of the 42 flaws carrying a kind letter, `G` — *a step has no reason available* — is the largest class at 14, and 3 of the 8 blocking flaws. A one-round `/prove` costs ~270k subagent tokens. So the pipeline's dominant stall is discovered at the most expensive moment available, and its output is a paragraph nobody can act on without re-deriving it.\n\n## Decision\n\n**Three changes, and the third is the one that pays.**\n\n### 1. `gapped` is a status, and it is silent\n\n`STORED_STATUS` gains `gapped`. It means: *the statement stands, the argument stands, and the closed world is missing a fact the proof needs.*\n\n```\nstatus      means                            maths channel\n──────────────────────────────────────────────────────────\nopen        nobody has tried                 silent\ngapped      the appendix lacks a fact        silent      ← new\ndrafted     written, unread                  +0.25\nproved      a referee passed it              +ratio\nfailing     a referee found a real defect    −1.0\n```\n\n`support()` returns `SILENT` for `gapped`, exactly as for `open`. A silent channel costs nothing (ADR 0014), so a gapped node stops flooring its ancestors and the red moves onto the appendix queue, which is where the work is.\n\nThis is not leniency. `failing` still means what it meant — a referee found a defect in the argument or the statement — and a node with *both* a standing MAJOR and a gap is `failing`, because the argument is defective independently of the gap. `gapped` is available only when every standing FATAL/MAJOR flaw of the last round is kind `G` and the critic did not dispute the statement.\n\n### 2. A gap is a numbered, append-only record — `gaps/g<n>.md`\n\nLike `critiques/`, in the node's own directory, numbered from 1, never rewritten, never restarted. A node's gaps are part of its life the way its referee rounds are, and for the same reason: a gap that was serviced and then reopened should show that it was.\n\n`--check` fails a `gapped` node with no `gaps/`, and fails a `gaps/` file missing its required sections.\n\n### 3. A gap file **is a prompt**\n\nThis is the change the other two exist to support. `gaps/g<n>.md` is not a note about a gap. It is a **self-contained prompt**, written to be pasted into a model that has never seen this repository, that returns appendix entries ready to land.\n\nThat means it carries, in the file itself and never by reference:\n\n- the node's `## Statement`, in full;\n- where the argument stalls, and why the closed world cannot reach it;\n- **what to deliver**, one numbered item per missing fact, each marked `new entry` or `amends <anchor>` — because those are different acts with different blast radii, and conflating them is how a commission silently rewrites what a dozen proved nodes claim;\n- what the appendix *already has* that is nearly right, and why it does not reach;\n- the house format for an entry — anchor, statement in full, `role:`, `hypotheses:`, `used by:`, and the dictionary note reconciling the source's conventions with this repository's;\n- the standing rules: local-first reading, `refs.bib` keys only, and the instruction to **stop and say so** if a wanted fact turns out to be false or to need a hypothesis the node lacks.\n\nIt is written by the **prover**, which is the actor that discovered the gap, and **rescoped by the critic**, which is the actor empirically better at seeing what else the step needs. A round that raises a `G` flaw against an under-scoped gap file is the critic doing its job, and the rescoping lands in the file before the commission goes out.\n\nLike `<id>_prompt.md`, a gap prompt is a **readout and not a source**: nothing cites it, no proof may lean on it, and it admits nothing to the closed world. Unlike `<id>_prompt.md`, it is canonical rather than generated — a person or a referee may improve it, and it is append-only.\n\n### 4. `/prove` scouts before it spends\n\nA new §0. Before the prover runs, the appendix index and the node statement are read together to answer: *which steps will want a cited fact, and is it there?* A few thousand tokens against a 270k-token run. A gap found here is written as `gaps/g<n>.md` and the node is `gapped` without a prover run at all.\n\n## Division with 0075\n\nADR 0075 landed in a concurrent session on the same day and answers a neighbouring question, so the boundary is worth stating rather than discovering later.\n\n`<id>_positive.md` is **per node**: one authored file on a node that is negative *on its own record*, saying what would clear it whatever the cause — a missing fact, an uncomputed case, a hypothesis stated over the wrong field — plus the arithmetic of what a `PASS` on that node alone would buy. It is carried into `<id>_prompt.md` so the packet leaving the repository ends its own ignorance.\n\n`gaps/g<n>.md` is **per missing appendix entry**: append-only, numbered, and shaped as a commission that can be pasted somewhere and acted on. A node can accumulate several over its life and each stays on the record.\n\nThey compose rather than compete, and the rule that keeps them from duplicating is: **when the missing thing is an appendix entry, `<id>_positive.md` links the gap file rather than restating it.** The gap file is the paste-able form; `_positive.md` is the summary and the arithmetic. Neither is in the closed world.\n\nThe status is this ADR's alone. `<id>_positive.md` changes what a reader is told; `gapped` changes what the number *means*, and only one of the two moved Q1-L5.\n\n## Consequences\n\n**Measured, under ADR 0068's ceiling semantics.** Q1-L5 reads −50.0%: its own raw score is −12.5% (a stale literature verdict, a separate defect) and the dependency ceiling drags it the rest of the way. Marking the two nodes beneath it `gapped` takes it to **−12.5%** with no new mathematics, because the ceiling beneath it was never a refutation. Proving the whole subtree outright reaches +30.4%, so roughly three-quarters of the distance from where it sits to where a full proof puts it is being paid for a status that means the wrong thing.\n\n**And neither node qualifies today** — which is worth recording, because it is the rule doing its job rather than a disappointment. `Q1-L5-L3` does qualify: both its standing MAJORs are about the missing fact. `Q1-L5-L3-L4` does **not**: of its five standing MAJORs, three are ordinary argument defects — a cited black box applied to an object that does not satisfy its hypotheses, a totalization asserted rather than derived, and a scope mismatch between the node's own closing sentence and the hypothesis it claims to discharge. The gap is real and its commission is written, but the node is `failing` on its own merits and stays so.\n\nBecause `Q1-L5-L3` sits above `Q1-L5-L3-L4`, marking it `gapped` alone changes nothing: the ceiling below is unmoved. So the ordering the rule forces is the correct one — clear the three argument defects in `Q1-L5-L3-L4` first, which leaves its gap as the sole standing MAJOR and makes it `gapped`; only then does the appendix commission become the one thing between the subtree and a number that means something.\n\n**A node may carry gaps and still be `failing`.** The record and the status are independent: `gaps/` says what the closed world is missing, `status:` says whether that is the only thing wrong. `Q1-L5-L3-L4` carries `gaps/g1.md` today and is `failing` today, and both are correct.\n\nThe appendix queue becomes visible and batchable. `blueprint_site/gaps/index.html` lists every outstanding gap across the repository, so the singular-scheme story wanted by `Q1-L5-L3-L4` can be seen to be the same one `Q1-L5-L3` wants, and one deliberate pass over §5 clears both.\n\nThe cost is a status more to reason about and a file more per stalled node. Against that: the pipeline's dominant failure mode stops being a dead end and becomes a work item with a prompt attached.\n\n**What this does not do.** It does not make a gap cheap. An unserviced gap still blocks the node, still shows on the card, and still stops `/prove`. It changes what the gap *is* — a commission with everything needed to fill it — not whether it must be filled.\n";</script>
