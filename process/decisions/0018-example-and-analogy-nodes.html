<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0018-example-and-analogy-nodes</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0018 — Example and analogy nodes: `Q&lt;n&gt;-e&lt;k&gt;` and `Q&lt;n&gt;-a&lt;k&gt;`</h1><p class="lead">Generated from <code>process/decisions/0018-example-and-analogy-nodes.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Extends:** [0015](0015-every-node-declares-its-role.html) (the `role:` field and its\nrules), [0006](0006-examples-from-the-literature.html) (examples come from the literature),\n[I10](../pipeline.html#4-invariants) (examples illustrate, never justify)\n\n## Context\n\nADR 0015 created the roles `example` and `evidence` but no way to *address* such a node:\nevery id was `Q<n>-L<m>(-L<j>)*`, a position in a proof chain, so a worked instance or a\nclassical analogue promoted to a node of its own had to squat on a lemma id and read as a\nstep of the argument. The user asked for the distinction to be visible in the label\nitself: instances of the theory are one kind of thing, statements *analogous* to a node\nin another setting — the function-theoretic shadow of a categorical claim — are another,\nand neither is a lemma. The immediate driver is Q1: the literature holds both known cases\nof the main equivalence (group case, Whittaker) and function-theoretic analogues of the\nSatake-subcategory question (basic functions, unramified Hecke modules à la\nSakellaridis–Venkatesh), and the tree had nowhere to put either.\n\n## Decision\n\n**Two new id suffixes, attached at question level.**\n\n- `Q<n>-e<k>` — an **example of the theory**: a specific choice (here, of spherical\n  variety $X$) for which the statement under study, or the equivalence it is part of, is\n  established or refuted in print. `role: example`.\n- `Q<n>-a<k>` — an **analogy of the statement**: a precise claim in a *different setting*\n  (function-theoretic, classical, mod-$p$, …) whose shape matches a node of this\n  question, so that its status in the literature bears on how much to expect here.\n  `role: analogy` — a fifth value of the `role:` field.\n\nFive rules give the classes their meaning:\n\n1. **They live at question level.** `Q1-e1` sits at `blueprint/nodes/Q1-e1/`: the id has\n   no `-L` segment, so the id-is-path rule ([I12](../pipeline.html#4-invariants)) already\n   places it top-level, and `parent_of` is unchanged. Nesting an example inside a lemma\n   (`Q1-L5-e1`) is *not* introduced now; when a node needs a private instance it gets a\n   line in its `examples.md`, exactly as before.\n2. **A proof node may never depend on them** — 0015's rule 1, with `analogy` added to\n   the non-proof roles. `--check` enforces it. An e/a node may depend on nothing or on\n   proof nodes (an instance may of course use the theory).\n3. **Which node they speak to is prose, not an edge.** The statement of an e/a node\n   links the node(s) it illustrates; there is no new field and no new relation. The\n   dependency graph stays the graph of the argument.\n4. **They carry the full node contract.** `node.md` with statement, `created:`, status,\n   `human:`; `/prove` accepts them at the same bar (an example node is `proved` when its\n   instance is verified against the closed world, which usually means the lead-researcher\n   first black-boxes the citing theorem in the appendix); `/examples` runs on them like\n   any node, and their own `examples.md` `EVIDENCE:` line is where a literature verdict\n   lives. Tallies count them apart (`· example 1/3 · analogy 0/2`), and question\n   confidence still aggregates over the proof chain alone (0015 rule 2).\n5. **Only the lead-researcher creates them** — write discipline unchanged. `/examples`\n   remains the operator that *finds* the material; when an instance deserves a directory\n   rather than a line, the orchestrator hands the found statements to the lead-researcher\n   to materialize as e/a nodes.\n\n## Justification\n\n**A label class, not just a role field, because the reader meets the id first.** The\nindex, the graph and every `depends-on` list show ids; `role:` is one line inside the\nfile. `Q1-e2` says what it is from across the room, and no lemma numbering is consumed\nor renumbered — ids are append-only in each class.\n\n**Analogy is not evidence and not example.** 0015's `evidence` is a provable claim *of\nthis setting* (Q1-L7, the group case as corroboration); an `example` instantiates the\ntheory; an *analogy* is a claim of a different theory whose truth is discovered, not\nproved here — its weight enters through the literature channel, never the referee\nchannel. Folding it into `evidence` would let a function-theoretic theorem read as a\nstep-adjacent corroboration of a categorical claim it cannot touch.\n\n## Consequences\n\n- `tools/build_dag_site.py`: the id grammar accepts `-e<k>`/`-a<k>` as terminal\n  segments, `ROLES` gains `analogy`, ordering puts a question's e/a nodes after its\n  lemmas. `--check` rejects an e/a id whose role disagrees with its suffix.\n- The index and site surfaces show the role exactly as 0015 already prescribes for\n  non-proof roles; nothing new to display.\n- `_template.md`, the schema comment of `main_dag.md`, `CLAUDE.md` and\n  `.claude/skills/examples/SKILL.md` record the convention.\n- The first inhabitants are Q1's: analogies `Q1-a*` (function-theoretic shadow of the\n  Satake-generation question) and examples `Q1-e*` (spherical varieties with the\n  equivalence known), from the `/examples` run on [Q1-L1](../../nodes/Q1/Q1-L1/index.html)\n  recorded in the journal.\n\n## Alternatives considered\n\n**Keep everything in `examples.md`.** Rejected by the driver: an instance that carries\nits own hypotheses, its own literature trail and its own open questions is a node-shaped\nobject, and a line in a flat file cannot be `/prove`d, `/examples`d, or pointed at.\n\n**A nested form `Q1-L5-e1` now.** Rejected for scope: it needs the path rule extended in\ntwo tools and the tests' copy of `parent_of`, for no present inhabitant. The suffix\ngrammar admits the extension later without renaming anything.\n\n**A separate tree `blueprint/examples/`.** Rejected: one tree per kind was decided the\nother way ([0009](0009-one-tree-per-kind.html)) — these are nodes, with node discipline;\nsplitting the carrier would fork every rule that quantifies over `nodes/`.\n";</script>
