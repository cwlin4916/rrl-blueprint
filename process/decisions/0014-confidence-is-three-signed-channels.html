<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0014-confidence-is-three-signed-channels</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0014 — Confidence is three signed channels, and absence is not doubt</h1><p class="lead">Generated from <code>process/decisions/0014-confidence-is-three-signed-channels.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Supersedes:** [0013](0013-confidence-is-derived-baconian-and-weakest-link.html) (Baconian\nsupport, weakest-link propagation, six ordinal bands)\n**Extends:** [0009](0009-one-tree-per-kind.html) (every fact stored once)\n\n## Context\n\n[0013](0013-confidence-is-derived-baconian-and-weakest-link.html) built confidence out of one\ninput: the referee record. That was the only input the repository had, and it bought the\nright thing — a `proved` node resting on an `open` one lands at zero, which no status field\nsays out loud. Three defects showed up in use.\n\n**It cannot hear the author.** The person who knows most about whether Q1-L5 is right is\nthe person who wrote it, and 0013 has no channel for that judgement. It rejected a stored\nfield on [I5](../pipeline.html#4-invariants) — every fact stored once — but the argument\nproves too much: a human judgement is not a *second* copy of anything, because there is no\nfirst copy to derive it from. I5 forbids storing a fact twice, not storing a fact once.\n\n**It cannot go negative.** Every value in 0013 lies in $[0,1]$, so the worst thing that can\nhappen to a claim is that nothing supports it. But *nothing found yet* and *a counterexample\nin the literature* are not the same state, and a scheme that renders them identically is\nthrowing away the more valuable of the two signals. The pipeline's whole justification for\n`/examples` is that a falsity referral is the best outcome it has; that outcome had nowhere\nto go.\n\n**It cannot hear the literature.** Whether a statement, or one strictly stronger, is already\nin print is evidence about the statement. `/examples` was already the operation that would\nknow, and its finding died in a file nothing read.\n\n## Decision\n\n**Confidence is a weighted sum of three channels, each signed, capped by human approval.**\n\n$$\nC(v) \\;=\\; \\min\\Big(\\mathrm{cap}(v),\\ \\ \\tfrac14 H(v) \\;+\\; \\tfrac12 D(v) \\;+\\; \\tfrac14 L(v)\\Big),\n\\qquad C(v) \\in [-1, +1].\n$$\n\nEach channel takes a value in $[-1,+1]$ or is **silent**. A silent channel contributes $0$\nand its weight goes unclaimed — it is never renormalized away. So a node nobody has judged\nand nobody has refereed sits at $0$: empty, not doubted.\n\n**$H$ — human judgement, weight 25.** The one stored input, a `human:` field in `node.md`,\nwritten by the user and by nothing else. No agent may write it and no gate may read it.\n\n| `human:` | $H$ | reading |\n|---|---|---|\n| `approved` | $+1$ | formally signed off; the only value that lifts the cap |\n| `endorsed` | $+\\tfrac12$ | believed, not checked line by line |\n| `—` | silent | nobody has looked |\n| `doubted` | $-\\tfrac12$ | something is wrong with it |\n| `refuted` | $-1$ | known false as stated |\n\n**$D$ — the mathematical record, weight 50.** Derived exactly as in 0013, from the node's\nown referee record capped by the weakest thing it rests on, with two changes: the recursion\nnow takes the minimum over the dependencies' **full** confidence $C(u)$ rather than their\n$D$ alone, so a refuted or doubted sub-lemma propagates upward; and `failing` is negative\nrather than zero.\n\n$$\nD(v) = \\min\\Big(s(v),\\ \\min_{u\\in\\mathrm{deps}(v)} C(u)\\Big), \\qquad \\min\\emptyset = 1,\n$$\n\n$$\ns(v) = \\begin{cases}\n\\text{silent}, & \\texttt{open} \\\\\n-1, & \\texttt{failing} \\\\\n+\\tfrac14, & \\texttt{drafted} \\\\\n\\dfrac{e(v)+1}{e(v)+r(v)+2}, & \\texttt{proved,}\n\\end{cases}\n$$\n\nwith $e(v)=\\sum_{k<R} d_k$ the defeaters eliminated and $r(v)=d_R$ those still standing,\ncounted from the `**Flaw n**` headings of the node's critique rounds as in\n[0013](0013-confidence-is-derived-baconian-and-weakest-link.html). The smoothing is unchanged\nand so is its justification: a node that survived five rounds outscores one nobody probed.\n\n**$L$ — the literature channel, weight 25.** Derived, by parsing the single `EVIDENCE:` line\n`/examples` writes at the top of `examples.md`. Nothing else in that file is read.\n\n| `EVIDENCE:` | $L$ | reading |\n|---|---|---|\n| `precedent` | $+1$ | the statement, or one strictly stronger, is in print |\n| `instances` | $+\\tfrac12$ | instances found; the statement is about something |\n| `—` / no file | silent | not searched, or searched and inconclusive |\n| `gap` | $-\\tfrac12$ | the source that should have contained it does not |\n| `counterexample` | $-1$ | a published result contradicts it |\n\n**The cap is $0.80$ until a human signs off.**\n\n$$\n\\mathrm{cap}(v) = \\begin{cases} 1.00, & \\texttt{human: approved} \\\\ 0.80, & \\text{otherwise.}\\end{cases}\n$$\n\nThe three weights sum to $1$, so the machine channels alone reach $0.75$ and a machine-only\nnode with an `endorsed` from its author reaches $0.875$ before the cap — which the cap cuts\nto $0.80$. Nothing in this repository is fully believed because a language model refereed it.\n\n**It is displayed as a signed percentage on a red–empty–green scale.** $-100\\%$ to $+100\\%$,\nrounded to a whole percent. Negative fills the card red, positive fills it green, and a\ncard at $0$ carries no fill at all. The status hue survives as the card's border and status\ntag, because status and confidence are different questions and the reader wants both.\n\n## Justification\n\n**Absence and refutation must not render alike.** This is the change that matters and the\nrest follows from it. Under 0013 a node nobody has examined and a node with a published\ncounterexample both draw an empty card. Under this scheme the first is empty and the second\nis red, and the difference is visible from the DAG view without opening anything. The\nsigned range is what makes \"slowly going red\" a state the display can represent at all.\n\n**A stored human judgement does not violate I5.** 0013 rejected one on the grounds that it\n\"is a second place for the record to drift\" and \"goes stale the moment a new critique\nlands\". The first is false for $H$ specifically: there is no other record of what the author\nbelieves, so there is nothing for it to drift *from*. The second is true and is the point —\na `human:` value is dated evidence, exactly like `examples.md`, and a new critique should\nprompt a fresh look rather than silently overriding one. The guarantee 0013 was really\nprotecting is that **the aggregate is derived and nothing cites it**, and that is untouched:\nthere is still no `confidence:` field, $C$ is still recomputed on every build, and $C$ is\nstill outside the closed world.\n\n**Percentages, against 0013's bands.** 0013 argued for six ordinal bands because a Baconian\nratio is a ranking and a decimal claims precision the derivation has not got. That argument\nis still correct about $D$ and is now weaker about $C$, because two of the three channels\nare coarse by construction — $H$ and $L$ each take five values — so $C$ ranges over a set\nsmall enough that the percentage is not pretending. The warning survives as a display rule:\n$C$ is rounded to a whole percent, never carried further, and no gate reads it.\n\n**Why 25–50–25 and not something else.** The weights are the user's, and they encode a\ndefensible position: the mathematics is worth as much as the two judgements about it put\ntogether, and a human's opinion is worth as much as a language model's. They are not derived\nfrom anything and this ADR does not pretend they are.\n\n## Consequences\n\n- `node.md` gains one field, `human:`, defaulting to `—`. Every existing node gets it.\n  `tools/build_dag_site.py --check` rejects a value outside the five.\n- **Only the user writes `human:`.** It is added to the write-discipline list in `CLAUDE.md`\n  alongside the per-agent rules, and it is the first field in the repository that *no* agent\n  may write, including the `/prove` orchestrator that owns every other status-like field.\n- `/examples` gains a second purpose and an `EVIDENCE:` line, and the falsity referral that\n  0013 could not represent now moves the number. See the rewritten skill.\n- The propagation change makes `min` bite harder: a `refuted` leaf sends every ancestor to\n  $-1 \\cdot \\tfrac12 = -0.5$ at least. That is intended — a refuted lemma should visibly\n  poison what rests on it.\n- Confidence remains outside the closed world, on the same footing as `examples.md` under\n  [I10](../pipeline.html#4-invariants): no proof, node or appendix entry may cite it, and no\n  gate passes or fails on it. It is derived from the audit trail and can never be evidence\n  in it. `human:` is an input to the derivation, not a citation in a proof.\n\n## Alternatives considered\n\n**Renormalize over the speaking channels.** A node with only an `endorsed` and nothing else\nwould then read $+0.5$ rather than $+0.125$. Rejected: it makes a single opinion look like a\nverdict, and it destroys the property the user asked for first — that a node with no\nevidence stays empty.\n\n**Keep 0013's $[0,1]$ range and show negative evidence as a separate badge.** Rejected as\ntwo displays of one quantity: the reader then has to combine them by eye, which is the job\nthe number exists to do.\n\n**Let the critic write $H$.** Rejected. The channel is worth 25 points precisely because it\nis not a model's opinion; $L$ is already that. If an agent could write $H$, the cap at\n$0.80$ would be unenforceable in the only case it exists for.\n";</script>
