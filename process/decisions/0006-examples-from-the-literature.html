<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0006-examples-from-the-literature</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>ADR 0006 — `/check` verifies statements against the literature</h1><p class="lead">Generated from <code>process/decisions/0006-examples-from-the-literature.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [journal](../journal.html) · [design](../pipeline.html)\n\n- **date:** 2026-08-03\n- **status:** accepted\n- **kind:** agent design\n\n## Context\n\nNothing in the pipeline asked whether a statement has any instances. A decomposition can be internally consistent, survive a hostile referee, and be about the empty set: every lemma true, every proof valid, no $X$ satisfying the hypotheses. The critic cannot catch this, because vacuous truth is still truth.\n\nThe gap is worse for a paper that assumes a conjecture. Q1's setting requires $X$ smooth affine spherical satisfying three standing hypotheses including the unramified conjecture. Whether that class is rich enough to be interesting is a question about the literature, not about the DAG.\n\n## Decision\n\n`/check <node-id>` gains a second phase. After the presentation pass, the checker searches the literature — `WebSearch` and `WebFetch` — for explicit examples instantiating the node's statement, and writes `blueprint/nodes/<id>/examples.md`: instances that discharge the hypotheses, witnesses where the conclusion is computed in a published source, and boundary cases where a hypothesis fails and the conclusion fails with it. Each carries a citation with a resolvable identifier and a numbered result.\n\nWhen it finds nothing, it writes `blueprint/nodes/<id>/prompts/examples.md` instead: a **self-contained prompt** — statement, definitions, and question written out in full, no links, no repo context — that a human or a fresh session can act on. Exactly one of the two files exists.\n\nExamples are formally inert (invariant I10): no proof, node, or appendix entry may cite `examples.md`.\n\n## Justification\n\nThe escape hatch is the load-bearing part. An agent told to find examples and given no acceptable way to fail will invent one, and a fabricated citation with a plausible result number is the single worst artefact this pipeline could produce — it is exactly the kind of thing a reader believes without checking. Making \"none found\" a *first-class output with its own deliverable* removes the incentive. Writing a good prompt is real work, so failing honestly is not the lazy path.\n\nKeeping examples outside the closed world means a wrong example cannot corrupt a proof. The worst case is a misleading illustration, not an unsound DAG.\n\n## Consequences\n\n- The checker is no longer offline; it gains `WebSearch` and `WebFetch`. Its content-preservation guarantee survives because the examples phase is purely additive — it creates a new file and edits nothing.\n- `prompts/` accumulates an honest list of what the pipeline could not settle. This is a feature: it is the only place the system records its own ignorance in a form someone else can act on.\n- Example-finding is not reproducible the way a compile is. Two runs a month apart will return different sources. `examples.md` is therefore dated evidence, not a fixture, and the orchestrator's gate checks citations rather than re-deriving them.\n- The orchestrator must spot-check bib keys, because a claim that a key is in `refs.bib` is cheap to make and cheap to verify.\n\n## Alternatives considered\n\n**A fifth agent.** Rejected: it would have the same posture as the checker — read the node, write one additive file, never touch the DAG — and `/check` is already the \"is this in good shape?\" command. A separate command would be a second thing to remember to run.\n\n**Have the critic look for examples.** Rejected, and this one matters. The critic must stay hostile and offline: its job is to attack the proof with the appendix and nothing else. A referee that goes looking for supporting evidence is no longer testing the argument, and a referee with a web browser can be persuaded by a paper the proof never cited.\n\n**Have the lead-researcher supply examples at decomposition time.** Rejected: at that point the statements do not exist yet, and the pressure would be to write statements that match examples already found rather than statements that decompose the question.\n";</script>
