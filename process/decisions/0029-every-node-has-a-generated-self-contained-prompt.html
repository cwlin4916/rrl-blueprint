<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0029-every-node-has-a-generated-self-contained-prompt</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0029 — Every node has a generated self-contained prompt</h1><p class="lead">Generated from <code>process/decisions/0029-every-node-has-a-generated-self-contained-prompt.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [pipeline](../pipeline.html) · [operations](../operations.html) · [journal](../journal.html)\n\n- **status:** accepted\n- **date:** 2026-08-05\n- **scope:** repository structure, prompt portability, generated readouts\n\n## Context\n\nA `node.md` is intentionally concise. It stores the canonical statement and links its\nvocabulary into the appendix, while `context.md`, `main_dag.md`, dependency nodes and\n`refs.bib` carry the surrounding setting and provenance. That is the right normalized\nform for the repository, but it is not a portable problem packet: copying one node out\nof the tree leaves its terms, purpose, prerequisites and references behind.\n\nThe user requires one `node_prompt.md` for every node, with the problem, short context,\npurpose, definitions and relevant references stated clearly, and requires the result to\nremain consistent repository-wide.\n\n## Decision\n\nEvery directory containing `node.md` also contains `node_prompt.md`. The prompt is a\ndeterministic, non-citable readout generated by `tools/build_dag_site.py`; it is never\nauthored or edited independently.\n\nFor a node $v$, the generated prompt contains:\n\n1. a role-sensitive task and plain-language formulation;\n2. the question's standing setting and problem statement;\n3. the node's DAG purpose and its recorded provenance;\n4. the canonical `## Statement` of $v$, unchanged except for rebased links;\n5. every direct prerequisite statement, with its effective status and use policy;\n6. the full appendix entries declared by $v$, its direct prerequisites and the included\n   question context, plus the transitive appendix entries needed to define their linked\n   vocabulary, with source attributions, hypotheses and caveats;\n7. repository links and every `refs.bib` record named by that packet; and\n8. an explicit response contract that requires hypothesis checks and honest `GAP:`\n   markers.\n\nNormal site generation refreshes all prompt files and emits\n`blueprint_site/nodes/<path>/prompt.html`. `build_dag_site.py --check` writes nothing and\nfails on a missing, stale or stray prompt. A prompt begins with a generated-file notice\nand states that it is outside the closed world.\n\n## Why this preserves one source of truth\n\nThe prompt duplicates prose because portability requires duplication, but it introduces\nno second fact. Its bytes are a function of `node.md`, `main_dag.md`, the direct\nprerequisite `node.md` files, `appendix.md` and `refs.bib`. No proof, node or appendix\nentry may cite `node_prompt.md`, and no workflow reads it as mathematical authority.\n\nThe canonical statement remains in one place. A statement revision, dependency change,\nappendix correction or bibliography update changes the generated prompt on the next\nbuild; the consistency gate rejects a stale copy before another command can finish.\n\n## Consequences\n\n- A node can be handed to a reader or another system as one markdown file without first\n  assembling a context packet by hand.\n- The repository carries sizable repeated text. This cost is accepted because the copies\n  are generated, checked and mechanically replaceable.\n- `node_prompt.md` is tracked so every node has the requested artifact in a fresh clone;\n  its HTML page remains untracked with the rest of `blueprint_site/`.\n- The checker must never reformat a prompt directly. It edits canonical sources and runs\n  the generator.\n- Prompt files are readouts, not proof drafts, open literature-search prompts, examples,\n  evidence or status records.\n\n## Alternatives considered\n\n**Write 43 prompts by hand.** Rejected. Every statement or appendix revision would create\n43 opportunities for silent drift, directly violating the repository's normalization\ndiscipline.\n\n**Store only links beside each node.** Rejected. That preserves normalization but does\nnot satisfy self-containment; it recreates `node.md` under another name.\n\n**Embed the entire appendix and transitive DAG dependency tree in every prompt.**\nRejected. Direct prerequisites are the node's typed logical interface, and unrelated\nappendix entries add no clarity. Appendix vocabulary links are nevertheless closed\ntransitively, because a supposedly self-contained definition cannot require an external\nlookup merely to decode one of its terms.\n";</script>
