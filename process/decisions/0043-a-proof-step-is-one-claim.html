<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0043-a-proof-step-is-one-claim</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0043 — A proof step is one claim, and a definition is a display</h1><p class="lead">Generated from <code>process/decisions/0043-a-proof-step-is-one-claim.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Complements:** [0003](0003-appendix-of-objects.html) (what a proof may invoke) and the I9 page budget, whose escape hatch — split the node — this decision makes the *first* response rather than the last\n\n## Context\n\nEvery write-up under [Q1-L4](../../nodes/Q1/Q1-L4/index.html) sits between\n888 and 896 words against a 900-word ceiling. That is not a coincidence and it is not\na near miss: the budget is being *filled*, and what fills it is density. A step reads\n\n> **Step 4 — transitions surjective smooth affine; (a).** Affineness is automatic.\n> Since $I_{m+1}\\cap A_m=I_m$, the map $A_m/I_m\\to A_{m+1}/I_{m+1}$ is injective, so\n> $q$ is schematically dominant. Both sides are smooth (finite type, characteristic\n> $0$; Cartier); by Chevalley the image of $q$ is a closed subgroup, by dominance all\n> of $K_{\\lambda,m}$: $q$ is surjective, hence faithfully flat with smooth fibers\n> (generic flatness plus translation; fibers torsors under the smooth kernel), hence\n> smooth.\n\nSix distinct claims, four cited theorems and two parenthetical justifications, in one\nparagraph, with the definitions inline. It is checkable — a referee passed it — and it\nis very nearly unreadable. A reader who wants to know *which* fact fails in\ncharacteristic $p$ has to parse the sentence before they can find it.\n\nThe pressure comes from a real place. The budget exists so that a proof that will not\nfit is recognised as several nodes, and the honest response to a full page has always\nbeen to split. What actually happened is that authors compressed instead, because\ncompression is local and splitting requires the lead-researcher. The gate measured the\nsymptom it was built to catch and the writing route around it was cheaper.\n\nThe counting made this worse in one specific way: a `$$` on its own line was counted\nas a word, so pulling a definition out into a display block cost two words. The rule\nthat makes mathematics readable was taxed by the gate that measures length.\n\n## Decision\n\n**A step of a write-up is one claim, and it is spaced like one.**\n\n- **One claim per step.** A `**Step n — …**` block asserts one thing and gives the\n  reason for that one thing. A step that concludes six facts is six steps, or it is a\n  node that wants splitting. Sub-conclusions used only inside the step are named where\n  they are used, not carried across the paragraph.\n- **Every definition of a term is a display.** Where a write-up introduces notation —\n  $K_{\\lambda,m}$, $U_\\lambda$, an ideal, a functor — the defining equation goes in its\n  own `$$ … $$` block with a blank line either side. Inline `$…$` is for referring to a\n  symbol inside a sentence, never for coining one.\n- **Spacing is part of the mathematics.** A blank line between steps, a display for\n  each assertion that stands on its own, and no stacked parentheticals: a justification\n  that needs its own clause needs its own sentence.\n- **Splitting is the first response to a full page, not the last.** A write-up that\n  cannot say its steps one at a time inside the budget is reporting that its node is\n  several nodes. `/prove` says so and stops rather than compressing.\n\n**The delimiters stop counting.** `tools/check_render.py` strips a line that is only\n`$$` before counting words. The math inside still counts; the punctuation that makes it\na display does not. This removes the one place where the gate paid an author to write\nworse.\n\n## Consequences\n\n- The four `Q1-L4` write-ups are over-dense against this decision and under budget\n  against the gate. They are not rewritten in place — a write-up is rewritten by\n  `/prove`, and re-proving a passed node to reformat it would discard a PASS. They are\n  brought into line as their nodes are split and re-proved, which for `Q1-L4-L1` and\n  `Q1-L4-L2` is commissioned in the same run as this decision.\n- The rule is a **writing** rule with a mechanical half. The delimiter fix is enforced;\n  \"one claim per step\" is not, because a word count cannot tell a compound claim from a\n  compound sentence and a gate that guessed would reject correct proofs. It is carried\n  in the prover's instructions and read by the critic, which already reports\n  presentation defects as MINORs.\n- The budget stays at 900. Raising it would buy exactly the density this decision\n  exists to remove.\n";</script>
