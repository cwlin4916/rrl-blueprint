[0006 — `/check` verifies statements against the literature](0006-examples-from-the-literature.html)** — agent design; examples, and why \"none found\" needed its own deliverable.\n- **[0007 — The DAG view is generated, self-contained, and read-only](0007-generated-dag-view.html)** — repository structure; how a generated view differs from a generated source.\n- **[0008 — One page per object](0008-one-page-per-object.html)** — repository structure; why a link into a 3,000-line file is not navigation.\n- **[0009 — One tree per kind, and every fact stored once](0009-one-tree-per-kind.html)** — repository structure; who may write where, and why derivation beat checked redundancy.\n- **[0010 — The generated site is untracked, and is called `blueprint_site/`](0010-site-untracked-and-renamed.html)** — repository structure; the site is to the blueprint what the PDF is to `main.tex`. Rejects collapsing markdown into HTML.\n- **[0011 — A write-up is `proof.md`, not `<id>.tex`](0011-write-ups-in-markdown.html)** — repository structure and agent design; the last LaTeX leaves the reasoning tree, one page becomes 900 words, and example-finding splits off `/check` into `/examples`.\n- **[0012 — A sub-lemma's directory goes inside its parent's](0012-sub-lemmas-nest-in-their-parent.html)** — repository structure; the id becomes the path, and the flat layout's link-stability argument is answered rather than ignored. (Its site-stays-flat clause is amended by 0016.)\n- **[0013 — Confidence is derived, Baconian, and weakest-link](0013-confidence-is-derived-baconian-and-weakest-link.html)** — repository structure; how much to believe a node, computed from the defeaters its referees eliminated and capped by what it rests on, shown as a tint and never as a decimal.\n- **[0014 — Confidence is three signed channels, and absence is not doubt](0014-confidence-is-three-signed-channels.html)** — repository structure; supersedes 0013: a stored `human:` judgement at weight 25, the referee record at 50, the literature at 25, each signed so refutation and silence render apart, capped at 80% until the user approves.\n- **[0015 — Every node declares its epistemic role](0015-every-node-declares-its-role.html)** — repository structure; `role: proof | evidence | example | thought` in every node.md — proof nodes are the argument, the rest corroborate it, and tallies and confidence aggregate over the proof chain alone. Arose from Q1-L7, a check the argument never rests on.\n- **[0016 — The generated site mirrors the source tree](0016-the-site-mirrors-the-source-tree.html)** — repository structure; `blueprint_site/nodes/` takes the same directory chains as `blueprint/nodes/`, `node.md` rendering as the directory's `index.html` and `proof.md` as `proof.html`, so a relative link between two source files and the link between their pages are the same path.\n- **[0017 — Operators read the local library](0017-operators-read-the-local-library.html)** — agent design; every operator packet points at the PDFs on disk in `papers/`, named by `refs.bib` key, so hypotheses are checked against the source rather than against memory.\n- **[0018 — Example and analogy nodes](0018-example-and-analogy-nodes.html)** — repository structure; question-level ids `Q<n>-e<k>` (instances of the theory) and `Q<n>-a<k>` (matching claims from another setting, role `analogy`), full node contract, never depended on by proof nodes. Extends 0015.\n- **[0019 — `/update`: the statement-revision operator](0019-the-update-operator.html)** — agent design; the sixth command and the one lawful way a `## Statement` or a question's framing changes: whole-repo read first, external input verified before adoption, supersession recorded in append-only `updates/u<n>.md`, status reset, disclosed commit. Fills `operations.md` §8's missing hom-set; I15.\n- **[0020 — The priority panel](0020-the-priority-panel.html)** — repository structure; `blueprint/priorities.md` stores ranked judged rows (`llm` by `/update`, `human` d](0025-the-conjecture-is-versioned-and-self-contained.html)** — repository structure; the **Conjecture.** paragraph opens with a version label *(v\\<k\\> — date.)*, writes its criteria, hypotheses and bracket out in full with every reference hyperlinked (node statements staying canonical), and closes with a *Versions.* history; the schema records the parser contract for framing-block continuations. User-directed; amends 0023 and scopes 0002's no-statement-bodies clause.\n- **[0026 — Sub-lemma families fold into their parent](0026-sub-lemma-families-fold-into-their-parent.html)** — site design; every graph page draws the same top-level skeleton, but a decomposed lemma's sub-lemmas are emitted only on the pages of its own subtree — elsewhere the family folds into the parent's card behind a \"n sub-lemmas\" chip linking to its page, and per-page layout closes the gap. User-directed; amends 0024's full-depth clause, keeps its one engine and side branches.\n- **[0027 — A node carries its history, not a remark](0027-a-node-carries-its-history.html)** — repository structure; `## Remark` retired: every `node.md` ends with an append-only `## History` — dated bullets, oldest first, creation entry first, each linking the record it summarizes (`updates/u<k>.md`, critique rounds, `examples.md`, ADRs) — written by the lead-researcher at creation and appended to by `/update` per revision. User-directed; amends 0002's node shape and 0022's justification home; all 34 nodes migrated.\n- **[0028 — Orbit strata are fpqc-sheaf images](0028-orbit-strata-are-fpqc-images.html)** — mathematical ratification; fixes the closed-world meaning of the orbit strata used throughout Q1 while leaving their pro-scheme presentations as theorems.\n- **[0029 — Every node has a generated self-contained prompt](0029-every-node-has-a-generated-self-contained-prompt.html)** — repository structure; `node_prompt.md` is a deterministic, non-citable packet assembled from the canonical statement, question context, direct prerequisites, appendix entries and bibliography, refreshed and checked by the site generator. User-directed; I18.\n- **[0030 — `/prove` is capped at two rounds and one widening](0030-the-prove-budget-cap.html)** — operator budget; measured over Q1-L4's four children, a one-round node costs ~270k subagent tokens and a second round roughly triples it, while round 3 was never reached — so the loop stops at r2, allows one widening (a ratified reading counts), and refers a third round or a split back to the user. User-directed; amends §3 of the `/prove` skill.\n- **[0031 — Presentation is a stage of every command, not a command of its own](0031-presentation-is-a-stage-not-a-command.html)** — pipeline shape; `/check` deleted, the `checker` agent kept, and a presentation pass — one checker per file the run wrote, under an orchestrator-run content-preservation gate — made the last working stage of `/decompose`, `/prove`, `/examples` and `/update`. Keeping `process/pipeline.md` current moves to `/update` §7. User-directed; supersedes 0004 in part.\n- **[0032 — A node's own file is named for the node](0032-a-nodes-own-file-is-named-for-the-node.html)** — repository structure; `node.md` becomes `<id>_node.md`, joining `<id>_history.md` and `<id>_prompt.md`, so every file a node directory owns says which node it belongs to; `proof.md`, `critiques/` and `updates/` keep their fixed names, being the work rather than the node. User-directed; amends 0005's node shape, leaves 0016's URLs unchanged.\n- **[0033 — The generated site is tracked again, in a private repository](0033-the-generated-site-is-tracked-again.html)** — repository structure; `blueprint_site/` leaves `.gitignore` so a clone carries the rendered blueprint without a local rebuild, the site staying generated, never hand-edited and still staleness-checked by `--check`. User-directed; reverses 0010's first clause only, leaves its rename and publishes nothing.\n- **[0034 — The journal is compacted into phases,
