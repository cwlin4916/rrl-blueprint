<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Decision records</h1><p class="lead">Generated from <code>process/decisions/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[process index](../index.html) · [design](../pipeline.html) · [journal](../journal.html)\n\nOne file per choice that would be expensive to reverse. Numbered, append-only: a decision that turns out wrong gets a new record superseding it, and the old one stays with its status changed. The point is that a reader six months out can see *why*, not just *what*.\n\nFormat: context (what forced the choice), decision, justification where it is not obvious, consequences including the costs accepted, alternatives considered and why they lost.\n\n- **[0001 — Satake generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$](0001-satake-generation-ambient-category.html)** — mathematical ratification; binding on every node. Arose from a critic `FAIL` on Q1-L1.\n- **[0002 — One file per DAG node](0002-one-file-per-node.html)** — repository structure; why the index and the statements were split.\n- **[0003 — An appendix of objects replaces tables and bare labels](0003-appendix-of-objects.html)** — repository structure; how the closed world became a single readable file.\n- **[0004 — Presentation is a separate agent from correctness](0004-checker-separate-from-critic.html)** — agent design; why there is a checker as well as a critic.\n- **[0005 — One directory per node, and a one-page write-up](0005-node-directories.html)** — repository structure; extends 0002, and why a page is enough once the appendix exists.\n- **[0006 — `/check` verifies statements against the literature](0006-examples-from-the-literature.html)** — agent design; examples, and why \"none found\" needed its own deliverable.\n- **[0007 — The DAG view is generated, self-contained, and read-only](0007-generated-dag-view.html)** — repository structure; how a generated view differs from a generated source.\n- **[0008 — One page per object](0008-one-page-per-object.html)** — repository structure; why a link into a 3,000-line file is not navigation.\n- **[0009 — One tree per kind, and every fact stored once](0009-one-tree-per-kind.html)** — repository structure; who may write where, and why derivation beat checked redundancy.\n- **[0010 — The generated site is untracked, and is called `blueprint_site/`](0010-site-untracked-and-renamed.html)** — repository structure; the site is to the blueprint what the PDF is to `main.tex`. Rejects collapsing markdown into HTML.\n- **[0011 — A write-up is `proof.md`, not `<id>.tex`](0011-write-ups-in-markdown.html)** — repository structure and agent design; the last LaTeX leaves the reasoning tree, one page becomes 900 words, and example-finding splits off `/check` into `/examples`.\n- **[0012 — A sub-lemma's directory goes inside its parent's](0012-sub-lemmas-nest-in-their-parent.html)** — repository structure; the id becomes the path, and the flat layout's link-stability argument is answered rather than ignored. (Its site-stays-flat clause is amended by 0016.)\n- **[0013 — Confidence is derived, Baconian, and weakest-link](0013-confidence-is-derived-baconian-and-weakest-link.html)** — repository structure; how much to believe a node, computed from the defeaters its referees eliminated and capped by what it rests on, shown as a tint and never as a decimal.\n- **[0014 — Confidence is three signed channels, and absence is not doubt](0014-confidence-is-three-signed-channels.html)** — repository structure; supersedes 0013: a stored `human:` judgement at weight 25, the referee record at 50, the literature at 25, each signed so refutation and silence render apart, capped at 80% until the user approves.\n- **[0015 — Every node declares its epistemic role](0015-every-node-declares-its-role.html)** — repository structure; `role: proof | evidence | example | thought` in every node.md — proof nodes are the argument, the rest corroborate it, and tallies and confidence aggregate over the proof chain alone. Arose from Q1-L7, a check the argument never rests on.\n- **[0016 — The generated site mirrors the source tree](0016-the-site-mirrors-the-source-tree.html)** — repository structure; `blueprint_site/nodes/` takes the same directory chains as `blueprint/nodes/`, `node.md` rendering as the directory's `index.html` and `proof.md` as `proof.html`, so a relative link between two source files and the link between their pages are the same path.\n- **[0017 — Operators read the local library](0017-operators-read-the-local-library.html)** — agent design; every operator packet points at the PDFs on disk in `papers/`, named by `refs.bib` key, so hypotheses are checked against the source rather than against memory.\n- **[0018 — Example and analogy nodes](0018-example-and-analogy-nodes.html)** — repository structure; question-level ids `Q<n>-e<k>` (instances of the theory) and `Q<n>-a<k>` (matching claims from another setting, role `analogy`), full node contract, never depended on by proof nodes. Extends 0015.\n- **[0019 — `/update`: the statement-revision operator](0019-the-update-operator.html)** — agent design; the sixth command and the one lawful way a `## Statement` or a question's framing changes: whole-repo read first, external input verified before adoption, supersession recorded in append-only `updates/u<n>.md`, status reset, disclosed commit. Fills `operations.md` §8's missing hom-set; I15.\n- **[0020 — The priority panel](0020-the-priority-panel.html)** — repository structure; `blueprint/priorities.md` stores ranked judged rows (`llm` by `/update`, `human` by the user), the site derives the warnings layer at every build, and the panel renders on the hub, the root DAG and its own page; I16.\n- **[0021 — Example and analogy nodes nest under the lemma they illustrate](0021-example-and-analogy-nodes-nest.html)** — repository structure; a terminal `-e<k>`/`-a<k>` segment may end any node id, the child sitting inside the lemma it speaks to with containment and no dependency edge, drawn dashed on the parent's local DAG. Supersedes 0018's question-level-only scope; first inhabitants Q1-L5-e1–e4.\n- **[0022 — `/update` proposes nodes from failures, and commissions their creation](0022-update-proposes-nodes-from-failures.html)** — agent design; the update run ends in a failure audit — what succeeded, what failed, which failure names a crisp missing claim — and hands justified proposals to the lead-researcher to materialize, the justification recorded in the new node's Remark. Supersedes 0019's rejected alternative; creation keeps its one writer.\n- **[0023 — The question block states a conjecture, not a logical closure](0023-the-question-block-states-a-conjecture.html)** — repository structure; the per-question **Logical closure.** paragraph becomes a **Conjecture.**: the current best answer stated as a claim, then the status of the route to it — assembly over proof nodes, each link's standing dated. User-directed; amends 0002's index shape and rewords 0015's rule.\n- **[0024 — One graph, with corroboration in collapsed side branches](0024-one-graph-with-side-branched-corroboration.html)** — site design; every DAG page mounts the same full-depth graph (the focused per-node pages and the node-page iframes included), the spine alone laid out, example/analogy nodes folded behind ▸ / ◂ chips beside their host — examples right, analogies left — an open branch drawing its own dependency edges as a sub-DAG. User-directed; amends 0016 and 0021, retires the static per-node SVG.\n- **[0025 — The conjecture is versioned and self-contained](0025-the-conjecture-is-versioned-and-self-contained.html)** — repository structure; the **Conjecture.** paragraph opens with a version label *(v\\<k\\> — date.)*, writes its criteria, hypotheses and bracket out in full with every reference hyperlinked (node statements staying canonical), and closes with a *Versions.* history; the schema records the parser contract for framing-block continuations. User-directed; amends 0023 and scopes 0002's no-statement-bodies clause.\n- **[0026 — Sub-lemma families fold into their parent](0026-sub-lemma-families-fold-into-their-parent.html)** — site design; every graph page draws the same top-level skeleton, but a decomposed lemma's sub-lemmas are emitted only on the pages of its own subtree — elsewhere the family folds into the parent's card behind a \"n sub-lemmas\" chip linking to its page, and per-page layout closes the gap. User-directed; amends 0024's full-depth clause, keeps its one engine and side branches.\n- **[0027 — A node carries its history, not a remark](0027-a-node-carries-its-history.html)** — repository structure; `## Remark` retired: every `node.md` ends with an append-only `## History` — dated bullets, oldest first, creation entry first, each linking the record it summarizes (`updates/u<k>.md`, critique rounds, `examples.md`, ADRs) — written by the lead-researcher at creation and appended to by `/update` per revision. User-directed; amends 0002's node shape and 0022's justification home; all 34 nodes migrated.\n- **[0028 — Orbit strata are fpqc-sheaf images](0028-orbit-strata-are-fpqc-images.html)** — mathematical ratification; fixes the closed-world meaning of the orbit strata used throughout Q1 while leaving their pro-scheme presentations as theorems.\n- **[0029 — Every node has a generated self-contained prompt](0029-every-node-has-a-generated-self-contained-prompt.html)** — repository structure; `node_prompt.md` is a deterministic, non-citable packet assembled from the canonical statement, question context, direct prerequisites, appendix entries and bibliography, refreshed and checked by the site generator. User-directed; I18.\n- **[0030 — `/prove` is capped at two rounds and one widening](0030-the-prove-budget-cap.html)** — operator budget; measured over Q1-L4's four children, a one-round node costs ~270k subagent tokens and a second round roughly triples it, while round 3 was never reached — so the loop stops at r2, allows one widening (a ratified reading counts), and refers a third round or a split back to the user. User-directed; amends §3 of the `/prove` skill.\n- **[0031 — Presentation is a stage of every command, not a command of its own](0031-presentation-is-a-stage-not-a-command.html)** — pipeline shape; `/check` deleted, the `checker` agent kept, and a presentation pass — one checker per file the run wrote, under an orchestrator-run content-preservation gate — made the last working stage of `/decompose`, `/prove`, `/examples` and `/update`. Keeping `process/pipeline.md` current moves to `/update` §7. User-directed; supersedes 0004 in part.\n- **[0032 — A node's own file is named for the node](0032-a-nodes-own-file-is-named-for-the-node.html)** — repository structure; `node.md` becomes `<id>_node.md`, joining `<id>_history.md` and `<id>_prompt.md`, so every file a node directory owns says which node it belongs to; `proof.md`, `critiques/` and `updates/` keep their fixed names, being the work rather than the node. User-directed; amends 0005's node shape, leaves 0016's URLs unchanged.\n- **[0033 — The generated site is tracked again, in a private repository](0033-the-generated-site-is-tracked-again.html)** — repository structure; `blueprint_site/` leaves `.gitignore` so a clone carries the rendered blueprint without a local rebuild, the site staying generated, never hand-edited and still staleness-checked by `--check`. User-directed; reverses 0010's first clause only, leaves its rename and publishes nothing.\n- **[0034 — The journal is compacted into phases, and the full record is kept beside it](0034-the-journal-is-compacted-into-phases.html)** — process record; `journal.md` becomes ten lessons plus eleven dated phases, the sixty-nine original entries preserved verbatim in `journal_v1.md` as the authority when the two disagree. User-directed; the append-only exception is scoped to this one file, evidence records keeping theirs.\n- **[0035 — The blueprint explains itself, one concept per directory](0035-the-concepts-tree.html)** — repository structure; `blueprint/concepts/<slug>/<slug>.md` gives each of node, closed world, appendix, DAG, confidence, role, gate, operator and history a page with a plain-language definition, the failure it prevents, a real example from this repository and its ancestors in the literature. User-directed; outside the closed world, checked by `/update` §7.\n- **[0036 — An example says what it matches](0036-an-example-says-what-it-matches.html)** — agent design; every finding of `/examples` — instance, analogue or precedent hit — names the part of the node's statement it matches, the specialisation or sourced dictionary line it matches under, and what it does not reach; analogues alone never earn `EVIDENCE: precedent`, and the orchestrator reports the clauses nothing found touches. User-directed; amends 0018, first applied to Q1-L3.\n- **[0037 — The node panel carries the statement, and links the rest](0037-the-node-panel-carries-the-statement.html)** — site design; the graph's right-hand panel drops its inlined `## History` section and the history text leaves the mounted payload, the append-only record being reached from the panel's Pages list and its own generated page. User-directed; amends 0024's panel, leaves 0027's record untouched.\n- **[0038 — One graph per question](0038-one-graph-per-question.html)** — site design; each question got its own graph page so the scope card would stop being `questions[0]`. User-directed; **superseded by 0039**, which fixed the same defect at the card layer instead, and kept for the three one-question assumptions it names.\n- **[0039 — One graph for every question](0039-one-graph-for-every-question.html)** — site design; `dag.html` draws every question as its own block with its own scope card, tiled left to right, a node rising to its own card and a `**Feeds.**` paragraph drawing a thick arrow from one question's card to another's. User-directed; supersedes 0038, amends 0024; the relation is between questions, so no tally, transpose or confidence aggregate moves. **Superseded by 0082**, which keeps the Feeds arrows and takes the nodes off the root canvas.\n- **[0040 — The goal question has a bench](0040-the-key-example-register.html)** — blueprint shape and an operator; `blueprint/key_examples.md` registers the cases where the goal question's answer is settled in print, one `K<k>` entry each closing on a machine-readable `KEY:` line, and `/check-goal` tests a node against it. User-directed; the resulting `GOALCHECK:` verdict is a *ceiling* on confidence and never a boost, because surviving the bench is the absence of evidence against a statement rather than evidence for it.\n- **[0042 — Confidence shows its working](0042-confidence-shows-its-working.html)** — site design and a correction; the graph panel and every node page follow the confidence with a per-channel decomposition linking the record each channel scored, and two defects in the derivation are fixed — a passing critique round's flaws counted as standing, and an empty set of nodes scored +100%. User-directed; amends 0014's computation, not its channels, weights or cap, and records eight known defects it does not fix.\n- **[0043 — A proof step is one claim, and a definition is a display](0043-a-proof-step-is-one-claim.html)** — write-up shape and a gate; a `**Step n — …**` block asserts one thing and gives the reason for that one thing, and notation is coined in its own display, never inline. User-directed; the render gate counts a bare `$$` as nothing, so splitting a step costs its math and not its delimiters.\n- **[0044 — A question states a problem, not its route](0044-a-question-states-a-problem-not-its-route.html)** — blueprint shape; a question's framing is exactly **Setting**, **Problem statement** and **Conjecture**, with the strength of an answer said explicitly and the bracket stated in the problem rather than beside it. User-directed; supersedes 0025's *Route status.* and *Versions.* paragraphs and amends 0023.\n- **[0045 — There is no blocked node](0045-there-is-no-blocked-node.html)** — agent design and site design; the derived status `blocked` is removed as a status *and* as a gate, so `/prove` and `/decompose` run anywhere in the graph and an unproved dependency contributes its statement as an assumed fact the write-up must disclose. User-directed; amends 0009's derived pair, keeps `ready`, and leans on the confidence cap to do what the gate claimed to.\n- **[0046 — A refuted statement needs a change, not an update](0046-a-refuted-statement-needs-a-change.html)** — agent design and site design; `VERDICT: REFUTED` becomes a third critic verdict meaning the statement is false as written, and drives a red **needs change** chip distinct from the amber **needs update**. `/prove` gains a refutation branch that reads the literature, records the false version verbatim in the node's history and suggests a correction it does not adopt. User-directed; complements 0019's write discipline and 0030's budget cap.\n- **[0047 — An example or analogy node is a proposition, and decomposes like any other](0047-an-example-node-is-a-proposition.html)** — node grammar; an e/a segment stops being terminal, so `Q2-e1-L1` is an ordinary sub-lemma of the example and every operator applies to an e/a node at the same bar. User-directed; extends 0018 and 0015, and is what made grouping a wide layer possible at all.\n- **[0048 — A decomposition is grounded node by node](0048-a-decomposition-is-grounded-node-by-node.html)** — agent design; every node a `/decompose` run creates leaves that run carrying at least one example, one example-finder per node, with an honest `prompts/examples.md` as the passing outcome when the search comes back empty and an `EVIDENCE: counterexample` as a stop. User-directed; extends 0006 and 0036 by moving the operator from available to required at the one moment acting on it is cheap.\n- **[0049 — A priority row is one sentence, and the panel quotes the claim](0049-a-priority-row-quotes-the-claim.html)** — site design and a correction; the priority panel renders its rows instead of escaping them, quotes each target's own title as the claim the row is about, and holds the judgement to one sentence under a 50-word gate. User-directed; extends 0020 and carries 0037's rule — a readout shows the statement — to the one surface it had not reached.\n- **[0050 — A node has at most ten children, and the remedy is to group](0050-a-node-has-at-most-ten-children.html)** — blueprint shape and a gate; a container holds at most ten direct children, `/decompose` refuses the eleventh and `--check` notes what is already on disk. User-directed; extends 0024, 0026, 0039 and 0047, and notes rather than fails because clearing a wide layer moves directories and a moved node breaks its critiques' links.\n- **[0051 — A decomposition folds whatever its members are rolled](0051-a-decomposition-folds-whatever-its-members-are-rolled.html)** — site design and a correction; which children fold is decided by the recorded edge and not by the role, so an example's sub-lemmas fold into the example instead of being drawn in its host's layer on every page. User-reported; amends 0026, whose role test 0047 had silently inverted.\n- **[0059 — A container is a directory, all the way up](0059-a-container-is-a-directory.html)** — repository layout; a node's directory chain opens with its **question** (`blueprint/nodes/Q2/Q2-L8/`) and an appendix entry moves into its section's directory (`blueprint/appendix/5-sheaf-theory/`). User-directed; extends 0012, 0053, 0050 and 0016, and closes the one layer nesting never reached — a question is not a node, so the top layer had stayed flat at thirty-seven siblings in string order.\n- **[0060 — A write-up has two budgets, and only the larger one is a gate](0060-a-write-up-has-two-budgets.html)** — the render gate; `proof.md` gets a hard cap of 1500 words and a **split signal** at 1000 that fails nothing and names its two remedies, `/decompose` and moving what the write-up restates into the appendix. User-directed; supersedes the 900-word figure, which had stopped being a ceiling and become a target — seventeen of twenty-seven write-ups sat between 866 and 900 words and two at exactly 900.\n- **[0058 — Importance is derived, and it sizes the card](0058-importance-is-derived-and-sizes-the-card.html)** — site design; a node's importance $I(v)\\in[0,1]$ is derived from four channels of the existing record — transitive `required-by` reach, being named at a declared strength in a **Problem statement**, being named in a **Feeds.** paragraph, and citation from another question's statements — and the card's width is base $\\times(1+I)$. User-directed; extends 0014 and 0042 (derived, never stored; shows its working) and 0039, whose ban on cross-question `depends-on` is why two of the channels have to read prose.\n- **[0062 — A node states its own flaw](0062-a-node-states-its-own-flaw.html)** — blueprint readouts; `<id>_node.md` carries a generated `BEGIN FLAW` / `END FLAW` block quoting the record that flagged it — the standing FATAL/MAJOR flaws of the last round, the defect sentence of a supersession, the `EVIDENCE:` line and what it found missing. User-directed; extends 0055 and 0037, and reaches the one readout they left out, the canonical file itself.\n- **[0063 — A prompt carries what is needed to work, not everything that is true](0063-a-prompt-carries-what-is-needed-to-work.html)** — the generated prompt; the history becomes its latest entry, an undeclared appendix entry loses its fine print, and the link list of files a portable packet cannot open goes. User-directed; amends 0029, whose self-containment had quietly become completeness — `Q2-L4_prompt.md` was 9815 words, 1563 of them a fourteen-entry log.\n- **[0077 — The ask is a line on the node](0077-the-ask-is-a-line-on-the-node.html)** — blueprint readouts and a gate; what a negative node needs becomes a one-line `needs:` field in `<id>_node.md`, carried into the generated prompt, and an `/update` on a node is never a no-op — it changes the statement or it changes this line. User-directed; supersedes 0075, whose page-sized container was a second place a node spoke about itself, was written once for one node of nine owing it, and was refreshed by nobody.\n- **[0078 — Generalizing is its own operator](0078-generalize-is-its-own-operator.html)** — the operator set; `/update` §3 becomes `/generalize <id>`, gated on three tests — strictly more general with the specialization in one line, verified against the appendix, and buying a second instance or a shortened step. User-directed; amends 0019 and extends 0061 and 0064. Generalizing is not part of revising: a node that is merely narrow is not wrong, and the honest outcome of most invocations is that one of the three tests fails.\n- **[0079 — An operator reads the node summary first](0079-update-reads-the-node-summary.html)** — operator economy; `<id>_node.md` carries the statement *and* the generated flaw block quoting the record's own words, so the critique, the supersession record and `examples.md` are not re-read to learn what is wrong. User-directed; amends 0019's §1 and extends 0062. The substitution is exact rather than a summary — the block is generated from those records and `--check` fails a stale one.\n- **[0080 — Who cites an appendix entry is derived](0080-who-cites-an-entry-is-derived.html)** — the appendix schema; the authored `- **used by:**` line comes off all forty-seven entries and `--check` inverts, failing on the presence of one rather than reconciling it. User-directed; amends 0003's entry schema and withdraws 0071's transpose paragraph. The site already derived the same list from the nodes' `objects:` fields and rendered it beside the authored copy — one of the two could not be wrong, and it was not the one five checker repairs had been spent on.\n- **[0081 — Confidence is a weighted sum of four channels, and the repo is one of them](0081-confidence-is-a-weighted-sum.html)** — the scoring rule; one weighted sum, $0.20H + 0.35D + 0.15L + 0.30R$, with the weakest dependency demoted from a hard ceiling to an ordinary term and the approval cap deleted because the arithmetic already enforces it. User-directed; supersedes 0068 and amends 0014 and 0042. A ceiling had copied one descendant's score onto five nodes that read exactly $-50\\%$ for reasons that had nothing to do with them, and a display where five nodes carry the same number has stopped carrying information.\n- **[0082 — The root graph draws questions alone, and a card is a door](0082-the-root-graph-draws-questions-alone.html)** — site design; `dag.html` draws one card per question, columns by the Feeds relation, each arrow labelled with the node of the fed question its **Feeds.** paragraph names, and clicking a card opens that question's own `dag/q<n>.html`. User-directed; supersedes 0039, whose tiling put three arguments on one canvas and made the two arrows it existed to draw the one thing that never fit on screen.\n- **[0084 — A question is a node, and it is self-contained](0084-a-question-is-a-node.html)** — the node schema; every question gains `Q<n>_node.md`, `Q<n>_history.md` and a generated `Q<n>_prompt.md`, its framing moves out of `main_dag.md` into sections, and it states every hypothesis it spends instead of citing another question's node. User-directed; supersedes 0059's container clause and rehouses 0044's schema unchanged. The framing parser ended a block at a capital letter, which is why every continuation paragraph in the repository had to open lowercase.\n- **[0085 — The pipeline replaces the priority panel](0085-the-pipeline-replaces-the-priority-panel.html)** — the ranking; the flat file of judged rows becomes a `## Pipeline` of at most five ranked actions on each question, each naming an operator, its target and what it buys, with severity read off the target rather than stored. User-directed; supersedes 0020's stored half and keeps its derived half. Fifty-two rows at HEAD and not one written by the human author the two-author schema existed for.\n- **[0086 — An appendix link resolves by stem, and the appendix is sectioned by subject alone](0086-an-appendix-link-resolves-by-stem.html)** — the closed world's layout; [0053](0053-the-appendix-is-a-directory.html) promised that moving an entry between sections \"breaks no link anywhere\" and [0059](0059-a-container-is-a-directory.html) made it false, so a citation now names its entry by stem and the section directory is written for readability alone. Sections drop their numbers, group by subject and never by provenance, and go from nine to fourteen; ~1,000 links inside append-only records were never rewritten and resolve\n- **[0087 — `/why` is its own operator, and the reader supplies the question](0087-why-is-its-own-operator.html)** — the readout; a node says what is wrong with it in its flaw block and what would clear it in its `needs:` line, and nothing said **why it is there**, so `/why <id> \"<question>\"` writes `why/w<n>.md` — three sections, at most 300 words that the gate fails rather than reports, every claim ending in a pointer, no machine-readable line at all. The question is a required argument recorded verbatim, because explanation is contrastive and the foil belongs to the asker. Extends [0062](0062-a-node-states-its-own-flaw.html) and [0077](0077-the-ask-is-a-line-on-the-node.html).\n- **[0088 — `/create` records a change of presentation](0088-create-records-a-change-of-presentation.html)** — the operators; research is not only search inside a fixed $P$ but a chain $P_0 \\to P_1 \\to P_2 \\to \\cdots$, and `/create \"<claim>\"` puts the claim at **the deepest node whose statement still holds** under the new presentation while its first history entry names which of the objects, morphisms, ambient category, equivalence, invariants or notion of solution moved. Three of its four exits write nothing and name the operator that is wanted; the id gains no seventh segment letter, because the record carries the fact better than a filename would.\n- **[0089 — The argument is drawn in circles, about the thing it is about](0089-the-argument-is-drawn-in-circles.html)** — site design; every DAG page lays its cards on concentric circles about the question at the centre, radius being Feeds depth on the root page and dependency depth on the rest — the same two numbers the columns and rows already drew, re-projected. User-directed; amends [0039](0039-one-graph-for-every-question.html), [0058](0058-importance-is-derived-and-sizes-the-card.html), [0061](0061-the-z-axis-is-abstraction-level.html) and [0082](0082-the-root-graph-draws-questions-alone.html). Four cards in a row says four peers, and one of them is the goal question the other three exist to serve.\n- **[0090 — A claim is one line, and its reasons fold under it](0090-a-claim-is-one-line-and-its-reasons-fold.html)** — presentation, in the canonical markdown and not the renderer; a proof step's headline, a flaw's first sentence and a node's generated defect stay visible and their arguments go behind a `<details>`, and an appendix entry is named by what it is rather than by the label it is filed under. User-directed; amends [0043](0043-a-proof-step-is-one-claim.html), [0060](0060-a-write-up-has-two-budgets.html) and [0062](0062-a-node-states-its-own-flaw.html). Nothing was written: 359 step headlines and 403 flaw statements already existed and were run together with their justifications. Overrides the append-only rule for 48 critique files, at the owner's explicit instruction and with the cost recorded.\n- **[0091 — The front door is the graph, and a collaborator gets a to-do page](0091-the-front-door-is-the-graph.html)** — site design; `blueprint_site/index.html` is deleted and `dag.html` is the landing page, because the hub was a page whose whole content was a list of destinations, reached from a bar that already linked to it, so the first click of every session was a click past. User-directed; amends [0033](0033-the-generated-site-is-tracked-again.html) and the bar of [0039](0039-one-graph-for-every-question.html). The list moves into the graph bar's `▾ menu`, which loses nothing; `process/todo.md` renders as `todo.html` and takes the third slot in the top right, because what a collaborator is being asked to do was a fact stored in a message and nowhere in the repository.\n- **[0093 — A collaborator is handed one door, and the reading is in the repository](0093-a-collaborator-is-handed-one-door.html)** — what somebody who has been handed this repository sees; the philosophy deck loses its thirteen subpages and its two briefs and becomes one page, `process/todo.md` splits into [`todo1.md`](../../todo1.html) (four questions, the `to do` tab) and [`todo2.md`](../../todo2.html) (the one item that ends in a file that runs), and the reading behind the two design questions becomes [`process/references/`](../references/index.html) with seventeen PDFs in the repository and none of them published. User-directed; amends [0091](0091-the-front-door-is-the-graph.html).
