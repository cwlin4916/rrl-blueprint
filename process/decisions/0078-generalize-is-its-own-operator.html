<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0078-generalize-is-its-own-operator</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0078 — Generalizing is its own operator</h1><p class="lead">Generated from <code>process/decisions/0078-generalize-is-its-own-operator.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-08\n**Status:** accepted\n**Amends:** [0019](0019-the-update-operator.html) (the update operator), by removing its §3\n**Extends:** [0061](0061-the-z-axis-is-abstraction-level.html) (the z axis is abstraction level), [0064](0064-an-abstractions-id-names-what-it-generalizes.html) (an abstraction's id names what it generalizes)\n\n## Context\n\n`/update` §3 was headed **Generalize before you revise**, and it sat between verification and revision as a step every run passed through. The rule it carried is right and is kept: when a verified claim is strictly more general than the target, the answer is a new general node with the target left standing as its specialization, never a widened statement in place.\n\nThe placement was wrong in two ways.\n\n**It made abstraction the default posture of a corrective operator.** `/update` exists to fix what is wrong. A node that is merely *narrow* is not wrong — most of them are narrow on purpose, because a lemma cut for one argument should be cut for that argument. Putting \"generalize\" ahead of \"revise\" in the loop told every run to reach for abstraction first, on nodes where the honest answer is that the node is fine and the run has nothing to do.\n\n**It buried the expensive judgement inside the cheap one.** Deciding that a claim is strictly more general, that it is verified rather than merely suggested, and that the general form buys something, is a research judgement of its own. Inside `/update` it had no gate, no report of its own, and no way to stop: a run that reached §3 and found no generality wrote nothing, so the record never showed the question being asked. Five `-z` nodes exist and not one of them records which of the three tests it passed.\n\n## Decision\n\n**`/generalize <node-id> [with input <passage>]` is a command.** It takes a node, decides whether something strictly more general is true and verified, writes the general statement, and commissions `<id>-z<k>` from the lead-researcher. `/update` §3 is deleted; `/update` §2 instead **stops and hands over** when a verified claim turns out to be more general than the target.\n\n**The rule it enforces is unchanged and is the whole command:** a statement is never widened in place. The general claim becomes a new node; the target is left standing, unedited, as its specialization; the work already proved under the old statement stays proved, and the record shows a theorem *gained* rather than a statement quietly moved.\n\n**Three tests gate it, and all three must pass:**\n\n1. **Strictly more general, and demonstrated** — the specialization written out in one line, as a substitution. If that line cannot be written there is no abstraction.\n2. **Verified, not merely suggested** — recomputed against the appendix and the manuscript, never against the passage's paraphrase. An unverified generality is a priority row.\n3. **It buys something** — a second instance already in the tree, or a step of an existing proof the general form discharges. A general statement that no second node instantiates and no argument shortens is notation, not mathematics.\n\nThe honest outcome of most invocations is that one of the three fails, and the command's report says which. That is the report `/update` §3 could never produce.\n\n**Nothing about the target changes**: not its `## Statement`, not its `status:`, not its `depends-on`, not its write-up, not its critique rounds. The only write inside the target's directory is a dated `<id>_history.md` entry naming the new node and the specialization. A run that wants to change the target is the wrong command — that is `/update`.\n\n## What is unchanged from 0061 and 0064\n\nThe id names the instance and the number is the layer: `Q1-L2-z1` is the statement `Q1-L2` specializes, and `Q1-L2-z2` the statement `Q1-L2-z1` specializes, sitting *beside* `z1` rather than inside it. The edge is **specialization, not dependency**: `instances:` on the new node is the whole of it, there is no transpose, the instance acquires no obligation and contributes no ceiling, and an abstraction counts against no sub-lemma tally and no fan-out cap. `role:` is `proof`, always, and `--check`'s two z rules are untouched.\n\n## Why not leave it in `/update` and just gate it there\n\nBecause the gate is a *stop*, and a stop inside a section of a longer command is a stop nobody reports. The three tests above are worth running deliberately and worth failing loudly; inside §3 they were three sentences a run could satisfy itself it had considered. Splitting them out costs one command and gives the question a report, a claim lock, a `--check` pass of its own, and — the part that matters — an invocation the user chooses to make, rather than a step every corrective run walks through on its way somewhere else.\n\n## Consequences\n\n- `.claude/skills/generalize/SKILL.md` and its Codex adapter `.agents/skills/generalize/SKILL.md` are new. `.claude/skills/update/SKILL.md` loses §3 and renumbers; its §2 gains the hand-off.\n- The pipeline is seven operators, not six. `process/pipeline/operators/` gains `generalize.md` and its table gains a row.\n- [I43](../pipeline.html#4-invariants) is new.\n- No existing `-z` node changes. The five on disk keep their ids, statements, edges and statuses.\n- `/generalize` creates no directory itself: only the lead-researcher creates nodes, as before.\n";</script>
