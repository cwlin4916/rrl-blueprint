<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0047-an-example-node-is-a-proposition</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0047 — An example or analogy node is a proposition, and decomposes like any other</h1><p class="lead">Generated from <code>process/decisions/0047-an-example-node-is-a-proposition.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0018](0018-example-and-analogy-nodes.html) (the e/a classes), [0015](0015-every-node-declares-its-role.html)\n(the `role:` field), [0036](0036-an-example-says-what-it-matches.html) (an example says what it matches)\n**Supersedes:** rule 2 of [0021](0021-example-and-analogy-nodes-nest.html) — \"an e/a segment is\nterminal. Nothing nests inside an e/a node … a corroboration that needs its own decomposition\nhas outgrown the class\"\n\n## Context\n\n0021 nested example and analogy nodes inside the lemma they illustrate and then froze them\nthere: an e/a segment ended an id, `--check` rejected `Q1-L5-e1-L1`, and the stated escape\nfor an instance that wanted decomposing was to stop being an instance. The four Q2 example\nnodes are the case that breaks the rule. `Q2-e4` — $X = \\mathrm{Sp}_4\\backslash\\mathrm{GL}_4$ —\nlists five separate computations in one statement: the orbit poset, the component groups, a\nHecke word per orbit, the costalk it produces, and whether the resulting matrix is\nunitriangular. Each is a claim a referee could certify on its own; together they are five\npages, not one, and 0021 left no way to say so except to promote the whole thing to a lemma\nof the argument, which it is not — nothing in Q2's proof chain may rest on a computation in\none variety.\n\nThe user's instruction names the same thing from the other side: an `/examples` run creates\nnodes, and *a node is a proposition*. `Q2-e1` does not say \"here is the group case, look at\nit\"; it asserts that in the group case every hypothesis of Q2-L3 holds. That is true or\nfalse, and a claim that is true or false is one `/prove` can take and one `/decompose` can\ncut up. The class was addressable but not operable, and the two should never have come\napart.\n\n## Decision\n\n**An e/a segment is no longer terminal.** `Q2-e1-L1` is a sub-lemma of the example node\n`Q2-e1` and lives at `blueprint/nodes/Q2-e1/Q2-e1-L1/`; `Q2-e1-e1` is an example of the\nexample — a further instance of the same *kind* of instance — and lives at\n`blueprint/nodes/Q2-e1/Q2-e1-e1/`. Depth is unbounded in both directions, exactly as for\nlemmas. Four rules.\n\n1. **An e/a node's `## Statement` is a proposition.** It asserts something that can be true\n   or false, and every operator applies to it at the same bar: `/decompose` cuts it into\n   sub-claims, `/prove` runs prover → gate → critic on it, `/examples` finds further\n   instances of it, `/check-goal` tests it against the register. 0018 rule 4 already said\n   `/prove` and `/examples` accept these nodes; this adds `/decompose` and states the reason\n   both were always available — the node is a claim, not an exhibit.\n\n2. **The statement carries what it is an example *of*, and says which way it cuts.** Two\n   sections beyond `## Statement` would violate the one-statement rule, so both go inside\n   it, and both are required of every e/a node:\n\n   - the claim it instantiates is **quoted in the statement**, not linked. An example node\n     read on its own must show the thing it is an example of, because the whole use of the\n     node is to be looked at beside the general claim, and a reader who has to follow a link\n     to find out what is being instantiated is reading two files to learn one fact.\n   - the statement opens on its **polarity** — `positive`, `negative`, `boundary` or\n     `normalization` — saying, in the parent statement's own terms, whether the instance\n     confirms the claim, refutes it, sits on the edge where a hypothesis is dropped, or\n     fixes a convention. An instance whose polarity is not written down is one every reader\n     silently assumes is positive, which is the failure mode ADR 0036 named for findings and\n     which nodes inherit.\n\n3. **Nothing under an e/a node has role `proof`.** A descendant of an example is part of the\n   example, and the aggregates say so: tallies and question confidence range over role\n   `proof` alone ([0015](0015-every-node-declares-its-role.html) rule 2), so a sub-lemma of an\n   instance carrying role `proof` would put a computation in one variety into the count of\n   the argument and let it cap the question by weakest link. The children take the host's\n   role — `example` under an example, `analogy` under an analogy — or `evidence`/`thought`.\n   `--check` enforces it.\n\n4. **The containment edge and the dependency edge are different edges, and both now occur.**\n   0021 rule 1 is unchanged where it applies: an e/a node's edge to the lemma it *illustrates*\n   is containment only — `Q2-L5` never lists `Q2-L5-e1` in `depends-on`, and the child never\n   lists the host in `required-by`, because an illustration must not justify (I10). But an\n   e/a node's edge to its own sub-lemmas is an ordinary dependency: `Q2-e1` lists\n   `Q2-e1-L1` in `depends-on` and `Q2-e1-L1` lists `Q2-e1` in `required-by`, exactly as for a\n   lemma, since the sub-claims are what the instance rests on. The rule that decides which\n   edge you have is the roles: crossing from a `proof` host to an e/a child is containment;\n   everything below the e/a node is dependency. Consequently 0018 rule 2 is restated: **an\n   e/a node may depend on `proof` nodes and on nodes nested inside itself, and on nothing\n   else.**\n\n## Justification\n\n**The class was addressable but not operable, and 0021 knew it.** 0021's own alternatives\nsection rejected \"a `## Instances` section in the parent's node.md\" by quoting 0018: \"an\ninstance with its own hypotheses, literature trail and open questions is node-shaped; a\nsection cannot be `/prove`d or pointed at.\" The terminal rule reintroduced exactly that\ndefect one level down — `Q2-e4`'s five computations are five node-shaped things inside one\nnode, unprovable separately and unpointable-at — and the argument that killed the section\nkills the terminal rule too.\n\n**The escape 0021 offered is not available here.** \"Should be a lemma or a question\" assumes\na corroboration that wants decomposing is really part of the argument. Q2's examples are the\nopposite: they are exactly the material a proof node may never depend on, and promoting them\nto lemmas would put a single variety's orbit combinatorics into the chain the main theorem\nrests on. The class is right and the depth limit was wrong.\n\n**Polarity is the field the examples were missing.** All four Q2 example nodes were written\nas tasks — \"the two questions to settle\", \"five things are to be extracted\" — and a reader\ncannot tell from `Q2-e3` whether $\\mathrm{GL}_2/\\mathrm{O}_2$ is expected to confirm the\nconjecture or to kill it. Rule 2 makes the answer a required part of the claim, and where the\nanswer is genuinely unknown the polarity is the conditional itself: *if (i) holds and (ii)\nfails, this is a counterexample* is a proposition with a polarity, where \"here are two\nquestions\" is not.\n\n## Consequences\n\n- `tools/build_dag_site.py`: `NODEREF` accepts `Q\\d+(?:-[Lea]\\d+)+`, so an id may mix\n  segments in any order; `parent_of` becomes \"drop the last segment, `None` at the bare\n  question\", which is what the id grammar meant all along and is shorter than the two-branch\n  form it replaces; `validate` drops the terminal-segment rejection, adds the no-`proof`-under-\n  an-e/a-ancestor rule, and relaxes 0018's dependency rule to admit a node's own descendants.\n- `tests/repo.py` mirrors `parent_of`; `test_layout` accepts the id form. `test_operations`'\n  containment-edge assertion needs no change: it keys on the id *ending* in an e/a segment,\n  so `Q2-e1-L1` correctly falls to the sub-lemma branch and is required to be a real\n  dependency of `Q2-e1`.\n- `.claude/skills/examples/SKILL.md` gains the sentence that started this: a node written\n  from a found instance is a proposition, and the promotion candidate is reported with its\n  polarity and its quoted parent claim. `.claude/skills/decompose/SKILL.md` gains the e/a\n  expansion mode and the role-inheritance rule. `CLAUDE.md` and `process/pipeline.md` record\n  both.\n- First inhabitants: the decompositions of `Q2-e1`–`Q2-e4`.\n\n## Alternatives considered\n\n**Promote `Q2-e4` to a question.** Rejected: a question carries a **Problem statement.** and a\n**Conjecture.** and appears as its own card on the graph. \"What are the orbit combinatorics of\n$L(\\mathrm{Sp}_4\\backslash\\mathrm{GL}_4)$?\" is a computation in service of Q2, not a research\nquestion of the project, and giving it a card would say the project has three goals.\n\n**Keep the terminal rule and split `Q2-e4` into `Q2-e4`…`Q2-e8`.** Rejected: the five\ncomputations are ordered — the Hecke word is chosen using the orbit poset, the costalk is\ncomputed from the Hecke word — so the dependency between them is real, and flattening them\ninto siblings at question level throws away the one piece of structure the decomposition\nexists to record.\n\n**A `polarity:` field rather than a sentence in the statement.** Rejected on the same ground\nas `confidence:` ([0014](0014-confidence-is-three-signed-channels.html)): a field is read\nwithout its reason. \"Negative *if* the sign local system is unreachable\" is the actual\ncontent, and it does not fit in an enum — the statement is where a conditional can be\nwritten.\n";</script>
