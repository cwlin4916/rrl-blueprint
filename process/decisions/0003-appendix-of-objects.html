<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0003-appendix-of-objects</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>ADR 0003 — An appendix of objects replaces tables and bare labels</h1><p class="lead">Generated from <code>process/decisions/0003-appendix-of-objects.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [journal](../journal.html) · [the appendix](../../appendix/index.html)\n\n- **date:** 2026-08-02\n- **status:** accepted\n- **kind:** repository structure; enforces invariants I1 and I6\n\n## Context\n\nObjects the pipeline may invoke lived in two places and in two compressed forms:\n\n- two tables in `blueprint/context.md` — a notation table and a black-box table, each row one line of abridged statement;\n- bare backticked labels, `` `thm:chen_Ti` ``, scattered across the index, the node files and the critiques — roughly 40 distinct labels across 10 markdown files.\n\nNeither form resolves. A table row does not say what the theorem states or what must be checked to use it. A bare label is unreadable to a human skimming the DAG and unresolvable to an agent that has not been handed `main.tex`, and it tolerates typos in silence.\n\n## Decision\n\nOne entry per object in [`blueprint/appendix.md`](../../appendix/index.html), grouped by subject, each carrying an explicit anchor, the kind, the attribution with `main.tex` line, the **full** statement in standard KaTeX, a `role`, the `hypotheses` to check (for black boxes), a `used by` list of citing nodes, and any caveat.\n\nEverywhere else, an object is a **link into that entry**. No bare labels, no object tables. `context.md` keeps only what is *in force* — setting, standing hypotheses, ratified readings, the shape of the argument — and links for everything else. The `main_dag.md` status table becomes one bullet per node.\n\nAnchors are explicit `<a id=\"...\"></a>`, formed by lowercasing the label and mapping `:` and `_` to `-`: `thm:chen_Ti` → `thm-chen-ti`. Headings carry math and backticks and do not slugify stably.\n\n## Consequences\n\n- The closed world of invariant I1 is now a single file you can read end to end. \"May the prover use this?\" is answered by whether an entry exists.\n- Adding a manuscript result to the pipeline is a visible, reviewable act: one appendix entry.\n- Links are checkable. A script verifies every relative link and every anchor across the repo; a bare label never could be.\n- Writing the entries immediately surfaced four defects invisible at table resolution: a broken reference `def:orbits_iwahori_sphe rical` (stray space) in the Q1 setting; the `lem:invrariance_lemma` label misspelled in `main.tex` and needing to be cited with the typo; $\\mathcal{D}^{\\mathrm{ren}}$ defined at main.tex:794 with no label at all, citable only by line; and `p:compact_generation_stable_case` printed without the conclusion of its clause (2).\n- Cost: the appendix must track `main.tex`. If the manuscript changes a statement the appendix goes stale, and nothing detects that automatically. Every entry therefore carries its line number so a human can re-check.\n- The node field `refs` was renamed `objects` and now holds appendix links rather than `main.tex` labels and bib keys.\n\n## Alternatives considered\n\n**Keep the tables, add links from the labels.** Rejected: it leaves the statement abridged at the point of use, which is the actual problem. The reader still cannot see the hypotheses.\n\n**One file per object,** mirroring `nodes/`. Rejected for now: ~40 files whose entries are mostly a paragraph each, with no independent status to track. A single file is greppable and readable end to end, which is what the closed-world rule needs. Revisit if entries start carrying their own state.\n\n**Append the entries to `context.md`.** Rejected: it would roughly triple that file and blur the distinction the split is for — `context.md` says what is in force, the appendix says what things are.\n";</script>
