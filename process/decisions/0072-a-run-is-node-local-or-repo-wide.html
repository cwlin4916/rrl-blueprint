<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0072-a-run-is-node-local-or-repo-wide</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0072 — A run is node-local or repo-wide, a claim covers a subtree, and `/prove` ends by owning the statement</h1><p class="lead">Generated from <code>process/decisions/0072-a-run-is-node-local-or-repo-wide.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Amends:** [0019](0019-the-update-operator.html) (the update operator), [0030](0030-the-prove-budget-cap.html) (the `/prove` budget cap), [0069](0069-the-gates-are-scoped-and-the-batch-closes-once.html) (the gates are scoped and the batch closes once)\n\n## Context\n\nTwo complaints, and they turn out to be one.\n\n**The statement goes stale under the write-up.** `/prove Q1-L3-L2` closed at r4 with a `FAIL` whose flaws were partly the write-up's and partly the statement's. A separate `/update Q1-L3-L2` then took the statement's three — among them a torus rebound from $T$ to $S$ — and `proof.md` still says $T$. Nothing reconciled the two, and nothing on the node said so either: the site's *revised and not yet re-proved* chip is computed as `updates and status == \"open\"`, and `/update` resets to `open` only from `drafted` or `proved`, never from `failing`. So the one shape that actually holds a superseded write-up is the one shape the flag cannot fire on. Twenty-one nodes carried the chip and **not one of them had a `proof.md`**; Q1-L3-L2 had the superseded write-up and did not carry it.\n\n**Two sessions cannot work at once without stepping on each other.** [ADR 0069](0069-the-gates-are-scoped-and-the-batch-closes-once.html) removed the operator commit and gave the batch a single close, which fixed the build. It left two races. `tools/batch.py claim` locked an **exact id**, so `claim Q1-L3` did not stop `claim Q1-L3-L2` — and `/prove Q1-L3` reads every child's `## Statement` while `/update Q1-L3-L2` rewrites one, which is a read–write race on a sentence. And `/update` writes `blueprint/priorities.md`, `blueprint/main_dag.md` and `process/` in §6–§8 whatever its argument, so two targeted runs on unrelated subtrees still collided on three shared files.\n\nThe connection: both are about **which files a run owns**. A run that does not know its own write set cannot be run beside another one, and cannot be trusted to leave the node it touched in a consistent state.\n\n## Decision\n\n**1. A claim covers a subtree.** A node's directory contains its children's ([ADR 0059](0059-a-container-is-a-directory.html)), so `tools/batch.py claim <id>` now locks everything under `<id>`. Two claims are compatible exactly when neither id is a **segment**-prefix of the other — segment-wise, so `Q1-L3` does not cover `Q1-L30`. `tools/batch.py plan <id> …` makes the test visible: it groups the nodes you want to work on into waves that may run simultaneously, and names the blocker for each node it holds back. `/prove` §1 and `/update` §1 both open by claiming.\n\n**2. A run is node-local or repo-wide, and the argument decides.** `/update <id>` runs §1–§5 and writes inside `<dir>` only; anything it finds that reaches past the node goes into its `u<n>.md` for a repo-wide run to pick up. `/update` with no argument runs §1–§9 and is the only shape that writes `main_dag.md`, `priorities.md` or `process/`, or launches the lead-researcher. A node-local run may edit its own question's framing if it first claims the question, which locks the whole question and is the honest price.\n\n**3. `/prove` ends by reconciling the statement it just tested** (new §3g). Every standing flaw is sorted into four owners — the write-up's (another round), the statement's (`/update`), the appendix's (a widening or a `GAP`), and the cut's (`/decompose`) — and the statement-owned ones are acted on **in the same invocation**, by running §2, §4 and §5 of `/update` on that node. `/update` has no subagent, so this costs no agent budget.\n\n**4. It does not re-prove.** The budget cap counts rounds per invocation, and the statement has just changed, so the next round wants a fresh packet and is a fresh invocation. What the stage buys is not a proof; it is that the node stops sitting `failing` against a statement everyone already knows is wrong.\n\n**5. The supersession flag is computed from the drift, not from the status.** `lemma_drifted()` in `tools/build_dag_site.py` makes the same `## Lemma` vs `## Statement` comparison as `check_render.py` §11, so the chip and the gate note agree by construction. The gate now labels the drift by cause — *prover drift* when the node has no `updates/`, *superseded by `u<n>`* when it has — because the two have opposite remedies.\n\n## Consequences\n\nThe remedies genuinely differ, which is why labelling them was worth the code. Prover drift is fixed by pasting the statement in: the steps were written against it and only the transcription slipped. Supersession must **not** be fixed that way — pasting the new statement over the old one leaves the steps proving the old claim under the new heading, which is the same defect with the evidence removed. So one is a free re-sync and the other is a rebuild, and a gate that printed one sentence for both was telling half its readers to do the wrong thing.\n\n`/prove` now writes a `## Statement`, through `/update`'s §4. This does not weaken [ADR 0019](0019-the-update-operator.html): the rule that mattered was never *which command was typed* but that a statement change is verified against the repository rather than taken from a referee, recorded in an append-only `u<n>.md`, and disclosed in the node's history. §3g does all three and says so. What the rule was protecting against was a prover quietly widening a claim to fit its argument, and the prover is a subagent that still never touches the node file.\n\nThe cost is that a `/prove` invocation is longer and does two kinds of work. Against that: the alternative is two invocations, the second of which re-reads the whole record to rediscover what the first already knew, and which has historically not been run at all — Q1-L3's own [u1](../../nodes/Q1/Q1-L3/updates/u1.html) commissioned a child on 2026-08-06, said in its own words that the input was \"now cut out as a child\", and no child existed a day later.\n\nParallelism is now bounded by the shape of the tree rather than by the machinery. Q1-L3 and Q1-L5 are disjoint subtrees and may run at once; Q1-L3 and Q1-L3-L2 may not, and the reason is not conservatism but that one reads what the other writes.\n\n## Alternatives considered\n\n**Have `/prove` re-prove after reconciling.** It is what \"does not go stale\" most literally asks for, and it busts the budget cap: three rounds in one invocation, the third against a statement the run wrote itself. Round 3 has never been reached on any node in this repository, and the first two cost ~270k and ~800k subagent tokens.\n\n**Re-sync the `## Lemma` block mechanically and call it reconciled.** Cheap, gate-green, and dishonest — the drift disappears from the gate while the argument underneath still proves the old claim. Rejected explicitly, and the gate now prints the reason where a future operator will read it.\n\n**A finer lock than the subtree — per file, or reader/writer.** A prover reads statements and a reviser writes them, so a proper reader/writer lock would let `/prove Q1-L3` and `/update Q1-L3-L2` overlap in the safe direction. It also needs every operator to declare its read set accurately, which is the thing operators are worst at. The subtree rule is coarse, wrong only in the conservative direction, and computable from the id alone.\n\n**Split `priorities.md` into a directory, one file per run, merged at close.** In the repository's own idiom ([ADR 0059](0059-a-container-is-a-directory.html)) and probably right eventually. Not now: the panel is a single *ranked* list, and ranking is the one operation a merge cannot reconstruct from the parts.\n";</script>
