<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0066-an-undefined-notion-in-a-statement-is-a-gate-note</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0066 — An undefined notion in a statement is a gate note</h1><p class="lead">Generated from <code>process/decisions/0066-an-undefined-notion-in-a-statement-is-a-gate-note.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0052](0052-a-definition-inside-a-statement-carries-no-claim.html) (a definition inside a statement carries no claim), [0050](0050-a-node-has-at-most-ten-children.html) (the precedent for a note rather than a failure)\n\n*Numbering:* 0065 was in flight in a concurrent session when this was written and is not this record's to take.\n\n## Context\n\n[Q2-L3](../../nodes/Q2/Q2-L3/index.html) reached `proved` on a `PASS` while three of its four\nhypotheses quantified over $\\operatorname{supp}$ and over \"the full subcategory of objects supported on\n$\\partial\\overline{LX}_\\lambda$\" — a notion no appendix entry defines and that the closed world therefore\ndoes not contain.\n\nEvery gate passed it, and every gate was right to. The write-up was valid: hypothesis (D)'s support\nconclusion was hypothesis (B)'s hypothesis *verbatim*, and (B)'s conclusion was (C)'s left-hand side\n*verbatim*, so the argument matched the symbol at each step and never had to unfold it. Under any single\nfixed reading of the word, the implication holds. The render gate checks a write-up against its statement\nand the closed world it declares; nothing checked whether the *statement itself* was made of things that\nexist.\n\nThe round-1 critic found it, by grepping the appendix by hand, and disposed of it correctly as a finding\nfor the lead-researcher rather than a defect in the proof ([r1](../../nodes/Q2/Q2-L3/critiques/r1.html),\nFlaw 3). It then had nowhere to go: a `MINOR` flaw under a `PASS` is disposed of by the verdict, and the\nnode carried on as the repository's evidence that the sufficiency route works. What it actually was, for a\nday, is a correct implication three of whose antecedents were not yet propositions — so no node could be\ncharged with them, and the compatibility [Q2-L4](../../nodes/Q2/Q2-L4/index.html) and\n[Q2-L5](../../nodes/Q2/Q2-L5/index.html) would eventually have to check between \"the\n$\\operatorname{supp}$ of (D)\" and \"the $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ of (C)\" was exactly\nwhat the write-up got for free.\n\n[0052](0052-a-definition-inside-a-statement-carries-no-claim.html) is the mirror image of this and was not\nenough on its own. It stops a coining clause from smuggling a *claim* in beside a symbol. It says nothing\nabout a statement resting on a *word* that was never coined at all.\n\n## Decision\n\n**Where to look.** `\\operatorname{…}` is the LaTeX construct whose entire job is to name an operator, so a\nname inside one is a notion the statement is asking the reader to already have. `--check` collects those\nnames from every `## Statement` and tests them against `STANDARD_OPERATORS` in\n`tools/build_dag_site.py` — the standard mathematics [I1](../pipeline.html#4-invariants) lets a proof use with\nno citation.\n\n**The list is short, and `supp` is not on it.** `Hom`, `Map`, `Spec`, `Lie`, `im`, `ker`, `coker`, `fib`,\n`cofib`, `colim`, `dim` and their kind are notation. A theory of supports on an ind-scheme of infinite type\nis a theory: it needs a definition, and which definition is a real choice with consequences for whether\n(B) and (C) can be discharged at all. Putting `supp` on the allowlist would have made the gate agree with\nthe mistake.\n\n**A note, not a failure**, for the reason [0050](0050-a-node-has-at-most-ten-children.html) gives about the\nwidth cap: nineteen uses of `\\operatorname{supp}` remain in node statements across the repository, and a\nbuild that failed until each had an appendix entry would stop every unrelated proof over a vocabulary\nproblem the run in front of it did not create.\n\n## What the rule is not\n\nIt is not a claim that the check is complete. A statement can rest on an undefined notion written as prose\n(\"supported on\", \"in general position\") or as `\\mathrm{…}`, and neither is caught — `\\mathrm` carries\n$\\mathrm{Sat}$, $\\mathrm{ren}$, $\\mathrm{IC}$ and several hundred other legitimate uses, so testing it\nwould drown the note in noise. The check buys the cheapest slice of the problem, and the invariant it\nrecords is the part that binds on a human: **a statement may invoke only what the appendix defines, what it\ndefines itself, and standard notation.**\n\n## Consequences\n\n- `tools/build_dag_site.py --check` gains one note per offending node, naming the operator and the three\n  ways out: define it in the statement, link an appendix entry, or drop it.\n- [Q2-L3](../../nodes/Q2/Q2-L3/index.html) was revised the same run\n  ([u2](../../nodes/Q2/Q2-L3/updates/u2.html)) and no longer trips it. The repair needed no support\n  theory: **(H1)** already supplies the restrictions $i_\\mu^!$, so the boundary subcategory is *defined* as\n  the objects those restrictions kill, indexed by the closure order rather than cut out of a space.\n- The other eighteen uses stand, each now named on every `--check`.\n- The invariant is [I33](../pipeline.html#4-invariants).\n";</script>
