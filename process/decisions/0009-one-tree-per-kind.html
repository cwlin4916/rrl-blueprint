<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0009-one-tree-per-kind</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0009 — One tree per kind, and every fact stored once</h1><p class="lead">Generated from <code>process/decisions/0009-one-tree-per-kind.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-03\n**Status:** accepted\n**Amends:** [0002](0002-one-file-per-node.html) (status was written twice on purpose),\n[0005](0005-node-directories.html) (critiques lived outside the node directory),\n[0008](0008-one-page-per-object.html) (`docs/` held hand-written prose)\n\n## Context\n\nThe repo had grown seven top-level directories whose kinds overlapped, and a reader could\nnot tell from a path who was allowed to write there.\n\nThree trees were keyed by node id — `blueprint/nodes/<id>/`, `drafts/critiques/<id>-r<n>.md`\nand `docs/nodes/<id>/` — so \"everything about a node is in one directory\"\n([I9](../pipeline.html#4-invariants)) was true only of the first, and a critique was reached\nfrom its own node by `../../../drafts/critiques/`.\n\n`docs/` was half source and half artifact: `pipeline.md`, `journal.md`, `decisions/` and a\n`README.md` were written by hand, the other ~85 files were generated, and\n`docs/vendor/katex.min.js` was checked in but never regenerated. No sentence described\n`docs/` truthfully, so [I8](../pipeline.html#4-invariants) — never read from a generated\nartifact — could not be applied by looking at a path.\n\nAnd the index in `blueprint/main_dag.md` repeated, for every node, the title, type, status\nand dependency list already in that node's `node.md`. The file said so out loud: *\"A node's\nstatus appears twice — here and in its `node.md` — and the two copies must agree;\n`/research-status` checks them and reports drift.\"* Two of the pipeline's checks and one\nwhole step of `/research-status` existed to police a duplication we had chosen to create.\n\n## Decision\n\n**One tree per kind.** `blueprint/` is all reasoning — appendix, context, index, nodes, and\nnow `literature/` and `questions/` too. `process/` is how the pipeline works. `docs/` is\nthe site. The manuscript stays at the root, machinery in `tools/` and `.claude/`.\n\n**Critiques move into the node.** `blueprint/nodes/<id>/critiques/r<n>.md`. Rounds are\nnumbered `r1`, `r2`, … and never restart: a node re-opened and re-proved continues at the\nnext free round, so the directory shows the whole history rather than the latest attempt.\n\n**`docs/` is generated in full**, vendored KaTeX included. KaTeX is checked in under\n`tools/vendor/` and copied at build time, so `rm -rf docs && python3 tools/build_dag_site.py`\nreproduces the site exactly and `--check` compares every byte of it.\n\n**Every fact is stored once.** A node's status lives in its `node.md`. The bullets and the\ntally in `main_dag.md` are generated from the node files, between `BEGIN INDEX` and\n`END INDEX` markers, on every build. `ready` and `blocked` are not stored at all: they are\nfunctions of the dependency statuses, computed where they are displayed. A `node.md` stores\nonly `open`, `drafted`, `failing`, `proved`, and `--check` rejects anything else.\n\n## Alternatives considered\n\n**Keep the duplication and keep checking it.** The position [I5](../pipeline.html#4-invariants)\noriginally took: redundancy that is checked is documentation. It is not. Every writer of the\nindex — the lead-researcher, the `/prove` orchestrator, `/research-status` — had to be told\nto update two places, and the check only told us afterwards when one of them forgot. Deriving\nthe index deleted a check, two write-back steps, and a whole reconciliation phase.\n\n**Generate the index into `docs/` only, leaving `main_dag.md` narrative.** Simpler to build,\nbut the index is the thing a human scans when deciding what to prove next, and it would have\nstopped existing in the tree they read. Generating *in place*, between markers, keeps the\nreadable file and still has one source.\n\n**Leave critiques in `drafts/`.** Cheaper, and it kept the critic's write boundary obviously\nseparate. But the boundary is a path prefix either way, and `nodes/<id>/critiques/` is just\nas enforceable while making I9 true instead of aspirational.\n\n**Leave vendored KaTeX in `docs/`.** One less copy step. Rejected because it made \"all of\n`docs/` is generated\" false in exactly one place, which is the kind of exception nobody\nremembers at the moment it matters.\n\n## Consequences\n\nSix top-level kinds, each with one sentence saying who may write there, and the answer to\n\"is this generated?\" is now visible from the path alone.\n\n`/research-status` lost its reconcile phase; `/prove` lost its index write-back and its\n\"flip the dependents to open\" step; `/decompose` no longer writes bullets or sets a parent\nto `blocked`. Three agent definitions and four skill files changed to match.\n\nThe costs: `blueprint/main_dag.md` is now partly machine-written, which is a new thing to\nrespect — hand-edit inside the markers and the next build silently reverts it, so `--check`\nfails while it is stale. KaTeX is stored twice in the working tree (git dedupes the blobs,\nso the repository does not grow). And moving files rewrites the relative links inside them:\n`critiques/r3.md` had one link to the appendix that had to be repointed, the only edit ever\nmade to a critique, and one that changes no claim.\n\nTwo defects surfaced during the move and are worth recording. The root and per-node\n`.latexmkrc` sent the same write-up to two different output directories, so the second\ncompile found the first's stale `.bcf` and biber failed — both now route to `build/nodes/`,\nand `build/` holds the manuscript alone. And the schema comment in `main_dag.md`, which\ndocuments the new markers, contained a literal `-->` and so terminated itself early, dumping\nthe rest of the schema onto the page as live markdown. The link checker caught it. That is\nthe third time a gate over a repo that documents its own conventions has been confused by\nthe documentation of those conventions.\n";</script>
