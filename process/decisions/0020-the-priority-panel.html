<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0020-the-priority-panel</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0020 — The priority panel</h1><p class="lead">Generated from <code>process/decisions/0020-the-priority-panel.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Extends:** [0014](0014-confidence-is-three-signed-channels.html) (what the site derives),\n[0019](0019-the-update-operator.html) (`/update` maintains the stored half)\n\n## Context\n\nThe site could show what every node *is*, and nowhere what to *do next*. Warnings were\nscattered: a negative confidence was a red tint on one card, an undischarged hypothesis a\nsentence inside `examples.md`, a missing appendix entry a line in a journal entry, and\nthe user's own sense of what matters most lived in no file at all. The user asked for a\nright-hand panel listing what LLM and human judge most important to address, with the\nwarnings, in a colored hierarchy — and for `/update` to maintain it.\n\n## Decision\n\n**One stored file, one derived layer, one panel.**\n\n- **`blueprint/priorities.md`** is the stored half: a ranked list of priorities, each\n  one line with a machine-readable head —\n\n  ```\n  - **P<k>** · **red|amber|yellow|info** · by **llm|human** · <markdown link to the target> — why, in one sentence · added YYYY-MM-DD\n  ```\n\n  Severity is the hierarchy: **red** = something believed wrong or blocking the argument\n  (refuted claim, standing counterexample, statement known false as stated); **amber** =\n  a correctness risk not yet resolved (revised statement awaiting re-proof, undischarged\n  hypothesis, missing appendix entry a node needs); **yellow** = the most valuable next\n  work (frontier nodes worth proving, decompositions worth running); **info** = context\n  worth keeping visible. `by` records whose judgement ranked it: `llm` rows are written\n  and re-ranked by `/update`; `human` rows only the user writes or reorders, and\n  `/update` may not edit or delete them.\n\n- **The derived layer** is recomputed by `tools/build_dag_site.py` at every build, never\n  stored: `failing` nodes and standing flaws; negative-confidence nodes with the channel\n  that went negative; `gap`/`counterexample` evidence verdicts; statements revised and\n  not yet re-proved (an `updates/` directory newer than the last critique); blocked\n  chains and silent channels. Stored rows say what someone judged; derived rows say what\n  the record shows; the panel shows both, derived warnings under the judged priorities,\n  each with its severity colour.\n\n- **The panel** renders on the right-hand side of the hub (`index.html`), as a section\n  of the DAG page's side panel before a node is selected, and as its own page\n  (`priorities.html`). Severity colours reuse the confidence hues (red/green already in\n  the palette) plus an amber; colour-blind readers get the severity word, not only the\n  colour.\n\n- **Nothing cites it.** Like confidence, the panel is a reading aid derived from (and\n  outside) the record: no proof, node, appendix entry or gate may reference a priority.\n  Deleting `blueprint/priorities.md` loses only judgements, never mathematics.\n\n## Justification\n\n**Stored and derived must be separate, because one is a judgement and one is a fact.**\n\"Q1-L5's statement was corrected and its proof does not exist yet\" is derivable and\nshould never be hand-maintained (I5: derive, don't store). \"Re-prove Q1-L5 before\ntouching Q1-L6\" is a ranking — model output or human will — and must be stored, signed\nby whoever judged it, because nothing in the record implies it.\n\n**`/update` maintains it because `/update` is where assessments change.** The operator\nthat revises statements is the one that knows what the revision made urgent; having it\nrefresh the `llm` rows on every run keeps the panel current without a new command.\n\n## Consequences\n\n- `tools/build_dag_site.py` parses the file, computes the derived layer, and renders the\n  three surfaces; `--check` fails on a malformed priority line, an unknown severity, or\n  a target link that resolves to nothing.\n- The write discipline gains a line: `blueprint/priorities.md` is written by the\n  `/update` orchestrator and the user, no one else; `human` rows are the user's alone.\n- Invariant I16 records the split; `operations.md` carries the $\\mathsf{Prio}$ type.\n- Cost accepted: `llm` rows are model judgement on the record. They are marked as such,\n  carry dates, and rank nothing but attention — the confidence machinery of 0014 is\n  untouched by them.\n\n## Alternatives considered\n\n**Derive everything.** Rejected: the panel's point is triage, and the repo stores no\nfact from which \"most important\" follows; deriving a ranking from severity counts alone\nreinvents the judgement while hiding whose it was.\n\n**Store everything.** Rejected: hand-maintained copies of derivable warnings drift\n(I5), and a stale warning teaches the reader to ignore the panel.\n\n**A GitHub-issues-style directory, one file per priority.** Rejected for weight: a\npriority is one line with a link; the panel is a list, not a tree, and ranking means\none file where order is visible.\n";</script>
