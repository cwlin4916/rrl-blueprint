<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0092-tightens-goal-is-comprehension-and-its-specification-is-open</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0092 — `/tighten`&#x27;s goal is comprehension, and its specification is open</h1><p class="lead">Generated from <code>process/decisions/0092-tightens-goal-is-comprehension-and-its-specification-is-open.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-09\n**Status:** accepted\n**Supersedes:** the specification half of [0083](0083-tightening-is-its-own-operator.html) (tightening is its own operator). The operator, its slot in the order against `/decompose`, and its write permissions stand.\n**Relates to:** [0060](0060-a-write-up-has-two-budgets.html) (a write-up has two budgets), [0031](0031-presentation-is-a-stage-not-a-command.html) (presentation is a stage), [0043](0043-a-proof-step-is-one-claim.html) (a proof step is one claim).\n\n## Context\n\n[ADR 0083](0083-tightening-is-its-own-operator.html) built `/tighten` around a number. A run cut restatement of the appendix down to the link, froze the `## Lemma` block and every `**Step n — …**` headline byte for byte, and failed unless the word count strictly fell.\n\nThe freeze is a good gate. It is mechanical, it reads what is on disk, and it makes *shortened a proof* and *lost one* tell apart by `git diff` — which is exactly what a gate should do.\n\nIt was gating the wrong thing.\n\n```\nwhat we want ....... a write-up a reader can follow\nwhat we measured ... a write-up with fewer words in it   ⛔\n```\n\nShortening is one guess at what makes a write-up comprehensible. It is a plausible guess — most of what came out of the first run was genuinely restatement — but it is not the goal, and the two come apart in both directions. A write-up can lose four hundred words and become harder to follow, because what came out was the sentence that oriented the reader. A write-up can gain two hundred and become easy, because what went in was the one example that fixes the notation.\n\nThe number was chosen because it was measurable, which is the failure mode [ADR 0060](0060-a-write-up-has-two-budgets.html) already recorded one turn of: a 900-word cap became a target, and seventeen of twenty-seven write-ups sat between 866 and 900. Measuring the wrong thing does not stop at not helping. It moves the work.\n\n## Decision\n\n**The goal is stated and the specification is removed.**\n\n`/tighten <node-id>` exists to make one node's write-up comprehensible: a reader opens `proof.md` cold, reads it once, and comes away knowing what the node claims and why it holds.\n\n`.claude/skills/tighten/SKILL.md` carries that sentence and no steps. The command does not run; an invocation says so and names the operator that is wanted instead. The prior specification stays in git.\n\n**A collaborator writes the replacement.** It is question **b** of [`process/todo.md`](../todo.html), and the two pages it needs are [`process/pipeline/writing-a-skill.md`](../pipeline/writing-a-skill.html) — the guideline, with [`/decompose`](../../skills/decompose.html) as the worked example — and [`process/pipeline/operators/tighten.md`](../pipeline/operators/tighten.html), which states the four constraints any specification has to meet.\n\n## Consequences\n\n**We lose a working operator to keep an honest one.** Nothing tightens write-ups until someone specifies it. That is the cost, it is paid deliberately, and the alternative — leaving a command that optimizes a proxy — costs more the longer it runs.\n\n**The four constraints are the actual content of this record.** A specification must define comprehensible so that a run can *fail*; must leave every claim on the page; must let something other than the run check both; and must touch no `## Statement`. The old freeze satisfied the second and third. A replacement needs its own answer, not necessarily that one.\n\n**Nothing else moves.** `/tighten` before `/decompose`, still. `proof.md`, `examples.md` and one history entry, still — and `## Statement`, `status:` and `needs:` still [`/update`](../pipeline/operators/update.html)'s alone. The checker still cannot do this job: it is content-preserving, and reformatting an unclear paragraph leaves an unclear paragraph.\n\n**The skill files are now readable as pages.** `.claude/skills/*/SKILL.md` renders under `blueprint_site/skills/`, because the to-do asks a collaborator to go and read one by path and a request to read a file should land somewhere other than a raw file.\n\n## Alternatives considered\n\n**Keep the word gate and add a comprehension check beside it.** Rejected: the second check is the hard one, and building it is the whole task. Adding it to a command whose success condition is still a number leaves the number in charge.\n\n**Specify it ourselves.** Rejected for this pass. The operator's failure was a specification written from what could be measured rather than from what a reader needs, and the reader here is a mathematician who is not us. Asking one is cheaper than guessing again.\n\n**Delete the operator.** Rejected. The need is real and [ADR 0060](0060-a-write-up-has-two-budgets.html) named it: a write-up accrues borrowed text across a prover run and four referee rounds, and no single round is the moment to notice. Removing the command would lose the slot as well as the specification.\n";</script>
