HTML comments.\n\nThree costs, and the third is the one that produced a defect.\n\n**A question had no history.** `Q1`'s Setting suspended [the three standing hypotheses](../../appendix/assum-intro.html)(c) on 2026-08-06 because the goal question was otherwise answering itself; `Q2`'s standing hypothesis narrowed from three clauses to one; `Q3` was cut out because two questions were assuming a package neither was asking about. Every one of those is exactly the kind of event a node's `<id>_history.md` exists to record, and there was nowhere to record it. They survive today only because a priority row happened to mention them.\n\n**A question had no portable prompt.** [ADR 0029](0029-every-node-has-a-generated-self-contained-prompt.html) gave every node a packet a reader outside the repository can work from. The four objects a reader outside the repository would most want to be handed — *here is the problem, here is what we believe, here is where we are stuck* — were the four that had none.\n\n**A question was not self-contained, and the parser is why.** The site read the framing with a regex that ended a block at a blank line followed by a capital letter, a bold, or a list bullet. So every continuation paragraph in every question had to open lowercase, which is visible throughout the pre-0084 file: *\"an answer is a condition on the orbit geometry of $LX$\"*, *\"the right-hand side is the Satake subcategory\"*. A storage format was dictating sentence case.\n\nThe same pressure to keep framing blocks short is what left `Q2` citing \"**(H1)**–**(H3)** of [Q1-L5](../../nodes/Q1/Q1-L5/index.html)\" instead of stating them. `Q3` and `Q4` both write the three hypotheses out in full; `Q2` assumed one of them throughout and named the other two at the point of use, and a reader could not tell which was which without opening a node in another question. That is not a formatting complaint: [Q2-L1](../../nodes/Q2/Q2-L1/index.html)'s standing flaw records that the question had declared all three standing when its Problem statement needs **(H1)** alone, and had then offered a reformulation of its own membership as a condition on $X$ answering it. A question that borrows its hypotheses by reference is a question nobody can check.\n\n## Decision\n\n**A question is a node.** `blueprint/nodes/Q<n>/` gains `Q<n>_node.md`, `Q<n>_history.md` and a generated `Q<n>_prompt.md`, named for the question exactly as a lemma's files are named for the lemma. The id is still the path, and the question is still the head of its own chain — the chain now starts at a file rather than at an empty directory.\n\n**The framing moves into the node file, and `main_dag.md` becomes the index it is named for.** Each question section keeps its anchor, its heading, a pointer into the node file, and the generated block. Nothing about the framing changed in content; the sections are `Goal` (optional, at most one in the repository), `Feeds` (optional), `Setting`, `Problem statement`, `Conjecture` and `Pipeline` ([ADR 0085](0085-the-pipeline-replaces-the-priority-panel.html)).\n\n**Sections replace the bolded run-in labels, so a paragraph may open with a capital letter again.** `## Setting` ends where `## Problem statement` begins. The lowercase-continuation convention is gone from the repository, and the gate no longer needs it.\n\n**A question is self-contained.** Every hypothesis it spends is written out in its own `## Setting`, never cited as \"the package of some node\". One question may hold the canonical statement and say so, and the others repeat it in full and say which is canonical — [Q3](../../nodes/Q3/index.html) holds **(H1)**–**(H3)**, and [Q2](../../nodes/Q2/index.html) and [Q4](../../nodes/Q4/index.html) restate them. Repetition is the price and it is worth paying: a hypothesis a reader has to go and fetch is a hypothesis a reader does not check.\n\n**A question carries no `status:`, no `role:` and no `objects:`.** Its state is the tally over its nodes and its confidence is derived, both generated into `main_dag.md`; `proof | evidence | example | analogy | consequence | thought` classifies a claim, and a question is not one; and a question states a problem rather than invoking a closed world. What it does carry is `type: question`, `created:` and the user's `human:`.\n\n**The question prompt answers a different reader from a lemma's.** A lemma packet says *prove this*. A question packet carries the framing, the pipeline, the appendix vocabulary the framing invokes, the bench, and a one-line-per-node readout of where the argument stands — and it carries no target statement, because a question has no claim to prove. It asks what would answer the question and which of the planned next actions is misjudged.\n\n## Consequences\n\n**`node_dirs()` excludes question directories.** They match the same naming rule, and counting one among the nodes would put a statusless row in every tally. `parse_questions` reads them instead.\n\n**The site mirrors the source tree here as everywhere ([ADR 0016](0016-the-site-mirrors-the-source-tree.html)):** `blueprint_site/nodes/Q<n>/index.html`, `history.html`, `prompt.html`. The per-question graph at `dag/q<n>.html` is unchanged.\n\n**`--check` gained the shape rules:** the required sections, the banned fields, an ISO `created:`, a history on disk, and a question node file for every question that has nodes hanging off it. The render gate's one-section rule now skips question node files, since `## Statement` is the wrong shape for a problem.\n\n**Question prompts are written before the pages are built.** A question's prompt page renders from the markdown on disk, unlike a node's, which renders from memory — writing it afterwards would leave the page one run behind its source.\n\n**`main_dag.md` went from 582 lines to 361,** and what is left in it is an index plus four generated trees.\n\n## Alternatives rejected\n\n**Generate `Q<n>_node.md` from `main_dag.md`.** Rejected. It is the smaller diff, and it puts the authored text in the file that is not the node and the readout in the file that is. A question would then have a node file no operator may edit and a `## Pipeline` needing a separate authored home, which is two homes for one question's judgements — the arrangement [ADR 0077](0077-the-ask-is-a-line-on-the-node.html) removed for `needs:`.\n\n**Give questions node files and leave the framing where it was.** Rejected: two copies of the Setting, kept in step by nobody. Every fact is stored once.\n\n**Put **(H1)**–**(H3)** in one appendix entry and have every question link it.** Tempting, and it is the move [ADR 0060](0060-a-write-up-has-two-budgets.html) says compounds. Rejected here because the appendix is the *closed world* — an entry there is available to every proof in the repository, and these three are hypotheses under test, not established objects. [Q3](../../nodes/Q3/index.html) exists precisely to ask for which $X$ they hold. Admitting them to the appendix would make the thing being asked about citable in the arguments that assume it.\n\n**Do Q1 and Q2 only, as asked.** Rejected. A schema half-applied cannot be enforced by the gate, and `main_dag.md` would hold two shapes at once for as long as it took to finish.\n";</script>
