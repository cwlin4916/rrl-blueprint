<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0022-update-proposes-nodes-from-failures</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0022 — `/update` proposes nodes from failures, and commissions their creation</h1><p class="lead">Generated from <code>process/decisions/0022-update-proposes-nodes-from-failures.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Extends:** [0019](0019-the-update-operator.html) (the update operator), [0021](0021-example-and-analogy-nodes-nest.html) (nested e/a nodes), [0020](0020-the-priority-panel.html) (the panel)\n**Supersedes:** 0019's rejected alternative \"Let `/update` also create nodes\" — in its\nnew form the rejection's reason no longer applies\n\n## Context\n\n0019 gave the pipeline supersession: a statement found wrong can now change, with a\nseam. What it deliberately withheld was *creation*: a failure whose remedy is a missing\nnode — an undischarged hypothesis that deserves its own lemma, a repair step a\ncounterexample forces, a boundary instance that would discipline a statement — could\nonly become a priority row naming `/decompose`, waiting for someone to run it. The\nfirst real update run showed the gap at once: the Q1-L5 counterexample forced a\ncorrected statement whose new support-cutting condition is exactly a missing claim,\nand the `/examples` run on the same node surfaced a false hypothesis in Q1-L4 with\nnowhere to put the repair. The user asked for the loop to close: `/update` should\nevaluate what succeeded and what failed, and propose new nodes with justification.\n\n## Decision\n\n**`/update` gains a failure audit (§6 of its skill) that ends in commissions, not\ncreations.** In `operations.md`'s notation its signature grows a factor:\n\n$$\n\\texttt{/update} : (\\mathsf{Ques} + \\mathsf{Node}) \\times \\mathsf{Input}^{?} \\rightsquigarrow \\mathsf{Stmt}' \\times \\mathcal{P}(\\mathsf{Upd}) \\times \\mathcal{P}(\\mathsf{Node})_{\\text{via lead}} \\times \\mathsf{Prio}\n$$\n\n- **The audit weighs the whole record**: `failing` statuses and standing FAIL verdicts,\n  `EVIDENCE: gap` / `counterexample` lines, negative `human:` judgements, hypotheses\n  that `updates/` counterexamples showed false, statements revised and not re-proved —\n  *against* what the proved chain already covers.\n- **A proposal is earned, not automatic.** Only a failure that names a crisp missing\n  claim becomes one; the rest stay priority rows. A proposal states its attach point,\n  id class (`-L` step of a proof, `-e`/`-a` corroboration per 0021), role, exact\n  statement, and a justification linking the failure it answers — the critique round,\n  the `EVIDENCE:` line, the `u<n>.md` — plus why no existing node carries the claim.\n- **The operator's hand still creates nothing.** Accepted proposals are handed verbatim\n  to the lead-researcher (one launch per run), which creates directories, ids, edges\n  and appendix entries under its own unchanged rules. The justification travels into\n  the new node's `## Remark`; the run's report, the journal entry, and an amber/yellow\n  priority row per commissioned node leave the trail.\n\n## Justification\n\n**0019's rejection was of the wrong thing, and its reason is preserved.** What 0019\nrefused was `/update` *writing* nodes — \"creation is the lead-researcher's, and keeping\nit so preserves the one-writer-per-artifact discipline\". Commissioning keeps that\ndiscipline to the letter: the lead-researcher remains the only writer of node\ndirectories, and gains nothing it did not have under `/decompose`. What changes is only\nwho may put work on its desk, and that was never the invariant.\n\n**The audit belongs to `/update` because `/update` is the only command that reads the\nwhole record.** `/prove` sees one node, `/examples` one node's literature, the panel\nsees severities. Evaluating \"what succeeded, what failed, what claim is missing\" is a\nwhole-tree judgement, and the operator already makes whole-tree judgements under a\nverification discipline — the proposal is the same act as a revision, pointed at a hole\ninstead of an error.\n\n**Justification is load-bearing, not decoration.** A node whose Remark says which\nfailure it answers can be audited later the way a statement revision can: if the\nfailure dissolves (the hypothesis was fine after all), the node's reason-for-being is\non its face, and retiring it is a human decision made with the record open.\n\n## Consequences\n\n- `.claude/skills/update/SKILL.md` §6 is the operating procedure; the lead-researcher's\n  materialization mode accepts commissions and writes the justification Remark.\n- `operations.md`: the `/update` row's signature and state action grow the commissioned\n  factor; §8's reading stays — creation still flows through one writer.\n- The one-shot risk 0019 named compounds: a wrong verification could now wrongly\n  *commission* as well as wrongly revise. Same mitigation, same trail — the proposal's\n  justification is written before the launch, the journal records what was rejected,\n  and `human:` outranks every automated judgement on the result.\n- Not taken up: letting `/update` retire nodes the audit finds redundant. Deletion of\n  accepted artifacts stays a human move (operations.md §8, deliberately missing).\n\n## Alternatives considered\n\n**Have `/update` write the nodes itself.** Rejected for 0019's original reason: two\nwriters of one artifact class is how write discipline ends, and the audit gains nothing\nby holding the pen.\n\n**Route proposals through the priority panel only (status quo).** Rejected by the\ndriver: a panel row is advice to a future run; the failure audit is already the\nwhole-repo read that run would have to repeat, so the deferral buys no safety — only\nstaleness between the judgement and the act.\n\n**A separate `/repair` command.** Rejected: it would re-read everything `/update` just\nread and share its verification discipline verbatim; a seventh command whose §1–§4 are\na copy of the sixth's is a maintenance seam, not a boundary.\n";</script>
