<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0058-importance-is-derived-and-sizes-the-card</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0058 — Importance is derived, and it sizes the card</h1><p class="lead">Generated from <code>process/decisions/0058-importance-is-derived-and-sizes-the-card.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0014](0014-confidence-is-three-signed-channels.html) (confidence is three signed channels), [0042](0042-confidence-shows-its-working.html) (confidence shows its working), [0039](0039-one-graph-for-every-question.html) (one graph for every question), [0020](0020-the-priority-panel.html) (the priority panel)\n\n## Context\n\nEvery card on the graph is the same size. That is a claim, and it is false: the nodes are\nnot equally load-bearing. [Q2-L1](../../nodes/Q2/Q2-L1/index.html) is the node\n[Q2](../../dag.html)'s **Problem statement** names at strength *necessary\nand sufficient*, and the node its **Feeds.** paragraph names as what discharges\n[Q1](../../dag.html)'s criterion — it is, on the record, the answer to its\nown question and the bridge to another one. It draws at 244px, exactly like a leaf nobody\nhas cited.\n\nThe repository already stores two judgements *about* nodes. Confidence\n([0014](0014-confidence-is-three-signed-channels.html)) says how much to believe a node, and\nthe priority panel ([0020](0020-the-priority-panel.html)) says what to work on next. Neither\nsays how much rests on it. Those are three different questions, and only the third explains\nwhy a reader's eye should go to one card before another.\n\n## Decision\n\n**A node has a derived importance $I(v)\\in[0,1]$, and the card's width is\n$\\mathrm{CARD\\_W}\\times(1+I(v))$.**\n\nImportance is derived, never stored — the same rule\n[0014](0014-confidence-is-three-signed-channels.html) fixed for confidence, for the same\nreason. There is no `importance:` field. A stored number is a second copy of facts the node\nfiles already carry, and a second copy is a second thing to drift; a derived one cannot\ndisagree with the record, because it *is* the record, read.\n\nFour channels, each reading something already written down:\n\n**Reach $R$ — how much of the argument rests on it.** The size of the transitive\n`required-by` closure of $v$, normalized by the largest such closure in the repository. This\nis the literal meaning of \"a lot depends on this\", and the edges are stored already.\n\n**Answer-carrying $A$ — the question says this node is a candidate answer.** A question's\n**Problem statement** names the node carrying each declared strength\n([0019](0019-the-update-operator.html)). Named at *necessary and sufficient* scores $1$; at\n*necessary* alone or *sufficient* alone, $0.6$. A marker owns the links between it and the\nnext marker, or to the end of its own paragraph, whichever comes first.\n\n**Feed-carrying $F$ — it is the bridge between two questions.** A **Feeds.** paragraph, in\nany question, names the node: $1$, else $0$. This channel exists because\n[0039](0039-one-graph-for-every-question.html) forbids a cross-question `depends-on`, so the\nFeeds prose is the *only* place the fact is recorded, and no graph edge will ever find it.\n\n**Citation $X$ — another argument reads it.** How many nodes of *other* questions link $v$'s\nnode file from their `## Statement`, normalized by the largest such count. Same motive as\n$F$, measured from the other end.\n\n$$\nI(v) = \\min\\left(1,\\ 0.40\\,R + 0.25\\,A + 0.20\\,F + 0.15\\,X\\right)\n$$\n\n**Reach is weighted heaviest** because it is the only channel that cannot be gamed by\nprose: it is what the DAG *is*. The two cross-question channels together (0.35) can lift a\nnode with almost no reach, which is the intended behaviour — a bridge with one dependent is\nnot a leaf.\n\n**It shows its working**, exactly as [0042](0042-confidence-shows-its-working.html) requires of\nconfidence: the node panel and the node page follow the width with one row per channel —\nwhat it scored, what it contributed, and the record it scored, so a card that is larger says\nwhy.\n\n**The spine pitch rises from 480 to 540.** At $I=1$ a card is 488px wide, and two adjacent\nmaxima at a 480 pitch would overlap. The block-extent measurement becomes per-node rather\nthan a flat `CARD_W/2` for the same reason.\n\n## Justification\n\nThe formula was written from the record and not fitted to a wanted answer, and it ranks\n`Q2-L1` first at **52%** anyway — $A=1$, $F=1$, reach 2. Second is\n[Q1-L5](../../nodes/Q1/Q1-L5/index.html) at 44%, which is named at *necessary and\nsufficient* by Q1 and cited from eight other-question statements. Third is\n[Q1-L4-L1-L1](../../nodes/Q1/Q1-L4/Q1-L4-L1/Q1-L4-L1-L1/index.html) at 40%\non reach alone — eleven nodes rest on it, which is why `P22` in\n[priorities](../../../blueprint/priorities.md) already called proving it the cheapest action in\nthe tree. That the derived number and the human-ranked panel agree, having been written\nindependently, is the evidence the channels are measuring something.\n\n## Consequences\n\n**Importance is not confidence and not priority, and the three must stay apart.** Confidence\nis the fill, importance is the width, priority is the panel. A large red card is exactly\nwhat it looks like: a lot rests on something believed wrong. Importance is never a cap on\nconfidence and never an input to it — a node being load-bearing is not evidence it is true.\n\n**Nothing may cite the number.** It is derived from the record, so it is never evidence in\nit — the same clause [0014](0014-confidence-is-three-signed-channels.html) carries.\n\n**A question's prose now moves a card's size.** Editing a **Problem statement** or a\n**Feeds.** paragraph changes what the graph looks like. That is intended: those paragraphs\nare where a question says what would count as an answer, and a node named there *is* more\nimportant. It is also a cost — the prose is now load-bearing for the layout, and `/update`\nis the only operator that may write it.\n\n**Widths are bounded and legible.** With the tree as it stands the range is 244–372px, a\n1.5× spread. Nothing is dominant enough to distort the canvas, and if something later scores\n1.0 the pitch already accommodates it.\n\n## Alternatives considered\n\n**A stored `importance:` field, the user's alone, like `human:`.** Rejected for\n[0014](0014-confidence-is-three-signed-channels.html)'s reason. `human:` is stored because it\nis a *judgement* nothing in the repository can compute; importance is a *reading* of\nmaterial already stored, and storing a reading is how two copies of one fact get made. The\nuser's judgement about what matters has a home already — the `human` rows of the priority\npanel.\n\n**A derived base with a stored override.** Rejected as the worst of both: two mechanisms,\nand no way to tell from a card which one produced it.\n\n**Scale the font, or the height, instead of the width.** Rejected — a title wraps to a\nheight the layout does not control, so height cannot be set from a number, and font scaling\nmakes the important cards the ones that are hardest to read at low zoom.\n\n**Cap the multiplier below the user's $1+x$ rule to avoid touching the pitch.** Rejected: it\nmakes the rule a fiction at the top of the range, and the pitch is a generated constant that\ncosts nothing to change.\n";</script>
