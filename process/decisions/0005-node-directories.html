<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0005-node-directories</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>ADR 0005 — One directory per node, and a one-page write-up</h1><p class="lead">Generated from <code>process/decisions/0005-node-directories.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [journal](../journal.html) · [design](../pipeline.html)\n\n- **date:** 2026-08-03\n- **status:** accepted\n- **kind:** repository structure\n- **extends:** [0002](0002-one-file-per-node.html)\n\n## Context\n\nAfter [0002](0002-one-file-per-node.html) a node was one file, `blueprint/nodes/<id>.md`. Its proof lived somewhere else, `drafts/lemmas/<id>.tex`, and the compiled PDF somewhere else again, `build/<id>.pdf`. Three directories for one object, and the only thing tying them together was a naming convention.\n\nTwo pressures made that untenable at once. `/check` was about to start producing per-node artefacts — examples found in the literature, and prompts for what it could not find — with nowhere to put them. And Q1-L1's refereed write-up had reached ten pages, of which roughly seven restated framework results that [0003](0003-appendix-of-objects.html) had just moved into the appendix.\n\n## Decision\n\nEverything about a node lives in `blueprint/nodes/<id>/`:\n\n```\nnode.md        fields and the statement\n<id>.tex       the write-up — one page, compiled from the repo root\nexamples.md    literature examples of the statement, when /check found any\nprompts/*.md   self-contained prompts for what the pipeline could not settle\n```\n\n`<id>.tex` compiles to **one page**, checked by the orchestrator with `pdfinfo`. `drafts/` now holds only critiques.\n\n## Justification\n\nThe page limit is not a style preference; it is enforceable only because the appendix exists. A write-up may cite `def:satake_subcategory` and stop, because the referee reads with the appendix open. Before the appendix, every draft had to carry its own \"Setting\" and \"Ingredients\" sections, and those sections were the appendix — written once per node instead of once.\n\nA restated result is a second copy, and a second copy drifts. Cutting them is worth more than the page count suggests.\n\n## Consequences\n\n- The prover now writes inside `blueprint/`, which [0002](0002-one-file-per-node.html) treated as off-limits to it. The grant is per-path, not per-directory: exactly one file, `blueprint/nodes/<id>/<id>.tex`. The permission boundary is unchanged in strength, only in shape.\n- The `.tex` repeats its directory name because `latexmk` routes output to `build/` by basename — seven files called `proof.tex` would collide on one `build/proof.pdf`.\n- The page count is a decomposition alarm as well as a length limit. A node whose proof will not fit on a page is usually several nodes, and the orchestrator reports the overflow rather than silently accepting it.\n- **Q1-L1's ten-page refereed draft was condensed to one page as part of this change, and the condensed text has not been re-refereed.** The mathematical content is the same and the appendix now carries what was cut, but the `proved` status attaches to a text no critic has read. The full round-2 draft is preserved in git at commit `39193fe`. This should be closed by a fresh `/prove Q1-L1`.\n\n## Alternatives considered\n\n**Name the node file `README.md` so GitHub renders the directory automatically.** Tempting — `blueprint/nodes/Q1-L1/` would become a clickable page. Rejected: \"README\" names a document *about* a thing, and this file *is* the thing; in an editor file tree, seven identical `README.md` tabs are unreadable.\n\n**Leave the proofs in `drafts/lemmas/`.** Rejected: it is the split the directory exists to end. A reviewer looking at a node should not have to know a second path convention to find its proof.\n\n**Make the one-page limit advisory.** Rejected on the evidence: it was already advisory, and the draft was ten pages. A limit checked by `pdfinfo` costs one command.\n";</script>
