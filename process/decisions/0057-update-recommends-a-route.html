<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0057-update-recommends-a-route</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0057 — `/update` recommends a route, and says what it would cost</h1><p class="lead">Generated from <code>process/decisions/0057-update-recommends-a-route.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0019](0019-the-update-operator.html) (the update operator), [0022](0022-update-proposes-nodes-from-failures.html) (update proposes nodes from failures)\n\n## Context\n\n`/update` ends by reporting what it revised and what it commissioned, and then the user has\nto decide *how* the commissioned work gets done. That decision is being made every time and\nrecorded nowhere, and it is not a small one: some of what this pipeline commissions is work\nClaude Code is the wrong tool for.\n\nThe distinction that keeps recurring. A node whose obstacle is **inside the repository** —\na statement to sharpen, a dévissage to write, a hypothesis to trace to its appendix entry —\nis work for `/prove` or `/decompose` here, where the closed world, the gates and the audit\ntrail are. A node whose obstacle is **outside it** — whether a theorem is in print, what the\nright generality is, whether a construction anyone has published does what the node needs —\nis work for an external model with a long research budget, and running it here means paying\nfor the repository's context on every turn to answer a question the repository does not\ncontain. This session's own `/examples Q2-L1` is the case in point: the finding that nothing\nin print matches clause (iii) came from reading the literature, not from reading the tree.\n\nThe operator already knows which it is. It has just read the whole node, its critiques, its\nexamples and its failure surface — it is better placed to make the call than the user is, and\nit was throwing the judgement away.\n\n## Decision\n\n**`/update` ends its report with a recommended route: one short pipeline, and the reason.**\n\nFor each thing the run commissioned or left open, it says which of these it is and why:\n\n- **in Claude Code** — the obstacle is in the repository. Name the exact commands in order,\n  `/decompose <id>` then `/prove <id>`, and what each is expected to close.\n- **to an external model** — the obstacle is in the literature or in the choice of\n  generality. Say so, and name the packet to send: `<id>_prompt.md` is already generated,\n  self-contained and non-citable, which is exactly what a codebase-blind model needs.\n- **the user's own judgement** — `human:` is nobody else's field, and a `doubted` or an\n  `approved` is a decision no operator may make. Say which node is waiting on it.\n\nThe recommendation is **three lines at most**, it is a recommendation and not a plan, and it\nnames the cheapest route that could work rather than the most thorough. A route that is wrong\ncosts one turn to ignore; a route that is not offered costs the user the whole decision.\n\n## Consequences\n\n**The report gains a section and the repo gains no state.** Nothing is stored: the route is a\njudgement about what to do next, and what to do next changes with every run. It belongs in\nthe report, beside the priority panel's own next-actions, and it is not a field.\n\n**It does not replace the priority panel.** [0020](0020-the-priority-panel.html)'s rows say\n*what* matters and in what order. This says *where* the work should happen. A row can be red\nand still be work for an external model.\n";</script>
