<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0090-a-claim-is-one-line-and-its-reasons-fold</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0090 — A claim is one line, and its reasons fold under it</h1><p class="lead">Generated from <code>process/decisions/0090-a-claim-is-one-line-and-its-reasons-fold.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Status.** Accepted, 2026-08-09.\n**Amends** [0043](0043-a-proof-step-is-one-claim.html), [0062](0062-a-node-states-its-own-flaw.html), [0060](0060-a-write-up-has-two-budgets.html).\n**Related** [0003](0003-appendix-of-objects.html), [0053](0053-the-appendix-is-a-directory.html), [0086](0086-an-appendix-link-resolves-by-stem.html).\n\n## Decision\n\nEverywhere the blueprint states something and then argues for it, the statement is **one line** and the argument goes behind a `<details>` fold directly under it. The fold is written into the **canonical markdown**, not added by the renderer, so a reader on GitHub gets the same page a reader on the site does.\n\nThree places, and one rule for all three:\n\n```\nproof.md            **Step n — the claim.**              visible\n  └── <details>       the justification                  folded\ncritiques/r<n>.md   **Flaw n** [SEV] — the defect.       visible\n  └── <details>       (location) · the finding           folded\n<id>_node.md        ⚠ what is wrong, in four words       visible   (generated block)\n  └── <details>       the record's own words             folded\n```\n\nAnd an appendix entry is named by **what it is**, not by the label the manuscript files it under. A citation renders as that name.\n\n## Why\n\nThe summaries already existed and were not being used as summaries.\n\nA proof step in this repository is already one claim ([ADR 0043](0043-a-proof-step-is-one-claim.html)) with a headline stating it: 359 of them, median 57 characters, 346 carrying their own mathematics. The headline was then run together with its justification in a single paragraph, so a reader met the whole argument at once and had no way to read the shape of the proof without reading all of it. Nothing needed to be written. The two halves needed to be separated.\n\nThe same held one level down. A referee's flaw is stated in its first sentence — median 168 characters — and buried under a `(location: ...)` that quotes the draft at length. And a node's generated flaw block ([ADR 0062](0062-a-node-states-its-own-flaw.html)) put every standing FATAL between the reader and the statement the flaws are about, which is the opposite of what that record exists to do.\n\nFor the appendix, the problem was the citation rather than the entry. `` `defn:coherent_D_mod` `` is the file's name, the anchor's name and the manuscript's name for the object, and it should stay all three — but a proof that spends it fourteen times is fourteen lines a reader has to decode before they can read the sentence.\n\n## Consequences\n\n**Nothing was written and nothing was paraphrased.** Every one-line statement is text that was already there, moved up. Both transforms were run as scripts with a preservation check that had to pass before anything was written: for proofs, the token stream outside the delimiters must be **identical**; for critiques, where the promotion of a sentence past its `(location: ...)` is a reorder by construction, the multiset of tokens must lose **nothing**. Both are idempotent.\n\n**403 flaws fold; 15 of them carry no one-line statement.** Their opening sentence runs past 420 characters or has no sentence stop at all. They are folded anyway — a heading beats a wall — and counted in the report, because a flaw nobody can state in a line is a flaw somebody should restate. Inventing one would have been the script writing mathematics.\n\n**The word budget does not tax the fold.** `words_in` discounts `<details>` and `<summary>` lines exactly as it already discounted a `$$` on a line of its own, and for the same reason: a write-up that buys presentation with structure should not pay for it against [ADR 0060](0060-a-write-up-has-two-budgets.html)'s cap.\n\n**A delimiter must stand as its own block, and the gate says so.** The renderer splits at blank lines, so `</details>` sharing a block with the next heading is neither a close tag nor a heading and is escaped into visible markup. That shipped in 47 of 134 files — the content checks all passed, because they counted tokens and never looked at shape — so `check_render.py` §13 now checks every fold's structure on every markdown file, and was verified against both failure shapes before being trusted.\n\n**The renderer passes exactly two tags.** A block that is an opening `<details><summary>…</summary>` or a closing `</details>` is emitted raw; the summary goes through the inline renderer so it can carry a link; everything between them is ordinary markdown. Nothing else is unescaped, so this is not \"HTML is now allowed in the blueprint\".\n\n**A heading names the object and then says which label it is filed under.** Forty entry headings and forty listing lines flipped from `` `label` — words `` to `` words — `label` ``. `parse_appendix` reads the label from whichever side of the dash it sits on, so the order is a presentation choice and not a schema. Anchors, filenames and every link in the repository are untouched — including the ~1,000 inside append-only records, which is what [ADR 0086](0086-an-appendix-link-resolves-by-stem.html) bought.\n\n## The cost that was accepted, explicitly\n\n**58 critique files were rewritten, and critiques are append-only.** That rule exists so a referee's report says what it said when it was written; the rewrite means the *bytes* of 48 of them no longer do, even though every word does. The user was shown this cost as a named option against two alternatives that preserved it — render-only folding, and folding everywhere except critiques — and chose to rewrite them, so the rule is overridden here by its owner rather than by an operator.\n\nWhat preserves the guarantee that still can be preserved: the script never deletes, never paraphrases and never summarises; it moves a sentence and adds four delimiters, and it refuses to write a file whose token multiset lost anything.\n\n## The alternative that was rejected\n\nFolding at render time and leaving every `.md` untouched. Zero risk, fully reversible, and it would have left the raw GitHub view of a proof and a critique exactly as unreadable as before — which is where a collaborator handed a repository link actually reads them.\n";</script>
