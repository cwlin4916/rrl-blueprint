<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0026-sub-lemma-families-fold-into-their-parent</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0026 — Sub-lemma families fold into their parent</h1><p class="lead">Generated from <code>process/decisions/0026-sub-lemma-families-fold-into-their-parent.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Amends:** [0024](0024-one-graph-with-side-branched-corroboration.html) (the full-depth clause of the one-graph rule; its side-branch and one-engine clauses stand).\n\n## Context\n\nTwo defects, user-reported on 2026-08-04, both on the root canvas after the tree grew\nto two decomposed lemmas and thirteen corroboration branches.\n\n1. Depth crowded the picture: with Q1-L2's four sub-lemmas and Q1-L6-L1 drawn at full\n   depth, the middle rows tangled — Q1-L6-L1 sat in Q1-L5's neighbourhood, cards and\n   rising arcs crossing — and the grid rescale (the second spacing pass, journal\n   2026-08-04) could not fix what is a depth problem, only a pitch problem.\n2. The user's direction: a lemma-under-a-lemma should not be on the root page at all —\n   it should appear only once the reader goes to the parent's own page\n   (`nodes/Q1-L6/index.html` for Q1-L6-L1).\n\n0024's \"one graph, full depth on every page\" traded this away deliberately (its defect\n3 was drill-down reshaping the picture). What it missed is that the *skeleton* can stay\nthe same everywhere while depth stays local: the reshaping 0024 abolished came from\neach page drawing a *different subgraph with a different card on top*, not from folding\nas such.\n\n## Decision\n\n**One skeleton, families by subtree.** Every graph page draws the same top-level\nskeleton — the question card, its direct lemmas, their side branches. A decomposed\nnode's sub-lemmas are emitted into a page's `DATA.nodes` only when the page's focus\nlies in that node's own subtree: its page, a descendant's, or a nested branch node's\n(`open_hosts` = the focus and its ancestors). Everywhere else the family folds into\nthe parent's card, which carries a **\"n sub-lemmas\" chip beneath it linking to the\nparent's page** — the drill-down chip 0024 removed, returned in folded form only.\nLayout is recomputed per page over the visible set, so folding leaves no holes; the\nskeleton's rows come out identical on every page because a sub-lemma's depth never\nfeeds an ancestor's.\n\nBookkeeping that follows: the scope card counts all nodes (`DATA.total`) while the\npanel lists the drawn ones and says how many sit folded; a node page's aside separates\n\"sub-lemmas\" (spine children, drawn in its embedded DAG) from \"corroborated by\" (e/a\nchildren, behind the chips); and a deep link into a graph goes to the node's *own*\n`dag.html`, which always contains it — `dag.html#Q1-L6-L1` on the root no longer\nresolves, and the generated pages no longer emit such anchors for folded ids (the\nembed caption anchors the family's fold point instead).\n\n## Consequences\n\n- The root canvas stays the size of one decomposition however deep the tree goes —\n  which is what 0016's per-scope pages bought, now without giving up 0024's single\n  skeleton, single engine, and side-branched corroboration.\n- \"The node's DAG\" and \"the DAG\" still cannot disagree on anything both draw; they\n  differ only in which families are unfolded, and the fold chip says so on the card.\n- `tools/dag_smoke.js` needed no change: it derives its expected card and edge counts\n  from each page's emitted `DATA`, so the per-page visibility calibrates it.\n- Addressability narrows knowingly: a folded id is reachable from the root in two\n  clicks (fold chip, then the family) but not by `#fragment` on the root page.\n";</script>
