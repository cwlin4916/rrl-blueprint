<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0017-operators-read-the-local-library</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0017 — Operators read the local library</h1><p class="lead">Generated from <code>process/decisions/0017-operators-read-the-local-library.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n\n## Context\n\n[`papers/`](../../papers/guideline.html) began as three PDFs and a guideline. As of today it\nholds the source behind every publicly available black box the appendix cites — ten PDFs,\neach named by its `refs.bib` key; the Tier-1 predecessor paper is unposted and the Tier-3\nbooks are not on arXiv, and the guideline records both.\n\nBut the operators did not know it. The example-finder was told to read the guideline\nbefore searching, and nothing about the PDFs beside it; the prover checked a black box's\nhypotheses \"as cited\" against its memory of the paper; the critic checked the prover\nagainst the same memory; and the lead-researcher transcribed appendix entries — the\nclosed world's copy of the literature — from recollection. The only route to an actual\npaper was the web, which is slower, rate-limited, and not even the right object: the\nappendix cites the version the project chose, which is the PDF on disk.\n\nThe failure mode this leaves open is the transcription error no gate can catch. An\nappendix entry that mis-states its source's hypotheses is wrong in a way every downstream\ncheck inherits, because the critic checks the draft against the entry, never the entry\nagainst the paper.\n\n## Decision\n\n**A source that is on disk is read from disk.** The four reasoning operators carry the\nsame pointer, each at its own job:\n\n- the **prover**, when a step turns on what a cited result actually says, opens the PDF\n  (Read, with the `pages` parameter) instead of reconstructing it;\n- the **critic** checks an entry cited \"as cited\" against the source — a mismatch is a\n  flaw to raise, not to inherit;\n- the **example-finder** searches the local library before the web: a page it quotes\n  from disk is one it has actually seen;\n- the **lead-researcher** transcribes a black box's statement and `hypotheses` from the\n  numbered result in the PDF, never from memory of the paper.\n\nThe launching skills (`/prove`, `/examples`, `/decompose`) repeat the pointer in their\npackets, and `CLAUDE.md` states the rule once for every session.\n\n**Reading widens nothing.** The closed world is unchanged: a PDF in `papers/` is citable\nby nothing — only an appendix entry is, and only the lead-researcher writes those. This\ndecision moves where the eyes go, not where the citations may.\n\n## Consequences\n\nThe guideline's §a now says the reading-list PDFs are on disk ahead of being read, and an\nentry still moves up into §a only when something has actually been taken from it — the\n\"what was taken\" rule keeps its teeth precisely because arrival and reading stay distinct\nevents. The PDFs stay gitignored and named by bib key, which is what makes the pointer\ncheap: an operator holding a bib key already holds the filename, and `BZSV.pdf` and\n`SV17.pdf` were checked against that rule and left alone (`BZSV` is a real key;\n`SV17` is the key `main.tex` cites, whose missing `refs.bib` entry is a recorded gap).\n";</script>
