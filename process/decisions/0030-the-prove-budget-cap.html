<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0030-the-prove-budget-cap</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0030 — `/prove` is capped at two rounds and one widening</h1><p class="lead">Generated from <code>process/decisions/0030-the-prove-budget-cap.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Amends:** the round loop of `/prove` (§3 of [.claude/skills/prove/SKILL.md](../../skills/prove.html))\n\n## Context\n\nThe `/prove` loop was written to run up to three rounds per invocation, with a lead-researcher widening whenever a `FAIL` turned on the closed world rather than the mathematics. Neither was bounded by cost, because until now nobody had measured what a round costs.\n\nThe Q1-L4 run supplied the measurement. Four children, each taken to a verdict:\n\n| node | rounds | widening | subagent tokens |\n|---|---|---|---|\n| Q1-L4-L2 | 1 | — | ~263k |\n| Q1-L4-L3 | 1 | — | ~277k |\n| Q1-L4-L1 | 2 | ratified reading ([ADR 0028](0028-orbit-strata-are-fpqc-images.html)) | ~625k |\n| Q1-L4-L4 | 2 | black-box entry (Raskin) | ~899k |\n\nA node that passes in one round costs about 270k. A second round roughly triples it, and the multiplier is structural rather than incidental: the round-2 prover packet carries the whole critique, so it is larger than round 1's, and a closed-world `FAIL` pulls a lead-researcher call and a second critic in behind it. **Round 3 was never reached.** Every node that was going to pass passed at r1 or r2, so the third round bought nothing while standing to cost the most.\n\nThe user set the cap after seeing these numbers, with the weekly budget at 97%.\n\n## Decision\n\nTwo bounds, both per invocation:\n\n- **At most two rounds.** A `FAIL` at r = 2 sets `failing`, reports the unresolved flaws, and stops. Opening a third round is now a user decision, made with the referee's list in hand, not an automatic escalation.\n- **At most one widening.** A second closed-world `FAIL`, after a widening has already landed, is a stop. Two widenings in one run means the node was cut against the wrong world, and a third entry is not the fix — the node needs re-stating or splitting.\n\nTwo clarifications the run forced, recorded here so they are not relearned:\n\n- A **ratified reading** is a widening and counts against the one. It is the honest fallback when the citable route is closed, which happens whenever the source has no `refs.bib` key — only the user adds keys, so no agent can take that route ([ADR 0028](0028-orbit-strata-are-fpqc-images.html) is the worked case).\n- An **over-budget draft is not a compression problem.** A prover that has already compressed once buys tens of words, not hundreds. The operator accepts the draft, reports the overflow, and asks which self-contained piece makes the cleanest sub-lemma; the split is the user's call, since it costs a decompose plus a fresh prove run.\n\n## Consequences\n\n- Worst case per node falls from unbounded-at-three-rounds to roughly the observed two-round cost. On this run's numbers the cap changes no outcome: all four nodes reached the same verdict inside it.\n- Some nodes will now end `failing` that a third round might have closed. That is the intended trade — the user sees the referee's repair list and decides whether the node is worth more, rather than the loop deciding by default.\n- A node that needs a second widening is now visible as a *design* signal about the cut rather than absorbed silently as more spending.\n- The cost table above is this repo's only measurement of operator cost. Any future budget decision should extend it rather than guess; `/update` and `/examples` have never been measured this way.\n";</script>
