<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0011-write-ups-in-markdown</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0011 — A write-up is `proof.md`, not `&lt;id&gt;.tex`</h1><p class="lead">Generated from <code>process/decisions/0011-write-ups-in-markdown.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Amends:** [0005](0005-node-directories.html) (put `<id>.tex` in the node directory; the directory stands, the extension changes),\n[0006](0006-examples-from-the-literature.html) (gave example-finding to `/check`; it is now its own command — see below)\n\n## Context\n\nEvery artifact in the reasoning tree was markdown except one. `blueprint/nodes/<id>/<id>.tex` was LaTeX, and it was the only thing under `blueprint/` that compiled. That one exception paid for itself with a surprising amount of machinery:\n\n| what the exception cost | where |\n|---|---|\n| a per-node `.latexmkrc` in every node directory, plus a `_latexmkrc` template | `blueprint/nodes/` |\n| a second output directory, `build/nodes/`, and a conditional in the root `.latexmkrc` | `.latexmkrc` |\n| a compile gate run twice per round — from the repo root *and* in place | `/prove` §3b |\n| a page gate shelling out to `pdfinfo` | `/prove` §3c |\n| a 120-line TeX-to-HTML converter, plus theorem-box CSS and an \"unknown command\" class | `tools/build_dag_site.py` |\n| a macro harvester that expands `\\docsvlist` loops out of `preamble.tex` into KaTeX's `macros` option, for the write-up pages only | `tools/build_dag_site.py` |\n| two test cases and a `--slow` LaTeX path | `tests/` |\n\nAnd it cost one thing that is not machinery. **The guardrail that an object is linked, never named, was suspended inside the write-up.** A `.tex` draft wrote `\\texttt{def:generation}` — a bare label, exactly what every other file under `blueprint/` is forbidden to write — and the site generator turned it into a link afterwards, on the rendered page only. The source of the most load-bearing document in the tree was the one place the closed world was named rather than linked.\n\n## Decision\n\nA write-up is `blueprint/nodes/<id>/proof.md`, markdown like everything else, subject to every rule the rest of the tree is subject to: standard KaTeX only, `$$` blocks for display math, and **every appendix object written as a link into `blueprint/appendix.md`**.\n\nThree consequences follow immediately.\n\n**One page becomes 900 words.** There is no page to count, so [I9](../pipeline.html#4-invariants) is enforced as a word budget. The number is calibrated, not guessed: Q1-L1 — five steps of category theory, the densest write-up the pipeline has produced — is 713 words. `blueprint/nodes/_template.md` states the budget in prose and both gates read it from there, so there is one number and it lives in the file a prover actually opens.\n\n**The compile gate becomes the render gate.** `python3 tools/check_render.py` replaces `latexmk`, and it now runs *inside* every round rather than once at the end. This matters more than it did before: LaTeX fails loudly, markdown does not. A malformed fragment that would have been a compile error is now a line that silently renders as literal text, so the gate has to run where the prover can still be sent back.\n\n**The `uses` line becomes clickable.** A referee reading `blueprint_site/nodes/<id>/writeup.html` clicks straight from the declared closed world to the hypotheses the proof claims to have discharged. This was the argument that decided it.\n\n## What was rejected\n\n- **Keep `.tex`, and lint it for bare labels.** Possible, and it would have closed the guardrail hole. It would not have removed any of the machinery in the table above, and it adds a linter to a language the repo would then still be maintaining two renderers for.\n- **Keep `.tex` for `proved` nodes and use markdown for new ones.** Two representations of one type is exactly the thing this decision exists to remove.\n- **Markdown source, LaTeX output generated from it.** The manuscript is `main.tex` and is human-only; nothing the pipeline produces enters it without a human moving it there. A generated `.tex` nobody reads is a third artifact, not a bridge.\n\n## Costs accepted\n\n- **No `\\label`/`\\ref` and no theorem environments in a write-up.** Headings and links instead. At one page this has not been felt.\n- **KaTeX is more permissive than LaTeX.** It will render something for input LaTeX would reject. The word budget and the referee are what catch a proof that is malformed rather than merely ugly; the gate only catches what does not render at all.\n- **A one-time migration.** Q1-L1's write-up was rewritten by hand: every house macro expanded to its standard form, every `\\texttt{label}` turned into a link. The mathematics is unchanged, and the critique history under `critiques/r1`–`r5` still refers to it.\n- **Dead machinery is left standing.** The macro harvester still runs and `BP.MACROS` still ships, consumed by nothing. Recorded in [pipeline §6](../pipeline.html#6-the-generated-site) rather than removed in the same pass, so that one change is one change.\n\n## The related split\n\n`/check` had two jobs — reformat prose, and research the literature for examples — since [0006](0006-examples-from-the-literature.html). Finding examples is now `/examples`, with its own **example-finder** agent, and the checker is presentation only.\n\nThe reason is the same reason as above: one arrow per operation. `/check` had the type $\\mathsf{Md} \\to \\mathsf{Md}$ *and* the type $\\mathsf{Node} \\rightsquigarrow \\mathsf{Ex} + \\mathsf{Prompt}$, which is two maps sharing a name. Practically, it meant every presentation pass carried a `WebSearch` grant it did not need, and a run over thirty markdown files could not be told apart from a literature search. The example gate — the part that checks a citation is real — moved with it.\n\nThe example-finder is also given an ordering the checker never had: **simplest first**, degenerate case before classical case before published computation, each entry carrying the discharge of the hypotheses one at a time rather than an assertion that something is an instance. And `examples.md` still justifies nothing: it is evidence for *believing* a statement, never a step in a proof, which is [I10](../pipeline.html#4-invariants) and, in the schema, an empty hom-set.\n\n## The references directory\n\n`papers/` holds the PDFs the project reads. It gains [`guideline.md`](../../papers/guideline.html): what is here, a ranked reading list derived from the manuscript's citation counts and the appendix's black boxes, and the rule that **being in `papers/` is not being citable** — the closed world is the appendix and nothing else. The prover and the example-finder append to its reading list; nobody rewrites an entry. `blueprint/literature/`, which held reading notes and was empty, folded into it: one directory for everything about an external source, rather than notes in one tree and the PDF in another.\n";</script>
