<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0002-one-file-per-node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>ADR 0002 — One file per DAG node</h1><p class="lead">Generated from <code>process/decisions/0002-one-file-per-node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [journal](../journal.html) · [design](../pipeline.html)\n\n- **date:** 2026-08-02\n- **status:** accepted; extended by [0005](0005-node-directories.html)\n- **kind:** repository structure\n\n## Context\n\n`blueprint/main_dag.md` originally carried each node's full statement inline. After one `/decompose` produced seven nodes the file was long enough that finding a node meant scrolling past unrelated mathematics, and every `/prove` status write-back touched a file that also held every statement — so each status diff was noisy and every concurrent edit was a conflict.\n\n## Decision\n\nOne file per node, `blueprint/nodes/<id>.md`, holding type, status, `depends-on`, `required-by`, links to draft and critique, the full statement, and an optional remark. `main_dag.md` becomes an index: per question, the setting, the logical closure, a tally, and one line per node.\n\n## Consequences\n\n- The DAG is navigable by clicking, in the GitHub blob view and the VS Code preview alike, because every link is relative.\n- A status write-back touches two small files instead of one large one, and the diff shows the status.\n- Status is now stored twice — in the node file and in the index. Accepted deliberately, with `/research-status` checking the two for drift (invariant I5). Redundancy that is checked is documentation.\n- `required-by` must be maintained as the inverse of `depends-on`. This is manual and will eventually be got wrong; the checker verifies links resolve but not that the inverse relation is complete.\n\n## Alternatives considered\n\n**Keep everything in one file.** Rejected on the diff-noise and navigation grounds above.\n\n**Store the DAG as structured data (YAML/JSON) and render markdown from it.** Rejected: the node file is the thing a human reads and a prover is handed. A generated view would need the source to be readable too, and then there are two artefacts to keep honest. Markdown with a schema comment at the top of the index is the cheaper contract.\n";</script>
