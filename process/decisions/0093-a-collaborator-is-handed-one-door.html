<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0093-a-collaborator-is-handed-one-door</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0093 — A collaborator is handed one door, and the reading is in the repository</h1><p class="lead">Generated from <code>process/decisions/0093-a-collaborator-is-handed-one-door.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [to do](../../todo1.html) · [the open operator](../../todo2.html) · [references](../references/index.html) · [the deck](../../philosophy/index.html)\n\n**Date:** 2026-08-09\n**Status:** accepted\n**Amends:** [0091](0091-the-front-door-is-the-graph.html), which made `dag.html` the front door and `todo.html` a tab in the bar.\n\n## Decision\n\nThree things, all about what somebody who has been handed this repository actually sees.\n\n**The philosophy deck is one page.** `process/presentation/index.html` and nothing behind it. The thirteen files under `pages/`, the two briefs `summary.md` and `prompt.md`, and the working notes in `presentation_thoughts/` are deleted, and `presentation()` no longer copies **any** markdown into `blueprint_site/philosophy/` — so `README.md` and `style.md` stay in the repository, addressed to whoever edits the deck, and are not published.\n\n**The collaborator's to-do is two pages.** [`todo1.md`](../../todo1.html) is three questions to answer in one markdown file back, twenty minutes each, and it is the `to do` tab in the bar. [`todo2.md`](../../todo2.html) is the one item that ends in a file that runs — writing the `/tighten` specification — and it carries the four-step shape of a skill file as well as the four constraints. `process/todo.md` stays as a tombstone, empty of questions, because [0091](0091-the-front-door-is-the-graph.html), [0092](0092-tightens-goal-is-comprehension-and-its-specification-is-open.html) and two journal entries link it by path and an append-only record is never rewritten.\n\n**The reading behind the two design questions is in the repository and goes out with the site.** [`process/references/`](../references/index.html) holds twenty annotated entries in two lists — nine for question (a), eleven for question (b) — and seventeen PDFs, and `reference_pdfs()` copies those PDFs into `blueprint_site/process/references/` beside the page rendered from their README, so the table's links open on the published mirror and not only in a clone.\n\n## Why\n\n**A deck with thirteen doors is a deck nobody finishes.** The spine was five sections and about six minutes; behind it sat eight pages that had already been superseded and carried a banner saying so, three that were the argument's lineage, one that was the system, and one that was the bibliography. A reader handed that opens two or three of them, loses the spine, and stops. The five that were load-bearing are now either a sentence on the spine or an entry in the reading list, which is what they were being used for.\n\n**One of the four items was not a question.** Writing a specification is a piece of work with a deliverable, a reading order and four constraints on the result. Sitting among three questions it was three times the length of any of them and made the page read as an assignment rather than as three things to have an opinion about. Splitting it lets it have the room it needs and leaves a page whose three questions are twenty minutes each.\n\n**A design question with no reading gets answered from taste.** (a) and (b) are design questions and neither is new: there is a literature on when a visualization earns its cost and on which level of a design a criticism is aimed at. Naming two papers per question as the ones to read first is what makes it possible for an answer to disagree with something specific. The PDFs are on disk because a link that has rotted is the same as no reference at all, and they are published because a collaborator reading the list on the web has to be able to open the paper from it.\n\n**The third question is the one only a mathematician can answer.** Everything else on the list is about the machine. (c) asks for the two most serious problems **in the mathematics** — each stated as a claim we could agree or disagree with, with a cause and something concrete to do. The machine has an opinion about its own defects, in the pipeline and in every flaw block; it has none about the mathematics, and it cannot get one from the inside.\n\n## Consequences\n\n- `blueprint_site/todo.html` no longer exists; the bar's third tab is `todo1.html`, and the `▾ menu` gains rows for `todo2.html` and for the reference index.\n- `Site.url` gains two cases. `process/presentation/…` maps to `philosophy/…`, and a `process/references/*.pdf` maps to itself, because both are copied into the site rather than rendered. Without them a link fell through to `posixpath.relpath(path, \"blueprint_site\")`, which climbs *out* of the site: it resolves in a clone and 404s on the mirror, which is the one link failure no local gate can see.\n- `.gitignore` gains `!process/references/*.pdf`, the only exception to the repository-wide `*.pdf`. The seventeen files are about 55 MB and they are in the private repository and in the public mirror both.\n- Thirteen hand-written pages and two briefs are recoverable from git history and from nowhere else. `git log --diff-filter=D -- process/presentation/pages/` finds them.\n";</script>
