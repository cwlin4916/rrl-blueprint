<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0068-the-weakest-link-is-a-ceiling</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0068 — The weakest link is a ceiling on the sum, not a term inside it</h1><p class="lead">Generated from <code>process/decisions/0068-the-weakest-link-is-a-ceiling.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Amends:** [0014](0014-confidence-is-three-signed-channels.html) (confidence is three signed channels), [0042](0042-confidence-shows-its-working.html) (confidence shows its working)\n\n## Context\n\nThe user asked what it would take to `/prove` [Q1-L3-L2](../../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) into positive confidence. Simulated against the builder's own `confidence()`, a passing referee moved the node from $-50\\%$ to exactly $+0.0\\%$, and proving all five of its dependencies as well bought $4.7\\%$.\n\nThe cause is arithmetic. [ADR 0014](0014-confidence-is-three-signed-channels.html) set\n\n$$\nC(v)=\\min\\Bigl(\\mathrm{cap},\\ \\tfrac14 H+\\tfrac12 D+\\tfrac14 L\\Bigr),\n\\qquad\nD(v)=\\min\\Bigl(\\mathrm{support}(v),\\ \\min_{u\\in\\mathrm{deps}(v)} C(u)\\Bigr).\n$$\n\nThe inner minimum ranges over each dependency's **whole** $C$, and the result is then multiplied by $\\tfrac12$. A proof node normally has $H$ and $L$ silent, and a silent channel contributes zero, so the recursion collapsed to\n\n$$\nC(v)\\ =\\ \\tfrac12\\,C(u).\n$$\n\n**Confidence halved at every layer of the DAG.** A proved leaf sat at $25\\%$, its parent at $12.5\\%$, four layers up at $1.6\\%$. The weakest-link rule is meant to say *no stronger than what it rests on*; multiplying by the channel weight afterwards made it say *strictly weaker, by half, per layer*. The discount was charged twice.\n\nThe consequence is what forced the change. Setting **every** node in the repository to `proved` on a clean round still left two questions negative — Q1-L5 at $-16.0\\%$ at depth 8, Q2-L8 at $-6.2\\%$. No sequence of operator runs could turn the tree green, so the pipeline's apparent failure to make progress was the display reporting an unreachable target correctly.\n\nNegative propagation was damaged in the same way and in the opposite direction. A node resting on a refuted sub-lemma inherited half its badness, then a quarter, then an eighth — so a false claim three layers down showed as a mild amber rather than as the red it is.\n\n## Decision\n\n**The three channels score the node's own record; every dependency's whole confidence caps the sum.**\n\n$$\nC(v)\\;=\\;\\min\\Bigl(\\mathrm{cap}(v),\\ \\ \\tfrac14 H+\\tfrac12 D+\\tfrac14 L,\\ \\ \\min_{u\\in\\mathrm{deps}(v)} C(u)\\Bigr),\n\\qquad D(v)=\\mathrm{support}(v).\n$$\n\nThe dependency minimum joins the approval cap and the goal-check cap as a third ceiling, applied to the total rather than folded into a term. Nothing is multiplied on the way in, so resting on a proved node costs nothing and resting on a refuted one costs everything.\n\nThe panel keeps showing its working ([ADR 0042](0042-confidence-shows-its-working.html)), with one change: the record row now shows the node's own record and states the weaker node beneath it as a ceiling, and the footer names whichever of the three ceilings actually bound.\n\n## Consequences\n\nA chain of proved nodes holds its value instead of decaying. Measured across the repository at the time of the change:\n\n| | before | after |\n|---|---|---|\n| best node ([Q1-L1](../../nodes/Q1/Q1-L1/index.html)) | 73.4% | 73.4% |\n| [Q1-L4-L4](../../nodes/Q1/Q1-L4/Q1-L4-L4/index.html), proved, depth 2 | 22.2% | 44.4% |\n| [Q1-L3](../../nodes/Q1/Q1-L3/index.html), open, over a failing chain | −12.5% | −50.0% |\n| every node proved on a clean round | −16% to +19% | **+40% flat, at every depth** |\n| the same, plus approval and precedent | — | **+90%** |\n\nTwo effects, and the second is the one to keep in view.\n\n**The target becomes reachable.** A fully proved tree sits at $+40\\%$ independent of depth, which is what a depth-independent rule should give. The remaining distance to $100\\%$ is the two channels no operator can write: `human:` is the user's field, and the literature channel is `/examples`'s.\n\n**Red gets redder.** A node over a failing dependency now shows the full $-50\\%$ rather than a laundered $-12.5\\%$. Seven nodes moved down at the change, all of them resting on something failing. That is the intended reading: an argument standing on a refuted step is exactly as broken as the step.\n\nNothing is stored, so the change is one function and no migration — every number on the site is recomputed at the next build, and no file under `blueprint/` was touched.\n";</script>
