<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0046-a-refuted-statement-needs-a-change</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0046 — A refuted statement needs a change, not an update</h1><p class="lead">Generated from <code>process/decisions/0046-a-refuted-statement-needs-a-change.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Complements:** [0019](0019-the-update-operator.html) (only `/update` revises a statement) and [0030](0030-the-prove-budget-cap.html) (two rounds per invocation). Names the outcome those two between them had no word for.\n\n## Context\n\n`/prove` could end a run three ways: `proved`, `failing` after two rounds, or a render\nfailure. All three describe the **write-up**. None of them describes the case where the\nwrite-up is fine and the *statement* is false.\n\nThat case is not hypothetical and it is not rare — a decomposition cuts a lemma before\nanyone has tried to prove it, and the first serious attempt is exactly when a hypothesis\nturns out to be missing or a quantifier turns out to be in the wrong place. What the\npipeline did with it was record `failing` and quote the flaws, which reads on every\nreadout as *the prover has not managed it yet*. The site then showed the node with a\n`needs update` chip — amber, the same chip a node gets when its statement was revised\nand not yet re-proved, or when the literature left a gap. Two very different situations,\none signal:\n\n| what happened | what the record should say |\n|---|---|\n| the record moved; look at this statement again | **needs update** |\n| the statement is false; it must be restated | **needs change** |\n\nNothing in the repository could tell them apart, so nothing did. A reader scanning the\ngraph could not see the difference between a node awaiting more effort and a node\nawaiting a *different claim*, and the two want opposite responses: more `/prove` in the\nfirst case, and in the second, no more `/prove` at all until `/update` has replaced the\nstatement.\n\nThe write-discipline constraint is what makes this a decision rather than a bug fix.\n`/prove` may not repair the statement itself — a `## Statement` is revised by `/update`\nand by nobody else (ADR 0019), and that rule is worth more than the convenience of\nletting a prover patch its own target. So the refutation branch has to *stop, record,\nand hand over*, and the handover has to be visible.\n\n## Decision\n\n**`REFUTED` is a third critic verdict, and it drives a `needs change` warning.**\n\n1. A critique may close `VERDICT: REFUTED`, and it means one thing: the node's statement\n   is **false as written**, with the counterexample or the failing case given in the\n   report. It is not a strong `FAIL`. `FAIL` says the argument does not establish the\n   claim; `REFUTED` says no argument will.\n2. `REFUTED` ends the `/prove` invocation immediately — it does not consume a round and\n   it does not open one. There is nothing for a second round to do.\n3. Before it reports, the run **checks the refutation against the literature**: an\n   example-finder pass over the local library and the published record, to find whether\n   the statement is false only as stated (a missing hypothesis, a wrong quantifier) or\n   false in substance, and to find the corrected form if the literature has one.\n4. The run then writes, in the node's own files and nowhere else:\n   - the dated `<id>_history.md` entry, quoting the **false version verbatim**, naming\n     the round that refuted it and what refutes it. The false statement is preserved,\n     not deleted — the history is where a claim the project once believed goes;\n   - `status: failing`, and the **statement itself is left untouched**.\n5. It reports a **suggested corrected statement** to the user and to the history, marked\n   as a suggestion. It is not adopted. Adopting it is `/update`'s to do.\n6. The site derives `needs change` from three triggers, each of them a claim about the\n   statement rather than about a write-up: a latest critique closing `REFUTED`, an\n   `EVIDENCE: counterexample` in `examples.md`, and the user's own `human: refuted`.\n   The last two move out of `needs update`, which keeps only the \"the record moved\"\n   triggers. The chip is red, and reads **needs change**.\n\n## Justification\n\nThe two chips answer different questions, and a reader is entitled to the answer without\nopening the node. `needs update` asks for judgement — is this statement still the right\none? `needs change` asserts a fact — this statement is wrong. Sharing a colour and a\nword between an open question and a settled defect made the settled defect look like\nhousekeeping.\n\nDeriving the chip rather than storing it keeps invariant I5: each of the three triggers\nis already on the record, in a file some operator wrote under its own write discipline,\nso the flag cannot drift from the audit trail it summarises. There is no `refuted:`\nfield, and there should not be — a fourth place to write a fact the critique already\nstates.\n\nMaking the literature pass part of the branch, rather than a suggestion in the report,\nis the one place this decision spends tokens deliberately. A refutation with no reading\nbehind it produces a corrected statement invented by the same run that refuted the old\none, and the corrections most worth having are the ones already in print.\n\n## Consequences\n\n- `/prove` gains a fourth outcome and the report says which: `proved`, `failing`,\n  `refuted`, render failure.\n- `--check` gains two rules: a node marked `proved` whose latest verdict is anything but\n  `PASS` is an error (it previously caught only `FAIL`), and a node whose latest verdict\n  is `REFUTED` must be `failing`.\n- Confidence needs no change. `failing` already scores $-1$ on the mathematical record\n  channel, and the refuting round's flaws stand undisposed, so a refuted node is already\n  where it belongs — negative, and capping everything above it.\n- **A cost accepted:** `REFUTED` is a strong verdict issued by one critic, and a critic\n  can be wrong about falsity as easily as about anything else. Two things bound it: the\n  literature pass runs before the verdict is reported, and the statement is *not* edited\n  — the worst case is a node parked at `failing` with a history entry that turns out to\n  be mistaken, which the user can overrule with `human:` and which `/update` reads\n  before acting.\n- The old behaviour is still available where it belongs: a critic that suspects but has\n  not established falsity issues `FAIL` with the doubt as a FATAL flaw, exactly as\n  before. `REFUTED` is for a refutation it can exhibit.\n\n## Alternatives considered\n\n**A `refuted` status.** Rejected: `failing` already means \"a standing FATAL or MAJOR\nflaw\", which is true here, and the stored-status set is small on purpose. The\ndistinction being drawn is *what kind* of defect stands, and that is what the verdict\nline already records.\n\n**Let `/prove` correct the statement when the correction is obvious.** Rejected outright.\nIt is exactly the case where the correction looks obvious that a frozen statement earns\nits keep — every consumer of the node, every proof that already cited it, and the\n`updates/` trail all assume the statement changes in one operator with one record.\n\n**Report it and leave the record alone.** Rejected: a run that discovers its target is\nfalse and writes nothing has discovered it for one reader, once. The history entry is\nthe cheapest part of this decision and the part that compounds.\n";</script>
