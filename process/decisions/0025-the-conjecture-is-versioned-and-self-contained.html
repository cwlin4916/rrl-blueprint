<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0025-the-conjecture-is-versioned-and-self-contained</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0025 — The conjecture is versioned and self-contained</h1><p class="lead">Generated from <code>process/decisions/0025-the-conjecture-is-versioned-and-self-contained.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Amends:** [0023](0023-the-question-block-states-a-conjecture.html) (the paragraph's shape), the \"no statement bodies\" clause of the index schema ([0002](0002-one-file-per-node.html))\n\n## Context\n\nADR 0023 made the per-question block a **Conjecture.** paragraph: the claim, then the\nstatus of its route. Reading it back the same day, the user directed three changes.\nFirst, the paragraph carried a date only incidentally, inside its status prose — a\nclaim that supersessions keep moving needs to say *which version of itself* a reader\nis looking at, and when it was stated. Second, it was not self-contained: it invoked\n\"the criterion Q1-L5(1)+(2)\", \"Q1-L3(iii)\", \"clean costalks\" as bare ids and\nshorthands, so the claim could not be read without opening three node files. Third,\nits references were names, not links — in a repository whose rule (I6) is that\nobjects are linked, never named.\n\n## Decision\n\nThe **Conjecture.** paragraph of every question:\n\n- **opens with a version label** *(v\\<k\\> — YYYY-MM-DD.)* immediately after the bold\n  marker, and **closes with a *Versions.* paragraph** — one entry per revision, newest\n  first, each dated and saying in a phrase what changed and under whose direction.\n  `/update` bumps the version whenever it revises the paragraph; the label is the\n  question-level counterpart of a node's append-only `updates/u<k>.md`.\n- **states the claim self-contained**: the criteria it asserts, the hypotheses they\n  live under, and the necessary/sufficient bracket around them are written out in\n  full, so the conjecture reads without leaving the page. The node's own\n  `## Statement` remains the canonical copy; the conjecture restates, and `/update`'s\n  neighbour pass — which already re-reads the paragraph on every supersession\n  (0023) — keeps the restatement aligned.\n- **links every reference**: node ids link to their `node.md`, objects link into the\n  appendix, supersessions link to the `updates/` file that records them.\n\nThe index schema's \"no statement bodies\" clause is scoped accordingly: none outside\nthe Conjecture's self-contained restatement.\n\nOne parser contract, now written into the schema comment: the site generator keys on\nthe bold **Setting** / **Problem statement** / **Conjecture** markers and ends a\nframing block at a blank line followed by a capital letter, a bold or a `- ` bullet.\nContinuation paragraphs therefore open with an italic label (*Sought.*, *The\nbracket.*, *Route status.*, *Versions.*), a `$$` display or a lowercase continuation\n— never a bare capital or a list. Q1's problem statement had been violating this\nunnoticed: its \"Sought:\" paragraph began with a capital and the rendered site was\nsilently truncating the block there.\n\n## Consequences\n\n- Q1's problem statement rephrased (and its truncation fixed); its conjecture\n  rewritten as v2, the criteria of Q1-L5(1)+(2), the saturation locus of Q1-L3 and\n  the clean-costalk hypotheses of Q1-L6 written out with every reference hyperlinked;\n  v1 is the 0023 reframing, superseded the same day.\n- The cost accepted is a stored restatement: the conjecture now repeats, in\n  compressed form, statements whose canonical copies live in node files, and a\n  supersession that touches a restated criterion must touch the conjecture in the\n  same commit — exactly the neighbour-pass obligation 0023 already imposed, now with\n  a version bump making the obligation visible when it is missed.\n- `main_dag.md`'s schema comment carries the new shape and the parser contract;\n  I15 in `process/pipeline.md` records the versioning rule.\n\n## Alternatives considered\n\n- **A `updates/` directory for the question, mirroring the nodes'.** Rejected:\n  questions have no directory, and git already stores the full text of every prior\n  version; what was missing was not storage but a *label* — which version is current,\n  stated where the claim is stated. The *Versions.* paragraph is that label plus a\n  one-phrase history; the diffs stay in git.\n- **A bold label `**Conjecture (v2 — 2026-08-04).**`.** Rejected: the parser keys on\n  the literal `**Conjecture.**` and every consumer would need the pattern widened for\n  a purely typographic gain; the label as the paragraph's first words renders\n  identically on the site card.\n";</script>
