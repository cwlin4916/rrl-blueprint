<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0036-an-example-says-what-it-matches</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0036 — An example says what it matches</h1><p class="lead">Generated from <code>process/decisions/0036-an-example-says-what-it-matches.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Amends:** [0018](0018-example-and-analogy-nodes.html) (what an `analogy` owes, now owed by every entry of `examples.md` too); complements [0014](0014-confidence-is-three-signed-channels.html) (the literature channel these findings feed)\n\n## Context\n\n`/examples` was built to answer two questions about a node — is the statement in\nprint, and what are its instances — and both halves were being answered honestly.\nWhat neither half was saying is the thing a reader actually needs: **which part of\nthe node's statement the finding matches.**\n\n[Q1-L3](../../nodes/Q1/Q1-L3/index.html) is the case that forced the\nrecord. Its statement has three numbered clauses — a support bound (i), a\nnonvanishing (ii), and the necessity of Hecke saturation (iii). Its `examples.md`\ncame back with five entries, four of them not instances at all but *analogues*: the\nfunction-theoretic harmonic analysis of $X(F)$, related to the sheaf-level statement\nby a dictionary the file states once in its header and then never uses again. Every\nentry was sourced, every hypothesis was discharged, and not one entry said \"this is\nthe classical form of clause (ii) and it is silent on (i)\". A reader met five\ncorrect paragraphs and could not tell which of them were evidence for what.\n\nTwo failure modes follow, and both were live in that file. A decategorified shadow\nreads as a case of the statement unless it is labelled — the correspondence is doing\nwork that nobody has written down. And a verdict of `instances`, or worse\n`precedent`, gets earned by findings that between them touch one clause of three,\nbecause nothing in the pipeline was ever taking the union.\n\n## Decision\n\nEvery finding in `examples.md` — each instance, each analogue, and each precedent\nhit — carries an explicit **match**, and a match names three things:\n\n- **Which part.** The clause number, the named hypothesis, or the quoted phrase of\n  the node's `## Statement` being matched. In the statement's own terms; \"related to\n  the node\" is not a match.\n- **Under what correspondence.** For an instance, the specialisation — which $G$,\n  which $X$, which $\\lambda$. For an analogue, the **dictionary**, written out once\n  per file with a source for each line of it that is in print and a plain label\n  where the agent extended it. An entry that is an analogue says so in its heading\n  and in its first sentence.\n- **What it does not reach.** The clause it is silent on, the structure the\n  dictionary drops, the hypothesis the source's setting fails. This half is the\n  finding, not a disclaimer: it is what says how much of the node the evidence\n  touches.\n\nThree consequences for the machinery, each landing in the operator rather than in a\ngate script, because the check is mathematical:\n\n1. **The instance template grows a fourth field**, `**What it matches.**`, between\n   the hypothesis discharge and the specialised conclusion. Three parts become four,\n   and §3e of the `/examples` skill gates on four.\n2. **The verdict is read against the matches.** A source matching one clause of\n   several is a partial precedent and says so; analogues alone never earn\n   `EVIDENCE: precedent`.\n3. **The orchestrator reports coverage.** Before dispatching, it lists the pieces of\n   the statement a finding could match — itself, not the agent, since an agent that\n   writes its own yardstick finds that everything fits. Afterwards it takes the\n   union of the matched parts and reports the complement: *these clauses nothing in\n   the literature touches.* A clause nothing matches is either new or wrong, and the\n   user learns which is being claimed on the day the search ran.\n\nA promotion candidate ([0018](0018-example-and-analogy-nodes.html),\n[0021](0021-example-and-analogy-nodes-nest.html)) carries its match with it into the\nnew node's creation entry, since reconstructing it later means reading the sources\nagain.\n\n## Migration\n\n[Q1-L3](../../nodes/Q1/Q1-L3/examples.html) was rewritten against this rule on\n2026-08-05: the dictionary lifted out of the header into a labelled paragraph with\nits BZSV §7.5.3 source, each of the five entries labelled *instance* or *analogue*\nin its heading and given a `**What it matches.**` field, and the coverage stated —\nclauses (i) and (iii) are matched by four entries between them, clause (ii) by none,\nsince no function-theoretic entry can even state it. No source, result number or\n`EVIDENCE:` line changed: the sourcing was already sound, and what was missing was\nthe correspondence.\n\nEarlier `examples.md` files are not rewritten wholesale. The next `/examples` run\nover a node brings that node's file to this shape.\n\n## Consequences\n\n- The cost is one field per entry, and it is the field the agent was implicitly\n  claiming anyway. The saving is that a reader stops having to reconstruct it.\n- The coverage line is a new research output, not a formatting improvement: it is\n  the pipeline's first mechanism for noticing that a clause of a statement has no\n  literature behind it.\n- `examples.md` stays outside the closed world ([I10](../pipeline.html)). A match is\n  not a proof obligation discharged, and naming the clause an analogue mirrors comes\n  no closer to citing it.\n";</script>
