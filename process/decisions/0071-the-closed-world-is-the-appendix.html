<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0071-the-closed-world-is-the-appendix</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0071 — The closed world is the appendix, and `objects:` records what a write-up used</h1><p class="lead">Generated from <code>process/decisions/0071-the-closed-world-is-the-appendix.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Status:** accepted\n**Amends:** [0030](0030-the-prove-budget-cap.html) (the `/prove` budget cap), [0070](0070-a-flaw-declares-its-kind.html) (a flaw declares its kind)\n\n## Context\n\nThe rule since the first invariant has been: a proof may invoke the appendix entries **its own node lists in `objects:`**, its `depends-on` statements, and standard mathematics needing no citation. Anything else is a breach of the closed world, and a breach is a `FAIL`.\n\nThe user's reading, after seeing the flaw survey, was that this \"is roughly stopping a lot of search\". It is, and the record says how much.\n\n[`process/pipeline/flaws.md`](../pipeline/flaws.html) counts 45 closed-world flaws across the 48 reports on disk — 13% of the corpus, five of them MAJOR, **none ever FATAL**. The referee's own summary at [Q1-L2-L1 r1, Flaw 1](../../nodes/Q1/Q1-L2/Q1-L2-L1/critiques/r1.html) is the whole case:\n\n> That fact is the content of the appendix entry `conv-d-shriek-d-star` …, which is **not among this node's declared objects**. … Remedy: widen the node's `objects:` to include the $\\mathcal{D}^!$/$\\mathcal{D}^*$ entry and link it at Step 1. **The mathematics is correct; the declared world does not license it.**\n\nThat entry existed. It had been transcribed from `main.tex:651–668` by the lead-researcher and checked. Nothing about admitting it was a judgement anyone needed to make twice. A round — six agents, about 270k tokens — failed on a missing line in a field.\n\nThen it compounded. A closed-world `FAIL` routes to the lead-researcher for a widening, and [I19](../pipeline.html) permits **one widening per invocation**; a second ends the run and hands the decision back to the user. So a node whose `objects:` was short in two places could not be proved at all, however correct the argument. The cap was written to stop *the closed world growing to fit a proof*, which is a real danger. It was firing on a field edit instead.\n\n## Decision\n\n**The closed world is `blueprint/appendix/`, entire.** A write-up may invoke any entry in it, together with its node's `depends-on` statements and mathematics needing no citation.\n\n**`objects:` becomes a declaration of what the write-up used, not a permit for what it may use.** It is still a canonical field and still carries the links the generated prompt inlines. It no longer gates anything, and the render gate recomputes it from the draft's links and reports the difference.\n\nThree consequences follow, and the fourth thing on the list is what does *not* change.\n\n1. **A `W` flaw is never above MINOR.** The critic may note an undeclared entry; it may not fail a round on one. `tools/check_render.py` computes the same fact before the critic runs, so a referee reporting it is reporting something already fixed.\n2. **A widening means a new appendix entry.** Declaring an entry that already exists is one line the `/prove` orchestrator writes, and it does not spend the budget of [ADR 0030](0030-the-prove-budget-cap.html). The one-widening cap now counts only what it was written to count: the closed world actually growing.\n3. **`S` — statement drift — is a gate check.** The write-up's `## Lemma` block must reproduce the node's `## Statement`, and that is a `diff`. It is the only FATAL standing in the repository today, at [Q1-L3-L2 r3, Flaw 20](../../nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r3.html), where the difference is two words and a comma.\n4. **A fact no appendix entry supplies is still a `GAP`.** It still stops the prover, still routes to the lead-researcher, still costs the one widening, and it is still the only way the closed world grows. This is the guard, and it has not moved.\n\n## Consequences\n\nThe guarantee the closed world exists for is unchanged: **no proof may assume a result the repository has not written down and checked against its source.** That guarantee never lived in the per-node subset. It lives in the appendix — in the fact that every entry was transcribed from a numbered result by an actor with the PDF open, and that only `/decompose` writes one.\n\nWhat is given up is a second, weaker guarantee that was never stated as a goal: that a write-up's ingredients were *predicted* before it was written. `objects:` was set by the lead-researcher at decomposition time, before anybody had attempted the proof. Treating a prediction as a permit is what made a correct argument fail.\n\nThe cost is that a node's declared world is now wider than the set it uses, until the gate reconciles it. That is a bookkeeping lag and the gate closes it every build.\n\nThe transpose is the one piece of real bookkeeping this creates. Each appendix entry carries a canonical `- **used by:**` line, checked against `objects:` by `build_dag_site.py --check`, so a widening is two edits and not one. Discovered the first time the new rule was exercised, when three entries added to [Q1-L3-L2](../../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) and [Q2-L5](../../nodes/Q2/Q2-L5/index.html) turned the close red.\n\nOne thing to watch: the generated `<id>_prompt.md` inlines the declared entries ([ADR 0063](0063-a-prompt-carries-what-is-needed-to-work.html)), so a node whose `objects:` has drifted short ships a packet missing an entry its own write-up leans on. The gate note is what catches that, and it is now a reason to keep the field current rather than a reason to keep it narrow.\n\n## Alternatives considered\n\n**Widen `objects:` node by node and keep the rule.** This is what has been happening, one failed round at a time. It costs a round per omission and never converges, because the omissions are only discovered by proving.\n\n**Generate `objects:` outright, like the FLAW block.** Attractive — the fact would then be stored once — but the field is read before a write-up exists, by `/decompose` and by the prompt builder, so it cannot be derived from one. Declared-and-reconciled is the version that works in both directions.\n\n**Drop `objects:` entirely.** It would take the generated prompt's inlined appendix with it, and that packet is what makes a node portable to a model outside the repository ([ADR 0029](0029-every-node-has-a-generated-self-contained-prompt.html)).\n";</script>
