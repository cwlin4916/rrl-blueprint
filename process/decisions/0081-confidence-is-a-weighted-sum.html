<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0081-confidence-is-a-weighted-sum</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0081 — Confidence is a weighted sum of four channels, and the repo is one of them</h1><p class="lead">Generated from <code>process/decisions/0081-confidence-is-a-weighted-sum.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-08\n**Status:** accepted\n**Supersedes:** [0068](0068-the-weakest-link-is-a-ceiling.html) (the weakest link is a ceiling)\n**Amends:** [0014](0014-confidence-is-three-signed-channels.html) (confidence is three signed channels), [0042](0042-confidence-shows-its-working.html) (confidence shows its working)\n\n## Context\n\nUser-directed. The complaint was that the formula is too complicated, and it was correct: reading a node's number meant holding three ceilings and a weighted sum in your head at once, and the answer to \"why is this red\" was usually none of the four things the panel showed you.\n\n[0068](0068-the-weakest-link-is-a-ceiling.html) fixed a real bug — the dependency discount was being charged twice, so confidence halved at every layer — and it fixed it by moving the weakest dependency out of the sum and into a `min`. That was right about the arithmetic and wrong about the semantics, and one day of running it showed why.\n\n**A hard ceiling makes most of the tree unreadable.** Of 113 nodes, 16 were negative and every one of them traced to five `failing` nodes. Q1-L3, Q1-L6, Q1-L5-L4, Q1-L5-L5 and Q1-L5-L6 all read exactly $-50\\%$ — not because anything was known about them, but because the `min` had copied one descendant's score onto all of them. Five nodes displaying the same number is a display that has stopped carrying information.\n\n**It made a true statement that nobody wants.** \"A node is never scored above what it rests on\" is defensible for a *proof*: an argument standing on a refuted step is broken. It is wrong as a general rule for a research DAG, where a lemma with a strong independent record over one shaky sub-lemma is genuinely better evidenced than a lemma with no record at all — and the ceiling scored them identically.\n\n**The reachable maximum was in the wrong place.** With `human:` silent, the two remaining channels summed to $75\\%$, and the $80\\%$ approval cap therefore never bound at all except on `endorsed` nodes. A cap that fires on one of five stored values is not a cap, it is a special case.\n\n**And the ask itself was arithmetic nobody could do.** The plan written for Q1-L3-L2 on 2026-08-08 had to state, as its central finding, that all the mathematics in it bought $+42\\%$ and no more, because a proved sibling with a silent literature channel was the binding ceiling. That is a true fact about the old formula and a useless fact about the mathematics.\n\n## Decision\n\n**One weighted sum over four channels, and one surviving ceiling.**\n\n$$\nC(v) \\ = \\ \\min\\Bigl(\\ \\mathrm{goalcap}(v),\\ \\ 0.20\\,H \\ + \\ 0.35\\,D \\ + \\ 0.15\\,L \\ + \\ 0.30\\,R\\ \\Bigr), \\qquad C(v)\\in[-1,+1]\n$$\n\n| | channel | weight | written by | read from |\n|---|---|---|---|---|\n| $H$ | human | 20 | the user, and no agent | the `human:` field |\n| $D$ | the record | 35 | `/prove` | the rounds in `critiques/` |\n| $L$ | literature | 15 | `/examples` | the `EVIDENCE:` line |\n| $R$ | the repo | 30 | derived | $\\min_u C(u)$ over the dependencies |\n\n$D$ and $L$ are the two halves of one thing — what a model did on this node — and they sum to $50$. They stay separate rows in the panel because *well refereed, no literature* and *literature supports it, never proved* are different states, and one number cannot say which you have.\n\n**$R$ is a term, not a ceiling.** A node resting on a refuted lemma is discounted by up to $30$ points rather than pinned to the lemma's own score. The weakest dependency is still what $R$ measures — the pessimistic reading survives — but it now competes with the node's own record instead of overruling it.\n\n**Vacuous is not silent.** A silent channel scores $0$ and shares its weight with nobody; that rule is unchanged and is why an untouched node sits at $0$. But a leaf has no dependencies, so $R$ is not *unknown*, it is *not applicable* — and its $30$ points are redistributed over the other three. Without that, 68 of the 113 nodes in this repository would lose $30$ points of range for the sole reason of having no children.\n\n**The approval cap is deleted, because the arithmetic now enforces it.** With $H$ silent the other three sum to at most $0.80$, so full confidence stays unreachable until the user writes `human: approved`. Same guarantee, one less `min`.\n\n**The goal-check ceiling stays** ([0040](0040-the-key-example-register.html)). A statement the bench contradicts cannot be well supported however clean its referee record, and that is a ceiling and not a channel.\n\n**A set of nodes still aggregates by its weakest member.** `weakest()` is untouched: a question is as well supported as its worst proof node. This decision is about how a *node* scores, not how a *question* summarises a set of them.\n\n## Consequences\n\n**31 of 113 nodes moved; the shape of the change is the point.** The eight largest rises are all nodes that were pinned by a distant descendant and now show their own position: Q1-L3, Q1-L6, Q1-L5-L4, Q1-L5-L5 and Q1-L5-L6 each go $-50\\%\\rightarrow-4\\%$, Q1-L5 $-50\\%\\rightarrow-12\\%$, Q1-L5-L3 $-50\\%\\rightarrow-15\\%$. The eight largest falls are between $1$ and $4$ points, all of them well-scored leaves absorbing the reweighting: Q1-L1 $+73\\%\\rightarrow+70\\%$, Q1-L3-L3 $+69\\%\\rightarrow+65\\%$. Nothing swung.\n\n**Red now means something local.** Negative nodes fall from 16 to 15, and the survivors are nodes with their own standing defect rather than nodes downstream of one. `by` in the confidence record changes meaning to match: `by == nid` now reads *nothing beneath this node is negative*, which is the test [0077](0077-the-ask-is-a-line-on-the-node.html) wants when it asks whether a node owes a `needs:` line.\n\n**A refuted dependency is now survivable, and that is the risk.** A node with a perfect record over a refuted child reads $+40\\%$ rather than $-50\\%$. If that turns out to read as endorsement of an argument standing on a false step, the remedy is to raise $R$'s weight or to reinstate the ceiling for `role: proof` nodes alone — not to reintroduce it everywhere, which is what 0068 did and what this reverses.\n\n**The panel grows a fourth row** and the footer loses the approval-cap sentence, since there is no approval cap to explain. The row for a leaf prints `vacuous` and an em-dash for its weight, so the redistribution is visible rather than silent arithmetic.\n\n**Nothing about the closed world changes.** Confidence is still derived, still stored nowhere, still uncitable, and still outside the closed world — no gate passes or fails on it, and no proof may mention it.\n";</script>
