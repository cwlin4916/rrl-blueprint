<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0032-a-nodes-own-file-is-named-for-the-node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0032 — A node&#x27;s own file is named for the node</h1><p class="lead">Generated from <code>process/decisions/0032-a-nodes-own-file-is-named-for-the-node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05 · **Status:** accepted · **Kind:** repository structure\n\n## Context\n\n[ADR 0005](0005-node-directories.html) gave every node a directory and put its fields and statement in `node.md`. Two later records added files beside it — `<id>_history.md` ([ADR 0027](0027-a-node-carries-its-history.html)) and the generated `<id>_prompt.md` ([ADR 0029](0029-every-node-has-a-generated-self-contained-prompt.html)) — and both were named for the node rather than for their kind, so that a path lifted out of its directory still says which node it belongs to.\n\nThat left `node.md` as the one file in a node directory whose name does not identify the node, and it is the file quoted most often: in a critique, in a commit message, in a tab strip, in a link pasted into a message. `blueprint/nodes/Q1-L4/Q1-L4-L2/node.md` says which node it is only because the reader parses the directory chain, and forty-three open editor tabs all read `node.md`. The generator's own header comment recorded the inconsistency and defended it — \"`node.md`, `proof.md` and `critiques/` keep their fixed names\" — which is the shape of a convention nobody had re-examined.\n\n## Decision\n\n**A node's own file is `<id>_node.md`.** `blueprint/nodes/Q1-L4/Q1-L4-L2/node.md` becomes `blueprint/nodes/Q1-L4/Q1-L4-L2/Q1-L4-L2_node.md`, and a node directory now names its node in every file it owns:\n\n```\nblueprint/nodes/Q1-L4/Q1-L4-L2/\n    Q1-L4-L2_node.md        fields and the frozen statement    (canonical)\n    Q1-L4-L2_history.md     every dated entry in its life      (canonical)\n    Q1-L4-L2_prompt.md      the self-contained packet          (generated)\n    proof.md                the one-page write-up\n    critiques/r1.md         the referee reports\n    updates/u1.md           the statement revisions\n```\n\n**`proof.md`, `critiques/` and `updates/` keep their fixed names.** The three renamed files are *about the node* — its fields, its life, its packet — and there is exactly one of each, so the id is the whole of their identity. The rest are *the work done on the node*: a write-up, a round, a revision. They are numbered or singular within the directory, they are read together with the node and never alone, and giving them the id too would put it in every path segment twice over.\n\nThe site is unaffected in shape: `<id>_node.md` still renders as the directory's `index.html` ([ADR 0016](0016-the-site-mirrors-the-source-tree.html)), so no URL changed.\n\n## Consequences\n\n- `tools/build_dag_site.py` finds nodes by `rglob(\"*_node.md\")` filtered to `p.name == f\"{p.parent.name}_node.md\"`, which is a strictly sharper discovery rule than `rglob(\"node.md\")`: a node file that has drifted out of the directory named for it no longer looks like a node.\n- Every link into a node was rewritten mechanically, by resolving the target and renaming its last segment — 766 links across 136 files, plus the generated packets on the next build. The critiques were included: they are an append-only audit trail in what they *say*, and a broken path is not something they say.\n- One near-miss is worth recording. The first rewrite matched on the filename `node.md` and so caught [`0002-one-file-per-node.md`](0002-one-file-per-node.html), whose name ends in those characters by coincidence; eleven links to that decision record broke and the render gate caught all eleven. A path rewrite must resolve its target and check where it lands, not match on the tail of a string.\n\n## Considered and rejected\n\n- **Leaving `node.md` alone.** It is the status quo and it costs nothing to keep, but it makes the one file that identifies a node the only one that does not, and the tab-strip problem is real for a tree that is now forty-three nodes deep in four families.\n- **Renaming `proof.md` to `<id>_proof.md` as well.** Symmetric, and briefly tempting. Rejected because it says the id twice — the directory already carries it — for a file whose name is already unambiguous within the directory, and because `proof.md`, `critiques/` and `updates/` form one group under the rule above: they are the work, not the node.\n- **A flat naming scheme, `blueprint/nodes/Q1-L4-L2_node.md`, with no directories.** That is [ADR 0005](0005-node-directories.html) and [ADR 0012](0012-sub-lemmas-nest-in-their-parent.html) reopened, and both still hold: the directory is what makes a node's examples, critiques and updates one thing.\n";</script>
