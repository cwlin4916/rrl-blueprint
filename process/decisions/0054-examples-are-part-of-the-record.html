<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0054-examples-are-part-of-the-record</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0054 — What the literature returned is part of the node&#x27;s record</h1><p class="lead">Generated from <code>process/decisions/0054-examples-are-part-of-the-record.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0014](0014-confidence-is-three-signed-channels.html) (the literature channel), [0036](0036-an-example-says-what-it-matches.html) (an example says what it matches), [0037](0037-the-node-panel-carries-the-statement.html) (a readout shows the statement and links the record)\n\n## Context\n\n`/examples` writes `blueprint/nodes/<id>/examples.md`, and one line of it — the `EVIDENCE:`\nverdict — moves the node's confidence. Everything else the run produced went nowhere the\nnode itself could see it.\n\nConcretely, before this decision a node with a completed literature search looked, in its own\nfile, exactly like a node with none. The field block named the write-up and the latest\ncritique round and stopped there. Nothing in `<id>_node.md` said a search had happened;\nnothing in `<id>_history.md` said what it found. The evidence existed, the *number moved*,\nand the record of why was a sibling file nobody was pointed at.\n\nTwo things were lost by that, and the second is the expensive one.\n\n**The pointer.** A reader opening the node could not tell whether the literature had been\nexamined and come back empty, or had never been examined at all. Those are opposite\nfindings and they looked identical.\n\n**The negative result.** [0036](0036-an-example-says-what-it-matches.html) makes every finding\nname the part of the statement it matches, precisely so that the *complement* can be\ncomputed — the clauses nothing in print touches. That complement is the most valuable thing\na run produces: a clause the literature does not match is either new or wrong. It was\nbeing reported to the user in a chat message and written down nowhere. The run on `Q2-L1`\nestablished that nothing in print matches either direction of clause (i) as an implication,\nand nothing at all matches clause (iii); a month later that would have had to be\nrediscovered.\n\n## Decision\n\n**`examples.md` is part of the node's record, named by the node and dated in its history.**\n\n- The field block of `<id>_node.md` carries an `examples:` line, between `critique:` and\n  `objects:`, reading either of\n\n```\n- **examples:** [examples.md](examples.md)\n- **examples:** —\n```\n\n  The dash is for a run that ended in a `prompts/examples.md` instead, which is the honest\n  \"searched, found nothing worth recording\" outcome.\n\n- `<id>_history.md` gains a dated entry per run: the verdict, what was found in a sentence\n  or two, and **which clauses of the statement nothing found touches**. A second run a month\n  later appends its own entry; neither is rewritten, so the node shows how its literature\n  standing was reached.\n\n- The field is a **pointer and never a copy.** The `EVIDENCE:` verdict stays in\n  `examples.md` alone, because that is where the confidence derivation reads it and a second\n  copy is a second thing to drift. `tools/build_dag_site.py --check` fails when the field and\n  the disk disagree in either direction: a file the field does not name, or a field naming a\n  file that is not there.\n\n`/examples` §5b writes both, and it is the orchestrator's job, not the example-finder's —\nthat agent writes `examples.md` and nothing else, exactly as before.\n\n## Consequences\n\n**A node states its own evidential position.** `draft:`, `critique:` and now `examples:` are\nthe three channels of [0014](0014-confidence-is-three-signed-channels.html) made visible in one\nblock: what was proved, who refereed it, what the literature says. `human:` is the fourth and\nwas always there.\n\n**The coverage line survives the session.** The complement of what the literature matches is\nnow written into the history at the moment it is computed. This is the part of the decision\nthat is about research rather than bookkeeping.\n\n**Ninety node files changed**, mechanically: the field was inserted after `critique:` and set\nfrom what is on disk. No confidence moved — the derivation reads `examples.md` as it always\ndid, and the field adds no input to it.\n\n**What this does not do.** It does not make `examples.md` citable. The file is still outside\nthe closed world; no proof, node or appendix entry may invoke it, and naming it in the field\nblock is a pointer to a record, not an admission to the vocabulary. Invariant I10 is\nunchanged.\n";</script>
