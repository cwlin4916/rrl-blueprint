<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0042-confidence-shows-its-working</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0042 — Confidence shows its working</h1><p class="lead">Generated from <code>process/decisions/0042-confidence-shows-its-working.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Amends:** [0014](0014-confidence-is-three-signed-channels.html) — the channels, weights and cap are unchanged; two defects in how they were computed are corrected, and the derivation is now shown wherever the number is. Amends [0037](0037-the-node-panel-carries-the-statement.html) (what the graph panel renders). Complements [0040](0040-the-key-example-register.html), whose goal channel is a further ceiling on the same aggregate\n\n## Context\n\n[0014](0014-confidence-is-three-signed-channels.html) put a signed percentage on every\nnode, every question and the repository:\n\n$$\nC(v) = \\min\\left(\\mathrm{cap}(v),\\ \\tfrac14 H(v) + \\tfrac12 D(v) + \\tfrac14 L(v)\\right)\n$$\n\nHuman judgement at 25, the mathematical record at 50, the literature at 25; each\nchannel free to be silent; $D$ the Baconian ratio over the flaws the critiques raised\nand disposed of, capped by the weakest node beneath. It is derived from the audit trail\nprecisely so nobody has to take it on trust.\n\nA reader could not follow it back. The card showed a percentage; the panel showed one\nline of prose — `+22% — 19 of 25 defeaters eliminated, 6 standing · human — ·\nliterature —`. Where those numbers came from, which file said so, and what would move\nthem lived only in the builder. A number that cannot be audited is a number taken on\ntrust, which is the one thing this one was built not to be.\n\nBeing unauditable is also how it stayed wrong. Two defects sat in the derivation\nthrough every build since 0014, and both were visible only to someone reading the\nPython.\n\n**A passing round's flaws counted against the claim.** `support()` read the last\nround's flaw count as *standing* and every earlier round's as *eliminated*, regardless\nof what the rounds returned. But a node reaches `proved` exactly by its last round\nreturning `VERDICT: PASS`, and a PASS disposes of everything it raised — so on every\nproved node in the repository the final referee's findings were scored as undefeated\ndefeaters. [Q1-L4-L3](../../nodes/Q1/Q1-L4/Q1-L4-L3/index.html) passed its\none round having raised and disposed of seven MINOR flaws, and scored $0.11$; a node\nwhose referee raised nothing at all scores $0.50$. **The harder the last referee looked,\nthe worse the claim did** — the exact inverse of the eliminative-induction reading\n`support()`'s own docstring states and 0014 was written to capture.\n\n**The prose and the number were computed separately.** `conf_note` split the same flaw\nledger a second time, so the sentence beside the score described a different\ncalculation from the score.\n\n**An empty set of nodes scored full confidence.** `weakest([])` returned $1.0$ — \"an\nempty set carries no doubt\". A question whose nodes are all examples, with no proof\nchain at all, would have rendered at $+100\\%$, the one number the display must never\ninvent. Its own note already said \"nothing to weigh yet\" beside it.\n\n## Decision\n\n**The confidence panel shows the derivation, and the derivation is fixed to match what\nit was documented to be.**\n\n### The decomposition\n\nClicking any node opens a `Confidence` section built by one function, `conf_html`, and\nrendered as HTML on the server. One row per channel, and each row carries three things:\nwhat the channel scored, what it therefore contributes to the total, and **where to go\nand read the record it scored**.\n\n- **human** — the word the user set, or the fact that nobody has weighed the claim by\n  hand, linking the `human:` field of `<id>_node.md`.\n- **the record** — the status, the ledger in words, and one link per critique round\n  carrying that round's verdict and how many flaws it raised (`r2: PASS, 7 raised`),\n  plus the write-up being refereed. When something beneath the node is weaker, the row\n  says so, names it, gives its percentage and links it — because the channel took that\n  number and not the node's own.\n- **literature** — the `EVIDENCE:` verdict and what it means, linking `examples.md`, or\n  the open prompts when `/examples` came back empty, or the plain statement that\n  `/examples` has not been run.\n\nThen the total, the cap when it binds, and one closing line naming what the arithmetic\nassumes. Nothing in it is new evidence: it is the same derivation, shown.\n\nIt is generated once per node per page and shipped in the graph payload as HTML, so the\ngraph panel and the node page display the same string. A second renderer in JavaScript\ncould drift from the Python one; there is no second renderer.\n\n### The panel is three sections\n\n`Statement`, `Confidence`, `Pages` — what the node claims, how well supported it is and\nwhy, and where to read further. Sub-lemmas, dependencies, required-by and appendix\nobjects were headings of their own; they are all *somewhere to go*, so they are rows of\n`Pages`. This is [0037](0037-the-node-panel-carries-the-statement.html)'s rule carried\nthrough: the panel owes a reader the claim first, and links for the rest.\n\n### Two corrections to the derivation\n\n- **A round's verdict decides what its flaws are.** `PASS` disposes of everything that\n  round raised; only a round still open leaves defeaters standing, and the last round is\n  the only one that can be, since a `FAIL` is what sends the node back for another.\n  One function, `ledger(n)`, returns the split, and both the score and the sentence\n  explaining it read it.\n- **An empty set is silent, not certain.** `weakest([])` scores $0$.\n\nEverything else in 0014 stands: the weights, the signed range, the silent channels, the\n80% cap pending `human: approved`, and confidence staying outside the closed world —\nnothing cites it and no gate passes or fails on it.\n\n## Consequences\n\nEvery proved node's number rises, most of them sharply, because the correction restores\nthe eliminative reading. Selected, before → after:\n\n| node | own record | before | after | limited by |\n|---|---|---|---|---|\n| `Q1-L4-L3` | $0.11 \\to 0.89$ | $+6\\%$ | $+44\\%$ | itself |\n| `Q1-L4-L4` | $0.74 \\to 0.96$ | $+3\\%$ | $+22\\%$ | `Q1-L4-L3` |\n| `Q1-L2-L4` | $0.17 \\to 0.83$ | $+8\\%$ | $+42\\%$ | itself |\n| `Q1-L2` | $0.20 \\to 0.80$ | $+4\\%$ | $+19\\%$ | `Q1-L2-L2` |\n| `Q1-L1` | $0.72 \\to 0.97$ | $+61\\%$ | $+73\\%$ | itself |\n\nThe repository aggregate does not move: it is $-12\\%$, limited by\n[Q1-L5](../../nodes/Q1/Q1-L5/index.html), whose literature channel records a\ngap. A correction to how proved nodes score cannot touch a minimum held by an unproved\none, which is the weakest-link rule behaving correctly.\n\n## What this decision does not fix\n\nRecorded here so the next reader does not have to rediscover them. Each changes what\nevery number on the site means, so each is the user's call and none is taken here.\n\n1. **The mathematical channel decays by about a half per level of the DAG, even when\n   nothing is wrong.** $D(v)$ is the minimum of $v$'s own record and every dependency's\n   **whole** $C(u)$ — deliberate in 0014, so that a refuted sub-lemma propagates upward.\n   But $C(u)$ already has $u$'s silent human and literature channels folded in at a\n   quarter each, so a perfect child passes up about half its record.\n   [Q1-L4-L4](../../nodes/Q1/Q1-L4/Q1-L4-L4/index.html) has a $+0.96$\n   record — 25 defeaters raised and disposed of across three rounds — and shows $+22\\%$,\n   because its child `Q1-L4-L3` has a $+0.89$ record and passes up $+0.44$: the parent's\n   *mathematical* channel is halved by the child's *missing human review*. The fix is to\n   take the minimum over the dependencies' $D$ rather than their $C$ — record against\n   record — and give refutation its own route upward, which is (2).\n2. **There is a ceiling but no floor.** `human: refuted` scores $-1$ at weight $\\tfrac14$\n   and can be outvoted three to one: a refuted node with a good record and a literature\n   precedent lands at $+36\\%$. `EVIDENCE: counterexample` is outvotable the same way. A\n   refutation is not one vote among three, it is a claim that the thing is false, and it\n   should impose a negative ceiling exactly as `approved` lifts the positive one. The\n   goal channel of [0040](0040-the-key-example-register.html) is already shaped this\n   way — a cap, not a weight — which is the pattern to copy.\n3. **A well-refereed node nobody has approved cannot exceed about 50%,** because silent\n   channels score zero without their weight being shared out. Deliberate in 0014 and\n   defensible, but $+22\\%$ reads as \"we doubt this\" when it means \"two of the three ways\n   of checking have not been tried\". The decomposition now says which channels are\n   silent, which is the honest repair short of changing the formula; showing *coverage*\n   beside the value would be the other.\n4. **Decomposing a node lowers its confidence.** An `open` child contributes $0$ through\n   the minimum, so splitting a `drafted` node at $0.25$ into honest sub-lemmas drops it\n   to $0$. Either the low number was always the true one and the display is right, or\n   making an argument more explicit should not be penalised — worth settling.\n5. **`/update` does not reset the flaw ledger.** Flaws raised against a statement that\n   has since been revised still count as eliminated defeaters for the revised one.\n   `updates/u<n>.md` is on the record and the confidence code has never read it. This\n   matters more now that eliminated flaws are what raise the score.\n6. **The 80% cap binds nowhere.** It is reachable in principle after this correction and\n   `capped` is false on all 54 nodes.\n7. **An illustration moves the number.** `EVIDENCE: instances` is worth up to $+25\\%$\n   while \"examples illustrate, never justify\" keeps `examples.md` outside the closed\n   world. Consistent — confidence is outside it too — but it is the one place an\n   illustration has arithmetic consequences, and it should be a choice rather than an\n   accident.\n8. `hue()` reads the unrounded value and `pct()` rounds, so a node at $+0.004$ prints\n   `0%` and tints faintly green.\n";</script>
