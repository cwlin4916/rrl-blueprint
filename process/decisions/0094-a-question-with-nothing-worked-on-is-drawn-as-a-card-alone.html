<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0094-a-question-with-nothing-worked-on-is-drawn-as-a-card-alone</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0094 — A question with nothing worked on is drawn as a card alone</h1><p class="lead">Generated from <code>process/decisions/0094-a-question-with-nothing-worked-on-is-drawn-as-a-card-alone.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[decisions](README.html) · [the graph](../../dag.html) · [pipeline](../pipeline.html)\n\n**Date:** 2026-08-09\n**Status:** accepted\n**Amends:** [0082](0082-the-root-graph-draws-questions-alone.html) and [0089](0089-the-argument-is-drawn-in-circles.html), which decide what a graph page lays out.\n\n## Decision\n\n`tools/build_dag_site.py` carries one set, `GRAPH_QUESTION_ONLY`, naming the questions whose subtree the graph does not draw. A question in it gets its card on `dag.html` and on its own `dag/q<n>.html`, with the footer reading **not started** instead of a node count, and no node cards on either page. Q3 and Q4 are in it.\n\nIt is a display rule and the only one on that page. Every node stays on disk with its statement, its history and its generated prompt; the node pages are still built, still reached from `nodes/index.html` and from `main_dag.md`, and the tallies, the confidence arithmetic and the pipeline are untouched. A node page under such a question still draws its own local graph — the rule tests for the absence of a focus node, so a page about a node always draws the node it is about.\n\n`graph_anchor` returns the whole fragment now, `#` included, and returns the empty string when the question draws nothing. The \"in the graph\" row of such a node's page reads *open the question's DAG page* and links the page without a fragment.\n\n## Why\n\nQ3 has eight nodes and Q4 has seven, and **all fifteen are `open`**: no draft, no critique, no example, no goal-check, no history beyond the decomposition that created them. Drawing them puts fifteen identical grey boxes on a canvas in front of somebody who has just been handed the site. What those boxes communicate is not *here is the argument* — it is *somebody guessed at the shape of an argument once*, which is true, and is not what a graph is for.\n\nThe alternative was to delete the fifteen directories. That throws away fifteen statements which are the correct starting point whenever either question is picked up, to fix a problem that is entirely about what a reader sees. The record and the readout are different things, and this repository has kept them separate everywhere else — confidence and importance are derived and stored nowhere, `ready` is derived and stored nowhere, the flaw block is generated from records that hold the fact. This is the same separation applied to whether a subtree is worth drawing.\n\nThe count on the card mattered more than expected. `${S.n} nodes` said *15 nodes* and the door said *open its DAG →*, so a card advertising fifteen led to a page showing none. The footer now says `not started`, and the `▾ menu` row says *decomposed, nothing worked on yet* rather than a count.\n\n## Consequences\n\n- Delete an entry from `GRAPH_QUESTION_ONLY` the day its question has a node worth showing. Nothing else has to move: the subtree is on disk and the layout code never stopped being able to draw it.\n- A link written at `dag/q3.html#Q3-L1` no longer resolves to an element. Nothing writes one — `graph_anchor` is the only producer and it now returns the empty fragment for these questions.\n- The rule is invisible in the source of truth. A reader of `blueprint/main_dag.md` sees Q3's eight nodes and a reader of `dag/q3.html` does not, which is a real inconsistency and the price of not deleting anything. `--check` does not know about the set, so it cannot go stale against the disk; it can only go stale against a question that has started, and the remedy for that is a one-line edit.\n";</script>
