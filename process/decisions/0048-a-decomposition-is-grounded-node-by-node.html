<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0048-a-decomposition-is-grounded-node-by-node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0048 — A decomposition is grounded node by node</h1><p class="lead">Generated from <code>process/decisions/0048-a-decomposition-is-grounded-node-by-node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0006](0006-examples-from-the-literature.html) (examples from the literature) and [0036](0036-an-example-says-what-it-matches.html) (an example says what it matches). Moves the operator those two describe from *available* to *required*, at one specific moment.\n\n## Context\n\n`/examples` has existed since 0006 and works. It is also, at the time of this record,\nalmost entirely unrun: of 62 nodes in the tree, a handful carry an `examples.md`. The\nreason is structural rather than negligent — `/examples` is a separate command with its\nown cost, and the moment it is most useful is the moment nobody is thinking about it.\n\nThat moment is decomposition. A `/decompose` run produces five or eight statements in\none go, each written by an agent reasoning about what *would* suffice to prove the\nparent. Nothing in that process requires any of them to be about anything. The failure\nmode is specific and it has already happened in this repository: a statement cut at a\nlevel of generality above anything the literature actually discusses, whose hypotheses\nnothing is known to satisfy, and which reads perfectly well until a prover spends two\nrounds discovering there is no case to hold on to. Q1-L5-L6 — where the decomposition\nitself records that \"the difficulty has moved\" — is a node of exactly this shape.\n\nThe economics are lopsided. An example-finder pass costs a fraction of a `/prove` run,\nand it runs *before* the statements harden into a parent's `## Decomposition` and a\ndozen `depends-on` links. Finding out that a piece is vacuous, or that the literature\nalready contains a sharper version, is cheap on the day the piece is cut and expensive\nafterwards — statements are frozen (I2), so a correction later costs an `/update`, an\n`updates/u<n>.md`, a reset status, and every consumer re-read.\n\n## Decision\n\n**Every node a `/decompose` run creates leaves that run carrying at least one example.**\n\n1. A new step 4, between validation and the presentation pass: one **example-finder**\n   subagent per new node, in parallel, one node per agent.\n2. Scope is the nodes whose **role:** is `proof` or `evidence`. An `example` or\n   `analogy` node *is* an instance and needs none of its own; a `thought` is skipped.\n3. Per node, the run gates on exactly one of `examples.md` (with its closing `EVIDENCE:`\n   line) or `prompts/examples.md` existing. Both, or neither, sends that one agent back.\n4. **An honest empty hand passes.** A finder that searched and found nothing writes the\n   self-contained prompt under `prompts/` — 0006's deliverable — and the run continues.\n   What does not pass is an invented example, which was already the rule and is restated\n   here because the requirement creates the pressure.\n5. **`EVIDENCE: counterexample` on a node this run created stops the run.** The\n   decomposition has just cut a piece the literature refutes; it is not committed as\n   sound. Report it and hand the re-cut back to the user.\n6. The report says, per node, what was found — the verdict, the simplest instance in a\n   clause, or the fact that the search came back empty and where the prompt is.\n\n## Justification\n\nThe requirement is a **test of the statements**, not a decoration on them. Examples stay\noutside the closed world exactly as before: nothing here may be cited by a proof, a node\nor an appendix entry. What an instance establishes is that the statement is not vacuous\nand that its hypotheses are load-bearing — two facts that are worth almost nothing after\na proof exists and are worth a great deal before one is attempted.\n\nPutting it in `/decompose` rather than leaving it to `/examples` is the whole decision.\nThe same work, offered as an option, does not happen; attached to the operator that\ncreates the obligation, it happens once per node, at the only moment when acting on the\nanswer is cheap. It also gives the lead-researcher something to write against — it is\ntold in step 2 that every node it cuts goes to a finder — which is a pressure toward\nstatements about things rather than statements about statements.\n\nThe empty-hand escape is what keeps the requirement honest. A gate that demanded a real\nexample unconditionally would be a gate that produced fabricated ones, and this\nrepository has an existing decision (0006) about precisely that: the deliverable when\nnothing is found is a prompt, not a fiction. The requirement is that the *search* runs,\nand that its result is on the record.\n\n## Consequences\n\n- `/decompose` gets materially more expensive: an n-node expansion now runs n\n  example-finders. Accepted. Each is small next to one `/prove` round, and the pass\n  reaches every node instead of the few someone remembered.\n- Nodes will accumulate `prompts/examples.md` files. That is information, not debt: a\n  decomposition where most pieces came back empty is a decomposition cut above the level\n  anything is written about, and the report is instructed to say so in one sentence.\n- The literature channel of the confidence derivation starts populated rather than\n  silent. A node that was going to sit at `L = SILENT` for months now carries whatever\n  its finder found from day one — including, where the finder found a gap, a negative.\n  This will lower some numbers. Lowering a number that was only high because nobody had\n  looked is the derivation working.\n- `/examples <id>` remains a command. It is now for *re-running* a search — after a\n  statement changes, after a source is added to `papers/` — rather than for the first\n  one.\n- **A cost accepted:** an example-finder run at statement time works from the statement\n  alone, with no write-up to check against, so it will sometimes match an instance to a\n  clause more loosely than a post-proof run would. 0036's rule — every finding names\n  which part of the statement it matches and what it does not reach — is what bounds\n  that, and it is why the finder is given the appendix entries inline rather than left\n  to guess the vocabulary.\n\n## Alternatives considered\n\n**Require it in `/prove` instead.** Rejected: by then the statement is frozen and a\ndozen links point at it. Learning that a node is vacuous at prove time means an\n`/update`, not a re-cut, and the whole value is in re-cutting.\n\n**Require a real example, no prompt escape.** Rejected — see 0006. A gate that cannot be\nsatisfied honestly gets satisfied dishonestly, and an unsourced example is worse than\nnone because it looks like evidence.\n\n**Run one finder for the decomposition as a whole.** Rejected: it optimises for the\ndecomposition being illustrated and against the *individual* statements being tested,\nwhich is the failure this record exists to catch. One agent covering eight statements\nfinds one good example and calls it a day; the node that had nothing is the one that\nneeded the answer.\n";</script>
