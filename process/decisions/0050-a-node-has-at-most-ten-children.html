<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0050-a-node-has-at-most-ten-children</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0050 — A node has at most ten children, and the remedy is to group</h1><p class="lead">Generated from <code>process/decisions/0050-a-node-has-at-most-ten-children.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0024](0024-one-graph-with-side-branched-corroboration.html) and [0026](0026-sub-lemma-families-fold-into-their-parent.html) (what a card draws), [0039](0039-one-graph-for-every-question.html) (one graph, one card per question), [0047](0047-an-example-node-is-a-proposition.html) (an e/a node decomposes)\n\n## Context\n\nNothing in the pipeline bounded the width of a layer, and two questions had grown past what\na card can show. `Q1` carries sixteen direct children — six lemmas, three analogies, seven\nexamples — and `Q2` thirteen. The graph draws every one of them side by side, because\n[0026](0026-sub-lemma-families-fold-into-their-parent.html) folds a node's *grandchildren* into a\nchip and says nothing about its children.\n\nThe result is a card nobody reads. Sixteen tiles admit no order: a reader cannot see which\nlemmas are the spine and which are corroboration, cannot find the one node they came for,\nand gets no help from the layout because there is no layout left — the picture has become a\nlist, and `main_dag.md` is already the list. The failure is not that the tree is wrong. It\nis that the tree was only ever grown downward from a question and never regrouped, so every\nnew lemma and every promoted example landed in the same layer as everything else.\n\n[0047](0047-an-example-node-is-a-proposition.html) makes the fix available for the first time.\nBefore it, an e/a segment was terminal and a lemma written to serve one example had nowhere\nto live but beside that example; now `Q2-e1-L1` is an ordinary sub-lemma of `Q2-e1`, and the\ntwenty children the four Q2 examples gained went *under* them rather than into `Q2`'s layer.\nHad the terminal rule still held, `Q2` would carry thirty-three children today.\n\n## Decision\n\n**A container holds at most ten direct children.** A container is a question or a node with\na decomposition; a node's children are the ids one segment longer than its own, and a\nquestion's are the nodes at depth one. Three rules.\n\n1. **The cap is ten, and it is `MAX_CHILDREN` in `tools/build_dag_site.py`.** Ten is what a\n   card shows in one screen and what a reader holds at once; the number is one constant so\n   that changing it is one edit and one commit message, not a convention argued per question.\n\n2. **The remedy is to group, never to delete or to fold.** A child written to serve one\n   sibling belongs *under* that sibling — a lemma the example needs goes inside the example,\n   which is exactly what [0047](0047-an-example-node-is-a-proposition.html) opened up. A family\n   of siblings that share a job gets a node naming the job, and becomes its decomposition.\n   Neither move loses a claim, which is what distinguishes both from hiding a branch from\n   the picture: nothing here changes what is on the record, only which layer it sits in.\n\n3. **`/decompose` enforces it at creation; the gate reports what is already there.**\n   The lead-researcher refuses an expansion that would take a container past ten and says\n   which grouping it would need instead — a decomposition into eleven siblings is a\n   decomposition that has not finished. `tools/build_dag_site.py --check` counts every\n   container and emits a **note**, naming the container, the count and its children.\n\n## Justification\n\n**Why the gate notes rather than fails.** A hard failure would be the ordinary choice — the\nrepository's own position is that a rule nothing checks is violated within a month — and it\nis wrong here, for a reason specific to what clearing the violation costs. Regrouping means\nmoving node directories, and a node's id is its path ([I12](../pipeline.html#4-invariants)):\nmoving it renames it, and the renaming breaks the links that its append-only critiques\n([I4](../pipeline.html#4-invariants)) already wrote at the old id. Those files are never\nrewritten to match a convention adopted after them, so the migration is real work with a\nmathematical judgement inside it — deciding which lemma each example illustrates is the\nlead-researcher's call, not a rename script's.\n\nA gate that failed on an inherited shape would therefore block every command in the\nrepository, on mathematics that is fine, until someone performed that migration. That\ninverts the cost: the rule exists to keep a picture legible, and it would be stopping proofs.\nSo the cap binds where the growth happens, where it is free — nothing has been written yet,\nand the lead-researcher has the whole decomposition in hand — and the gate's job is to make\nthe two standing violations impossible to forget, which a note printed on every build does.\n\n**Why not fold instead.** The site could hide the overflow behind a chip, the way\n[0026](0026-sub-lemma-families-fold-into-their-parent.html) hides a sub-lemma family. Rejected:\nfolding would make the picture legible while leaving the tree exactly as unstructured as it\nis, and the next reader would meet the same sixteen nodes one click in. A fold is a rendering\nanswer to a rendering symptom; the symptom here is that a layer was never grouped.\n\n## Consequences\n\n- `tools/build_dag_site.py`: `MAX_CHILDREN = 10` beside `ROLES`; `validate` counts children\n  per container and appends a note per violation, listing them.\n- `.claude/skills/decompose/SKILL.md`: the cap is a precondition of an expansion, with the\n  two groupings as the stated remedy.\n- `CLAUDE.md` and [`process/pipeline.md`](../pipeline.html) record it — the latter as I27.\n- Standing violations at adoption, reported by the gate and cleared by a migration the user\n  commissions: `Q1` at sixteen and `Q2` at thirteen.\n- The rule is not local to this repository. It goes into `/dag-blueprint` as an invariant\n  and into that skill's builder, since it is a fact about trees and pictures rather than\n  about this argument.\n\n## Alternatives considered\n\n**Cap each kind separately — ten lemmas, ten examples, ten analogies.** Rejected, and it is\nworth naming because it is the tempting one: under it `Q1` (6 + 3 + 7) and `Q2` (9 + 4) both\npass, and the rule would have been adopted with nothing to fix. That is the objection. The\ncard draws all of them, so the reader's count is the total, and a cap chosen because current\nstate satisfies it is decoration.\n\n**Cap the drawn card and leave the tree alone.** Rejected as the fold above: the tree is what\na later reader navigates, and the picture is a readout of it. Fixing only the readout is\n[I8](../pipeline.html#4-invariants) run backwards — treating the generated artifact as the\nthing to repair.\n\n**Make it a hard failure and migrate `Q1` and `Q2` in the same change.** Rejected for now,\nnot on principle: the migration is right, but it moves nine directories with twenty\ndescendants under them, and choosing which lemma each example hangs from is a mathematical\ndecision that belongs in a run the user asked for and can see. The gate names both\nviolations at every build until it happens.\n";</script>
