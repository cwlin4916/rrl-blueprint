<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0031-presentation-is-a-stage-not-a-command</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0031 — Presentation is a stage of every command, not a command of its own</h1><p class="lead">Generated from <code>process/decisions/0031-presentation-is-a-stage-not-a-command.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Supersedes in part:** [0004](0004-checker-separate-from-critic.html), which created `/check`\n\n## Context\n\n[ADR 0004](0004-checker-separate-from-critic.html) split presentation out of the critic and gave it its own command, `/check`, so that a referee report would carry mathematics and not typography. That was right about the *agent* and wrong about the *interface*.\n\nThe agent earned its keep. The command did not: `/check` is only ever wanted immediately after another command has written prose, so invoking it is a second step the user has to remember for work the first step already knew it had created. A separate command also means a second `git status` snapshot, a second dirty-tree guard and a second commit for edits that belong in the first one — and, in practice, prose that sat unformatted because nobody ran it.\n\nThe failure mode is quiet rather than loud. Nothing breaks when `/check` is skipped; the markdown just drifts, and it drifted.\n\n## Decision\n\nDelete the `/check` command. Keep the `checker` agent exactly as it is, and make **the presentation pass the last working stage of every command that writes prose** — `/decompose`, `/prove`, `/examples`, `/update` — before that command regenerates, commits and reports.\n\nEach command's pass has the same three parts. One checker subagent per file the run wrote, one path per agent and never batched; then the content-preservation gate run by the orchestrator, not promised by the agent:\n\n```\ngit diff -U0 -- <files> | grep -E '^[+-]' | grep -E 'VERDICT:|EVIDENCE:|\\*\\*status:\\*\\*|\\*\\*type:\\*\\*|\\*\\*role:\\*\\*|\\*\\*human:\\*\\*|\\*\\*created:\\*\\*|\\*\\*depends-on:\\*\\*|\\*\\*required-by:\\*\\*|<a id='\n```\n\nAny output at all is a violation: `git checkout -- <path>` that file and report it reverted. Then re-run the render gate, because reformatting is exactly the operation that breaks a `$$` fence or a link.\n\nTwo responsibilities `/check` carried alone are re-homed rather than dropped. Keeping `process/pipeline.md` current moves to `/update` §7, which is the command that already reads the whole repo and is the only one positioned to notice that the design doc and the repo disagree. Reformatting a file nobody just wrote — `README.md`, an old critique, a stale process note — is now an ordinary editing request, not a pipeline operation.\n\n## Consequences\n\nThe scope narrows. `/check` could be pointed at any path in the repo; a presentation pass sees only what its own run wrote. That is the intended trade: the files a command just authored are the ones that actually go unformatted, and a whole-repo sweep was never something anyone ran on a schedule.\n\nPresentation now costs a stage in four skills instead of living in one. The duplication is real and deliberate — a stage a command can forget to describe is a stage it will forget to run — but the gate command is identical in all four, so it is one thing to change in four places rather than four things.\n\n`process/operations.md` loses `/check` as an arrow. The endomap on markdown constrained to be the identity on content still exists; it is now a stage inside four other arrows rather than an arrow itself, and law L9 constrains that stage.\n";</script>
