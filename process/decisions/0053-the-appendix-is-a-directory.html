<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0053-the-appendix-is-a-directory</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0053 — The appendix is a directory, one file per object</h1><p class="lead">Generated from <code>process/decisions/0053-the-appendix-is-a-directory.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0003](0003-appendix-of-objects.html) (the appendix of objects), [0008](0008-one-page-per-object.html) (one page per object), [0016](0016-the-site-mirrors-the-source-tree.html) (the site mirrors the source tree)\n\n## Context\n\n`blueprint/appendix.md` had reached 1075 lines and 64 entries, and it was still one file.\nEverything else in the reasoning tree had already been cut the other way: a node is a\ndirectory ([0012](0012-sub-lemmas-nest-in-their-parent.html)), a concept is a directory\n([0035](0035-the-concepts-tree.html)), and the *site* has rendered one page per object since\n[0008](0008-one-page-per-object.html) — `blueprint_site/appendix/<anchor>.html`. The source was\nthe last place where sixty-four independent objects shared a file.\n\nThree costs, in increasing order of seriousness.\n\n**Reading.** §5 alone ran to 321 lines. Opening the appendix to check one hypothesis meant\nloading every object in it, and an agent under a context budget paid that price on every\nrun.\n\n**Writing.** Two operators cannot add entries at once. The journal already records the\nfailure — *\"four concurrent lead-researchers cannot each edit `appendix.md`\"* — and this\nsession hit it again from the other side: a concurrent run was appending `used by` lines to\nthe same file this change was restructuring.\n\n**Addressing.** An entry was reached by fragment, `appendix.md#not-standard-objects`. A\nfragment is a position inside a file, so it is only as stable as the file's organisation:\nmoving an entry from §5 to §7 is a pure curation decision, and it should not be able to\nbreak anything. It could not, in fact, break a link — but only because the section headings\ncarried their own anchors and nothing addressed them. The arrangement worked by luck.\n\n[0016](0016-the-site-mirrors-the-source-tree.html) states the principle this violates. The site\nmirrors the source tree; here the site had one page per object and the source did not, so\nthe mapping from source to page was the one place in the build that had to invent structure\nrather than reproduce it.\n\n## Decision\n\n**The appendix is `blueprint/appendix/`, and every entry is its own file.**\n\n- `blueprint/appendix/<anchor>.md` holds one object, stated in full. The **filename is the\n  anchor** — the `main.tex` label lowercased with `:` and `_` mapped to `-` — so\n  `thm:chen_Ti` lives in `thm-chen-ti.md`. The file opens with\n  `# <a id=\"<anchor>\"></a> <heading>` and the same breadcrumb line every other page carries.\n- `blueprint/appendix/index.md` is the **listing**. It stores exactly two things nothing else\n  stores: which section an entry belongs to, and the order the entries are read in. It states\n  no mathematics, and it carries the schema comment that used to head `appendix.md`.\n- **An entry is cited by linking its file, with no fragment**, written out from the citing\n  file's own depth, exactly as a node link is:\n\n```\n[`thm:chen_Ti`](../../appendix/thm-chen-ti.md)\n```\n\nThere is no `appendix.md#thm-chen-ti` any more.\n\nAdding an object is now two writes — the entry file and its line in the listing — and\n`python3 tools/build_dag_site.py --check` fails on either half being missing: an entry file\nthe listing omits is invisible to every prompt and every page, and a listing line whose file\ndoes not exist is a dangling promise.\n\n## Consequences\n\n**A section is now free.** Moving an entry between sections re-orders one line of\n`index.md` and touches nothing else. That was the point.\n\n**Two lead-researchers can add entries at once**, as long as they add different ones. The\nlisting is still a shared file, but a one-line append is a conflict a human can resolve;\na 1000-line file rewritten from a stale read is not.\n\n**Reading one object costs one object.** A prover checking a hypothesis opens\n`blueprint/appendix/def-generation.md` — twelve lines — instead of the whole appendix.\n\n**The `objects:` field changed shape.** It was a list of `appendix.md#anchor` links and is\nnow a list of `appendix/<anchor>.md` links. `--check` now rejects an `objects:` entry that\ndoes not name an entry file at all, which the fragment form could not detect: a typo in a\nfragment was reported, but a link to the appendix with no fragment was silently accepted.\n\n**The migration.** 64 entry files written, 12,901 links repointed across 383 files, and\n`tools/build_dag_site.py` taught the new shape in 21 places — `parse_appendix()` reads the\nlisting for the order and each file for its content; `appendix_href()` and `object_anchor()`\nreplace the fragment arithmetic that was inlined at eight call sites. Two things were\ndeliberately **not** rewritten: the append-only critiques under `blueprint/nodes/*/critiques/`\n(they named no appendix path, so nothing was owed) and the prose of the ADRs and\n`process/journal.md`, which describe what was true when they were written. Their link\n*targets* were repointed so they still resolve; their sentences still say `appendix.md`,\nbecause that is what the appendix was called.\n\n**What did not change.** The appendix is still the closed world, still the only thing a\nproof may invoke besides its own dependencies and standard mathematics, and still written\nonly by the lead-researcher. Splitting a file changes where a rule is enforced, never what\nit says.\n";</script>
