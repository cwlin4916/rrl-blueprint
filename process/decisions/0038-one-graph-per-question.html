<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0038-one-graph-per-question</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0038 — One graph per question, and a switcher between them</h1><p class="lead">Generated from <code>process/decisions/0038-one-graph-per-question.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** superseded by [0039](0039-one-graph-for-every-question.html) — the bug it\nrecords is real and its diagnosis stands; the repair split the questions onto separate\npages, and 0039 puts them back on one canvas with a card each and an arrow between them.\nKept for the three one-question assumptions it names, all of which are still fixed.\n**Amends:** [0024](0024-one-graph-with-side-branched-corroboration.html), whose \"every graph page shows the same graph\" meant *the question's* graph and could not distinguish the two while there was only one question; complements [0016](0016-the-site-mirrors-the-source-tree.html)\n\n## Context\n\nAdding [Q2](../../dag.html) was the first time the repository had two\nquestions, and it found three places where the machinery had quietly assumed one.\n\n**The scope card was `questions[0]`.** Every graph page mounted the same card, taken\nfrom the first question, and every parentless node attached to it. So Q2's eleven\nnodes hung under a card titled *Q1: When is …*, showing Q1's conjecture and Q1's\nconfidence, and Q2's own Setting, Problem statement and Conjecture rendered nowhere\non any graph. A reader who opened `nodes/Q2-L3/dag.html` was told, at the top of the\npage, that they were looking at Q1.\n\n**A new question's index block was skipped in silence.** `/decompose` tells the\nlead-researcher to open a question with an empty `BEGIN INDEX` / `END INDEX` pair,\nand the regex that finds those pairs required at least one line between them. An\nempty pair matched nothing, so the bullets and the tally were never generated and\nthe build reported success. The documented workflow produced a file the tool ignored.\n\n**The smoke test's stub DOM was a fixed id list**, and its page walk matched the\nliteral name `dag.html`, so a header element added for a second question crashed\nevery page and a second root graph would not have been tested at all.\n\n## Decision\n\n**A graph draws one question.** A second question is a second argument with its own\nscope card, not more rows under the first one's.\n\n- One root graph per question. The first keeps `dag.html`, so every link ever written\n  to it still lands somewhere real; the rest are `dag-q<n>.html`.\n- A node's `dag.html` scopes to *its own* question and draws that question's nodes,\n  which is [0024](0024-one-graph-with-side-branched-corroboration.html)'s rule read\n  correctly: the same skeleton, auto-opened at the node, for the argument the node\n  belongs to.\n- The bar carries a pill per question, the current one marked flat rather than\n  linked. It appears only when there is more than one question, so a single-question\n  site looks exactly as it did.\n- The breadcrumb says which graph it is — *the Q2 DAG* — once there is a choice.\n- Each question's root view carries the priorities panel, which is repository-wide.\n- The hub lists one row per question graph, with the node count rather than the\n  question title: a title carries display-length mathematics and a hub note is one\n  short line.\n\n**The gates learn the same shape.** `MARKED` accepts an empty marker pair, the smoke\ntest's stub DOM gains `qswitch`, its page walk matches `dag-q<n>.html`, and it asserts\nthat the switcher renders every question and marks the current one. A layout that only\none question can satisfy is a layout the gate should refuse.\n\n## Consequences\n\n- Each graph is the size of one argument. Q1's canvas went from carrying every node\n  in the repository to carrying its own 44, and Q2's draws 11 — the root page fell\n  from 158 KB to 124 KB even as the repository grew by eleven nodes.\n- Q2's conjecture is now readable where a reader meets Q2, which is the graph.\n- Cross-question dependencies are now a thing the site would have to be taught. It has\n  not been taught them, and Q2 deliberately has none: its relation to Q1 is carried by\n  its framing paragraphs and its nodes' histories. If a later question genuinely\n  depends on an earlier one's node, that edge needs a decision of its own — drawing it\n  would mean one graph again, and the reason for this record is that one graph does not\n  fit two arguments.\n- The general rule, for whoever adds Q3: **the first of anything is not the shape of\n  it.** Three separate places had hard-coded the number one, none of them failed\n  loudly, and two of them were gates.\n";</script>
