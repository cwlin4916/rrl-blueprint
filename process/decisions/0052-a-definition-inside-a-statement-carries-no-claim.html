<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0052-a-definition-inside-a-statement-carries-no-claim</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0052 — A definition inside a statement carries no claim</h1><p class="lead">Generated from <code>process/decisions/0052-a-definition-inside-a-statement-carries-no-claim.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06 · **Status:** accepted · **Invariant:** [I28](../pipeline.html#4-invariants)\n\n## Context\n\n`/update Q1-L3` was run on an external verdict the user supplied. The verdict's headline was that the node's necessary condition is correct, and its correction was that one sentence of the setup is not.\n\nThe sentence was this. For $\\mu\\in\\Lambda^+$ the convolution map $m_\\mu$ is ind-proper, and\n\n> $LX^{\\mathrm{sat}} := \\bigcup_{\\mu\\in\\Lambda^+} m_\\mu(\\overline{LG}_\\mu\\times^K L^+X)$ is a $K$-stable **closed ind-subscheme** of $LX$.\n\nInd-properness of each $m_\\mu$ makes each image closed. It says nothing about their filtered union, and the union of an increasing family of closed sets is not closed: take $P = \\varinjlim_n\\coprod_{j\\le n}\\operatorname{Spec}k$ mapping to $\\mathbb{A}^1$ by $j\\mapsto a_j$ for distinct $a_j$ not exhausting $\\mathbb{A}^1(k)$. Every stage is finite, hence proper; the image is an infinite proper subset of $\\mathbb{A}^1(k)$, and over an algebraically closed field that is not closed.\n\nSo the node asserted a topological property with an invalid reason, and then clause (iii) concluded an equality of ind-schemes that a support argument — which sees only underlying reduced loci — could not have proved even had the property held.\n\n## What actually needs explaining\n\nNot the error. Errors are what the pipeline exists to catch, and the necessary condition the node supplies to [Q1](../../dag.html) survives the correction intact. What needs explaining is that the sentence stood for four days and through three operators:\n\n- `/decompose` wrote it, on 2026-08-02, as part of cutting Q1 into its bracket.\n- `/examples` ran on 2026-08-04 and did the most careful reading the node has had. It split the statement into four matchable pieces **(S)**, **(i)**, **(ii)**, **(iii)**, put the closedness inside **(S)**, scored six sources against the four pieces, and reported which pieces nothing touched. The closedness was carried along as a piece to be matched, never as a claim to be checked.\n- `/update` walked the whole tree on 2026-08-05, re-read the node against `def:orbits_iwahori_spherical` and against the ind-properness of $\\mathrm{Gr}$ that clause (i) rests on, and recorded it \"examined and unchanged\".\n\nThree operators read the node. Each read the numbered clauses asking whether they were true. None read the setup that way, because the setup was punctuated as a definition — `:=`, and then a property in apposition — and a definition is not the kind of sentence that is false.\n\nThat is the whole mechanism, and it generalizes past this node. A claim written as a clause acquires a reader: the prover owes it an argument, the critic hunts it, the confidence machinery counts what the critique disposed of. A claim written into a definition acquires none. It is not a clause, so nobody proves it; not a dependency, so no node carries it; not a hypothesis, so nothing warns that the node stands or falls with it. It is load-bearing and unowned, which is the worst combination the repository can produce.\n\n## Decision\n\nWhere a `## Statement` coins notation, the coining clause says what the object **is** and asserts no property of it. Every property that appears there becomes one of three things:\n\n1. a numbered clause of the statement, where a prover and a critic will meet it;\n2. a labelled hypothesis, in its own paragraph, where a reader sees the node is conditional on it;\n3. a dependency — its own node, which is what happened here: the closedness became [Q1-L3-L5](../../nodes/Q1/Q1-L3/Q1-L3-L5/index.html), and the parent's ind-scheme conclusion became a clause conditional on it.\n\nOr it comes out.\n\nThe rule bites hardest where the temptation is strongest: topological and finiteness properties of an object built by a union, a colimit, or an image — closed, reduced, representable, placid, finite type, ind-proper — attached to the symbol at the moment it is introduced, with a one-word reason drawn from the pieces. A property of the pieces is not a property of the assembly, and the sentence that assembles them is exactly where nobody is looking.\n\n## Consequences\n\n`/update`'s verification pass (§2) reads a coining clause as a claim, and sorts it into verified / refuted / unverified like any other.\n\n`/decompose`'s statement schema already forbids a second section and counts hypothesis labels per paragraph ([I23](../pipeline.html#4-invariants)); the lead-researcher now also states properties of coined objects as clauses or hypotheses rather than in apposition.\n\n`/examples` inherits the benefit rather than a new duty. Its four-piece breakdown of a statement is a good instrument pointed at whatever the statement offers; when the statement stops offering unowned properties, the instrument stops scoring the literature against them. Note the cost that was already paid: [`examples.md`](../../nodes/Q1/Q1-L3/examples.html) is append-only in spirit and still scores its findings against a piece **(S)** asserting the closedness this run withdrew, so its coverage report now reads against a statement that is gone. That is tracked in the priority panel rather than repaired by rewriting the file.\n\nNot mechanized. A gate cannot separate \"$Z := \\bigcup_i Z_i$ is closed\" from \"$Z := \\bigcup_i Z_i$, where each $Z_i$ is closed\" by pattern — the second is a legitimate recollection of a fact the appendix carries, the first is a claim, and they differ by where the copula sits. This one is carried by the operators' instructions and by the critic, like [I25](../pipeline.html#4-invariants)'s one-claim-per-step rule, and for the same reason: a gate that guessed would reject correct statements.\n";</script>
