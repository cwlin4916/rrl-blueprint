<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0035-the-concepts-tree</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0035 — The blueprint explains itself, one concept per directory</h1><p class="lead">Generated from <code>process/decisions/0035-the-concepts-tree.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Amends:** nothing. Adds a tree; changes no rule, no schema and no gate. [`pipeline.md`](../pipeline.html) and [`operations.md`](../operations.html) keep their roles unchanged.\n\n## Context\n\nThe repository had three documents about itself and no document *for* a reader.\n\n[`pipeline.md`](../pipeline.html) states the design and its invariants; [`operations.md`](../operations.html) states the state as a dependently-typed schema and each command as a typed map; [`CLAUDE.md`](../../../CLAUDE.md) legislates. All three are written for someone who already knows what the terms mean. None of them defines a term.\n\nThe user's report was specific and correct: **\"closed world\" is confusing.** It is used forty-odd times across the repository, it is load-bearing — it is the rule that makes the whole pipeline trustworthy — and nowhere does anything say what it means. Worse, the phrase is borrowed from Reiter's closed-world assumption in database logic and does **not** mean what Reiter means by it. This repository's closed world is a whitelist of what a proof may invoke; Reiter's is a rule inferring falsity from unprovability. Anybody who knows the term arrives with the wrong model, and nothing corrects them.\n\nThe same gap covered every other concept: what a node *is* as a data structure, why confidence is derived rather than declared, why an example may not discharge an obligation.\n\n## Decision\n\n**`blueprint/concepts/`**, one directory per concept, the file named for the concept — the same shape a node directory has under [ADR 0032](0032-a-nodes-own-file-is-named-for-the-node.html), so a reader who has learned one tree has learned the other.\n\n```\nblueprint/concepts/README.md              → blueprint_site/concepts/index.html\nblueprint/concepts/<slug>/<slug>.md       → blueprint_site/concepts/<slug>/index.html\n```\n\nNine concepts: **node**, **closed world**, **appendix**, **DAG**, **confidence**, **role**, **gate**, **operator**, **history**.\n\nEvery page has the same six sections, and the last three are the ones the request was actually about:\n\n- **In one sentence** — assuming nothing.\n- **Why it exists** — the failure it prevents. A rule with no failure behind it is decoration.\n- **The shape** — the data: fields, files, legal values.\n- **An example** — a real one from this repository, with a link. Not a toy.\n- **In the literature** — where the idea comes from and who else built one.\n- **Where it lives** — the files, gates and commands implementing it.\n\n**The tree is outside the closed world.** A concept page is prose about the machine; no proof, node or appendix entry may cite one, exactly as for `examples.md` and node histories. Where a concept page and `CLAUDE.md` disagree, `CLAUDE.md` is right and the page is stale.\n\n## Why under `blueprint/` and not `process/`\n\nConsidered and rejected: `process/concepts/`, beside the ADRs and the pipeline documents.\n\n`process/` answers *how the pipeline is designed and how it got that way* — it is for someone changing the machine. The concepts answer *what these words mean* — they are for someone reading the mathematics, who arrives at `blueprint/` and meets `objects:`, `role:` and a confidence percentage in the first thirty seconds. Putting the explanation where the confusion happens beat putting it with the other meta-documents, and the site nav follows: **Concepts** is the first entry on the hub, above the DAG.\n\nThe literature sections are the second reason. They point at `leanblueprint`, Flyspeck, Mathlib, Reiter, Cohen's Baconian probability, Lakatos, event sourcing, capability-based security — the ancestors of the *ideas*, which belong beside the ideas rather than in a design document.\n\n## Consequences\n\n**Nine more pages to keep true**, and they will go stale silently, the way `pipeline.md` does — nothing breaks when a concept page is wrong. They are therefore checked in the same place: `/update` §7, which already rereads `pipeline.md` against what the repo does, now rereads these too.\n\n**The examples are real, so they rot.** Each page cites specific nodes, specific critique rounds, specific numbers — [Q1-L2-L3](../../nodes/Q1-L2/Q1-L2-L3/index.html) at +39%, Q1-L2-L1's r1 FAIL, Q1-a1's counterexample. That is deliberate: a page whose example can go stale is a page whose staleness is visible. A generic example would never be wrong and would never be useful.\n\n**One gap is now documented rather than fixed.** The `gate` page records that the render gate validates link *targets* and not prose claims about what is inside them — which is how Q1-L2-L2's proof cited a `## Remark` section for five records after [ADR 0027](0027-a-node-carries-its-history.html) retired it, with every link resolving. Writing the concept pages is what surfaced it.\n\nThe generator change is small and contained: `collect_site_pages()` learns the tree, the crumb learns one branch, the hub gets one entry. No schema, no field, no gate.\n";</script>
