<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0044-a-question-states-a-problem-not-its-route</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0044 — A question states a problem, not its route</h1><p class="lead">Generated from <code>process/decisions/0044-a-question-states-a-problem-not-its-route.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Supersedes:** [0025](0025-the-conjecture-is-versioned-and-self-contained.html) (the *Route status.* and *Versions.* paragraphs)\n**Amends:** [0023](0023-the-question-block-states-a-conjecture.html) (the framing block's shape)\n\n## Context\n\nADR 0023 gave each question a **Conjecture.** paragraph and ADR 0025 gave that\nparagraph a *Route status.* and a *Versions.* continuation. Read back on 2026-08-05,\nQ2's framing had grown to eleven paragraphs — **Feeds.**, **Setting.**, *Standing\nhypotheses.*, *Stratum generators and standard objects.*, **Problem statement.**,\n*Why this is a question and not a restatement.*, *Sought.*, **Conjecture.**, *Both\nhypotheses are load-bearing.*, *Route status.*, *Versions.* — of which three\nparagraphs stated the problem and eight commented on it.\n\nTwo of the eight are stale by construction. *Route status.* records which node is\nproved and which is the weak link, a fact the repository already stores once, in each\nnode's `status:` field, and already renders — the generated index block sits fifty\nlines below it and the site computes the same thing per node. *Versions.* records what\nchanged and when, which is a node's `updates/` file and git's job. Both are copies,\nand a copy of a fact that moves is wrong as soon as it is written: Q1's route\nparagraph, dated 2026-08-04, still calls `Q1-L4` \"the weak link\" and says nothing of\nits decomposition, every one of whose four children — `Q1-L4-L1` through `Q1-L4-L4` —\nhas since been proved. Nothing forces a route paragraph to be re-read when a status\nchanges, so it decays silently while the index block ten lines below it stays exact.\n\nThis is the rule the repository already enforces elsewhere — every fact is stored\nonce, and derived facts are derived — applied to the one file that had been exempt.\n\n## Decision\n\nA question's framing block in `blueprint/main_dag.md` is **exactly three bold\nparagraphs**, in this order, plus the optional **Goal.** and **Feeds.** paragraphs\nthat precede them:\n\n- **Setting.** the standing class and every hypothesis in force for the question,\n  including hypotheses inherited from another question's nodes.\n- **Problem statement.** what would count as an answer, with the strength said\n  explicitly — necessary, sufficient, or necessary and sufficient — and the node that\n  carries each named and linked (ADR 0019). The bracket that had lived in a separate\n  *Sought.* or *The bracket.* paragraph is stated here, because the bracket **is** the\n  problem statement.\n- **Conjecture.** the current best answer, self-contained and hyperlinked as ADR 0025\n  required, opening with its version label *(v\\<k\\> — YYYY-MM-DD.)*.\n\nThe version **label** survives; the *Versions.* **paragraph** does not. A reader who\nneeds the history reads git; a reader who needs to know which version is on the page\nreads the label, which is why 0025 introduced it.\n\n**No *Route status.* paragraph, in any question.** Route state is derived: it is the\n`status:` of each node, the generated index block, and the site's confidence panel.\n\nCommentary — why a question is not a restatement, which hypothesis is load-bearing,\nwhat a stratum generator is — belongs where the repository already puts commentary:\nthe dated entry in the relevant node's `<id>_history.md`, or an appendix entry when it\ndefines an object.\n\n## Consequences\n\n- Q1 loses *The bracket.*, *Sought.*, *Route status.* and *Versions.*; its bracket\n  content moves into **Problem statement.** Q2 goes from eleven paragraphs to three.\n- The parser contract of 0025 is unchanged and simpler to satisfy: with continuation\n  paragraphs gone, the three bold markers are the only block openers.\n- `main_dag.md`'s schema comment and I15 in `process/pipeline.md` are amended; a new\n  I-invariant records that a question states a problem and never its route.\n- `tools/check_render.py` gains a check that fails on a *Route status.* or *Versions.*\n  paragraph, so the next `/update` cannot reintroduce one by following an old example.\n\n## Alternatives considered\n\n- **Keep *Route status.*, and regenerate it.** Rejected: a generated route paragraph\n  is the index block, which already exists forty lines below and is already generated.\n  Two renderings of one fact is the problem, not the fix.\n- **Move *Versions.* to a per-question `updates/` file.** Rejected for the reason 0025\n  itself gave — questions have no directory and git already stores every prior\n  version. 0025 concluded the label was what was missing; the label is what is kept.\n- **Delete the version label too.** Rejected: the label is not a copy of anything. It\n  says which of several possible current claims a reader is holding, and it is the\n  only thing on the page that does.\n";</script>
