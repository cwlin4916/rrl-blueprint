<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0055-a-flag-names-the-record-it-fired-on</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0055 — A flag names the record it fired on</h1><p class="lead">Generated from <code>process/decisions/0055-a-flag-names-the-record-it-fired-on.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0037](0037-the-node-panel-carries-the-statement.html) (a readout shows the statement and links the record), [0042](0042-confidence-shows-its-working.html) (confidence shows its working), [0019](0019-the-update-operator.html) (the update operator)\n\n## Context\n\nA node whose record asks for the `/update` operator carries a derived **needs update** flag,\nand the flag said four words: *a hypothesis gap is on record*, *human: doubted*, *revised (u1)\nand not yet re-proved*, *a standing FATAL/MAJOR flaw names a missing claim*.\n\nEvery one of those sentences ends in a noun the reader then has to go and find. Which gap?\nWhich u1? Which round? The flag is derived from exactly one file in the node's directory —\nthat is how it was computed — and it was throwing that file away before it reached the page.\nThe reader was left one search away from the thing the flag existed to save them from, and\nthe search is not trivial: `updates/` had no generated page at all, so following the trail\nmeant leaving the site.\n\nThis is the same defect [0042](0042-confidence-shows-its-working.html) fixed for confidence. A\nnumber with no decomposition and a flag with no record are the same failure: a derived\nsummary that does not show what it was derived from is asking to be believed rather than\nchecked.\n\n## Decision\n\n**A needs-update flag carries three things: the chip, the elaboration, and the record.**\n\n`needs_update_full()` returns, for each trigger, the four-word chip that was already there,\none sentence saying what is actually happening and what the next operator is, and the file\nthe flag fired on together with the page that renders it. The chip stays in the card's\nsub-line, where four words is all there is room for. The elaboration and the link go in the\npanel and on the node page, in a bordered box above the statement.\n\nThe four triggers and the record each one now names:\n\n- `human: doubted` — the node's own field block, the one field no operator may write.\n- `EVIDENCE: gap` — `examples.md`, and the sentence says the gap is either a source that\n  should have contained the statement or a hypothesis nothing discharges.\n- revised and not re-proved — `updates/u<n>.md`, and the sentence says the write-up on disk\n  proves the **superseded** statement.\n- `failing` — the latest critique round, and the sentence says a standing FATAL or MAJOR\n  flaw usually names a claim the tree does not carry.\n\n**And `updates/u<n>.md` becomes a page.** It was the one append-only trail the site did not\nrender — critiques, examples, goal checks and open prompts all had pages, supersessions did\nnot — which is why the third trigger had nowhere to point. Each now renders at\n`nodes/<chain>/updates/u<n>.html` and appears in the node's Pages list.\n\n## Consequences\n\n**The flag is still derived.** Nothing is stored: invariant I5 holds, and the flag cannot\ndrift from the audit trail, because the trail is what computes it and now also what it links.\n\n**Forty-four supersession records became readable** without leaving the site. That they were\nnot is the kind of gap that only shows up when something tries to link them.\n\n**The next operator is named in the box.** A reader who sees the flag now knows whether the\nanswer is `/update`, `/prove`, `/decompose`, or a judgement only the user can make.\n";</script>
