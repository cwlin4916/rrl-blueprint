<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0051-a-decomposition-folds-whatever-its-members-are-rolled</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0051 — A decomposition folds whatever its members are rolled</h1><p class="lead">Generated from <code>process/decisions/0051-a-decomposition-folds-whatever-its-members-are-rolled.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Amends:** [0026](0026-sub-lemma-families-fold-into-their-parent.html) (which children fold)\n**Caused by:** [0047](0047-an-example-node-is-a-proposition.html) (an e/a node decomposes)\n\n## Context\n\n[0026](0026-sub-lemma-families-fold-into-their-parent.html) folds a decomposed node's\nsub-lemmas into its card everywhere outside its own subtree, and says which children those\nare: *spine children, drawn in its embedded DAG*, as against *e/a children, behind the\nchips*. `tools/build_dag_site.py` implemented \"spine child\" as **a child whose role is\nneither `example` nor `analogy`** — which was exactly right for as long as an e/a segment\nwas terminal, because then a child of an e/a node did not exist.\n\n[0047](0047-an-example-node-is-a-proposition.html) made an e/a node a proposition that\ndecomposes, and the test silently inverted. An example's sub-lemmas are examples too: they\ninherit the polarity vocabulary and the role of the instance they cut up. So every one of\nthem failed the role test, was classified as a *branch of a branch*, and — since the\nvisibility rule for a branch was \"draw it wherever its host is not a spine node\" — was\ndrawn on **every** graph page in the host's own layer. `Q2-e1`…`Q2-e4` gained five children\neach on 2026-08-06 and the root canvas immediately acquired twenty extra cards in Q2's\nblock, which is the crowding [0026](0026-sub-lemma-families-fold-into-their-parent.html)\nexists to prevent, arriving through the one door it had left open.\n\n## Decision\n\n**The fold is decided by the edge, not by the role.** A child either hangs off its parent as\na *side branch* or is a member of its parent's *decomposition*, and the discriminator is the\nrelation the node files already record:\n\n> a child branches iff its role is `example` or `analogy` **and** its parent does not list\n> it in `depends-on`.\n\nThat is [`CLAUDE.md`](../../../CLAUDE.md)'s own rule read off the disk rather than guessed from\nthe role: from a host down to an e/a child the edge is containment without dependency, and\nbelow an e/a node it is an ordinary dependency — the example resting on its own sub-claims.\nEverything not a branch is a decomposition member, so it folds, and a `role: example`\nsub-lemma of `Q2-e1` folds into `Q2-e1` exactly as a `role: proof` sub-lemma of `Q1-L2`\nfolds into `Q1-L2`. `branches()` is one predicate in `tools/build_dag_site.py` and the four\nplaces that used to test the role now call it.\n\nTwo clauses follow, both forced by the first.\n\n1. **A branch is drawn where its host is, closed under nesting.** A question-level branch\n   hangs off the scope card, which every page draws; a nested one off its parent's card, and\n   is drawn only when that parent is. The old rule — *visible unless the parent is a spine\n   node* — read a branch-hosted branch as question-level and drew it everywhere.\n\n2. **A page that opens a branch's subtree draws that branch as a card.** A chip has nothing\n   for a family to hang from: with `Q2-e1` left in its branch slot beside the scope card,\n   its five sub-lemmas landed at the bottom of Q2's grid attached to nothing. On its own\n   page and its descendants' the branch joins the page's spine and its decomposition hangs\n   beneath it by dependency depth, like any other. Everywhere else it is a chip again.\n\n## Consequences\n\n- The root graph draws 41 of 82 nodes, down from 61: the twenty `Q2-e*-L*` cards are gone\n  and each `Q2-e*` carries a **5 sub-lemmas ↘** chip. Across all 83 graph pages the smoke\n  test's totals fall from 2718 cards and 2582 edges to 2158 and 1208.\n- `Q2-e1`'s node page now reads **sub-lemmas: 0/5 proved** where it read *corroborated by 5\n  examples*. The five are its decomposition; they were never corroboration of it.\n- Nothing on disk moves and no statement changes. This is a defect in a generated readout,\n  fixed where readouts are made — [I8](../pipeline.html#4-invariants): the artifact is not the\n  thing to repair, so the repair goes in the generator.\n- The fan-out cap ([0050](0050-a-node-has-at-most-ten-children.html)) is untouched, and\n  deliberately so. It counts what is in the tree, not what a page draws — `Q2` still reports\n  thirteen direct children. A fold that made the picture legible was the alternative that\n  ADR rejected, and this one is not that: it restores the fold to the family it always\n  applied to, and leaves the two wide layers exactly as visible in the gate as before.\n\n## Alternatives considered\n\n**Give an example's sub-lemmas `role: proof`.** Rejected. It fixes the drawing by lying\nabout the node: a sub-claim of an instance is part of that instance, and rolling it `proof`\nwould enter it in the proof chain, where the tallies and the question's confidence aggregate\n([0015](0015-every-node-declares-its-role.html)). A rendering bug is not a reason to move a\nnode into the argument.\n\n**Fold on depth — draw two levels and fold the rest.** Rejected: it is the same category\nerror one step later, since depth is not what distinguishes corroboration from argument\neither. The tree records the distinction in `depends-on`; a renderer that re-derives it from\nanything else will drift from it again.\n";</script>
