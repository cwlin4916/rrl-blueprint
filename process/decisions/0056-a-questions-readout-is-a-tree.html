<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0056-a-questions-readout-is-a-tree</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0056 — A question&#x27;s readout is the argument, drawn as a tree</h1><p class="lead">Generated from <code>process/decisions/0056-a-questions-readout-is-a-tree.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted; its \"`## Decomposition` is unaffected\" section is superseded\nby [0074](0074-the-decomposition-paragraph-is-removed.html) — the paragraph it defends was removed repo-wide.\n**Extends:** [0044](0044-a-question-states-a-problem-not-its-route.html) (a question states a problem, not its route), [0050](0050-a-node-has-at-most-ten-children.html) (a layer is at most ten wide), [0039](0039-one-graph-for-every-question.html) (one graph for every question)\n\n## Context\n\nUnder each question's framing, between the `BEGIN INDEX` and `END INDEX` markers, sat a run\nof bullets — one per node, each carrying the node's id, title, type, role, status,\nconfidence **and its whole `depends on` list**. For `Q2` that was twenty-four bullets, and\nthe dependency lists made several of them longer than the titles they followed.\n\nThe list was correct and unreadable. It answered \"what nodes are there\" and not the question\na reader actually has after reading a problem statement, which is *what is the shape of the\nargument*: which lemmas are the spine, what hangs under what, where it is broken. Indentation\ncarried the containment, but at two levels of nesting with wrapped lines it stopped reading as\na hierarchy at all — the same failure [0050](0050-a-node-has-at-most-ten-children.html) records\nfor the graph, in the other medium.\n\n## Decision\n\n**The generated block is an argument tree.** The tally and the confidence line stay; the\nbullets are replaced by one code-fenced tree, drawn from the stored edges:\n\n- **containment** comes from the ids, since a node's id is its path, so a sub-lemma is drawn\n  under its parent;\n- **dependencies** are an arrow at the end of the row, `← Q2-L1`, not a nested list;\n- each row is id, effective status, confidence, title, and the role in parentheses when it is\n  not `proof`, and `failing` is shouted in capitals because a broken node is the one thing a\n  reader must not have to hunt for;\n- the math in every title is **flattened** — `$\\mathrm{IC}_0$` reads as `IC_0` — because the\n  tree is inside a code fence, where no renderer will touch it.\n\nIt is generated for the same reason the bullets were: a hand-drawn tree is a second copy of\nedges that are already stored in the node files, and a second copy is a second thing to\ndrift. A one-line pointer under the tree sends the reader to `dag.html` for the clickable\nversion with the confidence decomposition.\n\n## Consequences\n\n**Links are traded for shape.** A code fence cannot carry markdown links, so the ids in the\ntree are text. They are still greppable, they are still the directory names, and the\nnavigable copy is the graph — which is where a reader who wants to click was always going.\nThis is the deliberate cost of the decision.\n\n**`## Decomposition` is unaffected.** A node's decomposition paragraph says *why* its\nsub-lemmas reassemble into its statement, and no edge stores that. The tree shows the shape;\nthe paragraph says why the shape is a proof. Both stay.\n\n**The tree is the first place the reader sees a broken branch.** `Q2` reads, at the time of\nwriting, as three `FAILING` rows in the spine and twenty-four example nodes hanging off four\nexample roots — which is a more honest picture of that question than the tally line above it.\n";</script>
