<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0040-the-key-example-register</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0040 — The key-example register, and the goal check that reads it</h1><p class="lead">Generated from <code>process/decisions/0040-the-key-example-register.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-05\n**Status:** accepted\n**Complements:** [0014](0014-confidence-is-three-signed-channels.html) (this adds a ceiling, not a fourth channel); [0015](0015-every-node-declares-its-role.html) and [0018](0018-example-and-analogy-nodes.html) (example nodes illustrate; the register is a *bench*, which is a different job); [0036](0036-an-example-says-what-it-matches.html) (a finding says what it matches — an entry here says what it does *not* reach, for the same reason)\n\n## Context\n\nThe repository accumulated sixteen example nodes for [Q1](../../dag.html)\nand no way to say which of them settles anything. `Q1-e1` (the group case), `Q1-e4`\n(Godement–Jacquet) and `Q1-e5` (the symplectic period) all read as \"here is a case\nwhere the unramified conjecture is a theorem\", and a reader could not tell that one of\nthem makes Q1 vacuous, one of them is about the dual side, and one of them is a real\npositive.\n\nThe distinction that was missing is not subtle once it is written down. BZSV\nConjecture 7.5.1 (p. 161) puts the **whole** automorphic category\n$\\mathrm{Shv}(X_F/G_{\\mathcal{O}})$ on the left, and §7.5.3 (p. 163) draws the\nconsequence in as many words — \"all sheaves on $X_F/G_{\\mathcal{O}}$ can be generated\nfrom the basic object through the action of Hecke functors\". The manuscript's standing\nhypothesis [the three standing hypotheses](../../appendix/assum-intro.html)(c) puts the\n**Satake subcategory** there instead. Q1 *is* the gap between the two forms.\n\nSo \"the unramified conjecture is known for $X$\" is not one fact, it is two, and only\none of them bears on Q1. Devalapurkar makes the point against us in print: his Theorem\n1.1.10 proves BZSV 7.5.1 for every rank-1 affine homogeneous spherical variety, and\nfootnote 5 on the same page says the left-hand side is \"replaced by a certain\nsubcategory defined using the action of\n$\\mathrm{Shv}^c_{G(\\mathbb{C}[[t]])\\times G(\\mathbb{C}[[t]])}(G(\\mathbb{C}((t))))$\" —\nthe Satake subcategory. A large family of cases, and none of them a positive for Q1.\n\nTwo smaller failures pushed the same way. The group case was carried as an example\nnode, `Q1-e7`, asserting that the equality holds — true, and true because\n$\\mathrm{IC}_0$ is the monoidal unit, so a *false* node statement would pass there just\nas happily. And nothing in the pipeline ever specialized a node's statement to a case\nwhere the answer is known, so a statement could be corrected, refereed and approved\nwithout anyone checking it against the handful of $X$ everybody agrees about.\n\n## Decision\n\n**One register, at `blueprint/key_examples.md`.** One entry per key example, id `K<k>`,\nappend-only ids, each entry saying what the variety is, what is proved with *the\ncategory that actually appears on each side*, what clause of Q1 it reaches, what it does\nnot reach, and its source with theorem number, PDF page and the date the page was read.\n\n**Each entry closes with a machine-readable `KEY:` line** — `positive`, `weak`,\n`degenerate`, `out-of-class`, `negative` or `adjacent` — and that line is the only part\nof the file anything parses. `positive` means a source proves the equivalence with the\nfull automorphic category on the automorphic side; `weak` means it proves the\nSatake-subcategory form and leaves Q1 untouched.\n\n**The register is outside the closed world**, exactly like a node's `examples.md`.\nNothing may cite it. It justifies believing a statement and never discharges an\nobligation.\n\n**One question declares itself the goal** with a `**Goal.**` paragraph in\n`main_dag.md`, and at most one may. The register is the bench for that question, and\n`--check` fails on a register with no goal or a goal with no register.\n\n**`/check-goal <id>` writes `blueprint/nodes/<id>/goalcheck.md`**, closing on\n`GOALCHECK: consistent | untested | tension | contradicted`.\n\n**The verdict caps confidence; it does not vote.** `tension` caps at $+0.25$,\n`contradicted` at $-0.5$; `consistent` and `untested` cap nothing. Surviving the bench\nis the *absence* of evidence against a statement, not evidence for it, so it must not be\nable to raise a number — which is exactly what a ceiling says and a fourth weighted\nchannel could not. [ADR 0014](0014-confidence-is-three-signed-channels.html)'s three\nchannels and their weights are untouched.\n\n**The generated `<id>_prompt.md` carries the whole register**, so a reader outside this\nrepository can test the statement against the same bench without the repository.\n\n**The group case leaves the bench.** `Q1-e7` was removed on 2026-08-05 at the user's\ndirection and the register records the exclusion as `K9`, `KEY: degenerate`, so nobody\nre-adds it. [Q1-e1](../../nodes/Q1/Q1-e1/index.html) keeps the group case for\nwhat it does show — the unramified equivalence is a theorem there — which is a different\nclaim.\n\n## Consequences\n\nA statement can now fail cheaply and early, against cases nobody disputes, before a\nprover spends a round on it. The register is also the honest answer to \"what do we\nactually know\": seven entries, six of them positive and one of those unread, against\nfour cases that only look like positives.\n\nThe cost is that the register has to be maintained by hand and read at page level. An\nentry whose source has not been opened says so — `K7` does — and must not be used until\nit has been.\n\nThe `KEY:` and `GOALCHECK:` vocabularies are closed, and `--check` rejects an entry or a\n`goalcheck.md` that does not close on one, for the same reason `EVIDENCE:` is closed: a\nfile that a gate cannot read is a file the confidence derivation silently ignores.\n\nNumbering note: `0040` was briefly claimed by concurrent work on the confidence\nderivation while this record was being written; that work settled on `0042`, so the\nregister kept `0040` and there is no gap.\n";</script>
