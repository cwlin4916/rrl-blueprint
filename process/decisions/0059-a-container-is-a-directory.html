<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0059-a-container-is-a-directory</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0059 — A container is a directory, all the way up</h1><p class="lead">Generated from <code>process/decisions/0059-a-container-is-a-directory.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Extends:** [0012](0012-sub-lemmas-nest-in-their-parent.html) (sub-lemmas nest in their parent), [0053](0053-the-appendix-is-a-directory.html) (the appendix is a directory), [0050](0050-a-node-has-at-most-ten-children.html) (a layer is at most ten wide), [0016](0016-the-site-mirrors-the-source-tree.html) (the site mirrors the source tree)\n\n## Context\n\n[0012](0012-sub-lemmas-nest-in-their-parent.html) made a node's id its path, so a sub-lemma is\nwritten inside the lemma it refines. That rule handles every layer of the tree except the\nfirst one, because a **question is not a node** — it has no `<id>_node.md` and never had a\ndirectory. So the top layer stayed flat, and `ls blueprint/nodes/` returned this:\n\n```\nQ1-L1  Q1-L2  Q1-L3  Q1-L4  Q1-L5  Q1-L6  Q1-a1  Q1-a2  Q1-a3  Q1-e1  Q1-e2\nQ1-e3  Q1-e4  Q1-e5  Q1-e6  Q1-e8  Q2-L1  Q2-L2  Q2-L3  Q2-L4  Q2-L5  Q2-L6\nQ2-L7  Q2-L8  Q2-L9  Q2-e1  Q2-e2  Q2-e3  Q2-e4  Q3-L1  Q3-L2  Q3-L3  Q3-L4\nQ3-L5  Q3-L6  Q3-L7  Q3-L8\n```\n\nThirty-seven directories in string order, which interleaves the roles of one question\n(`Q1-L6` next to `Q1-a1` next to `Q1-e1`) and then runs into the next question with no\nbreak. The argument [0012](0012-sub-lemmas-nest-in-their-parent.html) made against a flat\n`nodes/` — that at some size a directory stops being a listing and becomes a haystack — had\nsimply reappeared one level up, where 0012 could not reach it.\n\nThe same thing had happened to the closed world. [0053](0053-the-appendix-is-a-directory.html)\nsplit `appendix.md` into one file per object and was right to, but sixty-five files in one\ndirectory is the flat listing again, in the one directory every node in the repository links\ninto.\n\n## Decision\n\n**A container is a directory, and the top layer is a container like any other.**\n\nA node's directory chain opens with its **question**:\n\n```\nblueprint/nodes/Q2/Q2-L8/Q2-L8-L1/Q2-L8-L1_node.md\n                 ^^ the question, a directory holding no node file of its own\n```\n\n`ls blueprint/nodes/` returns `Q1 Q2 Q3`. `ls blueprint/nodes/Q2/` returns exactly what Q2\nprovoked. Every segment after the first is still the full id of that ancestor, so a\ndirectory's name still says exactly which node it holds, and a path lifted out of context\nstill identifies itself.\n\n**An appendix entry moves into its section's directory:**\n\n```\nblueprint/appendix/coherence-holonomicity/def-renormalized.md\n```\n\nThe nine sections are the ones `index.md` already fixed, in the order it already fixed them\nin. The listing keeps the order; the path now carries the membership.\n\n## Consequences\n\n**Every relative link in the reasoning tree gains a `../`, and two directories gain a\nsegment.** 505 files moved and 517 files had links rewritten. The rewrite must be done by\nresolving each link against its **old** location, mapping it through the move table, and\nre-emitting it relative to its **new** location. Adjusting `../` counts by regex mangles\nevery link that did not need changing, and the ones that break silently are the ones\npointing sideways within a subtree.\n\n**A critique's links were repaired, and this is not a violation of append-only.**\nCritiques under `nodes/*/critiques/` are never rewritten, and none of their prose was.\nRe-pointing a relative link so that it still resolves to the file it already named preserves\nthe audit trail; leaving it dangling destroys it. [0050](0050-a-node-has-at-most-ten-children.html)\nworried about exactly this and was right to note the cost — the answer is that the link\ntarget is not the claim.\n\n**The section of an appendix entry is now stored twice**, in its path and in `index.md`,\nand this is a real cost that [0053](0053-the-appendix-is-a-directory.html) explicitly bought\nits way out of: its schema comment said \"moving one between sections re-orders this listing\nand breaks no link anywhere\", and that sentence is now false. Moving an entry between\nsections breaks every link into it. The build checks the path against the listing so the two\ncopies cannot drift silently, and the trade was taken because sixty-five files in one\ndirectory had already stopped being readable.\n\n**Four code paths had to learn the appendix layout**, and each had a regex assuming the\nanchor sat directly under `appendix/`. Three of them failed loudly. The fourth —\n`re.findall(r\"appendix/([\\w-]+)\\.md\", text)`, which decides whether a node mentions an\nentry — captured the *section directory* as the anchor and quietly reported every entry as\ncited by nobody. That is the shape of failure to expect here: not a crash, but a check that\nstill runs and now measures the wrong thing.\n\n## Alternatives rejected\n\n**Leave the top layer flat and rely on [0050](0050-a-node-has-at-most-ten-children.html).**\nThe ten-children cap would eventually force `Q1`'s sixteen children down into groups, which\nwould shrink the flat listing. But it would not remove it — three questions' worth of\ntop-level nodes still share one directory — and the cap is a mathematical judgement about\nwhich lemmas serve which siblings, which is not something to make under filesystem pressure.\n\n**Group the appendix by role instead of by section.** `definition/`, `black-box/`,\n`convention/`. Rejected: the role is a field inside the entry and is occasionally revised,\nso it would be a third copy of a mutable fact, and the reading order — which is what a\nnewcomer actually needs — is by subject.\n\n**Give a question its own `Q2_node.md` so it stops being a special case.** Rejected: a\nquestion is a problem statement with framing, a **Goal.** and a **Feeds.** paragraph, and it\nalready lives in `main_dag.md`. Giving it a node file would make its framing a second copy\nof what `main_dag.md` stores, and [0044](0044-a-question-states-a-problem-not-its-route.html)\nis about keeping those apart. A directory with no node file in it is a smaller anomaly than\na question with two homes.\n";</script>
