<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0087-why-is-its-own-operator</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0087 — `/why` is its own operator, and the reader supplies the question</h1><p class="lead">Generated from <code>process/decisions/0087-why-is-its-own-operator.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-09\n**Status:** accepted\n**Supersedes:** nothing. Extends [0062](0062-a-node-states-its-own-flaw.html) and [0077](0077-the-ask-is-a-line-on-the-node.html), which put the other two answers on the node.\n\n## Context\n\nA node already says three things about itself, each stored once and each read by a different person:\n\n| written where | answers |\n|---|---|\n| `status:` and the generated flaw block | **what is wrong** ([ADR 0062](0062-a-node-states-its-own-flaw.html)) |\n| the `needs:` line | **what would make it right** ([ADR 0077](0077-the-ask-is-a-line-on-the-node.html)) |\n| `<id>_history.md` | **what has happened to it**, dated |\n\nNone of them answers **why the node is there at all** — why this lemma rather than a step inside its parent, why this hypothesis, why this route and not the obvious one. That question is the one a reader opening a graph of 113 nodes actually has, and the record is complete and unreadable with respect to it: everything is retrievable and almost nothing is legible.\n\nInterpretability is a borrowed word and the machine-learning literature has already argued out what it can mean. Four results shape what the operator may be:\n\n- Lipton, *The mythos of model interpretability* — the word names at least four different properties, and papers routinely claim one and evidence another. **So the operator must say which one it targets.**\n- Doshi-Velez and Kim, *Towards a rigorous science of interpretable machine learning* — interpretability is definable only relative to a downstream task and the human performing it. **Ours: a mathematician deciding where the next hour goes.**\n- Rudin, *Stop explaining black box models for high stakes decisions* — a post-hoc explanation of an opaque process is a second model that may simply be wrong about the first. **So narration is the failure mode, not the goal.**\n- Miller, *Explanation in artificial intelligence: insights from the social sciences* — explanation is contrastive: people ask why *this* rather than *that*, and an answer that ignores the foil is not an explanation. **So the foil belongs to the asker.**\n\n## Decision\n\n**`/why <node-id> \"<question>\"` writes `blueprint/nodes/<id>/why/w<n>.md`** — numbered and append-only like a critique round, three required sections (`## Question`, `## Short answer`, `## Where to read further`) and no others, at most **300 words**, which the render gate fails rather than reports.\n\nFive properties, each answering one of the four results above or the record's own discipline.\n\n**The question is a required argument, recorded verbatim.** The operator refuses to run on a node alone and never invents a question to answer. Verbatim because the phrasing is the evidence about what was unclear; a later reader comparing the question to the answer is the only test this operator has, and the presentation pass may not touch that section.\n\n**Every claim ends in a pointer, and the third section must link something.** The repository is read before the literature and the local library before the web ([ADR 0017](0017-operators-read-the-local-library.html)). Most \"why\" questions are already answered on disk — in a history entry, a supersession record, or a referee's own words — and the answer is a link rather than a paragraph.\n\n**An answer that needs an argument is not a `/why`.** The run writes nothing and names the operator that is wanted. This is the same stop `/prove` makes when the statement is what is wrong: the stop is the run's product.\n\n**It is outside the closed world and carries no machine-readable line at all.** Nothing may cite a note, it moves no status, no statement, no `needs:`, no `human:` and no confidence channel — and the gate rejects a `VERDICT:`, `EVIDENCE:`, `GOALCHECK:`, `KEY:` or `WHY:` line inside one. A verdict attached to an explanation is an explanation worth gaming, and there is deliberately nothing here to game.\n\n**It has no subagent.** The answer is a pointer into records the main thread has read; a delegate that has not read them writes a plausible paragraph in place of a citation, which is precisely what Rudin's argument predicts and what the third section exists to catch.\n\nThe site draws each note as a `<details>` panel **above the node's statement**, closed by default, where an example hangs. The generated `<id>_prompt.md` does **not** carry it: the packet carries what a reader needs in order to *work* on the node ([ADR 0063](0063-a-prompt-carries-what-is-needed-to-work.html)), and why the node exists is not a working input. When the honest answer is that nobody here knows, the note says so and the next action is that same packet, pasted into a deep-research model that has never seen this repository — whatever comes back is a lead, and it re-enters through `/update` or the appendix, never through this file.\n\n## Consequences\n\nA tally of unanswerable \"why\"s becomes available, and it is the most useful thing the operator produces: a node nobody can say why we have is a node the decomposition should be asked about.\n\nThe 300-word cap is the operator, not a courtesy. It is set where an explanation stops delegating and starts arguing, and it *fails* — unlike the critique cap, which is reported because a report is append-only and the remedy is the next one. A `/why` note is written by the operator that is about to report, so the remedy is available immediately.\n\nTwo costs, stated because they are real. A panel above the statement is space taken from the statement, which is why it is closed by default. And an operator whose output nothing may cite is an operator with no gate on whether its answers are *good* — only on whether they are short, sectioned and sourced. Whether readers open the panels at all is a question a week of use answers, and the null — that nobody does — is worth having.\n";</script>
