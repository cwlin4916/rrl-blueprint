<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0019-the-update-operator</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0019 — `/update`: the statement-revision operator</h1><p class="lead">Generated from <code>process/decisions/0019-the-update-operator.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Extends:** [0015](0015-every-node-declares-its-role.html), [0018](0018-example-and-analogy-nodes.html)\n**Fills:** the second unfilled hom-set of [`operations.md` §8](../operations.html#7-the-operations-that-do-not-exist)\n(\"retire or supersede a node — missing; a node whose statement turned out wrong has\nnowhere to go\")\n\n## Context\n\nThree pressures arrived at once.\n\n1. **A statement can be wrong, and nothing could act on it.** The pipeline could add\n   artifacts under a node forever, but the one field that might need to change — the\n   `## Statement` — was frozen by I2 with no lawful exception. `operations.md` §8 named\n   the missing map and left it unbuilt.\n2. **A question is not a problem statement.** Q1's section was a title in the shape of a\n   question, a setting, and a closure — but no statement of *what would count as an\n   answer*: which conditions are sought, and whether the target is necessary, sufficient,\n   or an exact criterion. A reader could not tell whether the question was answered,\n   partially answered, or unanswerable as posed.\n3. **External review has no ingestion path.** The user brings passages — a referee's\n   argument, a model's long-form critique — that bear on nodes. Pasting one into a\n   critique would forge the referee record; ignoring it loses real mathematics. It needs\n   a door with a customs check.\n\n## Decision\n\n**A sixth command, `/update`, run by the orchestrator in the main thread — no new agent.**\n\nType signature, in `operations.md`'s notation:\n\n$$\n\\texttt{/update} : (\\mathsf{Ques} + \\mathsf{Node}) \\times \\mathsf{Input}^{?} \\rightsquigarrow \\mathsf{Stmt}' \\times \\mathcal{P}(\\mathsf{Upd}) \\times \\mathsf{Prio}\n$$\n\n- **Domain.** No argument: every question, root first, then its nodes in DAG order —\n  the whole tree. A question id or node id: that target alone. Optionally an external\n  passage or file — the *input*.\n- **What it may change.** A question section's prose in `main_dag.md` — including the\n  **Problem statement** paragraph this ADR makes mandatory for every question: what is\n  sought, and whether the sought condition is *necessary*, *sufficient*, or *necessary\n  and sufficient*. A node's `## Statement` and `## Remark`. The node's `status:`, only\n  downward to `open`, and only when the statement materially changed. The priorities\n  file (`blueprint/priorities.md`, [ADR 0020](0020-the-priority-panel.html)).\n- **What it must write when it changes a statement.** `blueprint/nodes/<id>/updates/u<n>.md`\n  — append-only, numbering never restarting, the same contract as critiques: the old\n  statement, the new one, what forced the change, and what was *not* adopted and why.\n  The commit message announces the change (\"the statement of \\<id\\> was corrected: …\"),\n  which is what keeps L1's disclosed-or-forbidden test green.\n- **What it may never touch.** `human:` (the user's), `created:`, ids and directories,\n  critiques, `examples.md`, the appendix, the manuscript. A revision that needs new\n  vocabulary *reports* the missing appendix entry as a priority for `/decompose`; it\n  does not write it.\n- **Distrust of input is a gate, not a mood.** An external passage is never transcribed.\n  The orchestrator re-derives each mathematical claim it proposes to adopt (recompute\n  the example, re-run the adjunction, check the cited result against `papers/` or the\n  web), checks each claim *about the repo* against the repo, and records in `u<n>.md`\n  which claims were verified, which were rejected, and which were noted but not acted\n  on. A claim that cannot be verified is not adopted, however plausible.\n- **Simplicity is a constraint on output.** A revised statement stays minimal: short\n  hypotheses, appendix links instead of restatements, and if a correct statement will\n  not fit the node, the recommendation is a `/decompose`, not a longer statement.\n\n## Justification\n\n**Supersession had to be a command, because it is the one non-fully-faithful move left\nimplicit.** `operations.md` §5 shows the pattern: narrowing an appendix entry invalidates\ndrafts and forces re-refereeing. Changing a statement is the same move one level up —\nevery draft, critique and evidence line under the node was about the *old* claim. Making\nit a command makes the invalidation explicit: status drops to `open`, the update file\nmarks the seam (the same seam I4's critique numbering leaves), and stale artifacts stay\non disk as history rather than being laundered.\n\n**The orchestrator runs it, because verification is the job.** Every other command\ndelegates production and keeps the gate. Here the *gate is the production*: what `/update`\nwrites is precisely what survived verification, so a subagent would just move the trust\nboundary without removing it.\n\n**Necessary/sufficient must be stated at the question**, because \"when does $P$ hold?\"\nadmits four different finished states (characterization, sufficient condition, necessary\ncondition, obstruction) and the tree cannot show progress toward an unstated target.\n\n## Consequences\n\n- `.claude/skills/update/SKILL.md` is the operating procedure; the cast list becomes\n  six skills, five agents (`tests/test_skills.py` updated with it).\n- `operations.md` gains the `/update` row, the $\\mathsf{Upd}$ type, laws L14–L15, and\n  §8's supersession row is marked filled. `pipeline.md` gains I15 (statement\n  supersession) and I16 (priorities, with 0020).\n- `main_dag.md`'s schema now requires a **Problem statement.** paragraph per question;\n  Q1's is the first.\n- The one-shot ingestion risk remains: a wrong verification wrongly revises a statement.\n  Mitigation is the trail — `u<n>.md` plus the journal record what was believed and why,\n  and `human:` remains above every automated judgement.\n\n## Alternatives considered\n\n**Route external passages through the critic.** Rejected: a critique is the referee's\nown reading of a draft against the closed world; smuggling third-party text into\n`critiques/` forges the provenance the confidence channel D is computed from.\n\n**A `revise` status instead of resetting to `open`.** Rejected: `open` already means\n\"statement stands, nothing current is proved about it\", which is exactly the\npost-revision state; a sixth status would fork every consumer of the field for a\ndistinction `updates/` already records.\n\n**Let `/update` also create nodes.** Rejected: creation is the lead-researcher's, and\nkeeping it so preserves the one-writer-per-artifact discipline; `/update` may only\n*recommend* a decomposition or an e/a node in its priorities output.\n";</script>
