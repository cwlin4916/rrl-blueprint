<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0045-there-is-no-blocked-node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0045 — There is no blocked node</h1><p class="lead">Generated from <code>process/decisions/0045-there-is-no-blocked-node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted\n**Amends:** [0009](0009-one-tree-per-kind.html) (every fact stored once), which introduced `ready` and `blocked` as the two derived statuses. `ready` survives; `blocked` does not.\n\n## Context\n\n`blocked` was derived, never stored: an `open` node whose dependencies were not all\n`proved`. It did two different jobs under one name.\n\nThe first was **information** — this node rests on something nobody has established\nyet. That is a true and useful thing to show.\n\nThe second was a **permission**. `/prove` §1 read the dependency statuses and refused:\n\n> Any node listed in **depends-on:** whose own node file does not say `proved` → report\n> the missing dependencies by their resolved paths and stop. Write nothing.\n\nThe two jobs disagree. The information is about the *record*; the permission is about\nthe *work*, and the permission is wrong. A lemma whose statement is fixed can be proved\nfrom its dependencies' statements whether or not those statements have themselves been\nestablished — that is what it means for the dependency to be a *statement* rather than\na write-up, and it is the ordinary practice of mathematics. Nothing about the argument\nfrom Q1-L4's statement to Q1-L5-L3 changes on the day Q1-L4 acquires a proof.\n\nWhat the gate produced instead was a serialization the mathematics never asked for. On\nthe day this record was written, six of the eight nodes under Q1-L5 read `blocked`, the\nwhole subtree behind a single unproved Q1-L4, and the only admissible action anywhere\nin Q1 was the one node at the frontier. A researcher who wanted to find out whether\nQ1-L5-L6 was even the right claim — the node the decomposition itself flags as where\nthe difficulty moved — could not, because a different node was unproved.\n\nThere is a real thing the gate was protecting: a write-up must not quietly present an\nassumed fact as an established one. But that is a **disclosure** requirement, and it is\ndischarged by saying so in the packet and in the write-up, not by refusing to run.\n\n## Decision\n\n**`blocked` is removed, as a status and as a gate.**\n\n1. `eff_status` returns `ready` for an open node whose dependencies are all proved, and\n   `open` otherwise. `ready` keeps its meaning — a scheduling hint, nothing left to\n   assume — and is now the only derived status.\n2. No operator refuses on dependency status. `/prove` and `/decompose` run on any node\n   in the graph.\n3. **Unproved dependencies are disclosed, not hidden.** The prover packet splits its\n   Facts into two labelled groups — established, and *assumed* with each assumed node's\n   current status named — and the write-up says which assumed facts it used. The\n   generated `<id>_prompt.md` carries the same split, so a packet that leaves the\n   repository carries the caveat with it.\n4. The critic reads the split. A proof leaning on an assumed statement is not thereby\n   defective; a proof that leans on one **without saying so** is.\n5. Confidence already handled this correctly and is untouched: a node is capped by the\n   weakest node beneath it, so proving a lemma from an unproved dependency cannot raise\n   its number past that dependency. The cap was always doing the work the gate claimed\n   to do — and doing it as a *measurement* rather than a prohibition.\n\n## Justification\n\nThe cap is the argument. Once `C(v)` is bounded below by the weakest node it rests on,\na proof written against an unproved dependency is already scored as what it is: an\nargument whose standing is limited by what it assumed. Refusing to write it as well was\ncharging twice for the same fact, and the second charge cost the researcher their\nchoice of where to work.\n\nThe disclosure route also dominates on failure modes. A gate can only distinguish\n`proved` from not; it cannot tell a load-bearing assumption from a dependency the proof\nnever actually invokes. A labelled packet plus a write-up that names what it used gives\na referee the finer fact, and gives `/update` something to act on when a dependency's\nstatement later changes.\n\n## Consequences\n\n- The Q1-L5 subtree becomes workable in full. Its six sub-lemmas and the node itself can\n  be proved in dependency order in one sitting, with Q1-L4 and Q1-L2 entering as assumed\n  facts where they are needed. That is the run this decision was made for.\n- The graph loses a colour. An open node is grey whether or not its dependencies are\n  proved, and the frontier is read off the `ready` colour and the priority panel's\n  derived `ready — every dependency proved` row, which already existed.\n- The tally line changes shape: `Proved n/N · ready r · open o · failing f`.\n- The CSS class `open` was already taken by the expanded-card state, which is renamed\n  `opened`. A cosmetic collision, fixed at the same time.\n- **A cost accepted:** it is now possible to build a long chain of write-ups resting on\n  a statement that later turns out false, and to discover it late. Three things bound\n  that — the confidence cap, which keeps every such node visibly negative-or-limited;\n  `/check-goal`, which tests a statement against the bench *before* proving; and\n  [0046](0046-a-refuted-statement-needs-a-change.html), which gives a refereed refutation\n  its own verdict and its own warning, so a false statement announces itself rather than\n  waiting to be inferred from a stalled subtree.\n\n## Alternatives considered\n\n**Keep the gate, add an `--assume` flag.** Rejected: a flag that is correct to pass\nevery time is not a flag, it is a default with an extra step. The disclosure has to be\nin the record either way, and once it is, the flag guards nothing.\n\n**Keep `blocked` as pure display.** Rejected, though it was close. The word means \"you\nmay not proceed\", and it would have gone on meaning that to every reader and every\nagent that reads its own instructions. A status that no longer gates should not keep the\nname of a gate.\n\n**Remove `ready` too.** Rejected: `ready` never gated anything — it is a hint about\nwhere the cheapest work is, and the priority panel already leans on it. Removing a\ntruthful hint alongside an untruthful prohibition would have been a different decision\nwearing this one's clothes.\n";</script>
