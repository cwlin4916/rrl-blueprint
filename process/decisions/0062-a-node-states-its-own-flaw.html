<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0062-a-node-states-its-own-flaw</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0062 — A node states its own flaw</h1><p class="lead">Generated from <code>process/decisions/0062-a-node-states-its-own-flaw.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-06\n**Status:** accepted; its reading of which sections a node file may have is amended\nby [0074](0074-the-decomposition-paragraph-is-removed.html) — `## Statement` is now the only one.\n**Extends:** [0055](0055-a-flag-names-the-record-it-fired-on.html) (a flag names the record it fired on), [0037](0037-the-node-panel-carries-the-statement.html) (a readout shows the statement and links the record)\n\n## Context\n\n`Q2-L4_node.md` said `status: failing` and linked `critiques/r2.md`. Those two facts\ntogether are the whole of what the node file said about what was wrong with it, and\nneither of them is the defect. A reader who opened the node to see what it claims — a\nhuman, an operator, the next `/prove` run — learned that a referee had objected, and had\nto open a second file to learn to what.\n\n[0055](0055-a-flag-names-the-record-it-fired-on.html) fixed the same problem for the card\nand the generated prompt: the chip names its record, and the prompt, which cannot link,\ninlines the record's words. The node's own file was left out of that, and it is the one\nreadout that is *canonical* — the file every operator reads first and the one the site\nrenders as the node page.\n\nThe reason it was left out is real. Every fact is stored once (I5), and the defect is\nstored in the round. A hand-written copy in the node file is a second copy, and a second\ncopy of a referee's objection drifts from the objection.\n\n## Decision\n\n`<id>_node.md` carries a **generated flaw block**, on exactly the footing the index block\nof `main_dag.md` already has: delimited by `BEGIN FLAW` / `END FLAW` markers, written by\n`tools/build_dag_site.py`, never hand-edited, and removed by the same build when the flaw\nclears. The critique, supersession or examples file remains the record; the block is a\nbounded quotation of it, so the fact is still stored once.\n\nIt sits between the field block and `## Statement`, so a reader meets the defect before the\nclaim, and it carries three things:\n\n1. **What is wrong**, in four words — the same short reason the card's chip carries.\n2. **What to do about it**, in one clause, naming the operator that answers it.\n3. **The record's own words** — for a `failing` node, every standing `FATAL` and `MAJOR`\n   flaw of the last round, each as its location and its opening sentence, capped at three\n   with a count of the rest; for a superseded node, the defect sentence of the\n   supersession; for a `gap` or a `counterexample`, the `EVIDENCE:` line together with the\n   `What was not found.` paragraph, or the line that says what contradicts the statement.\n\nLinks inside the quotation are rebased from the record's directory to the node's, because\nevery record but `examples.md` sits one level deeper than the file quoting it.\n\nThe block is not a heading, so the rule that `## Statement` and `## Decomposition` are the\nonly sections a node file may have is untouched, and the render gate needs no exemption.\nThe node page renders `<id>_node.md` whole, so the page gains the block with no template\nchange and cannot disagree with the file.\n\n## Consequences\n\n- 31 of 106 nodes gained a block on the first build. Six were `failing`, four had a\n  counterexample or a gap on record, and the rest had been revised and not re-proved.\n- `--check` fails on a stale or missing block, the way it already fails on a stale index\n  block, so a critique written without a rebuild is caught.\n- The one cost is that a canonical file now contains generated text. That was already true\n  of `main_dag.md`, and the markers make the boundary explicit: everything outside them is\n  the author's and no build touches it.\n";</script>
