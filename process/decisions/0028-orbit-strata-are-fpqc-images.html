<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0028-orbit-strata-are-fpqc-images</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0028 — The orbit strata are fpqc-sheaf images</h1><p class="lead">Generated from <code>process/decisions/0028-orbit-strata-are-fpqc-images.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-04\n**Status:** accepted\n**Complements:** [0001](0001-satake-generation-ambient-category.html) (the ratified-reading mechanism), [0017](0017-operators-read-the-local-library.html) (page-level verification behind this decision)\n\n## Context\n\n`def:orbits_iwahori_spherical` (main.tex:737) posits the posets of $I$- and $L^+G$-orbits of $LX$ with their locally closed embeddings, but the manuscript never defines \"orbit\" for a placid group acting on a placid ind-scheme. The first `/prove` round on Q1-L4-L1 — the node whose whole content is the presentation $LX_\\lambda \\simeq K/K_\\lambda$ — foundered on exactly this: its Step 4 needed the stratum to *be* the image of the orbit map, and no appendix entry, ratified reading, or dependency supplied that sense ([r1](../../nodes/Q1/Q1-L4/Q1-L4-L1/critiques/r1.html), Flaw 1).\n\nThe published form of the missing statement is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10, verified at page level by the Q1-L4-L1 `/examples` run — SW22 defines the orbit \"*a priori* … as the fpqc sheaf quotient\" and proves it representable and locally closed. But SW22 has no `refs.bib` key, `refs.bib` is the user's file, and the citation policy forbids citing keys that do not exist; the critic's preferred route (add the key and a black-box entry) is therefore not available to any agent.\n\n## Decision\n\nThe blueprint fixes the reading of `def:orbits_iwahori_spherical`, recorded as a ratified-reading note on the entry itself and as reading 3 in `context.md`:\n\n- For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h \\cdot x$, a subsheaf of $LX$. The definitional content of the entry is that these image sheaves are representable by the locally closed sub-ind-schemes it names: the strata are the orbit images through their $k$-points.\n- The reading is self-contained on the manuscript's own terms and deliberately does **not** identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ (p. 22, inside the proof of Thm 36). That identification stays a theorem wherever a node needs it — [r1](../../nodes/Q1/Q1-L4/Q1-L4-L1/critiques/r1.html) Flaw 2 is what this clause answers: a bare \"the source's sense\" ratification would have buried that theorem inside a convention.\n\nConsidered and rejected: adding an SW22 appendix entry (blocked — no `refs.bib` key, and the key is the user's to add); transcribing the orbit presentation from inside Chen–Yi's proof of Thm 36 as a new black box (its spherical generality rests on Remark 37, which rests on SW22 on the page — the smuggle would be one layer down); leaving the GAP and letting the node fail at r3 (the same ambiguity blocks every consumer of the entry, including all five Q1-L5 sub-lemmas).\n\n## Consequences\n\n- Q1-L4-L1(b) keeps real content under the reading: orbit–stabilizer gives $K/K_\\lambda \\simeq \\operatorname{im}(a_\\lambda)$ as fpqc sheaves, which the reading identifies with the stratum; representability is the entry's posited data, exactly as the locally closed embeddings already were.\n- Every node consuming `def:orbits_iwahori_spherical` now works with a definite sense of \"orbit\"; changing the reading later invalidates their proofs, as `context.md` warns for every ratified reading.\n- The clean permanent fix stays open to the user: add the SW22 key to `refs.bib` and the PDF to `papers/`, and a later `/update` can convert the ratified reading's provenance note into a citable black-box entry.\n";</script>
