<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">process</a><i>›</i><span>0091-the-front-door-is-the-graph</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>0091 — the front door is the graph, and a collaborator gets a to-do page</h1><p class="lead">Generated from <code>process/decisions/0091-the-front-door-is-the-graph.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-09\n**Status:** accepted\n**Relates to:** [0033](0033-the-generated-site-is-tracked-again.html) (the site is tracked and still generated), [0016](0016-the-site-mirrors-the-source-tree.html) (the site mirrors the source tree), [0039](0039-one-graph-for-every-question.html) (one graph, one card per question), [0082](0082-the-root-graph-draws-questions-alone.html) (the root graph draws questions alone).\n\n## Context\n\n`blueprint_site/index.html` was the hub: a page titled *Blueprint — all pages* whose entire content was a list of thirteen destinations, plus the repository's derived confidence in a lead paragraph.\n\nIt was the site's landing page, and it was a page nobody wanted to be on. Every visit to it was on the way somewhere else, and the bar it was reached from already carried a link to it — so the first click of a session was always the same click, and it was always a click past. The reader who opens a blueprint of a research programme wants the argument; the hub made them ask for it.\n\nTwo other things were true and pointed the same way. A list of destinations is what a **menu** is for, and the graph pages already had one — the `▾ operators` panel, reachable from every graph page, holding the operators, the gates, the colour legend and the status filters. And the destination list was not itself redundant: it is the only index of concepts, papers, gaps, context and the process notes, none of which the crumb trails reach.\n\nSeparately: collaborators are being handed this repository and asked to read two papers and write one file back. That ask lived in a message. A repository that stores every fact once, and derives the rest, was storing this one nowhere.\n\n## Decision\n\n**`dag.html` is the front door. There is no hub page.** Three parts.\n\n**The destination list moves into the graph bar's menu**, which is renamed from `▾ operators` to `▾ menu` because it now opens on `pages` and the old label named its second section. Nothing is orphaned: every page the hub listed is one click from every graph page, where before it was two from anywhere that was not the hub.\n\n**The home crumb is retargeted, not deleted.** Every doc page's trail opened on `blueprint ›`, pointing at the hub; it now opens on `the DAG ›`, pointing at the graph. The graph pages carried *both* `blueprint ›` and `the DAG ›` — the first is gone, and on `dag.html` itself the `⌂ DAG` control hides, because it resolved to the page it was on and a nav anchor that goes nowhere teaches a reader that the bar is decoration.\n\n**`process/todo.md` renders as `todo.html`, and it is a tab in the top right of every page** — the third destination in a bar that ADR-era comments describe as holding two. It earns the slot on the same argument the appendix did: it is the one thing a reader who has just been handed the site is looking for and cannot derive from anything else on it. It lives in `process/` because it is about how the machine is run rather than about the mathematics, and it renders at the top level beside `readme.html` because a destination in the bar should not have a directory in its URL.\n\nThe repository's derived confidence, which was the hub's only content that was not a link, moves to `pipeline.html` — the page about what to do next, which is decided by where the number is worst.\n\n## Consequences\n\nThe site loses a page and gains one. `--check` gains nothing to verify that it did not already: the to-do page is generated from a canonical markdown file like every other page, and the menu is built from the same question and appendix counts the hub's list was.\n\nThe cost is one lost affordance. A reader who wanted to see every page at once, laid out, now opens a menu instead of a page — worse for that reader, and there is no evidence anyone was that reader. The menu also grows: it now has five sections, and if it acquires a sixth this decision should be revisited rather than the panel scrolled.\n\n`README.md` says `open blueprint_site/dag.html` in the two places it used to name the hub.\n";</script>
