<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">process</a><i>›</i><span>journal</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Build journal</h1><p class="lead">Generated from <code>process/journal.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[docs index](index.html) · [design](pipeline.html) · [decisions](../../process/decisions) · [concepts](../concepts/index.html) · [full record](journal_v1.html)\n\nHow the auto-research pipeline was built and what it produced, including the parts that were wrong on the way. [`pipeline.md`](pipeline.html) says what the system *is*; this says how it got there.\n\nCompacted on 2026-08-05 ([ADR 0034](decisions/0034-the-journal-is-compacted-into-phases.html)). The sixty-nine original entries are preserved word for word in [`journal_v1.md`](journal_v1.html), which is the authority if the two ever disagree.\n\n## What this cost us to learn\n\nThe ten findings that changed how the pipeline works. Each was paid for by something going wrong.\n\n- **The decomposition is the strategy.** A wrong cut wastes every proof downstream of it, and no amount of care in the individual proofs recovers it. Reviewing statements before proving anything is the step that cannot be skipped.\n- **The hostile referee pays for itself immediately.** The pipeline's very first output was not a proof but a *defect report against the manuscript*: `def:satake_subcategory` invokes a generation operation without naming its ambient category, so the definition as printed does not determine a subcategory. The prover had silently chosen a reading; the critic caught that the choice was unjustified rather than that it was wrong.\n- **Check the artefact, not the source.** A page shipped whose mathematics did not render, while every file in the repository was individually correct. A gate that validates the source passes exactly when the thing you ship is broken in a way the source cannot see.\n- **A scoring scheme with no negative range cannot represent its own most valuable finding.** `/examples` was documented from the start as having a *falsity referral* as its best outcome — and for two decision records that outcome had no visible effect on anything. Confidence had to become signed before the machine could say \"we found evidence against\" rather than merely \"we found nothing\".\n- **Absence of evidence and evidence against are different states**, and a display that cannot tell them apart will be read as the wrong one. Hence silent channels that cost nothing, rather than channels that default to zero.\n- **Derived state must never be stored.** Every fact lives in exactly one place; `ready`, `blocked` and confidence are computed at build time. Each stored duplicate found in this repository had already gone stale by the time it was found.\n- **An external passage is a lead, never a source.** Every claim from outside gets recomputed against the appendix and the manuscript before a word of it is adopted, and what could *not* be verified is recorded alongside what could. This caught a paraphrase that had quietly transposed a characteristic-zero theorem into equal characteristic.\n- **Separate presentation from refereeing.** While the critic was responsible for both, it kept flagging formatting, and the noise hid the mathematics. Presentation became a content-preserving stage, gated by a mechanical diff rather than by trust.\n- **Concurrency in a shared working tree is the recurring operational hazard.** Sessions have overwritten each other's referee reports, swept each other's staged files into commits, and re-added statements a parallel run had just withdrawn. Every fact stored singly collides. Re-check git state before every commit and stage only your own paths.\n- **Resolve a path before matching on its name.** A rename done by string match on `node.md` also matched `0002-one-file-per-node.md`, breaking eleven links. The render gate caught all eleven, which is the argument for the gate — and for never doing the next one by substring.\n\n---\n\n## Phase 1 · 2026-08-02 — bootstrap\n\n`4280e6e` `7da76fe` `cf5f5e5` `6421ca0` `39193fe` `b5d7809` `59c6210`\n\nManuscripts, preamble and bibliography committed *before* any automation, so that every later diff separates research output from the machinery producing it. That boundary turned out to matter more than expected: \"did the pipeline change the paper?\" is answerable by looking at whether `main.tex` appears in a diff. It never should.\n\nThen the scaffold — agent definitions, slash commands, `blueprint/`, templates — with three agents (lead-researcher, prover, critic) whose tool grants were chosen to make the write discipline mechanical rather than advisory. The critic got no edit and no shell tools.\n\n`blueprint/context.md` was distilled from the Conventions section of `main.tex` **by hand**, and slowly. That was the correct trade: an automatically-scraped context would not have forced anybody to decide *what is being assumed*. This was the first statement of the closed-world rule.\n\nFirst real use: `/decompose` Q1 into seven nodes, with a stated logical closure, bracketing the answer between a necessary and a sufficient condition rather than aiming straight at a characterisation. Then `/prove` Q1-L1 — two rounds, and the defect report described above.\n\nHousekeeping that stuck: house macros were leaking from `.tex` into blueprint markdown where nothing expands them, so every `.md` file went to standard KaTeX and a gate now refuses a leak. LaTeX artefacts routed into a gitignored `build/`.\n\nLate the same day, two structural moves. A fourth agent, the **checker**, split presentation out of refereeing. And the **appendix of objects** replaced the tables: a row cannot carry a statement or its hypotheses, so an object gets a full entry or it is not available.\n\n## Phase 2 · 2026-08-03 — the tree gets a shape, and a picture\n\nNode directories replaced node files; `/examples` arrived as a way to bring the literature in; the DAG became something you can look at. Arrows point prerequisite → result (the first version pointed the other way and read backwards), results at top, positions derived rather than stored — four things taken from Tao's `paper-diagram` format spec after reviewing it.\n\n`/decompose` learned to take a node id as well as a question, expanding one lemma into sub-lemmas. This is the escape hatch for the one-page rule: when a write-up will not fit, the node was really several nodes. The parent's statement stays frozen.\n\nThe README was rewritten around the question it had not been answering — not what the agents are, but what a person types. You never invoke an agent; you type a command, and the command drives them.\n\n## Phase 3 · 2026-08-03 — the render gate, and the site\n\nA blueprint page shipped that did not render. The response was the gate, and then the harder version of it: not \"is the markdown well-formed\" but \"does the *generated page* render, and does every link between generated pages land\". `docs/` became a generated site; the checks went to seven, then eight when the ambient-category subscript rule was mechanized.\n\nOne tree per kind, and the index stopped being written twice: the per-question bullet list in `main_dag.md` became a generated block between markers, because two copies of a status is one copy that is wrong.\n\nCritiques were exempted from the new notation gate and reported as advisory. A critique is an append-only record of what a referee saw, and rewriting one to match a convention adopted afterwards would falsify it.\n\n## Phase 4 · 2026-08-03 — Q1-L2 expanded, Q1-L1 re-proved\n\nQ1-L2 was decomposed into four sub-lemmas and the sub-DAG renderer met its first sub-DAG. Q1-L1 was refereed again and re-proved, at a cost worth recording: to fit eleven citations on one page the prover reached for `\\footnotesize` and friends, which carry no meaning in the reading view.\n\nAlso this phase: one manuscript, one preamble. `v2.tex` became `main.tex`, three preamble files merged into `preamble.tex`, and both gates learned to harvest house macros from the single file.\n\n## Phase 5 · 2026-08-04 — the design, written down\n\nThree documents in sequence. [`pipeline.md`](pipeline.html) states the design and its invariants. The portable version states the same machine with the mathematics removed, so it can be instantiated elsewhere; it was fact-checked by an adversarial pass told to *refute* rather than approve, which found two wrong facts in the draft. [`operations.md`](operations.html) states the repository as a dependently-typed schema and each command as a typed map — then was split so that **readouts are separated from commands**, because only a command changes what is true.\n\nThe site left git and stopped being called `docs` — a decision reversed later ([ADR 0033](decisions/0033-the-generated-site-is-tracked-again.html)).\n\nA test suite arrived, and found things. Writing the reference guideline surfaced four bib keys cited in the sources with no entry in `refs.bib`, one of them cited from `appendix.md` itself — a live violation of the cite-only-what-exists rule.\n\n## Phase 6 · 2026-08-04 — markdown write-ups, and nesting\n\nWrite-ups became markdown ([ADR 0011](decisions/0011-write-ups-in-markdown.html)): nothing under `blueprint/` compiles any more, and the render gate checks what latexmk used to. `/examples` became its own command rather than a mode of `/prove`.\n\nA sub-lemma's directory moved **inside its parent's** ([ADR 0012](decisions/0012-sub-lemmas-nest-in-their-parent.html)), so the id is the path. Decomposing a node now only ever adds directories beneath it.\n\n## Phase 7 · 2026-08-04 — confidence\n\nEvery node got a confidence, computed rather than declared: no `confidence:` field, nothing may cite the number, no gate reads it. First as a Baconian ratio over disposed flaws with weakest-link propagation ([ADR 0013](decisions/0013-confidence-is-derived-baconian-and-weakest-link.html)), then rebuilt as **three signed channels** — human at 25, the mathematical record at 50, the literature at 25, each able to be silent ([ADR 0014](decisions/0014-confidence-is-three-signed-channels.html)). The lesson that forced the rebuild is the fourth bullet at the top of this file.\n\nThe site began mirroring the source tree ([ADR 0016](decisions/0016-the-site-mirrors-the-source-tree.html)), and every node was made to state its **role** ([ADR 0015](decisions/0015-every-node-declares-its-role.html)). The trigger: Q1-L7, a sanity check nothing depended on, was indistinguishable on paper from an unproved chain lemma — it counted as an obligation, and the weakest-link minimum let its untouched record pin Q1 at 0% however much of the real argument was proved.\n\n## Phase 8 · 2026-08-04 — the operators get eyes, and find things\n\nOperators were required to read the PDFs on disk before memory and before the web ([ADR 0017](decisions/0017-operators-read-the-local-library.html)). Reading widens nothing: it never makes anything citable.\n\nThen the findings started arriving, and they were not the kind expected.\n\n**The first extended `/examples` run returned a false hypothesis rather than a missing example.** It also produced a malformed `EVIDENCE:` line — prose instead of one of the five values — which the gate rejected and sent back rather than letting the orchestrator repair it, because only the example-finder writes that file.\n\n**Q1-L4 clause (iv) is false, and false in print.** `EVIDENCE: counterexample` put Q1-L4 at −25%, and the weakest-link rule carried it to Q1-L5 and Q1-L6. Three cards went red on one build from one line of one file. The appendix was not the problem — the clause was.\n\n`/update` arrived to handle exactly this ([ADR 0019](decisions/0019-the-update-operator.html)), with the passage-is-a-lead contract, `updates/u<n>.md` records, and the rule that a strictly more general verified claim becomes a **new node the target specializes** rather than a widened statement in place. Its first run corrected the dévissage; a later one withdrew Q1-L4(iv) and commissioned its symmetric survivor. [ADR 0022](decisions/0022-update-proposes-nodes-from-failures.html) made proposing nodes from the failure surface part of the contract, and [ADR 0020](decisions/0020-the-priority-panel.html) gave the run somewhere to put a failure that names no crisp claim.\n\nThe example and analogy layer arrived with it ([ADR 0018](decisions/0018-example-and-analogy-nodes.html), [ADR 0021](decisions/0021-example-and-analogy-nodes-nest.html)): nine e/a nodes, then more. `/examples` on Q1-a1 produced **the pipeline's first counterexample verdict** — the function-theoretic generation question was answered in print in 2009, both ways, by the very paper the node cited for its display.\n\nOperationally, this is where concurrency first bit: two sessions working the tree at once, a node file whose statement changed between a read and a commit, and a shared index sweeping one session's staged files into the other's commit.\n\n## Phase 9 · 2026-08-04 — presentation, structure, and a second driver\n\nA run of user-directed structural passes. One graph everywhere, with corroboration folded into side branches ([ADR 0024](decisions/0024-one-graph-with-side-branched-corroboration.html)); the question block states a versioned, self-contained conjecture ([ADR 0023](decisions/0023-the-question-block-states-a-conjecture.html), [ADR 0025](decisions/0025-the-conjecture-is-versioned-and-self-contained.html)); sub-lemma families fold into their parent so the root canvas stays the size of one decomposition ([ADR 0026](decisions/0026-sub-lemma-families-fold-into-their-parent.html)); and `## Remark` was retired in favour of a dated, append-only `## History` on every node ([ADR 0027](decisions/0027-a-node-carries-its-history.html)).\n\nA notation audit found the proof spine clean and the e/a layer drifting — an ill-typed $K$, a check-versus-vee mix inside a single node — each repaired under its own `updates/u<n>.md`.\n\nCodex was wired to drive the same pipeline through thin adapters, with `.claude/skills/` and `.claude/agents/` remaining the semantic source of truth.\n\nThe Q1-L2 chain landed in this phase: four nodes, five rounds, one closed-world widening. The widening is worth its own line — Q1-L2-L1's r1 FAIL was not mathematical. The draft used exactness of the test pullbacks $f^!$, correctly, but had never declared the appendix entry that says so. The lead-researcher widened `objects:` by that one entry mid-round, and the r2 referee verified the disposal rather than taking it on faith.\n\n## Phase 10 · 2026-08-05 — prompts, names, and the Q1-L4 chain\n\nEvery node got a **generated self-contained prompt** ([ADR 0029](decisions/0029-every-node-has-a-generated-self-contained-prompt.html)): a portable readout assembled from the node, its history, the question framing, its prerequisites and the transitive appendix vocabulary — never edited, never cited, and rejected by the gate if stale. The repository-wide audit that produced it also fixed a live contradiction in `README.md`, which still described sub-lemma directories as flat.\n\nA node's own files were renamed for the node ([ADR 0032](decisions/0032-a-nodes-own-file-is-named-for-the-node.html)), so a path lifted out of its directory still says whose it is; every generated page got a door home. The rename is the source of the tenth lesson above.\n\n`/prove` was capped at two rounds and one widening ([ADR 0030](decisions/0030-the-prove-budget-cap.html)), and presentation became a stage of every command rather than a command of its own ([ADR 0031](decisions/0031-presentation-is-a-stage-not-a-command.html)), gated by a mechanical diff over status fields, verdicts and anchors. `/decompose` opened Q1-L4 along its three clauses and Q1-L5 along its two directions; Q1-L4-L1 was proved in two rounds with the orbit reading ratified ([ADR 0028](decisions/0028-orbit-strata-are-fpqc-images.html)). The site came back into git ([ADR 0033](decisions/0033-the-generated-site-is-tracked-again.html)).\n\nTwo operational findings. A markdown link whose text contains nested brackets was invisible to both the site relinker and the link checker, so it rendered dead while the gate reported nothing; 13 previously unchecked links came under the gate when both regexes learned to tolerate two levels. And a concurrent session ran its own round on the same node in the shared tree, where every singly-stored fact collided — its referee report overwrote one this session had already read.\n\n## Phase 11 · 2026-08-05 — the machine explains itself\n\n`/update Q1-L2-L3` at the user's reading that the statement is formal and the proof should be three paragraphs. The reading held, and sharpened: every clause is formal *except* the membership $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$, which asserts that a $!$-extension is coherent. That had been carried by the grammar of two appendix entries; it is now ratified explicitly on the manuscript's own presupposition at main.tex:79–80. The proof went from six steps to three paragraphs, the statement's clauses were rewritten into the words its two consumers actually use, and the three MINOR flaws standing from r1 were disposed at source — including two citation drifts caught by opening `main.tex` rather than trusting the entry.\n\nThe family-wide formatting pass found the drift that matters most here: Q1-L2-L2's proof cited \"the node's own Remark\" three times, in load-bearing positions, five records after [ADR 0027](decisions/0027-a-node-carries-its-history.html) retired that section. The *link* resolved, because it pointed at the node file. The *section* did not exist. Check 4 validates link targets, not prose claims about what is inside them, so nothing caught it — and the reading it invoked was in the closed world all along, as the note on `def:generation`, which is where the three citations now point.\n\nThen [`blueprint/concepts/`](../concepts/index.html) ([ADR 0035](decisions/0035-the-concepts-tree.html)): nine pages explaining the machine in plain terms — node, closed world, appendix, DAG, confidence, role, gate, operator, history — each with a worked example from this repository and its ancestors in the literature. The user's report was that \"closed world\" was unexplained anywhere, which was true; the phrase is borrowed from Reiter and does not mean what Reiter means by it, and nothing said so. And this journal was compacted ([ADR 0034](decisions/0034-the-journal-is-compacted-into-phases.html)).\n\n## Phase 12 · 2026-08-05 — the blueprint goes public\n\nThe site is now readable at <https://cwlin4916.github.io/rrl-blueprint/>, so a collaborator needs a link and not a clone. It is published as *itself*: a second, public repository holding only `blueprint_site/`, with this one staying private. The manuscript has two coauthors and is unpublished, and flipping this repository public would have published `main.tex` along with the reasoning — a decision that is not reversible by making it private again, because indexing is not undone.\n\nThe cost is that the site is now a thing that can go stale in public, which `tools/publish_site.sh` answers: it regenerates, runs `build_dag_site.py --check`, and refuses to mirror a site that does not match the blueprint. Publishing found the site two pages stale at the time, so the guard is not hypothetical.\n\nOne defect the publication surfaced, unfixed: twelve priority rows carry markdown links in their text, and the generator emits that text unrendered, so the front page shows literal `[L2](../../process/nodes/…_node.md)` pointing at paths the site does not serve. It was invisible while the only reader was the person who wrote the rows.\n\n---\n\n## Adding an entry\n\nAppend to the newest phase, or open a new `## Phase n · YYYY-MM-DD — title` when the work changes character. Say what changed, *why*, and what it cost or surprised you; an entry that only restates the commit subject is not worth writing, because `git log` already has it.\n\nPhases are append-only in the same sense entries were: correct a past phase with new text at the end of it, never by rewriting what is there. If something you learn belongs in **What this cost us to learn**, add the bullet — that list is the part of this file most likely to be read.\n";</script>
