 wrong.\n\n- **The decomposition is the strategy.** A wrong cut wastes every proof downstream of it, and no amount of care in the individual proofs recovers it. Reviewing statements before proving anything is the step that cannot be skipped.\n- **The hostile referee pays for itself immediately.** The pipeline's very first output was not a proof but a *defect report against the manuscript*: `def:satake_subcategory` invokes a generation operation without naming its ambient category, so the definition as printed does not determine a subcategory. The prover had silently chosen a reading; the critic caught that the choice was unjustified rather than that it was wrong.\n- **Check the artefact, not the source.** A page shipped whose mathematics did not render, while every file in the repository was individually correct. A gate that validates the source passes exactly when the thing you ship is broken in a way the source cannot see.\n- **A scoring scheme with no negative range cannot represent its own most valuable finding.** `/examples` was documented from the start as having a *falsity referral* as its best outcome — and for two decision records that outcome had no visible effect on anything. Confidence had to become signed before the machine could say \"we found evidence against\" rather than merely \"we found nothing\".\n- **Absence of evidence and evidence against are different states**, and a display that cannot tell them apart will be read as the wrong one. Hence silent channels that cost nothing, rather than channels that default to zero.\n- **Derived state must never be stored.** Every fact lives in exactly one place; `ready`, `blocked` and confidence are computed at build time. Each stored duplicate found in this repository had already gone stale by the time it was found.\n- **An external passage is a lead, never a source.** Every claim from outside gets recomputed against the appendix and the manuscript before a word of it is adopted, and what could *not* be verified is recorded alongside what could. This caught a paraphrase that had quietly transposed a characteristic-zero theorem into equal characteristic.\n- **Separate presentation from refereeing.** While the critic was responsible for both, it kept flagging formatting, and the noise hid the mathematics. Presentation became a content-preserving stage, gated by a mechanical diff rather than by trust.\n- **Concurrency in a shared working tree is the recurring operational hazard.** Sessions have overwritten each other's referee reports, swept each other's staged files into commits, and re-added statements a parallel run had just withdrawn. Every fact stored singly collides. Re-check git state before every commit and stage only your own paths.\n- **Resolve a path before matching on its name.** A rename done by string match on `node.md` also matched `0002-one-file-per-node.md`, breaking eleven links. The render gate caught all eleven, which is the argument for the gate — and for never doing the next one by substring.\n- **A check bounded by what it just did reports success by construction.** Twice in one day, from two sessions: a link migration verified itself against the pattern it had migrated with, passed, and left 142 broken links that no pattern of that shape could ever have seen; and a scoped `--check` read only the notes inside its own claim, reporting a convention that sixteen statements across two questions depend on as a local habit of one subtree. Both were found from outside — by the full gate, which resolves a link by opening the file, and by a grep across the whole appendix rather than across the notes. A readout is honest about everything except its own boundary, so the check worth having is the one run by somebody who did not do the work.\n\n## Adding an entry\n\nWrite one file: `journal/YYYY-MM-DD_NN_slug.md`, where `NN` is the entry's order within that day. Open it with `# YYYY-MM-DD — title`, then the nav line, then the entry. Add one line to the index above and nothing more — the title *is* the summary, so make it say what happened.\n\nSay what changed, *why*, and what it cost or surprised you. An entry that only restates the commit subject is not worth writing, because `git log` already has it.\n\nEntries are append-only: correct a past entry with new text at its end, never by rewriting what is there. If something you learn belongs in **What this cost us to learn**, add the bullet — that list is the part of this file most likely to be read.\n\n## Entries\n\n**2026-08-08**\n\n- [the plan for Q1-L5: the criterion is already proved, and everything left is one appendix gap wide](../../process/journal/2026-08-08_05_the-plan-for-q1-l5-is-one-appendix-gap-wide.md)\n- [the main conjecture is Q1-L5's criterion, every red under it is Q3's, and no corroboration node has ever been proved](../../process/journal/2026-08-08_02_the-main-conjecture-and-what-is-missing-under-it.md)\n- [an outside audit takes two of Q1-L3-L2's four debts off the board, and the score still will not move until the ceiling does](../../process/journal/2026-08-08_01_an-outside-audit-removes-two-of-four-debts.md)\n\n**2026-08-07**\n\n- [the score stops halving, the gates stop serialising, and a flaw says what kind it is](../../process/journal/2026-08-07_04_the-score-stops-halving-and-the-gates-stop-serialising.md)\n- [the score halves at every layer, so the tree cannot go green](../../process/journal/2026-08-07_03_the-score-halves-at-every-layer-so-the-tree-cannot.md)\n- [what the red-clearing sweep cost, and where the time actually went](../../process/journal/2026-08-07_02_what-the-red-clearing-sweep-cost-and-where-the-time.md)\n- [a statement revision between a draft and its referee invalidates the draft](../../process/journal/2026-08-07_01_a-statement-revision-between-a-draft-and-its-referee.md)\n\n**2026-08-06**\n\n- [the abstraction layer is refereed for the first time, and three of four statements are wrong](../../process/journal/2026-08-06_17_the-ab
