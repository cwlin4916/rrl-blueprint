er supplies the question.** A node says what is wrong with it in its generated flaw block ([I39](#4-invariants)) and what would clear it in its `needs:` line ([I41](#4-invariants)); neither says **why it is there**, and that is answered by `/why <id> \"<question>\"` into `blueprint/nodes/<id>/why/w<n>.md` ([ADR 0087](decisions/0087-why-is-its-own-operator.html)). Numbered and append-only like a critique round, three required `##` sections — `Question`, `Short answer`, `Where to read further` — and at most **300 words**, which `tools/check_render.py` **fails** rather than reports: past three hundred an explanation has stopped delegating and started arguing, and an argument belongs in a write-up a referee reads. The question is a **required argument** and is recorded verbatim, because explanation is contrastive and the foil belongs to the asker; the presentation pass may not touch that section. The repository is read before the literature and the local library before the web ([ADR 0017](decisions/0017-operators-read-the-local-library.html)), every claim ends in a pointer, and the third section must link something or the gate fails — an answer with no pointer is a second model that can simply be wrong about the first. A run that needs an **argument** writes nothing and names the operator that is wanted. The note is outside the closed world, carries **no machine-readable line at all** (the gate rejects `VERDICT:`, `EVIDENCE:`, `GOALCHECK:`, `KEY:` and `WHY:` inside one), moves no status, statement, `needs:`, `human:` or channel, and has **no subagent**. The site draws it as a `<details>` panel above the statement; `<id>_prompt.md` does not carry it ([I18](#4-invariants), [ADR 0063](decisions/0063-a-prompt-carries-what-is-needed-to-work.html)).\n\n**I48 — `/create` records a change of presentation, and places by the deepest surviving statement.** Every other operator works inside a fixed presentation $P$ of the problem; research also moves $P_0 \\to P_1 \\to P_2 \\to \\cdots$, and between one and the next a mathematician may change the objects, the morphisms, the ambient category, the equivalence relation, the invariants, or what counts as a solution ([ADR 0088](decisions/0088-create-records-a-change-of-presentation.html)). `/create \"<claim>\"` puts one new claim at **the deepest node whose `## Statement` still holds unchanged** under the new claim's presentation, as that node's child — a statement quantifying over objects the new presentation does not have is a statement that does not survive — and its first history entry names **which of the six moved, from what and to what**, at most two per invocation. If none moved the claim lives inside the current presentation and the run is a [`/decompose`](pipeline/operators/decompose.html) on the parent it just found; a verified widening is [`/generalize`](pipeline/operators/generalize.html); a false statement is [`/update`](pipeline/operators/update.html); nothing surviving at the top is a new question. Three of its four exits therefore write nothing and each names the operator that is wanted. **The id carries no new segment**: a re-presentation is an ordinary `-L<k>` child, and that it is one lives in the history entry rather than in the filename, because a seventh id letter would mean changing the grammar `Q\\d+(?:-[Leacz]\\d+)+` in two tools, several regexes and the tests to buy a name the record already carries. The lead-researcher writes the directory, as for every node; the placement judgement and the six-line record stay with the orchestrator.\n\n*Why it is a command and not a stage:* [ADR 0031](decisions/0031-presentation-is-a-stage-not-a-command.html) deleted `/check` because presentation is wanted immediately after a run wrote prose. This is wanted on a file **nobody just wrote**. The checker cannot do it in any case — it is content-preserving and its instructions forbid exactly this move, *\"never restate the statement of a `blueprint/appendix/` entry; you may reformat it\"* — and reformatting a restatement leaves a restatement.\n\n*Why it exists at all:* [ADR 0060](decisions/0060-a-write-up-has-two-budgets.html) printed two remedies for a long write-up in the gate's own output and built a command for only the first. Measured on 2026-08-08 across all 38 write-ups: mean 1008, median 909, **13 past the 1000-word split signal and 11 of those past 1200**, the longest at 1495 of 1500 — a cluster against the cap with a two-item gap below it, the same shape 0060 diagnosed at 900. The first run, on that longest write-up [Q1-L3-L3-L1](../nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html), found **21 words** of real restatement — two re-derivations of what [presentable categories](../appendix/conv-prl.html) defines, one unpacked definition, one reproduced universal property — and took it 1495 → 1474. The rest of its length is sixteen steps averaging 62 words and a 359-word frozen `## Lemma`; that node wants `/decompose`, and the run said so. **This is the operator working.** Its value is not that any one write-up is mostly restatement, but that remedy 2 compounds, thirteen write-ups are past the signal, and nothing else in the pipeline could perform it: the checker is forbidden it, `/update` is about statements, and `/prove` wrote the draft. Run it **before** `/decompose` even so — splitting a write-up that restates the appendix gives two that do, and 21 words is a measurement you only have after the pass.\n\n## 5. Node lifecycle\n\n`open` → (all dependencies `proved`) → *ready* → `/prove` → `drafted` → render and page gates → critic → `proved` or `failing`.\n\n- **open** — statement exists, no proof attempted.\n- **open with something to assume** — some dependency is not yet `proved`. This is *not* a status and not a bar: it displays as `open`, and every operator runs on it, contributing the unproved dependency's statement as an assumed fact the write-up must disclose ([ADR 0045](decisions/0045-there-is-no-blocked-node.html)).\n- **drafted** — a `proof.md` exists and passes the render gate; verdict pending.\n- **failing** — a gate failed, or the last verdict was `FAIL`.\n- **proved** — inside the one-page budget, and the latest critique ends in `VERDICT: PASS`.\n\n*ready* is not a stored status. It is computed: `open` with every dependency `proved`. Storing it would create a fourth place for status to drift.\n\nThree rounds is the cap. A node that fails three times is a signal about the *statement*, not the prover — the usual cause is a missing appendix entry or a decomposition that skipped a step.\n\n## 6. The generated site\n\n`python3 tools/build_dag_site.py` reads `blueprint/main_dag.md`, every `<id>_node.md`, the appendix, `refs.bib`, the critiques and the reading notes. It refreshes every derived `node_prompt.md` and writes the whole of `blueprint_site/`. It is run by every workflow, and no generated prompt or page is ever edited by hand.\n\n```\nblueprint_site/index.html                        the hub\nblueprint_site/dag.html                          the interactive graph\nblueprint_site/appendix/<anchor>.html            one object, stated in full\nblueprint_site/nodes/<path>/index.html           one node, blueprint/nodes/<path>/<id>_node.md\nblueprint_site/nodes/<path>/prompt.html          the generated self-contained node prompt\nblueprint_site/nodes/<path>/proof.html           the write-up, rendered\nblueprint_site/nodes/<path>/critiques/<x>.html   a referee report on that node\nblueprint_site/nodes/<path>/prompts/<x>.html     an open prompt\nblueprint_site/assets/site.{css,js}              one theme, one renderer, shared by every page\n```\n\n`<path>` is the node's directory chain, exactly as under `blueprint/nodes/` — the site\nmirrors the source tree, so a sub-lemma's pages sit inside its parent's ([ADR 0016](decisions/0016-the-site-mirrors-the-source-tree.html)).\n\n**One renderer, one theme.** `assets/site.js` holds the only markdown-plus-KaTeX renderer in the repo, and the graph panel calls the same function the object pages do. A statement that renders one way in the DAG and another way on its own page is a statement the reader has to reconcile; there is nothing to reconcile if there is one implementation.\n\n**The macro harvest is no longer consumed, and is kept anyway.** A node's write-up used to be a `.tex` in `preamble.tex` notation — `\\cD`, `\\Sat`, `\\anbr` — meaningless to KaTeX, so the generator harvested those definitions into KaTeX's `macros` option and handed them to the write-up pages *only*: markdown must be macro-free ([I7](#4-invariants)), and supplying the macros site-wide would have hidden exactly the leakage the gate exists to catch. Harvesting is not a matter of scanning for `\\newcommand` — most of the notation is generated by `\\docsvlist` loops (`\\c#1 -> \\mathcal{#1}` over the alphabet, a `\\text{#1}` list several hundred long), so the loops are expanded, in document order so that a later `\\renewcommand` wins. Now that a write-up is `proof.md` and renders like every other page, **no page passes `macros:`**, and `BP.MACROS` ships unused. Recorded here rather than deleted quietly: it is the first thing to remove on the next pass through the generator, and the reason it is safe to remove is that I7 now has no exception.\n\n### The graph\n\n**Layout is the decomposition order.** The question sits on top; the lemmas that answer it directly are beneath it; their dependencies below those; ready leaves at the bottom. Positions are never stored — they are derived from the edges on every build, so the picture cannot disagree with the DAG. Expanding a lemma into sub-lemmas (§8) grows it downward, the direction a reader's attention already runs. The opening view fits the whole graph, because a diagram whose bottom row is off-screen reads as a diagram with fewer nodes than it has.\n\n**An arrow points from a prerequisite up to the result it proves.** This is the convention in Tao's [paper-diagram viewer](https://teorth.github.io/tao-web/apps/paper-diagram.html?paper=kakeya), whose format spec states it plainly — `from` is a prerequisite used in the proof of `to` — and it is worth matching rather than inventing: the arrow then reads as implication, which is what a mathematician expects. The first version of this page pointed the other way, from a node down to what it rests on, and it read as \"depends on\" to a programmer and backwards to everyone else.\n\n**Filtering re-links transitively.** Unchecking a status hides those nodes and reconnects the graph through them, so hiding everything `proved` still shows what the remaining work rests on. Hiding a node must never silently disconnect the DAG — that would make the picture claim an independence that does not hold.\n\n**Nodes are HTML, edges are SVG.** The two share one pan-and-zoom transform. Drawing a node as SVG text meant hand-placing every line and gave no way to show a formula; as an HTML card in a transformed layer, the expansion is a CSS transition and the core formula is real KaTeX. Clicking a node expands it in place to show its type, creation date and central formula, and fills the side panel with that node and nothing else; clicking it again, pressing Esc, or clicking the background collapses it. Hover previews the same highlight only while nothing is open. An early version highlighted on hover alone, which reset the moment the pointer moved to read the panel, so nothing could actually be read.\n\n**A node is addressable, and so is a question.** `dag.html#Q1-L5` opens that node and `dag.html#__q2` opens Q2's card; opening either updates the address, so a message or a write-up can point at one lemma, or at one question, rather than at \"the graph\".\n\n**One graph, opened anywhere ([ADR 0024](decisions/0024-one-graph-with-side-branched-corroboration.html)).** `assets/dag.js` holds one engine and one graph: every DAG page — the root `blueprint_site/dag.html` and the focused page beside each node at `blueprint_site/nodes/<path>/dag.html` — mounts the same full-depth graph, the focused page auto-opening its node, and each node's index page embeds its focused page in an iframe. The spine is what the canvas lays out, and what hangs beside it behind ▸ / ◂ chips — examples and consequences right, analogies left, collapsed by default — is decided by the **edge and not the role** ([ADR 0051](decisions/0051-a-decomposition-folds-whatever-its-members-are-rolled.html), amending [0026](decisions/0026-sub-lemma-families-fold-into-their-parent.html)): a child branches iff it is an example, analogy or consequence *and* its parent does not list it in `depends-on`. A chip names the roles its group holds, since one side now carries two kinds. Everything else is a member of its parent's decomposition and folds like one, so an example's own sub-lemmas fold into the example however they are rolled — they are examples too, and keying the fold on the role drew all twenty of them in Q2's own layer. A branch is drawn only where its host is, and a page that opens a branch's subtree draws that branch as a card, because a chip is not something a family can hang from. An opened branch draws its dashed containment edge and its nodes' own dependency edges into the spine — a sub-DAG, not a list — and the neighbouring columns give way while it is open. What keeps the full-depth picture readable is exactly that fold: the corroboration is out of the argument's way until asked for.\n\n**One card per question, side by side ([ADR 0039](decisions/0039-one-graph-for-every-question.html)).** Each question is a block — its spine around its own local origin, its branches beside their hosts, its scope card on top — and the blocks tile left to right with a clear lane between them. A node rises to *its own* question's card, never to the first one's. A question section that carries a `**Feeds.**` paragraph naming another question gets one thick accent arrow, card to card: the relation is between the questions, so no node gains a dependency, no tally moves and each question stays separately auditable. The root graph draws every question; a node's own page draws that node's question alone, because an embed 300px tall is one argument's worth of room, and its ⌂, its breadcrumb and its caption all lead back to the root. The pills in the bar jump to a question's card on the page you are on, or link to the root graph when that question is not drawn there.\n\n**The panel is three sections ([ADR 0042](decisions/0042-confidence-shows-its-working.html)).** Clicking a node fills the panel with `Statement`, `Confidence` and `Pages` — what it claims, how well supported it is and why, and where to read further. Sub-lemmas, dependencies, required-by and the appendix objects were headings of their own; they are all somewhere to go, so they are rows of `Pages`. This is [ADR 0037](decisions/0037-the-node-panel-carries-the-statement.html)'s rule carried through: the claim first, links for the rest.\n\n**The panel is the reader's.** A grip on its left edge drags the side panel between 300px and 72% of the viewport; the width persists and a double-click restores the default. A question's framing is the longest prose on the site, and one fixed width cannot serve both it and the canvas.\n\n**A generated tree removes what it no longer generates.** Anything under `blueprint_site/` that a build did not write is deleted, and the empty directories with it; `--check` reports one as an inconsistency. Renaming a page and leaving the old one tracked is how a readout the blueprint has stopped standing behind stays reachable.\n\nThree constraints shape the rest. The site makes **no external requests** — KaTeX is vendored under `tools/vendor/` — so it opens from `file://`, works offline, and cannot break when a CDN changes. It is **generated, never authored**, so a discrepancy with the blueprint is a generator bug rather than a stale hand-edit. And it is **read-only**: nothing in the pipeline reads it back ([I8](#4-invariants)), so it can be deleted at any time.\n\n### Verification\n\n```\npython3 tools/check_render.py             # everything renders; --fast skips the LaTeX\npython3 tools/build_dag_site.py --check   # the blueprint half alone\n```\n\n`check_render.py` is the render gate, run by every command. Nine layers: every markdown math fragment through KaTeX; no `.tex`-only macro in a `.md`; balanced `$$`; every relative markdown link and `#anchor` resolving; every write-up inside the one-page word budget with no `.tex` left in a node directory; the blueprint self-consistent with every self-contained prompt current and every graph running; every generated page rendering its math with every link between pages resolving; every generation bracket naming its ambient category; and every node file the statement alone at every heading depth, its declared conditions one per paragraph ([I23](#4-invariants)). Findings under `blueprint/nodes/*/critiques/` print as notes rather than failures, because a critique is an append-only record and is never rewritten to match a convention adopted after it.\n\n`tools/dag_smoke.js` executes **every** generated graph page against a stub DOM with the real KaTeX, one fresh DOM each: it opens every node, closes it again, collapses and reopens the panel, exercises every ▸ / ◂ branch chip — collapsed branches must draw nothing, an opened one its containment edge and its nodes' own dependency edges, the exact edge count asserted collapsed, opened and re-collapsed — and asserts the graph was drawn, the breadcrumbs rendered, the panel filled with that node and no other. Running only the root page would leave every focused page exactly as untested as it is breakable — the first per-node page ever generated failed this, on node titles containing mathematics. It exists because `node --check` validates syntax and cannot see that an identifier is never defined — a page whose script dies on its first statement passes a syntax check cleanly.\n\n`tools/site_smoke.js` does the same for the rest of the site: every `.math` span and every embedded markdown source, through the real renderer with `throwOnError` on. A macro that only exists in a `.tex` preamble fails here rather than in front of a reader.\n\n`build_dag_site.py --check` writes nothing, exits non-zero on a problem, and answers three questions.\n\n*Is the blueprint consistent with itself?* Status drift between a node file and its index bullet; a dependency naming a node with no directory; a `required-by` that is not the exact transpose of `depends-on`; a sub-lemma whose parent does not exist; an `objects:` link pointing at an appendix anchor that does not exist; a node marked `proved` whose latest critique did not close `VERDICT: PASS`, and one whose latest critique closed `REFUTED` without the status being `failing`; a node marked `proved` with no write-up; a node holding both `examples.md` and `prompts/examples.md`; a `created:` field that is not an ISO date.\n\n*Are the portable prompts current?* Every node has exactly one `node_prompt.md`, and its bytes equal the prompt derived in memory from the canonical statement, question framing, direct prerequisites, appendix and bibliography.\n\n*Are the pages current, and only the pages?* It regenerates every page in memory and compares. `STALE` means someone edited a node without rebuilding; an orphan means a page the generator no longer writes is still on disk, still tracked and still reachable, which a normal build now removes.\n\nThis is what makes [I5](#4-invariants) real. Canonical state is stored once; every repeated index line, portable prompt and HTML page is generated and byte-checked. Redundancy that is not derived and checked is a lie waiting to happen, so every workflow runs this gate.\n\n## 7. What the pipeline does not do\n\nStating this plainly, because the failure mode of such systems is quiet scope creep:\n\n- It does not decide whether a question is worth asking. `/decompose` takes the question as given.\n- It does not verify against a proof assistant. `VERDICT: PASS` means one hostile reader with the appendix in hand found no gap — a referee report, not a machine-checked proof.\n- It does not touch `main.tex`. Nothing the pipeline produces enters the manuscript without a human moving it there.\n- It does not judge novelty. `/examples` searches the literature for examples *of* a statement; it does not check whether the statement is already known.\n\n## 8. Extending it\n\n**A new question.** `/decompose \"<question>\"` — the lead-researcher adds a `<a id=\"q<n>\"></a>` anchor, heading, **Setting.**, **Conjecture.**, tally, and node bullets to `blueprint/main_dag.md`, plus one directory per node. Review the statements before proving anything: they encode the strategy, and a wrong decomposition wastes every downstream prove.\n\n**A lemma that is too big.** `/decompose <node-id>` expands one lemma into sub-lemmas `<id>-L1`, `<id>-L2`, …, written as directories **inside the parent's own** ([I12](#4-invariants)) and becoming its dependencies; the parent's status is untouched and its file gains nothing but the new `depends-on` edges ([ADR 0074](decisions/0074-the-decomposition-paragraph-is-removed.html)). Every new node then goes to an example-finder, and leaves the run carrying either an `examples.md` or an honest prompt ([ADR 0048](decisions/0048-a-decomposition-is-grounded-node-by-node.html)). The parent's `## Statement` is frozen throughout — expansion changes how a lemma will be proved, never what it claims, which is what keeps I2 intact while the DAG grows.\n\nThis is the escape hatch for I9. When a write-up will not fit on a page, the honest response is that the node was really several nodes, and the id scheme records that: `Q1-L5-L2` says exactly where it sits, and now so does the tree. Ids are never renumbered and no existing directory moves — an expansion only adds directories beneath the lemma it refines — so a link written today still resolves after the tree grows beneath it.\n\n**A new object.** Add an entry to [`blueprint/appendix/`](../appendix/index.html) following the schema at the top of that file: anchor, kind, attribution with `main.tex` line, full statement, `role`, `hypotheses` for black boxes. Who cites the entry is not written on it — that is the transpose of the nodes' `objects:` fields, derived at build time into the entry page's `used by` panel ([ADR 0080](decisions/0080-who-cites-an-entry-is-derived.html)), so an entry is written once and no decomposition owes it a follow-up pass. Grep the label in `main.tex` and the bib key in `refs.bib` first — both must exist. Until the entry exists, no node may use the object (I1).\n\n**A new agent.** Define it canonically in `.claude/agents/<name>.md` with the narrowest tool grant that lets it do its job, and give it a slash command in `.claude/skills/<name>/SKILL.md`. Add the matching thin Codex adapters under `.codex/agents/<name>.toml` and `.agents/skills/<name>/SKILL.md`. Write down in this file what it may write and what it may never touch, then add the same line to `CLAUDE.md`'s write-discipline paragraph and extend the one-to-one mapping tests. An agent whose powers are not written down on both host surfaces will drift.\n\n## 9. Failure modes observed so far\n\nHonest log; `n` is small and these are correlations, not laws.\n\n- **Ambiguity in the source surfaces as a critic FAIL, not as a prover error.** Q1-L1 round 1 failed because `def:satake_subcategory` names no ambient category for its generation operation. The prover had picked a reading silently; the critic caught that the reading was unjustified. This is the pipeline working, and it is the strongest evidence so far that the hostile-referee step earns its cost. Resolution: [ADR 0001](decisions/0001-satake-generation-ambient-category.html).\n- **A ratified reading must be recorded where the object lives, not only where it was decided.** The Q1-L1 remark held the $\\mathcal{D}^{\\mathrm{ren}}$ ratification, so a later node reading only `def:satake_subcategory` would not have seen it. Fixed by giving the appendix entry the ratification and a back-link. See [ADR 0003](decisions/0003-appendix-of-objects.html).\n- **Without a length limit, drafts fill with quotation.** Q1-L1's refereed draft was ten pages, most of it restating framework results. Fixed by I9 once the appendix made citation possible. See [ADR 0005](decisions/0005-node-directories.html).\n- **Bare labels rot silently.** See I6.\n- **A syntax check is not a render check.** A patch to the generator deleted the block that creates the question card while leaving the line that referenced it. The page threw `ReferenceError` on its first statement and rendered nothing at all; `node --check` passed, because the syntax was perfect. Fixed by `tools/dag_smoke.js`, which runs the page. The general lesson is that a check which cannot fail on the bug you actually shipped is not a check — after writing it, reintroduce the bug and confirm it fails.\n- **A rule with no gate is a suggestion.** `.claude/agents/critic.md` has said \"write all mathematics in standard KaTeX, house macros are `.tex`-only\" since it was written. The critic wrote `\\cD`, `\\bs` and `\\anbr` into its report anyway, and nothing noticed, because nothing was checking. The instruction was already correct; what was missing was `check_render.py` running on every step that writes markdown.\n- **A linter over a repo that documents its own conventions flags the documentation.** `check_render.py` opened with 32 findings, most of them `CLAUDE.md` and the agent prompts — files whose whole purpose is to say \"never write `\\cD` in a `.md`\". Prose *about* notation quotes that notation, so the checker strips inline code spans and fenced blocks before looking. The same bug recurred a level up: a check for unrendered `$$` fired on `blueprint_site/pipeline.md`, which states the `$$ … $$` rule. Any gate over this repo has to distinguish quoted from live before it can distinguish right from wrong.\n- **Two files can be one file.** `README.md` and `blueprint_site/README.md` both mapped to `blueprint_site/notes/readme.html`; on a case-insensitive filesystem the second silently overwrote the first, and the only symptom was a page that reported itself perpetually stale. Caught by `--check` comparing every generated page rather than just the one it used to write.\n- **A link is only as good as its target.** Moving from one page to eighty turned three latent problems into build failures at once: appendix section anchors (`#s2`…`#s9`) that no generated page defined, object labels that are themselves mathematics (`$\\mathrm{IC}_0$`) rendered as raw TeX inside a code span, and a deep link cleared by the initialisation that ran before it was read. None of these were visible while everything lived in one file.\n- **A citation that resolves can still be wrong.** A decision's number is written twice, as the label a reader sees and in the file the link opens, and a bulk renumber rewrote the first in fourteen places and not the second — so fourteen lines read `[ADR 0086](.../0084-a-question-is-a-node.md)` and every gate passed, because the link still worked. `check_render.py` §4 compares the two now. The general form is [I6](#4-invariants)'s: wherever a fact is written twice, the check is that the two copies agree, and \"it resolves\" is not that check.\n- **Presentation drift is a separate concern from correctness, and needs a separate agent.** The critic kept flagging formatting; formatting is not its job and the noise hid the mathematics. See [ADR 0004](decisions/0004-checker-separate-from-critic.html).\n";</script>
