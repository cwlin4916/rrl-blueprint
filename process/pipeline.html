<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">process</a><i>›</i><span>pipeline</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>The auto-research pipeline — design</h1><p class="lead">Generated from <code>process/pipeline.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[process index](index.html) · [operations](operations.html) · [journal](journal.html) · [decisions](../../process/decisions) · [repo README](../readme.html)\n\n`README.md` says how to *run* the pipeline. This file says how it is *built* and why; [`operations.md`](operations.html) states each command as a typed map and each invariant below as a law those maps satisfy. Every rule below exists because something went wrong without it, or because a specific failure was anticipated; where the evidence is thin, the entry says so.\n\n## 1. What the pipeline is\n\nA research question is decomposed into a DAG of lemma statements; each node is proved by one agent, checked, and refereed by a second agent that cannot see the first agent's reasoning; the outcome is written back into the DAG and committed. The repo *is* the state — there is no database, no server, and no memory between sessions beyond the files.\n\nThe design target is not autonomy. It is **auditability**: at any moment you can point at a node and say exactly what it claims, what it is allowed to assume, which proof text supports it, which referee reports it survived, and when each of those changed. A pipeline that proves things you cannot check is worse than no pipeline.\n\n## 2. The shape of the loop\n\n```\nquestion ──/decompose──> lemma statements (one directory per node)\n                              │\n                              ▼\n                         /prove <node>\n                              │\n              ┌───────────────┼───────────────┐\n              ▼               ▼               ▼\n           prover ──> render + page gate ──> critic ──> VERDICT\n              ▲                                            │\n              └──────────── FAIL, ≤3 rounds ───────────────┘\n                                                           │ PASS\n                                               status write-back + commit\n```\n\nThe orchestrator is the main host thread — Claude Code or Codex. It is deliberately not a specialist agent: it holds the loop, runs the gates itself, and performs every mutation of DAG state. Subagents produce artefacts; only the orchestrator changes the record of what is true.\n\n## 3. Actors and their powers\n\n- **lead-researcher** (`/decompose`) writes lemma *statements* into `blueprint/nodes/<id>/<id>_node.md`, the per-question **Setting** and **Conjecture** paragraphs in `blueprint/main_dag.md`, and any new entries in `blueprint/appendix.md`. It never writes a proof, and it never writes an index bullet — those are generated.\n- **prover** (`/prove`) writes exactly one file in the reasoning tree: `blueprint/nodes/<id>/proof.md`, a standalone one-page write-up of one node. It cannot touch the DAG. It may append a source to the reading list in `papers/guideline.md`.\n- **critic** (`/prove`) writes exactly one file: `blueprint/nodes/<id>/critiques/r<n>.md`, ending in `VERDICT: PASS` or `VERDICT: FAIL`. It has no edit and no shell tools at all — it can read, and write its own report, nothing else.\n- **checker** (the presentation pass ending `/decompose`, `/prove`, `/examples` and `/update` — [ADR 0031](decisions/0031-presentation-is-a-stage-not-a-command.html)) reformats the canonical markdown its calling run just wrote. It never edits a generated `<id>_prompt.md`. It may rewrap a statement; it may never restate one, and never touches a status field, a `VERDICT:` line, or any manuscript `.tex`. Presentation only — finding examples used to be its second job and is now its own agent.\n- **example-finder** (`/examples`) researches the literature for explicit instances of one node's statement, simplest first, each with the argument that it *is* an instance. It writes `blueprint/nodes/<id>/examples.md` or, when it honestly found none, `blueprint/nodes/<id>/prompts/examples.md`, and appends what it read to `papers/guideline.md`. It changes nothing the DAG depends on.\n- **orchestrator** (the main thread) runs the render and page gates, shuttles critiques back to the prover, writes every status, regenerates all node prompts and the site, and commits.\n\nThe `.claude/agents/*.md` grants are canonical. Claude Code enforces them as its physical tool surface; `.codex/agents/*.toml` translates them into Codex behavioral allowlists and the same narrow write boundaries, with `AGENTS.md` defining the host vocabulary. The test suite checks both mappings. The critic having no write access outside its own report is the single most load-bearing configuration choice in the repo: a referee that can edit the proof stops being a referee.\n\n## 4. Invariants\n\nThese are the properties that must hold after every step. If one is violated the pipeline's output is not trustworthy, regardless of how good the mathematics looks.\n\n**I1 — Closed world.** A proof may invoke exactly: entries of [`blueprint/appendix.md`](../appendix/index.html), the node's own `depends-on` list, and standard mathematics needing no citation. Nothing else. A result that is true, published, and in `main.tex` but *not* in the appendix is not available; the critic marks its use circular.\n\n*Why:* without a closed world \"assume the theorem\" is indistinguishable from \"cite the theorem\", and the DAG stops encoding a proof order. The cost is real — distilling a result into the appendix is manual work — and that cost is the point: it forces a human decision about what is being assumed.\n\n**I2 — Statements are fixed before proofs are attempted.** `/decompose` produces statements only. The prover reproduces the statement verbatim and may not weaken or strengthen it.\n\n*Why:* an agent that can edit the goal will prove something adjacent and report success. Freezing the statement makes the gates and the critic meaningful.\n\n**I3 — The render gate is run by the orchestrator.** The prover's `proof.md` must pass `tools/check_render.py` before the critic is invoked, and the orchestrator runs it itself rather than trusting a report of it. This matters more now than when the write-up was LaTeX: markdown does not fail to build, so what would once have been a compile error is a fragment that silently renders as literal text.\n\n*Why:* self-reported build success is the cheapest thing for an agent to get wrong. It is also a free syntactic check on notation: an undefined macro means the proof left the house vocabulary.\n\n**I4 — Critiques are append-only.** Round 2 is a new file `r2.md` beside `r1.md` in `blueprint/nodes/<id>/critiques/`. No critique is ever rewritten, and the numbering never restarts: a node that is re-opened and re-proved continues at the next round.\n\n*Why:* the sequence of verdicts is the audit trail for how a node reached `proved`. A node that passed on round 3 after two failures is a different epistemic object from one that passed immediately, and the repo should show which.\n\n**I5 — Every fact is stored once.** A node's status lives in `blueprint/nodes/<id>/<id>_node.md` and nowhere else. The index bullets and tally in `blueprint/main_dag.md` are generated from the node files, between `BEGIN INDEX` and `END INDEX` markers, by `tools/build_dag_site.py`. The self-contained `node_prompt.md` files of I18 repeat canonical material only as deterministic readouts; nothing reads them as authority.\n\n*Why:* this invariant used to read \"status is written twice and checked\", on the theory that checked redundancy is documentation. It is not — it is a second thing to keep right, and the check that policed it was overhead for a duplication we chose to create. Deriving the index makes drift impossible rather than merely detectable, and `ready` and `blocked` stop being stored at all: they are functions of the dependency statuses, computed where they are displayed.\n\n**I6 — Objects are linked, never named.** Blueprint markdown never contains a bare label like `` `thm:chen_Ti` ``. Every mention is a link into the appendix entry that states the object in full.\n\n*Why:* a bare label is unreadable to a human skimming the DAG and unresolvable to an agent that has not been handed `main.tex`. It also silently tolerates typos — `def:orbits_iwahori_sphe rical` sat in the index for a week and referred to nothing. A link either resolves or is caught by the link checker.\n\n**I7 — Markdown math is standard KaTeX/MathJax.** House macros (`\\cD`, `\\Sat`, …) exist only in `.tex` files. Every `.md` file must render on GitHub with no preview shim.\n\n*Why:* the blueprint's readers are a human in a browser and an agent reading raw text. Neither expands `preamble.tex`.\n\n**I8 — Nothing is ever read from a generated artifact.** `build/` and all of `blueprint_site/` are regenerable and are never inputs. Neither is tracked in git: an artifact one command reproduces byte-for-byte is not a thing to store versions of ([ADR 0010](decisions/0010-site-untracked-and-renamed.html)). `rm -rf blueprint_site && python3 tools/build_dag_site.py` reproduces the site exactly, vendored KaTeX included — which is why KaTeX is checked in under `tools/vendor/` and copied in, rather than living in `blueprint_site/` as the one hand-placed file in a generated tree. A workflow needing a fact from a build artifact is misdesigned; the fact belongs in the appendix.\n\n**I9 — One node, one directory, one page.** Everything about a node lives in `blueprint/nodes/<id>/`, and `proof.md` fits on one page — **at most 900 words**, since a markdown file has no page count. The template is the authority on the number and the gate reads it from there.\n\n*Why:* the limit is what forces citation instead of restatement. Before the appendix existed, every draft opened with a \"Setting\" and an \"Ingredients\" section restating the framework — Q1-L1 round 2 ran to ten pages, of which roughly seven were quotation. A second copy of a statement is a copy that can drift from the first. The page count is also a useful alarm: a node that will not fit is usually several nodes, which is a decomposition defect, not a writing problem.\n\n**I10 — Examples illustrate, never justify.** `blueprint/nodes/<id>/examples.md` is outside the closed world of I1. No proof, node, or appendix entry may cite it. Every example carries a source with a resolvable identifier and a numbered result; an unsourced example must be labelled as constructed.\n\n*Why:* an example is evidence a statement is non-vacuous and understood, which is worth having, but it is not evidence the statement is true. Keeping examples formally inert means a wrong example cannot corrupt a proof — the worst case is a misleading illustration, not an unsound DAG. The rule against inventing one matters more than the rule about finding one: a fabricated citation is the single failure that would poison the record, because it is exactly the kind of thing a reader will believe without checking.\n\n**I11 — Every cited thing has a page.** The `blueprint_site/` site carries one page per object a link can point at: an appendix entry, a node, a write-up, an examples file, an open prompt, a critique, a reference note. It also carries the non-citable self-contained prompt page required by I18. `tools/check_render.py` resolves every link between generated pages and fails on a dangling one.\n\n*Why:* [I6](#4-invariants) says an object is linked and never named, which only pays off if the link lands somewhere readable. A link into `blueprint/appendix.md#def-generation` is a link to a 3,000-line markdown file — GitHub will render it, nothing else will, and the write-up citing it renders nowhere at all. One page per object turns the guardrail into navigation, and makes a broken reference a build failure instead of a bad afternoon.\n\n**I12 — A node's id is its path.** A sub-lemma's directory is written inside its parent's, so a node's location is its id split at each `-L` and rejoined with `/`: `Q1-L2-L1` can only live at `blueprint/nodes/Q1-L2/Q1-L2-L1/`. Every directory carries the full id of the node it holds. `tools/build_dag_site.py --check` fails on a node that sits anywhere else. An example/analogy child — a terminal `-e<k>`/`-a<k>` segment — nests the same way — `Q1-L5-e1` one level inside `Q1-L5`'s own directory — but its edge is containment only: the parent never depends on it ([ADR 0021](decisions/0021-example-and-analogy-nodes-nest.html)).\n\n*Why:* the id already named the whole ancestor chain, so a flat directory beside its own parent stored that chain twice — once in the name, once nowhere — and the two could not be checked against each other. Making the path derivable means `ls` shows the decomposition, `rm -rf` on a node takes its sub-lemmas with it, and a misplaced directory is a gate failure rather than something a reader has to notice. It costs nothing in link stability, which is what the flat layout was protecting: a decomposition only ever *creates* directories beneath an existing node, so no node ever moves and no link written earlier goes stale. What it does cost is that a node's depth is now variable, so a relative link out of a node file must be worked out from that node's own depth rather than copied from a neighbour — `../` repeated `d+1` times reaches `blueprint/`, where `d` counts the `-L`s.\n\n**I13 — Confidence is derived from the record, and is shown as a tint.** A node's own support is a Baconian ratio over defeaters — how many of the flaws its referees raised have been disposed of, against how many still stand in the latest report — and its confidence is that support capped by the weakest node it rests on. It is computed by `tools/build_dag_site.py` at build time, exactly as `ready` and `blocked` are, and there is no `confidence:` field anywhere. A question's confidence is the weakest node beneath it; the repository's is the weakest node in it. Every card carries it as its status colour at $10b$ percent, $b \\in \\{0,\\dots,5\\}$ — hue says which status, fill says how much support ([ADR 0013](decisions/0013-confidence-is-derived-baconian-and-weakest-link.html)).\n\n*Why:* `proved` answers *what stage is this at*, not *how much should I believe it*, and the two come apart. [Q1-L1](../nodes/Q1-L1/index.html) reached `proved` on its fifth report, after two `FAIL`s, twenty-two flaws disposed of and eight still standing; a node that passed cleanly on `r1` carries the same word. So does a `proved` node resting on an `open` one, whose support does not exist yet. Deriving the number rather than storing it is [I5](#4-invariants) again — a stored confidence goes stale the moment a new critique lands and nothing could check it. Displaying it as a band rather than a decimal is the other half: Baconian confidence is a ranking, not a measurement, and a number carried past the precision of its derivation suppresses the judgment it was meant to inform. Confidence stays outside the closed world on the same footing as `examples.md` under [I10](#4-invariants) — it is derived *from* the audit trail, so it can never be evidence *in* it, and no gate passes or fails on it.\n\n**I14 — Every node declares its epistemic role.** `<id>_node.md` carries `role: proof | evidence | example | analogy | thought`, set by the lead-researcher at creation and changed only by the user. A `proof` node is a step of its question's argument and may depend only on proof nodes; `evidence`, `example` and `analogy` nodes corroborate the argument ([ADR 0018](decisions/0018-example-and-analogy-nodes.html)); a `thought` is exploration `/prove` refuses. The tallies of I5's generated index and the aggregates of I13 range over proof nodes alone — I13's \"weakest node beneath it\" narrows to the weakest node of the proof chain ([ADR 0015](decisions/0015-every-node-declares-its-role.html)).\n\n*Why:* Q1-L7 — the group case, a check nothing depends on — read exactly like an unproved chain lemma: \"Proved 2/11\" counted it as an obligation, and the weakest-link minimum let it pin Q1 at 0% however much of the actual argument was proved. A corroboration's absence leaves the argument exactly as strong, so an aggregate that claims to measure the argument must not range over it. The role is stored rather than inferred from `required-by: —` because a leaf is a position, not a purpose: every chain lemma is born a leaf mid-decomposition, and the terminal node of a finished argument is a leaf forever.\n\n**I15 — A statement is superseded, never silently edited.** The `## Statement` of a node and the framing paragraphs of a question change through `/update` alone ([ADR 0019](decisions/0019-the-update-operator.html)): the revision is recorded in the node's append-only `updates/u<n>.md` — old statement, new statement, what forced it, what was rejected — the commit message discloses it, a node that was `drafted` or `proved` drops to `open`, and externally supplied input is verified (mathematics recomputed, citations resolved, claims about the repo checked against the repo) before any of it is adopted. Every question carries a **Problem statement.** paragraph saying what would count as an answer — a condition that is necessary, sufficient, or necessary and sufficient, said explicitly. Its **Conjecture.** paragraph is versioned and self-contained ([ADR 0025](decisions/0025-the-conjecture-is-versioned-and-self-contained.html)): it opens with a version label *(v\\<k\\> — date.)*, writes the criteria it asserts and the bracket around them out in full with every reference hyperlinked — the node's own `## Statement` staying canonical — and closes with a *Versions.* history, one dated entry per revision; `/update` bumps the version whenever it revises the paragraph, the question-level counterpart of `updates/u<n>.md`.\n\n*Why:* I2 froze statements so a proof could not drift toward its goal, but a statement that is *wrong* then had nowhere to go — `operations.md` §8 carried \"supersede a node\" as an unfilled hom-set. The controlled form keeps what I2 was for: the referee still reviews a fixed claim, because revision resets the record instead of editing under it, and the seam — `updates/`, the status drop, the disclosed commit — is the same seam I4's critique numbering leaves after a re-proof.\n\n**I16 — Priorities are judged or derived, and the two never mix.** `blueprint/priorities.md` stores ranked judgements — `llm` rows written by `/update`, `human` rows by the user alone — and the site's priority panel appends warnings derived from the record (failing nodes, negative confidence, published counterexamples and gaps, statements revised and not re-proved, the ready frontier), recomputed at every build and stored nowhere ([ADR 0020](decisions/0020-the-priority-panel.html)). Nothing may cite either half.\n\n*Why:* the repo stores no fact from which \"most important\" follows, so a ranking must be stored, signed and dated by whoever judged it; a warning the state already implies must *not* be stored, or it drifts (I5). The visible split is what makes the panel trustworthy — a judged row has an author, a derived row has a derivation.\n\n**I17 — Every command leaves the site regenerated.** Whatever else an operation did, its closing step runs `python3 tools/build_dag_site.py` and then the render gate — `/research-status` included. The consistency gate treats a generated page older than the state as a failure, so a stale site is an unfinished command, not a cosmetic lag.\n\n*Why:* the site is the tree's one human-facing surface, and everything derived lives there — the index tallies, the effective statuses, the confidence tints, every node's local DAG, the priority panel's warning layer. A surface that can lag invites reading a repository that no longer exists. Regeneration is idempotent and reads nothing back (L7), so the invariant costs one command per run and removes the whole class of stale-read mistakes; L16 is its typed form.\n\n**I18 — Every node has a current self-contained prompt.** Beside every `<id>_node.md` is a generated `node_prompt.md` containing a role-sensitive task, the question setting and problem, the node's purpose and provenance, its canonical statement, direct prerequisites with their statuses, the full declared appendix inputs and the transitive appendix vocabulary they invoke, repository references and matching `refs.bib` records ([ADR 0029](decisions/0029-every-node-has-a-generated-self-contained-prompt.html)). The file is outside the closed world: no proof, node or appendix entry cites it, and no agent edits it. `tools/build_dag_site.py` derives it from canonical sources on a normal build; `--check` fails on a missing, stale or stray copy.\n\n*Why:* `<id>_node.md` is the normalized form and should stay concise, but a problem handed outside the repository must carry its vocabulary and purpose with it. Manual self-contained restatements would turn every statement revision into dozens of unchecked copies. A generated packet gives portability without creating another authority.\n\n## 5. Node lifecycle\n\n`open` → (all dependencies `proved`) → *ready* → `/prove` → `drafted` → render and page gates → critic → `proved` or `failing`.\n\n- **open** — statement exists, no proof attempted.\n- **blocked** — some dependency is not yet `proved`.\n- **drafted** — a `proof.md` exists and passes the render gate; verdict pending.\n- **failing** — a gate failed, or the last verdict was `FAIL`.\n- **proved** — inside the one-page budget, and the latest critique ends in `VERDICT: PASS`.\n\n*ready* is not a stored status. It is computed: `open` with every dependency `proved`. Storing it would create a fourth place for status to drift.\n\nThree rounds is the cap. A node that fails three times is a signal about the *statement*, not the prover — the usual cause is a missing appendix entry or a decomposition that skipped a step.\n\n## 6. The generated site\n\n`python3 tools/build_dag_site.py` reads `blueprint/main_dag.md`, every `<id>_node.md`, the appendix, `refs.bib`, the critiques and the reading notes. It refreshes every derived `node_prompt.md` and writes the whole of `blueprint_site/`. It is run by every workflow, and no generated prompt or page is ever edited by hand.\n\n```\nblueprint_site/index.html                        the hub\nblueprint_site/dag.html                          the interactive graph\nblueprint_site/appendix/<anchor>.html            one object, stated in full\nblueprint_site/nodes/<path>/index.html           one node, blueprint/nodes/<path>/<id>_node.md\nblueprint_site/nodes/<path>/prompt.html          the generated self-contained node prompt\nblueprint_site/nodes/<path>/proof.html           the write-up, rendered\nblueprint_site/nodes/<path>/critiques/<x>.html   a referee report on that node\nblueprint_site/nodes/<path>/prompts/<x>.html     an open prompt\nblueprint_site/assets/site.{css,js}              one theme, one renderer, shared by every page\n```\n\n`<path>` is the node's directory chain, exactly as under `blueprint/nodes/` — the site\nmirrors the source tree, so a sub-lemma's pages sit inside its parent's ([ADR 0016](decisions/0016-the-site-mirrors-the-source-tree.html)).\n\n**One renderer, one theme.** `assets/site.js` holds the only markdown-plus-KaTeX renderer in the repo, and the graph panel calls the same function the object pages do. A statement that renders one way in the DAG and another way on its own page is a statement the reader has to reconcile; there is nothing to reconcile if there is one implementation.\n\n**The macro harvest is no longer consumed, and is kept anyway.** A node's write-up used to be a `.tex` in `preamble.tex` notation — `\\cD`, `\\Sat`, `\\anbr` — meaningless to KaTeX, so the generator harvested those definitions into KaTeX's `macros` option and handed them to the write-up pages *only*: markdown must be macro-free ([I7](#4-invariants)), and supplying the macros site-wide would have hidden exactly the leakage the gate exists to catch. Harvesting is not a matter of scanning for `\\newcommand` — most of the notation is generated by `\\docsvlist` loops (`\\c#1 -> \\mathcal{#1}` over the alphabet, a `\\text{#1}` list several hundred long), so the loops are expanded, in document order so that a later `\\renewcommand` wins. Now that a write-up is `proof.md` and renders like every other page, **no page passes `macros:`**, and `BP.MACROS` ships unused. Recorded here rather than deleted quietly: it is the first thing to remove on the next pass through the generator, and the reason it is safe to remove is that I7 now has no exception.\n\n### The graph\n\n**Layout is the decomposition order.** The question sits on top; the lemmas that answer it directly are beneath it; their dependencies below those; ready leaves at the bottom. Positions are never stored — they are derived from the edges on every build, so the picture cannot disagree with the DAG. Expanding a lemma into sub-lemmas (§8) grows it downward, the direction a reader's attention already runs. The opening view fits the whole graph, because a diagram whose bottom row is off-screen reads as a diagram with fewer nodes than it has.\n\n**An arrow points from a prerequisite up to the result it proves.** This is the convention in Tao's [paper-diagram viewer](https://teorth.github.io/tao-web/apps/paper-diagram.html?paper=kakeya), whose format spec states it plainly — `from` is a prerequisite used in the proof of `to` — and it is worth matching rather than inventing: the arrow then reads as implication, which is what a mathematician expects. The first version of this page pointed the other way, from a node down to what it rests on, and it read as \"depends on\" to a programmer and backwards to everyone else.\n\n**Filtering re-links transitively.** Unchecking a status hides those nodes and reconnects the graph through them, so hiding everything `proved` still shows what the remaining work rests on. Hiding a node must never silently disconnect the DAG — that would make the picture claim an independence that does not hold.\n\n**Nodes are HTML, edges are SVG.** The two share one pan-and-zoom transform. Drawing a node as SVG text meant hand-placing every line and gave no way to show a formula; as an HTML card in a transformed layer, the expansion is a CSS transition and the core formula is real KaTeX. Clicking a node expands it in place to show its type, creation date and central formula, and fills the side panel with that node and nothing else; clicking it again, pressing Esc, or clicking the background collapses it. Hover previews the same highlight only while nothing is open. An early version highlighted on hover alone, which reset the moment the pointer moved to read the panel, so nothing could actually be read.\n\n**A node is addressable.** `dag.html#Q1-L5` opens that node, and opening one updates the address, so a message or a write-up can point at one lemma rather than at \"the graph\".\n\n**One graph, opened anywhere ([ADR 0024](decisions/0024-one-graph-with-side-branched-corroboration.html)).** `assets/dag.js` holds one engine and one graph: every DAG page — the root `blueprint_site/dag.html` and the focused page beside each node at `blueprint_site/nodes/<path>/dag.html` — mounts the same full-depth graph, the focused page auto-opening its node, and each node's index page embeds its focused page in an iframe. The spine — proof, evidence and thought nodes — is what the canvas lays out; example and analogy nodes hang beside the node they illustrate behind ▸ / ◂ chips on the host card, examples right, analogies left, collapsed by default. An opened branch draws its dashed containment edge and its nodes' own dependency edges into the spine — a sub-DAG, not a list — and the neighbouring columns give way while it is open. What keeps the full-depth picture readable is exactly that fold: the corroboration is out of the argument's way until asked for.\n\nThree constraints shape the rest. The site makes **no external requests** — KaTeX is vendored under `tools/vendor/` — so it opens from `file://`, works offline, and cannot break when a CDN changes. It is **generated, never authored**, so a discrepancy with the blueprint is a generator bug rather than a stale hand-edit. And it is **read-only**: nothing in the pipeline reads it back ([I8](#4-invariants)), so it can be deleted at any time.\n\n### Verification\n\n```\npython3 tools/check_render.py             # everything renders; --fast skips the LaTeX\npython3 tools/build_dag_site.py --check   # the blueprint half alone\n```\n\n`check_render.py` is the render gate, run by every command. Eight layers: every markdown math fragment through KaTeX; no `.tex`-only macro in a `.md`; balanced `$$`; every relative markdown link and `#anchor` resolving; every write-up inside the one-page word budget with no `.tex` left in a node directory; the blueprint self-consistent with every self-contained prompt current and every graph running; every generated page rendering its math with every link between pages resolving; and every generation bracket naming its ambient category. Findings under `blueprint/nodes/*/critiques/` print as notes rather than failures, because a critique is an append-only record and is never rewritten to match a convention adopted after it.\n\n`tools/dag_smoke.js` executes **every** generated graph page against a stub DOM with the real KaTeX, one fresh DOM each: it opens every node, closes it again, collapses and reopens the panel, exercises every ▸ / ◂ branch chip — collapsed branches must draw nothing, an opened one its containment edge and its nodes' own dependency edges, the exact edge count asserted collapsed, opened and re-collapsed — and asserts the graph was drawn, the breadcrumbs rendered, the panel filled with that node and no other. Running only the root page would leave every focused page exactly as untested as it is breakable — the first per-node page ever generated failed this, on node titles containing mathematics. It exists because `node --check` validates syntax and cannot see that an identifier is never defined — a page whose script dies on its first statement passes a syntax check cleanly.\n\n`tools/site_smoke.js` does the same for the rest of the site: every `.math` span and every embedded markdown source, through the real renderer with `throwOnError` on. A macro that only exists in a `.tex` preamble fails here rather than in front of a reader.\n\n`build_dag_site.py --check` writes nothing, exits non-zero on a problem, and answers three questions.\n\n*Is the blueprint consistent with itself?* Status drift between a node file and its index bullet; a dependency naming a node with no directory; a `required-by` that is not the exact transpose of `depends-on`; a sub-lemma whose parent does not exist; an `objects:` link pointing at an appendix anchor that does not exist; a node marked `blocked` whose dependencies are all `proved`; a node marked `proved` with no write-up; a node holding both `examples.md` and `prompts/examples.md`; a `created:` field that is not an ISO date.\n\n*Are the portable prompts current?* Every node has exactly one `node_prompt.md`, and its bytes equal the prompt derived in memory from the canonical statement, question framing, direct prerequisites, appendix and bibliography.\n\n*Are the pages current?* It regenerates every page in memory and compares. `STALE` means someone edited a node without rebuilding.\n\nThis is what makes [I5](#4-invariants) real. Canonical state is stored once; every repeated index line, portable prompt and HTML page is generated and byte-checked. Redundancy that is not derived and checked is a lie waiting to happen, so every workflow runs this gate.\n\n## 7. What the pipeline does not do\n\nStating this plainly, because the failure mode of such systems is quiet scope creep:\n\n- It does not decide whether a question is worth asking. `/decompose` takes the question as given.\n- It does not verify against a proof assistant. `VERDICT: PASS` means one hostile reader with the appendix in hand found no gap — a referee report, not a machine-checked proof.\n- It does not touch `main.tex`. Nothing the pipeline produces enters the manuscript without a human moving it there.\n- It does not judge novelty. `/examples` searches the literature for examples *of* a statement; it does not check whether the statement is already known.\n\n## 8. Extending it\n\n**A new question.** `/decompose \"<question>\"` — the lead-researcher adds a `<a id=\"q<n>\"></a>` anchor, heading, **Setting.**, **Conjecture.**, tally, and node bullets to `blueprint/main_dag.md`, plus one directory per node. Review the statements before proving anything: they encode the strategy, and a wrong decomposition wastes every downstream prove.\n\n**A lemma that is too big.** `/decompose <node-id>` expands one lemma into sub-lemmas `<id>-L1`, `<id>-L2`, …, written as directories **inside the parent's own** ([I12](#4-invariants)) and becoming its dependencies; the parent goes to `blocked` and gains a `## Decomposition` paragraph saying how they reassemble. The parent's `## Statement` is frozen throughout — expansion changes how a lemma will be proved, never what it claims, which is what keeps I2 intact while the DAG grows.\n\nThis is the escape hatch for I9. When a write-up will not fit on a page, the honest response is that the node was really several nodes, and the id scheme records that: `Q1-L5-L2` says exactly where it sits, and now so does the tree. Ids are never renumbered and no existing directory moves — an expansion only adds directories beneath the lemma it refines — so a link written today still resolves after the tree grows beneath it.\n\n**A new object.** Add an entry to [`blueprint/appendix.md`](../appendix/index.html) following the schema at the top of that file: anchor, kind, attribution with `main.tex` line, full statement, `role`, `hypotheses` for black boxes, `used by`. Grep the label in `main.tex` and the bib key in `refs.bib` first — both must exist. Until the entry exists, no node may use the object (I1).\n\n**A new agent.** Define it canonically in `.claude/agents/<name>.md` with the narrowest tool grant that lets it do its job, and give it a slash command in `.claude/skills/<name>/SKILL.md`. Add the matching thin Codex adapters under `.codex/agents/<name>.toml` and `.agents/skills/<name>/SKILL.md`. Write down in this file what it may write and what it may never touch, then add the same line to `CLAUDE.md`'s write-discipline paragraph and extend the one-to-one mapping tests. An agent whose powers are not written down on both host surfaces will drift.\n\n## 9. Failure modes observed so far\n\nHonest log; `n` is small and these are correlations, not laws.\n\n- **Ambiguity in the source surfaces as a critic FAIL, not as a prover error.** Q1-L1 round 1 failed because `def:satake_subcategory` names no ambient category for its generation operation. The prover had picked a reading silently; the critic caught that the reading was unjustified. This is the pipeline working, and it is the strongest evidence so far that the hostile-referee step earns its cost. Resolution: [ADR 0001](decisions/0001-satake-generation-ambient-category.html).\n- **A ratified reading must be recorded where the object lives, not only where it was decided.** The Q1-L1 remark held the $\\mathcal{D}^{\\mathrm{ren}}$ ratification, so a later node reading only `def:satake_subcategory` would not have seen it. Fixed by giving the appendix entry the ratification and a back-link. See [ADR 0003](decisions/0003-appendix-of-objects.html).\n- **Without a length limit, drafts fill with quotation.** Q1-L1's refereed draft was ten pages, most of it restating framework results. Fixed by I9 once the appendix made citation possible. See [ADR 0005](decisions/0005-node-directories.html).\n- **Bare labels rot silently.** See I6.\n- **A syntax check is not a render check.** A patch to the generator deleted the block that creates the question card while leaving the line that referenced it. The page threw `ReferenceError` on its first statement and rendered nothing at all; `node --check` passed, because the syntax was perfect. Fixed by `tools/dag_smoke.js`, which runs the page. The general lesson is that a check which cannot fail on the bug you actually shipped is not a check — after writing it, reintroduce the bug and confirm it fails.\n- **A rule with no gate is a suggestion.** `.claude/agents/critic.md` has said \"write all mathematics in standard KaTeX, house macros are `.tex`-only\" since it was written. The critic wrote `\\cD`, `\\bs` and `\\anbr` into its report anyway, and nothing noticed, because nothing was checking. The instruction was already correct; what was missing was `check_render.py` running on every step that writes markdown.\n- **A linter over a repo that documents its own conventions flags the documentation.** `check_render.py` opened with 32 findings, most of them `CLAUDE.md` and the agent prompts — files whose whole purpose is to say \"never write `\\cD` in a `.md`\". Prose *about* notation quotes that notation, so the checker strips inline code spans and fenced blocks before looking. The same bug recurred a level up: a check for unrendered `$$` fired on `blueprint_site/pipeline.md`, which states the `$$ … $$` rule. Any gate over this repo has to distinguish quoted from live before it can distinguish right from wrong.\n- **Two files can be one file.** `README.md` and `blueprint_site/README.md` both mapped to `blueprint_site/notes/readme.html`; on a case-insensitive filesystem the second silently overwrote the first, and the only symptom was a page that reported itself perpetually stale. Caught by `--check` comparing every generated page rather than just the one it used to write.\n- **A link is only as good as its target.** Moving from one page to eighty turned three latent problems into build failures at once: appendix section anchors (`#s2`…`#s9`) that no generated page defined, object labels that are themselves mathematics (`$\\mathrm{IC}_0$`) rendered as raw TeX inside a code span, and a deep link cleared by the initialisation that ran before it was read. None of these were visible while everything lived in one file.\n- **Presentation drift is a separate concern from correctness, and needs a separate agent.** The critic kept flagging formatting; formatting is not its job and the noise hid the mathematics. See [ADR 0004](decisions/0004-checker-separate-from-critic.html).\n\n**I19 — An operator's spending is bounded, and the bound is measured.** `/prove` runs at most two rounds and admits at most one widening per invocation, a ratified reading counting as a widening ([ADR 0030](decisions/0030-the-prove-budget-cap.html)). A `FAIL` at r2, a second closed-world `FAIL`, or a write-up still over the I9 page budget after one compression pass all end the run and hand the decision back to the user with the referee's list in hand. The bound comes from the cost table in that ADR — the repository's only measurement of what an operator costs — and a future bound extends that table rather than guessing.\n";</script>
