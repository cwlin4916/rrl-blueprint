<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">process</a><i>›</i><span>pipeline</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>The auto-research pipeline — design</h1><p class="lead">Generated from <code>process/pipeline.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[process index](index.html) · [the pipeline, part by part](pipeline/index.html) · [operations](operations.html) · [journal](journal.html) · [decisions](../../process/decisions) · [repo README](../readme.html)\n\n`README.md` says how to *run* the pipeline. This file says how it is *built* and why, and holds the numbered invariants. [`pipeline/`](pipeline/index.html) says what each part **is**, one file per part — [seven actors](pipeline/actors/index.html), [six operators](pipeline/operators/index.html), [what a flaw is](pipeline/flaws.html), [what the pipeline has done](pipeline/statistics.html). [`operations.md`](operations.html) is the whole thing on one page as tables.\n\nThe invariants stay here, in this file, because 54 links across the repository point at `#4-invariants` and a retroactive move by name is how eleven links broke the last time.\n\nEvery rule below exists because something went wrong without it, or because a specific failure was anticipated; where the evidence is thin, the entry says so.\n\n## 1. What the pipeline is\n\nA research question is decomposed into a DAG of lemma statements; each node is proved by one agent, checked, and refereed by a second agent that cannot see the first agent's reasoning; the outcome is written back into the DAG and committed. The repo *is* the state — there is no database, no server, and no memory between sessions beyond the files.\n\nThe design target is not autonomy. It is **auditability**: at any moment you can point at a node and say exactly what it claims, what it is allowed to assume, which proof text supports it, which referee reports it survived, and when each of those changed. A pipeline that proves things you cannot check is worse than no pipeline.\n\n## 2. The shape of the loop\n\nAll six operators, and the arrows between them — which is the part no single skill file can show.\n\n```\n                    ┌──────────────── the statement was wrong ───────────────┐\n                    │                                                        │\n                    ▼                                                        │\n question ──/decompose──▶ STATEMENTS ──/update──▶ corrected statement ────────┤\n                              │                                              │\n              cheapest first  ├──/check-goal──▶ goalcheck.md ─── a ceiling    │\n                              │                    1 agent                    │\n                              ├──/examples ───▶ examples.md ──── ±literature  │\n                              │                    1–2 agents                 │\n                              └──/prove ──────▶ prover ─▶ gate ─▶ critic      │\n                                                   ▲            2–6 agents    │\n                                                   │                │         │\n                                     FAIL at r1 ───┘                │         │\n                                     FAIL at r2 ──▶ failing ────────┤         │\n                                     REFUTED ──────────────────────────────────┘\n                                     PASS ────────▶ proved ─▶ suggest /examples\n```\n\n**Statements are the hub.** Every operator either creates them, tests them or corrects them, and only `/update` writes one. So when `/prove` cannot establish a claim because the *claim* is wrong, it stops and hands over — that stop is the run's product, not its failure. A referee whose verdict could rewrite the claim is not a referee. Every stop condition of every operator is tabulated in [`pipeline/operators/README.md`](pipeline/operators/index.html).\n\nThe orchestrator is the main host thread — Claude Code or Codex. It is deliberately not a specialist agent: it holds the loop, runs the gates itself, and performs every mutation of DAG state. Subagents produce artefacts; only the orchestrator changes the record of what is true.\n\n**No operator commits** ([ADR 0069](decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)). A run ends at `python3 tools/batch.py close` — one canonical build, one page build, one full gate — which is the only step several parallel runs share.\n\n## 3. Actors and their powers\n\nOne file each in [`pipeline/actors/`](pipeline/actors/index.html), with the stop conditions; the summary is:\n\n```\norchestrator ......... the main thread, all tools     writes every status field\n├── lead-researcher .. no Bash                        writes statements, appendix entries\n├── prover .......... +Bash                           writes proof.md\n├── critic .......... no Edit, no Bash  ⛔             writes critiques/r<n>.md\n├── example-finder .. +WebSearch, WebFetch            writes examples.md, prompts/\n├── goal-checker .... no web                          writes goalcheck.md\n└── checker ......... no Bash                         reformats, changes no claim\n```\n\n- **lead-researcher** (`/decompose`) writes lemma *statements* into `blueprint/nodes/<id>/<id>_node.md`, the per-question **Setting** and **Conjecture** paragraphs in `blueprint/main_dag.md`, and any new entries in `blueprint/appendix/`. It never writes a proof, and it never writes an index bullet — those are generated.\n- **prover** (`/prove`) writes exactly one file in the reasoning tree: `blueprint/nodes/<id>/proof.md`, a standalone one-page write-up of one node. It cannot touch the DAG. It may append a source to the reading list in `papers/guideline.md`.\n- **critic** (`/prove`) writes exactly one file: `blueprint/nodes/<id>/critiques/r<n>.md`, ending in `VERDICT: PASS` or `VERDICT: FAIL`. It has no edit and no shell tools at all — it can read, and write its own report, nothing else.\n- **checker** (the presentation pass ending `/decompose`, `/prove`, `/examples` and `/update` — [ADR 0031](decisions/0031-presentation-is-a-stage-not-a-command.html)) reformats the canonical markdown its calling run just wrote. It never edits a generated `<id>_prompt.md`. It may rewrap a statement; it may never restate one, and never touches a status field, a `VERDICT:` line, or any manuscript `.tex`. Presentation only — finding examples used to be its second job and is now its own agent.\n- **example-finder** (`/examples`) researches the literature for explicit instances of one node's statement, simplest first, each with the argument that it *is* an instance. It writes `blueprint/nodes/<id>/examples.md` or, when it honestly found none, `blueprint/nodes/<id>/prompts/examples.md`, and appends what it read to `papers/guideline.md`. It changes nothing the DAG depends on.\n- **goal-checker** (`/check-goal`) specializes one node's statement to each entry of the key-example register and writes exactly one file, `blueprint/nodes/<id>/goalcheck.md`, closing on `GOALCHECK: consistent | untested | tension | contradicted` ([ADR 0040](decisions/0040-the-key-example-register.html)). It has no web access and needs none — the register's sources are read at page level before an entry is written. It never edits a statement, a field or the register itself.\n- **orchestrator** (the main thread) runs the render and page gates, shuttles critiques back to the prover, writes every status, regenerates all node prompts and the site, and commits.\n\nThe `.claude/agents/*.md` grants are canonical. Claude Code enforces them as its physical tool surface; `.codex/agents/*.toml` translates them into Codex behavioral allowlists and the same narrow write boundaries, with `AGENTS.md` defining the host vocabulary. The test suite checks both mappings. The critic having no write access outside its own report is the single most load-bearing configuration choice in the repo: a referee that can edit the proof stops being a referee.\n\n## 4. Invariants\n\nThese are the properties that must hold after every step. If one is violated the pipeline's output is not trustworthy, regardless of how good the mathematics looks.\n\n**I1 — Closed world.** A proof may invoke exactly: **any** entry of [`blueprint/appendix/`](../appendix/index.html), the node's own `depends-on` list, and standard mathematics needing no citation. Nothing else. A result that is true, published, and in `main.tex` but *not* in the appendix is not available; using it is a `GAP`, the prover stops there, and only [`/decompose`](pipeline/operators/decompose.html) can discharge it by writing the entry.\n\nA node's `objects:` field is a **declaration of what its write-up used**, not a permit for what it may use ([ADR 0071](decisions/0071-the-closed-world-is-the-appendix.html)). It gates nothing; `tools/check_render.py` §11 recomputes it from the draft's links and reports the difference; the `/prove` orchestrator writes the missing line. So a `W` flaw is never above MINOR and never fails a round, and [I19](#4-invariants)'s one-widening cap counts new appendix entries alone.\n\n*Why:* without a closed world \"assume the theorem\" is indistinguishable from \"cite the theorem\", and the DAG stops encoding a proof order. The cost is real — distilling a result into the appendix is manual work — and that cost is the point: it forces a human decision about what is being assumed.\n\n*Why the field stopped gating:* it was a prediction. `objects:` is written at decomposition time, before anyone has attempted the proof, and 45 of the 341 flaws on disk are a correct argument failing against an entry that was already written and already checked — [Q1-L2-L1 r1](../nodes/Q1/Q1-L2/Q1-L2-L1/critiques/r1.html) closes \"the mathematics is correct; the declared world does not license it\". Worse, each such `FAIL` spent the one widening, so a node short in two places could not be proved at all. The guarantee the closed world exists for never lived in the per-node subset: it lives in the appendix, in the fact that every entry was transcribed from a numbered result with the source open.\n\n**I2 — Statements are fixed before proofs are attempted.** `/decompose` produces statements only. The prover reproduces the statement verbatim and may not weaken or strengthen it.\n\n*Why:* an agent that can edit the goal will prove something adjacent and report success. Freezing the statement makes the gates and the critic meaningful.\n\n**I3 — The render gate is run by the orchestrator.** The prover's `proof.md` must pass `tools/check_render.py` before the critic is invoked, and the orchestrator runs it itself rather than trusting a report of it. This matters more now than when the write-up was LaTeX: markdown does not fail to build, so what would once have been a compile error is a fragment that silently renders as literal text.\n\n*Why:* self-reported build success is the cheapest thing for an agent to get wrong. It is also a free syntactic check on notation: an undefined macro means the proof left the house vocabulary.\n\n**I4 — Critiques are append-only.** Round 2 is a new file `r2.md` beside `r1.md` in `blueprint/nodes/<id>/critiques/`. No critique is ever rewritten, and the numbering never restarts: a node that is re-opened and re-proved continues at the next round.\n\n*Why:* the sequence of verdicts is the audit trail for how a node reached `proved`. A node that passed on round 3 after two failures is a different epistemic object from one that passed immediately, and the repo should show which.\n\n**I5 — Every fact is stored once.** A node's status lives in `blueprint/nodes/<id>/<id>_node.md` and nowhere else. The index bullets and tally in `blueprint/main_dag.md` are generated from the node files, between `BEGIN INDEX` and `END INDEX` markers, by `tools/build_dag_site.py`, and so is the flaw block of [I32](#4-invariants), between `BEGIN FLAW` and `END FLAW` markers inside the node file itself. The self-contained `<id>_prompt.md` files of I18 repeat canonical material only as deterministic readouts; nothing reads them as authority.\n\n*Why:* this invariant used to read \"status is written twice and checked\", on the theory that checked redundancy is documentation. It is not — it is a second thing to keep right, and the check that policed it was overhead for a duplication we chose to create. Deriving the index makes drift impossible rather than merely detectable, and `ready` stops being stored at all: it is a function of the dependency statuses, computed where it is displayed. (`blocked` was derived the same way until [ADR 0045](decisions/0045-there-is-no-blocked-node.html) removed it outright.)\n\n**I6 — Objects are linked, never named.** Blueprint markdown never contains a bare label like `` `thm:chen_Ti` ``. Every mention is a link into the appendix entry that states the object in full.\n\n*Why:* a bare label is unreadable to a human skimming the DAG and unresolvable to an agent that has not been handed `main.tex`. It also silently tolerates typos — `def:orbits_iwahori_sphe rical` sat in the index for a week and referred to nothing. A link either resolves or is caught by the link checker.\n\n**I7 — Markdown math is standard KaTeX/MathJax.** House macros (`\\cD`, `\\Sat`, …) exist only in `.tex` files. Every `.md` file must render on GitHub with no preview shim.\n\n*Why:* the blueprint's readers are a human in a browser and an agent reading raw text. Neither expands `preamble.tex`.\n\n**I8 — Nothing is ever read from a generated artifact.** `build/` and all of `blueprint_site/` are regenerable and are never inputs. `build/` is untracked; `blueprint_site/` is tracked again, so that a clone carries the rendered blueprint without running the generator ([ADR 0033](decisions/0033-the-generated-site-is-tracked-again.html), reversing [ADR 0010](decisions/0010-site-untracked-and-renamed.html)). Tracked is not authoritative: it is still never hand-edited and never read back. `rm -rf blueprint_site && python3 tools/build_dag_site.py` reproduces the site exactly, vendored KaTeX included — which is why KaTeX is checked in under `tools/vendor/` and copied in, rather than living in `blueprint_site/` as the one hand-placed file in a generated tree. A workflow needing a fact from a build artifact is misdesigned; the fact belongs in the appendix.\n\n**I9 — One node, one directory, two budgets.** Everything about a node lives in its own directory, and `proof.md` carries **two** length budgets, of which only the larger is a gate ([ADR 0060](decisions/0060-a-write-up-has-two-budgets.html)): a hard cap of **1500 words**, over which `tools/check_render.py` fails, and a **split signal at 1000 words**, which fails nothing and prints a note. Crossing the signal says the write-up has outgrown one claim; the note names the two remedies in order — `/decompose` the node, and move whatever the write-up is *restating* into an appendix entry it can link instead. The second is the one that compounds, because an entry is written once and cited by every node that needs it, so lifting a definition out of one write-up shortens every other write-up that was restating the same object. The single 900-word cap this replaces had stopped being a ceiling and become a target: seventeen of twenty-seven write-ups sat between 866 and 900 words and two sat at exactly 900.\n\n*Why:* the limit is what forces citation instead of restatement. Before the appendix existed, every draft opened with a \"Setting\" and an \"Ingredients\" section restating the framework — Q1-L1 round 2 ran to ten pages, of which roughly seven were quotation. A second copy of a statement is a copy that can drift from the first. The page count is also a useful alarm: a node that will not fit is usually several nodes, which is a decomposition defect, not a writing problem.\n\n**I10 — Examples illustrate, never justify.** `blueprint/nodes/<id>/examples.md` is outside the closed world of I1. No proof, node, or appendix entry may cite it. Every example carries a source with a resolvable identifier and a numbered result; an unsourced example must be labelled as constructed. An example promoted to a node states a proposition: it quotes the claim it instantiates rather than linking it, and it opens on its polarity — `positive`, `negative`, `boundary` or `normalization` ([ADR 0047](decisions/0047-an-example-node-is-a-proposition.html)).\n\n*Why:* an example is evidence a statement is non-vacuous and understood, which is worth having, but it is not evidence the statement is true. Keeping examples formally inert means a wrong example cannot corrupt a proof — the worst case is a misleading illustration, not an unsound DAG. The rule against inventing one matters more than the rule about finding one: a fabricated citation is the single failure that would poison the record, because it is exactly the kind of thing a reader will believe without checking.\n\n**I11 — Every cited thing has a page.** The `blueprint_site/` site carries one page per object a link can point at: an appendix entry, a node, a write-up, an examples file, an open prompt, a critique, a reference note. It also carries the non-citable self-contained prompt page required by I18. `tools/check_render.py` resolves every link between generated pages and fails on a dangling one.\n\n*Why:* [I6](#4-invariants) says an object is linked and never named, which only pays off if the link lands somewhere readable. A link into `blueprint/appendix/generation-compactness/def-generation.md` is a link to a 3,000-line markdown file — GitHub will render it, nothing else will, and the write-up citing it renders nowhere at all. One page per object turns the guardrail into navigation, and makes a broken reference a build failure instead of a bad afternoon.\n\n**I12 — A node's id is its path.** A child's directory is written inside its parent's, so a node's location is its id split into `-L<k>` / `-e<k>` / `-a<k>` / `-c<k>` segments and rejoined with `/`: `Q1-L2-L1` can only live at `blueprint/nodes/Q1/Q1-L2/Q1-L2-L1/`, the chain opening with the node's **question**, which is a container and not a node and so holds no node file of its own ([ADR 0059](decisions/0059-a-container-is-a-directory.html)). Every directory carries the full id of the node it holds. `tools/build_dag_site.py --check` fails on a node that sits anywhere else. An example, analogy or consequence child nests the same way — `Q1-L5-e1` one level inside `Q1-L5`'s own directory, `Q1-L3-c1` inside `Q1-L3`'s — but its edge to the node it hangs off is containment only: the host never depends on it ([ADR 0021](decisions/0021-example-and-analogy-nodes-nest.html), [ADR 0073](decisions/0073-a-consequence-is-a-node-class.html)). No segment is terminal ([ADR 0047](decisions/0047-an-example-node-is-a-proposition.html)): an e/a/c node is a proposition, so `Q2-e1-L1` is its sub-lemma and `Q2-e1-e1` a further instance of its kind, both inside `blueprint/nodes/Q2/Q2-e1/`, and there the edge *is* a dependency — the example rests on its own decomposition. Nothing below an e/a/c node carries role `proof`, so no aggregate over the proof chain reaches into an instance. The relative-link depth follows: `../` repeated `s+2` times reaches `blueprint/`, `s` counting **all** segments and not the `-L`s alone.\n\n*Why:* the id already named the whole ancestor chain, so a flat directory beside its own parent stored that chain twice — once in the name, once nowhere — and the two could not be checked against each other. Making the path derivable means `ls` shows the decomposition, `rm -rf` on a node takes its sub-lemmas with it, and a misplaced directory is a gate failure rather than something a reader has to notice. It costs nothing in link stability, which is what the flat layout was protecting: a decomposition only ever *creates* directories beneath an existing node, so no node ever moves and no link written earlier goes stale. What it does cost is that a node's depth is now variable, so a relative link out of a node file must be worked out from that node's own depth rather than copied from a neighbour — `../` repeated `d+1` times reaches `blueprint/`, where `d` counts the `-L`s.\n\n**I13 — Confidence is three signed channels, and the aggregate is derived.** A node's confidence is\n\n$$\nC(v) \\;=\\; \\min\\Bigl(\\mathrm{cap}(v),\\ \\ \\tfrac14 H + \\tfrac12 D + \\tfrac14 L,\\ \\ \\min_{u\\in\\mathrm{deps}(v)} C(u)\\Bigr) \\ \\in\\ [-1,+1],\n$$\n\nhuman judgement $H$ weighted 25, the mathematical record $D$ weighted 50, the literature $L$ weighted 25. $D$ is the Baconian ratio over the flaws the critiques raised and disposed of. **The weakest node beneath is a ceiling on the sum, not a term inside it** ([ADR 0068](decisions/0068-the-weakest-link-is-a-ceiling.html)): it used to be both — the minimum was taken over the dependencies' full $C$ and then multiplied by $\\tfrac12$ — which charged the discount twice, collapsed the recursion to $C(v)=\\tfrac12 C(u)$ whenever $H$ and $L$ were silent, and made confidence halve at every layer of the DAG. Setting every node in the repository to `proved` still left two questions negative, so the target was unreachable and the display was reporting that correctly. A chain of proved nodes now holds its value at any depth, and a node over a refuted one carries the refutation's full weight instead of a laundered fraction of it.\n\nEach channel may be **silent**, and a silent channel costs nothing, so a node nobody has weighed sits at 0 with an empty card, while `failing`, `doubted`, `refuted`, `gap` and `counterexample` push it negative and turn it red. The cap is 80% until the user sets `human: approved`. It is computed by `tools/build_dag_site.py` at build time, exactly as `ready` is, and there is no `confidence:` field anywhere ([ADR 0014](decisions/0014-confidence-is-three-signed-channels.html), superseding [ADR 0013](decisions/0013-confidence-is-derived-baconian-and-weakest-link.html), amended by [ADR 0042](decisions/0042-confidence-shows-its-working.html) and [ADR 0068](decisions/0068-the-weakest-link-is-a-ceiling.html)).\n\n**The number shows its working.** Wherever it appears with room for it — the graph panel, the node page — it is followed by a decomposition: one row per channel, saying what that channel scored, what it contributes, and **where to go and read the record it scored** (the `human:` field, each critique round with its verdict and flaw count, `examples.md`). When something beneath the node is weaker, the row names it, gives its percentage and links it, because the channel took that number and not the node's own. It is rendered once, in Python, and shipped to the graph as HTML, so the panel and the page cannot disagree. A round's **verdict** decides what its flaws were: a `PASS` disposed of everything it raised, and only a round still open leaves defeaters standing.\n\n*Why:* `proved` answers *what stage is this at*, not *how much should I believe it*, and the two come apart. [Q1-L1](../nodes/Q1/Q1-L1/index.html) reached `proved` on its fifth report, after two `FAIL`s, twenty-two flaws disposed of and eight still standing; a node that passed cleanly on `r1` carries the same word. So does a `proved` node resting on an `open` one, whose support does not exist yet. The single Baconian ratio that preceded this could only say how the referees had gone, which silently equated a lemma no human had read with one the user had endorsed and a lemma with no precedent in print with one whose statement is a published theorem; separating the channels lets each say nothing when it has nothing to say, and signing them lets the record express doubt rather than only the absence of support. Deriving the number rather than storing it is [I5](#4-invariants) again — a stored confidence goes stale the moment a new critique lands and nothing could check it. Confidence stays outside the closed world on the same footing as `examples.md` under [I10](#4-invariants) — it is derived *from* the audit trail, so it can never be evidence *in* it, and no gate passes or fails on it.\n\n**I14 — Every node declares its epistemic role.** `<id>_node.md` carries `role: proof | evidence | example | analogy | consequence | thought`, set by the lead-researcher at creation and changed only by the user — except that `/update` may reclassify an existing node, recording the id before and after in its `updates/u<n>.md` ([ADR 0073](decisions/0073-a-consequence-is-a-node-class.html)). A `proof` node is a step of its question's argument and may depend only on proof nodes; `evidence`, `example`, `analogy` and `consequence` nodes corroborate the argument ([ADR 0018](decisions/0018-example-and-analogy-nodes.html)); a `thought` is exploration `/prove` refuses. The corroborating roles differ by direction — an example instantiates the claim, an analogy matches it from another setting, a consequence **follows from** it, and `evidence` is the case whose relation cannot be drawn, which is why it alone carries no id suffix. The tallies of I5's generated index and the aggregates of I13 range over proof nodes alone — I13's \"weakest node beneath it\" narrows to the weakest node of the proof chain ([ADR 0015](decisions/0015-every-node-declares-its-role.html)).\n\n*Why:* Q1-L7 — the group case, a check nothing depends on — read exactly like an unproved chain lemma: \"Proved 2/11\" counted it as an obligation, and the weakest-link minimum let it pin Q1 at 0% however much of the actual argument was proved. A corroboration's absence leaves the argument exactly as strong, so an aggregate that claims to measure the argument must not range over it. The role is stored rather than inferred from `required-by: —` because a leaf is a position, not a purpose: every chain lemma is born a leaf mid-decomposition, and the terminal node of a finished argument is a leaf forever.\n\n**I15 — A statement is superseded, never silently edited.** The `## Statement` of a node and the framing paragraphs of a question change through `/update` alone ([ADR 0019](decisions/0019-the-update-operator.html)): the revision is recorded in the node's append-only `updates/u<n>.md` — old statement, new statement, what forced it, what was rejected — the commit message discloses it, a node that was `drafted` or `proved` drops to `open`, and externally supplied input is verified (mathematics recomputed, citations resolved, claims about the repo checked against the repo) before any of it is adopted. Every question carries a **Problem statement.** paragraph saying what would count as an answer — a condition that is necessary, sufficient, or necessary and sufficient, said explicitly. Its **Conjecture.** paragraph is versioned and self-contained ([ADR 0025](decisions/0025-the-conjecture-is-versioned-and-self-contained.html)): it opens with a version label *(v\\<k\\> — date.)* and writes the criteria it asserts out in full with every reference hyperlinked — the node's own `## Statement` staying canonical. `/update` bumps the version whenever it revises the paragraph, the question-level counterpart of `updates/u<n>.md`. The *Versions.* history that [ADR 0025](decisions/0025-the-conjecture-is-versioned-and-self-contained.html) also asked for is gone, and so is the *Route status.* paragraph — see [I26](#i26).\n\n*Why:* I2 froze statements so a proof could not drift toward its goal, but a statement that is *wrong* then had nowhere to go — `operations.md` §8 carried \"supersede a node\" as an unfilled hom-set. The controlled form keeps what I2 was for: the referee still reviews a fixed claim, because revision resets the record instead of editing under it, and the seam — `updates/`, the status drop, the disclosed commit — is the same seam I4's critique numbering leaves after a re-proof.\n\n**I16 — The next actions are judged or derived, and the two never mix.** Each question's `## Pipeline` stores at most five ranked actions, written by `/update`, each naming an operator, its target and what it buys; severity is read off the target's state rather than stored, and no row carries a confidence number, because the current one is derived. The site appends warnings derived from the record (failing nodes, negative confidence, published counterexamples and gaps, statements revised and not re-proved, the ready frontier), recomputed at every build and stored nowhere ([ADR 0085](decisions/0085-the-pipeline-replaces-the-priority-panel.html), superseding [ADR 0020](decisions/0020-the-priority-panel.html)). Nothing may cite either half.\n\n*Why:* the repo stores no fact from which \"most important\" follows, so a ranking must be stored, signed and dated by whoever judged it; a warning the state already implies must *not* be stored, or it drifts (I5). The visible split is what makes the panel trustworthy — a judged row has an author, a derived row has a derivation.\n\n**I17 — Every command leaves the site regenerated, and the batch closes once.** Whatever else an operation did, it is not finished until `python3 tools/batch.py close` prints `OK` — one `build_dag_site.py --canonical`, one `--pages`, one whole-repo render gate and one consistency check, in that order. The consistency gate treats a generated page older than the state as a failure, so a stale site is an unfinished command, not a cosmetic lag.\n\n*During* a run the scoped forms are used instead ([ADR 0069](decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)): `check_render.py --only <dir>` runs the eight per-file checks in under a second, and `build_dag_site.py --canonical` writes the prompts, flaw blocks and index without rendering 784 pages. A scoped pass prints `(scoped)` on its verdict line and is never reported as a repository pass. Canonical runs **before** pages and re-reads the node files it wrote, which is what makes a single build converge — it used to render before writing the flaw blocks it was reading, so every status change paid for the slowest step twice.\n\n*Why:* the site is the tree's one human-facing surface, and everything derived lives there — the index tallies, the effective statuses, the confidence tints, every node's local DAG, the priority panel's warning layer. A surface that can lag invites reading a repository that no longer exists. Regeneration is idempotent and reads nothing back (L7), so the invariant costs one command per run and removes the whole class of stale-read mistakes; L16 is its typed form.\n\n**I18 — Every node has a current self-contained prompt.** Beside every `<id>_node.md` is a generated `<id>_prompt.md` containing a role-sensitive task, the question setting and problem, the **latest entry** of the node's history, its canonical statement, direct prerequisites with their statuses, the full declared appendix inputs, the transitive appendix vocabulary they invoke — without its fine print, since an entry the node did not declare is there to decode the ones it did — and the matching `refs.bib` records ([ADR 0029](decisions/0029-every-node-has-a-generated-self-contained-prompt.html), narrowed by [ADR 0063](decisions/0063-a-prompt-carries-what-is-needed-to-work.html)). It carries what someone outside the repository needs in order to work on the node, which is not everything the repository knows: the full history log and the list of repository files a portable packet cannot open are both out. The file is outside the closed world: no proof, node or appendix entry cites it, and no agent edits it. `tools/build_dag_site.py` derives it from canonical sources on a normal build; `--check` fails on a missing, stale or stray copy.\n\n*Why:* `<id>_node.md` is the normalized form and should stay concise, but a problem handed outside the repository must carry its vocabulary and purpose with it. Manual self-contained restatements would turn every statement revision into dozens of unchecked copies. A generated packet gives portability without creating another authority.\n\n**I19 — An operator's spending is bounded, and the bound is measured.** `/prove` runs at most two rounds and admits at most one widening per invocation, a ratified reading counting as a widening ([ADR 0030](decisions/0030-the-prove-budget-cap.html)). A **widening is a new appendix entry**, and declaring an existing one is bookkeeping the orchestrator does for free ([I1](#4-invariants), [ADR 0071](decisions/0071-the-closed-world-is-the-appendix.html)). A `FAIL` at r2, a second `GAP` after one entry has already been written, or a write-up still over the I9 page budget after one compression pass all end the run and hand the decision back to the user with the referee's list in hand. The bound comes from the cost table in that ADR — the repository's only measurement of what an operator costs — and a future bound extends that table rather than guessing.\n\n**I20 — A ratified reading records the scope of its provenance.** A reading fixed on an appendix entry ([I15](#4-invariants), `context.md`) names the published statement that makes it consistent. That provenance note must say what the source's statement actually ranges over, and where the reading ranges wider, the note says so: a reading is a convention the blueprint may adopt, but a source is evidence only for what it states.\n\n*Why:* [ADR 0028](decisions/0028-orbit-strata-are-fpqc-images.html) reads every $L^+G$-orbit image in $LX$ as represented by a locally closed stratum and cites Sakellaridis–Wang Prop. 2.3.7 with Lem. 2.3.10 for it. Those results are stated over the nondegenerate locus $\\mathsf{L}^\\bullet X$, and for a non-homogeneous $X$ the two loci differ — the orbit of $0$ in $L\\mathbb{A}^1$ under $L^+\\mathbb{G}_m$ is in one and not the other. The reading is not thereby wrong, and no gate could have caught this: the link resolves, the entry exists, and the source says something true and close. Only reading the source against the scope of the claim it is offered for finds it, which is why the obligation is written down rather than automated ([Q1-L4-L1/u1](../nodes/Q1/Q1-L4/Q1-L4-L1/updates/u1.html), [P18](../../blueprint/priorities.md)).\n\n**I21 — An example says what it matches.** Every finding in `blueprint/nodes/<id>/examples.md` — each instance, each analogue, each precedent hit — names the part of the node's `## Statement` it matches, the specialisation or dictionary line it matches under, and what it does not reach ([ADR 0036](decisions/0036-an-example-says-what-it-matches.html)). An entry that is an analogue rather than an instance says so in its heading and its first sentence; where a file works under a dictionary at all, the dictionary is written out once with a source for each line of it that is in print. Analogues alone never earn `EVIDENCE: precedent`, and a source covering one clause of several is a partial precedent that says which. The `/examples` orchestrator lists the statement's matchable pieces itself before dispatching, and afterwards reports the complement of the union — the clauses nothing found touches.\n\n*Why:* Q1-L3's first pass returned five sourced entries, four of them decategorified analogues under a dictionary stated once and then never used, and not one saying which of the node's three clauses it spoke to. Every citation was sound and the file still could not be read as evidence. The coverage report is the operator's only mechanism for noticing the other half: clause (ii) of that node is matched by nothing in the literature, which is either where the node is new or where it is wrong.\n\n**I22 — A readout shows the statement and links the record.** What a reader gets on opening a node is what the node claims. The graph panel renders the statement, the decomposition and the navigation, and reaches `<id>_history.md` through its Pages list rather than inlining it ([ADR 0037](decisions/0037-the-node-panel-carries-the-statement.html)); the history text is not carried in the mounted payload at all. The append-only record of [I5](#4-invariants) and ADR 0027 is unchanged — it keeps its own file and its own generated page. The generated `<id>_prompt.md` of I18 is the deliberate exception: a packet that leaves the repository has nothing to link to.\n\n*Why:* the history grows with every `/update` and `/prove` run, by design, and had come to sit between the statement and the dependency list on every node a reader clicked. It is also the rule node creation follows at the other end: the statement goes in `<id>_node.md`, the life goes in `<id>_history.md`, and a node file that absorbs its own history is text rendered where only the claim belongs.\n\n**I23 — A node file is the statement, and its conditions are a spaced list.** Two mechanical rules, both enforced by `tools/check_render.py`. A `<id>_node.md` holds the title, the breadcrumb, the field block and `## Statement`, and no other section — `## Decomposition` went with [ADR 0074](decisions/0074-the-decomposition-paragraph-is-removed.html): commentary belongs in the dated entry of `<id>_history.md` that explains it ([I22](#4-invariants), [ADR 0027](decisions/0027-a-node-carries-its-history.html)). The rule is over headings at **every** depth: a `### Why this condition is there` nested inside the statement is the same commentary one level further in, and it reads as part of the claim.\n\nAnd a paragraph of a `## Statement` declares **at most one** bolded condition label — `**(A) Name.**`, `**(i)**`, `**(H1)**`, `**(1)**` — so hypotheses arrive one per paragraph with a blank line between them, never run together in a sentence. A label is *declared* when it heads its own sentence: at the start of a line, or after a full stop, semicolon or colon. Anywhere else it is a *mention* of a condition declared somewhere else — \"assume only hypothesis **(H1)** of Q1-L5\" — and mentioning one is exactly what a node is supposed to do.\n\n*Why:* the user asked for it, twice, in the words *conditions are always listed and well spaced* and *we only write the problem statement* — and both halves had already drifted once. `Q1-L4-L1_node.md` had grown a `## Scope` section of five commentary paragraphs, rendered on the node page above the dependency list; it is now the dated history entry it always was. A condition a reader cannot check off one at a time is a condition a prover will discharge three of and forget the fourth.\n\n**I24 — The goal question has a bench, and a check against it can only lower a number.** Exactly one question in `blueprint/main_dag.md` carries a `**Goal.**` paragraph, and `blueprint/key_examples.md` is the register of cases where the answer to it is settled in print ([ADR 0040](decisions/0040-the-key-example-register.html)). Each entry closes on `KEY: positive | weak | degenerate | out-of-class | negative | adjacent`, and the distinction the register exists for is between a source that realizes the **whole** automorphic category — a positive for the question — and one that realizes only the Satake subcategory, which establishes the standing hypothesis and leaves the question untouched. `/check-goal <id>` writes `blueprint/nodes/<id>/goalcheck.md` closing on `GOALCHECK: consistent | untested | tension | contradicted`, and that verdict is a **ceiling**, not a fourth channel of [I13](#4-invariants): `tension` caps at +25%, `contradicted` at −50%, and `consistent` and `untested` cap nothing. Surviving the bench is the absence of evidence against a statement, not evidence for it, so nothing here can raise a confidence. The register and every `goalcheck.md` sit outside the closed world, like `examples.md`; the register travels in every generated `<id>_prompt.md` so the packet is testable outside this repository. `tools/build_dag_site.py --check` fails on a goal with no register, a register with no goal, a malformed entry, an entry naming a node that does not exist, and a `goalcheck.md` with no parsable verdict.\n\n*Why:* a statement can survive three rounds of critique and be wrong about $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$, where the whole answer fits on a page — and it can pass on the group case for reasons that have nothing to do with it, which is worse, because it then looks checked. The register keeps those apart by construction, and the ceiling keeps a cheap pass from ever masquerading as support.\n\n**I25 — A proof step is one claim, and a definition is a display.** A `**Step n — …**` block of a `proof.md` asserts one thing and gives the reason for that one thing ([ADR 0043](decisions/0043-a-proof-step-is-one-claim.html)). Where a write-up coins notation, the defining equation goes in its own `$$ … $$` block with a blank line either side; inline `$…$` refers to a symbol and never introduces one. A write-up that cannot say its steps one at a time inside the [I9](#4-invariants) budget is reporting that its node is several nodes, and `/prove` says so and stops instead of compressing — splitting is the first response to a full page, not the last. The mechanical half is that `tools/check_render.py` no longer counts a line that is only `$$`: the math inside a display still counts, the delimiters that make it a display do not. The writing half is carried in the prover's instructions and read by the critic, because a word count cannot tell a compound claim from a compound sentence and a gate that guessed would reject correct proofs.\n\n*Why:* the four `Q1-L4` write-ups came in at 888, 891, 896 and 896 words against a ceiling of 900. The budget was not nearly missed, it was *filled* — and what filled it was compression, because compressing is local and splitting needs the lead-researcher. One `Step 4` carried six claims, four cited theorems and two parenthetical justifications in a single paragraph; a reader asking which of them fails in characteristic $p$ has to parse the sentence before they can find out. Counting `$$` as a word made it worse by charging two words for every definition pulled out into a display, so the gate that measured length was paying for the density it was built to catch.\n\n\n<a id=\"i26\"></a>\n**I26 — A question states a problem, and never its route.** A question's framing block in `blueprint/main_dag.md` is the optional **Goal.** and **Feeds.** paragraphs and then exactly three bold paragraphs: **Setting.**, **Problem statement.** — the bracket included, since the bracket *is* the problem — and **Conjecture.** ([ADR 0044](decisions/0044-a-question-states-a-problem-not-its-route.html)). There is no *Route status.* paragraph, because route state is stored once in each node's `status:` field and rendered by the generated index block and the site; and no *Versions.* paragraph, because the version label says which claim is on the page and git stores the diffs. Commentary of any other kind goes in the dated entry of the relevant node's `<id>_history.md`, or in an appendix entry when it defines an object. `tools/check_render.py` §10 fails on either paragraph, and on any node or framing that re-coins a symbol an appendix entry owns.\n\n*Why:* Q2's framing had grown to eleven paragraphs, of which three stated the problem and eight commented on it, and the two worst were copies of facts stored elsewhere: Q1's *Route status.* still called `Q1-L4` the weak link after all four of its children had been proved, while the generated index ten lines below it was exact. A copy of a fact that moves is wrong as soon as it is written. The same run found the notation half of the problem — `\\mathcal{C}`, `\\mathcal{A}_X` and the standard objects were being coined in the framing and re-coined in eight node files, with Q1-L2 calling `\\mathcal{A}_X` by the different name `\\mathcal{A}` — so the symbols got appendix entries and the gate now refuses a second definition.\n\n<a id=\"i27\"></a>\n**I27 — A layer is at most ten wide.** A container — a question, or a node with a decomposition — holds at most ten direct children, `MAX_CHILDREN` in `tools/build_dag_site.py` ([ADR 0050](decisions/0050-a-node-has-at-most-ten-children.html)). The remedy for an eleventh is to **group**, never to delete and never to hide behind a fold: a child written to serve one sibling goes *under* that sibling — a lemma an example needs is `<e-node>-L1`, which [ADR 0047](decisions/0047-an-example-node-is-a-proposition.html) made possible — and a family of siblings that share a job gets a node naming the job and becomes its decomposition. Neither move loses a claim; both change which layer it sits in. `/decompose` counts the container before it launches and refuses the eleventh; `--check` emits a **note**, not a failure, for what is already on disk.\n\n*Why:* the cap binds where the growth happens because that is where it is free — nothing is written yet, nothing links the new ids, and the lead-researcher has the whole decomposition in hand. It cannot bind retroactively at the same strength: a node's id is its path ([I12](#4-invariants)), so regrouping renames, and a rename breaks the links an append-only critique ([I4](#4-invariants)) already wrote at the old id. A gate that failed on an inherited shape would stop every proof in the repository over a layout problem, which inverts what the rule is for. `Q1` grew to sixteen children and `Q2` to thirteen before anyone counted, and sixteen tiles on one card admit no order at all — a reader cannot tell the spine from the corroboration, and gets no help from the layout because there is no layout left.\n\n<a id=\"i28\"></a>\n**I28 — A definition inside a statement carries no claim.** Where a `## Statement` coins notation, the coining clause says what the object *is* and asserts no property of it ([ADR 0052](decisions/0052-a-definition-inside-a-statement-carries-no-claim.html)). A property asserted at the point a symbol is introduced is a claim nobody is on the hook for: it is not a numbered clause, so no prover proves it and no critic attacks it; it is not a dependency, so no node carries it; and it is not a hypothesis, so nothing warns that the node stands or falls with it. Every such property becomes one of three things — a clause of the statement, a labelled hypothesis, or a dependency — or it comes out. The rule bites hardest on topological and finiteness properties of objects built by a union, a colimit or an image, which is where the tempting one-word justification lives.\n\n*Why:* [Q1-L3](../nodes/Q1/Q1-L3/index.html)'s setup read \"$LX^{\\mathrm{sat}} := \\bigcup_\\mu m_\\mu(\\ldots)$ is a $K$-stable **closed ind-subscheme** of $LX$\", with the ind-properness of each $m_\\mu$ offered as the reason — and ind-properness makes each image closed and says nothing about their filtered union, as a two-line counterexample shows ([u1](../nodes/Q1/Q1-L3/updates/u1.html)). It survived four days and three operators. `/decompose` wrote it; `/examples` broke the statement into four matchable pieces and folded the closedness into piece (S), then scored the literature against it; a full `/update` walk on 2026-08-05 re-read the node against its appendix entries and recorded it \"examined and unchanged\". Each of those read the numbered clauses for whether they were true. None read the setup that way, because it was punctuated as a definition, and a definition is not the kind of thing that is false. The gate a reader supplies for a clause was never applied to the sentence that mattered most.\n\n<a id=\"i29\"></a>\n**I29 — An unanswered counterexample is named by the gate.** When a node's `examples.md` ends in `EVIDENCE: counterexample` and the node has no `updates/` entry, `tools/build_dag_site.py --check` emits a **note** naming it and asking for `/update <id>`. A counterexample is a refutation of the node's own statement, reported by the pipeline's own operator; the only thing that answers one is a revised statement, so the absence of an `updates/` entry is the exact condition to test. It is a note and not a failure, for [I27](#i27)'s reason: the work it asks for is a `/update` run, and a build that failed until someone did it would stop every unrelated proof in the repository.\n\n*Why:* [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) claimed every coherent Hecke kernel is bounded by a **single** Schubert closure. Its own `/examples` run refuted it — instances 1, 2 and 4 of [examples.md](../nodes/Q1/Q1-L3/Q1-L3-L2/examples.html), verdict `EVIDENCE: counterexample`, with the torus case written out — and the statement then stood unchanged until a user handed the repository an external referee passage saying the same thing. The record had the refutation and the machinery had nowhere to put it: the literature channel scored the node negative ([I13](#4-invariants)), the card went red, and a red card is a number, not an instruction. Nothing distinguished \"nobody has looked\" from \"we looked and it is false\". The note was added by the `/update Q1-L3-L2` run that finally corrected the statement, and on its first run it found a second node in the same condition — [Q1-L5-L3-L1](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L1/index.html), refuted by its own examples and never revised.\n\n<a id=\"i30\"></a>\n**I30 — Importance is derived, and it is the card's width.** A node's importance is $I(v)=\\min(1,\\ 0.40R+0.25A+0.20F+0.15X)$, valued in $[0,1]$ and computed by `tools/build_dag_site.py` from material the repository already stores ([ADR 0058](decisions/0058-importance-is-derived-and-sizes-the-card.html)): **reach** $R$, the transitive `required-by` closure normalized by the largest in the repository; **answer-carrying** $A$, the question's **Problem statement** naming the node at a declared strength of [I15](#4-invariants) — $1$ at *necessary and sufficient*, $0.6$ at one strength alone; **feed-carrying** $F$, a **Feeds.** paragraph naming it; and **citation** $X$, statements of *other* questions' nodes linking it, normalized. The card draws at $\\mathrm{base}\\times(1+I)$, which is why the spine pitch is 540. There is no `importance:` field, for [I13](#4-invariants)'s reason — a stored number is a second copy of facts the node files already carry — and the panel shows one row per channel with the record it scored, exactly as confidence does. It is not confidence and not priority: confidence is the fill, importance the width, [I16](#4-invariants)'s panel the ranking. It never caps or feeds a confidence, and nothing may cite it.\n\n*Why:* every card was 244px wide, which asserts that the nodes are equally load-bearing, and they are not. [Q2-L1](../nodes/Q2/Q2-L1/index.html) is named by [Q2](../dag.html)'s **Problem statement** at *necessary and sufficient* and by its **Feeds.** paragraph as what discharges [Q1](../dag.html)'s criterion — the answer to its own question and the bridge to another one — and it drew exactly like an uncited leaf. Two of the four channels have to read prose rather than edges because [ADR 0039](decisions/0039-one-graph-for-every-question.html) forbids a cross-question `depends-on`, so the **Feeds.** and **Problem statement** paragraphs are the only place those facts are written. The formula was fixed before it was run and ranks `Q2-L1` first at 52% anyway, with [Q1-L4-L1-L1](../nodes/Q1/Q1-L4/Q1-L4-L1/Q1-L4-L1-L1/index.html) third on reach alone — the node `P22` of [priorities](../../blueprint/priorities.md) had independently called the cheapest action in the tree.\n\n**I31 — The z axis is abstraction level, and it is off by default.** `-z<k>` is an id segment like `-L`, `-e` and `-a`, and an abstraction is named after **what it generalizes**: `Q1-L2-z1` is the general statement `Q1-L2` specializes, and `Q1-L2-z2` the general statement *that* specializes ([ADR 0061](decisions/0061-the-z-axis-is-abstraction-level.html), amended by [ADR 0064](decisions/0064-an-abstractions-id-names-what-it-generalizes.html)). So a node's **level** is the number written in the trailing `-z` segment and not the count of segments — under this naming there is only ever one. The id names the relation and does not change it: an abstraction is still not a member of its parent's decomposition, so it is excluded from the parent's sub-lemma count, from [I21](#4-invariants)'s ten-wide cap and from the folding rule, and is drawn wherever its question is. There is no `level:` field, for [I13](#4-invariants)'s reason. A level node carries **`instances:`**, listing the lower-level nodes it states the general case of; the edge has no transpose, because the fact belongs to the general node and the specialized node's own file is untouched by being abstracted — which is the point, since it may be `proved` already. `instances` is **not** `depends-on` and the confidence derivation never follows it: a node does not acquire an unmet obligation by being recognized as a special case of something. `--check` verifies only that each target exists, that it is at a strictly lower level, and that a level node's role is `proof`; an empty `instances` field is a note. The drawing is **2.5D** — each level laid out in its own plane by the same 2D pass, only the planes stacked, the projection oblique so cards stay upright and the base plane undistorted — and at rest a level node is *absent*, not dimmed and not folded, so the flat graph is the drawing it has always been. One button parts the planes, shift-drag gives the two clamped angles, and the reset that clears the zoom clears the tilt. `tools/dag_smoke.js` gates all three: hidden flat, one dashed edge per `instances` entry when tilted, and the flat edge count restored exactly on the way back.\n\n*Why:* thirteen of Q1's thirty-four nodes state something with no $X$, no $G$, no $LX$ and no Hecke action in it, and the graph had no way to draw that. The only relation on offer was `depends-on`, which is wrong twice over: the general statement is not a prerequisite of the special one — the special one is already proved without it — and under [I13](#4-invariants) the edge would have capped a `proved` node's confidence at the new node's, driving a number down for recording a fact about the node's own generality. Full 3D was not on the table either: on a flat screen a 3D node-link drawing buys depth with occlusion and rotated text, and the settled remedy in the graph-drawing literature is to draw each subgraph in its own 2D plane and stack only the planes.\n\n**I32 — A node states its own flaw.** `<id>_node.md` carries a generated block between `BEGIN FLAW` and `END FLAW` markers, written by `tools/build_dag_site.py` and never by hand ([ADR 0062](decisions/0062-a-node-states-its-own-flaw.html)). It sits between the field block and `## Statement`, so a reader meets the defect before the claim, and it holds three things: what is wrong in four words, what to do about it in one clause naming the operator, and **the record's own words** — every standing `FATAL`/`MAJOR` flaw of the last round for a `failing` node, capped at three with a count of the rest; the defect sentence of the supersession for a node revised and not re-proved; the `EVIDENCE:` line with what the example-finder did not find, or the line that says what contradicts the statement. Links inside the quotation are rebased from the record's directory to the node's. The fact is still stored once under [I5](#4-invariants): the critique, `updates/` entry or `examples.md` remains the record and the block is a bounded quotation of it, which is why `--check` fails on a stale or missing block. The block is not a heading, so [I23](#4-invariants) is untouched; the node page renders `<id>_node.md` whole, so it cannot disagree with the file.\n\n*Why:* `status: failing` and a link to `critiques/r2.md` were the whole of what a node file said about what was wrong with it, and neither of those is the defect. [ADR 0055](decisions/0055-a-flag-names-the-record-it-fired-on.html) had already fixed this for the card and the generated prompt; the file every operator reads first was the one readout it had not reached. Thirty-one of a hundred and six nodes had something on record when the block was first built.\n\n**I33 — A statement may not quantify over a notion nothing defines.** A `## Statement` may invoke exactly what [I1](#4-invariants) allows a proof to invoke: an entry of [`blueprint/appendix/`](../appendix/index.html), a notion the statement itself defines, and standard mathematics needing no citation. `tools/build_dag_site.py --check` tests the third condition where an undefined notion shows itself — `\\operatorname{…}`, the construct whose whole job is to name an operator — against `STANDARD_OPERATORS`, and emits a **note** naming any name off that list. The list is deliberately short and `supp` is not on it: a theory of supports on an ind-scheme of infinite type is a theory, not a piece of notation. It is a note and not a failure for [I27](#i27)'s reason — nineteen `\\operatorname{supp}` remain in node statements across the repository, and a build that failed until every one had an entry would stop every unrelated proof.\n\n*Why:* [Q2-L3](../nodes/Q2/Q2-L3/index.html) reached `proved` with three of its four hypotheses quantifying over $\\operatorname{supp}$ and over \"the full subcategory of objects supported on $\\partial\\overline{LX}_\\lambda$\", which no appendix entry defines. Every gate passed it, and correctly: the write-up was valid, because (D)'s support conclusion was (B)'s hypothesis verbatim and (B)'s conclusion was (C)'s left side verbatim, so the argument never had to unfold the symbol. That is the failure mode — a statement can be *proved* while its hypotheses are not yet propositions, and the defect is invisible to a gate that only checks the proof against the statement. The round-1 critic found it by grepping the appendix by hand ([r1](../nodes/Q2/Q2-L3/critiques/r1.html), Flaw 3) and ruled it not the write-up's fault, which was right and left it with nowhere to go. [I28](#4-invariants) is the mirror image of this rule and was not enough on its own: it stops a coining clause from smuggling in a *claim*, while this one stops a statement from resting on a *word*.\n\n**I34 — A superseded literature verdict is silenced, not scored.** `EVIDENCE:` is written by the example-finder alone and never rewritten, because it is an append-only reading of the literature against the statement that was on disk that day ([I8](#4-invariants)). But it is a reading *of a statement*, so when `/update` corrects that statement the verdict no longer measures it. `tools/build_dag_site.py` therefore treats an `EVIDENCE: counterexample` as **answered** when a record under the node's `updates/` names `examples.md` — the update's own words, since [ADR 0019](decisions/0019-the-update-operator.html) requires it to say which record forced the revision — and then the literature channel goes **silent** and the node's flaw block reads *revised and not yet re-proved* instead of *false as written* ([ADR 0065](decisions/0065-a-superseded-verdict-is-silenced-not-scored.html)). Silenced and never credited: a supersession is evidence that the literature no longer says what it used to say about this statement, not evidence that it now supports it. `--check` prints a note asking for `/examples` to be re-run on the current statement.\n\n*Why:* [Q1-L5-L3-L1](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L1/index.html) was corrected by [u1](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L1/updates/u1.html) in exactly the way the counterexample demanded, and its card went on saying **the statement is false as written** and went on charging the literature channel $-1.00$ — against a statement that had answered the objection. This is the same error [I11](#4-invariants) prevents on the mathematical channel, where a revised node is reset to `open` and its old critiques stop counting; the literature channel simply had no equivalent. `--check` already knew — it had been asking for `/update` and testing `not n[\"updates\"]` — so the fact was computed correctly in one place and ignored in the two that scored it.\n\n\n**I35 — A flaw declares its kind, and a referee report is at most 1000 words.** Every flaw in a `critiques/r<n>.md` carries a severity *and* one of eight kinds — `S` statement drift, `F` a step is false, `G` a step has no reason, `H` a hypothesis is unchecked, `M` a source is misread, `W` outside the closed world, `N` a symbol is ambiguous, `B` bookkeeping ([`pipeline/flaws.md`](pipeline/flaws.html)). The kind says **what to do next**, which the severity does not: `W` is a line in a field, `S` is a `diff`, `F` may be a job for `/update` rather than the prover. `tools/stats.py` recomputes the distribution from the reports themselves, preferring the referee's own letter and falling back to a rule list for the 48 reports written before the kind was part of the format.\n\n**Two of the eight are not a referee's job at all** ([I37](#4-invariants)). `S` and `W` are decidable from the files, so the gate computes them before the critic runs and the critic may not fail a round on either. What is left for the referee is `F`, `G`, `H` and `M` — the four that need someone to read the mathematics — with `N` and `B` as the tidy-up.\n\n**I37 — The gate checks the two flaw kinds that are decidable.** `tools/check_render.py` §11 compares a write-up's `## Lemma` against its node's `## Statement` line by line, whitespace-insensitively and skipping a `**Scope.**` paragraph (which declares no hypothesis and no conclusion, and three write-ups omit it by disclosure); and it compares the appendix entries a draft links against the entries the node's `objects:` names. Both are printed as notes and neither fails the gate, on [ADR 0066](decisions/0066-an-undefined-notion-in-a-statement-is-a-gate-note.html)'s precedent — a legacy draft should not turn the repository red — but `/prove` reads them before launching the critic, which is where the saving is: a round that fails on a two-word transcription costs six agents and about 270k tokens, and the check costs under a second.\n\n*Why:* the first run of it found **7 of 32 write-ups proving something other than what their node states**, of which exactly one had ever been caught by a referee. The other six passed. A gate that is cheap and complete beats a reader who is expensive and sampling, on precisely the properties a string comparison can decide — and only on those.\n\nThe cap is 1000 words, reported by `tools/check_render.py` and never failed, because a critique is append-only under [I4](#4-invariants) and the remedy for an over-long one is to write the next one shorter. Three rules make it fit: a MINOR is one sentence; a flaw an earlier round raised is named and linked, never restated; the checks that passed get one line between them.\n\n*Why:* of 341 flaws on disk, 294 are MINOR and a MINOR fails nothing — six flaws in seven change no outcome. The reports grew because length **pays**: on a passing round $D=(e+1)/(e+2)$ over flaws raised, every flaw counts the same whatever its severity, so a node passing with 2 flaws scores 37.5% and one passing with 30 scores 73.4%. Both readings are true at once — a claim that survived thirty attempts to break it *is* better tested — and the second is an incentive to nitpick that nothing was correcting.\n\n**I36 — No operator commits.** The commit stage is deleted from all seven ([ADR 0069](decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)) and nothing replaces it. `git add blueprint/` stages a tree, not a run, so a concurrent session's half-written files went into this run's commit — the named mechanism behind the recurring shared-working-tree hazard. Every fact the commit subject carried is already stored where it belongs: the status in `<id>_node.md`, the verdict in the critique, the revision in `updates/u<n>.md` and the node's history. The commit was a fourth copy, and the one that could not be checked against the other three.\n\n*Why the trade is affordable:* `git log` stops being a per-operation record, and what it carried moves into the run's report and, where the run taught something, into a `process/journal/` entry. What is bought is that an operator writing no history has nothing to collide over, so two runs on two nodes now interfere in exactly one place — the closing build they are meant to share.\n\n**I38 — A run is node-local or repo-wide, and a claim covers a subtree.** `/update <id>` writes inside that node's directory and nowhere else, running §1–§5; `/update` with no argument is the only shape that writes `blueprint/main_dag.md`, a question's node file or `process/`, or launches the lead-researcher ([ADR 0072](decisions/0072-a-run-is-node-local-or-repo-wide.html)). `tools/batch.py claim <id>` locks the whole subtree under `<id>`, and two claims are compatible exactly when neither id is a segment-prefix of the other — `Q1-L3` blocks `Q1-L3-L2` and does not block `Q1-L30` or `Q1-L5`. `tools/batch.py plan <id> …` prints the waves.\n\n*Why the subtree and not the id:* a node's directory contains its children's ([ADR 0059](decisions/0059-a-container-is-a-directory.html)), and the operators read across that containment. `/prove Q1-L3` reads every child's `## Statement` as a dependency while `/update Q1-L3-L2` rewrites one, so an exact-id lock let two sessions race on the same sentence while both reported themselves clear.\n\n**I39 — `/prove` reconciles the statement it just tested, and a superseded write-up is rebuilt and not re-synced.** Every standing flaw of the last round is sorted into four owners — the write-up's, the statement's, the appendix's, the cut's — and the statement-owned ones are acted on in the same invocation, through §2, §4 and §5 of `/update` ([ADR 0072](decisions/0072-a-run-is-node-local-or-repo-wide.html), §3g of the `/prove` skill). The run does **not** re-prove: the cap counts rounds per invocation, and the statement has just changed. `tools/build_dag_site.py` and `check_render.py` §11 both compute supersession from the `## Lemma` vs `## Statement` drift, through one shared comparison, and the gate labels the cause.\n\n*Why the cause has to be labelled:* the two remedies are opposite. Prover drift is fixed by pasting the statement in, and costs no round. Supersession must not be — pasting the new statement over the old leaves the steps proving the old claim under the new heading, which is the same defect with the evidence removed. The flag that should have caught it fired on `updates and status == \"open\"`, and `/update` resets to `open` only from `drafted` or `proved`: twenty-one nodes carried the chip with no write-up at all, and the one node with a superseded write-up was `failing` and carried nothing.\n\n<a id=\"i40\"></a>\n**I40 — An example relates itself to its parent, and a non-example is a finding.** A node with role `example` or `analogy` states its relation to the container its id names — the question for `Q<n>-e<k>`, the parent lemma for `<parent>-e<k>` — and never to the node whose `/examples` run happened to produce it ([ADR 0021](decisions/0021-example-and-analogy-nodes-nest.html), [ADR 0047](decisions/0047-an-example-node-is-a-proposition.html)). Under the goal question it also says, in its own paragraph, which of [the three standing hypotheses](../appendix/assum-intro.html)(a)–(c) hold for its $X$ and on whose authority, so a reader can tell whether the manuscript's theorem applies to the case unconditionally, conditionally or not at all. And an $X$ the statement does **not** reach is promoted like any other: its polarity is `boundary`, it names the hypothesis it violates or the node of the repository that declines to apply to it, and it says outright that it refutes nothing — what it establishes is that covering the case would take a new conjecture, which is a research finding rather than an absence of one. Carried in `/examples` §4b and in the example-finder's instructions, and not mechanically gated: no gate can tell a correct cross-reference from a misdirected one.\n\n*Why:* seven of Q1's question-level examples were promoted out of the `Q1-L1` `/examples` run and kept that lemma as their closing *Speaks to* line — [Q1-e2](../nodes/Q1/Q1-e2/index.html), [Q1-e3](../nodes/Q1/Q1-e3/index.html), [Q1-e4](../nodes/Q1/Q1-e4/index.html) and [Q1-e5](../nodes/Q1/Q1-e5/index.html) verbatim, [Q1-e6](../nodes/Q1/Q1-e6/index.html) alongside the question. The id said the parent was Q1, the prose said Q1-L1, and no edge said either, since an e/a child carries no `depends-on` to its host ([ADR 0018](decisions/0018-example-and-analogy-nodes.html)) — so a reader following the prose landed on a lemma the example neither instantiates nor discharges. The same run, `/update Q1-e*` on 2026-08-07, found that not one of the seven said whether its $X$ is an instance of the main theorem, and that the answer is asymmetric in a way nobody had recorded: [Q1-e2](../nodes/Q1/Q1-e2/index.html) and [Q1-e4](../nodes/Q1/Q1-e4/index.html) have the best-established unramified input (c) of any example in the register and are exactly the two whose placidity hypothesis (a) is contested, by [Q3-L2](../nodes/Q3/Q3-L2/index.html).\n\n**I40 — A node lock covers nodes, and the machinery is not a node.** `tools/batch.py claim` locks a subtree of `blueprint/nodes/`. It says nothing about `tools/`, `process/`, `.claude/`, `blueprint/appendix/` or `blueprint/main_dag.md`, and two sessions editing those collide with no warning from anything. Until a lock covers them, a run that changes shared machinery **re-reads the file immediately before writing and verifies its own change is still present at the end of the run** — an assertion on the pattern it expects, not a diff it eyeballs.\n\n*Why this is an invariant and not a nicety:* on 2026-08-07 a concurrent session rewrote `tools/build_dag_site.py` and silently dropped `lemma_drifted()` and the supersession flag added the same day, while the session that added them held claims on Q1, Q2 and Q3 and believed itself protected. Nothing failed: the builder still ran, the gate still passed, and the flag simply stopped existing. A lock that covers the mathematics and not the tools that check the mathematics is a lock that protects the cheaper half.\n\n**I41 — The ask is a line on the node, and the packet carries it.** A node whose confidence is negative **on its own record** — nothing beneath it weaker, `by == self` in the panel — carries a **`needs:`** field in its `<id>_node.md` ([ADR 0077](decisions/0077-the-ask-is-a-line-on-the-node.html), superseding [0075](decisions/0075-a-negative-node-says-what-would-clear-it.html)). One line, authored, never generated: which missing fact would clear a defect is a mathematical judgement no gate can compute. It names the missing **facts**, sourced where a source is suspected — not the flaws, which the generated flaw block already quotes — and closes with the arithmetic: what a `PASS` on this node alone buys, and what else has to move first. `tools/build_dag_site.py` carries it into `<id>_prompt.md`, and `--check` prints a `NOTE` for an owing node, a second for a line left standing on one that has recovered, and a `PROBLEM` for a retired `<id>_positive.md` still on disk. Written by the `/prove` orchestrator when a round closes `FAIL`, and by `/update` — which is what makes **an `/update` on a node never a no-op**: a run that does not change the statement changes this line, so the reader is always told what the number is waiting on. Outside the closed world, like the prompt that carries it: a request for information, never a premise.\n\n**I42 — A gap is a prompt, and a gapped node is not failing.** A step wanting a fact no appendix entry supplies is written as `blueprint/nodes/<id>/gaps/g<n>.md` — numbered, append-only, and itself a paste-able commission with four required `##` sections (`Statement`, `Where the argument stalls`, `What to deliver` with each item marked `new entry` or `amends <anchor>`, `Rules`), which `tools/build_dag_site.py --check` enforces ([ADR 0076](decisions/0076-a-gap-is-a-prompt.html)). `status: gapped` scores **silent** on the mathematical channel, as `open` does, and is available only when every standing FATAL/MAJOR of the last round is the closed world coming up short; one ordinary defect and the node is `failing`. A node may carry `gaps/` and be `failing` — `Q1-L5-L3-L4` is both. `/prove` §0 scouts the appendix before spending a prover run, because `G` is the largest tagged flaw class and a round costs ~270k tokens; `blueprint_site/gaps/index.html` is the queue, and it exists because gaps batch. Where the missing thing is an appendix entry, the node's `needs:` line ([I41](#4-invariants)) links the gap file rather than restating it.\n\n**I43 — Generalizing is its own operator, and never happens in place.** A verified claim strictly more general than a node becomes a **new** node `<id>-z<k>` through `/generalize <id>`, with the target left standing, unedited, as its specialization ([ADR 0078](decisions/0078-generalize-is-its-own-operator.html)). It was §3 of `/update` and is now a command of its own, because generalizing is not part of revising: a node that is merely narrow is not wrong, so an operator that corrects what is wrong must not reach for abstraction by default, and widening a statement in place silently discards the referee rounds the old one survived. Three tests gate it and all three must pass — strictly more general with the specialization written in **one line**, verified against the appendix and not against the passage that suggested it, and buying either a second instance already in the tree or a step of an existing proof it discharges — and the honest outcome of most invocations is that none of the three does. `instances:` on the new node is the whole edge and has no transpose: it is specialization, not dependency, so the target acquires no obligation, contributes no ceiling, and the abstraction counts against no fan-out cap ([ADR 0064](decisions/0064-an-abstractions-id-names-what-it-generalizes.html)). Only the lead-researcher creates the directory, as for every other node.\n\n**I44 — An operator reads the node summary first.** `<id>_node.md` carries the `## Statement` *and* the generated flaw block, which quotes the record's own words — every standing FATAL/MAJOR of the last round, the defect sentence of a supersession, the `EVIDENCE:` line, the gap commission ([I39](#4-invariants), [ADR 0062](decisions/0062-a-node-states-its-own-flaw.html)). So the critique, the supersession record and `examples.md` are **not** re-read merely to learn what is wrong with a node; that is what the block is for, and re-reading them paid the whole repository's context to recover a paragraph the node file already prints ([ADR 0079](decisions/0079-update-reads-the-node-summary.html)). Four things the summary does not carry, each read only when the run needs it: the **appendix entries** the statement links, which are read *always* by any operator that verifies, because verification is against the entry and never against a paraphrase; the direct neighbours' statements, for propagation; `proof.md`'s `## Lemma` block, when a statement moved under a write-up; and the full records, when the block's quotation genuinely is not enough — in which case the run says so in its report. The generated `<id>_prompt.md` is never read as a source by any of them ([I18](#4-invariants), [ADR 0029](decisions/0029-every-node-has-a-generated-self-contained-prompt.html)).\n\n\n**I45 — Who cites an appendix entry is derived, and the entry does not say.** An entry states its object and nothing about the argument: there is no authored `- **used by:**` line, and `tools/build_dag_site.py --check` fails on one ([ADR 0080](decisions/0080-who-cites-an-entry-is-derived.html)). The citer list is the transpose of the nodes' `objects:` fields, recomputed on every build into the entry page's `used by` panel and stored nowhere — the same rule as confidence and importance ([I13](#4-invariants)), applied to the one authored transpose that had escaped it. So **widening a node's `objects:` is one edit**, a decomposition owes no follow-up pass over the entries its new nodes cite, and two runs on different questions no longer append to the same entry file. The rule replaced a check that reconciled the authored copy against the computation in both directions and had been repaired five times; replayed against the tree the day it was removed, that check was red in 37 places — 31 entries omitting a node that cites them, six still naming a node whose directory is gone. Like every other derived readout the panel is never evidence: nothing may cite it.\n*Why:* every negative node already states **what is wrong**, in the generated flaw block. None stated **what would make it right**, and the two are answered by different people — the first is in the critique and already on disk, the second is usually a fact the repository does not have. [Q1-L3-L2](../nodes/Q1/Q1-L3/Q1-L3-L2/index.html) round 4 ruled the argument sound and the appendix thin and named four specific missing results; those four sentences were the most actionable output of that node's four rounds, and they sat in a critique nothing reads back and no packet carries. The packet is the half that matters: `<id>_prompt.md` is handed to a reader outside this repository, and that reader is precisely the one who could return a numbered result from the literature.\n\n*Why a note and not a failure:* a `/prove` round writes `status: failing` before anyone has decided what the missing fact is. A hard gate would make a failing round unclosable.\n\n**I46 — Tightening is its own operator, its goal is comprehension, and its specification is open.** A write-up is made easier to follow — a reader opens `proof.md` cold, reads it once, and comes away knowing what the node claims and why it holds — by `/tighten <id>`, which rewrites `proof.md` and `examples.md` and nothing else. **It does not run.** `.claude/skills/tighten/SKILL.md` carries the goal and no steps, and an invocation says so and names the operator that is wanted instead ([ADR 0092](decisions/0092-tightens-goal-is-comprehension-and-its-specification-is-open.html), superseding the specification half of [ADR 0083](decisions/0083-tightening-is-its-own-operator.html)). The version that was there measured **word count** under a `## Lemma` block and `**Step n — …**` headlines frozen byte for byte. That freeze was a good gate — mechanical, reading what is on disk, making *shortened a proof* and *lost one* tell apart by `git diff` — and it was gating the wrong thing: shortening is a proxy for comprehensibility and the two come apart in both directions, which is the failure [ADR 0060](decisions/0060-a-write-up-has-two-budgets.html) had already recorded one turn of when a 900-word cap became a target. Four constraints hold on any replacement: it defines comprehensible so that a run can **fail**; it leaves every claim on the page; it lets something **other than the run** check both; and it touches no `## Statement`, `status:` or `needs:`, which are [`/update`](pipeline/operators/update.html)'s. Writing it is the open item of the collaborator's to-do, which has a page of its own at [`todo2.md`](../todo2.html), against the guideline in [`pipeline/writing-a-skill.md`](pipeline/writing-a-skill.html). The run still changes no status, and `/tighten` still comes before [`/decompose`](pipeline/operators/decompose.html).\n\n**I47 — `/why` is its own operator, and the read
