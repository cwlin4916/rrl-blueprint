<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">process</a><i>›</i><span>visualization</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>visualization — the timeline view</h1><p class="lead">Generated from <code>process/visualization.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[repo README](../readme.html) · [pipeline](pipeline.html) · [blueprint index](../dag.html) · [appendix of objects](../appendix/index.html)\n\nThe site renders one snapshot. [`blueprint/main_dag.md`](../dag.html) and the graph page built from it show the DAG as it stands at `HEAD`, and nothing anywhere shows how it got there.\n\nThis file designs the page that does: a scrubbable timeline of the tree's evolution, beside a projection of the node *statements* into a stable coordinate system, so that drift in the formulation is visible as motion.\n\nDesign status: **not built**. This is the design under discussion, kept deliberately small so the first version can ship and be modified.\n\n---\n\n## 1. What the record already contains\n\nThree independent temporal sources exist today, and none of them is rendered.\n\n**Git.** 70 commits over 2026-08-02 → 08-05, with minute-precision timestamps; 42 of them touch `blueprint/nodes/`. 29 carry a machine-parseable `verb(target)` subject — `prove(Q1-L1)`, `decompose(Q1-L4)`, `examples(Q1-a1)` — and several state the outcome verbatim (`proved after 2 rounds, r1-r2`, `EVIDENCE counterexample, 4 instances`).\n\n**The node histories.** 108 dated, typed events across the `<id>_history.md` files, oldest-first and append-only per [ADR 0027](decisions/0027-a-node-carries-its-history.html): 44 `created`, 14 `statement renotated`, 10 `examined and unchanged`, 9 `proved`, 6 `statement revised`, and a long tail of one-offs (`gap recorded`, `evidence swing`, `counterexample recorded`).\n\n**The update records.** 15 files under the nodes' `updates/` directories, each carrying the one machine-readable status transition in the repository — `**Status before → after:**` followed by the old and new value. Written by `/update` per [ADR 0019](decisions/0019-the-update-operator.html).\n\nOf these, git is the only one with sub-day resolution. The histories and update records resolve to four distinct dates, which is why git is the clock and they are the captions.\n\n### Two facts that constrain any implementation\n\n**Renames break naive path history.** Two `R100` mass renames sit in the log: `c49e481` (08-03) moved `blueprint/nodes/<id>.md` into `blueprint/nodes/<id>/`, and `96e557e` (08-05) renamed every `node.md` to `<id>_node.md`. Without `git log --follow -M`, every node appears to have been born on 08-05. `Q1-e7` was additionally `git mv`'d from `Q1-L7`.\n\n**Six commits touch 20 or more node files.** These are the mass renames and the infrastructure passes. They are real renotation events and must not be deleted from the timeline, but a frame that marks all of them as \"changed\" lights up the whole tree and says nothing. They are tagged as sweeps and the page can hide them.\n\n### What the record does *not* contain\n\nA node's `status:` history. The field stores one current value, and past values are recoverable only from the update records' `before → after` lines, the history prose, or `git log -p`. This is by design — one fact, one place — and it is why the timeline reconstructs state from git rather than reading a stored series.\n\n---\n\n## 2. The two views\n\nOne page, two views, one time control shared between them. A node keeps its colour, its size and its label across both, so that it is recognisable when the view changes.\n\n**The tree.** The DAG as it stood at time $t$: nodes appear as they are created, edges as dependencies are declared, colours turning as confidence accrues. This is the view with real dynamics today, since the dominant event in the record is birth.\n\n**The cloud.** A scatter of the same nodes at the same instant, positioned by a projection of their statement text. Motion here is drift in how a claim is formulated; a stationary point is a statement nobody has touched.\n\nBe honest about what the cloud shows at present. Only about twenty events in the record are genuine statement changes, so most points sit still and a handful trace short paths. The machinery is cheap and accrues value with every run, but it is the half that pays off later.\n\n---\n\n## 3. Encodings\n\n**Colour is derived confidence**, the three signed channels of [ADR 0014](decisions/0014-confidence-is-three-signed-channels.html):\n\n$$\nC(v)=\\min\\bigl(\\mathrm{cap}(v),\\ \\tfrac14 H+\\tfrac12 D+\\tfrac14 L\\bigr), \\qquad C(v)\\in[-1,+1]\n$$\n\nevaluated at each frame from the node files as they stood at that revision. The existing hue and tint helpers in the site generator produce the colours, so a node's colour at the last frame is identical to its colour on the graph page — the timeline is not a second palette.\n\n**Size is derived centrality**, how much of the argument would fall with the node:\n\n$$\n\\mathrm{size}(v) = 1 + \\bigl|\\,\\mathrm{reqby}^{*}(v)\\,\\bigr|\n$$\n\nthe transitive closure of the `required-by` relation. A node is **key** when it lies on a longest path from a leaf to the question root, and a key node is drawn with a ring rather than with extra area.\n\nSize is computed **once, at `HEAD`** — not per frame. A node whose radius changes every frame makes the colour signal unreadable, and colour is the thing worth reading. Both quantities are derived from fields already stored, so this adds no schema field and nothing to maintain by hand, per the standing rule that derived facts are never stored.\n\n---\n\n## 4. The pipeline\n\nTwo stages and one artifact between them.\n\nThe repository declares no Python dependencies, deliberately — `tests/run_tests.py` says so, and every tool is stdlib-only. An embedding model breaks that, so the constraint that shapes the whole design is:\n\n> The heavy dependency lives in exactly one script, and that script is not on the gate path.\n\n```\n  git history ──┐\n                ├──→ [1]  timeline builder            ──→  blueprint/timeline.json\n  node files  ──┘        (embedding model, on demand)          │   (tracked, derived)\n                                                               ↓\n                         [2]  tools/build_dag_site.py  ──→  blueprint_site/timeline.html\n                              (stdlib only, every run)       blueprint_site/assets/timeline.js\n```\n\nStage 2 reads the artifact with `json` and nothing else. The site build stays idempotent, `--check` stays green, and a clone rebuilds the whole site with no model and no network.\n\n### Stage 1, in five steps\n\n**Frames.** Walk `git log --reverse -M --follow` over `blueprint/`, one frame per commit touching the node tree, keyed by short hash with an ISO date and `HH:MM`. Parse `verb(target)` from the subject where it is present, and tag the sweep commits.\n\n**State per frame.** Materialise each revision with `git archive <rev> blueprint`, unpack it, and point the generator's existing node parser at the result. This reuses the real field parser, the real critique and evidence readers, and the real confidence derivation — so confidence at time $t$ is the formula, not an approximation of it. No change to the generator is required beyond rebinding its node-directory constant.\n\n**Text.** The node's `## Statement` section verbatim at that revision, deduplicated by `sha256`. A statement that did not change costs nothing.\n\n**Embedding.** A local sentence-transformer model, cached on disk keyed by the hash of the text. Claude Code has no embedding tool and Anthropic publishes no embeddings API, so this is a local model by necessity as well as by preference — it matches the local-first rule of [ADR 0017](decisions/0017-operators-read-the-local-library.html), needs no key, and is free to re-run. The cache holds raw vectors and is not tracked; the projected coordinates are what the artifact carries, which is what makes the page reproducible without the model.\n\n**Projection.** One pooled PCA over every unique statement embedding, fitted once, applied to all of them. See §5 — this is the decision the animation lives or dies by.\n\n### Determinism\n\nThe test suite asserts the site build is idempotent. The artifact must therefore carry no wall-clock timestamp, sort every key, never iterate a set into output, and pin the sign of each principal component by a fixed convention so that re-running the builder reproduces the file byte for byte.\n\n---\n\n## 5. Literature\n\n### Projection stability — the failure mode to design against\n\nReducing each time slice independently is the obvious implementation and the wrong one. Rauber, Falcão and Telea state the problem exactly in [*Visualizing Time-Dependent Data Using Dynamic t-SNE*](https://people.irisa.fr/Guillaume.Gravier/ADM/articles2019/rauber-16.pdf) (EuroVis 2016): doing so \"may introduce unnecessary variability in the resulting sequence of projections, which makes tracking the evolution of the data significantly more challenging.\" Their remedy adds a stability term to the objective, trading projection reliability against temporal coherence.\n\nThe same problem has two other standard answers. `umap-learn` ships [AlignedUMAP](https://umap-learn.readthedocs.io/en/latest/aligned_umap_basic_usage.html), which regularises each slice's layout against its neighbours' — `alignment_window_size` sets how far it looks, `alignment_regularisation` how hard it pulls — and it has been [validated on longitudinal biomedical data](https://www.sciencedirect.com/science/article/pii/S2666389923000818). The diachronic-embedding literature instead rotates: Hamilton, Leskovec and Jurafsky's [*Diachronic Word Embeddings Reveal Statistical Laws of Semantic Change*](https://cs.stanford.edu/people/jure/pubs/diachronic-acl16.pdf) (ACL 2016) applies **orthogonal Procrustes** (Schönemann, 1966) to align consecutive periods, because SVD and skip-gram both determine their spaces only up to an arbitrary orthogonal transform — cosine similarities *within* a slice are unaffected, but nothing can be compared *across* slices until the rotation is undone.\n\n**A single pooled PCA sidesteps all three.** One basis for every frame means there is no per-frame rotation to align, no window size to tune, and no stochastic fit to stabilise. It is also the cheapest thing to implement and the easiest to explain, which is why it is the first version.\n\nThe cost is that a single global basis is a compromise across all time slices, so no individual frame is projected as faithfully as it could be. If the pooled cloud turns out too diffuse to read, AlignedUMAP and Procrustes are the two upgrades in reserve, and the projection's explained variance is displayed on the page precisely so that this failure is visible rather than inferred. Further reading: the [survey of diachronic embeddings and semantic shift](https://aclanthology.org/C18-1117.pdf) and a [quantitative evaluation of time-dependent projection techniques](https://arxiv.org/pdf/2002.07481).\n\n### Animation against small multiples — the counterintuitive result\n\nAnimation is the obvious interface and the evidence is not kind to it. Archambault, Purchase and Pinaud, [*Animation, Small Multiples, and the Effect of Mental Map Preservation in Dynamic Graphs*](https://inria.hal.science/inria-00472423) (TVCG 2011), found **small multiples significantly faster than animation on every one of their five graph-comprehension tasks**.\n\nThe exception is the task this page exists for. Animation was significantly *more accurate* for determining which nodes and which edges were added during a given time slice — which is exactly \"what did this `/prove` run change\". So animation earns its place here on accuracy, not on speed.\n\nThey also found that preserving the mental map had little measurable effect on either error rate or response time, contradicting the expectation the field had held — a result they [pursued further](https://www.sciencedirect.com/science/article/abs/pii/S107158191300102X), and which [later work](https://www.sciencedirect.com/science/article/abs/pii/S0020025515002856) qualified by showing animation does help when drawing stability is low.\n\nThree design consequences follow, all cheap:\n\n1. **The scrubber is the interface; autoplay is a convenience.** Direct manipulation lets the reader do the differencing at their own pace, and it is also far less code than a well-behaved animation loop.\n2. **Ship the filmstrip.** A row of small multiples is the faster read for most questions and costs very little.\n3. **Stabilise the layout anyway** — not because the study demands it, but because a tree whose geometry churns makes the colour channel unreadable. Hence fixed sizes and positions pinned at `HEAD`, with per-frame layout as a toggle.\n\n### Held in reserve\n\nTwo idioms worth knowing about, neither needed yet. Nonuniform timeslicing chooses frame boundaries by [visual complexity](https://arxiv.org/pdf/1907.12015) rather than one-per-commit, which is the right answer if the frame count ever grows unwieldy. And the topic-flow family — ThemeRiver, and Cui and collaborators' [TextFlow](https://cse.hkust.edu.hk/~huamin/cui_infovis11.pdf) (InfoVis 2011) — renders topic birth, merge and split as a braided stream; since splitting is literally what `/decompose` does, that is the natural idiom for a later \"conjecture drift\" ribbon should the point cloud prove too abstract to read.\n\n---\n\n## 6. Rendering\n\nHand-rolled SVG and HTML, generated from a string in the site builder exactly as the graph engine already is. [ADR 0007](decisions/0007-generated-dag-view.html) rejected d3, mermaid and graphviz for the graph, and that reasoning holds here: a range input over some tens of frames is less code than the library that would draw it.\n\nThe tree view reuses the generator's existing layout function on the frame's visible node set, with nodes as HTML cards and edges as SVG paths under one shared pan-and-zoom transform. The cloud view is a scatter of the first two principal coordinates, with a selector for which pair to show and the third mapped to opacity — two dimensions by default, because three projected onto a screen buys occlusion and rotation controls in exchange for very little at this scale.\n\nThe controls are a range scrubber, play and pause, a caption giving the frame's date and commit subject, a filmstrip of small multiples, and a toggle to hide sweep commits. Positions interpolate between frames; sizes never animate.\n\n---\n\n## 7. Deliberately not in the first version\n\nAn LLM-written summary per node revision. Embedding the statement verbatim needs no new generated artifact, no decision record and no model call per revision, and the statement is the thing that actually evolves. If raw statements turn out to cluster by notation rather than by content, summaries are the fix — with their own decision record, because they would be a new generated artifact.\n\nUMAP, dynamic t-SNE and Procrustes alignment. Per-node trajectory trails. Nonuniform timeslicing. A status-transition Sankey over the update records' `before → after` lines. The TextFlow ribbon. Each of these is a response to a specific way the first version might fail, and none of them should be built before that failure is observed.\n\n---\n\n## 8. The repository-wide edit\n\nA page is never just a page here. The gates that will reject this change, and what each requires:\n\n**The tool script list.** `tests/test_tools.py` hardcodes the names of the tool scripts and asserts both directions, so a new script in `tools/` fails as one nobody documents until it is named there and in the docs.\n\n**The site builder.** The page and its asset must be emitted from the builder's `build()` function and registered in its page collector. A page written any other way is neither regenerated nor byte-compared, so `--check` will not notice it going stale.\n\n**The layout tables.** [`README.md`](../readme.html)'s table must name the new tool, and every backticked repository path in the documentation is checked to exist on disk. [`CLAUDE.md`](../../CLAUDE.md) needs this file in its workspace table and a guardrail line saying the artifact is generated, uncitable and not an agent's to write.\n\n**This directory's own indexes.** A bullet in [`README.md`](index.html) here and a classification under its \"which file do I write in?\" section; a subsection in [`pipeline.md`](pipeline.html) §6 and an invariant in §4 saying the artifact is derived from git and never hand-edited; a row in [`decisions/README.md`](decisions/README.html) for the decision record; and one dated entry in [`journal.md`](journal.html).\n\n**Three gates that fail quietly.** I8 forbids anything under `blueprint/` from mentioning the generated site, so the artifact's links must be site-relative and must never contain the site directory's name. The site smoke test runs every page's math through KaTeX with `throwOnError`, so statements must go through the shared renderer and no house macro may appear. The graph smoke test walks anything that looks like a graph page, so the new page's name must keep it out of that walk — or the stub must be extended, rather than the page reshaped to satisfy it.\n\n**`.gitignore`.** The embedding cache holds raw vectors and is not tracked. The artifact is.\n\n---\n\n## 9. Open questions\n\nWhether the pooled projection is legible at all on statements this short and this notation-heavy. The explained variance will answer it, and it is displayed for that reason.\n\nWhether the frame set should be commits or events. Commits are the finer clock and are already structured; the node histories are the more meaningful unit but resolve only to days. The first version uses commits and captions them with the history verbs.\n\nWhether a node's identity survives its own restatement. A statement rewritten wholesale moves a long way in the projection, and there is no principled distinction here between \"the same claim, renotated\" and \"a different claim in the same directory\" — the history distinguishes `statement renotated` from `statement revised`, and using that distinction to style the trajectory is the obvious next step once there is enough of it to look at.\n";</script>
