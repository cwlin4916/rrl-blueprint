<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>process — how this pipeline works</h1><p class="lead">Generated from <code>process/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[repo README](../readme.html) · [blueprint index](../dag.html) · [appendix of objects](../appendix/index.html)\n\n`README.md` at the repo root tells you how to **run** the auto-research pipeline. This directory tells you how it is **designed**:\n\n- **[pipeline.md](pipeline.html)** — the design. The loop, the five agents and their powers, the nineteen invariants that must hold after every step and the failure each one prevents, the node lifecycle, what the pipeline deliberately does not do, and how to extend it.\n- **[operations.md](operations.html)** — the formal layer. The state as a dependently-typed schema over the directory tree; every command as a typed map with a domain and a codomain; the readouts — `/research-status`, the site generator, the gates — separated from the commands, because only a command changes what is true; the laws the state must satisfy after each step; and the operations the pipeline does not yet have. Where `pipeline.md` says what the rules are, this says what they are *statements about*. [operations_v1.md](operations_v1.html) is the superseded flat-schema version, kept for the record.\n- **[journal.md](journal.html)** — the history. One dated entry per step, newest last, saying what changed and why. Append-only: a past entry is corrected by a new one, never rewritten.\n- **[visualization.md](visualization.html)** — the design of the timeline view: what temporal record the repo already carries, how a frame's state is reconstructed from git, why the projection is fitted once over all frames rather than per frame, and what the literature says about animating a growing graph. A design under discussion, not a built page.\n- **[decisions/](../../process/decisions)** — the choices that would be expensive to reverse, one numbered record each, with the alternatives that lost and the costs accepted.\n- **[problem_generation_pipeline.md](problem_generation_pipeline.html)** — the same machine with the mathematics removed, written so it can be instantiated in a repo that has nothing to do with mathematics.\n\nThe rendered site is [`blueprint_site/`](..), generated by `tools/build_dag_site.py` from this directory and from `blueprint/`. Never edit anything in it.\n\n## Which file do I write in?\n\n- A choice you had to *make*, where a reasonable person would have chosen differently → a decision record.\n- Something that *happened* — a run, a finding, a fix → a journal entry.\n- A rule that is now *in force* → an invariant in `pipeline.md`, a law in `operations.md` if it is a statement about types, and, if agents must obey it, the write-discipline paragraph in `../CLAUDE.md`.\n- How a *readout* is meant to look and why — an encoding, a projection, a layout → `visualization.md`. What the readout must *satisfy* is still an invariant in `pipeline.md`; this is the design behind it.\n\nMathematics does not go here. Objects live in [`blueprint/appendix.md`](../appendix/index.html), what is in force lives in [`blueprint/context.md`](../context.html), and claims live in the DAG. The one exception is ADR 0001, which records a *ratified reading* of the manuscript — a decision about mathematics rather than a piece of it, cross-linked from the appendix entry it governs.\n";</script>
