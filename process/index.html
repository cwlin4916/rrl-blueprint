<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">process</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>process — how this pipeline works</h1><p class="lead">Generated from <code>process/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[repo README](../readme.html) · [blueprint index](../dag.html) · [appendix of objects](../appendix/index.html)\n\n`README.md` at the repo root tells you how to **run** the auto-research pipeline. This directory tells you how it is **designed**:\n\n- **[pipeline.md](pipeline.html)** — the design. The loop with all seven operators, the seven actors and their powers, the thirty-six invariants that must hold after every step and the failure each one prevents, the node lifecycle, what the pipeline deliberately does not do, and how to extend it.\n- **[pipeline/](pipeline/index.html)** — the same machine, one file per part, because a 315-line design doc could not say what any single piece *is*. [actors/](pipeline/actors/index.html), seven files: who may write what, and where each stops. [operators/](pipeline/operators/index.html), six files: what each command does, what it costs, and every condition under which it stops — the table that answers *why can I not just run `/prove` and get an updated node*. [flaws.md](pipeline/flaws.html): what a referee report is actually saying, with all 341 flaws on disk classified into eight kinds. [statistics.md](pipeline/statistics.html): what the pipeline has done, counted from the artifacts rather than logged.\n- **[operations.md](operations.html)** — the whole thing on one page, as tables: what exists and who writes it, what each operator does to the state, commands against readouts, the gates, and the eighteen laws with the column saying what enforces each. [archive/operations_v1.md](archive/operations_v1.html) and [archive/operations_v2.md](archive/operations_v2.html) are the superseded flat-schema and dependently-typed versions, kept for the record.\n- **[journal.md](journal.html)** — the history, and the place to start: ten lessons the project paid to learn, then one line per dated entry into [journal/](../../process/journal). [archive/journal_v1.md](archive/journal_v1.html) holds the sixty-nine original entries word for word and [archive/journal_v2.md](archive/journal_v2.html) the single-file phase form, both authoritative when they disagree with an entry ([ADR 0067](decisions/0067-the-journal-is-a-directory.html)). Entries are append-only: correct a past one with new text at its end, never by rewriting it.\n- **[archive/](../../process/archive)** — superseded versions kept for the record, not for reading. A compaction writes a new `journal_v<k>.md` here rather than overwriting the last one.\n- **[review/](../../process/review)** — prompts written for an outside reader: a self-contained description of this machine, handed to someone or something that has never seen the repository, asking what is known about working this way.\n- **[visualization/](visualization/index.html)** — the design of the timeline view: the tree at each of the four dates the node histories resolve to, why the histories are the source rather than git, and what the literature says about animating a growing graph. [visualization/frame1.md](visualization/frame1.html) is the first frame written out node by node and checked against git, so the tool can be built against a known answer. A design under discussion, not a built page.\n- **[decisions/](../../process/decisions)** — the choices that would be expensive to reverse, one numbered record each, with the alternatives that lost and the costs accepted.\n- **[problem_generation_pipeline.md](problem_generation_pipeline.html)** — the same machine with the mathematics removed, written so it can be instantiated in a repo that has nothing to do with mathematics.\n\nThe rendered site is [`blueprint_site/`](..), generated by `tools/build_dag_site.py` from this directory and from `blueprint/`. Never edit anything in it.\n\n## Which file do I write in?\n\n- A choice you had to *make*, where a reasonable person would have chosen differently → a decision record.\n- Something that *happened* — a run, a finding, a fix → a journal entry.\n- A rule that is now *in force* → an invariant in `pipeline.md`, a law in `operations.md`, and, if agents must obey it, the write-discipline paragraph in `../CLAUDE.md`.\n- What one *part* of the machine is — an actor's powers, an operator's stop conditions, what a flaw means → the matching file in `pipeline/`. What must be *true after every step* is still an invariant in `pipeline.md`.\n- How a *readout* is meant to look and why — an encoding, a projection, a layout → `visualization/`. What the readout must *satisfy* is still an invariant in `pipeline.md`; this is the design behind it.\n\n**Vocabulary does not go here either.** What a *node* is, what the *closed world* means, why confidence is derived rather than declared — those live in [`blueprint/concepts/`](../concepts/index.html), one directory per concept, each with a plain-language definition, a real example and its ancestors in the literature ([ADR 0035](decisions/0035-the-concepts-tree.html)). This directory says how the machine is *designed*; that one says what its words *mean*. Send a newcomer there first.\n\nMathematics does not go here. Objects live in [`blueprint/appendix/`](../appendix/index.html), what is in force lives in [`blueprint/context.md`](../context.html), and claims live in the DAG. The one exception is ADR 0001, which records a *ratified reading* of the manuscript — a decision about mathematics rather than a piece of it, cross-linked from the appendix entry it governs.\n";</script>
