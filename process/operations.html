<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><a href="index.html">process</a><i>›</i><span>operations</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>The operation algebra</h1><p class="lead">Generated from <code>process/operations.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[design doc](pipeline.html) · [superseded v1](operations_v1.html) · [domain-independent form](problem_generation_pipeline.html) · [journal](journal.html) · [decisions](../../process/decisions) · [repo README](../readme.html)\n\n`README.md` says how to run the pipeline. [`pipeline.md`](pipeline.html) says how it is built and why. This file says *what each command is*, as a typed map with a domain and a codomain, together with the laws the maps satisfy and the ones they are gated on.\n\n[`operations_v1.md`](operations_v1.html) is kept as the superseded record. Four things changed, and the third is the reason for the rewrite:\n\n1. the types are written **dependently** — $\\mathsf{Draft}(v)$, $\\mathsf{Crit}(v,n)$ — so v1's prose column of cardinality rules becomes part of the type;\n2. the schema carries a **grading**, which makes \"no command writes upward\" a law rather than a convention;\n3. the state is **two components and a bridge**, not one tree — from which the distinction between a fixed-regime step and a regime move follows internally, instead of being imported;\n4. **commands and readouts are separated.** v1 listed `/research-status` and `build_dag_site.py` in one table with `/prove`, which put a map that changes what is true and a map that only looks at it under one heading.\n\nThe idiom is the one Wang–Buehler use for agentic discovery systems (arXiv:2606.01444): a schema of artifact types, a state that is a $\\mathbf{Set}$-valued copresheaf on it, provenance as the category of elements, and discovery as a change of the schema with explicit transport of what was already established. The idiom is theirs; §[5](#5-two-kinds-of-move) argues that the reason it applies to this repo is structural rather than analogical.\n\n---\n\n## 1. The carrier\n\nEvery artifact is a file and every container is a directory, so the first thing to say about the state is that **an artifact's type is its position**. Nothing inside `blueprint/nodes/Q1-L1/critiques/r5.md` announces that it is a critique; it is one because of where it sits. Three things follow, and they are worth separating from what does *not* follow.\n\n- **Identity is the path.** There is exactly one place a given fact can be written, which is what makes [I5](pipeline.html#4-invariants) — every fact stored once — enforceable rather than merely stated.\n- **Deletion is containment.** `rm -rf blueprint/nodes/Q1-L1/` removes the node and everything about it, and nothing else. That is [I9](pipeline.html#4-invariants) as a property of the carrier, and it is why [ADR 0009](decisions/0009-one-tree-per-kind.html) moved critiques inside the node directory rather than leaving them in a parallel tree.\n- **Write discipline is a path prefix.** \"Only the critic writes `nodes/*/critiques/`\" is a glob, so it can be checked without reading a file.\n\n> [!NOTE]\n> **Remark — the tree is the carrier, not the structure.**\n>\n> Nesting is the only relation a directory tree has, and neither of the two relations this pipeline exists to maintain is nesting.\n>\n> `depends-on` runs between nodes that do not contain one another: Q1-L2 depends on Q1-L1, and the two directories are siblings; Q1-L2-L3 depends on Q1-L2-L1, and those two are siblings inside Q1-L2. `objects:` runs from a node or a draft into the appendix: Q1-L1 cites eleven entries and sits inside none of them.\n>\n> So a formalism whose only primitive is containment can say where an artifact lives and can say nothing about what it may assume — and what it may assume is the entire subject. The tree is real and it is load-bearing for identity, deletion and permissions. It is not where the mathematics is.\n\n> [!NOTE]\n> **Remark — the directory tree agrees with the sub-lemma tree, and that is a choice, not a theorem.**\n>\n> `/decompose Q1-L2` writes `blueprint/nodes/Q1-L2/Q1-L2-L1/`, inside its parent. A node's directory is its id split at each `-L`, so the path is recoverable from the id and the two trees agree on the nose.\n>\n> They did not have to. `blueprint/nodes/` was flat until this layout replaced it, and the flat version was chosen for a real reason: ids are never renumbered ([pipeline §8](pipeline.html#8-extending-it)), so a path derived from an id is stable *going forward* — a child created inside its parent never moves — but a layout change applied *retroactively* moves directories that other files already point at. Making the two trees agree cost seven broken links in the appendix, repaired in the same pass.\n>\n> What survives from the flat reading is the part that was about the formalism rather than the layout. Even now that decomposition is an expansion of the directory tree, `/prove`, `/examples` and `/update` also add artifacts, so \"adds a subtree\" does not separate the six commands. And `depends-on` still runs between nodes neither of which contains the other — Q1-L2-L1 is required by its sibling Q1-L2-L3 — while `objects:` still runs out of the tree entirely. The agreement of the two trees is a convenience for humans reading `ls`; it is not what makes the DAG a DAG.\n\n---\n\n## 2. The state\n\n### The types, dependently\n\nLet $S$ be the category of artifact types. Writing it flat — a list of types and a list of maps between them — hides the fact that most of these types are *families*, indexed by the artifact they belong to. Written dependently:\n\n$$\n\\mathsf{Ques}, \\qquad \\mathsf{Node}(q), \\qquad \\mathsf{Stmt}(v),\\ \\ \\mathsf{NodePrompt}(v),\\ \\ \\mathsf{Draft}(v),\\ \\ \\mathsf{Crit}(v,n),\\ \\ \\mathsf{Ex}(v),\\ \\ \\mathsf{Prompt}(v),\\ \\ \\mathsf{Upd}(v,n).\n$$\n\n| Type | Realized by | The family it forms |\n|---|---|---|\n| $\\mathsf{Ques}$ | a question section in [`main_dag.md`](../dag.html), or a seed in [`questions/`](../../blueprint/questions) | a set |\n| $\\mathsf{Node}(q)$ | `blueprint/nodes/<id>/<id>_node.md` | a set for each question $q$ |\n| $\\mathsf{Stmt}(v)$ | the `## Statement` section of `<id>_node.md` | a singleton; its element changes only along `/update`, which leaves a $\\mathsf{Upd}$ seam (L14) |\n| $\\mathsf{NodePrompt}(v)$ | `blueprint/nodes/<id>/node_prompt.md` | a generated singleton for each node, outside the closed world ([ADR 0029](decisions/0029-every-node-has-a-generated-self-contained-prompt.html)) |\n| $\\mathsf{Draft}(v)$ | `blueprint/nodes/<id>/proof.md` | a subsingleton |\n| $\\mathsf{Crit}(v,n)$ | `blueprint/nodes/<id>/critiques/r<n>.md` | one for each $n$ in an initial segment of $\\mathbb{N}$, append-only |\n| $\\mathsf{Ex}(v)$ | `blueprint/nodes/<id>/examples.md` | a subsingleton |\n| $\\mathsf{Prompt}(v)$ | `blueprint/nodes/<id>/prompts/*.md` | a set for each $v$ |\n| $\\mathsf{Upd}(v,n)$ | `blueprint/nodes/<id>/updates/u<n>.md` | one for each $n$ in an initial segment of $\\mathbb{N}$, append-only ([ADR 0019](decisions/0019-the-update-operator.html)) |\n| $\\mathsf{Prio}$ | one row of [`blueprint/priorities.md`](../../blueprint/priorities.md) | a ranked list — `llm` rows rewritten by `/update`, `human` rows the user's alone ([ADR 0020](decisions/0020-the-priority-panel.html)) |\n| $\\mathsf{Obj}$ | one entry of [`appendix.md`](../appendix/index.html) | a set — **not** indexed by a node |\n| $\\mathsf{Ref}$ | an entry of [`papers/guideline.md`](../papers/guideline.html) | a set — **not** indexed by a node, and **not** admissible |\n| $\\mathsf{Page}$ | one file under `blueprint_site/` | one per rendered artifact, generated |\n\nThe morphisms of $S$ are the **display maps** — the projections of a family to its index — together with the citation maps $\\mathsf{Draft}\\to\\mathsf{Obj}$ and $\\mathsf{Node}\\to\\mathsf{Obj}$. The display maps are exactly the directory nesting. The citation maps are exactly what nesting cannot express.\n\nThe gain over a flat table is that v1's *cardinality rule* column stops being prose. \"At most one draft per node\" is the statement that $\\mathsf{Draft}(v)$ is a subsingleton; \"exactly one statement, frozen\" is the statement that $\\mathsf{Stmt}(v)$ is a singleton whose element is constant in $t$. A rule an agent was asked to respect becomes a fact about the type it would have to inhabit.\n\nEvery type in the reasoning tree is now markdown, and the last one to become so was $\\mathsf{Draft}$. The argument for `.tex` was that a draft must compile to a page, and the page was the enforcement of [I9](pipeline.html#4-invariants); the argument against was that it made $\\mathsf{Draft}$ the one type an agent could not read the way it reads every other, and the one place where the *objects are linked, never named* rule was suspended — a `.tex` write-up wrote `\\texttt{def:generation}` and the generator turned it into a link afterwards. Collapsing the two representations into one costs the page count, replaced by a word budget, and buys two things: the closed world a proof declares is now a list of live links a referee can follow, and the schema has one fewer distinction in it. See [ADR 0011](decisions/0011-write-ups-in-markdown.html).\n\nWhat survives of the old argument is the reason $\\mathsf{Ref}$ sits outside the node families and carries no map into $\\mathsf{Draft}$: a reference is something read, not something citable, and the closed world is unchanged by anything in `papers/`.\n\n### The state, and the commit as a time index\n\nA **state** is a copresheaf\n\n$$\nI_t : S \\longrightarrow \\mathbf{Set},\n$$\n\nwhere $I_t(\\mathsf{A})$ is the set of artifacts of type $\\mathsf{A}$ in the working tree and $t$ is a commit. The repo *is* the state; there is no store outside it. The realized provenance graph is the category of elements $\\int_S I_t$: objects are pairs $(\\mathsf{A},x)$ with $x\\in I_t(\\mathsf{A})$, and a morphism $(\\mathsf{A},x)\\to(\\mathsf{B},y)$ is a structural map $f$ with $I_t(f)(x)=y$. The lemma DAG is the full subgraph on $\\mathsf{Node}$, and `blueprint_site/dag.html` draws it.\n\n> [!NOTE]\n> **Remark — the schema and the filesystem are one object seen from two sides.**\n>\n> Let $\\pi : \\int_S I_t \\to S$ be the projection sending an artifact to its type. It is a discrete fibration. Its base is the hierarchy of types; its total space is the tree on disk; the fibre over $\\mathsf{Node}$ is the eleven node directories.\n>\n> \"Is the state a schema of types, or is it a directory tree?\" is therefore not a choice between two formalisms. It is the base and the total space of one map, and asking which is more fundamental is asking whether a fibration is its base or its total space.\n>\n> What the dependent presentation adds is that the indexing is written down. In the flat reading the tree is recoverable but invisible; in this one, the path *is* the telescope, and `nodes/Q1-L1/critiques/r5.md` is literally the term of type $\\mathsf{Crit}(\\text{Q1-L1}, 5)$.\n\nLet $K$ be the category of states, with a morphism $\\alpha : I \\to J$ a **refinement**: componentwise injective on artifact identity, so a step may add, annotate or supersede an artifact but may never silently merge two accepted ones. Identity is the `<id>` for a node and the anchor for an appendix entry — a status change supersedes the record and keeps the identity, which is why it is a refinement and not a rewrite.\n\n### The grading\n\nSet $\\deg(\\mathsf{Ques}) = 0$, $\\deg(\\mathsf{Node}) = 1$, and $\\deg = 2$ on $\\mathsf{Stmt}$, $\\mathsf{NodePrompt}$, $\\mathsf{Draft}$, $\\mathsf{Crit}$, $\\mathsf{Ex}$, $\\mathsf{Prompt}$ and $\\mathsf{Upd}$. Every display map strictly decreases degree, so $S$ is a direct category and containment is well-founded — there is no artifact that contains itself at one remove, and the state can be built one degree at a time.\n\nThe law this buys is one v1 had no way to state:\n\n**No command writes upward.** A command applied to an artifact $x$ of degree $d$ may *create* only at degree strictly greater than $d$, inside $x$'s own fibre, and may *update* only fields of $x$ itself.\n\n- `/prove v` takes $v : \\mathsf{Node}$ at degree 1; creates $\\mathsf{Draft}(v)$ and $\\mathsf{Crit}(v,n)$ at degree 2; updates the `status` field of $v$.\n- `/examples v` creates $\\mathsf{Ex}(v)$ or $\\mathsf{Prompt}(v)$ at degree 2; updates nothing.\n- `/decompose v` creates nodes at degree 1 and updates $v$'s `depends-on` and `## Decomposition` — the one command whose creation is at its input's own degree, which is exactly the sense in which decomposition is sideways rather than downward.\n- `/update v` creates $\\mathsf{Upd}(v,n)$ at degree 2 and updates the `status` field of $v$ — and it is the one command licensed to **replace** the element of the degree-2 singleton $\\mathsf{Stmt}(v)$; L14 is the licence and its terms.\n\nThis is the type-level form of \"subagents produce artifacts; only the orchestrator changes the record of what is true\". The single exception is the appendix, and the exception is the whole of §[5](#5-two-kinds-of-move).\n\n### Two components and one bridge\n\n$\\mathsf{Obj}$ has no display map into $\\mathsf{Node}$. `appendix.md` is a single file at the root of `blueprint/`, its entries addressed by anchor, and an entry belongs to no node — `def:generation` is cited by Q1-L1 and is not part of it. So $\\int_S I_t$ is not one forest. It is two components joined by a relation that is not containment:\n\n- the **node forest** — each question, the nodes under it, and under each node its statement, generated self-contained prompt, draft, critiques, examples, open prompts and update records;\n- the **appendix** — flat, a set of entries with no index;\n- the **citation relation** $\\mathrm{cites} \\subseteq (\\mathsf{Node} + \\mathsf{Draft}) \\times \\mathsf{Obj}$, which is the only bridge between them.\n\nEverything in §[5](#5-two-kinds-of-move) follows from this picture. The appendix is the only component a command can widen without touching a node, and it is the component the closed-world law quantifies over.\n\n### The closed world\n\nWrite $A_t := I_t(\\mathsf{Obj})$ for the appendix at time $t$. The premises a draft for node $v$ may invoke are\n\n$$\n\\mathrm{adm}_t(v) \\;=\\; A_t \\;\\cup\\; \\mathrm{deps}(v) \\;\\cup\\; S_{\\mathrm{std}},\n$$\n\nwith $S_{\\mathrm{std}}$ standard mathematics needing no citation. Nothing else, which is invariant [I1](pipeline.html#4-invariants).\n\nIn the dependent reading this is not a side condition but the context in which $\\mathsf{Draft}(v)$ is well-formed at all. A draft is not merely a file sitting under $v$; it is a term whose type depends on the ambient vocabulary $\\mathrm{adm}_t(v)$. That is precisely why widening the vocabulary is a change of context rather than an addition to the state, and why the two look identical from inside the directory tree and are not the same move.\n\n---\n\n## 3. The commands\n\nA command is a **partial** map on states, defined only where its guard holds, and it is the only kind of operation that changes what is true. There are six. Everything else the pipeline runs is a readout (§[4](#4-readouts)).\n\nTwo signatures are worth separating, and confusing them is the usual source of muddle:\n\n- the **type signature**, $\\mathsf{A} \\rightsquigarrow \\mathsf{B}$, saying what kind of artifact goes in and what kind comes out — this is the answer to \"domain and codomain\";\n- the **state action**, $\\Phi_c : \\operatorname{Obj}(K) \\to \\operatorname{Obj}(K)$, saying how the whole repo changes.\n\nA command that returns a set of artifacts has $\\mathcal{P}(-)$ in its codomain. A command whose output is not determined by its input — every one of the six, since each has a language model in the body — is written $\\rightsquigarrow$ rather than $\\to$; see §[7](#7-what-is-not-a-function).\n\n| Command | Type signature | Guard (refuses otherwise) | State action |\n|---|---|---|---|\n| `/decompose \"<question>\"` | $\\mathsf{Ques} \\rightsquigarrow \\mathcal{P}(\\mathsf{Node}) \\times \\mathcal{P}(\\mathsf{Obj})$ | context and appendix exist and are non-trivial | adds a question section, $n$ node directories, and any new appendix entries |\n| `/decompose <node-id>` | $\\mathsf{Node} \\rightsquigarrow \\mathcal{P}(\\mathsf{Node}) \\times \\mathcal{P}(\\mathsf{Obj})$ | the node exists; if `proved`, asks first | adds sub-lemmas `<p>-L1`, `<p>-L2`, …; extends the parent's `depends-on`; writes the parent's `## Decomposition`; **fixes** the parent's $\\mathsf{Stmt}$ |\n| `/prove <node-id>` | $\\mathsf{Node} \\rightsquigarrow \\mathsf{Draft} \\times \\mathsf{Crit}^{\\le 3}$ | every dependency is `proved`; the node is not already `proved` | writes one draft, one to three critiques, and one status |\n| `/examples <node-id>` | $\\mathsf{Node} \\rightsquigarrow (\\mathsf{Ex} + \\mathsf{Prompt}) \\times \\mathcal{P}(\\mathsf{Ref})$ | the node exists; asks first if it already has one | adds exactly one of `examples.md`, `prompts/examples.md`, and appends to the reading list |\n| `/update [target] [input]` | $(\\mathsf{Ques} + \\mathsf{Node}) \\times \\mathsf{Input}^{?} \\rightsquigarrow \\mathsf{Stmt}' \\times \\mathcal{P}(\\mathsf{Upd}) \\times \\mathcal{P}(\\mathsf{Node})_{\\text{lead}} \\times \\mathsf{Prio}$ | target exists; an external input is independently verified before any claim of it is adopted; a node proposal carries its justification before it is commissioned | revises question framing and node statements — each supersession recorded as $\\mathsf{Upd}(v,n)$, a revised `drafted`/`proved` status reset to `open`, the commit disclosing it — runs the failure audit and hands justified node proposals to the lead-researcher to materialize ([ADR 0022](decisions/0022-update-proposes-nodes-from-failures.html); the $\\mathcal{P}(\\mathsf{Node})$ factor is created by that one writer, never by the operator) — and rewrites the `llm` rows of the priorities file |\n\nRead the third column as the domain restriction. `/prove` is not defined on a blocked node; the DAG gate is that partiality, made to fail loudly instead of silently producing something.\n\n> [!NOTE]\n> **Remark — why a command is not a morphism of trees.**\n>\n> Reading a command as a map of directory trees fails to separate it from any other command. `/prove` injects a subtree — a `proof.md` and a critique under an existing node. `/examples` injects a subtree. `/decompose` injects a subtree, and since sub-lemma directories nest, it injects one in the most literal sense available. All of them are injections of forests, so the reading assigns them all the same type, and the distinctions the pipeline is built on disappear.\n>\n> What separates them is which of three sets grows.\n>\n> | What grows | Commands | Can it invalidate an existing proof? |\n> |---|---|---|\n> | artifacts under an existing node | `/prove`, `/examples` | no |\n> | nodes, and edges of `depends-on` | `/decompose` | no |\n> | the appendix — the admissible vocabulary | `/decompose` only | **yes, if an entry narrows** |\n>\n> \"By expansion or not\" is therefore the wrong axis to cut on: every command expands the tree. The axis that predicts something is whether the move stays inside $S$ or changes $S$, which is §[5](#5-two-kinds-of-move).\n\nTwo entries deserve unpacking.\n\n**`/decompose` has a coproduct domain.** Its domain is $\\mathsf{Ques} \\sqcup \\mathsf{Node}$, and in the dependent reading the two summands extend different contexts. On $\\mathsf{Ques}$ it extends the root: a new $q$ together with a family $\\mathsf{Node}(q)$. On $\\mathsf{Node}$ it adds elements to the family $\\mathsf{Node}(q)$ that $v$ already belongs to, plus `depends-on` edges into $v$ — siblings in the carrier, children in the DAG. The command dispatches on which summand the argument lies in, and asks when the argument is ambiguous (a bare `Q1` is in both). The codomain is the same on both summands, which is what makes \"decompose\" one word rather than two.\n\n**`/examples` lands in a coproduct, and that is the safety property.** *Found an example* and *recorded that none was found* are two branches of one total map, $\\mathsf{Ex} + \\mathsf{Prompt}$, and writing a good prompt is real work. An operation whose only success branch is \"found one\" makes inventing one the path of least resistance; this one does not have that shape. `/check` used to carry this branch as a second job — it was $\\mathsf{Md} \\to \\mathsf{Md}$ *and* $\\mathsf{Node} \\rightsquigarrow \\mathsf{Ex} + \\mathsf{Prompt}$, two maps sharing a name — and splitting them is what makes each a single arrow. That endomap on markdown, constrained to be the identity on content (§[6](#6-laws), L9), is no longer an arrow of its own: it is the presentation pass that ends each of the four writing commands ([ADR 0031](decisions/0031-presentation-is-a-stage-not-a-command.html)).\n\n---\n\n## 4. Readouts\n\nNot everything the pipeline runs is a command, and v1's single table obscured the difference. A **readout** is a map out of the state\n\n$$\nR : K \\longrightarrow X\n$$\n\nwhose value the state does not depend on. The operational test is deletion: **delete a readout's output and recompute it, and nothing has been lost.** Delete a critique and evidence is gone; delete every `node_prompt.md` and `blueprint_site/` and one command restores them byte-for-byte ([I8](pipeline.html#4-invariants), [I18](pipeline.html#4-invariants)). That is the whole distinction, and it is why these belong in their own section rather than in a row beside `/prove`.\n\n| Readout | Signature | Where the value goes | Cost of deleting the output |\n|---|---|---|---|\n| `/research-status` | $I_t \\to \\mathsf{Report}$ | nowhere in the tree — it is printed | nothing; it was never written down |\n| `build_dag_site.py` | $I_t \\to I_t(\\mathsf{NodePrompt})\\times I_t(\\mathsf{Page})$ | each node's `node_prompt.md` and `blueprint_site/`; neither is authoritative | one rebuild |\n| `check_render.py`, `--check` | $I_t \\to \\{\\textsf{PASS},\\textsf{FAIL}\\}$ | exit code | nothing |\n\n**A readout must be a function of the state.** This is the one law readouts carry that commands do not (§[6](#6-laws), L13), and it is the reason the generator is checkable at all: `build_dag_site.py --check` regenerates every prompt and page in memory and compares them with disk. That is literally a test that the readout is a function of $I_t$ and of nothing else — a stale-prompt or `STALE` page report means the state moved and the value did not.\n\n`/research-status` is the honest exception, and it is worth naming rather than smoothing over. Its tallies are a function of $I_t$; its *suggested next action* is model output and is not. The suggestion is therefore advice and not a record — which is exactly why it is printed and never written into a node.\n\n> [!NOTE]\n> **Remark — the generator is the closest thing here to an endomap of the state.**\n>\n> `build_dag_site.py` has signature $K \\to K$: a repo goes in and a repo comes out. It is idempotent, and the components it writes ($\\mathsf{NodePrompt}$ and $\\mathsf{Page}$) are disjoint from every authoritative component it reads. So it is a *retraction* onto generated components, not an endomorphism of the schema.\n>\n> This is the second place the intuition \"the operations are maps $S \\to S$\" points, and the second place it lands somewhere other than $S$. The first is the schema extension $u$ of §[5](#5-two-kinds-of-move) — see the remark below on the three maps that get run together.\n\n### The gates\n\nA gate is a predicate on an artifact, run by the orchestrator and never by the agent that produced the input.\n\n$$\nV_{\\text{gate}} : \\mathsf{A} \\longrightarrow \\{\\textsf{PASS}, \\textsf{FAIL}\\}\n$$\n\n| Gate | Domain | Fails on |\n|---|---|---|\n| DAG | $\\mathsf{Node}$ | a dependency that is not `proved`; a node already `proved` |\n| syntax | $\\mathsf{Draft}$ | markdown math, fences or links failing the render gate |\n| page | $\\mathsf{Draft}$ | the write-up exceeding the 900-word one-page budget |\n| critic | $\\mathsf{Draft} \\times \\mathsf{Stmt} \\times \\mathrm{adm}(v)$ | one flaw rated FATAL or MAJOR |\n| render | $\\mathcal{P}(\\mathsf{Md}) \\times \\mathcal{P}(\\mathsf{Draft}) \\times \\mathcal{P}(\\mathsf{Page})$ | any of eight layers |\n| consistency | $I_t$ | the state disagrees with itself, or a generated prompt or site page is stale |\n| content-preservation | a git diff | a changed status, verdict or anchor; a display line that vanished |\n| example | $\\mathsf{Ex}$ | a bib key not in `refs.bib`; a source with no resolvable identifier |\n\nA gate is a readout by the same test — re-run the compile gate on an unchanged draft and it must give the same answer. What makes a `/prove` run a command is therefore not the gate but the *write*: the orchestrator recording the gate's value into the node's `status`. Separating the two is worth the words, because the gate can be replayed at any time and the write cannot be re-derived once the draft has moved on.\n\nThe critic gate is the one with an interesting domain: it takes the draft **and** the statement **and** the admissible set, and it has no write access to any of the three. That is the type-level statement of the single most load-bearing configuration choice in the repo.\n\n### The three maps that get run together\n\n> [!NOTE]\n> **Remark — only one map in the pipeline is an endomap of $S$.**\n>\n> $I_t : S \\to \\mathbf{Set}$, the state, is not one: it sends a *type* to the *set of its instances*, and a set of instances is not a type.\n>\n> $\\Phi_c : K \\to K$, a command, is an endomap — of states, not of the schema. So is `build_dag_site.py`, which is why the remark above calls it a retraction rather than promoting it.\n>\n> $u : S_{A_t} \\to S_{A_{t+1}}$, a schema extension, is the only map from the type hierarchy to itself, and exactly one operation produces one: `/decompose` writing an appendix entry.\n>\n> All three are easy to run together, because all three are \"maps on $S$-ish things\". The distinction that pays: the only operation that changes what is *sayable* is the only operation that can invalidate a proof already written.\n\n---\n\n## 5. Two kinds of move\n\nThe distinction between search inside a regime and a change of regime is not imported here as an analogy. It is forced by §[2](#2-the-state): the appendix is a separate component of $\\int_S I_t$, and the closed-world condition quantifies over exactly that component. A move that touches it is doing something to the *context* every draft is typed in; a move that does not is adding artifacts to a context that already exists.\n\n**Fixed-regime updates.** `/prove` and `/examples`, and the presentation pass ending each command, leave $S$ and $A_t$ alone. They add artifacts inhabiting types that already exist, over a closed world that already exists. Every such step is a refinement $\\delta_t : I_t \\hookrightarrow I_{t+1}$, and no existing artifact changes meaning. Iterating them can never produce an artifact of a type outside $S$ — which is the precise form of \"the pipeline does not decide what is worth asking\".\n\n**Regime moves.** `/decompose` is the only command that enlarges the closed world, by writing new appendix entries. That is a schema extension\n\n$$\nu : S_{A_t} \\longrightarrow S_{A_{t+1}},\n$$\n\nand the question that matters is whether $u$ is fully faithful.\n\n- **Adding an entry** is fully faithful. Nothing already in $A_t$ changes, so transporting the old state along $u$ returns it unchanged, and **every existing proof remains valid**. Widening a node's `objects:` to close a critic's complaint is this case, which is why the `/prove` loop is allowed to do it mid-round.\n- **Narrowing an entry** — a ratified reading that fixes a meaning the entry left open — is *not*. Old drafts were written against the looser reading, so transport does not preserve them and **they must be re-refereed**.\n\nThe repo has run the second case exactly once. [ADR 0001](decisions/0001-satake-generation-ambient-category.html) ratified the ambient category for the generation operation in the Satake entry; the affected node was re-opened and re-proved, and its critique directory holds `r1`–`r5` in one sequence rather than two directories of three. The append-only numbering rule ([I4](pipeline.html#4-invariants)) exists precisely so that a non-fully-faithful regime move leaves a visible seam. **Every ratification is a candidate re-proof, and the entry — not the node that ratified it — is where the reading has to live**, or a later node reads the old meaning.\n\n---\n\n## 6. Laws\n\nEach law is an equation the state must satisfy after every command, the invariant it realizes, and what enforces it. A law with no enforcement is a suggestion; the last column is the difference.\n\n| | Law | Invariant | Enforced by |\n|---|---|---|---|\n| L1 | $\\mathrm{stmt}\\circ\\Phi_{\\texttt{/decompose}\\ \\mathsf{Node}} = \\mathrm{stmt}$ on pre-existing nodes | I2 statements frozen | `git diff` on the parent's `## Statement` must be empty |\n| L2 | $\\mathrm{cites}(\\mathrm{draft}(v)) \\subseteq \\mathrm{adm}_t(v)$ | I1 closed world | the critic, reading the appendix and nothing else |\n| L3 | $\\mathrm{reqby} = \\mathrm{deps}^{\\mathsf{T}}$ | consistency | `build_dag_site.py --check` |\n| L4 | $\\mathrm{ready},\\ \\mathrm{blocked}$ are functions of $(\\mathrm{status},\\mathrm{deps})$, not components of $I_t$ | I5 stored once | no field exists to write them into |\n| L5 | the round map $\\mathsf{Crit}\\to\\mathbb{N}$ is injective and strictly increasing in $t$ | I4 append-only | the next free number, never the next number |\n| L6 | $\\mathrm{words}(\\mathrm{draft}(v)) \\le 900$ | I9 one page | the write-up layer of `check_render.py` |\n| L7 | $\\mathrm{gen}\\circ\\mathrm{gen} = \\mathrm{gen}$, and $\\mathrm{gen}$ reads neither $I_t(\\mathsf{NodePrompt})$ nor $I_t(\\mathsf{Page})$ | I8 nothing read from a generated artifact | deleting both generated components and rebuilding reproduces them byte-for-byte |\n| L8 | $\\operatorname{Hom}_S(\\mathsf{Ex},\\ \\mathsf{Draft}) = \\varnothing$ | I10 examples never justify | there is no field to put it in |\n| L9 | the presentation pass of every command is the identity on every frozen field and on display-math content | content preservation | an orchestrator-run diff, not the checker's word |\n| L10 | the page map $\\mathsf{A}\\to\\mathsf{Page}$ is total on citable types and injective | I11 every cited thing has a page | the link layer of the render gate |\n| L11 | $\\deg$ strictly decreases along display maps, and $\\Phi_c$ creates only at degree $>\\deg(\\text{input})$ | no upward write | there is no path to write to |\n| L12 | $\\mathrm{cites}$ is the only relation between the node forest and the appendix; $\\operatorname{Hom}_S(\\mathsf{Obj},\\mathsf{Node}) = \\varnothing$ | the appendix is a shared vocabulary, not a node's property | one file, entries addressed by anchor; there is no per-node appendix |\n| L13 | every readout is a function of $I_t$ alone | a readout can be deleted and recomputed | `build_dag_site.py --check` regenerates prompts and pages in memory and compares |\n| L14 | $\\mathsf{Stmt}(v)$ changes only along $\\Phi_{\\texttt{/update}}$, which creates $\\mathsf{Upd}(v,n)$, resets a `drafted`/`proved` status to `open`, and discloses the change in the commit | I15 supersession leaves a seam | the L1 history walk (disclosed-or-forbidden), and the update file as the operator's recorded contract |\n| L15 | the priority panel is stored judgements $\\oplus$ derived warnings; the derived half is a function of $I_t$ and is stored nowhere; `human` rows are written by no agent | I16 | `build_dag_site.py` re-derives at every build and `--check` parses the stored rows rather than trusting them |\n| L16 | $\\Phi_c$ factors as $\\mathrm{gen} \\circ \\Phi_c'$ for every command and readout $c$ — neither $I_t(\\mathsf{NodePrompt})$ nor $I_t(\\mathsf{Page})$ is older than the state displayed | I17–I18 readouts never stale | the closing block of every SKILL.md, and the staleness half of `--check` |\n\n**L8 is the payoff of writing this down.** \"Examples illustrate, never justify\" was a rule four documents had to repeat and an agent had to be trusted to follow. As a statement about the schema it is a hom-set that is empty: there is no morphism from an example into a draft, so the question of whether an agent will respect the rule does not arise. The same reading applies to the manuscript — the pipeline has no operation whose codomain is `main.tex`, which is why \"it does not touch the manuscript\" needs no gate.\n\n**L7 and L13 are one law at two altitudes.** L13 says every readout is determined by the state; L7 says the generator additionally reads none of its own output, which is the clause that makes both prompt packets and `blueprint_site/` replaceable rather than merely reproducible. Any workflow that wants a fact from a generated readout is misdesigned, and the fact belongs in a canonical node, question, dependency, appendix entry or bibliography record.\n\n**L11 and L12 are the same observation twice.** L11 says the node forest cannot be written into from below; L12 says the appendix cannot be reached from a node except by citing it. Together they say a node can only ever *acquire* vocabulary, never own it — which is what makes §[5](#5-two-kinds-of-move)'s re-proof rule predictable rather than a judgement call.\n\n---\n\n## 7. What is not a function\n\nAll six commands have a language model in the body, and the same input does not give the same output. Writing $\\rightsquigarrow$ for those is not decoration.\n\nThe honest signature is a Kleisli arrow $\\mathsf{A} \\to \\mathcal{P}(\\mathsf{B})$ into the *set of outputs the command might commit*. Determinism is recovered one level up, and only where it is needed: the gates are genuine predicates (§[4](#4-readouts)), so while $\\mathrm{draft}(v)$ is not a function of $v$, the composite\n\n$$\nV_{\\text{compile}}\\wedge V_{\\text{page}}\\wedge V_{\\text{critic}} \\;\\circ\\; \\mathrm{draft}\n$$\n\nis a predicate whose value is recorded and auditable whatever the draft happened to be. **The artifact is not reproducible; the judgement on it is on the record.** That is the whole claim the pipeline makes, and stating it in this form is also stating its limit: `VERDICT: PASS` is a referee report, not a machine-checked proof, and no amount of typing changes that.\n\nThis is the cleanest reason to separate commands from readouts. Commands are the non-deterministic half and readouts are the deterministic half, so the pipeline's trustworthiness reduces to a question about readouts alone: is every gate a function of the artifact it reads? A readout that drifted would make the record meaningless in a way no amount of care in the commands could repair.\n\nThe round cap is the other half. Three rounds per invocation is a *diagnostic* bound, not a probability of success: a node that fails three times is evidence about $\\mathsf{Stmt}$, usually a missing appendix entry or a decomposition that skipped a step.\n\n---\n\n## 8. Unfilled hom-sets\n\nFour operations are absent. Two deliberately, two not — and the table is the point of the exercise, because \"what command am I missing?\" is a question about the schema rather than about the interface.\n\n| Wanted | Signature | Status |\n|---|---|---|\n| branch a **new question** off a lemma | $\\mathsf{Node} \\to \\mathsf{Ques}$ | **missing.** Today: write `blueprint/questions/<slug>.md` by hand, then `/decompose` it. Nothing records that the question came from that node, so the provenance edge is lost |\n| supersede a node's statement | $\\mathsf{Node} \\to \\mathsf{Node}$ | **filled by `/update`** ([ADR 0019](decisions/0019-the-update-operator.html)): supersession with an explicit seam — $\\mathsf{Upd}(v,n)$, a disclosed commit, a status reset. *Retiring* a node (removing it and everything on it) remains missing, deliberately: deletion of accepted artifacts is a human move |\n| retire an appendix entry | $\\mathsf{Obj} \\to \\mathbf{1}$ | **missing**, and harder than it looks: it is a regime move that is not fully faithful (§[5](#5-two-kinds-of-move)), so every draft citing the entry must be re-refereed |\n| write into the manuscript | $\\mathsf{Draft} \\to \\texttt{main.tex}$ | **deliberately empty** (L8). A human moves it, or it does not move |\n\nThe first is the one to build next, and the grading says why it has not been built. A map $\\mathsf{Node} \\to \\mathsf{Ques}$ runs from degree 1 to degree 0 — it is the one operation that would have to write *upward*, which L11 forbids of every command now in the pipeline. So the work is not writing the command; it is deciding what the edge is. It cannot be a display map, because a question is not contained in the lemma that raised it. It has to be a new relation\n\n$$\n\\mathrm{raised\\text{-}by} \\;\\subseteq\\; \\mathsf{Ques} \\times \\mathsf{Node},\n$$\n\na second bridge alongside $\\mathrm{cites}$, stored on the question and transposed onto the node the way `required-by` is transposed from `depends-on` (L3). `/decompose Q1-L1` refines a lemma downward; there is no command for the sideways move, where working on a lemma raises a question the lemma does not answer. The seed directory exists and the workflow exists; what is missing is the edge back to the node that raised it.\n\n---\n\n## 9. Where this leaves the design docs\n\n| File | Answers |\n|---|---|\n| [`README.md`](../readme.html) | how do I run it |\n| [`pipeline.md`](pipeline.html) | how is it built, and what went wrong without each rule |\n| this file | what is each operation, formally, and what is missing |\n| [`operations_v1.md`](operations_v1.html) | the flat-schema version, superseded, kept for the record |\n| [`problem_generation_pipeline.md`](problem_generation_pipeline.html) | how do I instantiate the same machine in a repo that is not about mathematics |\n\nIf they ever disagree, `pipeline.md` wins on behaviour and this file wins on types — because a type claim here that the behaviour contradicts is a defect in the pipeline, not in the description.\n";</script>
