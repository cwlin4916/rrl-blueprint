<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">process</a><i>›</i><span>operations</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>The operations, as tables</h1><p class="lead">Generated from <code>process/operations.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[pipeline](pipeline.html) · [operators, one file each](../../process/pipeline/operators) · [actors](../../process/pipeline/actors) · [flaws](pipeline/flaws.html) · [journal](journal.html) · [decisions](../../process/decisions) · [repo README](../readme.html)\n\n`README.md` says how to run the pipeline. [`pipeline.md`](pipeline.html) says what it is and holds the invariants. [`pipeline/`](pipeline/index.html) says what each part is, one file per part. **This file is the whole thing on one page**: what exists, what writes what, and what must stay true.\n\nTwo earlier versions are archived and are the record if they disagree with this: [`archive/operations_v1.md`](archive/operations_v1.html), the flat-schema reading, and [`archive/operations_v2.md`](archive/operations_v2.html), the dependently-typed one. This is the third, and the reason for it is that the second answered a question nobody was asking. It stated the repository as a $\\mathbf{Set}$-valued copresheaf on a graded schema of artifact types, with commands as Kleisli arrows and the closed world as a well-formedness condition on the type of a draft. All of that is true and none of it says which file an agent may write. What survives of it is the last column of the law table, and that column is now the whole point.\n\n## 1. What exists\n\n| kind | where | one per | who writes it |\n|---|---|---|---|\n| question | a section of [`main_dag.md`](../dag.html) | — | lead-researcher |\n| node | `blueprint/nodes/<chain>/<id>_node.md` | node | lead-researcher creates, orchestrator sets `status:` |\n| statement | the `## Statement` of that file | node | **`/update` alone** |\n| history | `<id>_history.md` | node, append-only | whoever ran the operator |\n| write-up | `proof.md` | node, at most one | prover |\n| critique | `critiques/r<n>.md` | round, append-only | critic |\n| examples | `examples.md` or `prompts/*.md` | node, at most one | example-finder |\n| goal check | `goalcheck.md` | node, at most one | goal-checker |\n| supersession | `updates/u<n>.md` | revision, append-only | `/update` |\n| appendix entry | `blueprint/appendix/<n>-<section>/<anchor>.md` | object | lead-researcher |\n| key example | an entry of [`key_examples.md`](../key_examples/index.html) | case | **the user and `/update`** |\n| pipeline row | a ranked action in a question's `## Pipeline` | judgement | `/update`, and the user may overrule one |\n| prompt | `<id>_prompt.md` | node | **generated** — no agent |\n| page | anything under `blueprint_site/` | artifact | **generated** — no agent |\n\n**An artifact's type is its position.** Nothing inside `critiques/r5.md` announces that it is a critique; it is one because of where it sits. Three things follow: identity is the path, so a fact has exactly one place it can be written; deletion is containment, so `rm -rf` on a node takes everything about it and nothing else; and write discipline is a path prefix, so it can be checked without reading a file.\n\n## 2. What each operator does to the state\n\n| operator | in | out | changes `status:`? |\n|---|---|---|---|\n| [`/decompose`](pipeline/operators/decompose.html) | question, or node | node directories, appendix entries | no |\n| [`/prove`](pipeline/operators/prove.html) | node | `proof.md`, `critiques/r<n>.md` | **yes** — the only one |\n| [`/examples`](pipeline/operators/examples.html) | node | `examples.md` or `prompts/examples.md` | no |\n| [`/check-goal`](pipeline/operators/check-goal.html) | node × the register | `goalcheck.md` | no |\n| [`/update`](pipeline/operators/update.html) | node or question, ± input | `updates/u<n>.md`, a new statement, a `needs:` line | **to `open` only** |\n| [`/generalize`](pipeline/operators/generalize.html) | node, ± input | a new node `<id>-z<k>` with an `instances:` edge | no — and the target is untouched entirely |\n| [`/tighten`](pipeline/operators/tighten.html) | node | **nothing — unspecified** ([ADR 0092](decisions/0092-tightens-goal-is-comprehension-and-its-specification-is-open.html)) | no |\n| [`/create`](pipeline/operators/create.html) | a claim | one node at the deepest surviving layer, and a history entry naming what moved | no |\n| [`/why`](pipeline/operators/why.html) | node × a reader's question | `why/w<n>.md` — under 300 words, delegating to references | no — and it moves no number either |\n| [`/research-status`](pipeline/operators/research-status.html) | — | a printed report | no |\n\n**No command writes upward.** A command applied to an artifact may create only *inside* that artifact's own directory, and may update only fields of the artifact itself. `/decompose` is the one exception and the exception is exactly what decomposition is: it creates at its input's own level, which is the sense in which it is sideways rather than downward.\n\n## 3. Commands and readouts\n\nA **command** changes what is true. A **readout** does not, and the test is deletion: delete a readout's output and recompute it, and nothing has been lost.\n\n| | signature | deleting the output costs |\n|---|---|---|\n| the eight operators above | change the record | evidence |\n| `/research-status` | state → a printed report | nothing |\n| [`build_dag_site.py`](../../tools/build_dag_site.py) | state → prompts + pages | one rebuild |\n| [`check_render.py`](../../tools/check_render.py) | state → PASS/FAIL | nothing |\n| [`stats.py`](../../tools/stats.py) | state → tables + plots | one rerun |\n\n`--check` regenerates every prompt and page in memory and compares them against disk, which is literally a test that the generator is a function of the state and of nothing else.\n\n`/research-status` is the honest exception: its tallies are a function of the state, its *suggested next action* is model output and is not. Which is why the suggestion is printed and never written into a node.\n\n## 4. The gates\n\nA gate is a predicate, run by the orchestrator and never by the agent that produced the input.\n\n| gate | reads | fails on |\n|---|---|---|\n| node | `<id>_node.md` | `role: thought`; a standing `REFUTED`; already `proved` |\n| render | one file, or the repo | a math fragment, a house macro, an unbalanced `$$`, a dangling link |\n| budget | `proof.md` | over 1500 words *(1000 is a note)* |\n| critique cap | `critiques/r<n>.md` | over 1000 words *(a note — critiques are append-only)* |\n| critic | draft × statement × the closed world | one flaw graded FATAL or MAJOR |\n| consistency | the whole state | the state disagreeing with itself; a stale prompt or page |\n| content-preservation | a git diff | a changed status, verdict or anchor |\n\nThe critic's row is the one with the interesting input: it takes the draft **and** the statement **and** the admissible set, and it has write access to none of the three.\n\n## 5. The laws\n\nEach is an equation the state must satisfy after every operator, and the last column is the difference between a law and a suggestion.\n\n| | law | enforced by |\n|---|---|---|\n| L1 | a decomposition leaves its parent's statement untouched | `git diff` on the parent's `## Statement` |\n| L2 | a draft cites only the appendix, its `depends-on`, and standard mathematics | the critic — flaw kind `W` |\n| L3 | `required-by` is the transpose of `depends-on` | `build_dag_site.py --check` |\n| L4 | `ready` is a function of `(status, deps)`, never stored | there is no field to write it into |\n| L5 | round numbers are injective and increasing, never restarted | the next *free* number, never the next number |\n| L6 | a write-up is at most 1500 words | the render gate |\n| L7 | the generator is idempotent and reads none of its own output | delete both generated trees and rebuild — byte for byte |\n| L8 | **no morphism from an example into a draft** | there is no field to put it in |\n| L9 | a presentation pass is the identity on every frozen field | an orchestrator-run diff, not the checker's word |\n| L10 | every citable thing has a page | the link layer of the render gate |\n| L11 | no command writes upward | there is no path to write to |\n| L12 | `cites` is the only relation between a node and the appendix | one entry per file, addressed by anchor |\n| L13 | every readout is a function of the state alone | `--check` regenerates and compares |\n| L14 | a statement changes only along `/update`, leaving `updates/u<n>.md`, a status reset and a history entry | the update record is the operator's contract |\n| L15 | the priority panel is stored judgements ⊕ derived warnings, never mixed | re-derived at every build |\n| L16 | no readout is older than the state it displays | the closing step of every operator, and `--check` |\n| L17 | **the weakest node beneath caps a confidence; it does not enter it** | one `min` in `confidence()` ([ADR 0068](decisions/0068-the-weakest-link-is-a-ceiling.html)) |\n| L18 | **no operator commits** | the commit step is deleted from all seven ([ADR 0069](decisions/0069-the-gates-are-scoped-and-the-batch-closes-once.html)) |\n\n**L8 is why writing this down pays.** \"Examples illustrate, never justify\" was a rule four documents repeated and an agent had to be trusted to follow. As a fact about the shape of the state it is a hom-set that is empty: there is no field an example could be cited in, so the question of whether an agent will respect the rule does not arise. The same reading covers the manuscript — the pipeline has no operation whose codomain is `main.tex`, which is why \"it does not touch the manuscript\" needs no gate.\n\n**L11 and L12 are one observation twice.** A node cannot be written into from below, and the appendix cannot be reached from a node except by citing it. Together: a node only ever *acquires* vocabulary, never owns it.\n\n## 6. What is not a function\n\nEvery operator has a language model in the body, so the same input does not give the same output. Determinism is recovered one level up and only where it is needed: the gates are genuine predicates, so while the draft is not a function of the node, the verdict recorded on it is auditable whatever the draft happened to be.\n\n**The artifact is not reproducible; the judgement on it is on the record.** That is the whole claim the pipeline makes, and stating it this way also states its limit: `VERDICT: PASS` is a referee report, not a machine-checked proof.\n\n## 7. The operations that do not exist\n\n| wanted | status |\n|---|---|\n| branch a **new question** off a lemma | **missing.** It would have to write *upward* (L11), so the work is not writing the command but deciding what the edge is — a `raised-by` relation stored on the question and transposed onto the node, the way `required-by` is |\n| retire a node | **deliberately missing.** Deletion of accepted artifacts is a human move |\n| retire an appendix entry | **missing, and harder than it looks.** Narrowing the closed world invalidates every draft written against the wider one, so each must be re-refereed |\n| write into the manuscript | **deliberately empty** (L8). A human moves it, or it does not move |\n";</script>
