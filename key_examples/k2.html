<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K2 — The trivial period: <span class="math" data-display="0" data-tex="X = \mathrm{pt}"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev yellow">positive</span></dd></dl></div></main><script>const SRC = "**The variety.** The point, smooth affine spherical for any $G$, with\n$K\\backslash LX = BL^+G$. Degenerate in size and not in content — the basic object is the\nconstant sheaf and its Hecke translates have real work to do.\n\n**What is proved.** BZSV §7.6.3 (p. 169): the automorphic category is perfect modules under\n$H^*(BG)$, the dual is the Whittaker model with $\\check M/\\check G$ the Kostant slice, and\n\"the equivalence as module categories for the Hecke category is a theorem of\nBezrukavnikov–Finkelberg\" — [derived Satake](../appendix/bb-derived-satake.html), the same\nKostant–Whittaker reduction the group case rests on.\n\n**What it reaches.** The whole automorphic category is the target, so the Hecke translates\nof the basic object exhaust it: clause (1) of Q1's conjecture, stratumwise generation, over\nthe one-stratum stratification.\n\n**What it does not reach.** One stratum means the support-cutting clause (2) is empty here,\nso the entry cannot discriminate between Q1's criterion and its stratumwise half. It is a\nfloor, not a discriminator.\n\n**Source.** `BZSV`, §7.6.3, p. 169; `bezrukavnikov2008equivariant` (read 2026-08-05).";</script>
