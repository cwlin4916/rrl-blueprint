<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K4</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K4 — Rankin–Selberg: <span class="math" data-display="0" data-tex="X = \mathrm{GL}_N"></span> under <span class="math" data-display="0" data-tex="G = \mathrm{GL}_N\times\mathrm{GL}_{N-1}"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev yellow">positive</span></dd></dl></div></main><script>const SRC = "**The variety.** The $\\mathrm{GL}$ analogue of K3, homogeneous with\n$K\\backslash LX \\simeq \\mathrm{GL}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{GL}_N}$.\nBZSV list it among the cases whose loop space is placid by strata of the affine\nGrassmannian (p. 156).\n\n**What is proved.** Braverman–Finkelberg–Ginzburg–Travkin, §1.7 (p. 8), record their own\nmain equivalence in BZSV form:\n\n$$\n\\Phi\\colon D^{\\mathrm{GL}_{N-1}\\times\\mathrm{GL}_N}_{\\mathrm{perf}}(\\mathcal{S}^{\\bullet}_{1,1}) \\xrightarrow{\\ \\sim\\ } D_{\\mathrm{GL}(N-1,\\mathcal{O})}(\\mathrm{Gr}_{\\mathrm{GL}_N}).\n$$\n\nBZSV §7.6.5 (p. 169) attribute this case to that paper under the name of the Rankin–Selberg\nperiod.\n\n**What it reaches.** Same shape as K3: the full equivariant category on the automorphic\nside, so Q1's equality holds for this $X$.\n\n**What it does not reach.** BZSV describe these results as verifying \"at least the Hecke\ndesideratum\", and say only that it is *likely* the proofs give more. The pointing and\nPoisson conditions of the conjecture are not claimed, and nothing here bears on them.\n\n**Source.** `BravermanFinkelbergGinzburgTravkin_2021`, §1.7, p. 8; `BZSV` §7.6.5, p. 169\n(read 2026-08-05).";</script>
