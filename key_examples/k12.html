only if\n$\\mathbb{C}[\\check G]^{\\check G}\\to\\mathbb{C}[\\check G_X]^{\\check G_X}$ is surjective — and\nthis $X$ is where it fails.\n\n**What it does not reach.** Two transfers are not in print: from characteristic zero to\n$\\mathbb{F}_q((t))$, and membership of this variety in the standing class, which is\ncommissioned as [Q1-e8](../nodes/Q1/Q1-e8/index.html) and unsettled. Until both are closed this\nis a candidate counterexample and not a counterexample.\n\n**Source.** Sakellaridis, arXiv:0905.4244, Ex. 8.0.1, Thm 8.0.2, pp. 65–66, as verified in\n[Q1-a1's update](../nodes/Q1/Q1-a1/updates/u1.html); no PDF on disk.\n\n\n\n\n## Adjacent, and deliberately not in the bench\n\nChen–Nadler construct, for $X$ symmetric, an equivalence between the local category and\nsheaves on a space of principal bundles for a real form of $G$ over $\\mathbb{P}^1$, together\nwith formality of that category (BZSV §7.6.5, p. 169, citing [CN24, Thm 13.4]). It is an\nequivalence with a *different* category and not with the spectral side of the conjecture, so\nit settles neither form and is not a bench entry. It is the natural source to read next\nagainst [Q1-L6-L1](../nodes/Q1/Q1-L6/Q1-L6-L1/index.html), which is scoped to symmetric $X$.";</script>
