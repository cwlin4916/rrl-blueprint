thesis.\n\n**Source.** `BZSV` §7.6.5, pp. 169–170, citing Macerato–Taylor with Chen–Nadler\n(read 2026-08-05). Node: [Q1-e6](../nodes/Q1/Q1-e6/index.html).";</script>
