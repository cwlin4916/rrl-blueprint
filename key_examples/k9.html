<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K9</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K9 — The group case: <span class="math" data-display="0" data-tex="X = H"></span> under <span class="math" data-display="0" data-tex="G = H\times H"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev info">degenerate</span></dd><dt>nodes</dt><dd><a href="../nodes/Q1/Q1-e1/index.html">Q1-e1</a>, <a href="../nodes/Q1/Q1-L5/Q1-L5-e2/index.html">Q1-L5-e2</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-e2/index.html">Q1-L4-e2</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-e3/index.html">Q1-L4-e3</a></dd></dl></div></main><script>const SRC = "**Why it is here.** To keep it out. BZSV §7.6.2 (pp. 168–169) identify the conjecture here\nwith [derived Satake](../appendix/bb-derived-satake.html), so the case is as settled as anything\nin the register — and useless as a test.\n\n**Why it is not a positive.** [$\\mathrm{IC}_0$](../appendix/ic-0.html) is the monoidal unit of\n[the Hecke action](../appendix/conv-hecke-action.html), so\n$\\mathcal{F}\\ast\\mathrm{IC}_0 = \\mathcal{F}$ and the generating family of\n[the Satake subcategories](../appendix/def-satake-subcategory.html) is the whole category before\nany geometry is done. No clause of Q1's criterion is exercised: a node's statement can be\nfalse and still pass here. The torus sub-case $X = T$ under $T\\times T$ is degenerate for\nthe same reason.\n\n**Record.** The question-level example node that carried this, `Q1-e7`, was removed on\n2026-08-05 at the user's direction, for exactly this reason.\n[Q1-e1](../nodes/Q1/Q1-e1/index.html) keeps the group case for what it does show — that the\nunramified equivalence is a theorem, at spherical and at Iwahori level — and\n[Q1-L5-e2](../nodes/Q1/Q1-L5/Q1-L5-e2/index.html) and\n[Q1-L4-e3](../nodes/Q1/Q1-L4/Q1-L4-e3/index.html) keep it as a computation of strata and\nstabilizers, which is not the same claim.\n\n**Source.** `BZSV` §7.6.2, pp. 168–169; `bezrukavnikov2008equivariant`, Thm 5\n(read 2026-08-05).";</script>
