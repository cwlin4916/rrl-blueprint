<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K10</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K10 — The Whittaker period: <span class="math" data-display="0" data-tex="M = T^*(G/\!\!/_{\psi}U)"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev info">out-of-class</span></dd><dt>nodes</dt><dd><a href="../nodes/Q1/Q1-e3/index.html">Q1-e3</a></dd></dl></div></main><script>const SRC = "**Why it is here.** BZSV §7.6.4 (p. 169) settle it — the dual is a point, the automorphic\nside is Whittaker sheaves on the Grassmannian, and the equivalence is Frenkel–Gaitsgory–\nVilonen. It looks like a positive and is not one.\n\n**Why it is not a positive.** The polarization is twisted: $M$ is not $T^*X$ for any $X$ in\n[untwisted polarized hyperspherical varieties](../appendix/def-polarized-hyperspherical.html), so no statement\nof Q1 has an instance here. It bears on the *scope* of the question and on the Iwahori-level\nshape of the answer, which is where [Q1-e3](../nodes/Q1/Q1-e3/index.html) puts it.\n\n**Source.** `BZSV` §7.6.4, p. 169, attributing Frenkel–Gaitsgory–Vilonen (on disk as\n`FGV01.pdf`, no `refs.bib` key); `arkhipov2004quantum` for the Iwahori–Whittaker spectral\nside (read 2026-08-05).";</script>
