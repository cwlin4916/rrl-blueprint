<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K8</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K8 — Rank-1 affine homogeneous spherical varieties: the weakened form, in print</h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev amber">weak</span></dd></dl></div></main><script>const SRC = "**Why it is here.** This is the entry that shows the distinction this register turns on\nis real, and not a reading the blueprint imposed on the literature.\n\n**What is proved.** Devalapurkar, Theorem 1.1.10 (p. 7): for $G/H$ affine spherical of rank\n$1$, and under his Hypothesis 3.5.2, BZSV Conjecture 7.5.1 holds, with\n\n$$\n\\mathrm{Shv}^{c}_{G(\\mathbb{C}[[t]])}\\!\\left(G(\\mathbb{C}((t)))/H(\\mathbb{C}((t)))\\right) \\simeq \\mathrm{Perf}\\!\\left(\\mathrm{sh}^{1/2}\\check M/\\check G\\right).\n$$\n\nThe same page carries footnote 5: \"This is technically a slight lie: the left-hand side is\nreplaced by a certain subcategory defined using the action of\n$\\mathrm{Shv}^{c}_{G(\\mathbb{C}[[t]])\\times G(\\mathbb{C}[[t]])}(G(\\mathbb{C}((t))))$.\"\n\n**What it reaches.** That subcategory is\n[the Satake subcategories](../appendix/def-satake-subcategory.html) under another name, so the\ntheorem establishes [the three standing hypotheses](../appendix/assum-intro.html)(c) for every rank-1 affine\nhomogeneous spherical variety — a large family — and the companion result for the triple\nproduct $\\mathrm{PGL}_2\\hookrightarrow\\mathrm{PGL}_2^{\\times 3}$ likewise.\n\n**What it does not reach.** Q1, entirely. This is the weakened form, proved as the weakened\nform and flagged as such by its author, and it is the cleanest evidence in the literature\nthat Q1 is not answered by the cases where the unramified conjecture is known.\n\n**Source.** `devalapurkar2024kutheoreticspectraldecompositionsspheres`, Thm 1.1.10 and\nfootnote 5, p. 7; `BZSV` §7.6.5, p. 169 (read 2026-08-05).";</script>
