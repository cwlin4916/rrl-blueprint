<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K1 — Iwasawa–Tate: <span class="math" data-display="0" data-tex="X = \mathbb{A}^1"></span> under <span class="math" data-display="0" data-tex="G = \mathbb{G}_m"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev yellow">positive</span></dd><dt>nodes</dt><dd><a href="../nodes/Q1/Q1-e2/index.html">Q1-e2</a>, <a href="../nodes/Q1/Q1-L4/Q1-L4-e1/index.html">Q1-L4-e1</a></dd></dl></div></main><script>const SRC = "**The variety.** $\\mathbb{G}_m$ scaling the line, the simplest non-homogeneous member of the\nstanding class — smooth affine, open orbit $\\mathbb{A}^1\\smallsetminus\\{0\\}$ with trivial\nstabilizer. The loop space is $LX(k) = k((t))$, stratified by valuation together with the\nclosed point $\\{0\\}$, worked out in [Q1-L4-e1](../nodes/Q1/Q1-L4/Q1-L4-e1/index.html).\n\n**What is proved.** BZSV Example 7.6.1 (p. 168) verify the equivalence by hand: the Hecke\ntranslates $\\delta_n$ of the basic sheaf match $[n]\\otimes\\mathcal{O}_{\\check M}$ on\n$\\check M = T^*\\mathbb{A}^1$, and the two Hom computations agree degree by degree — the\nautomorphic $\\mathrm{Hom}(\\delta_n,\\delta_m)$ of their (7.9) against the spectral\n$\\mathrm{Hom}_{\\check G}([n-m],\\mathcal{O})$, one-dimensional in degrees\n$|n-m|, |n-m|+2,\\ldots$ in both. Hilburn–Raskin prove a fully ramified de Rham version, per\nBZSV §7.6.5 (p. 169).\n\n**What it reaches.** Every object the register can name on the automorphic side is a Hecke\ntranslate or a colimit of them: BZSV obtain the skyscraper at $0$ and the Lebesgue sheaf\n$\\mu$ as the $l\\to\\mp\\infty$ limits of $k_{X_l}$, which is the support-cutting clause (2)\nof Q1's conjecture made explicit in the one case where it can be computed.\n\n**What it does not reach.** The limits are taken in the large category. BZSV nowhere assert\nexhaustion of the *small* category $\\mathcal{D}_c$, which is the side Q1 asks about, and\nthe passage between them is exactly [Q1-L2](../nodes/Q1/Q1-L2/index.html)'s business. Read this\nentry as the strongest available evidence and not as a citation.\n\n**Source.** `BZSV`, Example 7.6.1, p. 168, and §7.6.5, p. 169 (read 2026-08-05). Node:\n[Q1-e2](../nodes/Q1/Q1-e2/index.html).";</script>
