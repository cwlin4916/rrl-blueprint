<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K5</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K5 — Mirabolic: <span class="math" data-display="0" data-tex="X = \mathrm{GL}_n\times\mathbb{A}^n"></span> under <span class="math" data-display="0" data-tex="G = \mathrm{GL}_n\times\mathrm{GL}_n"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev yellow">positive</span></dd></dl></div></main><script>const SRC = "**The variety.** The dual of the Godement–Jacquet space, with $(g,v)$ acted on by\n$(g_1,g_2)\\mapsto(g_1^{-1}gg_2,\\, vg_2)$. Its loop quotient is the mirabolic affine\nGrassmannian $\\mathrm{Gr}\\times\\mathcal{V}$ with $\\mathcal{V} = \\mathbf{V}\\otimes F$,\n$\\dim\\mathbf{V} = n$, acted on diagonally by $G_{\\mathcal{O}}$.\n\n**What is proved.** BFGT Theorem 3.6.1 (p. 22): three equivalences of triangulated monoidal\ncategories onto $D^{!}_{G_{\\mathcal{O}}}(\\mathrm{Gr}\\times\\mathcal{V})$,\n$D^{!*}_{G_{\\mathcal{O}}}$ and $D^{*}_{G_{\\mathcal{O}}}$, all commuting with the actions of\n$\\mathrm{Perv}_{G_{\\mathcal{O}}}(\\mathrm{Gr}) \\simeq \\mathrm{Rep}(\\mathrm{GL}_N)$ by left and\nright convolution. Every one of the three is a full equivariant category.\n\n**What it reaches.** Q1's equality for this $X$, in each of the three sheaf-theoretic\nreadings, which incidentally shows the answer does not depend on the $!$ / $*$ choice that\n[the three standing hypotheses](../appendix/assum-intro.html)(b) exists to control.\n\n**What it does not reach — and a correction the register owes the appendix.**\n[known cases of the unramified equivalence](../appendix/exam-hyperspherical-duality.html)(2), transcribed\nfrom main.tex:961, attributes BFGT Theorem 3.6.1 to $X = M_n$ under\n$\\mathrm{GL}_n\\times\\mathrm{GL}_n$. The category BFGT actually realize is\n$D_{G_{\\mathcal{O}}}(\\mathrm{Gr}\\times\\mathcal{V})$, which is the loop quotient of\n$\\mathrm{GL}_n\\times\\mathbb{A}^n$ and not of $M_n$; BZSV §7.6.5 (p. 169) list the case as\n\"$X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ as a $\\mathrm{GL}_n\\times\\mathrm{GL}_n$-space\" for the\nsame reason. For the unramified conjecture the two are one statement about a dual pair; for\nQ1 they are not, because Q1 is a question about *which side's* automorphic category is\nexhausted. So K5 is a positive for $\\mathrm{GL}_n\\times\\mathbb{A}^n$ and says nothing about\n$M_n$, whose entry is [Q1-e4](../nodes/Q1/Q1-e4/index.html) and which the register does not\ncarry as a positive.\n\n**Source.** `BravermanFinkelbergGinzburgTravkin_2021`, Thm 3.6.1, p. 22, with §1.4 (p. 5)\nfor $\\mathcal{V}$; `BZSV` §7.6.5, p. 169 (read 2026-08-05).";</script>
