<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>the criterion</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Key examples — what makes one key</h1><p class="lead">Why the register keeps a case where the whole automorphic category is realized apart from a case where only the Satake subcategory is.</p><div id="doc"></div></main><script>const SRC = "\n\nThis file is the register of the $X$ against which every statement in the tree is checked.\nIt is read by `/check-goal`, which takes one node, specializes its statement to each entry\nbelow, and records what it finds in that node's `goalcheck.md`.\n\n**It is outside the closed world.** No proof, node or appendix entry may cite it, exactly\nas with a node's `examples.md`. An entry justifies *believing* a statement — that it is\nnot vacuous, that a hypothesis is load-bearing — and never discharges an obligation.\n\n\n\n## What makes an example key\n\nThe register turns on one distinction, and it is not a matter of taste.\n\n[BZSV](../papers/guideline.html) Conjecture 7.5.1 (p. 161, read 2026-08-05) puts the **whole**\nautomorphic category on the left,\n\n$$\n\\mathcal{L}_X\\colon \\mathrm{Shv}(X_F/G_{\\mathcal{O}}) \\longrightarrow \\mathrm{Perf}^{\\check G}(\\mathcal{O}_{\\check M}),\n$$\n\nand §7.5.3 (p. 163) draws the consequence in as many words: \"all sheaves on $X_F/G_{\\mathcal{O}}$\ncan be generated from the basic object through the action of Hecke functors.\" The same\nprediction is listed among the paper's open problems at p. 25 — \"we predict they are\ngenerated by the basic sheaf\".\n\nThe manuscript's standing hypothesis [the three standing hypotheses](../appendix/assum-intro.html)(c) puts the\n**Satake subcategory** there instead, as\n[unramified relative local Langlands](../appendix/conj-relative-langlands-unramified.html) records.\nThat weakening is not cosmetic: the gap between the two forms *is*\n[Q1](../dag.html).\n\nSo an $X$ is a **key positive example** exactly when a source proves the unramified\nequivalence with the full automorphic category on the automorphic side — because then the\ninclusion [the Satake subcategories](../appendix/def-satake-subcategory.html)\n$\\subseteq \\mathcal{D}_c(K\\backslash LX)$ has nothing left to prove. A source that proves\nonly the weakened form establishes (c) and leaves Q1 untouched, and the register keeps\nthose apart under `KEY: weak`.\n\nTwo further readings are recorded and never conflated. A case where\n[$\\mathrm{IC}_0$](../appendix/ic-0.html) is the monoidal unit of\n[the Hecke action](../appendix/conv-hecke-action.html) is **degenerate**: the equality is formal\nand exercises no clause of the criterion. A case outside\n[untwisted polarized hyperspherical varieties](../appendix/def-polarized-hyperspherical.html) is\n**out-of-class**, and bears on the scope of Q1 rather than on its answer.\n\n## The positives\n\n";</script>
