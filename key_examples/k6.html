<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K6</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K6 — Symplectic (Jacquet–Rallis) period: <span class="math" data-display="0" data-tex="X = \mathrm{GL}_{2n}/\mathrm{Sp}_{2n}"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev yellow">positive</span></dd><dt>nodes</dt><dd><a href="../nodes/Q1/Q1-e5/index.html">Q1-e5</a></dd></dl></div></main><script>const SRC = "**The variety.** Symmetric, hence spherical, and homogeneous with reductive stabilizer,\nhence smooth affine. Its dual is the Shalika-Whittaker reduction\n$\\check M = T^*(\\mathrm{GL}_{2n}/\\mathrm{GL}_n\\ltimes U,\\psi)$.\n\n**What is proved.** Chen–Macerato–Nadler–O'Brien, Theorem 1.3 (p. 5):\n\n$$\n\\Psi_X\\colon D^{b}(L\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}) \\simeq D^{\\mathrm{GL}_n}_{\\mathrm{perf}}\\!\\left(\\mathrm{Sym}(\\mathfrak{gl}_n[-4])\\right),\n$$\n\ncompatible with the monoidal action of $D^b(L^+\\mathrm{GL}_{2n}\\backslash\\mathrm{Gr}_{2n})$.\nTheir §1.6 (p. 7) states the BZSV conjecture as\n$D^b(LX/L^+G) \\simeq \\mathrm{Coh}(\\check M/\\check G)$ — full category — and their (1.12)\nupgrades the orbit bijection\n$|LX/L^+\\mathrm{GL}_{2n}| \\leftrightarrow |L\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}|$ to an\nequivalence of categories.\n\n**What it reaches.** Q1's equality for this $X$, and it is the most instructive positive in\nthe register: Remark 1.4 (p. 5) notes that the $L\\mathrm{Sp}_{2n}$-orbits on\n$\\mathrm{Gr}_{2n}$ are neither finite-dimensional nor finite-codimensional, so this is a\ncase where the naive stratum-by-stratum reading of Q1 is unavailable and the equality holds\nregardless.\n\n**What it does not reach.** The step (1.12) that moves from\n$L\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}$ to $LX/L^+\\mathrm{GL}_{2n}$ is asserted with a\nforward reference and not proved in that paper. Their $D^b$ is defined through the\nsemi-analytic quotient $\\Omega\\mathrm{Sp}(n)\\backslash\\mathrm{Gr}_{2n}$ (Remark 1.4), which\nis not the $\\mathcal{D}$-module category of the blueprint.\n\n**Source.** `chen2022quaternionic`, Thm 1.3 and Rmk 1.4, p. 5, §1.6 with (1.11)–(1.12), p. 7\n(read 2026-08-05). Node: [Q1-e5](../nodes/Q1/Q1-e5/index.html).";</script>
