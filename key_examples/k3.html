<header class="bar"><nav class="crumbs"><a href="../dag.html">the DAG</a><i>›</i><a href="index.html">key examples</a><i>›</i><span>K3</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>K3 — Gross–Prasad: <span class="math" data-display="0" data-tex="X = \mathrm{SO}_N"></span> under <span class="math" data-display="0" data-tex="G = \mathrm{SO}_N\times\mathrm{SO}_{N-1}"></span></h1><p class="lead">One entry of the bench. It says what is proved, on which side, and what it does not reach — and nothing may cite it.</p><div id="doc"></div><div class="meta"><dl><dt>verdict</dt><dd><span class="sev yellow">positive</span></dd><dt>nodes</dt><dd><a href="../nodes/Q1/Q1-L5/Q1-L5-e3/index.html">Q1-L5-e3</a></dd></dl></div></main><script>const SRC = "**The variety.** Homogeneous with reductive stabilizer, hence smooth affine, and spherical.\nQuotienting by the second factor identifies\n$K\\backslash LX \\simeq \\mathrm{SO}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$,\nthe presentation [Q1-L5-e3](../nodes/Q1/Q1-L5/Q1-L5-e3/index.html) works in.\n\n**What is proved.** Braverman–Finkelberg–Travkin, Theorem 2.2.1(a) (p. 10): an equivalence\n\n$$\n\\Phi\\colon D^{G_{\\bar 0}}_{\\mathrm{perf}}(\\mathcal{G}^{\\bullet}) \\xrightarrow{\\ \\sim\\ } D^{b}_{\\mathrm{SO}(N-1,\\mathcal{O})}(\\mathrm{Gr}_{\\mathrm{SO}_N}),\n$$\n\ncommuting with the left convolution action of the spherical Hecke category of\n$\\mathrm{SO}_{N-1}$ and the right convolution action of that of $\\mathrm{SO}_N$. Their §1.3\n(p. 4) states the BZSV prediction they are matching as\n$\\mathrm{DCoh}(V_X^{\\vee}/G_X^{\\vee}) \\simeq D_{G(\\mathcal{O})}(X(F))$ — the full category on\nthe automorphic side, in their own words.\n\n**What it reaches.** The target is $D^b$ of the whole equivariant constructible category,\nnot a subcategory generated by anything, and the equivalence is Hecke-linear. Both clauses\nof Q1's conjecture hold for this $X$, over a stratification that is genuinely infinite and\nwhose orbit closures are singular.\n\n**What it does not reach.** The equivalence is stated for the bounded constructible category\nover $\\mathbb{C}$ in the topological setting; the $\\mathcal{D}$-module reading the blueprint\nworks in, and the identification of their $\\mathcal{G}^\\bullet$ with\n$\\mathrm{sh}^{1/2}(\\check M)$, are matters the entry does not settle. Theorem 2.2.1(f) is\nwhere they treat compactness, and it is the clause to read before quoting this against\n[Q1-L2-L1](../nodes/Q1/Q1-L2/Q1-L2-L1/index.html).\n\n**It is a family, not one variety.** Theorem 2.2.1 is stated for every $N\\ge 3$, with\n$V_0 = \\mathbb{C}^{2n}$ and $V_1 = \\mathbb{C}^{2n}$ when $N = 2n+1$ and\n$V_1 = \\mathbb{C}^{2n-2}$ when $N = 2n$ (§1.2, p. 3); footnote 1 (p. 2) records that the\nsame argument runs with $\\mathrm{GL}$ in place of $\\mathrm{SO}$, which is [K4](#k4).\nTheir $\\mathsf{G}_X^{\\vee}$ is the *full* dual group $\\mathrm{SO}_{N-1}^{\\vee}\\times\\mathrm{SO}_N^{\\vee}$\n(Lemma 2.3.1, p. 10), the orbits are indexed by $\\Lambda_{\\mathsf s}^{+}\\times\\Lambda_{\\mathsf b}^{+}$,\nand each orbit is open in the image of the corresponding two-sided Hecke convolution\n(Lemma 2.3.2, p. 11) — Q1's generation statement in geometric form.\n\n**Why the whole category, and the one step the paper does not spell out.** Thm 2.2.1(a) is\nbilinear for the two spherical Hecke categories, whose product is the single $G$-Hecke\naction of Q1 since $G = \\mathrm{SO}_{N-1}\\times\\mathrm{SO}_N$. Its source\n$D^{\\mathsf{G}_{\\bar 0}}_{\\mathrm{perf}}(\\mathfrak{G}^{\\bullet})$ is generated by the free\nmodules $\\mathfrak{G}^{\\bullet}\\otimes W$, $W\\in\\mathrm{Rep}(\\mathsf{G}_{\\bar 0})$, and\n$\\mathsf{G}_{\\bar 0} = \\mathsf{G}_{\\mathsf s}\\times\\mathsf{G}_{\\mathsf b}$ is a product, so every\nsuch $W$ is an external tensor product and every free module is a two-sided Hecke translate\nof the unit. What the paper does not state in these words is that $\\Phi$ carries that unit to\n$\\mathrm{IC}_0$; Lemma 2.3.2 at $(\\lambda_{\\mathsf s},\\lambda_{\\mathsf b}) = (0,0)$ and the\nexactness of 2.2.1(b) make it the only candidate, and until it is checked this entry's\npositive rests on that step.\n\n**The Iwahori level is a published conjecture, and it is the main theorem's own statement.**\n§1.4 (p. 5) proposes\n\n$$\nD^{\\mathrm{SO}(V_0)\\times\\mathrm{Sp}(V_1)}\\mathrm{Coh}(\\mathrm{St}_{\\mathfrak{osp}})\\;\\cong\\;D^{b}_{\\mathbf{I}_{N-1}}(\\mathbf{Fl}_{\\mathrm{SO}_N}),\n$$\n\nwith $\\mathrm{St}_{\\mathfrak{osp}}\\subseteq (V_0\\otimes V_1)[1]\\times\\mathcal{Fl}_0\\times\\mathcal{Fl}_1$\ncut out by $A^{t}A(F_0^{(r)})\\subseteq F_0^{(r)}$ and $AA^{t}(F_1^{(r)})\\subseteq F_1^{(r)}$.\nBoth sides are the main theorem specialized to this $X$:\n$\\mathbf{I}_{N-1}\\backslash\\mathrm{SO}_N(\\mathbf{F})/\\mathbf{I}_N$ is $I\\backslash LX$; the two\nflag varieties are $\\check G/\\check B$ for $\\check G = \\mathrm{SO}(V_0)\\times\\mathrm{Sp}(V_1)$;\nthe two stability conditions say the quadratic moment images of §2.1 lie in\n$\\check{\\mathfrak{n}}^{\\perp}$; and $\\check M = \\Pi(V_0\\otimes V_1)[1]$ by §1.3 (p. 5), so\n$\\mathrm{St}_{\\mathfrak{osp}}$ is $\\tilde{\\check{\\mathfrak{g}}}^{*}\\times_{\\check{\\mathfrak{g}}^{*}}\\check M$.\nExactly two differences remain, and both are Q1's subject: BFT's automorphic side is the\n**whole** Iwahori category where the main theorem's is $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}$,\nand their spectral side is $\\mathrm{Coh}$ where the main theorem's is $\\mathrm{Perf}$ of the\nsheared stack. For this family, then, the manuscript's own remark that \"it is unclear how to\nformulate the conjecture for the entire category $\\mathcal{D}_c(I\\backslash LX)$ for general\n$X$\" (`main.tex`, the paragraph after `\\label{equation:algebra}`) has a published answer, and\nQ1's equality here is precisely what would turn the main theorem into a proof of it.\n\n**What it does not reach.** The equivalence is stated for the bounded constructible category\nover $\\mathbb{C}$ in the topological setting; the $\\mathcal{D}$-module reading the blueprint\nworks in, and the identification of their $\\mathcal{G}^\\bullet$ with\n$\\mathrm{sh}^{1/2}(\\check M)$, are matters the entry does not settle. Theorem 2.2.1(f) is\nwhere they treat compactness, and it is the clause to read before quoting this against\n[Q1-L2-L1](../nodes/Q1/Q1-L2/Q1-L2-L1/index.html).\n\n**Against Q3's package.** $\\pi_0(LX)\\cong\\pi_1(\\mathrm{SO}_N)\\cong\\mathbb{Z}/2$ for $N\\ge 3$,\nso $LX$ is disconnected and the index of **(H2)** is not a single filtered poset:\n[Q3-L4](../nodes/Q3/Q3-L4/index.html), the repository's only sufficient condition, does not\napply as stated. Nor does the failure of [Q3-L3](../nodes/Q3/Q3-L3/index.html), which needs\ninfinitely many pieces — two is finite, and a limit over a finite disjoint union of filtered\nposets is a finite product of limits. So this family asks for a finite-$\\pi_0$ version of\n[Q3-L4](../nodes/Q3/Q3-L4/index.html), and the node that would supply the $\\pi_0$ bookkeeping,\n[Q3-L6](../nodes/Q3/Q3-L6/index.html), is stated under a symmetry hypothesis this $X$ does not\nsatisfy.\n\n**Source.** `BFT_orthosymplectic_satake`, Thm 2.2.1(a), p. 10, and §1.3, p. 4\n(read 2026-08-05); §1.1–1.4 pp. 2–5, Thm 2.2.1(a)–(f) p. 10 and Lemmas 2.3.1–2.3.2 pp. 10–11\n(read 2026-08-07, `/update Q1-e*`).\nCatalogue: [known cases of the unramified equivalence](../appendix/exam-hyperspherical-duality.html)(3).";</script>
