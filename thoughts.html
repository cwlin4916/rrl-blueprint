<header class="bar"><nav class="crumbs"><a href="index.html">blueprint</a><i>›</i><span>thoughts</span></nav><div class="spacer"></div><a class="ghost" id="home" href="dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Thoughts</h1><p class="lead">Generated from <code>thoughts.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nOpen questions about the shape of this repo. A question lives here while it is still a question; once it is settled it becomes a numbered record in [`process/decisions/`](../process/decisions) and the entry here shrinks to a line saying so.\n\n---\n\n## Settled — the website\n\n**The question was:** we have `blueprint/` (markdown files, written by hand and by agents) and we had `docs/` (an HTML website built from them). Two folders holding the same mathematics. Is the second one worth it, or should we drop the markdown and just write HTML?\n\n**Two decisions, 2026-08-04.** Recorded as [ADR 0010](process/decisions/0010-site-untracked-and-renamed.html).\n\n1. **The website is no longer stored in git.** It still exists on your machine and still rebuilds with one command. Git just stops keeping a copy of every version of it.\n2. **It is now called `blueprint_site/`,** not `docs/`.\n\nNothing else changed. Markdown stays the source; the site is still built from it by `tools/build_dag_site.py` at the end of every `/decompose`, `/prove` and `/check`, exactly as before.\n\n### Why stop storing it in git\n\nThe cleanest way to see it: **the website is to the blueprint what the PDF is to `main.tex`.**\n\nYou already keep `main.tex` in git and *not* the PDF — `.gitignore` throws away `*.pdf` and the whole `build/` folder. Nobody thinks that loses anything, because the PDF is not a thing you wrote; it is a thing you can make again from the thing you wrote, identically, whenever you want. The website is in exactly that position. It has never been written by hand — [`build_dag_site.py`](../tools/build_dag_site.py) produces every page of it, and if you delete the whole folder and rebuild, you get the same bytes back.\n\nStoring it anyway was costing three things.\n\n**The history stopped being readable.** Git's job is to answer \"what changed?\" Every rebuild touched about a hundred HTML pages, so a commit that added two lemma statements looked, in the record, like a commit that changed a hundred files. The site made up **56% of the files in the repo**, and the record of the research was buried under the record of the website being rebuilt.\n\n**The same 600 KB was stored twice.** KaTeX — the maths-rendering library — lives in `tools/vendor/` and was copied into the site on every build. Both copies were in git.\n\n**There was a whole check for a problem that only existed because of this.** `build_dag_site.py --check` had to ask \"is the stored website out of date with respect to the blueprint?\" That question disappears when you always rebuild.\n\n**What we give up:** on a fresh computer, the website is not there until you run\n\n```\npython3 tools/build_dag_site.py\n```\n\nThat is the entire cost. The generator and the KaTeX library are both still in git, so the build needs no internet and produces the same result every time.\n\n### Why the markdown stays the source\n\nWriting the HTML directly was the tempting move — one folder instead of two, and the browser is where you actually read this. It fails for three reasons, all of them things the repo already relies on.\n\n**Some fields are computed, not typed.** `required-by` is just `depends-on` read backwards. Whether a lemma is *ready* or *blocked* is worked out from its dependencies' statuses every time it is displayed, and is written down nowhere. The layout of the graph is worked out from the arrows. If HTML were the source, every one of those would become something a person types, in each of the places it appears — and then keeps in agreement by hand, forever. That is the opposite of the rule that each fact is stored exactly once.\n\n**You have to be able to read what changed.** Reviewing a fresh decomposition is the one step in the pipeline that cannot be handed to an agent, because the decomposition *is* the research strategy. You review it by reading the difference between before and after. For seven new `node.md` files that is a readable page of mathematics. For seven new HTML pages it is unreadable, so in practice the review stops happening.\n\n**The agents read raw text.** Every `/prove` run hands the prover the node's statement and the full text of each appendix entry it cites. Out of markdown those arrive clean. Out of HTML they arrive wrapped in tags and navigation, and the model has to guess which part is the mathematics. That is a correctness risk, not just a nuisance.\n\n### Why the name changed\n\n`docs` was never a description — it is the exact folder name GitHub looks for when publishing a website from a repository. We are not publishing, so the name was buying nothing and actively misleading: the real documentation is `process/` and `README.md`. `blueprint_site/` says what it is — the blueprint, rendered.\n\n### If we publish later\n\nTwo ways to get a public link, and this rename closes neither. GitHub can serve a folder named `docs/` that is stored in git — which would mean undoing both decisions — or it can run the build itself and serve the result, which does not care what the folder is called. The second is the better fit here, since it keeps the history clean. That is a job for the day a remote exists; ADR 0010 records what to reverse.\n\n---\n\n## Still open\n\n**A lemma cannot raise a question.** `/decompose Q1-L5` breaks a lemma *downwards* into smaller lemmas. There is no command for the other direction — working on a lemma and realising it raises a question the lemma does not answer. You can write the question into `blueprint/questions/` by hand and decompose that, but nothing records which lemma it came from, so the connection is lost at the moment it is most interesting.\n\n**A ratified reading quietly puts old proofs in doubt.** Adding an appendix entry is safe: nothing already there changes meaning, so no existing proof is affected. *Narrowing* one — pinning down a reading the entry had left open — is not safe, because any proof written against the looser reading was proved against a different statement. This has happened once here, and it cost two extra referee rounds on Q1-L1. Nothing currently flags it. The `used by` line on each appendix entry already lists exactly which proofs would need re-checking; no gate reads it.\n";</script>
