he Q1 child that asserts **(H2)** unconditionally, and if it is proved, that assertion cannot stand as stated.\n- **2026-08-06 — why the torus is the right witness.** The new appendix entry [Chen–Yi filtered orbit order and $\\pi_0(LX)$](../../../appendix/bb-chenyi-filtered-orbit-order.html), transcribed this run from §5.3 of the source, computes $\\pi_0(LX)\\cong\\Lambda_S/(\\Lambda_S\\cap Q)$ and shows the closure order is filtered only within a connected component. For $X = T$ under $T\\times T$ the coroot lattice $Q$ is trivial, so every stratum is its own component: the extreme case of the entry, and the case hypothesis **(A)** isolates. The same entry records that the source's own presentation is indexed by $\\pi_0$-wise tuples, which is precisely the repair the failure calls for.\n- **2026-08-06 — what it does not claim.** It says nothing about **(H1)** or **(H3)**, which for a discrete stratification are trivially available, and nothing about whether Q1's equality holds for the torus. Its scope is the one hypothesis, and the reading it forces on the rest of Q3 is that a positive answer must either bound $\\pi_0(LX)$ or index the limit by tuples rather than by single orbit closures.\n";</script>
