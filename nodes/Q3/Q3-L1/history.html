gle stratum. Everything downstream in Q3 that assumes **(H1)** may then be read as assuming condition 1 at the strata it touches.\n- **2026-08-06 — what it deliberately does not claim.** It asserts neither coherence condition for any $X$. Those are exactly what the children of the Q1 dévissage node try to establish unconditionally for all smooth affine spherical $X$; this node is their conditional counterpart, and its content is that nothing further is needed and nothing less will do. Hypothesis **(A)** is kept as a hypothesis rather than derived, because the closed world carries no entry for ind-proper pushforward and its adjunction — the gap `/prove Q2-L5` recorded as GAP (Prop) in [papers/guideline.md](../../../papers/guideline.html).\n";</script>
