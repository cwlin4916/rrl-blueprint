<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">nodes</a><i>›</i><span>Q3_node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q3 — For which $X$, and over which strata and closures, do the recollement hypotheses (H1)–(H3) hold?</h1><p class="lead">Generated from <code>blueprint/nodes/Q3/Q3_node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[DAG index](../../dag.html) · [appendix](../../appendix/index.html) · [context](../../context.html) · [key examples](../../key_examples/index.html) · [history](history.html)\n\n- **type:** question\n- **created:** 2026-08-06\n- **human:** —\n\n## Feeds\n\n[Q1](../Q1/index.html) and [Q2](../Q2/index.html). The package below is assumed at [Q1-L5](../Q1/Q1-L5/index.html) — the node carrying the criterion [Q1](../Q1/index.html) advertises at strength *necessary and sufficient* — and throughout [Q2](../Q2/index.html); an answer here says for which $X$ those two are entitled to it.\n\nThe relation is between the *questions*. No node of one lists a node of another in **depends-on**, so the three arguments stay separately auditable.\n\n## Setting\n\n$k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../context.html) and of [Q1](../Q1/index.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../appendix/def-orbits-iwahori-spherical.html). For $LX_\\lambda\\subseteq\\overline{LX}_\\mu$ write $i_{\\lambda,\\overline{LX}_\\mu}$ for the locally closed embedding through which $i_\\lambda$ factors.\n\n$LX$ carries the $K$-placid presentation $LX = \\varinjlim_{\\mu}\\overline{LX}_\\mu$ of [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html), read through [placidity](../../appendix/placid-ind-scheme.html) and [sheaves on a placid ind-scheme](../../appendix/ex-sheaf-placid-ind.html), refined for symmetric $X$ by [Chen–Yi filtered orbit order and $\\pi_0(LX)$](../../appendix/bb-chenyi-filtered-orbit-order.html). Coherence is [coherent $\\mathcal{D}$-modules](../../appendix/defn-coherent-d-mod.html) and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../appendix/def-renormalized.html).\n\n### The three hypotheses, stated canonically\n\nThey are the subject of this question, and nothing here assumes them. [Q2](../Q2/index.html) and [Q4](../Q4/index.html) state the same package and assume it; this is the canonical statement.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n## Problem statement\n\nFor $X$ in the standing class, decide for which $X$ — and, stratum by stratum and closure by closure, for which $\\lambda$ and which $\\mu$ — each of **(H1)**, **(H2)** and **(H3)** holds. The three are asked separately because they are consumed separately and fail for different geometric reasons.\n\n**What counts as an answer.** Geometric hypotheses on $X$ and its orbit stratification under which each of the three provably holds, together with an $X$ in the standing class where each provably fails. Failing that, a sufficient condition paired with a failure instance for each hypothesis, with the gap between the two stated.\n\n## Conjecture\n\n*(v2 — 2026-08-09.)* **The package is a support condition on coherent objects, and it fails at two named boundaries.** **(H1)** is stratum-local and should hold wherever $j_\\lambda$ and $\\overline{i}_\\lambda$ are of finite presentation. **(H2)** needs two independent things — a directed index and bounded supports for coherent objects — and is expected to be *false*, not merely unproved, when infinitely many strata are open and closed. **(H3)** should need no orbit finiteness at all.\n\nThe conjecture is that what the whole package finally turns on is a single support bound: that every coherent object is pushed forward from one closure and, inside a closure, from finitely many orbit closures.\n\n## Pipeline\n\nThe next actions, ranked by what each buys this question's confidence. Authored, not derived: which missing fact clears a defect is a judgement no gate can compute. Each row names the operator, its target and what it buys.\n\nQ3 has no nodes. Its first decomposition was written on 2026-08-06 and removed unattempted on 2026-08-09 ([the register](../removed.html)), so the ranking below is a ranking of one action.\n\n- **1.** `/decompose Q3` · [Q3](index.html) — one lemma per hypothesis before any lemma below one of them. The removed decomposition mixed the three: eight nodes across **(H1)**, **(H2)** and **(H3)** at once, in which nothing could be finished because no single node closed a hypothesis. Route: Claude Code, since the obstacle is the cut and not the literature.\n";</script>
