<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">nodes</a><i>›</i><span>Q3_node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q3 — For which $X$, and over which strata and closures, do the recollement hypotheses (H1)–(H3) hold?</h1><p class="lead">Generated from <code>blueprint/nodes/Q3/Q3_node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[DAG index](../../dag.html) · [appendix](../../appendix/index.html) · [context](../../context.html) · [key examples](../../key_examples/index.html) · [history](history.html)\n\n- **type:** question\n- **created:** 2026-08-06\n- **human:** —\n\n## Feeds\n\n[Q1](../Q1/index.html) and [Q2](../Q2/index.html). The package below is assumed at [Q1-L5](../Q1/Q1-L5/index.html) — the node carrying the criterion [Q1](../Q1/index.html) advertises at strength *necessary and sufficient* — and throughout [Q2](../Q2/index.html); an answer here says for which $X$ those two are entitled to it.\n\nThe relation is between the *questions*. No node of one lists a node of another in **depends-on**, so the three arguments stay separately auditable.\n\n## Setting\n\n$k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../context.html) and of [Q1](../Q1/index.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../appendix/def-orbits-iwahori-spherical.html). For $LX_\\lambda\\subseteq\\overline{LX}_\\mu$ write $i_{\\lambda,\\overline{LX}_\\mu}$ for the locally closed embedding through which $i_\\lambda$ factors.\n\n$LX$ carries the $K$-placid presentation $LX = \\varinjlim_{\\mu}\\overline{LX}_\\mu$ of [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html), read through [placidity](../../appendix/placid-ind-scheme.html) and [sheaves on a placid ind-scheme](../../appendix/ex-sheaf-placid-ind.html), refined for symmetric $X$ by [Chen–Yi filtered orbit order and $\\pi_0(LX)$](../../appendix/bb-chenyi-filtered-orbit-order.html). Coherence is [coherent $\\mathcal{D}$-modules](../../appendix/defn-coherent-d-mod.html) and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../appendix/def-renormalized.html).\n\n### The three hypotheses, stated canonically\n\nThey are the subject of this question, and nothing here assumes them. Each node says which of the three it is about. [Q2](../Q2/index.html) and [Q4](../Q4/index.html) state the same package and assume it; this is the canonical statement.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n## Problem statement\n\nFor $X$ in the standing class, decide for which $X$ — and, stratum by stratum and closure by closure, for which $\\lambda$ and which $\\mu$ — each of **(H1)**, **(H2)**, **(H3)** holds. They are asked separately because they are consumed separately: the forward direction of [Q1-L5](../Q1/Q1-L5/index.html)'s criterion uses **(H1)** alone, and the three fail for different geometric reasons.\n\n**What counts as an answer.** A condition on the geometry of $X$ and its orbit stratification. Eight are on record, each stated in full in the node named.\n\nConditions that are **necessary and sufficient**: coherence of $!$-restriction and $!$-extension at a stratum gives **(H1)** there — [Q3-L1](Q3-L1/index.html); generation by the objects supported on its single strata gives **(H3)** at a closure — [Q3-L5](Q3-L5/index.html); connectedness of $LX$ gives the directedness **(H2)** needs — [Q3-L6](Q3-L6/index.html).\n\nConditions that are **sufficient**: a filtered index with bounded supports for coherent objects gives **(H2)** — [Q3-L4](Q3-L4/index.html); bounded supports with the open–closed triangles, and no orbit finiteness, give **(H3)** — [Q3-L7](Q3-L7/index.html); on a named class, both at once — [Q3-L8](Q3-L8/index.html).\n\nConditions that are **necessary**: the strata must not all be open and closed with $\\Lambda_X^+$ infinite — [Q3-L3](Q3-L3/index.html); and $\\overline{i}_\\lambda$ must be of finite presentation — [Q3-L2](Q3-L2/index.html).\n\nA full answer lists geometric hypotheses on $X$ under which **(H1)**–**(H3)** provably hold, together with an $X$ in the standing class where each provably fails. Failing that, the question takes a sufficient condition paired with a failure instance for each hypothesis, with the gap between them stated.\n\n## Conjecture\n\n*(v1 — 2026-08-06.)* **The package is a support condition on coherent objects, and it fails at two named boundaries.**\n\n**(H1) is stratum-local.** By [Q3-L1](Q3-L1/index.html) it holds at $\\lambda$ exactly when $i_\\lambda^!$ and $i_{\\lambda!} = \\overline{i}_{\\lambda*}\\, j_{\\lambda!}$ preserve coherence, and the conjecture is that this holds wherever $j_\\lambda$ and $\\overline{i}_\\lambda$ are of finite presentation. That hypothesis is not innocent: by [Q3-L2](Q3-L2/index.html) it fails at the constant-loop stratum whenever $X$ has a $G$-fixed point and $\\dim X\\ge 1$, so $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ ([K1](../../key_examples/k1.html)) and $X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ sit outside any positive answer running through finite presentation.\n\n**(H2) needs two independent things.** The index must be directed — for symmetric $X$, by [Q3-L6](Q3-L6/index.html), exactly when $\\pi_0(LX)$ is a point, and in the group case exactly when $G$ is simply connected — and coherent objects must have bounded support; with both, [Q3-L4](Q3-L4/index.html) delivers it. Without the first it is not merely unproved but **false**: by [Q3-L3](Q3-L3/index.html), when infinitely many strata are open and closed — as for $X = T$ under $T\\times T$ with $\\dim T\\ge 1$ — the comparison functor is $\\mathrm{Ind}\\left(\\prod_\\lambda\\mathcal{D}_c\\right)\\rightarrow\\prod_\\lambda\\mathrm{Ind}\\left(\\mathcal{D}_c\\right)$, which is not fully faithful.\n\n**(H3) does not need orbit finiteness.** By [Q3-L5](Q3-L5/index.html) the hypothesis at a closure is exactly generation by the objects supported on its single strata, and by [Q3-L7](Q3-L7/index.html) that follows from a support bound on each coherent object with the open–closed triangles, however many strata the closure holds.\n\n**The assembly.** [Q3-L6](Q3-L6/index.html) supplies the directedness [Q3-L4](Q3-L4/index.html) needs, [Q3-L5](Q3-L5/index.html) supplies the criterion [Q3-L7](Q3-L7/index.html) peels against, and [Q3-L8](Q3-L8/index.html) puts the two together: for symmetric $X$ with $G^\\theta$ and $LX$ connected, granted **(H1)** and the formal recollement data, **(H2)** and **(H3)** both hold as soon as every coherent object is pushed forward from a single closure and, inside a closure, from finitely many orbit closures. That support bound is the one geometric obligation the package leaves, and it is what Q3 predicts an answer will turn on.\n\n## Pipeline\n\nThe next five actions, ranked by what each buys this question's confidence. Authored, not derived: which missing fact clears a defect is a judgement no gate can compute. Each row names the operator, its target and the record it reads; the site prints the target's current status and confidence beside it.\n\nNothing in Q3 is proved, so every row is a first round rather than a repair, and the ranking is by how much of the rest of the repository each unlocks.\n\n- **1.** `/prove Q3-L1` · [Q3-L1](Q3-L1/index.html) — a `ready` leaf, and the only node in Q3 that both other questions spend directly: it turns **(H1)** into two coherence conditions and nothing else, which is the form [Q1-L5](../Q1/Q1-L5/index.html) and every Q2 node assume it in.\n- **2.** `/prove Q3-L2` · [Q3-L2](Q3-L2/index.html) — `ready`, and it decides a standing hypothesis of the manuscript rather than a step of this question. If it holds, [the three standing hypotheses](../../appendix/assum-intro.html)(a) fails at the constant-loop stratum for [Q1-e2](../Q1/Q1-e2/index.html) and [Q1-e4](../Q1/Q1-e4/index.html), the two examples whose unramified input is best established.\n- **3.** `/prove Q3-L6` · [Q3-L6](Q3-L6/index.html) — `ready`, and it converts the directedness **(H2)** needs into connectedness of $LX$, a property that is checkable case by case and already known for the group case.\n- **4.** `/prove Q3-L5` · [Q3-L5](Q3-L5/index.html) — `ready`, and it supplies the criterion [Q3-L7](Q3-L7/index.html) peels against, so it is the prerequisite for the only route to **(H3)** that does not go through orbit finiteness.\n- **5.** `/prove Q3-L3` · [Q3-L3](Q3-L3/index.html) — `ready`, and the negative half of the answer: it makes **(H2)** false rather than merely unproved for $X = T$ under $T\\times T$, which fixes one end of the bracket the question is trying to close.\n";</script>
