<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q3-L2</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q3-L2 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q3-L2 — self-contained prompt: A $G$-fixed point: the closed stratum has no finite-level model, and is not a placid step\n\n## Task\n\nProve the target claim rigorously under exactly the stated hypotheses. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q3: For which $X$, and over which strata and closures, do the recollement hypotheses (H1)–(H3) hold?](../../../dag.html)\n\n**Standing setting.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../../context.html) and of [Q1](../../Q1/index.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). For $LX_\\lambda\\subseteq\\overline{LX}_\\mu$ write $i_{\\lambda,\\overline{LX}_\\mu}$ for the locally closed embedding through which $i_\\lambda$ factors.\n\n$LX$ carries the $K$-placid presentation $LX = \\varinjlim_{\\mu}\\overline{LX}_\\mu$ of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), read through [placidity](../../../appendix/placid-ind-scheme.html) and [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html), refined for symmetric $X$ by [Chen–Yi filtered orbit order and $\\pi_0(LX)$](../../../appendix/bb-chenyi-filtered-orbit-order.html). Coherence is [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html).\n\n### The three hypotheses, stated canonically\n\nThey are the subject of this question, and nothing here assumes them. Each node says which of the three it is about. [Q2](../../Q2/index.html) and [Q4](../../Q4/index.html) state the same package and assume it; this is the canonical statement.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n**Repository problem.** For $X$ in the standing class, decide for which $X$ — and, stratum by stratum and closure by closure, for which $\\lambda$ and which $\\mu$ — each of **(H1)**, **(H2)**, **(H3)** holds. They are asked separately because they are consumed separately: the forward direction of [Q1-L5](../../Q1/Q1-L5/index.html)'s criterion uses **(H1)** alone, and the three fail for different geometric reasons.\n\n**What counts as an answer.** A condition on the geometry of $X$ and its orbit stratification. Eight are on record, each stated in full in the node named.\n\nConditions that are **necessary and sufficient**: coherence of $!$-restriction and $!$-extension at a stratum gives **(H1)** there — [Q3-L1](../Q3-L1/index.html); generation by the objects supported on its single strata gives **(H3)** at a closure — [Q3-L5](../Q3-L5/index.html); connectedness of $LX$ gives the directedness **(H2)** needs — [Q3-L6](../Q3-L6/index.html).\n\nConditions that are **sufficient**: a filtered index with bounded supports for coherent objects gives **(H2)** — [Q3-L4](../Q3-L4/index.html); bounded supports with the open–closed triangles, and no orbit finiteness, give **(H3)** — [Q3-L7](../Q3-L7/index.html); on a named class, both at once — [Q3-L8](../Q3-L8/index.html).\n\nConditions that are **necessary**: the strata must not all be open and closed with $\\Lambda_X^+$ infinite — [Q3-L3](../Q3-L3/index.html); and $\\overline{i}_\\lambda$ must be of finite presentation — [Q3-L2](index.html).\n\nA full answer lists geometric hypotheses on $X$ under which **(H1)**–**(H3)** provably hold, together with an $X$ in the standing class where each provably fails. Failing that, the question takes a sufficient condition paired with a failure instance for each hypothesis, with the gap between them stated.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It is currently a terminal result of its proof branch.\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-06 — no existing node carries this.** The Q1 children that discharge the package assume finite presentation throughout, and the boundary instance already on file for that subtree records the failure of *per-closure orbit finiteness* for $X = M_n$, which is a different defect: finiteness is about how many strata a closure holds, and this node is about whether one stratum is cut out at finite level.\n\n## Target statement\n\nLet $K = L^+G$, let $X$ be a smooth affine spherical $G$-variety, and let strata, closures and embeddings be those of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html). Assume:\n\n**(A) A $G$-fixed point.** $X$ has a $k$-point $x_0$ fixed by $G$, and $\\dim X\\ge 1$.\n\n**(B) The arc space is one orbit closure.** There is $\\mu_0\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) with $\\overline{LX}_{\\mu_0} = L^+X$.\n\nThen:\n\n1. the constant loop at $x_0$ is fixed by $K$, so its $K$-orbit is the reduced point $\\{x_0\\}$; that orbit is closed in $LX$ and equal to its own closure, giving an index $\\lambda_0\\in\\Lambda_X^+$ with $LX_{\\lambda_0} = \\overline{LX}_{\\lambda_0} = \\{x_0\\}$ and $K\\backslash LX_{\\lambda_0}\\simeq BK$;\n\n2. the tangent space of $L^+X$ at $x_0$ is $T_{x_0}X\\otimes k[[t]]$, which is infinite-dimensional; hence the maximal ideal $\\mathfrak{m}_{x_0}\\subseteq\\mathcal{O}(L^+X)$ has infinite-dimensional Zariski cotangent space $\\mathfrak{m}_{x_0}/\\mathfrak{m}_{x_0}^2$ and is not finitely generated;\n\n3. consequently, for the presentation $L^+X\\simeq\\varprojlim_n L^nX$ of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) and for every $n\\ge 0$, the fibre of $L^+X\\rightarrow L^nX$ over the image of $x_0$ is strictly larger than $\\{x_0\\}$: no finite level cuts the closed stratum out;\n\n4. hence the closed embedding $\\overline{LX}_{\\lambda_0}\\hookrightarrow\\overline{LX}_{\\mu_0}$ is not of finite presentation, so the family $\\left\\{\\overline{LX}_\\mu\\right\\}_{\\mu\\in\\Lambda_X^+}$ does not satisfy the transition condition that [placidity](../../../appendix/placid-ind-scheme.html) requires of a placid ind-scheme presentation, and the finite presentation asserted by [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) does not hold at $\\lambda_0$.\n\nBoth hypotheses hold for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$, with $x_0 = 0$ and $\\overline{LX}_{\\mu_0} = k[[t]]$, and for $X = M_n$ under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$ with $x_0 = 0$ and $\\overline{LX}_{\\mu_0} = \\mathrm{Mat}_n(k[[t]])$.\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../appendix/conj-intro.html) holds for $X$.\n\n### [placidity](../../../appendix/placid-ind-scheme.html) — `placid_ind_scheme`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:669).\n\n- A scheme/algebraic space $X$ *admits a placid presentation* if $X\\simeq\\varprojlim_i X_i$ is a cofiltered limit of finite-type schemes/algebraic spaces whose transition maps $X_i\\rightarrow X_j$ are smooth and affine; such an $X$ is a *placid* scheme/algebraic space.\n- An ind-scheme $X$ is *placid* if $X = \\varinjlim_i X_i$ is a filtered colimit of placid schemes along closed embeddings of finite presentation. If a placid group scheme $H$ acts on a placid ind-scheme $X$ and each $X_i$ in the presentation is $H$-stable, $X$ is an *$H$-placid ind-scheme*.\n\n- **note:** $H$-placidity is a property *of a chosen presentation*, not of $X$ alone. Two presentations of the same $LX$ — the $K$-orbit-closure one and the $I$-orbit-closure one — are both supplied by [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\n### [loops, jets and positive loops are placid — $L^nX$, $L^+X$, $LX$](../../../appendix/ex-loops-placid.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Example** (main.tex:694–718, unlabelled; cite by line). Let $X\\in\\mathrm{AffSch}^{f.t.}$ be smooth affine of finite type. The $n$-jets $L^nX$, defined on $k$-algebras by\n\n$$\nL^nX(R) := X\\left(R[t]/t^n\\right),\n$$\n\nare represented by affine schemes of finite type, and the presentation $L^+X\\simeq\\varprojlim_n L^nX$ exhibits the positive loop space $L^+X$ as a placid scheme ([placidity](../../../appendix/placid-ind-scheme.html)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **hypotheses:** $X$ smooth affine of finite type\n- **note:** applied to $X = G$ this presents $K = L^+G$ ([the standing notation](../../../appendix/subsec-notations.html)) as $\\varprojlim_m L^mG$ with the jet groups $L^mG$ as levels and homomorphic transitions; $L^1G = G$, so the level-one evaluation is evaluation at $t = 0$. Caveat transcribed from main.tex:710–717: if placid presentations are required to have *surjective* transitions, as in [[raskin_dmodules_infinite_var, §4.2](../../../../papers/raskin_dmodules_infinite_var.pdf)], the pieces $LX^i$ need not be placid in that stricter sense (see [[BZSV, Example 7.2.2](../../../../papers/BZSV.pdf)]).\n\n### [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) — `ex:sheaf_placid_ind`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Example** (main.tex:730). Let $X = \\varinjlim_i X_i$ be a placid ind-scheme. Then\n\n$$\n\\mathcal{D}^!(X) = \\varinjlim_i\\mathcal{D}^!(X_i), \\qquad \\mathcal{D}^*(X) = \\varinjlim_i\\mathcal{D}^*(X_i),\n$$\n\nwith connecting morphisms the left adjoint of $!$-pullback, respectively the right adjoint of $*$-pushforward. If $X$ admits a dimension theory there is a canonical duality $\\mathcal{D}^!(X)\\simeq\\mathcal{D}^*(X)$ [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)], and we then do not distinguish the $!$- and $*$-versions.\n\n- **hypotheses:** $X$ a placid ind-scheme; a dimension theory for the identification $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ — supplied for $LX$ by [the three standing hypotheses](../../../appendix/assum-intro.html)(b)\n\n### [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../Q1/Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../Q1/Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n- **note:** this is what makes [the three standing hypotheses](../../../appendix/assum-intro.html)(a) automatic in the paper's generality, and it is the source of every stratification argument in Q1. Which clause the citing nodes actually consume, and whether they consume it inside the range clause (a) now states — twenty node files link this entry from their `objects:` field (grep of `blueprint/nodes`, 2026-08-09):\n\n  *Inside the range.* [Q1-L3](../../Q1/Q1-L3/index.html) does not read (a) off this entry at all: its hypothesis **(C)** posits a subset $\\Lambda'\\subseteq\\Lambda_X^+$ carrying the finite presentation, and its own text already records that the source establishes (a) only over the open-$G$-orbit range. [Q1-L4-e4](../../Q1/Q1-L4/Q1-L4-e4/index.html) and [Q3-L6](../Q3-L6/index.html) restrict $X$ to symmetric, where $\\mathring{X} = X$ and the restriction is vacuous.\n\n  *Outside it.* Twelve nodes take clause (a) at an unrestricted index — some $\\lambda\\in\\Lambda_X^+$, or a pair $\\mu\\le\\mu'$ — with $X$ only smooth affine spherical and so possibly non-homogeneous: [Q1-L3-L4](../../Q1/Q1-L3/Q1-L3-L4/index.html), [Q1-L3-L5](../../Q1/Q1-L3/Q1-L3-L5/index.html), [Q1-L4](../../Q1/Q1-L4/index.html), [Q1-L4-L1](../../Q1/Q1-L4/Q1-L4-L1/index.html), [Q1-L4-L1-L3](../../Q1/Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/index.html), [Q1-L5-L3](../../Q1/Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L3-L2](../../Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L2/index.html), [Q1-L5-L3-L3](../../Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L3/index.html), [Q1-L5-L4](../../Q1/Q1-L5/Q1-L5-L4/index.html), [Q1-L5-L5](../../Q1/Q1-L5/Q1-L5-L5/index.html), [Q1-L5-L6](../../Q1/Q1-L5/Q1-L5-L6/index.html) and [Q3-L4](../Q3-L4/index.html). What each needs is the finite presentation of $j_\\lambda$, of $\\overline{i}_\\mu$ and of $\\overline{LX}_\\mu\\hookrightarrow\\overline{LX}_{\\mu'}$ — clause (a) — and on this entry as now stated it has that at the indices of $\\Lambda_X^{+,\\circ}$ and, beyond them, from main.tex:770–772 alone. Naming them is this entry's job; repairing them is `/update`'s and `/prove`'s.\n\n  *At the boundary the range excludes.* [Q3-L2](index.html) states the failure itself — for $X$ with a $G$-fixed point the closed stratum $\\{x_0\\}$ has $\\overline{i}_{\\lambda_0}$ not finitely presented — so the amendment supports that node rather than damaging it. [Q1-L4-e1](../../Q1/Q1-L4/Q1-L4-e1/index.html) for $X = \\mathbb{A}^1$ and [Q1-L5-e4](../../Q1/Q1-L5/Q1-L5-e4/index.html) for $X = M_n$ are the two non-homogeneous instances whose index sets contain such a boundary index.\n\n  *Neither clause's range.* [Q1-L5](../../Q1/Q1-L5/index.html)(H2) consumes clause (b), the indexing of the limit. [Q1-L3-a2](../../Q1/Q1-L3/Q1-L3-a2/index.html) names this entry for the loop-space-to-$p$-adic dictionary and consumes neither.\n- **note:** *Provenance, checked at page level on 2026-08-05 against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025).* In v4, Theorem 36 (§5.2, p. 21) is clause (a) above and **not** the presentation; the presentation is Proposition 39(ii) (§5.3, p. 23), whose part (i) is the $I_0$-statement. Proposition 39 states the steps as the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$, indexed by tuples $\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}$ and called *locally equidimensional* placid presentations; the single-index form displayed above is the manuscript's (main.tex:772), and the two agree when $LX$ is connected. The proof of Thm 36 (pp. 21–22) also fixes the mechanism: $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ is the Noetherian-descent factorization of a finitely presented morphism **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$, with $j_\\lambda$ a placid fp-open and $i_\\lambda$ a placid fp-closed embedding.\n\n  *The manuscript's numbers are another version's.* main.tex:772 cites the presentation as \"[Theorem 36]\" and main.tex:1227 cites $K$-placidity of $\\overline{LX}_\\beta$ as \"[Prop. 29.(ii)]\"; neither matches v4, where those are Prop. 39(ii) and Thm 36(i). Recorded as provenance for whoever reads the source alongside the manuscript — not as a correction to main.tex, which no agent edits.\n- **note:** *The index range of clause (a), checked at page level on 2026-08-09 against the same PDF (arXiv:2310.20006**v4**, 10 Jul 2025), pp. 19–24.* Reported twice before it was acted on, and confirmed on the pages.\n\n  *§5 is set in the symmetric case, and its construction lives on the open $G$-orbit.* §5.1 (p. 20) opens \"Let $X^\\circ = BK/K\\subset X$ be the open $B$-orbit\", so $X = G/K$ is homogeneous, and p. 22 derives its exact sequences (7) from \"the fibration $K\\rightarrow G\\rightarrow G/K = X$ (note that we assume $K$ is connected)\". In the affine degeneration $\\pi\\colon\\mathcal{X}\\rightarrow A$ built there, each fibre $\\mathcal{X}_a$ is \"an affine spherical variety for $G$ (not necessary smooth and homogeneous)\", and $\\mathcal{X}^\\bullet\\subseteq\\mathcal{X}$ is defined as the open subscheme whose fibre $\\mathcal{X}^\\bullet_a\\subseteq\\mathcal{X}_a$ is the open $G$-orbit.\n\n  *Lemma 34 (p. 20) is where the range enters.* It is stated under \"Let $\\lambda\\in\\Lambda_S^+$\", fixed one paragraph above, and says that $f_\\lambda$ induces an isomorphism $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$ — the stratum is arcs into the open-$G$-orbit locus. Here $\\Lambda_S^+$ is the symmetric index set of [Chen–Yi symmetric orbit parametrization and closure relation](../../../appendix/bb-chenyi-symmetric-orbits.html)(1), for which $\\mathring{X} = X$.\n\n  *Theorem 36's own statement carries no index restriction; its proof does.* On p. 21 the theorem quantifies $v$, $v'$, $\\lambda$, $\\lambda'$ nowhere, while the proof reads \"For any $\\lambda\\in\\Lambda_S^+$, choose $i, i'$ satisfying (6) and $LX_\\lambda\\subset L^iX$. Then Lemma 34 implies there is a Cartesian diagram …\", and obtains the fp-locally closed $\\eta_\\lambda$ by base change from $\\eta\\colon L^+\\mathcal{X}^\\bullet_\\lambda\\rightarrow L^+\\mathcal{X}_\\lambda\\rightarrow L^{i'}\\mathcal{X}_\\lambda$. So the invocation of Lemma 34 is exactly what constrains the range, and the constraint is visible only inside the proof. The Iwahori half (p. 22) is reduced to the spherical one — \"it suffices to show that the embedding $\\mathcal{O}_v\\rightarrow L^+Gx_v$ into the spherical orbit through $x_v\\in\\mathcal{O}_v$ is finitely presented\" — and so inherits the same range.\n\n  *Remark 37 (p. 22) widens the variety class and not the range.* In full: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites (spelling as in the source), Theorem 36 remains true for general spherical varieties.\" Both named inputs are steps of the proof — [SW22, Lem. 2.3.10] is what Lemma 34's own proof invokes, Theorem 35 is Drinfeld's placidity — and nothing in the remark revisits $\\mathcal{X}^\\bullet$ or the quantifier over $\\Lambda_S^+$. The two qualifications are therefore independent and both stand.\n\n### [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../Q1/Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [Chen–Yi: the closure order is filtered on each component, and $\\pi_0(LX)$](../../../appendix/bb-chenyi-filtered-orbit-order.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, §5.3: the exact sequences (7), Lemma 38, and Proposition 39](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety with $G^\\theta$ connected, $S$ a maximal $\\theta$-split torus, and $\\Lambda_S^+\\cong\\Lambda_X^+$ the index set of $L^+G$-orbits with the closure order of [Chen–Yi symmetric orbit parametrization and closure relation](../../../appendix/bb-chenyi-symmetric-orbits.html). Write\n\n$$\nLX = \\bigsqcup_{\\beta\\in\\pi_0(LX)} LX_\\beta\n$$\n\nfor the decomposition into connected components, and set $\\Lambda_{S,\\beta}^+ = \\{\\lambda\\in\\Lambda_S^+\\mid LX_\\lambda\\subseteq LX_\\beta\\}$ and $\\underline{\\Lambda}_S^+ = \\{\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}\\mid \\lambda_\\beta\\in\\Lambda_{S,\\beta}^+\\}$. Then:\n\n**(a) The component group** *(the isomorphisms of exact sequences (7), p. 22)*. With $Q\\subseteq\\Lambda_T$ the coroot lattice and $\\tau(\\lambda) = -\\theta(\\lambda)+\\lambda$, there are isomorphisms of exact sequences\n\n$$\n\\left(\\pi_0(LG)\\rightarrow\\pi_0(LX)\\rightarrow 0\\right)\\ \\cong\\ \\left(\\pi_1(G)\\rightarrow\\pi_1(X)\\rightarrow\\pi_0(G^\\theta)\\right)\\ \\cong\\ \\left(\\Lambda_T/Q\\xrightarrow{\\ \\tau\\ }\\Lambda_S/(\\Lambda_S\\cap Q)\\rightarrow 0\\right),\n$$\n\ninduced by the fibration $G^\\theta\\rightarrow G\\rightarrow G/G^\\theta = X$. In particular $\\pi_0(LX)\\cong\\Lambda_S/(\\Lambda_S\\cap Q)$.\n\n**(b) Filteredness one component at a time** *(Lemma 38, p. 22, and the paragraph after its proof, p. 23)*. For each $\\beta\\in\\pi_0(LX)$ the set $\\Lambda_{S,\\beta}^+$, partially ordered by $\\lambda\\le\\lambda'$ if $LX_\\lambda\\subseteq\\overline{LX}_{\\lambda'}$, is a filtered set; likewise $\\mathcal{V}_\\beta = \\{v\\mid\\mathcal{O}_v\\subseteq LX_\\beta\\}$ under $v\\le v'$ if $\\mathcal{O}_v\\subseteq\\overline{\\mathcal{O}}_{v'}$. Consequently $\\underline{\\Lambda}_S^+$, partially ordered by $\\underline{\\lambda}\\le\\underline{\\lambda}'$ if $\\lambda_\\beta\\le\\lambda'_\\beta$ for every $\\beta$, is a filtered set.\n\n**(c) The presentation is indexed by tuples** *(Prop. 39, p. 23)*. The disjoint union $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$ is a locally equidimensional placid scheme, and\n\n$$\nLX\\ \\cong\\ \\operatorname*{colim}_{\\underline{\\lambda}\\in\\underline{\\Lambda}_S^+}\\ \\overline{LX}_{\\underline{\\lambda}}\n$$\n\nis a locally equidimensional $L^+G$-placid presentation; the same statement holds for $I_0$-orbits with $\\overline{\\mathcal{O}}_{\\underline{v}} = \\bigsqcup_\\beta\\overline{\\mathcal{O}}_{v_\\beta}$.\n\n- **hypotheses:** $X = G/G^\\theta$ **symmetric with $G^\\theta$ connected** — the source writes \"note that we assume $K$ is connected\" at (7), and clause (a) uses the restricted root datum of its §3.1, so the entry does not extend to general spherical $X$. Remark 37 of the source extends Theorem 36 — the content of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) — and says nothing about §5.3. A node using clause (b) must say **which** $\\beta$ it works over: filteredness is asserted per connected component and for the tuple set $\\underline{\\Lambda}_S^+$, and for no other index. A node using clause (c) must use the tuple index $\\underline{\\Lambda}_S^+$; the steps are the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}}$, which are single orbit closures exactly when $\\pi_0(LX)$ is a single point.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n```\n\n## The key examples this statement is tested against\n\nThe register at [key_examples.md](../../../key_examples/index.html) fixes the cases where the answer is known. A reading aid, outside the closed world: check the statement against it, never discharge a step with it.\n\n- **K1 — Iwasawa–Tate: $X = \\mathbb{A}^1$ under
