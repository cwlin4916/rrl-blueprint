 [priorities.md](../../../../blueprint/priorities.md): the origin of $L\\mathbb{A}^1$ has infinite codimension, and [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) runs through the nondegenerate locus.\n- **2026-08-06 — why it is stated negatively, and what it does not claim.** The statement stops at the geometry: it does not assert that $i_{\\lambda_0}^!$ or $i_{\\lambda_0!}$ fails to preserve coherence, because deciding that needs the costalk of a specific object at an infinite-codimension point and the closed world carries nothing that computes one. What it does establish is that the hypothesis every construction of the package uses at $\\lambda_0$ is false there, so a positive answer to Q3 must either exclude such $X$ or handle the degenerate strata by another route. Hypothesis **(B)** is stated rather than derived so that clause 4 names a transition of the presentation of the Setting; it is checked in the two displayed cases.\n- **2026-08-06 — no existing node carries this.** The Q1 children that discharge the package assume finite presentation throughout, and the boundary instance already on file for that subtree records the failure of *per-closure orbit finiteness* for $X = M_n$, which is a different defect: finiteness is about how many strata a closure holds, and this node is about whether one stratum is cut out at finite level.\n";</script>
