e exhausted by the steps, so that the source of the comparison is the ind-completion of that colimit rather than something larger.\n- **2026-08-06 — why bounded support is a hypothesis and not a theorem.** The appendix's example on sheaves on a placid ind-scheme presents $\\mathcal{D}^!$ as a colimit along $!$-extension, and in $\\mathrm{Pr}^L$ such a colimit is the *limit* of the $!$-restrictions: its objects are compatible families over the steps, which need not come from a single step. The difference between the union of the steps and the compatible families over them is exactly what hypothesis **(C)** rules out, and it is why this node is a conditional rather than a restatement of the Q1 child that asserts **(H2)** outright.\n- **2026-08-06 — how it is used.** It supplies the **(H2)** half of the assembly node of this question, which verifies hypothesis **(A)** for a symmetric $X$ with connected loop space through the new appendix entry on the filtered orbit order.\n";</script>
