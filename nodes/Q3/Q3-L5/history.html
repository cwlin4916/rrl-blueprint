in which the remaining Q3 nodes about **(H3)** consume it.\n- **2026-08-06 — the conditional counterpart, and what is new.** The Q1 child that discharges **(H3)** does so over a closure containing **finitely many** orbits, by peeling. This node assumes no finiteness and no property of the closure order at all; it is the criterion that says what finiteness was being used *for*, and it leaves open the question — the subject of the sibling that follows it — of what replaces finiteness when a closure holds infinitely many strata, as it does for $X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$.\n- **2026-08-06 — why full faithfulness is not assumed.** Only the existence of the continuous left adjoint enters, through the adjunction $\\operatorname{Map}(i_{\\lambda,Z!}\\mathcal{E},\\mathcal{M})\\simeq\\operatorname{Map}(\\mathcal{E},i_{\\lambda,Z}^!\\mathcal{M})$; the statement is therefore available at strata where the harder half of **(H1)** — that the extension is fully faithful — has not been established.\n";</script>
