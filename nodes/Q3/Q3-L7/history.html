 is strictly weaker than a bound on the closure.\n- **2026-08-06 — why it depends on [Q3-L5](../Q3-L5/index.html) and on nothing else.** The criterion node converts joint conservativity into generation by the stratum-supported objects; with that in hand the argument is a peeling over a *finite* closed union, one stratum at a time, which is what hypotheses **(A)** and **(B)** are stated to support. Without the criterion the peeling would have to be run against a vanishing condition on an ind-object, where the finite induction has no purchase.\n- **2026-08-06 — what it does not claim.** It does not establish **(C)** for any $X$, and it does not claim **(C)** follows from anything else in the closed world; whether the coherent objects on an arc space have bounded support is exactly the kind of statement the question exists to isolate. Hypothesis **(B)** is likewise carried rather than derived: the closed world holds no entry for the open–closed recollement triangle, which is the appendix gap standing on the panel as **P3** in [priorities.md](../../../../blueprint/priorities.md).\n";</script>
