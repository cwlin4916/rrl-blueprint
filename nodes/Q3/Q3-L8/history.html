l) turns hypothesis **(A)** into filteredness of $\\Lambda_X^+$, which is hypothesis **(A)** of [Q3-L4](../Q3-L4/index.html); the first half of **(C)** is that node's own **(C)**, so **(H2)** follows. The second half of **(C)** is hypothesis **(C)** of [Q3-L7](../Q3-L7/index.html), which with the adjunctions and triangles of **(B)** gives **(H3)** at every $\\mu$ — and gives it without assuming that a closure holds finitely many strata, so the conclusion is not restricted to the case the Q1 subtree already covers.\n- **2026-08-06 — what it deliberately leaves out.** It does not verify **(C)** for any $X$, does not verify **(H1)**, and makes no claim about non-symmetric $X$ or about $X$ with disconnected loop space — the second of which the sibling on discrete stratifications shows can defeat **(H2)** outright. It also does not restate the per-closure orbit finiteness that a Q1 node carries for symmetric $X$: the point of routing **(H3)** through bounded supports is that finiteness is sufficient but not necessary, and the question is which condition is really doing the work.\n";</script>
