y carried this before: the Q1 child that scopes per-closure orbit **finiteness** to symmetric $X$ says how many strata sit below one $\\mu$, and says nothing about whether two strata sit below a common one.\n- **2026-08-06 — the appendix entry it rests on.** [Chen–Yi filtered orbit order and $\\pi_0(LX)$](../../../appendix/bb-chenyi-filtered-orbit-order.html) was written this run for exactly this node, transcribed at page level from the source's §5.3 (the exact sequences (7), Lemma 38, Proposition 39, pp. 22–23). It also supplies clause 3: the presentation the source actually proves is indexed by $\\pi_0$-wise tuples, and the single-index form the Setting uses is the manuscript's, agreeing with the source when $LX$ is connected.\n- **2026-08-06 — how it is used.** It verifies hypothesis **(A)** of the positive **(H2)** criterion of this question for a symmetric $X$ with connected loop space, and it explains when the discrete case that makes **(H2)** fail can arise at all: an infinite $\\pi_0(LX)$.\n";</script>
