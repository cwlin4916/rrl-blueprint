<header class="bar"><nav class="crumbs"><a href="../../../../index.html">blueprint</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L4</a><i>›</i><a href="../index.html">Q1-L4-L2</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4-L2, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1-L4/Q1-L4-L2/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReviewed against the seven-point checklist, with the four commissioned hard targets pressed first: the Hopf-image lemma $(\\star)$, the ideal/limit bookkeeping of (a), the kernel computation of (b), and the Mittag-Leffler/quotient argument of (c). Summary of what was hunted and survived, then the flaws found (all MINOR).\n\n**Statement diff.** The draft's `## Lemma` block matches `node.md` `## Statement` word for word, links and display included. No renotation, no strengthened hypothesis, no weakened conclusion.\n\n**Closed world and hallucination check.** The draft cites no node — the `[Q1-L4]` links occur only in the statement's inherited \"In particular\" clause and in the final sentence *deriving* that clause, a forward reference to the consumer, not a dependency; Q1-L4-L1 is nowhere used (the stabilizer's closedness is re-derived in Step 1, as required of a ready leaf). All four object links resolve to live anchors in `blueprint/appendix.md` (`#subsec-notations`, `#def-orbits-iwahori-spherical`, `#ex-loops-placid`, `#placid-ind-scheme`), and their hypotheses are met where invoked: the loops/jets entry requires $X$ smooth affine of finite type and is applied to $G$ (connected reductive, so smooth affine of finite type) and to the standing spherical $X$; the placidity definition's demands (cofiltered index, finite-type levels, smooth affine transitions) are each separately established before the word \"placid\" is uttered. The one bib key, `chenyi_2025singularitiesorbitclosuresloop`, exists (`refs.bib:213`). Its page claim was verified on the PDF: p. 22, inside the proof of Thm 36, does define $H \\subset L^+G$ as the stabilizer of $x_v$, the jet images $H_j \\subset L_j^+G$, and displays $L^+Gx_v \\cong \\varprojlim_j L_j^+G/H_j$ — and the draft correctly walls this off as \"orientation only, not cited\". Everything else invoked is on the authorized standard-mathematics list (Cartier, Chevalley, unipotent stability, square-zero lifting, filtered-colimit ring algebra).\n\n**The four hard targets.** (1) $(\\star)$ is complete by the route it names: for a Hopf map $f\\colon H_1\\to H_2$ over a field, $\\Delta(\\mathrm{im}f)\\subseteq\\mathrm{im}(f\\otimes f)=\\mathrm{im}f\\otimes\\mathrm{im}f$ inside $H_2^{\\otimes 2}$ precisely because $(\\mathrm{im}f)^{\\otimes2}\\hookrightarrow H_2^{\\otimes2}$ stays injective over a field; antipode and counit descend by naturality, and both factorizations are Hopf by the same cancellation — the draft's clause \"tensor squares of injections stay injective\" is the load-bearing point, and no finiteness of $H_1$ is used anywhere. Its application to $A_m\\to A/I$ is legitimate: Step 1 makes $K_\\lambda$ a closed subscheme equal to the stabilizer subgroup functor, hence a closed subgroup scheme, so $A/I$ is Hopf. (2) Step 3's colimit identities ($I=\\bigcup I_m$, $\\operatorname{colim}(A_m/I_m)=A/I$ with injective transitions since $I_{m+1}\\cap A_m=I_m$) are correct, and the equivalence of ambients for the limit is honestly discharged: $\\operatorname{Spec}(A/I)$ represents $\\varprojlim K_{\\lambda,m}$ in affine $k$-schemes, in all $k$-schemes, and pointwise in fpqc sheaves. Step 4's chain — schematic dominance from ring injectivity, smoothness of the levels by Cartier, closed image by Chevalley, faithful flatness by generic flatness plus translation, fiber smoothness from the Cartier-smooth kernel — has every hypothesis in place. (3) Step 5 runs on $R$-points with the entry's indexing $L^mX(R)=X(R[t]/t^m)$: the ideal $(t^m)/(t^{m+1})$ is square-zero exactly for $m\\ge1$, which is the range (b) claims, and the bottom case $m=1$ correctly lands the kernel of $K_{\\lambda,2}\\to K_{\\lambda,1}$ inside $\\ker(L^2G\\to G)\\cong\\mathbb{V}(\\mathfrak{g})$. The kernel of the restricted transition is $K_{\\lambda,m+1}\\cap\\ker(L^{m+1}G\\to L^mG)$ because the restriction squares commute at the ring level. (4) Step 6's surjectivity argument is a genuine proof: the fiber of $\\pi$ over any point $\\xi$ is $\\operatorname{Spec}$ of $\\operatorname{colim}_m(A_m/I_m\\otimes_{A_1/I_1}\\kappa(\\xi))$, a filtered colimit of nonzero rings (each stage nonzero by Step 4 surjectivity), and $1=0$ in a filtered colimit of rings indeed forces $1=0$ at a finite stage — affineness is used exactly where \"nonempty $\\Leftrightarrow$ ring nonzero\" needs it. Mono ($gh^{-1}\\in U_\\lambda(R)$) plus epi (faithfully flat affine cover, stable under base change) gives the representability $K_\\lambda/U_\\lambda\\simeq K_{\\lambda,1}$ in fpqc sheaves. Step 7's factorization — finitely many generators of $\\mathcal{O}(Q)$ landing in one $B_m$, $H_m$ a closed subgroup of the unipotent $U_{\\lambda,m}$ by $(\\star)$, $\\psi$ a homomorphism by cancellation along $B_m^{\\otimes2}\\hookrightarrow\\mathcal{O}(U_\\lambda)^{\\otimes2}$, then Chevalley — is the honest heart of pro-unipotence and is complete.\n\n**Word budget.** Hand count after the gate's stripping rule: approximately 897 of 900 words. Within budget, but with no slack for a revision.\n\n**Flaw 1** [MINOR] (Step 1, \"$K=\\varprojlim_mL^mG$\" and \"$LX\\simeq\\varinjlim_iLX^i$\"; Step 5, \"$\\ker(L^{m+1}G\\to L^mG)\\cong\\mathbb{V}(\\mathfrak{g})$\")\n`blueprint/context.md` ## Notation asks every $=$/$\\simeq$ to name its ambient. These three carry none. Mitigation, and why this is not MAJOR: the two Step 1 displays transcribe the appendix entry's own unsubscripted displays, and the two instances where the ambient is load-bearing — Step 3's limit and Step 6's quotient — do name their ambients explicitly and correctly. Repair: an apposition (\"in affine $k$-schemes\"; \"as group schemes over $k$\") at each site.\n\n**Flaw 2** [MINOR] (Caveats, \"Pro-unipotence is proved in the affine sense of Step 7: injective $\\phi^*$, affine finite-type target\")\nThe caveat reads as if the affine sense might be a restriction of the Statement's \"every finite-type quotient group of $U_\\lambda$ is unipotent\". Assessed: it is not. Any finite-type quotient group of the affine group scheme $U_\\lambda$ over a field — the fpqc quotient by a closed normal subgroup, or the image under a homomorphism into an affine finite-type group — is itself affine with faithfully flat quotient map (standard Hopf-algebraic quotient theory over a field, Takeuchi/Waterhouse), and faithful flatness gives injectivity of $\\phi^*$; so Step 7's hypothesis, which asks only schematic dominance, covers every such quotient and proves strictly more than the clause. Repair: one sentence in the caveat stating this bridge, so the record shows bookkeeping rather than a scope reduction.\n\n**Flaw 3** [MINOR] (Step 1, \"makes the transitions surjective, hence faithfully flat\"; Step 6, \"monically\")\nTwo compressions that lean on material stated elsewhere and could trip a reader. (i) Surjectivity alone does not give faithful flatness; the inference is valid only with the smoothness of the transitions recorded in the same sentence's first clause (from the loops/jets entry). (ii) \"Monically\" is injectivity of the *presheaf* quotient into $K_{\\lambda,1}$ plus the elided standard fact that sheafification preserves monomorphisms into a sheaf. Both are correct as intended; each deserves three words.\n\n**Flaw 4** [MINOR] (Lemma block, \"$\\mathrm{ev}_1 = \\mathrm{ev}_0$\" — inherited from `node.md`)\nThe symbol $\\mathrm{ev}_0$ is defined nowhere in the draft, the node, or the appendix; the loops/jets entry's note (\"the level-one evaluation is evaluation at $t=0$\") is the evident intent. The draft was right not to editorialize a verbatim statement, so this is a statement-side blemish for `/update` to clean, recorded here for the audit trail.\n\nVERDICT: PASS\n";</script>
