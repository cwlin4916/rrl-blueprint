{\\lambda,1}$ — and recorded four MINORs, none obstructing; the statement-side nit (undefined $\\mathrm{ev}_0$) is left to `/update`.\n- **2026-08-05 — objection answered, statement corrected** by `/update` ([u1](../../../../blueprint/nodes/Q1-L4/Q1-L4-L2/updates/u1.md)): a user review passage held that a stabilizer in a placid group scheme need not be placid, because the transition maps of the image presentation $S_i = \\operatorname{im}(S\\to G_i)$ are not guaranteed affine. Verified in general — [`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html) asks the levels only to be of finite type, and in characteristic $p$ a surjective homomorphism of smooth groups can fail to be smooth — and refuted against this node: the levels here are the affine jet groups $L^mG$, so every transition is a morphism of affine schemes and affineness is free, while smoothness is bought with characteristic $0$ (Cartier), and Raskin Ex. 4.2.2 reaches the same conclusion in one line for any affine group scheme over such a field. The only edit is notational — the undefined $\\mathrm{ev}_0$ removed from the Statement and from its frozen copy in the draft, discharging [r1](critiques/r1.html) Flaw 4 — so the node stays `proved`.\n";</script>
