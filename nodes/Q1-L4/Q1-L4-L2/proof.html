<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L2</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L2 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L2 — jet images present $K_\\lambda$\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [`subsec:notations`](../../../appendix/subsec-notations.html), [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html), [loops, jets and positive loops](../../../appendix/ex-loops-placid.html), [`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html); depends-on: none.\n- **notation:** $A_m:=\\mathcal{O}(L^mG)$, $A:=\\mathcal{O}(K)$, $I\\subseteq A$ the ideal of $K_\\lambda$, $I_m:=I\\cap A_m$, $\\mathbb{V}(\\mathfrak{g})$ the additive group of $\\mathfrak{g}=\\operatorname{Lie}G$; everything over $k$.\n\n## Lemma\n\nFix $\\lambda\\in\\Lambda_X^+$ and $x_\\lambda\\in LX_\\lambda(k)$ as in [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html), and let $K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$, a closed subgroup scheme of $K = L^+G$. For $m\\ge 1$ let $\\mathrm{ev}_m\\colon K\\to L^mG$ be the jet evaluation ([loops, jets and positive loops](../../../appendix/ex-loops-placid.html); $L^1G = G$), and let $K_{\\lambda,m}\\subseteq L^mG$ be the scheme-theoretic image of $\\mathrm{ev}_m|_{K_\\lambda}$. Then:\n\n(a) each $K_{\\lambda,m}$ is an affine group scheme of finite type over $k$, the transition maps $K_{\\lambda,m+1}\\to K_{\\lambda,m}$ are surjective smooth affine group homomorphisms, and the canonical map\n\n$$\nK_\\lambda \\xrightarrow{\\ \\sim\\ } \\varprojlim_m K_{\\lambda,m}\n$$\n\nis an isomorphism; in particular $K_\\lambda$ is a placid group scheme ([`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html));\n\n(b) $\\ker\\left(K_{\\lambda,m+1}\\to K_{\\lambda,m}\\right)$ is unipotent for every $m\\ge 1$;\n\n(c) $U_\\lambda := \\ker\\left(K_\\lambda\\to K_{\\lambda,1}\\right)$ is a normal pro-unipotent subgroup of $K_\\lambda$ — every finite-type quotient group of $U_\\lambda$ is unipotent — and $G_\\lambda := K_\\lambda/U_\\lambda \\simeq K_{\\lambda,1}$ is a closed subgroup scheme of $G$, hence an affine group scheme of finite type over $k$.\n\nIn particular clause (ii) of [Q1-L4](../index.html) holds with witness $(U_\\lambda, G_\\lambda)$.\n\n## Proof\n\n**Step 1 — $K_\\lambda$ is a closed subgroup scheme of $K$.** By [loops, jets and positive loops](../../../appendix/ex-loops-placid.html), $K=\\varprojlim_mL^mG$ with homomorphic smooth affine transitions, and, for a closed embedding $X\\subset\\mathbb{A}^n$, $LX\\simeq\\varinjlim_iLX^i$ with $LX^i=LX\\cap t^{-i}L^+\\mathbb{A}^n$ closed in the affine $t^{-i}L^+\\mathbb{A}^n$, hence affine and separated. Square-zero lifting ($G$ smooth) along $R[t]/t^{m+1}\\to R[t]/t^m$, $m\\ge1$, makes the transitions surjective, hence faithfully flat; so $A=\\bigcup_mA_m$. The orbit map $a\\colon K\\to LX$, $g\\mapsto g\\cdot x_\\lambda$, factors through some $LX^i$ ($K$ is affine, hence quasi-compact; the colimit is filtered along closed embeddings), and $x_\\lambda=a(e)\\in LX^i(k)$. The fiber $K_\\lambda=a^{-1}(x_\\lambda)$ is closed in $K$ and equals the stabilizer subgroup functor: $K_\\lambda=\\operatorname{Spec}(A/I)$.\n\n**Step 2 — $K_{\\lambda,m}\\subseteq L^mG$ is a closed subgroup scheme of finite type.** For affines the scheme-theoretic image is $\\operatorname{Spec}$ of the ring image, no finiteness needed; as $\\mathrm{ev}_m^*$ is the inclusion $A_m\\subseteq A$, $K_{\\lambda,m}=\\operatorname{Spec}(A_m/I_m)$, closed in $L^mG$, finite type. $(\\star)$ Over $k$ the image of a Hopf-algebra morphism is a Hopf algebra, with both factorization maps Hopf — tensor squares of injections stay injective, so the Hopf operations descend. Applied to $A_m\\to A/I$ (dual to the homomorphism $\\mathrm{ev}_m|_{K_\\lambda}$): $K_{\\lambda,m}$ is a subgroup scheme; $K_{\\lambda,1}\\subseteq L^1G=G$.\n\n**Step 3 — the limit in (a).** The transitions send $I_m$ into $I_{m+1}$, hence restrict to homomorphisms $K_{\\lambda,m+1}\\to K_{\\lambda,m}$. Since $A=\\bigcup_mA_m$, $I=\\bigcup_mI_m$ and $\\operatorname{colim}_m(A_m/I_m)=A/I$; so the canonical map $K_\\lambda\\to\\varprojlim_mK_{\\lambda,m}$ is an isomorphism, the limit computed equivalently in affine $k$-schemes, all $k$-schemes or fpqc sheaves ($\\operatorname{Spec}(A/I)$ represents all three).\n\n**Step 4 — transitions surjective smooth affine; (a).** Affineness is automatic. Since $I_{m+1}\\cap A_m=I_m$, the map $A_m/I_m\\to A_{m+1}/I_{m+1}$ is injective, so $q\\colon K_{\\lambda,m+1}\\to K_{\\lambda,m}$ is schematically dominant. Both sides are smooth (finite type, characteristic $0$; Cartier); by Chevalley the image of $q$ is a closed subgroup, by dominance all of $K_{\\lambda,m}$: $q$ is surjective, hence faithfully flat with smooth fibers (generic flatness plus translation; fibers torsors under the smooth kernel), hence smooth. With Step 3 the presentation is placid through homomorphisms: $K_\\lambda$ is a placid group scheme ([`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html)).\n\n**Step 5 — (b).** For $m\\ge1$, $R[t]/t^{m+1}\\to R[t]/t^m$ is square-zero with ideal $t^mR\\cong R$, so $\\ker(L^{m+1}G(R)\\to L^mG(R))$ — the lifts of $e$ — is the additive group $\\mathfrak{g}\\otimes_kR$ (smoothness lifts; the law is addition, the ideal squaring to zero). So $\\ker(L^{m+1}G\\to L^mG)\\cong\\mathbb{V}(\\mathfrak{g})$, unipotent in characteristic $0$, and the closed subgroup $\\ker(K_{\\lambda,m+1}\\to K_{\\lambda,m})$ of it is unipotent.\n\n**Step 6 — (c): the quotient.** $U_\\lambda=\\ker(\\pi\\colon K_\\lambda\\to K_{\\lambda,1})$ is closed and normal, as any kernel. Each $K_{\\lambda,m}\\to K_{\\lambda,1}$ is surjective smooth (Step 4), hence faithfully flat, so $\\pi^*$ is flat (a filtered colimit of flats). Surjectivity of $\\pi$ is the Mittag-Leffler step: the descending images $\\operatorname{im}(K_{\\lambda,m}\\to K_{\\lambda,1})$ are constant $=K_{\\lambda,1}$ (Step 4), and the limit surjects onto it — each fiber of $\\pi$ is a cofiltered limit of nonempty affines, nonempty since a filtered colimit of nonzero rings is nonzero ($1=0$ would appear at a finite stage). The fpqc-sheaf quotient $K_\\lambda/U_\\lambda$ (sheafified $R\\mapsto K_\\lambda(R)/U_\\lambda(R)$) maps to $K_{\\lambda,1}$ monically (equal images differ by a kernel point) and epically ($\\pi$ is a faithfully flat affine cover); a mono-epi of fpqc sheaves is an isomorphism. So $G_\\lambda:=K_\\lambda/U_\\lambda\\simeq K_{\\lambda,1}$: closed in $G$ (Step 2), affine of finite type.\n\n**Step 7 — (c): pro-unipotence.** $U_{\\lambda,m}:=\\ker(K_{\\lambda,m}\\to K_{\\lambda,1})$ is a closed subgroup of $C_m:=\\ker(L^mG\\to G)$, unipotent by descending induction: $\\ker(L^mG\\to L^jG)\\to\\ker(L^{j+1}G\\to L^jG)\\cong\\mathbb{V}(\\mathfrak{g})$ (Step 5) has kernel $\\ker(L^mG\\to L^{j+1}G)$ and closed unipotent image, and extensions of unipotents are unipotent. Base-changing Step 3 along $e\\to K_{\\lambda,1}$ gives $\\mathcal{O}(U_\\lambda)=\\operatorname{colim}_m\\mathcal{O}(U_{\\lambda,m})$. Let $\\phi\\colon U_\\lambda\\to Q$ be onto ($\\phi^*$ injective) an affine finite-type group scheme. The generators of $\\mathcal{O}(Q)$, finitely many, land in $B_m:=\\operatorname{im}(\\mathcal{O}(U_{\\lambda,m})\\to\\mathcal{O}(U_\\lambda))$ for one $m$ (the $B_m$ increase); hence $\\phi$ factors as $U_\\lambda\\to H_m\\xrightarrow{\\psi}Q$, $H_m:=\\operatorname{Spec}B_m$, by $(\\star)$ a closed subgroup scheme of $U_{\\lambda,m}$, hence unipotent. $\\psi$ is a homomorphism (its Hopf squares agree after the injection $B_m^{\\otimes2}\\hookrightarrow\\mathcal{O}(U_\\lambda)^{\\otimes2}$), dominant, with closed (Chevalley) image: surjective. Quotients of unipotents are unipotent, so $Q$ is. (c) follows, and $(U_\\lambda,G_\\lambda)$ witnesses clause (ii) of [Q1-L4](../index.html). $\\blacksquare$\n\n## Caveats\n\n- Pro-unipotence is proved in the affine sense of Step 7: injective $\\phi^*$, affine finite-type target.\n- Orientation only, not cited: jet images of stabilizers appear in [[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], proof of Thm 36, p. 22 ($H_j$, $L^+Gx_v\\cong\\varprojlim_jL_j^+G/H_j$).\n";</script>
