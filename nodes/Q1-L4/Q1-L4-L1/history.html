ef:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html) — strata are fpqc-sheaf images, pro-scheme identifications stay theorems — plus the objects line widened by [$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../appendix/conv-ring-of-integers.html). A concurrent session's round-1 ran in the same working tree: its referee report overwrote this session's r1 on disk, and its repair — a transcribed orbit-presentation black box — was reverted per the ADR's considered-and-rejected clause; [r2](critiques/r2.html) reconciles both reports and confirms every flaw of each is resolved.\n- **2026-08-05 — examined and unchanged** by `/update`: the input passage was addressed to clause (i), which is this node, and does not reach it. Clause (i) asserts $K\\backslash LX_\\lambda\\simeq BK_\\lambda$ and asserts nothing about placidity — the statement it doubts is clause (ii), where the objection was answered and disposed of ([u1](../../../../blueprint/nodes/Q1-L4/Q1-L4-L2/updates/u1.md)); the descent of Step 5 needs only that $K_\\lambda$ be a closed subgroup scheme, which Step 2 proves outright.\n";</script>
