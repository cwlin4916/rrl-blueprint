<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L3</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L3 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L3 — Unipotent invariance: $\\mathcal{D}_c(B(H/N)) \\simeq \\mathcal{D}_c(BH)$\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), [`subsec:notations`](../../../appendix/subsec-notations.html). No `depends-on` nodes.\n- **notation:** $q\\colon H\\to H/N$ the quotient; $b_K\\colon\\mathrm{pt}\\to BK$ the atlas; $B_nK=K^{\\times n}$ the bar levels; $D_1$ the Weyl algebra of $\\mathbb{A}^1$ ($[\\partial,t]=1$); unlabelled equivalences are in $\\mathrm{DGCat}$.\n\n## Lemma\n\nLet $H$ be an affine group scheme of finite type over $k$ ($k$ algebraically closed of characteristic $0$, [`subsec:notations`](../../../appendix/subsec-notations.html)) and let $N\\trianglelefteq H$ be a closed normal unipotent subgroup. Write $B(-)$ for the fpqc quotient stack $\\mathrm{pt}/(-)$, $\\mathcal{D}^!$ for the sheaf theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), and $\\mathcal{D}_c\\subset\\mathcal{D}^!$ for the coherent objects of [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html). Then $!$-pullback along the projection $BH\\to B(H/N)$ induces equivalences\n\n$$\n\\mathcal{D}^!\\left(B(H/N)\\right) \\xrightarrow{\\ \\sim\\ } \\mathcal{D}^!\\left(BH\\right), \\qquad \\mathcal{D}_c\\left(B(H/N)\\right) \\xrightarrow{\\ \\sim\\ } \\mathcal{D}_c\\left(BH\\right).\n$$\n\nIn particular, for $N = R_u(H)$ the unipotent radical of $H$ (its largest closed normal unipotent subgroup), pullback identifies $\\mathcal{D}_c(BH)$ with $\\mathcal{D}_c\\left(B(H/R_u(H))\\right)$.\n\n## Proof\n\n**Step 1 — group theory (standard, char $0$).** By Cartier $H$, $N$ and the fppf quotient $H/N$ (affine finite-type, $q$ an $N$-torsor: standard quotient theory) are smooth. $N$ is connected, $\\exp\\colon\\mathfrak{n}\\xrightarrow{\\sim}N$ gives $N\\cong\\mathbb{A}^d$; its descending central series has vector-group quotients. Vector-group torsors over an affine $S$ are classified by $H^1(S,\\mathcal{O}_S)^{\\oplus r}=0$ (flat–Zariski comparison; Serre), so inductively every $N$-torsor over an affine base is trivial. Hence $H\\cong(H/N)\\times N$ over $H/N$: over its base, $q^{\\times n}$ is the projection $(H/N)^{\\times n}\\times\\mathbb{A}^{nd}\\to(H/N)^{\\times n}$.\n\n**Step 2 — bar presentation; smooth descent enters here only.** For $K\\in\\{H,H/N\\}$: $b_K$ is representable, affine, smooth, surjective (base change along any $T\\to BK$: a $K$-torsor; $K$ smooth), with Čech nerve $B_\\bullet K$ ($\\mathrm{pt}\\times_{BK}\\mathrm{pt}\\cong K$). Smooth descent for $\\mathcal{D}$-modules on finite-type schemes (standard) says $\\mathcal{D}^!$ inverts the fpqc-stackification $|B_\\bullet K|_{\\mathrm{PreStk}}\\to BK$; the prestack side is $\\mathrm{Tot}\\,\\mathcal{D}(B_\\bullet K)$: colimit-to-limit property of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), plus $\\mathcal{D}^!\\simeq\\mathcal{D}$ on finite-type affines (Kan extensions restrict along full inclusions). So, in $\\mathrm{DGCat}$,\n\n$$\n\\mathcal{D}^!(BK)\\ \\xrightarrow{\\ \\sim\\ }\\ \\mathrm{Tot}_{[n]\\in\\Delta}\\,\\mathcal{D}\\left(K^{\\times n}\\right).\n$$\n\n$B_\\bullet(q)$ stackifies to $\\pi\\colon BH\\to B(H/N)$ in $\\mathrm{PreStk}$, so $\\pi^!$ becomes $\\mathrm{Tot}\\left((q^{\\times n})^!\\right)_n$.\n\n**Step 3 — $\\mathbb{A}^1$-invariance, proved.** For $T$ smooth affine finite-type, $p^!\\colon\\mathcal{D}(T)\\to\\mathcal{D}(T\\times\\mathbb{A}^1)$ is fully faithful. As $p$ is smooth, $p^!$ is a shift of $p^*$ ([`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html)); by $D$-affineness of smooth affine schemes and $D_{T\\times\\mathbb{A}^1}\\cong D_T\\otimes_kD_1$ (standard), $p^*M=M\\otimes_kk[t]$, with $D_T$ acting on $M$ and $\\partial$ as $d/dt$. Right multiplication by $\\partial$ is injective on $D_1$ (PBW) with cokernel the left module $D_1/D_1\\partial\\cong k[t]$; $\\otimes_k$ being exact, $p^*M\\simeq\\operatorname{cofib}\\left(\\mathrm{id}\\otimes(\\cdot\\partial)\\text{ on }M\\otimes_kD_1\\right)$ in $\\mathcal{D}(T\\times\\mathbb{A}^1)$, where $M\\otimes_kD_1$ is the extension of scalars of $M$ along the flat $D_T\\to D_T\\otimes_kD_1$ — left adjoint to restriction, derived by flatness, converting precomposition with $\\mathrm{id}\\otimes(\\cdot\\partial)$ into postcomposition with $\\partial$. Hence, on mapping complexes,\n\n$$\n\\operatorname{Map}_{\\mathcal{D}(T\\times\\mathbb{A}^1)}(p^*M,p^*M')\\simeq\\operatorname{fib}\\left(\\operatorname{Map}_{\\mathcal{D}(T)}(M,M'\\otimes_kk[t])\\xrightarrow{\\ \\partial_*\\ }\\operatorname{Map}_{\\mathcal{D}(T)}(M,M'\\otimes_kk[t])\\right).\n$$\n\nSince $d/dt$ on $k[t]$ is surjective with kernel $k$ (char $0$; this computes $H^\\bullet_{\\mathrm{dR}}(\\mathbb{A}^1)=k$), $\\operatorname{fib}(\\partial_*)\\simeq_{\\mathcal{D}(T)}M'$; $\\operatorname{Map}_{\\mathcal{D}(T)}(M,-)$ preserves fibre sequences, so the right side is $\\operatorname{Map}_{\\mathcal{D}(T)}(M,M')$. The equivalence sends $p^*\\phi$ to $\\phi$ (restrict along $m\\mapsto m\\otimes1$), so $p^*$ on mapping complexes is its inverse: $p^*$, hence $p^!$, is fully faithful; iterating, so is $\\mathrm{pr}^!$ for $T\\times\\mathbb{A}^m\\to T$.\n\n**Step 4 — the $\\mathcal{D}^!$-equivalence.** By Steps 1 and 3 each $(q^{\\times n})^!\\colon\\mathcal{D}((H/N)^{\\times n})\\to\\mathcal{D}(H^{\\times n})$ is fully faithful; let $\\mathcal{E}^n_0\\subseteq\\mathcal{D}(H^{\\times n})$ be its essential image. $B_\\bullet(q)$ being simplicial, the cosimplicial structure functors (all $!$-pullbacks) carry $\\mathcal{E}^\\bullet_0$ into itself: a cosimplicial full subcategory, levelwise equivalent to $\\mathcal{D}((H/N)^{\\times\\bullet})$. Totalizations in $\\mathrm{DGCat}$ are computed in $\\mathrm{Cat}_\\infty$, preserve levelwise equivalences, and $\\mathrm{Tot}\\,\\mathcal{E}^\\bullet_0\\to\\mathrm{Tot}\\,\\mathcal{D}(H^{\\times\\bullet})$ is fully faithful with essential image the objects with every component in $\\mathcal{E}^n_0$ (cartesian sections of a limit). Any object $x$ has $x_n\\simeq_{\\mathcal{D}(H^{\\times n})}\\pi_n^!x_0$ (coface $[0]\\to[n]$; $\\pi_n\\colon H^{\\times n}\\to\\mathrm{pt}$ factors through $q^{\\times n}$), so the image is everything: $\\pi^!\\colon\\mathcal{D}^!(B(H/N))\\to\\mathcal{D}^!(BH)$ is an equivalence in $\\mathrm{DGCat}$.\n\n**Step 5 — coherence is detected on the atlas.** Claim: for $K$ smooth affine finite-type, $\\mathcal{G}\\in\\mathcal{D}_c(BK)$ iff $b_K^!\\mathcal{G}\\in\\mathcal{D}_c(\\mathrm{pt})$. *Only if:* $b_K$ is smooth from the finite-type test object $\\mathrm{pt}$; apply [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html). *If:* let $g\\colon S\\to BK$ be smooth, $S$ a finite-type dg-scheme (entry's ratified reading); smoothness into $BK$ is tested after base change along the atlas. Crystals are insensitive to derived/nilpotent structure: $\\mathcal{D}(Z)\\simeq\\mathcal{D}(Z^{\\mathrm{cl,red}})$ compatibly with $!$-pullback, coherence read there (standard; the [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) test category is classical); base change along $S^{\\mathrm{cl,red}}\\hookrightarrow S$ leaves all below intact (flat over classical is classical, smooth over reduced is reduced), so take $S$ classical reduced. Then $P:=S\\times_{BK}\\mathrm{pt}$ is finite-type ($v\\colon P\\to S$ a $K$-torsor: smooth affine surjective) and smooth over $\\mathrm{pt}$ (base change of $g$): a smooth classical scheme. The square gives $v^!g^!\\mathcal{G}\\simeq_{\\mathcal{D}(P)}w^!b_K^!\\mathcal{G}$, $w\\colon P\\to\\mathrm{pt}$. As $b_K^!\\mathcal{G}\\simeq\\bigoplus_ik^{d_i}[-i]$ (finite), $v^!g^!\\mathcal{G}$ is a finite sum of shifts of $w^!k$ — of $\\mathcal{O}_P$ ($w$ smooth), coherent since $\\mathcal{O}_P\\cong\\mathcal{D}_P/\\mathcal{D}_P\\Theta_P$. Coherence descends along $v$: $v^*$ (a shift of $v^!$) is t-exact, conservative and faithfully flat, $H^i(v^*g^!\\mathcal{G})\\cong v^*H^i(g^!\\mathcal{G})$, a quasi-coherent $\\mathcal{D}_S$-module is the filtered union of its coherent submodules, and finite generation of the pullback stabilizes that union. So $g^!\\mathcal{G}$ is coherent: $\\mathcal{G}\\in\\mathcal{D}_c(BK)$.\n\n**Step 6 — conclusion.** $\\pi\\circ b_H=b_{H/N}$ in $\\mathrm{PreStk}$, so, by Step 5 twice, $\\mathcal{F}\\in\\mathcal{D}_c(B(H/N))$ iff $b_{H/N}^!\\mathcal{F}\\simeq b_H^!\\pi^!\\mathcal{F}\\in\\mathcal{D}_c(\\mathrm{pt})$ iff $\\pi^!\\mathcal{F}\\in\\mathcal{D}_c(BH)$; with Step 4, $\\pi^!$ restricts to the second displayed equivalence. Char-$0$ unipotent groups are connected, so every closed normal unipotent subgroup of $H$ lies in $R_u(H^\\circ)$, characteristic in $H^\\circ$ hence normal in $H$: $R_u(H)=R_u(H^\\circ)$ exists, and the last clause is the case $N=R_u(H)$. $\\blacksquare$\n\n## Caveats\n\n- Smooth descent is the one black-boxed input: once (Step 2), covers $b_H$, $b_{H/N}$, Čech levels smooth affine finite-type. \"Coherent cohomology\" = $\\mathcal{D}$-coherence on the classical finite-type test scheme (ratified reading 1); Step 5's dg-to-classical reduction is the standard insensitivity of crystals.\n";</script>
