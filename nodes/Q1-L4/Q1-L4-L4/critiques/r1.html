<header class="bar"><nav class="crumbs"><a href="../../../../index.html">blueprint</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L4</a><i>›</i><a href="../index.html">Q1-L4-L4</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4-L4, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1-L4/Q1-L4-L4/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n## Scope of the hunt\n\n**Statement diff.** The `## Lemma` block (proof.md:10–20) was compared character by character with `## Statement` (node.md:18–28): **verbatim identical**, links included, no strengthened hypothesis and no weakened conclusion. Only the H1 differs (Flaw 12).\n\n**Hallucination sweep.** One bib key is named, `beraldo2017loop`, and it is in `refs.bib` (line 769). No `main.tex` `\\label` is cited. Five appendix links are used and all five anchors exist in `blueprint/appendix.md`: `#placid-ind-scheme` (l. 438), `#ex-sheaf-on-placid-scheme` (l. 464), `#defn-coherent-d-mod` (l. 540), `#conv-d-shriek-d-star` (l. 424), `#subsec-notations` (l. 57). The dependency link `../Q1-L4-L3/node.md` resolves, and the relative depth `../../../` correctly reaches `blueprint/`. \"Ratified reading 1\" is `context.md`:59. **No FATAL.**\n\n**Closed world.** Invoked: the five entries, the Fact [Q1-L4-L3](../../Q1-L4-L3/index.html), and two pieces of standard mathematics (smooth descent for $\\mathcal{D}$-modules on finite-type schemes; faithfully flat descent of coherence). `beraldo2017loop` appears once, explicitly quarantined as \"Orientation, not cited\", and it licenses nothing on the page — I checked that no step depends on it. That is correct hygiene.\n\n**Page-level check of the Caveat's `beraldo2017loop` claims**, against `papers/beraldo2017loop.pdf`:\n\n- p. 4, Example 1.3.2: \"If $X$ is a $G$-scheme of finite type, then $\\mathfrak{D}(X)^G\\simeq\\mathfrak{D}(X/G)$ … This follows immediately from smooth descent for $\\mathfrak{D}$-modules.\" **Accurate.**\n- p. 25, Corollary 4.3.1: \"If $H$ is pro-unipotent, $\\mathrm{oblv}^{H,\\mu}$ and $(\\mathrm{pr}_{H,\\mu})^L$ are fully faithful\", proof \"from the cohomological contractibility of $H$: indeed $p_*\\circ p^*\\simeq\\Gamma_{\\mathrm{dR}}(H,k_H)\\simeq k$\"; Theorem 4.3.2: for $H$ pro-unipotent, $\\theta_{H,\\mu}\\colon\\mathcal{C}_{H,\\mu}\\rightleftarrows\\mathcal{C}^{H,\\mu}$ are mutually inverse. **Accurate.** See Flaw 11 for the hypotheses the Caveat omits.\n\n## The central adjudication: is (Lim) a gap?\n\n**(c) first, since it is cleanest.** I verified independently that Step 3 does **not** consume (Lim): it uses only functoriality of $(-)^!$ on $\\mathrm{PreStk}^{op}$, the atlas description of smooth tests, and faithfully flat descent of coherence along $u\\colon Q\\to S$. Its two halves (\"preserves\", \"reflects\") are unconditional and, modulo the minors below, correct — I checked each link of the reflection chain ($Q$ affine since $u$ is affine and $S$ affine; $Q$ smooth since $S$ smooth and $u$ smooth; $u^*Q\\cong Q\\times H_m$ trivial; $\\pi_m\\circ f'\\simeq g u$ by $\\pi_m\\circ(\\mathrm{pt}\\to BH)=(\\mathrm{pt}\\to BH_m)$; $u^!g^!\\mathcal{F}\\simeq f'^!\\pi_m^!\\mathcal{F}$ by bare functoriality, no base-change theorem needed). Step 1 is unconditional and correct. Step 4 is **not** (Flaw 4).\n\n**(a) The interchange (ii) is available here — but not for the reason the draft gives, and not from the Fact.** Two separate findings.\n\n*First, the draft's reduction is wrong as stated.* \"the Beck–Chevalley mates … reduce to $p_{m\\star}p_m^!\\simeq\\mathrm{id}$\" is true for the **coface** squares and false for the **codegeneracy** squares. Write $q_n=p_m^{\\times n}$ and let $s\\colon H^{\\times n}\\to H^{\\times n+1}$ insert the identity. Passing to right adjoints in the tower variable demands $s_m^!\\,q_{n+1\\star}\\simeq q_{n\\star}\\,s_{m+1}^!$, and the mate here is built from the **counit** $q^!q_\\star\\to\\mathrm{id}$, i.e. from full faithfulness of $q_\\star$, not of $q^!$. It fails inside the node's own hypotheses: take $H_1=\\mathrm{pt}$, $H_m=\\mathbb{G}_a$ for $m\\ge2$ (transition $\\mathbb{G}_a\\to\\mathrm{pt}$ smooth surjective affine, unipotent kernel). Then $n=0$ reads $q_{1\\star}F\\simeq s^!F$ for all $F\\in\\mathcal{D}(\\mathbb{A}^1)$; for $F=\\delta_1$ the delta module at $1$, the left side is $k$ up to shift and the right side is $0$. So the bi-diagram $\\Delta\\times\\mathbb{N}^{op}\\to\\mathrm{DGCat}$ the draft is implicitly asking for **does not exist**, and the interchange cannot be obtained the way the GAP paragraph describes.\n\n*Second, the interchange is nevertheless available.* The repair is two steps, both writeable:\n\n1. Restrict the totalization to the semi-cosimplicial subcategory: $\\mathrm{Tot}_{\\Delta}\\simeq\\mathrm{Tot}_{\\Delta_{\\mathrm{inj}}}$ by the standard cofinality of $\\Delta_{\\mathrm{inj}}\\subset\\Delta$ (dual to \"fat realization $=$ realization\" in $\\infty$-categories). This deletes exactly the squares that fail.\n2. On $\\Delta_{\\mathrm{inj}}$ only cofaces survive, and each coface square factors as a **cartesian** square followed by an $N_m$-torsor: the comparison $H_{m+1}^{\\times n}\\to H_m^{\\times n}\\times_{H_m^{\\times n-1}}H_{m+1}^{\\times n-1}$ is an $N_m$-torsor (checked for $d_0$, $d_n$ and for the multiplication faces: the fibre over $((\\bar a,\\bar b),c)$ is $\\{(an,n^{-1}a^{-1}c)\\}\\cong N_m$). Base change for $(\\ (-)^!,(-)_\\star)$ on the cartesian part is standard; the residual factor is a trivial $\\mathbb{A}^{d}$-bundle ($N_m$ unipotent in char $0$, so $N_m\\cong\\mathbb{A}^d$ and $N_m$-torsors over an affine base are trivial), so the mate is the **unit** $\\mathrm{id}\\to p_\\star p^!$ of an affine-space projection, invertible by de Rham homotopy invariance ($H^\\bullet_{\\mathrm{dR}}(\\mathbb{A}^1)=k$). Once every surviving square is right-adjointable, the bifunctor exists and Fubini for limits gives the interchange **formally**.\n\nNote precisely where this input comes from, because the natural guess is wrong: the Fact [Q1-L4-L3](../../Q1-L4-L3/index.html) gives an equivalence of $\\mathcal{D}^!$ on the **classifying stacks** $BH_{m+1}\\to BH_m$, hence $\\pi_{\\star}\\pi^!\\simeq\\mathrm{id}$ there; the mate condition lives on the **schemes** $H_m^{\\times n}$, where the Fact says nothing. The unit at scheme level is supplied by the node's hypothesis (unipotent kernels) plus standard $\\mathbb{A}^1$-invariance — the same mechanism L3 computes internally, which the prover may not import as a Fact but may re-derive in two lines as standard mathematics.\n\n**Conclusion on (a): part (ii) of the GAP is an unwritten step, not a gap.** That is Flaw 2.\n\n**(b) Part (i) — descent for $\\mathcal{D}^!$ along $\\mathrm{pt}\\to BH$ — is genuinely missing, and the proposed discharge is illegitimate as worded.** $\\mathcal{D}^!$ is a right Kan extension from $\\mathrm{AffSch}$, so $\\mathcal{D}^!(\\mathcal{Y})\\simeq\\varprojlim_{S\\to\\mathcal{Y}}\\mathcal{D}^!(S)$ and $\\mathcal{D}^!(|B_\\bullet H|)\\simeq\\mathrm{Tot}\\,\\mathcal{D}^!(H^{\\times\\bullet})$ formally; identifying that with $\\mathcal{D}^!(BH)$ for the *fpqc* quotient is a theorem, and the atlas has placid, non-finite-type fibres, so the finite-type smooth-descent black box does not reach it. Nothing in the appendix reaches it either. The draft's diagnosis is correct here.\n\nAnd the draft's equivalence claim is correct: with Step 1 and (ii) in hand, descent at $BH$ and the $\\mathcal{D}^!$ half of the Lemma imply each other (forwards: $\\mathcal{D}^!(BH)\\simeq\\mathrm{Tot}\\,\\mathcal{D}^!(H^{\\times\\bullet})\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m)\\simeq\\mathcal{D}^!(BH_m)$; backwards: compose the conclusion with the evaluation of a tower of equivalences). So an appendix entry whose content is \"$\\mathcal{D}^!(BH)\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m)$\" **specialized to a group whose transition kernels are unipotent is the conclusion of this node**, and writing it would be assuming what is to be proved. See Flaw 3 for the legitimate routes.\n\n---\n\n## Flaws\n\n**Flaw 1** [MAJOR] (Step 2, line 30: \"**GAP:** (Lim) is not in the closed world and I do not prove it\")\nAn honest `GAP:` marker is an automatic FAIL at severity MAJOR, and the honesty here is real and worth saying so: the draft names the missing statement, separates it into two identified components, says which steps survive without it, and proposes a discharge instead of smuggling the step through. Assessment of fillability: **half fillable now** (Flaw 2), **half requiring one new appendix entry** (Flaw 3). The gap is not fatal to the node's design — Steps 1 and 3 are real content that survives — but the node cannot be closed in the present closed world.\n\n**Flaw 2** [MAJOR] (Step 2, line 30: \"(ii) is not formal: the Beck–Chevalley mates for the non-cartesian squares relating $B_\\bullet(p_m)$ to the tower reduce to $p_{m\\star}p_m^!\\simeq\\mathrm{id}$, contractibility of the unipotent kernels\")\nTwo defects in one sentence. (α) The reduction is **false for the codegeneracy squares**, where the mate is built from the counit $q^!q_\\star\\to\\mathrm{id}$; the counterexample $H_1=\\mathrm{pt}$, $H_m=\\mathbb{G}_a$, $F=\\delta_1$ above lies inside the node's own hypotheses. As stated, the bifunctor $\\Delta\\times\\mathbb{N}^{op}\\to\\mathrm{DGCat}$ does not exist. (β) For the surviving (coface) squares the condition **is** discharged by the node's hypotheses, so (ii) is an unwritten step and not a gap; the draft names the exact condition and its exact reason (\"contractibility of the unipotent kernels\") and then does not notice that its own hypothesis supplies it. Repair: restrict to $\\Delta_{\\mathrm{inj}}$ by the standard cofinality; factor each coface square as cartesian $\\circ$ ($N_m$-torsor); invoke base change on the cartesian part and the unit of an $\\mathbb{A}^{d}$-projection on the rest, the triviality of the $N_m$-torsor over an affine base and $H^\\bullet_{\\mathrm{dR}}(\\mathbb{A}^1)=k$ being standard in char $0$; conclude by Fubini for limits. State explicitly that the unit is a **scheme-level** statement not supplied by the Fact.\n\n**Flaw 3** [MAJOR] (Step 2, line 30: \"Discharged by: an appendix entry giving $\\mathcal{D}^!(BH)\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m)$ for a placid group scheme\")\nThis discharge must not be written as stated. Modulo Step 1 and (ii), that display *is* the $\\mathcal{D}^!$ half of this node's conclusion (proof of the equivalence above), so an entry asserting it for a group with unipotent transition kernels assumes the conclusion; and even in the \"general placid group\" generality the entry swallows the node, leaving it a two-line corollary of L3 plus the entry. Legitimate routes, in order of preference:\n1. **A primitive descent entry.** Black-box descent for $\\mathcal{D}^!$ along a pro-smooth (placid) affine atlas — a foundational statement about the sheaf theory, independent of unipotence and of any tower of equivalences, exactly parallel to the finite-type smooth descent L3 already leans on. The natural source is on disk (`papers/raskin_dmodules_infinite_var.pdf`, key already in `refs.bib` and already cited in the appendix for dimension theories); the lead-researcher must verify the statement and its hypotheses at page level before transcribing. With that entry, Steps 1, 2(ii), 3 remain the node's own content.\n2. **A genuine proof of descent** along $\\mathrm{pt}\\to BH$ with placid fibres, written here.\n3. **Restating the node** so that the sheaf theory on the quotient is *defined* by the bar totalization — a `## Statement` change, hence `/update`'s call and not the prover's.\nIn every case the entry must be page-verified: see Flaw 11 for why the pages the Caveat points at will not do.\n\n**Flaw 4** [MINOR] (Step 2, line 30: \"Steps 1, 3, 4 are unconditional\")\nStep 4 is not: its own first clause reads \"By Step 2 (modulo (Lim))\". Consequently **both** displays of the Lemma — the $\\mathcal{D}_c$ one included — rest on (Lim); what is unconditional is Step 3's weaker assertion that $\\pi_m^!$ *preserves and reflects* coherence. A reader of the parent [Q1-L4](../../index.html) clause (iii), which needs the $\\mathcal{D}_c$ equivalence, could take the sentence at face value. Repair: \"Steps 1 and 3 are unconditional; Step 4, and with it both displays, rests on (Lim).\"\n\n**Flaw 5** [MINOR] (Step 2, line 28: \"**(Lim)** $!$-pullback induces $\\varprojlim_m\\mathcal{D}^!(BH_m)\\xrightarrow{\\sim}\\mathcal{D}^!(BH)$, the limit along the right adjoints of $!$-pullback\")\nHandedness bookkeeping. The $\\pi_m^!$ form a cone under the tower of **left** adjoints, i.e. a map out of the $\\mathrm{Pr}^L$-colimit; there is no functor out of \"the limit along the right adjoints\" induced by $!$-pullback until one invokes $\\varinjlim^{\\mathrm{Pr}^L}\\simeq\\varprojlim^{\\mathrm{Pr}^R}$ — which is precisely the identification the preceding sentence disclaims (\"that limit form is used below, not its $\\mathrm{Pr}^L$-colimit interchange\"). Repair: name the identification once and use it, or state (Lim) as $\\mathcal{D}^!(BH)\\to\\varprojlim_m\\mathcal{D}^!(BH_m)$ with components $\\pi_{m\\star}$.\n\n**Flaw 6** [MINOR] (Step 2, line 26: \"so standard smooth descent on finite-type schemes gives $\\mathcal{D}^!(BH_m)\\simeq\\mathcal{D}^!(|B_\\bullet H_m|)$\")\n$B(-)$ is the **fpqc** quotient stack, and a functor satisfying smooth descent inverts smooth-local, not fpqc-local, equivalences. The bridge is one sentence and its ingredient is already on the page ($H_m$ smooth, so $H_m$-torsors are étale-locally trivial and the fpqc and smooth quotients agree). This is verbatim Flaw 1 of [Q1-L4-L3/r1](../../Q1-L4-L3/critiques/r1.html), reproduced unrepaired in a node that cites that one.\n\n**Flaw 7** [MINOR] (Step 2, line 26: \"By the colimit-to-limit property of [$\\mathcal{D}^!$, $\\mathcal{D}^*$]\")\nThe entry records the two-stage Kan-extension construction and asserts no colimit-to-limit property. The property is the universal property of the right Kan extension along $\\mathrm{AffSch}^{op}\\hookrightarrow\\mathrm{PreStk}^{op}$ (equivalently the limit formula $\\mathcal{D}^!(\\mathcal{Y})\\simeq\\varprojlim_{S\\to\\mathcal{Y}}\\mathcal{D}^!(S)$), so the mathematics is right and only the attribution is wrong — again a repeat of a minor already recorded at L3 (its Flaw 5).\n\n**Flaw 8** [MINOR] (Step 3, line 34: \"smoothness of a map to a prestack is tested by base change along the atlas\"; Caveats, line 44)\nThis is a reading, not a fact: neither [`defn:coherent_D_mod`](../../../../appendix/defn-coherent-d-mod.html) nor any other entry defines smoothness of $f\\colon S\\to\\mathcal{Y}$ for a prestack, and for $\\mathcal{Y}=BH$ with $H$ placid the class of test objects is exactly what the meaning of $\\mathcal{D}_c(BH)$ turns on. The Caveat concedes this but leaves the reader to check the consequences. In fact the argument is **robust**, and saying so would close the caveat properly: preservation needs only \"$f$ smooth $\\Rightarrow S$ smooth\", reflection needs only \"atlas $\\circ$ (smooth map of finite-type schemes) is smooth\", and both hold under either reading. Say that instead of asserting the two readings \"agree\".\n\n**Flaw 9** [MINOR] (Step 3, line 34: \"$P=\\varprojlim_{m'}P_{m'}$ with $P_{m'}:=P/U_{m'}$ the induced $H_{m'}$-torsor — a placid presentation, transitions $N$-torsors\")\nThree unjustified assertions in one clause: that $P/U_{m'}$ is representable and is an $H_{m'}$-torsor (the clean construction is the pushout $P\\times^H H_{m'}$, affine over $S$ by fpqc descent of affine morphisms); that $P\\simeq\\varprojlim_{m'}P_{m'}$ (true — both sides are fpqc sheaves affine over $S$ and agree after a trivializing cover — but not stated); and \"$N$-torsors\" uses a symbol the notation line never defines (it defines $N_m=\\ker p_m$; read $N_{m'}$).\n\n**Flaw 10** [MINOR] (notation line 6, \"unlabelled equivalences are in $\\mathrm{DGCat}$\"; Steps 1 and 3)\nThe blanket declaration is false for several of the page's $\\simeq$: $H_{m+1}\\times_{H_m}H_{m+1}\\simeq H_{m+1}\\times N_m$ is an isomorphism of schemes, $u^!g^!\\mathcal{F}\\simeq f'^!\\pi_m^!\\mathcal{F}$ lives in $\\mathcal{D}(Q)$, $f^!\\pi_m^!\\mathcal{F}\\simeq(\\pi_mf)^!\\mathcal{F}$ in $\\mathcal{D}(S)$, and $\\pi_mf'\\simeq gu$ is an identification of morphisms. `context.md`'s Notation section requires the ambient as a subscript on each; the draft supplies exactly one ($\\simeq_{\\mathrm{PreStk}}$) and then relies on a declaration that mislabels the rest. Related: the passage from the fpqc quotient sheaf $H_{m+1}/N_m$ (Step 1) to the sense of $H/N$ used in the Fact costs one clause — they agree because $p_m$ is smooth surjective, so the fppf, smooth and fpqc quotients coincide.\n\n**Flaw 11** [MINOR] (Caveats, line 45: \"(Lim) lives in [[beraldo2017loop](../../../../../papers/beraldo2017loop.pdf)], in the language of group actions on categories\")\nVerified on the page, and the parentheticals are accurate (see the sweep above) — but the description is loose in a way that will mislead whoever writes the entry Flaw 3 asks for. (α) What pp. 25 contain is pro-unipotent **invariance** ($\\mathrm{oblv}$ fully faithful; $\\theta_{H,\\mu}$ an equivalence), which under the invariants dictionary is nearer to *this node's conclusion* than to (Lim); the levelwise-limit statements nearest (Lim) are §4.1.2–4.1.3 (p. 24) and the proof of Lemma 4.3.6 (p. 26), and both are written for $\\mathcal{D}^*$/invariants. (β) The hypotheses do not match: Ex. 1.3.2 sits in §1.3, expressly \"in the simplest case where $G$ is of finite type\"; Cor. 4.3.1 and Thm. 4.3.2 assume $H$ **pro-unipotent**; and the surrounding §4.2 assumes a **Levi decomposition** $H\\simeq H^r\\ltimes H^u$ with $H^r$ reductive — whereas this node has only $1\\to U_1\\to H\\to H_1\\to 1$ with $H_1$ finite type, neither reductive nor split off. The draft's own remark that a dictionary with $\\mathcal{D}^!(BH)$ would be needed is correct and should be joined by these two hypothesis warnings.\n\n**Flaw 12** [MINOR] (title, line 1)\n`node.md`'s H1 is \"Pro-unipotent descent: $\\mathcal{D}_c(BH) \\simeq \\mathcal{D}_c(BH_m)$ along a placid presentation\"; the draft's H1 drops the display. Nothing mathematical is narrowed (the `## Lemma` block is verbatim), but the titles should match for traceability — the same minor as L3's Flaw 7.\n\n## Closing remark, not a flaw\n\nWriting Flaw 2 out will not fit in the remaining budget (the draft reports 889/900). Since the surviving obligation after Flaw 3's entry is genuinely three separate pieces — the tower of equivalences, the semi-cosimplicial interchange, the coherence test — this is a signal to consider splitting the interchange into its own sub-lemma rather than compressing it.\n\nVERDICT: FAIL\n";</script>
