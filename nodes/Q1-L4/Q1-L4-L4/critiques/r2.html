<header class="bar"><nav class="crumbs"><a href="../../../../index.html">blueprint</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L4</a><i>›</i><a href="../index.html">Q1-L4-L4</a><i>›</i><span>r2</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4-L4, round 2</h1><p class="lead">Generated from <code>blueprint/nodes/Q1-L4/Q1-L4-L4/critiques/r2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n## Scope of the hunt\n\n**Statement diff.** `## Lemma` (proof.md:10–20) against `## Statement` (node.md:18–28): **verbatim identical**, links included. The H1 (proof.md:1) now reproduces node.md:1 character for character, closing r1's Flaw 12. No hypothesis strengthened, no conclusion weakened; the conclusion delivered in Step 4 is the map the statement names ($!$-pullback along $BH\\to BH_m$), not merely an abstract equivalence.\n\n**Hallucination sweep.** No bib key is cited anywhere on the page (grepped: zero matches for a bib-key pattern), no `main.tex` `\\label`, no line reference. Six appendix links, six anchors, all present in `blueprint/appendix.md`: `#placid-ind-scheme` (l. 438), `#ex-sheaf-on-placid-scheme` (l. 464), `#defn-coherent-d-mod` (l. 581), `#conv-d-shriek-d-star` (l. 424), `#subsec-notations` (l. 57), `#bb-raskin-torsor-descent` (l. 492). The set matches `objects:` in node.md exactly. `../Q1-L4-L3/node.md` resolves; `../../../` reaches `blueprint/` from depth 2. \"Ratified reading 1\" is context.md:59. No `GAP:` marker. **No FATAL.**\n\n**The new entry, checked against the paper.** `papers/raskin_dmodules_infinite_var.pdf` p. 15 §3.17 and p. 16 Prop. 3.17.2, read this round. The source: \"*Suppose that $S$ is a quasi-compact quasi-separated base scheme and $\\mathcal{G}\\to S$ is a quasi-compact quasi-separated group scheme over $S$. Suppose that $P$ is a quasi-compact quasi-separated $S$-scheme with an action of $\\mathcal{G}$*\", the **semisimplicial** bar complex displayed with faces only, $D^!(P)^{\\mathcal{G}}$ defined as its limit, $\\mathcal{P}_{\\mathcal{G}}\\to S$ a torsor iff trivialized after an **fppf** base change, and Prop. 3.17.2 \"*the functor $\\varphi$ is an equivalence*\". The appendix entry transcribes this accurately, including the absence of a finite-type hypothesis on $\\mathcal{G}$ — which is exactly the clause that admits $K=H$ — and its note correctly refuses to extend the base from a scheme to a stack. Nothing in the entry over-claims relative to the page. The draft's use of it stays inside its stated scope: $\\mathcal{D}^!$ only, never $\\mathcal{D}_c$ or $\\mathcal{D}^{\\mathrm{ren}}$, and the scheme-to-stack assembly is done by hand.\n\n**Guideline correction.** `papers/guideline.md`:425–444: the round-1 `beraldo2017loop` block is untouched and a \"*Correction (round 2, same entry)*\" bullet is appended beneath it. Genuinely append-only. Beraldo is named nowhere in the draft and licenses nothing.\n\n**Closed world.** Invoked: the six entries, the Fact [Q1-L4-L3](../../Q1-L4-L3/index.html) (Statement only — I checked that no internal step of L3 is imported; the draft goes out of its way at proof.md:38 to say that the scheme-level unit is *not* L3's), context.md's ratified reading 1, and standard mathematics. Clean.\n\n## Disposition of the twelve r1 flaws\n\n1 (MAJOR, GAP) — **resolved**: the marker is gone and both halves are discharged, the descent half by the commissioned primitive entry, the interchange half on the page.\n2 (MAJOR, codegeneracy) — **genuinely resolved, not renotated**. The draft does not restrict to $\\Delta_{\\mathrm{inj}}$ after the fact; the entry's diagram *is* semisimplicial, so the codegeneracy squares never enter the bi-diagram. My counterexample ($H_1=\\mathrm{pt}$, $H_m=\\mathbb{G}_a$, $F=\\delta_1$) was a counterexample to a $\\Delta$-indexed bi-diagram, and no $\\Delta$-indexed bi-diagram is now claimed (proof.md:28: \"*this is why every limit here is over $\\Delta_{\\mathrm{inj}}$ and no $\\Delta$-version is claimed*\"). Nothing hinges on the choice in any case: $\\Delta_{\\mathrm{inj}}\\subset\\Delta$ is initial for limits of cosimplicial objects.\n3 (MAJOR, illegitimate entry) — **resolved as prescribed**: route 1 was taken, the entry is one level below the node's conclusion (a torsor over a *scheme* base) and does not swallow it.\n4, 5 (MINOR) — moot: no conditionality and no (Lim) remain; Step 4 now names the handedness explicitly.\n6 (MINOR, fpqc vs. smooth) — **fixed** at proof.md:24 (\"*as $p_m$ is smooth surjective the fppf, smooth and fpqc quotients agree*\").\n7 (MINOR, misattribution) — **fixed**: correctly attributed to the right Kan extension, with the right index category $(\\mathrm{AffSch}_{/\\mathcal{Y}})^{op}$.\n8 (MINOR, smoothness to a prestack) — addressed by (A)/(B), but the robustness claim is now overstated: see Flaw 2 below.\n9 (MINOR) — **fixed**: the induced torsor is built as the pushout $P\\times^HH_{m'}$ and its affineness is attributed.\n10 (MINOR, ambients) — **fixed** except one $\\simeq$: see Flaw 5.\n11, 12 (MINOR) — **resolved**.\n\n## Verification of the load-bearing new work\n\nI re-derived the following independently and they are **correct**, so they are recorded here rather than as flaws.\n\n- Step 2's adjunction and finality. Composition $\\mathrm{AffSch}_{/K^{\\times n}}\\to\\mathrm{AffSch}_{/BK}$ is left adjoint to $\\Psi=(K^{\\times n}\\times_{BK}-)$ by the universal property of the fibre product; $\\Psi$ lands in $\\mathrm{AffSch}$ because $K^{\\times n}\\times_{BK}T\\simeq K^{\\times n}\\times\\mathcal{P}_T$ with $\\mathcal{P}_T$ affine. A right adjoint is cofinal, so $\\Psi^{op}$ is initial and the limit computing $\\mathcal{D}^!(K^{\\times n})$ is unchanged. Handedness correct.\n- The identification $K^{\\times n}\\times\\mathcal{P}_T\\simeq K^{\\times n}\\times_{BK}T$, and the match of the entry's action groupoid $K\\times\\mathcal{P}_T\\rightrightarrows\\mathcal{P}_T$ with the base change of the Čech nerve of $\\mathrm{pt}\\to BK$ along $T\\to BK$.\n- Step 3's factorization. For each of $d_0$, $d_i$ ($1\\le i\\le n-1$) and $d_n$, the comparison $c\\colon H_{m'}^{\\times n}\\to W$ is, after the shear $(h_1,h_2)\\mapsto(h_1,h_1h_2)$ in the multiplication case, literally $p\\times\\mathrm{id}$ or $\\mathrm{id}\\times p$ — a base change of the $N_{m,m'}$-torsor $p$, hence a torsor, hence trivial over the affine $W$.\n- Step 3's mate bookkeeping. Pasting the cartesian bottom square with the top square (verticals $c$ and $\\mathrm{id}$) yields exactly the whiskered unit of $(c^!,c_\\star)$, and $c^!$ fully faithful $\\iff$ that unit is invertible. The shift discrepancy between $c_\\star$ and $c_{*,\\mathrm{dR}}$ cancels because $c_\\star$ is *defined* as the right adjoint of $c^!$, so \"de Rham homotopy invariance\" is the correct and sufficient input. Handedness correct.\n- The fppf-triviality tower for $K=H$ is **true**: the fibre of $\\Gamma(T',Q_{m+1})\\to\\Gamma(T',Q_m)$ over $s_m$ is $\\Gamma(T',s_m^*Q_{m+1})$, the sections of a torsor under $\\ker(N_{1,m+1}\\to N_{1,m})=N_m$, unipotent, over the affine $T'$ — non-empty, so the transitions really are surjective and the sequential limit is non-empty. See Flaw 1 for what the page omits.\n- Step 5 is now unconditional, and both halves survive the new Step 2: preservation uses only functoriality of $(-)^!$ plus (A), reflection only (B) plus faithfully flat descent of coherence, and Step 6's restriction argument (preserve + reflect + equivalence + fullness) is correct.\n\n## Flaws\n\n**Flaw 1** [MINOR] (Step 2, proof.md:28: \"*Unipotent torsors over an affine base are trivial in char $0$, so the sections form a sequential inverse limit of non-empty sets along surjections, hence are non-empty*\")\nThis one clause is the most load-bearing compression on the page, and two of its three assertions are unwritten. (α) *Surjectivity* of the transition $\\Gamma(T',Q_{m+1})\\to\\Gamma(T',Q_m)$ is asserted, and it is precisely the point at which such tower arguments fail — with $\\mathbb{G}_m$-kernels instead of unipotent ones the limit can be empty. It follows from the very fact the sentence names, but applied a second time and *fibrewise*: the fibre over $s_m$ is $\\Gamma(T',s_m^*Q_{m+1})$, the sections of an $N_m$-torsor over the affine $T'$. (β) The identification $Q\\simeq\\varprojlim_mQ_m$ over $T'$ — without which \"the sections\" are not a sequential limit at all — appears nowhere; it is fpqc descent again (both sides affine over $T'$, agreeing after a trivializing cover). I verified both, so this is a defect of the writing and not of the mathematics, but the surjectivity clause must be earned in print. Repair: two half-sentences, ≈ 25 words.\n\n**Flaw 2** [MINOR] (Caveats, proof.md:56: \"*it uses only (A) and (B), which hold whether the placid atlas test is read as 'base change pro-smooth' or 'base change level-wise smooth'*\", against Step 5's \"*the base change $P$ is level-wise smooth over $k$*\")\nThe robustness claim is overstated for (A). The argument as written *is* the level-wise reading, and moreover the level-wise reading **in the induced presentation** $\\{P\\times^HH_{m'}\\}$: it needs one $P_{m'}$ smooth over $k$ in order to descend smoothness along the finitely presented faithfully flat $P_{m'}\\to S$. Under the pro-smooth reading one is handed only that $P$ admits *some* placid presentation with smooth levels, and the bridge to $S$ smooth is descent of regularity along the faithfully flat but **not finitely presented** $P\\to P_{m'}$ (or, directly, along $\\mathcal{O}(S)\\to\\mathcal{O}(P)$ with $\\mathcal{O}(P)$ ind-smooth). That is true — a $\\mathrm{Tor}$ computation using that $\\mathfrak{m}\\mathcal{O}(P)$ is finitely generated, so the finite projective dimension is inherited from a single level — but it is a paragraph of commutative algebra, not a reading-independent triviality, and EGA IV 17.7.7 does not apply. (B) is genuinely robust: the base change of $Q\\to\\mathrm{pt}\\to BH$ along the atlas is $Q\\times H$, smooth under either reading. Repair: restrict the Caveat's claim to (B), and state (A) under the level-wise reading in the induced presentation — which is the only reading under which \"smooth $f\\colon S\\to BH$\" has been given any content on this page.\n\n**Flaw 3** [MINOR] (Step 3, proof.md:38–41: \"*Hence the bi-diagram $\\Delta_{\\mathrm{inj}}\\times\\mathbb{N}^{op}\\to\\mathrm{DGCat}$ exists, and Fubini with Step 2 twice gives*\")\nThe two quoted identifications are used *as identifications of diagrams*, and both entries state them objectwise. Three places: (i) the first equivalence of the display needs $\\mathcal{D}^!(H^{\\times n})\\simeq\\varprojlim_m\\mathcal{D}(H_m^{\\times n})$ to intertwine the cofaces $d^!$ with the levelwise $d^!$, i.e. right-adjointability of the **pro-level** squares $(d,\\rho_m)$ for $\\rho_m\\colon H^{\\times n}\\to H_m^{\\times n}$ — which does follow from the levelwise squares just checked, by passing to the limit, but is a further sentence; (ii) the last equivalence, and Step 4's \"*its right adjoint, the transition of Step 3's tower*\", need Step 2's equivalence to be natural in the group homomorphism $H_{m'}\\to H_m$, and Step 4's final identification of the inverse with $\\pi_m^!$ needs it natural in $H\\to H_m$; (iii) the $T$-naturality in Step 2 is the one instance that really is free, both directions there being $!$-pullback. Separately, the passage from squarewise right-adjointability to the existence of the bi-diagram is the standard $(\\infty,2)$-categorical passage-to-right-adjoints and deserves to be named as such rather than asserted with \"hence\". Repair: one sentence stating that every identification is via the canonical $!$-pullback / right-adjoint maps, so that the pro-level adjointability is the limit of the levelwise squares.\n\n**Flaw 4** [MINOR] (Caveats, proof.md:57: \"*Three inputs are taken as standard*\")\nThe inventory is materially incomplete, which matters because the Caveats are the reader's contract about what is being assumed. Also taken as standard and unlisted: full faithfulness of $\\mathrm{pr}^!$ for a trivial $\\mathbb{A}^d$-bundle (Step 3), base change for $((-)^!,(-)_\\star)$ on cartesian squares (Step 3), the passage to right adjoints producing the bi-diagram (Step 3), $\\mathcal{D}(S)\\simeq\\mathcal{D}(S^{\\mathrm{cl}})$ compatibly with $!$-pullback (Step 5), faithfully flat descent of coherence (Step 5), smoothness of a finite-type group scheme in characteristic $0$ (Cartier — used twice, silently, to make $H_1$ and $H_m$ smooth), and descent of smoothness along a smooth surjection (Steps 2, 5). Four of these *are* about $\\mathcal{D}$-modules, so the parenthetical \"none of them about $\\mathcal{D}$-modules on a stack\" is doing more reassuring than it should. Repair: drop the count and list, or say \"the inputs about $\\mathcal{D}$-modules are all about schemes, never stacks\", which is the true and useful claim.\n\n**Flaw 5** [MINOR] (Step 2, proof.md:26 \"*for $K$ affine over $k$*\"; proof.md:28 \"*$\\mathcal{P}_T\\to T$ is smooth surjective of finite presentation*\")\nThree small unearned steps. (a) Affineness of $H$ — a cofiltered limit of affine schemes along affine transitions — is a hypothesis of Step 2's own Claim and is verified nowhere, though it is the reason $\\mathcal{G}=H\\times T$ is qcqs and hence the reason the entry applies at all. (b) That an fpqc $H_m$-torsor $\\mathcal{P}_T\\to T$ is *smooth* needs $H_m$ smooth (Cartier, char $0$) plus descent of smoothness along the trivializing fpqc cover; the draft states the conclusion only. (c) The reduction of $\\mathcal{P}_T|_{T'}$ to a $U_1$-torsor needs $H\\to H_1$ faithfully flat (a filtered limit of affine faithfully flat maps), unstated. Each is one clause.\n\n**Flaw 6** [MINOR] (Step 5, proof.md:46: \"**(B)** *the atlas composed with a smooth map of finite-type schemes is smooth. For $K=H_m$, $P\\to S$ is smooth of finite type, so $S$ smooth $\\Rightarrow$ $P$ smooth $\\Rightarrow$ every $g\\colon S\\to BH_m$ is smooth*\")\nOne label carries two different statements. The first sentence is what *Reflected* invokes (to see $f'\\colon Q\\to\\mathrm{pt}\\to BH$ is a test); the second is what *Preserved* invokes (to see $\\pi_mf$ is a test of $BH_m$); and the \"For $K=H_m$…\" clause justifies only the second, leaving the first with no argument on the page — it is one line (the base change of $f'$ along the atlas is $Q\\times H$). Repair: split into (B1) and (B2) and give (B1) its clause.\n\n**Flaw 7** [MINOR] (Step 3, proof.md:38: \"*$d^!q_{n-1\\star}\\simeq q_{n\\star}d^!$*\")\nThe only surviving unsubscripted $\\simeq$ that context.md's Notation rule reaches: both sides are objects of the functor category $\\mathrm{Fun}(\\mathcal{D}(H_{m'}^{\\times n-1}),\\mathcal{D}(H_m^{\\times n}))$, so the exemption for \"no common ambient\" does not apply. Every other $\\simeq$ on the page is either subscripted or an equivalence of categories. Trivial to repair.\n\n## Closing judgement on length and the proposed split (for the user, not a flaw)\n\n**(i) Is the mathematics complete and correct at 1281 words?** In my judgement yes, modulo the seven MINORs above, none of which is a hole: I checked every link of the chain\n\n$$\n\\mathcal{D}^!(BH)\\ \\simeq\\ \\varprojlim_{[n]}\\mathcal{D}^!\\left(H^{\\times n}\\right)\\ \\simeq\\ \\varprojlim_{[n]}\\varprojlim_m\\mathcal{D}\\left(H_m^{\\times n}\\right)\\ \\simeq\\ \\varprojlim_m\\varprojlim_{[n]}\\mathcal{D}\\left(H_m^{\\times n}\\right)\\ \\simeq\\ \\varprojlim_m\\mathcal{D}^!\\left(BH_m\\right)\\ \\simeq\\ \\mathcal{D}^!\\left(BH_m\\right)\n$$\n\nseparately, and the $\\mathcal{D}_c$ half on top of it. The overflow is buying content, not prose: Steps 2 and 3 are two obligations that r1 created and that did not exist in the round-1 draft, and deleting either breaks the chain. Compressing further would trade a verified argument for an assertion, which is the wrong direction — I would not accept a 900-word version that reached this conclusion.\n\n**(ii) Is Step 2 the right cut?** **Yes — and the draft has already drawn the seam.** Step 2's Claim is stated with \"*for $K$ affine over $k$ whose torsors are fppf-locally trivial*\" as a hypothesis, so the sub-lemma is\n$$\n\\mathcal{D}^!(BK)\\ \\simeq\\ \\varprojlim_{[n]\\in\\Delta_{\\mathrm{inj}}}\\mathcal{D}^!\\left(K^{\\times n}\\right)\n$$\nfor such a $K$, resting on exactly two objects (the Kan-extension convention and the Raskin entry) plus standard mathematics, and on no dependency of this node. Three reasons it is the better cut than Step 3. First, **the appendix itself commissions it**: the entry's own note says \"*assembling those pointwise equivalences into the single statement $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(\\mathcal{G}^{\\times n})$ is the citing node's own work*\" — a standing obligation with no home, which this sub-lemma would answer once for the whole tree. Second, **reuse**: every future node evaluating $\\mathcal{D}$ on a classifying stack of a placid group wants it, and nothing in it mentions unipotence. Third, **Step 3 is the weaker candidate**: it is shorter (≈ 230 words), it is tied to unipotent kernels and to this particular tower/bar-complex pair, and its content is already documented in [r1](r1.html) Flaw 2, so extracting it buys less.\n\nTwo refinements if the split is funded. (a) Cut at the seam the draft draws — the sub-lemma takes fppf-local triviality as a *hypothesis*, and the ≈ 120-word verification for $K\\in\\{H,H_m\\}$ stays in the parent, since that is where this node's own hypotheses (unipotent kernels, char $0$, affine tests) do their work and where Flaw 1 lives. (b) That leaves the parent near 1000, not 935, so budget one further trim; the natural one is Step 5's test-reduction paragraph (Zariski-locality plus the classical/derived reduction), which is bookkeeping about the *reading* of `defn:coherent_D_mod` rather than about this node, and which is duplicated in spirit at [Q1-L4-L3](../../Q1-L4-L3/index.html). If two nodes can be spent, take Step 3 as well and leave the parent as Steps 1, 4, 5, 6 — the tower of equivalences and the coherence test, which is this node's own mathematics.\n\nVERDICT: PASS\n";</script>
