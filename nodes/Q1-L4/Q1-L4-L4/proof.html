<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L4</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L4 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L4 — Pro-unipotent descent: $\\mathcal{D}_c(BH) \\simeq \\mathcal{D}_c(BH_m)$ along a placid presentation\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\n- **uses:** [`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html), [`ex:sheaf_on_placid_scheme`](../../../appendix/ex-sheaf-on-placid-scheme.html), [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html), [$\\mathcal{D}^!$](../../../appendix/conv-d-shriek-d-star.html), [`subsec:notations`](../../../appendix/subsec-notations.html), [Raskin](../../../appendix/bb-raskin-torsor-descent.html); [Q1-L4-L3](../Q1-L4-L3/index.html).\n- **notation:** $N_{m,m'}=\\ker(H_{m'}\\to H_m)$, $N_m=N_{m,m+1}$; $p_m,\\pi_m,q_n$ the projections $H_{m+1}\\to H_m$, $BH\\to BH_m$, $H_{m'}^{\\times n}\\to H_m^{\\times n}$; $q_{n\\star}$ right adjoint to $q_n^!$; all $[n]$-limits over $\\Delta_{\\mathrm{inj}}$.\n\n## Lemma\n\nLet $H = \\varprojlim_{m\\ge 1} H_m$ be a group scheme over $k$ presented as a cofiltered limit of affine group schemes $H_m$ of finite type, the transition maps $H_{m+1}\\to H_m$ being surjective smooth affine group homomorphisms — a placid presentation by group schemes ([`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html)) — and assume that\n\n$$\n\\ker\\left(H_{m+1}\\to H_m\\right) \\ \\text{is unipotent for every } m\\ge 1.\n$$\n\nWrite $B(-)$ for the fpqc quotient stack $\\mathrm{pt}/(-)$, and $\\mathcal{D}_c\\subset\\mathcal{D}^!$ as in [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html) and [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html). Then for every $m\\ge 1$, $!$-pullback along the projection $BH\\to BH_m$ induces equivalences\n\n$$\n\\mathcal{D}^!\\left(BH_m\\right) \\xrightarrow{\\ \\sim\\ } \\mathcal{D}^!\\left(BH\\right), \\qquad \\mathcal{D}_c\\left(BH_m\\right) \\xrightarrow{\\ \\sim\\ } \\mathcal{D}_c\\left(BH\\right).\n$$\n\n## Proof\n\n**Step 1 — level maps induce equivalences.** $p_m$ is affine, smooth surjective, hence faithfully flat, with closed unipotent kernel $N_m$; the shear $(a,b)\\mapsto(a,a^{-1}b)$ gives $H_{m+1}\\times_{H_m}H_{m+1}\\simeq_{\\mathrm{Sch}}H_{m+1}\\times N_m$, making $p_m$ an $N_m$-torsor; smooth surjectivity makes the fppf, smooth and fpqc quotients agree, so $H_m$ represents $H_{m+1}/N_m$. $H_{m+1}$ being affine of finite type ([`subsec:notations`](../../../appendix/subsec-notations.html)), [Q1-L4-L3](../Q1-L4-L3/index.html) applies: $!$-pullback is an equivalence on $\\mathcal{D}^!$ and $\\mathcal{D}_c$, hence for all $m'\\ge m$.\n\n**Step 2 — $\\mathcal{D}^!(BK)\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(K^{\\times n})$ by $!$-pullback, $K\\in\\{H,H_m\\}$.** Right Kan extension from $\\mathrm{AffSch}^{op}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)) gives $\\mathcal{D}^!(\\mathcal{Y})\\simeq\\varprojlim_{(T\\to\\mathcal{Y})\\in(\\mathrm{AffSch}_{/\\mathcal{Y}})^{op}}\\mathcal{D}^!(T)$; an affine test $T\\to BK$ is an fpqc $K$-torsor $\\mathcal{P}_T\\to T$. Hypotheses of [Raskin](../../../appendix/bb-raskin-torsor-descent.html): $T$, $\\mathcal{G}:=K\\times T$, $\\mathcal{P}_T$ are affine ($H$ a cofiltered limit of affines along affine maps; $\\mathcal{P}_T\\to T$ affine by fpqc descent), hence representable and qcqs; the entry puts **no finite-type hypothesis on $\\mathcal{G}$**, what admits $K=H$. *Local triviality.* For $K=H_m$ (smooth, char $0$) $\\mathcal{P}_T\\to T$ is smooth surjective of finite presentation, an fppf cover trivializing it. For $K=H$ set $T':=\\mathcal{P}_T\\times^HH_1$, an affine such cover, where the induced $H_1$-torsor is trivial, so $\\mathcal{P}_T|_{T'}\\simeq_{\\mathrm{Sch}_{/T'}}\\varprojlim_mQ_m$, $Q_m$ a torsor under $N_{1,m}$ — unipotent, an iterated extension of the $N_j$. Unipotent torsors over an affine base are trivial in char $0$, so each $\\Gamma(T',Q_m)\\ne\\emptyset$ and each transition is surjective, its fibre over $s$ being $\\Gamma(T',s^*Q_{m+1})$: the limit of sections is non-empty.\n\nThe entry gives $\\mathcal{D}^!(T)\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(K^{\\times n}\\times\\mathcal{P}_T)$ over the *semisimplicial* bar complex (whence $\\Delta_{\\mathrm{inj}}$ throughout), with $K^{\\times n}\\times\\mathcal{P}_T\\simeq_{\\mathrm{Sch}}K^{\\times n}\\times_{BK}T$. All structure maps being $!$-pullbacks of affines, Fubini for the bi-diagram gives\n\n$$\n\\mathcal{D}^!(BK)\\simeq\\varprojlim_{T}\\varprojlim_{[n]}\\mathcal{D}^!(K^{\\times n}\\times_{BK}T)\\simeq\\varprojlim_{[n]}\\varprojlim_{T}\\mathcal{D}^!(K^{\\times n}\\times_{BK}T)\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(K^{\\times n}),\n$$\n\nsince $\\Psi:T\\mapsto K^{\\times n}\\times_{BK}T$, right adjoint to composition $\\mathrm{AffSch}_{/K^{\\times n}}\\to\\mathrm{AffSch}_{/BK}$, is final.\n\n**Step 3 — the level tower, interchanged.** $H^{\\times n}\\simeq_{\\mathrm{Sch}}\\varprojlim_mH_m^{\\times n}$ is a placid presentation ([`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html)), so $\\mathcal{D}^!(H^{\\times n})\\simeq\\varprojlim_m\\mathcal{D}(H_m^{\\times n})$ along the $q_{n\\star}$ ([`ex:sheaf_on_placid_scheme`](../../../appendix/ex-sheaf-on-placid-scheme.html)); $\\mathcal{D}^!$ agrees with $\\mathcal{D}$ on finite-type affines. Interchange needs each square (horizontals a face $d$, verticals $q_n,q_{n-1}$) right-adjointable, $d^!q_{n-1\\star}\\simeq_{\\mathrm{Fun}(\\mathcal{D}(H_{m'}^{\\times n-1}),\\mathcal{D}(H_m^{\\times n}))}q_{n\\star}d^!$ — only faces occur, $\\Delta_{\\mathrm{inj}}$ having no codegeneracies. Factor $q_n$ as $\\mathrm{pr}_1\\circ c$ through $W:=H_m^{\\times n}\\times_{H_m^{\\times n-1}}H_{m'}^{\\times n-1}$: the $(\\mathrm{pr}_1,\\mathrm{pr}_2)$-square over $d$ is cartesian, where base change for $((-)^!,(-)_\\star)$ is standard; right-adjointability composes. A face drops or multiplies one coordinate, so a fibre of $c$ is its lifts: a torsor under $N_{m,m'}$, unipotent hence $\\simeq_{\\mathrm{Sch}}\\mathbb{A}^d$ (char $0$) and trivial over the affine $W$. So $c$ is the projection $W\\times\\mathbb{A}^d\\to W$ and the residual mate is the unit $\\mathrm{id}\\to c_\\star c^!$, invertible as $c^!$ is fully faithful by de Rham homotopy invariance — scheme-level, not from [Q1-L4-L3](../Q1-L4-L3/index.html). So the bi-diagram $\\Delta_{\\mathrm{inj}}\\times\\mathbb{N}^{op}\\to\\mathrm{DGCat}$ exists, and Fubini with Step 2 twice gives\n\n$$\n\\mathcal{D}^!(BH)\\simeq\\varprojlim_{[n]}\\varprojlim_m\\mathcal{D}(H_m^{\\times n})\\simeq\\varprojlim_m\\varprojlim_{[n]}\\mathcal{D}(H_m^{\\times n})\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m).\n$$\n\n**Step 4 — the first display.** Each $\\pi^!_{m',m}:\\mathcal{D}^!(BH_m)\\to\\mathcal{D}^!(BH_{m'})$ is an equivalence (Step 1), hence so is its right adjoint, Step 3's transition; a tower of equivalences having limit its value at any level, $\\varprojlim_{m'}\\mathcal{D}^!(BH_{m'})\\to\\mathcal{D}^!(BH_m)$ is an equivalence, inverse determined by $\\{\\pi^!_{m',m}\\}$. Its $[n]$-component being $!$-pullback along $H^{\\times n}\\to H_m^{\\times n}$, i.e. $\\mathcal{D}^!$ of $B_\\bullet(H\\to H_m)$, under Step 3 that inverse is $\\pi_m^!:\\mathcal{D}^!(BH_m)\\xrightarrow{\\ \\sim\\ }\\mathcal{D}^!(BH)$.\n\n**Step 5 — $\\pi_m^!$ preserves and reflects coherence.** Coherence is tested on smooth $f:S\\to\\mathcal{Y}$, $S$ of finite type ([`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html), ratified reading 1) and classical; $\\mathcal{D}(S)\\simeq_{\\mathrm{DGCat}}\\mathcal{D}(S^{\\mathrm{cl}})$ compatibly with $!$-pullback. Such a test of $BK$ is its $K$-torsor $P=S\\times_{BK}\\mathrm{pt}\\to S$, affine over $S$, smoothness to a prestack being tested along the atlas. **(A)** $f:S\\to BH$ smooth $\\Rightarrow S$ smooth: $P$ is levelwise smooth over $k$, and $P\\times^HH_{m'}\\to S$ — affine by fpqc descent — is a finite-type smooth surjection, along which smoothness descends. **(B1)** any $f':Q\\to\\mathrm{pt}\\to BH$, $Q$ smooth of finite type, is smooth: its base change is $Q\\times H\\to Q$. **(B2)** for $S$ smooth of finite type, every $g:S\\to BH_m$ is smooth: its base change $P\\to S$ is so.\n\n*Preserved.* For a smooth test $f:S\\to BH$, $S$ is smooth by (A) and $\\pi_mf$ a smooth test of $BH_m$ by (B2); as $f^!\\pi_m^!\\mathcal{F}\\simeq_{\\mathcal{D}(S)}(\\pi_mf)^!\\mathcal{F}$, $\\mathcal{F}\\in\\mathcal{D}_c(BH_m)$ forces $\\pi_m^!\\mathcal{F}\\in\\mathcal{D}_c(BH)$.\n\n*Reflected.* A smooth test $g:S\\to BH_m$ classifies $u:Q\\to S$: $Q$ smooth of finite type, $u$ smooth surjective, $u^*Q$ trivial. So $gu$ lifts to $f':Q\\to\\mathrm{pt}\\to BH$, smooth by (B1), with $\\pi_mf'\\simeq_{\\operatorname{Map}(Q,BH_m)}gu$; then $u^!g^!\\mathcal{F}\\simeq_{\\mathcal{D}(Q)}f'^!\\pi_m^!\\mathcal{F}$ is coherent when $\\pi_m^!\\mathcal{F}\\in\\mathcal{D}_c(BH)$. Coherence descends along $u$: $u^*$ (a shift of $u^!$) is t-exact, conservative and faithfully flat, so $g^!\\mathcal{F}$ is a finite complex and each $H^i(g^!\\mathcal{F})$, a filtered union of coherent submodules, is coherent, finite generation being detected after $u^*$. So $\\mathcal{F}\\in\\mathcal{D}_c(BH_m)$; $\\mathcal{D}_c$ being full in $\\mathcal{D}^!$ on both sides, Step 4's equivalence restricts to $\\mathcal{D}_c(BH_m)\\xrightarrow{\\ \\sim\\ }\\mathcal{D}_c(BH)$. $\\blacksquare$\n\n## Caveats\n\n*Smoothness to a prestack* is in no entry; (B1), (B2) hold under any reading, (A) under the levelwise one.\n";</script>
