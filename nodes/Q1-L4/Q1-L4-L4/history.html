1's scoped GAP split in two: the $\\mathrm{Tot}/\\varprojlim$ interchange was available under this node's own unipotence hypothesis — an unwritten step, and the round-1 diagnosis of it was wrong, the obstruction sitting on codegeneracy squares and vanishing over $\\Delta_{\\mathrm{inj}}$ — while descent along the placid-fibred atlas was genuinely absent, closed by the commissioned entry [Raskin torsor descent](../../../appendix/bb-raskin-torsor-descent.html), deliberately primitive so the scheme-to-stack assembly stayed this node's work. **The write-up is 1281 words against the 900-word budget**, accepted under the skill's rule after the one compression pass; both referee and prover judge the mathematics complete at that length and further compression a trade of argument for assertion. Both recommend the same cut: Step 2 — $\\mathcal{D}^!(BK)\\simeq\\varprojlim_{[n]\\in\\Delta_{\\mathrm{inj}}}\\mathcal{D}^!(K^{\\times n})$ for an affine group scheme with fppf-locally trivial torsors — as a sub-lemma, its seam pre-drawn since Step 2's Claim already carries fppf-local triviality as a hypothesis, and commissioned in so many words by the appendix entry's own note. Pending that split, the node carries the overflow openly.\n- **2026-08-05 — examined and unchanged** by `/update`: re-read against the input passage. This node takes the placid presentation as a *hypothesis* — $H = \\varprojlim_m H_m$ with surjective smooth affine transitions — so the objection is answered entirely upstream, by [Q1-L4-L2](../Q1-L4-L2/index.html) discharging that hypothesis for $H = K_\\lambda$ ([u1](../../../../blueprint/nodes/Q1-L4/Q1-L4-L2/updates/u1.md)).\n";</script>
