egister of what was on the DAG and is not any more.\n\n## 2026-08-09 — Q3 and Q4 were reset to their questions\n\nBoth questions were decomposed early and then never worked on: fifteen nodes, all `open`, no draft, no critique, no example, no goal-check and no history past the decomposition that made them. A decomposition nobody has attempted is a *prediction* about how the argument will go, and fifteen of them standing on the graph read as work in progress rather than as a guess. Both questions keep their framing, their hypotheses and their conjecture, and both are decomposed again from scratch when they are picked up.\n\nThe statements below are one-line summaries, not the statements themselves. `git show 164047f:blueprint/nodes/Q3/Q3-L1/Q3-L1_node.md` and its analogues recover any of them in full.\n\n| id | role | what it claimed |\n|---|---|---|\n| `Q3-L1` | proof | **(H1)** holds at $\\lambda$ exactly when $i_\\lambda^!$ and $i_{\\lambda!}$ preserve coherence — necessary and sufficient |\n| `Q3-L2` | proof | necessary: $\\overline{i}_\\lambda$ is of finite presentation, which fails at the constant-loop stratum whenever $X$ has a $G$-fixed point and $\\dim X\\ge 1$ |\n| `Q3-L3` | proof | necessary: the strata are not all open and closed with $\\Lambda_X^+$ infinite, which is what makes **(H2)** false for $X = T$ under $T\\times T$ |\n| `Q3-L4` | proof | sufficient: a filtered index with bounded supports for coherent objects gives **(H2)** |\n| `Q3-L5` | proof | **(H3)** at a closure is exactly generation by the objects supported on its single strata — necessary and sufficient |\n| `Q3-L6` | proof | the directedness **(H2)** needs is connectedness of $LX$; for symmetric $X$, that $\\pi_0(LX)$ is a point |\n| `Q3-L7` | proof | sufficient: a support bound on each coherent object with the open–closed triangles gives **(H3)**, with no orbit finiteness |\n| `Q3-L8` | proof | sufficient: on a named class, **(H2)** and **(H3)** at once |\n| `Q4-L1` | proof | vanishing of every Hecke costalk at $\\lambda$ gives **(2)** there without **(1)** |\n| `Q4-L2` | proof | through the reached subcategory $\\mathcal{R}_\\lambda$: **(1)** says $\\mathcal{R}_\\lambda$ is the whole stratum category, **(2)** says $i_{\\lambda!}\\mathcal{R}_\\lambda$ lands in the Satake subcategory |\n| `Q4-L3` | proof | a screening subcategory at $\\lambda$ makes **(1)** and **(2)** mutually exclusive there |\n| `Q4-L4` | proof | granted **(1)** at $\\lambda$, condition **(2)** at $\\lambda$ is necessary and sufficient for the membership [Q2](Q2/index.html) asks at $\\lambda$ |\n| `Q4-e1` | example | an abstract split family realizing **(2)** without **(1)** |\n| `Q4-e2` | example | an abstract instance of the screen of `Q4-L3`; no $X$ carrying one was known |\n| `Q4-e3` | example | $X = \\mathrm{GL}_2/\\mathrm{O}_2$, realizing **(2)** without **(1)** geometrically |\n";</script>
