ement alone. The three clauses are unchanged in content, with clause (ii) now saying why the renormalized ambient is load-bearing here.\n\n## Why the shape is now fixed\n\nThis revision is the same one at all four Q2 example nodes, made under [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html): an example node is a proposition, so its statement must be readable on its own and must say which way the instance cuts. Nothing in the mathematics of the node was weakened or added to; what changed is that the claim being instantiated is now *in* the file rather than one link away, and that the polarity is now asserted rather than left for the reader to assume.\n\nThe polarity recorded for this node is **boundary**.\n";</script>
