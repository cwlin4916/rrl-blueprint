ph and attributes to clause (ii). It reaches neither the nonzero orbits ([Q2-e2-L3](../Q2-e2-L3/index.html)) nor the boundary dévissage ([Q2-e2-L5](../Q2-e2-L5/index.html)).\n- **2026-08-06 — the two halves are kept in one node deliberately.** Clause (3) is the negative half of the same computation as clause (1): both turn on $\\operatorname{supp}(P_N) = t^N\\mathcal{O}$, which never shrinks to $\\{0\\}$ for finite $N$, and separating them would make one node restate the other's support computation. The positive half needs the continuity of each $i_r^!$ and the joint conservativity of the family — hypotheses **(H1)** and **(H3)** of [Q1-L5](../../../Q1/Q1-L5/index.html), which the [Q2](../../../../dag.html) framing puts in force; that (H3) is stated for the strata of a single closure and every closure here carries infinitely many strata is a load a `/prove` round on this node must carry openly.\n";</script>
