 = \\mathbb{G}_m$, $X = \\mathbb{A}^1$. It reaches none of the parent's three sheaf-theoretic clauses: it is pure valuation geometry, and it is the run's ready leaf.\n- **2026-08-06 — why clauses (3)–(5) are here and not left implicit.** Clause (4) states the failure of hypothesis **(A)** of [Q2-L3](../../Q2-L3/index.html) as a claim rather than as an aside, because it is what makes the parent route through [Q2-L4](../../Q2-L4/index.html) instead. Clause (3) — the boundary of every closure is again a single orbit closure — and clause (5) — the closed unions of orbits are only $\\{0\\}$ and the $\\overline{LX}_s$, decreasing in $s$ — were pulled up into this node because [Q2-e2-L5](../Q2-e2-L5/index.html) needs both to say what [Q2-L4](../../Q2-L4/index.html)'s exhaustion hypothesis can and cannot mean here, and they belong with the rest of the geometry.\n";</script>
