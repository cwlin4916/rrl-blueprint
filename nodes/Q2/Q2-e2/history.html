<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-e2</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-e2 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-e2 — history\n\n[Q2-e2](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by `/decompose` of [Q2](../../../dag.html), from the user's input passage (Test 2 of it): it is the smallest member of the standing class where per-closure orbit finiteness fails, and therefore the first place an exhaustive dévissage can be exhibited rather than assumed. Proving clause (ii) in the renormalized formalism would give [Q2-L4](../Q2-L4/index.html) its first model; failing to prove it would say the boundary problem is not a technicality.\n- **2026-08-05 — relation to what is already on the tree.** The same variety appears as [Q1-e2](../../Q1/Q1-e2/index.html) (Iwasawa–Tate at question level) and [Q1-L4-e1](../../Q1/Q1-L4/Q1-L4-e1/index.html) (its stratum stabilizers), and it is the recomputed counterexample that withdrew per-closure finiteness from [Q1-L4](../../Q1/Q1-L4/index.html) ([its u1](../../Q1/Q1-L4/updates/u1.html)). This node is none of those: it asks the Q2 question — whether the standard objects are Hecke-reachable — and the answer is expected to be yes, by a colimit.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: the infinite-boundary telescope for $\\mathbb{A}^1$ under $\\mathbb{G}_m$. Its closed orbit $\\{0\\}$ is the same stratum that marks the gap between ratified reading 3 and the scope of its published provenance, tracked at [P18](../../../../blueprint/priorities.md).\n- **2026-08-06 — statement revised** by `/update Q2-e2` ([u1](updates/u1.html)), on the user's instruction that each Q2 example be readable on its own and declare its polarity. The claim it instantiates is now quoted inside the statement instead of linked, and the statement opens on its polarity — **boundary** — under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html). The mathematics is unchanged.\n- **2026-08-06 — decomposed** by `/decompose Q2-e2` into five sub-nodes, all of role `example` under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html) rule 3: [Q2-e2-L1](Q2-e2-L1/index.html) the orbit geometry (ready leaf), [Q2-e2-L2](Q2-e2-L2/index.html) the Hecke translates and the normalization, [Q2-e2-L3](Q2-e2-L3/index.html) clause (i), [Q2-e2-L4](Q2-e2-L4/index.html) clause (ii), [Q2-e2-L5](Q2-e2-L5/index.html) clause (iii). The statement above is untouched; the new `## Decomposition` paragraph says how the five reassemble.\n- **2026-08-06 — two obligations the decomposition surfaced and did not repair.** In clause (i), the third term: the counit triangle's cofibre is computed by excision as a $*$-restriction to the closed complement, while $P_{m+1}$ is $!$-data, and the two differ along a codimension-one closed embedding by a shift nobody has computed — carried as clause (2) of [Q2-e2-L3](Q2-e2-L3/index.html), with the obligation written into that statement. In clause (iii), the stages: their union is $\\overline{LX}_m$ rather than $\\partial\\overline{LX}_m$, and none of them is closed, so none is the \"finite union of orbit closures\" [Q2-L4](../Q2-L4/index.html) asks for — carried as clauses (1), (2) and (4) of [Q2-e2-L5](Q2-e2-L5/index.html). Statements are frozen (I2), so both stand as claims of the children; whatever a `/prove` round makes of them is `/update`'s to bring back here.\n- **2026-08-07 — the statement now says, explicitly, how the example stands to its parent** by `/update`. The relation was in the prose and said differently in each of the four examples, so no reader could line them up. Every Q2 example now carries the same block immediately after its polarity line, in four fixed slots: whether $X$ is in the standing class, whether it meets [Q2](../../../dag.html)'s conjecture's hypotheses, whether the membership the problem statement asks about holds, and what the case contributes to the main theorem — each linked to the [key-example register](../../../key_examples/index.html) entry that settles it in print. Its four slots: in the standing class, meets **none** of the conjecture's hypotheses ($X$ is not homogeneous), the membership nevertheless holds — so it separates Q2's problem statement from Q2's conjecture, the closed orbit's standard object being a filtered colimit no finite convolution word reaches. It is [K1](../../../key_examples/k1.html), `positive`.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
