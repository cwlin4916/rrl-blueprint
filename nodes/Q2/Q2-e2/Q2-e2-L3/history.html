thbb{A}^1$. It does not reach the closed orbit, which is [Q2-e2-L4](../Q2-e2-L4/index.html).\n- **2026-08-06 — the excision direction is stated as an obligation, not assumed.** The parent's clause (i) puts $i_{m!}$ on the left of the triangle and $P_{m+1}$ on the right. The counit triangle of hypothesis **(B)** of [Q2-L3](../../Q2-L3/index.html) supplies the left-hand term for free, but its third term is the $*$-restriction of $P_m$ to the closed complement $\\overline{LX}_{m+1}$, pushed forward — the *other* standard triangle, $i_*i^!\\to\\mathrm{id}\\to j_*j^*$, is the one that produces $!$-data on the closed part — while $P_{m+1}$ is $!$-data under the normalization **(N)** of [Q2-e2-L2](../Q2-e2-L2/index.html). The two differ, on a codimension-one closed embedding, by a cohomological shift that nobody has computed here. Clause (2) of this node therefore *asserts* the identification with no shift, and says in the statement itself what a proof owes: the comparison of $*$- with $!$-restriction along $\\overline{LX}_{m+1}\\hookrightarrow\\overline{LX}_m$ in the dimension theory of **(N)**. If that comparison comes out with a shift, clause (2) is refuted and the parent's clause (i) is true only with a shifted third term — which is a result about the parent, to be recorded by `/update` and not by a silent repair here, since a statement is frozen once written.\n";</script>
