f clauses (i) and (ii).\n- **2026-08-06 — two obligations in clause (iii) made visible rather than repaired.** First, the stages the parent displays run from $r = m$, so their union is $\\overline{LX}_m$ and not the boundary $\\partial\\overline{LX}_m$ that [Q2-L4](../../Q2-L4/index.html) asks to be exhausted; clause (1) states both unions and names the shifted chain that does the job. Second, and structurally: a union of orbits here is closed only if it is closed under raising the valuation ([Q2-e2-L1](../Q2-e2-L1/index.html)(5)), while the parent's stages truncate the valuation from above, so no stage is closed — and the *closed* candidates inside a boundary decrease as they shrink toward $\\{0\\}$, so an increasing chain of them jumps at once to the whole boundary and [Q2-L4](../../Q2-L4/index.html) returns its own hypothesis. Clause (3) therefore asserts the presentation for the locally closed stages, and clause (4) records that the literal reading is vacuous here. Neither is written into the parent, whose statement is frozen; if a `/prove` round confirms them, the consequence for [Q2-L4](../../Q2-L4/index.html)'s \"finite union of orbit closures\" is `/update`'s to draw.\n";</script>
