<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L8</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L8 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q2-L8\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [papers](../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q2-L8](index.html), and explicit instances of it,\nsimplest first. This file is outside the closed world: it justifies believing or doubting the\nstatement and no proof may cite it.\n\n**Referral to the critic.** Hypothesis **(D)** is discharged by no instance with more than one\nstratum, and instance 3 below exhibits its failure in the group case. The node's conclusion is not\nin doubt; its route to it is.\n\n**The dictionary** (used only in the closing line of instance 2, and in print): *sheaf–function*.\n\n- a $K$-orbit stratum $LX_\\lambda$ corresponds to the characteristic function of the corresponding\n  $K$-orbit on $X(F)$;\n- a standard object $\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$ to that characteristic function;\n- the class map $K_0\\rightarrow\\{\\text{functions}\\}$ to \"trace of Frobenius\".\n\nSourced: `bezrukavnikov2016two`, §1.1 (p. 3, read this run) — \"the space of functions … is a\nquotient of the Grothendieck group of the category\".\n\nIt drops everything below $K_0$, and it is a *quotient*, so a spanning statement upstairs is\nstrictly stronger than the one downstairs.\n\n## The seven pieces\n\nThe numerals in every **What it matches.** field below refer to this list. It is a decomposition of\nthe [node](index.html)'s statement made for this file, and not numbering the node itself carries:\nthe node's own parts are **(A)**, **(B)**, **(D)**, **(E)** and the conclusion, and there is no (C).\n\n1. **The frame.** Recollement hypothesis **(H1)** — $!$-restriction to each stratum continuous with\n   a fully faithful continuous left adjoint — over a stratification of an ind-scheme by locally\n   closed orbit strata indexed by a poset under the closure order, with $\\mathcal{D}_c$ the coherent\n   objects on the quotient stack $K\\backslash LX$.\n2. **The stratum-support notion.** $\\mathrm{supp}_\\Lambda(\\mathcal{F})$ defined by non-vanishing of\n   the $!$-costalk $i_\\lambda^!\\mathcal{F}$.\n3. **Hypothesis (A).** The chosen stratum generators are coherent on their stratum.\n4. **Hypothesis (B).** Every coherent object has finite stratum support.\n5. **Hypothesis (D).** The peeling fibre sequence at a maximal stratum stays inside $\\mathcal{D}_c$,\n   and the third term's support gains no new stratum.\n6. **Hypothesis (E).** The stratum's Grothendieck group is the integral span of the classes of a\n   generating collection.\n7. **The conclusion.** $K_0$ of the whole is spanned by the classes of the standard objects\n   $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$.\n\n## Precedent\n\n**What was searched.** Decategorified dévissage: Quillen's dévissage and localization theorems and\ntheir $K_0$ consequences; Verdier/Thomason–Trobaugh localization at $K_0$; Thomason's classification\nof dense triangulated subcategories; highest-weight and quasi-hereditary categories (standard objects\nas a $K_0$ basis); Iwahori-equivariant sheaves on affine flag varieties and the Iwahori–Matsumoto\nbasis. Local library first (`bezrukavnikov2016two` pp. 1–4, `BZSV` p. 168, both read this run), then\nthe web.\n\n**What was found.**\n\n*Quillen*, \"Higher algebraic K-theory: I\", LNM **341** (1973) 85–147; `refs.bib`: **absent**. Read at\npage level this run.\n\n**Theorem 5 (Localization)**, p. 113: for $\\underline B$ a Serre subcategory of $\\underline A$, a\nlong exact sequence ending\n\n$$\n\\cdots\\rightarrow K_0\\underline B\\rightarrow K_0\\underline A\\rightarrow K_0(\\underline A/\\underline B)\\rightarrow 0.\n$$\n\nIterated over a finite stratification this *is* the node's conclusion in the abelian setting; of\n*The seven pieces* above it matches **1** (frame, in its abelian incarnation), **5** and **7**. The\ndirection is important: there the analogue of **(D)** is a *theorem*, forced by $\\underline B$ being Serre, not a\nhypothesis.\n\n**Theorem 4 (Dévissage)**, p. 112 — every object having a finite filtration with subquotients in\n$\\underline B$ gives $K_i\\underline B\\xrightarrow{\\sim}K_i\\underline A$ — is the abelian precedent\nfor the *shape* of [Q2-L8-L1](Q2-L8-L1/index.html), hypothesis **(F)** plus clause (i), and is\nstronger there (isomorphism, not spanning). It does not reach pieces **2**, **3**, **4**, **6**:\nthere is no $!$-costalk support, no coherence-on-a-stratum condition, and nothing about a generating\ncollection.\n\n**Theorem 4, Corollary 1**, p. 112 — for $\\underline A$ of finite length,\n$K_i\\underline A\\simeq\\coprod_j K_iD_j$ over the simple objects,\n$D_j=\\mathrm{End}(X_j)^{\\mathrm{op}}$ — is the source used for piece **6** in instances 3 and 4.\n\n*Thomason's classification of dense triangulated subcategories*, as restated in Orlov, \"Formal\ncompletions and idempotent completions of triangulated categories of singularities\",\narXiv:0901.1859, **Theorem 4.1** (read this run): for $\\mathcal{T}$ essentially small triangulated,\nthe strictly full **dense** triangulated subcategories $\\mathcal{N}\\subseteq\\mathcal{T}$ — dense\nmeaning every object of $\\mathcal{T}$ is a direct summand of one of $\\mathcal{N}$ — correspond\none-to-one to the subgroups $H\\subseteq K_0(\\mathcal{T})$, via\n$\\mathcal{N}\\mapsto\\mathrm{im}(K_0\\mathcal{N}\\rightarrow K_0\\mathcal{T})$.\n\nPrimary source: R. W. Thomason, *The classification of triangulated subcategories*, Compositio Math.\n**105** (1997) 1–27, Theorem 2.1; `refs.bib`: **absent**, and read only through Orlov's restatement.\n\nThis matches piece **6** exactly and matches nothing else: it says the image in $K_0$ of what a\ncollection generates may be *any* subgroup, so generation never implies **(E)**, and the deficiency\nis measured precisely by $K_0/\\sum_a\\mathbb{Z}[E_{\\lambda,a}]$. It is the published form of the\nmechanism [u1](updates/u1.html) found by hand, and it entails that **(E)** is independent.\n\n*Recollement identities* ([BBDG18], §1.4):\n\n$$\nj^*i_*=0,\\qquad i^*j_!=0,\\qquad i^!j_*=0.\n$$\n\nThese touch piece **1** only, and they are the input to instance 3.\n\n**What was not found.** No source states the node's conclusion for $\\mathcal{D}_c(K\\backslash LX)$\nwith $X$ a general smooth affine spherical variety, and — more informative — **no source assumes\nanything like (D)**.\n\n`chenyi_2025singularitiesorbitclosuresloop`, the natural home (it computes the orbits, the closure\norder and the placidity of the closures, and proves semisimplicity of the relative Satake category\nin Cor. 9), states no $K_0$ result at all. `BZSV` §7.5 and §9 stay at function level and unramified,\nand §9.4's Hecke-module display carries a question mark. `bezrukavnikov2016two` has the group case\nat Iwahori level but only as unnumbered prose in §1.1.\n\nEvery stratification argument located instead inducts on the number of strata in a **closed** set,\nwhere the third term of the peeling triangle is allowed to acquire new strata; that is exactly what\n**(D)** forbids, and instance 3 says why nobody forbids it.\n\n## Instances\n\n### 1. $X = \\mathrm{pt}$ — instance (degenerate)\n\n**What it is.** $G$ any connected reductive group, $X=\\mathrm{pt}$, so $LX=\\mathrm{pt}$,\n$K\\backslash LX = BL^+G$, and $\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html))\nis a single point $\\lambda_0$ with $i_{\\lambda_0}=\\mathrm{id}$.\n\n**Why it is an instance.**\n\n- *Standing class:* $\\mathrm{pt}$ is smooth affine and $B$ has a dense orbit on it.\n- *(A):* any generating collection may be taken inside\n  $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) — take\n  $E_{\\lambda_0}=\\omega$.\n- *(B):* the support is a subset of a one-element set.\n- *(D):* $i_{\\lambda_0!}i_{\\lambda_0}^!=\\mathrm{id}$, so $\\mathcal{F}'=0$ and the containment is\n  $\\varnothing\\subseteq\\varnothing$.\n- **Not discharged: (E)**, which here *is* the conclusion; it is\n  [Q2-L8-L2](Q2-L8-L2/index.html)(i) at the one stratum and is unproved.\n\nAlso not verified this run: that [the three standing hypotheses](../../../appendix/assum-intro.html)(c) is known for\n$X=\\mathrm{pt}$.\n\n**What it matches.** Pieces **1**, **3**, **4**, **5**, **7** — trivially, by the specialisation\n$\\Lambda_X^+=\\{\\lambda_0\\}$. It is the *only* configuration found in which **(D)** is discharged, and\nthat is its whole value. It does not reach **2** (support is not tested) or **6**.\n\n**What the statement says here.**\n\n$$\nK_0(\\mathcal{D}_c(BL^+G))=\\sum_a\\mathbb{Z}[E_{\\lambda_0,a}],\n$$\n\ni.e. the node degenerates to **(E)** and asserts nothing further.\n\n**Source.** Ben-Zvi, Sakellaridis, Venkatesh, *Relative Langlands duality*, 2024, arXiv:2409.04677,\n§7.6 (p. 168, read this run) for the frame in which the known cases are listed. `refs.bib`: `BZSV`.\n\n### 2. $X = G$ under $G\\times G$ — instance (classical)\n\n**What it is.** $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$, $\\Lambda_X^+=\\Lambda^+$ the\ndominant coweights, $LX_\\nu=\\mathrm{Gr}_\\nu$, and the order of the node is the dominance order\n([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)).\n\n**Why it is an instance.**\n\n- *Standing class:* `BZSV` §7.6.2 (p. 168, read this run) — \"the conjecture is precisely the derived\n  Satake theorem of [BF08]\" — so [the three standing hypotheses](../../../appendix/assum-intro.html)(c) holds.\n- *(A):* $\\#A_\\nu=1$ with $E_\\nu=\\omega_{K\\backslash\\mathrm{Gr}_\\nu}$, the stabilizer having\n  connected reductive quotient $Z_G(\\nu)$ — [Q2-e1-L1](../Q2-e1/Q2-e1-L1/index.html).\n- *(B):* every object of $\\mathcal{D}_c$ lives on some $\\mathrm{Gr}_{\\le\\nu}$, which contains\n  finitely many strata.\n- **Not discharged: (D)** — it *fails*, by instance 3.\n- **Not discharged: (E)** — it is [Q2-L8-L2](Q2-L8-L2/index.html)(i), unproved.\n\n**What it matches.** Pieces **1**, **2**, **3**, **4**, **7** under the specialisation $X=G$; it is a\ncounter-match on **5**. Under the dictionary the conclusion is the classical statement that the\ncharacteristic functions $\\mathbf{1}_{Kt^\\nu K}$ span the spherical Hecke algebra; that shadow\nreaches only **7**, and the dictionary's quotient direction means it cannot confirm **6**.\n\n**What the statement says here.**\n\n$$\nK_0\\left(\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})\\right)=\\sum_{\\nu\\in\\Lambda^+}\\mathbb{Z}\\left[i_{\\nu!}\\,\\omega_{K\\backslash\\mathrm{Gr}_\\nu}\\right].\n$$\n\nThis is believable — it survives instance 3, because\n[Q2-L8-L1](Q2-L8-L1/index.html)'s **(F)** does not require the filtration indices to lie in the\nsupport — but the node's own route to it does not.\n\n**Source.** `BZSV` §7.6.2, p. 168 (read this run). Closure order: `mirkovic2007geometric`, p. 4,\n(2.2) — recorded at page level in [papers/guideline.md](../../../papers/guideline.html) by the Q1-L3\nrun, not re-read here.\n\n### 3. A $*$-extension across one boundary — instance (boundary: **(D)** fails)\n\n**What it is.** *(constructed, unsourced.)* Fix $\\lambda$ whose stratum has non-empty boundary\n$\\partial=\\overline{LX}_\\lambda\\smallsetminus LX_\\lambda$ — e.g. $X=G$, $G=\\mathrm{PGL}_2$,\n$\\lambda=\\check\\alpha$, $\\partial=\\mathrm{Gr}_0$.\n\nWrite $i_\\lambda=\\overline{i}_\\lambda\\circ j_\\lambda$ as in\n[Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), so\n$i_\\lambda^!=j_\\lambda^*\\overline{i}_\\lambda^!$ and $i_{\\lambda!}=\\overline{i}_{\\lambda*}j_{\\lambda!}$,\nand set\n\n$$\n\\mathcal{F} := \\overline{i}_{\\lambda*}\\,j_{\\lambda*}\\,\\omega_{K\\backslash LX_\\lambda}.\n$$\n\n**Why it is an instance.**\n\n- *(A), (B):* $\\mathcal{F}$ is coherent — $j_{\\lambda*}$ preserves holonomicity on the finite-type\n  closure and $\\overline{i}_{\\lambda*}$ is a closed pushforward — and its support is a single point\n  of $\\Lambda_X^+$.\n- *(D):* **fails.** By $i^!j_*=0$ ([BBDG18], §1.4), $i_\\mu^!\\mathcal{F}=0$ for every\n  $\\mu\\neq\\lambda$, so $\\mathrm{supp}_\\Lambda(\\mathcal{F})=\\{\\lambda\\}$ and $\\lambda$ is maximal in\n  it. **(D)** then forces $\\mathrm{supp}_\\Lambda(\\mathcal{F}')=\\varnothing$, hence $\\mathcal{F}'=0$\n  by the joint conservativity that **(H2)**–**(H3)** supply (verified in [u1](updates/u1.html)), hence\n  $j_{\\lambda!}\\omega\\simeq j_{\\lambda*}\\omega$.\n\nThat is the condition called *cleanness* in the generalized-Springer literature, and it is\nexceptional, not generic: the cofibre is $i_{\\partial*}i_\\partial^*j_{\\lambda*}\\omega$, the\nBorel–Moore homology of a punctured neighbourhood of $\\partial$, non-zero as soon as\n$\\partial\\neq\\varnothing$.\n\n**What it matches.** Piece **5**, negatively, and only its strong part: the third term of the peeling\nsequence acquires strata outside the old support. It leaves **3**, **4**, **6**, **7** untouched, and\nin particular does not touch [Q2-L8-L1](Q2-L8-L1/index.html)'s **(F)**, which permits exactly\nthe filtration $j_{\\lambda!}\\omega\\rightarrow j_{\\lambda*}\\omega\\rightarrow(\\text{boundary})$ that\n**(D)** forbids.\n\n**What the statement says here.** Nothing: the hypothesis is unavailable, so Q2-L8 is silent about\n$\\mathcal{F}$, and about every $X$ whose closure order is non-trivial.\n\n**Source.** Recollement identities: Beilinson, Bernstein, Deligne, Gabber, *Faisceaux pervers*, §1.4;\n`refs.bib`: `BBDG18`. Cleanness: Lusztig, *Intersection cohomology complexes on a reductive group*,\nInvent. Math. **75** (1984) 205–272 — named for orientation, **not read at page level this run**;\n`refs.bib`: absent. The computation above is mine.\n\n### 4. $X = \\mathrm{GL}_2/\\mathrm{O}_2$ — instance (boundary: where **(E)** has teeth)\n\n**What it is.** $LX=\\{A\\in\\mathrm{GL}_2(F):A^{t}=A\\}$ with $K=\\mathrm{GL}_2(\\mathcal{O})$ acting by\n$g\\cdot A=gAg^{t}$; at a diagonal stratum $\\lambda=(p,p)$ the finite-type stabilizer quotient is\n$\\mathrm{O}_2$, with $\\pi_0=\\mathbb{Z}/2$ and $A_\\lambda=\\{\\mathrm{triv},\\mathrm{sgn}\\}$.\n\n**Why it is an instance.**\n\n- *(A):* both $E_{\\lambda,a}$ are coherent —\n  [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html), Example 2,\n  resting on [Q2-e3-L2](../Q2-e3/Q2-e3-L2/index.html)(B).\n- *(B):* as in instance 2.\n- *(D):* fails, by instance 3 (the strata have boundary).\n- *(E):* **holds for this choice and fails for another** — by Quillen Thm. 4, Cor. 1, the stratum's\n  $K_0$ is free on the two irreducibles, so\n  $\\mathbb{Z}[E_{\\lambda,\\mathrm{triv}}]+\\mathbb{Z}[E_{\\lambda,\\mathrm{sgn}}]$ is everything while\n  the class of the single generator $E_{\\lambda,\\mathrm{triv}}\\oplus E_{\\lambda,\\mathrm{sgn}}$ spans\n  the infinite-index subgroup $\\mathbb{Z}\\cdot(1,1)$.\n\n**What it matches.** Piece **6**, positively and negatively at once, under the specialisation\n$G_\\lambda=\\mathrm{O}_2$: it shows **(E)** is a condition on the *choice* of collection and not on the\ncategory, which is [Q2-L8-L2](Q2-L8-L2/index.html)(iii). It does not reach **1**, **2**, **4**,\n**5**, **7**.\n\n**What the statement says here.** With $A_\\lambda$ the two characters of $\\pi_0(\\mathrm{O}_2)$, the\ndiagonal stratum contributes two standard objects, not one, and dropping to one loses all but a\nrank-one subgroup of that stratum's contribution.\n\n**Source.** Quillen, *Higher algebraic K-theory: I*, LNM **341** (1973), §5, Theorem 4, Corollary 1,\np. 112 (read this run); `refs.bib`: absent. Loop-space geometry of $\\mathrm{GL}_2/\\mathrm{O}_2$:\n`chenyi_2025singularitiesorbitclosuresloop` v4, §3.2.1 — recorded at page level in\n[papers/guideline.md](../../../papers/guideline.html) by the Q1-L4-L1 run, not re-read here.\n\nEVIDENCE: gap\n";</script>
