<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L8-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L8-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L8-L1 — history\n\n[Q2-L8-L1](index.html) · [Q2-L8](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose Q2-L8`, carrying the geometric half of that node's remaining content. The finding it answers is recorded in [u1](../updates/u1.html): with three hypotheses removed, hypothesis **(D)** of [Q2-L8](../index.html) is the node's only geometric obligation, and it is *strictly stronger* than the recollement counit triangle. Applying $i_\\lambda^!$ to that triangle and using $i_\\lambda^!i_{\\lambda!}\\simeq\\mathrm{id}$ gives $i_\\lambda^!\\mathcal{F}' = 0$, so $\\lambda$ leaves the support for free; what is not free is that no new stratum enters, since for $\\mu\\notin\\mathrm{supp}_\\Lambda(\\mathcal{F})$ the triangle yields only $i_\\mu^!\\mathcal{F}'\\simeq\\left(i_\\mu^!i_{\\lambda!}i_\\lambda^!\\mathcal{F}\\right)[1]$, and a $!$-extension has costalks on the boundary of its support. **(D)** forbids that by fiat, and this node replaces it by the weaker property the argument actually consumes.\n- **2026-08-06 — why the filtration property and not (D).** [u1](../updates/u1.html) considered replacing **(B)** and **(D)** by the finite standard filtration property and declined to do it in place, on the ground of §3 of [ADR 0019](../../../../process/decisions/0019-the-update-operator.html): a strictly more general verified claim becomes its own node, with the target left standing as a specialization. That is what clause **(ii)** records — hypotheses **(B)** and **(D)** imply **(F)** — so the induction on $\\#\\mathrm{supp}_\\Lambda$ that [proof.md](../proof.html) ran, and that [r1](../critiques/r1.html) certified as well-founded, remains available as one route rather than the only one.\n- **2026-08-06 — the entailment, worked out rather than assumed.** The decomposition brief asked which direction actually holds. It is **not** the one the commissioning note guessed: **(F)** entails neither **(B)** nor **(D)** as worded. It cannot entail **(B)**, because a one-step filtration serves $\\mathcal{F} = i_{\\lambda!}\\mathcal{G}$ whatever the costalks of that $!$-extension on the boundary of $\\overline{LX}_\\lambda$, so nothing in **(F)** bounds a stratum support — and the boundary need not contain finitely many strata, as [Q2-e2-L1](../../Q2-e2/Q2-e2-L1/index.html) shows for $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$. It cannot entail **(D)**, which is a statement about one particular triangle at one particular maximal stratum, of which **(F)** says nothing. What **(F)** does entail — clause **(i)**, by additivity of $K_0$ over the filtration together with **(H1)** — is the stratum-spanning statement that is exactly the geometric half of [Q2-L8](../index.html)'s conclusion. That is the honest reading, and it is what the statement records.\n- **2026-08-06 — which standing hypotheses each clause uses.** Clause **(i)** uses **(H1)** alone: continuity of $i_\\lambda^!$ makes $i_{\\lambda!}$ preserve compacts, and $\\mathcal{D}_c$ is the compacts of $\\mathcal{D}^{\\mathrm{ren}}$ on both stacks, so the restriction to the small categories exists and is exact. Clause **(ii)** additionally needs **(H2)** and **(H3)**, and needs them only for the base case: the induction terminates at a coherent object with empty stratum support, which vanishes by the joint conservativity [u1](../updates/u1.html) derived from those two — the clause deleted from [Q2-L8](../index.html) as **(C)**.\n- **2026-08-06 — what the node does not reach.** It does not discharge **(F)** for any $X$: the property is a hypothesis here, and naming it is the whole of the generalisation. It also says nothing about the classes of the stratum objects $\\mathcal{G}_k$, which is why clause **(iii)** disclaims it and points at [Q2-L8-L2](../Q2-L8-L2/index.html). No existing node carries the claim: [Q2-L3](../../Q2-L3/index.html) and [Q2-L4](../../Q2-L4/index.html) are dévissages of the *categorical* membership question and never descend to $K_0$, and [Q1-L3-c1](../../../Q1/Q1-L3/Q1-L3-c1/index.html) consumes the spanning statement rather than proving it.\n";</script>
