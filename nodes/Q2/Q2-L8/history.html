<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L8</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L8 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L8 — history\n\n[Q2-L8](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by the lead-researcher under the failure audit of `/prove Q2` ([ADR 0022](../../../process/decisions/0022-update-proposes-nodes-from-failures.html)), answering **Step 7** of [Q1-L3-c1](../../Q1/Q1-L3/Q1-L3-c1/index.html)'s write-up, which is flagged `GAP` there: \"Step 6 gives only $\\mathcal{H}\\cdot[\\mathrm{IC}_0]\\supseteq\\sum_{\\lambda,a}\\mathbb{Z}\\,m_{\\lambda,a}$ … the generation in [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) is by arbitrary colimits, which do not descend to $K_0$; a node asserting $K_0 = \\sum_{\\lambda,a}\\mathbb{Z}\\,m_{\\lambda,a}$ discharges it.\" No existing node carries that claim: [Q2-L1](../Q2-L1/index.html) is about the generated *subcategory*, [Q2-L3](../Q2-L3/index.html) and [Q2-L4](../Q2-L4/index.html) about cocomplete generation, and none of the three descends to the Grothendieck group. [Q1-L3-c1](../../Q1/Q1-L3/Q1-L3-c1/index.html) now lists this node in **depends-on:**.\n- **2026-08-06 — why it is a node and not a step.** The claim is a decategorified dévissage in its own right: it consumes finiteness of the stratum support, a peeling triangle at a maximal stratum, and — separately from the categorical generating property — that the stratum's *classes* are already an integral span. Hypothesis **(E)** is the one that cannot be imported: a generating collection generates by arbitrary colimits ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html)), and that is strictly weaker than spanning $K_0$, which is exactly the failure Step 7 recorded. Making it a hypothesis of its own is what keeps the node honest about where the categorical input stops.\n- **2026-08-06 — the induction the statement is shaped for.** Hypothesis **(D)** is stated so that the third term's stratum support is contained in the *same finite set minus $\\lambda$*, rather than merely in the boundary $\\partial\\overline{LX}_\\lambda$. That is the difference between an induction on the cardinality of a finite support and an induction that must be well-founded on all of $\\Lambda_X^+$; with (D) as stated, the well-foundedness hypothesis **(A)** of [Q2-L3](../Q2-L3/index.html) is not needed here.\n- **2026-08-06 — proved** by `/prove Q2-L8`, `PASS` at [r1](critiques/r1.html). Nine steps, 866/900 words, closed with no `GAP` — the second node of [Q2](../../../dag.html) to close entirely inside its declared world. The argument does **not** run on (A)–(E) alone, and the referee confirmed the diagnosis: hypotheses (A) and (D) assert coherence of individual objects, which never assembles into a functor $\\mathcal{D}_c(K\\backslash LX_\\lambda)\\rightarrow\\mathcal{D}_c(K\\backslash LX)$, and without one, **(E)** — an identity for the whole of $K_0(\\mathcal{D}_c(K\\backslash LX_\\lambda))$, witnessed by relations among objects (A) says nothing about — cannot be pushed forward at all. What closes it is **(H1)**, which the statement itself puts in force: $i_\\lambda^!$ is continuous, so its left adjoint preserves compacts, and $\\mathcal{D}_c$ is the compacts of $\\mathcal{D}^{\\mathrm{ren}}$ on both stacks ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)). The induction is on $\\#\\mathrm{supp}_\\Lambda$, strictly decreasing by (D) and terminated by (C).\n- **2026-08-06 — the referee's finding for the lead-researcher, [r1](critiques/r1.html).** The second clause of hypothesis **(A)** — that $\\Delta_{\\lambda,a}$ lies in $\\mathcal{D}_c(K\\backslash LX)$ — is **redundant given the standing (H1)**, being re-proved by the write-up's Step 2. Two riders came with it: the redundancy moves the obligation into the [Q2](../../../dag.html) framing rather than dissolving it, and the parallel clause of **(B)** is *not* redundant, because (H1) supplies a left adjoint to $i_\\lambda^!$ and nothing declared makes $i_\\lambda^!$ itself preserve compacts. Eight `MINOR` flaws stand disposed of by the `PASS`; the sharpest is that the write-up's optional re-derivation of $\\mathcal{D}_c = (\\mathcal{D}^{\\mathrm{ren}})^\\omega$ reaches outside the declared `objects:` for presentability and the compactness vocabulary, an argument it did not have to give at all.\n- **2026-08-06 — three hypotheses removed, and the status reset to `open`** by `/update Q2-L8` on an external verdict the user supplied, recorded in [u1](updates/u1.html). The second clause of **(A)**, the second clause of **(B)** and the whole of **(C)** were all already supplied by the closed world the node declares. (A)'s falls to Step 2 of [proof.md](proof.html), as [r1](critiques/r1.html) found. (B)'s falls to **(D)** together with **(H1)**: (D) places $i_{\\lambda!}i_\\lambda^!\\mathcal{F}$ in $\\mathcal{D}_c$, hence compact, and a fully faithful continuous $i_{\\lambda!}$ reflects that compactness back onto $i_\\lambda^!\\mathcal{F}$ — at the maximal $\\lambda$, which is the only place Step 7 ever used it. (C) is the \"Moreover\" clause of [Q1-L5](../../Q1/Q1-L5/index.html) verbatim, derived from **(H2)** and **(H3)**. The letters (D) and (E) were **not** renumbered over the gap left by (C), because [r1](critiques/r1.html) names them and a critique is never rewritten.\n- **2026-08-06 — what the node is now, and what it is not.** With three hypotheses gone the node is a formal decategorified dévissage and its entire geometric content is **(D)**, which is strictly stronger than the recollement counit triangle. Applying $i_\\lambda^!$ to that triangle kills $\\lambda$ from the support for free, since $i_\\lambda^!i_{\\lambda!}\\simeq\\mathrm{id}$; what is not free is that no *new* stratum enters, because for $\\mu\\notin\\mathrm{supp}_\\Lambda(\\mathcal{F})$ the triangle only gives $i_\\mu^!\\mathcal{F}'\\simeq(i_\\mu^!i_{\\lambda!}i_\\lambda^!\\mathcal{F})[1]$, and a $!$-extension has costalks on the boundary of its support. So (D) rules out boundary costalks appearing during peeling, by fiat. The node therefore does not yet answer \"for which $X$\", and should not be counted as progress on the geometry until (D) and (E) are discharged.\n- **2026-08-06 — why (E) cannot be imported, sharpened.** The earlier entry above says a generating collection generates by arbitrary colimits, which do not descend to $K_0$. True, but not the sharp reason: even after descending to the **thick** closure of a compact generator, the closure is taken under **retracts**, and a retract's class need not be an integral combination of the classes it split from. The witness, verified this run, is $R = k\\times k$ with one stratum and $i_{\\lambda!} = i_\\lambda^! = \\mathrm{id}$: $R$ is a compact generator of $\\mathrm{Mod}_R$, (A)–(D) all hold, and yet $K_0(\\mathrm{Perf}\\,R)\\cong\\mathbb{Z}^2$ while $[R] = (1,1)$ spans only the diagonal. See [u1](updates/u1.html).\n- **2026-08-06 — decomposed into two children**, one per remaining hypothesis, by `/decompose Q2-L8` on the failure audit of [u1](updates/u1.html). [Q2-L8-L1](Q2-L8-L1/index.html) takes the geometry: it names the finite standard filtration property that [u1](updates/u1.html) declined to substitute for **(B)** and **(D)** in place, states that those two imply it, and shows it already yields the stratum-spanning half of this node's conclusion. [Q2-L8-L2](Q2-L8-L2/index.html) takes **(E)**, as a conditional on the stratum's stabilizer rather than as a blanket existence claim. The entailment came out the other way from the guess that commissioned it — the filtration property implies neither **(B)** nor **(D)**, and implies the conclusion directly — and the child's statement records that rather than the guess.\n- **2026-08-06 — the draft and r1 are against the superseded statement.** [proof.md](proof.html) consumes exactly the clauses that were removed — Step 3 cites (A)'s second, Step 5 cites (C), Step 7 cites (B)'s second — so it does not prove what the node now claims, and both it and [r1](critiques/r1.html) stay on disk as the record of how the node reached this state. The next `/prove` continues at `r2`.\n- **2026-08-06 — re-proved against the strengthened statement** by `/prove Q2-L8`, `PASS` at [r2](critiques/r2.html), one round. Six steps, no `GAP`. The write-up runs **through the decomposition** rather than on **(A)**, **(B)**, **(D)**, **(E)** directly. Clause (ii) of [Q2-L8-L1](Q2-L8-L1/index.html) turns this node's **(B)** and **(D)** into the finite standard filtration property **(F)**. Clause (i) then supplies both the exact restriction $i_{\\lambda!}\\colon\\mathcal{D}_c(K\\backslash LX_\\lambda)\\rightarrow\\mathcal{D}_c(K\\backslash LX)$ and the identity $K_0(\\mathcal{D}_c(K\\backslash LX)) = \\sum_\\lambda\\mathrm{im}\\,K_0(i_{\\lambda!})$, and **(E)** identifies each image with $\\sum_a\\mathbb{Z}[\\Delta_{\\lambda,a}]$.\n- **2026-08-06 — why the direct route was abandoned, and what that says about the split.** The superseded [proof.md](proof.html) was already 882 words with **(C)** granted and both deleted clauses free; re-deriving the three of them costs on the order of 200 words more, so the eight-step argument no longer fits one page. Worse, re-deriving **(C)** needs two things this node does not declare: the compatibility $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$, and that every stratum of $\\overline{LX}_\\mu$ is indexed by [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html). So the direct route would have shipped a `GAP` as well as an overflow. The decomposition of [u1](updates/u1.html) is what makes the node provable on one page, which is the argument for having split it.\n- **2026-08-06 — [Q2-L8-L2](Q2-L8-L2/index.html) is a dependency the deduction does not consume**, and the write-up says so in its `uses:` bullet and again in a caveat. **(E)** is a *hypothesis* of this node. L2 produces a generating collection whose classes span, at a stratum satisfying its presentation hypothesis **(P)**; that is what makes **(E)** attainable rather than what the argument runs on. The referee confirmed no step leans on it silently. What the node still owes is therefore **(D)** and **(E)**, exactly as before the re-proof: closing them is [Q2-L8-L1](Q2-L8-L1/index.html) and [Q2-L8-L2](Q2-L8-L2/index.html)'s business, and this node's `proved` records only that the step from their statements to its own is sound.\n- **2026-08-06 — hypothesis (A) is inert beyond well-posedness.** Verified by the prover and confirmed at [r2](critiques/r2.html): **(A)** is what makes $[E_{\\lambda,a}]$ a class in $K_0(\\mathcal{D}_c(K\\backslash LX_\\lambda))$, so that the right side of **(E)** is a subgroup of its left, and what feeds $E_{\\lambda,a}$ into the restricted functor so that $[\\Delta_{\\lambda,a}]$ exists at all. No relation in either group is derived from it. It is the last surviving clause of the hypothesis [u1](updates/u1.html) cut in half, and it survives because deleting it would leave the statement without a well-formed conclusion.\n- **2026-08-06 — the referee's finding for the lead-researcher, [r2](critiques/r2.html).** [Q2-L8-L1](Q2-L8-L1/index.html) typesets clauses (i), (ii), (iii) under a single \"Assume **(F)**\", and clause (ii)'s consequent *is* **(F)** — so read as scoped it is vacuous, and the write-up reads it unconditionally. The referee adjudicated that reading **forced** rather than a strengthening, by an argument the write-up had not found. Under the scoped parse clause (iii) is not a proposition at all: \"**(F)** implies that it is not asserted that **(F)** implies **(B)**\" has no truth value. So the list demonstrably mixes a theorem with structural clauses outside the scope, and (ii) is (iii)'s neighbour. The hazard is concrete and belongs to `/update Q2-L8-L1`: a later prover of that node reading (ii) as scoped is discharged by proving (i) alone, nobody ever owns $(\\mathbf{B})\\wedge(\\mathbf{D})\\wedge(\\mathbf{H1})\\text{–}(\\mathbf{H3})\\Rightarrow(\\mathbf{F})$, and Step 1 here silently becomes an appeal to a claim no node carries. The fix is to lift (ii) and (iii) out from under the assumption.\n- **2026-08-06 — two findings [r2](critiques/r2.html) leaves for the lead-researcher, not chargeable to this write-up.** First, the node's `## Statement` uses $A_\\lambda$ and $E_{\\lambda,a}$ with no binding clause fixing the generating collection, although [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) insists the collection is a *choice* made stratum by stratum. Second, after [u1](updates/u1.html) deleted the second clause of **(A)**, the conclusion display no longer typechecks from this node's own hypotheses read as bare assertions: $\\Delta_{\\lambda,a}\\in\\mathcal{D}_c(K\\backslash LX)$ is now derived through [Q2-L8-L1](Q2-L8-L1/index.html)(i) and (ii). That is not a refutation — it is the obligation having moved into the decomposition rather than dissolved, which is what [u1](updates/u1.html) said would happen.\n- **2026-08-06 — literature examined** by `/examples Q2-L8`, verdict `EVIDENCE: gap`, recorded in [examples.md](examples.html). Nothing in print states the conclusion for $\\mathcal{D}_c(K\\backslash LX)$ with $X$ a general smooth affine spherical variety, and — the more informative half — **no source assumes anything like (D)**. Quillen's localization theorem (LNM 341, Thm. 5, p. 113) is the conclusion in the abelian setting, where the analogue of **(D)** is a *theorem* forced by the subcategory being Serre rather than a hypothesis; Thomason's classification of dense triangulated subcategories, read through Orlov (arXiv:0901.1859, Thm. 4.1), matches **(E)** exactly and entails that it is independent, being the published form of the retract mechanism [u1](updates/u1.html) found by hand. `chenyi_2025singularitiesorbitclosuresloop` is the natural home for a $K_0$ statement here and carries none.\n- **2026-08-06 — which clauses nothing in print touches.** Two. The **stratum-support notion** $\\mathrm{supp}_\\Lambda$, defined by non-vanishing of the $!$-costalk, appears nowhere in this form positively — the only literature bearing on it is the identity that breaks it. And **(B)**, finite stratum support for every coherent object, is discharged by hand from the ind-presentation in the instances and by no citation at all. Every stratification argument located instead inducts on the number of strata in a *closed* set, where the peeling triangle's third term is allowed to acquire new strata — which is exactly what **(D)** forbids.\n- **2026-08-06 — the referral: (D) fails in the group case**, so the node is not false but its hypotheses are satisfied only where the closure order is trivial. Take $\\lambda$ with non-empty boundary and $\\mathcal{F} = \\overline{i}_{\\lambda*}j_{\\lambda*}\\omega_{K\\backslash LX_\\lambda}$. The recollement identity $i^!j_* = 0$ gives $\\mathrm{supp}_\\Lambda(\\mathcal{F}) = \\{\\lambda\\}$, so $\\lambda$ is maximal in it; **(D)** then forces $\\mathrm{supp}_\\Lambda(\\mathcal{F}') = \\varnothing$, hence $\\mathcal{F}' = 0$ by the joint conservativity **(H2)**–**(H3)** supply, hence $j_{\\lambda!}\\omega\\simeq j_{\\lambda*}\\omega$ — *cleanness*, which is exceptional and not generic. This is a referral and not a refutation: only a critic round or the user's `human:` field can act on it. It does **not** reach [Q2-L8-L1](Q2-L8-L1/index.html), whose **(F)** permits exactly the filtration $j_{\\lambda!}\\omega\\rightarrow j_{\\lambda*}\\omega\\rightarrow(\\text{boundary})$ that **(D)** forbids — so the conclusion stays believable and the decomposition is the route that survives.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
