<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L8</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q2-L8, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L8/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee report on [proof.md](../proof.html) against the `## Statement` of [Q2-L8_node.md](../index.html).\n\n**Statement diff.** The `## Lemma` section reproduces the node's `## Statement` character for character: the heading paragraph with all five of its links, the $\\mathrm{supp}_\\Lambda$ display, hypotheses **(A)**–**(E)** with their two displays, and the concluding display. Same link targets, same `\\smallsetminus`, same $\\neq 0$ (rather than $\\not\\simeq 0$) in the definition of the support. No hypothesis added, none weakened, no conclusion trimmed, no renotation. There is no `GAP:` marker anywhere.\n\n**Hallucination sweep.** No bib key and no `main.tex` `\\label` is cited in the write-up, so nothing can be invented there. Every appendix anchor resolves against `blueprint/appendix.md`: `#not-standard-objects` (line 631), `#defn-coherent-d-mod` (684), `#def-renormalized` (692), `#def-orbits-iwahori-spherical` (589), `#def-orbit-closure` (610), `#not-lambda-x-plus` (619). The non-appendix links resolve too: `../../main_dag.md#q2` hits the explicit `<a id=\"q2\"></a>` at `main_dag.md:262`, and both spellings of the Q1-L5 link (`../Q1-L5/…` at line 5, `../../nodes/Q1-L5/…` at line 10) land on the same real file. Clean.\n\n**Markdown and math.** Standard KaTeX only — no `\\cD`, `\\Sat`, `\\bs`, `\\IC`. Every assertion-sized formula is a `$$` block with blank lines either side. `\\smallsetminus`, `\\middle|` and `\\operatorname{Map}` are all in use elsewhere in the tree and pass the gate. The ambient subscripts required by [context](../../../../context.html) are carried where they matter: $=_{\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})}$ at Step 1, $\\simeq_{\\mathcal{D}_c(K\\backslash LX)}$ at Steps 5 and 6, and both mapping spaces at Step 2 name their category. No bare backticked appendix label outside a link (the two occurrences of `` `depends-on` `` are field names, not objects).\n\n## The five press points, adjudicated\n\n**1. The compact/coherent identification is correct, and its conclusion is independently in force.** $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})^\\omega = \\mathrm{Ind}(\\mathcal{D}_c(\\mathcal{Y}))^\\omega$ is the idempotent completion of $\\mathcal{D}_c(\\mathcal{Y})$, so equality with $\\mathcal{D}_c(\\mathcal{Y})$ does need the idempotent-completeness the draft supplies, and the draft is right to supply it rather than assume it — most write-ups elide exactly this. The draft has *not* fallen into the inverse of the \"coherent is not compact\" convention: it never claims $\\mathcal{D}_c(\\mathcal{Y}) = \\mathcal{D}(\\mathcal{Y})^\\omega$, only $\\mathcal{D}_c(\\mathcal{Y}) = \\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})^\\omega$, which is what [context](../../../../context.html) puts in force (\"$\\mathcal{D}_c$ is by construction the subcategory of compacts\" of $\\mathcal{D}^{\\mathrm{ren}}$). Both stacks are prestacks, so [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) and [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) apply at $\\mathcal{Y} = K\\backslash LX$ and at $\\mathcal{Y} = K\\backslash LX_\\lambda$ alike, and the draft's `notation:` bullet says so. This matters for severity below: because Step 1's *conclusion* is standing convention, everything the draft's re-derivation reaches for (Flaws 1–3) sits inside an argument the write-up did not have to give, and the load-bearing chain never actually leaves the declared world.\n\n**2. The induction is well-founded and (C) does terminate it.** The quantity is $n = \\#\\mathrm{supp}_\\Lambda(\\mathcal{F})$, a natural number by **(B)**, and **(D)**'s third term has $\\mathrm{supp}_\\Lambda(\\mathcal{F}')\\subseteq\\mathrm{supp}_\\Lambda(\\mathcal{F})\\smallsetminus\\{\\lambda\\}$, so $n$ strictly drops. The base case $n = 0$ is **(C)**, and without **(C)** it is not derivable from the rest — (C) is not redundant. The draft uses **maximal** and needs **maximal**: (D) is stated at a maximal $\\lambda$, which is the stratum open in the union of the support, which is the only place a $j_!j^! \\to \\mathrm{id} \\to i_*i^*$ triangle can be cut. A minimal element would be the wrong end and the draft does not ask for one.\n\n**3. $K_0$ additivity is applied to a fibre sequence in the right category, with the right sign.** **(D)** hands the sequence over *in* $\\mathcal{D}_c(K\\backslash LX)$, so no transfer of exactness is needed at Step 7, and $[\\mathcal{F}] = [i_{\\lambda!}i_\\lambda^!\\mathcal{F}] + [\\mathcal{F}']$ is the correct reading of $A\\to B\\to C \\Rightarrow [B] = [A] + [C]$.\n\n**4. (E) is applied to the right object and transported by a functor on the small categories.** Step 7 feeds Step 4 the object $\\mathcal{G} = i_\\lambda^!\\mathcal{F}$, which **(B)**'s second clause places in $\\mathcal{D}_c(K\\backslash LX_\\lambda)$ — so (E), an identity for the whole of that $K_0$, is applied to a class that genuinely lives there. The transport is by $K_0$ of the restricted $i_{\\lambda!}$ of Step 2, not by (A)'s statement about the individual $\\Delta_{\\lambda,a}$; the draft is explicit about this and its Caveat diagnoses correctly why the weaker route fails. The handedness is right throughout: (H1) makes $i_\\lambda^!$ the *right* adjoint and it is *its* continuity that is used, which is the correct direction for \"left adjoint preserves compacts\". I found no place where continuity of $i_{\\lambda!}$ — also granted by (H1) — is silently substituted.\n\n**5. The redundancy claim is correct, and is information for the lead-researcher.** Step 2 depends on (H1), Step 1, [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) and [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), and on nothing in **(A)**. So the chain \"(A) clause 1 $\\Rightarrow E_{\\lambda,a}\\in\\mathcal{D}_c(K\\backslash LX_\\lambda)\\Rightarrow \\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}\\in\\mathcal{D}_c(K\\backslash LX)$\" is not circular, and the second clause of **(A)** really is redundant *given the standing (H1)*. Two remarks for whoever acts on this. (i) The redundancy is conditional on (H1) and on Step 1, so deleting the clause moves an obligation from (A) into the framing rather than dissolving it. (ii) The corresponding clause of **(B)** — that $i_\\lambda^!\\mathcal{F}$ is coherent — is *not* redundant, and the draft correctly does not claim it is: (H1) gives $i_\\lambda^!$ a left adjoint, not a right one, so nothing in the declared world makes $i_\\lambda^!$ preserve compacts. If the statement is edited, (A) clause 2 may go and (B) clause 2 may not.\n\nThe flaws below are all MINOR. Three are closed-world reach, five are presentation; none touches the conclusion.\n\n**Flaw 1** [MINOR] — closed-world defect, not an error.\n\n<details><summary>(location: Step 1, \"it is a full subcategory of the presentable $\\mathcal{D}(\\mathcal{Y})$, where idempotents split\") · the finding</summary>\n\n[coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) licenses the *fullness* of $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ and nothing else; that $\\mathcal{D}(\\mathcal{Y})$ is presentable — for $\\mathcal{Y} = K\\backslash LX$, a quotient prestack of an infinite-type ind-scheme — is a statement about the ambient sheaf theory on these specific stacks, and the brief is explicit that \"standard\" is not a licence for such a statement. The fact is true and available, but from two entries this node does not declare: [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html) lands $\\mathcal{D}^!$ in $\\mathrm{DGCat}$, and [`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html) sets $\\mathrm{DGCat} := \\mathrm{LMod}_{\\mathrm{LMod}_k}(\\mathrm{Pr}^L)$, every object of which is presentable. *Three remedies, cheapest first:* (a) drop the whole re-derivation and cite the standing convention of [context](../../../../context.html) with [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), both already declared; (b) weaken the appeal to what is used — $\\mathcal{D}(\\mathcal{Y})$ is a limit of idempotent-complete categories, so idempotents split, no presentability needed; (c) ask the lead-researcher to add the two entries to `objects:`.\n\n</details>\n\n**Flaw 2** [MINOR] — closed-world defect.\n\n<details><summary>(location: the `notation:` bullet, \"$\\mathcal{C}^\\omega$ is the full subcategory of compact objects of $\\mathcal{C}$\") · the finding</summary>\n\nThis is verbatim the content of [compact objects](../../../../appendix/def-compact-objects.html), an existing appendix entry, and the draft re-coins it instead of linking it. The node does not declare it, yet compactness is load-bearing at Steps 1 and 2 (Step 2's \"commutes with filtered colimits\" *is* that entry's definition). Likewise the universal property of $\\mathrm{Ind}$ that Step 1 uses — that $\\mathcal{C}$ sits inside $\\mathrm{Ind}(\\mathcal{C})$ as compacts and every compact is a retract of one — is the subject of [compact generation](../../../../appendix/def-compactly-generated-category.html). Both the closed-world guardrail and \"objects are linked, never named\" want a link, and \"every fact is stored once\" wants the definition not restated. *Fix:* declare `def:compact_objects` in `objects:` and replace the bullet's first clause by a link. (Recorded as precedent: the same reach was graded MINOR at Q2-L1 r1, Flaw 4 — there it was unused, here it is used, but see press point 1 for why that does not escalate it.)\n\n</details>\n\n**Flaw 3** [MINOR] — This clause is where the retract-closure of $\\mathcal{D}_c(\\mathcal{Y})$ actually happens, and it is asserted flat.\n\n<details><summary>(location: Step 1, \"a retract of a finite complex with coherent cohomology is again one\") · the finding</summary>\n\nIt needs the test scheme $S$ to be of finite type — ratified reading 1 of [context](../../../../context.html), forced by [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html) — so that $\\mathcal{D}_S$ is Noetherian and the image of an idempotent endomorphism of a coherent cohomology module is again coherent; boundedness of the amplitude is then free. Without naming the finite-type reading the sentence is a claim about arbitrary dg-schemes, which is not what [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) says. *Fix:* one clause, \"the test schemes being of finite type, $\\mathcal{D}_S$ is Noetherian and a direct summand of a coherent module is coherent\".\n\n</details>\n\n**Flaw 4** [MINOR] — The justification establishes exactness of the *ambient* $i_{\\lambda!}$ on $\\mathcal{D}^{\\mathrm{ren}}$; what Step 4 needs is exactness of the *restriction* to the small categories, and that restriction is not a left adjoint between cocomplete categories.\n\n<details><summary>(location: Step 2, \"It is exact, being a left adjoint between stable categories\") · the finding</summary>\n\nThe transfer is one line — $\\mathcal{D}_c(\\mathcal{Y}) = \\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})^\\omega$ is closed under finite colimits, so cofibre sequences in $\\mathcal{D}_c$ are cofibre sequences in $\\mathcal{D}^{\\mathrm{ren}}$ and back — but the draft does not take it, and without it Step 4's \"the exact functor $i_{\\lambda!}$ induces a homomorphism $K_0(\\mathcal{D}_c(K\\backslash LX_\\lambda))\\to K_0(\\mathcal{D}_c(K\\backslash LX))$\" is asserted of a functor whose exactness has been checked elsewhere. (Step 7 is unaffected: **(D)** delivers its fibre sequence inside $\\mathcal{D}_c(K\\backslash LX)$ already.)\n\n</details>\n\n**Flaw 5** [MINOR] — The statement *declares* the order, $\\mu\\le\\lambda\\Leftrightarrow LX_\\mu\\subseteq\\overline{LX}_\\lambda$; the draft then borrows the word \"poset\" from [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html), which posits an abstract partial order and does not identify it with the declared relation.\n\n<details><summary>(location: Step 6, \"a finite nonempty subset of the poset $\\Lambda_X^+$ has a maximal element\") · the finding</summary>\n\nSince **(D)**'s \"maximal\" is read against the declared relation, antisymmetry is the property that has to hold, and it is not checked. It does hold, from entries already declared: $j_\\lambda$ is an open embedding ([Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)) and $\\overline{LX}_\\lambda$ is the closure of $LX_\\lambda$ ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html)), so $LX_\\lambda$ is open and dense in $\\overline{LX}_\\lambda$; two disjoint subsets cannot both be open and dense in the same nonempty space, so $\\overline{LX}_\\mu = \\overline{LX}_\\lambda$ forces $\\mu = \\lambda$. Reflexivity and transitivity are immediate. *Fix:* a parenthesis; no widening of `objects:` needed.\n\n</details>\n\n**Flaw 6** [MINOR] — The induction as executed is strong induction — the hypothesis is invoked at every value $\\le n-1$, not at $n-1$ — because **(D)** gives only a containment.\n\n<details><summary>(location: Step 7, \"Induct on $n = \\#\\mathrm{supp}_\\Lambda(\\mathcal{F})$ … has at most $n-1$ elements … by the inductive hypothesis\") · the finding</summary>\n\nSay \"by strong induction on $n$\", or state the inductive hypothesis as \"for all $\\mathcal{F}$ with $\\#\\mathrm{supp}_\\Lambda(\\mathcal{F}) < n$\".\n\n</details>\n\n**Flaw 7** [MINOR] — As an English sentence the heading is the error [context](../../../../context.html) names as one of the two conventions that silently break proofs.\n\n<details><summary>(location: Step 1 heading, \"the coherent objects are exactly the compact ones\") · the finding</summary>\n\nThe display underneath disambiguates it correctly, but under [ADR 0043](../../../../process/decisions/0043-a-proof-step-is-one-claim.html) a step heading *is* the claim, and a reader skimming headings reads a false one. *Fix:* \"the coherent objects are exactly the compacts **of $\\mathcal{D}^{\\mathrm{ren}}$**\". Relatedly, Step 1 attributes smallness of $\\mathcal{D}_c(\\mathcal{Y})$ to [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), which presupposes it in writing $\\mathrm{Ind}(-)$ rather than asserting it; \"as [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) presupposes in forming $\\mathrm{Ind}$\" would be the honest phrasing.\n\n</details>\n\n**Flaw 8** [MINOR] — Two spellings of the same target in one file.\n\n<details><summary>(location: the `uses:` bullet, `[Q1-L5](../../../Q2-L8/Q1-L5/Q1-L5_node.md)` versus line 10's `[Q1-L5](../../../nodes/Q1-L5/Q1-L5_node.md)`) · the finding</summary>\n\nBoth resolve, so nothing breaks; but line 10 is inside the verbatim copy of the node's `## Statement` and must not be touched, so the one to normalise is the `uses:` bullet.\n\nFor the record, and to the prover's credit: the Caveats section is accurate on both counts I was asked to test — the argument genuinely does not close on **(A)**–**(E)** alone, the missing ingredient is exactly the continuity of $i_\\lambda^!$ granted by **(H1)**, and the diagnosis of *why* (\"the relations witnessing (E) involve objects that (A) and (D) say nothing about\") is the right one. That is the honest report of a size question, not a hedge.\n\n</details>\n\nVERDICT: PASS\n";</script>
