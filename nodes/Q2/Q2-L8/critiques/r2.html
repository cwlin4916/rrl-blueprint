<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L8</a><i>›</i><span>r2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q2-L8, round 2</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L8/critiques/r2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee report on [proof.md](../proof.html) against the current `## Statement` of [Q2-L8_node.md](../index.html) — the statement as revised by [u1](../updates/u1.html), with **(A)** and **(B)** shortened, **(C)** deleted and the lettering left un-renumbered.\n\nRound [r1](r1.html) was against the superseded statement; its findings are re-checked below where they survive.\n\n## Statement diff\n\nThe `## Lemma` section (proof.md:10–40) reproduces the node's `## Statement` (Q2-L8_node.md:19–49) character for character. The heading paragraph carries all five parenthetical links with the same targets, including the long spelling `../../nodes/Q1-L5/Q1-L5_node.md`; the $\\mathrm{supp}_\\Lambda$ display, hypotheses **(A)**, **(B)**, **(D)**, **(E)** with their three displays, and the concluding display are identical, `\\smallsetminus` and $\\neq 0$ included.\n\nThe gap at **(C)** is preserved and no hypothesis has been silently reinstated from the old statement — in particular the deleted second clauses of **(A)** and **(B)** appear nowhere in the write-up, neither in the Lemma nor smuggled into a step.\n\nNo hypothesis added, none weakened, no conclusion trimmed, no renotation. There is no `GAP:` marker.\n\n## Hallucination sweep\n\nNo `refs.bib` key and no `main.tex` `\\label` is cited anywhere in the file, so nothing can be invented there. The one manuscript object invoked, $\\mathcal{D}^{\\mathrm{ren}}$, is reached through its appendix entry rather than by label, which is correct since [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) carries none.\n\nEvery appendix link resolves to a file that exists in the appendix **directory**: `not-standard-objects.md`, `defn-coherent-d-mod.md`, `def-renormalized.md`, `def-orbits-iwahori-spherical.md`, `not-lambda-x-plus.md`, `def-orbit-closure.md`, and `index.md`.\n\nThe node links resolve: `Q2-L8-L1/Q2-L8-L1_node.md`, `Q2-L8-L2/Q2-L8-L2_node.md`, both spellings of Q1-L5, `Q2-L8_node.md`, `../../context.md`, `../../main_dag.md`, and `../../main_dag.md#q2` against the explicit `<a id=\"q2\"></a>` at `main_dag.md:281`. Every object invoked is one of the six the node declares in `objects:`. Clean.\n\n## Closed world\n\nThis is where the write-up is a decisive improvement on the r1 draft.\n\nr1's sharpest finding — that the old Step 1 re-derived $\\mathcal{D}_c(\\mathcal{Y}) = \\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})^\\omega$ and in doing so reached for presentability of $\\mathcal{D}(\\mathcal{Y})$, for the compactness vocabulary of [compact objects](../../../../appendix/def-compact-objects.html) and for the $\\mathrm{Ind}$ universal property, none of them declared — is **fully resolved**. The word \"compact\" does not occur in the new write-up at all, and the identification is never needed, because the passage from the ambient $\\mathcal{D}^{\\mathrm{ren}}$ to the small $\\mathcal{D}_c$ has been outsourced to clause (i) of [Q2-L8-L1](../Q2-L8-L1/index.html).\n\nr1's Flaws 1, 2, 3 and 4 are gone with it, and Flaws 5 and 6 (antisymmetry of the closure order; strong versus ordinary induction) are gone because the induction itself has moved into the child.\n\nI found no step of the new write-up reaching outside the six declared entries, the two `depends-on` statements and the standing **(H1)**–**(H3)**; Step 4's group theory is the only non-cited mathematics and it is genuinely standard.\n\n## The press points, adjudicated\n\n**Circularity: none at this level.** Step 1 obtains **(F)** from clause (ii); Steps 2 and 5 consume clause (i), whose hypothesis is **(F)**. Both clauses are asserted by the same child, so the write-up is chaining two independently asserted implications, not proving one from the other.\n\nNothing Step 1 uses to reach **(F)** — **(B)**, **(D)**, **(H1)**–**(H3)** — mentions clause (i). I note for the record that **(F)** *presupposes* part of clause (i) at the particular objects $\\mathcal{G}_k$, since it requires each $i_{\\lambda_k!}\\mathcal{G}_k$ to be a cofibre **in** $\\mathcal{D}_c(K\\backslash LX)$.\n\nThat is a containment at named objects, strictly weaker than clause (i)'s \"restricts to an exact functor\" for all of $\\mathcal{D}_c(K\\backslash LX_\\lambda)$, so no loop.\n\n**Scope of clause (i): within bounds.** Clause (i) says \"Each $i_{\\lambda!}$ restricts…\", which is a universally quantified statement over $\\lambda\\in\\Lambda_X^+$; Step 2 takes it at an arbitrary fixed $\\lambda$ and Step 4 uses it at every $\\lambda$.\n\nSplitting clause (i) into its two conjuncts and consuming them at Steps 2 and 5 respectively is legitimate — both conjuncts are asserted under the same hypothesis, which Step 1 has supplied once and for all.\n\n**Step 3 and the two $i_{\\lambda!}$'s: licensed, not assumed.** This was worth pressing and the write-up survives it. Clause (i)'s verb is \"*restricts to*\", and its subject $i_{\\lambda!}$ is the ambient left adjoint named in Q2-L8-L1's own heading paragraph — the one of hypothesis **(H1)**, on $\\mathcal{D}^{\\mathrm{ren}}$.\n\n\"$f$ restricts to $g$\" asserts $g = f|$, so the restricted functor *is* the ambient one on the subcategory, and the identification Step 3 needs is exactly what clause (i) says rather than something the write-up helps itself to.\n\nThe only implicit ingredient is\n\n$$\n\\mathcal{D}_c(\\mathcal{Y})\\subseteq\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) = \\mathrm{Ind}\\,\\mathcal{D}_c(\\mathcal{Y}),\n$$\n\nwhich is the Yoneda embedding and needs no citation. Step 4's chain then correctly cites Step 3 for the one link that carries the identification, $\\left[i_{\\lambda!}E_{\\lambda,a}\\right] = \\left[\\Delta_{\\lambda,a}\\right]$.\n\n**Step 4's group theory: correct, and correct at infinite $A_\\lambda$.** For a homomorphism $f\\colon A\\rightarrow B$ of abelian groups and $A = \\sum_{i}\\mathbb{Z}a_i$ a sum of cyclic subgroups,\n\n$$\n\\mathrm{im}(f) = \\sum_i\\mathbb{Z}f(a_i).\n$$\n\nEvery element of $A$ is a *finite* combination $\\sum n_ia_i$, giving $\\subseteq$, and each $f(a_i)$ lies in the image, giving $\\supseteq$.\n\nNo finiteness of the index set is used and none is needed. **(E)** being an identity for the whole of $K_0\\left(\\mathcal{D}_c(K\\backslash LX_\\lambda)\\right)$ is precisely what makes $\\{[E_{\\lambda,a}]\\}$ a generating family of the *source*, which is the hypothesis the fact wants.\n\n**The infinite index set: no hidden finiteness.** $\\sum_{\\lambda\\in\\Lambda_X^+}$ in Step 5 and $\\sum_{\\lambda}\\sum_{a}$ in Step 6 are sums of subgroups of the fixed group $K_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)$, whose elements are finite sums by definition. Step 6's substitution is the trivial fact that $S_\\lambda = T_\\lambda$ for all $\\lambda$ gives $\\sum_\\lambda S_\\lambda = \\sum_\\lambda T_\\lambda$.\n\nThe degenerate cases behave: if $A_\\lambda = \\varnothing$ then **(E)** forces $K_0\\left(\\mathcal{D}_c(K\\backslash LX_\\lambda)\\right) = 0$ and Step 4 returns $0 = 0$.\n\n**Hypothesis (A) is genuinely inert, and genuinely not derivable.** The Caveat's claim survives inspection. **(A)** enters at exactly two places, Step 3 (\"places $E_{\\lambda,a}$ in the source\") and Step 4 (\"each $[E_{\\lambda,a}]$ is a class\"), and both are typechecking: no relation in either Grothendieck group is derived from it.\n\nNor is it redundant in the way **(A)**'s deleted second clause was — a generating collection is by [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) a family of objects of the *renormalized* category, and nothing in the Q2 framing, in **(H1)**–**(H3)** or in the two children makes such an object coherent.\n\nSo **(A)** is load-bearing for well-posedness and for nothing else, which is what the write-up says.\n\n**Q2-L8-L2 really is unused.** No step invokes hypothesis **(P)**, the presentation $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)$, the index set $\\mathrm{Irr}\\,\\pi_0(G_\\lambda)$, or the *existence* of a spanning collection.\n\n**(E)** is quantified over $\\lambda$ as a hypothesis of this node and is consumed as such at Step 4, and at no point does the argument need to know that some collection satisfying **(E)** can be found. The closing disclosure is honest and matches what the steps do.\n\n## Flaws\n\n**Flaw 1** [MINOR] — The unconditional reading of clause (ii) of [Q2-L8-L1](../Q2-L8-L1/index.html) is, in my judgement, **forced** — so this is not a case of using a child for more than it says — but the write-up's defence of it stops short of the decisive argument, and the underlying defect in the child's typesetting should be recorded and fixed.\n\n<details><summary>(location: Step 1 and the first Caveat, \"The reading of clause (ii) this uses is recorded in the first Caveat\") · the finding</summary>\n\nThe decisive argument the write-up does not make: clause **(iii)** of Q2-L8-L1 is not a mathematical proposition at all. \"Property **(F)** is *not asserted to* imply either **(B)** or **(D)**\" is a statement about what the node asserts, and under the parse in which \"Assume **(F)**. Then:\" distributes over the list, clause (iii) would read \"**(F)** implies that it is not asserted that **(F)** implies **(B)**\", which is not a proposition with a truth value.\n\nThe list under \"Then:\" therefore *demonstrably* mixes a theorem, (i), with structural clauses that are outside the scope of the assumption; once that is established for (iii), reading its neighbour (ii) — whose subject is another node's hypotheses and whose title is likewise metatextual — as also outside the scope is not charity but grammar.\n\nTwo further supports the write-up could have cited and did not: the parent's own `## Decomposition` paragraph (Q2-L8_node.md:59) states flatly that \"clause (ii) of [Q2-L8-L1] records that **(B)** and **(D)** imply the filtration property\", and the history entry of 2026-08-06 says the child \"states that those two imply it\".\n\nWhat is nonetheless wrong, and belongs to `/update Q2-L8-L1` rather than to this prover: the child's statement is typeset so that its grammar says the opposite of what every other document in the tree says it means. The hazard is concrete and not stylistic.\n\nIf a later prover of Q2-L8-L1 reads clause (ii) as scoped, that prover is discharged by proving (i) alone under **(F)**; nobody is ever on the hook for $(\\mathbf{B})\\wedge(\\mathbf{D})\\wedge(\\mathbf{H1}\\text{–}\\mathbf{H3})\\Rightarrow(\\mathbf{F})$, and Step 1 here silently becomes an appeal to a claim no node owns.\n\n*Fix:* lift (ii) and (iii) out from under \"Assume **(F)**\" in Q2-L8-L1's `## Statement` — for instance by making (ii) read \"**(ii)** *(unconditionally, without assuming (F))* Hypotheses **(B)** and **(D)** of Q2-L8, together with …, imply **(F)** …\".\n\n</details>\n\n**Flaw 2** [MINOR] — False as written, and false in the direction that flatters the argument.\n\n<details><summary>(location: first Caveat, final sentence, \"No step after Step 1 depends on the reading\") · the finding</summary>\n\nSteps 2 and 5 invoke clause (i), whose hypothesis **(F)** is supplied by Step 1 and by nothing else; Step 6 substitutes their outputs.\n\nSo *every* step after Step 1 depends on the reading, transitively, and if the reading were wrong the write-up would establish nothing at all. The true sentence — \"no step after Step 1 cites clause (ii) again\" — is worth almost nothing, since the question is not how often the reading is used but how much rests on it.\n\nA Caveat that flags a contested reading and then understates its reach is doing half the job. *Fix:* say instead that Step 1 is the argument's single point of contact with clause (ii) and that the whole deduction stands or falls with the reading.\n\n</details>\n\n**Flaw 3** [MINOR] — Two spellings of the same target in one file, re-raised: this is [r1](r1.html) Flaw 8 verbatim, and r1 said which one to normalise (\"line 10 is inside the verbatim copy of the node's `## Statement` and must not be touched, so the one to normalise is the `uses:` bullet\").\n\n<details><summary>(location: `uses:` bullet and Step 1, `[Q1-L5](../../../Q2-L8/Q1-L5/Q1-L5_node.md)`, against line 10's `[Q1-L5](../../../nodes/Q1-L5/Q1-L5_node.md)`) · the finding</summary>\n\nThe new draft has moved the occurrences around but not fixed the inconsistency, and has added a third occurrence at Step 1 in the short spelling. Both resolve, so nothing breaks; a flaw a referee already located and gave the fix for should not survive a fresh write-up.\n\n</details>\n\n**Flaw 4** [MINOR] — Clause (i) of Q2-L8-L1 does not *assert* smallness and stability of $\\mathcal{D}_c(K\\backslash LX_\\lambda)$ and $\\mathcal{D}_c(K\\backslash LX)$; it presupposes them, in saying \"exact functor\" and in naming $K_0$ of each.\n\n<details><summary>(location: Step 2 heading, \"**between small stable $\\infty$-categories**\") · the finding</summary>\n\nSo does this node's own opening sentence, which fixes $K_0(-)$ on small stable $\\infty$-categories and then applies it to both.\n\nThe property is therefore in force, and nothing is wrong with the mathematics — but Step 2 presents it as part of what clause (i) states, which is the same habit r1 flagged at Flaw 7 (attributing to [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) a smallness it presupposes rather than asserts).\n\n*Fix:* \"which clause (i) presupposes in naming $K_0$ of each, as this node's own opening sentence does\".\n\n</details>\n\n**Flaw 5** [MINOR] — \"every standard object lies in $\\mathcal{D}_c(K\\backslash LX)$, **so** each $\\left[\\Delta_{\\lambda,a}\\right]$ is a class in $K_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)$\" is two assertions in one heading, against [ADR 0043](../../../../process/decisions/0043-a-proof-step-is-one-claim.html)'s rule that a step heading is one claim.\n\n<details><summary>(location: Step 3 heading) · the finding</summary>\n\nThe second is an immediate restatement of the first, so this is at the mild end; but the heading is what a reader skimming the argument sees, and the step's body proves only the first.\n\n</details>\n\n**Flaw 6** [MINOR] — An equality of two objects of a common ambient with no ambient named as a subscript, against rule 3 of the `## Notation` section of [context](../../../../context.html) (\"for two objects, the category they live in\").\n\n<details><summary>(location: Step 3, \"$\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$\") · the finding</summary>\n\nNeither of the two stated exemptions applies: the ambient $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ is not one of the two sides, and the two sides do share it.\n\nMitigating, and the reason this is at the bottom of the list: the sentence names the ambient in prose immediately afterwards (\"formed with the ambient $i_{\\lambda!}$ on $\\mathcal{D}^{\\mathrm{ren}}$\"), and the appendix entry the equality is quoted from writes it as `:=` with a separate $\\in$ rather than with a subscript. Note that the r1 draft did carry subscripted equivalences at its Steps 5 and 6; the new draft carries none anywhere.\n\nEverything else in the file is compliant — no generation bracket, no mapping space, and the $K_0$ identities are equalities of subgroups of an abelian group rather than of subcategories, which the convention does not reach.\n\n</details>\n\n**Flaw 7** [MINOR] — The bullet omits [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html), which the file does link, at line 10, where the closure order is declared.\n\n<details><summary>(location: `uses:` bullet) · the finding</summary>\n\nDefensible — the proof body never uses the order, since the induction moved into the child — but the bullet is the file's own account of what it invokes and the entry is invoked on the page.\n\n</details>\n\n## Two findings for the lead-researcher, not chargeable to this write-up\n\n**(a) The node's `## Statement` binds no generating collection.** It uses $A_\\lambda$ in **(A)**, in **(E)** and in the conclusion, and $E_{\\lambda,a}$ in **(A)** and **(E)**, without ever introducing them; the reader is sent to [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html), whose own note says in terms that the collection \"is a **choice**\" and that \"$A_\\lambda$, the objects $E_{\\lambda,a}$ and hence the standard objects $\\Delta_{\\lambda,a}$ all depend on a choice made stratum by stratum\". So the statement's quantifier over that choice is implicit.\n\nThe only consistent reading — one collection fixed once, the same in **(A)**, in **(E)** and in $\\Delta_{\\lambda,a}$ — is the one the write-up uses, and it is the right one, but the statement should bind it, as [Q2-L8-L2](../Q2-L8-L2/index.html) does in its own opening sentence. The write-up is correct to copy the statement verbatim rather than repair it.\n\n**(b) The conclusion's well-posedness is now contingent on an unproved child.** [u1](../updates/u1.html) deleted the clause of **(A)** asserting $\\Delta_{\\lambda,a}\\in\\mathcal{D}_c(K\\backslash LX)$, on the ground that it is derivable. It is — but the derivation now available runs through clause (i) of Q2-L8-L1, whose hypothesis **(F)** comes from clause (ii), i.e. through **(B)** and **(D)**.\n\nConsequently the concluding display of Q2-L8 does not typecheck from **(A)**, **(B)**, **(D)**, **(E)** read as bare assertions: the subgroup $\\sum_{\\lambda}\\sum_a\\mathbb{Z}\\left[\\Delta_{\\lambda,a}\\right]$ of $K_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)$ is only defined once the derivation has been run.\n\nThis is not a refutation — the hypotheses do deliver the containment, so the statement is true and provable as written — but it is a real change in the character of the node, and it means the u1 deletion moved an obligation into [Q2-L8-L1](../Q2-L8-L1/index.html) rather than dissolving it, exactly as r1's rider predicted for the parallel case.\n\n## Summary\n\nSeven flaws, all MINOR, none touching the conclusion. The argument establishes the claim within the declared closed world: the statement diff is exact, the closed-world reach that r1 found is gone, no citation, label or anchor is invented, the two children are used strictly inside their scope with the unused one disclosed, and the one contested reading is both disclosed and correct.\n\nThe two items above are information for the lead-researcher, not defects of the write-up. The single thing I would want changed before this node is leaned on: the scoping of clause (ii) in [Q2-L8-L1](../Q2-L8-L1/index.html)'s statement, so that the child's grammar commits its prover to what Step 1 here consumes.\n\nVERDICT: PASS\n";</script>
