says why.\n- **notation:** **(F)** is the finite standard filtration property assumed by [Q2-L8-L1](Q2-L8-L1/index.html), and $K_0(i_{\\lambda!})$ is the map on Grothendieck groups that clause (i) of that node names.\n\n## Lemma\n\nWrite $K_0(-)$ for the Grothendieck group of a small stable $\\infty$-category, let $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ be the locally closed embeddings of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) indexed by $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), and let $i_\\lambda^!$ and its left adjoint $i_{\\lambda!}$ be as in hypothesis **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html), which the [Q2](../../../dag.html) framing puts in force. Order $\\Lambda_X^+$ by $\\mu\\le\\lambda\\Leftrightarrow LX_\\mu\\subseteq\\overline{LX}_\\lambda$ ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)), and for $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash LX)$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) call\n\n$$\n\\mathrm{supp}_\\Lambda(\\mathcal{F}) := \\left\\{\\lambda\\in\\Lambda_X^+\\ \\middle|\\ i_\\lambda^!\\mathcal{F}\\neq 0\\right\\}\n$$\n\nits *stratum support*. Assume:\n\n**(A) Coherent stratum generators.** For every $\\lambda\\in\\Lambda_X^+$ and every $a\\in A_\\lambda$ the generator $E_{\\lambda,a}$ of [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) lies in $\\mathcal{D}_c(K\\backslash LX_\\lambda)$.\n\n**(B) Finite stratum support.** For every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash LX)$ the set $\\mathrm{supp}_\\Lambda(\\mathcal{F})$ is finite.\n\n**(D) Peeling off a maximal stratum.** For every nonzero $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash LX)$ and every $\\lambda$ maximal in $\\mathrm{supp}_\\Lambda(\\mathcal{F})$ there is a fibre sequence\n\n$$\ni_{\\lambda!}\\,i_\\lambda^!\\mathcal{F}\\ \\longrightarrow\\ \\mathcal{F}\\ \\longrightarrow\\ \\mathcal{F}'\n$$\n\nin $\\mathcal{D}_c(K\\backslash LX)$ whose third term satisfies $\\mathrm{supp}_\\Lambda(\\mathcal{F}')\\subseteq\\mathrm{supp}_\\Lambda(\\mathcal{F})\\smallsetminus\\{\\lambda\\}$.\n\n**(E) Stratum classes are integral combinations of the generators.** For every $\\lambda\\in\\Lambda_X^+$,\n\n$$\nK_0\\left(\\mathcal{D}_c(K\\backslash LX_\\lambda)\\right) = \\sum_{a\\in A_\\lambda}\\mathbb{Z}\\left[E_{\\lambda,a}\\right].\n$$\n\nThen the classes of the standard objects span the whole Grothendieck group:\n\n$$\nK_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right) = \\sum_{\\lambda\\in\\Lambda_X^+}\\ \\sum_{a\\in A_\\lambda}\\mathbb{Z}\\left[\\Delta_{\\lambda,a}\\right].\n$$\n\n## Proof\n\n**Step 1 — the finite standard filtration property (F) holds.**\n\n<details><summary>the argument</summary>\n\nClause (ii) of [Q2-L8-L1](Q2-L8-L1/index.html) asserts that **(B)** and **(D)** of this node, together with **(H1)**–**(H3)** of [Q1-L5](../../Q1/Q1-L5/index.html), imply **(F)**. Both **(B)** and **(D)** are hypotheses here, and the [Q2](../../../dag.html) framing puts **(H1)**–**(H3)** in force throughout Q2.\n\nThe reading of clause (ii) this uses is recorded in the first Caveat.\n\n</details>\n\n**Step 2 — for every $\\lambda\\in\\Lambda_X^+$ the functor $i_{\\lambda!}$ restricts to an exact functor between small stable $\\infty$-categories.**\n\n<details><summary>the argument</summary>\n\n\n\n$$\ni_{\\lambda!}\\colon\\ \\mathcal{D}_c\\left(K\\backslash LX_\\lambda\\right)\\ \\longrightarrow\\ \\mathcal{D}_c\\left(K\\backslash LX\\right)\n$$\n\nThis is the first assertion of clause (i) of [Q2-L8-L1](Q2-L8-L1/index.html), whose hypothesis **(F)** is supplied by Step 1. That clause names $K_0(i_{\\lambda!})$ for the homomorphism this exact functor induces on Grothendieck groups.\n\n</details>\n\n**Step 3 — every standard object lies in $\\mathcal{D}_c(K\\backslash LX)$, so each $\\left[\\Delta_{\\lambda,a}\\right]$ is a class in $K_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)$.**\n\n<details><summary>the argument</summary>\n\nHypothesis **(A)** places $E_{\\lambda,a}$ in the source of Step 2's functor.\n\nBy [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) the standard object is $\\Delta_{\\lambda,a}=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}i_{\\lambda!}E_{\\lambda,a}$, formed with the ambient $i_{\\lambda!}$ on $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) of which Step 2's functor is a restriction; so $\\Delta_{\\lambda,a}$ is that functor's value at $E_{\\lambda,a}$, and lies in its target.\n\n</details>\n\n**Step 4 — for every $\\lambda\\in\\Lambda_X^+$ the image of $K_0(i_{\\lambda!})$ is spanned by the standard classes:**\n\n<details><summary>the argument</summary>\n\n\n\n$$\n\\mathrm{im}\\left(K_0(i_{\\lambda!})\\right)\\ =\\ \\sum_{a\\in A_\\lambda}\\mathbb{Z}\\left[\\Delta_{\\lambda,a}\\right].\n$$\n\nBy **(A)** each $\\left[E_{\\lambda,a}\\right]$ is a class in $K_0\\left(\\mathcal{D}_c(K\\backslash LX_\\lambda)\\right)$, and **(E)** says these classes generate that group. The image of a homomorphism of abelian groups is generated by the images of any generating family of its source, and $K_0(i_{\\lambda!})\\left[E_{\\lambda,a}\\right]=\\left[i_{\\lambda!}E_{\\lambda,a}\\right]=\\left[\\Delta_{\\lambda,a}\\right]$ by Step 3.\n\n</details>\n\n**Step 5 — the stratum classes span:**\n\n<details><summary>the argument</summary>\n\n\n\n$$\nK_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)\\ =\\ \\sum_{\\lambda\\in\\Lambda_X^+}\\mathrm{im}\\left(K_0(i_{\\lambda!})\\right).\n$$\n\nThis is the second assertion of clause (i) of [Q2-L8-L1](Q2-L8-L1/index.html), again with its hypothesis **(F)** supplied by Step 1.\n\n</details>\n\n**Step 6 — the conclusion.**\n\n<details><summary>the argument</summary>\n\nSubstituting the value of $\\mathrm{im}\\left(K_0(i_{\\lambda!})\\right)$ found in Step 4 into each summand of Step 5 gives\n\n$$\nK_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)\\ =\\ \\sum_{\\lambda\\in\\Lambda_X^+}\\ \\sum_{a\\in A_\\lambda}\\mathbb{Z}\\left[\\Delta_{\\lambda,a}\\right],\n$$\n\nwhich is the assertion of the Lemma. $\\square$\n\n</details>\n\n## Caveats\n\n**How clause (ii) of Q2-L8-L1 is read.** That node states its three clauses under \"Assume **(F)**\", and clause (ii) is an implication whose consequent is **(F)** itself; read as conditional on **(F)** it is vacuous.\n\nThe unconditional reading Step 1 takes is in fact forced, by clause (iii): \"**(F)** is not asserted to imply **(B)**\" is a statement about what that node asserts, so a parse distributing \"Assume **(F)**\" over the list would make it read \"**(F)** implies that it is not asserted that **(F)** implies **(B)**\", which has no truth value. The list under \"Then:\" therefore demonstrably mixes a theorem, (i), with clauses standing outside the scope of the assumption, and (ii) — whose subject is another node's hypotheses, and whose title is likewise metatextual — is one of them.\n\nStep 1 is this argument's single point of contact with clause (ii), and every later step depends on the reading transitively: Steps 2 and 5 invoke clause (i), whose hypothesis **(F)** Step 1 supplies and nothing else does, and Step 6 substitutes their outputs. The whole deduction stands or falls with the reading.\n\n**What hypothesis (A) does, and all it does.** It makes **(E)** and the conclusion well-posed, and is used for nothing else.\n\n$\\left[E_{\\lambda,a}\\right]$ is a class in $K_0\\left(\\mathcal{D}_c(K\\backslash LX_\\lambda)\\right)$ — so that the right side of **(E)** is a subgroup of its left — precisely because $E_{\\lambda,a}$ lies in that category; and $\\left[\\Delta_{\\lambda,a}\\right]$ is a class in $K_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)$ only because Step 2's functor accepts $E_{\\lambda,a}$. No relation in either group is derived from **(A)**.\n\n**Which assumed dependencies the argument used.** [Q2-L8-L1](Q2-L8-L1/index.html), status `open`, at clauses (i) and (ii). [Q2-L8-L2](Q2-L8-L2/index.html) is **not** used: **(E)** is a hypothesis of this node, and Q2-L8-L2 is what makes **(E)** attainable at a stratum satisfying its presentation hypothesis **(P)**, not something the deduction runs on.\n";</script>
