<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L8-L2</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L8-L2 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L8-L2 — history\n\n[Q2-L8-L2](index.html) · [Q2-L8](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose Q2-L8`, carrying the $K_0$ half of that node's remaining content: hypothesis **(E)** of [Q2-L8](../index.html) stated as a claim. [u1](../updates/u1.html) verified that **(E)** cannot be imported from the categorical generating property, and sharpened the reason beyond the one the node's earlier history recorded. It is not merely that generation is by arbitrary colimits ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html)): even after descending to the **thick** closure of a compact generator, the closure is taken under **retracts**, and a retract's class need not be an integral combination of the classes it split from. The witness verified there is $R = k\\times k$ with one stratum and $i_{\\lambda!} = i_\\lambda^! = \\mathrm{id}$ — a compact generator with the analogues of (A)–(D) all holding, $K_0(\\mathrm{Perf}\\,R)\\cong\\mathbb{Z}^2$, and $[R] = (1,1)$ spanning only the diagonal.\n- **2026-08-06 — why \"can be chosen\" is the load-bearing phrase, and why it is clause (iii).** The entry [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) is explicit that a generating collection is a choice made stratum by stratum, and [u1](../updates/u1.html)'s witness says the choice cannot be left free: the object $E = \\bigoplus_a E_{\\lambda,a}$ generates whatever the $E_{\\lambda,a}$ do, since a cocomplete stable subcategory contains the retracts of its objects, and its single class spans only the diagonal of a group of rank $\\#A_\\lambda$. Clause **(iii)** is that witness realised at a stratum rather than in the abstract, which is what makes the disconnected case of [Q2-e3-L2](../../Q2-e3/Q2-e3-L2/index.html) the place the obstruction has room to bite.\n- **2026-08-06 — why it is stated as a conditional, and how far the conditional reaches.** The commissioning note asked for a condition rather than an unconditional existence claim, and the condition chosen is **(P)**, the classifying-stack presentation — the same hypothesis [Q2-L2](../../Q2-L2/index.html) works under, and the only presentation of a stratum the record supplies. Under **(P)** the answer is affirmative and uniform, which is why clauses **(i)** and **(ii)** are stated in general rather than at selected $\\lambda$; where **(P)** fails the statement claims nothing, and that is where \"does a spanning collection always exist\" remains open.\n- **2026-08-06 — why (i) is stated separately although it is the case $\\pi_0(G_\\lambda) = 1$ of (ii).** It is the case the record already supports, and a prover should be able to close it first: [Q2-L2](../../Q2-L2/index.html)(i) supplies the single generator $E_\\lambda = \\omega$, and [Q2-e4-L5](../../Q2-e4/Q2-e4-L5/index.html)(2) computes $K_0\\left(\\mathcal{D}_c(K\\backslash LX_\\lambda)\\right)\\cong\\mathbb{Z}$ generated by $\\left[\\omega_{K\\backslash LX_\\lambda}\\right]$ at the odd strata of the rank-one member of its family — an instance of clause **(i)** already on disk. Stating the two separately grades the target instead of hiding the easy half inside the general one.\n- **2026-08-06 — the closed-world exposure, declared rather than hidden.** Clause **(ii)** rests on an identification of $\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)$ with modules over the skew group algebra of the component group over the cohomology of the identity component, and no entry of the [appendix](../../../../appendix/index.html) supplies it. That is the same exposure [Q2-L2](../../Q2-L2/index.html) already carries in its clauses (ii) and (iii), which is why this node lists that one in **depends-on:** rather than restating its content; a prover who cannot close the identification inside the declared world should return a `GAP` on clause **(ii)** and close clauses **(i)** and **(iii)**, not widen the appendix on its own authority.\n";</script>
