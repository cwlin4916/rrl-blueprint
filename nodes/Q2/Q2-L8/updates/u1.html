<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L8</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L8 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L8/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q2-L8](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-06 · **Operator:** `/update Q2-L8`, on an external verdict supplied by the user · **Status before:** `proved` · **Status after:** `open`\n\n## The defect, in one sentence\n\nThree of the node's five hypotheses are already supplied by the closed world it declares — the second clause of **(A)** and the second clause of **(B)** by hypothesis **(H1)** of [Q1-L5](../../../Q1/Q1-L5/index.html) together with **(D)**, and the whole of **(C)** by **(H2)** and **(H3)** — so the statement was assuming what it could derive, and a reader could not see that **(D)** is the only geometric obligation in it.\n\n## What was verified, refuted and left unverified\n\n**Verified — the second clause of (B) is redundant.** The passage's argument was recomputed and is correct. **(D)** places $i_{\\lambda!}i_\\lambda^!\\mathcal{F}$ in $\\mathcal{D}_c(K\\backslash LX)$, which Step 1 of [proof.md](../proof.html) identifies with $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^\\omega$, so that object is compact. Since **(H1)** makes $i_{\\lambda!}$ both fully faithful and continuous, for any filtered $\\{\\mathcal{G}_j\\}$\n\n$$\n\\operatorname{Map}\\left(i_\\lambda^!\\mathcal{F},\\varinjlim_j\\mathcal{G}_j\\right) \\simeq \\operatorname{Map}\\left(i_{\\lambda!}i_\\lambda^!\\mathcal{F},\\varinjlim_j i_{\\lambda!}\\mathcal{G}_j\\right) \\simeq \\varinjlim_j\\operatorname{Map}\\left(i_{\\lambda!}i_\\lambda^!\\mathcal{F},i_{\\lambda!}\\mathcal{G}_j\\right) \\simeq \\varinjlim_j\\operatorname{Map}\\left(i_\\lambda^!\\mathcal{F},\\mathcal{G}_j\\right),\n$$\n\nthe three steps being full faithfulness, continuity of $i_{\\lambda!}$ with compactness of $i_{\\lambda!}i_\\lambda^!\\mathcal{F}$, and full faithfulness again. So $i_\\lambda^!\\mathcal{F}$ is compact, hence coherent by Step 1 read at the stratum.\n\nThis yields coherence **only at a $\\lambda$ maximal in the support**, which is the only place [proof.md](../proof.html) ever used it: Step 7 feeds Step 4 the object $i_\\lambda^!\\mathcal{F}$ for exactly that $\\lambda$. The redundancy is therefore complete for this argument and would not be for one that restricted to an arbitrary stratum.\n\n**Verified — (C) is redundant in the Q2 closed world.** It is the \"Moreover\" clause of [Q1-L5](../../../Q1/Q1-L5/index.html) verbatim: if $i_\\lambda^!\\mathcal{F} = 0$ for every $\\lambda$ then, since $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$ whenever $LX_\\lambda\\subseteq\\overline{LX}_\\mu$, **(H3)** gives $\\overline{i}_\\mu^!\\mathcal{F} = 0$ for every $\\mu$ and **(H2)** gives $\\mathcal{F} = 0$. The [Q2](../../../../dag.html) framing puts **(H1)**–**(H3)** in force, and $\\mathcal{D}_c\\subseteq\\mathcal{D}^{\\mathrm{ren}}$ is fully faithful, so the conclusion transfers.\n\n**Verified — (E) is independent, and the obstruction is retracts.** The passage's counterexample was checked in full. Take $R = k\\times k$, one stratum, $i_{\\lambda!} = i_\\lambda^! = \\mathrm{id}$, $\\mathcal{D}_c = \\mathrm{Perf}(R)$, $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Mod}_R$, $E = R$. Then (A)–(D) all hold — the peeling triangle is $\\mathcal{F}\\xrightarrow{\\ \\mathrm{id}\\ }\\mathcal{F}\\rightarrow 0$ — while $K_0(\\mathrm{Perf}(R)) \\cong \\mathbb{Z}^2$, a finitely generated projective being a pair of finite-dimensional $k$-vector spaces, and $[R] = (1,1)$, so $\\mathbb{Z}[R] = \\mathbb{Z}(1,1)$ is a proper subgroup and the conclusion fails.\n\nThe sharpening is worth keeping: $R$ *is* a compact generator, so the failure is not that \"generation is by arbitrary colimits\". Even after descending from arbitrary colimits to the thick closure of a compact generator, the closure is taken under retracts, and a retract's class need not be an integral combination of the classes it was split from. That is the whole of why **(E)** cannot be imported from a generating collection.\n\n**Verified — (D) is stronger than the recollement counit triangle.** Applying $i_\\lambda^!$ to the triangle and using $i_\\lambda^!i_{\\lambda!}\\simeq\\mathrm{id}$ shows $i_\\lambda^!\\mathcal{F}' = 0$, so $\\lambda$ leaves the support for free. What is *not* free is the other half of the containment: for $\\mu\\notin\\mathrm{supp}_\\Lambda(\\mathcal{F})$ the triangle gives $i_\\mu^!\\mathcal{F}'\\simeq\\left(i_\\mu^!i_{\\lambda!}i_\\lambda^!\\mathcal{F}\\right)[1]$, and a $!$-extension has costalks on the boundary of its support, so nothing prevents a stratum below $\\lambda$ from *entering* the support of $\\mathcal{F}'$. **(D)** rules that out by fiat. It is the node's one geometric obligation and the reason the node does not yet answer \"for which $X$\".\n\n**Refuted — [r1](../critiques/r1.html)'s two riders.** Round r1 said \"(C) is not redundant\" and \"(B) clause 2 is not redundant, and if the statement is edited, (A) clause 2 may go and (B) clause 2 may not.\" Both are defensible *as quantified* — r1 asked what follows from (A)–(E) alone, and neither does — and both are wrong as guidance, because the node's closed world is not (A)–(E) alone: it is (A)–(E) together with the **(H1)**–**(H3)** the [Q2](../../../../dag.html) framing puts in force, which the node's own opening sentence invokes for **(H1)**. r1's stated reason for (B) — that \"(H1) gives $i_\\lambda^!$ a left adjoint, not a right one, so nothing in the declared world makes $i_\\lambda^!$ preserve compacts\" — is true and beside the point: the argument above never needs $i_\\lambda^!$ to preserve compacts, only to have compact value at the one object **(D)** hands it.\n\n**Unverified — the Step 1 wording complaint.** The passage asks that \"so its objects are compact there\" be rewritten, on the ground that it can be misread as saying every object of the Ind-category is compact. Read with its antecedent — \"its\" is $\\mathcal{D}_c(\\mathcal{Y})$'s — the sentence is correct as it stands, and $\\mathrm{Ind}(\\mathcal{A})^\\omega\\simeq\\mathrm{Idem}(\\mathcal{A})$ is what the next two sentences then establish. This is a presentation preference, not a defect, and no claim of the node turns on it. It is left for whoever next writes the proof.\n\n## What changed in the statement\n\n- **(A)** loses its second clause. $\\Delta_{\\lambda,a}\\in\\mathcal{D}_c(K\\backslash LX)$ is now derived, not assumed.\n- **(B)** loses its second clause. It asserts finiteness of the stratum support and nothing else.\n- **(C)** is **deleted**.\n- **(D)** and **(E)** are unchanged, in wording and in letter.\n\n**The letters were not renumbered.** (D) and (E) keep their names although (C) is gone, because [r1](../critiques/r1.html) names them and a critique is an append-only audit trail that is never rewritten, and [Q1-L3-c1](../../../Q1/Q1-L3/Q1-L3-c1/index.html) reaches this node from outside. A gap in the lettering is a smaller lie than a critique that discusses a hypothesis under a name the node has reassigned.\n\n## Why the status was reset\n\nThe new statement is strictly **stronger**: same conclusion, three fewer hypotheses. [proof.md](../proof.html) proves the old one, and it consumes exactly the clauses that were removed — Step 5 cites **(C)**, Step 7 cites **(B)**'s second clause, Step 3 cites **(A)**'s second — so it is not a proof of what the node now claims. `proved` would be false, and the status is `open`. The write-up and [r1](../critiques/r1.html) stay on disk as the record of how the node reached this state, and the next `/prove` continues at `r2`.\n\n## What was considered and not adopted\n\n**Restating the node in the passage's \"lean version\".** Its clause (2), *finite support for every coherent $\\mathcal{F}$*, is (B) as revised; its (1), (3), (4) are (A) as revised, (D) and (E). So the lean version and the revision above are the same statement, and adopting the passage's lettering would have renumbered the hypotheses for no gain.\n\n**Replacing (B) and (D) by the finite-standard-filtration property.** The passage's more conceptual alternative — every coherent object admits a finite filtration whose successive cofibres are $i_{\\lambda!}\\mathcal{G}_\\lambda$ with $\\mathcal{G}_\\lambda$ coherent on the stratum — is strictly more general than (B)+(D) and makes this node's conclusion immediate by additivity. It is *not* adopted here, because a hypothesis that makes the proof immediate has moved the difficulty rather than discharged it, and because §3 of [ADR 0019](../../../../process/decisions/0019-the-update-operator.html) says a strictly more general verified claim becomes its own node with the target left standing as a specialization. It is commissioned as a new node instead.\n\n**Deleting hypothesis (D).** Rejected. The verification above shows exactly why it cannot be derived from the counit triangle, and the whole geometric content of the node now sits in it.\n\n## Old statement, verbatim\n\nLink targets are rebased to this directory; the text is otherwise unchanged.\n\n> **(A) Coherence of the standard objects.** For every $\\lambda\\in\\Lambda_X^+$ and every $a\\in A_\\lambda$ the generator $E_{\\lambda,a}$ lies in $\\mathcal{D}_c(K\\backslash LX_\\lambda)$ and the standard object $\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$ of [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) lies in $\\mathcal{D}_c(K\\backslash LX)$.\n>\n> **(B) Finite stratum support.** For every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash LX)$ the set $\\mathrm{supp}_\\Lambda(\\mathcal{F})$ is finite, and $i_\\lambda^!\\mathcal{F}$ lies in $\\mathcal{D}_c(K\\backslash LX_\\lambda)$ for every $\\lambda\\in\\Lambda_X^+$.\n>\n> **(C) Joint conservativity.** If $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash LX)$ has $\\mathrm{supp}_\\Lambda(\\mathcal{F})=\\varnothing$, then $\\mathcal{F}\\simeq 0$.\n";</script>
