e.\n\n- **2026-08-07 — the bench came onto the page.** The twelve $X$ the literature settles were tabulated in the framing, so what the question is believed for is readable here instead of one directory away. The table points into [`key_examples.md`](../../key_examples/index.html) and is outside the closed world.\n\n- **2026-08-09 — the question became a node, and states its hypotheses in full.** Its framing moved here from `blueprint/main_dag.md` ([ADR 0084](../../process/decisions/0084-a-question-is-a-node.html)). **(H1)**, **(H2)** and **(H3)** are now written out in the Setting rather than cited as \"the package of [Q1-L5](../Q1/Q1-L5/index.html)\": a reader of this question can check which clause is standing without opening another question's node. [Q3](../Q3/index.html) remains the canonical statement of the three. A `## Pipeline` section was added, and `blueprint/priorities.md` was deleted in its favour ([ADR 0085](../../process/decisions/0085-the-pipeline-replaces-the-priority-panel.html)).\n- **2026-08-09 — the Problem statement now records what the sufficient conditions do not reach**, by `/update` run node-local under a claim on this question, from a user-supplied passage. [Q2-L5](Q2-L5/index.html) and [Q2-L6](Q2-L6/index.html) are the whole of what supplies hypothesis **(D)** of [Q2-L3](Q2-L3/index.html), and both terminate in a triangular lift of $\\omega_{K\\backslash LX_\\lambda}$ while **(D)** quantifies over every $a\\in A_\\lambda$ — so the chain answers the question only where $\\#A_\\lambda = 1$, and where a stabilizer is disconnected the remaining generators are out of reach of the mechanism rather than merely unproved, by [Q2-L2](Q2-L2/index.html)(ii). Both supply nodes had their conclusions corrected the same run ([Q2-L5 u1](Q2-L5/updates/u1.html), [Q2-L6 u2](Q2-L6/updates/u2.html)); this paragraph is the question-level consequence, and it had never been written down.\n- **2026-08-09 — and what a necessary condition would and would not buy.** The passage proposed that **(D)** is necessary, via $P_{\\lambda,a} := \\Delta_{\\lambda,a}$. Two of its three clauses are free that way; the third needs $i_\\mu^!i_{\\lambda!}E_{\\lambda,a}\\simeq 0$ for $\\mu\\not\\le\\lambda$, which no appendix entry supplies, so the converse is one missing fact away rather than immediate. The consequence is the part worth recording: granting that fact makes **(D)** *equivalent* to the membership, so it inherits the objection already standing against [Q2-L1](Q2-L1/index.html) — it reformulates the question instead of conditioning $X$ — and the geometric content of an answer must therefore live in a theorem **supplying** the lifts, never in the lift condition itself.\n- **2026-08-09 — two cautions added to the Conjecture, and the pipeline re-ranked.** The connectedness clause is what makes $\\#A_\\lambda = 1$, and whether it holds across the symmetric class is unknown here; *Bott–Samelson* names an expectation rather than a hypothesis, since [Q2-L5](Q2-L5/index.html) assumes neither smoothness of $Z_\\lambda$, nor birationality, nor point fibres. Rows 1 and 5 of the old pipeline were completed by this run and are replaced; the new ranking leads with `/decompose Q2-L5`, (FP) having landed as [$m_F$ is finitely presented](../../appendix/fp-convolution-morphism.html) and **(Coh)** being the one fact still owed there.\n";</script>
