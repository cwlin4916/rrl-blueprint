<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L2</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L2 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q2-L2 — Connected stabilizers: the dualizing object generates a stratum, disconnected ones do not\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html); the standing hypothesis **(H1)** and the generating-collection notation put in force by the **Setting.** block of the [Q2](../../../dag.html) framing. No `depends-on`.\n- **notation:** $\\pi_0(G_\\lambda)=G_\\lambda/G_\\lambda^\\circ$, finite as $G_\\lambda$ is of finite type; $D(\\mathrm{Rep}\\,\\mu_2)$ means bounded complexes of finite-dimensional $\\mu_2$-representations.\n\n## Lemma\n\nLet $\\lambda\\in\\Lambda_X^+$ and suppose the stratum is presented as a classifying stack of finite type: there is an equivalence\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\ \\simeq\\ \\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)\n$$\n\nfor an algebraic group $G_\\lambda$ of finite type over $k$, carrying $\\omega_{K\\backslash LX_\\lambda}$ to $\\omega_{BG_\\lambda}$ — the presentation [Q1-L4](../../Q1/Q1-L4/index.html) supplies, with $G_\\lambda = K_\\lambda/U_\\lambda$ its clause (ii) quotient of the stabilizer by the pro-unipotent radical, or equally the reductive $G_\\lambda^{\\mathrm{red}}$ of its clause (iii): the two have the same component group.\n\n**(i) Connected stabilizer quotient.** If $G_\\lambda$ is connected, then\n\n$$\n\\left\\langle \\omega_{K\\backslash LX_\\lambda}\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda),\n$$\n\nso the generating collection of [Q2-L1](../Q2-L1/index.html) may be taken to be the single object $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$, and the standard object of the stratum is $\\Delta_\\lambda = i_{\\lambda!}\\omega_{K\\backslash LX_\\lambda}$.\n\n**(ii) Disconnected stabilizer quotient: (i) fails.** Connectedness is load-bearing, and already at $G_\\lambda = \\mu_2$. There $\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)\\simeq\\mathrm{Ind}\\,D(\\mathrm{Rep}\\,\\mu_2)$, the dualizing object is the trivial representation up to shift, and\n\n$$\n\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)}\\left(\\omega_{B\\mu_2}[n],\\ \\mathrm{sgn}\\right) = 0\\qquad\\text{for every }n\\in\\mathbb{Z},\n$$\n\nsince $\\mathrm{Rep}\\,\\mu_2$ is semisimple in characteristic $0$ and the two characters are distinct. Hence $\\mathrm{sgn}\\neq 0$ is right-orthogonal to $\\omega_{B\\mu_2}$ in every shift, so $\\langle\\omega_{B\\mu_2}\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)}\\neq\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)$.\n\n**(iii) What replaces (i).** For general $G_\\lambda$ with identity component $G_\\lambda^\\circ$, a generating collection is obtained by taking one object $E_{\\lambda,a}$ for each isomorphism class $a$ of irreducible representations of the component group $\\pi_0(G_\\lambda)$, so $\\#A_\\lambda = \\#\\mathrm{Irr}\\,\\pi_0(G_\\lambda)$ suffices; $\\#A_\\lambda = 1$ exactly when $G_\\lambda$ is connected.\n\n## Proof\n\n**Step 1 — generation may be read on $BG_\\lambda$.**\n\n<details><summary>the argument</summary>\n\nThe hypothesis gives an equivalence\n\n$$\n\\Phi\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\xrightarrow{\\ \\sim\\ }\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda),\\qquad \\Phi\\left(\\omega_{K\\backslash LX_\\lambda}\\right)\\simeq\\omega_{BG_\\lambda},\n$$\n\n$LX_\\lambda$ the stratum of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). An equivalence preserves cocompleteness, stability and membership, so [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) gives $\\Phi\\langle S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\langle\\Phi S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)}$ for every $S$.\n\n</details>\n\n**Step 2 — it suffices to reach $\\mathcal{D}_c(BG_\\lambda)$.**\n\n<details><summary>the argument</summary>\n\nBy [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), $\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda) = \\mathrm{Ind}\\,\\mathcal{D}_c(BG_\\lambda)$, whose objects are filtered colimits of objects of $\\mathcal{D}_c(BG_\\lambda)$; a subcategory closed under small colimits and containing $\\mathcal{D}_c(BG_\\lambda)$ is therefore everything.\n\n</details>\n\n**Step 3 — the input the appendix does not supply.**\n\n<details><summary>the argument</summary>\n\n\n\n**GAP.** Steps 4, 6 and 9 need what this node's `objects:` field does not provide. For $H$ of finite type over $k$: **(a)** $\\mathcal{D}_c(BH)$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) carries a bounded $t$-structure whose heart is the finite-dimensional $k$-representations of $\\pi_0(H)$, with $\\omega_{BH}$ there up to shift as the trivial representation; **(b)** for $H$ finite, $\\mathcal{D}_c(BH)\\simeq D(\\mathrm{Rep}\\,H)$. An entry for $\\mathcal{D}$-modules on $BH$ — descent along $\\mathrm{pt}\\to BH$, strong equivariance on a point as $\\mathrm{Rep}\\,\\pi_0(H)$ — discharges it; Steps 4–10 are conditional on it alone.\n\n</details>\n\n**Step 4 — clause (i): connectedness makes the heart a sum of copies of $\\omega_{BG_\\lambda}$.**\n\n<details><summary>the argument</summary>\n\nConnectedness enters only as $\\pi_0(G_\\lambda)=1$: the heart of (a) is then finite-dimensional vector spaces, each a finite sum of copies of the unit $\\omega_{BG_\\lambda}$ up to the shift in (a). Boundedness makes each $\\mathcal{F}\\in\\mathcal{D}_c(BG_\\lambda)$ a finite iterated extension of shifts of its cohomology objects, so it lies in $\\langle\\omega_{BG_\\lambda}\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)}$, closed under shifts, cofibres and sums ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html)). Steps 2 and 1 give the display of (i).\n\n</details>\n\n**Step 5 — the collection and standard object of (i).**\n\n<details><summary>the argument</summary>\n\nIn the notation the **Setting.** block puts in force, a generating collection generates $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$; Step 4 exhibits $\\{\\omega_{K\\backslash LX_\\lambda}\\}$ as one, so $A_\\lambda$ may be a singleton with $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$. That notation sets $\\Delta_\\lambda = i_{\\lambda!}E_\\lambda$, the left adjoint $i_{\\lambda!}$ of $i_\\lambda^!$ being supplied by the framing's standing hypothesis **(H1)**.\n\n</details>\n\n**Step 6 — at $\\mu_2$ the category splits into two blocks.**\n\n<details><summary>the argument</summary>\n\nAs $\\mathrm{char}\\,k=0$ and $k$ is algebraically closed, $\\mu_2$ is diagonalizable with distinct characters $\\mathrm{triv},\\mathrm{sgn}$, so isotypic decomposition — the clause's semisimplicity — gives $\\mathrm{Rep}\\,\\mu_2\\simeq\\mathrm{Vect}^{\\mathrm{fd}}\\times\\mathrm{Vect}^{\\mathrm{fd}}$. With (b) and [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html),\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)\\ \\simeq\\ \\mathrm{Ind}\\,D(\\mathrm{Rep}\\,\\mu_2)\\ \\simeq\\ \\mathrm{Vect}\\times\\mathrm{Vect},\n$$\n\n$\\omega_{B\\mu_2}$ lying in the first factor up to shift by (a) and $\\mathrm{sgn}\\neq 0$ in the second.\n\n</details>\n\n**Step 7 — the orthogonality displayed in (ii).**\n\n<details><summary>the argument</summary>\n\nMapping spaces in a product are factorwise; $\\omega_{B\\mu_2}[n]$ has zero $\\mathrm{sgn}$-component for every $n\\in\\mathbb{Z}$, and $\\mathrm{sgn}$ zero $\\mathrm{triv}$-component, so $\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)}(\\omega_{B\\mu_2}[n],\\mathrm{sgn}) = 0$.\n\n</details>\n\n**Step 8 — clause (ii): the obstruction survives shifts and colimits.**\n\n<details><summary>the argument</summary>\n\nLet\n\n$$\np\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)\\ \\simeq\\ \\mathrm{Vect}\\times\\mathrm{Vect}\\ \\longrightarrow\\ \\mathrm{Vect}\n$$\n\nbe the projection to the $\\mathrm{sgn}$-factor. Colimits and finite limits in a product are factorwise, so $p$ is exact and preserves small colimits, and $\\{c\\mid p(c)\\simeq 0\\}$ is cocomplete stable and contains $\\omega_{B\\mu_2}$, hence contains $\\langle\\omega_{B\\mu_2}\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)}$ by minimality ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html)). It omits $\\mathrm{sgn}$, so $\\langle\\omega_{B\\mu_2}\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)}\\neq\\mathcal{D}^{\\mathrm{ren}}(B\\mu_2)$.\n\n</details>\n\n**Step 9 — clause (iii): the irreducibles of $\\pi_0(G_\\lambda)$ generate.**\n\n<details><summary>the argument</summary>\n\n$\\pi_0(G_\\lambda)$ is finite and $\\mathrm{char}\\,k=0$, so $k[\\pi_0(G_\\lambda)]$ is semisimple and every heart object of (a) is a finite sum of the irreducibles $E_{\\lambda,a}$, $a\\in\\mathrm{Irr}\\,\\pi_0(G_\\lambda)$. Boundedness then puts $\\mathcal{D}_c(BG_\\lambda)$ inside $\\langle E_{\\lambda,a}\\mid a\\in\\mathrm{Irr}\\,\\pi_0(G_\\lambda)\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)}$ as in Step 4; Steps 2 and 1 transport the collection to the stratum, with $\\#A_\\lambda = \\#\\mathrm{Irr}\\,\\pi_0(G_\\lambda)$.\n\n</details>\n\n**Step 10 — the \"exactly when\", both directions.**\n\n<details><summary>the argument</summary>\n\nIf $G_\\lambda$ is connected then $\\pi_0(G_\\lambda)$ is trivial, with only the trivial irreducible. Conversely the trivial representation is always irreducible, so a single class is that one, semisimplicity gives $k[\\pi_0(G_\\lambda)]\\simeq k$, and $\\#\\pi_0(G_\\lambda) = \\dim_k k[\\pi_0(G_\\lambda)] = 1$, i.e. $G_\\lambda = G_\\lambda^\\circ$. $\\blacksquare$\n\n</details>\n\n## Caveats\n\nStep 10's \"exactly when\" concerns the collection Step 9 constructs; it is no minimality claim over all generating collections.\n";</script>
