part of the Satake question. That is a defect in the present [Q1-L6](../../Q1/Q1-L6/index.html), and correcting it is `/update`'s business, not this node's — this node states the mathematics the correction would rest on.\n- **2026-08-05 — hypothesis stated abstractly, on purpose.** The presentation $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)$ is a hypothesis of the statement rather than a dependency on [Q1-L4](../../Q1/Q1-L4/index.html), so that Q2 carries no cross-question edge and the node is provable on its own terms. What [Q1-L4](../../Q1/Q1-L4/index.html) supplies, and what it does not, is the point: its clauses give a finite-type *reductive* quotient and assert nothing about $\\pi_0$, so the connectedness that clause (i) needs is not currently available anywhere in the tree.\n- **2026-08-05 — route recorded at creation.** For clause (i) the expected argument is the Drinfeld–Gaitsgory description of $\\mathcal{D}(BG_\\lambda)$ as modules over a free algebra $B_\\lambda$ which, for $G_\\lambda$ connected reductive, is exterior on finitely many generators: its augmentation ideal $I$ is then nilpotent, the filtration $B_\\lambda\\supset I\\supset I^2\\supset\\cdots$ has subquotients that are sums of shifts of the augmentation module, and so $B_\\lambda\\in\\langle k\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)}$. That source has no `refs.bib` key and no PDF in `papers/`, so it is named here as orientation and is not citable; a prover who wants it must first get it an appendix entry.\n- **2026-08-05 — statement corrected** by `/update` (full walk) ([u1](updates/u1.html)): the group this node works with was called \"the reductive quotient of the stabilizer by its pro-unipotent radical\", which names neither of the two groups [Q1-L4](../../Q1/Q1-L4/index.html) produces — its clause (ii) $G_\\lambda = K_\\lambda/U_\\lambda$ is the quotient by the pro-unipotent radical and need not be reductive, as [Q1-L4-e3](../../Q1/Q1-L4/Q1-L4-e3/index.html) exhibits with $G_\\mu = P_\\mu$; its clause (iii) $G_\\lambda^{\\mathrm{red}}$ is reductive and is a further quotient. The statement now names both and says they share a component group, which is why neither clause below it moves: $R_u$ is connected in characteristic $0$, so connectedness — the whole content of (i) and (ii) — cannot tell the two apart.\n- **2026-08-05 — commentary moved here from the [Q2](../../../dag.html) framing** by `/update`, under [ADR 0044](../../../process/decisions/0044-a-question-states-a-problem-not-its-route.html). *Connectedness is load-bearing in the Q2 conjecture.* It cannot be dropped: at $G_\\lambda = \\mu_2$ the dualizing object is right-orthogonal to the sign representation in every shift, so it does not generate the stratum and a correspondence with clean $\\omega$-costalk reaches only the trivial block — clause (ii) of this node, tested at $\\mathrm{GL}_2/\\mathrm{O}_2$ in [Q2-e3](../Q2-e3/index.html).\n";</script>
