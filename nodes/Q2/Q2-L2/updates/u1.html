hich is affine of finite type and **need not be reductive** — [Q1-L4-e3](../../../Q1/Q1-L4/Q1-L4-e3/index.html) exhibits $G_\\mu = P_\\mu$, a parabolic, and says so in its title — and clause (iii)'s $G_\\lambda^{\\mathrm{red}} = G_\\lambda/R_u(G_\\lambda)$, which is reductive but is *not* the quotient by the pro-unipotent radical alone. The phrase took the adjective from one and the construction from the other.\n\n**Old** (verbatim): `with $G_\\lambda$ the reductive quotient of the stabilizer by its pro-unipotent radical.`\n\n**New** (verbatim): `with $G_\\lambda = K_\\lambda/U_\\lambda$ its clause (ii) quotient of the stabilizer by the pro-unipotent radical, or equally the reductive $G_\\lambda^{\\mathrm{red}}$ of its clause (iii): the two have the same component group.`\n\n## Verified\n\n**The clauses below are insensitive to which of the two is meant, and that is why the error survived.** Clause (i) turns on connectedness of $G_\\lambda$ and clause (ii) exhibits a disconnected one; $R_u(G_\\lambda)$ is unipotent, hence connected in characteristic $0$, so quotienting by it leaves the component group alone and\n\n$$\n\\pi_0\\left(G_\\lambda\\right) \\;=\\; \\pi_0\\!\\left(G_\\lambda^{\\mathrm{red}}\\right).\n$$\n\nBoth readings therefore give the same answer to every question this node asks. The statement is corrected because a reader checking connectedness needs to know which group to look at, not because a conclusion moved.\n\n**The equivalence quoted is available in either reading.** Clause (iii) of [Q1-L4](../../../Q1/Q1-L4/index.html) is a chain $\\mathcal{D}_c(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}})$, so the hypothesis this node opens with is supplied at either end of it.\n\n## Refuted\n\nNothing else. Clause (ii)'s $\\mu_2$ computation was recomputed — $\\mathrm{Rep}\\,\\mu_2$ is semisimple in characteristic $0$ and the trivial and sign characters are distinct, so the dualizing object has no map to $\\mathrm{sgn}$ in any degree — and stands.\n\n## Considered and not adopted\n\n- **Writing the component-group identity into the statement.** It is the reason the two readings agree, and a reason is commentary: it belongs in the dated history entry, not in the claim ([I23](../../../../process/pipeline.html)).\n- **Splitting the node into a connected and a disconnected half.** Clause (ii) exists to show clause (i)'s hypothesis is load-bearing; separating them would leave (i) looking unconditional.\n";</script>
