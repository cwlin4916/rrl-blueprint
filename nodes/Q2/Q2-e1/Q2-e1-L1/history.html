ductive quotient $G_\\lambda$, so that $\\#A_\\lambda = 1$\" — under the specialisation $X = G$ acted on by $G\\times G$, where $\\Lambda_X^+$ is the dominant coweights and the strata are the $\\mathrm{Gr}_\\nu$. **What it does not reach:** the conjecture's symmetry hypothesis beyond the observation that $X = G$ satisfies it with $\\theta$ the swap; the conclusion of the conjecture, which is [Q2-e1-L3](../Q2-e1-L3/index.html)'s; and any evidence that connectedness holds for another $X$ — [Q2-L2](../../Q2-L2/index.html)(ii) is the record that it can fail.\n- **2026-08-06 — why it is a node and not a line of the parent**: the parent's clause (i) asserts three separately checkable things — the classifying-stack presentation of the stratum, connectedness of the stabilizer, and the identification of the finite-type reductive quotient with a Levi — and each is a claim a referee certifies on its own. Splitting them out is what [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html) opened the class for.\n";</script>
