ere both sides are independently known — under the specialisation $X = G$ acted on by $G\\times G$, where the costalk of the iterated Hecke translate along the open stratum is computed by [Q2-e1-L4](../Q2-e1-L4/index.html)(b). **What it does not reach:** the value of $n_0$ itself, which depends on the dimension theory of [the three standing hypotheses](../../../../appendix/assum-intro.html)(b) and which no single stratum determines.\n- **2026-08-06 — the finding clause (d) records**: the parent says the group case pins the identification, and what it pins is that the integer in [Q2-L5](../../Q2-L5/index.html)'s hypothesis **(b)** and the integer in its conclusion are not the same integer — they differ by $n_0 - 2\\langle 2\\rho,\\nu\\rangle$, a correction that varies with the stratum. Stated here as part of the instance, where it belongs; whether [Q2-L5](../../Q2-L5/index.html)'s own statement should carry the correction is a question for `/update` and not for this run, which may not touch another node's statement.\n";</script>
