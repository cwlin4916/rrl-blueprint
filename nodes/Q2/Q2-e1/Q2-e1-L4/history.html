s two unimported identifications — under the specialisation $X = G$ acted on by $G\\times G$, where $L^+X = L^+G$, $Z_\\nu$ is the ordinary convolution space and $\\pi_\\nu$ is the convolution morphism of [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html). **What it does not reach:** the normalizing shift, which is [Q2-e1-L5](../Q2-e1-L5/index.html)'s; and the existence of such a $\\pi_\\lambda$ for any $X$ other than the group case, which is the content of [Q2-L6](../../Q2-L6/index.html) and Q2-L9 (since retired).\n- **2026-08-06 — why clause (iv) was cut in two**: the parent's clause (iv) pins two independent things — an identification of a pushforward and an identification of a shift — and they are certified by different arguments, the first by the shape of the convolution diagram and the second by a dimension count on the stratum. Keeping them in one node would have made a two-page write-up out of two one-page claims; the split is what [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html) exists for.\n";</script>
