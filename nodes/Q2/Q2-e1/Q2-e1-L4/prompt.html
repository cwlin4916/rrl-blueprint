<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-e1-L4</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-e1-L4 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q2-e1-L4 — self-contained prompt: The convolution morphism realizes $\\pi_\\nu$, and its pushforward is the iterated Hecke translate\n\n## Task\n\nVerify the example and explain precisely which hypotheses and conclusions it realizes. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q2: For which $X$ does every standard object of a stratum lie in the Satake subcategory?](../../../../dag.html)\n\n**Standing setting.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../../../context.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html). $LX$ carries the $K$-placid presentation by orbit closures of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html),\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda .\n$$\n\nCoherence is [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), the renormalized category is $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html).\n\n### The recollement package, and which clause is standing\n\n[Q3](../../../Q3/index.html) asks for which $X$ the three clauses below hold, and states them canonically. They are written out in full here because Q2 spends them one at a time and a reader must be able to check which: **(H1)** is in force throughout Q2, and **(H2)** and **(H3)** are not.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n**(H1) is standing; the other two are spent by name.** Q2 assumes **(H1)** everywhere and proves it nowhere — discharging it is [Q1](../../../Q1/index.html)'s business, and it is what makes $i_{\\lambda!}$ exist, so without it the question below has no subject.\n\n**(H2)** and **(H3)** are what make the standard objects *generate* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. Generating is a different question from belonging, and belonging is what is asked here.\n\nThe two enter only where the membership is cashed in for [Q1](../../../Q1/index.html)'s equality, at [Q2-L1](../../Q2-L1/index.html)(ii), and each node that spends one names it at the point of use. A node needing a fourth hypothesis has found one and must say so.\n\n**Repository problem.** For which $X$ in the standing class does $!$-extension from every stratum land in the Satake subcategory:\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\ ?\n$$\n\nStating it costs **(H1)** and nothing else, because **(H1)** is what makes $i_{\\lambda!}$ exist.\n\n**The form the nodes work in.** Every **standard object** $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$ formed from a generating collection of a stratum ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html); notation [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html)) lies in the subcategory. That holds for one choice of collections if and only if it holds for every choice, so no choice of generators is part of what is asked — [Q2-L1](../../Q2-L1/index.html)(iii).\n\n**What counts as an answer.** A condition on the geometry of $LX$. The ones on record are **sufficient**: ind-proper Hecke correspondences onto each closure with cohomologically trivial open fibre, plus a boundary dévissage — [Q2-L3](../../Q2-L3/index.html), [Q2-L4](../../Q2-L4/index.html), [Q2-L5](../../Q2-L5/index.html).\n\n**What those conditions do not yet reach.** They produce one generator per stratum, not every generator. [Q2-L5](../../Q2-L5/index.html) and [Q2-L6](../../Q2-L6/index.html) are the whole of what supplies hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html), and each terminates in a triangular lift of the dualizing object $\\omega_{K\\backslash LX_\\lambda}$, while **(D)** quantifies over every $a\\in A_\\lambda$.\n\nSo the chain answers the question exactly where $\\#A_\\lambda = 1$, which by [Q2-L2](../../Q2-L2/index.html)(iii) is connectedness of every stabilizer quotient $G_\\lambda$ — the hypothesis the Conjecture below carries, and one that no node establishes for the symmetric class at large. Where a stabilizer is disconnected the remaining generators are not merely unproved but out of reach of the mechanism: by [Q2-L2](../../Q2-L2/index.html)(ii) they need not lie in the subcategory $\\omega_{K\\backslash LX_\\lambda}$ generates, so nothing recovers them from what these nodes deliver.\n\nNo node with `role: proof` states a criterion producing a triangular lift of a non-trivial $E_{\\lambda,a}$; [Q2-e3](../../Q2-e3/index.html) at $\\mathrm{GL}_2/\\mathrm{O}_2$ asks whether one exists and does not answer it, and [K11](../../../../key_examples/k11.html) is out of class for precisely this reason.\n\n**On a necessary condition.** No node here states one: the $K_0$ cyclicity test is necessary for [Q1](../../../Q1/index.html)'s equality and not for the membership asked here, so a necessary condition in $LX$'s own geometry is open.\n\nHypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html) is one missing fact from being necessary. Taking $P_{\\lambda,a} := \\Delta_{\\lambda,a}$ discharges two of its three clauses — the Satake membership is the hypothesis itself, and the costalk clause is full faithfulness in **(H1)** — while the third asks for\n\n$$\ni_\\mu^!i_{\\lambda!}E_{\\lambda,a}\\ \\simeq\\ 0 \\qquad\\text{whenever }\\mu\\not\\le\\lambda .\n$$\n\nNo appendix entry supplies that vanishing.\n\nGranting that vanishing would make **(D)** *equivalent* to the membership, hence a reformulation of the question rather than a condition on $X$ — the objection recorded against [Q2-L1](../../Q2-L1/index.html) in the next paragraph, which would then apply to **(D)** verbatim. So the geometric content of an answer has to live in a theorem **supplying** the triangular lifts, and can never live in the triangular-lift condition itself.\n\n[Q2-L1](../../Q2-L1/index.html) is not such a condition. It reformulates the membership rather than conditioning $X$, and what it buys is the bridge to [Q1](../../../Q1/index.html) recorded under **Feeds** above.\n\nA full answer lists geometric hypotheses on $X$ under which the membership provably holds, together with an $X$ in the standing class where it provably fails; [K12](../../../../key_examples/k12.html) already supplies the second half.\n\n**The $X$ the literature settles.** The bench is [`key_examples.md`](../../../../key_examples/index.html), which records for each case whether the answer to the **goal** question is settled in print and how. It is outside the closed world: nothing below may be cited in a proof, and it bounds belief rather than supplying it.\n\n| | $X$ | $G$ | verdict | what it gives Q2 |\n|---|---|---|---|---|\n| [K1](../../../../key_examples/k1.html) | $\\mathbb{A}^1$ | $\\mathbb{G}_m$ | positive | the smallest non-homogeneous case; two strata, infinite boundary |\n| [K2](../../../../key_examples/k2.html) | $\\mathrm{pt}$ | $G$ | positive | one stratum; the membership is trivial |\n| [K3](../../../../key_examples/k3.html) | $\\mathrm{SO}_N$ | $\\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$ | positive | Gross–Prasad; symmetric, connected stabilizers |\n| [K4](../../../../key_examples/k4.html) | $\\mathrm{GL}_N$ | $\\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$ | positive | Rankin–Selberg |\n| [K5](../../../../key_examples/k5.html) | $\\mathrm{GL}_n\\times\\mathbb{A}^n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ | positive | mirabolic; non-homogeneous and still positive |\n| [K6](../../../../key_examples/k6.html) | $\\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$ | $\\mathrm{GL}_{2n}$ | positive | symmetric, the shape the Conjecture is cut for |\n| [K7](../../../../key_examples/k7.html) | $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$ | | adjacent | no verified source; not evidence |\n| [K8](../../../../key_examples/k8.html) | rank-1 affine homogeneous | | **weak** | only the Satake subcategory is realized, so it establishes [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) and leaves the question untouched |\n| [K9](../../../../key_examples/k9.html) | $H$ | $H\\times H$ | **degenerate** | $\\mathrm{IC}_0$ is the monoidal unit, so the membership holds for a reason no other $X$ has — it can never on its own earn `consistent` |\n| [K10](../../../../key_examples/k10.html) | Whittaker | | out-of-class | fails [the three standing hypotheses](../../../../appendix/assum-intro.html) |\n| [K11](../../../../key_examples/k11.html) | $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | | out-of-class | the class boundary: disconnected generic stabilizer |\n| [K12](../../../../key_examples/k12.html) | $(\\mathrm{SL}_2^{\\times 3})\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ | | **negative** | the membership fails in the standing class |\n\nK12 is why the Conjecture carries hypotheses rather than asserting the membership outright.\n\n**Where this sits.** This node is a concrete instance and illustrates rather than justifies the argument. It corroborates [Q2-e1](../index.html). Its conclusion is required directly by [Q2-e1](../index.html), [Q2-e1-L5](../Q2-e1-L5/index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-06 — why clause (iv) was cut in two**: the parent's clause (iv) pins two independent things — an identification of a pushforward and an identification of a shift — and they are certified by different arguments, the first by the shape of the convolution diagram and the second by a dimension count on the stratum. Keeping them in one node would have made a two-page write-up out of two one-page claims; the split is what [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html) exists for.\n\n## Target statement\n\n**Polarity: positive.** In the group case the Demazure–Bott–Samelson convolution morphism realizes the map $\\pi_\\lambda$ of [Q2-L5](../../Q2-L5/index.html) at every stratum, hypotheses **(a)** and **(b)** of that node hold there, and the first of the two identifications it leaves unproved is true. This is the first half of clause (iv) of [Q2-e1](../index.html).\n\n**The claim being instantiated.** Quoted from [Q2-L5](../../Q2-L5/index.html) so that this node stands on its own: *fix $\\lambda\\in\\Lambda_X^+$ and dominant coweights $\\nu_1,\\dots,\\nu_r$, and let*\n\n$$\n\\pi_\\lambda\\colon\\ Z_\\lambda := \\overline{\\mathrm{Gr}}_{\\nu_1}\\,\\widetilde{\\times}\\,\\cdots\\,\\widetilde{\\times}\\,\\overline{\\mathrm{Gr}}_{\\nu_r}\\,\\widetilde{\\times}^{K}\\,L^+X\\ \\longrightarrow\\ LX\n$$\n\n*be the iterated convolution map, taken $K$-equivariantly. Assume (a) $\\pi_\\lambda$ is ind-proper with scheme-theoretic image $\\overline{LX}_\\lambda$, and (b) there is $n_\\lambda\\in\\mathbb{Z}$ with $H^\\bullet_{\\mathrm{dR},c}(\\pi_\\lambda^{-1}(x))\\simeq k[-n_\\lambda]$ for every $k$-point $x\\in LX_\\lambda$, the resulting rank-one local system on $LX_\\lambda$ being trivial. Two identifications are part of what is to be proved and are not imported: that $\\pi_{\\lambda!}$ of the constant object on $Z_\\lambda$ is the iterated convolution $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$, and the normalizing shift relating the constant object on $K\\backslash L^+X$ to $\\omega_{K\\backslash L^+X}$, which is absorbed into $n_\\lambda$.*\n\n**The specialisation.** Take the acting group to be $G\\times G$ and $X = G$ under it, as in [Q2-e1](../index.html), so that $L^+X = L^+G$, $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ and $\\Lambda_X^+ = \\Lambda^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)). Fix $\\nu\\in\\Lambda^+$ and dominant coweights $\\nu_1,\\dots,\\nu_r$ with $\\nu = \\nu_1+\\cdots+\\nu_r$. Then $Z_\\nu$ is the convolution space $\\overline{\\mathrm{Gr}}_{\\nu_1}\\,\\widetilde{\\times}\\,\\cdots\\,\\widetilde{\\times}\\,\\overline{\\mathrm{Gr}}_{\\nu_r}$ taken over the base point of $\\mathrm{Gr}$, $\\pi_\\nu$ is the iterated convolution morphism $q$ of [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html), and:\n\n**(a) Ind-properness onto the closure.** $\\pi_\\nu$ is proper with scheme-theoretic image the reduced closure $\\overline{\\mathrm{Gr}}_\\nu = \\overline{LX}_\\nu$ ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html)), so hypothesis (a) of [Q2-L5](../../Q2-L5/index.html) holds at $\\nu$.\n\n**(b) An isomorphism over the open stratum.** $\\pi_\\nu$ restricts to an isomorphism $\\pi_\\nu^{-1}(LX_\\nu)\\xrightarrow{\\ \\sim\\ }LX_\\nu$ onto the stratum $LX_\\nu = \\mathrm{Gr}_\\nu$ ([Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)); hence the fibre over every $k$-point of $LX_\\nu$ is a single reduced point, $H^\\bullet_{\\mathrm{dR},c}(\\pi_\\nu^{-1}(x))\\simeq k$, and hypothesis (b) of [Q2-L5](../../Q2-L5/index.html) holds at $\\nu$ with fibre shift $0$ and trivial local system.\n\n**(c) The pushforward is the iterated Hecke translate.** Writing $\\mathcal{F}_{\\nu_i}$ for the constant object on $K\\backslash\\overline{\\mathrm{Gr}}_{\\nu_i}$, the pushforward along $\\pi_\\nu$ of the constant object on $Z_\\nu$ is $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$, with no shift: the action $\\ast$ is the pull–push along the same convolution diagram, every pullback in that diagram is along a $K$-torsor projection or a twisted-product projection and carries the constant object to the constant object, and the composite of the $r$ pushforwards is the pushforward along $\\pi_\\nu$ ([Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html)).\n\n**(d) The smooth case.** If moreover every $\\nu_i$ is minuscule, then each $\\overline{\\mathrm{Gr}}_{\\nu_i} = \\mathrm{Gr}_{\\nu_i}$ is a smooth projective variety, $Z_\\nu$ is smooth, and $\\pi_\\nu$ is a proper birational morphism onto $\\overline{\\mathrm{Gr}}_\\nu$ — the Demazure resolution named in [Q2-e1](../index.html)(iv).\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../appendix/conj-intro.html) holds for $X$.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n\n### [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.9 with Prop. 3.9.2, §6.3, and Table 1](../../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). A morphism $f\\colon S\\rightarrow T$ of ind-schemes is *finitely presented* if it is schematic and its base change along any scheme is a finitely presented morphism (the source's §6.3). For such $f$ the source constructs a pushforward on the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html),\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(T),\n$$\n\nwhich it names the *\"$!$-dR $*$-pushforward functor\"*, and:\n\n**(i) Functoriality through correspondences.** $\\mathcal{D}^!$ upgrades, by left Kan extension, to a functor $\\mathcal{D}^{!,\\mathrm{enh}}$ out of the category of ind-schemes under correspondences $T\\xleftarrow{\\ \\alpha\\ }H\\xrightarrow{\\ \\beta\\ }S$ whose right leg $\\beta$ is finitely presented and whose left leg $\\alpha$ is arbitrary, carrying such a correspondence to $\\beta_{*,!-\\mathrm{dR}}\\,\\alpha^!$. In particular $f\\mapsto f_{*,!-\\mathrm{dR}}$ is compatible with composition of finitely presented morphisms.\n\n**(ii) Base change against $!$-pullback.** For a Cartesian square of ind-schemes\n\n$$\n\\begin{array}{ccc} S' & \\xrightarrow{\\ \\psi\\ } & S\\\\ \\downarrow f' & & \\downarrow f\\\\ T' & \\xrightarrow{\\ \\varphi\\ } & T\\end{array}\n$$\n\nwith $f$ finitely presented, the canonical map $\\varphi^!\\,f_{*,!-\\mathrm{dR}}\\rightarrow f'_{*,!-\\mathrm{dR}}\\,\\psi^!$ is an equivalence; Table 1 records this as \"always satisfies base-change with upper-$!$ functors\", with no hypothesis on $\\varphi$.\n\n**(iii) The proper adjunction.** If $f$ is in addition proper, then $f^!$ is canonically right adjoint to $f_{*,!-\\mathrm{dR}}$ — equivalently, $f_{*,!-\\mathrm{dR}}$ is the left adjoint of $f^!$.\n\n**(iv) The same construction for prestacks** *(added 2026-08-08; this clause **amends** the entry and, with it, what every node citing this anchor asserts — see the amendment note below)*. The source states the definition and the pushforward one generality up, for prestacks rather than ind-schemes. A morphism $f\\colon\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks is *finitely presented* if it is schematic and if for every $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathrm{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented; for every such $f$ there is a functor\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(\\mathcal{Y})\\longrightarrow\\mathcal{D}^!(\\mathcal{Z})\n$$\n\ncompatible with base change. *Schematic is meant classically*: the source's Remark 3.16.1 emphasises that \"by *schematic*, we mean schematic in the sense of classical (i.e., non-derived) algebraic geometry, which is a more forgiving notion than that of derived algebraic geometry\", the example given there being the embedding of $0$ inside the ind-scheme attached to an infinite-dimensional $k$-vector space — classically schematic, not DG schematic.\n\n**A quotient prestack is a prestack, and this is the clause to cite there.** For a group $K$ acting on $\\mathcal{Y}$ and on $\\mathcal{Z}$, the induced $K\\backslash\\mathcal{Y}\\rightarrow K\\backslash\\mathcal{Z}$ is a morphism of prestacks and is covered by the definition above verbatim. A node computing a pushforward and its base change on $K\\backslash LX$ therefore does **not** owe the assembly of [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) for that step; what it owes instead is finite presentation of the quotient morphism itself, in the sense just displayed.\n\n- **hypotheses:** $f$ **finitely presented** in the source's sense — for (i)–(iii) the ind-scheme sense recalled at the top, for (iv) the prestack sense of that clause — and, for (iii) alone, in addition **proper**. Placidity is *not* a hypothesis of any clause, and neither is any equivariance. *What each generality reaches.* Clauses (i)–(iii) are stated for ind-schemes: the correspondence functoriality, the base change in the displayed form, and the proper adjunction are asserted there and nowhere wider. Clause (iv) is stated for **prestacks**, hence for quotient prestacks $K\\backslash(-)$, but it asserts only the existence of $f_{*,!-\\mathrm{dR}}$ and its compatibility with base change — the source states neither (i) nor (iii) at that generality, so a node wanting the correspondence formalism or the proper adjunction on a quotient prestack still owes them. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) or about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)).\n- **note:** **There is one pushforward on $\\mathcal{D}^!$, and its name carries a $*$.** A node writing $f_!$ for the left adjoint of $f^!$ and a node writing $f_*$ for the pushforward defining a convolution ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) are, on $\\mathcal{D}^!$ and for finitely presented $f$, naming the same functor $f_{*,!-\\mathrm{dR}}$ of this entry. That is the whole of what the source licenses on this point.\n\n  **What is *not* licensed** is the identification of $f_{*,!-\\mathrm{dR}}$ with the $\\mathcal{D}^*$-pushforward $f_{*,\\mathrm{dR}}\\colon\\mathcal{D}^*(S)\\rightarrow\\mathcal{D}^*(T)$ across the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ that a dimension theory supplies ([sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html), [the three standing hypotheses](../../../../appendix/assum-intro.html)(b)). The source introduces the subscript precisely \"to avoid confusion\" between the two (§3.9, p. 9), and Table 1 lists two further renormalized functors $f_{*,\\mathrm{ren}}$ and $f^{!,\\mathrm{ren}}$ for placid $S,T$ equipped with dimension theories. A node needing that identification still owes it.\n- **note:** *Provenance, verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-06. Table 1, p. 3, row 3: hypothesis \"$f$ ind-finitely presented\", functor $f_{*,!-\\mathrm{dR}}\\colon D^!(S)\\rightarrow D^!(T)$, adjunctions \"Left adjoint to $f^!$ for $f$ ind-proper; right adjoint to $f^!$ up to cohomological shift for $f$ smooth\", base change \"Always satisfies base-change with upper-$!$ functors\", references §3.9 and §6.3. §3.9, p. 9 introduces $f_{*,!-\\mathrm{dR}}$ for a finitely presented map of quasi-compact quasi-separated **schemes** and notes that \"the formalism of correspondences implies that we have base-change between $*$-pushforward and $!$-pullback for Cartesian squares\"; Prop. 3.9.2, p. 10 is the proper adjunction in that scheme setting. §6.3, p. 34 is the ind-scheme upgrade quoted above, ending \"If $f$ is additionally assumed proper or smooth, we again have the usual adjunctions.\"\n\n  *A typo on the page.* The displayed compatibility inside Prop. 3.9.2 is printed as $f_{*,\\mathrm{dR}}\\varphi^!\\xrightarrow{\\ \\simeq\\ }\\psi^!f'_{*,!-\\mathrm{dR}}$, whose subscripts and primes do not typecheck against the Cartesian square drawn immediately above it. Clause (ii) states the base change in the form that does, which is the form Table 1 asserts.\n- **note:** *Commissioned by* the `/prove Q2` failure audit of 2026-08-06: **GAP (Prop)** at Step 4 of [Q2-L5](../../Q2-L5/index.html)'s write-up, which asked for four clauses. Three are above. The fourth, \"$f_!\\simeq f_*$\", is reached only in the notational sense recorded in the first note and **not** as an identification across the $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ duality.\n- **note:** *Provenance of clause (iv), verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-08. §3.16, printed p. 15, titled *Correspondences for prestacks*, reads verbatim: \"We say that a morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ is finitely presented if it is schematic, and if for any $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathsf{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented. As another corollary of Proposition 3.6.1, we obtain that there is a functor $f_{*,!-dR}$ compatible with base-change for any finitely presented morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks.\" Remark 3.16.1, immediately below on the same page, is the classical-schematic caveat quoted in clause (iv). §3.17, the equivariant setting behind [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html), begins on the same printed page.\n\n  *Two readings in clause (iv) are the transcriber's and not the page's.* First, the source writes only \"compatible with base-change\" and does not display the square; that this means the equivalence $\\varphi^!f_{*,!-\\mathrm{dR}}\\simeq f'_{*,!-\\mathrm{dR}}\\psi^!$ of clause (ii), now for a Cartesian square of prestacks, is read from Table 1's \"always satisfies base-change with upper-$!$ functors\" and from §3.9's own sentence about the formalism of correspondences. Second, $\\mathcal{D}^!$ on a prestack is here the one of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html) (main.tex:651–668); identifying it with the source's is the same dictionary clauses (i)–(iii) already rest on, and this entry does not re-derive it.\n- **note:** *What the amendment of 2026-08-08 changed, and what it withdrew.* Before that date this entry was transcribed from §3.9, §6.3 and Table 1 alone — schemes and ind-schemes — and its hypotheses line asserted that \"$S$ and $T$ are ind-schemes, never quotient stacks, so a node working on $K\\backslash LX$ supplies the descent from the ind-scheme statement itself, exactly as [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) requires.\" **That sentence was too restrictive and is withdrawn**, not merely supplemented: §3.16 states the definition and the base-change-compatible pushforward for prestacks outright, so on $K\\backslash(-)$ the pushforward and its base change are clause (iv) and no descent argument is owed for them. What survives of the old sentence: the torsor-descent entry is still what a node needs in order to *evaluate* $\\mathcal{D}^!$ on a quotient by an atlas, and clauses (i) and (iii) are still ind-scheme statements. A node whose write-up was built against the withdrawn sentence has an argument that is sound and longer than it needs to be, not one that is wrong.\n\n### [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../../Q1/Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../../Q1/Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../../Q1/Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [$\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$, $\\Delta_{\\lambda,a}$ — stratum generating collections and the standard objects](../../../../appendix/not-standard-objects.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (blueprint notation, coined in the [Q2](../../../../dag.html) framing block and recorded here so that no node coins it again; main.tex names no such objects, and the two ingredients it does supply are the generation operation [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) at main.tex:502 and the locally closed embeddings $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) at main.tex:737). Let $X$ be a smooth affine spherical $G$-variety and $K = L^+G$. The two categories in play are the renormalized categories ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ of the whole loop space and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ of the spherical stratum $LX_\\lambda$ indexed by $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)); both are written out in full wherever they occur, and no abbreviation for either is introduced here or licensed elsewhere.\n\nA **generating collection** for the stratum $\\lambda$ is a small collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, indexed by a set $A_\\lambda$, which generates that category in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nLet $i_{\\lambda!}$ denote the left adjoint of the restriction functor $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ along the locally closed embedding $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html). Given a generating collection, the **standard objects** of the stratum $\\lambda$ are its images\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nWhen a single object suffices — $\\#A_\\lambda = 1$ — the index $a$ is dropped and one writes $E_\\lambda$ and $\\Delta_\\lambda = i_{\\lambda!}E_\\lambda$.\n\n**Two worked examples.** The definitions above fix symbols and settle nothing, so a reader cannot tell from them whether $A_\\lambda$ is ever bigger than a point, or what an $E_{\\lambda,a}$ looks like when it is. The two cases below are written out for that reason alone. Each is an *illustration of the notation*, not a claim this entry makes: the mathematics in both is asserted and proved at the node named, and a proof that needs either fact cites that node and never this paragraph.\n\n*Example 1 — one generator per stratum: $X = G$ under $G\\times G$.* Take $K = L^+G\\times L^+G$, so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ is the ordinary spherical Hecke situation and $\\Lambda_X^+$ is the set $\\Lambda^+$ of dominant coweights ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)), the stratum at $\\nu$ being the orbit $LX_\\nu = \\mathrm{Gr}_\\nu = L^+G\\cdot t^\\nu$. The stabilizer of $t^\\nu$ has connected finite-type reductive quotient — the centralizer $Z_G(\\nu)$, connected because a torus centralizer in a connected reductive group is — so the dualizing object generates the stratum on its own and the collection may be taken to be a single object:\n\n$$\n\\#A_\\nu = 1, \\qquad E_\\nu = \\omega_{K\\backslash LX_\\nu}, \\qquad \\Delta_\\nu = i_{\\nu!}\\,\\omega_{K\\backslash LX_\\nu} .\n$$\n\nThis is [Q2-e1-L1](../Q2-e1-L1/index.html), resting on [Q2-L2](../../Q2-L2/index.html)(i).\n\n*Example 2 — more than one, and the index set named: $X = \\mathrm{GL}_2/\\mathrm{O}_2$.* Here $LX = \\{A\\in\\mathrm{GL}_2(F) : A^t = A\\}$ with $K = \\mathrm{GL}_2(\\mathcal{O})$ acting by $g\\cdot A = gAg^t$ ([$F$, $\\mathcal{O}$](../../../../appendix/conv-ring-of-integers.html)), and the strata are indexed by pairs $\\lambda = (p,q)$ with $p\\ge q$. At a diagonal stratum $\\lambda = (p,p)$ the finite-type quotient of the stabilizer is $\\mathrm{O}_2$, whose component group is $\\mathbb{Z}/2$ with the two characters $\\mathrm{triv}$ and $\\mathrm{sgn} = \\det|_{\\mathrm{O}_2}$. One generator per character is then a generating collection, and two are needed:\n\n$$\nA_\\lambda = \\{\\mathrm{triv},\\ \\mathrm{sgn}\\}, \\qquad E_{\\lambda,\\mathrm{triv}} = \\omega_{K\\backslash LX_\\lambda}, \\qquad E_{\\lambda,\\mathrm{sgn}} = \\omega_{K\\backslash LX_\\lambda}\\otimes\\mathrm{sgn},\n$$\n\nwith $\\Delta_{\\lambda,\\mathrm{triv}} = i_{\\lambda!}E_{\\lambda,\\mathrm{triv}}$ and $\\Delta_{\\lambda,\\mathrm{sgn}} = i_{\\lambda!}E_{\\lambda,\\mathrm{sgn}}$ the two standard objects of that one stratum. The dualizing object alone does not generate: $\\mathrm{sgn}$ is right-orthogonal to it in every shift. This is [Q2-e3-L2](../../Q2-e3/Q2-e3-L2/index.html)(B), resting on [Q2-L2](../../Q2-L2/index.html)(ii)–(iii); the same node's clause (C) shows $\\#A_\\lambda = 4$ at every off-diagonal stratum, so the size of $A_\\lambda$ varies with $\\lambda$ within one $X$.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../appendix/ic-0.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n- **note:** the pointing condition of [unramified relative local Langlands](../../../../appendix/conj-relative-langlands-unramified.html) is exactly the requirement that $\\mathrm{IC}_0\\mapsto\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n  **Ratified reading.** The displayed membership is a genuine finiteness statement — it says the $!$-extension is coherent — and no node in the blueprint derives it. It is imported from main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action, which presupposes it; the same presupposition is what lets [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) accept $\\mathrm{IC}_0$ in the second slot of its module action. Before 2026-08-05 it was carried only by the grammar of those two entries, and round 1 of [Q1-L2-L3](../../../Q1/Q1-L2/Q1-L2-L3/critiques/r1.html) asked for it to be stated; it is stated here so that a proof may cite it rather than infer it from a typing argument. Anyone who later wants it *proved* wants a node about coherence of $!$-extensions on $K\\backslash LX$, which is not in the closed world.\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) and [the Satake subcategories](../../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n- **note:** main.tex writes the convolution diagram only for the Hecke category itself (main.tex:1096–1102) and describes the action on $LX$ in words — \"which are given by the convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\", main.tex:922. This entry records the reading that the two are the same pull–push construction, which is how every node in the DAG uses $\\ast$.\n\n### [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@article{GR17vol1,\n    author = {Dennis Gaitsgory and Nick Rozenblyum},\n    title = {A study in Derived Algebraic Geometry, volume 1},\n    year = {2017}\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n```\n\n## The key examples this statement is tested against\n\nThe register at [key_examples.md](../../../../key_examples/index.html) fixes the cases where the answer is known. A reading aid, outside the closed world: check the statement against it, never discharge a step with it.\n\n- **K1 — Iwasawa–Tate: $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$** *(`positive`)* — **The variety.** $\\mathbb{G}_m$ scaling the line, the simplest non-homogeneous member of the standing class — smooth affine, open orbit $\\mathbb{A}^1\\smallsetminus\\{0\\}$ with trivial stabilizer. The loop space is $LX(k) = k((t))$, stratified by valuation together with …\n- **K2 — The trivial period: $X = \\mathrm{pt}$** *(`positive`)* — **The variety.** The point, smooth affine spherical for any $G$, with $K\\backslash LX = BL^+G$. Degenerate in size and not in content — the basic object is the constant sheaf and its Hecke translates have …\n- **K3 — Gross–Prasad: $X = \\mathrm{SO}_N$ under $G = \\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$** *(`positive`)* — **The variety.** Homogeneous with reductive stabilizer, hence smooth affine, and spherical. Quotienting by the second factor identifies $K\\backslash LX \\simeq \\mathrm{SO}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$, the presentation Q1-L5-e3 works in.\n- **K4 — Rankin–Selberg: $X = \\mathrm{GL}_N$ under $G = \\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$** *(`positive`)* — **The variety.** The $\\mathrm{GL}$ analogue of K3, homogeneous with $K\\backslash LX \\simeq \\mathrm{GL}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{GL}_N}$. BZSV list it among the cases whose loop space is placid by strata of the affine Grassmannian (p. 156).\n- **K5 — Mirabolic: $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$** *(`positive`)* — **The variety.** The dual of the Godement–Jacquet space, with $(g,v)$ acted on by $(g_1,g_2)\\mapsto(g_1^{-1}gg_2,\\, vg_2)$. Its loop quotient is the mirabolic affine Grassmannian $\\mathrm{Gr}\\times\\mathcal{V}$ with $\\mathcal{V} = \\mathbf{V}\\otimes F$, $\\dim\\mathbf{V} = n$, acted on diagonally …\n- **K6 — Symplectic (Jacquet–Rallis) period: $X = \\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$** *(`positive`)* — **The variety.** Symmetric, hence spherical, and homogeneous with reductive stabilizer, hence smooth affine. Its dual is the Shalika-Whittaker reduction $\\check M = T^*(\\mathrm{GL}_{2n}/\\mathrm{GL}_n\\ltimes U,\\psi)$.\n- **K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m < n-1$** *(`adjacent`)* — **The variety.** The dual is $\\check X = \\mathrm{Mat}_{m\\times n}$ acted on by $\\check G = \\mathrm{GL}_m\\times\\mathrm{GL}_n$; the automorphic side is the Rankin–Selberg period for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$ outside the adjacent range covered by K4.\n- **K8 — Rank-1 affine homogeneous spherical varieties: the weakened form, in print** *(`weak`)* — **Why it is here.** This is the entry that shows the distinction this register turns on is real, and not a reading the blueprint imposed on the literature.\n- **K9 — The group case: $X = H$ under $G = H\\times H$** *(`degenerate`)* — **Why it is here.** To keep it out. BZSV §7.6.2 (pp. 168–169) identify the conjecture here with derived Satake, so the case is as settled as anything in the register — and useless as a …\n- **K10 — The Whittaker period: $M = T^*(G/\\!\\!/_{\\psi}U)$** *(`out-of-class`)* — **Why it is here.** BZSV §7.6.4 (p. 169) settle it — the dual is a point, the automorphic side is Whittaker sheaves on the Grassmannian, and the equivalence is Frenkel–Gaitsgory– Vilonen. It looks like a …\n- **K11 — $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$: the class boundary** *(`out-of-class`)* — **Why it is here.** A spherical root of type $N$ puts it outside the hyperspherical setting (BZSV §7.6.5, pp. 169–170), and the conclusion changes shape rather than merely failing: the local category contains a block …\n- **K12 — $X = (\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$** *(`negative`)* — **Why it is here.** It is the only candidate *negative* on record. Sakellaridis (arXiv:0905.4244, Ex. 8.0.1 with Thm 8.0.2 and pp. 65–66) shows that in the function-theoretic shadow the basic vector generates a proper Hecke …\n\n**No `/check-goal` run is on record for this node.**\n\n## Expected response\n\nVerify the example or show that it fails. Give a counterexample if it is false, a corrected statement if it needs one, and say how the plan around this node should change. Write as a rigorous mathematician, and search the web for anything you cite.\n";</s
