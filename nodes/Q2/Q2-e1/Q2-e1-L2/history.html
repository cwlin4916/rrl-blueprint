r on dominant coweights and each closure carries finitely many strata. **What it does not reach:** hypothesis **(B)** of that node, which it consumes rather than verifies; the generation of each stratum, which is [Q2-e1-L1](../Q2-e1-L1/index.html)'s; and any instance where the boundary is infinite, which is the business of [Q2-e2](../../Q2-e2/index.html) and the reason [Q2-L4](../../Q2-L4/index.html) exists.\n- **2026-08-06 — the dependency on [Q2-e1-L1](../Q2-e1-L1/index.html) is real and not bookkeeping**: hypothesis **(C)** asks for the boundary category to be generated by the *standard objects* of the boundary strata, so the finite induction cannot run until the generating collection at each such stratum is known, and in this instance that is exactly the single dualizing generator [Q2-e1-L1](../Q2-e1-L1/index.html) supplies.\n- **2026-08-08 — hypothesis attribution corrected** by `/update Q2`, recorded in [u3](../../Q2-L1/updates/u3.html). Clause (b) called **(H1)** and **(H3)** of [Q1-L5](../../../Q1/Q1-L5/index.html) *in force throughout* [Q2](../../../../dag.html). After that run only **(H1)** is standing there, so the parenthetical now says which is which and marks **(H3)** as named here because this node spends it. No claim of this node changed, and this node is in fact the evidence for the narrowing: it was already citing **(H1)** and **(H3)** and never **(H2)**.\n";</script>
