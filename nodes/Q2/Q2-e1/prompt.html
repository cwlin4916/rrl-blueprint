html) to learn which conjecture they were confirming — and then had to notice unaided that they confirm nothing, because $\\mathrm{IC}_0$ …\n\nThe statement below is the current one; the flag is standing, and nothing in this packet clears it.\n\n## Task\n\nVerify the example and explain precisely which hypotheses and conclusions it realizes. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q2: For which $X$ does every standard object of a stratum lie in the Satake subcategory?](../../../dag.html)\n\n**Standing setting.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../../context.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). $LX$ carries the $K$-placid presentation by orbit closures of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html),\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda .\n$$\n\nCoherence is [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), the renormalized category is $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html).\n\n### The recollement package, and which clause is standing\n\n[Q3](../../Q3/index.html) asks for which $X$ the three clauses below hold, and states them canonically. They are written out in full here because Q2 spends them one at a time and a reader must be able to check which: **(H1)** is in force throughout Q2, and **(H2)** and **(H3)** are not.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n**(H1) is standing; the other two are spent by name.** Q2 assumes **(H1)** everywhere and proves it nowhere — discharging it is [Q1](../../Q1/index.html)'s business, and it is what makes $i_{\\lambda!}$ exist, so without it the question below has no subject.\n\n**(H2)** and **(H3)** are what make the standard objects *generate* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. Generating is a different question from belonging, and belonging is what is asked here.\n\nThe two enter only where the membership is cashed in for [Q1](../../Q1/index.html)'s equality, at [Q2-L1](../Q2-L1/index.html)(ii), and each node that spends one names it at the point of use. A node needing a fourth hypothesis has found one and must say so.\n\n**Repository problem.** For which $X$ in the standing class does $!$-extension from every stratum land in the Satake subcategory:\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\ ?\n$$\n\nStating it costs **(H1)** and nothing else, because **(H1)** is what makes $i_{\\lambda!}$ exist. Equivalently, in the form the nodes work in: every **standard object** $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$ of a stratum lies in the subcategory ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html); notation [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)).\n\n**What counts as an answer.** Geometric hypotheses on $X$ under which the membership provably holds, together with an $X$ in the standing class where it provably fails — and never a reformulation of the membership itself, which conditions nothing. The bench of $X$ for which the goal question is settled in print is [`key_examples.md`](../../../key_examples/index.html), outside the closed world; [K12](../../../key_examples/k12.html) already supplies the failing half, which is why the Conjecture below carries hypotheses rather than asserting the membership outright.\n\n**Where this sits.** This node is a concrete instance and illustrates rather than justifies the argument. It corroborates the question [Q2](../../../dag.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n\n## Target statement\n\n**Polarity: normalization.** The group case satisfies every hypothesis of the conjecture quoted below, and satisfies its conclusion for a reason the conjecture does not supply. It therefore confirms nothing about [Q2](../../../dag.html) and fixes instead the normalization of every shift in it: here [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the monoidal unit, so the Satake subcategory is the whole category by definition rather than by theorem, and a positive answer at this $X$ is compatible with the conjecture failing at every other one.\n\n**Relation to [Q2](../../../dag.html), in four slots.** *In the standing class:* **yes**. *Meets the conjecture's hypotheses:* **yes, every one** — $X = (H\\times H)/\\Delta H$ is symmetric with $\\Delta H$ connected, and every stratum stabilizer has connected reductive quotient. *The membership Q2's problem statement asks about:* **holds**. *What it contributes to the main theorem:* **nothing, by design** — the membership holds because [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the monoidal unit, so the Satake subcategory is everything by definition and not by theorem. This is [K9](../../../key_examples/k9.html), registered `degenerate`, and a degenerate entry can never on its own earn a `consistent` goal-check. What it fixes is the normalization of every shift in Q2, and nothing else.\n\n**The claim being instantiated.** Q2's conjecture — *Hecke–Bott–Samelson triangularity*, quoted so that this node stands on its own:\n\n*Let $X$ be symmetric — $X = G/G^\\theta$ with $G^\\theta$ connected — and suppose every stratum stabilizer has connected finite-type reductive quotient $G_\\lambda$, so that $\\#A_\\lambda = 1$ and $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$. Then for every $\\lambda\\in\\Lambda_X^+$ there are dominant coweights $\\nu_1,\\dots,\\nu_r$ whose iterated convolution map*\n\n$$\n\\pi_\\lambda\\colon\\ Z_\\lambda = \\overline{\\mathrm{Gr}}_{\\nu_1}\\,\\widetilde{\\times}\\,\\cdots\\,\\widetilde{\\times}\\,\\overline{\\mathrm{Gr}}_{\\nu_r}\\,\\widetilde{\\times}^{K}\\,L^+X\\ \\longrightarrow\\ LX\n$$\n\n*is ind-proper with image $\\overline{LX}_\\lambda$ and is cohomologically trivial over $LX_\\lambda$ — an isomorphism or an affine-space bundle, with trivial monodromy. Consequently $\\Delta_\\lambda = i_{\\lambda!}\\omega_{K\\backslash LX_\\lambda}$ lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda$.*\n\n**The specialisation.** Take the acting group to be $G\\times G$ and $X = G$ under it, so that $X = (G\\times G)/\\Delta G$ with $\\theta$ the swap involution and $(G\\times G)^\\theta = \\Delta G$ connected: the conjecture's symmetry hypothesis holds. Then $K\\backslash LX$ is the ordinary spherical Hecke situation, the index set is the dominant coweight lattice $\\Lambda_X^+ = \\Lambda^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) with strata $\\mathrm{Gr}_\\nu$ ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)), and\n\n$$\n\\mathcal{F}\\ast\\mathrm{IC}_0\\ \\simeq\\ \\mathcal{F}\n$$\n\nfor every $\\mathcal{F}$ ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)). The four claims are then:\n\n**(i) The connectedness hypothesis holds.** Each stratum is $K\\backslash\\mathrm{Gr}_\\nu\\simeq BP_\\nu$ with $P_\\nu$ the stabilizer of $t^\\nu$ in $K$, a connected group scheme whose finite-type reductive quotient is the Levi $Z_G(\\nu)$ — ** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Polarity: positive.** The group case satisfies, at every stratum, the connectedness hypothesis quoted below, so that hypothesis is non-vacuous and the single-generator conclusion it is stated for holds throughout the instance [Q2-e1](index.html) treats. This is clause (i) of that node.\n\n**The claim being instantiated.** From the conjecture of [Q2](../../../dag.html), quoted so that this node stands on its own: *suppose every stratum stabilizer has connected finite-type reductive quotient $G_\\lambda$, so that $\\#A_\\lambda = 1$ and $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$ by [Q2-L2](../Q2-L2/index.html)(i).*\n\n**The specialisation.** Take the acting group to be $G\\times G$ and $X = G$ under it, with $K = L^+G\\times L^+G$, so that $K\\backslash LX \\simeq L^+G\\backslash\\mathrm{Gr}$ is the ordinary spherical Hecke situation, the index set is the dominant coweights $\\Lambda_X^+ = \\Lambda^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), and the stratum at $\\nu\\in\\Lambda^+$ is $LX_\\nu = \\mathrm{Gr}_\\nu = L^+G\\cdot t^\\nu$ ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Write $K_\\nu = \\mathrm{Stab}_K(t^\\nu)$. Then for every $\\nu\\in\\Lambda^+$:\n\n**(a) The stratum is the classifying stack of a connected group scheme.** There is an equivalence $K\\backslash LX_\\nu\\simeq BK_\\nu$ — the presentation written $BP_\\nu$ in [Q2-e1](index.html)(i) — and $K_\\nu$ is connected.\n\n**(b) The finite-type reductive quotient is a Levi.** The quotient of $K_\\nu$ by its pro-unipotent radical is the parabolic subgroup of $G$ attached to $\\nu$, whose reductive quotient is the centralizer $Z_G(\\nu)$ of the image of $\\nu$; that centralizer is connected, since the centralizer of a torus in a connected reductive group is connected.\n\n**(c) The hypothesis holds, with the dualizing generator.** Consequently [Q2-L2](../Q2-L2/index.html)(i) applies at every $\\nu\\in\\Lambda^+$, giving\n\n$$\n\\left\\langle \\omega_{K\\backslash LX_\\nu}\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\nu)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\nu)\n$$\n\n([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), so the generating collection of the stratum may be taken to be the single object $E_\\nu = \\omega_{K\\backslash LX_\\nu}$, with $\\#A_\\nu = 1$ and $\\Delta_\\nu = i_{\\nu!}\\omega_{K\\backslash LX_\\nu}$ ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)).\n\n### [Q2-e1-L2](Q2-e1-L2/index.html) — Finitely many strata below each: well-founded closure order, finite boundary dévissage\n\n- **current effective status:** open\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Polarity: positive.** The group case satisfies hypotheses **(A)** and **(C)** of [Q2-L3](../Q2-L3/index.html), quoted below, at every stratum, and satisfies them by a finite induction — so the infinite-boundary machinery of [Q2-L4](../Q2-L4/index.html) is nowhere consumed in this instance. This is clause (ii) of [Q2-e1](index.html).\n\n**The claims being instantiated.** Quoted from [Q2-L3](../Q2-L3/index.html) so that this node stands on its own, with $\\partial\\overline{LX}_\\lambda = \\overline{LX}_\\lambda\\setminus LX_\\lambda$ and $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ the full subcategory of objects supported on it: *(A) every nonempty subset of $\\Lambda_X^+$ has a minimal element for the closure order $\\mu\\le\\lambda\\Leftrightarrow LX_\\mu\\subseteq\\overline{LX}_\\lambda$; and (C) for every $\\lambda$,*\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} = \\left\\langle \\Delta_{\\mu,b}\\ \\middle|\\ LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda,\\ b\\in A_\\mu \\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n**The specialisation.** Take the acting group to be $G\\times G$ and $X = G$ under it, as in [Q2-e1](index.html), so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$, the index set is $\\Lambda_X^+ = \\Lambda^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), the strata are $LX_\\nu = \\mathrm{Gr}_\\nu$ ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)) and the reduced closures ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)) are\n\n$$\n\\overline{LX}_\\nu = \\overline{\\mathrm{Gr}}_\\nu = \\bigsqcup_{\\mu\\le\\nu}\\mathrm{Gr}_\\mu ,\n$$\n\nthe union over the dominant $\\mu$ for which $\\nu-\\mu$ is a sum of positive coroots. Then for every $\\nu\\in\\Lambda^+$:\n\n**(a) The closure order is finite below, hence well-founded.** The set $\\{\\mu\\in\\Lambda^+ : \\mu\\le\\nu\\}$ is finite, so every nonempty subset of $\\Lambda^+$ has a minimal element for the closure order and hypothesis **(A)** holds.\n\n**(b) The boundary dévissage is a finite induction.** The boundary $\\partial\\overline{LX}_\\nu = \\bigsqcup_{\\mu<\\nu}\\mathrm{Gr}_\\mu$ is a union of finitely many strata, and hypothesis **(C)** at $\\nu$ follows by induction over that finite set from hypothesis **(B)** of [Q2-L3](../Q2-L3/index.html), from hypotheses **(H1)** and **(H3)** of [Q1-L5](../../Q1/Q1-L5/index.html) — **(H1)** in force throughout [Q2](../../../dag.html), **(H3)** named here because this node spends it — and from the stratum generation of [Q2-e1-L1](Q2-e1-L1/index.html), which supplies $E_\\mu = \\omega_{K\\backslash LX_\\mu}$ and $\\Delta_\\mu = i_{\\mu!}\\omega_{K\\backslash LX_\\mu}$ at each boundary stratum.\n\n**(c) The infinite-boundary lemma is not tested.** The exhaustion hypothesis of [Q2-L4](../Q2-L4/index.html) — an increasing chain of closed subsets, each a finite union of orbit closures, presenting $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ as a filtered colimit — holds here for the constant chain $Z_m = \\partial\\overline{LX}_\\nu$, so the instance verifies that node's hypothesis vacuously and supplies no test of its conclusion.\n\n### [Q2-e1-L3](Q2-e1-L3/index.html) — $\\mathrm{IC}_0$ is the monoidal unit: the conclusion holds, and holds trivially\n\n- **current effective status:** open\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Polarity: normalization.** The group case satisfies the membership [Q2](../../../dag.html) asks about at every stratum, and satisfies it for a reason the conjecture does not supply — that [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the unit of the Hecke action, so the Satake subcategory is the whole category by definition rather than by theorem. The instance therefore confirms nothing about [Q2](../../../dag.html), and fixes only that no shift or sign in its definitions may be wrong here. This is clause (iii) of [Q2-e1](index.html).\n\n**The claims being instantiated.** Quoted so that this node stands on its own — from [Q2](../../../dag.html)'s problem statement, *$\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda\\in\\Lambda_X^+$ and every $a\\in A_\\lambda$*, and from hypothesis **(D)** of [Q2-L3](../Q2-L3/index.html), *for every $\\lambda$ and every $a\\in A_\\lambda$ there are $P_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ and $n_{\\lambda,a}\\in\\mathbb{Z}$ with $\\operatorname{supp}(P_{\\lambda,a})\\subseteq\\overline{LX}_\\lambda$ and $i_\\lambda^!P_{\\lambda,a}\\simeq E_{\\lambda,a}[n_{\\lambda,a}]$.*\n\n**The specialisation.** Take the acting group to be $G\\times G$ and $X = G$ under it, as in [Q2-e1](index.html), so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$, the index set is $\\Lambda_X^+ = \\Lambda^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), and $E_\\nu = \\omega_{K\\backslash LX_\\nu}$ with $\\Delta_\\nu = i_{\\nu!}\\omega_{K\\backslash LX_\\nu}$ by [Q2-e1-L1](Q2-e1-L1/index.html) ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)). Then:\n\n**(a) The basic object is the monoidal unit.** Here $K\\backslash L^+X$ is the base-point stratum of $L^+G\\backslash\\mathrm{Gr}$, and\n\n$$\n\\mathcal{F}\\ast\\mathrm{IC}_0\\ \\simeq\\ \\mathcal{F}\\qquad\\text{for every }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\n$$\n\n([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html)).\n\n**(b) The Satake subcategory is everything.** Since $\\mathcal{D}_c(K\\backslash\\mathrm{Gr}) = \\mathcal{D}_c(K\\backslash LX)$ in this case, the generating family of [the Satake subcategories](../../../appendix/def-satake-subcategory.html) is all of $\\mathcal{D}_c(K\\backslash LX)$, whose generated subcategory is its ind-completion ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)):\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) .\n$$\n\n**(c) The triangular object may be taken to be the standard object.** For every $\\nu\\in\\Lambda^+$, hypothesis **(D)** of [Q2-L3](../Q2-L3/index.html) holds at $\\nu$ with the object $\\Delta_\\nu$ itself and shift $0$: its support lies in $\\overline{LX}_\\nu$, the counit identification $i_\\nu^!\\Delta_\\nu\\simeq\\omega_{K\\backslash LX_\\nu}$ is the full faithfulness of $i_{\\nu!}$ granted by hypothesis **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html), and $\\Delta_\\nu$ lies in the Satake subcategory because every object does.\n\n**(d) The membership holds, and holds trivially.** Consequently $\\Delta_\\nu\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\nu\\in\\Lambda^+$, with no use anywhere of the conjecture's convolution mechanism: the conclusion of [Q2-L3](../Q2-L3/index.html) is available in this instance but is not what makes the membership true.\n\n### [Q2-e1-L4](Q2-e1-L4/index.html) — The convolution morphism realizes $\\pi_\\nu$, and its pushforward is the iterated Hecke translate\n\n- **current effective status:** ready\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Polarity: positive.** In the group case the Demazure–Bott–Samelson convolution morphism realizes the map $\\pi_\\lambda$ of [Q2-L5](../Q2-L5/index.html) at every stratum, hypotheses **(a)** and **(b)** of that node hold there, and the first of the two identifications it leaves unproved is true. This is the first half of clause (iv) of [Q2-e1](index.html).\n\n**The claim being instantiated.** Quoted from [Q2-L5](../Q2-L5/index.html) so that this node stands on its own: *fix $\\lambda\\in\\Lambda_X^+$ and dominant coweights $\\nu_1,\\dots,\\nu_r$, and let*\n\n$$\n\\pi_\\lambda\\colon\\ Z_\\lambda := \\overline{\\mathrm{Gr}}_{\\nu_1}\\,\\widetilde{\\times}\\,\\cdots\\,\\widetilde{\\times}\\,\\overline{\\mathrm{Gr}}_{\\nu_r}\\,\\widetilde{\\times}^{K}\\,L^+X\\ \\longrightarrow\\ LX\n$$\n\n*be the iterated convolution map, taken $K$-equivariantly. Assume (a) $\\pi_\\lambda$ is ind-proper with scheme-theoretic image $\\overline{LX}_\\lambda$, and (b) there is $n_\\lambda\\in\\mathbb{Z}$ with $H^\\bullet_{\\mathrm{dR},c}(\\pi_\\lambda^{-1}(x))\\simeq k[-n_\\lambda]$ for every $k$-point $x\\in LX_\\lambda$, the resulting rank-one local system on $LX_\\lambda$ being trivial. Two identifications are part of what is to be proved and are not imported: that $\\pi_{\\lambda!}$ of the constant object on $Z_\\lambda$ is the iterated convolution $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$, and the normalizing shift relating the constant object on $K\\backslash L^+X$ to $\\omega_{K\\backslash L^+X}$, which is absorbed into $n_\\lambda$.*\n\n**The specialisation.** Take the acting group to be $G\\times G$ and $X = G$ under it, as in [Q2-e1](index.html), so that $L^+X = L^+G$, $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ and $\\Lambda_X^+ = \\Lambda^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)). Fix $\\nu\\in\\Lambda^+$ and dominant coweights $\\nu_1,\\dots,\\nu_r$ with $\\nu = \\nu_1+\\cdots+\\nu_r$. Then $Z_\\nu$ is the convolution space $\\overline{\\mathrm{Gr}}_{\\nu_1}\\,\\widetilde{\\times}\\,\\cdots\\,\\widetilde{\\times}\\,\\overline{\\mathrm{Gr}}_{\\nu_r}$ taken over the base point of $\\mathrm{Gr}$, $\\pi_\\nu$ is the iterated convolution morphism $q$ of [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), and:\n\n**(a) Ind-properness onto the closure.** $\\pi_\\nu$ is proper with scheme-theoretic image the reduced closure $\\overline{\\mathrm{Gr}}_\\nu = \\overline{LX}_\\nu$ ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)), so hypothesis (a) of [Q2-L5](../Q2-L5/index.html) holds at $\\nu$.\n\n**(b) An isomorphism over the open stratum.** $\\pi_\\nu$ restricts to an isomorphism $\\pi_\\nu^{-1}(LX_\\nu)\\xrightarrow{\\ \\sim\\ }LX_\\nu$ onto the stratum $LX_\\nu = \\mathrm{Gr}_\\nu$ ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)); hence the fibre over every $k$-point of $LX_\\nu$ is a single reduced point, $H^\\bullet_{\\mathrm{dR},c}(\\pi_\\nu^{-1}(x))\\simeq k$, and hypothesis (b) of [Q2-L5](../Q2-L5/index.html) holds at $\\nu$ with fibre shift $0$ and trivial local system.\n\n**(c) The pushforward is the iterated Hecke translate.** Writing $\\mathcal{F}_{\\nu_i}$ for the constant object on $K\\backslash\\overline{\\mathrm{Gr}}_{\\nu_i}$, the pushforward along $\\pi_\\nu$ of the constant object on $Z_\\nu$ is $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$, with no shift: the action $\\ast$ is the pull–push along the same convolution diagram, every pullback in that diagram is along a $K$-torsor projection or a twisted-product projection and carries the constant object to the constant object, and the composite of the $r$ pushforwards is the pushforward along $\\pi_\\nu$ ([Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html)).\n\n**(d) The smooth case.** If moreover every $\\nu_i$ is minuscule, then each $\\overline{\\mathrm{Gr}}_{\\nu_i} = \\mathrm{Gr}_{\\nu_i}$ is a smooth projective variety, $Z_\\nu$ is smooth, and $\\pi_\\nu$ is a proper birational morphism onto $\\overline{\\mathrm{Gr}}_\\nu$ — the Demazure resolution named in [Q2-e1](index.html)(iv).\n\n### [Q2-e1-L5](Q2-e1-L5/index.html) — The normalizing shift: $n_\\nu = n_0 - 2\\langle 2\\rho,\\nu\\rangle$\n\n- **current effective status:** open\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Polarity: normalization.** The group case computes the shift that [Q2-L5](../Q2-L5/index.html) absorbs into $n_\\lambda$, and so fixes it: the integer in that node's conclusion is not the fibre-cohomology integer of its hypothesis **(b)**, but that integer corrected by a stratum-dependent term $-2\\langle 2\\rho,\\nu\\rangle$ together with one $\\nu$-independent constant. This is the second half of clause (iv) of [Q2-e1](index.html).\n\n**The claim being instantiated.** Quoted from [Q2-L5](../Q2-L5/index.html) so that this node stands on its own: *then $P_\\lambda := \\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$ satisfies*\n\n$$\nP_\\lambda\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\\qquad \\operatorname{supp}\\left(P_\\lambda\\right)\\subseteq\\overline{LX}_\\lambda,\\qquad i_\\lambda^!P_\\lambda\\ \\simeq\\ \\omega_{K\\backslash LX_\\lambda}\\left[n_\\lambda\\right],\n$$\n\n*where the normalizing shift relating the constant object on $K\\backslash L^+X$ to $\\omega_{K\\backslash L^+X}$ is absorbed into $n_\\lambda$ and is part of what is to be proved.*\n\n**The specialisation.** Take the acting group to be $G\\times G$ and $X = G$ under it, as in [Q2-e1](index.html), with $\\nu = \\nu_1+\\cdots+\\nu_r$, with $\\pi_\\nu$ and $P_\\nu = \\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$ as in [Q2-e1-L4](Q2-e1-L4/index.html), and with $\\langle 2\\rho,\\nu\\rangle = \\dim\\mathrm{Gr}_\\nu$ the dimension of the stratum $LX_\\nu$ ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Then:\n\n**(a) The costalk is the constant object.** $i_\\nu^!P_\\nu$ is the constant object on $K\\backslash LX_\\nu$, by base change ([Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html)) along the open locus where $\\pi_\\nu$ is an isomorphism, $!$-restriction to an open agreeing there with restriction.\n\n**(b) The shift, stratum against stratum.** Hence the conclusion of [Q2-L5](../Q2-L5/index.html) holds at $\\nu$ with $n_\\nu$ the integer for which the constant object on $K\\backslash LX_\\nu$ is $\\omega_{K\\backslash LX_\\nu}[n_\\nu]$, and for all $\\mu,\\nu\\in\\Lambda^+$\n\n$$\nn_\\nu - n_\\mu = -2\\left(\\langle 2\\rho,\\nu\\rangle - \\langle 2\\rho,\\mu\\rangle\\right).\n$$\n\n**(c) The residual constant.** Taking $\\mu = 0$ gives $n_\\nu = n_0 - 2\\langle 2\\rho,\\nu\\rangle$, where $n_0$ is the shift relating the constant object on $K\\backslash L^+X$ to $\\omega_{K\\backslash L^+X}$ — the second identification [Q2-L5](../Q2-L5/index.html) leaves unproved. It is one integer, independent of $\\nu$, defined once a dimension theory ([the three standing hypotheses](../../../appendix/assum-intro.html)(b)) is fixed, and this instance does not compute it.\n\n**(d) The two integers named $n_\\lambda$ in [Q2-L5](../Q2-L5/index.html) are different integers.** The fibre-cohomology integer of its hypothesis **(b)** is $0$ here ([Q2-e1-L4](Q2-e1-L4/index.html)), while the integer in its conclusion is $n_0 - 2\\langle 2\\rho,\\nu\\rangle$; so the normalization this case fixes is that the conclusion's shift is the fibre shift plus $n_0 - 2\\langle 2\\rho,\\nu\\rangle$, and in particular the correction is not independent of the stratum.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../appendix/conj-intro.html) holds for $X$.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n\n### [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.9 with Prop. 3.9.2, §6.3, and Table 1](../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). A morphism $f\\colon S\\rightarrow T$ of ind-schemes is *finitely presented* if it is schematic and its base change along any scheme is a finitely presented morphism (the source's §6.3). For such $f$ the source constructs a pushforward on the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html),\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(T),\n$$\n\nwhich it names the *\"$!$-dR $*$-pushforward functor\"*, and:\n\n**(i) Functoriality through correspondences.** $\\mathcal{D}^!$ upgrades, by left Kan extension, to a functor $\\mathcal{D}^{!,\\mathrm{enh}}$ out of the category of ind-schemes under correspondences $T\\xleftarrow{\\ \\alpha\\ }H\\xrightarrow{\\ \\beta\\ }S$ whose right leg $\\beta$ is finitely presented and whose left leg $\\alpha$ is arbitrary, carrying such a correspondence to $\\beta_{*,!-\\mathrm{dR}}\\,\\alpha^!$. In particular $f\\mapsto f_{*,!-\\mathrm{dR}}$ is compatible with composition of finitely presented morphisms.\n\n**(ii) Base change against $!$-pullback.** For a Cartesian square of ind-schemes\n\n$$\n\\begin{array}{ccc} S' & \\xrightarrow{\\ \\psi\\ } & S\\\\ \\downarrow f' & & \\downarrow f\\\\ T' & \\xrightarrow{\\ \\varphi\\ } & T\\end{array}\n$$\n\nwith $f$ finitely presented, the canonical map $\\varphi^!\\,f_{*,!-\\mathrm{dR}}\\rightarrow f'_{*,!-\\mathrm{dR}}\\,\\psi^!$ is an equivalence; Table 1 records this as \"always satisfies base-change with upper-$!$ functors\", with no hypothesis on $\\varphi$.\n\n**(iii) The proper adjunction.** If $f$ is in addition proper, then $f^!$ is canonically right adjoint to $f_{*,!-\\mathrm{dR}}$ — equivalently, $f_{*,!-\\mathrm{dR}}$ is the left adjoint of $f^!$.\n\n**(iv) The same construction for prestacks** *(added 2026-08-08; this clause **amends** the entry and, with it, what every node citing this anchor asserts — see the amendment note below)*. The source states the definition and the pushforward one generality up, for prestacks rather than ind-schemes. A morphism $f\\colon\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks is *finitely presented* if it is schematic and if for every $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathrm{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented; for every such $f$ there is a functor\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(\\mathcal{Y})\\longrightarrow\\mathcal{D}^!(\\mathcal{Z})\n$$\n\ncompatible with base change. *Schematic is meant classically*: the source's Remark 3.16.1 emphasises that \"by *schematic*, we mean schematic in the sense of classical (i.e., non-derived) algebraic geometry, which is a more forgiving notion than that of derived algebraic geometry\", the example given there being the embedding of $0$ inside the ind-scheme attached to an infinite-dimensional $k$-vector space — classically schematic, not DG schematic.\n\n**A quotient prestack is a prestack, and this is the clause to cite there.** For a group $K$ acting on $\\mathcal{Y}$ and on $\\mathcal{Z}$, the induced $K\\backslash\\mathcal{Y}\\rightarrow K\\backslash\\mathcal{Z}$ is a morphism of prestacks and is covered by the definition above verbatim. A node computing a pushforward and its base change on $K\\backslash LX$ therefore does **not** owe the assembly of [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html) for that step; what it owes instead is finite presentation of the quotient morphism itself, in the sense just displayed.\n\n- **hypotheses:** $f$ **finitely presented** in the source's sense — for (i)–(iii) the ind-scheme sense recalled at the top, for (iv) the prestack sense of that clause — and, for (iii) alone, in addition **proper**. Placidity is *not* a hypothesis of any clause, and neither is any equivariance. *What each generality reaches.* Clauses (i)–(iii) are stated for ind-schemes: the correspondence functoriality, the base change in the displayed form, and the proper adjunction are asserted there and nowhere wider. Clause (iv) is stated for **prestacks**, hence for quotient prestacks $K\\backslash(-)$, but it asserts only the existence of $f_{*,!-\\mathrm{dR}}$ and its compatibility with base change — the source states neither (i) nor (iii) at that generality, so a node wanting the correspondence formalism or the proper adjunction on a quotient prestack still owes them. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) or about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n\n### [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q1-L3-L4](../../Q1/Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../Q1/Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly the computation that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../Q1/Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html).\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [$\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$, $\\Delta_{\\lambda,a}$ — stratum generating collections and the standard objects](../../../appendix/not-standard-objects.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (blueprint notation, coined in the [Q2](../../../dag.html) framing block and recorded here so that no node coins it again; main.tex names no such objects, and the two ingredients it does supply are the generation operation [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) at main.tex:502 and the locally closed embeddings $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) at main.tex:737). Let $X$ be a smooth affine spherical $G$-variety and $K = L^+G$. The two categories in play are the renormalized categories ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ of the whole loop space and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ of the spherical stratum $LX_\\lambda$ indexed by $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)); both are written out in full wherever they occur, and no abbreviation for either is introduced here or licensed elsewhere.\n\nA **generating collection** for the stratum $\\lambda$ is a small collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, indexed by a set $A_\\lambda$, which generates that category in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nLet $i_{\\lambda!}$ denote the left adjoint of the restriction functor $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ along the locally closed embedding $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). Given a generating collection, the **standard objects** of the stratum $\\lambda$ are its images\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nWhen a single object suffices — $\\#A_\\lambda = 1$ — the index $a$ is dropped and one writes $E_\\lambda$ and $\\Delta_\\lambda = i_{\\lambda!}E_\\lambda$.\n\n**Two worked examples.** The definitions above fix symbols and settle nothing, so a reader cannot tell from them whether $A_\\lambda$ is ever bigger than a point, or what an $E_{\\lambda,a}$ looks like when it is. The two cases below are written out for that reason alone. Each is an *illustration of the notation*, not a claim this entry makes: the mathematics in both is asserted and proved at the node named, and a proof that needs either fact cites that node and never this paragraph.\n\n*Example 1 — one generator per stratum: $X = G$ under $G\\times G$.* Take $K = L^+G\\times L^+G$, so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ is the ordinary spherical Hecke situation and $\\Lambda_X^+$ is the set $\\Lambda^+$ of dominant coweights ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), the stratum at $\\nu$ being the orbit $LX_\\nu = \\mathrm{Gr}_\\nu = L^+G\\cdot t^\\nu$. The stabilizer of $t^\\nu$ has connected finite-type reductive quotient — the centralizer $Z_G(\\nu)$, connected because a torus centralizer in a connected reductive group is — so the dualizing object generates the stratum on its own and the collection may be taken to be a single object:\n\n$$\n\\#A_\\nu = 1, \\qquad E_\\nu = \\omega_{K\\backslash LX_\\nu}, \\qquad \\Delta_\\nu = i_{\\nu!}\\,\\omega_{K\\backslash LX_\\nu} .\n$$\n\nThis is [Q2-e1-L1](Q2-e1-L1/index.html), resting on [Q2-L2](../Q2-L2/index.html)(i).\n\n*Example 2 — more than one, and the index set named: $X = \\mathrm{GL}_2/\\mathrm{O}_2$.* Here $LX = \\{A\\in\\mathrm{GL}_2(F) : A^t = A\\}$ with $K = \\mathrm{GL}_2(\\mathcal{O})$ acting by $g\\cdot A = gAg^t$ ([$F$, $\\mathcal{O}$](../../../appendix/conv-ring-of-integers.html)), and the strata are indexed by pairs $\\lambda = (p,q)$ with $p\\ge q$. At a diagonal stratum $\\lambda = (p,p)$ the finite-type quotient of the stabilizer is $\\mathrm{O}_2$, whose component group is $\\mathbb{Z}/2$ with the two characters $\\mathrm{triv}$ and $\\mathrm{sgn} = \\det|_{\\mathrm{O}_2}$. One generator per character is then a generating collection, and two are needed:\n\n$$\nA_\\lambda = \\{\\mathrm{triv},\\ \\mathrm{sgn}\\}, \\qquad E_{\\lambda,\\mathrm{triv}} = \\omega_{K\\backslash LX_\\lambda}, \\qquad E_{\\lambda,\\mathrm{sgn}} = \\omega_{K\\backslash LX_\\lambda}\\otimes\\mathrm{sgn},\n$$\n\nwith $\\Delta_{\\lambda,\\mathrm{triv}} = i_{\\lambda!}E_{\\lambda,\\mathrm{triv}}$ and $\\Delta_{\\lambda,\\mathrm{sgn}} = i_{\\lambda!}E_{\\lambda,\\mathrm{sgn}}$ the two standard objects of that one stratum. The dualizing object alone does not generate: $\\mathrm{sgn}$ is right-orthogonal to it in every shift. This is [Q2-e3-L2](../Q2-e3/Q2-e3-L2/index.html)(B), resting on [Q2-L2](../Q2-L2/index.html)(ii)–(iii); the same node's clause (C) shows $\\#A_\\lambda = 4$ at every off-diagonal stratum, so the size of $A_\\lambda$ varies with $\\lambda$ within one $X$.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../appendix/ic-0.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n- **note:** the pointing condition of [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) is exactly the requirement that $\\mathrm{IC}_0\\mapsto\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n  **Ratified reading.** The displayed membership is a genuine finiteness statement — it says the $!$-extension is coherent — and no node in the blueprint derives it. It is imported from main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action, which presupposes it; the same presupposition is what lets [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html) accept $\\mathrm{IC}_0$ in the second slot of its module action. Before 2026-08-05 it was carried only by the grammar of those two entries, and round 1 of [Q1-L2-L3](../../Q1/Q1-L2/Q1-L2-L3/critiques/r1.html) asked for it to be stated; it is stated here so that a proof may cite it rather than infer it from a typing argument. Anyone who later wants it *proved* wants a node about coherence of $!$-extensions on $K\\backslash LX$, which is not in the closed world.\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and [the Satake subcategories](../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n- **note:** main.tex writes the convolution diagram only for the Hecke category itself (main.tex:1096–1102) and describes the action on $LX$ in words — \"which are given by the convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\", main.tex:922. This entry records the reading that the two are the same pull–push construction, which is how every node in the DAG uses $\\ast$.\n\n### [the Satake subcategories](../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@article{GR17vol1,\n    author = {Dennis Gaitsgory and Nick Rozenblyum},\n    title = {A study in Derived Algebraic Geometry, volume 1},\n    year = {2017}\n}\n\n@misc{raskin_dmodules_infinite_var
