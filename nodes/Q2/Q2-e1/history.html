nd unchanged** by `/update` (full walk): examined and unchanged. Its clause (i) says each stratum is $BP_\\nu$ with $P_\\nu$ **connected** and does not call $P_\\nu$ reductive — which it is not — so it was already right about the group [Q2-L2](../Q2-L2/index.html) mis-described, and it is what the walk checked that correction against.\n- **2026-08-06 — statement revised** by `/update Q2-e1` ([u1](updates/u1.html)), on the user's instruction that each Q2 example be readable on its own and declare its polarity. The claim it instantiates is now quoted inside the statement instead of linked, and the statement opens on its polarity — **normalization** — under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html). The mathematics is unchanged.\n- **2026-08-06 — decomposed** by `/decompose Q2-e1` into [Q2-e1-L1](Q2-e1-L1/index.html)–[Q2-e1-L5](Q2-e1-L5/index.html), the first expansion of an example node under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html): an example is a proposition, so it decomposes, its children inherit its role — `example`, never `proof`, so that no aggregate over the proof chain reaches into a computation in one variety — and the edge to them is an ordinary dependency. The cut is one child per clause, with clause (iv) split at the two identifications it pins, and the reassembly is the `## Decomposition` paragraph of [Q2-e1](index.html). The statement was not touched.\n- **2026-08-06 — examined and unchanged against a revised neighbour.** [Q2-L3](../Q2-L3/index.html) was revised this run ([u2](../Q2-L3/updates/u2.html)) and its four hypothesis labels **(A)**–**(D)** are unchanged, so every reference by letter still resolves. What moved is inside them: $\\operatorname{supp}$ and \"the objects supported on $\\partial\\overline{LX}_\\lambda$\" are replaced by $\\mathcal{D}^{\\mathrm{ren}}_T$, defined as the objects killed by $i_\\mu^!$ for every $\\mu\\notin T$, with $\\partial\\lambda$ and $\\overline{\\lambda}$ the index sets below and up to $\\lambda$. Clauses (ii) and (iii) of this node verify hypotheses **(A)**, **(C)** and **(D)** of [Q2-L3](../Q2-L3/index.html) in the group case, and all three still hold as revised — indeed more easily. With $\\overline{\\mathrm{Gr}}_\\nu=\\bigsqcup_{\\mu\\le\\nu}\\mathrm{Gr}_\\mu$ over finitely many dominant $\\mu\\le\\nu$, the index set $\\partial\\nu$ *is* the finite set clause (ii) already reasons over, so the revision removes the step that had to pass between \"$LX_\\mu\\subseteq\\partial\\overline{LX}_\\nu$\" and \"$\\mu<\\nu$\"; and (C) is now an inclusion, which is weaker than what the finite induction there establishes. [Q2-e1-L2](Q2-e1-L2/index.html) and [Q2-e1-L3](Q2-e1-L3/index.html) inherit this unchanged.\n- **2026-08-07 — the statement now says, explicitly, how the example stands to its parent** by `/update`. The relation was in the prose and said differently in each of the four examples, so no reader could line them up. Every Q2 example now carries the same block immediately after its polarity line, in four fixed slots: whether $X$ is in the standing class, whether it meets [Q2](../../../dag.html)'s conjecture's hypotheses, whether the membership the problem statement asks about holds, and what the case contributes to the main theorem — each linked to the [key-example register](../../../key_examples/index.html) entry that settles it in print. Its four slots: in the standing class, meets every hypothesis of the conjecture, the membership holds — and contributes nothing, because [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the monoidal unit here. It is [K9](../../../key_examples/k9.html), `degenerate`.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
