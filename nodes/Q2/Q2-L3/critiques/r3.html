complete in both files.** The false sentence — \"It is not a\nconsequence of **(H1)**–**(H3)**: u1 exhibits a model of all three in which it fails\" — is gone\nfrom the node and from the draft's copy; the surviving first sentence of **(B)**'s gloss is the\none [u3](../updates/u3.html) kept, verbatim. The fixed-collection sentence is in both at the same\nplace, and the write-up consumes it at Step 5 (\"the $\\Delta_{\\lambda,a}$ being those of the one\ngenerating collection the Lemma fixes\"), which is exactly where r2's Flaw 7 said the ambiguity\nwould have bitten. I did not re-argue the counter-model, per instruction.\n\n**The closed world holds.** The eight appendix targets all resolve as files with the matching\n`<a id=\"...\">`: [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html),\n[the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html),\n[Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html),\n[$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html),\n[$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html),\n[$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html),\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html),\n[$\\mathrm{IC}_0$](../../../../appendix/ic-0.html). The node links\n([Q2-L1](../../Q2-L1/index.html), [Q1-L5](../../../Q1/Q1-L5/index.html)) exist and `#q1`\nresolves in [main_dag](../../../../dag.html). No bib key, no `\\label`. The `uses:` line\nmatches the node's `objects:` exactly. Nothing outside that plus Q2-L1 is used: I looked in\nparticular for [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html),\n[orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), placidity, a dimension\ntheory, a theory of supports and the sibling abstraction\n[Q2-L3-z1](../Q2-L3-z1/index.html) — none is invoked, and $\\operatorname{supp}$ does not\noccur.\n\n**The passage to Q1's equality does not smuggle in `assum:intro`(c).** [Q1](../../../../dag.html)\nis asked with (c) suspended while [Q2](../../../../dag.html)'s Setting has (a)–(c), so a\nQ2 node that closed on Q1's display by way of the unramified conjecture would be trading on the\nsuspension. Step 14 uses only the ratified reading of\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html)\nand $\\mathcal{D}_c\\subseteq\\mathrm{Ind}\\,\\mathcal{D}_c$; (c) enters nowhere, and the display it\nlands on — including the $=_{\\mathcal{D}_c(K\\backslash LX)}$ subscript — is character-for-character\nQ1's Problem statement.\n\n**Handedness and typing.** $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\to\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ with left adjoint $i_{\\lambda!}$ running the\nother way, counit $i_{\\lambda!}i_\\lambda^!\\to\\mathrm{id}$ on the ambient — which is the map\n**(B)**, Step 8 and Step 10 name, and the direction Step 3's shift identity is typed in. Step 11's\ncofibre-to-fibre exchange is the stable identity applied to\n$i_{\\lambda!}i_\\lambda^!P_{\\lambda,a}\\to P_{\\lambda,a}\\to Q_{\\lambda,a}$, giving\n$\\operatorname{fib}(P_{\\lambda,a}\\to Q_{\\lambda,a})$ and not $\\operatorname{fib}(Q\\to P)$; the two\nends named are the ones the fibre sequence has. Every `\\simeq` and the closing `=` carries its\nambient. No functor is claimed continuous that is not; nothing about compact generation or\nrenormalization is asserted beyond $\\mathcal{D}^{\\mathrm{ren}}=\\mathrm{Ind}\\,\\mathcal{D}_c$.\n\n**The split did not lose a link.** I checked each step's inputs against what precedes it. Step 3\n→ Step 2 (stability of both categories); Step 6 → Step 4 (antisymmetry) and Step 5 (minimality);\nStep 7 → Step 6 (the generators) and Step 1 (Sat is a cocomplete stable subcategory of the ambient\nwhere **(C)**'s bracket is formed — the ambients match); Step 8 → Step 2; Step 9 → **(B)**,\n**(D)**, Step 7; Step 10 → **(D)**, Step 3, the definition $\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$;\nStep 11 → Steps 8, 10, 1 and **(D)**; Step 12 → Steps 11 and 5; Step 13 → Step 12 and\n[Q2-L1](../../Q2-L1/index.html)(ii); Step 14 → Step 13. In every case the neighbour establishes\nwhat it is cited for. One ordering inversion survives, at Flaw 1 below, and it is not a loop:\nStep 2 does not use Step 1.\n\n**Minimality is now airtight under both readings.** Step 6 derives $\\lambda\\not\\le\\mu$ from Step 4\nbefore invoking minimality, so the inference $\\mu\\in\\partial\\lambda\\Rightarrow\\mu\\notin S$ goes\nthrough whether \"minimal\" is read strictly or in the preorder sense — which is what r1's Flaw 2\nwas about, and it is now closed rather than caveated. Transitivity of $\\le$ is nowhere used and\nnowhere claimed. Step 4's own chain holds: closures agree by monotonicity, $Z\\ne\\emptyset$ because\neach stratum is an orbit image through a $k$-point, both strata are open and dense in $Z$, and two\ndense opens of a nonempty space meet ($U\\cap V$ is dense whenever $U$ is open dense and $V$ dense).\n\n**Hypotheses all consumed, none idle, and the base case is subsumed.** (A) at Step 5, (C) at\nStep 7, (B) at Step 9, (D) at Steps 9–11. Drop any one and the named step has no input. When\n$\\partial\\lambda=\\emptyset$, **(C)**'s bracket has no generators, so $\\langle\\emptyset\\rangle=0$,\nStep 9 gives $Q_{\\lambda,a}\\simeq 0$ and Step 11 reads $\\Delta_{\\lambda,a}[n_{\\lambda,a}]\\simeq\nP_{\\lambda,a}$ — through **(C)** and not through any conservativity of $\\{i_\\mu^!\\}$, as the\nCaveat says. The closing disclosure is true: the sole dependency\n[Q2-L1](../../Q2-L1/index.html) is `proved`.\n\n**The four repairs landed.** r2 Flaw 1: \"coherent $\\mathcal{D}$-modules\" is gone, Step 2 now takes\nthe second option verbatim — stability of the small $\\mathcal{D}_c(\\mathcal{Y})$ asserted as\nstandard mathematics needing no citation, then $\\mathrm{Ind}$ of a small stable category, then\n[the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) at both\n$\\mathcal{Y}$ — and the $m<0$ case is explicitly covered at Step 3 (\"commutes with $[1]$ and\ntherefore with its inverse $[-1]$, hence with $[m]$ for every integer $m$\"). r2 Flaw 2: no\nabbreviation of either Satake subcategory survives anywhere, headings and notation line included;\nthe only capital $S$ is the failure set, a different glyph from the retired $\\mathcal{S}$ and\ncoined in its own display. r2 Flaw 3: \"distinct orbits are disjoint\" is replaced by an explicit\n\"Argue now on underlying spaces\" plus a partition clause sourced to the entry (residue at Flaw 3\nbelow). r2 Flaw 4: the five-claim step is now Steps 8–12, and these are five genuine claims with\nfive separate reasons, not one argument relabelled.\n\n---\n\n## Flaws in the write-up\n\n**Flaw 1** [MINOR] — Step 1 asserts closure under fibres *formed in the ambient* one step before Step 2 establishes\nthat the ambient is stable and so has those fibres at all.\n\n<details><summary>(Step 1, \"closed under small colimits, under shifts in both directions, and\nunder fibres formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\") · the finding</summary>\n\nRead in order, Step 1's last clause\nmentions a construction nothing yet says exists —\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) types its\nambient as $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and imposes no stability on it, which is\nprecisely what r1's Flaw 1 was about. No circularity: Step 2 does not use Step 1, so swapping the\ntwo steps repairs it outright. This is an artefact of the split, and it is the only one I found.\n\n</details>\n\n**Flaw 2** [MINOR] — $Z$ is a third coined symbol, and it is coined inline with `=:` inside a sentence.\n\n<details><summary>(Step 4, \"$\\overline{LX}_\\mu=\\overline{LX}_\\lambda=:Z$\"; notation line, \"the\nonly symbols coined below are the failure set $S$ at Step 5 and the counit cofibre $Q_{\\lambda,a}$\nat Step 8\") · the finding</summary>\n\nTwo rules bite:\nnotation is coined in its own `$$…$$` block and inline `$…$` never introduces a symbol; and the\nwrite-up's own notation line, which says which symbols are coined, is therefore false as written —\nthe one line whose whole job is to be an accurate inventory. Cheapest repair is to drop the name:\n\"so the two closures coincide, and their common value is nonempty because …\", carrying \"the common\nclosure\" through the remaining three clauses.\n\n</details>\n\n**Flaw 3** [MINOR] — Better than r2's target, and the underlying-spaces reading is now stated where it is used.\n\n<details><summary>(Step 4, \"Since $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ is *the poset of\n$L^+G$-orbits* of $LX$ (same entry), the strata partition $LX$\") · the finding</summary>\n\nWhat is\nstill an inference rather than a quotation is the word *partition*:\n[Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)\nsays \"the posets of $I$-orbits, respectively $L^+G$-orbits\" and its ratified reading (ADR 0028)\nmakes a stratum an fpqc-sheaf image through a $k$-point; from there, disjointness of *underlying\ntopological spaces* of distinct strata — which is what Step 4 consumes, the intersection point\nproduced by the dense-opens argument being a point of the space and not necessarily a $k$-point —\nis one step past \"orbits of a group action on a set are disjoint\". The step is standard and I do\nnot fault the write-up for taking it, but it is the residue of r2's Flaw 3 and the honest home for\nit is the entry, not this step (see Findings).\n\n</details>\n\n**Flaw 4** [MINOR] — \"That clause\" has two antecedents in the same sentence and the nearer one is the Lemma's own\nclosing clause — i.e. the thing being proved.\n\n<details><summary>(Step 13, \"whose hypotheses **(H1)**–**(H3)** of Q1-L5 the Lemma's closing\nclause puts in force; that clause yields $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}=\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\") · the finding</summary>\n\nThe yielding is done by\n[Q2-L1](../../Q2-L1/index.html)(ii); as written a hurried reader can parse Step 13 as deriving\nthe conclusion from the statement of the conclusion. One word fixes it: \"Q2-L1(ii) then yields\".\nThe mathematics is right — Step 12 is character-for-character the right-hand side of Q2-L1(ii),\nincluding the quantification over the one fixed collection, so clause (iii) is not even needed.\n\n</details>\n\n## Length, the split signal, and the seam\n\nAt 1257/1500 the draft is 257 words past the split signal, which fails nothing. I do not accept\nthe accounting offered for it, and I do agree with the diagnosis of where the seam is.\n\n**Flaw 5** [MINOR] — Half of that is not true, and it is checkable.\n\n<details><summary>(the round's response, \"what ADR 0043 and the no-abbreviation convention cost\";\nthe file itself is not at fault) · the finding</summary>\n\nThe gate counts whitespace-separated tokens after\ndeleting `$$`-only lines ([tools/check_render.py](../../../../../tools/check_render.py):198), so\n`$\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$` is **one token**, exactly as\n`$\\mathcal{S}$` was: writing the name out cost approximately zero words. What the split genuinely\ncost is six extra headings and the re-fixing phrases (\"at that $\\lambda$ and $a$\"), on the order of\n120–150 words; the rest of the +360 is elaboration r2 asked for at Steps 2 and 4, plus new\nconnective prose. Worth correcting because the split-signal note should be answered with the true\ncause, and because the true cause says the remedy is relocation rather than compression.\n\n**The seam is real, and Steps 1–4 are it.** None of the four touches (B)–(D); all four are\ngeneric. Concretely, in the order I would do them:\n\n1. **Step 1 (≈85 words → ≈30).** Its conclusion is already *printed* in the entry it cites:\n   [the Satake subcategories](../../../../appendix/def-satake-subcategory.html)\n   says \"a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ …, closed\n   under arbitrary colimits and under retracts, since that is what the generation operation …\n   produces\". Re-deriving it from the entry's display plus\n   [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is a second\n   copy of a sentence the closed world already holds. Cite it instead. This is the prover's to do,\n   needs no new entry, and disposes of Flaw 1 in passing.\n2. **Step 2 (≈70 words → ≈10).** \"$\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$ is stable\" is a fact\n   about [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) and about\n   nothing in this node. As a note on that entry it is written once and shortens every Q2 and Q3\n   write-up that forms a fibre or a shift in $\\mathcal{D}^{\\mathrm{ren}}$. This is the compounding\n   remedy ADR 0060 names, and it is the lead-researcher's.\n3. **Step 3 (≈90 words → ≈10).** \"$i_{\\lambda!}$ is exact, hence commutes with every $[m]$\" is a\n   property of standing hypothesis **(H1)**, not of this lemma. The note on\n   [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html)\n   already routes the existence of $i_{\\lambda!}$ to (H1); a companion sentence there would serve\n   Q2-L4, Q2-L5 and Q2-L7 identically.\n4. **Step 4 (≈130 words, the largest single block).** I do **not** recommend the cheap fix of\n   citing the word \"poset\" off [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html):\n   the node's [history](../history.html) already ruled (2026-08-06) that the entry introduces\n   the closure order separately from the poset structure, so that inference \"does not follow\", and\n   the write-up correctly *proves* antisymmetry as that ruling anticipated. The relocation is\n   therefore a lead-researcher decision about the vehicle — a ratification note on the entry\n   identifying its order with the closure order, carrying this three-line proof, or a small node —\n   and until one exists Step 4 belongs where it is.\n\nItems 1–3 alone bring the write-up to roughly 1050; with 4 it lands near 920, under the signal,\nand what is left is the dévissage and nothing else. I would not `/decompose`: four unrelated\ngeneric facts do not make one proposition, and the abstraction node that *would* absorb Steps 5–12,\n[Q2-L3-z1](../Q2-L3-z1/index.html), already exists on the z-axis with `instances:` naming\nthis node.\n\n</details>\n\n## Findings for the lead-researcher\n\n**Flaw 6** [MINOR] — [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)\nnever says the strata are pairwise disjoint or that they partition $LX$; every node that argues on\nthe stratification has to read it off \"the posets of … orbits\".\n\n<details><summary>(the entry, not the write-up) · the finding</summary>\n\nAdding the clause to the entry —\ndistinct strata are disjoint, and $\\lambda\\mapsto LX_\\lambda$ is a bijection onto them — would\nclose Flaw 3 here and in the seven other Q2/Q3 nodes that lean on the same phrase.\n\n</details>\n\n**Flaw 7** [MINOR] — **(B)**'s surviving gloss, \"This is the localization triangle a recollement of $LX_\\lambda$ inside\nits closure supplies\", invites the same misreading in the other direction as the sentence u3\ndeleted: (H1) is a recollement of $LX_\\lambda$ inside $LX$, not inside its closure, and the record\n([u3](../updates/u3.html), priority P42) says nothing in the DAG supplies **(B)**.\n\n<details><summary>(statement-level, and only a wording risk) · the finding</summary>\n\n\"would supply\" in\nplace of \"supplies\" would keep what u3 wanted the sentence for without the suggestion that it is in\nforce.\n\n</details>\n\n**Flaw 8** [MINOR] — [Q2-L3_node.md](../index.html):13 still reads `critique: [r1.md](critiques/r1.md)` with r2 on\ndisk, and the generated `BEGIN FLAW` block still names u2 (\"Revised (u2) and not yet re-proved\")\nafter u3. Neither is the prover's and neither affects the mathematics, but the node file currently\nunder-reports its own record.\n\n<details><summary>(bookkeeping, the orchestrator's) · the finding</summary>\n\nr2's Flaw 6 — [Q2-L4](../../Q2-L4/index.html) and [Q2-L5](../../Q2-L5/index.html) still\ndischarging **(C)** and **(D)** in the retired $\\operatorname{supp}$ vocabulary — stands, unchanged\nby this round and out of scope by instruction.\n\n</details>\n\n---\n\nDisposition: no `FATAL`, no `MAJOR`, and the statement is true — I verified the implication end to\nend and could not construct a case admitted by (A)–(D) in which the conclusion fails. Flaws 1, 2\nand 4 are the prover's and cost three sentences between them; Flaw 3 is disposed of by this verdict\nand answered properly by Flaw 6, which is the lead-researcher's along with Flaws 7 and 8. Flaw 5 is\nan accounting correction, not a defect in the file. The seam analysis is a recommendation and not a\ncondition of the pass.\n\nVERDICT: PASS\n";</script>
