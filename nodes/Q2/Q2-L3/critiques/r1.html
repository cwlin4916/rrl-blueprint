plus [Q2-L1](../../Q2-L1/index.html) is used — I looked in particular for a\nsilent appeal to [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) or to placidity and found\nnone.\n\n**Handedness.** With $i_{\\lambda!}\\dashv i_\\lambda^!$ (H1), the counit is\n$i_{\\lambda!}i_\\lambda^!\\to\\mathrm{id}$ — which is the map (B) and Step 6 name. Correct.\nStep 7's $i_{\\lambda!}$ runs $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\to\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, the direction the left adjoint of $i_\\lambda^!$\nhas. Step 8's fibre/cofibre exchange is the stable-category identity, applied to a map\nbetween two objects of a full subcategory closed under fibres. All type-check.\n\n**Nothing dropped is later needed.** Full faithfulness of $i_{\\lambda!}$ and continuity of\n$i_\\lambda^!$ are genuinely unused: the only properties consumed are left-adjointness (Step 2,\nvia colimit preservation $\\Rightarrow$ exactness $\\Rightarrow$ shift commutation) and the\nexistence of the counit (Step 6). (H2)–(H3) enter only through\n[Q2-L1](../../Q2-L1/index.html)(ii) at Step 9, where the Statement's own \"Consequently\"\nclause puts them in force and the [Q2](../../../../dag.html) framing carries them as\nstanding. Step 9 is exemplary in naming Q2-L1(ii) as the source rather than re-deriving it,\nand Step 10 discharges the passage to the small categories from the ratified reading in\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html) plus\n$\\mathcal{D}_c\\subseteq\\mathrm{Ind}\\,\\mathcal{D}_c$, which is correct.\n\n**Strictness at the boundary (Step 4) survives.** $LX_\\lambda$ is the $L^+G$-orbit image\nthrough a $k$-point by the ratified reading of\n[Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), hence\nnonempty; $\\partial\\overline{LX}_\\lambda$ is its complement in the closure; so $LX_\\mu\\subseteq\n\\partial\\overline{LX}_\\lambda$ f able\". The conclusion is nonetheless correct and available from a\ndeclared object one line away: by\n[the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) both categories are\n$\\mathrm{Ind}$ of a category of coherent $\\mathcal{D}$-modules, and $\\mathrm{Ind}$ of a stable\ncategory is stable. Not fatal — stability here is standard mathematics needing no citation —\nbut stability is exactly what Steps 7 and 8 run on, so the sentence that asserts it should\ncarry a valid reason.\n\n</details>\n\n**Flaw 2** [MINOR] — The caveat is honest, and the reading it takes is the one that makes Step 4 $\\Rightarrow$\nStep 5 go through: Step 4 delivers only $\\mu\\le\\lambda$ with $\\mu\\ne\\lambda$, whereas\npreorder-minimality excludes from $S$ only those $\\mu$ with $\\mu\\le\\lambda$ and\n$\\lambda\\not\\le\\mu$.\n\n<details><summary>(Caveats, \"**\"Minimal\" in (A)** is the standard sense used at Step 3; it\nagrees with the preorder sense … exactly when the closure order is antisymmetric.\") · the finding</summary>\n\nSo under the other reading the inductive step fails outright, and the\ndraft is choosing the *stronger* of two readings of a hypothesis — disclosed, but still a\nstrengthening if the weaker reading is defensible.\n\nIt is not defensible, and the caveat can simply be discharged from objects already declared.\n[$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) calls $\\Lambda_X^+$ the *partially\nordered* set indexing the $L^+G$-orbits, with $\\lambda\\mapsto LX_\\lambda$ a bijection onto\nthe strata. And antisymmetry of the closure order is a three-line consequence: if\n$LX_\\mu\\subseteq\\overline{LX}_\\lambda$ and $LX_\\lambda\\subseteq\\overline{LX}_\\mu$ then\n$\\overline{LX}_\\mu=\\overline{LX}_\\lambda$; both $LX_\\lambda$ and $LX_\\mu$ are open in that\ncommon closure ($j_\\bullet$ open, by\n[Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)) and dense\nin it (it is their closure), two dense opens of a nonempty space meet, distinct orbits are\ndisjoint, so $LX_\\lambda=LX_\\mu$ and $\\lambda=\\mu$. One sentence replaces the caveat and\nremoves the only place where the write-up's reading of a hypothesis could be disputed.\n\nRelated, and not an error: (A) as stated — every nonempty subset has a minimal element — *is*\nwell-foundedness for a partial order, so no separate justification is owed. Step 3's \"The\ninduction is well-founded recursion on the closure order\" over-describes what happens, which\nis a single application of (A) to $S$; transitivity of $\\le$ is nowhere needed.\n\n</details>\n\n**Flaw 3** [MINOR] — I verified the caveat's premise: `\\operatorname{supp}`, `\\mathrm{supp}` and \"supported on\"\nappear nowhere in [appendix.md](../../../../appendix/index.html), and nowhere in\n[context.md](../../../../context.html).\n\n<details><summary>(statement-level; Caveats, \"Support is consumed only as a matched symbol\") · the finding</summary>\n\nSo the Statement introduces\n$\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ through a notion the closed world does not\ndefine, and (B) and (D) quantify over $\\operatorname{supp}$ with no entry behind it. The\nwrite-up's response is the correct one and I endorse it: (D)'s support conclusion is (B)'s\nhypothesis *verbatim* and (B)'s conclusion is (C)'s left side *verbatim*, so no unfolding is\nrequired and the argument is valid under any single fixed reading. The write-up is not at\nfault.\n\nThe finding is for the lead-researcher. As things stand (B) and (C) are not yet propositions\nwith determinate truth values, so no node can discharge them; and the compatibility that\nQ2-L4/Q2-L5 will then have to check — that the $\\operatorname{supp}$ of (D) and the\n$\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ of (C) are the *same* notion — is precisely\nwhat this write-up gets for free by symbol matching.\n\nTwo smaller readings are also unfixed and should be fixed with it. (i)\n$\\partial\\overline{LX}_\\lambda:=\\overline{LX}_\\lambda\\setminus LX_\\lambda$ carries no scheme\nstructure — [$\\overline{LX}_\\lambda$](../../../../appendix/def-orbit-closure.html) supplies the\nreduced closure and nothing about the complement — so \"$LX_\\mu\\subseteq\n\\partial\\overline{LX}_\\lambda$\" in (C) and at Step 4 must be read on underlying spaces. Step 4\nis correct under that reading and under no other; it would be worth one clause saying so.\n(ii) The $\\Delta_{\\mu,b}$ of (C) and those of the conclusion must come from the *same*\nstratumwise choice of generating collections, which\n[$\\{E_{\\lambda,a}\\}$](../../../../appendix/not-standard-objects.html) explicitly leaves open; the\nshared symbols carry this implicitly, and Q2-L1(iii) would repair it if pressed.\n\n</details>\n\n**Flaw 4** [MINOR] — This is an assertion inside the reproduced Statement, and no step of the write-up addresses\nit, nor does the write-up say that it is orientation rather than a proof obligation.\n\n<details><summary>(Lemma, closing paragraph: \"Hypothesis (A) holds, in particular, whenever\nevery orbit closure contains only finitely many orbits …\") · the finding</summary>\n\nContrast\nStep 9, which names Q2-L1(ii) as the source of the \"Consequently\" clause instead of pretending\nto prove it — the same honesty is owed here. Note that the clause *cannot* be discharged in\nthis node's closed world: Q1-L6-L1 and Q1-L5-e4 are neither in `depends-on` nor in the\nappendix, so naming them proves nothing here. (The implication itself is true, given the\nantisymmetry of Flaw 2 and transitivity of $\\le$: for $S\\ne\\emptyset$ and $\\lambda\\in S$, the\nset $\\{\\mu\\in S:\\mu\\le\\lambda\\}$ is finite and nonempty, and any minimal element of it is\nminimal in $S$.)\n\n</details>\n\n**Flaw 5** [MINOR] — Read alone the heading is a universal claim about $\\lambda$; it holds only for the minimal\n$\\lambda$ fixed at Step 3, since its proof runs through Step t stays this node's obligation\".\n\n<details><summary>(DAG-level, not the write-up) · the finding</summary>\n\nBut Q2-L3's `depends-on` is\n[Q2-L1](../../Q2-L1/index.html) alone, and a grep over the DAG finds no node charged with\nthe counit-cofibre statement: the Q2 framing routes (C) and (D) to Q2-L4/Q2-L5, and the only\nnode about extension by zero, Q1-L5-L4, is a Q1 node this one may not depend on. So after this\nround Q2-L3 is a correct implication whose second antecedent nothing is scheduled to supply.\nThat is exactly the residue the earlier `GAP (Supp)` named, now relocated from the write-up\ninto the statement — a legitimate move, but one that should show up as a new node rather than\nas a hypothesis nobody owns.\n\n</details>\n\nVERDICT: PASS\n";</script>
