$LX$](../../../../appendix/def-orbits-iwahori-spherical.html),\n[$\\overline{LX}_\\lambda$](../../../../appendix/def-orbit-closure.html),\n[$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html),\n[$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html),\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html),\n[$\\mathrm{IC}_0$](../../../../appendix/ic-0.html); `#q1` and `#q2` resolve in\n[main_dag](../../../../dag.html); `updates/u1.md` and the two node links exist. No bib key is\ncited and no `\\label` is claimed, so there is nothing to hallucinate. I looked specifically for the\nfour things the round was told to watch — [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html),\nplacidity, a theory of supports, a dimension theory — and none is used. The word\n$\\operatorname{supp}$ does not occur. The `uses:` line matches the node's `objects:` exactly.\nQuoting **(H1)**–**(H3)** off [Q1-L5](../../../Q1/Q1-L5/index.html) across the question boundary\nis licensed: the [Q2](../../../../dag.html) framing puts the package in force as standing, and\nthe note on [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html)\npoints at that same hypothesis by name.\n\n**$\\mathcal{D}^{\\mathrm{ren}}_T$ is used only as a definition.** I traced every occurrence. Step 5\nuses **(C)**'s inclusion and nothing about the left-hand side; Step 6 uses **(D)**'s membership as\n**(B)**'s hypothesis verbatim and **(B)**'s conclusion as Step 5's left-hand side verbatim. No step\nneeds $\\mathcal{D}^{\\mathrm{ren}}_T$ to be stable, cocomplete, or closed under anything. The base-case\nCaveat derives $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}=0$ from $\\langle\\emptyset\\rangle=0$\n**through (C)**, not from joint conservativity — which is the one place an unstated appeal to\n**(H3)** would have been tempting, and it is not made. This is exactly what invariant I28 asks for.\n\n**Step 3 (antisymmetry) is sound, and it is needed.** Each link holds: closures agree because\n$\\overline{LX}_\\lambda$ is closed and both closures are reduced; $Z\\ne\\emptyset$ because the ratified\nreading of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)\nmakes each stratum an orbit image *through a $k$-point*; $LX_\\lambda$ and $LX_\\mu$ are open in $Z$\nbecause $j_\\lambda$ and $j_\\mu$ are open embeddings into $\\overline{LX}_\\lambda$ and\n$\\overline{LX}_\\mu$, which coincide; each is dense because $Z$ is its closure and $Z$ is closed in\n$LX$, so closure-in-$Z$ equals closure-in-$LX$ intersected with $Z$. It is needed at exactly one\nplace: Step 4 uses the strict reading of \"minimal\", and antisymmetry is what makes it agree with the\npreorder reading. Transitivity is nowhere used, and correctly nowhere claimed. Reading everything on\nunderlying spaces is the right reading and the draft says so.\n\n**Handedness and typing.** With $i_{\\lambda!}\\dashv i_\\lambda^!$ the counit is\n$i_{\\lambda!}i_\\lambda^!\\to\\mathrm{id}$ — the map **(B)** and Step 6 name. $i_{\\lambda!}$ runs\n$\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\to\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, the\ndirection a left adjoint of $i_\\lambda^!$ has. Step 6's fibre/cofibre exchange is the stable identity\napplied to a map inside a full subcategory closed under ambient fibres. Step 8's two ambients are\ncorrect and the small/renormalized distinction is respected throughout. All type-check.\n\n**Steps 7–8 discharge, they do not re-derive.** Step 7 names [Q2-L1](../../Q2-L1/index.html)(ii)\nas the source and checks its hypotheses are the ones the Lemma's closing clause puts in force. Step 8\nruns $\\mathcal{D}_c^{\\mathrm{Sat}} = \\mathcal{D}_c\\cap\\mathcal{S} = \\mathcal{D}_c\\cap\\mathcal{D}^{\\mathrm{ren}}\n= \\mathcal{D}_c$ off the ratified reading plus $\\mathcal{D}_c\\subseteq\\mathrm{Ind}\\,\\mathcal{D}_c$.\nBoth correct. The closing disclosure — no unproved dependency — is true: Q2-L1 is `proved`.\n\n**Hypotheses all consumed, none idle.** (A) at Step 4, (C) at Step 5, (B) and (D) at Step 6. Drop any\none and the named step has no input. The weakening of (C) to an inclusion survives: (C) is consumed\nonly through the single object $Q_{\\lambda,a}$, so the reverse containment is genuinely unused, as\nthe statement's own gloss claims.\n\n**r1's flaws, disposed of.** Flaw 1 (Step 2's non-sequitur) is replaced — see Flaw 3 below for the\nresidue. Flaw 2 (the preorder caveat) is now Step 3, proved. Flaw 3 ($\\operatorname{supp}$) is what\nu2 repaired. Flaw 4 (the finiteness orientation clause) is out of the statement. Flaw 5 (Step 5's\nheading read as universal) is fixed by \"at that $\\lambda$\" in both headings. Flaw 6 is out of scope\nby instruction. Flaw 7 recurs below. Nothing r1 raised has been reintroduced.\n\n---\n\n## Flaws in the write-up\n\n**Flaw 1** [MINOR] — Better than r1's target, but the chain still has an unsourced link and an undeclared one.\n\n<details><summary>(Step 2, \"each of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$,\n$\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ is $\\mathrm{Ind}$ of a category of coherent\n$\\mathcal{D}$-modules, hence stable ($\\mathrm{Ind}$ of a stable category is stable)\") · the finding</summary>\n\n[the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) gives\n$\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})=\\mathrm{Ind}(\\mathcal{D}_c(\\mathcal{Y}))$ and says nothing\nabout what $\\mathcal{D}_c$ is; the identification of $\\mathcal{D}_c$ with coherent $\\mathcal{D}$-modules\nis [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), which is **not**\nin this node's `objects:`. And neither entry says $\\mathcal{D}_c$ is *stable*, which is the premise\n\"$\\mathrm{Ind}$ of a stable category is stable\" actually runs on — that $\\mathcal{D}_c$ is closed\nunder shifts and cones inside $\\mathcal{D}$ is standard, but it is a step, and the sentence presents\nthe conclusion as read off a declared entry. Stability is load-bearing here (Step 2 needs $[m]$ for\n$m<0$, so suspension alone will not do, and Steps 1, 5 and 6 all run on it), so the one clause is\nworth writing. Either declare\n[coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) and add the\nclosed-under-cones sentence, or say plainly that stability of $\\mathcal{D}_c$ is standard mathematics\nneeding no citation.\n\n</details>\n\n**Flaw 2** [MINOR] — [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) states a\nconvention in terms: \"Neither object is abbreviated: both are written out wherever they occur.\"\n\n<details><summary>(notation line, \"$\\mathcal{S}$ is the renormalized\n$\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$\") · the finding</summary>\n\nThe\ndraft abbreviates one of the two. The disclosure in the notation line and the fact that the small one\nstays written out contain the damage, and Step 8 navigates the distinction correctly — but the\nconvention exists precisely to protect Step 8, and a write-up may not locally repeal a declared\nentry's convention. Either write it out or get the entry amended.\n\n</details>\n\n**Flaw 3** [MINOR] — Under the ratified reading (ADR 0028) a stratum is an fpqc-sheaf *image*, and the conclusion is being\ndrawn from a nonempty intersection of underlying spaces, whose points need not be $k$-points.\n\n<details><summary>(Step 3, \"distinct orbits are disjoint\") · the finding</summary>\n\nThat\ndistinct orbits are disjoint is standard and the entry does call $\\{LX_\\lambda\\}$ *the poset of\norbits*, which partitions; but on an ind-scheme of infinite type the inference from \"the spaces meet\"\nto \"the orbits coincide\" deserves the half-sentence it does not get. Fillable in one clause.\n\n</details>\n\n**Flaw 4** [MINOR] — Step 6 asserts five things: the coinage of $Q_{\\lambda,a}$, the applicability of **(B)**, the\nidentification of the counit's source, the fibre/cofibre exchange, and the closure of the induction\n($S=\\emptyset$).\n\n<details><summary>(Step 6, ADR 0043) · the finding</summary>\n\n\"A proof step is one claim.\" The write-up is at 897 of 1500 words, so there is room\nto split — the last sentence in particular is the contradiction that closes Step 4's supposition and\nbelongs in its own step.\n\n</details>\n\n## Findings for the lead-researcher\n\n**Flaw 5** [MAJOR] — **This is false for (B) as now stated**, and I can check it directly.\n\n<details><summary>(Statement / proof.md:38, \"It is not a consequence of **(H1)**–**(H3)**:\n[u1](../updates/u1.html) exhibits a model of all three in which it fails\") · the finding</summary>\n\n[u1](../updates/u1.html)'s model\ntakes one category $\\mathcal{E}$ for the ambient and for every stratum, with every $i_\\mu^!$ and\n$i_{\\mu!}$ the identity. Under the *new* coinage\n$\\mathcal{D}^{\\mathrm{ren}}_T=\\{M: i_\\mu^!M\\simeq0\\ \\forall\\mu\\notin T\\}$ that model gives\n$\\mathcal{D}^{\\mathrm{ren}}_T=0$ for every $T\\subsetneq\\Lambda_X^+$ and\n$\\mathcal{D}^{\\mathrm{ren}}_{\\Lambda_X^+}=\\mathcal{E}$. So:\n\n- if $\\overline{\\lambda}\\ne\\Lambda_X^+$, **(B)** quantifies over $P\\simeq0$ alone, and\n  $\\operatorname{cofib}(0\\to0)=0\\in\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$;\n- if $\\overline{\\lambda}=\\Lambda_X^+$, the counit is the identity, so the cofibre is again $0$.\n\nEither way **(B)** holds in u1's model. The model refutes the *old*, $\\operatorname{supp}$-based (B)\n— equivalently, unrestricted extension by zero — and the very change u2 made is what defuses it: the\nhypothesis on $P$ was strengthened from a support condition to the vanishing of all\n$i_\\mu^!$, $\\mu\\notin\\overline{\\lambda}$, and that vanishing is exactly what collapses the model's\nsupply of test objects. Citing a record that no longer says what it is cited for is the same defect\nclass as an appendix entry mis-stating its source.\n\nThe substantive part, which the node should carry instead: under **(H1)** alone, half of **(B)**'s\nconclusion is *free*. Writing $Q=\\operatorname{cofib}(\\epsilon_P)$ and using that $i_\\lambda^!$ is\ncontinuous between stable categories, hence exact,\n\n$$\ni_\\lambda^!Q\\ \\simeq\\ \\operatorname{cofib}\\left(i_\\lambda^!\\epsilon_P\\right)\\ \\simeq\\ 0 ,\n$$\n\nbecause $i_{\\lambda!}$ is fully faithful, so the unit $\\mathrm{id}\\to i_\\lambda^!i_{\\lambda!}$ is an\nequivalence and the triangle identity makes $i_\\lambda^!\\epsilon_P$ one. And for $\\nu\\notin\\overline{\\lambda}$,\nsince $i_\\nu^!P\\simeq0$,\n\n$$\ni_\\nu^!Q\\ \\simeq\\ \\left(i_\\nu^!\\,i_{\\lambda!}\\,i_\\lambda^!P\\right)[1] .\n$$\n\nSo **(B)** is *equivalent*, given **(H1)**, to\n$i_\\nu^!\\,i_{\\lambda!}\\,i_\\lambda^!P\\simeq0$ for every $\\nu\\notin\\overline{\\lambda}$ and every\n$P\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$ — extension by zero *restricted to the image of\n$i_\\lambda^!$ on $\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$*. Whether **that** follows from\n**(H1)**–**(H3)** is open; I could not settle it either way, and it is a smaller question than the one\nu1 closed. Since only `/update` may touch a `## Statement`, this cannot be repaired by a re-proof\nround: the gloss should be deleted or restated, and the residual question routed. Note also that\nCLAUDE.md puts commentary in `<id>_history.md`, not inside the statement, which would have kept this\nsentence out of the claim in the first place.\n\n</details>\n\n**Flaw 6** [MAJOR] — u2 says \"[Q2-L4] proves the equality and so supplies the inclusion a fortiori\" and that (D) is\nsupplied by [Q2-L5](../../Q2-L5/index.html).\n\n<details><summary>(DAG-level; [Q2-L4](../../Q2-L4/index.html):25 and\n[Q2-L5](../../Q2-L5/index.html):52) · the finding</summary>\n\nNeither is true as the DAG now stands. Q2-L4's\nstatement opens \"$\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\n**as in Q2-L3**: the objects supported on $\\partial\\overline{LX}_\\lambda=\\overline{LX}_\\lambda\\setminus LX_\\lambda$\"\n— a reading Q2-L3 no longer contains — and its conclusion indexes generators by\n$LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda$ rather than $\\mu\\in\\partial\\lambda$. Q2-L5 concludes\nwith $\\operatorname{supp}(P_\\lambda)\\subseteq\\overline{LX}_\\lambda$, the clause u2 retired. So after\nu2 the two suppliers discharge hypotheses that no longer exist, and the compatibility u2 set out to\nmake checkable is now a mismatch in the other direction. This does not impugn the write-up or the\nimplication — Q2-L3 is self-contained — but it does mean **(C)** and **(D)** are, at this moment,\nowned by nobody in the vocabulary they are stated in. The same holds for **(B)**, which\n[r1](r1.html) raised as Flaw 7 and u2 records as \"still owned by nobody\".\n\n</details>\n\n**Flaw 7** [MINOR] — The $\\Delta_{\\mu,b}$ of **(C)**, the $E_{\\lambda,a}$ of **(D)** and the $\\Delta_{\\lambda,a}$ of the\nconclusion must come from **one** stratumwise choice of generating collections, which\n[$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html)\nexplicitly leaves open (\"the collection is a choice, and the entry does not discharge it\").\n\n<details><summary>(statement-level; r1's Flaw 3(ii), unaddressed by u2) · the finding</summary>\n\nThe\nstatement carries this by shared symbols alone. It is harmless here — the argument is valid under any\none fixed choice, and [Q2-L1](../../Q2-L1/index.html)(iii) would repair it if pressed — but it was\nflagged a round ago and the rewrite was the moment to fix it with one sentence: \"Fix, once and for\nall, a generating collection at each stratum.\"\n\n</details>\n\n---\n\nDisposition, since two of the three serious findings are `/update`'s and none is the prover's: the\nwrite-up's own defects are all MINOR and Flaws 1–4 are worth acting on by the next prover in the\norder given. Flaws 5 and 6 belong to the lead-researcher and to `/update`, and Flaw 5 in particular\nshould not be counted against a re-proof round, since the prover is required to reproduce the\nstatement verbatim and did.\n\nVERDICT: FAIL\n";</script>
