se it couples the boundary dévissage to the particular objects the Hecke construction supplies, and the value of the level-0 shape is that those two are separately routable.\n\n- **2026-08-06 — what the abstraction is for**: [Q2-L3](../index.html)'s round-1 critique found that \"the *geometric* content has migrated wholesale into (B), (C), (D), and Q2-L3 is now an assembly lemma\" ([r1](../critiques/r1.html)). This node states that finding as a theorem. Hypotheses **(B)**, **(C)** and **(D)** of [Q2-L3](../index.html) exist only to produce the one cofibre sequence of hypothesis **(B)** here, and separating them says that the recollement triangle, the boundary dévissage and the Hecke construction are **one** obligation seen from above and three from below — discharged, however it is discharged, the moment that single sequence is exhibited.\n\n- **2026-08-06 — the specialization, in one line**: $\\mathcal{C}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, $\\mathcal{S}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$, $\\Lambda=\\Lambda_X^+$ under the closure order, $\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$ and $P_{\\lambda,a}$ the object of [Q2-L3](../index.html)**(D)**; the cofibre sequence is the counit $i_{\\lambda!}\\,i_\\lambda^!P_{\\lambda,a}\\to P_{\\lambda,a}$, its source identified with $\\Delta_{\\lambda,a}[n_{\\lambda,a}]$ by the costalk clause of **(D)** and its cofibre placed inside the generation bracket by **(B)** and **(C)**.\n\n- **2026-08-06 — what the input got wrong and this node fixes**: the referee report's §6 asked only for \"$\\mathcal{S}\\subseteq\\mathcal{C}$ a stable subcategory\", which is not enough, for the reason the third point of the node's **Scope.** paragraph gives — $\\langle-\\rangle_{\\mathcal{C}}$ is the *smallest cocomplete stable* subcategory containing the generators, so a subcategory merely closed under finite colimits need not contain it and the induction has nothing to land in. Verified this run against [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), whose own note records that \"cocomplete stable\" is strictly stronger than \"thick\".\n";</script>
