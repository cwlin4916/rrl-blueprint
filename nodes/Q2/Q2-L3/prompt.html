<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L3</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L3 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q2-L3 — self-contained prompt: Triangular Hecke objects and boundary dévissage give the standard objects\n\n## Task\n\nProve the target claim rigorously under exactly the stated hypotheses. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q2: For which $X$ does every standard object of a stratum lie in the Satake subcategory?](../../../dag.html)\n\n**Standing setting.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../../context.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). $LX$ carries the $K$-placid presentation by orbit closures of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html),\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda .\n$$\n\nCoherence is [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), the renormalized category is $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html).\n\n### The recollement package, and which clause is standing\n\n[Q3](../../Q3/index.html) asks for which $X$ the three clauses below hold, and states them canonically. They are written out in full here because Q2 spends them one at a time and a reader must be able to check which: **(H1)** is in force throughout Q2, and **(H2)** and **(H3)** are not.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n**(H1) is standing; the other two are spent by name.** Q2 assumes **(H1)** everywhere and proves it nowhere — discharging it is [Q1](../../Q1/index.html)'s business, and it is what makes $i_{\\lambda!}$ exist, so without it the question below has no subject.\n\n**(H2)** and **(H3)** are what make the standard objects *generate* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. Generating is a different question from belonging, and belonging is what is asked here.\n\nThe two enter only where the membership is cashed in for [Q1](../../Q1/index.html)'s equality, at [Q2-L1](../Q2-L1/index.html)(ii), and each node that spends one names it at the point of use. A node needing a fourth hypothesis has found one and must say so.\n\n**Repository problem.** For which $X$ in the standing class does $!$-extension from every stratum land in the Satake subcategory:\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\ ?\n$$\n\nStating it costs **(H1)** and nothing else, because **(H1)** is what makes $i_{\\lambda!}$ exist.\n\n**The form the nodes work in.** Every **standard object** $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$ formed from a generating collection of a stratum ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html); notation [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)) lies in the subcategory. That holds for one choice of collections if and only if it holds for every choice, so no choice of generators is part of what is asked — [Q2-L1](../Q2-L1/index.html)(iii).\n\n**What counts as an answer.** A condition on the geometry of $LX$. The ones on record are **sufficient**: ind-proper Hecke correspondences onto each closure with cohomologically trivial open fibre, plus a boundary dévissage — [Q2-L3](index.html), [Q2-L4](../Q2-L4/index.html), [Q2-L5](../Q2-L5/index.html).\n\n**What those conditions do not yet reach.** They produce one generator per stratum, not every generator. [Q2-L5](../Q2-L5/index.html) and [Q2-L6](../Q2-L6/index.html) are the whole of what supplies hypothesis **(D)** of [Q2-L3](index.html), and each terminates in a triangular lift of the dualizing object $\\omega_{K\\backslash LX_\\lambda}$, while **(D)** quantifies over every $a\\in A_\\lambda$.\n\nSo the chain answers the question exactly where $\\#A_\\lambda = 1$, which by [Q2-L2](../Q2-L2/index.html)(iii) is connectedness of every stabilizer quotient $G_\\lambda$ — the hypothesis the Conjecture below carries, and one that no node establishes for the symmetric class at large. Where a stabilizer is disconnected the remaining generators are not merely unproved but out of reach of the mechanism: by [Q2-L2](../Q2-L2/index.html)(ii) they need not lie in the subcategory $\\omega_{K\\backslash LX_\\lambda}$ generates, so nothing recovers them from what these nodes deliver.\n\nNo node with `role: proof` states a criterion producing a triangular lift of a non-trivial $E_{\\lambda,a}$; [Q2-e3](../Q2-e3/index.html) at $\\mathrm{GL}_2/\\mathrm{O}_2$ asks whether one exists and does not answer it, and [K11](../../../key_examples/k11.html) is out of class for precisely this reason.\n\n**On a necessary condition.** No node here states one: the $K_0$ cyclicity test is necessary for [Q1](../../Q1/index.html)'s equality and not for the membership asked here, so a necessary condition in $LX$'s own geometry is open.\n\nHypothesis **(D)** of [Q2-L3](index.html) is one missing fact from being necessary. Taking $P_{\\lambda,a} := \\Delta_{\\lambda,a}$ discharges two of its three clauses — the Satake membership is the hypothesis itself, and the costalk clause is full faithfulness in **(H1)** — while the third asks for\n\n$$\ni_\\mu^!i_{\\lambda!}E_{\\lambda,a}\\ \\simeq\\ 0 \\qquad\\text{whenever }\\mu\\not\\le\\lambda .\n$$\n\nNo appendix entry supplies that vanishing.\n\nGranting that vanishing would make **(D)** *equivalent* to the membership, hence a reformulation of the question rather than a condition on $X$ — the objection recorded against [Q2-L1](../Q2-L1/index.html) in the next paragraph, which would then apply to **(D)** verbatim. So the geometric content of an answer has to live in a theorem **supplying** the triangular lifts, and can never live in the triangular-lift condition itself.\n\n[Q2-L1](../Q2-L1/index.html) is not such a condition. It reformulates the membership rather than conditioning $X$, and what it buys is the bridge to [Q1](../../Q1/index.html) recorded under **Feeds** above.\n\nA full answer lists geometric hypotheses on $X$ under which the membership provably holds, together with an $X$ in the standing class where it provably fails; [K12](../../../key_examples/k12.html) already supplies the second half.\n\n**The $X$ the literature settles.** The bench is [`key_examples.md`](../../../key_examples/index.html), which records for each case whether the answer to the **goal** question is settled in print and how. It is outside the closed world: nothing below may be cited in a proof, and it bounds belief rather than supplying it.\n\n| | $X$ | $G$ | verdict | what it gives Q2 |\n|---|---|---|---|---|\n| [K1](../../../key_examples/k1.html) | $\\mathbb{A}^1$ | $\\mathbb{G}_m$ | positive | the smallest non-homogeneous case; two strata, infinite boundary |\n| [K2](../../../key_examples/k2.html) | $\\mathrm{pt}$ | $G$ | positive | one stratum; the membership is trivial |\n| [K3](../../../key_examples/k3.html) | $\\mathrm{SO}_N$ | $\\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$ | positive | Gross–Prasad; symmetric, connected stabilizers |\n| [K4](../../../key_examples/k4.html) | $\\mathrm{GL}_N$ | $\\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$ | positive | Rankin–Selberg |\n| [K5](../../../key_examples/k5.html) | $\\mathrm{GL}_n\\times\\mathbb{A}^n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ | positive | mirabolic; non-homogeneous and still positive |\n| [K6](../../../key_examples/k6.html) | $\\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$ | $\\mathrm{GL}_{2n}$ | positive | symmetric, the shape the Conjecture is cut for |\n| [K7](../../../key_examples/k7.html) | $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$ | | adjacent | no verified source; not evidence |\n| [K8](../../../key_examples/k8.html) | rank-1 affine homogeneous | | **weak** | only the Satake subcategory is realized, so it establishes [the three standing hypotheses](../../../appendix/assum-intro.html)(c) and leaves the question untouched |\n| [K9](../../../key_examples/k9.html) | $H$ | $H\\times H$ | **degenerate** | $\\mathrm{IC}_0$ is the monoidal unit, so the membership holds for a reason no other $X$ has — it can never on its own earn `consistent` |\n| [K10](../../../key_examples/k10.html) | Whittaker | | out-of-class | fails [the three standing hypotheses](../../../appendix/assum-intro.html) |\n| [K11](../../../key_examples/k11.html) | $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | | out-of-class | the class boundary: disconnected generic stabilizer |\n| [K12](../../../key_examples/k12.html) | $(\\mathrm{SL}_2^{\\times 3})\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ | | **negative** | the membership fails in the standing class |\n\nK12 is why the Conjecture carries hypotheses rather than asserting the membership outright.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It is currently a terminal result of its proof branch.\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-06 — the generating collection is fixed once, in the statement.** [r1](critiques/r1.html)'s Flaw 3(ii), re-raised as [r2](critiques/r2.html)'s Flaw 7: the $\\Delta_{\\mu,b}$ of (C), the $E_{\\lambda,a}$ of (D) and the $\\Delta_{\\lambda,a}$ of the conclusion must come from one stratumwise choice, which [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) says in terms it does not discharge. The statement had been carrying it by shared symbols alone. One sentence now says it.\n\n## Target statement\n\nAssume hypothesis **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html), so that each stratum carries the adjunction $i_{\\lambda!}\\dashv i_\\lambda^!$.\n\nWrite $\\mu\\le\\lambda$ for the closure order $LX_\\mu\\subseteq\\overline{LX}_\\lambda$ on the index set [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html). For $\\lambda\\in\\Lambda_X^+$ put\n\n$$\n\\overline{\\lambda}:=\\left\\{\\mu\\in\\Lambda_X^+\\ :\\ \\mu\\le\\lambda\\right\\}, \\qquad \\partial\\lambda:=\\overline{\\lambda}\\setminus\\{\\lambda\\} .\n$$\n\nFor a subset $T\\subseteq\\Lambda_X^+$ let $\\mathcal{D}^{\\mathrm{ren}}_T\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ be the full subcategory of objects that the strata outside $T$ do not see:\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_T:=\\left\\{M\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ :\\ i_\\mu^!M\\simeq 0\\ \\text{ for every }\\mu\\in\\Lambda_X^+\\setminus T\\right\\} .\n$$\n\nThis is a definition and asserts nothing: the subcategory is cut out by the restrictions **(H1)** supplies, and no theory of supports is invoked or needed.\n\nFix, once and for all, a generating collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ at each stratum ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)); the standard objects $\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$ named in **(C)**, in **(D)** and in the conclusion are all taken from that one choice.\n\nAssume in addition:\n\n**(A) Well-founded closure order.** Every nonempty subset of $\\Lambda_X^+$ has a minimal element for $\\le$.\n\n**(B) The counit cofibre is carried by the boundary.** For every $\\lambda\\in\\Lambda_X^+$ and every $P\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$,\n\n$$\n\\operatorname{cofib}\\left(i_{\\lambda!}\\,i_\\lambda^!P\\ \\longrightarrow\\ P\\right)\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} ,\n$$\n\nthe map being the counit of the adjunction.\n\nThis is the localization triangle a recollement of $LX_\\lambda$ inside its closure supplies, read in the ambient the conclusion is about.\n\n**(C) Boundary dévissage.** For every $\\lambda\\in\\Lambda_X^+$,\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\ \\subseteq\\ \\left\\langle \\Delta_{\\mu,b}\\ \\middle|\\ \\mu\\in\\partial\\lambda,\\ b\\in A_\\mu \\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\nOnly this inclusion is consumed below. The reverse one — that each $\\Delta_{\\mu,b}$ with $\\mu\\in\\partial\\lambda$ is itself carried by $\\partial\\lambda$ — is nowhere used.\n\n**(D) Triangular Satake lifts.** For every $\\lambda\\in\\Lambda_X^+$ and every $a\\in A_\\lambda$ there are\n\n$$\nP_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}\\cap\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}, \\qquad n_{\\lambda,a}\\in\\mathbb{Z}, \\qquad i_\\lambda^!P_{\\lambda,a}\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\ E_{\\lambda,a}\\left[n_{\\lambda,a}\\right].\n$$\n\nSuch a $P_{\\lambda,a}$ is a *triangular lift* of $E_{\\lambda,a}$: it is reached from [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) by Hecke operations, it has the prescribed leading term on the stratum $LX_\\lambda$, and below that stratum it is unconstrained.\n\nThen $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda$ and every $a$.\n\nConsequently, under the standing hypotheses **(H1)**–**(H3)** of [Q1-L5](../../Q1/Q1-L5/index.html), [Q2-L1](../Q2-L1/index.html)(ii) gives $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, hence [Q1](../../../dag.html)'s equality.\n\n## Direct prerequisites\n\n### [Q2-L1](../Q2-L1/index.html) — Standard generators: one condition replaces the two\n\n- **current effective status:** proved\n- **use policy:** This prerequisite is proved and may be used as stated.\n\n**Setup — what the clauses quantify over.** Throughout, $\\lambda$ runs over the index poset [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) of $K$-orbits of $LX$, so choosing $\\lambda$ is choosing one stratum $LX_\\lambda$, and $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ is the locally closed embedding of that stratum ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)).\n\nA **generating collection** for the stratum $\\lambda$ is a small family $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of the renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) of that one stratum which generates it in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nThe associated **standard objects** are the images of that collection under the left adjoint named in the next paragraph:\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nBoth families are those of [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html). A generating collection is a **choice**, made stratum by stratum, and nothing there or here singles one out; clause (iii) below is what makes the choice immaterial.\n\n**(H1) Recollement.** Assumed throughout, and identical with hypothesis **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html): for every $\\lambda$ the $!$-restriction\n\n$$\ni_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n$$\n\nis continuous and admits a fully faithful continuous left adjoint $i_{\\lambda!}$. This is the only hypothesis clause (i) uses.\n\n**(1) Stratumwise generation.** Condition (1) of [Q1-L5](../../Q1/Q1-L5/index.html): for every $\\lambda$ the restrictions $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, with $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ acting through the spherical Hecke action ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) on the basic object [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html).\n\n**(2) Support-cutting.** Condition (2) of [Q1-L5](../../Q1/Q1-L5/index.html): for every $\\lambda$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\n\n$$\ni_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right) \\in \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n**(i) One condition replaces the two.** Assume **(H1)**. Then (1) and (2) both hold if and only if every standard object lies in the Satake subcategory ([the Satake subcategories](../../../appendix/def-satake-subcategory.html)):\n\n$$\n\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\text{ and every }a\\in A_\\lambda.\n$$\n\n**(ii) The equality it cashes out to.** Under the standing hypotheses **(H1)**–**(H3)** of [Q1-L5](../../Q1/Q1-L5/index.html), the Satake subcategory is all of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ if and only if the same membership holds:\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) \\qquad\\Longleftrightarrow\\qquad \\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}\\ \\text{ for every }\\lambda\\text{ and every }a.\n$$\n\n**(iii) Independence of the choice, and the choice-free form.** Assume **(H1)**. For each $\\lambda$ the objects $E$ of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ whose $!$-extension $i_{\\lambda!}E$ lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ form a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, so the membership of clause (i) holds for one choice of generating collections if and only if\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+ .\n$$\n\nIn particular neither direction depends on the choice: if $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ and $\\{E'_{\\lambda,b}\\}_{b\\in B_\\lambda}$ both generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ for every $\\lambda$, then the two resulting families of standard objects generate the same subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../appendix/conj-intro.html) holds for $X$.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n- **note:** *the ambient $\\mathcal{C}$ is part of the data and main.tex does not name it at the point of use, which is why the blueprint writes it as a subscript everywhere.* See the ratification recorded at [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and in [Q1-L1](../../Q1/Q1-L1/index.html): for Satake subcategories the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$. \"Cocomplete stable\" is strictly stronger than \"thick\"; $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits, not merely finite ones and retracts.\n- **note:** **Where the presentability comes from, verified on the page.** GR's standing convention is footnote 8 to §5.1.5 of [[GR17vol1](../../../../papers/GR17vol1.pdf)] (printed p. 51, PDF p. 88), attached to the sentence defining \"cocomplete\": *\"When talking about cocomplete categories we will always assume that they are presentable.\"* So GR's \"cocomplete stable category\" means \"presentable stable category\", and §5.4.1 opens \"Let $\\mathbf{C}$ be an object of $1\\text{-Cat}^{\\mathrm{St,cocmpl}}$\". The convention is load-bearing rather than decorative: the printed proof of Prop. 5.4.5 (p. 55, PDF p. 92) forms the smallest cocomplete stable full subcategory $\\mathbf{C}'\\subseteq\\mathbf{C}$ and continues *\"The inclusion $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ admits an (a priori non-continuous) right adjoint\"*, which is the Adjoint Functor Theorem in GR's form: Thm. 2.5.4(a) (printed p. 32, PDF p. 69), *\"Any morphism in $1\\text{-Cat}_{\\mathrm{Prs}}$, viewed as a functor between $(\\infty,1)$-categories, admits a right adjoint\"*, stated there for **presentable** categories. Footnote 3 of that page, hanging off §2.5.1 where $1\\text{-Cat}_{\\mathrm{Prs}}$ is introduced, says presentability *\"is necessary for the Adjoint Functor Theorem to hold\"* and adds that they *\"will omit the adjective 'presentable' even when it should properly be there\"*. It is that right adjoint the proof uses to pass from the vanishing to $\\mathbf{C}'=\\mathbf{C}$, so the hypothesis is consumed exactly in the direction *orthogonality $\\Rightarrow$ generation*.\n- **note:** **Why the converse direction is free.** *Generation $\\Rightarrow$ orthogonality* needs only minimality: by [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html), applied with $\\mathcal{D}=\\mathcal{C}$, $T=\\{c_\\alpha\\}$ and $M=c$, the displayed vanishing puts every $c_\\alpha$ in ${}^{\\perp_{\\mathcal{C}}}c$, hence puts $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ there; if that is all of $\\mathcal{C}$ then $c\\in{}^{\\perp_{\\mathcal{C}}}c$, so $\\operatorname{Map}_{\\mathcal{C}}(c,c)=0$ and $c=0$. No presentability, and no circularity — that entry invokes this one through the minimality description alone.\n- **note:** **Two discrepancies with the printed sources, and the readings in force.** (a) The attribution is to both numbers because the entry carries both halves: the display is verbatim [[GR17vol1, Def. 5.4.1](../../../../papers/GR17vol1.pdf)], which is GR's *definition* of \"generate\", while the biconditional with the smallest-subcategory description is [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] (\"A collection $\\{c_\\alpha\\}$ of objects generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory that contains all $c_\\alpha$\"). (b) main.tex:511–513 prints the vanishing as \"$\\forall i\\ge 0$\" with no quantifier on $\\alpha$; GR print \"$\\forall\\alpha$, $\\forall i=0,1,\\dots$\", and the reading in force is GR's, restored in the display above. GR write the vanishing itself as $\\mathrm{Maps}_{\\mathbf{C}}(c_\\alpha[-i],c)=\\ast$ in Def. 5.4.1 and as $=0$ inside the proof of Prop. 5.4.5, main.tex writing $=0$; by [`Ani`, `Map`, `underline-Map`](../../../appendix/conv-anima.html) the value is an anima, and both notations say that it is contractible. What is *not* settled by notation is the **range of shifts**: this display tests $i\\ge 0$ only, so an argument needing closure under all of $\\mathbb{Z}$ must reconcile the two ranges, which is clause (1) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html).\n\n### [${}^{\\perp_{\\mathcal{D}}}M$ is a cocomplete stable subcategory, and contains $\\langle T\\rangle_{\\mathcal{D}}$ whenever it contains $T$](../../../appendix/left-orthogonal-closure.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Lemma** (formal; no main.tex label, and no numbered source — see the role line). Let $\\mathcal{D}$ be a stable category admitting all small colimits and let $M\\in\\mathcal{D}$. Write $[1]$ for the suspension of $\\mathcal{D}$, so that $[-i]$ is the $i$-fold loop functor $\\Omega^i$ for $i\\ge 0$, let $\\operatorname{Map}_{\\mathcal{D}}(-,-)$ be the mapping anima of [`Ani`, `Map`, `underline-Map`](../../../appendix/conv-anima.html), and set\n\n$$\n{}^{\\perp_{\\mathcal{D}}}M \\ := \\ \\left\\{ X\\in\\mathcal{D} \\ \\middle|\\ \\operatorname{Map}_{\\mathcal{D}}(X[n], M) = 0 \\ \\text{ for all } n\\in\\mathbb{Z} \\right\\} .\n$$\n\n**(1) The two shift ranges agree.** For $X\\in\\mathcal{D}$, one has $X\\in{}^{\\perp_{\\mathcal{D}}}M$ if and only if $\\operatorname{Map}_{\\mathcal{D}}(X[-i],M) = 0$ for all $i\\ge 0$. Hence for a collection $T$ of objects of $\\mathcal{D}$ the inclusion $T\\subseteq{}^{\\perp_{\\mathcal{D}}}M$ is *verbatim* the hypothesis of the criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), taken for the collection $T$ and the test object $M$.\n\n**(2) The left orthogonal is a cocomplete stable subcategory.** ${}^{\\perp_{\\mathcal{D}}}M$ is a full subcategory of $\\mathcal{D}$, closed under equivalence, containing $0$, closed under $X\\mapsto X[m]$ for every $m\\in\\mathbb{Z}$, and closed under all small colimits formed in $\\mathcal{D}$ — in particular under cofibers, and with the shifts under fibers. It is therefore a cocomplete stable subcategory of $\\mathcal{D}$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html).\n\n**(3) Orthogonality passes from a set to the subcategory it generates.** Let $T$ be a set of objects of $\\mathcal{D}$ with $T\\subseteq{}^{\\perp_{\\mathcal{D}}}M$. Then\n\n$$\n\\langle T\\rangle_{\\mathcal{D}} \\ \\subseteq \\ {}^{\\perp_{\\mathcal{D}}}M .\n$$\n\n- **hypotheses:** $\\mathcal{D}$ stable and admitting all small colimits; $M$ an object of $\\mathcal{D}$; in (3), $T$ a **set** of objects of $\\mathcal{D}$, so that $\\langle T\\rangle_{\\mathcal{D}}$ is formed on a small collection. **No presentability, at any clause.** The entry consumes [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) through its minimality description alone — the half of that entry that carries no hypothesis — and never through its criterion; that is what distinguishes it from the criterion and is the reason it is stated separately.\n\n### [compact generation](../../../appendix/def-compactly-generated-category.html) — `def:compactly_generated_category`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:528). $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ is *compactly generated* if the following equivalent conditions hold:\n\n1. $\\mathcal{C}$ admits small filtered colimits and every object is a colimit of a small filtered diagram of compact objects;\n2. the natural functor $\\mathrm{Ind}(\\mathcal{C}^\\omega)\\rightarrow\\mathcal{C}$ is an equivalence.\n\nHere $\\mathrm{Ind}(\\mathcal{D})$, for $\\mathcal{D}$ small, is the ind-completion: it admits a map $\\mathcal{D}\\rightarrow\\mathrm{Ind}(\\mathcal{D})$ and small filtered colimits, and precomposition induces\n\n$$\n\\mathrm{Fun}^\\omega(\\mathrm{Ind}(\\mathcal{D}),\\mathcal{E})\\xrightarrow{\\ \\simeq\\ }\\mathrm{Fun}(\\mathcal{D},\\mathcal{E}),\n$$\n\n$\\mathrm{Fun}^\\omega$ denoting functors commuting with small filtered colimits [[HTT, §5.3](../../../../papers/HTT.pdf)].\n\n### [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n- **note:** this definition carries **no `\\label` in main.tex** — cite it as `main.tex:794`, never as a label, and do not invent one. It is the ambient category in which every Satake generation is formed; see [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and [Q1-L1](../../Q1/Q1-L1/index.html).\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../Q1/Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../Q1/Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../Q1/Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [$\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$, $\\Delta_{\\lambda,a}$ — stratum generating collections and the standard objects](../../../appendix/not-standard-objects.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (blueprint notation, coined in the [Q2](../../../dag.html) framing block and recorded here so that no node coins it again; main.tex names no such objects, and the two ingredients it does supply are the generation operation [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) at main.tex:502 and the locally closed embeddings $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) at main.tex:737). Let $X$ be a smooth affine spherical $G$-variety and $K = L^+G$. The two categories in play are the renormalized categories ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ of the whole loop space and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ of the spherical stratum $LX_\\lambda$ indexed by $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)); both are written out in full wherever they occur, and no abbreviation for either is introduced here or licensed elsewhere.\n\nA **generating collection** for the stratum $\\lambda$ is a small collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, indexed by a set $A_\\lambda$, which generates that category in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nLet $i_{\\lambda!}$ denote the left adjoint of the restriction functor $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ along the locally closed embedding $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). Given a generating collection, the **standard objects** of the stratum $\\lambda$ are its images\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nWhen a single object suffices — $\\#A_\\lambda = 1$ — the index $a$ is dropped and one writes $E_\\lambda$ and $\\Delta_\\lambda = i_{\\lambda!}E_\\lambda$.\n\n**Two worked examples.** The definitions above fix symbols and settle nothing, so a reader cannot tell from them whether $A_\\lambda$ is ever bigger than a point, or what an $E_{\\lambda,a}$ looks like when it is. The two cases below are written out for that reason alone. Each is an *illustration of the notation*, not a claim this entry makes: the mathematics in both is asserted and proved at the node named, and a proof that needs either fact cites that node and never this paragraph.\n\n*Example 1 — one generator per stratum: $X = G$ under $G\\times G$.* Take $K = L^+G\\times L^+G$, so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ is the ordinary spherical Hecke situation and $\\Lambda_X^+$ is the set $\\Lambda^+$ of dominant coweights ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), the stratum at $\\nu$ being the orbit $LX_\\nu = \\mathrm{Gr}_\\nu = L^+G\\cdot t^\\nu$. The stabilizer of $t^\\nu$ has connected finite-type reductive quotient — the centralizer $Z_G(\\nu)$, connected because a torus centralizer in a connected reductive group is — so the dualizing object generates the stratum on its own and the collection may be taken to be a single object:\n\n$$\n\\#A_\\nu = 1, \\qquad E_\\nu = \\omega_{K\\backslash LX_\\nu}, \\qquad \\Delta_\\nu = i_{\\nu!}\\,\\omega_{K\\backslash LX_\\nu} .\n$$\n\nThis is [Q2-e1-L1](../Q2-e1/Q2-e1-L1/index.html), resting on [Q2-L2](../Q2-L2/index.html)(i).\n\n*Example 2 — more than one, and the index set named: $X = \\mathrm{GL}_2/\\mathrm{O}_2$.* Here $LX = \\{A\\in\\mathrm{GL}_2(F) : A^t = A\\}$ with $K = \\mathrm{GL}_2(\\mathcal{O})$ acting by $g\\cdot A = gAg^t$ ([$F$, $\\mathcal{O}$](../../../appendix/conv-ring-of-integers.html)), and the strata are indexed by pairs $\\lambda = (p,q)$ with $p\\ge q$. At a diagonal stratum $\\lambda = (p,p)$ the finite-type quotient of the stabilizer is $\\mathrm{O}_2$, whose component group is $\\mathbb{Z}/2$ with the two characters $\\mathrm{triv}$ and $\\mathrm{sgn} = \\det|_{\\mathrm{O}_2}$. One generator per character is then a generating collection, and two are needed:\n\n$$\nA_\\lambda = \\{\\mathrm{triv},\\ \\mathrm{sgn}\\}, \\qquad E_{\\lambda,\\mathrm{triv}} = \\omega_{K\\backslash LX_\\lambda}, \\qquad E_{\\lambda,\\mathrm{sgn}} = \\omega_{K\\backslash LX_\\lambda}\\otimes\\mathrm{sgn},\n$$\n\nwith $\\Delta_{\\lambda,\\mathrm{triv}} = i_{\\lambda!}E_{\\lambda,\\mathrm{triv}}$ and $\\Delta_{\\lambda,\\mathrm{sgn}} = i_{\\lambda!}E_{\\lambda,\\mathrm{sgn}}$ the two standard objects of that one stratum. The dualizing object alone does not generate: $\\mathrm{sgn}$ is right-orthogonal to it in every shift. This is [Q2-e3-L2](../Q2-e3/Q2-e3-L2/index.html)(B), resting on [Q2-L2](../Q2-L2/index.html)(ii)–(iii); the same node's clause (C) shows $\\#A_\\lambda = 4$ at every off-diagonal stratum, so the size of $A_\\lambda$ varies with $\\lambda$ within one $X$.\n\n- **note:** *The adjoint is named, not asserted.* This entry fixes the symbol $i_{\\lambda!}$ and nothing more: that $i_\\lambda^!$ is continuous and that $i_{\\lambda!}$ exists, is continuous and is fully faithful is hypothesis **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html), which the [Q2](../../../dag.html) framing puts in force as a standing hypothesis. A node that needs the adjoint to exist cites that hypothesis, never this entry.\n- **note:** *The collection is a choice, and the entry does not discharge it.* Nothing here singles out a generating collection: $A_\\lambda$, the objects $E_{\\lambda,a}$ and hence the standard objects $\\Delta_{\\lambda,a}$ all depend on a choice made stratum by stratum. That the *subcategory* of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ generated by the standard objects is independent of that choice is a claim **about** the notation and no part of it — it is the closing paragraph of [Q2-L1](../Q2-L1/index.html), to be proved there and cited from there. Likewise, whether one object suffices at a given $\\lambda$, and which object may be taken, is the content of [Q2-L2](../Q2-L2/index.html) and is not settled here.\n- **note:** *What this entry does not say.* It does not assert that any $\\Delta_{\\lambda,a}$ lies in the Satake subcategory $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ of [the Satake subcategories](../../../appendix/def-satake-subcategory.html), nor that any $\\Delta_{\\lambda,a}$ is coherent ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) or compact ([compact objects](../../../appendix/def-compact-objects.html)). The first of those is exactly the question [Q2](../../../dag.html) asks; the others are hypotheses a node states for itself.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../appendix/ic-0.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n- **note:** the pointing condition of [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) is exactly the requirement that $\\mathrm{IC}_0\\mapsto\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n  **Ratified reading.** The displayed membership is a genuine finiteness statement — it says the $!$-extension is coherent — and no node in the blueprint derives it. It is imported from main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action, which presupposes it; the same presupposition is what lets [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html) accept $\\mathrm{IC}_0$ in the second slot of its module action. Before 2026-08-05 it was carried only by the grammar of those two entries, and round 1 of [Q1-L2-L3](../../Q1/Q1-L2/Q1-L2-L3/critiques/r1.html) asked for it to be stated; it is stated here so that a proof may cite it rather than infer it from a typing argument. Anyone who later wants it *proved* wants a node about coherence of $!$-extensions on $K\\backslash LX$, which is not in the closed world.\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and [the Satake subcategories](../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n### [the Satake subcategories](../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n- **note:** **Ratified reading.** main.tex names no ambient cocomplete category for the $\\langle-\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), while $\\mathcal{D}_c$ itself is small and not cocomplete, so the definition as printed is incomplete. The blueprint fixes the reading\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\n  the generation being formed inside $\\mathcal{D}^{\\mathrm{ren}}$. This is forced by the essential-image assertion in the proof of [the small Satake comparison](../../../appendix/thm-f-cstr-sat.html) (main.tex:1391–1392). Ratified in round 2 of [Q1-L1](../../Q1/Q1-L1/index.html); every downstream node presupposes it. See [ADR 0001](../../../process/decisions/0001-satake-generation-ambient-category.html).\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@article{GR17vol1,\n    author = {Dennis Gaitsgory and Nick Rozenblyum},\n    title = {A study in Derived Algebraic Geometry, volume 1},\n    year = {2017}\n}\n\n@book {HTT,\n    AUTHOR = {Lurie, Jacob},\n     TITLE = {Higher topos theory},\n    SERIES = {Annals of Mathematics Studies},\n    VOLUME = {170},\n PUBLISHER = {Princeton University Press, Princeton, NJ},\n      YEAR = {2009},\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n```\n\n## The key examples this statement is tested against\n\nThe register at [key_examples.md](../../../key_examples/index.html) fixes the cases where the answer is known. A reading aid, outside the closed world: check the statement against it, never discharge a step with it.\n\n- **K1 — Iwasawa–Tate: reductive stabilizer, hence smooth affine. Its dual is the Shalika-Whittaker reduction $\\check M = T^*(\\mathrm{GL}_{2n}/\\mathrm{GL}_n\\ltimes U,\\psi)$.\n- **K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m < n-1$** *(`adjacent`)* — **The variety.** The dual is $\\check X = \\mathrm{Mat}_{m\\times n}$ acted on by $\\check G = \\mathrm{GL}_m\\times\\mathrm{GL}_n$; the automorphic side is the Rankin–Selberg period for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$ outside the adjacent range covered by K4.\n- **K8 — Rank-1 affine homogeneous spherical varieties: the weakened form, in print** *(`weak`)* — **Why it is here.** This is the entry that shows the distinction this register turns on is real, and not a reading the blueprint imposed on the literature.\n- **K9 — The group case: $X = H$ under $G = H\\times H$** *(`degenerate`)* — **Why it is here.** To keep it out. BZSV §7.6.2 (pp. 168–169) identify the conjecture here with derived Satake, so the case is as settled as anything in the register — and useless as a …\n- **K10 — The Whittaker period: $M = T^*(G/\\!\\!/_{\\psi}U)$** *(`out-of-class`)* — **Why it is here.** BZSV §7.6.4 (p. 169) settle it — the dual is a point, the automorphic side is Whittaker sheaves on the Grassmannian, and the equivalence is Frenkel–Gaitsgory– Vilonen. It looks like a …\n- **K11 — $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$: the class boundary** *(`out-of-class`)* — **Why it is here.** A spherical root of type $N$ puts it outside the hyperspherical setting (BZSV §7.6.5, pp. 169–170), and the conclusion changes shape rather than merely failing: the local category contains a block …\n- **K12 — $X = (\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$** *(`negative`)* — **Why it is here.** It is the only candidate *negative* on record. Sakellaridis (arXiv:0905.4244, Ex. 8.0.1 with Thm 8.0.2 and pp. 65–66) shows that in the function-theoretic shadow the basic vector generates a proper Hecke …\n\n**No `/check-goal` run is on record for this node.**\n\n## Expected response\n\nProve or disprove. Give a counterexample if it is false, a corrected statement if it needs one, and say how the plan around this node should change. Write as a rigorous mathematician, and search the web for anything you cite.\n";</script>
