<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L3</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L3 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q2-L3 — Triangular Hecke objects and boundary dévissage give the standard objects\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html), [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html), [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html), [the Satake subcategories](../../../appendix/def-satake-subcategory.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html); [Q2-L1](../Q2-L1/index.html).\n- **notation:** No category is abbreviated, both Satake subcategories being written out in full as [the Satake subcategories](../../../appendix/def-satake-subcategory.html) requires; the only symbols coined below are the failure set $S$ at Step 5 and the counit cofibre $Q_{\\lambda,a}$ at Step 8.\n\n## Lemma\n\nAssume hypothesis **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html), so that each stratum carries the adjunction $i_{\\lambda!}\\dashv i_\\lambda^!$.\n\nWrite $\\mu\\le\\lambda$ for the closure order $LX_\\mu\\subseteq\\overline{LX}_\\lambda$ on the index set [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html). For $\\lambda\\in\\Lambda_X^+$ put\n\n$$\n\\overline{\\lambda}:=\\left\\{\\mu\\in\\Lambda_X^+\\ :\\ \\mu\\le\\lambda\\right\\}, \\qquad \\partial\\lambda:=\\overline{\\lambda}\\setminus\\{\\lambda\\} .\n$$\n\nFor a subset $T\\subseteq\\Lambda_X^+$ let $\\mathcal{D}^{\\mathrm{ren}}_T\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ be the full subcategory of objects that the strata outside $T$ do not see:\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_T:=\\left\\{M\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ :\\ i_\\mu^!M\\simeq 0\\ \\text{ for every }\\mu\\in\\Lambda_X^+\\setminus T\\right\\} .\n$$\n\nThis is a definition and asserts nothing: the subcategory is cut out by the restrictions **(H1)** supplies, and no theory of supports is invoked or needed.\n\nFix, once and for all, a generating collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ at each stratum ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)); the standard objects $\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$ named in **(C)**, in **(D)** and in the conclusion are all taken from that one choice.\n\nAssume in addition:\n\n**(A) Well-founded closure order.** Every nonempty subset of $\\Lambda_X^+$ has a minimal element for $\\le$.\n\n**(B) The counit cofibre is carried by the boundary.** For every $\\lambda\\in\\Lambda_X^+$ and every $P\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$,\n\n$$\n\\operatorname{cofib}\\left(i_{\\lambda!}\\,i_\\lambda^!P\\ \\longrightarrow\\ P\\right)\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} ,\n$$\n\nthe map being the counit of the adjunction.\n\nThis is the localization triangle a recollement of $LX_\\lambda$ inside its closure supplies, read in the ambient the conclusion is about.\n\n**(C) Boundary dévissage.** For every $\\lambda\\in\\Lambda_X^+$,\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\ \\subseteq\\ \\left\\langle \\Delta_{\\mu,b}\\ \\middle|\\ \\mu\\in\\partial\\lambda,\\ b\\in A_\\mu \\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\nOnly this inclusion is consumed below. The reverse one — that each $\\Delta_{\\mu,b}$ with $\\mu\\in\\partial\\lambda$ is itself carried by $\\partial\\lambda$ — is nowhere used.\n\n**(D) Triangular Satake lifts.** For every $\\lambda\\in\\Lambda_X^+$ and every $a\\in A_\\lambda$ there are\n\n$$\nP_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}\\cap\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}, \\qquad n_{\\lambda,a}\\in\\mathbb{Z}, \\qquad i_\\lambda^!P_{\\lambda,a}\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\ E_{\\lambda,a}\\left[n_{\\lambda,a}\\right].\n$$\n\nSuch a $P_{\\lambda,a}$ is a *triangular lift* of $E_{\\lambda,a}$: it is reached from [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) by Hecke operations, it has the prescribed leading term on the stratum $LX_\\lambda$, and below that stratum it is unconstrained.\n\nThen $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda$ and every $a$.\n\nConsequently, under the standing hypotheses **(H1)**–**(H3)** of [Q1-L5](../../Q1/Q1-L5/index.html), [Q2-L1](../Q2-L1/index.html)(ii) gives $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, hence [Q1](../../../dag.html)'s equality.\n\n## Proof\n\n**Step 1 — $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ are stable.**\n\n<details><summary>the argument</summary>\n\nFor a prestack $\\mathcal{Y}$, the small category $\\mathcal{D}_c(\\mathcal{Y})$ is stable — it has a zero object and is closed under shifts and cones — which is standard mathematics needing no citation; and $\\mathrm{Ind}$ of a small stable category is again stable. By [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})=\\mathrm{Ind}(\\mathcal{D}_c(\\mathcal{Y}))$; take $\\mathcal{Y}=K\\backslash LX$ and $\\mathcal{Y}=K\\backslash LX_\\lambda$.\n\n</details>\n\n**Step 2 — $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.**\n\n<details><summary>the argument</summary>\n\n[the Satake subcategories](../../../appendix/def-satake-subcategory.html) presents it as $\\left\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$, the generators being Hecke translates of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), and by [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) such a bracket is the smallest cocomplete stable subcategory of its ambient containing its generators — so it is closed under small colimits, under shifts in both directions, and under fibres formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\n</details>\n\n**Step 3 — $i_{\\lambda!}$ commutes with every shift $[m]$, $m\\in\\mathbb{Z}$.**\n\n<details><summary>the argument</summary>\n\nBy **(H1)** the functor $i_{\\lambda!}\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\to\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ is the left adjoint of $i_\\lambda^!$, hence preserves all colimits and in particular finite ones; a finite-colimit-preserving functor between stable categories (Step 1) is exact, and an exact functor commutes with $[1]$ and therefore with its inverse $[-1]$, hence with $[m]$ for every integer $m$:\n\n$$\ni_{\\lambda!}\\left(N[m]\\right)\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\ \\left(i_{\\lambda!}N\\right)[m], \\qquad N\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda),\\ m\\in\\mathbb{Z}.\n$$\n\n</details>\n\n**Step 4 — the closure order $\\le$ is antisymmetric, so \"minimal\" in (A) is unambiguous.**\n\n<details><summary>the argument</summary>\n\nSuppose $\\mu\\le\\lambda$ and $\\lambda\\le\\mu$. Both inclusions pass to closures, so $\\overline{LX}_\\mu=\\overline{LX}_\\lambda=:Z$ ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)), and $Z\\ne\\emptyset$ because $LX_\\lambda$ is an orbit image through a $k$-point ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Argue now on underlying spaces: $LX_\\lambda$ and $LX_\\mu$ are open in $Z$, each $j_\\bullet$ being an open embedding into its own closure (same entry), and each is dense in $Z$, $Z$ being that closure; two dense opens of a nonempty space meet. Since $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ is *the poset of $L^+G$-orbits* of $LX$ (same entry), the strata partition $LX$, so two of them that meet coincide: $LX_\\lambda=LX_\\mu$. Choosing an index is exactly choosing a stratum ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), so $\\lambda=\\mu$.\n\n</details>\n\n**Step 5 — if the conclusion fails, it fails at an index minimal among those where it fails.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\nS:=\\left\\{\\lambda\\in\\Lambda_X^+\\ :\\ \\Delta_{\\lambda,a}\\notin\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}\\ \\text{ for some }a\\in A_\\lambda\\right\\},\n$$\n\nthe $\\Delta_{\\lambda,a}$ being those of the one generating collection the Lemma fixes. Suppose $S\\ne\\emptyset$. By **(A)** it has a minimal element; fix one such $\\lambda$, and fix a witness $a\\in A_\\lambda$ with $\\Delta_{\\lambda,a}\\notin\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. Steps 6–11 run under that fix.\n\n</details>\n\n**Step 6 — at that $\\lambda$, every $\\Delta_{\\mu,b}$ with $\\mu\\in\\partial\\lambda$ and $b\\in A_\\mu$ lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$.**\n\n<details><summary>the argument</summary>\n\nEach $\\mu\\in\\partial\\lambda$ has $\\mu\\le\\lambda$ and $\\mu\\ne\\lambda$, so $\\lambda\\not\\le\\mu$ by Step 4. Minimality of $\\lambda$ in $S$ therefore puts $\\mu\\notin S$, which is exactly the stated membership for every $b\\in A_\\mu$.\n\n</details>\n\n**Step 7 — at that $\\lambda$, $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$.**\n\n<details><summary>the argument</summary>\n\nStep 6 puts every generator of the bracket on the right of **(C)** inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$, which by Step 2 is a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — the ambient in which that bracket is formed. By [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) the bracket is the smallest such subcategory containing its generators, so it lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$; with **(C)**, so does $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$.\n\n</details>\n\n**Step 8 — the counit cofibre at that $\\lambda$ and $a$.**\n\n<details><summary>the argument</summary>\n\nWith $P_{\\lambda,a}$ and $n_{\\lambda,a}$ as supplied by **(D)**, set\n\n$$\nQ_{\\lambda,a}:=\\operatorname{cofib}\\left(i_{\\lambda!}\\,i_\\lambda^!P_{\\lambda,a}\\longrightarrow P_{\\lambda,a}\\right)\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX),\n$$\n\nthe map being the counit of **(H1)**'s adjunction $i_{\\lambda!}\\dashv i_\\lambda^!$ and the cofibre being formed in the stable category $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ of Step 1.\n\n</details>\n\n**Step 9 — $Q_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$.**\n\n<details><summary>the argument</summary>\n\nThe membership $P_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$ that **(D)** supplies is verbatim the hypothesis **(B)** places on its $P$ at this same $\\lambda$, so **(B)** applies to $P_{\\lambda,a}$ and gives $Q_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$; Step 7 puts that subcategory inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$.\n\n</details>\n\n**Step 10 — the source of that counit is $\\Delta_{\\lambda,a}[n_{\\lambda,a}]$.**\n\n<details><summary>the argument</summary>\n\nApply $i_{\\lambda!}$ to the identification $i_\\lambda^!P_{\\lambda,a}\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}E_{\\lambda,a}[n_{\\lambda,a}]$ of **(D)**, then Step 3, then the definition $\\Delta_{\\lambda,a}=i_{\\lambda!}E_{\\lambda,a}$ of the standard objects ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)):\n\n$$\ni_{\\lambda!}\\,i_\\lambda^!P_{\\lambda,a}\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\ i_{\\lambda!}\\left(E_{\\lambda,a}\\left[n_{\\lambda,a}\\right]\\right)\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\ \\Delta_{\\lambda,a}\\left[n_{\\lambda,a}\\right].\n$$\n\n</details>\n\n**Step 11 — at that $\\lambda$ and $a$, $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$.**\n\n<details><summary>the argument</summary>\n\nIn a stable category a cofibre sequence is a fibre sequence, so Steps 8 and 10 give\n\n$$\n\\Delta_{\\lambda,a}\\left[n_{\\lambda,a}\\right]\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\ \\operatorname{fib}\\left(P_{\\lambda,a}\\longrightarrow Q_{\\lambda,a}\\right).\n$$\n\nIts two ends lie in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ — $P_{\\lambda,a}$ by **(D)**, $Q_{\\lambda,a}$ by Step 9 — and by Step 2 that subcategory is closed under fibres formed in the ambient and under the shift $[-n_{\\lambda,a}]$.\n\n</details>\n\n**Step 12 — $S=\\emptyset$, which is the Lemma's first conclusion.**\n\n<details><summary>the argument</summary>\n\nStep 11 contradicts the choice made at Step 5, where $a$ witnessed $\\Delta_{\\lambda,a}\\notin\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So the supposition $S\\ne\\emptyset$ is untenable, and $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda\\in\\Lambda_X^+$ and every $a\\in A_\\lambda$.\n\n</details>\n\n**Step 13 — the renormalized equality.**\n\n<details><summary>the argument</summary>\n\nStep 12 is the right-hand condition of [Q2-L1](../Q2-L1/index.html)(ii), whose hypotheses **(H1)**–**(H3)** of [Q1-L5](../../Q1/Q1-L5/index.html) the Lemma's closing clause puts in force; that clause yields $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\n</details>\n\n**Step 14 — hence [Q1](../../../dag.html)'s equality, for the small categories.**\n\n<details><summary>the argument</summary>\n\nThe ratified reading in [the Satake subcategories](../../../appendix/def-satake-subcategory.html) makes the small Satake subcategory the intersection $\\mathcal{D}_c(K\\backslash LX)\\cap\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$, and $\\mathcal{D}_c(K\\backslash LX)\\subseteq\\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)); substituting Step 13 into that intersection,\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}=_{\\mathcal{D}_c(K\\backslash LX)}\\mathcal{D}_c(K\\backslash LX).\n$$\n\n</details>\n\n## Caveats\n\n- **No separate base case.** When $\\partial\\lambda=\\emptyset$ the bracket on the right of **(C)** has no generators, so **(C)** reads $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq 0$ and Step 9 gives $Q_{\\lambda,a}\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}0$; Step 11 then reads $\\Delta_{\\lambda,a}[n_{\\lambda,a}]\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}P_{\\lambda,a}$. The vanishing comes through **(C)**, not from any conservativity of the family $\\{i_\\mu^!\\}$.\n- **Unproved dependencies used: none.** The only dependency, [Q2-L1](../Q2-L1/index.html), is proved.\n";</script>
