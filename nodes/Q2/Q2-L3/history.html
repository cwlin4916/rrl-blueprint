<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L3 — history\n\n[Q2-L3](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by `/decompose` of [Q2](../../../dag.html), from the user's input passage: this is the corrected form of the sufficiency argument that [Q1-L6](../../Q1/Q1-L6/index.html) attempts. It separates the three geometric issues the $\\omega$-only version conflates — what generates a stratum (hypotheses of [Q2-L2](../Q2-L2/index.html), entering here through the collection $\\{E_{\\lambda,a}\\}$), what happens along a boundary (C), and which orbits a Hecke correspondence reaches (D) — and routes the conclusion through [Q2-L1](../Q2-L1/index.html) rather than through the two clauses of [Q1-L5](../../Q1/Q1-L5/index.html) directly.\n- **2026-08-05 — finiteness replaced by well-foundedness at creation.** The input passage asked for per-closure finiteness of the orbits, the same hypothesis whose withdrawal from [Q1-L4](../../Q1/Q1-L4/index.html) on 2026-08-04 ([its u1](../../Q1/Q1-L4/updates/u1.html)) scoped [Q1-L6](../../Q1/Q1-L6/index.html) to symmetric $X$. What the induction over the orbit poset actually needs is that the order be well-founded, so that a minimal counterexample exists; finiteness implies it and is strictly stronger. Stating (A) instead is what leaves room for [Q2-L4](../Q2-L4/index.html) to supply (C) in a case — $X=\\mathbb{A}^1$ under $\\mathbb{G}_m$ — where each closure has infinitely many orbits and the order is still well-founded.\n- **2026-08-05 — naming.** The input passage called hypothesis (D) *clean costalk*, which is [Q1-L6](../../Q1/Q1-L6/index.html)'s word. In standard sheaf terminology \"clean\" says $j_!\\simeq j_\\ast$, which is not what (D) asserts; (D) says an object of $\\mathcal{A}_X$ has the right leading term and unspecified boundary behaviour. It is called *triangular* here, and the two names are recorded together so a reader of both nodes can see they are the same condition.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged. Its four hypotheses (A)–(D) are each their own labelled paragraph, which is the shape [I23](../../../process/pipeline.html) asks for and the shape this run's presentation decision extends to write-ups.\n- **2026-08-06 — hypothesis (B) restated in a usable ambient** by `/update Q2-L3`, on a defect returned by `/prove Q2-L3`; recorded in [u1.md](updates/u1.html). (B) asserted a localization triangle inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\lambda)$, while (C), (D) and the conclusion all live in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — and the closed world grants no functor between them, so (B) could not be applied and the write-up never consumed it. The induction's real need is that $i_{\\lambda!}$ is extension by zero, which is **not** implied by (H1)–(H3): taking every category equal and every functor the identity satisfies all three while the vanishing fails. (B) now says the counit cofibre is boundary-supported, in the ambient the conclusion is about. The existing [proof.md](proof.html) was written against the old (B) and stands as a draft whose one GAP the new (B) closes; the next `/prove` continues the round numbering.\n- **2026-08-06 — proved** by `/prove Q2-L3`, `PASS` at [r1](critiques/r1.html), ten steps, 878/900 words, no `GAP` — the first round this node has ever been refereed, the earlier write-up having been superseded before anyone read it. **Hypothesis (B) discharges the old `GAP (Supp)` completely**, and not by supplying the missing fact but by removing the need for it: the superseded draft tried to *prove* boundary-support of the counit cofibre stratum by stratum, which needs $i_\\nu^!i_{\\lambda!}\\simeq 0$ off $\\overline{LX}_\\lambda$, whereas (B) asserts the conclusion outright in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. (B)'s hypothesis is verbatim (D)'s support conclusion and its conclusion verbatim (C)'s left-hand side, so the chain (D) → (B) → (C) closes with $\\operatorname{supp}$ and $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ never unfolded. The induction is a minimal counterexample on the failure set, well-founded by (A), which is consumed exactly once. Dropped as unused: full faithfulness and continuity of $i_{\\lambda!}$ — only its being a left adjoint is needed — and with the stratumwise computation went the argument's only use of (H2).\n- **2026-08-06 — the referee's findings for the lead-researcher, [r1](critiques/r1.html).** Three, none of them defects in the write-up. **(B) is not circular** — each of (A)–(D) is consumed exactly once and the conclusion follows from no proper sub-conjunction — but the geometric content has migrated entirely into the hypotheses, leaving this node an *assembly lemma*; that is a judgement about where the difficulty now sits, not a complaint about the proof. **$\\operatorname{supp}$ and $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ are vocabulary no appendix entry defines**, verified by grep over the appendix and [context.md](../../../context.html), so hypotheses (B) and (C) are not yet propositions that anything can discharge. And **no node in the DAG is charged with (B)**: [u1](updates/u1.html) records that discharging it \"stays this node's obligation\", while **depends-on:** is [Q2-L1](../Q2-L1/index.html) alone. Seven `MINOR` flaws stand disposed of by the `PASS`; the two worth acting on are that Step 2's stated reason for stability is a non-sequitur though the fact itself follows from [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), and that the \"minimal element\" caveat is closable inside the declared world — antisymmetry of the closure order follows from the strata being open and dense in their common closure — rather than left standing, since under the preorder reading Step 4 would not reach Step 5.\n- **2026-08-06 — the statement simplified and the support vocabulary removed** by `/update Q2-L3 with input`, on a referee report the user supplied; recorded in [u2.md](updates/u2.html). Three of the four hypotheses quantified over $\\operatorname{supp}$ and over \"the full subcategory of objects supported on $\\partial\\overline{LX}_\\lambda$\", which no appendix entry defines — [r1](critiques/r1.html)'s Flaw 3, which the write-up could only answer by matching the symbol and never unfolding it. The repair uses what **(H1)** already grants: for $T\\subseteq\\Lambda_X^+$, $\\mathcal{D}^{\\mathrm{ren}}_T$ is now *defined* as the objects killed by $i_\\mu^!$ for every $\\mu\\notin T$, and the two instances the lemma needs are $T=\\partial\\lambda$ and $T=\\overline{\\lambda}$. The four labels **(A)**–**(D)** and their roles are untouched, because eight nodes cite them by letter. Inside them: (A) is unchanged; (B) and (D) trade their $\\operatorname{supp}$ clauses for membership of $\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$; (C) weakens from an equality of subcategories to the inclusion the induction actually consumes, which [Q2-L4](../Q2-L4/index.html) still supplies a fortiori; and (B)'s closing gloss, which read as though the hypothesis restated something already in force, now says what [u1](updates/u1.html) established — that it does not follow from (H1)–(H3). Indexing the boundary by the order rather than by a topological complement also deletes the old Step 4 outright, and with it the reading of \"$LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda$\" on underlying spaces that Flaw 3(i) had to flag.\n- **2026-08-06 — what was refuted in the input, and what was not citable.** The input's reason for deleting the preorder caveat — that [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) is declared a poset, so the closure order is antisymmetric — does not follow: the entry calls $\\Lambda_X^+$ partially ordered but introduces the closure order separately, as carried by the presentation. The caveat still goes, on [r1](critiques/r1.html)'s reason instead, and the next write-up *proves* antisymmetry from $LX_\\lambda$ being open and dense in $\\overline{LX}_\\lambda$. Left unverified and not adopted: that Chen–Yi give a triangular standard-to-IC transition matrix — five separate readings of that paper are recorded in [papers/guideline.md](../../../papers/guideline.html) and none registers one. Not citable at all: Gunningham, arXiv:1705.04297, which the input leans on twice for the failure of recollement adjoints; there is no `refs.bib` key and no PDF, and the point it was cited for is already inside the repository as [u1](updates/u1.html)'s counter-model.\n- **2026-08-06 — the orientation paragraph, moved out of the statement.** It read: hypothesis (A) holds, in particular, whenever every orbit closure contains only finitely many orbits — a theorem for symmetric $X$ ([Q1-L6-L1](../../Q1/Q1-L6/Q1-L6-L1/index.html)) and false in the standing class ([Q1-L5-e4](../../Q1/Q1-L5/Q1-L5-e4/index.html)) — but finiteness is not what the induction consumes, and (A) is the weaker thing it does consume. True, and worth a reader knowing, but [r1](critiques/r1.html)'s Flaw 4 is right that it had no business inside a `## Statement`: no step addressed it, and this node's closed world cannot discharge it, since neither node it names is a dependency or an appendix entry. It is orientation, so it lives here.\n- **2026-08-06 — the abstract core split off as [Q2-L3-z1](Q2-L3-z1/index.html).** Stripped of the geometry, the argument is one cofibre sequence and a minimal counterexample: in a cocomplete stable category, a family of objects each of which sits in a cofibre sequence with a middle term in the subcategory and a right term generated by the strictly lower members of the family is contained in that subcategory. Nothing in it mentions $X$, $LX$, a stratum, a support or a Hecke action, which is the sense in which this node is an *assembly lemma* — [r1](critiques/r1.html) said the geometric content had migrated wholesale into (B), (C) and (D), and the abstraction is that finding written down as a statement. It sits on the abstraction axis with `instances:` naming this node, so it caps nothing here and moves no number ([ADR 0061](../../../process/decisions/0061-the-z-axis-is-abstraction-level.html)). The merged three-hypothesis form the input proposed is what it states; at level 0 the four separate hypotheses stay, because (C) and (D) are separately routable to [Q2-L4](../Q2-L4/index.html) and [Q2-L5](../Q2-L5/index.html) and the merged form couples them.\n- **2026-08-06 — reset to `open`.** The statement materially changed, so the `proved` standing from [r1](critiques/r1.html) does not carry over. [proof.md](proof.html) and [r1](critiques/r1.html) stay on disk as history; the next `/prove` continues at `r2`.\n- **2026-08-06 — the gloss on (B) was false, and is deleted** by `/update Q2-L3` on [r2](critiques/r2.html)'s `Flaw 5 [MAJOR]`; recorded in [u3.md](updates/u3.html). [u2](updates/u2.html) had attached to (B) the sentence \"it is not a consequence of **(H1)**–**(H3)**: [u1](updates/u1.html) exhibits a model of all three in which it fails\". That is true of the *old*, $\\operatorname{supp}$-based (B) and false of the restated one: under the new coinage $\\mathcal{D}^{\\mathrm{ren}}_T=\\{M:i_\\mu^!M\\simeq0\\ \\forall\\mu\\notin T\\}$, u1's all-identities model has $\\mathcal{D}^{\\mathrm{ren}}_T=0$ for every proper $T$, so (B) holds there vacuously — the very strengthening u2 made is what defuses the model. Recomputed this run before the finding was adopted. What the round bought instead is a sharpening: given **(H1)** alone, $i_\\lambda^!Q\\simeq0$ is free (full faithfulness of $i_{\\lambda!}$ makes the unit an equivalence, and the triangle identity makes $i_\\lambda^!\\varepsilon_P$ one), so **(B)** is *equivalent* to $i_\\nu^!i_{\\lambda!}i_\\lambda^!P\\simeq0$ for $\\nu\\notin\\overline{\\lambda}$ — extension by zero restricted to the image of $i_\\lambda^!$ on $\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$, a strictly smaller question than the one u1 closed, and still open. The lesson is the one `CLAUDE.md` already states: commentary goes in this file, not inside a `## Statement`. Had u2 put it here, the false sentence would never have been part of a claim.\n- **2026-08-06 — the generating collection is fixed once, in the statement.** [r1](critiques/r1.html)'s Flaw 3(ii), re-raised as [r2](critiques/r2.html)'s Flaw 7: the $\\Delta_{\\mu,b}$ of (C), the $E_{\\lambda,a}$ of (D) and the $\\Delta_{\\lambda,a}$ of the conclusion must come from one stratumwise choice, which [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) says in terms it does not discharge. The statement had been carrying it by shared symbols alone. One sentence now says it.\n";</script>
