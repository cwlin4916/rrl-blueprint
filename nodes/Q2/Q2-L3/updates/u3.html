<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L3</a><i>›</i><span>u3</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L3 — update u3</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L3/updates/u3.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q2-L3](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-06 · **Operator:** `/update Q2-L3`, on `Flaw 5 [MAJOR]` and `Flaw 7 [MINOR]` of [r2](../critiques/r2.html) · **Status before:** `open` · **Status after:** `open`\n\n## The defect, in one sentence\n\nThe gloss [u2](u2.html) attached to hypothesis **(B)** — \"it is not a consequence of **(H1)**–**(H3)**: [u1](u1.html) exhibits a model of all three in which it fails\" — is **false of (B) as u2 restated it**: u1's counter-model refutes the old, $\\operatorname{supp}$-based (B), and the very strengthening u2 made is what defuses it.\n\n## Why the gloss is false, recomputed\n\n[u1](u1.html)'s model takes one category $\\mathcal{E}$ for the ambient and for every stratum, with every $i_\\mu^!$ and every $i_{\\mu!}$ the identity. Under u2's coinage\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_T=\\left\\{M\\ :\\ i_\\mu^!M\\simeq 0\\ \\text{ for every }\\mu\\in\\Lambda_X^+\\setminus T\\right\\}\n$$\n\nthat model gives $\\mathcal{D}^{\\mathrm{ren}}_T=0$ for every proper $T\\subsetneq\\Lambda_X^+$, because $i_\\mu^!=\\mathrm{id}$ turns the defining vanishing into $M\\simeq 0$. So **(B)** holds there, both ways round: if $\\overline{\\lambda}\\neq\\Lambda_X^+$ it quantifies over $P\\simeq 0$ alone and the cofibre is $0$; and if $\\overline{\\lambda}=\\Lambda_X^+$ the counit is the identity, so the cofibre is $0$ again — and $0$ lies in every $\\mathcal{D}^{\\mathrm{ren}}_T$.\n\nWhat u1 refuted is *unrestricted* extension by zero, which the old (B) needed and the new one does not. Citing a record that no longer says what it is cited for is the same defect class as an appendix entry mis-stating its source. Verified this run before adopting the referee's finding.\n\n## What is true instead, and it is smaller\n\nGiven **(H1)** alone, half of **(B)**'s conclusion is free. Write $Q=\\operatorname{cofib}(\\varepsilon_P)$ for the counit $\\varepsilon_P\\colon i_{\\lambda!}i_\\lambda^!P\\rightarrow P$. Since $i_{\\lambda!}$ is fully faithful the unit $\\mathrm{id}\\rightarrow i_\\lambda^!i_{\\lambda!}$ is an equivalence, so the triangle identity makes $i_\\lambda^!\\varepsilon_P$ one, and exactness of $i_\\lambda^!$ gives\n\n$$\ni_\\lambda^!Q\\ \\simeq\\ \\operatorname{cofib}\\left(i_\\lambda^!\\varepsilon_P\\right)\\ \\simeq\\ 0 .\n$$\n\nFor $\\nu\\notin\\overline{\\lambda}$ the hypothesis $P\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$ gives $i_\\nu^!P\\simeq 0$, so $i_\\nu^!Q\\simeq\\left(i_\\nu^!\\,i_{\\lambda!}\\,i_\\lambda^!P\\right)[1]$. Hence, given **(H1)**, hypothesis **(B)** is *equivalent* to\n\n$$\ni_\\nu^!\\,i_{\\lambda!}\\,i_\\lambda^!P\\ \\simeq\\ 0 \\qquad\\text{for every }\\nu\\notin\\overline{\\lambda}\\text{ and every }P\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}} :\n$$\n\nextension by zero **restricted to the image of $i_\\lambda^!$ on $\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$**. Whether *that* follows from **(H1)**–**(H3)** is open, and it is a strictly smaller question than the one u1 closed. This is the sharpening the round bought, and it belongs to whichever node is eventually charged with (B) — currently none, which is priority [P42](../../../../../blueprint/priorities.md).\n\n## What changed\n\n**(B)'s gloss.** The false second sentence is deleted. The first sentence — that this is the localization triangle a recollement of $LX_\\lambda$ inside its closure supplies, read in the ambient the conclusion is about — is true and stays. The rest is commentary and now lives in the [history](../history.html), which is where `CLAUDE.md` says commentary goes; had u2 put it there, the false sentence would never have been inside a claim.\n\n**The generating collection is fixed once.** One sentence added before the hypotheses: the $\\Delta_{\\mu,b}$ of **(C)**, the $E_{\\lambda,a}$ of **(D)** and the $\\Delta_{\\lambda,a}$ of the conclusion all come from one stratumwise choice. This is [r1](../critiques/r1.html)'s Flaw 3(ii), re-raised as [r2](../critiques/r2.html)'s Flaw 7: [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) says in terms that the collection is a choice it does not discharge, and u2 left the statement carrying the compatibility by shared symbols alone. Harmless — the argument is valid under any one fixed choice, and [Q2-L1](../../Q2-L1/index.html)(iii) repairs it if pressed — but the rewrite was the moment to say it.\n\n## The three columns\n\n**Verified.** That u1's model satisfies the new **(B)**, recomputed above rather than adopted from the referee. That $i_\\lambda^!Q\\simeq0$ follows from **(H1)** alone, and hence that **(B)** reduces to the vanishing off $\\overline{\\lambda}$ — both re-derived, including the direction of the adjunction ($i_{\\lambda!}$ left adjoint, so full faithfulness of $i_{\\lambda!}$ is equivalence of the **unit** $\\mathrm{id}\\rightarrow i_\\lambda^!i_{\\lambda!}$, which is what the triangle identity then consumes).\n\n**Refuted.** [u2](u2.html)'s claim that u1's counter-model bears on the restated **(B)**. It does not.\n\n**Unverified.** Whether the restricted extension-by-zero above follows from **(H1)**–**(H3)**. [r2](../critiques/r2.html) could not settle it either way and neither could this run; it stays the open obligation, now stated in its smallest form.\n\n## Considered and not adopted\n\n- **Replacing the gloss with the sharpened equivalence** — stating in **(B)** that it is equivalent, given (H1), to the restricted vanishing. Rejected: it is a *theorem about* the hypothesis, so under [I28](../../../../process/pipeline.html) it would be a claim asserted where nothing proves it. It goes in this record and in the history, and the node eventually charged with (B) states it.\n- **Deleting (B)'s gloss entirely.** Rejected: the surviving first sentence says which localization triangle is meant, which a reader needs and no other sentence supplies.\n- **Weakening (B) to the restricted vanishing outright.** Rejected: that is a statement revision on a claim no round has yet tested, made on the strength of one referee's derivation and one operator's check. It is recorded here and is the first thing the node charged with (B) should consider.\n";</script>
