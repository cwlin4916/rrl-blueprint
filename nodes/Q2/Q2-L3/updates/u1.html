<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L3</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L3 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L3/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q2-L3](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-06 · **Operator:** `/update Q2-L3`, on a defect returned by `/prove Q2-L3` · **Status before:** `open` · **Status after:** `open`\n\n## The defect, in one sentence\n\nHypothesis **(B)** was stated inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\lambda)$, an ambient the closed world grants no functor out of, while (C), (D) and the conclusion all live in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — so (B) could not be applied to anything the node reasons about, and the write-up never consumed it.\n\n## Why this is a real defect and not a presentational one\n\nThe induction needs one fact at its inductive step: that the cofibre of the counit $i_{\\lambda!}i_\\lambda^!P\\to P$ is supported on the boundary, equivalently that $i_{\\lambda!}$ is extension by zero,\n\n$$\ni_\\nu^!\\,i_{\\lambda!}N \\simeq 0 \\qquad\\text{for }N\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\text{ and }LX_\\nu\\cap\\overline{LX}_\\lambda = \\emptyset .\n$$\n\nThat fact is **not** a consequence of the standing hypotheses (H1)–(H3), and the counter-model is elementary: take one fixed category $\\mathcal{E}$ for $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, for every stratum category and for every closure category, and take every $i_\\lambda^!$, $i_{\\lambda!}$, $\\overline{i}_\\mu^!$ to be the identity. Then (H1) holds (the identity is continuous and fully faithful, and is its own adjoint), (H2) holds (a limit of a constant diagram with identity transitions), and (H3) holds (a family of identities is jointly conservative) — while $i_\\nu^!i_{\\lambda!}N = N \\neq 0$ for every nonzero $N$, however disjoint the strata. Verified this run before adoption.\n\n(B) was *meant* to supply exactly this, and does supply it one level down, inside a single closure. But the closed world contains no functor from $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\lambda)$ to $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$: (H2) gives the restrictions $\\overline{i}_\\mu^!$ — which is where the write-up does use it, for joint conservativity — and grants neither $\\overline{i}_{\\lambda\\ast}$ nor the base change $\\overline{i}_\\lambda^!\\,i_{\\lambda!}\\simeq j_{\\lambda!}$ that would carry (B) up. A hypothesis that cannot be applied is not a hypothesis.\n\n## Old statement, hypothesis (B), verbatim\n\n> **(B) Recollement inside each closure.** For every $\\lambda$, with $j_\\lambda\\colon LX_\\lambda\\hookrightarrow\\overline{LX}_\\lambda$ the open embedding and $k_\\lambda\\colon\\partial\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_\\lambda$ the closed complement, every $P\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\lambda)$ sits in a localization triangle\n>\n> $$\n> j_{\\lambda!}\\,j_\\lambda^!P\\ \\longrightarrow\\ P\\ \\longrightarrow\\ k_{\\lambda\\ast}\\,k_\\lambda^\\ast P .\n> $$\n\n## New statement, hypothesis (B)\n\n> **(B) The counit cofibre is boundary-supported.** For every $\\lambda\\in\\Lambda_X^+$ and every $P\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ with $\\operatorname{supp}(P)\\subseteq\\overline{LX}_\\lambda$,\n>\n> $$\n> \\operatorname{cofib}\\left(i_{\\lambda!}\\,i_\\lambda^!P\\ \\longrightarrow\\ P\\right)\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} .\n> $$\n>\n> This is the recollement of the closure read in the ambient $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ that the conclusion is about, and it is what makes $i_{\\lambda!}$ extension by zero.\n\n## The three columns\n\n**Verified.** That (B) as it stood is never usable in this node's ambient, and that the write-up in fact never used it — read this run in [proof.md](../proof.html). The counter-model above, recomputed rather than adopted from the prover's report.\n\n**Refuted.** That the extension-by-zero property follows from (H1)–(H3). It does not; the counter-model is the witness.\n\n**Unverified, and deliberately still a hypothesis.** That the new (B) *holds* for the spherical strata of $LX$. It is a statement about the sheaf theory that the appendix does not carry — the closed factor of $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ is reachable through [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html), and the extension-by-zero half $j_{\\lambda!}$, with the identification $\\overline{i}_{\\lambda\\ast}j_{\\lambda!}\\simeq i_{\\lambda!}$, is not. Discharging it stays this node's obligation, now stated where it can be discharged.\n\n## Considered and not adopted\n\n- **Deriving the vanishing from (H1)–(H3) and deleting (B) entirely.** Rejected: the counter-model shows it cannot be derived.\n- **Adding $\\overline{i}_{\\lambda\\ast}$ and the base change to the standing hypotheses so the old (B) could be transported.** Rejected: that widens the question's standing hypotheses for one node's convenience, and (H1)–(H3) are shared with [Q1-L5](../../../Q1/Q1-L5/index.html), whose children are discharging them. Restating (B) where it is used costs nothing and moves no other node.\n- **Leaving (B) and letting the write-up carry the vanishing as a GAP.** Rejected: the node would then have a hypothesis it never uses and a gap it cannot close, which is two defects rather than one.\n";</script>
