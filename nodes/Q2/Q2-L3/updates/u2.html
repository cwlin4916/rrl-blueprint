s were in that state. The consequence is not local: [Q2-L4](../../Q2-L4/index.html) is charged with **(C)** and [Q2-L5](../../Q2-L5/index.html) with **(D)**, and when they come to be assembled, the compatibility that this write-up gets for free by symbol matching — that the $\\operatorname{supp}$ of (D) and the $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ of (C) are the *same* notion — is exactly what would have to be checked and had nowhere to be checked against.\n\nThe repair is available inside the closed world and costs nothing. **(H1)** already supplies the restrictions $i_\\mu^!$, so a full subcategory of objects \"carried by\" a set of indices can be *defined* by the vanishing of those restrictions, with no support theory behind it. That is what the new preamble does, and it discharges three further findings at the same time: with the boundary indexed by the order rather than cut out of a topological space, the old Step 4 — which had to argue that a stratum in $\\partial\\overline{LX}_\\lambda$ is strictly below $\\lambda$, and had to read \"$LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda$\" on underlying spaces because the complement of an open in a reduced closure carries no scheme structure ([r1](../critiques/r1.html), Flaw 3(i)) — becomes the definition of $\\partial\\lambda$ and disappears.\n\n## Old statement, verbatim\n\n> Write $\\partial\\overline{LX}_\\lambda := \\overline{LX}_\\lambda\\setminus LX_\\lambda$ for the boundary of the closure ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html)) and $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ for the full subcategory of objects supported on it. Assume hypothesis **(H1)** of [Q1-L5](../../../Q1/Q1-L5/index.html), and in addition:\n>\n> **(A) Well-founded closure order.** Every nonempty subset of $\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)) has a minimal element for the closure order $\\mu\\le\\lambda \\Leftrightarrow LX_\\mu\\subseteq\\overline{LX}_\\lambda$.\n>\n> **(B) The counit cofibre is boundary-supported.** For every $\\lambda\\in\\Lambda_X^+$ and every $P\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ with $\\operatorname{supp}(P)\\subseteq\\overline{LX}_\\lambda$,\n>\n> $$\n> \\operatorname{cofib}\\left(i_{\\lambda!}\\,i_\\lambda^!P\\ \\longrightarrow\\ P\\right)\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} .\n> $$\n>\n> This is the recollement of the closure, read in the ambient the conclusion is about, and it is what makes $i_{\\lambda!}$ extension by zero.\n>\n> **(C) Boundary dévissage.** For every $\\lambda$,\n>\n> $$\n> \\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} = \\left\\langle \\Delta_{\\mu,b}\\ \\middle|\\ LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda,\\ b\\in A_\\mu \\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n> $$\n>\n> **(D) Triangular Hecke objects.** For every $\\lambda\\in\\Lambda_X^+$ and every $a\\in A_\\lambda$ there are $P_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ and $n_{\\lambda,a}\\in\\mathbb{Z}$ with\n>\n> $$\n> \\operatorname{supp}\\left(P_{\\lambda,a}\\right)\\subseteq\\overline{LX}_\\lambda, \\qquad i_\\lambda^!P_{\\lambda,a}\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\ E_{\\lambda,a}\\left[n_{\\lambda,a}\\right].\n> $$\n>\n> Then $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda$ and every $a$. Consequently, under the standing hypotheses (H1)–(H3) of [Q1-L5](../../../Q1/Q1-L5/index.html), [Q2-L1](../../Q2-L1/index.html)(ii) gives $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, hence [Q1](../../../../dag.html)'s equality.\n>\n> Hypothesis (A) holds, in particular, whenever every orbit closure contains only finitely many orbits — which is a theorem for symmetric $X$ ([Q1-L6-L1](../../../Q1/Q1-L6/Q1-L6-L1/index.html)) and false in the standing class ([Q1-L5-e4](../../../Q1/Q1-L5/Q1-L5-e4/index.html)) — but finiteness is not what the induction consumes, and (A) is the weaker thing it does consume.\n\n## What changed, clause by clause\n\nThe four labels **(A)**, **(B)**, **(C)**, **(D)** are unchanged and keep their roles, because eight nodes cite them by letter — [Q2-L4](../../Q2-L4/index.html) is (C), [Q2-L5](../../Q2-L5/index.html) supplies (D), [Q1-L3-c1](../../../Q1/Q1-L3/Q1-L3-c1/index.html) contraposes (D) and names (A) and (B), and [Q2-e1](../../Q2-e1/index.html) with its L2 and L3 verifies (A), (C) and (D) in the group case. What moved is inside them.\n\n**Preamble.** $\\operatorname{supp}$ and \"the full subcategory of objects supported on $\\partial\\overline{LX}_\\lambda$\" are gone. In their place, one coinage with no claim in it: for a subset $T\\subseteq\\Lambda_X^+$, $\\mathcal{D}^{\\mathrm{ren}}_T$ is the full subcategory of objects whose $!$-restriction to every stratum *outside* $T$ vanishes. The two instances used are $T=\\partial\\lambda$, the indices strictly below $\\lambda$, and $T=\\overline\\lambda=\\partial\\lambda\\cup\\{\\lambda\\}$.\n\n**(A).** Unchanged, character for character.\n\n**(B).** The hypothesis on $P$ is now membership of $\\mathcal{D}^{\\mathrm{ren}}_{\\overline\\lambda}$ rather than a condition on $\\operatorname{supp}(P)$, and the conclusion is membership of $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ as now defined. The closing gloss \"This is the recollement of the closure … and it is what makes $i_{\\lambda!}$ extension by zero\" is replaced: it read as though the hypothesis were a restatement of something already in force, when [u1](u1.html) had established the opposite by exhibiting a model of **(H1)**–**(H3)** in which it fails. The new gloss says it is the localization triangle a recollement supplies and that it is not a consequence of the standing package.\n\n**(C).** Weakened from an equality of subcategories to the inclusion $\\subseteq$, which is the only direction any step consumes, and the index set is $\\partial\\lambda$ rather than \"$LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda$\". [Q2-L4](../../Q2-L4/index.html) proves the equality and so supplies the inclusion a fortiori; nothing downstream weakens.\n\n**(D).** The clause $\\operatorname{supp}(P_{\\lambda,a})\\subseteq\\overline{LX}_\\lambda$ becomes $P_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline\\lambda}$, and the name in the label becomes *triangular Satake lift*, which says what the object is for: reached from [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) by Hecke operations, prescribed leading term on the stratum, unconstrained below it.\n\n**The closing orientation paragraph** — finiteness of each closure's orbit set implies (A) — is removed from the statement and kept in the [history](../history.html). [r1](../critiques/r1.html), Flaw 4: it is an assertion inside a statement that no step addresses and that this node's closed world cannot discharge, since the two nodes it names are neither dependencies nor appendix entries.\n\n## The three columns\n\n**Verified.** That the lemma is a correct implication under (A)–(D), each hypothesis consumed exactly once and the conclusion following from no proper sub-conjunction — re-derived this run, and independently the finding of [r1](../critiques/r1.html). That the induction's whole content is the single cofibre sequence $\\Delta_{\\lambda,a}[n_{\\lambda,a}]\\to P_{\\lambda,a}\\to Q_{\\lambda,a}$ with the outer two terms in the Satake subcategory. That **(C)** is consumed only through the single object $Q_{\\lambda,a}$, so the inclusion suffices and the equality is not needed. That taking $P_{\\lambda,a}=\\Delta_{\\lambda,a}$ would assume the conclusion. That $\\langle-\\rangle$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is cocomplete stable generation and not a finite filtration, so no unitriangular transition matrix is available and the *slogan* $[P]=[\\Delta[n]]+\\text{lower}$ is heuristic. That the input's Step 2 correction is right: a left adjoint preserves colimits, hence finite colimits, hence is exact between stable categories.\n\n**Refuted.** The input's reason for deleting the preorder caveat — \"the prompt declares $\\Lambda_X^+$ to be a poset, hence the closure order is already antisymmetric\". [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) does call it a partially ordered set, but it does not identify that order with the closure order, which the same entry introduces separately as \"carried by the presentation\". The conclusion is nonetheless correct and the caveat does go, on the reason [r1](../critiques/r1.html) gives instead: $LX_\\lambda$ is open in $\\overline{LX}_\\lambda$ and dense in it, two dense opens of a nonempty space meet, and distinct orbits are disjoint. The next write-up proves antisymmetry rather than assuming it.\n\n**Unverified, and not adopted.** That Chen–Yi describe the standard-to-IC transition as triangular for the orbit-closure order with finite transition matrices in a Grothendieck group. The reading list's record of [`chenyi_2025singularitiesorbitclosuresloop`](../../../../papers/guideline.html) — five separate readings of that paper, including pp. 10–14 and 20–24 twice — registers the closure theorem, placidity, the dimension theory, semisimplicity of the relative Satake category in even codimension and formality of the de-equivariantised Ext algebra, and no transition matrix. Nothing rests on the claim here and none of it enters the statement. That the new **(B)** *holds* for the spherical strata of $LX$ — still the open obligation [u1](u1.html) left, still owned by nobody.\n\n**Not citable.** Gunningham, *A Derived Decomposition for Equivariant $D$-modules* (arXiv:1705.04297), which the input cites twice for the failure of the recollement adjoints outside the ind-holonomic or ind-constructible locus. There is no key for it in `refs.bib` and no PDF in [papers](../../../../papers/guideline.html), so the closed world does not contain it and no word of it is used. The point it is cited for — that (B) is a real obligation and not a formality — is already established inside the repository by [u1](u1.html)'s counter-model, which is where the new gloss points.\n\n## Considered and not adopted\n\n- **Merging (B), (C) and (D) into one hypothesis** — \"there is $P_{\\lambda,a}\\in\\mathcal{S}$ with the right costalk whose counit cofibre lies in $\\langle\\Delta_{\\mu,b}\\mid\\mu<\\lambda\\rangle$\" — which is the shortest true form and is what the abstraction [Q2-L3-z1](../Q2-L3-z1/index.html) states. Rejected at level 0: it couples the boundary dévissage to the particular objects (D) supplies, and the whole value of the present shape is that (C) and (D) are separately routable, to [Q2-L4](../../Q2-L4/index.html) and [Q2-L5](../../Q2-L5/index.html) respectively. The merged form is the right one *above* the geometry, which is exactly why it becomes its own node on the abstraction axis instead of replacing this one.\n- **Renaming $P_{\\lambda,a}$ to $T_{\\lambda,a}$ or $H_{\\lambda,a}$**, as the input suggests, on the ground that $P$ does not indicate the role. Rejected: [Q2-L5](../../Q2-L5/index.html) concludes about $P_\\lambda$ by that symbol, [Q1-L3-c1](../../../Q1/Q1-L3/Q1-L3-c1/index.html) and [Q2-e1](../../Q2-e1/index.html) refer to it, and a symbol change buys nothing a name in the label does not. The label now carries the role instead.\n- **Defining $\\operatorname{supp}$ as an appendix entry** and leaving the statement alone. Rejected: a support theory on an ind-scheme of infinite type is a substantial entry, and this node needs none of it — the vanishing of finitely many restrictions is all four hypotheses ever use.\n- **Keeping (C) as an equality.** Rejected: the reverse inclusion says every $\\Delta_{\\mu,b}$ with $\\mu\\in\\partial\\lambda$ is itself carried by $\\partial\\lambda$, which no step consumes and which is one more thing an instance would have to check.\n";</script>
