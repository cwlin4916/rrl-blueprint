<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L1 — history\n\n[Q2-L1](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by `/decompose` of [Q2](../../../dag.html), from the user's input passage: this is the node that makes Q2 a question rather than a restatement of [Q1](../../../dag.html). [Q1-L5](../../Q1/Q1-L5/index.html) leaves the criterion in two clauses — stratumwise generation and support-cutting — and its own commentary shows the second does not follow from the first, so a geometer testing a given $X$ has two unrelated things to check. Clause (i) here collapses them into one membership statement about the standard objects $i_{\\lambda!}E_{\\lambda,a}$, which is a single question about each orbit and is the form the rest of Q2 attacks.\n- **2026-08-05 — hypothesis sharpened at creation.** The input passage stated the equivalence under (H1)–(H3). Both directions of the argument use only the adjunction $i_{\\lambda!}\\dashv i_\\lambda^!$, its unit-section $i_\\lambda^!i_{\\lambda!}\\simeq\\mathrm{id}$, and continuity of the two functors — that is (H1) alone. (H2) and (H3) enter only when the two conditions are cashed in for the equality $\\mathcal{A}_X=\\mathcal{C}$, which is [Q1-L5](../../Q1/Q1-L5/index.html)'s business and is why (ii) is stated separately. Splitting the clauses keeps the cheap half of the node available to any $X$ for which the closure-level hypotheses are still open.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: it quantifies over arbitrary generating collections $\\{E_{\\lambda,a}\\}$ of the stratum categories and never names the group they come from, so the correction made to [Q2-L2](../Q2-L2/index.html) — which does name it — leaves this node's text alone.\n- **2026-08-05 — commentary moved here from the [Q2](../../../dag.html) framing** by `/update`, under [ADR 0044](../../../process/decisions/0044-a-question-states-a-problem-not-its-route.html): a question states a problem and carries no commentary on it. *Why Q2 is a question and not a restatement.* Under the standing hypotheses the membership $\\Delta_{\\lambda,a}\\in\\mathcal{A}_X$ is necessary and sufficient for [Q1](../../../dag.html)'s equality — that is this node — which replaces the two conditions of [Q1-L5](../../Q1/Q1-L5/index.html), stratumwise generation and the support-cutting that does not follow from it, by one membership statement. [Q1](../../../dag.html) asks *whether* a criterion holds; Q2 asks *of which $X$*, in a form checked one orbit at a time whose input is the orbit geometry of $LX$ rather than the sheaf theory over it.\n- **2026-08-06 — proved** by `/prove Q2-L1`, `PASS` at [r2](critiques/r2.html). Fifteen steps, 899/900 words, closed entirely inside the existing closed world — no GAP, and the only node of Q2 for which that was true this run. Between the two rounds the write-up was **renotated, not reproved**: the repository removed $\\mathcal{A}_X$, and the referee checked all fourteen $\\mathrm{Sat}$ occurrences individually to confirm the cocomplete and small Satake subcategories had not been confused, which the new notation makes an easier slip to commit and a harder one to see. The referee also read [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] on the page and found the generation criterion needs presentability and a right adjoint, both of which hold here. Nine `MINOR` flaws stand disposed of by the `PASS`, seven of them repeats from [r1](critiques/r1.html); the most useful is that the derivation of global joint conservativity from (H2)+(H3) is still cited rather than written, and is available as a pointer to the \"Moreover\" clause of [Q1-L5](../../Q1/Q1-L5/index.html).\n- **2026-08-06 — statement made self-contained** by `/update Q2-L1`, at the user's direction, recorded in [u1](updates/u1.html). The node quantified over $\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$ and conditions (1) and (2) of [Q1-L5](../../Q1/Q1-L5/index.html) without showing any of them on the page. All four are now written out — a Setup block defining a generating collection and a standard object, then **(H1)**, **(1)** and **(2)** as their own labelled paragraphs — so the two conditions this node collapses stand beside the single membership that replaces them. The revision is expository: the propositions (i), (ii) and (iii) are unchanged, [proof.md](proof.html) proves those same propositions, and the status was therefore **not** reset from `proved` — the reasoning for that departure from [ADR 0019](../../../process/decisions/0019-the-update-operator.html) is in [u1](updates/u1.html).\n- **2026-08-06 — literature examined** by `/examples Q2-L1`, verdict `EVIDENCE: instances`, recorded in [examples.md](examples.html). No source states clause (i), (ii) or (iii), and none contradicts them; what *is* in print is the node's **hypotheses**. Chen–Nadler (`chen2024real`, arXiv:2403.13995v1, §8.4, p. 38, read on the page this run) prove that $K(\\mathcal{K})\\backslash\\mathrm{Gr}\\simeq X(\\mathcal{K})/G(\\mathcal{O})$ with its orbit stratification \"is a placid stratified stack, admitting gluing of sheaves\" — that is **(H1)** with (H2) and (H3), for symmetric $X$ over $\\mathbb{C}$ in the constructible formalism rather than for $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$, and their definition bundles a per-closure finiteness clause that the two non-homogeneous bench entries fail. Four instances and one analogue were found, the simplest being $X = \\mathrm{pt}$, where $i_0 = \\mathrm{id}$ and clause (i) collapses to \"(1) is the membership\".\n- **2026-08-06 — what the literature does not touch**, from the same run. Nothing found matches the two **directions** of clause (i) as implications — every finding lands on one side of the biconditional or the other, and the passage between them is matched only where it is a tautology. Nothing at all matches clause **(iii)**, independence of the generating collection: the nearest result, Chen–Nadler Prop. 13.7(1), goes the other way, since its irreducibles carry trivial local systems only and so never exhibit two distinct generating collections. The formal content of this node is folklore recollement with no numbered home that could be verified, unpublished at this generality because nobody has needed it for an infinite, non-well-founded stratification.\n- **2026-08-07 — reset to `open`: the write-up proves the pre-[u1](updates/u1.html) statement** ([u2](updates/u2.html)). The repo-wide `/update` compared the draft's `## Lemma` against the current `## Statement` and found **no paragraph in common** — twenty-nine against nine. [u1](updates/u1.html) recorded \"Status before: `proved` · Status after: `proved`\", so the node has been carrying a `proved` badge for a claim it stopped making on 2026-08-06. The statement is not revised; only the status is. The next `/prove` continues at r3 and is a rebuild, not a patch.\n- **2026-08-08 — the [Q2](../../../dag.html) framing simplified, and clause (iii) extended to carry it** by `/update Q2`, at the user's direction, recorded in [u3](updates/u3.html). Q2 declared **(H1)**–**(H3)** standing when its Problem statement needs **(H1)** alone: every occurrence of **(H2)** or **(H3)** in a Q2 statement is inside the range *(H1)–(H3)*, and all four sit in clauses whose job is the hand-off to [Q1](../../../dag.html) — **(H2)** is named nowhere in Q2 on its own. This node's own creation entry of 2026-08-05 had already recorded that judgement and the framing was never brought into line. The Problem statement is now the choice-free containment $i_{\\lambda!}(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda))\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$, with the standard-object form given after it, and this node is no longer offered as a *condition on the geometry of $LX$* answering Q2 — which was circular, it being a reformulation of the membership asked about. Clause (iii) gained the equivalence the framing cites, from **(H1)** and the minimality half of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html). **Material**: [proof.md](proof.html) does not prove the new clause. The status was already `open` and stays there; the next `/prove` continues at `r3` as a rebuild. The user's input passage was verified and **not adopted** — see [u3](updates/u3.html) for the three columns.\n";</script>
