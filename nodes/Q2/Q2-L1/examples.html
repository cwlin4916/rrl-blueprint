<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L1</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L1 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q2-L1\n\n[node](index.html) · [DAG index](../../../dag.html) · [papers](../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q2-L1](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: instances\n\n**The dictionary** — used by instance 4 alone, which is an analogue and not an instance.\nChen–Nadler work with the *abelian semisimple shadow* of the Satake subcategory, and every\nline below is theirs. Their $\\omega_{X(\\mathcal{O})/G(\\mathcal{O})}$, the dualizing complex of\nthe closed orbit, is the basic object, i.e. $\\mathrm{IC}_0$ (Definition 13.6, p. 59); their\n$\\mathrm{IC}_V$, $V\\in\\mathrm{Rep}(G^\\vee)$, run over the Satake generators of the spherical\nHecke category, i.e. over the $\\mathcal{F}$ (the monoidal abelian Satake equivalence quoted at\nthe head of §13.2, p. 57); their $\\star^p$ of (13.5) is the spherical Hecke action followed by\nperverse cohomology; and their \"direct sums of summands of\" replaces the generation operation\n$\\langle-\\rangle$. **The last line is where the dictionary breaks.** Summands of one\nconvolution form a semisimple abelian category, while $\\langle-\\rangle$ is closed under\ncofibres and all small colimits, so $Q_X$ sits strictly inside the node's Satake subcategory\nand an object outside $Q_X$ is not thereby outside the Satake subcategory.\n\n## Precedent\n\n**What was searched.** For the criterion itself: `BZSV` §7.5 on disk (pp. 164–169 read this\nrun) as the natural home of a Satake-level generation statement; `chen2024real` §§8, 13\n(pp. 36–38 and 57–60 read this run); `chen2022quaternionic` §1.4 (pp. 5–6 read this run). For\nthe abstract engine — *a cocomplete stable subcategory of a category glued from a\nstratification is everything iff it contains the $!$-extensions of generators of every\nstratum* — web searches against Drinfeld–Gaitsgory (arXiv:1112.2402, full text scanned),\nLurie's `HA` §A.8 (*Digression: Recollement*), Barwick–Glasman's note on stable recollements,\nAyala–Mazel-Gee–Rozenblyum's *Stratified noncommutative geometry* (arXiv:1910.14602) and the\nquasi-hereditary/standard-object literature.\n\n**What was found.** No source states clause (i), (ii) or (iii), and none contradicts them.\nThree hits, all verified on the page.\n\n*Chen–Nadler, `chen2024real` (arXiv:2403.13995v1), §8.4, p. 38 — the hypotheses, in print.*\nFollowing [BKV, §2.4.8] they call an ind-stack **placid stratified** when each stratum is a\nplacid stack with fp-locally closed inclusion **and** there is a presentation\n$\\mathcal{Y} = \\mathrm{colim}_j\\mathcal{Y}^j$ by closed substacks each of which is a *finite*\nunion of strata; and they conclude, from their Prop. 8.3, Cor. 8.4 and Lemma 8.7, that\n$K(\\mathcal{K})\\backslash\\mathrm{Gr}\\simeq X(\\mathcal{K})/G(\\mathcal{O})$ with the orbit\nstratification \"is a placid stratified stack, admitting gluing of sheaves\". That definition is\n**(H1) together with (H2) and (H3)**, and their $j^\\lambda_{X,!}$, used on the same page to\nbuild $\\mathrm{IC}^\\lambda_X$, is the node's $i_{\\lambda!}$. This is a precedent for the\nnode's *hypotheses* and for no clause of its conclusion. Two limits on it: the setting is\n$X = K\\backslash G$ **symmetric** over $\\mathbb{C}$ in the $\\mathbb{C}$-constructible BKV\nformalism, not $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$; and the finiteness\nclause is a genuine restriction — see instance 3.\n\n*Ben-Zvi–Sakellaridis–Venkatesh, `BZSV` (arXiv:2409.04677), §7.5.3 with Lemma 7.5.13, p. 167.*\nThe proof of the Lemma reads: \"The Lemma follows from the observation (§7.5.3) that in the\npresence of the local conjecture, the entire automorphic category is generated in this way.\"\nThat is the **left-hand side of clause (ii)**, asserted in the direction *conjecture\n$\\Rightarrow$ generation*. No standard object appears anywhere in §7.5 and no criterion for\ngeneration is stated, so clauses (i), (iii) and the $\\Leftarrow$ of (ii) are untouched.\n\n*Chen–Nadler, Definition 13.6 with Corollary 13.8, pp. 59–60.* Computes, in the abelian\nshadow, which orbits the Hecke orbit of the basic object reaches, and answers\n$\\sigma(\\Lambda_T)$ rather than $\\Lambda_S^+$. Entry 4 below.\n\n**What was not found.** The stratified generation lemma has no numbered home I could verify.\nDrinfeld–Gaitsgory's compact-generation paper organizes itself around truncativeness rather\nthan stratifications, and its §3.2.1 states that truncativeness \"never occurs for schemes\",\nso it is not the source. `HA` §A.8 defines recollement with joint conservativity as an axiom —\nthe two-stratum shape of (H1)+(H3) — but no generation statement was located there, and that\nsection was **not** read at page level this run. Ayala–Mazel-Gee–Rozenblyum prove a\nreconstruction theorem for stratified presentable stable categories, which would entail\n(H2)–(H3) at that generality, but the arXiv HTML build is broken and no numbered statement was\nread. **The absence is informative in one direction only**: the formal content of Q2-L1 is\nfolklore recollement, unpublished at this generality because nobody has needed it for an\ninfinite, non-well-founded stratification. The substantive half — whether the membership\n*holds* for a given $X$ — is [Q2](../../../dag.html)'s own question and is nowhere in print.\n\n## Instances\n\n### 1. $X = \\mathrm{pt}$, any $G$ — instance\n\n**What it is.** One stratum: $LX = \\mathrm{pt}$, $K\\backslash LX = BL^+G$, $i_0 = \\mathrm{id}$\nand $i_{0!} = \\mathrm{id}$, so $\\Delta_{0,a} = E_{0,a}$.\n\n**Why it is an instance.** Smooth affine spherical for every $G$; (H1) holds with both functors\nthe identity, (H2) and (H3) over a one-element poset. BZSV §7.6.3 (p. 169) make the unramified\nconjecture a theorem here (derived Satake, Bezrukavnikov–Finkelberg), which with §7.5.3 gives\ngeneration by the Hecke translates.\n\n**What it matches.** Clauses (i) and (ii) in full over the trivial stratification, and\nnon-vacuity. It does **not** reach (iii) with any content, and it exercises nothing of the\nrecollement: support-cutting (2) is the identity.\n\n**What the statement says here.** (1) *is* the membership, and (2) is\n$\\mathcal{F}\\ast\\mathrm{IC}_0\\in\\mathcal{D}^{\\mathrm{ren}}(BL^+G)^{\\mathrm{Sat}}$, true by\ndefinition.\n\n**Source.** `BZSV`, §7.6.3, p. 169, and Lemma 7.5.13 with §7.5.3, p. 167 (read this run).\n\n### 2. $X = G$ under $G\\times G$ — instance, degenerate\n\n**What it is.** $K\\backslash LX = L^+G\\backslash LG/L^+G$, strata the Cartan cells,\n$\\mathrm{IC}_0 = \\delta_e$.\n\n**Why it is an instance.** Symmetric, hence spherical; BZSV §7.6.2 (p. 168) identify the\nconjecture with \"the derived Satake theorem of [BF08]\".\n\n**What it matches.** Both sides of (i) and of (ii), simultaneously true. Since $\\mathrm{IC}_0$\nis the monoidal unit, $\\mathcal{F}\\ast\\mathrm{IC}_0 = \\mathcal{F}$ and the generating family is\nalready everything, so **the case cannot discriminate the equivalence from any weaker\nstatement**. It is the bench's `degenerate` entry and is here only as a normalization.\n\n**What the statement says here.** $\\Delta_{\\lambda,a}$ lies in the Satake subcategory because\nthat subcategory is all of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ before any geometry is\ndone.\n\n**Source.** `BZSV`, §7.6.2, p. 168 (read this run); `bezrukavnikov2008equivariant`, Thm 5.\n\n### 3. $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$ — instance, and the one checked by hand in print\n\n**What it is.** $LX = k((t))$, $K = \\mathcal{O}^\\times$, strata $LX_m = t^m\\mathcal{O}^\\times$\nfor $m\\in\\mathbb{Z}$ together with the closed stratum $\\{0\\}$; every closure\n$\\overline{LX}_m = t^m\\mathcal{O}$ contains infinitely many strata.\n\n**Why it is an instance.** Smooth affine spherical, in the standing class; BZSV list it among\nthe varieties whose loop space is placid (§7.3.1, p. 155) and verify the equivalence \"by hand\"\nin Example 7.6.1. **Not discharged: (H1).** The boxed caveat on p. 156 says the properties of\nthat sheaf theory are deliberately not stated as theorems — and, worse, Chen–Nadler's\n*placid stratified* condition demands closed substacks that are **finite** unions of strata,\nwhich no presentation of this $LX$ supplies *(constructed, unsourced)*. So the one published\ndischarge of (H1)–(H3) does not cover this $X$.\n\n**What it matches.** The **right-hand side of clauses (i) and (ii)** — the membership\n$\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ — at the closed\nstratum, sourced; and it is the case that shows *why the generation operation must be the\ncocomplete one*. Example 7.6.1 (p. 168) reaches the skyscraper only as a limit: \"The skyscraper\nat $0$ corresponds to taking a limit as $l\\to-\\infty$\" of the sheaves $k_{X^l}$, which the same\npage identifies as the Hecke translates (\"the sheaf $\\delta_n$ introduced in Example 7.3.5\ncorresponds to $[n]\\otimes\\mathcal{O}^{/\\!\\!/}_{\\check M}$\"). It does **not** reach the forward\ndirection of (i), or (iii), or (H1).\n\n**What the statement says here.** For $m\\in\\mathbb{Z}$, $\\Delta_m$ is the fibre of\n$P_m\\to P_{m+1}$ for consecutive Hecke translates $P_m = \\delta_m\\ast\\mathrm{IC}_0$, hence lies\nin the Satake subcategory because that subcategory is stable *(constructed, unsourced; it is\nclause (i) of [Q2-e2](../Q2-e2/index.html))*; and $\\Delta_{\\{0\\}}$ is the colimit of the\n$P_m$, which is BZSV's limit. The membership holds, and clause (ii) turns it into the equality\nthe bench records at K1.\n\n**Source.** `BZSV` (arXiv:2409.04677), Example 7.6.1, p. 168; §7.3.1 with the caveat box,\npp. 155–156 (p. 168 read this run).\n\n### 4. Chen–Nadler's $Q_X$ for symmetric $X$ — analogue\n\n**This is an analogue, not an instance**: $Q_X$ is an abelian category of summands and the\nnode's Satake subcategory is cocomplete stable. Read it through the dictionary above.\n\n**What it is.** For $X = K\\backslash G$ symmetric over $\\mathbb{C}$,\n$Q_X\\subset\\mathrm{Perv}(X(\\mathcal{K})/G(\\mathcal{O}))$ is the full subcategory of direct sums\nof summands of $\\omega_{X(\\mathcal{O})/G(\\mathcal{O})}\\star\\mathrm{IC}_V$ (Def. 13.6).\n\n**What it matches.** The **content** of the membership, and no clause of the equivalence:\nCor. 13.8 gives $Q_X\\simeq\\mathrm{Rep}(H^\\vee_{\\mathrm{real}})$, semisimple with irreducibles\n$\\mathrm{IC}^\\lambda_X$ indexed by $\\lambda\\in\\sigma(\\Lambda_T)$, and Prop. 13.7(1) says those\nare IC sheaves on orbit closures *with trivial local systems*. Two warnings follow, neither a\ncounterexample: the index set is $\\sigma(\\Lambda_T)$ and not $\\Lambda_S^+$, and only trivial\nlocal systems occur — which is where $\\#A_\\lambda>1$ and clause (iii) would bite. **What it\ndoes not reach:** membership of $\\Delta_\\lambda$ in the *cocomplete* Satake subcategory for\n$\\lambda\\notin\\sigma(\\Lambda_T)$ is left open, because passing from summands to\n$\\langle-\\rangle$ adds cofibres and colimits.\n\n**What the statement says here.** Nothing directly. It says what a verification of the\nmembership must produce, and where in $\\Lambda_X^+$ the difficulty is concentrated.\n\n**Source.** `chen2024real` (arXiv:2403.13995v1), Def. 13.6 and Prop. 13.7(1), p. 59; Cor. 13.8,\np. 60 (read this run).\n\n### 5. Boundary: $X = \\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$, where (H1) is what the literature avoids\n\n**What it is.** The symplectic period, K6 of the bench. Chen–Macerato–Nadler–O'Brien\nTheorem 1.3 (p. 5) prove\n$\\Psi_X\\colon D^b(\\mathfrak{L}\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n})\\simeq\nD^{\\mathrm{GL}_n}_{\\mathrm{perf}}(\\mathrm{Sym}(\\mathfrak{gl}_n[-4]))$, compatible with the\nmonoidal action of $D^b(\\mathfrak{L}^+\\mathrm{GL}_{2n}\\backslash\\mathrm{Gr}_{2n})$ — the\n*whole* category, so the conclusion of clause (ii)'s left-hand side is a theorem for this $X$.\n\n**Why it is a boundary case.** Remark 1.4, same page, verbatim: \"In general, the\n$\\mathfrak{L}\\mathrm{Sp}_{2n}$-orbits on $\\mathrm{Gr}_{2n}$ are neither finite-dimensional nor\nfinite-codimensional. Thus there is not a naive approach to sheaves on\n$\\mathfrak{L}\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}$ with traditional methods.\" They replace\nthe quotient by $\\Omega\\mathrm{Sp}(n)\\backslash\\mathrm{Gr}_{2n}$ and define $D^b$ by descent of\nthe orbit stratification.\n\n**What it matches.** **(H1) as a hypothesis**, negatively: a member of the standing class where\nthe recollement package the node assumes is exactly what the authors say is unavailable, and\nwhere the conclusion holds anyway by another route. It is *not* a counterexample — Q2-L1\nassumes (H1) and asserts nothing without it — and it touches no clause of (i)–(iii). Two gaps\nin the transfer, both from the sources themselves: the orbits are counted in the transposed\npresentation $\\mathfrak{L}\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}$ rather than in\n$LX/L^+\\mathrm{GL}_{2n}$, and the passage between the two is asserted there with a forward\nreference; and their $D^b$ is a semi-analytic construction, not the $\\mathcal{D}$-module\ncategory the node works in.\n\n**What the statement says here.** If (H1) can be arranged for this $X$, clause (ii) converts the\nknown equality into membership of every standard object — a prediction, and the sharpest one the\nbench supplies.\n\n**Source.** `chen2022quaternionic` (arXiv:2207.04078), Thm 1.3 and Rem. 1.4, p. 5 (read this\nrun).\n";</script>
