irectory. Clean.\n\n**The structural question, adjudicated.** The write-up uses (H1) as given data (Steps 1, 9, 11, 13), quotes conditions (1) and (2) from the [Q1-L5](../../../Q1/Q1-L5/index.html) *statement* — which the node's own statement already does, and must, since clause (i) is an \"if and only if\" *about* them — and uses (H2)–(H3) exactly once, through the joint conservativity of the global family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ at Step 13. No result proved at a Q1 node is used, and no Q1 proof is imported. I checked the one inference at issue myself: from $i_\\lambda^!c\\simeq 0$ for all $\\lambda$, the factorization $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\circ\\overline{i}_\\mu^!$ and (H3) give $\\overline{i}_\\mu^!c\\simeq 0$ for every $\\mu$, and the limit description (H2) gives $c\\simeq 0$; every $\\lambda$ is a stratum of $\\overline{LX}_\\lambda$, and the (H2) limit is indexed by the same $\\Lambda_X^+$, so the two families match. The derivation is correct, and it is written out in the \"Moreover\" paragraph of the Q1-L5 **statement** — a statement the Q2 framing incorporates by name — not in any Q1 argument. So the use is legitimate standing data and creates no hidden dependency edge. What the write-up does wrong is smaller, and is Flaw 1.\n\n**Source check (the prover's flagged point 1), performed on the page.** `papers/GR17vol1.pdf`, book p. 55 (PDF p. 92): §5.4.1 defines a collection $\\{c_\\alpha\\}$ to *generate* $\\mathbf{C}$ by exactly the detection formula $\\operatorname{Maps}_{\\mathbf{C}}(c_\\alpha[-i],c)=*\\ \\forall\\alpha,\\ \\forall i=0,1,\\dots\\Rightarrow c=0$, and Prop. 5.4.5 states that $\\{c_\\alpha\\}$ generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory containing all $c_\\alpha$. So the appendix entry [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) transcribes its source faithfully in substance, and the prover is right that **no compactness hypothesis** appears. Two corrections to the prover's report are in Flaw 3.\n\n**Type-checking and handedness, verified step by step.** $i_{\\lambda!}\\colon\\mathcal{C}_\\lambda\\to\\mathcal{C}$ is left adjoint to $i_\\lambda^!\\colon\\mathcal{C}\\to\\mathcal{C}_\\lambda$ throughout, as (H1) says; Step 9's use of \"$i_{\\lambda!}$ fully faithful $\\Rightarrow$ unit $\\mathrm{id}_{\\mathcal{C}_\\lambda}\\to i_\\lambda^!i_{\\lambda!}$ is an equivalence\" has the handedness right; Step 13's $\\operatorname{Map}_{\\mathcal{C}_\\lambda}(N,i_\\lambda^!c)\\simeq\\operatorname{Map}_{\\mathcal{C}}(i_{\\lambda!}N,c)$ is the adjunction in the correct direction. Every generation bracket, mapping space and $=$/$\\simeq$ between subcategories carries its ambient, except where the ambient is one of the two sides, which [context](../../../../context.html) licenses. Full faithfulness is used only at Step 9 and continuity only where (H1) grants it. I found no slide between the cocomplete $\\mathcal{A}_X$ and the small $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$: conditions (1) and (2) are quoted in their cocomplete form, Step 12 forms $\\langle S\\rangle$ inside $\\mathcal{C}$, and the first caveat disclaims the small equality explicitly and correctly.\n\nThe flaws below are all MINOR. None blocks the argument; the first two are the ones I would insist on before print.\n\n**Flaw 1** [MINOR] — The property invoked is joint conservativity of the **global** family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ on $\\mathcal{C}$.\n\n<details><summary>(location: Step 13, \"and joint conservativity gives $c\\simeq_{\\mathcal{C}}0$\"; third caveat) · the finding</summary>\n\nThat is not one of (H1)–(H3): the [Q2](../../../../dag.html) framing glosses (H3) as \"the strata of each single closure restrict jointly conservatively\", one closure at a time, and (H2) as the limit description. The global statement is a *consequence* of (H2)+(H3), and the third caveat calls it \"standing data … carried by (H2)–(H3)\" without giving or locating the derivation. As written, a referee reading only the framing has to reconstruct it — including the ingredient it needs, the factorization $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\circ\\overline{i}_\\mu^!$ through the closure, which the framing does not display.\n\n*Fix (one sentence, no new mathematics).* In Step 13 or the caveat, write: \"since $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\circ\\overline{i}_\\mu^!$ whenever $LX_\\lambda\\subseteq\\overline{LX}_\\mu$, (H3) gives $\\overline{i}_\\mu^!c\\simeq 0$ for every $\\mu$ and (H2) then gives $c\\simeq 0$ — the 'Moreover' clause of the Q1-L5 statement, which is what the framing puts in force.\" That names the standing package as the source and stops the sentence from reading like an appeal to a Q1 argument.\n\n</details>\n\n**Flaw 2** [MINOR] — Two mis-descriptions in the one line where the node declares what it stands on.\n\n<details><summary>(location: the **uses** bullet, \"conditions (1)–(2) and the joint conservativity of $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ they supply are standing hypotheses of the [Q2] framing\") · the finding</summary>\n\n(a) Conditions (1) and (2) are **not** standing hypotheses of Q2. The framing puts only (H1)–(H3) in force; (1) and (2) are the object of clause (i)'s characterisation, quoted from the Q1-L5 statement by this node's own statement, and they are hypotheses only inside the forward direction (Step 5). (b) The global joint conservativity is a consequence of (H2)–(H3), not a hypothesis — see Flaw 1. The mathematics of the write-up is unaffected; the declaration is what a reader audits the closed world against, so it should say what is actually being leaned on.\n\n*Fix.* \"(H1)–(H3) are standing hypotheses of the Q2 framing; conditions (1)–(2) are quoted from the Q1-L5 *statement*, as this node's statement does; the global joint conservativity used at Step 13 is the consequence of (H2)–(H3) recorded in the 'Moreover' clause of that statement.\"\n\n</details>\n\n**Flaw 3** [MINOR] — The prover reported that GR17vol1 Prop. 5.4.5 needs \"no compactness or smallness hypothesis\".\n\n<details><summary>(location: Step 14, \"The detection clause of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) now yields $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$\"; second caveat) · the finding</summary>\n\nHalf of that is right and half is not, and the appendix entry inherits the gap:\n\n- *Compactness:* correct, there is none. The write-up therefore does not need Step 12's compactness claim at all (see Flaw 4).\n- *Ambient:* §5.4.1 opens \"Let $\\mathbf{C}$ be an object of $1\\text{-}\\mathrm{Cat}^{\\mathrm{St,cocmpl}}$\", and footnote 8 on book p. 51 declares \"When talking about cocomplete categories we will always assume that they are presentable.\" So the equivalence holds for $\\mathbf{C}$ presentable stable, whereas [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) states it for $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ with no hypothesis at all. The entry under-states its source; that is a defect of the entry, not of this write-up, but this write-up should not rely on the omission.\n- *Smallness:* the printed statement says only \"a collection of objects\", but the proof forms $\\mathbf{C}'=\\langle c_\\alpha\\rangle_{\\mathbf{C}}$ and asserts that the inclusion $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ \"admits an (a priori non-continuous) right adjoint\" — which is where smallness of the collection does its work, through presentability of $\\mathbf{C}'$. So \"no smallness hypothesis\" is true of the printed line and false of the argument behind it.\n\nBoth unstated hypotheses are in fact satisfied here — $\\mathcal{C} = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$ is presentable stable by [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), and $S$ is small by Step 12 — so no conclusion is at risk. *Fix:* add the clause \"$\\mathcal{C} = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$ is presentable stable and $S$ is small, which is what the equivalence needs\" at Step 14, and reword the second caveat from \"for a small shift-stable set of compacts\" to \"for a small shift-stable set in a presentable stable ambient\".\n\n</details>\n\n**Flaw 4** [MINOR] — This claim is never used. Step 14 imports only the detection clause, which by Flaw 3 has no compactness hypothesis, and Steps 4, 8, 9, 15 use only minimality.\n\n<details><summary>(location: Step 12, \"whose objects are the compacts of $\\mathcal{C}$\") · the finding</summary>\n\nIt also reaches outside the node's declared vocabulary: compactness is [compact objects](../../../../appendix/def-compact-objects.html), which is not among this node's `objects:`. The claim is true — [context](../../../../context.html) fixes it as a standing convention, \"$\\mathcal{D}_c$ is by construction the subcategory of compacts\" of $\\mathcal{D}^{\\mathrm{ren}}$ — so nothing is wrong; but an unused assertion outside the declared vocabulary is worth deleting, and deleting it pays the word budget for Flaws 1 and 3.\n\n</details>\n\n**Flaw 5** [MINOR] — a question rather than an accusation.\n\n<details><summary>(location: Step 15, \"$\\mathcal{D} := \\langle \\Delta_{\\lambda,a}\\ \\mid\\ a\\in A_\\lambda\\rangle_{\\mathcal{C}}$\") · the finding</summary>\n\nThe index $\\lambda$ is free in this display, so $\\mathcal{D}$ is generated by the standard objects of **one** stratum, and Steps 15–16 prove clause (iii) stratum by stratum. Clause (iii) as stated — \"the two families of standard objects generate the same subcategory of $\\mathcal{C}$\" — reads at least as naturally as a claim about the families over all $\\lambda$. Both are true, and the second follows from the first in one line, $\\langle\\bigcup_\\lambda\\{\\Delta_{\\lambda,a}\\}_a\\rangle_{\\mathcal{C}} = \\langle\\bigcup_\\lambda\\mathcal{D}_\\lambda\\rangle_{\\mathcal{C}}$, but the write-up does not say which it is proving. Which reading is intended? *Fix:* write $\\mathcal{D}_\\lambda$ for the per-stratum object and add the union line, or say \"at each $\\lambda$\" explicitly in Step 15.\n\nI record for the prover's credit that the argument of Step 15 is the right one: it assumes only that each collection generates $\\mathcal{C}_\\lambda$, never that the two generate one another, and it uses nothing about $i_{\\lambda!}$ beyond Steps 3–4. The trap flagged in the commissioning brief is not sprung.\n\n</details>\n\n**Flaw 6** [MINOR] — The ambient hypotheses are left implicit: $\\mathcal{M}$ and $\\mathcal{N}$ must be stable and cocomplete for \"cocomplete stable subcategory\" to carry its [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) meaning, and that entry's note requires such a subcategory to be closed under **retracts** as well as under colimits, which Step 2 does not mention.\n\n<details><summary>(location: Step 2, \"For $F\\colon\\mathcal{M}\\to\\mathcal{N}$ exact and colimit-preserving and $\\mathcal{E}\\subseteq\\mathcal{N}$ cocomplete stable\") · the finding</summary>\n\nBoth are fine — $\\mathcal{C}$ and $\\mathcal{C}_\\lambda$ are Ind-completions of small stable categories, and a full subcategory closed under small colimits is closed under retracts since an idempotent splits as a filtered colimit — so this is a presentation gap, not an error. *Fix:* add \"$\\mathcal{M},\\mathcal{N}$ stable and cocomplete\" to the hypothesis and \"and retracts\" to the list of closures.\n\n</details>\n\n**Flaw 7** [MINOR] — The bare dash stands in for \"that collection\", so the sentence reads as an equation between a category and a place-holder, and the first equality — which is the hypothesis that the collection generates $\\mathcal{C}_\\lambda$ — is invisible.\n\n<details><summary>(location: Step 4, \"$\\mathcal{C}_\\lambda = \\langle-\\rangle_{\\mathcal{C}_\\lambda}\\subseteq\\mathcal{B}_\\lambda(\\mathcal{E})$\") · the finding</summary>\n\n*Fix:* name the collection, e.g. \"let $\\{c_\\alpha\\}\\subseteq\\mathcal{B}_\\lambda(\\mathcal{E})$ generate $\\mathcal{C}_\\lambda$; then $\\mathcal{C}_\\lambda = \\langle c_\\alpha\\rangle_{\\mathcal{C}_\\lambda}\\subseteq\\mathcal{B}_\\lambda(\\mathcal{E})$\".\n\n</details>\n\n**Flaw 8** [MINOR] — Declared and never invoked in the argument: the embeddings enter only through the symbols $i_\\lambda$, $i_{\\lambda!}$ that [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) fixes and that (H1) makes adjoint.\n\n<details><summary>(location: the **uses** bullet, [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)) · the finding</summary>\n\nRecorded for the audit trail only — the `objects:` field is the lead-researcher's, and a declared-but-unused entry costs the proof nothing.\n\n</details>\n\nVERDICT: PASS\n";</script>
