survives anywhere in the write-up. Of the fourteen occurrences of `\\mathrm{Sat}`, twelve sit on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — Steps 4 (twice), 5 (twice), 7, 10, 11, 12 (twice), 15 and the first caveat — and every one of them is a place where the *cocomplete* subcategory is what the argument needs. The two that sit on $\\mathcal{D}_c(K\\backslash LX)$ are both inside the first caveat, where naming the small one is the point. Clause (ii) is stated and proved for the cocomplete object throughout: Step 11 forms $\\langle S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$ inside the renormalized ambient, Step 12 orthogonalizes against the cocomplete subcategory, Step 13 concludes $\\langle S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and reads clause (ii)'s equality off Step 11. The four bare $\\mathcal{D}_c$'s outside the caveat (Steps 6, 7, 11) are the Hecke category $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and the coherent $\\mathcal{D}_c(K\\backslash LX)$, both correct against [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) and [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html). I found no slip.\n\n**Did the compression lose a claim?** No claim of the lemma. Old Steps 2–3 were a general preimage principle and its instance; current Step 2 asserts exactly one thing — that $\\mathcal{B}_\\lambda(\\mathcal{E})$ is cocomplete stable — coins $\\mathcal{B}_\\lambda(\\mathcal{E})$ in its own display, and gives the preimage argument as the reason for that one thing. That is I25-conformant. What the merge did cost is smaller and is Flaw 5.\n\n**Hallucination sweep.** One bib key is cited, `GR17vol1` in the second caveat; it is at refs.bib:350. No `main.tex` `\\label` is cited. All seven appendix links resolve to real anchors (`#not-standard-objects`, `#def-satake-subcategory`, `#def-generation`, `#def-renormalized`, `#def-orbits-iwahori-spherical`, `#ic-0`, `#conv-hecke-action`), as do `../../main_dag.md#q2` and the Q1-L5 links. Clean.\n\n**Closed world, re-tested after the renotation.** Still clean at the level of the argument. (H1) enters at Steps 1, 5, 8, 10; conditions (1)–(2) enter only as the hypothesis of Step 4 and as the conclusions of Steps 6 and 8, which is what an \"if and only if\" *about* them requires; (H2)–(H3) enter once, at Step 12. No result proved at a Q1 node is used and no Q1 argument is imported, so no hidden dependency edge. The mathematics is right; the **declaration** of it is Flaw 2.\n\n**Correctness spot-checks I ran myself.** Step 1's handedness ($i_{\\lambda!}\\dashv i_\\lambda^!$, left adjoint out of the stratum) is right, and \"finite $+$ filtered $\\Rightarrow$ all small\" is right. Step 8's unit argument uses full faithfulness in the correct direction, $E_{\\lambda,a}\\simeq i_\\lambda^!i_{\\lambda!}E_{\\lambda,a}$. Step 12's adjunction is in the correct direction and the $N = i_\\lambda^!c$ trick is valid. Step 13's shift upgrade is valid because $S$ is closed under all integer shifts. Step 14 assumes only that each collection generates $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, never that one generates the other; the trap is still not sprung. Step 4's reading of condition (2) matches Q1-L5's display, and Step 8's conclusion $\\mathcal{G}_\\lambda = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ is verbatim Q1-L5's condition (1).\n\nAll flaws below are MINOR. Flaws 1–4 and 6–8 are **repeats**: r1 raised them, r1's PASS disposed of them for the record, and the renotation did not act on them.\n\n**Flaw 1** [MINOR] — *repeat of r1 Flaw 1, unaddressed.*\n\n<details><summary>(location: Step 12, \"and joint conservativity gives $c\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}0$\"; third caveat) · the finding</summary>\n\nThe property invoked is joint conservativity of the **global** family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$. The [Q2](../../../../dag.html) framing (main_dag.md:272) puts in force (H3) *one closure at a time* and (H2) as the limit description; the global statement is their consequence. The third caveat still says only \"standing data of the Q2 framing, carried by (H2)–(H3)\", with neither the derivation nor a pointer to where it is written down. It **is** written down — the closing \"Moreover\" paragraph of the [Q1-L5](../../../Q1/Q1-L5/index.html) statement (Q1-L5_node.md:54) gives it in one sentence, using the factorization $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$ that the Q2 framing does not display. So the fix is now even cheaper than r1's: name that clause. As it stands a reader who audits only the framing must reconstruct an inference the write-up does not flag as an inference.\n\n*Fix.* Third caveat: \"…carried by (H2)–(H3) through the 'Moreover' clause of the [Q1-L5](../../../Q1/Q1-L5/index.html) statement, which derives it from the factorization $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$; not a dependency.\"\n\n</details>\n\n**Flaw 2** [MINOR] — *repeat of r1 Flaw 2, half-addressed.*\n\n<details><summary>(location: the **uses** bullet, \"No `depends-on`: (H1)–(H3), (1)–(2) and the joint conservativity they supply are standing hypotheses of the [Q2] framing\") · the finding</summary>\n\nInserting \"(H1)–(H3)\" made the true part explicit and left both mis-descriptions standing. (a) Conditions (1) and (2) are **not** standing hypotheses of Q2 — the framing puts only (H1)–(H3) in force — and read literally the bullet makes clause (i) vacuous, since a standing (1)+(2) would hand you the membership for free. (b) The global joint conservativity is a consequence, not a hypothesis; \"they supply\" concedes as much and the sentence's predicate then calls it a standing hypothesis anyway. The body of the proof does the right thing throughout, so nothing mathematical is at risk; but this bullet is the one line a reader audits the closed world against, and it currently mis-states what the node stands on.\n\n*Fix.* \"No `depends-on`: (H1)–(H3) are standing hypotheses of the [Q2] framing; conditions (1)–(2) are quoted from the [Q1-L5](../../../Q1/Q1-L5/index.html) *statement*, as this node's statement does, and are hypotheses only of Step 4; the global joint conservativity used at Step 12 is their consequence.\"\n\n</details>\n\n**Flaw 3** [MINOR] — *repeat of r1 Flaw 3, unaddressed.*\n\n<details><summary>(location: second caveat, \"for Step 11's small shift-stable set of compacts\") · the finding</summary>\n\nFirst, the good news the round-1 report asked me to confirm: the caveat has **not** reverted to the overstatement. Nothing in the current file claims that [[GR17vol1, Prop. 5.4.5](../../../../../papers/GR17vol1.pdf)] carries \"no compactness or smallness hypothesis\"; the caveat only says what it imports. I re-read the page myself (`papers/GR17vol1.pdf`, book pp. 51–56): §5.4.1 opens \"Let $\\mathbf{C}$ be an object of $1\\text{-}\\mathrm{Cat}^{\\mathrm{St,cocmpl}}$\" and defines *generate* by the detection formula; footnote 8 on book p. 51 declares \"When talking about cocomplete categories we will always assume that they are presentable\"; and the proof of Prop. 5.4.5 forms $\\mathbf{C}' = \\langle c_\\alpha\\rangle_{\\mathbf{C}}$ and asserts that $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ \"admits an (a priori non-continuous) right adjoint\", which is where smallness of the collection does its work. r1's account of the page is exact, and [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), which states the equivalence for $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ with no hypothesis, under-states its source.\n\nWhat is wrong is that the caveat names the hypothesis that is *not* needed (compactness) and omits the two that are (presentable ambient, small collection). Both hold here — $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$ is presentable stable by [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), and $S$ is small because $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is — so no conclusion is at risk.\n\n*Fix.* Reword to \"…for Step 11's small shift-stable set $S$ in the presentable stable $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$, which is what the equivalence needs.\"\n\n</details>\n\n**Flaw 4** [MINOR] — *repeat of r1 Flaw 4, unaddressed, and now also in the step title.*\n\n<details><summary>(location: Step 11, title \"a shift-stable small family of **compacts**\" and \"stable and the compacts of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\") · the finding</summary>\n\nStill never used: Step 13 imports only the detection clause, which has no compactness hypothesis (Flaw 3), and Steps 4, 5, 8, 15 use only minimality. It still reaches outside the node's declared vocabulary — compactness is [compact objects](../../../../appendix/def-compact-objects.html), which is not among this node's `objects:` — and it is now asserted twice rather than once. The claim is true by the standing convention of [context](../../../../context.html) (\"$\\mathcal{D}_c$ is by construction the subcategory of compacts\" of $\\mathcal{D}^{\\mathrm{ren}}$), so nothing is wrong; but if the word budget is what blocked Flaws 1 and 3, this is the clause whose deletion pays for both, exactly as r1 said.\n\n</details>\n\n**Flaw 5** [MINOR] — *new, and it is the compression's one real cost.*\n\n<details><summary>(location: Step 7, \"so Step 2's argument makes its preimage of $\\mathcal{G}_\\lambda$ cocomplete stable\") · the finding</summary>\n\nAfter the merge, Step 2 **states** the preimage fact only for $i_{\\lambda!}$ and only for $\\mathcal{E}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. Step 7 needs it for the other functor and the other ambient: the preimage under $i_\\lambda^!$ of $\\mathcal{G}_\\lambda\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$. That use is now licensed by *an argument* rather than by any asserted claim, which is a step's reason pointing at prose instead of at a statement. Two further gaps in the pointer: Step 7 never says that $\\mathcal{G}_\\lambda$ is cocomplete stable, which Step 2's argument needs of the target (immediate — $\\mathcal{G}_\\lambda$ is a generation bracket, so [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) gives it), and the reader must transpose the two hypotheses by hand.\n\nNo claim is lost and nothing is false: Step 1 supplies the only ingredient that changes, $i_\\lambda^!$ exact and continuous. But the deleted general step was precisely the statement covering this use, and restoring a citable statement costs about six words rather than a step.\n\n*Fix.* Open Step 2 with \"For $F$ exact and colimit-preserving into a cocomplete stable $\\mathcal{E}$, $F^{-1}\\mathcal{E}$ is cocomplete stable; in particular, for $F = i_{\\lambda!}$, put …\", and let Step 7 cite Step 2 rather than its argument, adding \"$\\mathcal{G}_\\lambda$ being cocomplete stable as a generation bracket\".\n\n</details>\n\n**Flaw 6** [MINOR] — *repeat of r1 Flaw 6, second half; the first half is moot now that the general step is gone.*\n\n<details><summary>(location: Step 2, \"It is closed under shifts, cofibres and small colimits\") · the finding</summary>\n\nThe list of closures is what Step 3's minimality appeal is checked against, and it omits retracts. [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) says in as many words that the generation operation produces a subcategory \"closed under arbitrary colimits **and under retracts**\", so a reader comparing the two lists sees a mismatch. It is free — an idempotent splits as a sequential colimit, so closure under small colimits gives closure under retracts in a stable ambient — which is exactly why the clause should be there rather than left to the reader.\n\n*Fix.* \"…shifts, cofibres, small colimits and hence retracts\".\n\n</details>\n\n**Flaw 7** [MINOR] — *new, house convention.*\n\n<details><summary>(location: Step 11, \"$\\langle S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$\") · the finding</summary>\n\nBoth sides are full subcategories of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and neither side *is* the ambient, so [context](../../../../context.html)'s rule applies and the exception it grants (\"dropped when the ambient is already one of the two sides\") does not: the $=$ should carry its subscript, as it does in Step 8 and Step 12. Mitigating: the generation bracket already names the ambient two characters to the left, so nothing is ambiguous. Step 13's $\\langle S\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and the lemma's clause-(ii) display are both correctly inside the exception. I do not insist.\n\n</details>\n\n**Flaw 8** [MINOR] — *repeat of r1 Flaw 5, improved but not closed.*\n\n<details><summary>(location: Steps 14–15, $\\mathcal{P}_\\lambda$) · the finding</summary>\n\nNaming the object $\\mathcal{P}_\\lambda$ rather than $\\mathcal{D}$ makes the per-stratum reading visible, which was half of what r1 asked for. The other half is still absent: clause (iii)'s \"the two families of standard objects generate the same subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\" can also be read over all $\\lambda$ at once, and the write-up does not say which it is proving. Both are true and the global one follows in one line from the per-stratum one, since $\\bigcup_\\lambda\\{\\Delta_{\\lambda,a}\\}_a\\subseteq\\bigcup_\\lambda\\mathcal{P}_\\lambda$ and symmetrically. Since clause (iii) fixes $\\lambda$ in its hypothesis (\"both generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$\"), the per-stratum reading is the natural one and this is nearly a non-issue; four words (\"at each $\\lambda$\" in Step 14) would close it.\n\n</details>\n\n**Flaw 9** [MINOR] — *audit trail; neither half is the prover's to fix.*\n\n<details><summary>(location: the **uses** bullet, [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html); and, separately, main_dag.md:272) · the finding</summary>\n\nThe entry is still declared and still never invoked — the embeddings enter only through the symbols $i_\\lambda$, $i_{\\lambda!}$ that [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) fixes and (H1) makes adjoint — and `objects:` is the lead-researcher's field, so this costs the proof nothing. Recorded alongside it: the [Q2](../../../../dag.html) framing at main_dag.md:272 still writes \"each $i_\\lambda^!\\colon\\mathcal{C}\\to\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$\", i.e. still uses the abbreviation $\\mathcal{C}$ that the repository has abolished and that this write-up has correctly expunged. The write-up is now ahead of its own framing; fixing the framing belongs to `/update`, not to the prover, but a later reader diffing the two should know which one is stale.\n\n</details>\n\nVERDICT: PASS\n";</script>
