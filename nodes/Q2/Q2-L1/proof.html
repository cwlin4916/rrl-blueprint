<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q2-L1 — Standard generators: one condition replaces the two\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), [${}^{\\perp_{\\mathcal{D}}}M$](../../../appendix/left-orthogonal-closure.html), [compact generation](../../../appendix/def-compactly-generated-category.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), [the Satake subcategories](../../../appendix/def-satake-subcategory.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html); the statement also links [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) and [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). **No `depends-on`** — a leaf, using no dependency statement. **(H1)**, **(1)**, **(2)** and, in clause (ii), **(H2)**–**(H3)** are hypotheses of this node's own statement, quoted from [Q1-L5](../../Q1/Q1-L5/index.html)'s *statement*; no Q1 argument is imported.\n- **notation:** $\\mathcal{B}_\\lambda$, $\\mathcal{G}_\\lambda$, $T$, $\\mathcal{P}$, $\\mathcal{P}'$ are auxiliary, coined in the displays below.\n\n## Lemma\n\n**Setup — what the clauses quantify over.** Throughout, $\\lambda$ runs over the index poset [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) of $K$-orbits of $LX$, so choosing $\\lambda$ is choosing one stratum $LX_\\lambda$, and $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ is the locally closed embedding of that stratum ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)).\n\nA **generating collection** for the stratum $\\lambda$ is a small family $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of the renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) of that one stratum which generates it in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nThe associated **standard objects** are the images of that collection under the left adjoint named in the next paragraph:\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nBoth families are those of [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html). A generating collection is a **choice**, made stratum by stratum, and nothing there or here singles one out; clause (iii) below is what makes the choice immaterial.\n\n**(H1) Recollement.** Assumed throughout, and identical with hypothesis **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html): for every $\\lambda$ the $!$-restriction\n\n$$\ni_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n$$\n\nis continuous and admits a fully faithful continuous left adjoint $i_{\\lambda!}$. This is the only hypothesis clause (i) uses.\n\n**(1) Stratumwise generation.** Condition (1) of [Q1-L5](../../Q1/Q1-L5/index.html): for every $\\lambda$ the restrictions $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, with $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ acting through the spherical Hecke action ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) on the basic object [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html).\n\n**(2) Support-cutting.** Condition (2) of [Q1-L5](../../Q1/Q1-L5/index.html): for every $\\lambda$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\n\n$$\ni_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right) \\in \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n**(i) One condition replaces the two.** Assume **(H1)**. Then (1) and (2) both hold if and only if every standard object lies in the Satake subcategory ([the Satake subcategories](../../../appendix/def-satake-subcategory.html)):\n\n$$\n\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\text{ and every }a\\in A_\\lambda.\n$$\n\n**(ii) The equality it cashes out to.** Under the standing hypotheses **(H1)**–**(H3)** of [Q1-L5](../../Q1/Q1-L5/index.html), the Satake subcategory is all of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ if and only if the same membership holds:\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) \\qquad\\Longleftrightarrow\\qquad \\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}\\ \\text{ for every }\\lambda\\text{ and every }a.\n$$\n\n**(iii) Independence of the choice, and the choice-free form.** Assume **(H1)**. For each $\\lambda$ the objects $E$ of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ whose $!$-extension $i_{\\lambda!}E$ lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ form a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, so the membership of clause (i) holds for one choice of generating collections if and only if\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+ .\n$$\n\nIn particular neither direction depends on the choice: if $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ and $\\{E'_{\\lambda,b}\\}_{b\\in B_\\lambda}$ both generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ for every $\\lambda$, then the two resulting families of standard objects generate the same subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\n## Proof\n\n**Step 1 — under (H1) both members of $i_{\\lambda!}\\dashv i_\\lambda^!$ are exact and preserve all small colimits.** The left adjoint $i_{\\lambda!}$ preserves all small colimits, hence cofibres and $0$, so is exact. The right adjoint $i_\\lambda^!$ preserves finite limits, hence is exact; **(H1)** makes it continuous, and finite plus filtered colimits give all small.\n\n**Step 2 — each renormalized category below is $\\mathrm{Ind}$ of a small stable category, hence presentable stable.** By [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) it is $\\mathrm{Ind}\\,\\mathcal{D}_c$ of its prestack; $\\mathcal{D}_c$ is small — [compact generation](../../../appendix/def-compactly-generated-category.html) forms $\\mathrm{Ind}$ of small categories only — and stable, the condition of [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) passing to shifts and cofibres.\n\n**Step 3 — preimage principle.** For $\\mathcal{M},\\mathcal{N}$ cocomplete stable, $F\\colon\\mathcal{M}\\rightarrow\\mathcal{N}$ exact and colimit-preserving, and $\\mathcal{E}\\subseteq\\mathcal{N}$ a cocomplete stable subcategory,\n\n$$\nF^{-1}\\mathcal{E}\\ :=\\ \\left\\{m\\in\\mathcal{M}\\ :\\ F(m)\\in\\mathcal{E}\\right\\}\n$$\n\nis a cocomplete stable subcategory of $\\mathcal{M}$, since $F$ preserves shifts, fibres, cofibres and small colimits while $\\mathcal{E}$ is closed under them — hence under retracts, an idempotent splitting as a sequential colimit.\n\n**Step 4 — transfer principle.** With $F,\\mathcal{E}$ as in Step 3 and $\\{c_\\alpha\\}$ objects of $\\mathcal{M}$ with every $F(c_\\alpha)\\in\\mathcal{E}$,\n\n$$\nF\\left(\\left\\langle c_\\alpha\\right\\rangle_{\\mathcal{M}}\\right)\\ \\subseteq\\ \\mathcal{E} ,\n$$\n\nsince $F^{-1}\\mathcal{E}$ is a cocomplete stable subcategory containing every $c_\\alpha$ (Step 3) and $\\langle c_\\alpha\\rangle_{\\mathcal{M}}$ is the smallest such — the minimality half of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), which carries no hypothesis.\n\n**Step 5 — clause (iii), first assertion: $\\mathcal{B}_\\lambda$ is a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$**, where\n\n$$\n\\mathcal{B}_\\lambda\\ :=\\ \\left\\{E\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\ :\\ i_{\\lambda!}E\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}\\right\\}.\n$$\n\nThe Satake subcategory is a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the Satake subcategories](../../../appendix/def-satake-subcategory.html)), and $i_{\\lambda!}$ is exact and colimit-preserving (Step 1) between the presentable stable categories of Step 2, so Step 3 applies at $F = i_{\\lambda!}$, with preimage $\\mathcal{B}_\\lambda$.\n\n**Step 6 — clause (iii), the equivalence with the choice-free containment.** Fix collections $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$. If the displayed containment holds at $\\lambda$ then each $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$ lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. Conversely that membership says $E_{\\lambda,a}\\in\\mathcal{B}_\\lambda$ for every $a$, and these generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, so Step 4 at $F = i_{\\lambda!}$ and $\\mathcal{E} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ returns the containment.\n\n**Step 7 — the membership is independent of the choice of collections.** By Step 6 it is equivalent, for any one choice, to a containment in which no choice occurs, so holds for one choice if and only if for every choice.\n\n**Step 8 — two choices generate the same subcategory.** Let $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ and $\\{E'_{\\lambda,b}\\}_{b\\in B_\\lambda}$ both generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ for every $\\lambda$, put $\\Delta'_{\\lambda,b} := i_{\\lambda!}E'_{\\lambda,b}$, and set\n\n$$\n\\mathcal{P} := \\left\\langle \\Delta_{\\lambda,a}\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\\qquad\n\\mathcal{P}' := \\left\\langle \\Delta'_{\\lambda,b}\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\\qquad \\lambda\\in\\Lambda_X^+,\\ a\\in A_\\lambda,\\ b\\in B_\\lambda .\n$$\n\nEvery $i_{\\lambda!}E_{\\lambda,a}$ lies in the cocomplete stable $\\mathcal{P}$, so Step 4 at $\\mathcal{E} = \\mathcal{P}$ gives $i_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\subseteq\\mathcal{P}$; in particular every $\\Delta'_{\\lambda,b}\\in\\mathcal{P}$, so $\\mathcal{P}'\\subseteq\\mathcal{P}$ by minimality, and symmetrically. Hence $\\mathcal{P} =_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\mathcal{P}'$; with Steps 5–7, clause (iii).\n\n**Step 9 — (1) and (2) imply the membership.** Condition (2) places $i_{\\lambda!}i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$ in the bracket $\\left\\langle\\mathcal{F}'\\ast\\mathrm{IC}_0\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$ of its display, which is $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ ([the Satake subcategories](../../../appendix/def-satake-subcategory.html)(1)); so $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\in\\mathcal{B}_\\lambda$ for every $\\mathcal{F}$. These generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ by (1), so Step 4 returns clause (iii)'s containment, putting every $\\Delta_{\\lambda,a}$ in the Satake subcategory.\n\n**Step 10 — the membership implies (2).** For $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{F}\\ast\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$ ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), $\\mathrm{IC}_0$ lying there by [$\\mathrm{IC}_0$](../../../appendix/ic-0.html)), hence of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)); so $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, and Step 6's containment puts its $i_{\\lambda!}$ in the Satake subcategory — condition (2), by Step 9.\n\n**Step 11 — $i_\\lambda^!$ carries the Satake subcategory into $\\mathcal{G}_\\lambda$**, where\n\n$$\n\\mathcal{G}_\\lambda\\ :=\\ \\left\\langle i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} .\n$$\n\nBeing a generation bracket, $\\mathcal{G}_\\lambda$ is cocomplete stable ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html)); $i_\\lambda^!$ is exact and colimit-preserving (Step 1); so Step 4 at $\\{c_\\alpha\\} = \\{\\mathcal{F}\\ast\\mathrm{IC}_0\\}$ gives $i_\\lambda^!\\left(\\left\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\right)\\subseteq\\mathcal{G}_\\lambda$, the source being the Satake subcategory (Step 9).\n\n**Step 12 — the membership implies (1).** **(H1)** makes $i_{\\lambda!}$ fully faithful, so the unit of $i_{\\lambda!}\\dashv i_\\lambda^!$ is an equivalence and $E_{\\lambda,a}\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}i_\\lambda^!\\Delta_{\\lambda,a}$, which Step 11 places in $\\mathcal{G}_\\lambda$. As $\\mathcal{G}_\\lambda$ is cocomplete stable and the $E_{\\lambda,a}$ generate, minimality gives $\\mathcal{G}_\\lambda = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ — condition (1).\n\n**Step 13 — clause (i).** Step 9 proves (1) and (2) $\\Rightarrow$ membership, Steps 10 and 12 the converse.\n\n**Step 14 — clause (ii), $\\Rightarrow$.** If $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ the membership holds, **(H1)** making each $\\Delta_{\\lambda,a}$ an object of the latter.\n\n**Step 15 — under the membership, an object left-orthogonal to the Hecke translates has vanishing $!$-restrictions.** Put\n\n$$\nT\\ :=\\ \\left\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\},\n$$\n\na **set** of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ (Step 10; a set as $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is small, Step 2). Let $c\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ satisfy $\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}(t[-i],c) = 0$ for all $t\\in T$ and $i\\ge 0$. Clauses (1) and (3) of [${}^{\\perp_{\\mathcal{D}}}M$](../../../appendix/left-orthogonal-closure.html) give $\\left\\langle T\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\subseteq{}^{\\perp_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}}c$, and that bracket is the Satake subcategory (Step 9). By Step 6 the membership puts $i_{\\lambda!}N$ in the Satake subcategory for every $N\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, so **(H1)**'s adjunction gives\n\n$$\n\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\left(N,\\ i_\\lambda^!c\\right)\\ \\simeq\\ \\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\left(i_{\\lambda!}N,\\ c\\right)\\ =\\ 0 ;\n$$\n\nat $N = i_\\lambda^!c$ the identity is null, so $i_\\lambda^!c\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}0$ for every $\\lambda$.\n\n**Step 16 — such a $c$ vanishes.** Since $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$ whenever $LX_\\lambda\\subseteq\\overline{LX}_\\mu$, Step 15 and **(H3)** give $\\overline{i}_\\mu^!c\\simeq 0$ for every $\\mu$, and **(H2)** then gives $c\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}0$ — the \"Moreover\" clause of the [Q1-L5](../../Q1/Q1-L5/index.html) statement, whose **(H1)**–**(H3)** clause (ii) assumes.\n\n**Step 17 — clause (ii), $\\Leftarrow$.** Steps 15–16 verify for $T$ the hypothesis of the criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) in the presentable stable ambient $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ (Step 2), so $\\left\\langle T\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, the left side being the Satake subcategory (Step 15); with Step 14 this is clause (ii).\n\n## Caveats\n\n- Clause (ii) concerns the **cocomplete** Satake subcategory; the small $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ of [the Satake subcategories](../../../appendix/def-satake-subcategory.html) is a different object, unasserted here.\n- Presentability is spent once, at Step 17, on *orthogonality $\\Rightarrow$ generation*, discharged at Step 2; clauses (i) and (iii) use minimality alone.\n- The global joint conservativity at Step 16 is **(H2)** and **(H3)** together — **(H3)** alone is one closure at a time — clause (ii)'s own hypotheses, not a dependency.\n";</script>
