ow opens at \"**Setup — what the clauses quantify over.**\".\n\nThat [u1](u1.html)'s own defect sentence describes an expository repair — the statement \"quantified over $\\{E_{\\lambda,a}\\}$ and $\\Delta_{\\lambda,a}$ … without saying on the page what any of them is\". An expository repair *can* be immaterial. This one cannot be certified so: with no paragraph in common there is no way to check, short of re-reading the whole argument against the new text, that no step depends on the difference. Certification is what \"immaterial\" requires, so the honest call is material.\n\n## What changed\n\n`status:` from `proved` to `open`. The `## Statement` is untouched — u1's version is the better one, and this update is about the status that was left behind it. `draft:` and `critique:` keep pointing at the write-up and at [r2](../critiques/r2.html), which stay on disk as history; the next `/prove` continues at r3.\n\n## Considered and not adopted\n\n**Re-syncing the `## Lemma` block and keeping `proved`.** This is the cheap move and it is the one the pipeline now forbids by name: pasting the new statement over the old steps leaves the argument proving a claim no referee has seen, and removes the only evidence that anything is wrong.\n\n**Judging it immaterial because the revision was expository.** Twenty-nine paragraphs against nine, none shared. An operator who says \"immaterial\" there is asserting something it has not checked.\n";</script>
