<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L1</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L1 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L1/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q2-L1](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-06 · **Operator:** `/update Q2-L1`, at the user's direction · **Status before:** `proved` · **Status after:** `proved`\n\n## The defect, in one sentence\n\nThe statement quantified over $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ and $\\Delta_{\\lambda,a}$, and over conditions (1) and (2) of [Q1-L5](../../../Q1/Q1-L5/index.html), without saying on the page what any of them is — so a reader could not tell what the node claimed without opening two other files, and the two conditions the node exists to *replace* were named but never shown.\n\n## What changed, and what did not\n\nThis revision is **expository**: every hypothesis and every conclusion is the one that was there before, in the same generality, and the words of (1), (2) and **(H1)** are transcribed from [Q1-L5](../../../Q1/Q1-L5/index.html) rather than restated. Four things were added to the page and nothing was removed from the claim.\n\n**Added: a Setup block.** The index poset, the stratum embedding, the definition of a generating collection and the definition of a standard object are now written out, with the appendix entry that owns each still linked. The display\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda\n$$\n\npreviously appeared nowhere in the node, only in the appendix and in the [Q2](../../../../dag.html) framing.\n\n**Added: (H1), (1) and (2) as their own blocks.** Each is one labelled paragraph, so the reader sees the two conditions being collapsed side by side with the single membership that replaces them.\n\n**Added: an index set for the second collection in (iii).** The comparison collection is written $\\{E'_{\\lambda,b}\\}_{b\\in B_\\lambda}$, and the quantifier \"for every $\\lambda$\" — implicit before — is stated.\n\n**Added: [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) to `objects:`.** The statement now names the index poset, so the entry that owns it joins the node's closed world, and that entry's `used by` line was extended to match.\n\n## Why the status was not reset\n\n[ADR 0019](../../../../process/decisions/0019-the-update-operator.html) resets a revised `drafted` or `proved` node to `open` because a changed statement invalidates the write-up that discharged it. Nothing here changed the statement: the propositions (i), (ii) and (iii) assert exactly what they asserted when [r2](../critiques/r2.html) passed them, and [proof.md](../proof.html) proves those propositions and cites the same appendix entries. Resetting would have discarded a `PASS` that is still earned. The reset rule is about mathematical content, and this revision has none of its own — if a later reader finds that any clause now says something the write-up does not prove, that is a defect of *this* update and the node should be reopened on it.\n\n## Old statement, verbatim\n\nLink targets are rebased to this directory; the text is otherwise unchanged.\n\n> **(i) One condition replaces the two.** Assume hypothesis **(H1)** of [Q1-L5](../../../Q1/Q1-L5/index.html): each $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\to\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ is continuous and admits a fully faithful continuous left adjoint $i_{\\lambda!}$. Then conditions (1) *(stratumwise generation)* and (2) *(support-cutting)* of [Q1-L5](../../../Q1/Q1-L5/index.html) both hold if and only if every standard object lies in the Satake subcategory:\n>\n> $$\n> \\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\text{ and every }a\\in A_\\lambda.\n> $$\n>\n> **(ii) The equality it cashes out to.** Under the standing hypotheses (H1)–(H3) of [Q1-L5](../../../Q1/Q1-L5/index.html), the Satake subcategory is all of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ if and only if the same membership holds:\n>\n> $$\n> \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) \\qquad\\Longleftrightarrow\\qquad \\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}\\ \\text{ for every }\\lambda\\text{ and every }a.\n> $$\n>\n> **(iii) Independence of the choice.** Neither direction depends on the choice of generating collections: if $\\{E_{\\lambda,a}\\}_a$ and $\\{E'_{\\lambda,b}\\}_b$ both generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, the two families of standard objects generate the same subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n";</script>
