<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L1</a><i>›</i><span>u3</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L1 — update u3</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L1/updates/u3.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q2-L1](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-08 · **Operator:** `/update Q2` (question-level, under a claim on Q2) · **Status before:** `open` · **Status after:** `open`\n\nThis record covers a revision of the [Q2](../../../../dag.html) **framing** together with the clause of this node the framing turns on. A question has no `updates/` directory, so it is filed here.\n\n## The defect, in one sentence\n\n[Q2](../../../../dag.html) declared **(H1)**–**(H3)** standing for the whole question when its own Problem statement needs **(H1)** alone, and offered this node as one of \"two conditions on the geometry of $LX$\" answering it — which is circular, since this node is a reformulation of the membership asked about and not a condition on $X$.\n\n## What was verified this run\n\n**The overstatement, measured against the record rather than judged.** Every occurrence of **(H2)** or **(H3)** anywhere in Q2's statements is inside the range \"**(H1)**–**(H3)**\", and every one of those four sits in a clause whose job is the hand-off to [Q1](../../../../dag.html): clause (ii) of this node, the closing consequence of [Q2-L3](../../Q2-L3/index.html), clause (ii) of [Q2-L8-L1](../../Q2-L8/Q2-L8-L1/index.html), and clause (b) of [Q2-e1-L2](../../Q2-e1/Q2-e1-L2/index.html) — which names **(H1)** and **(H3)** and not **(H2)**. **(H2) is named nowhere in Q2 on its own.** This node's own creation entry of 2026-08-05 had already recorded the judgement — \"(H2) and (H3) enter only when the two conditions are cashed in for the equality\" — and the framing was never brought into line with it.\n\n**The input passage** (labelled *prop:standardObjects_generate* in the draft it came from, external; it is in neither `main.tex` nor `other_sections/`) claims the standard objects **generate** $\\mathrm{Shv}_{\\mathrm{cons}}(I\\backslash LX)$ and $\\mathrm{Shv}_{\\mathrm{cons}}(L^+G\\backslash LX)$. Nothing from it was adopted. Its claims sort as follows.\n\n**Verified.** The adjunction step $\\operatorname{Map}(\\Delta_v,\\mathcal{F})\\simeq\\operatorname{Map}(k,i_v^!\\mathcal{F})$, which is exactly **(H1)** and is why **(H1)** stays standing.\n\n**Refuted.**\n\n- *\"$\\mathcal{O}_v$ is simply connected\", and with it one standard object per orbit.* The passage's own marginal note asks for a reference and none is supplied. [Q2-L2](../../Q2-L2/index.html)(ii) refutes the consequence drawn from it: at $G_\\lambda=\\mu_2$ the sign representation is right-orthogonal to $\\omega_{B\\mu_2}$ in every shift, so the dualizing object does not generate. [Q2-e3-L2](../../Q2-e3/Q2-e3-L2/index.html) exhibits an $X$ where *every* stabilizer quotient is disconnected. The repair is [Q2-L2](../../Q2-L2/index.html)(iii) — one generator per irreducible representation of $\\pi_0(G_\\lambda)$ — which is why this repository indexes standard objects by $(\\lambda,a)$ and not by $\\lambda$. Note also that the relevant category is that of the quotient *stack*, so what governs is $\\pi_0$ of the stabilizer and not $\\pi_1$ of the orbit.\n- *An enumeration $\\mathcal{O}_1,\\mathcal{O}_2,\\dots$ with each $\\mathcal{O}_n$ closed in the complement of its predecessors.* This asserts a well-founded closure order of type $\\omega$. [Q2-e2-L1](../../Q2-e2/Q2-e2-L1/index.html) has the order not well-founded for $X=\\mathbb{A}^1$ under $\\mathbb{G}_m$, and [Chen–Yi: the closure order is filtered on each component](../../../../appendix/bb-chenyi-filtered-orbit-order.html)(b) gives *filteredness*, which supplies upper bounds and not minimal elements.\n- *\"Continuing this inductive argument, we are done.\"* Granting the enumeration, the induction gives vanishing on $LX\\setminus(\\mathcal{O}_1\\cup\\dots\\cup\\mathcal{O}_n)$ for each finite $n$ and no more; the passage to the limit is the whole difficulty, is what **(H2)** and **(H3)** buy, and is the subject of [Q2-L4](../../Q2-L4/index.html), which is `failing` for a defect in exactly that step.\n\n**Unverified.**\n\n- *The conclusion, in the ambient the passage names.* [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) forms $\\langle-\\rangle_{\\mathcal{C}}$ as the smallest **cocomplete** stable subcategory, and its orthogonality criterion runs in the direction the passage uses — orthogonality $\\Rightarrow$ generation — only for $\\mathcal{C}$ **presentable**. $\\mathrm{Shv}_{\\mathrm{cons}}$ is small and not cocomplete; that is the very gap the ratified reading of [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) exists to close, by forming the generation inside $\\mathcal{D}^{\\mathrm{ren}}$. The passage also tests $\\operatorname{Map}(\\Delta_v,\\mathcal{F})$ with no quantifier on shifts, where the criterion quantifies over $i\\ge 0$.\n- *\"Without loss of generality, we prove this for $\\mathrm{Shv}_{\\mathrm{cons}}(I\\backslash LX)$.\"* There is no reduction: [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) gives two different orbit posets, $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, with different stabilizers and different closure orders. The argument has the same shape in both; neither statement follows from the other.\n\n**What the passage is worth, and it is not nothing.** Corrected — stated in $\\mathcal{D}^{\\mathrm{ren}}$, indexed by $(\\lambda,a)$, and with the induction replaced by a limit — it is precisely the half of clause (ii) of this node that **(H2)** and **(H3)** pay for. That is what made the audit above findable: Q2 asks whether the standard objects **belong** to the Satake subcategory, the passage asks whether they **generate** the ambient, and the two together are what give [Q1](../../../../dag.html)'s equality.\n\n## What changed\n\n**In the [Q2](../../../../dag.html) framing.**\n\n1. **Standing hypotheses → one standing hypothesis.** The **(H2)** and **(H3)** displays are gone; **(H1)** stays, with a paragraph saying that the other two are what make the standard objects generate, that generating is not what the question asks, and that each node spending one names it at the point of use.\n2. **Problem statement → choice-free.** It was \"fix for each $\\lambda$ a generating collection … does $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda$ and every $a$\". It is now\n\n   $$\n   i_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+ ,\n   $$\n\n   with the standard-object form given after it as \"the form the nodes work in\". No choice appears in what is asked, and how many generators a stratum needs becomes a fact about the stratum ([Q2-L2](../../Q2-L2/index.html)) rather than a condition on $X$.\n3. **The circular answer paragraph is de-circularized.** This node is no longer listed among the \"conditions on the geometry of $LX$\" — the sufficient ones ([Q2-L3](../../Q2-L3/index.html), [Q2-L4](../../Q2-L4/index.html), [Q2-L5](../../Q2-L5/index.html)) stand alone — and is described as what it is: the bridge, necessary and sufficient for [Q1](../../../../dag.html)'s equality granted **(H2)** and **(H3)** on top of **(H1)**. The declared strength and the node links after it are unchanged, so the answer-carrying channel is unmoved: this node still reads 1.0 and the three sufficient ones 0.6.\n4. **Feeds.** and the **Conjecture** now name **(H1)**–**(H3)** explicitly where they previously said \"the hypotheses below\" and said nothing — the Conjecture's last clause concludes [Q1](../../../../dag.html)'s equality, which spends all three.\n\n**In this node.** Clause (iii) was \"Independence of the choice\"; it is now \"Independence of the choice, and the choice-free form\", and states first that the $E$ with $i_{\\lambda!}E$ in the Satake subcategory form a cocomplete stable subcategory — so the membership of clause (i) is equivalent to the displayed containment — and then the old independence sentence as a consequence. This is what the framing cites, and it is added rather than assumed so that the framing cites something that says it. Two lines from **(H1)** and the minimality half of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), which carries no presentability.\n\n**Materiality of that change (ADR 0019 §4a): material.** The statement gained a clause and a display, and [proof.md](../proof.html) does not prove it. The status was already `open` and stays there; the write-up was already superseded by [u2](u2.html), so nothing is lost that was not already owed, and the next `/prove` continues at `r3` as a rebuild.\n\n**In [Q2-e1-L2](../../Q2-e1/Q2-e1-L2/index.html).** Its clause (b) called **(H1)** and **(H3)** \"in force throughout Q2\". Only **(H1)** is; the parenthetical now says so and marks **(H3)** as named there because that node spends it. No claim of that node changed.\n\n## Considered and not adopted\n\n**Adopting the passage's proposition as an appendix entry or a new node.** Nothing in it survived §2 intact except the adjunction step, which is already **(H1)**. An entry would have to be rewritten in $\\mathcal{D}^{\\mathrm{ren}}$, reindexed by $(\\lambda,a)$ and given a limit step, at which point it is [Q2-L1](../index.html)(ii) plus [Q2-L4](../../Q2-L4/index.html) and not a new fact.\n\n**Widening this node to the generation statement the passage makes.** That is a different claim, not a more general one, and widening a statement in place is forbidden regardless. If the generation half is ever wanted as its own node it is a decomposition of clause (ii), not an edit here.\n\n**Dropping **(H1)** as well, and quantifying over $X$ for which it holds.** It is what makes $i_{\\lambda!}$ exist, so without it the Problem statement has no subject. Keeping it standing and pointing at [Q3](../../../../dag.html) is the honest arrangement.\n\n**Deleting the standard-object form from the framing.** Every node works in it and [Q1-L2](../../../Q1/Q1-L2/index.html)(2) is literally that form, so removing it would make the question harder to use rather than simpler.\n\n## Reaches past this claim — for a repo-wide run\n\n[Q3](../../../../dag.html)'s framing says \"[Q2](../../../../dag.html) states the same package and assumes it\". After this revision Q2 states **(H1)** alone, so that sentence is stale. Q3 is outside the claim this run holds and was not touched.\n";</script>
