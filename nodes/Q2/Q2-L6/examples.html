<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L6</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L6 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q2-L6\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [papers](../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q2-L6](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: gap\n\n**The dictionary.** Three entries below reach the node through the real-symmetric\ncorrespondence, so it is written out once.\n\n(1) A complex symmetric $X=G/K$ corresponds to a real form $G_{\\mathbb{R}}$ whose maximal\ncompact has complexification $K$ (Cartan bijection; Chen–Nadler, arXiv:2403.13995, §1).\n\n(2) The relative Satake category $\\mathcal{D}(X(\\mathcal{K})/G(\\mathcal{O}))$ is canonically\nequivalent to the real Satake category\n$\\mathcal{D}(G_{\\mathbb{R}}(\\mathcal{O}_{\\mathbb{R}})\\backslash\\mathrm{Gr}_{\\mathbb{R}})$,\n$t$-exactly and compatibly with the Hecke actions (same paper, Thm. 1.1; used in the proof of\nThm. 13.4 as \"Theorem 8.14 and Theorem 11.1\").\n\n(3) On indices,\n\n$$\n\\Lambda_S=\\Lambda_T^{\\theta},\\qquad\\sigma\\colon\\Lambda_T\\to\\Lambda_S,\\quad\\sigma(\\mu)=\\mu+\\theta(\\mu)\n$$\n\n(Nadler, arXiv:math/0202150, §2.1.2), which is Chen–Yi's $\\mu-\\theta(\\mu)$ under the\nalgebraic-involution sign convention.\n\n**What it drops:** the sources work with $\\mathbb{C}$-constructible complexes on semi-analytic\nstacks, not the renormalized de Rham categories in force here, and everything they say is\n*abelian* — about $\\mathrm{Perv}$ and its simple objects — so nothing transfers automatically to\nthe cocomplete stable [Satake subcategory](../../../appendix/def-satake-subcategory.html).\n\n## Precedent\n\n**What was searched.** Local library first: `chenyi_2025singularitiesorbitclosuresloop` v4\n(pp. 1–19, 51–54) and `mirkovic2007geometric` (pp. 9–12).\n\nThen the web for the two papers Chen–Yi lean on and for the group-case resolutions: Nadler,\n*Perverse sheaves on real loop Grassmannians* (arXiv:math/0202150v6 = Invent. Math. **159**\n(2005)); Chen–Nadler, *Real groups, symmetric varieties and Langlands duality*\n(arXiv:2403.13995); Ngô–Polo (arXiv:math/0005022 = `NP01`).\n\nQueries for \"affine Bott–Samelson / Demazure resolution for symmetric spaces\" and \"loop\nsymmetric space orbit closure resolution\" returned nothing.\n\n**What was found.**\n\n*Nadler, arXiv:math/0202150, **Lemma 2.1.1**.* \"The intersection $\\Lambda_S\\cap Q^{\\mathrm{pos}}$\nis generated by the elements $\\alpha\\in\\Lambda_S\\cap R^{\\mathrm{pos}}$, and $\\sigma(\\alpha)$, for\n$\\alpha\\in R^{\\mathrm{pos}}$.\"\n\nSince $\\Lambda_S\\cap Q^{\\mathrm{pos}}$ is exactly the set of differences $\\lambda-\\mu$ allowed by\nthe closure order, this **entails piece 5 (i-rider)** and supplies the missing positive form of\nit: a covering difference is a positive coroot lying in $\\Lambda_S$, or $\\alpha-\\theta(\\alpha)$ —\nnever required to be *simple*. It says nothing about pieces 4 (geometry), 6, 7.\n\n*Chen–Yi, **Thm. 18** and its proof (§3.2.5, p. 13), **Prop. 20**, **Cor. 21**.* The proof\ninvokes Nadler's Lemma 2.1.1 to cut a closure relation into steps $\\mu-\\lambda=\\alpha$ or\n$\\alpha-\\theta(\\alpha)$, and realizes each step by an explicit one-parameter family\n$g(s)\\in\\mathrm{SL}_2(\\mathcal{O})$ (Prop. 20), with Case 3 reduced to $\\mathrm{SL}_3$ by\n\"applying Proposition 20 twice\".\n\nThis is **piece 4's \"single move\" as a degeneration**, in print, for every covering relation. It\nis *not* a Hecke correspondence and computes no fibre: the second half of piece 4 — \"fibre a\npoint or an affine space, with trivial monodromy\" — is untouched, and so are pieces 6 and 7.\n\n*Chen–Yi, **Lemma 28** with **Lemma 29** (pp. 18–19).* For a simple affine root $\\alpha$ with\nparahoric $P_\\alpha$ and an Iwahori orbit $\\mathcal{O}_v\\subset LX$,\n\n$$\nI_0\\backslash P_\\alpha\\mathcal{O}_v\\simeq\\mathbb{P}^1/H_{\\alpha,v},\n$$\n\nwith seven types (I, IIa/b, IIIa/b, IVa/b) listing exactly how $P_\\alpha\\mathcal{O}_v$ breaks\ninto one, two or three orbits and which is open.\n\nThis is the affine Mars–Springer package and it is **the geometric half of piece 4, proved at\nIwahori level** — the second repair the node's write-up proposes. It does not reach the\n$L^+G$-orbits of [the spherical stratification](../../../appendix/def-orbits-iwahori-spherical.html),\nwhich is where pieces 4, 6, 8 live.\n\n*Chen–Nadler, **Def. 13.6** with **Cor. 13.8**, and Chen–Yi **Thm. 87**, **Lemma 90**.* Def. 13.6\ndefines $Q_X\\subset\\mathrm{Perv}(X(\\mathcal{K})/G(\\mathcal{O}))$ as the summands of\n$\\omega_{X(\\mathcal{O})/G(\\mathcal{O})}\\star\\mathrm{IC}_V$ — the abelian shadow of\n[the Satake subcategory](../../../appendix/def-satake-subcategory.html).\n\nCor. 13.8: $Q_X$ \"is semi-simple with irreducible objects $\\mathrm{IC}_X^{\\lambda}$,\n$\\lambda\\in\\sigma(\\Lambda_T)$.\" So **the index set Hecke convolution reaches is\n$\\sigma(\\Lambda_T)$, not $\\Lambda_S^+$.**\n\nChen–Yi read it the same way (proof of Thm. 87(ii): \"IC-complexes … supported on the orbit\nclosures $\\overline{LX}_\\lambda$ with $\\lambda\\in\\Lambda_S^+$ of the form $-\\theta(\\mu)+\\mu$,\n$\\mu\\in\\Lambda_T$\"), and their Lemma 90 then *proves*, from the hypothesis that all orbit\ncodimensions in a component are even, that every element of $\\Lambda_S$ has that form.\n\n**This bears on piece 8 in both directions**: it is a precedent for piece 8 exactly where\n$\\sigma(\\Lambda_T)=\\Lambda_S$, and it is an obstruction elsewhere. Chen–Yi's Thm. 87 needs a\nsecond hypothesis the node does not carry — connectedness of the $L^+G$-stabilizers on $LX$.\n\n**What was not found — and the gap.** No source constructs an ind-proper convolution\n$\\pi_\\lambda$ over $\\overline{LX}_\\lambda$ for symmetric $X$ and computes its fibres: **pieces 6\nand 7 are untouched by every source read**, and Chen–Yi §§5–7, which is where the geometry of\nthese closures is worked out, does it by transverse slices rather than by resolutions.\n\nWorse for the node as stated: if $\\lambda\\notin\\sigma(\\Lambda_T)$ then no $\\pi_\\lambda$\nsatisfying (a) and (b) of [Q2-L5](../Q2-L5/index.html) can exist, since $\\pi_{\\lambda!}$ of\nthe constant object would be a Hecke translate supported on $\\overline{LX}_\\lambda$ and nonzero\non the open stratum, hence — by Chen–Nadler Thm. 13.3, the decomposition theorem for the Hecke\naction — semisimple with $\\mathrm{IC}_X^\\lambda$ a summand, contradicting Cor. 13.8. *(That\ndeduction is mine: constructed, unsourced.)*\n\nThe node asserts pieces 6 and 8 at **every** $\\lambda\\in\\Lambda_X^+$ and assumes nothing that\nforces $\\sigma(\\Lambda_T)=\\Lambda_S$. Whether the standing hypotheses do force it is exactly what\nnothing in the literature settles — hence `gap` rather than `counterexample`.\n\n## Instances\n\n### 1. The group case, $X=H$ under $G=H\\times H$ — instance (degenerate, then non-degenerate)\n\n**What it is.** $\\theta$ the swap, $G^\\theta=\\Delta H$, $LX=LH$, $K\\backslash LX$ the Cartan\ndouble quotient, $\\Lambda_S=\\{(\\nu,-\\nu)\\}\\cong X_*(T_H)$.\n\n**Why it is an instance.** (H-sym): $\\Delta H$ is connected. (H-std): $X$ smooth affine\nspherical, and the $B$-stabilizer at $w_0$ is $\\simeq T_H$, connected — as recomputed in the\nnode's own write-up, Step 2.\n\n**What it matches.** Pieces 3, 4, 6, 7 under $G=H\\times H$. Reachability is total here:\n$\\mu-\\theta(\\mu)=(\\mu_1-\\mu_2,\\mu_2-\\mu_1)$ exhausts $\\Lambda_S$, so $\\sigma(\\Lambda_T)=\\Lambda_S$\nand the obstruction above is invisible *(constructed, unsourced)*.\n\nIt does not reach piece 8 as a test, because $\\mathrm{IC}_0$ is the monoidal unit and the\nconclusion is formal — the reading the register fixes at K9.\n\nThe non-degenerate content is Ngô–Polo §9 (p. 22): for $\\mu_\\bullet$ a sequence of minuscule or\nquasi-minuscule coweights,\n\n$$\nm_{\\mu_\\bullet}\\colon\\bar{\\mathcal{Q}}_{\\mu_1}\\widetilde{\\times}\\cdots\\widetilde{\\times}\\bar{\\mathcal{Q}}_{\\mu_n}\\to\\bar{\\mathcal{Q}}_{|\\mu_\\bullet|}\n$$\n\nis \"un morphisme **propre**\", Lemme 9.3 says it is semismall, its fibres over the open orbit are\n\"toutes isomorphes les unes aux autres\", and Prop. 9.4 gives\n\n$$\n\\mathcal{A}_{\\mu_1}\\ast\\cdots\\ast\\mathcal{A}_{\\mu_n}=\\bigoplus_{\\lambda\\le|\\mu_\\bullet|}\\mathcal{A}_\\lambda\\otimes V^\\lambda_{\\mu_\\bullet}.\n$$\n\nThat is **piece 6(a) verbatim** and the parity variant of [Q2-L5](../Q2-L5/index.html) — for\nthe IC objects, not for $\\omega_{K\\backslash LX_\\lambda}$, and only in the group case.\n\n**What the statement says here.** Every $\\overline{\\mathrm{Gr}}_\\lambda$ is the proper image of\nan iterated convolution of minuscule/quasi-minuscule Schubert varieties, with\n$\\mathcal{A}_\\lambda$ a summand of multiplicity one.\n\n**Source.** Ngô–Polo, *Résolutions de Demazure affines et formule de Casselman–Shalika\ngéométrique*, J. Alg. Geom. **10** (2001) 515–547, arXiv:math/0005022 — §9 p. 22, Lemme 9.3,\nProp. 9.4, Lemme 7.3. `refs.bib`: `NP01`.\n\n### 2. Splitting rank: $\\mathrm{SL}_{2n}/\\mathrm{Sp}_{2n}$, $\\mathrm{Spin}_{2n}/\\mathrm{Spin}_{2n-1}$, $E_6/F_4$ — instance\n\n**What it is.** The three symmetric varieties Chen–Yi single out, with relative dual groups\n$\\mathrm{PGL}_{2n}$, $\\mathrm{PGL}_2$, $\\mathrm{PGL}_3$.\n\n**Why it is an instance.** (H-sym): symmetric with $G^\\theta$ connected, and Chen–Yi verify\n\"both the evenness and connectedness assumptions are satisfied\" (Ex. 88). (H-std): homogeneous\nwith reductive stabilizer, hence smooth affine; the connected-$B$-stabilizer clause is **not\ndischarged here from any source I read**.\n\n**What it matches.** Piece 8, in the abelian form: $\\mathrm{Perv}(L^+G\\backslash LX)$ is\nsemisimple (Thm. 87(i)), $\\sigma(\\Lambda_T)=\\Lambda_S$ (Lemma 90), and by Chen–Nadler Cor. 13.8\nevery simple is a summand of a Hecke translate of the basic object.\n\nIt does **not** reach pieces 4, 6, 7: no correspondence is constructed and no fibre computed, and\nthe transfer from $\\mathrm{Perv}$ to $\\omega_{K\\backslash LX_\\lambda}$ in the stable category is\nnot made.\n\n**What the statement says here.** Every orbit closure carries an IC complex obtainable from\n$\\mathrm{IC}_0$ by a single spherical Hecke convolution.\n\n**Source.** Chen–Yi, arXiv:2310.20006v4, Thm. 87 with Ex. 88 and Lemma 90, pp. 51–52;\nChen–Nadler, arXiv:2403.13995, Def. 13.6 and Cor. 13.8, pp. 59–60.\n`refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`, `chen2024real`.\n\n### 3. $X=\\mathrm{GL}_n/(\\mathrm{GL}_p\\times\\mathrm{GL}_q)$, $n=p+q$ even — instance (separating)\n\n**What it is.** A symmetric variety with $G^\\theta=\\mathrm{GL}_p\\times\\mathrm{GL}_q$ connected.\n\n**Why it is an instance.** (H-sym) holds; (H-std) smooth affine spherical, connected-stabilizer\nclause again not discharged from a source.\n\n**What it matches.** It separates the two conditions the sources conflate: Chen–Yi Remark 91\nstates that here \"every element of $\\Lambda_S$ is of the form $-\\theta(\\mu)+\\mu$ but there are\norbits with odd codimension $n-1$\".\n\nSo piece 8's *index set* is complete — the obstruction of Cor. 13.8 is empty — while the\nsemisimplicity that Thm. 87 uses to conclude fails. Pieces 4, 6, 7 untouched.\n\n**What the statement says here.** Every $\\lambda$ is Hecke-reachable, and yet nothing in print\nproduces the resolution $\\pi_\\lambda$ or its fibres.\n\n**Source.** Chen–Yi, Remark 91, p. 52. `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`.\n\n### 4. $X=\\mathrm{SL}_2/\\mathrm{SO}_2$ — boundary case, where the conclusion should fail\n\n**What it is.** The rank-one split symmetric variety; $G_{\\mathbb{R}}=\\mathrm{SL}_2(\\mathbb{R})$\nunder the dictionary.\n\n**Why it is (not quite) an instance.** (H-sym) holds for $G=\\mathrm{SL}_2$: $G^\\theta=T$ is\nconnected. (H-std)(2) fails there: the generic $B$-stabilizer is $B\\cap gTg^{-1}=\\{\\pm 1\\}$,\ndisconnected *(constructed, unsourced)* — though it is the kernel of the action, and reading $X$\nas a $\\mathrm{PGL}_2$-variety repairs (H-std)(2) and breaks (H-sym), since\n$\\mathrm{PGL}_2^\\theta=N(T)/Z$ is disconnected.\n\nThe example sits exactly on the boundary of the node's two hypotheses, which is why it is not\noffered as a counterexample.\n\n**What it matches.** Pieces 6 and 8, negatively. Chen–Yi Remark 89: this $X$ \"has orbits with\ncodimension equal to one\", $\\mathrm{Perv}_\\delta(L^+\\mathrm{SL}_2\\backslash LX)$ \"is not\nsemisimple\" (via [BF22, Thm. 1.8] and, through the dictionary, a $j_!(\\mathbb{C}[1])$ on the\nreal pinched torus).\n\nFor a split form $\\theta$ acts trivially on $\\Lambda_T$, so\n$\\sigma(\\Lambda_T)=2\\Lambda_T\\subsetneq\\Lambda_S$ *(constructed, unsourced)*, and by Cor. 13.8\nthe odd-index orbits carry no Hecke-reachable IC.\n\n**What the statement says here.** Half the strata would have to be produced by a $\\pi_\\lambda$\nthat Chen–Nadler's index set forbids.\n\n**Source.** Chen–Yi, Remark 89, pp. 51–52; Chen–Nadler, Cor. 13.8, p. 60; Nadler,\narXiv:math/0202150, §2.1.2. `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`,\n`chen2024real`.\n\n**Roster, in one paragraph.** Settled for the whole package (pieces 4, 6, 7): only the group case\n$X=H$ under $H\\times H$, and its sub-case $X=T$ under $T\\times T$, both degenerate. Settled for\npiece 8 alone, in the abelian form: $\\mathrm{SL}_{2n}/\\mathrm{Sp}_{2n}$ (so also the symplectic\nperiod $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$), $\\mathrm{Spin}_{2n}/\\mathrm{Spin}_{2n-1}$,\n$E_6/F_4$. Index set complete but nothing else: $\\mathrm{GL}_n/(\\mathrm{GL}_p\\times\\mathrm{GL}_q)$,\n$n$ even. Broken: $\\mathrm{SL}_2/\\mathrm{SO}_2$ and, by the same lattice computation, the split\nfamily $\\mathrm{SL}_n/\\mathrm{SO}_n$, $\\mathrm{Sp}_{2n}/\\mathrm{GL}_n$, $G_2/\\mathrm{SO}_4$ —\neach with the same caveat about (H-std)(2). Out of scope because (H-sym) fails: the\nGan–Gross–Prasad and Rankin–Selberg pairs $\\mathrm{SO}_N$ under\n$\\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$ and $\\mathrm{GL}_N$ under\n$\\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$ (spherical, not symmetric); the Whittaker case (not\n$T^*X$); $X=\\mathbb{A}^n$ under $\\mathrm{GL}_n$ or $\\mathbb{G}_m$ (not homogeneous — its orbit\nposet is a valuation monoid, not the restricted-coroot order); and symmetric $X$ with $G^\\theta$\ndisconnected, where Chen–Yi §11 recovers their results only after restricting to the component\n$LX_{\\mathcal{L}}=\\pi(LG)$.\n";</script>
