<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L6</a><i>›</i><span>u2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L6 — u2</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L6/updates/u2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date.** 2026-08-09 · `/update Q2-L6`, node-local, run under a claim on [Q2](../../../../dag.html).\n\n**Input.** The same passage as [Q2-L5 u1](../../Q2-L5/updates/u1.html), whose sharpest point is that a criterion reaching only the trivial local system does not discharge a hypothesis quantified over every stratum generator.\n\n## The defect\n\n**D1 — the write-up states the claim `u1` refuted, and the status never moved.** On 2026-08-06 [u1](u1.html) refuted clause **(i)** on a counterexample recomputed independently — for $X = \\mathrm{SL}_3$ under $\\mathrm{SL}_3\\times\\mathrm{SL}_3$ with $\\theta$ the swap, $0\\lessdot\\check\\alpha_1+\\check\\alpha_2$ is a covering relation whose difference is not a simple coroot — and corrected the `## Statement` to ask only for *some* dominant $\\nu$. The `## Lemma` block of [proof.md](../proof.html) was not re-synced and still reads \"Every covering relation $\\mu\\lessdot\\lambda$ of that order is realized by a single simple-parahoric Hecke correspondence: there is a **simple** restricted coroot $\\alpha$…\". That revision was **material** — a refuted clause replaced by a weaker one is a different lemma, not a renotation — so `status:` was owed a reset to `open` at that time and did not get one. The node has stood at `drafted` since, with a write-up arguing a statement the repository has refuted.\n\n**D2 — the conclusion overstates its reach, as [Q2-L5](../../Q2-L5/index.html)'s did.** The closing line reads \"which is hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html) with $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$\". Hypothesis **(D)** quantifies over every $a\\in A_\\lambda$; what this node delivers, through [Q2-L5](../../Q2-L5/index.html), is the lift at the single index carrying $\\omega$. The identification therefore needs $\\#A_\\lambda = 1$ at every $\\lambda$, which by [Q2-L2](../../Q2-L2/index.html)(iii) is connectedness of every stabilizer quotient $G_\\lambda$ — a property of the **loop-level** stabilizers that connectedness of $G^\\theta$ does not give and that no node of [Q2](../../../../dag.html) establishes for symmetric $X$. It is known in one case only, $X = G$ under $G\\times G$ at [Q2-e1-L1](../../Q2-e1/Q2-e1-L1/index.html), where the stabilizer is a torus centralizer.\n\n## Old statement, verbatim\n\n> In particular the conclusion of [Q2-L5](../../Q2-L5/index.html) is available at every $\\lambda\\in\\Lambda_X^+$ for symmetric $X$, which is hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html) with $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$.\n\n## New statement\n\nClauses **(i)** and **(ii)** are unchanged. The closing paragraph is replaced by one that separates what the composition gives — the conclusion of [Q2-L5](../../Q2-L5/index.html) at every $\\lambda$ — from what discharging **(D)** would additionally require, namely $\\#A_\\lambda = 1$ throughout, and names that as an open condition on the loop-level stabilizers rather than an achieved one.\n\n## What was verified\n\n**Verified.**\n\n1. *The write-up states the refuted clause* (D1). Read off [proof.md](../proof.html)'s `## Lemma` against this node's `## Statement`; the words \"simple restricted coroot $\\alpha$\" appear in the former and were removed from the latter by [u1](u1.html).\n2. *The revision of 2026-08-06 was material* (D1). A clause asserting that every covering relation is a *simple* move and a clause asserting only that some dominant $\\nu$ exists are different claims, and [u1](u1.html) records the second as replacing a **refuted** first.\n3. *The reach is $\\omega$ only* (D2). Follows from [Q2-L5](../../Q2-L5/index.html)'s conclusion, whose own restriction was made explicit in [Q2-L5 u1](../../Q2-L5/updates/u1.html) this same run, together with hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html).\n4. *Nothing here establishes $\\#A_\\lambda = 1$ for symmetric $X$* (D2). [Chen–Yi symmetric orbits](../../../../appendix/bb-chenyi-symmetric-orbits.html) black-boxes the orbit parametrization and the closure order and asserts nothing about stabilizers; [Q2-L2](../../Q2-L2/index.html)(iii) makes $\\#A_\\lambda$ the number of irreducible representations of $\\pi_0(G_\\lambda)$, and no node computes $\\pi_0(G_\\lambda)$ at symmetric scope.\n\n**Refuted.** Nothing in the input passage bears on this node's clauses (i) or (ii); its argument concerns which objects a criterion produces, not which correspondences exist.\n\n**Unverified.** *That composing the correspondences of (i) yields hypotheses (a) and (b) of [Q2-L5](../../Q2-L5/index.html)* — clause (ii)'s own content, and the standing obligation [u1](u1.html) already recorded: the Chen–Yi entry says nothing about fibres, and no source read constructs an ind-proper convolution over $\\overline{LX}_\\lambda$ and computes them. This is the node's `EVIDENCE: gap` and is unchanged by this run.\n\n## Considered and not adopted\n\n**Re-syncing the `## Lemma` block instead of resetting the status.** Rejected: re-syncing is honest only for an immaterial change, where certifying that no step depends on the difference is possible. Here the difference is a refuted hypothesis, so the steps that used simplicity of $\\alpha$ are exactly what a rebuild must revisit. Pasting the corrected statement over them would leave the argument proving the refuted claim under the corrected heading — the same defect with the evidence removed.\n\n**Adding \"$\\#A_\\lambda = 1$ for every $\\lambda$\" as a hypothesis.** Rejected: it would make the node's conclusion true by assumption while hiding the one thing about symmetric $X$ worth knowing. Stated as an open condition in the conclusion it is visible to the reader and to the next `/decompose`.\n\n## Reaching past this node\n\nRecorded, not acted on.\n\n- **The coverage gap is now confirmed on both supply nodes.** [Q2-L5](../../Q2-L5/index.html) and this node are the whole of what supplies hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html), and both terminate at $\\omega$. [Q2](../../../../dag.html)'s Problem statement claims a sufficient condition on the geometry of $LX$ and does not record that the chain covers one generator per stratum.\n- **A crisp missing claim, for the failure audit:** *for symmetric $X$ with $G^\\theta$ connected, is every loop-level stabilizer quotient $G_\\lambda$ connected?* A `yes` closes D2 here and at [Q2-L5](../../Q2-L5/index.html) for the whole symmetric class; a `no` names the first $X$ where the trivial-local-system criterion provably does not suffice.\n- **No propagation theorem is expressible** while [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) carries no monoid structure, which is what clause (ii)'s \"saturated chain\" quietly walks along.\n";</script>
