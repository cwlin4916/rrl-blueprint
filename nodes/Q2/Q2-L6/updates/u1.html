ambda_S^+$ is the dominant part of the coroot lattice of $\\mathrm{SL}_3$, ordered by dominance, and with $\\check\\alpha_1,\\check\\alpha_2$ the simple coroots:\n\n$$\n\\langle\\check\\alpha_1,\\alpha_2\\rangle = -1 <0, \\qquad \\langle\\check\\alpha_2,\\alpha_1\\rangle = -1 <0, \\qquad \\langle\\check\\alpha_1+\\check\\alpha_2,\\alpha_j\\rangle = 1 >0 \\ (j=1,2).\n$$\n\nSo neither simple coroot is dominant, while $\\check\\theta := \\check\\alpha_1+\\check\\alpha_2$ is, and no dominant element lies strictly between $0$ and $\\check\\theta$. Hence\n\n$$\n0\\ \\lessdot\\ \\check\\theta \\quad\\text{is a covering relation of }\\Lambda_S^+,\\qquad \\check\\theta-0 = \\check\\alpha_1+\\check\\alpha_2\\ \\text{ is not a simple coroot.}\n$$\n\nWorse for the statement as written: $m\\check\\alpha_i$ is dominant for no $m\\ge 1$ and neither $i$, so no move along a simple coroot leaves the base stratum at all. The refutation therefore does not depend on what \"the parahoric attached to $\\alpha$\" is taken to mean, provided such a move shifts the index inside $\\mu+\\mathbb{Z}\\check\\alpha$; and both readings of the displayed order — ambient positive coroots, as the source writes it, or restricted ones — give the same order here, so it is insensitive to that ambiguity too.\n\nClause (ii) then loses its input at $\\lambda = \\check\\theta$: the unique saturated chain from the base orbit is the single step clause (i) fails to supply.\n\n## Old statement, clause (i), verbatim\n\n> **(i) Covering relations are rank-one moves.** Every covering relation $\\mu\\lessdot\\lambda$ of that order is realized by a single simple-parahoric Hecke correspondence: there is a simple restricted coroot $\\alpha$ and a correspondence over $\\overline{LX}_\\lambda$, built from the parahoric attached to $\\alpha$, whose restriction over $LX_\\lambda$ has fibre a point or an affine space, with trivial monodromy.\n\n## New statement, clause (i)\n\n> **(i) Covering relations are single Hecke moves.** For every covering relation $\\mu\\lessdot\\lambda$ of that order there is a dominant coweight $\\nu$ and a Hecke correspondence over $\\overline{LX}_\\lambda$, attached to $\\nu$, whose restriction over $LX_\\lambda$ has fibre a point or an affine space, with trivial monodromy. The coweight $\\nu$ is **not** in general a simple restricted coroot: in the dominant cone a covering relation need not differ by a simple coroot, and it does not already at $X = \\mathrm{SL}_3$ under $\\mathrm{SL}_3\\times\\mathrm{SL}_3$, where $0\\lessdot\\check\\alpha_1+\\check\\alpha_2$ (this update).\n\nClause (ii) is amended in one phrase — \"the correspondences of (i)\" now compose along the chain of coweights $\\nu$ supplied by (i), rather than along simple coroots — and the parenthetical \"with $n_\\lambda$ the sum of the fibre dimensions along the chain\" is retained, since it is a statement about the composite and not about rank one.\n\n## The three columns\n\n**Verified.** The counterexample above, recomputed from the Cartan matrix of $A_2$ this run and not taken from the prover's report. That $\\Lambda_S^+$ carries the dominance order and that the closure order is as displayed — [Chen–Yi symmetric orbits](../../../../appendix/bb-chenyi-symmetric-orbits.html), whose hypotheses ($X$ symmetric, $G^\\theta$ connected) the counterexample satisfies.\n\n**Refuted.** Clause (i) as it stood — the universally quantified \"every covering relation is a **simple**-parahoric move\".\n\n**Unverified, and therefore NOT asserted in the new statement.** That the fibre of the corrected correspondence is a point or an affine space with trivial monodromy. The prover reports that the Chen–Yi entry black-boxes the orbit parametrization and the closure order *only*, and says nothing about any fibre, so this clause has no source in the closed world; it stays in the statement as a **hypothesis the node must still discharge**, not as something this update establishes. Likewise the composition claim of (ii): the fibre of a composite over a point of $LX_\\lambda$ fibres over intermediate points that may lie in lower strata, so ind-properness, additivity of $n_\\lambda$ and triviality of composed monodromy do not follow formally from the one-step case.\n\n## Considered and not adopted\n\n- **Restricting the node to restricted rank one, where (i) is automatic.** Rejected: it would make the node true by shrinking it to the case Q2 does not need, and the conjecture the node feeds is stated for all symmetric $X$.\n- **Deleting clause (i) and assuming $\\pi_\\lambda$ outright.** Rejected: that is Q2-L5's hypothesis (a)+(b) already, so the node would assert nothing.\n- **Re-indexing the induction on Iwahori orbits $\\{\\mathcal{O}_v\\}$, where length-one steps genuinely are rank one, and pushing forward to the $K$-orbits.** Not adopted *here*, because it is a different argument rather than a correction of this one — it is proposed as a new node instead, and commissioned in this run's failure audit.\n";</script>
