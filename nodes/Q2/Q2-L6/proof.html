<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L6</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L6 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q2-L6 — Rank-one parahoric moves compose to the required correspondences\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html), [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html), [Chen–Yi symmetric orbits](../../../appendix/bb-chenyi-symmetric-orbits.html); no `depends-on` (ready leaf).\n- **notation:** $\\check\\Delta_S\\subset\\check\\Phi_S^+$ are the simple and positive restricted coroots, $\\lessdot$ the covering relation of the order displayed below, $\\lambda_0$ the base stratum's index, and $T_0\\subset B_0\\subset\\mathrm{SL}_3$ a Borel pair with simple coroots $\\check\\alpha_1,\\check\\alpha_2$.\n\n## Lemma\n\nAssume, in addition to the standing hypotheses on $X$ ([untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html)), that $X$ is *symmetric*: $X = G/G^\\theta$ for an involution $\\theta$ of $G$ with $G^\\theta$ connected, so that [Chen–Yi symmetric orbits](../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) with the dominant restricted coweights $\\Lambda_S^+$ and the closure order with\n\n$$\n\\mu\\le\\lambda\\ \\Longleftrightarrow\\ \\lambda-\\mu\\ \\text{is a nonnegative integral sum of positive restricted coroots}.\n$$\n\nThen:\n\n**(i) Covering relations are rank-one moves.** Every covering relation $\\mu\\lessdot\\lambda$ of that order is realized by a single simple-parahoric Hecke correspondence: there is a simple restricted coroot $\\alpha$ and a correspondence over $\\overline{LX}_\\lambda$, built from the parahoric attached to $\\alpha$, whose restriction over $LX_\\lambda$ has fibre a point or an affine space, with trivial monodromy.\n\n**(ii) Composition.** Composing the correspondences of (i) along a saturated chain from the base orbit $\\lambda_0$ to $\\lambda$ yields a map $\\pi_\\lambda$ satisfying hypotheses (a) and (b) of [Q2-L5](../Q2-L5/index.html), with $n_\\lambda$ the sum of the fibre dimensions along the chain.\n\nIn particular the conclusion of [Q2-L5](../Q2-L5/index.html) is available at every $\\lambda\\in\\Lambda_X^+$ for symmetric $X$, which is hypothesis **(D)** of [Q2-L3](../Q2-L3/index.html) with $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$.\n\n## Proof\n\n**The Lemma is not proved: clause (i) is false as stated.** Steps 1–5 give a counterexample inside the Lemma's own hypotheses; Step 6 draws the consequence for (ii).\n\n**Step 1 — The displayed order is the cone order on $\\check\\Delta_S$.**\n\n<details><summary>the argument</summary>\n\nEvery positive coroot of a root system is a non-negative integral combination of simple ones, so $\\mathbb{Z}_{\\ge0}\\check\\Phi_S^+=\\mathbb{Z}_{\\ge0}\\check\\Delta_S$ and the order reads\n\n$$\n\\mu\\le\\lambda\\iff\\lambda-\\mu\\in\\mathbb{Z}_{\\ge0}\\check\\Delta_S .\n$$\n\n</details>\n\n**Step 2 — The group case $X=\\mathrm{SL}_3$ satisfies every hypothesis of the Lemma.**\n\n<details><summary>the argument</summary>\n\nLet $G=\\mathrm{SL}_3\\times\\mathrm{SL}_3$ act on $X=\\mathrm{SL}_3$ by $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$ and let $\\theta$ be the swap involution. Then $G^\\theta=\\Delta\\mathrm{SL}_3$ is connected and $X\\simeq G/G^\\theta$, the hypothesis of [Chen–Yi symmetric orbits](../../../appendix/bb-chenyi-symmetric-orbits.html). Also $X$ is smooth and affine, the Bruhat cell $B_0w_0B_0$ is the open orbit of $B=B_0\\times B_0$, and the stabilizer of $w_0$ is $\\{(w_0tw_0^{-1},t):t\\in T_0\\}\\simeq T_0$, connected; so [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html)(1)–(2) hold.\n\n</details>\n\n**Step 3 — For this $X$, $\\Lambda_S^+$ is the dominant part of the coroot lattice of $\\mathrm{SL}_3$ under dominance order.**\n\n<details><summary>the argument</summary>\n\nA maximal $\\theta$-split torus is $S=\\{(t,t^{-1})\\}$, so\n\n$$\n\\Lambda_S=\\{(\\nu,-\\nu):\\nu\\in X_*(T_0)\\}\\simeq\\mathbb{Z}\\check\\alpha_1\\oplus\\mathbb{Z}\\check\\alpha_2 ,\n$$\n\nand $(B_0\\times B_0^-,\\,T_0\\times T_0)$ is a $\\theta$-split Borel pair, with positive coroots $\\check\\Phi^+\\times\\{0\\}$ and $\\{0\\}\\times(-\\check\\Phi^+)$. Their non-negative span meets $\\Lambda_S$ in $\\{(\\xi,-\\xi):\\xi\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+\\}$, and $B$-dominance on $\\Lambda_S$ is $B_0$-dominance on $X_*(T_0)$. The positive restricted coroots being the $(\\check\\beta,-\\check\\beta)$, both readings of the display — ambient or restricted coroots — give the same order.\n\n</details>\n\n**Step 4 — The highest coroot covers the base index.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\n\\lambda_0=0,\\qquad\\check\\theta=\\check\\alpha_1+\\check\\alpha_2 .\n$$\n\nBy Step 1 the interval between them consists of the $a\\check\\alpha_1+b\\check\\alpha_2$ with $a,b\\in\\{0,1\\}$, and $\\alpha_2(\\check\\alpha_1)=\\alpha_1(\\check\\alpha_2)=-1<0$, so $\\check\\alpha_1,\\check\\alpha_2\\notin\\Lambda_S^+$. Both endpoints are dominant, so that interval meets $\\Lambda_S^+$ in $\\{\\lambda_0,\\check\\theta\\}$ and $\\lambda_0\\lessdot\\check\\theta$.\n\n</details>\n\n**Step 5 — No rank-one move realizes that covering relation.**\n\n<details><summary>the argument</summary>\n\nFor each $i$ and each integer $m\\ne0$ one has $m\\check\\alpha_i\\notin\\Lambda_S^+$: for $m>0$ the pairing with the other simple root is $-m<0$, for $m<0$ the pairing with $\\alpha_i$ is $2m<0$. Hence $LX_{\\lambda_0}$ is the only stratum of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) whose index lies in $\\lambda_0+\\mathbb{Z}\\check\\alpha_i$. Under the only reading that makes \"rank one\" mean anything — an $\\alpha$-parahoric move shifts the index inside $\\mu+\\mathbb{Z}\\check\\alpha$ — no simple-parahoric correspondence carries $\\overline{LX}_{\\lambda_0}$ onto $\\overline{LX}_{\\check\\theta}$, and $\\check\\theta-\\lambda_0$ is in any case not a simple restricted coroot.\n\n</details>\n\n**Step 6 — Clause (ii) therefore has no input at $\\lambda=\\check\\theta$.**\n\n<details><summary>the argument</summary>\n\nThe only saturated chain from $\\lambda_0$ to $\\check\\theta$ is the single step $\\lambda_0\\lessdot\\check\\theta$, whose correspondence (i) does not supply; so no $\\pi_{\\check\\theta}$ is produced and hypotheses (a), (b) of [Q2-L5](../Q2-L5/index.html) are not established by this route.\n\n**GAP.** Three ingredients are absent from the closed world, and I do not cite around them. (1) *The parahoric.* No appendix entry defines the parahoric attached to a simple restricted coroot, nor the correspondence built from it; the appendix carries $I$, $K$ and the convolution action only. (2) *Its geometry.* [Chen–Yi symmetric orbits](../../../appendix/bb-chenyi-symmetric-orbits.html) supplies the orbit parametrization and the closure order only: no fibre of any correspondence, hence neither \"a point or an affine space\" nor trivial monodromy. (3) *Composition.* The fibre of a composite over $x\\in LX_\\lambda$ fibres over intermediate points that may lie in strata below the open one, so ind-properness, additivity of $n_\\lambda$ and triviality of the composed monodromy do not follow formally from the one-step case.\n\n</details>\n\n## Caveats\n\n**The corrected hypothesis.** \"Simple restricted coroot\" must go. Step 4 is not exotic: the failure recurs on the walls of the dominant cone for any symmetric $X$ whose restricted datum has rank $\\ge2$. Only in restricted rank one, where $\\Lambda_S^+\\simeq\\mathbb{Z}_{\\ge0}$ and $\\check\\Delta_S$ is a single element, is (i)'s combinatorics automatic. Two repairs are available and want separate nodes: replace the rank-one move by convolution with a single dominant $\\nu$, dropping \"rank one\"; or move the induction to the $I$-orbits $\\{\\mathcal{O}_v\\}$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), where length-one steps are genuinely rank one, and push forward to the $K$-orbits afterwards.\n\n**Provenance, not citation.** [[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] proves its closure relation (p. 13) by reducing to differences that are positive coroots, or $\\alpha-\\theta(\\alpha)$ — never simple coroots. That reduction is outside the appendix entry and is not invoked above.\n";</script>
