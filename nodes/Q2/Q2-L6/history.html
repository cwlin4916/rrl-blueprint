us: this is a conjecture, typed `prop`.** The `type:` vocabulary of the index schema has no entry for a conjecture, and every node in the tree is an unproved claim until `/prove` says otherwise, so nothing is lost by typing it `prop`; the reader is told here instead. What is known is the input side, not the output: Chen–Yi prove the closure relation by reducing to rank-one and small-rank calculations and describe the local geometry through quotients of $\\mathbb{P}^1$ by stabilizer subgroups, and they construct conical transverse slices and prove purity and parity for the orbit-closure IC complexes. What they do not prove is the statement this node needs — that the resulting objects lie in the cyclic category generated from [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) by spherical Hecke convolution.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: rank-one parahoric moves for symmetric $X$, resting on the same Chen–Yi order as [Q1-L6-L1](../../Q1/Q1-L6/Q1-L6-L1/index.html).\n- **2026-08-06 — clause (i) refuted and corrected** by `/update Q2-L6`, on a counterexample returned by `/prove Q2-L6` and recomputed independently before adoption; recorded in [u1.md](updates/u1.html). The clause asserted that every covering relation of the closure order is a **simple**-parahoric move. It is false inside the node's own hypotheses: for $X = \\mathrm{SL}_3$ under $\\mathrm{SL}_3\\times\\mathrm{SL}_3$ with $\\theta$ the swap, neither simple coroot of $\\mathrm{SL}_3$ is dominant, $\\check\\alpha_1+\\check\\alpha_2$ is, and nothing dominant lies strictly between $0$ and it — so $0\\lessdot\\check\\alpha_1+\\check\\alpha_2$ is a covering relation whose difference is not simple, and no move along a simple coroot leaves the base stratum at all. Clause (i) now asks only for *some* dominant coweight $\\nu$ and says explicitly that $\\nu$ is not in general simple. The fibre claim and the composition claim of (ii) are **not** established by this correction — the [Chen–Yi entry](../../../appendix/bb-chenyi-symmetric-orbits.html) black-boxes the orbit parametrization and closure order only, and says nothing about fibres — so both remain obligations the node still owes.\n- **2026-08-09 — status reset to `open`, a correction owed since 2026-08-06** by `/update Q2-L6`, recorded in [u2](updates/u2.html). [u1](updates/u1.html) refuted clause **(i)** on the $\\mathrm{SL}_3$ counterexample and corrected the statement to ask only for *some* dominant $\\nu$; that was a **material** revision and owed a status reset, which it did not get. The node stood at `drafted` for three days with a write-up whose `## Lemma` still reads \"there is a **simple** restricted coroot $\\alpha$\" — the refuted claim. The write-up is superseded and the next `/prove` is a rebuild, not a re-sync: the steps that used simplicity of $\\alpha$ are exactly what has to be revisited, and pasting the corrected statement over them would leave the argument proving the refuted claim under the corrected heading. The draft and its record stay on disk as history.\n- **2026-08-09 — the conclusion now says what it does not deliver.** It asserted \"the conclusion of [Q2-L5](../Q2-L5/index.html) is available at every $\\lambda$ …, which is hypothesis **(D)** of [Q2-L3](../Q2-L3/index.html) with $E_\\lambda = \\omega$\". [Q2-L5](../Q2-L5/index.html) lifts $\\omega$ and nothing else, while **(D)** quantifies over every $a\\in A_\\lambda$, so the identification needs $\\#A_\\lambda = 1$ at every $\\lambda$ — by [Q2-L2](../Q2-L2/index.html)(iii), connectedness of every **loop-level** stabilizer quotient $G_\\lambda$. Connectedness of $G^\\theta$ does not give it and [Chen–Yi symmetric orbits](../../../appendix/bb-chenyi-symmetric-orbits.html) asserts nothing about stabilizers, so it is now stated as the open condition standing between this node and **(D)**. The title loses \"Rank-one parahoric moves\", which is the refuted clause (i) in four words.\n- **2026-08-09 — the crisp missing claim this node names.** *For symmetric $X$ with $G^\\theta$ connected, is every loop-level stabilizer quotient $G_\\lambda$ connected?* A `yes` closes the restriction here and at [Q2-L5](../Q2-L5/index.html) across the whole symmetric class; a `no` names the first $X$ where a trivial-local-system criterion provably does not suffice. Recorded for the repo-wide failure audit — this was a node-local run and commissions nothing.\n";</script>
