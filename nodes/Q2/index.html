<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">nodes</a><i>›</i><span>Q2_node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2 — For which $X$ does every standard object of a stratum lie in the Satake subcategory?</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2_node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[DAG index](../../dag.html) · [appendix](../../appendix/index.html) · [context](../../context.html) · [key examples](../../key_examples/index.html) · [history](history.html)\n\n- **type:** question\n- **created:** 2026-08-05\n- **human:** —\n\n## Feeds\n\n[Q1](../Q1/index.html), at [Q1-L2](../Q1/Q1-L2/index.html), whose hypothesis (2) the membership asked for here *is*. Granted **(H2)** and **(H3)** below on top of **(H1)**, that membership is necessary and sufficient for [Q1](../Q1/index.html)'s equality — [Q2-L1](Q2-L1/index.html)(ii).\n\nThe relation is between the *questions*. No Q2 node lists a Q1 node in **depends-on**, so the two arguments stay separately auditable, and every hypothesis Q2 spends is stated here rather than borrowed by reference.\n\n## Setting\n\n$k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../context.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../appendix/def-orbits-iwahori-spherical.html). $LX$ carries the $K$-placid presentation by orbit closures of [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html),\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda .\n$$\n\nCoherence is [coherent $\\mathcal{D}$-modules](../../appendix/defn-coherent-d-mod.html), the renormalized category is $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../appendix/conv-hecke-action.html).\n\n### The recollement package, and which clause is standing\n\n[Q3](../Q3/index.html) asks for which $X$ the three clauses below hold, and states them canonically. They are written out in full here because Q2 spends them one at a time and a reader must be able to check which: **(H1)** is in force throughout Q2, and **(H2)** and **(H3)** are not.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n**(H1) is standing; the other two are spent by name.** Q2 assumes **(H1)** everywhere and proves it nowhere — discharging it is [Q1](../Q1/index.html)'s business, and it is what makes $i_{\\lambda!}$ exist, so without it the question below has no subject.\n\n**(H2)** and **(H3)** are what make the standard objects *generate* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. Generating is a different question from belonging, and belonging is what is asked here.\n\nThe two enter only where the membership is cashed in for [Q1](../Q1/index.html)'s equality, at [Q2-L1](Q2-L1/index.html)(ii), and each node that spends one names it at the point of use. A node needing a fourth hypothesis has found one and must say so.\n\n## Problem statement\n\nFor which $X$ in the standing class does $!$-extension from every stratum land in the Satake subcategory:\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\ ?\n$$\n\nStating it costs **(H1)** and nothing else, because **(H1)** is what makes $i_{\\lambda!}$ exist. Equivalently, in the form the nodes work in: every **standard object** $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$ of a stratum lies in the subcategory ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../appendix/def-generation.html); notation [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../appendix/not-standard-objects.html)).\n\n**What counts as an answer.** Geometric hypotheses on $X$ under which the membership provably holds, together with an $X$ in the standing class where it provably fails — and never a reformulation of the membership itself, which conditions nothing. The bench of $X$ for which the goal question is settled in print is [`key_examples.md`](../../key_examples/index.html), outside the closed world; [K12](../../key_examples/k12.html) already supplies the failing half, which is why the Conjecture below carries hypotheses rather than asserting the membership outright.\n\n## Conjecture\n\n*(v1 — 2026-08-05.)* **Hecke–Bott–Samelson triangularity.** Let $X$ be symmetric — $X = G/G^\\theta$ with $G^\\theta$ connected — with every stratum stabilizer of connected finite-type reductive quotient $G_\\lambda$. Then $\\#A_\\lambda = 1$ and $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$ by [Q2-L2](Q2-L2/index.html)(i), so each stratum contributes one standard object $\\Delta_\\lambda = i_{\\lambda!}\\omega_{K\\backslash LX_\\lambda}$, and every one of them is reached by a Bott–Samelson word: for each $\\lambda$ there are dominant coweights $\\nu_1,\\dots,\\nu_r$ whose iterated convolution map\n\n$$\n\\pi_\\lambda\\colon\\ Z_\\lambda = \\overline{\\mathrm{Gr}}_{\\nu_1}\\,\\widetilde{\\times}\\,\\cdots\\,\\widetilde{\\times}\\,\\overline{\\mathrm{Gr}}_{\\nu_r}\\,\\widetilde{\\times}^{K}\\,L^+X\\ \\longrightarrow\\ LX\n$$\n\nis ind-proper with image $\\overline{LX}_\\lambda$ and cohomologically trivial over $LX_\\lambda$ — an isomorphism or an affine-space bundle with trivial monodromy.\n\n**What relates $\\lambda$ to the $\\nu_i$ is the image and nothing else.** The word $(\\nu_1,\\dots,\\nu_r)$ depends on $\\lambda$, and no other relation to it is claimed: $r$ is unbounded, no partial sum $\\nu_1+\\cdots+\\nu_i$ is asserted to be dominant-conjugate to $\\lambda$, and the $\\nu_i$ need not lie in $\\Lambda_X^+$ at all — they are coweights of $G$, indexing Schubert cells of $\\mathrm{Gr}$, while $\\lambda$ indexes an orbit of $LX$. They are tied by the last line of the display alone, that $\\pi_\\lambda$ has image exactly $\\overline{LX}_\\lambda$. So $\\lambda\\mapsto(\\nu_1,\\dots,\\nu_r)$ is a choice the conjecture asserts *exists*, not a formula, and the conjecture is the surjectivity statement that Hecke words sweep out every orbit closure.\n\nConsequently $\\Delta_\\lambda\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ for every $\\lambda$; granted **(H2)** and **(H3)** as well, [Q1](../Q1/index.html)'s equality holds for such $X$.\n\n**Two cautions on the hypotheses, both added 2026-08-09.** The connectedness clause is doing more work than its placement suggests: it is not a convenience but what makes $\\#A_\\lambda = 1$, and with it the entire mechanism this conjecture describes applies to one generator per stratum.\n\nWhether it holds across the symmetric class is **unknown here** — connectedness of $G^\\theta$ does not give connectedness of the loop-level $G_\\lambda$, [Chen–Yi symmetric orbits](../../appendix/bb-chenyi-symmetric-orbits.html) asserts nothing about stabilizers, and the one case settled is $X = G$ under $G\\times G$ at [Q2-e1-L1](Q2-e1/Q2-e1-L1/index.html), where the stabilizer is a torus centralizer.\n\nSeparately, *Bott–Samelson* names an expectation and not a hypothesis: what [Q2-L5](Q2-L5/index.html) assumes of $\\pi_\\lambda$ is ind-properness and cohomological triviality over the stratum, with neither smoothness of $Z_\\lambda$, nor birationality, nor point fibres anywhere in force.\n\n## Pipeline\n\nThe next five actions, ranked by what each buys this question's confidence. Authored, not derived: which missing fact clears a defect is a judgement no gate can compute. Each row names the operator, its target and the record it reads; the site prints the target's current status and confidence beside it.\n\n- **1.** `/prove Q2-L5-L4` · [Q2-L5-L4](Q2-L5/Q2-L5-L4/index.html) — **(Coh)**, gapped since 2026-08-06, turns out to be in print and in `papers/`: [examples](Q2-L5/Q2-L5-L4/examples.html) locates it at Drinfeld–Gaitsgory §7.3.2, so the round's one widening writes the entry.\n- **2.** `/prove Q2-L5-L1` · [Q2-L5-L1](Q2-L5/Q2-L5-L1/index.html) — the cheapest of the four new children and the only one nothing is known to block; it is what [Q2-L5-L2](Q2-L5/Q2-L5-L2/index.html) and [Q2-L5-L3](Q2-L5/Q2-L5-L3/index.html) both rest on.\n- **3.** `/prove Q2-L6` · [Q2-L6](Q2-L6/index.html) — [u2](Q2-L6/updates/u2.html) reset it because the draft still argues the clause [u1](Q2-L6/updates/u1.html) refuted; a rebuild is the remedy, and it is a leaf.\n- **4.** `/prove Q2-L4-L2` · [Q2-L4-L2](Q2-L4/Q2-L4-L2/index.html) — a `ready` leaf carrying the $\\mathrm{Pr}^L$ fact [Q2-L4](Q2-L4/index.html) needs, so it discharges that node's one unverified hypothesis and lifts the other `failing` term.\n- **5.** `/examples Q2-L2` · [Q2-L2](Q2-L2/index.html) — it has none, and today's run at [Q2-e3-L5](Q2-e3/Q2-e3-L5/index.html) found a published analogue where the sign block provably lies outside the Satake image, bearing directly on its clauses (ii)–(iii).\n";</script>
