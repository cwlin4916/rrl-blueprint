statement is made under, specialised to $X = \\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$. **What it does not reach:** it computes the leading coefficient and, at $n = 1$, its parity; it does not compute a single lower coefficient $c_{\\nu,\\mu}$, and it says nothing about $n\\ge2$ beyond what triangularity gives.\n- **2026-08-06 — the arithmetic behind clause (2), in one line.** At $n = 1$ the fibre of the convolution over a point of the open stratum is the whole of $\\overline{\\mathrm{Gr}}_\\nu$ ([Q2-e4-L4](../Q2-e4-L4/index.html)(3)), so $[\\mathrm{IC}_\\nu\\ast\\mathrm{IC}_0]$ contributes $\\pm\\dim V_\\nu$ with $\\dim V_\\nu = \\nu_1-\\nu_2+1$, which is even exactly when $\\nu_1+\\nu_2 = \\sigma(\\nu)$ is odd; the classes $[\\mathrm{IC}_\\nu]$ span $\\mathcal{H}$, so the whole module lands in $2\\mathbb{Z}$ there.\n- **2026-08-06 — why this is the interesting outcome.** Clause (3) says the equality supposed throughout [Q1-L3-c1](../../../Q1/Q1-L3/Q1-L3-c1/index.html) — that $K_0$ of the Satake subcategory *is* the Hecke module of $[\\mathrm{IC}_0]$ — fails already in the smallest member of this family, and fails for a structural reason: the subcategory is closed under retracts and $K_0$ of the module generated by one class is not. Clause (4) then records the consequence, which is a warning about the operator rather than about the variety: the decategorified obstruction of [Q1-L3-c1](../../../Q1/Q1-L3/Q1-L3-c1/index.html)(i), applied to this $X$ without checking its supposition, would report that the answer to [Q1](../../../../dag.html) is no, while [Q2-e4-L4](../Q2-e4-L4/index.html)(4) exhibits the standard object inside the Satake subcategory.\n- **2026-08-06 — why it depends on all three earlier siblings.** [Q2-e4-L1](../Q2-e4-L1/index.html) fixes the closure order the triangularity is stated for; [Q2-e4-L2](../Q2-e4-L2/index.html) fixes the one standard object per stratum, without which there is no basis $\\{m_\\lambda\\}$; [Q2-e4-L3](../Q2-e4-L3/index.html) supplies the words and hypothesis (R), which is what makes $\\sigma(\\nu)$ the leading index; and [Q2-e4-L4](../Q2-e4-L4/index.html) supplies the fibre whose Euler characteristic is the leading coefficient, and the retract that makes clause (3) a strict inequality rather than a conjecture.\n";</script>
