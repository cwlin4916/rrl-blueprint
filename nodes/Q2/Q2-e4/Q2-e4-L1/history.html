alised to $G = \\mathrm{GL}_{2n}$ with $\\theta$ the symplectic involution, together with hypothesis (A) of [Q2-L3](../../Q2-L3/index.html), which the computation confirms. **What it does not reach:** nothing about stabilizers, Hecke correspondences or costalks — those are the other four children — and nothing about which $\\lambda$ a Hecke word can reach, which is [Q2-e4-L3](../Q2-e4-L3/index.html).\n- **2026-08-06 — the ready leaf of the expansion.** It assumes no sibling: clauses (1)–(3) are lattice combinatorics over the two clauses of [Chen–Yi symmetric orbits](../../../../appendix/bb-chenyi-symmetric-orbits.html) — the parametrization $\\Lambda_X^+ = \\Lambda_S^+$ and the closure relation $\\lambda\\le\\mu\\iff\\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+$ — whose hypothesis, $X$ symmetric with $G^\\theta$ connected, holds here because $\\mathrm{Sp}_{2n}$ is connected. Every other child of [Q2-e4](../index.html) consumes this node's notation.\n";</script>
