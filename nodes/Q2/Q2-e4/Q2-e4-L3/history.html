sh\\mathrm{GL}_{2n}$. **What it does not reach:** it settles the *support* of a Hecke word and nothing about its fibres, so hypothesis (b) of [Q2-L5](../../Q2-L5/index.html) is untouched here and is [Q2-e4-L4](../Q2-e4-L4/index.html)'s business.\n- **2026-08-06 — where hypothesis (R) comes from, and that it is not in the appendix.** A concurrent `/examples` run on [Q2-L6](../../Q2-L6/index.html) recorded ([examples.md](../../Q2-L6/examples.html), `EVIDENCE: gap`) that the set of $\\lambda$ which spherical Hecke convolution from the basic object actually reaches is $\\sigma(\\Lambda_T) = \\{\\mu-\\theta(\\mu)\\}$, which need not be all of $\\Lambda_S^+$. The source is Chen–Nadler, *Real groups, symmetric varieties and Langlands duality*, arXiv:2403.13995 (`refs.bib`: `chen2024real`), read on disk this run at pp. 59–60: **Definition 13.6** puts $Q_X\\subset\\mathrm{Perv}(X(\\mathcal{K})/G(\\mathcal{O}))$ equal to the perverse sheaves appearing as summands of $\\omega_{X(\\mathcal{O})/G(\\mathcal{O})}\\star\\mathrm{IC}_V$, $V\\in\\mathrm{Rep}(G^\\vee)$; **Corollary 13.8** states that $Q_X$ \"is semi-simple with irreducible objects $\\mathrm{IC}_X^\\lambda$, $\\lambda\\in\\sigma(\\Lambda_T)$\". That result has **no entry in `blueprint/appendix.md`** and none is written this run, so it is not available to a prover: the statement carries it as hypothesis (R) in the geometric form the node actually needs — the image of the convolution map — and a write-up may not cite the source in its place.\n- **2026-08-06 — the two computations the node asserts, and why the second is the point.** Clause (1) is a two-line lattice computation and comes out *positive*: $\\sigma$ is already surjective onto $\\Lambda_S$ because $\\sigma(e_{2i-1}) = \\sigma(e_{2i}) = \\epsilon_i$, which is why this family is the one Chen–Yi's Lemma 90 (p. 52, read this run) and Example 88 single out. Clause (2) says the *dominant* cone is nevertheless not exhausted: $\\sigma(\\Lambda^+)$ omits $\\lambda = (a,a)$ with $a$ odd at $n = 2$. The distinction between $\\sigma(\\Lambda_T)$ and $\\sigma(\\Lambda^+)$ is what separates \"$\\mathrm{IC}_X^\\lambda$ is a *summand* of a Hecke translate\", which Cor. 13.8 gives, from \"the *image* of the convolution is $\\overline{LX}_\\lambda$\", which is hypothesis (a) of [Q2-L5](../../Q2-L5/index.html) — and the parent's clause (iii) asks for the latter.\n- **2026-08-06 — why it depends on [Q2-e4-L1](../Q2-e4-L1/index.html).** Clause (2)'s reading of the complement as \"the least element of the level set $\\Lambda_X^+(c)$, $c\\equiv2\\pmod4$\" is stated in that sibling's poset, and the closure order used to say what $\\overline{LX}_\\lambda$ is comes from there.\n";</script>
