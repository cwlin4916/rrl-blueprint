4-L3](../Q2-e4-L3/index.html)).\n\nThe distinction doing the work is one the literature makes and the parent's clause did not: Chen–Nadler Cor. 13.8 gives $\\mathrm{IC}_X^\\lambda$ as a **summand** of a Hecke translate, while clause (iii) asks for a word whose convolution has $\\overline{LX}_\\lambda$ as its **image**. The second is strictly stronger, and this is where the two come apart.\n\n## Where clause (iv) fails\n\nAt $n = 1$ — $X = \\mathrm{Sp}_2\\backslash\\mathrm{GL}_2$, with $\\mathrm{GL}_2$ acting through $\\det$ — hypothesis (a) of [Q2-L5](../../Q2-L5/index.html) holds and hypothesis (b) fails at every odd $\\lambda$: the fibre over the open stratum is all of $\\overline{\\mathrm{Gr}}_\\nu\\simeq\\mathbb{P}^1$, not a point ([Q2-e4-L4](../Q2-e4-L4/index.html)). $\\Delta_\\lambda$ is nonetheless in the Satake subcategory, as a retract — which is why the failure is of the route and not of the membership.\n\n## The consequence for another node, reported and not acted on\n\nDecategorified, the same computation says the standing supposition of [Q1-L3-c1](../../../Q1/Q1-L3/Q1-L3-c1/index.html) — that $K_0$ of the small Satake subcategory is the cyclic Hecke module on $[\\mathrm{IC}_0]$ — is **false at rank one** ([Q2-e4-L5](../Q2-e4-L5/index.html)). Q2-L7's clause (i) applied without checking that supposition would report a false negative for [Q1](../../../../dag.html) at this $X$. That is an `/update Q2-L7` item; this run touched no other node's statement.\n\n## What changed\n\nThe polarity paragraph now reads **mixed — positive for the hypotheses, negative for the route**, and a second paragraph says how the conditional resolved and where. Clauses (i)–(v) and their labels are untouched, so the `## Decomposition` and the five children still quote the statement they were cut from.\n";</script>
