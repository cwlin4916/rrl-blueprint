t does not reach:** it says nothing about which stratum a Hecke word reaches or what the costalk there is; those are [Q2-e4-L3](../Q2-e4-L3/index.html) and [Q2-e4-L4](../Q2-e4-L4/index.html).\n- **2026-08-06 — where clause (2) comes from, and what is not yet in the closed world.** Chen–Yi (`chenyi_2025singularitiesorbitclosuresloop`, arXiv:2310.20006v4) state in Example 88, p. 51 — read on disk this run — that for $X = \\mathrm{SL}_{2n}/\\mathrm{Sp}_{2n}$, $\\mathrm{Spin}_{2n}/\\mathrm{Spin}_{2n-1}$ and $E_6/F_4$, \"both the evenness and connectedness assumptions are satisfied\", the connectedness assumption being that of their Theorem 87(ii), \"the $L^+G$-stabilizers on $LX$ are connected\". That is the statement of clause (2) for the $\\mathrm{SL}$ form of this family; it has **no entry in `blueprint/appendix.md`** — the appendix black-boxes only Prop. 17(i) and Thm. 18 of that paper — so it is not available to a prover, and clause (2) is asserted here as a claim to be established, not imported. Two things a write-up must supply beyond the source: the passage from $\\mathrm{SL}_{2n}/\\mathrm{Sp}_{2n}$ to $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, and the passage from connectedness of $K_\\lambda$ to connectedness of the finite-type quotient $G_\\lambda$.\n- **2026-08-06 — why it depends on [Q2-e4-L1](../Q2-e4-L1/index.html).** The stabilizer is taken at the orbit representative $x_\\lambda$, and the indexing of those representatives by $\\Lambda_S^+$ is what the sibling establishes; clause (4)'s $\\Lambda_X^+ = \\mathbb{Z}$ is that sibling's clause (1) at $n = 1$.\n";</script>
