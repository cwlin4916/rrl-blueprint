$X = \\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$. **What it does not reach:** it computes the costalk only for one-letter words, and only at the central strata and in the rank-one member; the strata $\\lambda$ with $a_1 > a_n$ at $n\\ge2$ are untouched, and so is everything about $K_0$, which is [Q2-e4-L5](../Q2-e4-L5/index.html).\n- **2026-08-06 — the boundary the node exists to record.** Clause (3) is the reason the node is not a list of confirmations. At $n = 1$ the variety is $\\mathrm{GL}_2/\\mathrm{SL}_2$ with $\\mathrm{GL}_2$ acting through $\\det$, so the stabilizer of every point is $L^+\\mathrm{SL}_2$ and the convolution map has the *whole* of $\\overline{\\mathrm{Gr}}_\\nu$ as its fibre over each point of the open stratum. Since $\\sigma(\\nu) = \\nu_1+\\nu_2$, an odd $\\lambda$ forces $\\nu_1 > \\nu_2$ and hence a positive-dimensional fibre — the smallest being $\\mathbb{P}^1$ — so hypothesis (b) of [Q2-L5](../../Q2-L5/index.html) cannot be met, while hypothesis (a) is met. That separates the two hypotheses of that node inside a single variety, which is what shows (b) load-bearing. Clause (4) then says the failure is a failure of the route: closure under retracts still puts $\\Delta_\\lambda$ in the Satake subcategory.\n- **2026-08-06 — why it depends on both siblings.** [Q2-e4-L3](../Q2-e4-L3/index.html) supplies the word — which $\\lambda$ admit one and what $\\nu$ to take — and its hypothesis (R) is what makes $\\lambda = \\sigma(\\nu)$ the right stratum to restrict to; [Q2-e4-L2](../Q2-e4-L2/index.html) supplies $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$, without which the conclusion of clause (iv) names no object.\n";</script>
