./../Q1/Q1-e5/index.html) records the same variety at question level, and this node is the Q2 computation on it.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: the five-step programme at $\\mathrm{Sp}_4\\backslash\\mathrm{GL}_4$, the first substantial symmetric test.\n- **2026-08-06 — statement revised** by `/update Q2-e4` ([u1](updates/u1.html)), on the user's instruction that each Q2 example be readable on its own and declare its polarity. The claim it instantiates is now quoted inside the statement instead of linked, and the statement opens on its polarity — **positive, conditional** — under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html). The mathematics is unchanged.\n- **2026-08-06 — decomposed into five sub-lemmas** by `/decompose Q2-e4`, the first expansion of an example node under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html): the five clauses (i)–(v) were five node-shaped computations inside one node, ordered rather than parallel, and each is now [Q2-e4-L1](Q2-e4-L1/index.html)–[Q2-e4-L5](Q2-e4-L5/index.html), every one of them role `example` and all five ordinary dependencies of this node. The statement is untouched; the new `## Decomposition` says how they reassemble. Two of the five come back negative — [Q2-e4-L3](Q2-e4-L3/index.html) finds $\\sigma(\\Lambda^+)\\subsetneq\\Lambda_X^+$ at $n = 2$, and [Q2-e4-L4](Q2-e4-L4/index.html) finds a $\\mathbb{P}^1$ fibre at the odd strata of the rank-one member — which is why the conditional in this node's polarity was worth writing as a conditional.\n- **2026-08-06 — statement revised again** by `/update Q2-e4` ([u2](updates/u2.html)), on the computations `/decompose Q2-e4` returned. The conditional polarity of [u1](updates/u1.html) resolved, and negatively at two places: clause (iii) fails at $\\lambda=(a,a)$ with $a$ odd ([Q2-e4-L3](Q2-e4-L3/index.html)), because reachability on the lattice does not give reachability on the dominant cone; and clause (iv) fails at every odd $\\lambda$ of the rank-one member ([Q2-e4-L4](Q2-e4-L4/index.html)), where the fibre is $\\mathbb{P}^1$. In both $\\Delta_\\lambda$ survives as a retract, so what is obstructed is the Bott–Samelson route and not the membership. A separate finding — that [Q1-L3-c1](../../Q1/Q1-L3/Q1-L3-c1/index.html)'s standing supposition is false at rank one — is recorded for `/update Q2-L7` and was not acted on here.\n- **2026-08-07 — the statement now says, explicitly, how the example stands to its parent** by `/update`. The relation was in the prose and said differently in each of the four examples, so no reader could line them up. Every Q2 example now carries the same block immediately after its polarity line, in four fixed slots: whether $X$ is in the standing class, whether it meets [Q2](../../../dag.html)'s conjecture's hypotheses, whether the membership the problem statement asks about holds, and what the case contributes to the main theorem — each linked to the [key-example register](../../../key_examples/index.html) entry that settles it in print. Its four slots: in the standing class, meets the conjecture's hypotheses, the membership holds as a retract — and it is the only one of the four that is a genuine non-degenerate instance, positive for the problem statement and negative for the conjecture's route. It is [K6](../../../key_examples/k6.html), `positive`.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
