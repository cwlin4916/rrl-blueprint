<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L4</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L4 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q2-L4 — Boundary dévissage along an infinite boundary\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html), [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html), [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html), [presentable categories](../../../appendix/conv-prl.html), [colimits of presentable categories](../../../appendix/bb-prl-colimits.html); no `depends-on`.\n- **notation:** $\\mathcal{L}:=\\varinjlim_m\\mathcal{C}_{Z_m}$ in $\\mathrm{Pr}^L$, structure functors $F_m$, inclusions $u_m\\colon\\mathcal{C}_{Z_m}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$; $a\\colon K\\times LX\\to LX$ the action; the $\\Delta_{\\mu,b}$ exist by **(H1)** of [Q1-L5](../../Q1/Q1-L5/index.html), standing in [Q2](../../../dag.html).\n\n## Lemma\n\nNotation as in [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) and [the Satake subcategories](../../../appendix/def-satake-subcategory.html), and $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ as in [Q2-L3](../Q2-L3/index.html): the objects supported on $\\partial\\overline{LX}_\\lambda = \\overline{LX}_\\lambda\\setminus LX_\\lambda$. Fix $\\lambda\\in\\Lambda_X^+$ and suppose the boundary is **exhausted**: there is an increasing chain of closed subsets\n\n$$\nZ_1\\subseteq Z_2\\subseteq\\cdots\\subseteq \\partial\\overline{LX}_\\lambda, \\qquad \\partial\\overline{LX}_\\lambda = \\bigcup_{m\\ge 1}Z_m,\n$$\n\neach $Z_m$ a finite union of orbit closures, such that $!$-extension along $Z_m\\hookrightarrow Z_{m+1}$ presents\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\ \\simeq\\ \\varinjlim_{m}\\ \\mathcal{C}_{Z_m}\n$$\n\nas a filtered colimit in $\\mathrm{Pr}^L$, where $\\mathcal{C}_{Z_m}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ is the subcategory supported on $Z_m$ — the closure presentation of [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) read on the boundary. Then hypothesis **(C)** of [Q2-L3](../Q2-L3/index.html) holds at $\\lambda$ as soon as it holds at each finite stage: if\n\n$$\n\\mathcal{C}_{Z_m} = \\left\\langle \\Delta_{\\mu,b}\\ \\middle|\\ LX_\\mu\\subseteq Z_m,\\ b\\in A_\\mu\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\qquad\\text{for every }m,\n$$\n\nthen $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} = \\left\\langle \\Delta_{\\mu,b}\\mid LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda,\\ b\\in A_\\mu\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$.\n\nThe content is that the union of the stages is *all* of the boundary category and not merely a subcategory of it: the compatible families over the stages that no single stage carries are exactly what a filtered-colimit presentation rules out, and what the statement asserts is that the presentation holds.\n\n## Proof\n\n**Step 1 — the ambient lies in $\\mathrm{Pr}^L_{\\mathrm{st}}$**\n\n<details><summary>the argument</summary>\n\n([presentable categories](../../../appendix/conv-prl.html)). It is $\\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)); $\\mathcal{D}_c(K\\backslash LX)$ is small — recorded in [context](../../../context.html) as the rationale of ratified reading 2 — and stable, coherence surviving shifts and cofibres; and ind-completion of a small stable category is presentable and stable. **GAP (closed world):** those two properties belong to [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), undeclared in this node's `objects:`.\n\n</details>\n\n**Step 2 — each $u_m$ is a morphism of $\\mathrm{Pr}^L$ between stable categories.**\n\n<details><summary>the argument</summary>\n\nThe finite-stage hypothesis exhibits $\\mathcal{C}_{Z_m}$ as a $\\langle-\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$, hence by [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) as a stable subcategory closed under *arbitrary* ambient colimits, so $u_m$ preserves small colimits; $\\mathcal{C}_{Z_m}$ is presentable because the hypothesis places $m\\mapsto\\mathcal{C}_{Z_m}$ in $\\mathrm{Pr}^L$; Step 1 makes the target stable.\n\n</details>\n\n**Step 3 — $\\mathcal{L}$ is stable.**\n\n<details><summary>the argument</summary>\n\nThis makes the combination [colimits of presentable categories](../../../appendix/bb-prl-colimits.html) prints apart and asks a citing node to declare. Each transition $\\mathcal{C}_{Z_m}\\subseteq\\mathcal{C}_{Z_{m+1}}$ is colimit-preserving between presentables, so has a right adjoint $R_m$ (adjoint functor theorem); by (2), $\\mathcal{L}$ is the $\\mathbb{N}^{\\mathrm{op}}$-limit of the $R_m$ formed in $\\widehat{\\mathrm{Cat}}_\\infty$; each $R_m$ preserves finite limits, hence is exact between the stable categories of Step 2; and (3) makes such a limit stable. Clause (3) is printed for **small** categories and holds verbatim one universe up, where its \"$\\mathrm{Cat}_\\infty$\" is the $\\widehat{\\mathrm{Cat}}_\\infty$ in which (2) forms $\\mathcal{L}$: one limit is formed, not two, and nothing transports back. Presentability is not asked to transfer — (2) produces $\\mathcal{L}$ in the original $\\mathrm{Pr}^L$.\n\n</details>\n\n**Step 4 — the comparison functor.**\n\n<details><summary>the argument</summary>\n\nThe transitions being the inclusions, $\\{u_m\\}$ is a cocone in $\\mathrm{Pr}^L$ by Step 2, so the universal property of $\\mathcal{L}$ gives an essentially unique\n\n$$\nV\\colon\\mathcal{L}\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\text{ in }\\ \\mathrm{Pr}^L,\\qquad V\\circ F_m\\simeq u_m .\n$$\n\n</details>\n\n**Step 5 — the reading of the hypothesis, declared before use.**\n\n<details><summary>the argument</summary>\n\nThat $!$-extension *presents* $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ as $\\mathcal{L}$ is read as: this $V$ is fully faithful with essential image $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$.\n\n</details>\n\n**Step 6 — $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ is a cocomplete stable subcategory of the ambient.**\n\n<details><summary>the argument</summary>\n\nA small diagram in it lifts along the fully faithful $V$ to $\\mathcal{L}$, whose colimit $V$ carries to a colimit in the ambient; and $V$, colimit-preserving between stable categories (Steps 1, 3), is exact, closing the image under fibres and desuspensions.\n\n</details>\n\n**Step 7 — each $Z_m$ is stable under the action: $a$ restricts to $K\\times Z_m\\to Z_m$.**\n\n<details><summary>the argument</summary>\n\nA stratum $LX_\\nu$ is $K$-stable as a subsheaf, being the fpqc-sheaf image of an orbit map (ratified reading, [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)), so $a$ carries $K\\times LX_\\nu$ into $LX_\\nu$, hence into $\\overline{LX}_\\nu$ along the open embedding $j_\\nu$ of that entry. The closed $a^{-1}(\\overline{LX}_\\nu)\\subseteq K\\times LX$ therefore contains $K\\times LX_\\nu$, and so contains its reduced closure, which is $K\\times\\overline{LX}_\\nu$: closure commutes with the flat base change $K\\times(-)$, and $K\\times\\overline{LX}_\\nu$ is reduced, $\\overline{LX}_\\nu$ being reduced ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)) and $K$ a group scheme over an algebraically closed field of characteristic $0$. A finite union of such closures is stable for the same reason.\n\n</details>\n\n**Step 8 — the base point of a listed stratum lies in a single stage.**\n\n<details><summary>the argument</summary>\n\nWrite\n\n$$\n\\mathcal{G}_\\partial:=\\left\\langle\\Delta_{\\mu,b}\\mid LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda,\\ b\\in A_\\mu\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\nA listed $\\mu$ has $LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda$, and $LX_\\mu$ is the orbit through a $k$-point $x$ (same ratified reading); as $\\partial\\overline{LX}_\\lambda=\\bigcup_m Z_m$, that one point lies in some $Z_m$.\n\n</details>\n\n**Step 9 — hence $LX_\\mu\\subseteq Z_m$ as subsheaves of $LX$.**\n\n<details><summary>the argument</summary>\n\nThe orbit map $\\mathrm{orb}_x=a\\circ(\\mathrm{id}_K\\times x)\\colon K\\to LX$ factors through $Z_m$ by Step 7, $x$ being a point of $Z_m$; and $LX_\\mu$ is the fpqc-sheaf image of $\\mathrm{orb}_x$, the smallest fpqc subsheaf of $LX$ it factors through, while $Z_m$ — a closed sub-ind-scheme — is one such. Disjointness of the strata is not needed: the exhaustion is used at the single point $x$.\n\n</details>\n\n**Step 10 — $\\mathcal{G}_\\partial\\subseteq\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$.**\n\n<details><summary>the argument</summary>\n\nBy Step 9 each listed $\\Delta_{\\mu,b}$ is listed for that $\\mathcal{C}_{Z_m}$, so lies in it, so lies in $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$ by Step 5; the latter is a cocomplete stable subcategory of the ambient (Step 6), so minimality in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) gives the inclusion.\n\n</details>\n\n**Step 11 — what clause (4)(2) produces is desuspension-closed.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\n\\mathcal{P}:=\\text{the smallest full }\\mathcal{Q}\\subseteq\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\text{ closed under extensions and small colimits with }\\Delta_{\\mu,b}[-n]\\in\\mathcal{Q}\\ (n\\ge0),\n$$\n\n$\\mu,b$ as listed for $\\mathcal{G}_\\partial$. Those $Y\\in\\mathcal{P}$ with $Y[-n]\\in\\mathcal{P}$ for all $n\\ge0$ form a full subcategory containing each $\\Delta_{\\mu,b}[-n]$ and, desuspension being an equivalence, closed under small colimits and extensions; minimality puts $\\mathcal{P}$ inside it.\n\n</details>\n\n**Step 12 — $\\mathcal{P}=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\mathcal{G}_\\partial$.**\n\n<details><summary>the argument</summary>\n\nClosed under small colimits, $\\mathcal{P}$ contains $0$ and every cofibre, and with Step 11 every fibre: a cocomplete stable subcategory containing each $\\Delta_{\\mu,b}$, so $\\mathcal{G}_\\partial\\subseteq\\mathcal{P}$. Conversely $\\mathcal{G}_\\partial$ contains each $\\Delta_{\\mu,b}[-n]$ and is closed under small colimits and under extensions, an extension of $A$ by $B$ being $\\mathrm{cofib}(A[-1]\\to B)$; so $\\mathcal{P}\\subseteq\\mathcal{G}_\\partial$.\n\n</details>\n\n**Step 13 — $\\mathcal{G}_\\partial$ is presentable.**\n\n<details><summary>the argument</summary>\n\nClause (4)(2) applies to the presentable stable ambient (Step 1) and to the small $\\{\\Delta_{\\mu,b}[-n]\\}$ — $\\Lambda_X^+$ a poset ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)), $A_\\mu$ a set ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)), $n\\in\\mathbb{N}$: so $\\mathcal{P}=\\mathcal{G}_\\partial$ is presentable.\n\n</details>\n\n**Step 14 — each stage lies in $\\mathcal{G}_\\partial$.**\n\n<details><summary>the argument</summary>\n\nAs $Z_m\\subseteq\\partial\\overline{LX}_\\lambda$, every generator listed for $\\mathcal{C}_{Z_m}$ is listed for $\\mathcal{G}_\\partial$, so the finite-stage hypothesis and minimality give $\\mathcal{C}_{Z_m}\\subseteq\\mathcal{G}_\\partial$.\n\n</details>\n\n**Step 15 — $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq\\mathcal{G}_\\partial$, and the Lemma.**\n\n<details><summary>the argument</summary>\n\nThe inclusion $\\iota\\colon\\mathcal{G}_\\partial\\to\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ is fully faithful, colimit-preserving — its colimits are the ambient's ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html)) — and has presentable source (Step 13), so for presentable $\\mathcal{A}$ post-composition\n\n$$\n\\iota_*\\colon\\operatorname{Map}_{\\mathrm{Pr}^L}(\\mathcal{A},\\mathcal{G}_\\partial)\\longrightarrow\\operatorname{Map}_{\\mathrm{Pr}^L}(\\mathcal{A},\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX))\n$$\n\nis the inclusion of the components landing in $\\mathcal{G}_\\partial$, naturally in $\\mathcal{A}$. So the universal property $\\operatorname{Map}_{\\mathrm{Pr}^L}(\\mathcal{L},-)\\simeq\\varprojlim_m\\operatorname{Map}_{\\mathrm{Pr}^L}(\\mathcal{C}_{Z_m},-)$ identifies $\\iota_*$ at $\\mathcal{L}$ with $\\varprojlim_m\\iota_*$ at the stages; a compatible family lifts along a limit of component-inclusions exactly when each term does, and each $u_m$ does by Step 14. So $V\\simeq\\iota W$ for some $W$ in $\\mathrm{Pr}^L$, and its essential image — $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$, by Step 5 — lies in $\\mathcal{G}_\\partial$; with Step 10, $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\mathcal{G}_\\partial$: hypothesis **(C)** at $\\lambda$. $\\square$\n\n</details>\n\n## Caveats\n\n**The reading in Step 5 is load-bearing.** Under a merely abstract equivalence Step 6 fails.\n\n**[sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) does no work here.** The presentation is a hypothesis, not derived, so that entry's hypotheses — placidity of $\\partial\\overline{LX}_\\lambda$, a dimension theory — are neither used nor checked.\n\n**A second closed-world flag.** The Lemma links [the Satake subcategories](../../../appendix/def-satake-subcategory.html), absent from this node's `objects:`; no step invokes it.\n";</script>
