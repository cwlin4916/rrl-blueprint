at a time never terminates. This node states the replacement: exhaust the boundary by finite stages and require the colimit to be the whole boundary category.\n- **2026-08-05 — what is and is not being claimed.** The colimit presentation is a *hypothesis* here, not a consequence of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html). The same difficulty appears one level up as (H2) of [Q1-L5](../../Q1/Q1-L5/index.html), carried there by [Q1-L5-L6](../../Q1/Q1-L5/Q1-L5-L6/index.html), and the tail mechanism recorded at [Q1-L5-e1](../../Q1/Q1-L5/Q1-L5-e1/index.html) is exactly the gap between the union of the steps and the compatible families over them. Stating it separately for the boundary is what lets a prover attack the $\\mathbb{A}^1$ instance ([Q2-e2](../Q2-e2/index.html)) without first settling the general case.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: boundary dévissage along an infinite boundary, a filtered-colimit statement untouched by this run.\n- **2026-08-05 — commentary moved here from the [Q2](../../../dag.html) framing** by `/update`, under [ADR 0044](../../../process/decisions/0044-a-question-states-a-problem-not-its-route.html). *Why the Q2 conjecture assumes $X$ symmetric, and what this node is for.* The symmetric hypothesis is what makes the closure order explicit and every lower interval finite ([Chen–Yi symmetric orbits](../../../appendix/bb-chenyi-symmetric-orbits.html), [Q1-L6-L1](../../Q1/Q1-L6/Q1-L6-L1/index.html)); outside it, closures contain infinitely many orbits — [Q1-L5-e4](../../Q1/Q1-L5/Q1-L5-e4/index.html), and already $\\mathbb{A}^1$ under $\\mathbb{G}_m$ — and the boundary dévissage must be exhaustive rather than finite, which is this node and its model [Q2-e2](../Q2-e2/index.html).\n- **2026-08-06 — failing** after two rounds by `/prove Q2-L4`, [r1](critiques/r1.html) `FAIL` and [r2](critiques/r2.html) `FAIL`, and the node ends the invocation **one clause from passing**. The run was commissioned because `/update` had written [colimits of presentable categories](../../../appendix/bb-prl-colimits.html) in answer to this node's earlier gap, and that part worked: the referee confirmed both of the entry's deliberate traps were disarmed in their own steps — the unprinted $\\mathrm{Pr}^L_{\\mathrm{st}}$ combination is declared as a combination, and the passage from Lurie's extensions-and-colimits subcategory to the cocomplete stable $\\langle-\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) is done rather than elided. The r1 `FAIL` was a single `MAJOR` at the geometric step, and r2 discharged it by a **better route than the referee demanded**: running the exhaustion at the orbit's base point instead of at the stratum removes the \"meets, therefore contained in\" step, so **disjointness of the strata is not needed at all**, and reducedness of $K$ in characteristic $0$ is at last consumed rather than merely invoked.\n- **2026-08-06 — what still stands, and it is small.** Smallness of $\\mathcal{D}_c(K\\backslash LX)$ is load-bearing at four steps and was cited to [context.md](../../../context.html) rather than to an appendix entry. The widening this invocation spent added [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), which the lead-researcher verified supplies **stability but not smallness** — the word \"small\" lives in [the standing notation](../../../appendix/subsec-notations.html), which this node does not declare. The referee then ruled on the two candidate repairs and the ruling is the useful part of the round. Reading smallness out of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)'s $\\mathrm{Ind}(\\mathcal{D}_c(\\mathcal{Y}))$ as a presupposition is **a reach**: $\\mathrm{Ind}$ has no declared domain in this closed world, $\\mathrm{Ind}_\\kappa$ exists for large accessible categories so the presupposition is not forced, and inferring a hypothesis from a definition's well-formedness proves only what its author believed. But the repair needs **no further widening at all**, because [the Satake subcategories](../../../appendix/def-satake-subcategory.html) — declared by this node in the same widening, for an unrelated bookkeeping reason — asserts the fact outright: *\"while $\\mathcal{D}_c$ itself is small and not cocomplete.\"* Rerouting one citation closes it. Two residual geometric gaps sit inside the $K$-stability step, both true and both one sentence: closure commuting with the flat base change $K\\times(-)$ is quoted without its hypotheses for a non-finite-type $K$, and Cartier's theorem is applied outside its locally-finite-type range.\n- **2026-08-06 — the page limit is now the node's real constraint.** The r2 write-up is **1237 words against the 900 cap, 337 over**, and that overflow was accepted rather than compressed away: compression is what produced the r1 `MAJOR` in the first place, and the page gate says a write-up that will not fit is a signal to split rather than a licence to compress ([ADR 0030](../../../process/decisions/0030-the-prove-budget-cap.html)). Three independent runs — the first prover, the second, and the referee — reached the same conclusion, and the prover named two cuts that bring it to roughly the budget. First, *a $K$-orbit stratum is contained in any $K$-stable reduced closed subset containing one of its points* — purely geometric, about 240 words, and **reusable by [Q2-L3](../Q2-L3/index.html), [Q2-L5](../Q2-L5/index.html) and Q2-L9 (since retired)**. Second, *for a small collection $S$ in a presentable stable $\\mathcal{C}$, $\\langle S\\rangle_{\\mathcal{C}}$ is presentable* — about 150 words, and exactly the work [colimits of presentable categories](../../../appendix/bb-prl-colimits.html) reserves to the citing node in its own fourth note. Cutting only the $\\mathrm{Pr}^L$ material, which the earlier run had proposed, leaves about 1020 and does not suffice.\n- **2026-08-06 — a false gloss removed from the statement** by `/update Q2-L4` on an external verdict the user supplied, recorded in [u1](updates/u1.html). The closing paragraph of the `## Statement` said that \"the union of the stages is *all* of the boundary category\" and that a filtered-colimit presentation \"rules out\" the compatible families no single stage carries. Both halves are false, and in the same way: a colimit in $\\mathrm{Pr}^L$ is computed as the **limit** of the right-adjoint diagram ([colimits of presentable categories](../../../appendix/bb-prl-colimits.html)), so its objects *are* compatible families, and what the stage images do is **generate under arbitrary colimits** rather than exhaust the category objectwise.\n- **2026-08-06 — the witness, verified this run.** Take $\\mathcal{C}_m = \\mathrm{Sp}^{\\times m}$ with $(X_1,\\dots,X_m)\\mapsto(X_1,\\dots,X_m,0)$. Each transition is a left adjoint whose right adjoint is truncation, so the colimit in $\\mathrm{Pr}^L$ is $\\prod_{n\\ge1}\\mathrm{Sp}$, the limit of the truncation tower. The image of the $m$-th stage is the sequences vanishing after position $m$, so $(\\mathbb{S},\\mathbb{S},\\mathbb{S},\\dots)$ lies in no finite stage — while being, necessarily, a colimit of objects that do.\n- **2026-08-06 — what the correction does not touch.** The conclusion is a generation statement and the bracket of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) is the smallest **cocomplete** stable subcategory containing the generators, which is exactly what \"the stage images generate under arbitrary colimits\" delivers. So the formal claim was right while the sentence explaining it was wrong — the more dangerous of the two, because nothing gates a sentence that asserts nothing. The paragraph was removed rather than corrected in place: it is commentary, and commentary belongs in a history entry ([ADR 0044](../../../process/decisions/0044-a-question-states-a-problem-not-its-route.html)).\n- **2026-08-06 — the whole remaining content is now the colimit hypothesis.** [Chen–Yi](../../../appendix/bb-chenyi-symmetric-orbits.html) present the *whole loop space* by orbit-closure stages and do not supply the boundary presentation $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\simeq\\varinjlim_m\\mathcal{C}_{Z_m}$ this node assumes. The node already recorded that as a hypothesis rather than a consequence, so nothing was wrong; what is worth saying plainly is that it is unverified for every $X$ in the class, and that the first place to settle it is the infinite-boundary test case [Q2-e2](../Q2-e2/index.html), $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$.\n- **2026-08-06 — decomposed into two children**, by `/decompose Q2-L4` on the page finding above and on the closing section of [r2](critiques/r2.html), which names the same two cuts in the same order. [Q2-L4-L1](Q2-L4-L1/index.html) takes the geometry — $K$-stability of a finite union of orbit closures, and the point-level absorption of a stratum by a stage — which is the only part of this node that leaves the world of presentable categories and the part both rounds found flaws in: [r2](critiques/r2.html)'s Flaws 2, 3 and 5 all sit inside the step it carries away, and all three are repairable inside its own declared closed world. [Q2-L4-L2](Q2-L4-L2/index.html) takes the categorical argument, stated with no $LX$ in it: a filtered diagram of subcategories $\\langle S_i\\rangle_{\\mathcal{C}}$ of a presentable stable $\\mathcal{C}$ whose colimit is realized as a cocomplete stable $\\mathcal{B}\\subseteq\\mathcal{C}$ has $\\mathcal{B} = \\left\\langle\\bigcup_i S_i\\right\\rangle_{\\mathcal{C}}$. The `## Statement` is untouched and the stored status is unchanged; what changes is only how the lemma will be proved.\n- **2026-08-06 — where the false gloss went, now that there is a node for it.** Clause (4) of [Q2-L4-L2](Q2-L4-L2/index.html) carries, as an assertion with the witness of [u1](updates/u1.html) attached, exactly the reading that was struck from this statement: the stages generate under colimits and do not exhaust objectwise. It is stated one level down and in the abstract because that is where it is checkable — the witness is a diagram of subcategories of $\\prod_{n\\ge1}\\mathrm{Sp}$ and has nothing to do with $LX$ — and because a disclaimer here would have repeated the failure it answers.\n- **2026-08-06 — [proof.md](proof.html) and [r2](critiques/r2.html) are the record of the un-split node.** They stay on disk: the write-up proves the statement as it stands, over budget and with the two children's content inlined, and the referee's ruling on smallness (that [the Satake subcategories](../../../appendix/def-satake-subcategory.html) asserts it outright, so no widening is needed) survives the split unchanged and applies to whatever is written next. The next `/prove` continues at `r3`.\n- **2026-08-06 — examined, unchanged, and flagged amber against a revised neighbour.** [Q2-L3](../Q2-L3/index.html) was revised this run ([u2](../Q2-L3/updates/u2.html)) and its four hypothesis labels **(A)**–**(D)** are unchanged, so every reference by letter still resolves. What moved is inside them: $\\operatorname{supp}$ and \"the objects supported on $\\partial\\overline{LX}_\\lambda$\" are replaced by $\\mathcal{D}^{\\mathrm{ren}}_T$, defined as the objects killed by $i_\\mu^!$ for every $\\mu\\notin T$, with $\\partial\\lambda$ and $\\overline{\\lambda}$ the index sets below and up to $\\lambda$. Hypothesis **(C)**, which this node is charged with, also weakened from an equality of subcategories to the inclusion $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\subseteq\\langle\\Delta_{\\mu,b}\\mid\\mu\\in\\partial\\lambda\\rangle$ — the only direction the induction consumes. This node concludes the *equality* and therefore supplies the new (C) a fortiori, so nothing here breaks; what is now loose is the wording \"hypothesis **(C)** of Q2-L3 holds at $\\lambda$\", which names something strictly weaker than what the displayed conclusion delivers. Left standing rather than revised: this node has its own standing `MAJOR` flaw at [r2](critiques/r2.html), and re-wording a statement that is about to be re-proved would put two changes in one round.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n- **2026-08-08 — `needs:` set, statement unchanged** by `/update Q2`, recorded in [u3](../Q2-L1/updates/u3.html). Examined and found sound as a statement; what it is waiting on is a fact and not an argument, so the node now says so. The run's verification of the user's input passage landed on exactly this node's subject: that passage closes its orbit-by-orbit induction with *continuing this inductive argument, we are done*, which gives vanishing at each finite stage and no more — the passage to the limit is the whole difficulty, and it is what this node exists to supply.\n";</script>
