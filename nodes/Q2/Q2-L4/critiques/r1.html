<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L4</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q2-L4, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L4/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n## What I tried to break, and could not\n\n**The Lemma is the Statement.** I diffed `## Lemma` (proof.md:10–30) against `## Statement`\n(Q2-L4_node.md:18–38), including all four display blocks, every link target and the closing\nparagraph. Character-identical. No hypothesis strengthened in the restatement, no conclusion\nweakened, no renotation. No `GAP:` marker anywhere in the draft.\n\n**Anchors and keys.** Every anchor the draft links resolves in\n[appendix](../../../../appendix/index.html): `#def-generation` (253), `#def-renormalized` (692),\n`#not-standard-objects` (631), `#def-orbits-iwahori-spherical` (589), `#def-orbit-closure`\n(610), `#ex-sheaf-placid-ind` (501), `#conv-prl` (185), `#bb-prl-colimits` (198),\n`#def-satake-subcategory` (817). `#q2` resolves in [main_dag](../../../../dag.html); the node\nlinks `../Q1-L5/Q1-L5_node.md` and `../Q2-L3/Q2-L3_node.md` both exist. No bib key is cited\ndirectly and no `\\label` is claimed, so there is nothing to hallucinate. The Q1-L5 **(H1)**\nappeal in the `notation:` line is licensed twice over — by the first note on\n[$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) and by\nthe Q2 framing paragraph (main_dag.md:272), which puts (H1)–(H3) in force throughout Q2.\n\n**The entry's provenance is itself correct, checked on the page.** `papers/HA.pdf` printed\np. 35 carries Thm. 1.1.4.4 (\"$\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty$ admits small limits, and the\ninclusion $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty\\subseteq\\mathrm{Cat}_\\infty$ preserves small\nlimits\") and Prop. 1.1.4.6 (small filtered colimits), verbatim as the entry's clause (3),\nand the ambient there is indeed $\\mathrm{Cat}_\\infty$, i.e. **small** categories — the entry's\n`hypotheses:` warning is accurate. Printed p. 160 carries Prop. 1.4.4.11 with parts (1) and\n(2) exactly as clause (4), the proof of (2) deferred to p. 161, so the entry is right about\nthat too. In `papers/HTT.pdf` (PDF page = printed page $+18$), printed p. 470 carries\nProp. 5.5.3.13 *and* the paragraph of purpose the entry quotes (\"will show that\n$\\mathrm{Pr}^L$ is equipped with all small *colimits* as well as all small limits\"), and\nprinted p. 472 carries Thm. 5.5.3.18. Nothing in the entry misreports its sources.\n\n*One stale record, not a flaw in this draft.* `papers/guideline.md:417` lists `HTT` among the\nkeys \"cited in the sources but have no entry in `refs.bib`\". It does have one —\n`refs.bib:524`, `@book {HTT, ...}`. The appendix entry's provenance note is right and the\nguideline is out of date.\n\n**Steps 7–9 are correct, and I checked each move.** $\\mathcal{Q}_0=\\{Y\\in\\mathcal{P}: Y[-n]\n\\in\\mathcal{P}\\ \\forall n\\ge 0\\}$ really is closed under small colimits (desuspension is an\nequivalence, so it commutes with colimits) and under extensions (desuspending a fibre sequence\ngives a fibre sequence), and really does contain every $\\Delta_{\\mu,b}[-n]$, so the minimality\ntrap closes. In Step 8, \"$\\mathcal{P}$ contains $0$\" is the empty colimit; the cofibre is a\npushout against it; the fibre is $\\mathrm{cofib}[-1]$ by Step 7; and conversely an extension\nof $A$ by $B$ is $\\mathrm{cofib}(A[-1]\\to B)$ with $A[-1]\\in\\mathcal{G}_\\partial$ because\n$\\langle-\\rangle_{\\mathcal{C}}$ is stable — both minimality appeals are legitimate and the\ndirections are not confused. The shift convention checks out against\n[cohomological degrees](../../../../appendix/conv-cohomological-degrees.html): $[-n]$, $n\\ge0$, are\nthe desuspensions, which is also the direction in which\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) states its detection criterion. In\nStep 9 the collection is genuinely small: the index is a subset of\n$\\{(\\mu,b)\\}\\times\\mathbb{N}$ with $\\Lambda_X^+$ a set (it indexes the poset of orbits named in\n[Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)) and each\n$A_\\mu$ a set. This is exactly the passage the entry's fourth note reserves to the citing node,\nand the draft does it in its own steps rather than in a clause.\n\n**Step 11 is correct.** $\\mathcal{G}_\\partial$ is in $\\mathrm{Pr}^L$ (presentable by Step 9,\nand its colimits are the ambient's), $u'_m$ is colimit-preserving, $\\iota$ is colimit-preserving\nbetween presentables, and the extension of a fixed cocone out of a $\\mathrm{Pr}^L$-colimit is\nessentially unique — so $\\iota W\\simeq V$ and the essential image of $V$ lands in\n$\\mathcal{G}_\\partial$. This is where the non-formal work sits: without Step 9 there is no\ntarget in $\\mathrm{Pr}^L$ to map into, and the universal property is unusable. The draft does\nnot, as I suspected it might, assume the presentation and then read the conclusion off as a\nformality.\n\n## Flaws\n\n**Flaw 1** [MAJOR] — The conclusion does not follow from the three ingredients stated.\n\n<details><summary>(Step 5, \"So the exhaustion puts each listed $LX_\\mu$ in some $Z_m$\") · the finding</summary>\n\nTwo moves are missing, and\nthe step is the sole route to $\\mathcal{G}_\\partial\\subseteq\\mathcal{D}^{\\mathrm{ren}}\n_{\\partial\\lambda}$ (Step 6), so nothing downstream repairs it.\n\n*(a) The exhaustion is only pointwise.* From $\\partial\\overline{LX}_\\lambda=\\bigcup_m Z_m$ one\ngets, for each point of $LX_\\mu$, *some* $m$ carrying it — and the $m$ may depend on the point.\nWhat upgrades this to a single $m$ is that the $Z_m$ are unions of **pairwise disjoint** strata,\nso a stratum that *meets* $Z_m$ is *contained* in it. Disjointness of the strata is never\nasserted in the draft, and it is precisely the hypothesis that makes the sentence's \"So\" a\ndeduction rather than a hope. (That the strata also *cover* $\\partial\\overline{LX}_\\lambda$ is a\nsecond unstated premise of the same sentence.)\n\n*(b) $k$-points do not test containment here.* The three named ingredients — stratum $=$ fpqc\nimage of an orbit map, $K$ reduced in characteristic $0$, $K(k)$ preserving $LX_\\nu$ and hence\n$\\overline{LX}_\\nu$ — deliver $K(k)$-stability of $Z_m$ and therefore $K(k)\\cdot x\\subseteq Z_m$\nfor a $k$-point $x\\in LX_\\mu$. The step needs $LX_\\mu\\subseteq Z_m$ as sub-ind-schemes, and\n$LX_\\mu$ is an fpqc-sheaf image inside an infinite-dimensional ind-scheme, where \"reduced, and\nagrees on $k$-points\" is not a containment criterion. The move that does work is the one the\ndraft omits: $K$-stability of the closed $Z_m$ makes the orbit map $K\\to LX$, $h\\mapsto hx$,\nfactor through $Z_m$, and $Z_m$ being an fpqc sheaf the image sheaf $LX_\\mu$ factors with it.\nThat is one sentence, but it is the load-bearing sentence, and it needs the action of the\n*group scheme* $K$ on $Z_m$, not merely of $K(k)$ — which is where reducedness of $K$ is\nactually consumed. As written, reducedness is invoked and then never used for anything.\n\nI do not doubt the conclusion; I doubt that this argument reaches it. Fillable, but not by a\nreader.\n\n</details>\n\n**Flaw 2** [MINOR] — This is a claim about the definition of $\\mathcal{D}_c$, which is\n[coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) — an entry that exists but is\n**not** in this node's `objects:`.\n\n<details><summary>(Step 1, \"stable since coherence survives shifts and cofibres\") · the finding</summary>\n\nThe claim is true (each $f^!$ is exact, and finite complexes\nwith coherent cohomology are closed under shift and cofibre), so this is a closed-world reach\nand not an error: the fix is to declare the entry, not to rewrite the step. I note it because\nthe step also silently uses the entry's ratified finite-type reading of the test schemes when\nit calls the resulting category small.\n\n</details>\n\n**Flaw 3** [MINOR] — I pressed hardest here, as instructed, and the conclusion survives — but the bookkeeping the\nentry's `hypotheses:` line demands (\"supplies the size bookkeeping itself\") is asserted rather\nthan supplied, and it is mis-described.\n\n<details><summary>(Step 2, \"read it in a universe enlargement … the $\\mathbb{N}^{\\mathrm{op}}$-limit is unchanged\") · the finding</summary>\n\n*What is asserted with no reason.* \"The $\\mathbb{N}^{\\mathrm{op}}$-limit is unchanged\" names no\ntwo ambients between which it is unchanged. *What is actually needed*, and what closes the\nstep, is the observation that HA Thm. 1.1.4.4 and Prop. 1.1.4.6 hold verbatim one universe up,\nwhere the source's \"$\\mathrm{Cat}_\\infty$\" becomes exactly the $\\widehat{\\mathrm{Cat}}_\\infty$\nin which clause (2) computes $\\mathcal{L}$ — so there is no comparison of two limits to make and\nnothing has to \"transfer back\" at all. The draft's phrasing suggests a limit computed somewhere\nelse and then imported, which is a strictly harder claim than the one that is true.\n\n*What does not need transferring, and correctly is not asked to.* Presentability is not a\nfinite-diagram condition and would not survive this move; the draft never asks it to —\n$\\mathcal{L}$ is presentable because clause (2) produces it as a colimit in the *original*\n$\\mathrm{Pr}^L$. I checked for the trap and it is not sprung. Likewise stability genuinely is\nuniverse-invariant (zero object, finite limits and colimits, pushouts $=$ pullbacks), so the\none thing the draft does claim transfers, does.\n\n*One ingredient of the declared combination is unverified.* The draft writes \"the transitions'\nright adjoints $R_m$\" without noting that they exist (adjoint functor theorem for\ncolimit-preserving functors between presentables). Clause (2) of the entry folds this in, so it\nis not a reach — but the step announces that it is assembling the unprinted combination link by\nlink, and this is a link it does not name.\n\nThe declaration itself is properly made: \"This step makes the combination … prints apart and\nasks to be declared\" is what the entry's third note requires, and the other three links\n(colimit in $\\mathrm{Pr}^L$ = limit of right adjoints; right adjoints preserve finite limits\nhence are exact between stable categories; a limit of stable categories along exact functors is\nstable) are each stated and each correct.\n\n</details>\n\n**Flaw 4** [MINOR] — The parenthetical cannot support what it is placed next to, on two counts, and its hypotheses\nare nowhere checked.\n\n<details><summary>(Step 3, \"([`ex:sheaf_placid_ind`] on the boundary)\") · the finding</summary>\n\n[sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) is about\n$\\mathcal{D}^!$ and $\\mathcal{D}^*$ of a placid ind-scheme presented by its own defining\ndiagram; the display it is attached to is about\n$\\mathcal{D}^{\\mathrm{ren}}=\\mathrm{Ind}\\,\\mathcal{D}_c$\n([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) of a quotient stack, filtered by\n*supports* rather than by a presentation. That is a different sheaf theory on a different\nobject. Its stated hypotheses — $\\partial\\overline{LX}_\\lambda$ a placid ind-scheme, and a\ndimension theory for the $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ identification — are asserted\nnowhere in the draft, and placidity of a closure is exactly what\n[$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html)\nwarns is *not* part of taking a closure. Nothing breaks, because the presentation is a\nhypothesis of the Lemma and not something the draft derives; but a citation that does no work\nreads exactly like one that does, and a referee should not have to determine which it is.\n\n</details>\n\n**Flaw 5** [MINOR] — \"That $!$-extension *presents* … is the assertion that $V$ is fully faithful with essential\nimage $\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}$\" is a reading of the Lemma's hypothesis,\nand the draft knows it is: the Caveats section says so, and says correctly that Step 4 fails\nunder a merely abstract equivalence.\n\n<details><summary>(Step 3 vs. \"## Caveats\") · the finding</summary>\n\nI accept the reading — \"presents $A$ as $\\varinjlim B_m$\"\ndoes mean the canonical cocone is a colimit cocone, and the cocone here can only be the family\nof inclusions $u_m$. But a reading on which the whole proof turns belongs in the proof, before\nit is used, not in a section after $\\square$. As it stands a reader who stops at the box has not\nbeen told what was assumed.\n\n</details>\n\n**Flaw 6** [MINOR] — Smallness of $\\mathcal{D}_c(K\\backslash LX)$ is not one of the three numbered ratified readings\nof `blueprint/context.md`; it appears only inside the rationale of reading 2 (\"$\\mathcal{D}_c$\nitself is small and not cocomplete\").\n\n<details><summary>(Step 1, \"small ([context](../../../../context.html))\") · the finding</summary>\n\nIt is load-bearing twice over here — for presentability\nof $\\mathrm{Ind}\\,\\mathcal{D}_c$, and for clause (4) of the black box being applicable to the\nambient at all. Cite it as what it is, or argue it.\n\n</details>\n\n**Flaw 7** [MINOR] — Step 1 concludes seven separate facts — $\\mathcal{C}_{Z_m}$ stable; closed under ambient\ncolimits; $u_m$ colimit-preserving; $\\mathcal{C}_{Z_m}$ presentable; the ambient presentable;\nthe ambient stable; $\\mathcal{D}_c$ small — with the reasons interleaved by semicolons.\n\n<details><summary>([ADR 0043](../../../../process/decisions/0043-a-proof-step-is-one-claim.html), Steps 1 and 5) · the finding</summary>\n\nStep 5\nconcludes four. The house rule is one claim and its reason per step; Flaws 1 and 2 are both\nthings that a split would have exposed rather than buried.\n\n</details>\n\n**Flaw 8** [MINOR] — The `## Statement` links [the Satake subcategories](../../../../appendix/def-satake-subcategory.html)\nbut the node's `objects:` line omits it.\n\n<details><summary>(Q2-L4_node.md:14 and 18 — inherited, not the prover's doing) · the finding</summary>\n\nThe draft reproduces the statement faithfully, as it\nmust, and never uses the entry, so no proof step reaches outside the closed world on this\naccount — but the node file declares a closed world that does not contain an entry its own\nstatement invokes. That is for the lead-researcher, not for round 2.\n\n</details>\n\n**Flaw 9** [MINOR] — Two functors out of a $\\mathrm{Pr}^L$-colimit that restrict to *the same cocone* are equivalent;\nthe draft compares $\\iota W$ and $V$ against $\\{u_m\\}$ objectwise, and the identification of the\ntwo cocone structures (the corestricted cocone re-included along the fully faithful $\\iota$ is\ncanonically the original) is left implicit.\n\n<details><summary>(Step 11, \"uniqueness (Step 3) identifies them\") · the finding</summary>\n\nIt is true and standard — one may equally say that\n$\\mathrm{Fun}^L(\\mathcal{L},\\mathcal{G}_\\partial)\\to\\mathrm{Fun}^L(\\mathcal{L},\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX))$ is fully faithful because $\\iota$ is — but the\nsentence as written asserts a coherence it does not name.\n\n</details>\n\n## Assessment\n\nNine flaws, one of them MAJOR. The categorical spine of the argument — Steps 2, 3, 4, 7, 8, 9,\n10, 11 — is sound, the two booby-traps in\n[colimits of presentable categories](../../../../appendix/bb-prl-colimits.html) were both genuinely\ndisarmed rather than stepped over, and the draft correctly identifies presentability of\n$\\mathcal{G}_\\partial$ as the thing that has to be earned. The failure is on the geometric side,\nin the one step that leaves the world of presentable categories: Step 5 states three true\ningredients and then asserts a conclusion they do not entail, omitting both the disjointness\nthat turns \"meets\" into \"is contained in\" and the factorization of the orbit map that turns\n$k$-point stability into a containment of sheaves. That is a one-paragraph repair, not a\nrefutation.\n\nVERDICT: FAIL\n";</script>
