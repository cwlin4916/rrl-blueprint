<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L4</a><i>›</i><span>r2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q2-L4, round 2</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L4/critiques/r2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n## The ruling I was asked for: smallness is in the closed world, and no widening is needed\n\nThe lead-researcher's finding is confirmed on the page. [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)\nsupplies **stability** — its defining condition is imposed under $f^!$, which is exact, and \"finite\ncomplex with coherent cohomology\" is closed under shift and cofibre — and supplies **no smallness**:\nthe entry and both its notes say nothing about the size of $\\mathcal{D}_c(\\mathcal{Y})$, and the\nfinite-type ratified reading of the test schemes does not deliver it either.\n\n**The `def:renormalized` presupposition route is a reach, and should not be used.** Three reasons.\n(i) $\\mathrm{Ind}$ is not itself an entry of this appendix with a declared domain, so \"$\\mathrm{Ind}$\nis defined for small categories\" is a fact about a convention the closed world nowhere fixes — and\nin the literature $\\mathrm{Ind}_\\kappa$ is written for large accessible categories too, so the\npresupposition is not even forced. (ii) Reading a hypothesis out of the well-formedness of a\ndefinition establishes at most that whoever wrote it believed the hypothesis; that is not a proof,\nand a referee cannot check it. (iii) It is circular in shape: the property wanted (presentability of\n$\\mathrm{Ind}\\,\\mathcal{D}_c$) would be inferred from the assumption that the definition producing\n$\\mathrm{Ind}\\,\\mathcal{D}_c$ is well posed.\n\n**But the route is unnecessary, because a declared entry asserts smallness outright.**\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html) — declared by this node — carries\nin its ratified-reading note (appendix.md:897) the sentence \"*while $\\mathcal{D}_c$ itself is small\nand not cocomplete*\", and in its body (appendix.md:887) \"$\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$\nis the *small* one\". The first is exactly the claim Step 1 needs, stated inside the declared closed\nworld, about $\\mathcal{D}_c(K\\backslash LX)$. So this is **not** a stop for the user: the residual\ndefect is that the draft cites the wrong venue for a fact it is entitled to, and the repair is one\nclause. `subsec:notations` is not needed.\n\n## What I tried to break, and could not\n\n**The Lemma is the Statement.** Diffed proof.md:10–30 against Q2-L4_node.md:18–38, all four displays,\nevery link target and the closing paragraph: character-identical, including the relative link paths,\nwhich resolve identically from both files. No hypothesis strengthened, no conclusion weakened.\n\n**The point-based route genuinely avoids disjointness.** Steps 8–9 place the *base $k$-point* $x$ of\n$LX_\\mu$ in a stage and then push the whole orbit in by functoriality: $\\mathrm{orb}_x =\na\\circ(\\mathrm{id}_K\\times x)$ factors through the $K$-stable $Z_m$, and $LX_\\mu$, being the smallest\nfpqc subsheaf of $LX$ through which $\\mathrm{orb}_x$ factors, is contained in the fpqc sheaf $Z_m$.\nNo \"meets $\\Rightarrow$ contained in\" step survives anywhere, and I could not find disjointness\nsmuggled in elsewhere: nothing in Steps 7–15 uses that distinct strata are disjoint, or that the\nstrata cover. r1's Flaw 1(a) is answered, not relabelled. Flaw 1(b) likewise: the containment is now\nderived as subsheaves through a factorization, and reducedness of $K$ is finally *consumed* (Step 7\nneeds $K\\times\\overline{LX}_\\nu$ reduced to identify the reduced closure), which is precisely what r1\nobserved it was not.\n\n**Step 15's naturality argument is correct, and it is new mathematics rather than a rewording.** I\nchecked it in full. $\\iota$ fully faithful gives $\\mathrm{Fun}(\\mathcal{A},\\mathcal{G}_\\partial)\n\\hookrightarrow\\mathrm{Fun}(\\mathcal{A},\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX))$ fully faithful;\nbecause $\\mathcal{G}_\\partial$ is closed under ambient colimits, $\\iota$ both preserves and *reflects*\ncolimits, so the fully faithful inclusion restricts to $\\mathrm{Fun}^L$; passing to maximal\nsubgroupoids, and using that $\\mathcal{G}_\\partial$ is replete, $\\iota_*$ is the inclusion of the\ncomponents whose essential image lands in $\\mathcal{G}_\\partial$. The lifting criterion then holds\nbecause the fibre of $\\varprojlim_m\\iota_*$ over a compatible family $(t_m)$ is\n$\\varprojlim_m\\mathrm{fib}_{t_m}(\\iota_*)$, a tower of terms each contractible (when $t_m$ lies in the\nsubspace) or empty (when it does not); a tower of contractible spaces has contractible limit. So the\nfamily lifts iff every term does, and each $u_m$ does by Step 14. Correct, and it disposes of r1's\nFlaw 9 — the coherence that was previously \"asserted and not named\" is now the naturality of\n$\\iota_*$ in $\\mathcal{A}$, which is exactly the missing ingredient.\n\n**Flaw 3's replacement is genuinely weaker and genuinely correct.** r1's version compared a limit\nformed in one ambient with a limit formed in another (\"the $\\mathbb{N}^{\\mathrm{op}}$-limit is\nunchanged\"); the new version forms **one** limit and reads clause (3) of\n[colimits of presentable categories](../../../../appendix/bb-prl-colimits.html) one universe up, where its\n\"$\\mathrm{Cat}_\\infty$\" *is* the $\\widehat{\\mathrm{Cat}}_\\infty$ in which clause (2) computes\n$\\mathcal{L}$. That is strictly the weaker claim, it is the right one, and the two ambients are\ncorrectly identified. The adjoint functor theorem is now named where r1 said it was silently used,\nand presentability is still not asked to transfer (clause (2) produces $\\mathcal{L}$ in the original\n$\\mathrm{Pr}^L$). The trap in the entry's `hypotheses:` line is disarmed rather than stepped over.\n\n**r1 Flaw 7 (ADR 0043) is substantively addressed, not renumbered.** Old Step 1 concluded seven facts\nand old Step 5 four; the geometric content that was one sentence of old Step 5 is now three steps\n(7, 8, 9) each with its own conclusion, and old Steps 7–9, 11 survive as new 11–13, 15. Fifteen steps\ncarrying twelve genuinely distinct conclusions is a real restructure.\n\n**r1 Flaw 5 is fixed** — the load-bearing reading is now Step 5, stated before it is used, with the\nCaveat retained as a warning rather than as the place of first statement. **r1 Flaw 4 is fixed** as\nfar as the prover can fix it: the [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html)\ngloss is in the Statement and so not the prover's to remove, and the Caveats now say in terms that it\ndoes no work and that its placidity and dimension-theory hypotheses are neither used nor checked.\n\n**The `papers/guideline.md` correction is right.** `refs.bib:524` is `@book {HTT,` (and `HA` is at\n548), so the \"Known gaps in `refs.bib`\" line at guideline.md:417–419 was indeed stale for `HTT`. The\nprover appended the correction at guideline.md:690–695 rather than rewriting the entry, which is the\ncorrect discipline, and left the other three keys alone.\n\n**Anchors and links.** All ten declared anchors resolve in\n[appendix](../../../../appendix/index.html): `#conv-prl` (185), `#bb-prl-colimits` (198), `#def-generation` (253),\n`#ex-sheaf-placid-ind` (501), `#def-orbits-iwahori-spherical` (647), `#def-orbit-closure` (668),\n`#not-standard-objects` (689), `#defn-coherent-d-mod` (742), `#def-renormalized` (750),\n`#def-satake-subcategory` (875). `../Q1-L5/Q1-L5_node.md`, `../Q2-L3/Q2-L3_node.md` and\n`../../main_dag.md#q2` all exist; (H1)–(H3) are in force throughout Q2 by main_dag.md:284, so the\n`notation:` line's appeal to (H1) for the existence of the $\\Delta_{\\lambda,a}$ is licensed. No bib\nkey is cited directly and no `\\label` is claimed. Nothing to hallucinate, and nothing hallucinated.\n\n## Flaws\n\n**Flaw 1** [MAJOR] — The draft ships a live gap marker, and the marker is now false in one half and misdirected in the\nother.\n\n<details><summary>(Step 1, \"`**GAP (closed world):**` those two properties belong to\n`defn:coherent_D_mod`, undeclared in this node's `objects:`\" and \"small — recorded in context as the\nrationale of ratified reading 2\") · the finding</summary>\n\n*The stability half is void.* [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) **is**\ndeclared (Q2-L4_node.md:14), so the sentence asserts something untrue about the node's own closed\nworld, and stability is available in-world with no gap at all.\n\n*The smallness half survives, and is cited outside the closed world.* Smallness of\n$\\mathcal{D}_c(K\\backslash LX)$ is not in `defn:coherent_D_mod`, and the draft's actual authority for\nit is `blueprint/context.md`. That is not one of the three invocable things: entries of the appendix,\nthe node's `depends-on` (empty here), and standard mathematics. It is load-bearing twice over —\npresentability of the ambient at Step 1, which clause (4)(2) of\n[colimits of presentable categories](../../../../appendix/bb-prl-colimits.html) needs at Step 13, and\n$\\mathrm{Pr}^L$-membership of the ambient at Steps 2 and 4 — so this is not decoration. r1 raised it\nas Flaw 6 and asked for it to be cited as what it is or argued; the draft does now describe it\nhonestly as \"the rationale of ratified reading 2\", which is the letter of the request, but the venue\nis still `context.md` and the fact is still not taken from an entry.\n\n*The repair, and it is one clause.* [the Satake subcategories](../../../../appendix/def-satake-subcategory.html)\nis declared and states the fact: \"while $\\mathcal{D}_c$ itself is small and not cocomplete\"\n(appendix.md:897). Cite that, delete the GAP marker, and Step 1 is closed. **No further widening is\nrequired, and `subsec:notations` is not needed.** I flag this MAJOR rather than MINOR because a\nwrite-up that goes to the record carrying a `GAP` marker asserting a false thing about its own\n`objects:` list should not pass, not because the mathematics is in doubt.\n\n</details>\n\n**Flaw 2** [MINOR] — This is where the geometry actually sits, and the justification is a slogan whose hypotheses are not\nchecked.\n\n<details><summary>(Step 7, \"closure commutes with the flat base change $K\\times(-)$\") · the finding</summary>\n\nThe direction the step needs is the hard one — $\\mathrm{pr}^{-1}(\\overline{LX_\\nu})\\subseteq\n\\overline{\\mathrm{pr}^{-1}(LX_\\nu)}$, i.e. that the closure does not shrink under $K\\times(-)$ — and\nthe standard forms of \"closure commutes with flat base change\" carry hypotheses the draft does not\nname (quasi-compact quasi-separated source for the scheme-theoretic image; or flat *and locally of\nfinite presentation*, which is what makes the projection open). $K = L^+G$ is **not** of finite type\nand $LX$ is an ind-scheme, so the finite-type form does not apply as quoted.\n\nThe conclusion is true and the route is the right one; what is missing is one sentence, and I say\nwhat it is so that the repair is mechanical: the projection $K\\times Y\\to Y$ is **open**, because\n$K=\\varprojlim_n L^+_nG$ with each $L^+_nG$ smooth affine of finite type and the transition and\nprojection maps $K\\to L^+_nG$ surjective, so every quasi-compact open of $K\\times Y$ is pulled back\nfrom a level $L^+_nG\\times Y$, where the projection is flat and locally of finite presentation and\nhence open; and for an open map $f$, $f^{-1}(\\overline Z)=\\overline{f^{-1}(Z)}$ by the neighbourhood\nargument. With openness in hand the rest of Step 7 goes through verbatim.\n\n</details>\n\n**Flaw 3** [MINOR] — This is Cartier's theorem, whose standard statement is for group schemes **locally of finite type**\nover a field of characteristic zero.\n\n<details><summary>(Step 7, \"$K$ a group scheme over an algebraically closed field of characteristic $0$\") · the finding</summary>\n\n$L^+G$ is not locally of finite type, so the reason as given does\nnot reach its conclusion. Reducedness of $L^+G$ is still true — it is $\\varprojlim_n L^+_nG$ with each\n$L^+_nG$ smooth, so its coordinate ring is a filtered colimit of reduced rings — but that is a\ndifferent argument, and the step should give it. (The consequence the step actually uses, that\n$K\\times\\overline{LX}_\\nu$ is reduced when both factors are and $k$ is algebraically closed, is\ncorrect and is fine to leave compressed.)\n\n</details>\n\n**Flaw 4** [MINOR] — The Lemma's hypothesis names the transition functors as \"$!$-extension along $Z_m\\hookrightarrow\nZ_{m+1}$\"; the proof works throughout with the inclusions $\\mathcal{C}_{Z_m}\\subseteq\n\\mathcal{C}_{Z_{m+1}}$ of full subcategories of the ambient.\n\n<details><summary>(Step 2/3/4, \"The transitions being the inclusions\") · the finding</summary>\n\nIdentifying the two is a reading of the\nhypothesis — a correct and forced one, since $Z_m\\hookrightarrow Z_{m+1}$ is a closed embedding and\nthe $\\mathcal{C}_{Z_m}$ are given as subcategories of one ambient, so the only cocone available is\nthe family of inclusions. But the draft declares its *other* reading, in Step 5, before using it, and\nshould do the same here. As written a reader meets \"the transitions being the inclusions\" as an\nassertion about someone else's notation.\n\n</details>\n\n**Flaw 5** [MINOR] — Step 8 places $x$ in $Z_m$; Step 9 needs $x$ as a morphism $\\mathrm{Spec}\\,k\\to Z_m$, in order to form\n$\\mathrm{id}_K\\times x\\colon K\\to K\\times Z_m$ and apply Step 7.\n\n<details><summary>(Step 8 → Step 9, \"that one point lies in some $Z_m$\" → \"$x$ being a point of $Z_m$\") · the finding</summary>\n\nThe passage from topological\nmembership to a scheme-theoretic factoring needs a word — reducedness of $Z_m$ (which holds, being a\nfinite union of reduced orbit closures by\n[$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html)), or else\nreading $\\partial\\overline{LX}_\\lambda=\\bigcup_m Z_m$ as an equality of fpqc sheaves, under which a\n$k$-point factors through a stage with nothing to check. Either is a clause; neither is present.\n\n</details>\n\n**Flaw 6** [MINOR] — \"This makes the combination [colimits of presentable categories] prints apart and asks a citing node\nto declare.\"\n\n<details><summary>(Step 3, first sentence) · the finding</summary>\n\nis not a sentence, and the declaration it is trying to make is exactly what the entry's\nthird note requires a citing node to make legibly. The same sentence was malformed at r1 and was\nquoted back in r1's Flaw 3; it has been edited without being repaired.\n\n</details>\n\n**Flaw 7** [MINOR] — False as of the widening: it is at Q2-L4_node.md:14.\n\n<details><summary>(Caveats, third bullet: \"The Lemma links `def:satake_subcategory`, absent from this\nnode's `objects:`\") · the finding</summary>\n\nThe bullet was the correct response to r1's\nFlaw 8 when it was written and is now a factual error about the repository; it should go, together\nwith the observation it carried (that no step invokes the entry), which is also no longer something\nworth flagging now that the entry is declared — and which, after Flaw 1's repair, will be false too,\nsince Step 1 will invoke it for smallness.\n\n</details>\n\n**Flaw 8** [MINOR] — Lists eight entries and omits both newly declared ones, although Step 1 links\n`defn:coherent_D_mod` and the Lemma links `def:satake_subcategory`.\n\n<details><summary>(proof.md:5, the `uses:` line) · the finding</summary>\n\nThe line should mirror the node's\n`objects:`.\n\n</details>\n\n**Flaw 9** [MINOR] — Correct, and correctly *used* — but asserted with no word on why.\n\n<details><summary>(Step 3, \"holds verbatim one universe up\") · the finding</summary>\n\nWhat makes it true is that the\nproof of the quoted result uses no cardinality bound anywhere, so the statement relativizes to any\nuniverse; and that the indexing diagram $\\mathbb{N}^{\\mathrm{op}}$ is small in both universes, so\n\"small limits\" means the same thing at both sizes. The entry's `hypotheses:` line explicitly assigns\nthe size bookkeeping to the citing node, and one clause of it is still being asserted rather than\nsupplied.\n\n</details>\n\n**Flaw 10** [MINOR] — The restructure is real and I have credited it above, but Steps 1–3 remain denser than the rest:\nStep 3 concludes \"$\\mathcal{L}$ is stable\" and then adds a separate claim about presentability not\ntransferring, and Step 1 chains four reasons behind one conclusion.\n\n<details><summary>(Steps 1–3, [ADR 0043](../../../../process/decisions/0043-a-proof-step-is-one-claim.html)) · the finding</summary>\n\nNot worth a round on its own.\n\n</details>\n\n## On splitting, since I was asked\n\nI would cut where the prover proposes, and in that order. The geometric sub-lemma — *a $K$-stable\nreduced closed subset containing a point of a $K$-orbit contains the whole orbit as a subsheaf* — is\nSteps 7–9, is the only part of this node that leaves the world of presentable categories, is the part\nboth rounds have found flaws in (Flaws 2, 3, 5 above are all inside it), and is stated in one line\nwith hypotheses that have nothing to do with the rest. The categorical one — *$\\langle S\\rangle_\n{\\mathcal{C}}$ is presentable for small $S$ in a presentable stable $\\mathcal{C}$* — is Steps 11–13\nand is a clean self-contained consumption of clause (4) of the black box, reusable by any node that\nneeds a generated subcategory to be an object of $\\mathrm{Pr}^L$. With both cut, what remains is a\nsix-step formal argument that fits comfortably. This is the user's call, not a defect.\n\n## Assessment\n\nTen flaws, one MAJOR, and the MAJOR is a citation and a stale marker rather than a mathematical hole.\nThe r1 MAJOR is genuinely discharged: the point-based route avoids disjointness without assuming it\nelsewhere, the orbit map's factorization does the work $k$-points could not, and reducedness of $K$ is\nat last load-bearing. Flaws 3, 5, 7 and 9 of r1 are answered; Flaw 4 is answered as far as the prover\nmay answer it; Flaw 6 is answered in form but not in venue, which is Flaw 1 here; Flaw 8 was answered\nby the lead-researcher's widening and the draft has not caught up. The two places the geometry is\nstill doing unexamined work — the flat base change and Cartier's theorem, both inside Step 7 — are\neach one sentence, both claims are true, and I have written out what the sentences are.\n\nVERDICT: FAIL\n";</script>
