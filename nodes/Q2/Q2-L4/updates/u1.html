<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L4</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L4 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L4/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q2-L4](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-06 · **Operator:** `/update Q2-L4`, on an external verdict supplied by the user · **Status before:** `failing` · **Status after:** `failing`\n\n## The defect, in one sentence\n\nThe closing paragraph of the `## Statement` glossed the colimit hypothesis as saying that \"the union of the stages is *all* of the boundary category\" and that a filtered-colimit presentation \"rules out\" compatible families over the stages — and both halves are false, because a colimit in $\\mathrm{Pr}^L$ is computed as the **limit** of the right-adjoint diagram, whose objects *are* compatible families, and its stage images generate under arbitrary colimits rather than exhausting it objectwise.\n\n## What was verified, refuted and left unverified\n\n**Verified — the counterexample to the gloss.** Take $\\mathcal{C}_m = \\mathrm{Sp}^{\\times m}$ with transitions\n\n$$\nu_m\\colon\\ \\mathrm{Sp}^{\\times m}\\longrightarrow\\mathrm{Sp}^{\\times(m+1)}, \\qquad (X_1,\\dots,X_m)\\longmapsto(X_1,\\dots,X_m,0).\n$$\n\nEach $u_m$ is a left adjoint, its right adjoint being the truncation that forgets the last coordinate, so by [colimits of presentable categories](../../../../appendix/bb-prl-colimits.html) the colimit in $\\mathrm{Pr}^L$ is the limit of the truncation tower in $\\mathrm{Pr}^R$:\n\n$$\n\\varinjlim_m\\ \\mathrm{Sp}^{\\times m}\\ \\simeq\\ \\varprojlim_m\\ \\mathrm{Sp}^{\\times m}\\ \\simeq\\ \\prod_{n\\ge 1}\\mathrm{Sp}.\n$$\n\nThe image of $\\mathcal{C}_m$ is the sequences vanishing after position $m$, so the object $(\\mathbb{S},\\mathbb{S},\\mathbb{S},\\dots)$ lies in **no** finite stage — while being, as it must be, a colimit of objects that do. The gloss's first half is therefore false read objectwise, and its second half is false in the same breath: the colimit here *is* a category of compatible families, so a filtered-colimit presentation does not rule them out — computing it is exactly the passage to them.\n\n**Verified — the formal statement is untouched by this.** What the node concludes is a **generation** statement,\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda} = \\left\\langle \\Delta_{\\mu,b}\\ \\middle|\\ LX_\\mu\\subseteq\\partial\\overline{LX}_\\lambda,\\ b\\in A_\\mu\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\nand the bracket of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is the smallest **cocomplete** stable subcategory containing the generators. That is precisely what stage images generating under arbitrary colimits delivers, so the conclusion is the correct reading and needs no weakening. The gloss was not the claim; it was a wrong explanation of a right claim, which is the more dangerous of the two, because nothing gates a sentence that asserts nothing.\n\n**Verified — the orbit-exhaustion step needs no disjointness argument.** Each $Z_m$ is a finite union of orbit closures and is $K$-stable, so for a boundary stratum $LX_\\mu$ and a point $x_\\mu$ of it lying in some $Z_m$ — one exists because the $Z_m$ cover the boundary — the whole orbit $LX_\\mu = K\\cdot x_\\mu$ lies in $Z_m$. This is Step 7 of [proof.md](../proof.html) applied at a point rather than to the stratum, and it is shorter than what is written there.\n\n**Left unverified — that the boundary colimit presentation holds for any $X$.** The passage says, and this run agrees, that [Chen–Yi](../../../../appendix/bb-chenyi-symmetric-orbits.html) supply a placid presentation of the **whole loop space** by orbit-closure stages and do not supply\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}_{\\partial\\lambda}\\ \\simeq\\ \\varinjlim_m\\ \\mathcal{C}_{Z_m}\n$$\n\non a boundary. The node already records that as a hypothesis and not a consequence, so nothing here is a defect; but it is worth stating plainly that after this update the node's whole remaining content is that hypothesis, and it is unverified for every $X$ in the class.\n\n**Not adopted here — the passage's presentability route, which belongs one level down.** It proposes reaching presentability of $\\langle S_\\partial\\rangle$ by applying [[HA, Prop. 1.4.4.11](../../../../../papers/HA.pdf)] to the shift-closed collection $S_\\partial^{\\mathbb{Z}}$, and the argument is sound. It is not adopted *into this statement* because the conclusion is stated with the generation bracket and asserts no presentable-subcategory claim, so the obligation does not belong here; it belongs where it is consumed, which is [Q2-L4-L2](../Q2-L4-L2/index.html)(1), commissioned below.\n\n**Correction to the paragraph above, made in the same run.** An earlier draft of it gave a second and *false* reason — that [[HA, Prop. 1.4.4.11](../../../../../papers/HA.pdf)] has no appendix entry. It does: it is clause **(4)** of [colimits of presentable categories](../../../../appendix/bb-prl-colimits.html), whose (4)(2) is exactly the statement, and whose first note names the passage the passage proposes — feed $\\{X_\\alpha[-n]\\mid n\\ge0\\}$ to (4)(2) — and assigns it to the citing node. [proof.md](../proof.html) already consumes (4)(2) at its Step 13. So the route was available in the closed world all along, at the cost of the shift argument, and only the first reason survives.\n\n## What changed in the statement\n\nThe closing paragraph quoted below was **removed**. Nothing else in the `## Statement` changed: the hypotheses, the colimit presentation and the conclusion are as they were.\n\nIt was removed rather than corrected in place because it is *commentary*, and commentary in a node file belongs in the dated `<id>_history.md` entry that explains it ([ADR 0044](../../../../process/decisions/0044-a-question-states-a-problem-not-its-route.html), invariant I23). The corrected reading — that stage images generate under arbitrary colimits, and that compatible families are what the colimit is computed as rather than what it excludes — is recorded in the history, with the counterexample above.\n\n## Why the status was not reset\n\n`failing` stands. The two `FAIL` rounds are about smallness of $\\mathcal{D}_c(K\\backslash LX)$ being cited to [context.md](../../../../context.html) rather than to an appendix entry, and about the write-up's 1237 words against the 900-word budget; neither is touched here. And the formal claim did not change, so there is nothing for a reset to invalidate. [ADR 0019](../../../../process/decisions/0019-the-update-operator.html)'s reset applies to `drafted` and `proved`, and to a *material* change; this is neither.\n\n## Old closing paragraph, verbatim\n\n> The content is that the union of the stages is *all* of the boundary category and not merely a subcategory of it: the compatible families over the stages that no single stage carries are exactly what a filtered-colimit presentation rules out, and what the statement asserts is that the presentation holds.\n";</script>
