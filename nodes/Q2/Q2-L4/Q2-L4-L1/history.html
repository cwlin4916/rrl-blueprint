in, and one stated in a line with hypotheses that have nothing to do with the rest. It is reusable as it stands by [Q2-L3](../../Q2-L3/index.html), [Q2-L5](../../Q2-L5/index.html) and Q2-L9 (since retired), none of which has a node carrying it.\n- **2026-08-06 — $K$-stability is a conclusion here and not a hypothesis.** The decomposition brief left the choice open. It is stated as clause **(1)** because that is where the two standing defects live: [r2](../critiques/r2.html) Flaw 2 (closure quoted as commuting with the flat base change $K\\times(-)$, whose usual hypotheses fail for the non-finite-type $K = L^+G$ and the ind-scheme $LX$) and Flaw 3 (Cartier's theorem applied to $L^+G$, which is not locally of finite type) are both inside the parent's Step 7, and making stability a hypothesis would have left them in the parent with nothing gained. Both repairs are available inside this node's declared closed world: the note on [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) presents $K = L^+G$ as $\\varprojlim_m L^mG$ with the finite-type jet groups as levels, which is what makes the projection $K\\times Y\\to Y$ open and $K$ reduced, and that entry is declared for exactly this reason.\n- **2026-08-06 — the point-level reading was checked against the appendix before it was stated.** The route [u1](../updates/u1.html) verified — find the one $m$ from the covering at a single point and push the whole orbit in by functoriality — needs the strata to be orbit images through their $k$-points, and [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) does license it: its ratified reading ([ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)) says the orbit of $K$ through a $k$-point $x$ of $LX$ is the fpqc-sheaf image of $h\\mapsto h\\cdot x$, and that the strata *are* those images through their $k$-points. So no hypothesis had to be added for it. Clause **(2)** nonetheless quantifies over a $k$-point *whose orbit image is the stratum* rather than over an arbitrary one, because the entry asserts the reading for the strata and not a transitivity statement about arbitrary points, and this node does not need the stronger form.\n- **2026-08-06 — what the split removes from the argument, and it is a whole step.** Neither disjointness of the strata nor a \"meets, therefore contained in\" passage appears in clause **(2)**: the exhaustion is consumed at one point, and the containment of sheaves comes from the orbit map $\\mathrm{orb}_x = a\\circ(\\mathrm{id}_K\\times x)$ factoring through the $K$-stable $Z$, together with minimality of the fpqc-sheaf image. That is the route [r2](../critiques/r2.html) certified as answering r1's single `MAJOR` rather than relabelling it.\n- **2026-08-06 — the covering hypothesis is stated on $k$-points, which is weaker than the parent's.** [Q2-L4](../index.html) assumes $\\partial\\overline{LX}_\\lambda = \\bigcup_{m\\ge1}Z_m$ as closed subsets; hypothesis **(B)** here asks only that each $k$-point of the boundary lie in some stage, which that equality supplies. Stating it this way dissolves [r2](../critiques/r2.html) Flaw 5 — the passage from topological membership to a scheme-theoretic factoring — since **(A)** carries reducedness of the stages and $k$ is algebraically closed. Two further hypotheses of the parent were dropped because no clause consumes them: that the family is increasing, and that each $Z_m$ lies in $\\partial\\overline{LX}_\\lambda$.\n";</script>
