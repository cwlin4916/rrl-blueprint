<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L4-L2</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L4-L2 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L4-L2 — history\n\n[Q2-L4-L2](index.html) · [Q2-L4](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose Q2-L4`, carrying the categorical half of that node's write-up out of it. The immediate cause is the page gate: [Q2-L4](../index.html)'s round-2 write-up is 1237 words against the 900-word budget, and the closing section of [r2](../critiques/r2.html) names this as the second cut — \"a clean self-contained consumption of clause (4) of the black box, reusable by any node that needs a generated subcategory to be an object of $\\mathrm{Pr}^L$\". Nothing about $LX$ survives the cut: the statement is about a presentable stable $\\mathcal{C}$ and a filtered diagram of subcategories of it, which is why it is stated once here rather than again at every node that runs a colimit dévissage.\n- **2026-08-06 — presentability is a conclusion, not a `GAP` hypothesis, and here is exactly what licenses it.** The decomposition brief required this to be checked on the entry rather than assumed. [colimits of presentable categories](../../../../appendix/bb-prl-colimits.html) carries as its clause **(4)** the two parts of [[HA, Prop. 1.4.4.11](../../../../../papers/HA.pdf)], and part **(4)(2)** is precisely: for a presentable stable $\\mathcal{C}$ and a small collection $\\{X_\\alpha\\}$, the smallest full subcategory containing each $X_\\alpha$ and closed under extensions and small colimits is presentable. That is *not* the same subcategory as the $\\langle X_\\alpha\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), and the entry says so in its first note, which also names the passage — feed the small collection $\\{X_\\alpha[-n]\\mid n\\ge 0\\}$ to **(4)(2)** — and assigns it to the citing node as its own work. So clause **(1)** of the statement is derivable inside the declared closed world, at the cost of that passage, and no gap hypothesis is needed.\n- **2026-08-06 — on the route [u1](../updates/u1.html) declined, and one correction to it.** That record declined the external passage's presentability argument on the ground that \"[[HA, 1.4.4.11](../../../../../papers/HA.pdf)] has no entry\"; the entry exists, as clause **(4)** of [colimits of presentable categories](../../../../appendix/bb-prl-colimits.html), and [Q2-L4](../index.html) both declares it and consumes **(4)(2)** at Step 13 of [proof.md](../proof.html). What was right in the ruling stands untouched: a presentable-subcategory claim is not asserted by [Q2-L4](../index.html)'s `## Statement`, so adopting one there would have added an obligation the conclusion does not need. Here it is different — presentability of $\\mathcal{T}$ is what the universal property of the colimit is applied to in clause **(3)**, so the claim is load-bearing and belongs in the statement of the node that consumes it, with its provenance named.\n- **2026-08-06 — the two directions are separated because they cost different things.** Clause **(2)** is minimality alone: each generator lies in some $\\mathcal{C}_i\\subseteq\\mathcal{B}$ and $\\mathcal{B}$ is a cocomplete stable subcategory, so the smallest such containing the generators is inside it. Clause **(3)** is the universal property: each $\\mathcal{C}_i = \\langle S_i\\rangle_{\\mathcal{C}}\\subseteq\\mathcal{T}$ by minimality, and because $\\mathcal{T}\\hookrightarrow\\mathcal{C}$ is fully faithful and colimit-preserving with presentable source — clause **(1)** — post-composition with it is an inclusion of components of the $\\mathrm{Pr}^L$-mapping spaces, naturally in the source, so the cocone lifts and $V$ factors through $\\mathcal{T}$. [r2](../critiques/r2.html) checked that naturality argument in full at Step 15 of the parent and certified it as correct and as new mathematics rather than a rewording; what this node does is state it where its hypotheses are visible.\n- **2026-08-06 — clause (4) is the sentence [u1](../updates/u1.html) struck one level up, restated as something gateable.** The paragraph removed from [Q2-L4](../index.html)'s statement claimed that a filtered-colimit presentation \"rules out\" the compatible families that no single stage carries; a colimit in $\\mathrm{Pr}^L$ is computed as the limit of the right-adjoint diagram, so those families are what the colimit *is*. The witness u1 verified — $\\mathcal{C}_m = \\mathrm{Sp}^{\\times m}$ with zero-padding, colimit $\\prod_{n\\ge1}\\mathrm{Sp}$, and $(\\mathbb{S},\\mathbb{S},\\dots)$ in no finite stage — is an instance of this node's own hypotheses once the stages are presented as $\\langle\\mathbb{S}^{(1)},\\dots,\\mathbb{S}^{(m)}\\rangle_{\\mathcal{C}}$ inside $\\mathcal{C} = \\prod_{n\\ge1}\\mathrm{Sp}$, so it is carried in the statement as an assertion rather than as a disclaimer. A disclaimer would repeat the failure it is answering: nothing gates a sentence that asserts nothing.\n- **2026-08-06 — what the statement does not claim, and one hypothesis it does not consume.** It supplies no criterion for hypothesis **(B)**: that a given $\\mathcal{B}$ really is the colimit of its stages is assumed here and is, at the parent, the whole remaining content of [Q2-L4](../index.html). And filteredness of $I$ is not used by any of the four clauses — it is kept because it is the setting of use and of the witness, and because dropping it would state a generality no node in the repository needs.\n";</script>
