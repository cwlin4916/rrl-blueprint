<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L4</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L4 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L5-L4 — history\n\n[Q2-L5-L4](index.html) · [Q2-L5](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-09 — created** by `/decompose Q2-L5`, to carry `GAP (Coh)` as a statement. [r1](../critiques/r1.html)'s Flaw 3 found the gap honest but its scope understated in two directions: without coherence of the letters the object $P_\\lambda$ is not merely hard to place in the Satake subcategory, it is **undefined**, since [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) types $\\ast$ on $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and its $\\mathrm{Ind}$-extension; and two separate steps of the write-up needed it while only one was flagged. So this is a precondition of [Q2-L5](../index.html)'s statement, not of one of its steps, and it belongs in a node of its own.\n- **2026-08-09 — no source on disk supplies clause (1) or clause (2), and none was invented.** The decomposition brief asked for an appendix entry if the literature supported one. It does not, on the shelves this project has: [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html) and [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html) both close by asserting nothing about $\\mathcal{D}_c$ or $\\mathcal{D}^{\\mathrm{ren}}$, and [r1](../critiques/r1.html)'s Flaw 13 established that the pages the previous round nominated — `raskin_dmodules_infinite_var` §6.16 and Prop. 6.18.1 — are about the *dimension-theory* renormalization $f_{*,\\mathrm{ren}}$ and have nothing to do with coherence-preservation or with $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$. The mechanism people reach for here is parity sheaves (Juteau–Mautner–Williamson, arXiv 0906.2994), which is **not in `refs.bib` and not in `papers/`** and is therefore not citable; it has been recorded as unverified on [Q2-L5](../history.html) since 2026-08-05. The honest position is that clause (1) is a claim this repository owes, stated here so that a round on it produces a `GAP` prompt with the right shape rather than a fifth flag inside a write-up about something else.\n- **2026-08-09 — what makes clause (1) plausibly reachable, and clause (2) the harder half.** Coherence is tested by [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) against smooth morphisms from finite-type schemes, and $\\overline{\\mathrm{Gr}}_\\nu$ is a projective $k$-variety by [Zhu](../../../../appendix/bb-zhu-pi0-cartan.html)(2), so clause (1) is a finite-type statement about the object [$k_{\\mathcal{Y}}$](../../../../appendix/not-constant-object.html) defines. Clause (2) is not: it asks that a $!$-pushforward along a closed embedding into an ind-scheme preserve coherence, and the nearest entry, [Gunningham: $!$-restriction preserves coherence along a closed immersion of finite-orbit quotient stacks](../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html), runs the other way. The caveat on [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(4) is the warning that matters: that clause \"may be invoked to move an object *off* a stage, never to put an arbitrary coherent object *onto* one\", and $\\omega_{K\\backslash\\mathrm{Gr}}$ is the standing counterexample to the converse.\n- **2026-08-09 — clause (4) is separated from clauses (1)–(3) because it is free and they are not.** Given a coherent letter, membership in the Satake subcategory is one line from clause (1) of [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) and the ratified reading that the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$; [r1](../critiques/r1.html) certified the write-up's version of that step as correct as far as it went. Stating it for an arbitrary $\\mathcal{B}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ rather than for the word makes it reusable and makes visible that the whole cost of the first conclusion of [Q2-L5](../index.html) sits in clauses (1)–(2).\n";</script>
