<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L4</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L4 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q2-L5-L4\n\n[node](index.html) · [parent Q2-L5](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q2-L5-L4](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: precedent\n\n**Coverage, stated before anything else.** What is in print is clauses **(1)** and **(2)**,\neach in a setting one transport away from the node's: for an *algebraic stack* in the sense\nof [[drinfeld2013some, Def. 1.1.3, p. 14](../../../../../papers/drinfeld2013some.pdf)] — atlas a DG scheme, smooth and surjective. The\nnode's $K\\backslash\\overline{\\mathrm{Gr}}_\\nu$ is not one, because $K = L^{+}G$ is\npro-algebraic and the torsor $\\overline{\\mathrm{Gr}}_\\nu\\to K\\backslash\\overline{\\mathrm{Gr}}_\\nu$\nis pro-smooth rather than smooth; nor is $K\\backslash\\mathrm{Gr}$, which is an ind-stack.\nNothing located touches clause **(3a)** (a convolution of coherent objects is coherent) or\nclause **(4a)** ($\\mathcal{B}\\ast\\mathrm{IC}_0$ coherent).\n\n## Precedent\n\n**What was searched.** The local library first: `drinfeld2013some` (§7.1–§7.3 pp. 76–81,\n§10.6 pp. 120–121, §1.1 pp. 14–15), `gunningham2017deriveddecompositionequivariant`\n(§2.4–§2.5 pp. 15–18, and pp. 1–3 to confirm the paper's subject), `raskin_dmodules_infinite_var`\n(contents p. 1, Table 1 p. 3, §5 pp. 30–33), `zhu2016introduction` (§2.1 pp. 26–29),\n`BZSV` (§7.5.7–§7.5.13, pp. 165–167). Query: coherence of the constant $\\mathcal{D}$-module\non a quotient stack, and its preservation under proper pushforward.\n\n**What was found.**\n\n*The definition matches verbatim.* [[drinfeld2013some, §7.3.1, p. 80](../../../../../papers/drinfeld2013some.pdf)] defines\n$\\mathrm{D\\text{-}mod}_{\\mathrm{coh}}(\\mathcal{Y})$ as the $\\mathcal{M}$ with $g^{!}\\mathcal{M}$\ncoherent for every smooth $g\\colon S\\to\\mathcal{Y}$, $S$ a DG scheme — which is\n[coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)\nword for word, note (ii) included. It adds two things the blueprint entry does not carry: it\nsuffices to test on quasi-compact, or affine, $S$; and **on one smooth atlas alone**. §7.1.1,\np. 76 defines $k_{\\mathcal{Y}}$ by $g^{*}_{\\mathrm{dR}}(k_{\\mathcal{Y}}) = k_Z$, which is the\nconstruction [$k_{\\mathcal{Y}}$](../../../../appendix/not-constant-object.html) records.\n\n*Clause (1) is in print, in this generality.* [[drinfeld2013some, §7.3.2, p. 80](../../../../../papers/drinfeld2013some.pdf)], first\nsentence: \"The object $k_{\\mathcal{Y}}\\in\\mathrm{D\\text{-}mod}(\\mathcal{Y})$ is always in\n$\\mathrm{D\\text{-}mod}_{\\mathrm{coh}}(\\mathcal{Y})$.\" No smoothness, no finite-orbit and no\nquasi-compactness hypothesis on $\\mathcal{Y}$ — so it reaches the singular Schubert closures.\nThis **entails** clause (1) once $K$ is replaced by a finite-type quotient; it says nothing\nabout (2), (3) or (4).\n\n*Clause (2) is in print, twice.* [[drinfeld2013some, Prop. 10.6.2, p. 120](../../../../../papers/drinfeld2013some.pdf)]: for $\\pi$ a proper\nmap of algebraic stacks, $\\pi_{\\mathrm{dR},*}$ sends $\\mathrm{D\\text{-}mod}_{\\mathrm{coh}}$ to\n$\\mathrm{D\\text{-}mod}_{\\mathrm{coh}}$. And [[gunningham2017deriveddecompositionequivariant,\nProp. 2.20(1), p. 16](../../../../../papers/gunningham2017deriveddecompositionequivariant.pdf)] for a safe morphism of quotient stacks: \"If $f$ is proper, then\n$f_{*}\\simeq\\mathbb{D}_Yf_{*}\\mathbb{D}_X$ preserves coherence and is right adjoint to $f^{!}$.\nWe sometimes write $f_!$ instead of $f_*$ in that case\" — which also supplies, in print, the\nidentification of the node's $\\overline{\\iota}_{\\nu!}$ with $\\overline{\\iota}_{\\nu,\\mathrm{dR},*}$.\nGunningham's proof cites DG for part (1) as \"Theorem 10.6.2\"; DG print it as a *Proposition*.\nLoose where: Gunningham's $\\mathbf{D}_{coh}$ is defined (§2.4, p. 15) as bounded complexes with\ncoherent cohomologies, not by smooth tests — the identification with $\\mathcal{D}_c$ is the one\n[Gunningham: $!$-restriction preserves coherence](../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html)\nalready records as owed. DG's statement is the one whose definition needs no transport.\n\n*Clause (4) splits, and only half of it is a claim.* By\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html)(1)\nthe target is *defined* as $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\rangle_{\\mathcal{D}^{\\mathrm{ren}}}$,\nand by [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) that is\nthe smallest cocomplete stable subcategory containing those objects. So **(4b) is definitional**\ngiven that $\\mathcal{B}\\ast\\mathrm{IC}_0$ is an object of $\\mathcal{D}^{\\mathrm{ren}}$, i.e. given\n**(4a)**, which is not: it is the display of\n[the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html),\nan appendix convention read off main.tex:922, and no printed proof of it was located. The\n*target* of (4b) is standard in print — [[BZSV, Lemma 7.5.13, p. 167](../../../../../papers/BZSV.pdf)] argues about \"the full\nsubcategory [the basic object] generates under the Hecke action\" — but BZSV assert nothing\nabout coherence.\n\n**What was not found.** Raskin is the natural home for the ind-scheme half of (2) and\n**demonstrably has no coherence theory in infinite type**: the contents (p. 1) run\nPlacidity, Holonomic $D$-modules, $D$-modules on indschemes, with no coherent subcategory;\n§5.2, p. 30 defines $D_{coh}(S)$ only for $S$ *finite type*, as \"the compact objects in $D(S)$\",\nand Kan-extends *holonomicity*, not coherence. Footnote 6, p. 31 says the infinite-type\nholonomic condition \"completely ruins all the nice finiteness conditions that 'usual'\n(coherent) holonomic complexes satisfy\". This is the sourced form of the warning already in\n[Raskin: in infinite type, holonomic does not imply coherent](../../../../appendix/bb-raskin-holonomic-not-coherent.html),\nand it independently confirms that §6.16 / Prop. 6.18.1 are about a different renormalization.\nGunningham was checked as a second candidate for (3a)/(4a) and is not one: the paper is about\nblocks of the adjoint equivariant category on a reductive Lie algebra (Thms A–E, pp. 1–3).\n\n## Instances\n\n### 1. $\\nu = 0$ — instance (normalization)\n\n**What it is.** $G$ any connected reductive group, $\\nu = 0$. Then $\\mathrm{Gr}^0 = K\\cdot L_0$\nis the $K$-fixed base point, of dimension $\\langle2\\rho,0\\rangle = 0$, so\n$\\overline{\\mathrm{Gr}}_0 = \\{L_0\\}$ and $K\\backslash\\overline{\\mathrm{Gr}}_0 = BK = BL^{+}G$.\n\n**Why it is an instance.** $\\nu = 0\\in\\Lambda^{+}$; $\\overline{\\mathrm{Gr}}_0$ is a projective\n$k$-variety trivially, so [Zhu](../../../../appendix/bb-zhu-pi0-cartan.html)(2)'s\nhypothesis is met; $\\overline{\\iota}_0$ is a closed embedding by\n[$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(2).\n\n**What it matches.** Clause **(1)** alone, specialised at $\\nu=0$. It is the *only* clause of\nthe node the repository already asserts anywhere: note (ii) of\n[coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)\nrecords main.tex:786–793's example that $k_{BG}$ is coherent and not compact. Not reached: that\n$\\mathcal{F}_0$ is the **monoidal unit** of $\\ast$ — the appendix fixes no normalization\ndistinguishing $\\overline{\\iota}_{0!}k_{BK}$ from $\\overline{\\iota}_{0!}\\omega_{BK}$, and this\nrun discharges nothing about it.\n\n**What the statement says here.** $k_{BL^{+}G}\\in\\mathcal{D}_c(BL^{+}G)$.\n\n**Source.** Drinfeld, Gaitsgory, *On some finiteness questions for algebraic stacks*, GAFA 23\n(2013) 149–294, arXiv:1108.5351 — §7.3.2, p. 80 for coherence; §7.2.4, p. 78 and §7.1.4, p. 77\nfor non-compactness ($A = \\mathrm{Maps}_{B\\text{-mod}}(k,k)$ polynomial, hence $k$ not compact).\n`refs.bib`: `drinfeld2013some`.\n\n### 2. $G = \\mathrm{GL}_2$, $\\nu = (1,0)$ minuscule — instance\n\n**What it is.** $\\overline{\\mathrm{Gr}}_\\nu = \\mathrm{Gr}^\\nu\\cong G/P_\\nu = \\mathbb{P}^1$, smooth\nprojective of dimension $1$, a single $K$-orbit, so\n$K\\backslash\\overline{\\mathrm{Gr}}_\\nu \\cong B\\!\\left(L^{+}G\\cap t^{\\nu}L^{+}Gt^{-\\nu}\\right)$.\n\n**Why it is an instance.** $\\nu$ is dominant and minuscule; projectivity and the orbit\ndescription are Zhu's; the stabiliser presentation is his Prop. 2.1.5.\n\n**What it matches.** Clauses **(1)** and **(2)**: this is the smallest $\\nu$ with content, and\nthe case where the precedent applies with only the pro-unipotent congruence kernel between it\nand [[drinfeld2013some, §7.3.2](../../../../../papers/drinfeld2013some.pdf)]. Not reached: nothing here bears on (3) or (4). Smoothness makes\n$k\\simeq\\omega[-2]$ here ([$k_{\\mathcal{Y}}$](../../../../appendix/not-constant-object.html)),\nso this instance does **not** separate clause (1) from a statement about $\\omega$ — instance 3 does.\n\n**What the statement says here.** $k$ on $B(L^{+}G\\cap t^{\\nu}L^{+}Gt^{-\\nu})$ is coherent, and\nits extension along the closed embedding of $\\mathbb{P}^1$ into $K\\backslash\\mathrm{Gr}$ stays coherent.\n\n**Source.** Zhu, *An introduction to affine Grassmannians and the geometric Satake equivalence*,\narXiv:1603.05593 — Lemma 2.1.13, p. 27 (\"If $\\mu$ is minuscule, then\n$\\mathrm{Gr}_{\\le\\mu} = \\mathrm{Gr}_\\mu\\cong G/P_\\mu$\"), with Ex. 2.1.8, p. 26 and Ex. 2.1.12,\np. 27 for the $\\mathrm{GL}_n$ lattice description; Prop. 2.1.5, pp. 24–25 for the stabiliser.\n`refs.bib`: `zhu2016introduction`.\n\n### 3. $G = \\mathrm{SL}_2$, $\\nu = \\theta = \\alpha^{\\vee}$ quasi-minuscule — instance (singular)\n\n**What it is.** $\\overline{\\mathrm{Gr}}_\\theta$ is the projective cone over the conic\n$\\{x^2 = yz\\}\\subset\\mathbb{P}^2$: a projective surface, singular at the vertex, normal,\nCohen–Macaulay, Gorenstein with rational singularities. Two $K$-orbits,\n$\\overline{\\mathrm{Gr}}_\\theta = \\mathrm{Gr}^\\theta\\sqcup\\mathrm{Gr}^0$.\n\n**Why it is an instance.** $\\theta$ dominant; projective by\n[Zhu](../../../../appendix/bb-zhu-pi0-cartan.html)(2); the two-orbit\ndecomposition is [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(2).\n\n**What it matches.** Clause **(1)** in the case that carries its content:\n[$k_{\\mathcal{Y}}$](../../../../appendix/not-constant-object.html) states that on a\nsingular $S$ the constant and dualizing objects are *not* shifts of one another, so clause (1)\nhere is not a restatement of anything about $\\omega$. It is also where the two candidate sources\npart: [[drinfeld2013some, §7.3.2](../../../../../papers/drinfeld2013some.pdf)] has no smoothness hypothesis and covers it, whereas the\ncorresponding sentence in [gunningham…, §2.5, p. 18] passes through\n$p^{*} = p^{!}[-2\\dim X]$ and so presupposes pure dimension. Not reached: (2)–(4).\n\n**What the statement says here.** The constant object on the $K$-quotient of a singular\nprojective surface is coherent.\n\n**Source.** Zhu, *op. cit.* — Ex. 2.1.16, p. 27 (the projective cone), Lemma 2.1.14, p. 27\n(the cone description and the resolution $\\mathbb{P}(\\mathcal{L}_\\theta\\oplus\\mathcal{O})$),\nThm. 2.1.21, p. 28 (normal, Cohen–Macaulay, Gorenstein, rational singularities).\n`refs.bib`: `zhu2016introduction`.\n\n### 4. $B\\mathbb{G}_m$ — boundary case (the hypothesis that is doing work)\n\n**What it is.** $\\mathcal{Y} = B\\mathbb{G}_m$. Here $k_{\\mathcal{Y}}$ is coherent and **not**\ncompact: $\\Gamma_{\\mathrm{dR}}(B\\mathbb{G}_m,-)$ is not continuous, the diagram\n$k_{\\mathcal{Y}}\\to k_{\\mathcal{Y}}[2]\\to\\cdots$ has zero colimit but nonzero image.\n\n**Why it is a boundary case.** It is an instance of clause (1) whose *compact* analogue fails.\nSince $K = L^{+}G$ surjects onto a reductive $G$, which contains a $\\mathbb{G}_m$ whenever $G$\nis not unipotent, this failure is present in instance 1 already.\n\n**What it matches.** The word \"coherent\" in clauses (1)–(3), as against \"compact\". It rules out\none route to (2): [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(4)\nwrites an object as $\\iota_{*}c$ off a stage, and that entry's own hypotheses line says the\nclause \"may be invoked to move an object *off* a stage, never to put an arbitrary coherent\nobject *onto* one\" — because it is a statement about compacts. Not reached: nothing here\nrefutes any clause; it constrains the proof, not the statement.\n\n**Source.** Drinfeld–Gaitsgory, *op. cit.* — §7.1.4, p. 77 (display (7.2)) and §7.2.4, p. 78;\ncorroborated by [gunningham…, Ex. 2.27, p. 18] ($X = \\mathrm{pt}/T$:\n$\\mathbf{D}_{com} = \\Lambda\\text{-}\\mathbf{Perf}$, $\\mathbf{D}_{coh} = \\Lambda\\text{-}\\mathbf{Coh}$).\n`refs.bib`: `drinfeld2013some`, `gunningham2017deriveddecompositionequivariant`.\n";</script>
