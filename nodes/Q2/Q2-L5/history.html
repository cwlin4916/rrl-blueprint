<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L5 — history\n\n[Q2-L5](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by `/decompose` of [Q2](../../../dag.html), from the user's input passage (§5 of it): [Q2-L3](../Q2-L3/index.html) assumes the triangular objects $P_{\\lambda,a}$ exist and this node is the one geometric mechanism known for producing them. It is what turns Q2 from a categorical condition into a statement about maps of spaces — the hypotheses (a) and (b) are checkable orbit by orbit, on the convolution space, without any sheaf theory.\n- **2026-08-05 — orientation, not citation.** The mechanism is the standard parity-sheaf one: an even proper map that is an isomorphism over the open stratum produces an object supported on the whole closure extending the desired local system (Juteau–Mautner–Williamson), and the classical model in the affine Grassmannian is Mirković–Vilonen's stratified semismallness of convolution. Both are stated for finite-dimensional constructible-sheaf settings; transporting them to renormalized de Rham categories on placid loop spaces needs compatibility with finite-dimensional approximations, and neither has an appendix entry, so neither is available to a prover as it stands. Recorded here so the prover knows what to get an entry for.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: even proper resolutions producing the triangular objects, its two hypotheses about $\\pi_\\lambda$ unaffected.\n- **2026-08-06 — failing** at [r1](critiques/r1.html) by `/prove Q2-L5`, thirteen flaws — one `FATAL`, seven `MAJOR`, five `MINOR`. The run was commissioned because `/update` had written [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html) in answer to the earlier `GAP (Prop)`, and the finding is that **the node cannot use its own central entry**: the entry requires $f$ *finitely presented* — schematic, with finitely presented base change along any scheme — while hypothesis **(a)** supplies ind-properness only, which gives neither schematicity nor fp base change. The referee verified this on the page in `papers/raskin_dmodules_infinite_var.pdf` (§6.3, p. 34; Table 1, p. 3, row 3) and added a nuance the entry does not yet carry: §6.13, p. 40 defines *ind-finitely presented* as a genuinely different, non-schematic condition, and Table 1's row-3 label is that phrase while its reference is §6.3. So the old `GAP (Prop)` did not close — it **split**, into (FP), a hypothesis this node lacks, and (Eq), the equivariant descent the entry explicitly does not cover.\n- **2026-08-06 — why round 2 was not spent.** A prover may not touch a `## Statement`, and the `FATAL` and the sharpest `MAJOR` both terminate in changes only `/update` can make: hypothesis (a) must be strengthened, and the parity variant must be rewritten or removed. What a second round could reach — the undeclared ingredients at Step 6 — is a widening of **objects:** rather than a new argument, so the round would have bought one edit at the price of a full re-proof. The next action on this node is `/update Q2-L5`.\n- **2026-08-06 — the parity variant is a phantom, and that is new.** The referee found what neither prover had: the variant **is not a weakening**. \"$\\pi_\\lambda$ is an isomorphism over $LX_\\lambda$\" already implies hypothesis (b) with $n_\\lambda = 0$, and \"a direct summand\" is satisfied by the whole object, so the paragraph asserts nothing beyond the main claim and the write-up's `GAP (Par)` — the existence of a summand with the right costalk — guards a door that is not there. Relatedly, hypothesis **(b) is not statable in the available vocabulary**: its sheaf-level second clause repairs the $k$-points quantifier in intent, but \"the resulting rank-one local system on $LX_\\lambda$\" needs a base change that (FP) blocks and a notion of local system on an infinite-dimensional ind-scheme that nothing defines. And the conclusion's $n_\\lambda$ **cannot be** hypothesis (b)'s: with $\\pi_\\lambda$ an isomorphism over the stratum, (b) forces $n_\\lambda = 0$, and only the statement's own \"absorbed into $n_\\lambda$\" clause stands between the conclusion and falsity.\n- **2026-08-06 — a correction owed to the reading list.** The prover appended a block to [`papers/guideline.md`](../../../papers/guideline.html) naming `raskin_dmodules_infinite_var` §6.16 and Prop. 6.18.1 as what to read for coherence-preservation. The locations are right (§6.16, p. 41; Prop. 6.18.1, p. 42) but the reading is wrong: those concern Raskin's *dimension-theory* renormalization $f_{*,\\mathrm{ren}}$, which is unrelated to $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) — two senses of \"renormalized\" conflated. The block is left on disk unrewritten, per the append-only discipline of the reading list, and the correction is recorded here for `/update` to carry.\n- **2026-08-06 — examined and unchanged against a revised neighbour.** [Q2-L3](../Q2-L3/index.html) was revised this run ([u2](../Q2-L3/updates/u2.html)) and its four hypothesis labels **(A)**–**(D)** are unchanged, so every reference by letter still resolves. What moved is inside them: $\\operatorname{supp}$ and \"the objects supported on $\\partial\\overline{LX}_\\lambda$\" are replaced by $\\mathcal{D}^{\\mathrm{ren}}_T$, defined as the objects killed by $i_\\mu^!$ for every $\\mu\\notin T$, with $\\partial\\lambda$ and $\\overline{\\lambda}$ the index sets below and up to $\\lambda$. Hypothesis **(D)** of that node, which this one supplies, keeps the symbol $P_{\\lambda,a}$ and the costalk clause verbatim; its support clause $\\operatorname{supp}(P_{\\lambda,a})\\subseteq\\overline{LX}_\\lambda$ is now the membership $P_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$, i.e. $i_\\mu^!P_{\\lambda,a}\\simeq 0$ for every $\\mu\\not\\le\\lambda$. That is what this node's clause (a), ind-properness with scheme-theoretic image $\\overline{LX}_\\lambda$, is meant to give, and it is now stated as something a proof can actually check rather than as an undefined support condition. The label **(D)** is also renamed *triangular Satake lifts*; a rename of $P_{\\lambda,a}$ itself was considered and rejected precisely because this node concludes about it by that symbol.\n- **2026-08-08 — `needs:` set, statement unchanged** by `/update Q2`, recorded in [u3](../Q2-L1/updates/u3.html). Examined and found sound as a statement: [r1](critiques/r1.html)'s standing flaws name two missing appendix facts rather than a wrong claim, so the repair is to write them, not to revise here. It is a leaf, so the arithmetic is unusually clean and now stands on the node.\n- **2026-08-09 — statement revised, and the `needs:` line was stale** by `/update Q2-L5`, recorded in [u1](updates/u1.html). Three changes. The conclusion now says **what it does not deliver**: it lifts $\\omega_{K\\backslash LX_\\lambda}$ and discharges hypothesis **(D)** of [Q2-L3](../Q2-L3/index.html) only where $\\#A_\\lambda = 1$, whereas **(D)** quantifies over every $a\\in A_\\lambda$ and [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) exhibits $\\#A_\\lambda = 2$ and $4$ within one $X$. The **parity variant is withdrawn** — [r1](critiques/r1.html) established on 2026-08-06 that it is not a weakening and asserts nothing beyond the main claim, and only this operator could remove it; its removal also makes unreachable the configuration in which **(b)** forced $n_\\lambda = 0$ against a conclusion needing otherwise. The title drops \"resolutions\", which the statement never hypothesises. Status stays `failing`: the change to the main claim is a restriction the argument already observed, so the `## Lemma` block was re-synced in this run rather than the write-up superseded, and the write-up's now-orphaned parity section with its `GAP (Par)` goes at the next `/prove`.\n- **2026-08-09 — (FP) is on disk, and the ask shrank.** The `needs:` line had asked for finite presentation of the convolution morphism as an entry nobody had written. [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../appendix/fp-convolution-morphism.html)(2)–(3) supplies it, for the bounded convolution morphism and for its quotient-prestack form, in exactly the sense [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) requires — written for [Q1-L3](../../Q1/Q1-L3/index.html) and never carried back here. What separates that entry from this node's *iterated* $\\pi_\\lambda$ is a composition step, licensed by the stability of finite presentation under composition and its fppf-locality on the target that the entry itself states and uses. So **(Coh)** is the only fact still owed, both entries closing by asserting nothing about $\\mathcal{D}_c$ or $\\mathcal{D}^{\\mathrm{ren}}$.\n- **2026-08-09 — the input passage's converse does not hold here, and that is the finding.** It proposed that hypothesis **(D)** is *necessary*, by taking $P_{\\lambda,a} := \\Delta_{\\lambda,a}$. Two clauses are free that way and the third is not: $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$ asks for $i_\\mu^!i_{\\lambda!}E_{\\lambda,a}\\simeq 0$ whenever $\\mu\\not\\le\\lambda$, and no appendix entry supplies that vanishing. Recorded here rather than acted on, this being a node-local run.\n- **2026-08-09 — decomposed into four sub-lemmas** by `/decompose Q2-L5`. The statement is untouched and the status is untouched; what changed is that every ingredient [r1](critiques/r1.html)'s `FATAL` found undeclared is now a statement with hypotheses of its own. [Q2-L5-L1](Q2-L5-L1/index.html) is the geometry — every stage of the convolution tower, and not only $\\pi_\\lambda$, is finitely presented in the sense [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) requires; [Q2-L5-L2](Q2-L5-L2/index.html) is the `FATAL` itself, the identification of $\\pi_{\\lambda!}$ of the tower's top object with the Hecke word, proved letter by letter under three declared hypotheses; [Q2-L5-L3](Q2-L5-L3/index.html) is the two restriction clauses, vanishing off the closure and the costalk, for an **arbitrary** object on $K\\backslash Z_\\lambda$; [Q2-L5-L4](Q2-L5-L4/index.html) is `GAP (Coh)` and the Satake membership. They reassemble in one line: **L4**(2)–(4) gives the first conclusion, **L2**(3) rewrites $P_\\lambda$ as $\\pi_{\\lambda!}\\mathcal{M}^{(1)}$, and **L3**(2) and **L3**(4) applied to $\\mathcal{M} = \\mathcal{M}^{(1)}$ give the second and third — under **L2**'s **(A)** composition of pushforwards on quotient prestacks, **(B)** a bottom object extending to $\\mathrm{IC}_0$ and **(C)** a twisted product per letter, and **L3**'s **(A)** from **L1**, **(B)** which is this node's own hypothesis **(a)**, and the normalization display of **L3**(4).\n- **2026-08-09 — what the cut deliberately leaves standing, in one place.** Hypothesis **(b)** of this node is fibrewise — compactly supported de Rham cohomology of $\\pi_\\lambda^{-1}(x)$ over $k$-points, plus a rank-one local system — while [Q2-L5-L3](Q2-L5-L3/index.html)(4) asks for an equivalence of sheaves on $K\\backslash LX_\\lambda$, and the passage between them is [r1](critiques/r1.html)'s Flaws 5 and 8: the degrees match only after a dualization, and \"the resulting rank-one local system\" needs vocabulary nothing on disk defines. That passage is now the single unbridged step of this node rather than one flag among five, and it sits inside one display of one child. Two further things are recorded and not repaired here: **(Coh)** is owed with no source on disk to transcribe from — Juteau–Mautner–Williamson is not in `refs.bib` and not in `papers/` — and the composition step out of [$m_F$ is finitely presented](../../../appendix/fp-convolution-morphism.html) is **a statement and not a write-up step**, because the entry covers the bounded morphism into $L^{+}X$ and the tower needs the same for target $LX$, which is [Q2-L5-L1](Q2-L5-L1/index.html)(1). One appendix entry was written for the cut: [$k_{\\mathcal{Y}}$](../../../appendix/not-constant-object.html), which defines the constant object on a finite-type scheme and on a group quotient of one and refuses it on $K\\backslash L^{+}X$ and $K\\backslash Z_\\lambda$ — the refusal being what turns this node's \"absorbed into $n_\\lambda$\" from a parenthesis into a labelled condition.\n- **2026-08-09 — decomposed into four sub-lemmas** by `/decompose Q2-L5`. The cut turns each thing the statement's closing paragraph reserves as *not imported*, and each fact [r1](critiques/r1.html)'s `FATAL` found the write-up leaning on without naming, into a stated claim with declared hypotheses — so the next `/prove` here is an assembly step and not a re-derivation. [Q2-L5-L1](Q2-L5-L1/index.html) carries finite presentation up the convolution tower, from [$m_F$ is finitely presented](../../../appendix/fp-convolution-morphism.html)(2)–(3) at a single bounded convolution to the iterated $\\pi_\\lambda$; [Q2-L5-L2](Q2-L5-L2/index.html) is the convolution identification, one Hecke letter at a time, and is the `FATAL` itself; [Q2-L5-L3](Q2-L5-L3/index.html) is what the strata see — the vanishing off the closure from hypothesis **(a)**, and the costalk on the stratum; [Q2-L5-L4](Q2-L5-L4/index.html) is coherence of the Hecke letters and Satake membership of any word applied to [$\\mathrm{IC}_0$](../../../appendix/ic-0.html). L1 and L4 are ready leaves; L2 and L3 each rest on L1 alone.\n- **2026-08-09 — three things the cut deliberately does not close.** The **unbridged step**: the parent's fibrewise **(b)** does not imply [Q2-L5-L3](Q2-L5-L3/index.html)(4)'s costalk display in this closed world — [r1](critiques/r1.html) Flaws 5 and 8 — and it is now one display in one child rather than five flags scattered through a write-up. The **(FP) composition step** is a statement and not a write-up step, because the entry covers $m_F$ into $L^+X$ while the tower needs the same with target $LX$: that is [Q2-L5-L1](Q2-L5-L1/index.html)(1), with the fppf-descent of each stage as (2)–(3). And **composition of pushforwards on quotient prestacks** is [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(i) at a generality that entry says is still owed, so it stands as [Q2-L5-L2](Q2-L5-L2/index.html)'s hypothesis **(A)** rather than as a citation.\n- **2026-08-09 — one appendix entry written, and it is a refusal.** [$k_{\\mathcal{Y}}$, the constant object](../../../appendix/not-constant-object.html) fixes the notation this node's own statement uses twice and main.tex names three times without ever defining. It defines $k_S$ on a finite-type scheme and on a group quotient of one, gives $\\omega_S\\simeq k_S[2d]$ for smooth $S$ of pure dimension $d$, and then **refuses** the object on $K\\backslash L^+X$, on $K\\backslash Z_\\lambda$, on $LX$ and on $\\mathrm{Gr}$ — structurally, since neither Kan-extended theory carries a $*$-pullback along the structure morphism of an infinite-dimensional prestack and there is no $2\\dim$ to compare with. It leaves [$\\mathrm{IC}_0$](../../../appendix/ic-0.html)'s ratified import untouched. That refusal is what converts this node's parenthetical \"absorbed into $n_\\lambda$\" from an aside into a condition a child has to state.\n";</script>
