Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html), and hypothesis **(H1)** of the [Q2 framing](../../../dag.html). No `depends-on`.\n- **notation:** $j_U$ is the embedding of $U := LX\\setminus\\overline{LX}_\\lambda$, and $k_Y$ the constant object on $Y$.\n\n## Lemma\n\nNotation as in [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html) and [the Satake subcategories](../../../appendix/def-satake-subcategory.html). Fix $\\lambda\\in\\Lambda_X^+$ and dominant coweights $\\nu_1,\\dots,\\nu_r$, and let\n\n$$\n\\pi_\\lambda\\colon\\ Z_\\lambda := \\overline{\\mathrm{Gr}}_{\\nu_1}\\,\\widetilde{\\times}\\,\\cdots\\,\\widetilde{\\times}\\,\\overline{\\mathrm{Gr}}_{\\nu_r}\\,\\widetilde{\\times}^{K}\\,L^+X\\ \\longrightarrow\\ LX\n$$\n\nbe the iterated convolution map, taken $K$-equivariantly, so that $\\pi_{\\lambda!}$ of the constant object computes the Hecke translate $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$ with $\\mathcal{F}_{\\nu_i}$ the constant object on $K\\backslash\\overline{\\mathrm{Gr}}_{\\nu_i}$ ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html)). Assume:\n\n**(a) Ind-proper, onto the closure.** $\\pi_\\lambda$ is ind-proper with scheme-theoretic image $\\overline{LX}_\\lambda$.\n\n**(b) Cohomologically trivial over the open stratum.** There is $n_\\lambda\\in\\mathbb{Z}$ such that for every $k$-point $x\\in LX_\\lambda$,\n\n$$\nH^\\bullet_{\\mathrm{dR},c}\\left(\\pi_\\lambda^{-1}(x)\\right)\\ \\simeq\\ k[-n_\\lambda],\n$$\n\nand the resulting rank-one local system on $LX_\\lambda$ is trivial.\n\nThen $P_\\lambda := \\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$ satisfies\n\n$$\nP_\\lambda\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\\qquad \\operatorname{supp}\\left(P_\\lambda\\right)\\subseteq\\overline{LX}_\\lambda,\\qquad i_\\lambda^!P_\\lambda\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\ \\omega_{K\\backslash LX_\\lambda}\\left[n_\\lambda\\right],\n$$\n\n**What this delivers, and what it does not.** Hypothesis **(D)** of [Q2-L3](../Q2-L3/index.html) asks for a triangular lift of $E_{\\lambda,a}$ for **every** $a\\in A_\\lambda$. The conclusion above is that lift at the one index whose generator is the dualizing object, $E_{\\lambda,a} = \\omega_{K\\backslash LX_\\lambda}$, and at no other. It therefore discharges **(D)** at $\\lambda$ exactly when $\\#A_\\lambda = 1$ and the generating collection is taken to be that object — the case [Q2-L2](../Q2-L2/index.html)(i) supplies, from connectedness of the stabilizer quotient. When $\\#A_\\lambda > 1$ this statement is silent on the remaining generators: by [Q2-L2](../Q2-L2/index.html)(ii) they need not lie in the subcategory $\\omega_{K\\backslash LX_\\lambda}$ generates, so no argument recovers them from the conclusion above. Which correspondences, if any, lift a non-trivial $E_{\\lambda,a}$ is open, and no node of [Q2](../../../dag.html) states a criterion for it.\n\nTwo identifications are part of what is to be proved and are not imported: that $\\pi_{\\lambda!}$ of the constant object on $Z_\\lambda$ is the iterated convolution named above, and the normalizing shift relating the constant object on $K\\backslash L^+X$ to $\\omega_{K\\backslash L^+X}$, which is absorbed into $n_\\lambda$.\n\n## Proof\n\n**Step 1 — The support clause is read as vanishing on the open complement.**\n\n<details><summary>the argument</summary>\n\nNo entry defines $\\operatorname{supp}$. Since $\\overline{i}_\\lambda$ is a closed embedding ([Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)) of the reduced closure ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)), $U$ is open and the clause reads\n\n$$\n\\operatorname{supp}(P_\\lambda)\\subseteq\\overline{LX}_\\lambda\\ :\\Longleftrightarrow\\ j_U^!P_\\lambda = 0\\ \\text{ in }\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash U).\n$$\n\n</details>\n\n**Step 2 — $P_\\lambda$ is a single Hecke translate of $\\mathrm{IC}_0$.**\n\n<details><summary>the argument</summary>\n\nBy [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), $\\mathcal{D}_c(K\\backslash LX)$ is a left module over the monoidal $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, containing $\\mathrm{IC}_0$ ([$\\mathrm{IC}_0$](../../../appendix/ic-0.html)). Iterating the module associativity constraint gives $P_\\lambda\\simeq_{\\mathcal{D}_c(K\\backslash LX)}\\mathcal{F}\\ast\\mathrm{IC}_0$ with\n\n$$\n\\mathcal{F}\\ :=\\ \\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\n$$\n\nformed inside that monoidal category — provided its factors lie there. **GAP (Coh):** needed is an entry asserting $\\mathcal{F}_{\\nu}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, coherence of the $!$-extension of $k_{K\\backslash\\overline{\\mathrm{Gr}}_{\\nu}}$ — the analogue of the import [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) ratifies.\n\n</details>\n\n**Step 3 — Granting (Coh), the first conclusion holds.**\n\n<details><summary>the argument</summary>\n\n$\\mathcal{F}\\ast\\mathrm{IC}_0$ is then one of the generators listed in [the Satake subcategories](../../../appendix/def-satake-subcategory.html)(1), whose bracket is formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) by the reading ratified there. Hence $P_\\lambda\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$.\n\n</details>\n\n**Step 4 — The pushforward entry's hypothesis is not supplied by (a).**\n\n<details><summary>the argument</summary>\n\n[Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html) requires $f$ *finitely presented* — schematic, with finitely presented base change along any scheme — while (a) asserts ind-properness alone. **GAP (FP):** needed is an entry, or a strengthening of (a), giving $\\pi_\\lambda$ finitely presented in that sense; (a) does supply the extra properness clause (iii) asks for.\n\n</details>\n\n**Step 5 — That entry is about ind-schemes and $\\mathcal{D}^!$, and the statement is about stacks and $\\mathcal{D}^{\\mathrm{ren}}$.**\n\n<details><summary>the argument</summary>\n\nIts `hypotheses:` line disclaims both. **GAP (Eq):** needed are (α) $K$-equivariant descent — [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html) is in the appendix but not in this node's `objects:`, so invoking it would change the closed world — and (β) coherence-preservation, letting $f_{*,!-\\mathrm{dR}}$ ind-extend to $\\pi_{\\lambda!}\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash Z_\\lambda)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ obeying (i)–(iii).\n\n</details>\n\n**Step 6 — Granting (FP) and (Eq), the first unimported identification holds.**\n\n<details><summary>the argument</summary>\n\nIterating the convolution diagram of [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html) $r$ times exhibits $\\pi_\\lambda$ as the composite of the maps $q$; $*$-pullback along the $K$-torsors $p$ preserves constant objects; and $\\mathrm{IC}_0$ is the $!$-extension of $k_{K\\backslash L^+X}$ ([$\\mathrm{IC}_0$](../../../appendix/ic-0.html)), which puts $L^+X$ in the last slot of $Z_\\lambda$. Clause (i) composes these: $\\pi_{\\lambda!}k_{Z_\\lambda}\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}P_\\lambda$.\n\n</details>\n\n**Step 7 — Granting (FP) and (Eq), the second conclusion holds.**\n\n<details><summary>the argument</summary>\n\nA scheme-theoretic image contains the set-theoretic one, so (a) gives $\\pi_\\lambda^{-1}(U) = \\emptyset$. Clause (ii), applied to the Cartesian square of $\\pi_\\lambda$ against $j_U$, yields $j_U^!\\pi_{\\lambda!}k_{Z_\\lambda} \\simeq 0$ — Step 1's reading.\n\n</details>\n\n**Step 8 — The costalk clause does not close.**\n\n<details><summary>the argument</summary>\n\nHere $i_\\lambda^!$ is hypothesis **(H1)** of the [Q2 framing](../../../dag.html), as recorded at [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html). **GAP (Loc):** no entry defines $\\omega_{K\\backslash LX_\\lambda}$ or $\\omega_{Z_\\lambda}$. One must supply a dualizing object stable under $!$-pullback; the normalization comparing $k_{Z_\\lambda}$ with $\\omega_{Z_\\lambda}$, the shift (b) absorbs into $n_\\lambda$; and the passage from (b)'s $k$-points to a sheaf — that an object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ on the single $K$-orbit with rank-one $!$-costalk in degree $n_\\lambda$ and trivial monodromy is $\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\omega_{K\\backslash LX_\\lambda}[n_\\lambda]$.\n\n</details>\n\n**Step 9 — Of the parity variant, only the retract half closes.**\n\n<details><summary>the argument</summary>\n\nA cocomplete stable subcategory is closed under retracts ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html)), so Step 3 gives Satake membership for any summand of $\\mathcal{F}\\ast\\mathrm{IC}_0$. **GAP (Par):** a summand with the prescribed costalk on $LX_\\lambda$ needs a decomposition- or parity-sheaf entry covering $\\pi_\\lambda$ with even fibres.\n\n</details>\n\n## Caveats\n\nWriting $\\pi_{\\lambda!}$ for $\\pi_{\\lambda,*,!-\\mathrm{dR}}$ is licensed by that entry's first note, on $\\mathcal{D}^!$ and for finitely presented $\\pi_\\lambda$; identifying it with the $\\mathcal{D}^*$-pushforward across $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ is not, and no step uses that.\n\nDegrees: $k[-n_\\lambda]$ sits in degree $n_\\lambda$ ([context](../../../context.html)), matching $i_x^!\\left(\\omega_{K\\backslash LX_\\lambda}[n_\\lambda]\\right)$. Step 8 fails on transport, not bookkeeping.\n";</script>
