<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L1</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L1 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q2-L5-L1 — self-contained prompt: Every stage of the convolution tower is finitely presented\n\n## Task\n\nProve the target claim rigorously under exactly the stated hypotheses. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q2: For which $X$ does every standard object of a stratum lie in the Satake subcategory?](../../../../dag.html)\n\n**Standing setting.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../appendix/assum-intro.html)(a)–(c). This is the standing class of [context](../../../../context.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html). $LX$ carries the $K$-placid presentation by orbit closures of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html),\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda .\n$$\n\nCoherence is [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), the renormalized category is $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html).\n\n### The recollement package, and which clause is standing\n\n[Q3](../../../Q3/index.html) asks for which $X$ the three clauses below hold, and states them canonically. They are written out in full here because Q2 spends them one at a time and a reader must be able to check which: **(H1)** is in force throughout Q2, and **(H2)** and **(H3)** are not.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n**(H1) is standing; the other two are spent by name.** Q2 assumes **(H1)** everywhere and proves it nowhere — discharging it is [Q1](../../../Q1/index.html)'s business, and it is what makes $i_{\\lambda!}$ exist, so without it the question below has no subject.\n\n**(H2)** and **(H3)** are what make the standard objects *generate* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. Generating is a different question from belonging, and belonging is what is asked here.\n\nThe two enter only where the membership is cashed in for [Q1](../../../Q1/index.html)'s equality, at [Q2-L1](../../Q2-L1/index.html)(ii), and each node that spends one names it at the point of use. A node needing a fourth hypothesis has found one and must say so.\n\n**Repository problem.** For which $X$ in the standing class does $!$-extension from every stratum land in the Satake subcategory:\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\ ?\n$$\n\nStating it costs **(H1)** and nothing else, because **(H1)** is what makes $i_{\\lambda!}$ exist.\n\n**The form the nodes work in.** Every **standard object** $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$ formed from a generating collection of a stratum ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html); notation [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html)) lies in the subcategory. That holds for one choice of collections if and only if it holds for every choice, so no choice of generators is part of what is asked — [Q2-L1](../../Q2-L1/index.html)(iii).\n\n**What counts as an answer.** A condition on the geometry of $LX$. The ones on record are **sufficient**: ind-proper Hecke correspondences onto each closure with cohomologically trivial open fibre, plus a boundary dévissage — [Q2-L3](../../Q2-L3/index.html), [Q2-L4](../../Q2-L4/index.html), [Q2-L5](../index.html).\n\n**What those conditions do not yet reach.** They produce one generator per stratum, not every generator. [Q2-L5](../index.html) and [Q2-L6](../../Q2-L6/index.html) are the whole of what supplies hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html), and each terminates in a triangular lift of the dualizing object $\\omega_{K\\backslash LX_\\lambda}$, while **(D)** quantifies over every $a\\in A_\\lambda$.\n\nSo the chain answers the question exactly where $\\#A_\\lambda = 1$, which by [Q2-L2](../../Q2-L2/index.html)(iii) is connectedness of every stabilizer quotient $G_\\lambda$ — the hypothesis the Conjecture below carries, and one that no node establishes for the symmetric class at large. Where a stabilizer is disconnected the remaining generators are not merely unproved but out of reach of the mechanism: by [Q2-L2](../../Q2-L2/index.html)(ii) they need not lie in the subcategory $\\omega_{K\\backslash LX_\\lambda}$ generates, so nothing recovers them from what these nodes deliver.\n\nNo node with `role: proof` states a criterion producing a triangular lift of a non-trivial $E_{\\lambda,a}$; [Q2-e3](../../Q2-e3/index.html) at $\\mathrm{GL}_2/\\mathrm{O}_2$ asks whether one exists and does not answer it, and [K11](../../../../key_examples/k11.html) is out of class for precisely this reason.\n\n**On a necessary condition.** No node here states one: the $K_0$ cyclicity test is necessary for [Q1](../../../Q1/index.html)'s equality and not for the membership asked here, so a necessary condition in $LX$'s own geometry is open.\n\nHypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html) is one missing fact from being necessary. Taking $P_{\\lambda,a} := \\Delta_{\\lambda,a}$ discharges two of its three clauses — the Satake membership is the hypothesis itself, and the costalk clause is full faithfulness in **(H1)** — while the third asks for\n\n$$\ni_\\mu^!i_{\\lambda!}E_{\\lambda,a}\\ \\simeq\\ 0 \\qquad\\text{whenever }\\mu\\not\\le\\lambda .\n$$\n\nNo appendix entry supplies that vanishing.\n\nGranting that vanishing would make **(D)** *equivalent* to the membership, hence a reformulation of the question rather than a condition on $X$ — the objection recorded against [Q2-L1](../../Q2-L1/index.html) in the next paragraph, which would then apply to **(D)** verbatim. So the geometric content of an answer has to live in a theorem **supplying** the triangular lifts, and can never live in the triangular-lift condition itself.\n\n[Q2-L1](../../Q2-L1/index.html) is not such a condition. It reformulates the membership rather than conditioning $X$, and what it buys is the bridge to [Q1](../../../Q1/index.html) recorded under **Feeds** above.\n\nA full answer lists geometric hypotheses on $X$ under which the membership provably holds, together with an $X$ in the standing class where it provably fails; [K12](../../../../key_examples/k12.html) already supplies the second half.\n\n**The $X$ the literature settles.** The bench is [`key_examples.md`](../../../../key_examples/index.html), which records for each case whether the answer to the **goal** question is settled in print and how. It is outside the closed world: nothing below may be cited in a proof, and it bounds belief rather than supplying it.\n\n| | $X$ | $G$ | verdict | what it gives Q2 |\n|---|---|---|---|---|\n| [K1](../../../../key_examples/k1.html) | $\\mathbb{A}^1$ | $\\mathbb{G}_m$ | positive | the smallest non-homogeneous case; two strata, infinite boundary |\n| [K2](../../../../key_examples/k2.html) | $\\mathrm{pt}$ | $G$ | positive | one stratum; the membership is trivial |\n| [K3](../../../../key_examples/k3.html) | $\\mathrm{SO}_N$ | $\\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$ | positive | Gross–Prasad; symmetric, connected stabilizers |\n| [K4](../../../../key_examples/k4.html) | $\\mathrm{GL}_N$ | $\\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$ | positive | Rankin–Selberg |\n| [K5](../../../../key_examples/k5.html) | $\\mathrm{GL}_n\\times\\mathbb{A}^n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ | positive | mirabolic; non-homogeneous and still positive |\n| [K6](../../../../key_examples/k6.html) | $\\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$ | $\\mathrm{GL}_{2n}$ | positive | symmetric, the shape the Conjecture is cut for |\n| [K7](../../../../key_examples/k7.html) | $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$ | | adjacent | no verified source; not evidence |\n| [K8](../../../../key_examples/k8.html) | rank-1 affine homogeneous | | **weak** | only the Satake subcategory is realized, so it establishes [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) and leaves the question untouched |\n| [K9](../../../../key_examples/k9.html) | $H$ | $H\\times H$ | **degenerate** | $\\mathrm{IC}_0$ is the monoidal unit, so the membership holds for a reason no other $X$ has — it can never on its own earn `consistent` |\n| [K10](../../../../key_examples/k10.html) | Whittaker | | out-of-class | fails [the three standing hypotheses](../../../../appendix/assum-intro.html) |\n| [K11](../../../../key_examples/k11.html) | $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | | out-of-class | the class boundary: disconnected generic stabilizer |\n| [K12](../../../../key_examples/k12.html) | $(\\mathrm{SL}_2^{\\times 3})\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ | | **negative** | the membership fails in the standing class |\n\nK12 is why the Conjecture carries hypotheses rather than asserting the membership outright.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It refines [Q2-L5](../index.html). Its conclusion is required directly by [Q2-L5](../index.html), [Q2-L5-L2](../Q2-L5-L2/index.html), [Q2-L5-L3](../Q2-L5-L3/index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-09 — clause (4) is worded to refuse two things on purpose.** [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html) states its clause (i), compatibility with composition, for **ind-schemes**, and its hypotheses line says in as many words that a node wanting the correspondence formalism on a quotient prestack still owes it; and both that entry and [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html) close by asserting nothing about $\\mathcal{D}_c$ or $\\mathcal{D}^{\\mathrm{ren}}$. So this node stops at existence and base change, and the composition of pushforwards on quotient prestacks is a declared hypothesis of [Q2-L5-L2](../Q2-L5-L2/index.html) instead of a silent step here. That division is what makes both nodes one page.\n\n## Target statement\n\nLet $k$, $G$, $K = L^{+}G$ and $X$ be as in [the standing notation](../../../../appendix/subsec-notations.html), let $\\Lambda^{+} := X_*(T)^{+}$, and fix $\\lambda\\in\\Lambda_X^{+}$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)) together with dominant coweights $\\nu_1,\\dots,\\nu_r$ as in [Q2-L5](../index.html). For a finite $F\\subseteq\\Lambda^{+}$ let $\\mathrm{Gr}_F$, $\\overline{LG}_F$ and the fppf quotient $\\overline{LG}_F\\times^{K}(-)$ be as in [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html), put $F_i := \\{\\nu_i\\}$, and set\n\n$$\nZ^{(r+1)} := L^{+}X, \\qquad Z^{(i)} := \\overline{LG}_{F_i}\\times^{K}Z^{(i+1)}\\quad(i = r,\\dots,1),\n$$\n\nwhich is the twisted product written $\\overline{\\mathrm{Gr}}_{\\nu_i}\\,\\widetilde{\\times}\\,(-)$ in [Q2-L5](../index.html), so that $Z^{(1)}$ is that node's $Z_\\lambda$. Let $\\rho_{r+1}\\colon L^{+}X\\hookrightarrow LX$ be the jet embedding and, downwards in $i$,\n\n$$\n\\rho_i\\colon Z^{(i)}\\longrightarrow LX,\\qquad [g,z]\\longmapsto g\\cdot\\rho_{i+1}(z),\n$$\n\nso that $\\rho_1$ is that node's $\\pi_\\lambda$. Write $\\overline{m}_F\\colon\\overline{LG}_F\\times^{K}LX\\rightarrow LX$, $[g,y]\\mapsto g\\cdot y$, and let\n\n$$\n\\theta_i\\colon\\ K\\backslash Z^{(i)}\\longrightarrow K\\backslash\\left(LG\\times^{K}LX\\right),\\qquad [g,z]\\longmapsto[g,\\rho_{i+1}(z)]\\quad(i\\le r).\n$$\n\nThroughout, *finitely presented* means the prestack notion of [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv) — schematic in the classical sense, with finitely presented base change along every affine scheme over the target. Then:\n\n**(1) The convolution morphism with unbounded target.** For every finite $F\\subseteq\\Lambda^{+}$ the morphism $\\overline{m}_F$ is finitely presented, and so is the induced morphism of quotient prestacks $K\\backslash\\left(\\overline{LG}_F\\times^{K}LX\\right)\\rightarrow K\\backslash LX$.\n\n**(2) Every stage of the tower.** For every $i\\in\\{1,\\dots,r+1\\}$ the morphism $\\rho_i$ is finitely presented, and so is the induced morphism of quotient prestacks $K\\backslash Z^{(i)}\\rightarrow K\\backslash LX$. In particular this holds for $\\rho_1 = \\pi_\\lambda$.\n\n**(3) The embeddings into the convolution diagram.** For every $i\\le r$ the morphism $\\theta_i$ is finitely presented.\n\n**(4) What the sheaf theory then supplies, and what it does not.** By [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv) each of the morphisms in (1)–(3) carries a pushforward $f_{*,!-\\mathrm{dR}}$ on the theory $\\mathcal{D}^{!}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html), compatible with base change against $!$-pullback along an arbitrary morphism of prestacks. No clause here asserts compatibility with composition on quotient prestacks, and none asserts anything about $\\mathcal{D}_c$ or $\\mathcal{D}^{\\mathrm{ren}}$.\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the standing notation](../../../../appendix/subsec-notations.html) — `subsec:notations`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n### [the three standing hypotheses](../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../appendix/conj-intro.html) holds for $X$.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../../appendix/conv-d-shriek-d-star.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), ratified at [Q1-L1](../../../Q1/Q1-L1/index.html).\n\n### [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.9 with Prop. 3.9.2, §6.3, and Table 1](../../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). A morphism $f\\colon S\\rightarrow T$ of ind-schemes is *finitely presented* if it is schematic and its base change along any scheme is a finitely presented morphism (the source's §6.3). For such $f$ the source constructs a pushforward on the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html),\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(T),\n$$\n\nwhich it names the *\"$!$-dR $*$-pushforward functor\"*, and:\n\n**(i) Functoriality through correspondences.** $\\mathcal{D}^!$ upgrades, by left Kan extension, to a functor $\\mathcal{D}^{!,\\mathrm{enh}}$ out of the category of ind-schemes under correspondences $T\\xleftarrow{\\ \\alpha\\ }H\\xrightarrow{\\ \\beta\\ }S$ whose right leg $\\beta$ is finitely presented and whose left leg $\\alpha$ is arbitrary, carrying such a correspondence to $\\beta_{*,!-\\mathrm{dR}}\\,\\alpha^!$. In particular $f\\mapsto f_{*,!-\\mathrm{dR}}$ is compatible with composition of finitely presented morphisms.\n\n**(ii) Base change against $!$-pullback.** For a Cartesian square of ind-schemes\n\n$$\n\\begin{array}{ccc} S' & \\xrightarrow{\\ \\psi\\ } & S\\\\ \\downarrow f' & & \\downarrow f\\\\ T' & \\xrightarrow{\\ \\varphi\\ } & T\\end{array}\n$$\n\nwith $f$ finitely presented, the canonical map $\\varphi^!\\,f_{*,!-\\mathrm{dR}}\\rightarrow f'_{*,!-\\mathrm{dR}}\\,\\psi^!$ is an equivalence; Table 1 records this as \"always satisfies base-change with upper-$!$ functors\", with no hypothesis on $\\varphi$.\n\n**(iii) The proper adjunction.** If $f$ is in addition proper, then $f^!$ is canonically right adjoint to $f_{*,!-\\mathrm{dR}}$ — equivalently, $f_{*,!-\\mathrm{dR}}$ is the left adjoint of $f^!$.\n\n**(iv) The same construction for prestacks** *(added 2026-08-08; this clause **amends** the entry and, with it, what every node citing this anchor asserts — see the amendment note below)*. The source states the definition and the pushforward one generality up, for prestacks rather than ind-schemes. A morphism $f\\colon\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks is *finitely presented* if it is schematic and if for every $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathrm{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented; for every such $f$ there is a functor\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(\\mathcal{Y})\\longrightarrow\\mathcal{D}^!(\\mathcal{Z})\n$$\n\ncompatible with base change. *Schematic is meant classically*: the source's Remark 3.16.1 emphasises that \"by *schematic*, we mean schematic in the sense of classical (i.e., non-derived) algebraic geometry, which is a more forgiving notion than that of derived algebraic geometry\", the example given there being the embedding of $0$ inside the ind-scheme attached to an infinite-dimensional $k$-vector space — classically schematic, not DG schematic.\n\n**A quotient prestack is a prestack, and this is the clause to cite there.** For a group $K$ acting on $\\mathcal{Y}$ and on $\\mathcal{Z}$, the induced $K\\backslash\\mathcal{Y}\\rightarrow K\\backslash\\mathcal{Z}$ is a morphism of prestacks and is covered by the definition above verbatim. A node computing a pushforward and its base change on $K\\backslash LX$ therefore does **not** owe the assembly of [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) for that step; what it owes instead is finite presentation of the quotient morphism itself, in the sense just displayed.\n\n- **hypotheses:** $f$ **finitely presented** in the source's sense — for (i)–(iii) the ind-scheme sense recalled at the top, for (iv) the prestack sense of that clause — and, for (iii) alone, in addition **proper**. Placidity is *not* a hypothesis of any clause, and neither is any equivariance. *What each generality reaches.* Clauses (i)–(iii) are stated for ind-schemes: the correspondence functoriality, the base change in the displayed form, and the proper adjunction are asserted there and nowhere wider. Clause (iv) is stated for **prestacks**, hence for quotient prestacks $K\\backslash(-)$, but it asserts only the existence of $f_{*,!-\\mathrm{dR}}$ and its compatibility with base change — the source states neither (i) nor (iii) at that generality, so a node wanting the correspondence formalism or the proper adjunction on a quotient prestack still owes them. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) or about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)).\n- **note:** **There is one pushforward on $\\mathcal{D}^!$, and its name carries a $*$.** A node writing $f_!$ for the left adjoint of $f^!$ and a node writing $f_*$ for the pushforward defining a convolution ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) are, on $\\mathcal{D}^!$ and for finitely presented $f$, naming the same functor $f_{*,!-\\mathrm{dR}}$ of this entry. That is the whole of what the source licenses on this point.\n\n  **What is *not* licensed** is the identification of $f_{*,!-\\mathrm{dR}}$ with the $\\mathcal{D}^*$-pushforward $f_{*,\\mathrm{dR}}\\colon\\mathcal{D}^*(S)\\rightarrow\\mathcal{D}^*(T)$ across the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ that a dimension theory supplies ([sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html), [the three standing hypotheses](../../../../appendix/assum-intro.html)(b)). The source introduces the subscript precisely \"to avoid confusion\" between the two (§3.9, p. 9), and Table 1 lists two further renormalized functors $f_{*,\\mathrm{ren}}$ and $f^{!,\\mathrm{ren}}$ for placid $S,T$ equipped with dimension theories. A node needing that identification still owes it.\n- **note:** *Provenance, verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-06. Table 1, p. 3, row 3: hypothesis \"$f$ ind-finitely presented\", functor $f_{*,!-\\mathrm{dR}}\\colon D^!(S)\\rightarrow D^!(T)$, adjunctions \"Left adjoint to $f^!$ for $f$ ind-proper; right adjoint to $f^!$ up to cohomological shift for $f$ smooth\", base change \"Always satisfies base-change with upper-$!$ functors\", references §3.9 and §6.3. §3.9, p. 9 introduces $f_{*,!-\\mathrm{dR}}$ for a finitely presented map of quasi-compact quasi-separated **schemes** and notes that \"the formalism of correspondences implies that we have base-change between $*$-pushforward and $!$-pullback for Cartesian squares\"; Prop. 3.9.2, p. 10 is the proper adjunction in that scheme setting. §6.3, p. 34 is the ind-scheme upgrade quoted above, ending \"If $f$ is additionally assumed proper or smooth, we again have the usual adjunctions.\"\n\n  *A typo on the page.* The displayed compatibility inside Prop. 3.9.2 is printed as $f_{*,\\mathrm{dR}}\\varphi^!\\xrightarrow{\\ \\simeq\\ }\\psi^!f'_{*,!-\\mathrm{dR}}$, whose subscripts and primes do not typecheck against the Cartesian square drawn immediately above it. Clause (ii) states the base change in the form that does, which is the form Table 1 asserts.\n- **note:** *Commissioned by* the `/prove Q2` failure audit of 2026-08-06: **GAP (Prop)** at Step 4 of [Q2-L5](../index.html)'s write-up, which asked for four clauses. Three are above. The fourth, \"$f_!\\simeq f_*$\", is reached only in the notational sense recorded in the first note and **not** as an identification across the $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ duality.\n- **note:** *Provenance of clause (iv), verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-08. §3.16, printed p. 15, titled *Correspondences for prestacks*, reads verbatim: \"We say that a morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ is finitely presented if it is schematic, and if for any $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathsf{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented. As another corollary of Proposition 3.6.1, we obtain that there is a functor $f_{*,!-dR}$ compatible with base-change for any finitely presented morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks.\" Remark 3.16.1, immediately below on the same page, is the classical-schematic caveat quoted in clause (iv). §3.17, the equivariant setting behind [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html), begins on the same printed page.\n\n  *Two readings in clause (iv) are the transcriber's and not the page's.* First, the source writes only \"compatible with base-change\" and does not display the square; that this means the equivalence $\\varphi^!f_{*,!-\\mathrm{dR}}\\simeq f'_{*,!-\\mathrm{dR}}\\psi^!$ of clause (ii), now for a Cartesian square of prestacks, is read from Table 1's \"always satisfies base-change with upper-$!$ functors\" and from §3.9's own sentence about the formalism of correspondences. Second, $\\mathcal{D}^!$ on a prestack is here the one of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html) (main.tex:651–668); identifying it with the source's is the same dictionary clauses (i)–(iii) already rest on, and this entry does not re-derive it.\n- **note:** *What the amendment of 2026-08-08 changed, and what it withdrew.* Before that date this entry was transcribed from §3.9, §6.3 and Table 1 alone — schemes and ind-schemes — and its hypotheses line asserted that \"$S$ and $T$ are ind-schemes, never quotient stacks, so a node working on $K\\backslash LX$ supplies the descent from the ind-scheme statement itself, exactly as [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) requires.\" **That sentence was too restrictive and is withdrawn**, not merely supplemented: §3.16 states the definition and the base-change-compatible pushforward for prestacks outright, so on $K\\backslash(-)$ the pushforward and its base change are clause (iv) and no descent argument is owed for them. What survives of the old sentence: the torsor-descent entry is still what a node needs in order to *evaluate* $\\mathcal{D}^!$ on a quotient by an atlas, and clauses (i) and (iii) are still ind-scheme statements. A node whose write-up was built against the withdrawn sentence has an argument that is sound and longer than it needs to be, not one that is wrong.\n\n### [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Proposition** (derived inside this appendix from [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) (main.tex:694–718), [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](../../../../appendix/bb-zhu-pi0-cartan.html)(2) and the prestack definition of [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html)(iv); no main.tex label, and no page of `papers/` states it — the argument is written out in the second note below). Let $k$, $G$, $T\\subseteq B\\subseteq G$ and $K = L^+G$ be as in [the standing notation](../../../../appendix/subsec-notations.html), let $X$ be a smooth affine $G$-variety of finite type over $k$, and write $\\Lambda^+ := X_*(T)^+$. For a finite subset $F\\subseteq\\Lambda^+$ put\n\n$$\n\\mathrm{Gr}_F := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu\\ \\subseteq\\ \\mathrm{Gr},\n$$\n\nwith $\\overline{\\mathrm{Gr}}_\\mu$ the Schubert closures of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(2), let $\\overline{LG}_F\\subseteq LG$ be the preimage of $\\mathrm{Gr}_F$ under $LG\\rightarrow\\mathrm{Gr}$, let $\\overline{LG}_F\\times^{K}(-)$ denote the fppf quotient of $\\overline{LG}_F\\times(-)$ by $(g,x)\\cdot\\kappa = (g\\kappa,\\kappa^{-1}x)$, and let\n\n$$\nm_F\\colon\\ \\overline{LG}_F\\times^{K}L^+X\\longrightarrow LX,\\qquad [g,x]\\longmapsto g\\cdot x .\n$$\n\nThen, all three in the prestack sense of [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv) — schematic in the classical sense, with finitely presented base change along every affine scheme over the target:\n\n**(1) The jet embedding.** The canonical monomorphism $L^+X\\hookrightarrow LX$ is finitely presented, and its base change along any morphism of prestacks $\\mathcal{Z}\\rightarrow LX$ is a finitely presented closed embedding.\n\n**(2) The bounded convolution morphism.** For every finite $F\\subseteq\\Lambda^+$ the morphism $m_F$ is finitely presented.\n\n**(3) The quotient morphism.** For every finite $F\\subseteq\\Lambda^+$ the induced morphism of quotient prestacks\n\n$$\nK\\backslash\\left(\\overline{LG}_F\\times^{K}L^+X\\right)\\longrightarrow K\\backslash LX\n$$\n\nis finitely presented, so [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv) applies to it directly.\n\n- **hypotheses:** $X$ **smooth affine of finite type** over $k$ — the hypothesis of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html), which supplies the presentation $LX = \\varinjlim_i LX^i$ the argument runs on; the standing $X$ of [context](../../../../context.html) is smooth affine spherical, hence covered. $G$ **connected reductive** over the standing algebraically closed $k$, which is what [Zhu](../../../../appendix/bb-zhu-pi0-cartan.html)(2) needs in order to make each $\\overline{\\mathrm{Gr}}_\\mu$ projective; $F\\subseteq\\Lambda^+$ **finite**, which is what makes $\\mathrm{Gr}_F$ a scheme rather than an ind-scheme; clauses (2) and (3) are not asserted for infinite $F$, and they fail for $F = \\Lambda^+$, where $\\mathrm{Gr}_F = \\mathrm{Gr}$ is an ind-scheme not of finite type and step (c) of the argument below has nothing to say. Nothing here asserts **properness** of $m_F$, so clause (iii) of [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html) — the adjunction $m_{F,*,!-\\mathrm{dR}}\\dashv m_F^!$ — is *not* reached: $\\mathrm{Gr}_F$ is proper but $L^+X\\hookrightarrow LX$ is not, and the composite in the argument below is a closed embedding followed by a proper projection only after the untwisting, which does not make it proper. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) or $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)).\n- **note:** *Which appendix entry each ingredient comes from.* Clause (1) is the only one with content beyond bookkeeping, and the two entries the appendix already carries that look as if they cover it do **not**. [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) gives the presentation $LX = \\varinjlim_i LX^i$ with $LX^i = LX\\cap t^{-i}L^+\\mathbb{A}^N$ and asserts placidity; it says nothing about finite presentation, of the transitions or of the $i = 0$ stage. [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) gives finite presentation of the closed embeddings $\\overline{LX}_\\lambda\\rightarrow LX$ of **orbit closures**, which is a different family: $L^+X$ is not one of them unless a node proves it is, and no node should assume so.\n- **note:** *Why this holds. Written out here because no page of `papers/` located by this transcription states clauses (1)–(3); a citing node cites the entry and does not repeat the argument.* Throughout, a morphism of prestacks is *finitely presented* in the sense of [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv), and two formal facts about that notion are used and are immediate from its definition together with the corresponding facts for schemes: it is stable under base change and under composition, and — since the defining condition is tested on affine schemes over the target — it is fppf-local on the target.\n\n  **(a) Clause (1).** Fix a closed embedding $X\\subseteq\\mathbb{A}^N$, available because $X$ is affine of finite type. Then $L^+X = LX\\times_{L\\mathbb{A}^N}L^+\\mathbb{A}^N$, so $L^+X = LX^0$ in the notation of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html), and inside the stage $LX^i$ the subscheme $LX^0$ is cut out by the $Ni$ coefficient functions $a_{j,m}$, $1\\le j\\le N$ and $-i\\le m\\le-1$, of the coordinates $x_j = \\sum_{m\\ge-i}a_{j,m}t^m$. A closed subscheme defined by a finitely generated ideal is a finitely presented closed embedding, so $LX^0\\hookrightarrow LX^i$ is one for every $i$. Any morphism to $LX$ from a quasi-compact scheme — in particular from an affine one — factors through some stage of the presentation, whose transitions are closed embeddings. Hence for affine $S\\rightarrow LX$ one has $L^+X\\times_{LX}S = LX^0\\times_{LX^i}S$ for some $i$, a base change of a finitely presented closed embedding: an affine scheme, finitely presented and closed over $S$. That is clause (1), classical schematicity included, and the parenthetical about a general $\\mathcal{Z}\\rightarrow LX$ is the same computation after base change.\n\n  **(b) The untwisting isomorphism.** The $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\mathrm{Gr}_F\\times LX$, $(g,y)\\mapsto(gK,gy)$, descends to $\\theta\\colon\\overline{LG}_F\\times^{K}LX\\rightarrow\\mathrm{Gr}_F\\times LX$; the $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\overline{LG}_F\\times^{K}LX$, $(g,y)\\mapsto[g,g^{-1}y]$, descends along the $K$-torsor $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$ to a morphism inverse to $\\theta$. No trivialization is chosen and no local statement is used: both formulas are globally defined on the covers, and both invariances are one line. Under $\\theta$ the morphism $m_F$ becomes $\\mathrm{pr}_2\\circ\\theta\\circ\\iota$, where $\\iota\\colon\\overline{LG}_F\\times^{K}L^+X\\hookrightarrow\\overline{LG}_F\\times^{K}LX$ is the inclusion induced by $L^+X\\subseteq LX$.\n\n  **(c) The projection.** By [Zhu](../../../../appendix/bb-zhu-pi0-cartan.html)(2) each $\\overline{\\mathrm{Gr}}_\\mu$ is a projective $k$-variety, so the finite union $\\mathrm{Gr}_F$ is a projective $k$-scheme, in particular of finite presentation over $k$. Base change of $\\mathrm{Gr}_F\\rightarrow\\operatorname{Spec}k$ along an affine $S\\rightarrow LX$ gives $\\mathrm{Gr}_F\\times S\\rightarrow S$, so $\\mathrm{pr}_2\\colon\\mathrm{Gr}_F\\times LX\\rightarrow LX$ is schematic and finitely presented.\n\n  **(d) The incidence inclusion.** The square with top arrow $\\mathrm{id}\\times(L^+X\\hookrightarrow LX)$, bottom arrow $\\iota$, and the two quotient maps as verticals is Cartesian, and the verticals are $K$-torsors — the pullbacks of $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$, which is the restriction of $LG\\rightarrow\\mathrm{Gr}$ and is even Zariski-locally trivial for a constant reductive $G$ ([[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../../../../papers/zhu2016introduction.pdf)]). For affine $S\\rightarrow\\overline{LG}_F\\times^{K}LX$ the pulled-back torsor $P\\rightarrow S$ is an fppf cover with $P$ affine, since $K$ is an affine group scheme and affineness is fppf-local; over $P$ the pullback of $\\iota$ is a base change of the top arrow, hence of clause (1), hence finitely presented. Finite presentation being fppf-local on the target, $\\iota$ is finitely presented.\n\n  **(e) Clauses (2) and (3).** Clause (2) is (b) + (c) + (d) and the stability of finite presentation under composition. For clause (3), let $S\\rightarrow K\\backslash LX$ be affine and let $P := LX\\times_{K\\backslash LX}S$, again an affine $K$-torsor over $S$. Because $\\overline{LG}_F\\times^{K}L^+X\\rightarrow LX$ is $K$-equivariant and $LX\\rightarrow K\\backslash LX$ is a $K$-torsor, the base change of the clause-(3) morphism along $P\\rightarrow K\\backslash LX$ is $(\\overline{LG}_F\\times^{K}L^+X)\\times_{LX}P\\rightarrow P$, finitely presented by clause (2); descend along $P\\rightarrow S$.\n- **note:** *Provenance.* The one page-level citation in the argument is [[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../../../../papers/zhu2016introduction.pdf)], read in `papers/zhu2016introduction.pdf` on 2026-08-08: Proposition 1.3.6 identifies $\\mathrm{Gr}_{\\underline{G}}$ with the fpqc quotient $[L\\underline{G}/L^+\\underline{G}]$ and Remark 1.3.8 records that the $L^+\\underline{G}$-torsor $L\\underline{G}\\rightarrow\\mathrm{Gr}_{\\underline{G}}$ \"is locally trivial for the étale topology. If $\\underline{G} = G\\otimes\\mathcal{O}$ is constant reductive … it is even locally trivial for the Zariski topology\". Everything else is the appendix entries named in the attribution line, plus standard scheme theory. The statement was **commissioned by** [round 4 of Q1-L3-L2's critique](../../../Q1/Q1-L3/Q1-L3-L2/critiques/r4.html), commission **E1**, which asked for exactly clause (2); clauses (1) and (3) are what the argument for (2) needs and what the citing nodes use separately.\n\n### [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda = \\mathrm{Gr}_{\\le\\lambda}$ — the affine Grassmannian by Schubert closures](../../../../appendix/gr-schubert.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2, p. 4: the paragraph on $G_{\\mathcal{O}}$-orbits, together with (2.1) and (2.2)](../../../../../papers/mirkovic2007geometric.pdf)] for clauses (1)–(3); main.tex:831 and main.tex:1100 for the ind-properness in clause (3); main.tex:1208 and main.tex:1221 for clause (4)). Let $G$, $T$, $W$, $K = L^+G$ and $\\mathrm{Gr}$ be as in [the standing notation](../../../../appendix/subsec-notations.html), write $X_*(T)$ for the cocharacter lattice and $\\Lambda^+ := X_*(T)^+$ for the dominant cone.\n\n**(1) Orbits.** The group scheme $K$ acts on $\\mathrm{Gr}$ with finite-dimensional orbits, and the $K$-orbits are parameterized by the $W$-orbits in $X_*(T)$ — equivalently by $\\Lambda^+$. The orbit attached to $\\lambda$ is\n\n$$\n\\mathrm{Gr}^\\lambda = K\\cdot L_\\lambda\\ \\subset\\ \\mathrm{Gr},\n$$\n\nwhere $L_\\lambda$ is the image in $\\mathrm{Gr}$ of the point $\\lambda\\in X_*(T)\\subset LG$.\n\n**(2) Closure order.** For $\\lambda,\\mu\\in\\Lambda^+$,\n\n$$\n\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}\\quad\\text{if and only if}\\quad \\lambda-\\mu\\ \\text{is a sum of positive coroots.}\n$$\n\nThe blueprint writes $\\overline{\\mathrm{Gr}}_\\lambda := \\overline{\\mathrm{Gr}^\\lambda}$ for the closure, taken reduced.\n\n**(3) Presentation and ind-properness.** $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$, where the $\\mathrm{Gr}_n$ are finite-dimensional $K$-invariant schemes and every transition map is a closed embedding, and $\\mathrm{Gr}$ is ind-proper.\n\n**(4) Coherent sheaves come from a stage.** With $\\mathrm{Gr}_{\\le\\alpha}$ the manuscript's name for $\\overline{\\mathrm{Gr}}_\\alpha$,\n\n$$\n\\mathcal{D}(\\mathrm{Gr})\\simeq\\varinjlim_{\\alpha\\in\\Lambda^+}\\mathcal{D}\\left(\\mathrm{Gr}_{\\le\\alpha}\\right),\n$$\n\nand every $\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$ may be written $\\mathcal{F} = \\iota_*c$ with $\\iota\\colon\\mathrm{Gr}_{\\le\\alpha}\\hookrightarrow\\mathrm{Gr}$ the closed embedding and $c\\in\\mathcal{D}_c(\\mathrm{Gr}_{\\le\\alpha})^I$, for some $\\alpha\\in\\Lambda^+$.\n\n- **hypotheses:** $G$ connected reductive. Three caveats a citing node must carry. *Ground field.* The source works over $\\mathbb{C}$, with $\\mathcal{O} = \\mathbb{C}[[z]]$ and $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing $k$ is any algebraically closed field of characteristic $0$ ([the standing notation](../../../../appendix/subsec-notations.html), [$F = k((t))$](../../../../appendix/conv-ring-of-integers.html)); the presentation in clause (4) is asserted over the standing $k$ by main.tex:1208, and clauses (1)–(3) are used at that generality on the manuscript's authority, not on the source's page. *Equivariance in clause (4).* main.tex:1221 prints the reduction $\\mathcal{F} = \\iota_*c$ for **Iwahori**-equivariant coherent objects. A node needing the spherical form — $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ written as $\\iota_*c$ with $c\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}_{\\le\\alpha})$ — is making the same reduction one parahoric up, out of the same colimit presentation, and must say that it is doing so. *Two defects in the index and the category of clause (4), which a citing node must carry.* The colimit is indexed by $\\alpha\\in\\Lambda^+$ under the closure order of clause (2), and that poset is **not directed** once $\\mathrm{Gr}$ is disconnected: $\\lambda-\\mu$ a sum of positive coroots forces $\\lambda\\equiv\\mu$ modulo the coroot lattice, so a single $\\overline{\\mathrm{Gr}}_\\alpha$ lies in one connected component. Finite unions $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ are the directed replacement, and they are cofinal among the stages of clause (3) — [Q1-L3-L2](../../../Q1/Q1-L3/Q1-L3-L2/index.html)(2). Separately, \"$\\mathcal{F} = \\iota_*c$ for some $\\alpha$\" is a statement about **compact** objects, whereas $\\mathcal{D}_c$ is defined pointwise by [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) and coherent is not compact on a stack: $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support and comes from no stage — [Q1-L3-L2](../../../Q1/Q1-L3/Q1-L3-L2/index.html)(4). So clause (4) may be invoked to move an object *off* a stage, never to put an arbitrary coherent object *onto* one.\n- **note:** *Provenance, verified on the page.* Read in `papers/mirkovic2007geometric.pdf` on 2026-08-06. Printed p. 4 carries: \"For us an ind-scheme means a direct limit of family of schemes where all the maps are closed embeddings\", the display (2.1) $\\mathrm{Gr} = \\varinjlim\\mathrm{Gr}_n$ with \"the $\\mathrm{Gr}_n$ are finite dimensional schemes which are $G_{\\mathcal{O}}$-invariant\"; \"The group scheme $G_{\\mathcal{O}}$ acts on $\\mathrm{Gr}$ with finite dimensional orbits ... the $G_{\\mathcal{O}}$-orbits on $\\mathrm{Gr}$ are parameterized by the $W$-orbits in $X_*(T)$, and given $\\lambda\\in X_*(T)$ the $G_{\\mathcal{O}}$-orbit associated to $W\\lambda$ is $\\mathrm{Gr}^\\lambda = G_{\\mathcal{O}}\\cdot L_\\lambda\\subset\\mathrm{Gr}$\"; and the display (2.2) transcribed above, stated there \"for dominant $\\lambda$ and $\\mu$\". Printed p. 5 adds $\\dim(\\mathrm{Gr}^\\lambda) = 2\\rho(\\lambda)$ for dominant $\\lambda$, and the same printed p. 4 adds, in sentences this entry does not transcribe, that $\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$ and that $\\mathrm{Gr}$ is discrete for a torus. **This entry needs and carries none of those three**, and neither the $\\pi_0$ statement nor the torus statement is to be read out of clauses (1)–(4) above: all three are transcribed in [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../appendix/bb-mv-components-dimension.html), which is where a node wanting them cites.\n- **note:** *Ind-properness is the manuscript's, not the source's.* Mirković–Vilonen's p. 4 states the ind-scheme presentation and finite-dimensionality of the stages, and does not say \"proper\" on that page. The assertion in clause (3) is main.tex's: main.tex:831 states [Campbell–Dhillon: the counit is fully faithful](../../../../appendix/thm-cd-counit.html) for ind-proper $H/K$ and applies it to $\\mathrm{Gr} = LG/L^+G$, and main.tex:1100 calls the convolution morphism $q$ of [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) \"the ind-proper convolution morphism\". That each individual $\\overline{\\mathrm{Gr}}_\\lambda$ is therefore a proper scheme — a closed subscheme of a stage of an ind-proper presentation — is a deduction the citing node makes, not a line of this entry.\n\n### [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](../../../../appendix/bb-zhu-pi0-cartan.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[zhu2016introduction, Thm. 1.3.11(1) printed p. 15; §2.1 (2.1.1)–(2.1.2) printed p. 23; Prop. 2.1.5 printed pp. 24–25; (2.1.10) with Cor. 2.1.11 printed p. 26](../../../../../papers/zhu2016introduction.pdf)]; external, no main.tex label). Let $k$ be algebraically closed, $F = k((t))$, $\\mathcal{O} = k[[t]]$, let $G$ be a connected split reductive group over $k$ with $T\\subseteq B\\subseteq G$, let $\\underline{G} = G\\otimes_k\\mathcal{O}$ be the constant group scheme, and let $\\mathrm{Gr} = \\mathrm{Gr}_{\\underline{G}} = LG/L^+G$. Write $X_*(T)$ for the cocharacter lattice, $\\Lambda^+ := X_*(T)^+$ for the dominant cone, $Q\\subseteq X_*(T)$ for the coroot lattice, and $L_\\mu\\in\\mathrm{Gr}$ for the image of $t^\\mu = \\mu(t)\\in T(F)\\subseteq G(F)$. The clauses are **separately citable**; see the hypotheses line for what each needs and for what this entry does not carry.\n\n**(1) Cartan decomposition and the orbit parametrization** *(printed p. 23)*. There is a canonical bijection\n\n$$\nG(\\mathcal{O})\\backslash G(F)/G(\\mathcal{O})\\ \\cong\\ X_*(T)/W\\ \\cong\\ \\Lambda^+,\n$$\n\nrealized by the Cartan decomposition $G(F) = \\bigsqcup_{\\mu\\in\\Lambda^+}G(\\mathcal{O})\\,t^\\mu\\,G(\\mathcal{O})$. The double coset $G(\\mathcal{O})t^\\mu G(\\mathcal{O})$ depends on neither the uniformizer $t$ nor the embedding $T\\subseteq G$, and the image of $t^\\mu$ in $\\mathrm{Gr}$ — the point $L_\\mu$ — is independent of the uniformizer.\n\n**(2) The Schubert cell and the Schubert variety** *(Prop. 2.1.5, printed pp. 24–25)*. For $\\mu\\in\\Lambda^+$ the cell $\\mathrm{Gr}^\\mu$ forms a single $L^+G$-orbit and is a smooth quasi-projective variety with\n\n$$\n\\dim\\mathrm{Gr}^\\mu\\ =\\ \\langle 2\\rho,\\mu\\rangle ,\n$$\n\nand $\\overline{\\mathrm{Gr}}_\\mu$ is the Zariski closure of $\\mathrm{Gr}^\\mu$, hence a **projective** variety. Both are taken with the reduced scheme structure, as the source's definition on printed p. 24 does.\n\n**(3) The component group** *(Thm. 1.3.11(1), printed p. 15)*. Let $I = \\mathrm{Gal}(\\bar F/F)$, acting on the fundamental group $\\pi_1(G_F)$ of $G_F = G\\otimes_k F$, and let $\\pi_1(G_F)_I$ be the coinvariants. Then there is a canonical isomorphism $\\pi_0(LG)\\cong\\pi_1(G_F)_I$, and the projection $LG\\rightarrow\\mathrm{Gr}$ induces an isomorphism\n\n$$\n\\pi_0(LG)\\ \\cong\\ \\pi_0(\\mathrm{Gr}).\n$$\n\n**(4) The split reduction** *(the transcriber's display of a reduction the source performs on printed p. 26; see the notes)*. For the split $G$ of the setting above, $I$ acts trivially on $\\pi_1(G_F)$, so $\\pi_1(G_F)_I = \\pi_1(G)$, and the algebraic fundamental group of a split connected reductive group is by definition $X_*(T)/Q$. Hence\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ \\pi_1(G)\\ \\cong\\ X_*(T)/Q .\n$$\n\n**(5) Parity** *((2.1.10) with Cor. 2.1.11, printed p. 26)*. The map $\\mathfrak{p}\\colon X_*(T)\\rightarrow\\mathbb{Z}/2$, $\\mu\\mapsto(-1)^{\\langle2\\rho,\\mu\\rangle}$, factors as $X_*(T)\\rightarrow\\pi_1(G)\\rightarrow\\mathbb{Z}/2$ and therefore induces, through clause (3), a map $\\mathfrak{p}\\colon\\pi_0(\\mathrm{Gr})\\rightarrow\\mathbb{Z}/2$; and the cell $\\mathrm{Gr}^\\mu$ lies in the even, respectively odd, components exactly when $\\dim\\mathrm{Gr}^\\mu$ is even, respectively odd.\n\n- **hypotheses:** *Per clause.* Clauses (1), (2) and (5) need the §2 standing setting — $k$ algebraically closed, $F = k((t))$, $\\mathcal{O} = k[[t]]$, $\\underline{G} = G\\otimes_k\\mathcal{O}$ **constant** reductive — and clause (2) needs in addition $\\mu$ **dominant** for the chosen $B$. Clause (3) needs $k$ algebraically closed and $G_F$ connected reductive, and nothing more; it is stated for a possibly non-constant $\\underline{G}$, which is why the coinvariants appear. Clause (4) needs $G$ **split**, which is automatic here. *Ground field — this entry is the one that does not narrow.* The source's standing base field in §1.3 and §2 is any algebraically closed $k$; no characteristic hypothesis is placed on the clauses transcribed above (the characteristic exponent $p$ enters only Thm. 1.3.11(3)–(4), which this entry does not carry). The blueprint's standing $k$ — algebraically closed of characteristic $0$ ([the standing notation](../../../../appendix/subsec-notations.html), [$F = k((t))$](../../../../appendix/conv-ring-of-integers.html)) — is therefore inside the source's generality, and a node citing this entry over $k$ is making **no** declared widening. That is the whole reason the entry exists beside [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../appendix/bb-mv-components-dimension.html), whose clauses are stated over $\\mathbb{C}$: clause (2) here supersedes that entry's clause (3) with no widening, and clause (4) here supersedes the *non-routine* widening of that entry's clause (1). **What this entry does not carry is the labelling** — see the note below; a node needing it is in exactly the position [Mirković–Vilonen](../../../../appendix/bb-mv-components-dimension.html)'s second note (ii) describes, and this entry does not improve it.\n- **note:** **What this entry does not carry, and a citing node must supply.** *(i) The labelling of the components by coweights.* The step \"the connected component of $\\mathrm{Gr}$ containing $L_\\mu$ is the class $\\mu + Q$\" — equivalently, that the composite $X_*(T)\\rightarrow\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ of clauses (1), (3) and (4) is the canonical projection — is **not on any page of the source located by this transcription**, and is not asserted by any clause above. Clause (3) says the isomorphism is *canonical* and does not say what it does to $t^\\mu$; clause (4) identifies the target and not the map. The closest the source comes is clause (5), which is precisely the labelling composed with $X_*(T)/Q\\rightarrow\\mathbb{Z}/2$ — its mod-$2$ shadow, and strictly weaker. *(ii) Openness or finiteness of the components.* Clause (3) counts and names them; that a quasi-compact subscheme meets finitely many is the citing node's deduction, and $\\pi_0(\\mathrm{Gr})$ is infinite whenever $X_*(T)/Q$ is (for $G = T$ a torus it is $X_*(T)$). *(iii) Anything about $LX$* for a spherical $X$: every clause is about $\\mathrm{Gr}$ for a group.\n\n  *What page-level check is still owed on (i).* Zhu attributes Thm. 1.3.11 to \"various places\" and names six references, of which his bibliography (printed p. 94) resolves the one he calls ultimate to **G. Pappas and M. Rapoport, *Twisted loop groups and their affine flag varieties*, Adv. Math. 219 (2008), no. 1, 118–198**, with an appendix by T. Haines and Rapoport. That is where the isomorphism of clause (3) is constructed as the Kottwitz homomorphism, and the normalization to check is that its restriction along $X_*(T)\\rightarrow T(F)\\rightarrow G(F)$, $\\mu\\mapsto t^\\mu$, is the valuation map followed by $X_*(T)\\twoheadrightarrow X_*(T)/Q$. **That paper is not in `papers/` and has no key in `refs.bib`**, so it cannot be cited from the blueprint as things stand; the check is owed, and closing it means fetching the PDF, giving it a key, and amending this entry with a clause (6). Pages searched and found not to carry the labelling, all in `papers/zhu2016introduction.pdf`: printed pp. 14–17 (§1.3 through Thm. 1.4.3, including Ex. 1.3.12), pp. 21–22 (§1.6–§1.7), pp. 23–27 (§2.1 entire), pp. 29–31 (§2.2–§2.3), pp. 58–61 (§5.1–§5.2). `pappas2013local` is in `refs.bib` and is **not** this paper — it is Pappas–Zhu on local models of Shimura varieties.\n- **note:** *What this entry supplies that the other $\\mathrm{Gr}$ entries leave to the citing node.* The second note of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html) records that \"each individual $\\overline{\\mathrm{Gr}}_\\lambda$ is therefore a proper scheme … is a deduction the citing node makes, not a line of this entry\", the ind-properness there being the manuscript's rather than Mirković–Vilonen's. Clause (2) above makes it a line: $\\overline{\\mathrm{Gr}}_\\mu$ is a projective variety, on the source's own page and over the standing $k$, so a finite union $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ is a projective $k$-scheme with no deduction owed. What this does **not** settle is whether the stages $\\mathrm{Gr}_n$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(3) are the same family as the Schubert closures, or proper — that is a separate reading, and this entry does not touch it.\n- **note:** *Dictionary with the blueprint, and with the other $\\mathrm{Gr}$ entries.* The source writes $\\mathrm{Gr}_\\mu$ for the $L^+G$-orbit and $\\mathrm{Gr}_{\\le\\mu}$ for its closure; the blueprint writes $\\mathrm{Gr}^\\mu$ and $\\overline{\\mathrm{Gr}}_\\mu$ respectively ([$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(1)–(2)), and the clauses above are transcribed into the blueprint's names. The source writes $t^\\mu$ for the point the blueprint calls $L_\\mu$, $\\mathbb{X}_\\bullet(T)$ for $X_*(T)$, $\\mathbb{X}_\\bullet(T)^+$ for $\\Lambda^+$, $L^+\\underline{G}$ for $K$, and $(2\\rho,\\mu)$ for the pairing $\\langle2\\rho,\\mu\\rangle$ — the last of these a reading, as in [Mirković–Vilonen](../../../../appendix/bb-mv-components-dimension.html). The source's $T$ is the *abstract Cartan* $B/[B,B]$ of its §0.3.5, embedded as a maximal torus when an embedding is needed, and §2.1 fixes such an embedding $T\\subseteq B\\subseteq G$; the blueprint's $T\\subseteq B\\subseteq G$ of [the standing notation](../../../../appendix/subsec-notations.html) is that embedded torus. Over an algebraically closed field a connected reductive group is split, so the standing $G$ satisfies the source's §0.3.5 hypothesis; that sentence is the transcriber's, not the page's.\n\n  *Reducedness — the one place this source and [Mirković–Vilonen](../../../../appendix/bb-mv-components-dimension.html) disagree.* That entry declares $\\mathrm{Gr}$ reduced throughout, as its source does. This source does **not**: Remark 1.3.10 and Example 1.3.12(i), printed p. 15, record that $\\mathrm{Gr}_{\\mathbb{G}_m}$ is non-reduced, with $(\\mathrm{Gr}_{\\mathbb{G}_m})_{\\mathrm{red}} = \\pi_0(\\mathrm{Gr}_{\\mathbb{G}_m}) = \\mathbb{Z}$, and this is not a characteristic phenomenon. Nothing above is affected — $\\pi_0$ and dimension do not see nilpotents, and clause (2)'s cell and closure are declared reduced on the source's own page — but a node that needs $\\mathrm{Gr}$ itself reduced may not read that out of this entry.\n- **note:** *Provenance, verified on the page.* Read in `papers/zhu2016introduction.pdf` (arXiv:1603.05593**v2**, 4 Apr 2016; IAS/Park City Mathematics Series) on 2026-08-08 by the lead-researcher. Printed p. 15 carries verbatim: \"Here is a deeper application of loop groups. We assume that $k$ is algebraically closed and $\\underline{G}_F = \\underline{G}\\otimes F$ is connected reductive. Let $I = \\mathrm{Gal}(\\bar F/F)$ be the Galois group of $F$. It acts on the fundamental group $\\pi_1(\\underline{G}_F)$ of $\\underline{G}_F$. Let $\\pi_1(\\underline{G}_F)_I$ denote the group of coinvariants\", and then \"Theorem 1.3.11. (1) There is a canonical isomorphism $\\pi_0(L\\underline{G})\\cong\\pi_1(\\underline{G}_F)_I$. The map $L\\underline{G}\\rightarrow\\mathrm{Gr}_{\\underline{G}}$ induces an isomorphism $\\pi_0(L\\underline{G})\\cong\\pi_0(\\mathrm{Gr}_{\\underline{G}})$.\" Printed p. 23 opens §2: \"Let $F = k((t))$ and $\\mathcal{O} = k[[t]]$. Unless otherwise noted, we assume that $k$ is algebraically closed and $\\underline{G} = G\\otimes_k\\mathcal{O}$ is a constant reductive group scheme and write $\\mathrm{Gr}$ for $\\mathrm{Gr}_{\\underline{G}}$\", and carries (2.1.1), (2.1.2) and the definition of $t^\\mu$ transcribed in clause (1). Printed p. 24 defines $\\mathrm{Gr}_{\\le\\mu}$ \"endowed with the reduced scheme structure\" and $\\mathrm{Gr}_\\mu$ as the open complement of the smaller closures, and states Prop. 2.1.5(1); printed p. 25 states (2) and computes $\\dim\\mathrm{Gr}_\\mu = (2\\rho,\\mu)$ inside the proof. Printed p. 26 carries (2.1.10) and Corollary 2.1.11 verbatim as transcribed in clause (5), including the phrase \"and therefore induces a map $\\mathfrak{p}\\colon\\pi_0(\\mathrm{Gr}_G)\\rightarrow\\mathbb{Z}/2$ by Theorem 1.3.11\" — which is the source, in the constant split setting of its §2, using the reduction $\\pi_1(\\underline{G}_F)_I = \\pi_1(G)$ that clause (4) displays.\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../../Q1/Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../../Q1/Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [$\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$, $\\Delta_{\\lambda,a}$ — stratum generating collections and the standard objects](../../../../appendix/not-standard-objects.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (blueprint notation, coined in the [Q2](../../../../dag.html) framing block and recorded here so that no node coins it again; main.tex names no such objects, and the two ingredients it does supply are the generation operation [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) at main.tex:502 and the locally closed embeddings $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) at main.tex:737). Let $X$ be a smooth affine spherical $G$-variety and $K = L^+G$. The two categories in play are the renormalized categories ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ of the whole loop space and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ of the spherical stratum $LX_\\lambda$ indexed by $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)); both are written out in full wherever they occur, and no abbreviation for either is introduced here or licensed elsewhere.\n\nA **generating collection** for the stratum $\\lambda$ is a small collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, indexed by a set $A_\\lambda$, which generates that category in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nLet $i_{\\lambda!}$ denote the left adjoint of the restriction functor $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ along the locally closed embedding $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html). Given a generating collection, the **standard objects** of the stratum $\\lambda$ are its images\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nWhen a single object suffices — $\\#A_\\lambda = 1$ — the index $a$ is dropped and one writes $E_\\lambda$ and $\\Delta_\\lambda = i_{\\lambda!}E_\\lambda$.\n\n**Two worked examples.** The definitions above fix symbols and settle nothing, so a reader cannot tell from them whether $A_\\lambda$ is ever bigger than a point, or what an $E_{\\lambda,a}$ looks like when it is. The two cases below are written out for that reason alone. Each is an *illustration of the notation*, not a claim this entry makes: the mathematics in both is asserted and proved at the node named, and a proof that needs either fact cites that node and never this paragraph.\n\n*Example 1 — one generator per stratum: $X = G$ under $G\\times G$.* Take $K = L^+G\\times L^+G$, so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ is the ordinary spherical Hecke situation and $\\Lambda_X^+$ is the set $\\Lambda^+$ of dominant coweights ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-
