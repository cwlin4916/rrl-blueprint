plus.html)), the stratum at $\\nu$ being the orbit $LX_\\nu = \\mathrm{Gr}_\\nu = L^+G\\cdot t^\\nu$. The stabilizer of $t^\\nu$ has connected finite-type reductive quotient — the centralizer $Z_G(\\nu)$, connected because a torus centralizer in a connected reductive group is — so the dualizing object generates the stratum on its own and the collection may be taken to be a single object:\n\n$$\n\\#A_\\nu = 1, \\qquad E_\\nu = \\omega_{K\\backslash LX_\\nu}, \\qquad \\Delta_\\nu = i_{\\nu!}\\,\\omega_{K\\backslash LX_\\nu} .\n$$\n\nThis is [Q2-e1-L1](../../Q2-e1/Q2-e1-L1/index.html), resting on [Q2-L2](../../Q2-L2/index.html)(i).\n\n*Example 2 — more than one, and the index set named: $X = \\mathrm{GL}_2/\\mathrm{O}_2$.* Here $LX = \\{A\\in\\mathrm{GL}_2(F) : A^t = A\\}$ with $K = \\mathrm{GL}_2(\\mathcal{O})$ acting by $g\\cdot A = gAg^t$ ([$F$, $\\mathcal{O}$](../../../../appendix/conv-ring-of-integers.html)), and the strata are indexed by pairs $\\lambda = (p,q)$ with $p\\ge q$. At a diagonal stratum $\\lambda = (p,p)$ the finite-type quotient of the stabilizer is $\\mathrm{O}_2$, whose component group is $\\mathbb{Z}/2$ with the two characters $\\mathrm{triv}$ and $\\mathrm{sgn} = \\det|_{\\mathrm{O}_2}$. One generator per character is then a generating collection, and two are needed:\n\n$$\nA_\\lambda = \\{\\mathrm{triv},\\ \\mathrm{sgn}\\}, \\qquad E_{\\lambda,\\mathrm{triv}} = \\omega_{K\\backslash LX_\\lambda}, \\qquad E_{\\lambda,\\mathrm{sgn}} = \\omega_{K\\backslash LX_\\lambda}\\otimes\\mathrm{sgn},\n$$\n\nwith $\\Delta_{\\lambda,\\mathrm{triv}} = i_{\\lambda!}E_{\\lambda,\\mathrm{triv}}$ and $\\Delta_{\\lambda,\\mathrm{sgn}} = i_{\\lambda!}E_{\\lambda,\\mathrm{sgn}}$ the two standard objects of that one stratum. The dualizing object alone does not generate: $\\mathrm{sgn}$ is right-orthogonal to it in every shift. This is [Q2-e3-L2](../../Q2-e3/Q2-e3-L2/index.html)(B), resting on [Q2-L2](../../Q2-L2/index.html)(ii)–(iii); the same node's clause (C) shows $\\#A_\\lambda = 4$ at every off-diagonal stratum, so the size of $A_\\lambda$ varies with $\\lambda$ within one $X$.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../appendix/ic-0.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) and [the Satake subcategories](../../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n### [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces
