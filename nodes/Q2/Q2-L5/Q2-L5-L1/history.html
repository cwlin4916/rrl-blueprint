the composite at once.\n- **2026-08-09 — why the ask shrank to a composition step.** [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html) landed for [Q1-L3](../../../Q1/Q1-L3/index.html) and settles the *bounded* convolution morphism $m_F$ on $\\overline{LG}_F\\times^{K}L^{+}X$, clauses (2) and (3), in exactly the sense [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv) requires. What it does **not** state is the same for $\\overline{m}_F$, whose second factor is $LX$ rather than $L^{+}X$, and that is what an iterated $\\pi_\\lambda$ needs, because a stage of the tower does not sit inside the jets. Clause (1) here is that statement; the entry's own untwisting — $\\overline{m}_F$ becomes $\\mathrm{pr}_2$ after an isomorphism, and $\\mathrm{Gr}_F$ is a projective $k$-scheme by [Zhu](../../../../appendix/bb-zhu-pi0-cartan.html)(2) — is available to a write-up as an argument it repeats for a different target, not as a clause it cites.\n- **2026-08-09 — the two formal facts this node runs on are the entry's own.** [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html) states, in the opening paragraph of its second note, that finite presentation in [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv)'s sense is stable under base change and under composition and is fppf-local on the target. Clause (2)'s downward induction is exactly those two applied to $\\rho_i = \\overline{m}_{F_i}\\circ(\\mathrm{id}\\times^{K}\\rho_{i+1})$, the middle morphism being the descent of $\\mathrm{id}\\times\\rho_{i+1}$ along the $K$-torsor over $\\mathrm{Gr}_{F_i}$; clause (3) is the same for $\\theta_i$ together with finite presentation of $\\overline{LG}_{F_i}\\subseteq LG$, which comes from $\\mathrm{Gr}_{F_i}$ being a closed subscheme of a finite-type stage of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(3).\n- **2026-08-09 — clause (4) is worded to refuse two things on purpose.** [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html) states its clause (i), compatibility with composition, for **ind-schemes**, and its hypotheses line says in as many words that a node wanting the correspondence formalism on a quotient prestack still owes it; and both that entry and [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html) close by asserting nothing about $\\mathcal{D}_c$ or $\\mathcal{D}^{\\mathrm{ren}}$. So this node stops at existence and base change, and the composition of pushforwards on quotient prestacks is a declared hypothesis of [Q2-L5-L2](../Q2-L5-L2/index.html) instead of a silent step here. That division is what makes both nodes one page.\n";</script>
