<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L1</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L1 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q2-L5-L1\n\n[node](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q2-L5-L1](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: instances\n\n## Precedent\n\n**What was searched.** Locally: `raskin_dmodules_infinite_var` (§3.16, Rem. 3.16.1, §6.3,\n§6.4, §6.13, Table 1 — read on the page this run), `zhu2016introduction` (§1.2, §2.1, §5.1),\n`chen2024real` (§11.1, §13), plus the reading records for `chenyi_2025singularitiesorbitclosuresloop`\nand the manuscript's own [Hecke-action convention](../../../../appendix/conv-hecke-action.html).\nOn the web: BKV arXiv:2003.01428, and Cautis–Williams arXiv:2306.03119.\n\n**What was found.**\n\n1. **Raskin, *D-modules on infinite dimensional varieties*, §3.16 (printed p. 15) and §6.3\n   (printed p. 34).** §3.16 verbatim: \"*We say that a morphism $f:\\mathcal{Y}\\to\\mathcal{Z}$\n   is finitely presented if it is schematic, and if for any $S\\to\\mathcal{Z}$ with\n   $S\\in\\mathsf{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\to S$ is finitely\n   presented … we obtain that there is a functor $f_{*,!-dR}$ compatible with base-change for\n   any finitely presented morphism $f$ of prestacks.*\" This **entails clause (4) outright,\n   given (1)–(3)**: the node's notion is §3.16's word for word, and the pushforward with base\n   change is asserted at prestack generality, so quotient prestacks are covered and Table 1's\n   different word is not needed. It reaches **no other clause**: the paper has no\n   affine-Grassmannian, loop-group or convolution material anywhere in §1–§6.\n   *The trap, checked and cleared.* §6.13 (printed p. 40) defines *ind-finitely presented*\n   as a genuinely different, colimit-level condition — \"$T=\\operatorname{colim}T_i$ with each\n   $T_i\\to T$ a reasonable subscheme such that $T_i\\to S$ factors through a reasonable\n   subscheme $S_i$ of $S$ with $T_i\\to S_i$ finite presentation\" — introduced to transport\n   dimension theories, and it is the word Table 1 (p. 3) uses. Clause (4) as written cites\n   §3.16 and so does **not** inherit §6.13's hypothesis. Separately, the proof of Lemma 6.4.6\n   (p. 34) invokes the two-out-of-three principle for finite presentation, \"[Gro]\n   Proposition 1.6.2\" — the cancellation the node's clauses (2)–(3) will need, in print, in\n   this exact setting.\n   `refs.bib`: `raskin_dmodules_infinite_var`.\n\n2. **Chen–Nadler, *Real groups, symmetric varieties and Langlands duality*, arXiv:2403.13995,\n   inside the proof of Thm. 13.3 (printed p. 57).** The closest thing in print to clauses\n   (1)–(2). For a placid presentation $X(\\mathcal{K})=\\operatorname{colim}_i\\lim_jY^i_j$ they\n   assert: the action map $a\\colon Y^i\\times^{G(\\mathcal{O})}\\overline{G(\\mathcal{O})t^\\lambda G(\\mathcal{O})}\\to X(\\mathcal{K})$\n   lands in a later stage $Y^{i'}$; \"*the induced map … is a proper morphism*\"; and by\n   [EGA IV, Thm. 8.10.5] it is the base change of a **proper morphism of finite-type schemes**\n   $\\bar a\\colon Z_j\\to Y^{i'}_j$ along a Cartesian square. **Which part it matches:** the\n   geometric content of clause (1) *stagewise* — the twisted product over a bounded Schubert\n   closure is schematic and proper over a stage of the ind-presentation of $LX$, which is\n   clause (1)'s conclusion after the colimit. **What it does not reach:** it is a step in a\n   proof, not a numbered statement; it asserts properness and finite-type descent, never\n   Raskin's prestack finite presentation, so the transport is unwritten; it is one $\\lambda$\n   and one stage, so the passage to $\\overline{m}_F$ over all of $LX$ — precisely where\n   \"finitely presented base change along **every** affine over the target\" is tested — is not\n   made; it is silent on the tower $\\rho_i$ for $i<r$, on $\\theta_i$, and on clause (4); and\n   its $X$ is a **complex symmetric** variety, narrower than the node's smooth affine $X$ of\n   finite type. `refs.bib`: `chen2024real` (duplicated as `chen2024realgroupssymmetricvarieties`).\n\n3. **Zhu, *An introduction to affine Grassmannians and the geometric Satake equivalence*,\n   arXiv:1603.05593.** The group case, classically. (1.2.14), printed p. 13: the untwisting\n   isomorphism $(\\mathrm{pr}_1,m)\\colon\\mathrm{Gr}\\,\\widetilde{\\times}\\,\\mathrm{Gr}\\cong\\mathrm{Gr}\\times\\mathrm{Gr}$\n   — the printed form of step (b) of [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html),\n   which is the mechanism of clause (1). Printed p. 28: $\\mathrm{Gr}_{\\le\\mu_1}\\widetilde{\\times}\\mathrm{Gr}_{\\le\\mu_2}$\n   \"*is closed in $\\mathrm{Gr}\\widetilde\\times\\mathrm{Gr}$ and therefore is representable*\",\n   the iterated $\\mathrm{Gr}_{\\le\\mu_\\bullet}$, and the convolution map (2.1.17)\n   $m\\colon\\mathrm{Gr}_{\\le\\mu_\\bullet}\\to\\mathrm{Gr}_{\\le|\\mu_\\bullet|}$. **Which part it\n   matches:** clause (2) at $X=H$ under $H\\times H$ — see instance 3 — and the representability\n   of every stage $Z^{(i)}$. **What it does not reach:** Zhu never uses the words *finitely\n   presented* of these maps, and the target there is $\\mathrm{Gr}$, ind-of-finite-type, never a\n   loop space of a variety; clauses (3) and (4) are untouched. `refs.bib`: `zhu2016introduction`.\n\n**What was not found.** No source states clause (1) with unbounded target, or clause (3) at\nall, in any generality. Two natural homes demonstrably do not contain them. Raskin is where\nthe *notion* lives and has no convolution geometry in it. The manuscript's own\n[Hecke-action convention](../../../../appendix/conv-hecke-action.html)\n(main.tex:1096–1102) asserts only that the convolution morphism is **ind-proper** — and\n[r1 of Q2-L5](../critiques/r1.html) already established that ind-properness implies neither\nschematicity nor finitely presented base change, so the manuscript's own line is not a\nprecedent. BKV arXiv:2003.01428 (not on disk, abstract and search only) is the remaining\ncandidate for a placid-stack version; its finiteness notion is for placid stacks rather than\nfor the prestack-schematic condition here, so a hit there would still need a transport.\nCautis–Williams arXiv:2306.03119 introduce *tamely presented* as a weakening of finitely\npresented \"*motivated by the study of convolution products in the double affine Hecke\ncategory*\" — evidence that finite presentation is known to be delicate for convolution in\ninfinite type, but they work with coherent sheaves and state nothing about $\\overline{m}_F$.\n\n## Instances\n\n### 1. $X = \\mathrm{pt}$ — instance\n\n**What it is.** $G$ any connected reductive group over the standing $k$, $X=\\mathrm{pt}$,\nany $\\nu_1,\\dots,\\nu_r$ dominant.\n\n**Why it is an instance.** $\\mathrm{pt}=\\operatorname{Spec}k$ is smooth affine of finite type,\nand $B$ has an open orbit on it, so it is spherical — the hypotheses of\n[$m_F$ finitely presented](../../../../appendix/fp-convolution-morphism.html)\nand of [context](../../../../context.html) both hold. Each $F_i=\\{\\nu_i\\}$ is finite.\n\n**What it matches.** Clauses (2) and (3) literally; clause (1) trivially. Here\n$LX=L^+X=\\mathrm{pt}$, so $Z^{(i)}\\cong\\overline{\\mathrm{Gr}}_{\\nu_i}\\widetilde{\\times}\\cdots\\widetilde{\\times}\\overline{\\mathrm{Gr}}_{\\nu_r}$,\nwhich is Zhu's $\\mathrm{Gr}_{\\le\\nu_\\bullet}$ — representable by his p. 28 and projective by\n[Zhu: Cartan, $\\dim\\mathrm{Gr}^\\mu$, $\\pi_0$](../../../../appendix/bb-zhu-pi0-cartan.html)(2).\n**What it does not reach:** with $LX$ a point, the only thing being tested is that a\nprojective $k$-variety is finitely presented over $k$. The whole difficulty of clauses (1)–(2)\n— an affine $S\\to LX$ factoring through a stage of an ind-scheme of ind-**infinite** type —\nis invisible.\n\n**What the statement says here.** $\\rho_i$ is the structure map of a projective $k$-variety,\n$\\theta_i$ its first-factor projection to $\\overline{\\mathrm{Gr}}_{\\nu_i}\\subseteq\\mathrm{Gr}$,\nand clause (4) is the ordinary finite-type $\\mathcal{D}$-module pushforward.\n\n**Source.** Zhu, arXiv:1603.05593, printed p. 28 (representability of\n$\\mathrm{Gr}_{\\le\\mu_\\bullet}$; (2.1.17)) — read this run. `refs.bib`: `zhu2016introduction`.\n\n### 2. Iwasawa–Tate: $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$ — instance\n\n**What it is.** $G=\\mathbb{G}_m$, $X=\\mathbb{A}^1$ by scaling; entry **K1** of the key-example\nregister. $\\Lambda^+=X_*(\\mathbb{G}_m)=\\mathbb{Z}$, all coweights dominant.\n\n**Why it is an instance.** $\\mathbb{A}^1$ is smooth affine of finite type, spherical with open\norbit $\\mathbb{G}_m$; $\\mathbb{G}_m$ is connected reductive. $\\mathrm{Gr}_{\\mathbb{G}_m}$ is\ndiscrete, so $\\overline{\\mathrm{Gr}}_n=\\{n\\}$ and $\\mathrm{Gr}_F$ is a finite reduced, hence\nprojective, $k$-scheme — the input step (c) of the appendix entry needs.\n\n**What it matches.** Clauses (1), (2) and (4). Since $\\overline{LG}_{\\{n\\}}=t^nL^+\\mathbb{G}_m$,\n$\\overline{m}_{\\{n\\}}$ is $y\\mapsto t^ny$, an **isomorphism** of $L\\mathbb{A}^1$; and with\n$n_i:=\\nu_i+\\cdots+\\nu_r$, $Z^{(i)}\\cong L^+\\mathbb{A}^1$ with $\\rho_i(x)=t^{n_i}x$. Finite\npresentation of $\\rho_i$ is therefore exactly clause (1) of the appendix entry, made explicit:\ninside the stage $t^{-j}k[[t]]$ the image is cut out by the finitely many coefficient\nfunctions $a_{-j},\\dots,a_{n_i-1}$. **What it does not reach:** clause (3) degenerates —\n$LG\\times^K LX\\cong\\coprod_{\\mathbb{Z}}L\\mathbb{A}^1$ and $\\theta_i$ is an open-and-closed\nembedding — and no positive-dimensional $\\overline{\\mathrm{Gr}}_\\nu$ occurs, so nothing here\nexercises the twisted-product descent, step (d) of the appendix entry.\n\n**What the statement says here.** Every $\\rho_i$ is the finitely presented closed embedding\n$t^{n_i}k[[t]]\\hookrightarrow k((t))$, and clause (4) gives its $\\mathcal{D}^!$-pushforward.\n\n**Source.** `BZSV`, Ex. 7.3.5 with (7.8) (the presentation $X^l_n(R)=t^{-l}R[t]/t^n$) as\nrecorded in [key_examples](../../../../key_examples/index.html) K1; the finite-presentation\ncomputation is a routine specialisation of the appendix entry **(constructed, unsourced)**.\n\n### 3. The group case $X = H$ under $G = H\\times H$, worked for $H=\\mathrm{SL}_2$ — instance\n\n**What it is.** $H$ connected reductive, $X=H$ with $(g_1,g_2)\\cdot x=g_1xg_2^{-1}$; entry\n**K9**. Take $F_i=\\{(\\nu_i,0)\\}$, so only the left factor moves.\n\n**Why it is an instance.** $H$ is smooth affine of finite type and spherical for $H\\times H$\n(the big cell is the open $B\\times B^-$-orbit); $H\\times H$ is connected reductive.\n\n**What it matches.** Clause (2), both halves, and clause (1) after untwisting. Unwinding the\ntwisted products, $Z^{(1)}\\cong\\overline{LH}_{\\nu_1}\\times^{L^+H}\\cdots\\times^{L^+H}\\overline{LH}_{\\nu_r}$\nwith $\\rho_1(g_1,\\dots,g_r)=g_1\\cdots g_r$, and $K\\backslash Z^{(1)}\\to K\\backslash LX$ is\n$L^+H\\backslash$ of **Zhu's (2.1.17)**, $m\\colon\\mathrm{Gr}_{\\le\\nu_\\bullet}\\to\\mathrm{Gr}_{\\le|\\nu_\\bullet|}\\subseteq\\mathrm{Gr}$.\nFor $H=\\mathrm{SL}_2$, $r=2$, $\\nu_1=\\nu_2=\\alpha^\\vee$: $\\mathrm{Gr}_{\\le\\alpha^\\vee}$ is the\nprojective cone over $\\{x^2=yz\\}\\subset\\mathbb{P}^2$ (Zhu, Ex. 2.1.16), its twisted square is\nthe projective $\\mathbb{P}(\\mathcal{L}_\\theta\\oplus\\mathcal{O})$-bundle over it (Lemma 2.1.14),\nand $m$ is a projective morphism of projective surfaces — schematic, proper, finitely\npresented. **What it does not reach:** Zhu's target is $\\mathrm{Gr}$, ind-of-**finite** type,\nso the step that costs work for a general $LX$ is absent; the choice $F_i=\\{(\\nu_i,0)\\}$ uses\nonly left translations, and a general $F\\subseteq\\Lambda^+_{H\\times H}$ is not covered by\n(2.1.17); and nothing here is stated in the prestack idiom, so the last step to\n[Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv) is the\nnode's own.\n\n**What the statement says here.** The iterated convolution\n$L^+H\\backslash\\mathrm{Gr}_{\\le\\nu_\\bullet}\\to L^+H\\backslash\\mathrm{Gr}$ is finitely presented,\nso it has a $\\mathcal{D}^!$-pushforward compatible with $!$-base change.\n\n**Source.** Zhu, arXiv:1603.05593, printed p. 28 ((2.1.17); representability), p. 27\n(Lemma 2.1.14, Ex. 2.1.16), p. 13 ((1.2.14)) — all read this run. `refs.bib`: `zhu2016introduction`.\n\n### 4. Boundary: $F$ infinite, where clause (1) fails — instance\n\n**What it is.** The same data with $F=\\Lambda^+$, so $\\mathrm{Gr}_F=\\mathrm{Gr}$ and\n$\\overline{m}_{\\Lambda^+}\\colon LG\\times^K LX\\to LX$.\n\n**Why it is an instance.** Every hypothesis of the node holds except the **finiteness of $F$**,\nwhich clause (1) declares.\n\n**What it matches.** Clause (1), negatively, and it shows the finiteness of $F$ is doing work.\nBy Zhu's (1.2.14) the untwisting gives $LG\\times^K LX\\cong\\mathrm{Gr}\\times LX$ over $LX$, so\nthe base change along an affine $S\\to LX$ is $\\mathrm{Gr}\\times S\\to S$; $\\mathrm{Gr}$ is an\nind-scheme of ind-finite type and not a scheme for $G\\neq1$ (Zhu, Thm. 1.2.2), so this is not\nschematic and $\\overline{m}_{\\Lambda^+}$ is not finitely presented. **What it does not touch:**\nthis is no threat to clause (3), whose *target* is the unbounded $K\\backslash(LG\\times^K LX)$\n— clause (3) asserts finite presentation of $\\theta_i$, not of that target's structure map.\n\n**What the statement says here.** Nothing: the statement quantifies over finite $F$, and the\nunbounded convolution falls outside it, exactly as the appendix entry's hypotheses line\nalready records for its own clauses (2)–(3).\n\n**Source.** Zhu, arXiv:1603.05593, Thm. 1.2.2 and (1.2.14), printed pp. 10 and 13 — read this\nrun. `refs.bib`: `zhu2016introduction`.\n";</script>
