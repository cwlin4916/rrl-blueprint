eme](../../../appendix/thm-chen-ti.html),\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda .\n$$\n\nCoherence is [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), the renormalized category is $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html).\n\n### The recollement package, and which clause is standing\n\n[Q3](../../Q3/index.html) asks for which $X$ the three clauses below hold, and states them canonically. They are written out in full here because Q2 spends them one at a time and a reader must be able to check which: **(H1)** is in force throughout Q2, and **(H2)** and **(H3)** are not.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n**(H1) is standing; the other two are spent by name.** Q2 assumes **(H1)** everywhere and proves it nowhere — discharging it is [Q1](../../Q1/index.html)'s business, and it is what makes $i_{\\lambda!}$ exist, so without it the question below has no subject.\n\n**(H2)** and **(H3)** are what make the standard objects *generate* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. Generating is a different question from belonging, and belonging is what is asked here.\n\nThe two enter only where the membership is cashed in for [Q1](../../Q1/index.html)'s equality, at [Q2-L1](../Q2-L1/index.html)(ii), and each node that spends one names it at the point of use. A node needing a fourth hypothesis has found one and must say so.\n\n**Repository problem.** For which $X$ in the standing class does $!$-extension from every stratum land in the Satake subcategory:\n\n$$\ni_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right)\\ \\subseteq\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} \\qquad\\text{for every }\\lambda\\in\\Lambda_X^+\\ ?\n$$\n\nStating it costs **(H1)** and nothing else, because **(H1)** is what makes $i_{\\lambda!}$ exist. Equivalently, in the form the nodes work in: every **standard object** $\\Delta_{\\lambda,a} = i_{\\lambda!}E_{\\lambda,a}$ of a stratum lies in the subcategory ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html); notation [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)).\n\n**What counts as an answer.** Geometric hypotheses on $X$ under which the membership provably holds, together with an $X$ in the standing class where it provably fails — and never a reformulation of the membership itself, which conditions nothing aken $K$-equivariantly, so that $\\pi_{\\lambda!}$ of the constant object computes the Hecke translate $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$ with $\\mathcal{F}_{\\nu_i}$ the constant object on $K\\backslash\\overline{\\mathrm{Gr}}_{\\nu_i}$ ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html)). Assume:\n\n**(a) Ind-proper, onto the closure.** $\\pi_\\lambda$ is ind-proper with scheme-theoretic image $\\overline{LX}_\\lambda$.\n\n**(b) Cohomologically trivial over the open stratum.** There is $n_\\lambda\\in\\mathbb{Z}$ such that for every $k$-point $x\\in LX_\\lambda$,\n\n$$\nH^\\bullet_{\\mathrm{dR},c}\\left(\\pi_\\lambda^{-1}(x)\\right)\\ \\simeq\\ k[-n_\\lambda],\n$$\n\nand the resulting rank-one local system on $LX_\\lambda$ is trivial.\n\nThen $P_\\lambda := \\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$ satisfies\n\n$$\nP_\\lambda\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\\qquad \\operatorname{supp}\\left(P_\\lambda\\right)\\subseteq\\overline{LX}_\\lambda,\\qquad i_\\lambda^!P_\\lambda\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\ \\omega_{K\\backslash LX_\\lambda}\\left[n_\\lambda\\right],\n$$\n\n**What this delivers, and what it does not.** Hypothesis **(D)** of [Q2-L3](../Q2-L3/index.html) asks for a triangular lift of $E_{\\lambda,a}$ for **every** $a\\in A_\\lambda$. The conclusion above is that lift at the one index whose generator is the dualizing object, $E_{\\lambda,a} = \\omega_{K\\backslash LX_\\lambda}$, and at no other. It therefore discharges **(D)** at $\\lambda$ exactly when $\\#A_\\lambda = 1$ and the generating collection is taken to be that object — the case [Q2-L2](../Q2-L2/index.html)(i) supplies, from connectedness of the stabilizer quotient. When $\\#A_\\lambda > 1$ this statement is silent on the remaining generators: by [Q2-L2](../Q2-L2/index.html)(ii) they need not lie in the subcategory $\\omega_{K\\backslash LX_\\lambda}$ generates, so no argument recovers them from the conclusion above. Which correspondences, if any, lift a non-trivial $E_{\\lambda,a}$ is open, and no node of [Q2](../../../dag.html) states a criterion for it.\n\nTwo identifications are part of what is to be proved and are not imported: that $\\pi_{\\lambda!}$ of the constant object on $Z_\\lambda$ is the iterated convolution named above, and the normalizing shift relating the constant object on $K\\backslash L^+X$ to $\\omega_{K\\backslash L^+X}$, which is absorbed into $n_\\lambda$.\n\n## Direct prerequisites\n\n### [Q2-L5-L1](Q2-L5-L1/index.html) — Every stage of the convolution tower is finitely presented\n\n- **current effective status:** ready\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nLet $k$, $G$, $K = L^{+}G$ and $X$ be as in [the standing notation](../../../appendix/subsec-notations.html), let $\\Lambda^{+} := X_*(T)^{+}$, and fix $\\lambda\\in\\Lambda_X^{+}$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) together with dominant coweights $\\nu_1,\\dots,\\nu_r$ as in [Q2-L5](index.html). For a finite $F\\subseteq\\Lambda^{+}$ let $\\mathrm{Gr}_F$, $\\overline{LG}_F$ and the fppf quotient $\\overline{LG}_F\\times^{K}(-)$ be as in [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../appendix/fp-convolution-morphism.html), put $F_i := \\{\\nu_i\\}$, and set\n\n$$\nZ^{(r+1)} := L^{+}X, \\qquad Z^{(i)} := \\overline{LG}_{F_i}\\times^{K}Z^{(i+1)}\\quad(i = r,\\dots,1),\n$$\n\nwhich is the twisted product written $\\overline{\\mathrm{Gr}}_{\\nu_i}\\,\\widetilde{\\times}\\,(-)$ in [Q2-L5](index.html), so that $Z^{(1)}$ is that node's $Z_\\lambda$. Let $\\rho_{r+1}\\colon L^{+}X\\hookrightarrow LX$ be the jet embedding and, downwards in $i$,\n\n$$\n\\rho_i\\colon Z^{(i)}\\longrightarrow LX,\\qquad [g,z]\\longmapsto g\\cdot\\rho_{i+1}(z),\n$$\n\nso that $\\rho_1$ is that node's $\\pi_\\lambda$. Write $\\overline{m}_F\\colon\\overline{LG}_F\\times^{K}LX\\rightarrow LX$, $[g,y]\\mapsto g\\cdot y$, and let\n\n$$\n\\theta_i\\colon\\ K\\backslash Z^{(i)}\\longrightarrow K\\backslash\\left(LG\\times^{K}LX\\right),\\qquad [g,z]\\longmapsto[g,\\rho_{i+1}(z)]\\quad(i\\le r).\n$$\n\nThroughout, *finitely presented* means the prestack notion of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) — schematic in the classical sense, with finitely presented base change along every affine scheme over the target. Then:\n\n**(1) The convolution morphism with unbounded target.** For every finite $F\\subseteq\\Lambda^{+}$ the morphism $\\overline{m}_F$ is finitely presented, and so is the induced morphism of quotient prestacks $K\\backslash\\left(\\overline{LG}_F\\times^{K}LX\\right)\\rightarrow K\\backslash LX$.\n\n**(2) Every stage of the tower.** For every $i\\in\\{1,\\dots,r+1\\}$ the morphism $\\rho_i$ is finitely presented, and so is the induced morphism of quotient prestacks $K\\backslash Z^{(i)}\\rightarrow K\\backslash LX$. In particular this holds for $\\rho_1 = \\pi_\\lambda$.\n\n**(3) The embeddings into the convolution diagram.** For every $i\\le r$ the morphism $\\theta_i$ is finitely presented.\n\n**(4) What the sheaf theory then supplies, and what it does not.** By [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) each of the morphisms in (1)–(3) carries a pushforward $f_{*,!-\\mathrm{dR}}$ on the theory $\\mathcal{D}^{!}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), compatible with base change against $!$-pullback along an arbitrary morphism of prestacks. No clause here asserts compatibility with composition on quotient prestacks, and none asserts anything about $\\mathcal{D}_c$ or $\\mathcal{D}^{\\mathrm{ren}}$.\n\n### [Q2-L5-L2](Q2-L5-L2/index.html) — The pushforward along $\\pi_\\lambda$ is the Hecke word, one letter at a time\n\n- **current effective status:** open\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nNotation as in [Q2-L5-L1](Q2-L5-L1/index.html): the stages $Z^{(i)}$ with $Z^{(1)} = Z_\\lambda$ and $Z^{(r+1)} = L^{+}X$, the morphisms $\\rho_i$ with $\\rho_1 = \\pi_\\lambda$, and the morphisms $\\theta_i$ into the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash LX\\ \\xleftarrow{\\ p\\ }\\ K\\backslash\\left(LG\\times^{K}LX\\right)\\ \\xrightarrow{\\ q\\ }\\ K\\backslash LX\n$$\n\nof [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), with $\\ast$ computed as $q_{*,!-\\mathrm{dR}}\\,p^{!}(-\\boxtimes-)$ by ratified reading 4 of [context](../../../context.html). That formula is applied below on $\\mathcal{D}^{!}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)), and no clause here asserts coherence of any input or output. For $\\nu\\in\\Lambda^{+}$ let $\\overline{\\iota}_\\nu\\colon K\\backslash\\overline{\\mathrm{Gr}}_\\nu\\hookrightarrow K\\backslash\\mathrm{Gr}$ be the closed embedding of the Schubert closure ([$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(2)–(3)) and put\n\n$$\n\\mathcal{F}_\\nu\\ :=\\ \\overline{\\iota}_{\\nu!}\\left(k_{K\\backslash\\overline{\\mathrm{Gr}}_\\nu}\\right),\n$$\n\nthe $!$-extension of the constant object ([$k_{\\mathcal{Y}}$](../../../appendix/not-constant-object.html)); this fixes the extension that [Q2-L5](index.html) leaves unnamed. Assume:\n\n**(A) Pushforward composes on quotient prestacks.** For finitely presented morphisms $f\\colon\\mathcal{Y}\\rightarrow\\mathcal{Y}'$ and $g\\colon\\mathcal{Y}'\\rightarrow\\mathcal{Y}''$ of prestacks in the sense of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv), the canonical map\n\n$$\n\\left(g\\circ f\\right)_{*,!-\\mathrm{dR}}\\ \\longrightarrow\\ g_{*,!-\\mathrm{dR}}\\circ f_{*,!-\\mathrm{dR}}\n$$\n\nis an equivalence. Clause (i) of that entry asserts this for **ind-schemes** only, and its hypotheses line says the prestack case is still owed, so it is assumed here and used only for the composites $q\\circ\\theta_i$.\n\n**(B) The bottom of the tower extends to $\\mathrm{IC}_0$.** There is $\\mathcal{M}^{(r+1)}\\in\\mathcal{D}^{!}\\left(K\\backslash L^{+}X\\right)$ with\n\n$$\n\\rho_{r+1,*,!-\\mathrm{dR}}\\left(\\mathcal{M}^{(r+1)}\\right)\\ \\simeq\\ \\mathrm{IC}_0\n$$\n\nin $\\mathcal{D}^{!}(K\\backslash LX)$, for $\\mathrm{IC}_0$ the imported object of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html).\n\n**(C) Each letter has a twisted product with the stage below it.** For every $i\\le r$ there is $\\mathcal{M}^{(i)}\\in\\mathcal{D}^{!}\\left(K\\backslash Z^{(i)}\\right)$ with\n\n$$\np^{!}\\left(\\mathcal{F}_{\\nu_i}\\boxtimes\\rho_{i+1,*,!-\\mathrm{dR}}\\mathcal{M}^{(i+1)}\\right)\\ \\simeq\\ \\theta_{i,*,!-\\mathrm{dR}}\\left(\\mathcal{M}^{(i)}\\right).\n$$\n\nThen:\n\n**(1) The tower sits over the convolution diagram.** $q\\circ\\theta_i = \\rho_i$ for every $i\\le r$.\n\n**(2) One letter at a time.** For every $i\\le r$,\n\n$$\n\\mathcal{F}_{\\nu_i}\\ast\\left(\\rho_{i+1,*,!-\\mathrm{dR}}\\mathcal{M}^{(i+1)}\\right)\\ \\simeq\\ \\rho_{i,*,!-\\mathrm{dR}}\\left(\\mathcal{M}^{(i)}\\right).\n$$\n\n**(3) The whole word.** Consequently\n\n$$\n\\pi_{\\lambda,*,!-\\mathrm{dR}}\\left(\\mathcal{M}^{(1)}\\right)\\ \\simeq\\ \\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0\\ =\\ P_\\lambda ,\n$$\n\nwhich is the first of the two identifications [Q2-L5](index.html) reserves as unimported. The object $\\mathcal{M}^{(1)}$ delivered by **(C)** is the reading this node fixes for that node's phrase *the constant object on $Z_\\lambda$*, which [$k_{\\mathcal{Y}}$](../../../appendix/not-constant-object.html) does not define on $K\\backslash Z_\\lambda$.\n\n### [Q2-L5-L3](Q2-L5-L3/index.html) — What the strata see of $\\pi_{\\lambda!}$: vanishing off the closure, and the costalk on the stratum\n\n- **current effective status:** open\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nNotation as in [Q2-L5](index.html) and [Q2-L5-L1](Q2-L5-L1/index.html). Let $i_\\mu\\colon K\\backslash LX_\\mu\\rightarrow K\\backslash LX$ be the locally closed embeddings of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), write $\\mu\\le\\lambda$ for $LX_\\mu\\subseteq\\overline{LX}_\\lambda$ on $\\Lambda_X^{+}$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html), [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html)) as [Q2-L3](../Q2-L3/index.html) does, and let $U := LX\\smallsetminus\\overline{LX}_\\lambda$ with $j_U\\colon K\\backslash U\\hookrightarrow K\\backslash LX$ its open embedding. Fix $\\mathcal{M}\\in\\mathcal{D}^{!}\\left(K\\backslash Z_\\lambda\\right)$, arbitrary, and put\n\n$$\n\\Pi\\ :=\\ \\pi_{\\lambda,*,!-\\mathrm{dR}}\\left(\\mathcal{M}\\right)\\ \\in\\ \\mathcal{D}^{!}\\left(K\\backslash LX\\right).\n$$\n\nFor a morphism $\\varphi$ into $K\\backslash LX$ write $\\psi_\\varphi$ and $\\pi_\\lambda^{\\varphi}$ for the two legs of the base change of $\\pi_\\lambda$ along $\\varphi$. Assume:\n\n**(A) Finite presentation.** $\\pi_\\lambda$, as a morphism of quotient prestacks, is finitely presented in the sense of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) — which is clause (2) of [Q2-L5-L1](Q2-L5-L1/index.html).\n\n**(B) Ind-proper, onto the closure.** $\\pi_\\lambda$ is ind-proper with scheme-theoretic image $\\overline{LX}_\\lambda$ — hypothesis **(a)** of [Q2-L5](index.html), of which only the assertion about the image is used below.\n\nThen:\n\n**(1) Base change to a stratum.** For every $\\mu\\in\\Lambda_X^{+}$ there is a canonical equivalence $i_\\mu^{!}\\,\\Pi\\simeq\\pi^{i_\\mu}_{\\lambda,*,!-\\mathrm{dR}}\\,\\psi_{i_\\mu}^{!}\\mathcal{M}$, and likewise with $i_\\mu$ replaced by $j_U$.\n\n**(2) Vanishing off the closure, and the support bound.** For every $\\mu\\in\\Lambda_X^{+}$ with $\\mu\\not\\le\\lambda$ the base change of $\\pi_\\lambda$ along $i_\\mu$ has empty source, so $i_\\mu^{!}\\,\\Pi\\simeq 0$; the same holds along $j_U$, so $j_U^{!}\\,\\Pi\\simeq 0$ and hence\n\n$$\n\\operatorname{supp}\\left(\\Pi\\right)\\ \\subseteq\\ \\overline{LX}_\\lambda\n$$\n\nin the sense of [$\\operatorname{supp}$](../../../appendix/not-supp.html).\n\n**(3) The renormalized form.** If in addition $\\Pi$ lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) and the functors $i_\\mu^{!}$ there are the ind-extensions of the ones used in (1)–(2), then $\\Pi\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$ in the notation of [Q2-L3](../Q2-L3/index.html).\n\n**(4) The costalk, under a normalization over the open stratum.** If moreover there is $n_\\lambda\\in\\mathbb{Z}$ with\n\n$$\n\\pi^{i_\\lambda}_{\\lambda,*,!-\\mathrm{dR}}\\left(\\psi_{i_\\lambda}^{!}\\mathcal{M}\\right)\\ \\simeq\\ \\omega_{K\\backslash LX_\\lambda}\\left[n_\\lambda\\right]\n$$\n\nin $\\mathcal{D}^{!}(K\\backslash LX_\\lambda)$ ([$\\omega_{\\mathcal{Y}}$](../../../appendix/not-dualizing-object.html)), then $i_\\lambda^{!}\\,\\Pi\\simeq\\omega_{K\\backslash LX_\\lambda}[n_\\lambda]$. This displayed condition is what fixes the integer $n_\\lambda$ of [Q2-L5](index.html)'s conclusion, and it is the only place a normalization enters.\n\n### [Q2-L5-L4](Q2-L5-L4/index.html) — The Hecke letters are coherent, and any word applied to $\\mathrm{IC}_0$ is a Satake generator\n\n- **current effective status:** ready\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nLet $k$, $G$, $K = L^{+}G$ and $X$ be as in [the Satake subcategories](../../../appendix/def-satake-subcategory.html), let $\\Lambda^{+} := X_*(T)^{+}$, and for $\\nu\\in\\Lambda^{+}$ let $\\overline{\\iota}_\\nu\\colon K\\backslash\\overline{\\mathrm{Gr}}_\\nu\\hookrightarrow K\\backslash\\mathrm{Gr}$ be the closed embedding of the Schubert closure ([$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(2)–(3)); by [Zhu](../../../appendix/bb-zhu-pi0-cartan.html)(2) the scheme $\\overline{\\mathrm{Gr}}_\\nu$ is a projective $k$-variety. Put\n\n$$\n\\mathcal{F}_\\nu\\ :=\\ \\overline{\\iota}_{\\nu!}\\left(k_{K\\backslash\\overline{\\mathrm{Gr}}_\\nu}\\right)\\ \\in\\ \\mathcal{D}^{!}\\left(K\\backslash\\mathrm{Gr}\\right),\n$$\n\nthe $!$-extension of the constant object ([$k_{\\mathcal{Y}}$](../../../appendix/not-constant-object.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)), and let coherence be [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html). Then:\n\n**(1) The letter is coherent on its closure.** $k_{K\\backslash\\overline{\\mathrm{Gr}}_\\nu}\\in\\mathcal{D}_c\\left(K\\backslash\\overline{\\mathrm{Gr}}_\\nu\\right)$ for every $\\nu\\in\\Lambda^{+}$.\n\n**(2) And after extension.** $\\mathcal{F}_\\nu\\in\\mathcal{D}_c\\left(K\\backslash\\mathrm{Gr}\\right)$ for every $\\nu\\in\\Lambda^{+}$.\n\n**(3) Words are coherent, and a word acts as one letter.** For dominant coweights $\\nu_1,\\dots,\\nu_r$ the convolution $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}$, formed in the monoidal category $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ of [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), lies in $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, and for every $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)$ the module associativity of that entry gives\n\n$$\n\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathcal{G}\\ \\simeq\\ \\left(\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\right)\\ast\\mathcal{G}.\n$$\n\n**(4) Any coherent letter applied to $\\mathrm{IC}_0$ is a Satake generator.** For every $\\mathcal{B}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ one has $\\mathcal{B}\\ast\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$ and\n\n$$\n\\mathcal{B}\\ast\\mathrm{IC}_0\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe subcategory generated inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html)) by clause (1) of [the Satake subcategories](../../../appendix/def-satake-subcategory.html). With (2) and (3) this gives $P_\\lambda\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$, the first conclusion of [Q2-L5](index.html), for the letters $\\mathcal{F}_{\\nu_i}$ fixed above.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the standing notation](../../../appendix/subsec-notations.html) — `subsec:notations`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n### [the three standing hypotheses](../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../appendix/conj-intro.html) holds for $X$.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n- **note:** *the ambient $\\mathcal{C}$ is part of the data and main.tex does not name it at the point of use, which is why the blueprint writes it as a subscript everywhere.* See the ratification recorded at [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and in [Q1-L1](../../Q1/Q1-L1/index.html): for Satake subcategories the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$. \"Cocomplete stable\" is strictly stronger than \"thick\"; $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits, not merely finite ones and retracts.\n- **note:** **Where the presentability comes from, verified on the page.** GR's standing convention is footnote 8 to §5.1.5 of [[GR17vol1](../../../../papers/GR17vol1.pdf)] (printed p. 51, PDF p. 88), attached to the sentence defining \"cocomplete\": *\"When talking about cocomplete categories we will always assume that they are presentable.\"* So GR's \"cocomplete stable category\" means \"presentable stable category\", and §5.4.1 opens \"Let $\\mathbf{C}$ be an object of $1\\text{-Cat}^{\\mathrm{St,cocmpl}}$\". The convention is load-bearing rather than decorative: the printed proof of Prop. 5.4.5 (p. 55, PDF p. 92) forms the smallest cocomplete stable full subcategory $\\mathbf{C}'\\subseteq\\mathbf{C}$ and continues *\"The inclusion $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ admits an (a priori non-continuous) right adjoint\"*, which is the Adjoint Functor Theorem in GR's form: Thm. 2.5.4(a) (printed p. 32, PDF p. 69), *\"Any morphism in $1\\text{-Cat}_{\\mathrm{Prs}}$, viewed as a functor between $(\\infty,1)$-categories, admits a right adjoint\"*, stated there for **presentable** categories. Footnote 3 of that page, hanging off §2.5.1 where $1\\text{-Cat}_{\\mathrm{Prs}}$ is introduced, says presentability *\"is necessary for the Adjoint Functor Theorem to hold\"* and adds that they *\"will omit the adjective 'presentable' even when it should properly be there\"*. It is that right adjoint the proof uses to pass from the vanishing to $\\mathbf{C}'=\\mathbf{C}$, so the hypothesis is consumed exactly in the direction *orthogonality $\\Rightarrow$ generation*.\n- **note:** **Why the converse direction is free.** *Generation $\\Rightarrow$ orthogonality* needs only minimality: by [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html), applied with $\\mathcal{D}=\\mathcal{C}$, $T=\\{c_\\alpha\\}$ and $M=c$, the displayed vanishing puts every $c_\\alpha$ in ${}^{\\perp_{\\mathcal{C}}}c$, hence puts $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ there; if that is all of $\\mathcal{C}$ then $c\\in{}^{\\perp_{\\mathcal{C}}}c$, so $\\operatorname{Map}_{\\mathcal{C}}(c,c)=0$ and $c=0$. No presentability, and no circularity — that entry invokes this one through the minimality description alone.\n- **note:** **Two discrepancies with the printed sources, and the readings in force.** (a) The attribution is to both numbers because the entry carries both halves: the display is verbatim [[GR17vol1, Def. 5.4.1](../../../../papers/GR17vol1.pdf)], which is GR's *definition* of \"generate\", while the biconditional with the smallest-subcategory description is [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] (\"A collection $\\{c_\\alpha\\}$ of objects generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory that contains all $c_\\alpha$\"). (b) main.tex:511–513 prints the vanishing as \"$\\forall i\\ge 0$\" with no quantifier on $\\alpha$; GR print \"$\\forall\\alpha$, $\\forall i=0,1,\\dots$\", and the reading in force is GR's, restored in the display above. GR write the vanishing itself as $\\mathrm{Maps}_{\\mathbf{C}}(c_\\alpha[-i],c)=\\ast$ in Def. 5.4.1 and as $=0$ inside the proof of Prop. 5.4.5, main.tex writing $=0$; by [`Ani`, `Map`, `underline-Map`](../../../appendix/conv-anima.html) the value is an anima, and both notations say that it is contractible. What is *not* settled by notation is the **range of shifts**: this display tests $i\\ge 0$ only, so an argument needing closure under all of $\\mathbb{Z}$ must reconcile the two ranges, which is clause (1) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html).\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../appendix/conv-d-shriek-d-star.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n### [$\\omega_{\\mathcal{Y}}$ — the dualizing object of a prestack](../../../appendix/not-dualizing-object.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (blueprint notation; main.tex uses no symbol for this object — the letter $\\omega$ appears in the manuscript only as the compactness superscript $(-)^\\omega$ of [compact objects](../../../appendix/def-compact-objects.html), main.tex:523. What the notation names is the $!$-pullback of the unit along the structure map in the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), main.tex:651–668). Let $\\mathcal{Y}\\in\\mathrm{PreStk}$ with structure map $p_{\\mathcal{Y}}\\colon\\mathcal{Y}\\rightarrow\\mathrm{pt}$, and identify $\\mathcal{D}^!(\\mathrm{pt}) = \\mathrm{Vect}$ with unit $k$ ([`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html)). The **dualizing object** of $\\mathcal{Y}$ is\n\n$$\n\\omega_{\\mathcal{Y}} := p_{\\mathcal{Y}}^!(k)\\ \\in\\ \\mathcal{D}^!(\\mathcal{Y}).\n$$\n\nSince $\\mathcal{D}^!$ is a functor on $\\mathrm{PreStk}^{op}$, every morphism $f\\colon\\mathcal{Y}'\\rightarrow\\mathcal{Y}$ satisfies $p_{\\mathcal{Y}'} = p_{\\mathcal{Y}}\\circ f$ and hence carries a canonical identification\n\n$$\nf^!\\,\\omega_{\\mathcal{Y}}\\ \\simeq\\ \\omega_{\\mathcal{Y}'} .\n$$\n\nFor $S$ a nonempty scheme of finite type this is the usual dualizing complex: $\\omega_S\\in\\mathcal{D}_c(S)$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) and $\\omega_S\\neq 0$.\n\n### [$k_{\\mathcal{Y}}$ — the constant object, and where this appendix stops defining it](../../../appendix/not-constant-object.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (blueprint notation; main.tex names the object three times and defines it nowhere — main.tex:79–80, \"the $!$-extension of constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$\"; main.tex:788, \"the constant $\\mathcal{D}$-modules on the classifying stack for a complex reductive group $G$ is coherent but not compact\"; main.tex:953, \"the constant $\\mathcal{D}$-module on $L^+X$\". Recorded here so that no node coins it again, and so that the place where it is *not* available is written down once instead of being assumed at each use).\n\nLet $S$ be a scheme of finite type over $k$, with structure morphism $a_S\\colon S\\rightarrow\\mathrm{pt}$. The **constant object** of $S$ is\n\n$$\nk_S\\ :=\\ a_S^{*}(k)\\ \\in\\ \\mathcal{D}(S),\n$$\n\nthe $*$-pullback of the unit $k\\in\\mathcal{D}(\\mathrm{pt}) = \\mathrm{Vect}$ ([`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html)) along the structure morphism, taken in the $\\mathcal{D}$-module theory of finite-type schemes that [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) Kan-extends. For an affine group scheme $H$ acting on such an $S$, the constant object of the quotient prestack is\n\n$$\nk_{H\\backslash S}\\ \\in\\ \\mathcal{D}(H\\backslash S),\n$$\n\nnamely $k_S$ carrying its canonical $H$-equivariant structure.\n\n**Comparison with the dualizing object, on the smooth locus only.** If $S$ is in addition smooth of pure dimension $d$ over $k$, then in the normalization of [$\\omega_{\\mathcal{Y}}$](../../../appendix/not-dualizing-object.html), where $\\omega_S$ is the usual dualizing complex of a finite-type scheme,\n\n$$\n\\omega_S\\ \\simeq\\ k_S[2d] .\n$$\n\nFor a singular $S$ nothing of the kind is asserted: the two objects are then not shifts of one another in general, and a comparison between them on such an $S$ — on a Schubert closure $\\overline{\\mathrm{Gr}}_\\nu$ with $\\nu$ not minuscule, say ([$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)) — is a claim its user owes.\n\n### [$\\operatorname{supp}$ — the support of a sheaf](../../../appendix/not-supp.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (blueprint notation, coined in the Setup of [Q1-L3-L2](../../Q1/Q1-L3/Q1-L3-L2/index.html) and repeated at [Q1-L3-L3-L1](../../Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html), and recorded here so that no node coins it again. main.tex writes no support operator; what the definition below uses is the contravariant functoriality of $\\mathcal{D}^!$ on prestacks at main.tex:651–668 ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)) and the renormalized category at main.tex:794 ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html))).\n\nLet $K$ be a placid group scheme acting on a placid scheme or a placid ind-scheme $\\mathcal{Y}$ ([placidity](../../../appendix/placid-ind-scheme.html)). For a $K$-stable open sub-ind-scheme $U\\subseteq\\mathcal{Y}$ write $j_U\\colon K\\backslash U\\hookrightarrow K\\backslash\\mathcal{Y}$ for the induced morphism of prestacks. The **support** of $\\mathcal{G}\\in\\mathcal{D}^!(K\\backslash\\mathcal{Y})$ is\n\n$$\n\\left|\\operatorname{supp}\\mathcal{G}\\right|\\ :=\\ |\\mathcal{Y}|\\ \\smallsetminus \\bigcup\\left\\{\\,|U|\\ \\middle|\\ U\\subseteq\\mathcal{Y}\\ K\\text{-stable open},\\ j_U^{!}\\mathcal{G} = 0\\,\\right\\}\\ \\subseteq\\ |\\mathcal{Y}| .\n$$\n\nBeing the complement of a union of $K$-stable opens, it is a closed $K$-stable subset of $\\left|\\mathcal{Y}\\right|$.\n\n**The $\\left|\\cdot\\right|$ convention: a subset, never a subscheme.** The support is a subset of the underlying topological space and carries no scheme structure. When a sub-ind-scheme $Z\\subseteq\\mathcal{Y}$ — an orbit closure of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html), a Schubert closure of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html), a clopen piece — stands on the other side of a containment or an equality, the bars may be dropped on both sides:\n\n$$\n\\operatorname{supp}\\mathcal{G}\\subseteq Z \\quad\\text{abbreviates}\\quad \\left|\\operatorname{supp}\\mathcal{G}\\right|\\subseteq\\left|Z\\right|,\n\\qquad\n\\operatorname{supp}\\mathcal{G} = Z \\quad\\text{abbreviates}\\quad \\left|\\operatorname{supp}\\mathcal{G}\\right| = \\left|Z\\right| .\n$$\n\nA bar-free equality therefore asserts equality of subsets of $\\left|\\mathcal{Y}\\right|$ and never an equality of schemes, and it fixes no scheme structure on the left-hand side; that a support subset is the space of a reduced closed sub-ind-scheme is a hypothesis a node states, as clause (iv) of [Q1-L3](../../Q1/Q1-L3/index.html) states it.\n\n**(R) Which restriction functor.** For $\\mathcal{G}\\in\\mathcal{D}^!(K\\backslash\\mathcal{Y})$ the functor $j_U^{!}$ above is the Kan-extended one of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), which exists for every morphism of prestacks and needs no hypothesis. For $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y}) = \\mathrm{Ind}\\left(\\mathcal{D}_c(K\\backslash\\mathcal{Y})\\right)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) it is instead the ind-extension of the restriction of $j_U^{!}$ to coherent objects ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)), which presupposes that $j_U^{!}$ preserves coherence. This entry does not supply that; it is clause (1) of [Q1-L3-L3-L1](../../Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/index.html), proved there for the opens that node builds and for no others.\n\n**(F) What follows from the definition, and what does not.** If $\\mathcal{G}$ restricts to zero along the $K$-stable open complement $U_Z$ of a closed $K$-stable $Z\\subseteq\\left|\\mathcal{Y}\\right|$, then $\\operatorname{supp}\\mathcal{G}\\subseteq Z$, since $U_Z$ is one of the opens in the union. The converse is **not** part of the definition: $\\left|\\operatorname{supp}\\mathcal{G}\\right|\\subseteq Z$ says only that $U_Z$ is *covered* by opens on which $\\mathcal{G}$ restricts to zero, so it gives $\\ker(j_{Z}^{!})\\subseteq\\{\\mathcal{G} : \\operatorname{supp}\\mathcal{G}\\subseteq Z\\}$ and not the reverse inclusion.\n\n**(P) Where the definition is anchored.** On a scheme of finite type, and on a placid scheme or a $K$-quotient of one ([sheaves on a placid scheme](../../../appendix/ex-sheaf-on-placid-scheme.html)) — a single stage of a presentation, such as $K\\backslash\\overline{LX}_\\lambda$ — the display above is the usual support and the entry may be used as it stands. On a placid ind-scheme $\\mathcal{Y} = \\varinjlim_i\\mathcal{Y}_i$ ([sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html)) it is available for an object that comes from one stage; for an object of the Kan-extended $\\mathcal{D}^!(\\mathcal{Y})$ that does not, the display still writes down a closed subset and nothing in this appendix says that subset behaves — see the first note.\n\n### [Raskin: descent for $\\mathcal{D}^!$ along a torsor under a quasi-compact group scheme](../../../appendix/bb-raskin-torsor-descent.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.17 and Prop. 3.17.2](../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). Let $S$ be a quasi-compact quasi-separated base scheme and let $\\mathcal{G}\\rightarrow S$ be a quasi-compact quasi-separated group scheme over $S$; no finite-type hypothesis is placed on $\\mathcal{G}$. For a quasi-compact quasi-separated $S$-scheme $\\mathcal{P}$ carrying an action of $\\mathcal{G}$, the bar complex of the action,\n\n$$\n\\cdots\\ \\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{P},\n$$\n\ninduces a diagram of $!$-pullbacks, and the *$\\mathcal{G}$-equivariant derived category of $\\mathcal{P}$* is defined to be its limit:\n\n$$\n\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}} := \\varprojlim\\left(\\mathcal{D}^!(\\mathcal{P})\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\cdots\\right).\n$$\n\nCall $\\mathcal{P}\\rightarrow S$ a *$\\mathcal{G}$-torsor* if $\\mathcal{G}$ acts on $\\mathcal{P}$ and there is an fppf base change $S'\\rightarrow S$ admitting a $\\mathcal{G}$-equivariant identification $\\mathcal{P}\\times_S S' = \\mathcal{G}\\times_S S'$. Then for every $\\mathcal{G}$-torsor $\\mathcal{P}\\rightarrow S$ the canonical functor, given by $!$-pullback along $\\mathcal{P}\\rightarrow S$,\n\n$$\n\\varphi\\colon\\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}}\n$$\n\nis an equivalence.\n\n- **hypotheses:** $S$ quasi-compact quasi-separated, $\\mathcal{G}\\rightarrow S$ a quasi-compact quasi-separated $S$-group scheme, and $\\mathcal{P}$ a quasi-compact quasi-separated $S$-**scheme** — representability of $\\mathcal{P}$ is part of the hypothesis, while finite type on $\\mathcal{G}$ is not required. The action must exhibit $\\mathcal{P}\\rightarrow S$ as an fppf-locally trivial torsor as displayed, and the conclusion concerns $\\mathcal{D}^!$ alone: nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)), about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), or about the $\\mathcal{D}^*$-coinvariant analogue, which is the source's §3.24.\n- **note:** **The base is a scheme, never a stack — the gap a user must bridge.** The source's $S$ is a scheme and $\\mathcal{P}\\rightarrow S$ an honest torsor of schemes, so this entry does *not* by itself evaluate $\\mathcal{D}^!$ on a quotient stack $B\\mathcal{G}=\\mathrm{pt}/\\mathcal{G}$.\n\n  The dictionary a node must supply is this. $\\mathcal{D}^!$ is a right Kan extension from $\\mathrm{AffSch}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)), so $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{T\\rightarrow B\\mathcal{G}}\\mathcal{D}^!(T)$ over the affine tests, and each test pulls the atlas $\\mathrm{pt}\\rightarrow B\\mathcal{G}$ back to an honest $\\mathcal{G}$-torsor $\\mathcal{P}_T\\rightarrow T$ to which the entry applies; assembling those pointwise equivalences into the single statement $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(\\mathcal{G}^{\\times n})$ is the citing node's own work.\n- **note:** *Provenance.* Read on the page in `papers/raskin_dmodules_infinite_var.pdf`: the setting and the definition of $\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}}$ are §3.17, p. 15; the equivalence is Prop. 3.17.2, p. 16, proved there by reduction along an fppf base change to a trivial bundle, where the bar complex splits. The standing base field has characteristic $0$ (§1.13, p. 4), and §3.14, p. 14 is what licenses writing $\\mathcal{D}^!$ for the $\\widetilde{\\mathcal{D}}^!$ of §3.12.\n\n  *Why the $h$-descent statements do not suffice.* In the source $h$-coverings are **finitely presented** (§3.12 with footnote 2, p. 12), so neither Prop. 3.12.1, p. 12 nor its indschematic form Prop. 6.6.1, p. 35 reaches an atlas whose fibres are placid and not of finite type. The entry above is the statement that does, because its $\\mathcal{G}$ is only quasi-compact quasi-separated.\n\n  *Companion checks, same source.* Any affine group scheme over a characteristic-$0$ field is placid (Ex. 4.2.2, p. 19); a placid scheme is automatically quasi-compact and quasi-separated (Rem. 4.2.7, p. 20); and for $S$ of finite type and $\\mathcal{G}\\rightarrow S$ a projective limit of smooth $S$-group schemes under smooth surjective affine maps, every $\\mathcal{G}$-torsor over $S$ is placid (Ex. 4.2.3, p. 19). These are the pages a node cites when discharging the quasi-compactness hypotheses above.\n\n  *The indscheme rendering.* §6.7, p. 36 repeats the definition for a group indscheme over an indscheme base, and Prop. 6.7.1 asserts the same equivalence $\\mathcal{D}^!(S)\\simeq\\mathcal{D}^!(\\mathcal{P}_{\\mathcal{G}})^{\\mathcal{G}}$ there — the statement main.tex:1217 already cites. It moves the base from a scheme to an indscheme and still not to a stack, so it closes no part of the gap named above.\n\n  *Orientation, not licensed.* Remark 2.3.1, p. 5 says that \"for a nice enough stack $\\mathcal{Y}$\" with a hypercovering by affine schemes $Y_n$ one has $\\mathcal{D}^!(\\mathcal{Y})=\\varprojlim_{[n]\\in\\Delta}\\mathcal{D}^!(Y_n)$; it is unnumbered and \"nice enough\" is never made precise, so it is recorded here for orientation only and is not part of what this entry licenses.\n\n  *Index category.* The source calls the displayed bar complex *semisimplicial* and draws only its face maps, leaving the index category of the limit unnamed; a node needing $\\Delta$ rather than $\\Delta_{\\mathrm{inj}}$, or the reverse, supplies that cofinality itself.\n- **note:** *Commissioned by* the round-1 critique of [Q1-L4-L4](../../Q1/Q1-L4/Q1-L4-L4/critiques/r1.html), Flaw 3: an entry asserting $\\mathcal{D}^!(BH)\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m)$ would assume that node's own conclusion, so what was asked for was the primitive descent statement one level below. Beraldo's pro-unipotent results are *not* that primitive and are not black-boxed here: [[beraldo2017loop, Cor. 4.3.1, Thm. 4.3.2](../../../../papers/beraldo2017loop.pdf)] assume $H$ pro-unipotent, and the surrounding §4.2 assumes a Levi decomposition $H\\simeq H^r\\ltimes H^u$ — hypotheses no node in Q1 currently has.\n\n### [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.9 with Prop. 3.9.2, §6.3, and Table 1](../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). A morphism $f\\colon S\\rightarrow T$ of ind-schemes is *finitely presented* if it is schematic and its base change along any scheme is a finitely presented morphism (the source's §6.3). For such $f$ the source constructs a pushforward on the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html),\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(T),\n$$\n\nwhich it names the *\"$!$-dR $*$-pushforward functor\"*, and:\n\n**(i) Functoriality through correspondences.** $\\mathcal{D}^!$ upgrades, by left Kan extension, to a functor $\\mathcal{D}^{!,\\mathrm{enh}}$ out of the category of ind-schemes under correspondences $T\\xleftarrow{\\ \\alpha\\ }H\\xrightarrow{\\ \\beta\\ }S$ whose right leg $\\beta$ is finitely presented and whose left leg $\\alpha$ is arbitrary, carrying such a correspondence to $\\beta_{*,!-\\mathrm{dR}}\\,\\alpha^!$. In particular $f\\mapsto f_{*,!-\\mathrm{dR}}$ is compatible with composition of finitely presented morphisms.\n\n**(ii) Base change against $!$-pullback.** For a Cartesian square of ind-schemes\n\n$$\n\\begin{array}{ccc} S' & \\xrightarrow{\\ \\psi\\ } & S\\\\ \\downarrow f' & & \\downarrow f\\\\ T' & \\xrightarrow{\\ \\varphi\\ } & T\\end{array}\n$$\n\nwith $f$ finitely presented, the canonical map $\\varphi^!\\,f_{*,!-\\mathrm{dR}}\\rightarrow f'_{*,!-\\mathrm{dR}}\\,\\psi^!$ is an equivalence; Table 1 records this as \"always satisfies base-change with upper-$!$ functors\", with no hypothesis on $\\varphi$.\n\n**(iii) The proper adjunction.** If $f$ is in addition proper, then $f^!$ is canonically right adjoint to $f_{*,!-\\mathrm{dR}}$ — equivalently, $f_{*,!-\\mathrm{dR}}$ is the left adjoint of $f^!$.\n\n**(iv) The same construction for prestacks** *(added 2026-08-08; this clause **amends** the entry and, with it, what every node citing this anchor asserts — see the amendment note below)*. The source states the definition and the pushforward one generality up, for prestacks rather than ind-schemes. A morphism $f\\colon\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks is *finitely presented* if it is schematic and if for every $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathrm{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented; for every such $f$ there is a functor\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(\\mathcal{Y})\\longrightarrow\\mathcal{D}^!(\\mathcal{Z})\n$$\n\ncompatible with base change. *Schematic is meant classically*: the source's Remark 3.16.1 emphasises that \"by *schematic*, we mean schematic in the sense of classical (i.e., non-derived) algebraic geometry, which is a more forgiving notion than that of derived algebraic geometry\", the example given there being the embedding of $0$ inside the ind-scheme attached to an infinite-dimensional $k$-vector space — classically schematic, not DG schematic.\n\n**A quotient prestack is a prestack, and this is the clause to cite there.** For a group $K$ acting on $\\mathcal{Y}$ and on $\\mathcal{Z}$, the induced $K\\backslash\\mathcal{Y}\\rightarrow K\\backslash\\mathcal{Z}$ is a morphism of prestacks and is covered by the definition above verbatim. A node computing a pushforward and its base change on $K\\backslash LX$ therefore does **not** owe the assembly of [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html) for that step; what it owes instead is finite presentation of the quotient morphism itself, in the sense just displayed.\n\n- **hypotheses:** $f$ **finitely presented** in the source's sense — for (i)–(iii) the ind-scheme sense recalled at the top, for (iv) the prestack sense of that clause — and, for (iii) alone, in addition **proper**. Placidity is *not* a hypothesis of any clause, and neither is any equivariance. *What each generality reaches.* Clauses (i)–(iii) are stated for ind-schemes: the correspondence functoriality, the base change in the displayed form, and the proper adjunction are asserted there and nowhere wider. Clause (iv) is stated for **prestacks**, hence for quotient prestacks $K\\backslash(-)$, but it asserts only the existence of $f_{*,!-\\mathrm{dR}}$ and its compatibility with base change — the source states neither (i) nor (iii) at that generality, so a node wanting the correspondence formalism or the proper adjunction on a quotient prestack still owes them. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) or about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n- **note:** **There is one pushforward on $\\mathcal{D}^!$, and its name carries a $*$.** A node writing $f_!$ for the left adjoint of $f^!$ and a node writing $f_*$ for the pushforward defining a convolution ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) are, on $\\mathcal{D}^!$ and for finitely presented $f$, naming the same functor $f_{*,!-\\mathrm{dR}}$ of this entry. That is the whole of what the source licenses on this point.\n\n  **What is *not* licensed** is the identification of $f_{*,!-\\mathrm{dR}}$ with the $\\mathcal{D}^*$-pushforward $f_{*,\\mathrm{dR}}\\colon\\mathcal{D}^*(S)\\rightarrow\\mathcal{D}^*(T)$ across the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ that a dimension theory supplies ([sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html), [the three standing hypotheses](../../../appendix/assum-intro.html)(b)). The source introduces the subscript precisely \"to avoid confusion\" between the two (§3.9, p. 9), and Table 1 lists two further renormalized functors $f_{*,\\mathrm{ren}}$ and $f^{!,\\mathrm{ren}}$ for placid $S,T$ equipped with dimension theories. A node needing that identification still owes it.\n- **note:** *Provenance, verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-06. Table 1, p. 3, row 3: hypothesis \"$f$ ind-finitely presented\", functor $f_{*,!-\\mathrm{dR}}\\colon D^!(S)\\rightarrow D^!(T)$, adjunctions \"Left adjoint to $f^!$ for $f$ ind-proper; right adjoint to $f^!$ up to cohomological shift for $f$ smooth\", base change \"Always satisfies base-change with upper-$!$ functors\", references §3.9 and §6.3. §3.9, p. 9 introduces $f_{*,!-\\mathrm{dR}}$ for a finitely presented map of quasi-compact quasi-separated **schemes** and notes that \"the formalism of correspondences implies that we have base-change between $*$-pushforward and $!$-pullback for Cartesian squares\"; Prop. 3.9.2, p. 10 is the proper adjunction in that scheme setting. §6.3, p. 34 is the ind-scheme upgrade quoted above, ending \"If $f$ is additionally assumed proper or smooth, we again have the usual adjunctions.\"\n\n  *A typo on the page.* The displayed compatibility inside Prop. 3.9.2 is printed as $f_{*,\\mathrm{dR}}\\varphi^!\\xrightarrow{\\ \\simeq\\ }\\psi^!f'_{*,!-\\mathrm{dR}}$, whose subscripts and primes do not typecheck against the Cartesian square drawn immediately above it. Clause (ii) states the base change in the form that does, which is the form Table 1 asserts.\n- **note:** *Commissioned by* the `/prove Q2` failure audit of 2026-08-06: **GAP (Prop)** at Step 4 of [Q2-L5](index.html)'s write-up, which asked for four clauses. Three are above. The fourth, \"$f_!\\simeq f_*$\", is reached only in the notational sense recorded in the first note and **not** as an identification across the $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ duality.\n- **note:** *Provenance of clause (iv), verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-08. §3.16, printed p. 15, titled *Correspondences for prestacks*, reads verbatim: \"We say that a morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ is finitely presented if it is schematic, and if for any $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathsf{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented. As another corollary of Proposition 3.6.1, we obtain that there is a functor $f_{*,!-dR}$ compatible with base-change for any finitely presented morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks.\" Remark 3.16.1, immediately below on the same page, is the classical-schematic caveat quoted in clause (iv). §3.17, the equivariant setting behind [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html), begins on the same printed page.\n\n  *Two readings in clause (iv) are the transcriber's and not the page's.* First, the source writes only \"compatible with base-change\" and does not display the square; that this means the equivalence $\\varphi^!f_{*,!-\\mathrm{dR}}\\simeq f'_{*,!-\\mathrm{dR}}\\psi^!$ of clause (ii), now for a Cartesian square of prestacks, is read from Table 1's \"always satisfies base-change with upper-$!$ functors\" and from §3.9's own sentence about the formalism of correspondences. Second, $\\mathcal{D}^!$ on a prestack is here the one of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) (main.tex:651–668); identifying it with the source's is the same dictionary clauses (i)–(iii) already rest on, and this entry does not re-derive it.\n- **note:** *What the amendment of 2026-08-08 changed, and what it withdrew.* Before that date this entry was transcribed from §3.9, §6.3 and Table 1 alone — schemes and ind-schemes — and its hypotheses line asserted that \"$S$ and $T$ are ind-schemes, never quotient stacks, so a node working on $K\\backslash LX$ supplies the descent from the ind-scheme statement itself, exactly as [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html) requires.\" **That sentence was too restrictive and is withdrawn**, not merely supplemented: §3.16 states the definition and the base-change-compatible pushforward for prestacks outright, so on $K\\backslash(-)$ the pushforward and its base change are clause (iv) and no descent argument is owed for them. What survives of the old sentence: the torsor-descent entry is still what a node needs in order to *evaluate* $\\mathcal{D}^!$ on a quotient by an atlas, and clauses (i) and (iii) are still ind-scheme statements. A node whose write-up was built against the withdrawn sentence has an argument that is sound and longer than it needs to be, not one that is wrong.\n\n### [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../../../appendix/fp-convolution-morphism.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Proposition** (derived inside this appendix from [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) (main.tex:694–718), [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](../../../appendix/bb-zhu-pi0-cartan.html)(2) and the prestack definition of [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html)(iv); no main.tex label, and no page of `papers/` states it — the argument is written out in the second note below). Let $k$, $G$, $T\\subseteq B\\subseteq G$ and $K = L^+G$ be as in [the standing notation](../../../appendix/subsec-notations.html), let $X$ be a smooth affine $G$-variety of finite type over $k$, and write $\\Lambda^+ := X_*(T)^+$. For a finite subset $F\\subseteq\\Lambda^+$ put\n\n$$\n\\mathrm{Gr}_F := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu\\ \\subseteq\\ \\mathrm{Gr},\n$$\n\nwith $\\overline{\\mathrm{Gr}}_\\mu$ the Schubert closures of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(2), let $\\overline{LG}_F\\subseteq LG$ be the preimage of $\\mathrm{Gr}_F$ under $LG\\rightarrow\\mathrm{Gr}$, let $\\overline{LG}_F\\times^{K}(-)$ denote the fppf quotient of $\\overline{LG}_F\\times(-)$ by $(g,x)\\cdot\\kappa = (g\\kappa,\\kappa^{-1}x)$, and let\n\n$$\nm_F\\colon\\ \\overline{LG}_F\\times^{K}L^+X\\longrightarrow LX,\\qquad [g,x]\\longmapsto g\\cdot x .\n$$\n\nThen, all three in the prestack sense of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) — schematic in the classical sense, with finitely presented base change along every affine scheme over the target:\n\n**(1) The jet embedding.** The canonical monomorphism $L^+X\\hookrightarrow LX$ is finitely presented, and its base change along any morphism of prestacks $\\mathcal{Z}\\rightarrow LX$ is a finitely presented closed embedding.\n\n**(2) The bounded convolution morphism.** For every finite $F\\subseteq\\Lambda^+$ the morphism $m_F$ is finitely presented.\n\n**(3) The quotient morphism.** For every finite $F\\subseteq\\Lambda^+$ the induced morphism of quotient prestacks\n\n$$\nK\\backslash\\left(\\overline{LG}_F\\times^{K}L^+X\\right)\\longrightarrow K\\backslash LX\n$$\n\nis finitely presented, so [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) applies to it directly.\n\n- **hypotheses:** $X$ **smooth affine of finite type** over $k$ — the hypothesis of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html), which supplies the presentation $LX = \\varinjlim_i LX^i$ the argument runs on; the standing $X$ of [context](../../../context.html) is smooth affine spherical, hence covered. $G$ **connected reductive** over the standing algebraically closed $k$, which is what [Zhu](../../../appendix/bb-zhu-pi0-cartan.html)(2) needs in order to make each $\\overline{\\mathrm{Gr}}_\\mu$ projective; $F\\subseteq\\Lambda^+$ **finite**, which is what makes $\\mathrm{Gr}_F$ a scheme rather than an ind-scheme; clauses (2) and (3) are not asserted for infinite $F$, and they fail for $F = \\Lambda^+$, where $\\mathrm{Gr}_F = \\mathrm{Gr}$ is an ind-scheme not of finite type and step (c) of the argument below has nothing to say. Nothing here asserts **properness** of $m_F$, so clause (iii) of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html) — the adjunction $m_{F,*,!-\\mathrm{dR}}\\dashv m_F^!$ — is *not* reached: $\\mathrm{Gr}_F$ is proper but $L^+X\\hookrightarrow LX$ is not, and the composite in the argument below is a closed embedding followed by a proper projection only after the untwisting, which does not make it proper. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) or $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n- **note:** *Which appendix entry each ingredient comes from.* Clause (1) is the only one with content beyond bookkeeping, and the two entries the appendix already carries that look as if they cover it do **not**. [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) gives the presentation $LX = \\varinjlim_i LX^i$ with $LX^i = LX\\cap t^{-i}L^+\\mathbb{A}^N$ and asserts placidity; it says nothing about finite presentation, of the transitions or of the $i = 0$ stage. [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) gives finite presentation of the closed embeddings $\\overline{LX}_\\lambda\\rightarrow LX$ of **orbit closures**, which is a different family: $L^+X$ is not one of them unless a node proves it is, and no node should assume so.\n- **note:** *Why this holds. Written out here because no page of `papers/` located by this transcription states clauses (1)–(3); a citing node cites the entry and does not repeat the argument.* Throughout, a morphism of prestacks is *finitely presented* in the sense of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv), and two formal facts about that notion are used and are immediate from its definition together with the corresponding facts for schemes: it is stable under base change and under composition, and — since the defining condition is tested on affine schemes over the target — it is fppf-local on the target.\n\n  **(a) Clause (1).** Fix a closed embedding $X\\subseteq\\mathbb{A}^N$, available because $X$ is affine of finite type. Then $L^+X = LX\\times_{L\\mathbb{A}^N}L^+\\mathbb{A}^N$, so $L^+X = LX^0$ in the notation of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html), and inside the stage $LX^i$ the subscheme $LX^0$ is cut out by the $Ni$ coefficient functions $a_{j,m}$, $1\\le j\\le N$ and $-i\\le m\\le-1$, of the coordinates $x_j = \\sum_{m\\ge-i}a_{j,m}t^m$. A closed subscheme defined by a finitely generated ideal is a finitely presented closed embedding, so $LX^0\\hookrightarrow LX^i$ is one for every $i$. Any morphism to $LX$ from a quasi-compact scheme — in particular from an affine one — factors through some stage of the presentation, whose transitions are closed embeddings. Hence for affine $S\\rightarrow LX$ one has $L^+X\\times_{LX}S = LX^0\\times_{LX^i}S$ for some $i$, a base change of a finitely presented closed embedding: an affine scheme, finitely presented and closed over $S$. That is clause (1), classical schematicity included, and the parenthetical about a general $\\mathcal{Z}\\rightarrow LX$ is the same computation after base change.\n\n  **(b) The untwisting isomorphism.** The $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\mathrm{Gr}_F\\times LX$, $(g,y)\\mapsto(gK,gy)$, descends to $\\theta\\colon\\overline{LG}_F\\times^{K}LX\\rightarrow\\mathrm{Gr}_F\\times LX$; the $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\overline{LG}_F\\times^{K}LX$, $(g,y)\\mapsto[g,g^{-1}y]$, descends along the $K$-torsor $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$ to a morphism inverse to $\\theta$. No trivialization is chosen and no local statement is used: both formulas are globally defined on the covers, and both invariances are one line. Under $\\theta$ the morphism $m_F$ becomes $\\mathrm{pr}_2\\circ\\theta\\circ\\iota$, where $\\iota\\colon\\overline{LG}_F\\times^{K}L^+X\\hookrightarrow\\overline{LG}_F\\times^{K}LX$ is the inclusion induced by $L^+X\\subseteq LX$.\n\n  **(c) The projection.** By [Zhu](../../../appendix/bb-zhu-pi0-cartan.html)(2) each $\\overline{\\mathrm{Gr}}_\\mu$ is a projective $k$-variety, so the finite union $\\mathrm{Gr}_F$ is a projective $k$-scheme, in particular of finite presentation over $k$. Base change of $\\mathrm{Gr}_F\\rightarrow\\operatorname{Spec}k$ along an affine $S\\rightarrow LX$ gives $\\mathrm{Gr}_F\\times S\\rightarrow S$, so $\\mathrm{pr}_2\\colon\\mathrm{Gr}_F\\times LX\\rightarrow LX$ is schematic and finitely presented.\n\n  **(d) The incidence inclusion.** The square with top arrow $\\mathrm{id}\\times(L^+X\\hookrightarrow LX)$, bottom arrow $\\iota$, and the two quotient maps as verticals is Cartesian, and the verticals are $K$-torsors — the pullbacks of $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$, which is the restriction of $LG\\rightarrow\\mathrm{Gr}$ and is even Zariski-locally trivial for a constant reductive $G$ ([[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../../../papers/zhu2016introduction.pdf)]). For affine $S\\rightarrow\\overline{LG}_F\\times^{K}LX$ the pulled-back torsor $P\\rightarrow S$ is an fppf cover with $P$ affine, since $K$ is an affine group scheme and affineness is fppf-local; over $P$ the pullback of $\\iota$ is a base change of the top arrow, hence of clause (1), hence finitely presented. Finite presentation being fppf-local on the target, $\\iota$ is finitely presented.\n\n  **(e) Clauses (2) and (3).** Clause (2) is (b) + (c) + (d) and the stability of finite presentation under composition. For clause (3), let $S\\rightarrow K\\backslash LX$ be affine and let $P := LX\\times_{K\\backslash LX}S$, again an affine $K$-torsor over $S$. Because $\\overline{LG}_F\\times^{K}L^+X\\rightarrow LX$ is $K$-equivariant and $LX\\rightarrow K\\backslash LX$ is a $K$-torsor, the base change of the clause-(3) morphism along $P\\rightarrow K\\backslash LX$ is $(\\overline{LG}_F\\times^{K}L^+X)\\times_{LX}P\\rightarrow P$, finitely presented by clause (2); descend along $P\\rightarrow S$.\n- **note:** *Provenance.* The one page-level citation in the argument is [[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../../../papers/zhu2016introduction.pdf)], read in `papers/zhu2016introduction.pdf` on 2026-08-08: Proposition 1.3.6 identifies $\\mathrm{Gr}_{\\underline{G}}$ with the fpqc quotient $[L\\underline{G}/L^+\\underline{G}]$ and Remark 1.3.8 records that the $L^+\\underline{G}$-torsor $L\\underline{G}\\rightarrow\\mathrm{Gr}_{\\underline{G}}$ \"is locally trivial for the étale topology. If $\\underline{G} = G\\otimes\\mathcal{O}$ is constant reductive … it is even locally trivial for the Zariski topology\". Everything else is the appendix entries named in the attribution line, plus standard scheme theory. The statement was **commissioned by** [round 4 of Q1-L3-L2's critique](../../Q1/Q1-L3/Q1-L3-L2/critiques/r4.html), commission **E1**, which asked for exactly clause (2); clauses (1) and (3) are what the argument for (2) needs and what the citing nodes use separately.\n\n### [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n- **note:** this definition carries **no `\\label` in main.tex** — cite it as `main.tex:794`, never as a label, and do not invent one. It is the ambient category in which every Satake generation is formed; see [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and [Q1-L1](../../Q1/Q1-L1/index.html).\n\n### [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda = \\mathrm{Gr}_{\\le\\lambda}$ — the affine Grassmannian by Schubert closures](../../../appendix/gr-schubert.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2, p. 4: the paragraph on $G_{\\mathcal{O}}$-orbits, together with (2.1) and (2.2)](../../../../papers/mirkovic2007geometric.pdf)] for clauses (1)–(3); main.tex:831 and main.tex:1100 for the ind-properness in clause (3); main.tex:1208 and main.tex:1221 for clause (4)). Let $G$, $T$, $W$, $K = L^+G$ and $\\mathrm{Gr}$ be as in [the standing notation](../../../appendix/subsec-notations.html), write $X_*(T)$ for the cocharacter lattice and $\\Lambda^+ := X_*(T)^+$ for the dominant cone.\n\n**(1) Orbits.** The group scheme $K$ acts on $\\mathrm{Gr}$ with finite-dimensional orbits, and the $K$-orbits are parameterized by the $W$-orbits in $X_*(T)$ — equivalently by $\\Lambda^+$. The orbit attached to $\\lambda$ is\n\n$$\n\\mathrm{Gr}^\\lambda = K\\cdot L_\\lambda\\ \\subset\\ \\mathrm{Gr},\n$$\n\nwhere $L_\\lambda$ is the image in $\\mathrm{Gr}$ of the point $\\lambda\\in X_*(T)\\subset LG$.\n\n**(2) Closure order.** For $\\lambda,\\mu\\in\\Lambda^+$,\n\n$$\n\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}\\quad\\text{if and only if}\\quad \\lambda-\\mu\\ \\text{is a sum of positive coroots.}\n$$\n\nThe blueprint writes $\\overline{\\mathrm{Gr}}_\\lambda := \\overline{\\mathrm{Gr}^\\lambda}$ for the closure, taken reduced.\n\n**(3) Presentation and ind-properness.** $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$, where the $\\mathrm{Gr}_n$ are finite-dimensional $K$-invariant schemes and every transition map is a closed embedding, and $\\mathrm{Gr}$ is ind-proper.\n\n**(4) Coherent sheaves come from a stage.** With $\\mathrm{Gr}_{\\le\\alpha}$ the manuscript's name for $\\overline{\\mathrm{Gr}}_\\alpha$,\n\n$$\n\\mathcal{D}(\\mathrm{Gr})\\simeq\\varinjlim_{\\alpha\\in\\Lambda^+}\\mathcal{D}\\left(\\mathrm{Gr}_{\\le\\alpha}\\right),\n$$\n\nand every $\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$ may be written $\\mathcal{F} = \\iota_*c$ with $\\iota\\colon\\mathrm{Gr}_{\\le\\alpha}\\hookrightarrow\\mathrm{Gr}$ the closed embedding and $c\\in\\mathcal{D}_c(\\mathrm{Gr}_{\\le\\alpha})^I$, for some $\\alpha\\in\\Lambda^+$.\n\n- **hypotheses:** $G$ connected reductive. Three caveats a citing node must carry. *Ground field.* The source works over $\\mathbb{C}$, with $\\mathcal{O} = \\mathbb{C}[[z]]$ and $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing $k$ is any algebraically closed field of characteristic $0$ ([the standing notation](../../../appendix/subsec-notations.html), [$F = k((t))$](../../../appendix/conv-ring-of-integers.html)); the presentation in clause (4) is asserted over the standing $k$ by main.tex:1208, and clauses (1)–(3) are used at that generality on the manuscript's authority, not on the source's page. *Equivariance in clause (4).* main.tex:1221 prints the reduction $\\mathcal{F} = \\iota_*c$ for **Iwahori**-equivariant coherent objects. A node needing the spherical form — $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ written as $\\iota_*c$ with $c\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}_{\\le\\alpha})$ — is making the same reduction one parahoric up, out of the same colimit presentation, and must say that it is doing so. *Two defects in the index and the category of clause (4), which a citing node must carry.* The colimit is indexed by $\\alpha\\in\\Lambda^+$ under the closure order of clause (2), and that poset is **not directed** once $\\mathrm{Gr}$ is disconnected: $\\lambda-\\mu$ a sum of positive coroots forces $\\lambda\\equiv\\mu$ modulo the coroot lattice, so a single $\\overline{\\mathrm{Gr}}_\\alpha$ lies in one connected component. Finite unions $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ are the directed replacement, and they are cofinal among the stages of clause (3) — [Q1-L3-L2](../../Q1/Q1-L3/Q1-L3-L2/index.html)(2). Separately, \"$\\mathcal{F} = \\iota_*c$ for some $\\alpha$\" is a statement about **compact** objects, whereas $\\mathcal{D}_c$ is defined pointwise by [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) and coherent is not compact on a stack: $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support and comes from no stage — [Q1-L3-L2](../../Q1/Q1-L3/Q1-L3-L2/index.html)(4). So clause (4) may be invoked to move an object *off* a stage, never to put an arbitrary coherent object *onto* one.\n\n### [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](../../../appendix/bb-zhu-pi0-cartan.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[zhu2016introduction, Thm. 1.3.11(1) printed p. 15; §2.1 (2.1.1)–(2.1.2) printed p. 23; Prop. 2.1.5 printed pp. 24–25; (2.1.10) with Cor. 2.1.11 printed p. 26](../../../../papers/zhu2016introduction.pdf)]; external, no main.tex label). Let $k$ be algebraically closed, $F = k((t))$, $\\mathcal{O} = k[[t]]$, let $G$ be a connected split reductive group over $k$ with $T\\subseteq B\\subseteq G$, let $\\underline{G} = G\\otimes_k\\mathcal{O}$ be the constant group scheme, and let $\\mathrm{Gr} = \\mathrm{Gr}_{\\underline{G}} = LG/L^+G$. Write $X_*(T)$ for the cocharacter lattice, $\\Lambda^+ := X_*(T)^+$ for the dominant cone, $Q\\subseteq X_*(T)$ for the coroot lattice, and $L_\\mu\\in\\mathrm{Gr}$ for the image of $t^\\mu = \\mu(t)\\in T(F)\\subseteq G(F)$. The clauses are **separately citable**; see the hypotheses line for what each needs and for what this entry does not carry.\n\n**(1) Cartan decomposition and the orbit parametrization** *(printed p. 23)*. There is a canonical bijection\n\n$$\nG(\\mathcal{O})\\backslash G(F)/G(\\mathcal{O})\\ \\cong\\ X_*(T)/W\\ \\cong\\ \\Lambda^+,\n$$\n\nrealized by the Cartan decomposition $G(F) = \\bigsqcup_{\\mu\\in\\Lambda^+}G(\\mathcal{O})\\,t^\\mu\\,G(\\mathcal{O})$. The double coset $G(\\mathcal{O})t^\\mu G(\\mathcal{O})$ depends on neither the uniformizer $t$ nor the embedding $T\\subseteq G$, and the image of $t^\\mu$ in $\\mathrm{Gr}$ — the point $L_\\mu$ — is independent of the uniformizer.\n\n**(2) The Schubert cell and the Schubert variety** *(Prop. 2.1.5, printed pp. 24–25)*. For $\\mu\\in\\Lambda^+$ the cell $\\mathrm{Gr}^\\mu$ forms a single $L^+G$-orbit and is a smooth quasi-projective variety with\n\n$$\n\\dim\\mathrm{Gr}^\\mu\\ =\\ \\langle 2\\rho,\\mu\\rangle ,\n$$\n\nand $\\overline{\\mathrm{Gr}}_\\mu$ is the Zariski closure of $\\mathrm{Gr}^\\mu$, hence a **projective** variety. Both are taken with the reduced scheme structure, as the source's definition on printed p. 24 does.\n\n**(3) The component group** *(Thm. 1.3.11(1), printed p. 15)*. Let $I = \\mathrm{Gal}(\\bar F/F)$, acting on the fundamental group $\\pi_1(G_F)$ of $G_F = G\\otimes_k F$, and let $\\pi_1(G_F)_I$ be the coinvariants. Then there is a canonical isomorphism $\\pi_0(LG)\\cong\\pi_1(G_F)_I$, and the projection $LG\\rightarrow\\mathrm{Gr}$ induces an isomorphism\n\n$$\n\\pi_0(LG)\\ \\cong\\ \\pi_0(\\mathrm{Gr}).\n$$\n\n**(4) The split reduction** *(the transcriber's display of a reduction the source performs on printed p. 26; see the notes)*. For the split $G$ of the setting above, $I$ acts trivially on $\\pi_1(G_F)$, so $\\pi_1(G_F)_I = \\pi_1(G)$, and the algebraic fundamental group of a split connected reductive group is by definition $X_*(T)/Q$. Hence\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ \\pi_1(G)\\ \\cong\\ X_*(T)/Q .\n$$\n\n**(5) Parity** *((2.1.10) with Cor. 2.1.11, printed p. 26)*. The map $\\mathfrak{p}\\colon X_*(T)\\rightarrow\\mathbb{Z}/2$, $\\mu\\mapsto(-1)^{\\langle2\\rho,\\mu\\rangle}$, factors as $X_*(T)\\rightarrow\\pi_1(G)\\rightarrow\\mathbb{Z}/2$ and therefore induces, through clause (3), a map $\\mathfrak{p}\\colon\\pi_0(\\mathrm{Gr})\\rightarrow\\mathbb{Z}/2$; and the cell $\\mathrm{Gr}^\\mu$ lies in the even, respectively odd, components exactly when $\\dim\\mathrm{Gr}^\\mu$ is even, respectively odd.\n\n- **hypotheses:** *Per clause.* Clauses (1), (2) and (5) need the §2 standing setting — $k$ algebraically closed, $F = k((t))$, $\\mathcal{O} = k[[t]]$, $\\underline{G} = G\\otimes_k\\mathcal{O}$ **constant** reductive — and clause (2) needs in addition $\\mu$ **dominant** for the chosen $B$. Clause (3) needs $k$ algebraically closed and $G_F$ connected reductive, and nothing more; it is stated for a possibly non-constant $\\underline{G}$, which is why the coinvariants appear. Clause (4) needs $G$ **split**, which is automatic here. *Ground field — this entry is the one that does not narrow.* The source's standing base field in §1.3 and §2 is any algebraically closed $k$; no characteristic hypothesis is placed on the clauses transcribed above (the characteristic
