<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L2</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L2 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q2-L5-L2\n\n[node](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q2-L5-L2](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: instances\n\n**The dictionary.** Every source below computes convolution in $L^{+}G$-equivariant\n$\\ell$-adic sheaves on ind-schemes of ind-finite type, not in $\\mathcal{D}^{!}$ on quotient\nprestacks ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)). Four lines translate.\n(i) *Equivariance.* $\\mathcal{D}^{!}(K\\backslash\\mathcal{Y})\\leftrightarrow$ the equivariant\nderived category $D_{L^{+}G}(\\mathcal{Y})$: Raskin §3.17 defines $D^{!}(P)^{\\mathcal{G}}$ as the limit\nof the bar complex and Prop. 3.17.2 identifies it with $D^{!}$ of the base of a torsor; Zhu builds the same\ncategory by descent in §A.1.4. (ii) *Pushforward.* $q_{*,!-\\mathrm{dR}}\\leftrightarrow Rm_*$: Raskin\n§3.13 says $f_{*,!-\\mathrm{dR}}$ \"coincides with the usual pushforward functor in the finite type\nsetting\", and Zhu p. 58 notes $m_! = m_*$ since $m$ is ind-proper. (iii) *Twisted product.*\n$p^{!}(-\\boxtimes-)\\leftrightarrow\\widetilde{\\boxtimes}$ of Mirković–Vilonen (4.2). **This line\ndrops a shift:** the sources pull back by $p^{*}$ along the torsor legs, and $p^{!}\\simeq p^{*}[2d]$\nneeds a relative dimension $d$, which a torsor under $L^{+}G$ does not have. (iv) *Letters.*\n$\\mathcal{F}_\\nu = \\overline{\\iota}_{\\nu!}(k)\\leftrightarrow$ the constant sheaf on\n$\\mathrm{Gr}_{\\le\\nu}$ extended by zero, **not** $\\mathrm{IC}_\\nu$; the two differ once\n$\\overline{\\mathrm{Gr}}_\\nu$ is singular, and the sources state their results for perverse objects.\n\n## Precedent\n\n**What was searched.** Local library first: `zhu2016introduction` §1.2, §2.1, §5.1–5.2 (pp. 10–13,\n27–28, 58–62); `mirkovic2007geometric` §4 (pp. 12–16); `raskin_dmodules_infinite_var` §3.6–3.20 and\n§6.1–6.4 (pp. 8–16, 33–34). Web: Raskin, *Homological methods in semi-infinite contexts*\n(arXiv:2002.01395); searches for an iterated Hecke word on the loop space of a spherical variety, and\nfor a six-functor composition statement on placid prestacks.\n\n**What was found.**\n\n- **Zhu, *An introduction to affine Grassmannians and the geometric Satake equivalence* (2016),\n  arXiv:1603.05593, (5.1.3) with the sentence following it, printed p. 58.**\n  $\\mathcal{A}_1\\star\\mathcal{A}_2 := m_!(\\mathcal{A}_1\\widetilde{\\boxtimes}\\mathcal{A}_2)$, and\n  \"*Similarly, one can define the $n$-fold convolution product\n  $\\mathcal{A}_1\\star\\cdots\\star\\mathcal{A}_n = m_!(\\mathcal{A}_1\\widetilde{\\boxtimes}\\cdots\\widetilde{\\boxtimes}\\mathcal{A}_n)$\n  using the $n$-fold convolution map (1.2.15). Note that since $m$ is ind-proper, $m_! = m_*$.*\"\n  Together with printed p. 60 — the associativity constraints obtained \"*by identifying\n  $(\\mathcal{A}_1\\star\\mathcal{A}_2)\\star\\mathcal{A}_3$ and $\\mathcal{A}_1\\star(\\mathcal{A}_2\\star\\mathcal{A}_3)$\n  with $\\mathcal{A}_1\\star\\mathcal{A}_2\\star\\mathcal{A}_3$*\" — this is **clauses (2) and (3) under the\n  group specialisation** of instance 2 below: pushforward along the $r$-fold convolution map equals\n  the iterated binary convolution, peeled one letter at a time. The tower itself, with its stagewise\n  projections, is (1.2.15) and (2.1.17), which is **clause (1)**. *What it does not reach:* it is\n  stated for $\\mathrm{Gr}$, never for $LX$ with $X$ a spherical variety; it is stated for perverse\n  objects, whereas $\\mathcal{F}_\\nu$ is not perverse; and it is not stated as a proposition at all —\n  the identification is used to *define* the associator, because on ind-schemes of ind-finite type the\n  composition-compatibility that is this node's hypothesis **(A)** is free.\n- **Mirković–Vilonen, *Geometric Langlands duality and representations of algebraic groups over\n  commutative rings*, Ann. of Math. 166 (2007), Remark 4.5 with Proposition 4.6, printed p. 15.**\n  \"*In complete analogy with (4.2), we can define directly the convolution product of three sheaves\n  … Furthermore, we get canonical isomorphisms $\\mathcal{A}_1*\\mathcal{A}_2*\\mathcal{A}_3\\cong\n  (\\mathcal{A}_1*\\mathcal{A}_2)*\\mathcal{A}_3$ and $\\mathcal{A}_1*\\mathcal{A}_2*\\mathcal{A}_3\\cong\n  \\mathcal{A}_1*(\\mathcal{A}_2*\\mathcal{A}_3)$*\", then Prop. 4.6, associativity. The second\n  isomorphism is **clause (2) at $r=2$** in the group case. Their (4.1)–(4.2) also put hypothesis\n  **(C)** in print as a *construction* rather than an assumption: $\\widetilde{\\mathcal{A}}$ is the\n  unique descent of $p^{*}(\\mathcal{A}_1\\boxtimes\\mathcal{A}_2)$ along the free $G_{\\mathcal{O}}$-action.\n  *What it does not reach:* $p^{*}$ and not $p^{!}$ (dictionary line (iii)); perverse objects only;\n  and $\\mathrm{Gr}$, not $LX$. `refs.bib`: `mirkovic2007geometric`.\n- **Raskin, *D-modules on infinite dimensional varieties*, §3.8 with Prop. 3.8.1 (pp. 9, 11) and\n  §6.3 (p. 34).** $\\widetilde{D}^{!,\\mathrm{enh}}$ is a functor out of the category of qcqs schemes\n  *under correspondences* with finitely presented right leg, so composition-compatibility holds by\n  functoriality; §6.3 says \"exactly parallel … one shows that $D^{!}$ and $D^{*}$ upgrade (via Kan\n  extensions) to functors $D^{!,\\mathrm{enh}}$ and $D^{*,\\mathrm{enh}}$ from the categories of\n  **indschemes** under correspondences\". This is hypothesis **(A)** for schemes and for ind-schemes —\n  the two generalities [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(i) records. `refs.bib`: `raskin_dmodules_infinite_var`.\n\n**What was not found.** Hypothesis **(A)** at the node's own generality is *demonstrably absent from\nits natural home*. Raskin §3.16 is titled \"**Correspondences for prestacks**\" and its entire content\nis: \"*We say that a morphism $f:\\mathcal{Y}\\to\\mathcal{Z}$ is finitely presented if it is schematic,\nand if for any $S\\to\\mathcal{Z}$ with $S\\in\\mathsf{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\to S$\nis finitely presented. As another corollary of Proposition 3.6.1, we obtain that there is a functor\n$f_{*,!-dR}$ compatible with base-change for any finitely presented morphism $f$ of prestacks.*\" No\ncorrespondence category, no composition. The nearest miss is in the proof of Lemma 3.13.1 (p. 14),\nwhere for an **affine** finitely presented morphism of prestacks $f_{*,!-\\mathrm{dR}}$ is said to be\n*characterized* by base change plus agreement in finite type — a characterization that would force\ncomposition, but $q$ and $\\theta_i$ are not affine. Nothing was found doing the iterated Hecke word on\n$K\\backslash LX$ for any spherical $X$ other than the group case; the page-level record in\n[`papers/guideline.md`](../../../../papers/guideline.html) reports that Chen–Yi v4 contains no convolution resolution of\n$\\overline{LX}_\\lambda$ (not re-verified this run).\n\n## Instances\n\n### 1. The base case $r = 1$ — instance *(constructed, unsourced)*\n\n**What it is.** One letter: $Z^{(2)} = L^{+}X$, $Z^{(1)} = \\overline{LG}_{\\{\\nu_1\\}}\\times^{K}L^{+}X$,\n$\\rho_2$ the jet embedding, $\\rho_1 = \\pi_\\lambda = m_{\\{\\nu_1\\}}$.\n\n**Why it is an instance.** Finite presentation of $\\rho_1,\\rho_2,\\theta_1$ is [Q2-L5-L1](../Q2-L5-L1/index.html)(1)–(3),\nresting on [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html)(1)–(3), whose hypothesis\n\"$X$ smooth affine of finite type\" is met by the standing $X$ of [context](../../../../context.html).\n**(A)**, **(B)**, **(C)** are assumed, as in the general statement.\n\n**What it matches.** All three clauses, at $r=1$. It is the smallest place where **(A)** is used —\nexactly once, for $q\\circ\\theta_1$. *What it does not reach:* nothing about the induction, which is\nwhere a reader would look for an error.\n\n**What the statement says here.** $q\\circ\\theta_1 = \\rho_1$; and\n$\\pi_{\\lambda,*,!-\\mathrm{dR}}(\\mathcal{M}^{(1)})\\simeq\\mathcal{F}_{\\nu_1}\\ast\\mathrm{IC}_0$.\n\n**Source.** A routine specialisation of the node's own statement; no source claimed.\n\n### 2. The group case $X = H$ under $G = H\\times H$ — instance\n\n**What it is.** $LX = LH$, $K = L^{+}H\\times L^{+}H$, so $K\\backslash LX \\simeq L^{+}H\\backslash\\mathrm{Gr}_H$\nand $L^{+}X = L^{+}H$ maps to the base point. The tower is Zhu's $\\mathrm{Gr}_{\\le\\mu_\\bullet}$ with\nits convolution map (2.1.17).\n\n**Why it is an instance.** $X = H$ is smooth affine, and spherical for $H\\times H$ by the Bruhat\ndecomposition. $\\mathrm{IC}_0$ is the $!$-extension of the constant object on\n$K\\backslash L^{+}X = \\mathrm{pt}/L^{+}H$ ([$\\mathrm{IC}_0$](../../../../appendix/ic-0.html)), i.e. the monoidal unit, so **(B)**\nholds with $\\mathcal{M}^{(r+1)}$ the constant object on a classifying stack — the one place\n[$k_{\\mathcal{Y}}$](../../../../appendix/not-constant-object.html) does define it. **(C)** is Mirković–Vilonen's descent construction (4.2).\n**(A)** is *not* discharged in the node's sheaf theory even here; it is discharged only after passing\nalong dictionary line (i) to ind-schemes, where §6.3 supplies it.\n\n**What it matches.** Clauses (1)–(3), for this $X$, under the dictionary. *What it does not reach:*\nthe letters are $\\mathrm{IC}_\\nu$ in the sources and $\\overline{\\iota}_{\\nu!}k$ in the node\n(line (iv)); and this $X$ is registered `degenerate` in `key_examples.md` (K9) — though the reason\nit is degenerate there, $\\mathcal{F}\\ast\\mathrm{IC}_0 = \\mathcal{F}$, trivialises only the *last*\nletter of the word, not clauses (2)–(3).\n\n**What the statement says here.** $m_{*}$ of the $r$-fold twisted product of the\n$\\overline{\\mathrm{Gr}}_{\\nu_i}$ is $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}$.\n\n**Source.** Zhu, arXiv:1603.05593 — (5.1.3) and printed p. 60; Mirković–Vilonen (2007) — Rem. 4.5,\nProp. 4.6. `refs.bib`: `zhu2016introduction`, `mirkovic2007geometric`.\n\n### 3. An explicit word: $H = \\mathrm{GL}_2$, $\\nu_1 = \\nu_2 = \\omega_1$ — instance\n\n**What it is.** $\\omega_1 = (1,0)$ is minuscule, so $\\overline{\\mathrm{Gr}}_{\\omega_1} = \\mathrm{Gr}_{\\omega_1}\n\\cong \\mathrm{GL}_2/P_{\\omega_1} = \\mathbb{P}^1$ (Zhu, Lemma 2.1.13 with Ex. 2.1.12). The tower\n$Z_\\lambda = \\mathbb{P}^1\\,\\widetilde{\\times}\\,\\mathbb{P}^1$ is a $\\mathbb{P}^1$-bundle over\n$\\mathbb{P}^1$, smooth projective of dimension $2$, and $m\\colon Z_\\lambda\\to\\overline{\\mathrm{Gr}}_{(2,0)}$\nresolves the quadric cone (Zhu, Ex. 2.1.16 for $\\mathrm{Gr}_{\\le\\alpha^\\vee}$ in $\\mathrm{SL}_2$;\n$\\overline{\\mathrm{Gr}}_{(2,0)}$ is its translate by the central $t^{(1,1)}$). Zhu's Ex. 2.1.18 with\n(2.1.19)–(2.1.20) adds: \"*the convolution map $m$ in this case extends the Springer resolution for\n$\\mathrm{GL}_n$*\".\n\n**Why it is an instance.** It is instance 2 with $H = \\mathrm{GL}_2$ and the word $(\\omega_1,\\omega_1)$;\nevery hypothesis is discharged there, and here $\\overline{\\mathrm{Gr}}_{\\omega_1}$ is smooth, so\n$\\mathcal{F}_{\\omega_1}$ is the constant sheaf on $\\mathbb{P}^1$ and line (iv) of the dictionary is\nexact rather than lossy.\n\n**What it matches.** Clauses (2)–(3) at $r = 2$, concretely. *What it does not reach:* **(A)** and\n**(B)** are still discharged only after the change of sheaf theory.\n\n**What the statement says here.** $m_{*}k_{Z_\\lambda}\\simeq k_{\\mathbb{P}^1}\\ast k_{\\mathbb{P}^1}\\ast\\mathrm{IC}_0$,\nsupported on the quadric cone; Zhu's Cor. 5.1.5 computes the multiplicity spaces of the right-hand\nside as $H^{\\bullet}_c$ of the fibres of $m$, a computation that *uses* clause (3).\n\n**Source.** Zhu, arXiv:1603.05593 — Lemma 2.1.13, Ex. 2.1.16, Ex. 2.1.18 with (2.1.19)–(2.1.20),\nCor. 5.1.5. `refs.bib`: `zhu2016introduction`.\n";</script>
