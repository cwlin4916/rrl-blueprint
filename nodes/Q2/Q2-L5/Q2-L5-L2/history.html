<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L2</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L2 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L5-L2 — history\n\n[Q2-L5-L2](index.html) · [Q2-L5](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-09 — created** by `/decompose Q2-L5`, to carry that node's standing `FATAL`. [r1](../critiques/r1.html)'s Flaw 2 is that the identification $\\pi_{\\lambda!}k_{Z_\\lambda}\\simeq P_\\lambda$ — the one [Q2-L5](../index.html)'s closing paragraph reserves as *what is to be proved* — was reported closed \"modulo (FP) and (Eq)\" while resting on at least four further facts, none of them named in any statement. This node is where they are named: three are the hypotheses **(A)**–**(C)**, the fourth is finite presentation and is [Q2-L5-L1](../Q2-L5-L1/index.html).\n- **2026-08-09 — the referee's four items, and where each of them went.** Item 1, \"$*$-pullback along the $K$-torsors $p$ preserves constant objects\", is **not** assumed here and is not needed: ratified reading 4 of [context](../../../../context.html) computes $\\ast$ as $q_{*,!-\\mathrm{dR}}\\,p^{!}$, so the left leg enters through $p^{!}$ and the shift-sensitive $p^{*}$ the write-up used never appears. Item 2, the Künneth claim that a twisted external product of $!$-extensions is the $!$-extension of the twisted product, is hypothesis **(C)**, stated as one display per letter rather than as a general Künneth theorem, so that an appendix entry answering it has a target of exactly the right size. Item 3, that each factor and not only $\\pi_\\lambda$ needs finite presentation, is [Q2-L5-L1](../Q2-L5-L1/index.html) clauses (2)–(3). Item 4 is (Coh), which is [Q2-L5-L4](../Q2-L5-L4/index.html) and is deliberately not a hypothesis here — this node works on $\\mathcal{D}^{!}$ throughout, so it needs no object to be coherent.\n- **2026-08-09 — why hypothesis (A) is a hypothesis and not a citation.** [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html) states compatibility with composition as its clause (i), for **ind-schemes**, and its hypotheses line says outright that a node wanting the correspondence formalism on a quotient prestack still owes it. The write-up [r1](../critiques/r1.html) failed had cited clause (i) at Step 6 while working on $K\\backslash(-)$ throughout; naming the assumption is the repair, and it is used at one place only, the composites $q\\circ\\theta_i$ of clause (1). Flaw 4's item (δ) — that a pushforward descending along a torsor is a further compatibility beyond an equivalence of categories — is the same fact seen from the other side, and clause (iv) of the entry disposes of the *existence* half of it but not of this one.\n- **2026-08-09 — the constant object had no entry, and now it has one that stops short on purpose.** [$k_{\\mathcal{Y}}$](../../../../appendix/not-constant-object.html) was written in this run: main.tex names the constant $\\mathcal{D}$-module three times and defines it nowhere, and the phrase carried the whole of [Q2-L5](../index.html)'s $\\mathcal{F}_{\\nu_i}$, its $k_{Z_\\lambda}$ and its normalizing shift. The entry defines it on a finite-type scheme and on a group quotient of one — which covers $K\\backslash\\overline{\\mathrm{Gr}}_\\nu$, hence $\\mathcal{F}_\\nu$ — and refuses it on $K\\backslash L^{+}X$ and on $K\\backslash Z_\\lambda$, because the Kan-extended theories carry no $*$-pullback along the structure morphism of an infinite-dimensional prestack. That refusal is why **(B)** characterizes the bottom object by what it extends to rather than by naming it, and why clause (3) says which object the parent's phrase *the constant object on $Z_\\lambda$* is being read as.\n- **2026-08-09 — the choice of extension is fixed here, disposing of a MINOR.** [r1](../critiques/r1.html)'s Flaw 12 was that convolution needs an object on $K\\backslash\\mathrm{Gr}$ while [Q2-L5](../index.html) names only the constant object on the Schubert closure, leaving the extension unsaid; the write-up chose $!$ silently. The definition of $\\mathcal{F}_\\nu$ above makes that choice part of a statement.\n";</script>
