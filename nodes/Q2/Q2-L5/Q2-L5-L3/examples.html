<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L3</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L3 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q2-L5-L3\n\n[node](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q2-L5-L3](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: instances\n\n**The dictionary (group case).** Entries 2 and 4 read the node with $X = G_0$ under\n$G = G_0\\times G_0$, so $K = L^{+}G_0\\times L^{+}G_0$, $LX = LG_0$, $L^{+}X = L^{+}G_0$ and\n$K\\backslash LX \\simeq L^{+}G_0\\backslash\\mathrm{Gr}$. Line by line: $\\Lambda_X^{+}\\leftrightarrow X_*(T)^{+}$\nand $LX_\\lambda\\leftrightarrow\\mathrm{Gr}_\\lambda$ by the Cartan decomposition, with $\\mu\\le\\lambda$\nthe dominance order (Haines §2.1, p. 5); $\\overline{LX}_\\lambda\\leftrightarrow\\overline{\\mathrm{Gr}}_\\lambda$\n([$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html));\n$\\pi_\\lambda\\leftrightarrow m_{\\mu_\\bullet}$, the $r$-fold convolution morphism; membership of\n$X = G_0$ in the standing class is `BZSV` §7.6.2 (register entry K9). **What it drops:**\ncollapsing the right-hand $L^{+}G_0$ factor of $K$, so that $K\\backslash Z_\\lambda\\to K\\backslash LX$\nbecomes $L^{+}G_0\\backslash\\widetilde{\\mathcal{Q}}_{\\mu_\\bullet}\\to L^{+}G_0\\backslash\\mathrm{Gr}$, is\nbookkeeping I found written nowhere. It is the loose joint of both group-case entries.\n\n## Precedent\n\n**What was searched.** Local library first: `raskin_dmodules_infinite_var` (Table 1 p. 3;\n§3.13–3.20, pp. 14–16; §6.11–6.16, pp. 39–41), `chenyi_2025singularitiesorbitclosuresloop`\nv4 (§1.1–1.3, pp. 3–8; §10, pp. 51–53; Appendix A.4–A.8, pp. 56–62), `mirkovic2007geometric`\n(§3–4, pp. 8–17), `zhu2016introduction` (§5.1–5.2, pp. 58–62). Then the web, for proper base\nchange for **ind-proper** morphisms of prestacks, and for anything carrying fibrewise\ncohomology to a costalk in infinite type; that search returned Haines' equidimensionality\npaper, read at pp. 1–8.\n\n**What was found.**\n\n*Clause (1), at exactly the node's generality — Raskin.* §3.16 (p. 15) defines finite\npresentation for a morphism of prestacks and asserts \"there is a functor $f_{*,!-dR}$\ncompatible with base-change for any finitely presented morphism $f:\\mathcal{Y}\\to\\mathcal{Z}$\nof prestacks\"; the proof of Lemma 3.13.1 (p. 14) says more, that for such $f$ the functor is\n\"characterized by the fact that it satisfies base-change with the upper-$!$ functors\", and\nTable 1 (p. 3) records \"always satisfies base-change with upper-$!$ functors\" with no\nhypothesis on the pullback leg. This **entails clause (1)** under hypothesis (A) alone, for\n$\\varphi = i_\\mu$ and $\\varphi = j_U$ alike, and it is the content of\n[Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv). It touches\nnothing else: no support statement, no $\\mathcal{D}^{\\mathrm{ren}}$, no costalk. Note the\nconsequence for the node's status: relative to its own declared black box, clauses (1), (2)\nand (4) read as corollaries rather than lemmas — (4) in particular is clause (1) at\n$\\mu = \\lambda$ composed with its own displayed hypothesis.\n\n*The fibrewise-to-costalk bridge — found in two halves, neither at the node's generality.*\n(i) Haines, §2.2, **Lemma 2.1** (p. 6): the convolution morphism $m_{\\mu_\\bullet}$ \"is\nZariski-locally trivial in the stratified sense\", i.e. every point of a stratum has a\nZariski-open $V$ with $m^{-1}(V)\\cong F\\times V$ over $V$ (his (2.2.1)). That is exactly the\nmechanism that upgrades \"each fibre has cohomology $k[-n]$\" to \"the restriction of the\npushforward to the stratum is $\\omega[n]$\" — but for finite-type Schubert strata in\n$\\mathrm{Gr}$, i.e. the group case only. (ii) Chen–Yi, **Example 108** (p. 62): for $H$\nplacid and $\\mathcal{O} = H\\cdot y$ an $H$-orbit with stabilizer $S$, $\\mathcal{O}\\cong\\varprojlim_j H_j/S_j$\nis placid and $\\mathrm{Rep}(\\pi_0(S_j))\\cong\\mathrm{Perv}(H\\backslash\\mathcal{O})\\cong\\mathrm{Shv}(H\\backslash\\mathcal{O})$,\n$\\xi\\mapsto\\mathcal{L}_{\\xi,\\mathcal{O}}$. This **is** a definition and a classification of local\nsystems on an infinite-dimensional orbit — the object [r1](../critiques/r1.html) (Flaw 8) says\nnothing on disk defines — together with the Verdier exchange $\\mathbb{D}_Yf_!\\cong f_*\\mathbb{D}_S\\langle2\\dim_f\\rangle$\n(Lemma 106, p. 59) that turns a compactly-supported fibre statement into a costalk. It\nsupplies the *target* of the bridge and not the base change.\n\n**What was not found.**\n\n- **Nothing touches clause (3).** Raskin's own \"Renormalization\" (§6.14, p. 40; §6.16 with\n  Ex. 6.16.4, p. 41) is the $\\tau$-renormalized dualizing sheaf against a **dimension\n  theory**, and Chen–Yi's $D(H\\backslash Y)$ (A.5(2), p. 58) is a colimit of finite-type\n  categories. Neither is $\\mathrm{Ind}(\\mathcal{D}_c)$\n  ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), so nothing read\n  bears on whether $i_\\mu^{!}$ ind-extends.\n- **No base-change theorem for ind-proper morphisms exists in what was read.** Raskin gives\n  base change for *finitely presented* morphisms and gives ind-properness only an adjunction\n  (Table 1 p. 3; §6.3 p. 34). The node is right that (B) buys clause (1) nothing.\n- **Chen–Yi A.5(3) (p. 58) is the natural home for clause (1) in placid-stack language and\n  does not contain it:** it asserts $f_*, f_!, f^*, f^!$ for finitely presented representable\n  morphisms of placid stacks and asserts no base-change compatibility whatever.\n- No source states the fibrewise-to-costalk bridge for $\\pi_\\lambda$ over a general spherical $X$.\n\n## Instances\n\n### 1. The jet embedding, $r = 0$, $X$ homogeneous — instance\n\n**What it is.** $Z_\\lambda = L^{+}X$, $\\pi_\\lambda$ the jet embedding $L^{+}X\\hookrightarrow LX$,\n$\\lambda = 0$, $\\mathcal{M}$ any object of $\\mathcal{D}^{!}(K\\backslash L^{+}X)$.\n\n**Why it is an instance.** (A): [$L^+X\\hookrightarrow LX$ and $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html)(1)\nand (3), at $F = \\{0\\}$, give finite presentation of the jet embedding and of the induced\nmorphism of quotient prestacks in exactly [Raskin](../../../../appendix/bb-raskin-fp-pushforward.html)(iv)'s\nsense. (B): the same clause makes it a closed embedding, hence proper with scheme-theoretic\nimage $L^{+}X$; and for $X$ homogeneous $L^{+}X$ is a single $L^{+}G$-orbit, so\n$L^{+}X = LX_0 = \\overline{LX}_0$ — Chen–Yi §10.2 (p. 52) writes exactly this, \"the closed\n$L^{+}G$-orbit $LX_0 = L^{+}X$\".\n\n**What it matches.** All four clauses, literally, with $\\lambda = 0$. Clause (2) is\nnon-vacuous: every $\\mu\\ne 0$ has $\\mu\\not\\le 0$. Clause (4) holds with\n$\\mathcal{M} = \\omega_{K\\backslash L^{+}X}$ and $n_0 = 0$. **What it does not reach:** $r = 0$,\nso none of the twisted-product geometry is exercised, and it says nothing about clause (3)\nbeyond what coherence of $\\omega$ would give.\n\n**What the statement says here.** $\\Pi = \\iota_*\\mathcal{M}$ has $i_\\mu^{!}\\Pi = 0$ for\n$\\mu\\ne 0$, $\\operatorname{supp}\\Pi\\subseteq L^{+}X$\n([$\\operatorname{supp}$](../../../../appendix/not-supp.html)), and $i_0^{!}\\Pi\\simeq\\mathcal{M}$.\n\n**Source.** Chen–Yi, arXiv:2310.20006v4, §10.2, p. 52 (read 2026-08-09), for\n$LX_0 = L^{+}X$ closed; the rest is the appendix entry named. `refs.bib`:\n`chenyi_2025singularitiesorbitclosuresloop`.\n\n### 2. The convolution morphism onto a Schubert closure — instance, under the dictionary\n\n**What it is.** The group case, $r\\ge 1$, with $\\pi_\\lambda = m_{\\mu_\\bullet}$ the convolution\nmorphism\n\n$$\nm_{\\mu_\\bullet}\\colon\\ \\widetilde{\\mathcal{Q}}_{\\mu_\\bullet} := \\overline{\\mathcal{Q}}_{\\mu_1}\\widetilde{\\times}\\cdots\\widetilde{\\times}\\overline{\\mathcal{Q}}_{\\mu_r}\\ \\longrightarrow\\ \\overline{\\mathcal{Q}}_{|\\mu_\\bullet|},\n\\qquad \\lambda = |\\mu_\\bullet| = \\textstyle\\sum_i\\mu_i .\n$$\n\n**Why it is an instance.** (B) is in print twice over: Haines §2.1 (p. 5) — \"the projection\nonto the last coordinate gives the **proper surjective birational** morphism\n$m_{\\mu_\\bullet}\\colon\\widetilde{\\mathcal{Q}}_{\\mu_\\bullet}\\to\\overline{\\mathcal{Q}}_{|\\mu_\\bullet|}$\" —\nand Zhu p. 58, \"since $m$ is **ind-proper**, $m_! = m_*$\"; the target named is the Schubert\nclosure, which is $\\overline{LX}_\\lambda$ under the dictionary. (A) is **not discharged from a\nsource**: Haines and Zhu work with finite-type schemes and $\\ell$-adic sheaves, not with\nRaskin's prestack finite presentation, and that step is [Q2-L5-L1](../Q2-L5-L1/index.html)(2).\n\n**What it matches.** Clause (2)'s hypothesis and clause (4)'s display. For (4): $m$ proper\nbirational and $K$-equivariant, with $\\mathcal{Q}_{|\\mu_\\bullet|}$ a single open dense\n$K$-orbit, is an isomorphism over that orbit *(constructed, unsourced — the iso locus is\nopen, $K$-stable and meets the orbit)*, so the base change $\\pi^{i_\\lambda}_\\lambda$ is an\nisomorphism and the display holds with $\\mathcal{M} = \\omega$ and $n_\\lambda = 0$. Clause (1)\nis matched in its stalk form by Zhu **Cor. 5.1.5** with Rem. 5.1.6 (p. 59), which computes the\nrestriction of $\\mathrm{IC}_{\\mu_1}\\star\\cdots\\star\\mathrm{IC}_{\\mu_n}$ at $t^\\lambda$ as\n$H^{2d}_c(\\mathrm{Gr}_{\\mu_\\bullet}\\cap m^{-1}(t^\\lambda))$; MV **Lemma 4.4** (p. 14) is the\nsemismallness behind it. **What it does not reach:** clause (3) entirely, the prestack\ngenerality of (A), and the bookkeeping step named in the dictionary.\n\n**What the statement says here.** $\\mathcal{F}_{\\mu_1}\\star\\cdots\\star\\mathcal{F}_{\\mu_r}$ is\nsupported on $\\overline{\\mathrm{Gr}}_{|\\mu_\\bullet|}$ and restricts on the open stratum to\n$\\omega_{L^{+}G\\backslash\\mathrm{Gr}_{|\\mu_\\bullet|}}$, unshifted.\n\n**Source.** T. Haines, *Equidimensionality of convolution morphisms and applications to\nsaturation problems*, Adv. Math. 207 (2006) — §2.1, p. 5 (proper surjective birational);\nLemma 2.1, p. 6 (Zariski-local triviality in the stratified sense); p. 2 (projective,\nbirational, semi-small). **`refs.bib`: absent** — the two `haines*` keys there are the\ntest-function papers, not this one; PDF not in `papers/`, read from\n[math.umd.edu/~tjh/equidim10.pdf](https://www.math.umd.edu/~tjh/equidim10.pdf) on 2026-08-09.\nWith Zhu, arXiv:1603.05593, p. 58 and Cor. 5.1.5 with Rem. 5.1.6, p. 59 (`zhu2016introduction`);\nMirković–Vilonen, Lemma 4.4, p. 14 (`mirkovic2007geometric`).\n\n### 3. Chen–Yi's $\\mathrm{IC}_{\\chi,\\lambda}$ on $\\overline{LX}_\\lambda$, $X$ symmetric — analogue\n\n**What it is.** Not a pushforward along a correspondence, so **not an instance of the node**:\nthe object is the IC extension $\\mathrm{IC}_{\\chi,\\lambda}$ of an $L^{+}G$-equivariant local\nsystem $\\mathcal{L}_{\\chi,\\lambda}$ on the stratum $LX_\\lambda$, for $X = G/K$ symmetric\n(Chen–Yi §1.2.3, p. 7).\n\n**Why it is an analogue and not an instance.** It matches the *conclusions* of clauses (2)\nand (4) for an object living on $LX$: support inside $\\overline{LX}_\\lambda$; restriction to\n$LX_\\mu$ controlled stratum by stratum, with parity vanishing $\\mathcal{H}^i = 0$ for\n$i + \\delta(\\lambda)$ odd (Cor. 14(iv), p. 7); and a shift $\\delta(\\lambda)$ supplied by a\ndimension theory (Thm. 2 and (1), p. 4) playing exactly the role of the node's $n_\\lambda$.\nIt is the only place found where the objects clauses (2)–(4) speak about are constructed on\n$LX$ for a non-group $X$.\n\n**Hypotheses not discharged.** Chen–Yi's $X$ is **symmetric**, not general spherical, and\n§1.2.5 (p. 8) says the slice construction \"uses the involution $\\theta$ in an essential way\";\nthe sheaf theory is $\\ell$-adic $D(H\\backslash Y)$, not $\\mathcal{D}^{!}$ or\n$\\mathcal{D}^{\\mathrm{ren}}$; and no base change is asserted, so clause (1) is untouched.\n\n**Source.** Chen–Yi, arXiv:2310.20006v4 — §1.2.3 and Cor. 14, p. 7; Thm. 2 with (1), p. 4;\nAppendix A.5(3) and Example 108, pp. 58, 62; §1.2.5, p. 8 (read 2026-08-09). `refs.bib`:\n`chenyi_2025singularitiesorbitclosuresloop`.\n\n### 4. $X = \\mathrm{SL}_2/\\mathrm{SO}_2$ — a case the statement does not reach\n\n**What it is.** Chen–Yi **Remark 89** (pp. 51–52): for this complex symmetric variety there\nare $L^{+}G$-orbits of codimension one, $\\mathrm{Perv}_\\delta(L^{+}\\mathrm{SL}_2\\backslash LX)$\nis not semisimple, and there are IC-complexes with non-trivial coefficients; Remark 13 (p. 7)\nmakes the general point that orbits of odd codimension or with disconnected stabilizers\nproduce objects outside $\\mathrm{Rep}(\\check G_X)$.\n\n**What it matches, and in which direction.** It matches clause (4)'s **displayed hypothesis**\nand shows it is a real restriction: on such an $X$ the rank-one objects on $LX_\\lambda$ are\n$\\omega\\otimes\\mathcal{L}_\\chi[n]$ for $\\chi\\in\\mathrm{Rep}(\\pi_0(S_j))$ (Example 108), and\nonly $\\chi$ trivial gives the display. **It refutes nothing.** Clause (4) is a conditional and\nsimply says nothing here; what it bears on is the parent's fibrewise hypothesis\n[Q2-L5](../index.html)(b), whose closing words \"the resulting rank-one local system is\ntrivial\" this case shows to be load-bearing. Membership of $\\mathrm{SL}_2/\\mathrm{SO}_2$ in\nthe standing hyperspherical class was **not** verified here, and its cousin\n$\\mathrm{PSL}_2/\\mathrm{PO}_2$ is explicitly outside it (register entry K11), so a conjecture\nof its own would be needed before this could be pressed further.\n\n**Source.** Chen–Yi, *Singularities of orbit closures in loop spaces of symmetric varieties*,\narXiv:2310.20006v4 — Remarks 13, 89, Example 108. `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`.\n";</script>
