<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-L5-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-L5-L3 — history\n\n[Q2-L5-L3](index.html) · [Q2-L5](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-09 — created** by `/decompose Q2-L5`, carrying the second and third conclusion clauses of that node — the support bound and the costalk — as one claim about the same Cartesian square evaluated at different strata. They are one node and not two because the argument is one base change: the difference between them is only whether the base-changed source is empty.\n- **2026-08-09 — the statement is about an arbitrary $\\mathcal{M}$, and that is the point of the cut.** Nothing in clauses (1)–(3) depends on which object is pushed forward, so the normalization question — constant object or dualizing object, and by what shift they differ — is quarantined in the display of clause (4) and touches nothing else. That is the direct answer to [r1](../critiques/r1.html)'s Flaw 7: the referee found that \"absorbed into $n_\\lambda$\" was parenthetical, that $n_\\lambda$ was carrying two different integers, and that on these spaces the comparison of the constant and dualizing objects is not evidently an integer shift at all ([[raskin_dmodules_infinite_var](../../../../../papers/raskin_dmodules_infinite_var.pdf)] §6.10 and §6.14 being where a dimension theory would come from). Here there is one integer, it is introduced by one display, and it is introduced nowhere else.\n- **2026-08-09 — what this node does not bridge, and the bridge is named.** Hypothesis **(b)** of [Q2-L5](../index.html) is about compactly supported de Rham cohomology of the fibres of $\\pi_\\lambda$ over $k$-points, together with a rank-one local system on $LX_\\lambda$; clause (4) here asks instead for an equivalence of sheaves on $K\\backslash LX_\\lambda$. **The first does not imply the second in this closed world**, and the gap is exactly the two findings [r1](../critiques/r1.html) recorded: Flaw 5, that $H^\\bullet_{\\mathrm{dR},c}$ of a fibre pairs with a stalk of a $!$-pushforward while the conclusion is a costalk, and that the available base-change clause is against $!$-pullback, so applied at a point it computes neither $H^\\bullet_{\\mathrm{dR}}$ nor $H^\\bullet_{\\mathrm{dR},c}$; and Flaw 8, that \"the resulting rank-one local system on $LX_\\lambda$\" needs a notion of local system on an infinite-dimensional ind-scheme that nothing on disk defines. The cut leaves that passage standing as the single unbridged step of [Q2-L5](../index.html) and puts it at one address instead of five.\n- **2026-08-09 — clause (3) carries a caveat rather than eliding one.** [$\\operatorname{supp}$](../../../../appendix/not-supp.html) records in its clause **(R)** that $j_U^{!}$ on $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$ is the ind-extension of the restriction of the $\\mathcal{D}^{!}$-functor to coherent objects, which presupposes that the functor preserves coherence; that presupposition is not discharged here, so the renormalized reading of the vanishing is stated conditionally. Clause (2) is the unconditional one, on $\\mathcal{D}^{!}$, and it is the form hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html) consumes once membership in $\\mathcal{D}^{\\mathrm{ren}}$ is known from elsewhere. The support conclusion itself is read through clause **(F)** of the same entry, which is the direction — vanishing on the open complement gives the containment — that the entry does supply.\n- **2026-08-09 — one MINOR disposed of at statement level.** [r1](../critiques/r1.html)'s Flaw 10 objected that the write-up coined a reading of $\\operatorname{supp}$ inside a `proof.md`, where it binds nothing, and that the same symbol is the interface with [Q2-L3](../../Q2-L3/index.html). Since then [$\\operatorname{supp}$](../../../../appendix/not-supp.html) has been written, and this node cites it rather than coining anything; the same entry also supplies the category and the functor on the open complement whose existence the referee found asserted and unsupported.\n";</script>
