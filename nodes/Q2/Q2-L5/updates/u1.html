<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L5</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-L5 — u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L5/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date.** 2026-08-09 · `/update Q2-L5`, node-local, run under a claim on [Q2](../../../../dag.html).\n\n**Input.** A passage supplied by the user, arguing that the Bott–Samelson-type hypothesis of this node is sufficient but not necessary for [Q2](../../../../dag.html), that the triangular-lift condition should be the main statement, and that this node should be demoted to an optional geometric criterion.\n\n## The defect\n\nThree, each stated against the current statement rather than against a paraphrase of it.\n\n**D1 — the conclusion overstates its reach.** The closing clause reads \"which is hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html) at $\\lambda$, with the single generator $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$\". Hypothesis **(D)** of that node quantifies over **every** $a\\in A_\\lambda$, so the identification asserted here holds only when $\\#A_\\lambda = 1$, which this statement nowhere assumes. [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) exhibits $\\#A_\\lambda = 2$ and $\\#A_\\lambda = 4$ at different strata of a single $X$, so the gap between what this node delivers and what **(D)** asks is not hypothetical.\n\n**D2 — the parity variant asserts nothing.** Established at [r1](../critiques/r1.html) and recorded in the history on 2026-08-06: the variant is **not a weakening**. \"$\\pi_\\lambda$ is an isomorphism over $LX_\\lambda$\" already implies hypothesis **(b)** with $n_\\lambda = 0$, and \"a direct summand\" is satisfied by the whole object, so the paragraph restates the main claim under hypotheses that imply the main claim's. The write-up's `GAP (Par)` guards a door that is not there. A prover may not touch a `## Statement`, which is why this has stood since.\n\n**D3 — the title names a hypothesis the statement does not make.** \"Even proper resolutions produce the triangular objects\" calls $\\pi_\\lambda$ a resolution. The statement assumes ind-properness and cohomological triviality over the open stratum, and assumes neither smoothness of $Z_\\lambda$, nor birationality, nor point fibres. The title is quoted by the question's pipeline panel at build time, so it misreports the node wherever that panel is read.\n\n## Old statement, verbatim\n\n> Then $P_\\lambda := \\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$ satisfies\n>\n> $$\n> P_\\lambda\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\\qquad \\operatorname{supp}\\left(P_\\lambda\\right)\\subseteq\\overline{LX}_\\lambda,\\qquad i_\\lambda^!P_\\lambda\\ \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\ \\omega_{K\\backslash LX_\\lambda}\\left[n_\\lambda\\right],\n> $$\n>\n> which is hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html) at $\\lambda$, with the single generator $E_\\lambda = \\omega_{K\\backslash LX_\\lambda}$ of [Q2-L2](../../Q2-L2/index.html)(i).\n>\n> **Parity variant.** If (b) is weakened to: $\\pi_\\lambda$ is an isomorphism over $LX_\\lambda$ and every fibre of $\\pi_\\lambda$ has de Rham cohomology concentrated in even degrees, then the same conclusion holds for a direct summand $P_\\lambda$ of $\\mathcal{F}_{\\nu_1}\\ast\\cdots\\ast\\mathcal{F}_{\\nu_r}\\ast\\mathrm{IC}_0$, which still lies in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ because a cocomplete stable subcategory ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html)) is closed under retracts.\n\n## New statement\n\nThe hypotheses **(a)** and **(b)** are unchanged. The conclusion keeps its three displayed assertions verbatim and replaces the closing clause with one that states the restriction instead of eliding it: what is delivered is **(D)** at the single index carrying $\\omega$, and at that index only, with the reach beyond it named as open. The parity variant is **withdrawn**.\n\n## What was verified\n\n**Verified.**\n\n1. *The reach is $\\omega$ only* (D1). Checked against hypothesis **(D)** of [Q2-L3](../../Q2-L3/index.html), which quantifies over every $a\\in A_\\lambda$, and against [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html), whose second worked example has $A_\\lambda = \\{\\mathrm{triv},\\mathrm{sgn}\\}$ with $\\mathrm{sgn}$ right-orthogonal to $\\omega$ in every shift. This is the input passage's sharpest point and it survives.\n2. *The title overclaims* (D3). Read off the statement's own hypotheses.\n3. *$\\Lambda_X^+$ carries no monoid structure*, so no finite-$\\lambda$ reduction is currently expressible. Checked against [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html), which says so in as many words. Recorded for the repo-wide run; nothing in this node's statement depends on it.\n4. **(FP) is on disk and this node's `needs:` line was stale.** [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../../../../appendix/fp-convolution-morphism.html)(2)–(3) gives finite presentation of the bounded convolution morphism, and of its quotient-prestack form, in exactly the sense §6.3 of [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html)(iv) requires — which is what the old `needs:` line asked for as an unwritten entry.\n\n**Refuted.**\n\n1. *\"The converse is immediate, by taking $P_{\\lambda,a} := \\Delta_{\\lambda,a}$.\"* Refuted **as immediate**, in this closed world. Two of the three clauses of **(D)** are free that way — the Satake membership is the hypothesis itself, and $i_\\lambda^!i_{\\lambda!}E\\simeq E$ is full faithfulness in **(H1)**, with $n_{\\lambda,a} = 0$. The third is not: $\\Delta_{\\lambda,a}\\in\\mathcal{D}^{\\mathrm{ren}}_{\\overline{\\lambda}}$ asks for $i_\\mu^!i_{\\lambda!}E_{\\lambda,a}\\simeq 0$ whenever $\\mu\\not\\le\\lambda$, and **no appendix entry supplies that vanishing**. [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) closes by disclaiming any such assertion, and [Gunningham: $!$-restriction preserves coherence along a closed immersion of finite-orbit quotient stacks](../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html) is a coherence-preservation statement, not a vanishing one. The converse is a one-fact claim, and the fact is missing.\n2. *\"Demote this node to an optional geometric criterion.\"* Refuted as a **change**: it already is one. The node is a leaf with `required-by: —`, and its conclusion sentence has always terminated in hypothesis **(D)** of another node. There is nothing to demote.\n3. *\"(FP) is a standing gap.\"* Refuted by verified item 4.\n\n**Unverified.**\n\n1. *Juteau–Mautner–Williamson, parity sheaves* (arXiv 0906.2994), offered as the mechanism. **Not in `refs.bib` and not in `papers/`**, so it can be neither checked nor cited. This has been recorded in the history since 2026-08-05 and is unchanged.\n2. *Compressing $\\nu_1,\\dots,\\nu_r$ into a single Hecke object $\\mathcal{F}_\\lambda$.* Cosmetic here. The word structure survives inside the unimported convolution identification, which is [r1](../critiques/r1.html)'s standing `FATAL`, so the compression relocates the defect rather than removing it.\n3. *Cofinality and $K_0$-cyclicity are insufficient.* About [Q2-L8](../../Q2-L8/index.html); out of scope for a node-local run here.\n\n## Considered and not adopted\n\n**Widening hypothesis (b) to an arbitrary $E_{\\lambda,a}$.** This is the obvious response to D1 and it is forbidden twice over. A statement that is narrow is not wrong, and widening it in place discards the referee round it survived — [ADR 0078](../../../../process/decisions/0078-generalize-is-its-own-operator.html) split `/generalize` off for exactly this. `/generalize` is itself unavailable, since it requires a **verified** claim strictly more general than the node and no twisted analogue of this statement has been verified by anyone. The honest record is that the node reaches $\\omega$ and that the rest is open, which is what the new closing clause says.\n\n**Repairing hypothesis (b)'s second clause.** [r1](../critiques/r1.html) found that \"the resulting rank-one local system on $LX_\\lambda$\" is not statable in the available vocabulary: it needs a base change and a notion of local system on an infinite-dimensional ind-scheme that nothing on disk defines. Not repaired here, because every repair either invents the missing vocabulary — which `/update` may not do, the appendix being the lead-researcher's — or restates the conclusion as a hypothesis and empties the lemma. It stands as a defect and is named in the route. Withdrawing the parity variant does dispose of the sharpest consequence the referee drew from it: with $\\pi_\\lambda$ an isomorphism over the stratum, **(b)** forced $n_\\lambda = 0$ and only the \"absorbed into $n_\\lambda$\" clause stood between the conclusion and falsity. That configuration is now unreachable.\n\n## Reaching past this node\n\nRecorded, not acted on — this is a node-local run.\n\n- **The coverage gap is the question's, not this node's.** [Q2-L3](../../Q2-L3/index.html)(D) demands a triangular lift for every $a$; this node and [Q2-L6](../../Q2-L6/index.html) both terminate at $\\omega$. No node with `role: proof` anywhere in Q2 states an $a$-indexed geometric criterion, so the supply chain does not meet the demand and [Q2](../../../../dag.html)'s Problem statement does not say so.\n- **The necessity of (D) is a one-fact question**, and the fact — $i_\\mu^!i_{\\lambda!}\\simeq 0$ off the closure — is missing from the appendix. It would make **(D)** equivalent to the membership, hence a reformulation rather than a condition on $X$, exactly as [Q2-L1](../../Q2-L1/index.html) is.\n- **No propagation theorem is expressible** while [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) carries no monoid structure.\n";</script>
