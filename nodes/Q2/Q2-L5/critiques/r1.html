<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q2-L5</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q2-L5, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q2/Q2-L5/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nChecked first, and clean: the `## Lemma` section is **character-for-character** the node's\n`## Statement` (lines 18–46 of `Q2-L5_node.md` against lines 10–38 of `proof.md`), links\nincluded and at the correct depth — no strengthening of hypotheses, no weakening of the\nconclusion, no renotation. Every appendix anchor the draft links resolves in\n[appendix](../../../../appendix/index.html): `#not-standard-objects`, `#def-generation`,\n`#def-renormalized`, `#def-orbits-iwahori-spherical`, `#def-orbit-closure`, `#ic-0`,\n`#conv-hecke-action`, `#def-satake-subcategory`, `#bb-raskin-fp-pushforward`, plus\n`#bb-raskin-torsor-descent`, which the draft names only to disclaim. No bib key and no\n`main.tex` label is cited, so there is nothing to hallucinate. `#q2` exists in\n[main_dag](../../../../dag.html), the depends-on list is empty and no step smuggles in\nanother node: the references to Q2-L3 and Q2-L2 occur only inside the restated Lemma. The\ndegree convention quoted in the Caveats (\"$k[n]$ sits in degree $-n$\") is indeed what\n[context](../../../../context.html) line 51 says.\n\nI verified [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html)\nagainst `papers/raskin_dmodules_infinite_var.pdf` on the page. Table 1, p. 3, row 3 and\n§6.3, p. 34 are transcribed correctly, §6.3 reading verbatim: \"We say a morphism\n$f: T \\to S$ of indschemes is *finitely presented* if $f$ is schematic and its base-change\nby any scheme is a finitely presented morphism\", and \"For $f: S \\to T$ finitely presented\nwe have the corresponding functors $f_{*,!-dR} \\colon D^!(S) \\to D^!(T)$ … If $f$ is\nadditionally assumed proper or smooth, we again have the usual adjunctions.\"\n\n---\n\n**Flaw 1** [MAJOR] — The diagnosis is **correct**, I confirmed it independently, and the prover deserves credit\nfor it: hypothesis **(a)** gives ind-properness, the entry needs finite presentation in\n§6.3's sense, and ind-properness implies neither schematicity nor finitely presented base\nchange.\n\n<details><summary>(Step 4, \"**GAP (FP):** needed is an entry, or a strengthening of (a)\") · the finding</summary>\n\nTwo of the three conclusion clauses therefore rest on a hypothesis the node does\nnot have. But the consequence is not \"another proving round\": it is that **hypothesis (a)\nis wrong as written** and wants `/update` — \"$\\pi_\\lambda$ is ind-proper and finitely\npresented\" or a companion entry certifying iterated convolution maps as such. The draft\nsays \"an entry, or a strengthening of (a)\" and then leaves the node `drafted`; it should\nsay plainly that no write-up can close this.\n\nOne nuance the entry itself leaves loose and the draft inherits. The source has **two**\nnotions: §6.3's *finitely presented* (schematic, fp base change) and §6.13, p. 40's\n*ind-finitely presented* (\"$T = \\mathrm{colim}\\,T_i$ with each $T_i \\subseteq T$ a\nreasonable subscheme such that $T_i \\to S$ factors through a reasonable subscheme $S_i$ of\n$S$ with $T_i \\to S_i$ finite presentation\"), which is **not** schematic. Table 1's row 3\nis labelled with the second phrase and references the first. The appendix entry silently\nresolves this in favour of §6.3 — defensible, since §6.3 is where the functor is\nconstructed, but it is the entry's choice and not the source's, and it is the difference\nbetween a hypothesis the node might plausibly verify for $Z_\\lambda \\to LX$ and one it\nprobably cannot. This belongs in the entry as a note, since the whole of GAP (FP) turns on it.\n\n</details>\n\n**Flaw 2** [FATAL]\n\n<details><summary>(Step 6, \"Granting (FP) and (Eq), the first unimported identification\nholds\") · the finding</summary>\n\nThis is the identification the statement's closing paragraph reserves as *what is to be\nproved*, it is the load-bearing step of the whole write-up, and it is reported closed\nmodulo (FP) and (Eq) while resting on at least four further things none of which is (FP),\n(Eq) or standard mathematics needing no citation:\n\n1. \"$*$-pullback along the $K$-torsors $p$ preserves constant objects.\" No declared entry\n   supplies a $*$-pullback on the theory the entry works in.\n   [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) posits $p^*$\n   as part of the definition of $\\ast$, but $p$ is a torsor under $K = L^+G$, which is\n   *infinite-dimensional*, so \"$p^*$ and $p^!$ agree up to the relative dimension shift\" is\n   not an integer statement at all without a dimension theory (Raskin §6.10, p. 38;\n   Warning 6.13.2, p. 40). The claim is asserted, it is shift-sensitive, and the shift is\n   exactly what the conclusion's $n_\\lambda$ is about. The Caveats say \"no step uses\" the\n   $\\mathcal{D}^! \\simeq \\mathcal{D}^*$ identification; that is true of the *pushforward*,\n   and this sentence puts a $*$-pullback on the wrong side of the same divide.\n2. \"$\\mathrm{IC}_0$ is the $!$-extension of $k_{K \\backslash L^+X}$, which puts $L^+X$ in\n   the last slot of $Z_\\lambda$.\" This asserts that the twisted external product of a\n   $!$-extension is the $!$-extension of the twisted product — a Künneth/base-change claim,\n   nowhere supplied.\n3. Clause (i) is compatibility with composition **of finitely presented morphisms**. Step 6\n   composes $r$ maps $q$ *and* the closed embedding\n   $Z_\\lambda \\hookrightarrow LG \\widetilde{\\times}^K \\cdots \\widetilde{\\times}^K LX$. GAP\n   (FP) is stated for $\\pi_\\lambda$ alone; each factor needs it too.\n4. GAP (Coh) — see Flaw 3.\n\nBy the standard this round was given, a step reported closed that needs undeclared\ningredients is fatal, and this is the step where it matters most: everything the write-up\nclaims to establish about support runs through it.\n\n</details>\n\n**Flaw 3** [MAJOR] — The gap is honest, correctly identified as the analogue of the import\n[$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) ratifies, and looks fillable by an entry.\n\n<details><summary>(Step 2's \"**GAP (Coh)**\", and its scope in Steps 6–7) · the finding</summary>\n\nBut\nits *scope* is understated in two directions.\n\nFirst, without (Coh) the object $P_\\lambda$ is not merely hard to place in the Satake\nsubcategory — it is **undefined**. [the spherical Hecke action\n$\\ast$](../../../../appendix/conv-hecke-action.html) defines $\\mathcal{F} \\ast \\mathcal{G}$ for\n$\\mathcal{F} \\in \\mathcal{D}_c(K \\backslash \\mathrm{Gr})$ and its $\\mathrm{Ind}$-extension\nfor $\\mathcal{F} \\in \\mathcal{H}_K^{\\mathrm{ren}}$; membership of the constant object in\neither is precisely (Coh). So (Coh) is a precondition of the *statement*, not of one step.\n\nSecond, Steps 6 and 7 are both headed \"Granting (FP) and (Eq)\" and both conclude something\nabout $P_\\lambda$ — Step 6 that $\\pi_{\\lambda!}k_{Z_\\lambda} \\simeq P_\\lambda$, Step 7 that\nStep 1's reading holds *of $P_\\lambda$*. Both therefore need (Coh) as well. The accounting\nin the return message (\"the support bound and the convolution identification close modulo\n(FP) and (Eq)\") is wrong on its own terms.\n\n</details>\n\n**Flaw 4** [MAJOR] — The split is not exhaustive.\n\n<details><summary>(Step 5, \"**GAP (Eq):** needed are (α) … and (β) …\") · the finding</summary>\n\nTwo further items sit between the entry and the statement:\n\n(γ) *Typing.* Ind-extending $f_{*,!-\\mathrm{dR}}$ to\n$\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$ presupposes\n$\\mathcal{D}_c(\\mathcal{Y}) \\subseteq \\mathcal{D}^!(\\mathcal{Y})$, so that \"coherence-\npreservation\" is even a well-formed request. The only place the blueprint says so is a\n*note* on [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), which is not in\nthis node's `objects:`, and the same presupposition is what licenses the Caveats' reading of\nthe entry's first note (the convolution's $q_*$ and the entry's $f_{*,!-\\mathrm{dR}}$ agree\n\"on $\\mathcal{D}^!$\"). Without it the Caveats' disclaimer protects nothing, because the\ncategories the statement is about have not been placed on either side of the duality.\n\n(δ) *Functors, not just categories.*\n[Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html)\n— correctly identified as out of the closed world — gives an equivalence of *categories*.\nThat a pushforward descends along it is a further compatibility, and it is what\n$\\pi_{\\lambda!}$ on the quotient stacks actually requires.\n\nNaming the undeclared entry and refusing to use it is the right move and I commend it.\n\n</details>\n\n**Flaw 5** [MAJOR] — The bookkeeping does not close, so the second sentence is unearned.\n\n<details><summary>(Caveats, \"matching $i_x^!\\left(\\omega_{K \\backslash LX_\\lambda}[n_\\lambda]\\right)$.\nStep 8 fails on transport, not bookkeeping\") · the finding</summary>\n\nWith the repository's\nown convention, $i_x^!\\omega = k$ in degree $0$, hence\n$i_x^!\\left(\\omega_{K \\backslash LX_\\lambda}[n_\\lambda]\\right) = k[n_\\lambda]$ sits in\ndegree $-n_\\lambda$, while hypothesis **(b)**'s $k[-n_\\lambda]$ sits in degree $+n_\\lambda$.\nThe two sit in *opposite* degrees. They are reconciled only after a dualization: pushing\n$\\omega_{Z_\\lambda}$ rather than $k_{Z_\\lambda}$ gives\n$\\psi^!\\omega_{Z_\\lambda} \\simeq \\omega_{\\pi_\\lambda^{-1}(x)}$ and hence\n$\\left(H^\\bullet_{\\mathrm{dR},c}(\\pi_\\lambda^{-1}(x))\\right)^\\vee$ in the opposite degrees,\nwhich is what matches. So the sign is right only for a hypothesis (b) that the statement\ndoes not make.\n\nUnderneath this is a $*$/$!$ mismatch worth stating on its own. $H^\\bullet_{\\mathrm{dR},c}$\nof the fibre is what pairs with a **stalk** of a $!$-pushforward, while the conclusion is a\n**costalk**; and the only base-change clause available, (ii), is against $!$-pullback, so\napplied at $\\varphi = i_x$ it computes $\\Gamma\\left(\\pi_\\lambda^{-1}(x), \\psi^!k_{Z_\\lambda}\\right)$,\nwhich is neither $H^\\bullet_{\\mathrm{dR}}$ nor $H^\\bullet_{\\mathrm{dR},c}$ of the fibre. The\nconstructive repair is at statement level: phrase (b) with $\\omega$'s, as\n$\\Gamma_{\\mathrm{dR}}\\left(\\pi_\\lambda^{-1}(x), \\omega\\right) \\simeq k[n_\\lambda]$.\n\n</details>\n\n**Flaw 6** [MAJOR] — The parity variant is not a weakening of (b) — it **implies** (b).\n\n<details><summary>(the Lemma's **Parity variant**, and Step 9's \"**GAP (Par)**\") · the finding</summary>\n\nIf $\\pi_\\lambda$ is an\nisomorphism over $LX_\\lambda$ then $\\pi_\\lambda^{-1}(x) \\simeq \\mathrm{pt}$ for every\n$k$-point $x \\in LX_\\lambda$, so $H^\\bullet_{\\mathrm{dR},c}(\\pi_\\lambda^{-1}(x)) \\simeq k = k[-0]$,\n(b) holds with $n_\\lambda = 0$, and the resulting rank-one local system is the constant one,\nhence trivial. The evenness clause is then *additional* hypothesis, not a substitute.\n\nConsequently, under the standard reading of \"a direct summand\" — which includes the\nimproper one — the parity variant follows from the main claim by taking the summand to be\n$\\mathcal{F}_{\\nu_1} \\ast \\cdots \\ast \\mathcal{F}_{\\nu_r} \\ast \\mathrm{IC}_0$ itself. **GAP\n(Par) is a phantom**: nothing in the paragraph as written asks for a proper, indecomposable\nor parity summand, so no decomposition theorem is needed to satisfy it. Step 9 misreads its\nown Lemma, and the paragraph as it stands has no content beyond the main statement. Both\nhalves want fixing: the write-up's accounting, and the statement, which should either name\nwhat the summand must satisfy that the whole pushforward does not, or go.\n\nTwo smaller slips in the same paragraph. The variant says \"de Rham cohomology\" where (b)\nsays compactly supported de Rham cohomology. And it leaves $n_\\lambda$ **unbound**: the\nclause that introduced $n_\\lambda \\in \\mathbb{Z}$ is the one being replaced, yet \"the same\nconclusion\" displays $\\omega_{K \\backslash LX_\\lambda}[n_\\lambda]$.\n\n</details>\n\n**Flaw 7** [MAJOR] — The absorption is not stated precisely enough to be checkable, and it does hide the shift\nthe same sentence says is to be proved.\n\n<details><summary>(the Lemma's closing paragraph, \"which is absorbed into $n_\\lambda$\") · the finding</summary>\n\nThree points.\n\n(i) The symbol $n_\\lambda$ carries two different integers: the one (b) pins down by fibre\ncohomology, and the one the conclusion shifts by. They cannot be equal if the normalizing\nshift is nonzero. The repair is trivial and should be made: quantify a fresh\n$n'_\\lambda \\in \\mathbb{Z}$ in the conclusion — which is all\n[Q2-L3](../../Q2-L3/index.html)(D) consumes, since it asks only for the *existence* of\n$n_{\\lambda,a}$.\n\n(ii) The failing case for the literal reading is the simplest one. Take $\\pi_\\lambda$ an\nisomorphism over $LX_\\lambda$: (b) forces $n_\\lambda = 0$, so the conclusion reads\n$i_\\lambda^!P_\\lambda \\simeq \\omega_{K \\backslash LX_\\lambda}$, while $\\pi_{\\lambda!}$ of\nthe *constant* object restricts to a constant object. Only the \"absorbed\" clause stands\nbetween the statement and falsity, which is precisely why it must be made explicit rather\nthan parenthetical.\n\n(iii) Worse, on these spaces the shift is not evidently an integer. Comparing the constant\nand dualizing objects on $K \\backslash L^+X$, or on $K \\backslash LX_\\lambda \\simeq BK_\\lambda$\nwith $K_\\lambda$ infinite-dimensional, is exactly what Raskin's §6.14 (\"Renormalization\",\np. 40) introduces the $\\tau$-renormalized $\\omega^\\tau_T$ for, and it needs a **dimension\ntheory** (§6.10, p. 38; Prop. 6.11.3, p. 39: dimension theories form a torsor under locally\nconstant functions, so the normalization is a choice). No declared entry supplies one for\n$Z_\\lambda$, for $K \\backslash L^+X$ or for $K \\backslash LX_\\lambda$ —\n[sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) supplies one for $LX$ and\nis not declared here anyway.\n\n</details>\n\n**Flaw 8** [MAJOR] — The gap is real and honestly flagged, and the prover is right that the node cannot close\nthis clause.\n\n<details><summary>(Step 8, \"**GAP (Loc):** … and the passage from (b)'s $k$-points to a\nsheaf\") · the finding</summary>\n\nBut the gap as *named* is not the gap that exists, and an entry written to\nthis specification would leave the node stuck.\n\nStep 8 renders the missing ingredient as a statement about an object of\n$\\mathcal{D}^{\\mathrm{ren}}(K \\backslash LX_\\lambda)$ \"with rank-one $!$-costalk in degree\n$n_\\lambda$ and trivial monodromy\". That is not hypothesis (b). (b) is a statement about\nthe **fibres of $\\pi_\\lambda$**; getting from there to a costalk of $P_\\lambda$ is base\nchange, i.e. clause (ii) — available once (FP) is granted, but only against $!$-pullback\n(Flaw 5), so it does not deliver $H^\\bullet_{\\mathrm{dR},c}$. Step 8 silently assumes that\npassage and names only the one after it.\n\nOn the quantifier question the prover's judgement is half right. (b)'s second clause is\nindeed sheaf-level and does repair the quantifier *in intent*: on a single $K$-orbit a\n$K$-equivariant object with one-dimensional stalks in a fixed degree is a shifted rank-one\nequivariant local system, and (b) says the corresponding character of the component group\nof the stabilizer is trivial. But \"the resulting rank-one local system on $LX_\\lambda$\"\npresupposes (a) the base change just discussed, and (b) a notion of *local system on an\ninfinite-dimensional ind-scheme*, which no entry in the closed world defines. So (b) cannot\nbe stated in the available vocabulary — a finding about the statement, to be fixed by\nphrasing (b) directly about the $K$-equivariant object $i_\\lambda^!P_\\lambda$ rather than\nabout fibres and a local system.\n\n</details>\n\n**Flaw 9** [MINOR] — Clause (iii) of the entry says **proper**; (a) says **ind-proper**.\n\n<details><summary>(Step 4, \"(a) does supply the extra properness clause (iii) asks for\") · the finding</summary>\n\nThese are not the same\nword, and the entry's own provenance note records that Table 1 says \"ind-proper\" where §6.3\nsays \"proper\" — so the slack is the entry's, but the draft states the match as a fact. It\ncosts nothing here, since **no step of the write-up uses clause (iii) at all**: Step 6 uses\n(i) and Step 7 uses (ii). The sentence should either go or be marked as unused.\n\n</details>\n\n**Flaw 10** [MINOR] — Coining the reading $\\operatorname{supp}(P_\\lambda) \\subseteq \\overline{LX}_\\lambda\n:\\Leftrightarrow j_U^!P_\\lambda = 0$ inside a `proof.md` binds nothing.\n\n<details><summary>(Step 1, \"No entry defines $\\operatorname{supp}$\") · the finding</summary>\n\nThe reading is the\nstandard one and I have no quarrel with it mathematically, but it is the **interface** with\n[Q2-L3](../../Q2-L3/index.html), whose own write-up states in its Caveats that support is\n\"consumed only as a matched symbol … under one reading throughout\" — so both sides are\nassuming the other has fixed it. A weak reading here makes Q2-L5's second clause cheap and\nQ2-L3's hypothesis (B) correspondingly stronger. This wants a ratified reading in\n[appendix](../../../../appendix/index.html) or [context](../../../../context.html), not a line in a proof.\n\nAlso asserted in the same step and supplied by nothing: that\n$U := LX \\setminus \\overline{LX}_\\lambda$ carries a category\n$\\mathcal{D}^{\\mathrm{ren}}(K \\backslash U)$ and a functor $j_U^!$ at all.\n\n</details>\n\n**Flaw 11** [MINOR] — The setup sentence attaches two appendix citations to the very identification the closing\nparagraph says is \"part of what is to be proved and … not imported\".\n\n<details><summary>(the Lemma's opening, \"so that $\\pi_{\\lambda!}$ of the constant object\ncomputes the Hecke translate … ([the spherical Hecke action $\\ast$], [$\\mathrm{IC}_0$])\") · the finding</summary>\n\nThe draft rightly\ntreats it as to be proved (Step 6), so the citations in the setup sentence are misleading\nand should move or go — as written they read as the import the last paragraph forbids.\n\n</details>\n\n**Flaw 12** [MINOR] — Convolution needs an object on $K \\backslash \\mathrm{Gr}$, and the statement never says how\nthe constant object on the Schubert closure is extended.\n\n<details><summary>(the Lemma, \"$\\mathcal{F}_{\\nu_i}$ the constant object on\n$K \\backslash \\overline{\\mathrm{Gr}}_{\\nu_i}$\"; Step 2) · the finding</summary>\n\nStep 2 silently chooses the\n$!$-extension. For a closed embedding the choice is immaterial, but the statement should\nmake it, since GAP (Coh) is stated *about* that choice.\n\n</details>\n\n**Flaw 13** [MINOR] — The **locations** are accurate — §6.3 is p. 34, §6.16 is p. 41, Prop. 6.18.1 is p. 42, all\nread on the page this round — but the **content** claim is not.\n\n<details><summary>(`papers/guideline.md`, the block \"Added by `/prove` — Q2-L5 (round 2 …)\") · the finding</summary>\n\n§6.16 and Prop. 6.18.1 are\nabout $f_{*,\\mathrm{ren}}$, the pushforward renormalized against a choice of **dimension\ntheory** on placid indschemes (§6.14, §6.16.2; Prop. 6.18.1 requires $f$ *placid* and $S$\nequipped with a dimension theory). That has nothing to do with coherence-preservation, and\nnothing to do with $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}\\,\\mathcal{D}_c$ in this\nrepository's sense: two unrelated senses of \"renormalized\" have been identified. The block's\n\"which is what would let it ind-extend to\n$\\mathcal{D}^{\\mathrm{ren}}(K \\backslash Z_\\lambda) \\to \\mathcal{D}^{\\mathrm{ren}}(K \\backslash LX)$\"\nis false as a reading of that source, and would send the next entry-writer to the wrong\npages. (§6.14 and §6.10 *are* the right pages for the $\\omega$-normalization half of GAP\n(Loc) — see Flaw 7(iii) — which is a different use.)\n\n</details>\n\n---\n\n## What is and is not established\n\n- **Satake membership** ($P_\\lambda \\in \\mathcal{D}^{\\mathrm{ren}}(K \\backslash LX)^{\\mathrm{Sat}}$):\n  **not established**, but the only obstruction is (Coh), and Step 3's argument from\n  [the Satake subcategories](../../../../appendix/def-satake-subcategory.html)(1) is correct as\n  far as it goes — granting (Coh) it is a one-line consequence, and the ratified ambient for\n  the generation is quoted correctly.\n- **Support** ($\\operatorname{supp}(P_\\lambda) \\subseteq \\overline{LX}_\\lambda$): **not\n  established**. Step 7's own inference from a scheme-theoretic image to\n  $\\pi_\\lambda^{-1}(U) = \\emptyset$ to clause (ii) is sound; it stands on Step 6 (Flaw 2),\n  (FP) (Flaw 1), (Eq) (Flaw 4) and (Coh) (Flaw 3).\n- **The convolution identification** ($\\pi_{\\lambda!}k_{Z_\\lambda} \\simeq P_\\lambda$): **not\n  established**, and further from established than the draft says (Flaw 2).\n- **The costalk clause**: **not established**, correctly reported, and the reported gap is\n  itself understated (Flaw 8).\n- **Parity variant**: its Satake clause is as above; its remaining content is empty as the\n  paragraph is written (Flaw 6).\n\nThree of the thirteen flaws — 1, 6 and 7 — are about the **statement**, not the write-up,\nand no round of proving can dispose of them: hypothesis (a) lacks finite presentation, the\nparity variant is degenerate, and $n_\\lambda$ names two integers. They want `/update`. I\nstop short of `REFUTED` because none of them makes the statement *false*: the parity variant\nis vacuous rather than wrong, and the closing paragraph's \"absorbed into $n_\\lambda$\", read\ngenerously as \"for some integer\", is repairable rather than refutable.\n\nThe write-up's honesty is genuine and worth saying: five gaps named, an undeclared appendix\nentry named and refused, a notational licence quoted with its limits, and a Lemma\ntranscribed exactly. That is the right way to fail.\n\nVERDICT: FAIL\n";</script>
