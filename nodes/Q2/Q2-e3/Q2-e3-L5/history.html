<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-e3-L5</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-e3-L5 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-e3-L5 — history\n\n[Q2-e3-L5](index.html) · [Q2-e3](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose` of [Q2-e3](../index.html), under [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html). **What it matches:** clauses (ii), (iii) and (iv) of the parent, which are one disjunction with two consequences and so are one node; the specialisation is $\\lambda = 0$, the stratum where $G_\\lambda\\cong\\mathrm{O}_2$ and $\\mathrm{sgn} = \\det$. **What it does not reach:** the disjunction itself. Clause (B) reformulates it and does not settle it, and no node of this run claims to know whether the Satake subcategory of this $X$ is stable under the sign twist.\n- **2026-08-06 — why the reformulation is worth a clause.** The sign character of $\\pi_0(G_0)$ is not confined to the stratum: it extends to an $LG$-equivariant rank-one local system $\\mathcal{L}$ on the whole component $LX^{\\mathrm{even}}$, taken from the square roots of the discriminant. Equivariance makes $\\otimes\\mathcal{L}$ commute with the Hecke action, so \"is the sign block reachable\" becomes \"is the Satake subcategory fixed by $\\otimes\\mathcal{L}$\" — a statement about the subcategory rather than about one costalk, and one a prover can attack with the projection formula rather than with a fibre computation.\n- **2026-08-06 — the tension with the parent's polarity, recorded rather than acted on.** The parent's polarity paragraph reads \"boundary, and negative for Q2's problem statement exactly when clause (ii) fails\". Two findings of this run cut across it: [Q2-e3-L3](../Q2-e3-L3/index.html) makes the membership fail whether or not clause (ii) fails, and [Q2-e3-L1](../Q2-e3-L1/index.html) puts $X$ outside the standing class the problem statement quantifies over, so the failure is not a negative answer to [Q2](../../../../dag.html) at all. The parent's `## Statement` is frozen and was not edited; the `/decompose` run reports both to the user for `/update` to weigh.\n";</script>
