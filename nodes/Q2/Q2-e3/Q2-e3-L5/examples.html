(§11, §12), sending the basic object to the unit and $K$-orbits to real arc-group orbits. *What it drops:* it is stated under \"$G_\\mathbb{R}$ connected (equivalently $K$ connected)\" (p. 4), which **fails** in every case relevant here; Macerato–Taylor §1.3 and `BZSV` §7.6.5 use it anyway, past its published hypothesis.\n\n**(D2) Sheaf–function.** `BZSV` §9.4 (9.15), p. 200: $C_c^\\infty(X_F/G_{\\mathcal O})$ with $\\mathbf 1_{X(\\mathcal O)}$ shadows $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ with [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html). A $G$-equivariant rank-one $\\mathcal{L}$ with $\\mathcal{L}^{\\otimes2}\\simeq\\mathbf 1$ becomes a $\\pm1$-valued $G(F)$-invariant function; the $\\pi_0$-local systems of one geometric stratum become the arithmetic $K$-orbits inside it. *What it drops:* everything homological — generation by cones, colimits and retracts is not $\\mathcal H$-module generation.\n\n## Precedent\n\n**What was searched.** Local library first: `chen2024real` (§1, §9.2 on local systems on orbits), `BZSV` §7.6 (catalogue of known cases), `chenyi_2025singularitiesorbitclosuresloop` v4 App. A.7. Then the web for metaplectic/twisted geometric Satake (Gaitsgory–Lysenko arXiv:1608.00284, Reich arXiv:1012.5782), for $\\mathrm{PSL}_2/\\mathrm{PO}_2$, and for the $p$-adic Hecke module of symmetric forms.\n\n**What was found.**\n\n- **Clause (D), in print, for the node's own $X$ — and for a *different* reason than the node gives.** Corato-Zanarella, arXiv:2311.00147v2, p. 2, on $X = \\mathrm{Sym}_{r\\times r}(F)\\cap\\mathrm{GL}_r(F)$: \"*The case considered in our Theorem A is not covered by the above results, as $X$ has roots of type $N$*\", so Sakellaridis's Thm 1.4.1 does not apply. `BZSV` §7.6.5, pp. 169–170, says the same of $\\mathrm{PSL}_2/\\mathrm{PO}_2$ (\"*outside of our hyperspherical setting due to the presence of Type N roots*\"). This **entails** clause (D)'s conclusion that $X$ is outside the standing class. It does **not** reach the node's stated route — condition (2) of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html), connected $B$-stabilizers; no source found equates the two failures, and they should not be conflated.\n- **Clause (B), answered in the nearest published analogue.** See instance 3. Nothing states the node's *equivalence* — that equivariance of $\\mathcal L$ makes membership of $\\Delta_{0,\\mathrm{sgn}}$ the same as stability of the whole subcategory under $\\otimes\\mathcal L$.\n- **No contradiction anywhere.** Nothing found is incompatible with any clause.\n\n**What was not found.** The metaplectic-Satake literature is the natural vocabulary home and demonstrably does not contain the question. Gaitsgory–Lysenko and Reich twist by a *factorizable gerbe on $\\mathrm{Gr}$*, producing a different monoidal category with a different dual group; they never ask whether a twist of a Satake-type **sub**category lands inside the untwisted one. Likewise `chen2024real` §9.2 (Lemma 9.2, Lemma 9.3) sets up a bijection between local systems on orbits on both sides, but its statements are about the *whole* category and are silent on the Hecke-generated part.\n\n## Instances\n\n### 1. The $\\pi_0$-classification of standard objects — instance (of clause (A)'s framework only)\n\n**What it is.** Chen–Yi's set-up: $\\mathcal{O} = H\\cdot y$ an orbit in an $H$-placid ind-scheme, $S$ its stabilizer, $S_j$ the jet images.\n\n**Why it is an instance.** The node's $LX_\\lambda$, $K$, $G_\\lambda$ are that data ([Q2-e3-L2](../Q2-e3-L2/index.html)(B) supplies $\\pi_0(G_0)\\cong\\mathbb{Z}/2$); the placidity and pro-unipotent-kernel hypotheses hold by the same source's Thm 36 with Rem. 37.\n\n**What it matches.** Clause **(A)**'s framing only: a rank-one equivariant local system on $LX_0$ *is* a character of $\\pi_0(G_0)$, and $\\Delta_{0,\\mathrm{sgn}} = j_!\\mathcal{L}_{\\mathrm{sgn}}$ is a legitimate object. It does **not** reach (A)'s content — that the character extends to a global $\\mathcal{L}$ on $LX^{\\mathrm{even}}$ through square roots of $\\det$ — nor (B), (C), (D).\n\n**What the statement says here.** $\\mathrm{Rep}(\\pi_0(G_0)) \\cong \\mathrm{Perv}(K\\backslash LX_0)$, so $\\{\\mathrm{triv},\\mathrm{sgn}\\}$ index two standard objects at $\\lambda=0$, exchanged by Verdier duality.\n\n**Source.** Chen–Yi, *Singularities of orbit closures in loop spaces of symmetric varieties*, arXiv:2310.20006v4 — **Example 108** (p. 62), with (48)–(53). `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`.\n\n### 2. The classical shadow at the node's own $X$ — analogue (dictionary D2)\n\n**What it is.** Not an instance: the $p$-adic function-theoretic image of the node's $X$. $F$ a $p$-adic field, $p>2$, $X = \\mathrm{Sym}_{r\\times r}(F)\\cap\\mathrm{GL}_r(F)$ with $K = \\mathrm{GL}_r(\\mathcal{O}_F)$ acting by $x\\cdot k = k^{\\mathsf T}xk$ — the same variety and the same action as the node's, at $r = 2$.\n\n**Why it is an instance.** Same $G$, same $X$, same $K$-action; the strata match [Q2-e3-L2](../Q2-e3-L2/index.html)(A). Not discharged: the node's field is $k((t))$ with $k$ algebraically closed and its category is sheaves, not functions — hence \"analogue\".\n\n**What it matches.** Clauses **(B)** and **(C)** under D2. The discriminant class $\\det A \\in F^\\times/(F^\\times)^2$ is $G(F)$-invariant, which is (C)'s mechanism; its unit part $\\mathcal O^\\times/(\\mathcal O^\\times)^2$ is (B)'s sign twist, and it is exactly the source's index set $\\mathrm{Sign} = \\mathbb{F}_q^\\times/(\\mathbb{F}_q^\\times)^2 = \\{\\pm1\\}$ (its §1.3). It does **not** reach (A) or (D), and D2 drops all derived structure.\n\n**What the statement says here.** $\\mathcal{S}(X/K,R)$ is a **free** $\\mathcal H(G,K,R)$-module of rank $4^r$, with an explicit basis indexed by a sign function $s\\colon\\{1,\\dots,r\\}\\to\\{\\pm1\\}$ and a vector $e$; at $r=2$ the rank is $16$ and the basis is Hironaka's. So the basic function generates a cyclic — hence proper — submodule: the shadow of the node's conclusion, and a *large* failure rather than a marginal one. *(Constructed, unsourced, two lines:* $\\mathcal H$ is a domain and the module is torsion-free, so $h\\cdot\\mathbf 1_{X(\\mathcal O)} = \\eta_{\\mathcal L}\\cdot\\mathbf 1_{X(\\mathcal O)}$ would force $h=1$ and $h=-1$ on the two unit-discriminant orbits at once — the sign-twisted function is unreachable.*)\n\n**Source.** M. Corato-Zanarella, *Spherical functions of symmetric forms and a conjecture of Hironaka*, arXiv:2311.00147v2 — **Theorem A** (p. 2), **Cor. 5.9** with **Rem. 5.10** (p. 23: at $r=2$ this is Hironaka, *Spherical functions of Hermitian and symmetric forms II*, Japan. J. Math. **15** (1989), §4, Thm 4). Also p. 2, citing Jacquet, C. R. Acad. Sci. **312** (1991) 957–961: the dual object here is expected to be controlled by the **metaplectic double cover** $\\widetilde{\\mathrm{GL}}_r(F)$ — i.e. the sign part is expected to live in a *different* dual datum, not inside the untwisted one. `refs.bib`: absent (both).\n\n### 3. $X = \\mathrm{PGL}_2/\\mathrm{PO}_2$ — analogue (dictionary D1)\n\n**What it is.** Not an instance: the *adjoint* sister variety, of rank one where the node's is rank two. $G = \\mathrm{PGL}(2,\\mathbb{R})$, $\\mathrm{Gr} = G_K/G_O$; $G_O$-orbits $\\mathrm{Gr}^n$, $n\\ge 0$; $\\pi_0(\\mathrm{stab}_G(t^n)) = \\mathbb{Z}/2$ at **every** orbit, so each carries $k^+$ and $k^- = \\mathrm{sgn}$, with $\\Delta(n)^\\pm := i_{n!}k^\\pm[n/2]$. Under D1 this is $\\mathcal{D}(X(\\mathcal{K})/\\mathrm{PGL}_2(\\mathcal{O}))$ for $X = \\mathrm{PGL}_2/\\mathrm{PO}_2$ (their §1.3).\n\n**Why it is an instance.** Symmetric, disconnected stabilizer, $\\pi_0 = \\mathbb{Z}/2$ at the closed orbit, $\\Delta(0)^-$ literally the node's $\\Delta_{0,\\mathrm{sgn}}$ of [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html). Not discharged: the variety is $\\mathrm{PGL}_2/\\mathrm{PO}_2$, not $\\mathrm{GL}_2/\\mathrm{O}_2$; the sheaf theory is real-analytic Betti and abelian, not the cocomplete [the Satake subcategories](../../../../appendix/def-satake-subcategory.html).\n\n**What it matches.** Clauses **(A)**, **(B)**, **(C)**. (A): \"*the character of $\\Delta(n)^-$ is given by tensoring with the sign representation*\" (Prop. 2.3.1) is the twist relation. (C): two connected components $\\mathrm{Gr}^{\\mathrm{even}}$, $\\mathrm{Gr}^{\\mathrm{odd}}$, and the Satake functor lands in the even one. (B): §2.4 (2.2) with Prop. 2.4.1 and (2.3). It does **not** reach (D), and it does not state (B)'s equivalence.\n\n**What the statement says here.** The image of the Satake functor ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) composed with nearby cycles) is exactly $\\{L(2n)^+\\}$ — **even** orbits, **trivial** local system — and (2.3) says these are closed under convolution. Meanwhile Prop. 4.4.1 splits $\\mathrm{Perv}(\\mathrm{Gr}^{\\mathrm{odd}})$ into $\\pm$ blocks and the next sentence reads \"*On the even component there is no such splitting*\", so the naive block argument for unreachability is **unavailable** on the component $\\mathrm{IC}_0$ lives on. *(Constructed, unsourced:* the class of objects whose perverse cohomologies have all Jordan–Hölder factors among $\\{L(2n)^+\\}$ is closed under shifts, cones and retracts, so $\\Delta(0)^-\\notin$ the generated subcategory — clause (ii) fails in this analogue, by a Jordan–Hölder argument rather than by a block splitting.*)\n\n**Source.** M. Macerato, J. Taylor, *The real affine Grassmannian and quantum SL(2)*, arXiv:2408.00931v2 — §1.1, Prop. 2.3.1, §2.4 with Prop. 2.4.1 and (2.3), Prop. 4.4.1 (p. 8), Thm. 5.3.1. Companion: Nadler, *Perverse sheaves on real loop Grassmannians*, Invent. Math. **159** (2005) 1–73, whose main theorem identifies *a certain tensor category* — a proper subcategory — with $\\mathrm{Rep}(\\check H)$. `refs.bib`: absent (both).\n";</script>
