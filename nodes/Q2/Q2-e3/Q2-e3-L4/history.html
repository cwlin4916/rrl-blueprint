<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-e3-L4</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-e3-L4 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-e3-L4 — history\n\n[Q2-e3-L4](index.html) · [Q2-e3](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose` of [Q2-e3](../index.html), under [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html). **What it matches:** clause (i) of the parent verbatim — the existence of a Hecke translate with clean costalk $\\omega_{K\\backslash LX_\\lambda}[n]$ — specialised to $\\lambda = 2\\mu$ and $\\mathcal{F} = \\mathrm{IC}_\\mu$, which is also hypothesis (b) of [Q1-L6](../../../Q1/Q1-L6/index.html) at those strata. **What it does not reach:** the strata with $|\\lambda|$ even and $\\lambda\\notin2\\Lambda^+$, the first of which is $(1,1)$; those are reachable in support — they lie inside $\\overline{LX}_{2\\mu}$ for suitable $\\mu$ — but no costalk is computed for them here, and the parent's clause (i) stays open at them.\n- **2026-08-06 — where the single-point fibre comes from.** Writing $u = g^{-1}t^\\mu$, the fibre condition $g^{-1}t^{2\\mu}(g^{-1})^t\\in L^+X$ reads $uu^t\\in\\mathrm{GL}_2(\\mathcal{O})$, i.e. $g\\in t^\\mu\\,\\mathrm{O}_2(F)\\,K$; the image of $\\mathrm{O}_2(F)$ in $\\mathrm{Gr}$ is discrete, and the elementary divisor type of $t^\\mu s$ for $s\\in\\mathrm{O}_2(F)$ outside $\\mathrm{O}_2(\\mathcal{O})$ leaves $\\overline{\\mathrm{Gr}}_\\mu$. Checked by hand at $\\mu = (1,0)$, where $\\overline{\\mathrm{Gr}}_\\mu\\cong\\mathbb{P}^1$ and the fibre over $t^{(2,0)}$ is the single point $t^{(1,0)}K$, and at $\\mu = (2,0)$, where the next self-dual lattice has type $(3,-1)\\not\\le(2,0)$. One line of the reasoning is recorded here because it is what makes the node a one-page write-up rather than an open computation.\n- **2026-08-06 — why it is stated for $2\\mu$ and not for all $\\lambda$.** The image of $c_\\mu$ has open stratum $2\\mu$ for the elementary reason that $t^\\mu(t^\\mu)^t = t^{2\\mu}$, so the strata a *single* convolution reaches on top are exactly the doubled coweights. That the odd strata are unreachable by any $\\mathcal{F}$ at all is the separate and stronger claim of [Q2-e3-L3](../Q2-e3-L3/index.html); the two together are why clause (i) of the parent had to be cut into a positive and a negative half rather than settled in one node.\n";</script>
