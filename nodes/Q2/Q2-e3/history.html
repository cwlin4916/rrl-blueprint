<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q2-e3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-e3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-e3 — history\n\n[Q2-e3](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by `/decompose` of [Q2](../../../dag.html), from the user's input passage (Test 3 of it): it is the smallest symmetric variety where the connectedness hypothesis of [Q2-L2](../Q2-L2/index.html)(i) fails, so it is the one case that can decide whether Q2's generator-collection formulation is doing real work or is bookkeeping. Either outcome is informative, which is why the node states both branches rather than a conjecture.\n- **2026-08-05 — relation to what is already on the tree.** [Q1-e6](../../Q1/Q1-e6/index.html) records $X=\\mathrm{PSL}_2/\\mathrm{PO}_2$ as the case where a connected-stabilizer hypothesis is load-bearing, and [Q1-L3-a4](../../Q1/Q1-L3/Q1-L3-a4/index.html) records the decategorified failure of saturation for disconnected stabilizers. This node is the categorical form of the same phenomenon, asked about a specific pair of local systems on a specific orbit.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: the local-system stress test at $\\mathrm{GL}_2/\\mathrm{O}_2$. It turns on $\\pi_0(G_\\lambda)\\neq 1$, and the walk confirmed that the component group is the same whether $G_\\lambda$ or $G_\\lambda^{\\mathrm{red}}$ is meant — which is why the mis-description corrected in [Q2-L2](../Q2-L2/index.html) changed no conclusion here.\n- **2026-08-06 — statement revised** by `/update Q2-e3` ([u1](updates/u1.html)), on the user's instruction that each Q2 example be readable on its own and declare its polarity. The claim it instantiates is now quoted inside the statement instead of linked, and the statement opens on its polarity — **boundary / conditional negative** — under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html). The mathematics is unchanged.\n- **2026-08-06 — decomposed into five sub-lemmas** by `/decompose Q2-e3`, under [ADR 0047](../../../process/decisions/0047-an-example-node-is-a-proposition.html): an example node is a proposition, so it decomposes, and its children inherit its role — none of [Q2-e3-L1](Q2-e3-L1/index.html)–[Q2-e3-L5](Q2-e3-L5/index.html) is a `proof` node, so no computation in this one variety enters [Q2](../../../dag.html)'s tally. The cut adds, before the four clauses, the two things the statement assumes without claiming: membership in the standing class ([Q2-e3-L1](Q2-e3-L1/index.html)) and the stratum data ([Q2-e3-L2](Q2-e3-L2/index.html)). The `## Statement` was not touched.\n- **2026-08-06 — two findings of that run that bear on this statement, reported and not acted on.** First, the generic $B$-stabilizer of $X$ is $\\mu_2\\times\\mu_2$, so condition (2) of [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) fails and $X$ is **out of class**, not merely outside the conjecture's hypotheses — which means a failure of the membership here cannot be a negative for [Q2](../../../dag.html)'s problem statement, since that quantifies over the standing class. Second, $v(\\det)$ is locally constant on $LX$ and the Hecke action shifts it by an even amount, so every stratum with $p+q$ odd is unreachable outright and the membership fails at this $X$ regardless of how clause (ii) goes. Both cut against the polarity paragraph's \"negative for Q2's problem statement exactly when clause (ii) fails\"; a statement is revised only by `/update`, so they are recorded here and in [Q2-e3-L1](Q2-e3-L1/history.html) and [Q2-e3-L5](Q2-e3-L5/history.html) for that operator to weigh.\n- **2026-08-06 — statement revised again** by `/update Q2-e3` ([u2](updates/u2.html)), on the computation `/decompose Q2-e3` returned: the generic $B$-stabilizer is $\\mu_2\\times\\mu_2$, so $X$ fails condition (2) of [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) and is **out of class**. The polarity recorded in [u1](updates/u1.html) hours earlier — *boundary, conditional negative* — was wrong in both halves, and clause (iv)'s inference to a negative answer for [Q1](../../../dag.html) went with it. A second obstruction found in the same run — the discriminant valuation moves only by even amounts, so odd strata are unreachable and clause (i) is false there — is recorded but not yet folded in; it lives as [Q2-e3-L3](Q2-e3-L3/index.html).\n- **2026-08-07 — the statement now says, explicitly, how the example stands to its parent** by `/update`. The relation was in the prose and said differently in each of the four examples, so no reader could line them up. Every Q2 example now carries the same block immediately after its polarity line, in four fixed slots: whether $X$ is in the standing class, whether it meets [Q2](../../../dag.html)'s conjecture's hypotheses, whether the membership the problem statement asks about holds, and what the case contributes to the main theorem — each linked to the [key-example register](../../../key_examples/index.html) entry that settles it in print. Its four slots: **not** in the standing class, both halves of the conjecture's hypothesis fail, the membership is not asked here — and what it contributes is the separation of two hypotheses the conjecture bundles. Adjacent to [K11](../../../key_examples/k11.html), `out-of-class`.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
