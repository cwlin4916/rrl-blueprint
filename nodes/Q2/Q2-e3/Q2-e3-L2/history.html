rm{sgn}$\" — under the specialisation $LX = \\{A\\in\\mathrm{GL}_2(F): A^t=A\\}$ with $K=\\mathrm{GL}_2(\\mathcal{O})$ acting by $g\\cdot A = gAg^t$. It is the instance of [Q2-L2](../../Q2-L2/index.html)(ii)–(iii) that [Q2-e1](../../Q2-e1/index.html) is the instance of [Q2-L2](../../Q2-L2/index.html)(i). **What it does not reach:** which of the $\\Delta_{\\lambda,a}$ are in the Satake subcategory — that is [Q2-e3-L3](../Q2-e3-L3/index.html) and [Q2-e3-L4](../Q2-e3-L4/index.html) — and the closure order on $\\Lambda_X^+$, which no child of this run needs.\n- **2026-08-06 — provenance of clause (A), and why the black box is not cited.** The parametrization $\\Lambda_X^+ = \\{(p,q): p\\ge q\\}$ with the action $g\\cdot t^\\lambda = gt^\\lambda g^t$ is exactly §3.2.1 of `chenyi_2025singularitiesorbitclosuresloop` (v4, p. 10, read this run), which treats $G=\\mathrm{GL}_2$, $\\theta(g)=(g^t)^{-1}$, $K=\\mathrm{O}_2$ as its *fundamental case* and remarks on the page that Prop. 17(i) is proved in [Nad04] without assuming $K$ connected. The appendix entry [Chen–Yi symmetric orbits](../../../../appendix/bb-chenyi-symmetric-orbits.html) nevertheless carries \"$G^\\theta$ connected\" in its hypotheses, so inside the closed world the black box is unavailable here; clause (A) is therefore claimed as this instance's own computation — the Jordan splitting of a nondegenerate quadratic $\\mathcal{O}$-lattice in residue characteristic $\\neq2$ — and cites nothing. The gap in the entry is reported to the user by the `/decompose` run.\n- **2026-08-06 — the count is $2$ or $4$, not always $2$.** At $\\lambda=(p,p)$ the stabilizer is $\\mathrm{O}_2(\\mathcal{O})$ and $\\pi_0(G_\\lambda)=\\mathbb{Z}/2$; at $\\lambda=(p,q)$ with $p>q$ the equations $gt^\\lambda g^t = t^\\lambda$ force $a = \\pm d$ and $b = \\mp c\\,t^{p-q}$, and reduction modulo $t$ leaves $\\mu_2\\times\\mu_2\\times\\mathbb{G}_a$, whose reductive quotient is $\\mu_2\\times\\mu_2$. The parent says \"at least the two elements\", so nothing in it is contradicted; what is new is that the excess is real, and that $\\pi_0(G_\\lambda)\\neq1$ holds at *every* $\\lambda$ rather than at some.\n";</script>
