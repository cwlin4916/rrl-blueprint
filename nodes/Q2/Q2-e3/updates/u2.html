+b^2 & bd \\\\ bd & d^2 \\end{pmatrix}, \\qquad g = \\begin{pmatrix} a & b \\\\ 0 & d \\end{pmatrix}.\n$$\n\n$B$ is three-dimensional and $\\dim X = 3$, so $B\\cdot I$ is open and dense. Its stabilizer is cut out by $bd = 0$, $d^2 = 1$, $a^2+b^2 = 1$: since $d\\neq0$ this forces $b = 0$ and then $a = \\pm1$, so\n\n$$\n\\mathrm{Stab}_B(I) \\;=\\; \\{\\mathrm{diag}(\\pm1,\\pm1)\\} \\;\\cong\\; \\mu_2\\times\\mu_2,\n$$\n\nwhich has four components. Condition (2) of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) therefore fails, and $X$ is **out of class**.\n\n## A second, coarser obstruction, reported and not yet folded into the statement\n\n$\\det(gAg^{t}) = \\det(g)^2\\det A$, so Hecke translation shifts the valuation of the discriminant only by even amounts, while [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) sits where that valuation is $0$. Hence **every** stratum with $p+q$ odd is unreachable — the trivial block included — and clause (i) as written is false at such a $\\lambda$. This is a defect in clause (i), not in the polarity, and it is left for a later revision rather than repaired here: [Q2-e3-L3](../Q2-e3-L3/index.html) states it as its own claim, so the obligation is visible and a `/prove` round has to meet it.\n\n## What changed\n\nThe polarity paragraph now reads **out-of-class** and names the $\\mu_2\\times\\mu_2$ computation, and a second paragraph says what the case can still establish — which of the two bundled hypotheses obstructs the membership. Clause (iv)'s conclusion, which inferred a negative answer to [Q1](../../../../dag.html), is corrected: the membership failing at an out-of-class $X$ refutes nothing. Clauses (i)–(iii) and their labels are untouched, so the `## Decomposition` and the five children still quote the statement they were cut from.\n";</script>
