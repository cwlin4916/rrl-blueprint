<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-e3-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-e3-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-e3-L3 — history\n\n[Q2-e3-L3](index.html) · [Q2-e3](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose` of [Q2-e3](../index.html), under [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html). **What it matches:** the second half of the parent's clause (ii) — \"or none does\" — and the conclusion of its clause (iv), specialised to the strata $\\lambda = (p,q)$ with $p+q$ odd, where the answer is settled and negative. It is the node that decides the parent's disjunction on that part of the poset. **What it does not reach:** the strata with $p+q$ even, where clause (ii) stays open — the reformulation of the remaining question is [Q2-e3-L5](../Q2-e3-L5/index.html)(B), and the positive half of clause (i) is [Q2-e3-L4](../Q2-e3-L4/index.html).\n- **2026-08-06 — why the obstruction is coarser than the one the parent anticipated.** The parent was cut expecting the failure, if any, to be a *local system* failure: the sign block of a stratum with $\\pi_0(G_\\lambda)\\neq1$ unreachable while the trivial block is reachable. What the computation gives is cruder and stronger. The discriminant $\\det A \\in F^\\times/(F^\\times)^2$ is invariant under $A\\mapsto gAg^t$ for $g\\in LG$, so $LG$ has two orbits on $LX$ and the Satake subcategory lives on one of them; more precisely $v(\\det)$ is locally constant, $LX = \\bigsqcup_n LX^{(n)}$ is open-and-closed, and convolution shifts $n$ by $2|\\mu|$. Whole strata, not blocks inside a stratum, are what goes missing.\n- **2026-08-06 — the precedent already on the tree.** [Q1-L3-a4](../../../Q1/Q1-L3/Q1-L3-a4/index.html)(3) records the same mechanism in its smallest form: $X = \\mathbb{G}_m$ under the square action of $\\mathbb{G}_m$, generic stabilizer $\\mu_2$, saturation confined to the even-valuation locus and the Satake subcategory omitting every odd orbit. This node is that phenomenon in the first symmetric variety where it occurs, and clause (1) of the same analogy node — non-cyclicity of the Schwartz space of a space of forms over a $p$-adic field — is its function-theoretic shadow.\n";</script>
