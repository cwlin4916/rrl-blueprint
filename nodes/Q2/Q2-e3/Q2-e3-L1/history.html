<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q2-e3-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q2-e3-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q2-e3-L1 — history\n\n[Q2-e3-L1](index.html) · [Q2-e3](../index.html) · [Q2](../../../../dag.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose` of [Q2-e3](../index.html), under [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html): an example node is a proposition, so it decomposes, and its children inherit its role. **What it matches:** the standing-class premise the parent assumes and never claims — condition (2) of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html), the connectedness of the generic $B$-stabilizer — specialised to $X = \\mathrm{GL}_2/\\mathrm{O}_2$ under $g\\cdot A = gAg^t$. **What it does not reach:** anything about the loop space; the node is a statement about $X$ itself, and the stratum data is [Q2-e3-L2](../Q2-e3-L2/index.html)'s.\n- **2026-08-06 — the finding, and the tension it creates with the parent's polarity.** The generic $B$-stabilizer computes to $\\mu_2\\times\\mu_2$: for $g$ upper triangular, $gg^t = I$ forces $g$ diagonal with $\\pm1$ entries, and the orbit $B\\cdot I$ is the open locus $A_{22}\\neq0$, of dimension $3 = \\dim X$. So condition (2) fails and the instance is **out of class**, not merely outside the conjecture's connectedness hypothesis. The parent's statement — frozen, and untouched by this run — records the polarity as \"boundary, and negative for Q2's problem statement exactly when clause (ii) fails\"; the finding here says the second half is too strong, since [Q2](../../../../dag.html)'s problem statement quantifies over the standing class and this $X$ is not in it. Reported to the user by the `/decompose` run rather than acted on, since a statement is revised only by `/update`.\n- **2026-08-06 — corroboration already on the tree.** [Q1-e6](../../../Q1/Q1-e6/index.html) records the closely related $\\mathrm{PSL}_2/\\mathrm{PO}_2$ as placed outside the hyperspherical setting by BZSV for having a spherical root of type $N$, and notes there that a type-$N$ root is sufficient and not necessary for condition (2) to fail. This node settles the condition directly for $\\mathrm{GL}_2/\\mathrm{O}_2$ by computation, so it does not inherit that gap.\n";</script>
