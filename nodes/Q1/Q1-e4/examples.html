<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-e4</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-e4 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-e4\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [papers](../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-e4](index.html), and explicit instances of it, simplest first. This file is outside the closed world: it justifies believing or doubting the statement and no proof may cite it.\n\nEVIDENCE: counterexample\n\nStatement pieces referred to below:\n\n- **(S1)** $X=M_n$ smooth affine spherical with open orbit $\\mathrm{GL}_n$;\n- **(S2)** \"the unramified equivalence is a theorem of Braverman–Finkelberg–Ginzburg–Travkin [Thm 3.6.1]\";\n- **(S3)** the Hecke computation $\\mathcal{T}_j\\ast\\delta_X=\\mathrm{I}_j$;\n- **(S4)** the companion-case list;\n- **(S5)** the orbit closures are genuinely singular;\n- **(S6)** [the three standing hypotheses](../../../appendix/assum-intro.html)(c) *holds* while (a) is in doubt;\n- **(S7)** the \"Against Q3's package\" paragraph.\n\n**The dictionary** (needed only for entry 3, which is an analogue). BZSV hyperspherical duality is an involution on pairs, sending $(G,M=T^*X)$ to $(\\check G,\\check M)$; here it sends $X=M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ to $\\check X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ under the same group, and back.\n\nIn print: BZSV p. 170 writes the general Rankin–Selberg line of it — \"the dual is $\\check X=\\mathrm{Mat}_{m\\times n}$ acted on by $\\check G=\\mathrm{GL}_m\\times\\mathrm{GL}_n$\" — and BFGT §1.7 (p. 8) writes the translation out for their $\\overline\\Phi$:\n\n$$\nD\\mathsf{Coh}(V_X^\\vee/G_X^\\vee)\\simeq D_{G(\\mathbf{O})}(X(\\mathbf{F})),\n$$\n\nwith $X=\\mathrm{GL}_N$ as a $\\mathrm{GL}_{N-1}\\times\\mathrm{GL}_N$-space and $V_X^\\vee$ a matrix space.\n\n**What it drops:** it is a correspondence between *statements*, not a functor. It sends the conjecture for $X$ to the conjecture for $\\check X$; it does not move $\\mathcal{D}_c(L\\check X)$ to $\\mathcal{D}_c(LX)$, and reading an equivalence backwards does not either.\n\n## Precedent\n\n**What was searched.** BFGT `BravermanFinkelbergGinzburgTravkin_2021` read on disk: abstract and §§1.1–1.9 (pp. 1–9), §§3.1–3.6 (pp. 16–22). `BZSV` read on disk: §7.3 (pp. 155–159), §7.6 (pp. 168–171), §8.3–8.5 (pp. 180–189). Web, for what is not on disk and treated as leads only: Travkin–Yang, and any source placing a matrix space on the automorphic side.\n\n**What was found — a contradiction to (S2) and to the first half of (S6).**\n\n**1. BFGT, Theorem 3.6.1 (p. 22), with §3.2 (p. 17) and §3.4 (p. 19).** The three constructible sides are\n\n$$\nD_{!\\mathbf{G_O}},\\;D_{!*\\mathbf{G_O}},\\;D_{*\\mathbf{G_O}}(\\mathbf{Gr}\\times\\mathbf{V}),\n$$\n\nand §3.2 reads verbatim: \"We will make use of an identification $\\mathbf{Gr}\\times\\mathbf{V}=\\mathbf{G_F}\\overset{\\mathbf{G_O}}{\\times}\\mathbf{V}=(\\mathbf{G_F}\\times\\mathbf{V})/\\mathbf{G_O}$ … the left diagonal action of $\\mathbf{G_O}$ … is $h\\cdot[g,v]=[hg,v]$\", with $\\mathbf{V}=V\\otimes\\mathbf{F}$ (§3.1, p. 16). Hence that category is $L^{+}G\\backslash L(\\mathrm{GL}_n\\times\\mathbb{A}^n)$, i.e. $L\\check X$.\n\nThe coherent side is built from\n\n$$\n\\mathfrak{g}_{\\bar1}=\\Pi\\mathrm{Hom}(V_1,V_2)\\oplus\\Pi\\mathrm{Hom}(V_2,V_1),\\qquad G_{\\bar0}=\\mathrm{GL}(V_1)\\times\\mathrm{GL}(V_2)\n$$\n\n(§3.4, p. 19), i.e. $T^{*}M_n$.\n\n*Direction:* this **contradicts** (S2), which asserts the theorem is the equivalence for $X=M_n$. It leaves (S1), (S3), (S4), (S5), (S7) untouched.\n\n**2. BFGT, Remark 1.3.2 (p. 5) — the same conclusion from the paper's own geometry.** \"One can view the group $\\mathrm{GL}_N$ as a Zariski open subset of the vector space $\\mathfrak{gl}_N$… the counterpart of this functor for constructible derived categories is a suitably defined version of restriction with respect to the 'zero section' $\\mathbf{Gr}\\times\\{0\\}\\hookrightarrow\\mathbf{Gr}\\times\\mathbf{V}$.\"\n\nThe open embedding $\\mathrm{GL}_n\\subset M_n$ — which is exactly (S1)'s open orbit — is realized on the **coherent** side, matched to $\\mathbf{Gr}\\subset\\mathbf{Gr}\\times\\mathbf{V}$ on the constructible side. So $M_n$ is BFGT's spectral variety throughout.\n\n**3. BZSV §7.6.5 (p. 170).** The BFGT cases are listed as\n\n- $X=\\mathrm{GL}_n$ as $\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$-space,\n- $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ as $\\mathrm{GL}_n\\times\\mathrm{GL}_n$-space,\n- $X=\\mathrm{SO}_n$ as $\\mathrm{SO}_n\\times\\mathrm{SO}_{n-1}$-space.\n\n$M_n$ is absent, and the second entry is the case (S4) reports as a *companion*.\n\n*Direction:* **confirms (S4) verbatim** and **contradicts (S2)/(S6)** by omission of $M_n$ from the very list (S4) quotes.\n\n**4. The corrected form is in print, one sentence later (BZSV p. 170).** \"Travkin and Yang [TY23b] prove the local conjecture in the case of the the Rankin-Selberg period for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$ when $m<n-1$; the dual is $\\check X=\\mathrm{Mat}_{m\\times n}$ acted on by $\\check G=\\mathrm{GL}_m\\times\\mathrm{GL}_n$.\" The matrix space is named as $\\check X$ — the spectral member — in the family whose $m=n$ member is this node's.\n\nThe Travkin–Yang abstract (arXiv:2201.10462, `refs.bib` key `travkinYang_untwistedgaiottoequivalence_2024`; **read on the web, a lead**) agrees: their constructible side is $D$-modules on $\\mathrm{Gr}_N$ and on the mirabolic subgroup, never a matrix space.\n\n**5. Precedent for (S3), verbatim.** BZSV Example 7.3.7 and (7.10) (p. 159) are stated for $X=M_n$, $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$, $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$, and give\n\n$$\n\\mathcal{T}_j\\ast\\delta_X=\\mathrm{I}_j\\langle j(n-j)\\rangle .\n$$\n\n(S3) is exactly this and survives.\n\n**6. Precedent for (S5), and a tension with (S7).** BZSV §7.3.1 (p. 155) lists \"The Godement-Jacquet and Iwasawa–Tate periods, $X=M_n$ as a $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$-space\" among the $X$ satisfying **the placid case** — an exhaustion $X_F=\\varinjlim X^l$ with $X^l=\\varprojlim_n X^l_n$, unipotent-torsor transitions and the $G_O$-action factoring through a finite-type quotient.\n\nFootnote 57 adds: \"the situation is quite rich even in the case when $X$ is a vector space, because $G_O$-orbit closures can be singular even though $X_F$ is very simple, cf. Example 7.3.7.\"\n\n*Direction:* **confirms (S5)**; and it sits in **tension with (S7)**, which asserts placidity is in doubt for this $X$. The tension is not a contradiction: BZSV's presentation is by the *lattice* exhaustion $t^{-l}M_n(\\mathcal{O})$, whereas [the three standing hypotheses](../../../appendix/assum-intro.html)(a) asks for the presentation by **orbit closures**, and footnote 57 is precisely the remark that those two are not the same thing here.\n\n**What was not found.** Nothing in print asserts the unramified conjecture for $X=M_n$ on the automorphic side — no source states an equivalence with $\\mathcal{D}(L^{+}G\\backslash LM_n)$ or its Satake subcategory. The natural homes that do not contain it:\n\n- BZSV §7.6.5, the catalogue of known cases, whose list omits $M_n$;\n- BZSV §8.4 (pp. 183–186), which computes Plancherel algebras for the homogeneous case, the triple-product $\\mathrm{PGL}_2^3$, Whittaker and $\\mathrm{PGL}_2/T$, and not for $M_n$;\n- BZSV Remark 8.3.2 (p. 180), which notes that for $X$ a vector space the [BFN19] ring object exists but that agreeing it with the Plancherel algebra \"would be interesting to prove\".\n\nSo even the weakened Conjecture 8.1.8 is unverified for $M_n$. **The misattribution is upstream of the node**: main.tex:975–977 carries the same sentence, so repairing Q1-e4 does not repair the manuscript.\n\n## Instances\n\n### 1. $n=1$ — instance, partial\n\n**What it is.** $X=M_1=\\mathbb{A}^1$ under $G=\\mathrm{GL}_1\\times\\mathrm{GL}_1$, $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$.\n\n**Why it is an instance.** Smooth affine: $\\mathbb{A}^1$. Open orbit: $\\mathbb{G}_m$, the $n=1$ case of (S1). Spherical with connected stabilizer: $G$ is a torus, $B=G$, the stabilizer of $1$ is the diagonal $\\mathbb{G}_m$.\n\n**What it matches.** (S6)'s clause \"(c) *holds*\", at $n=1$ only, and **not through BFGT**: BZSV Example 7.6.1 (p. 168) verifies the local conjecture \"by hand\" for $X=\\mathbb{A}^1$ with $\\check M=T^{*}\\mathbb{A}^1$.\n\n**Where it is loose:** BZSV's group there is $\\mathbb{G}_m$, while the node's is $\\mathbb{G}_m\\times\\mathbb{G}_m$ acting through the ratio, so $L^{+}G\\backslash LX$ differs from theirs by the diagonal $L^{+}\\mathbb{G}_m$ that acts trivially, and the dual data are correspondingly different. It does not reach $n\\ge2$ and touches (S2) not at all. BZSV p. 155 does name the two periods in one breath, which is why the specialization is worth recording.\n\n**What the statement says here.** For $n=1$ the conclusion (c) is available, from a source the node does not cite; for $n\\ge2$ nothing in print supplies it.\n\n**Source.** `BZSV`, arXiv:2409.04677 — Ex. 7.6.1 (p. 168), §7.3.1 (p. 155).\n\n### 2. The Hecke translates at $j=0$ and $j=1$ — instance\n\n**What it is.** (7.10) of BZSV Example 7.3.7 evaluated at the two ends. $\\mathrm{I}_j$ is supported on $M_n(\\mathcal{O})$, pulled back from $M_n(\\mathcal{O})/tM_n(\\mathcal{O})=M_n$, with fiber at $S$ the cohomology of $\\{E\\subset k^n:\\dim E=j,\\ S|_E=0\\}=\\{E\\subseteq\\ker S\\}$.\n\n**Why it is an instance.** $j=0$: the only $E$ is $0$, the space is a point, the twist $j(n-j)$ vanishes, so $\\mathcal{T}_0\\ast\\delta_X=\\delta_X$ — the unit acting as the unit.\n\n$j=1$: the space is $\\mathbb{P}(\\ker S)$, so the stalk is $H^{*}(\\mathbb{P}^{\\dim\\ker S-1})$ and jumps along the rank stratification of $M_n$. *(The $j=1$ reading is my specialization of the source's own description of $\\mathrm{I}_j$; the formula is BZSV's.)*\n\n**What it matches.** (S3), literally, at two values of $j$; and (S5) — the jumping stalk is the singularity BZSV footnote 57 points at. It reaches neither (S2) nor (S6): a Hecke computation is a *desideratum* of the conjecture, not the conjecture.\n\n**What the statement says here.** The generating family of [the Satake subcategories](../../../appendix/def-satake-subcategory.html) starts at [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) itself and its first nontrivial member already has non-constant stalks.\n\n**Source.** `BZSV`, arXiv:2409.04677 — Ex. 7.3.7 with (7.10) (p. 159), fn. 57 (p. 155).\n\n### 3. BFGT Theorem 3.6.1 for $\\check X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ — **analogue, not an instance**\n\n**What it is.** The theorem the node cites, read as printed: monoidal equivalences between $D^{G_{\\bar0}}_{\\mathrm{perf}}(\\mathfrak{G}^\\bullet_{?,?})$ and $D_{?\\mathbf{G_O}}(\\mathbf{Gr}\\times\\mathbf{V})$, for $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$.\n\n**Why it is not an instance.** Its automorphic category is $L^{+}G\\backslash L\\check X$ and its spectral category is built on $T^{*}M_n$ — the node's $X$ and $\\check X$ exchanged.\n\n**What it matches.** [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) with $X$ replaced by $\\check X$ throughout, under the dictionary above; equivalently, it establishes [the three standing hypotheses](../../../appendix/assum-intro.html)(c) for $\\check X$.\n\n**What it does not reach:** (c) for $M_n$, in either direction; the two spectral categories have dimensions $2n^2$ and $2n^2+2n$ and are not the same category.\n\n**What the statement says here.** The unramified input the node calls \"best established\" is established for the *partner* variety. For $X=M_n$ neither (a) nor (c) is in hand, which inverts (S6)'s punchline rather than merely weakening it.\n\n**Source.** `BravermanFinkelbergGinzburgTravkin_2021`, arXiv:1909.11492 — Thm 3.6.1 (p. 22), §3.2 (p. 17), §3.4 (p. 19); `BZSV` — §7.6.5 (p. 170).\n\n### 4. Boundary — the localization to derived Satake\n\n**What it is.** BFGT Remark 1.3.2 (p. 5) and §3.12: the restriction to $\\mathbf{Gr}\\times\\{0\\}$ makes $D_{\\mathbf{G_O}}(\\mathbf{Gr})$ a localization of $D_{\\mathbf{G_O}}(\\mathbf{Gr}\\times\\mathbf{V})$, compatibly with restricting asymptotic $D$-modules along $\\mathrm{GL}_N\\hookrightarrow\\mathfrak{gl}_N$.\n\n**What it matches.** It shows the \"which member of the pair\" hypothesis is load-bearing: degenerating the mirabolic equivalence gives derived Satake [[bezrukavnikov2008equivariant](../../../../papers/bezrukavnikov2008equivariant.pdf)], i.e. instance (1) of [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html), with $X=\\mathrm{GL}_N$ automorphic and $\\mathfrak{gl}_N=M_N$ spectral.\n\nHad (S2) been right, the degeneration would have run the other way. It says nothing about (S3), (S5) or (S7).\n\n**Source.** Braverman, Finkelberg, Ginzburg, Travkin, *Mirabolic Satake equivalence and supergroups*, Compositio **157** (2021), arXiv:1909.11492 — Rem. 1.3.2, §3.12. `refs.bib`: `BravermanFinkelbergGinzburgTravkin_2021`. Ben-Zvi, Sakellaridis, Venkatesh, *Relative Langlands duality*, arXiv:2409.04677 — §7.3.1 p. 155 with fn. 57, Ex. 7.3.7 and (7.10) p. 159, Ex. 7.6.1 p. 168, §7.6.5 p. 170, Rem. 8.3.2 p. 180, §8.4 pp. 183–186. `refs.bib`: `BZSV`.\n";</script>
