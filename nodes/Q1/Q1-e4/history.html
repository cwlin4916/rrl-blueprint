<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-e4</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-e4 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-e4 — history\n\n[Q1-e4](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-04 — created** by the lead-researcher from the [Q1-L1 `/examples` run](../Q1-L1/examples.html), one of the nine first question-level example and analogy nodes (ADR 0018): the non-homogeneous case where the unramified conjecture is a theorem and the generating family is computed in print — the same $X$ whose orbit poset later became the boundary witness [Q1-L5-e4](../Q1-L5/Q1-L5-e4/index.html).\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged. The walk re-read the [register](../../../key_examples/index.html)'s correction at `K5`: the category BFGT realize is the loop quotient of $\\mathrm{GL}_n\\times\\mathbb{A}^n$, not of $M_n$, so this node is not carried as a positive and its text does not claim to be one.\n- **2026-08-07 — statement extended** by `/update Q1-e*` ([u1](updates/u1.html), user-commissioned: instance-of-the-main-theorem, parent relation, Q3 cross-check): three labelled paragraphs appended, replacing a closing line that named [Q1-L1](../Q1-L1/index.html). Same inversion as [Q1-e2](../Q1-e2/index.html): [the three standing hypotheses](../../../appendix/assum-intro.html)(c) holds by Braverman–Finkelberg–Ginzburg–Travkin Theorem 3.6.1 while (a) is what [Q3-L2](../../removed.html) claims fails, that node naming this $X$ alongside $\\mathbb{A}^1$. The run's input passage on Braverman–Finkelberg–Travkin was verified against `papers/BFT_orthosymplectic_satake.pdf` and concerns a different $X$, so nothing here changed on its account.\n- **2026-08-07 — REFUTED at [r1](critiques/r1.html)** by `/prove Q1-e4`. Round 1 was the node's first, and the prover returned a refutation rather than a draft under the standing instruction on falsity; the critic confirmed it independently from the PDFs and closed `VERDICT: REFUTED`. The `## Statement` is untouched — only **status:**, **critique:** and **objects:** were written — because a statement is `/update`'s to change.\n\n  **The refuted statement, verbatim.** Preserved here because the claim the project believed is about to be replaced:\n\n  > Let $X = M_n$, the $n\\times n$ matrix space, under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$ — instance (2) of [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html): smooth affine as a vector space, with open orbit $\\mathrm{GL}_n$, so the sphericity and connected-stabilizer checks reduce to those of the group case. The unramified equivalence is a theorem of Braverman–Finkelberg–Ginzburg–Travkin [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)]. BZSV (arXiv:2409.04677) Example 7.3.7 computes the translates of the basic object — their self-dual-normalised $\\delta_X$, our [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) — under [the spherical Hecke action](../../../appendix/conv-hecke-action.html) explicitly:\n  >\n  > $$\n  > \\mathcal{T}_j\\ast\\delta_X \\;=\\; \\mathrm{I}_j \\quad\\text{up to a twist by } j(n-j)\n  > $$\n  >\n  > (formula (7.10)) — the generating family of [the Satake subcategories](../../../appendix/def-satake-subcategory.html), written out. BZSV §7.6.5 (p. 170) reports the companion cases $X=\\mathrm{GL}_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$, $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$, $X=\\mathrm{SO}_n$ under $\\mathrm{SO}_n\\times\\mathrm{SO}_{n-1}$ [[BFT_orthosymplectic_satake](../../../../papers/BFT_orthosymplectic_satake.pdf)], and Travkin–Yang for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$.\n  >\n  > **Relation to its parent [Q1](../../../dag.html).** This is [Q1](../../../dag.html)'s generating family made explicit in a non-homogeneous case whose orbit closures are genuinely singular, so unlike [Q1-e2](../Q1-e2/index.html) it is not a computation the answer could be read off from. The family it exhibits is the one [Q1-L1](../Q1-L1/index.html) constructs in general; this node is not a member of that node's decomposition and discharges nothing in it.\n  >\n  > **Instance of the main theorem.** Conditionally, with the same inversion as [Q1-e2](../Q1-e2/index.html): [the three standing hypotheses](../../../appendix/assum-intro.html)(c) *holds*, being Braverman–Finkelberg–Ginzburg–Travkin, Theorem 3.6.1, while (a) is what [Q3-L2](../../removed.html) claims fails, that node naming this $X$ alongside $\\mathbb{A}^1$. So the theorem whose unramified input is best established is one of the two whose placidity hypothesis is most in doubt.\n  >\n  > **Against [Q3](../../../dag.html)'s package.** $X = M_n$ has the $G$-fixed point $0$ and $\\dim X = n^2\\ge 1$, so [Q3-L2](../../removed.html) applies and no finite level cuts the constant-loop stratum out. Directedness is not the obstacle here either, $LM_n$ being connected.\n\n  **The failing case.** [[BravermanFinkelbergGinzburgTravkin_2021](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] Theorem 3.6.1 (p. 22) has $D_{G_{\\mathcal{O}}}(\\mathrm{Gr}\\times\\mathbf{V})$ on its constructible side, and §3.2 (p. 17) identifies $\\mathrm{Gr}\\times\\mathbf{V} = (G_F\\times\\mathbf{V})/G_{\\mathcal{O}}$ with $\\mathbf{V} = \\mathbb{C}^n\\otimes F$. That is $L^+G\\backslash L(\\mathrm{GL}_n\\times\\mathbb{A}^n)$, the loop quotient of the *dual* variety, and $LM_n = M_n(F)$ has no $\\mathbf{V}$-factor.\n\n  The theorem is therefore not the statement's, and it cannot be recovered by reading the equivalence backwards. Its spectral side (§3.4, p. 19) is built from $\\mathfrak{g}_{\\bar 1} = \\Pi\\mathrm{Hom}(V_1,V_2)\\oplus\\Pi\\mathrm{Hom}(V_2,V_1)$, i.e. $T^*(2)M_n$ of dimension $2n^2$, whereas [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) for $X = M_n$ demands $T^*(2)(\\mathrm{GL}_n\\times\\mathbb{A}^n)$, of dimension $2n^2 + 2n$. The two are different categories.\n\n  BZSV §7.6.5 (p. 170) lists the BFGT cases without $M_n$ — the same list the refuted statement's own fourth sentence quotes as *companion* cases, so it named as a different theorem the case Theorem 3.6.1 actually proves.\n\n  **What the literature returned** ([examples.md](examples.html), `EVIDENCE: counterexample`). Three findings bear on the correction.\n\n  - **The misattribution is upstream of this node.** `main.tex:975–977` carries the same sentence after declaring $X = M_n$, and [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(2) and the $M_n$ row of [the three standing hypotheses](../../../appendix/assum-intro.html) transcribe it, so repairing this node repairs none of them.\n  - **The corrected form is already in print.** BZSV p. 170, one sentence after the list that omits $M_n$, names the matrix space as the *spectral* member of the Rankin–Selberg family — \"the dual is $\\check X = \\mathrm{Mat}_{m\\times n}$ acted on by $\\check G = \\mathrm{GL}_m\\times\\mathrm{GL}_n$\".\n  - **The statement is not repairable by swapping the citation.** No other source supplies (c) for $M_n$: BZSV §8.4 computes Plancherel algebras for other $X$, Remark 8.3.2 (p. 180) leaves the vector-space case unverified even for the weakened Conjecture 8.1.8, Devalapurkar's hypothesis is homogeneous rank $1$ and Chen–Nadler's symmetric, and $M_n$ is neither.\n\n  **A tension the refutation did not raise.** BZSV §7.3.1 (p. 155) lists $X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ among the varieties satisfying *the placid case*. This does not contradict [the three standing hypotheses](../../../appendix/assum-intro.html)(a): BZSV present $LX$ by the lattice exhaustion $t^{-l}M_n(\\mathcal{O})$ while (a) asks for the orbit-closure presentation, and BZSV footnote 57 is precisely the remark that the two differ here.\n\n  It does mean the refuted paragraph's \"most in doubt\" was unqualified in a second way, and a rewrite should engage that rather than repeat it.\n\n  **Suggested corrected statement — a suggestion only, adopted by nothing.** `/update` decides; no proof may cite this, and it is not the node's statement.\n\n  > Let $X = M_n$ under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$ acting by $x\\cdot(g_1,g_2) = g_1^{-1}xg_2$ — instance (2) of [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html). It is smooth and affine, with open orbit $\\mathrm{GL}_n$; the $B\\times B$-orbit of $w_0$ is the big Bruhat cell and its stabilizer is the torus $\\{(s, w_0^{-1}sw_0) : s\\in T\\}$, so $X$ is spherical with connected generic stabilizer and lies in the standing class.\n  >\n  > **The unramified equivalence is known for the dual, not for $X$.** [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] establishes [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) for $\\check X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ under the same $G$, whose automorphic side is $L^+G\\backslash L\\check X$ and whose spectral side is $T^*(2)M_n$. For $X = M_n$ itself, [the three standing hypotheses](../../../appendix/assum-intro.html)(c) is **open**: BZSV §7.6.5 (p. 170) omits it from the list of proved cases, and no source in the library supplies it.\n  >\n  > **The generating family is nonetheless explicit.** BZSV Example 7.3.7 and formula (7.10) (p. 159) are stated for this $X$, $G$ and action, giving $\\mathcal{T}_j\\ast\\delta_X = \\mathrm{I}_j$ up to a twist by $j(n-j)$ — the family generating [the Satake subcategories](../../../appendix/def-satake-subcategory.html), written out, with $\\delta_X$ their self-dual normalisation of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html).\n  >\n  > **Instance of the main theorem: conditional in both hypotheses.** Unlike [Q1-e2](../Q1-e2/index.html), this $X$ has *neither* input established — (c) is open by the above, and (a) is what [Q3-L2](../../removed.html) puts in doubt. So it is the sharper example of the two: not \"best-established input, weakest placidity\", but a case where the theorem's conclusion rests on two unverified hypotheses at once.\n  >\n  > **Against [Q3](../../../dag.html)'s package.** $X$ has the $G$-fixed point $0$ and $\\dim X = n^2\\ge 1$, and the $K$-orbit of $1$ has reduced closure $L^+X$, so hypotheses **(A)** and **(B)** of [Q3-L2](../../removed.html) both hold and that node applies to this $X$. Its *conclusion* is not asserted here. Note also that BZSV §7.3.1 (p. 155) calls this $X$ placid under the lattice presentation $t^{-l}M_n(\\mathcal{O})$; their footnote 57 records that this is not the orbit-closure presentation (a) asks for, and it is that gap, not placidity as such, that [Q3-L2](../../removed.html) is about.\n\n  **What nothing in print touches.** The sphericity and connected-stabilizer clause — elementary, proved in Steps 1–3, but carried by no numbered result in any source read. And the whole final paragraph: nothing in print asserts that [the three standing hypotheses](../../../appendix/assum-intro.html)(a) fails for $M_n$, and the nearest thing to it (BZSV p. 155) points the other way under a different presentation.\n\n  The corrected conclusion itself — that (c) is *open* for $X = M_n$ — is nowhere stated as such either. It is inferable only from BZSV's omission, which is why the node wants a claim of its own rather than a citation.\n\n  Steps 1–3 and 6–9 of the refuting write-up ([proof.md](proof.html)) prove the surviving clauses and are worth keeping for the rebuild; four MINOR defects in them are recorded in [r1](critiques/r1.html). The next operator is `/update Q1-e4`, not another `/prove`.\n";</script>
