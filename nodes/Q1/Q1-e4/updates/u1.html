dex.html) — its generating set made explicit in a non-homogeneous placid case.\n\n## Added\n\nThree labelled paragraphs, canonical in [the node](../index.html), of which the load-bearing one is the same inversion found at [Q1-e2](../../Q1-e2/index.html): [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) *holds*, being Braverman–Finkelberg–Ginzburg–Travkin Theorem 3.6.1, while (a) is what [Q3-L2](../../../Q3/Q3-L2/index.html) claims fails — that node naming $M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ alongside $\\mathbb{A}^1$ under $\\mathbb{G}_m$ as the two $X$ where both its hypotheses hold. The two examples with the best-established unramified input are the two whose placidity hypothesis is most in doubt.\n\n## The input passage, verified\n\nThe run's input included:\n\n> it's true for this family of varieties considered by finkelberg, travkin, braverman (GGP case) — Orthosymplectic Satake equivalence\n\nThe node already cited [[BFT_orthosymplectic_satake](../../../../../papers/BFT_orthosymplectic_satake.pdf)] in passing, as one of BZSV §7.6.5's companion cases. Read locally at `papers/BFT_orthosymplectic_satake.pdf` (2026-08-07), the paper is about a *different* $X$ from this node's — $X = \\mathrm{SO}_N$ under $\\mathrm{SO}_{N-1}\\times\\mathrm{SO}_N$, the register's [K3](../../../../key_examples/k3.html), not $M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — so nothing in the passage bears on this node's statement and nothing here was changed on its account. The passage's own verification, and the Iwahori-level finding it produced, are recorded at [K3](../../../../key_examples/k3.html) and in the run's journal entry.\n\n## Considered and not adopted\n\nFolding the GGP case into this node as a further \"companion case\" sentence. Rejected: BFT §1.4 states a precise Iwahori-level conjecture for that $X$ and none for this one, which is a claim about a different variety and wants a node of its own — proposed in the journal entry as `Q1-e7`.\n";</script>
