<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-e4</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-e4 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-e4 — Godement–Jacquet: $X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html), [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), [the spherical Hecke action](../../../appendix/conv-hecke-action.html), [the Satake subcategories](../../../appendix/def-satake-subcategory.html), [the three standing hypotheses](../../../appendix/assum-intro.html), [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html), [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$](../../../appendix/def-orbit-closure.html), [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html). `depends-on:` is empty.\n- **notation:** $\\mathcal{O}=k[[t]]$, $F=k((t))$, $K=L^+G$, $G_{\\mathcal{O}}=\\mathrm{GL}_n(\\mathcal{O})$, $\\mathrm{Gr}=\\mathrm{Gr}_{\\mathrm{GL}_n}$, $\\mathcal{V}=k^n\\otimes F$, and $B\\supset T$ the upper-triangular Borel of $\\mathrm{GL}_n$ with longest element $w_0$.\n\n## Lemma\n\nLet $X = M_n$, the $n\\times n$ matrix space, under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$ — instance (2) of [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html): smooth affine as a vector space, with open orbit $\\mathrm{GL}_n$, so the sphericity and connected-stabilizer checks reduce to those of the group case. The unramified equivalence is a theorem of Braverman–Finkelberg–Ginzburg–Travkin [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)]. BZSV (arXiv:2409.04677) Example 7.3.7 computes the translates of the basic object — their self-dual-normalised $\\delta_X$, our [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) — under [the spherical Hecke action](../../../appendix/conv-hecke-action.html) explicitly:\n\n$$\n\\mathcal{T}_j\\ast\\delta_X \\;=\\; \\mathrm{I}_j \\quad\\text{up to a twist by } j(n-j)\n$$\n\n(formula (7.10)) — the generating family of [the Satake subcategories](../../../appendix/def-satake-subcategory.html), written out. BZSV §7.6.5 (p. 170) reports the companion cases $X=\\mathrm{GL}_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$, $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$, $X=\\mathrm{SO}_n$ under $\\mathrm{SO}_n\\times\\mathrm{SO}_{n-1}$ [[BFT_orthosymplectic_satake](../../../../papers/BFT_orthosymplectic_satake.pdf)], and Travkin–Yang for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$.\n\n**Relation to its parent [Q1](../../../dag.html).** This is [Q1](../../../dag.html)'s generating family made explicit in a non-homogeneous case whose orbit closures are genuinely singular, so unlike [Q1-e2](../Q1-e2/index.html) it is not a computation the answer could be read off from. The family it exhibits is the one [Q1-L1](../Q1-L1/index.html) constructs in general; this node is not a member of that node's decomposition and discharges nothing in it.\n\n**Instance of the main theorem.** Conditionally, with the same inversion as [Q1-e2](../Q1-e2/index.html): [the three standing hypotheses](../../../appendix/assum-intro.html)(c) *holds*, being Braverman–Finkelberg–Ginzburg–Travkin, Theorem 3.6.1, while (a) is what [Q3-L2](../../Q3/Q3-L2/index.html) claims fails, that node naming this $X$ alongside $\\mathbb{A}^1$. So the theorem whose unramified input is best established is one of the two whose placidity hypothesis is most in doubt.\n\n**Against [Q3](../../../dag.html)'s package.** $X = M_n$ has the $G$-fixed point $0$ and $\\dim X = n^2\\ge 1$, so [Q3-L2](../../Q3/Q3-L2/index.html) applies and no finite level cuts the constant-loop stratum out. Directedness is not the obstacle here either, $LM_n$ being connected.\n\n## Proof\n\n**Verdict: the Lemma is false as written.** Steps 1–3 and 6–9 establish the clauses that hold; Steps 4–5 refute the attribution clause and the \"Instance of the main theorem\" paragraph, and the proof stops on those.\n\n**Step 1 — $X=M_n$ is smooth and affine, with open $G$-orbit $\\mathrm{GL}_n$.**\n\n<details><summary>the argument</summary>\n\n$M_n\\cong\\mathbb{A}^{n^2}$ as a variety, hence smooth, affine and normal. The action is\n\n$$\nx\\cdot(g_1,g_2)=g_1^{-1}xg_2 .\n$$\n\nThe orbit of $1$ is $\\{g_1^{-1}g_2\\}=\\mathrm{GL}_n$, the non-vanishing locus of $\\det$, which is open and dense.\n\n</details>\n\n**Step 2 — $X$ is spherical.**\n\n<details><summary>the argument</summary>\n\nFor the Borel $B\\times B\\subset G$ the orbit of $w_0$ is\n\n$$\n\\{b_1^{-1}w_0b_2\\}=Bw_0B,\n$$\n\nthe big Bruhat cell, open and dense in $\\mathrm{GL}_n$ and so, by Step 1, open in $M_n$.\n\nEvery Borel of $G$ is conjugate to $B\\times B$ and the condition is conjugation-invariant, so $M_n$ has an open orbit under each, which with normality is sphericity as in [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html).\n\n</details>\n\n**Step 3 — the $B\\times B$-stabilizer on the open $B\\times B$-orbit is connected.**\n\n<details><summary>the argument</summary>\n\nHere $b_1^{-1}w_0b_2=w_0$ forces $b_2=w_0^{-1}b_1w_0$, so\n\n$$\nb_1\\in B\\cap w_0Bw_0^{-1}=B\\cap B^-=T .\n$$\n\nThe stabilizer of $w_0$ is therefore\n\n$$\n\\mathrm{Stab}_{B\\times B}(w_0)=\\{(s,w_0^{-1}sw_0)\\;:\\;s\\in T\\}\\;\\cong\\;T,\n$$\n\na torus, hence connected.\n\nWith Steps 1–2 this is condition (2) of [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html), so $X$ lies in the standing class and is instance (2) of [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html), whose dual datum is\n\n$$\n\\check X=\\mathrm{GL}_n\\times\\mathbb{A}^n,\\qquad \\check M=T^*(2)\\check X .\n$$\n\n</details>\n\n**Step 4 — REFUTED: the constructible side of [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] is the loop quotient of $\\check X$, not of $X$.**\n\n<details><summary>the argument</summary>\n\nTheorem 3.6.1 (p. 22) asserts monoidal equivalences $\\Phi^{2,0},\\Phi^{1,1},\\Phi^{0,2}$ whose constructible sides are\n\n$$\nD^!_{G_{\\mathcal{O}}}(\\mathrm{Gr}\\times\\mathcal{V}),\\qquad D^{!*}_{G_{\\mathcal{O}}}(\\mathrm{Gr}\\times\\mathcal{V}),\\qquad D^{*}_{G_{\\mathcal{O}}}(\\mathrm{Gr}\\times\\mathcal{V}) .\n$$\n\nTheir §3.2 (p. 17) identifies $\\mathrm{Gr}\\times\\mathcal{V}=(G_F\\times\\mathcal{V})/G_{\\mathcal{O}}$ with residual action $h\\cdot[g,v]=[hg,v]$, so\n\n$$\nG_{\\mathcal{O}}\\backslash(\\mathrm{Gr}\\times\\mathcal{V})\\;\\simeq\\;(G_{\\mathcal{O}}\\times G_{\\mathcal{O}})\\backslash(G_F\\times\\mathcal{V})\\;\\simeq\\;L^+G\\backslash L(\\mathrm{GL}_n\\times\\mathbb{A}^n),\n$$\n\nthe right-hand side taken for $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ acting by\n\n$$\n(g,v)\\cdot(g_1,g_2)=(g_1^{-1}gg_2,vg_2),\n$$\n\nwhich is the $\\check X$ of Step 3. Since $LX=M_n(F)$ has no $\\mathcal{V}$-factor, this is not $L^+G\\backslash LM_n$.\n\n</details>\n\n**Step 5 — REFUTED, consequence: [the three standing hypotheses](../../../appendix/assum-intro.html)(c) for $X=M_n$ is not supplied by that theorem.**\n\n<details><summary>the argument</summary>\n\n[unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) for $X$ asserts\n\n$$\n\\mathcal{D}_c(L^+G\\backslash LX)^{\\mathrm{Sat}}\\;\\simeq\\;\\mathrm{Perf}\\left(\\mathrm{sh}^{1/2}(\\check M)/\\check G\\right).\n$$\n\nBoth sides of Theorem 3.6.1 are instead the pair for $\\check X$. By Step 4 its automorphic side is $L^+G\\backslash L\\check X$, and its coherent side is built (BFGT §3.4, p. 19) from\n\n$$\n\\mathcal{G}^\\bullet_{1,1}=\\mathrm{Sym}(\\mathfrak{g}_{\\bar 1}[-1]),\\qquad \\mathfrak{g}_{\\bar 1}=\\Pi\\mathrm{Hom}(V_1,V_2)\\oplus\\Pi\\mathrm{Hom}(V_2,V_1),\\qquad \\bar G_0=\\mathrm{GL}(V_1)\\times\\mathrm{GL}(V_2),\n$$\n\ni.e. from $T^*M_n$ placed in degree $1$ — the sheared $T^*(2)M_n$, which is $\\check M$ for $\\check X$ and not for $X$. Duality relates the two varieties; no entry of the closed world identifies their automorphic categories.\n\nBZSV's own catalogue agrees at §7.6.5, p. 170, listing the BFGT cases as \"$X=\\mathrm{GL}_n$ as $G=\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$-space, $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ as $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$-space, $X=\\mathrm{SO}_n$ as $G=\\mathrm{SO}_n\\times\\mathrm{SO}_{n-1}$-space\" — the very list the Lemma's fourth sentence quotes as *companion* cases, and $M_n$ is not in it.\n\nSo the Lemma's second sentence, and the assertion of its third paragraph that (c) holds, are false.\n\n</details>\n\n**Step 6 — each $\\mathcal{T}_j\\ast\\mathrm{IC}_0$ is a member of the family generating [the Satake subcategories](../../../appendix/def-satake-subcategory.html).**\n\n<details><summary>the argument</summary>\n\nBZSV Example 7.3.7 and (7.10), p. 159, are stated for our $X$ and $G$ with our action, and give $\\mathrm{I}_j$ supported on $M_{n,\\mathcal{O}}$.\n\nIndependently of that computation, $\\mathcal{T}_j$ is the extension of the constant object on the closed finite-dimensional orbit $K\\backslash\\mathrm{Gr}_{\\omega_j}$, hence lies in $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$. So by [the spherical Hecke action](../../../appendix/conv-hecke-action.html), $\\mathcal{T}_j\\ast\\mathrm{IC}_0$ lies in $\\mathcal{D}_c(K\\backslash LX)$ and is one of the objects $\\mathcal{F}\\ast\\mathrm{IC}_0$ whose generated subcategory is [the Satake subcategories](../../../appendix/def-satake-subcategory.html).\n\nThis clause of the Lemma stands.\n\n</details>\n\n**Step 7 — hypothesis (A) of [Q3-L2](../../Q3/Q3-L2/index.html) holds.**\n\n<details><summary>the argument</summary>\n\n$0\\cdot(g_1,g_2)=g_1^{-1}0g_2=0$, so $0$ is a $G$-fixed $k$-point, and $\\dim M_n=n^2\\ge 1$.\n\n</details>\n\n**Step 8 — hypothesis (B) of [Q3-L2](../../Q3/Q3-L2/index.html) holds: $\\overline{LX}_{\\mu_0}=L^+X$ for $\\mu_0$ the orbit of $1$.**\n\n<details><summary>the argument</summary>\n\nThe $K$-orbit of $1\\in L^+X$ is $\\{g_1^{-1}g_2\\}=G_{\\mathcal{O}}$, an [orbit](../../../appendix/def-orbits-iwahori-spherical.html) which is the non-vanishing locus of $\\det$ inside $L^+X=M_n(\\mathcal{O})$.\n\nBy [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html), $L^+X\\simeq\\varprojlim_m L^mM_n$ is the spectrum of a polynomial ring, hence integral, so this nonempty open subscheme is dense in it. And $L^+X=LX^0$ is closed in $LX=\\varinjlim_i LX^i$, where\n\n$$\nLX^i=t^{-i}M_n(\\mathcal{O}) .\n$$\n\nThe orbit's reduced closure ([$\\overline{LX}_\\lambda$](../../../appendix/def-orbit-closure.html)) is therefore $L^+X$. With Step 7, [Q3-L2](../../Q3/Q3-L2/index.html) does apply to this $X$, as the Lemma's last paragraph asserts.\n\n</details>\n\n**Step 9 — the closure poset is directed and $LM_n$ is connected.**\n\n<details><summary>the argument</summary>\n\nTranslating Step 8 by $t^{-i}$, the $K$-orbit of $t^{-i}\\cdot 1$ has reduced closure $LX^i$. Every $k$-point of $LX$ lies in some $LX^i$, so any two orbits lie in a common orbit closure: the poset is directed.\n\nEach $LX^i$ is integral, hence connected, and they all contain $0$, so their filtered union $LX$ is connected.\n\n</details>\n\n## Caveats\n\n**The appendix entry is not itself wrong, but it is read wrongly.** [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(2) assigns the dual datum $\\check X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ to $X=M_n$ correctly. What Steps 4–5 refute is reading its closing \"Proved by …\" as establishing [the three standing hypotheses](../../../appendix/assum-intro.html)(c) *for $M_n$*. The theorem establishes (c) for $\\check X$.\n\n**Step 6 claims membership only.** BZSV's $\\delta_X$ is self-dual-normalised in their placid constructible setting, while [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module. The two agree only up to a normalising twist and across sheaf theories, and BZSV's bridge (p. 156) is a remark, not a theorem.\n\nNothing downstream of Step 6 uses (7.10). Nor is it claimed that the $\\mathcal{T}_j$ alone generate: [the Satake subcategories](../../../appendix/def-satake-subcategory.html) generates from all of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$.\n\nAppendix entries used beyond `objects:`: [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html), [the three standing hypotheses](../../../appendix/assum-intro.html), [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html), [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$](../../../appendix/def-orbit-closure.html), [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html).\n";</script>
