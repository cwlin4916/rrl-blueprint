<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q1-e4</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-e4, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-e4/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nThe prover returned a refutation. I read BFGT pp. 17–22 and BZSV pp. 156, 158–160, 169–171 myself; the refutation is **correct**, and every quotation in Steps 4–6 is verbatim accurate. Statement diff clean, bib keys and appendix anchors all resolve. The verdict is therefore about the statement, and four defects in the surviving steps are recorded for the rebuild.\n\n**Flaw 1** [FATAL] [F] — False, on three independent readings of the sources.\n\n<details><summary>(statement, sentence 2: \"The unramified equivalence is a theorem of Braverman–Finkelberg–Ginzburg–Travkin [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)]\", and third paragraph: \"[the three standing hypotheses](../../../../appendix/assum-intro.html)(c) *holds*, being … Theorem 3.6.1\") · the finding</summary>\n\n*(i) The automorphic side.* BFGT Thm 3.6.1 (p. 22) has constructible sides $D_{!G_{\\mathbf{O}}}(\\mathbf{Gr}\\times\\mathbf{V})$, $D_{!*G_{\\mathbf{O}}}(\\mathbf{Gr}\\times\\mathbf{V})$, $D_{*G_{\\mathbf{O}}}(\\mathbf{Gr}\\times\\mathbf{V})$, and §3.2 (p. 17) reads: \"We will make use of an identification $\\mathbf{Gr}\\times\\mathbf{V}=\\mathbf{G_F}\\overset{\\mathbf{G_O}}{\\times}\\mathbf{V}=(\\mathbf{G_F}\\times\\mathbf{V})/\\mathbf{G_O}$ … the left diagonal action of $\\mathbf{G_O}$ … is $h\\cdot[g,v]=[hg,v]$.\" Here $\\mathbf{V}=\\mathbb{C}^N\\otimes F$ with lattices $t^m\\mathbf{V}_0$. So $G_{\\mathcal{O}}\\backslash(\\mathbf{Gr}\\times\\mathbf{V})\\simeq(G_{\\mathcal{O}}\\times G_{\\mathcal{O}})\\backslash(G_F\\times\\mathbf{V})=L^{+}G\\backslash L(\\mathrm{GL}_n\\times\\mathbb{A}^n)$. That is $L\\check X$, and $LM_n=M_n(F)$ has no $\\mathbf{V}$-factor.\n\n*(ii) The spectral side.* BFGT §3.4 (p. 19): $\\mathfrak{G}^\\bullet_{1,1}=\\mathrm{Sym}(\\mathfrak{g}_{\\bar 1}[-1])$ with $\\mathfrak{g}_{\\bar 1}=\\Pi\\mathrm{Hom}(V_1,V_2)\\oplus\\Pi\\mathrm{Hom}(V_2,V_1)$ and $G_{\\bar 0}=\\mathrm{GL}(V_1)\\times\\mathrm{GL}(V_2)$ — i.e. $\\mathrm{Perf}(T^{*}(2)M_n/\\check G)$, of dimension $2n^2$. The conjecture for $X=M_n$ demands $\\mathrm{Perf}(\\mathrm{sh}^{1/2}(T^{*}(2)(\\mathrm{GL}_n\\times\\mathbb{A}^n))/\\check G)$, of dimension $2n^2+2n$. The two are not the same category, which settles the **dual-pair objection**: BFGT is not the $M_n$ conjecture \"read backwards\" but the conjecture for the pair $(\\check X,X)$, whose automorphic side is $L\\check X$. Reading an equivalence in its inverse direction never moves $\\mathcal{D}_c(L\\check X)$ to $\\mathcal{D}_c(LX)$.\n\n*(iii) BZSV agree.* §7.6.5, p. 170, verbatim: \"The papers [BFGT21] and [BFT22a] … prove the local conjecture (in a Koszul dual formulation) in cases corresponding to: $X=\\mathrm{GL}_n$ as $G=\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$-space, $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ as $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$-space, $X=\\mathrm{SO}_n$ as $G=\\mathrm{SO}_n\\times\\mathrm{SO}_{n-1}$-space.\" $M_n$ is absent; the same three-item list recurs at p. 156. The statement's own fourth sentence lists $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ as a *companion* case — so it names, as a different theorem, the case Thm 3.6.1 actually proves. The statement is internally incoherent as well as false.\n\nFalse **as stated**, not in substance: the node's point survives and inverts. For $X=M_n$, (c) is *not* known; the closing line \"the theorem whose unramified input is best established is one of the two whose placidity hypothesis is most in doubt\" fails at its premise, and the honest version — BFGT establish (c) for $\\check X$, leaving $M_n$'s own (c) open — is the more interesting claim.\n\n</details>\n\n**Flaw 2** [MAJOR] [M] — The misattribution is in the closed world, not invented by the draft: the entry says of $X=M_n$ \"Proved by Braverman–Finkelberg–Ginzburg–Travkin [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)]\", and the table row reads \"**proved** — [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)]\".\n\n<details><summary>(`exam:hyperspherical_duality`(2); `assum:intro` key-varieties table, the $M_n$ row) · the finding</summary>\n\nBy Flaw 1 both attach the theorem to the wrong member of the pair. The Caveats section spots this and is right to. Only the lead-researcher may fix an entry; until it is fixed, Q1-e1, Q1-e5, Q1-L4-e2/e3/e4 and Q3-L3 can all inherit it.\n\n</details>\n\n**Flaw 3** [MAJOR] [G] — Steps 7–8 verify hypotheses (A) and (B) of Q3-L2 and stop there — \"Q3-L2 does apply to this $X$\".\n\n<details><summary>(statement, last paragraph: \"so [Q3-L2] applies **and no finite level cuts the constant-loop stratum out**\"; draft Step 8 final sentence) · the finding</summary>\n\nThe quoted second clause is Q3-L2's *conclusion* (3). Q3-L2 is `open`, belongs to another question and is not in `depends-on`, so its conclusion is not available. No appendix entry supplies it either; the clause is asserted with no reason. Either the rebuilt statement drops it, or the node acquires the fact as a dependency.\n\n</details>\n\n**Flaw 4** [MINOR] [M] — The entry supplies the presentation and placidity, not the ring; that $\\mathcal{O}(L^{+}M_n)=\\mathrm{colim}_m k[x^{(0)},\\dots,x^{(m-1)}]$ is a domain is a one-line addition the draft should make rather than attribute.\n\n<details><summary>(Step 8: \"By [loops, jets and positive loops are placid], $L^{+}X\\simeq\\varprojlim_m L^mM_n$ is the spectrum of a polynomial ring, hence integral\") · the finding</summary>\n\nThe argument itself is sound — a filtered colimit of polynomial rings along split injections is a domain, and $\\varprojlim$ along affine transitions is $\\mathrm{Spec}$ of that colimit — so density and the closedness of $L^{+}X$ in $\\varinjlim_i t^{-i}M_n(\\mathcal{O})$ both go through.\n\n</details>\n\n**Flaw 5** [MINOR] [N] — The Hecke action of [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../../appendix/conv-hecke-action.html) is by $\\mathcal{D}_c(K\\backslash\\mathrm{Gr}_G)$ with $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$, so $\\mathrm{Gr}_G=\\mathrm{Gr}_{\\mathrm{GL}_n}\\times\\mathrm{Gr}_{\\mathrm{GL}_n}$, not the declared $\\mathrm{Gr}_{\\mathrm{GL}_n}$.\n\n<details><summary>(notation line, \"$\\mathrm{Gr}=\\mathrm{Gr}_{\\mathrm{GL}_n}$\"; Step 6, \"$\\mathcal{T}_j$ … lies in $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\") · the finding</summary>\n\nBZSV supply the missing clause at p. 159 — \"We think of it as a sheaf on the second copy of $\\mathrm{GL}_n$ in $G$\" — i.e. $\\mathcal{T}_j$ is pushed forward along $\\{e\\}\\times\\mathrm{Gr}_{\\mathrm{GL}_n}\\hookrightarrow\\mathrm{Gr}_G$. Also $\\omega_j$ is used undefined.\n\n</details>\n\n**Flaw 6** [MINOR] [B] (Step 8, \"the non-vanishing locus of $\\det$\"; Step 9, \"Every $k$-point of $LX$ lies in some $LX^i$\") — $\\mathrm{GL}_n(\\mathcal{O})$ is where $\\det$ is a *unit*, i.e. the preimage of $\\mathrm{GL}_n\\subset M_n$ under the level-$0$ projection — open, as claimed, but not the non-vanishing locus of $\\det$.\nIn Step 9, directedness is about orbits, not points: the clause wanted is that each $LX^i=t^{-i}M_n(\\mathcal{O})$ is $K$-stable, so every $K$-orbit lies in one.\n**Flaw 7** [MINOR] [W] Six entries used beyond `objects:`, already listed by the draft; one line for the orchestrator. — Steps 1–3, 6 and 9 are otherwise correct: $Bw_0B$ is the open cell for $x\\cdot(b_1,b_2)=b_1^{-1}xb_2$, and $b_1\\in B\\cap w_0Bw_0^{-1}=T$ gives the connected stabilizer.\nBZSV Ex. 7.3.7 and (7.10) at p. 159 are verbatim about $X=M_n$, $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$, so **clause 3 of the statement is true** and survives any rewrite; the p. 156 caveat is quoted correctly (\"we don't state them as theorems\").\nVERDICT: REFUTED\n";</script>
