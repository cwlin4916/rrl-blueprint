mposes them at.\n\n## The defect\n\n**The hypothesis says \"surjective\" where it means \"faithfully flat\".** Read on $R$-points, surjectivity of the transitions is false for presentations this node is meant to accept, so a reader supplying one would have to guess which reading was intended. The write-up does not guess: Step 1 opens \"affine, smooth surjective, hence faithfully flat\", and everything after it uses the flatness.\n\n**Old** (verbatim): `the transition maps $H_{m+1}\\to H_m$ being surjective smooth affine group homomorphisms`\n\n**New** (verbatim): `the transition maps $H_{m+1}\\to H_m$ being affine, faithfully flat, smooth group homomorphisms`\n\n## Verified\n\n**The hypothesis is neither weakened nor strengthened.** A smooth morphism is flat, so for these group schemes *smooth and surjective* and *smooth and faithfully flat* are the same condition; the edit changes which of two equivalent words is written and closes the false pointwise reading of the one that was.\n\n**The joint now composes.** [Q1-L4-L2](../../Q1-L4-L2/index.html)(a) delivers \"affine, faithfully flat, smooth\" and this node asks for it in the same words, so the application at $H = K_\\lambda$ no longer passes through a synonym.\n\n## Refuted\n\nNothing in the node. The walk re-read the unipotence hypothesis and Steps 1–4 of [proof.md](../proof.html) against [Q1-L4-L3](../../Q1-L4-L3/index.html), which they invoke at finite level, and found the chain intact.\n\n## Why the status is not reset\n\nNothing the referee reviewed changed: the hypothesis is the same condition under a different name, and Step 1 already derives and uses the name now written. [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html) resets on a *material* change.\n\n## Considered and not adopted\n\n- **Also strengthening the unipotence hypothesis to \"vector group\".** The transition kernels of the presentation this node is applied to are vector groups, established this run in [Q1-L4-L2/u2](../../Q1-L4-L2/updates/u2.html); but this node uses only unipotence, and a hypothesis narrowed past what the proof needs is one a future caller must check for nothing.\n";</script>
