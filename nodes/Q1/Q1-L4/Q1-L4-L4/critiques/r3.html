 (l. 424), `#subsec-notations` (l. 57), `#bb-raskin-torsor-descent` (l. 492). The set matches `objects:` exactly. `../Q1-L4-L3/Q1-L4-L3_node.md` resolves; `../../../` reaches `blueprint/` from depth 2. \"Ratified reading 1\" is context.md:59. No `GAP:` marker. **No FATAL.**\n\n**Closed world.** Invoked: the six entries, the `## Statement` of [Q1-L4-L3](../../Q1-L4-L3/index.html) (used at Step 1 with $H:=H_{m+1}$, $N:=N_m$ — affine finite type, closed normal unipotent, all supplied by the node's own hypotheses), context.md's ratified reading 1, and standard mathematics. The draft still goes out of its way (proof.md:36) to say that the scheme-level unit is *not* imported from L3. Clean; no closed-world flaw.\n\n**Source pages, read this round.** `papers/raskin_dmodules_infinite_var.pdf` p. 15 §3.17 and p. 16 Prop. 3.17.2: the setting is \"$S$ a quasi-compact quasi-separated base scheme, $\\mathcal{G}\\to S$ a quasi-compact quasi-separated group scheme over $S$, $P$ a quasi-compact quasi-separated $S$-scheme with an action\", the bar complex is displayed as *semisimplicial* with faces only, a torsor is one trivialized after an **fppf** base change, and Prop. 3.17.2 asserts $\\varphi\\colon D^!(S)\\to D^!(\\mathcal{P}_{\\mathcal{G}})^{\\mathcal{G}}$ is an equivalence. No finite-type hypothesis on $\\mathcal{G}$, as the entry says. Example 3.17.1 (same page) covers exactly the constant case $\\mathcal{G}=S\\times\\mathcal{G}_0$ the draft uses ($\\mathcal{G}=K\\times T$ over $S=T$). The appendix entry does not over-claim, and the draft's use of it stays inside its scope: $\\mathcal{D}^!$ only, base a scheme only, $\\mathcal{D}_c$ handled by hand at Step 5. p. 19–20 checked too: Def. 4.2.1 requires transition maps to be affine smooth **coverings**, stricter than the appendix's [placidity](../../../../../appendix/placid-ind-scheme.html) — irrelevant here, since the presentation $H^{\\times n}=\\varprojlim_m H_m^{\\times n}$ used at Step 3 has surjective transitions anyway; Rem. 4.2.7 (placid $\\Rightarrow$ qcqs) is not needed, the draft discharging quasi-compactness by affineness directly, which is cleaner; and §4.3 (4.3.2) confirms the connecting morphisms of the $\\mathcal{D}^!$ limit are the right adjoints of $f_i^!$, \"adjoint by smoothness\" — matching [sheaves on a placid scheme](../../../../../appendix/ex-sheaf-on-placid-scheme.html) and the draft's \"$q_{n\\star}$\".\n\n**The entry's commissioned work is done.** The entry's note demands that assembling the pointwise equivalences into $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(\\mathcal{G}^{\\times n})$ be the citing node's own work; Step 2 (proof.md:26–34) does exactly that, by the right-Kan-extension limit formula plus the finality of $\\Psi$. The clause that admits $K=H$ — no finite-type hypothesis on $\\mathcal{G}$ — is stated in the draft in bold at proof.md:26. Both checks the task singles out pass.\n\n## Compression audit: are r1's MAJORs still disposed of?\n\n- **r1 Flaw 1 (honest `GAP:`)** — still gone. Nothing on the page is asserted as unproved; the one declared non-entry input (smoothness to a prestack) is a *reading*, disclosed in the Caveats, and both prior rounds graded it MINOR.\n- **r1 Flaw 2 (codegeneracy squares / the $\\Delta$-indexed bi-diagram that does not exist)** — still fixed, now in three mutually reinforcing places: the notation line (\"all $[n]$-limits over $\\Delta_{\\mathrm{inj}}$\", proof.md:6), Step 2 (\"over the *semisimplicial* bar complex (whence $\\Delta_{\\mathrm{inj}}$ throughout)\", proof.md:28) and Step 3 (\"only faces occur, $\\Delta_{\\mathrm{inj}}$ having no codegeneracies\", proof.md:36). My r1 counterexample ($H_1=\\mathrm{pt}$, $H_m=\\mathbb{G}_a$, $F=\\delta_1$) still refutes nothing that is claimed. The $\\Delta_{\\mathrm{inj}}$-indexing is *derived from the entry's own semisimplicial diagram*, so no cofinality conversion is owed.\n- **r1 Flaw 3 (an appendix entry that would assume the conclusion)** — still fixed: the entry invoked is the primitive one, over a *scheme* base, and Steps 2–5 remain the node's own content.\n\nCompression cost none of the three. It also **repaired**, at 385 fewer words, r2's Flaws 1 (the surjectivity clause is now earned by the fibre description, proof.md:26), 2 (the Caveat now restricts the robustness claim to (B1),(B2) and puts (A) under the level-wise reading, proof.md:52), 4 (the false \"three inputs\" inventory is deleted), 5(a) (affineness of $H$ is now derived), 6 (the (B1)/(B2) split) and 7 (the ambient subscript on $d^!q_{n-1\\star}\\simeq q_{n\\star}d^!$). That is a genuinely good compression.\n\n## Adjudication of the prover's self-reported omission (r2 Flaw 3)\n\nThe prover reports that it could not fit the sentence r2 asked for — that the pro-level right-adjointability is the limit of the levelwise squares, the passage to right adjoints being the standard $(\\infty,2)$-categorical step — and judges this a writing defect rather than a hole. **I sustain the judgement on the mathematics and correct its framing.**\n\nSustained, because: (a) r2 graded the item MINOR and a MINOR is by construction not a required repair, so nothing was owed; (b) I re-derived the step independently again this round and it is one sentence — the identification of [sheaves on a placid scheme](../../../../../appendix/ex-sheaf-on-placid-scheme.html) has $m$-component $\\rho_{m\\star}$ (the right adjoint of $!$-pullback along $\\rho_m\\colon H^{\\times n}\\to H_m^{\\times n}$), whence right-adjointability of the levelwise squares passes to the limit and gives $\\rho_{m\\star}d^!\\simeq d^!\\rho_{m\\star}$; (c) all the maps in play are smooth, so every $(-)_\\star$ used actually exists, and the shift bookkeeping cancels because $(-)_\\star$ is *defined* as the right adjoint of $(-)^!$; (d) no downstream claim is endangered.\n\nTwo corrections to the framing. First, r2's own r2-Flaw-3(ii) — naturality of Step 2 in the group homomorphism — is now **better** disposed of than in the r2 draft, not merely carried: the Step 2 heading (proof.md:26) records that the equivalence is \"**by $!$-pullback**\", and once the $[n]$-component is the $!$-pullback along $K^{\\times n}\\to\\mathrm{pt}\\to BK$, naturality in $H\\to H_m$ is bare functoriality of $(-)^!$ on $\\mathrm{PreStk}^{op}$ applied to the commuting square $H^{\\times n}\\to H_m^{\\times n}\\to BH_m$ vs. $H^{\\times n}\\to BH\\to BH_m$. Second, \"r2 passed the draft without it\" is not the same as \"r2 disposed of it\": the item is an outstanding MINOR carried forward unrepaired, and it is re-listed below as Flaw 2 rather than treated as closed. The prover's disclosure was accurate and the right thing to do.\n\n## Flaws\n\n**Flaw 1** [MINOR] — This is the one place where compression introduced a new defect, and it sits inside the verification of a **hypothesis of the black box** (fppf-local triviality for $K=H$), so it is the sentence I pushed hardest on.\n\n<details><summary>(Step 2, proof.md:26: \"*so $\\mathcal{P}_T|_{T'}\\simeq_{\\mathrm{Sch}_{/T'}}\\varprojlim_mQ_m$, $Q_m$ a torsor under $N_{1,m}$*\") · the finding</summary>\n\nThe clause conflates two incompatible readings of $Q_m$. If $Q_m\\to T'$ is a torsor under $N_{1,m}=\\ker(H_m\\to H_1)$ — the reading the *justification* uses, since \"unipotent torsors over an affine base are trivial\" then gives $\\Gamma(T',Q_m)\\ne\\emptyset$ in one step — then $\\varprojlim_m Q_m$ is a torsor under $\\ker(H\\to H_1)$ and is **not** $\\mathcal{P}_T|_{T'}$, which is a torsor under $H$; the displayed identification is false unless $H_1$ is trivial. If instead $Q_m:=\\mathcal{P}_T|_{T'}\\times^HH_m$ — the reading the *display* needs, since then $\\varprojlim_mQ_m\\simeq\\mathcal{P}_T|_{T'}$ by fpqc descent — then $Q_m$ is a torsor under $N_{1,m}$ only **over $Q_1$**, not over $T'$, and $\\Gamma(T',Q_m)\\ne\\emptyset$ needs the extra composition with the trivializing section $T'\\to Q_1$. Both readings reach the intended conclusion (the sections tower is a sequential limit of non-empty sets along surjections, so $\\mathcal{P}_T|_{T'}$ has a section and is trivial), and I verified the mathematics again; the defect is a mis-typing of one object. Repair, ~12 words on the first reading: \"*the fibre $Q$ of $\\mathcal{P}_T|_{T'}$ over the tautological section of the induced $H_1$-torsor satisfies $Q\\simeq_{\\mathrm{Sch}_{/T'}}\\varprojlim_mQ_m$ with $Q_m$ an $N_{1,m}$-torsor, and a section of $Q$ is a section of $\\mathcal{P}_T|_{T'}$*\".\n\n</details>\n\n**Flaw 2** [MINOR]\n\n<details><summary>(Step 3, proof.md:36: \"*So the bi-diagram $\\Delta_{\\mathrm{inj}}\\times\\mathbb{N}^{op}\\to\\mathrm{DGCat}$ exists, and Fubini with Step 2 twice gives*\"; carried forward unrepaired from [r2](r2.html) Flaw 3) · the finding</summary>\n\nTwo sub-items survive: (i) the first equivalence of the Step 3 display uses $\\mathcal{D}^!(H^{\\times n})\\simeq\\varprojlim_m\\mathcal{D}(H_m^{\\times n})$ *as an identification of $\\Delta_{\\mathrm{inj}}$-diagrams*, which needs the pro-level squares $(d,\\rho_m)$ right-adjointable — true, being the limit of the levelwise squares just checked, but unwritten, and it requires naming the $m$-component of the placid identification as $\\rho_{m\\star}$, which the entry does not do for you; (ii) \"So … exists\" is the standard passage to right adjoints in an $(\\infty,2)$-category, and deserves to be named rather than asserted with a connective. Neither is a hole (see the adjudication above); both are the same MINOR r2 raised, at the same severity.\n\n</details>\n\n**Flaw 3** [MINOR] — A compression loss, small but real.\n\n<details><summary>(Step 5, proof.md:44: \"**(B2)** *for $S$ smooth of finite type, every $g:S\\to BH_m$ is smooth: its base change $P\\to S$ is so*\"; and (B1) \"*its base change is $Q\\times H\\to Q$*\") · the finding</summary>\n\nThe draft states the criterion once, correctly — \"*smoothness to a prestack being tested along the atlas*\" — which produces the base change of $f$ **along the atlas**, i.e. $P\\to\\mathrm{pt}$, and (A) uses it in exactly that sense (\"$P$ is levelwise smooth over $k$\"). (B1) and (B2) then name the *other* morphism, the base change of the atlas along $f$, i.e. $P\\to S$ and $Q\\times H\\to Q$, and stop there. The r2 draft carried the bridging step that makes the two agree (\"*$P\\to S$ is smooth of finite type, so $S$ smooth $\\Rightarrow P$ smooth $\\Rightarrow$ every $g$ is smooth*\"); the compression deleted it, leaving the criterion used in two inequivalent senses on one line. The mathematics is untouched — $S$ smooth and $P\\to S$ smooth give $P$ smooth over $k$, which is what the criterion wants — but the reader must supply the middle term. Repair: restore \"*so $P$ is smooth over $k$*\" in each of (B1), (B2), ~8 words.\n\n</details>\n\n**Flaw 4** [MINOR] — r2's Flaw 5(b),(c) survive in compressed form.\n\n<details><summary>(Step 2, proof.md:26: \"*For $K=H_m$ (smooth, char $0$) $\\mathcal{P}_T\\to T$ is smooth surjective of finite presentation*\"; \"*set $T':=\\mathcal{P}_T\\times^HH_1$, an affine such cover*\") · the finding</summary>\n\n(b) That an fpqc $H_m$-torsor is *smooth* over the base needs, beyond $H_m$ smooth, descent of smoothness along the trivializing fpqc cover; the parenthetical \"(smooth, char $0$)\" names the first ingredient only. (c) That $T'=\\mathcal{P}_T\\times^HH_1$ is affine and an fppf cover of $T$ is asserted by the words \"an affine such cover\" — it is true (the induced $H_1$-torsor is affine over $T$ by fpqc descent and smooth surjective of finite presentation because $H_1$ is), but the words point back to a justification given for a different object. Related, and smaller: \"*$T$, $\\mathcal{G}:=K\\times T$, $\\mathcal{P}_T$ are affine (…), hence representable and qcqs*\" inverts the logical order — representability of $\\mathcal{P}_T$ is what the parenthetical's fpqc descent supplies, and affineness follows from it, not the reverse. The entry makes representability of $\\mathcal{P}$ an explicit hypothesis, so this is the order that should be visible.\n\n</details>\n\n**Flaw 5** [MINOR] — Two symbols used in the proof are not in the notation line, in a draft whose whole method is to push definitions into that line.\n\n<details><summary>(notation line, proof.md:6) · the finding</summary>\n\n$\\pi_{m',m}\\colon BH_{m'}\\to BH_m$ (used four times in Step 4) is never introduced — only $\\pi_m\\colon BH\\to BH_m$ is — and $q_n$ is declared as \"$H_{m'}^{\\times n}\\to H_m^{\\times n}$\" with its dependence on the pair $(m,m')$ suppressed, so \"$\\mathcal{D}^!(H^{\\times n})\\simeq\\varprojlim_m\\mathcal{D}(H_m^{\\times n})$ along the $q_{n\\star}$\" (Step 3) and \"$q_{n\\star}$\" in the right-adjointability display are the same glyph for a family. Unambiguous in context; one clause each to fix.\n\n</details>\n\n**Flaw 6** [MINOR]\n\n<details><summary>(telegraphic constructions that cost the reader a mathematical step, proof.md:26, 44) · the finding</summary>\n\nCompression has crossed from terse into elliptical in three places, each recoverable but each a place where a referee has to reconstruct rather than check: \"*the entry puts no finite-type hypothesis on $\\mathcal{G}$, what admits $K=H$*\" (missing \"which is\"), \"*Such a test of $BK$ is its $K$-torsor $P=S\\times_{BK}\\mathrm{pt}\\to S$*\" (a test is a morphism; what is meant is that it is *classified by* the torsor), and \"*a fibre of $c$ is its lifts: a torsor under $N_{m,m'}$*\" (the content — verified in r2 — is that $c$ is, after a shear, a base change of $p$, hence an $N_{m,m'}$-torsor; \"a fibre … is its lifts\" asserts the fibres, not the torsor structure, which is what triviality over the affine $W$ then needs). None changes a claim.\n\n</details>\n\n## Advisory, not a flaw\n\nAt 896/900 there are four words of headroom, and Flaws 1–5 need roughly forty. That tension is structural, not the prover's fault: it is the same signal r2 recorded
