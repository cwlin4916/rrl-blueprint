`EVIDENCE: counterexample` against clause (iv) — it fails inside the standing class, for $X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ ([Q1-L5-e4](../Q1-L5/Q1-L5-e4/index.html)), where one orbit closure contains infinitely many orbits — turning the card red at −25%.\n- **2026-08-04 — statement revised** by `/update` ([u1](updates/u1.html)): clause (iv) withdrawn. The operator recomputed the $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ counterexample supplied by a user review passage rather than adopting it, and re-derived (i)–(ii) far enough to keep clauses (i)–(iii) at the standing generality. The finiteness is a theorem for $X$ symmetric, and that scoped claim was commissioned as its own node, [Q1-L6-L1](../Q1-L6/Q1-L6-L1/index.html), under the induction that consumes it — tracked in [priorities](../../../../blueprint/priorities.md). Considered and rejected: restricting the whole node to symmetric $X$ (weakening true clauses to rescue a withdrawn one), renaming $G_\\lambda^{\\mathrm{red}}$, and a replacement clause restating the placidity black box.\n- **2026-08-04 — literature re-weighed**: `/examples` re-run at the user's direction, scoped to the Iwasawa–Tate case, since the standing `counterexample` verdict measured exactly the withdrawn clause ([examples.md](examples.html), `EVIDENCE: instances`). The Tate case was worked stratum by stratum, consistent with u1; the run also established that clauses (i)–(iii) appear nowhere in print as one numbered theorem — the absence this node exists to close. Confidence swung −25% → +12%.\n- **2026-08-04 — decomposed** by `/decompose` into [Q1-L4-L1](Q1-L4-L1/index.html), [Q1-L4-L2](Q1-L4-L2/index.html), [Q1-L4-L3](Q1-L4-L3/index.html), [Q1-L4-L4](Q1-L4-L4/index.html): the cut separates the orbit geometry (i), the jet-image structure of the stabilizer (ii), and the two sheaf-theoretic invariance steps behind (iii) — one at finite type, one along the placid limit, the latter being exactly the pro-unipotent-invariance obligation [u1](updates/u1.html) left open.\n- **2026-08-05 — clause (ii) re-examined, statement unchanged** by `/update`: a user review passage doubted that the stabilizer $K_\\lambda$ of clause (ii) is placid. The doubt is sound in general and unsound here — the jet levels are affine, so the affineness the passage questions is automatic, and characteristic $0$ supplies the smoothness it does not mention — and the literature gap it points at is the one [examples.md](examples.html) already records, Sakellaridis–Wang exhibiting the stabilizer through the same finite-type images without asserting placidity. Full disposition in [Q1-L4-L2/u1](Q1-L4-L2/updates/u1.html); no clause of this node changed.\n- **2026-08-05 — clause (i) re-examined, statement unchanged** by `/update Q1-L4-L1 with input`: an external referee report on [Q1-L4-L1](Q1-L4-L1/index.html) split that node's clause (b) into the formal orbit–stabilizer isomorphism and the identification of the image sheaf with the stratum, which ratified reading 3 posits ([Q1-L4-L1/u1](Q1-L4-L1/updates/u1.html)). Clause (i) here is $K\\backslash LX_\\lambda\\simeq BK_\\lambda$ and is untouched by that relabelling, as is the Decomposition paragraph reading L1 as clause (i). What the run adds for this node's consumers is a scope fact: the published provenance of reading 3 covers the orbit strata of the nondegenerate locus $\\mathsf{L}^\\bullet X$, while $\\Lambda_X^+$ indexes the $L^+G$-orbits of the full $LX$, so a boundary stratum of a non-homogeneous $X$ is inside the reading and outside its source — tracked at [P18](../../../../blueprint/priorities.md).\n- **2026-08-05 — statement corrected** by `/update` (full walk) ([u2](updates/u2.html)): clause (ii) wrote $G_\\lambda := K_\\lambda/U_\\lambda$ with no topology attached, which is false read pointwise and true read as a sheaf. It now says **fpqc-sheaf quotient**, matching the correction made in the same run to the witness that supplies it, [Q1-L4-L2](Q1-L4-L2/index.html)(c). The node is `open`, so nothing resets, and the `## Decomposition` paragraph routes clause (ii) through that witness unchanged.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
