<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L4\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [papers](../../../papers/guideline.html)\n\nWhat the literature says about the three-clause statement of [Q1-L4](index.html) (as revised by\n[updates/u1.md](updates/u1.html); the former clause (iv) is withdrawn), and explicit instances,\nwith the Iwasawa–Tate case $\\mathbb{G}_m \\curvearrowright \\mathbb{A}^1$ worked in full as the\nprimary one. This file is outside the closed world: it justifies believing or doubting the\nstatement and no proof may cite it. Written 2026-08-04, superseding the pre-revision file.\n\n## Precedent\n\n**What was searched.** The local library first: `BZSV` §7.3 and §7.6 (pp. 155–159, 168–171 read)\nand `zhu2025tamecategoricallocallanglands` §10.5 (pp. 371–378 read); the reading record in\n[papers/guideline.md](../../../papers/guideline.html) for Chen–Yi v4 and Sakellaridis–Wang §2.3,\nwhose PDFs are not on disk (arXiv:2310.20006 re-checked on the web: v4, 10 Jul 2025, is current;\nProp. 17, Thm. 18, Thm. 36 confirmed there). Then the web for the package (i)–(iii) as a single\nnumbered theorem, and for the Tate-case sources.\n\n**What was found.** No source states (i)–(iii) together as one theorem; clause by clause:\n\n- *(i)+(ii) at the node's generality.* Sakellaridis–Wang, *Intersection complexes and unramified\n  $L$-factors*, J. Amer. Math. Soc. **35** (2022) 799–910, arXiv:2009.03943, **Prop. 2.3.7** with\n  its proof — §2.3 holds for **any** affine spherical $X$ — presents each $L^+G$-orbit meeting\n  $X^\\bullet$ as $\\mathsf{L}^+G/S$ fpqc (clause (i)) and exhibits $S$ through finite-type\n  scheme-theoretic images $S_n$ with smooth unipotent congruence kernels — the same witness\n  $U_\\lambda = \\ker(\\mathrm{ev}|_{K_\\lambda})$, $G_\\lambda\\hookrightarrow$ finite type, that\n  [updates/u1.md](updates/u1.html) re-derives for (ii). Not asserted there: placidity of $S$ itself\n  ([orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) places orbit *closures*, not stabilizers).\n  `refs.bib`: absent.\n- *(iii): the mechanism is in print; a theorem is not.* `BZSV` §7.3.3, p. 158: the finite-level\n  comparison functors (7.7) \"are in fact fully faithful\" because \"the kernel of maps\n  $G_{n+1}\\to G_n$ are abelian unipotent group schemes\" — clause (iii)'s contractibility — but the\n  boxed caveat on p. 156 explicitly withholds theorem status (\"we don't state them as theorems …\n  we prefer to leave the credit … to a paper which also develops the relevant foundations in\n  detail\"). The foundations that box defers to exist in the ℓ-adic/perfect setting:\n  `zhu2025tamecategoricallocallanglands` §10.5 — **Ex. 10.117** ($X/H$ very placid when the\n  pro-unipotent part of $H$ is cohomologically pro-unipotent), **Prop. 10.124(1)** (constructible\n  six-functor along ess. coh. pro-unipotent maps), **Ex. 10.134**, **Cor. 10.143** — though the\n  literal reduction $\\mathrm{Shv}_c(BH)\\simeq\\mathrm{Shv}_c(B(H/H_0))$ was not located in\n  pp. 371–378. In the $\\mathcal{D}$-module setting the attribution of pro-unipotent invariance to\n  `beraldo2017loop` (u1's input passage) remains unverified at page level; PDF not on disk.\n- *Special cases with result numbers.* Group case: `zhu2016introduction` **Prop. 2.1.5**\n  ($\\mathrm{Gr}_\\mu = L^+G/K_\\mu$, $K_\\mu = L^+G\\cap t^\\mu L^+Gt^{-\\mu}$; closure\n  $\\mathrm{Gr}_{\\le\\mu}$) and the fibration $\\mathrm{Gr}_\\mu\\to G/P_\\mu$ (§2.1, p. 26). Symmetric\n  case: `chenyi_2025singularitiesorbitclosuresloop` v4 — **Prop. 17**, **Thm. 18** (orbits\n  $\\leftrightarrow\\Lambda_S^+$ and closures; proofs $\\theta$-twisted, symmetric-only), **Thm. 36**\n  with **Rem. 37** (placidity, valid for general spherical $X$), **Cor. 9(ii)** and §1.2.3\n  (equivariant local systems on $LX_\\lambda$ = representations of $\\pi_0$ of the stabilizer — the\n  abelian shadow of (iii)). Tate case: `BZSV` **Ex. 7.3.5**, **(7.9)**, **Ex. 7.6.1** (instance 1).\n- *Contradiction.* None found against (i)–(iii). The published failure the previous run of this\n  file returned — one closure containing infinitely many orbits, from SW22 Thm. 2.3.5 +\n  Prop. 2.3.7 ($\\mathfrak{c}_X^-$ a nonzero monoid) — refuted exactly the withdrawn clause (iv)\n  and is now the node's Remark, not a live objection.\n\n**What was not found.** The three clauses as one numbered theorem, in any sheaf-theoretic\nsetting. The natural home, `BZSV` §7.3, asserts the pattern and withholds the theorems by design;\n`zhu2025tamecategoricallocallanglands` §10.5 supplies foundations in ℓ-adic perfect geometry but\n(in the pages read) not this statement; no $\\mathcal{D}$-module-setting statement of the package\nwas found. That absence is what the node exists to close. The authors' predecessor\n`Lin2025tamelocalBZSV` is \"In preparation\" per `refs.bib` — not in print, so not precedent.\n\n## Instances\n\n### 1. Iwasawa–Tate: $G = \\mathbb{G}_m$, $X = \\mathbb{A}^1$ (primary)\n\n**What it is.** $\\mathbb{G}_m$ scales $\\mathbb{A}^1$; $M = T^*\\mathbb{A}^1$ is the Tate\nhyperspherical space, with $\\check M = T^*\\mathbb{A}^1$ (`BZSV` Ex. 7.6.1, p. 168). Here\n$K = L^+\\mathbb{G}_m = k[[t]]^\\times$ and $LX(k) = k((t))$. Since every nonzero Laurent series is\nuniquely $t^n u$ with $u\\in k[[t]]^\\times$:\n\n$$\n\\Lambda_X^+ = \\mathbb{Z}\\sqcup\\{\\ast\\},\\qquad\nLX_n = \\{f : \\operatorname{val}_t(f) = n\\} = K\\cdot t^n,\\qquad\nLX_\\ast = \\{0\\},\n$$\n\nwith $\\overline{LX_n} = t^nk[[t]] \\supseteq LX_m$ for all $m\\ge n$ and $\\ni 0$. This matches\n[updates/u1.md](updates/u1.html) exactly (adding only the zero section, which u1 did not need), and\nSW22 Thm. 2.3.5: $X^\\bullet(F)/G(\\mathcal{O}) = F^\\times/\\mathcal{O}^\\times = \\mathbb{Z}$.\n\n**Why it is an instance.** Hypotheses of\n[untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html): smooth, affine,\nnormal — yes ($\\mathbb{A}^1$); open $B = \\mathbb{G}_m$-orbit $\\mathbb{A}^1\\smallsetminus\\{0\\}$\nwith trivial, hence connected, stabilizer — yes *(constructed, one line; recomputed in u1)*.\n[the three standing hypotheses](../../../appendix/assum-intro.html)(a): supplied by\n[orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), whose hypothesis is exactly \"smooth affine\nspherical\"; the presentation is the one `BZSV` Ex. 7.3.5 writes: $X_n^l(R) = t^{-l}R[t]/t^n$ with\nthe $R[[t]]^\\times$-action factoring through $(R[t]/t^{n+l})^\\times$. (b): a numbered\ndimension-theory citation for $L\\mathbb{A}^1$ was not pinned — **not discharged from a source**\n— though `BZSV` p. 158 uses exactly such a normalization (\"declare the zeroth stratum to have\n'dimension 0'\"). (c): the unramified equivalence is verified by hand in `BZSV` Ex. 7.6.1, and a\nfully ramified de Rham version is Hilburn–Raskin, *Tate's thesis in the de Rham setting*,\narXiv:2107.11325, per `BZSV` §7.6.5 (p. 169).\n\n**What the statement says here.** Clause by clause, per stratum:\n\n- $LX_n$, $n\\in\\mathbb{Z}$: the orbit map $u\\mapsto ut^n$ is an isomorphism $K\\xrightarrow{\\sim}LX_n$\n  of schemes, so $K_n = \\operatorname{Stab}_K(t^n) = \\{1\\}$ *(constructed: $ut^n = t^n\\Leftrightarrow u=1$)*.\n  (i): $K\\backslash LX_n\\simeq B\\{1\\} = \\mathrm{pt}$. (ii): $U_n = 1$, $G_n = G_n^{\\mathrm{red}} = 1$.\n  (iii): $\\mathcal{D}_c(K\\backslash LX_n)\\simeq\\mathcal{D}_c(\\mathrm{pt})$, both equivalences identities.\n- $LX_\\ast = \\{0\\}$: $K_\\ast = K = L^+\\mathbb{G}_m$, placid — the limit of the\n  $(k[t]/t^{m})^\\times$ along smooth affine surjections, the very presentation of Ex. 7.3.5.\n  $U_\\ast = \\ker(\\mathrm{ev}_0\\colon k[[t]]^\\times\\to\\mathbb{G}_m) = 1+tk[[t]]$: normal, and\n  pro-unipotent since each quotient $(1+t\\mathcal{O})/(1+t^m\\mathcal{O})$ is unipotent.\n  $G_\\ast = \\mathbb{G}_m$, affine of finite type and already reductive, so\n  $G_\\ast^{\\mathrm{red}} = \\mathbb{G}_m$. (i): $K\\backslash\\{0\\}\\simeq BL^+\\mathbb{G}_m$;\n  (iii): $\\mathcal{D}_c(BL^+\\mathbb{G}_m)\\simeq\\mathcal{D}_c(B\\mathbb{G}_m)$.\n\nThe published shadow of (iii) is `BZSV` (7.9):\n$\\operatorname{Hom}(\\delta_{l_1},\\delta_{l_2})\\simeq H^*(B\\mathbb{G}_m)$ up to their\nweight-normalizing twist by $d = |l_1-l_2|$ (the angle-bracket twist of (7.9)) — the Homs of the normalized constant sheaves see exactly the cohomology of the\n$B\\mathbb{G}_m$ the node predicts for the closed stratum — matched on the spectral side by\nEx. 7.6.1 (invariant monomials $x^a\\xi^b$, one dimension in each degree $|n-m|, |n-m|+2,\\dots$).\nTwo honest limits: every $G_\\lambda$ here is reductive, so the second equivalence of (iii) is\nuntested (instance 3 tests it); and each $\\overline{LX_n}$ contains infinitely many strata — the\nfailure of the *withdrawn* (iv), confirming u1 cut exactly the false clause. The same $X$ under\n$G = \\mathrm{GL}_1\\times\\mathrm{GL}_1$ (Godement–Jacquet, $n=1$) instead has\n$K_m\\cong\\mathcal{O}^\\times$ and $G_m$-quotients on *every* nonzero stratum *(constructed)*.\n\n**Source.** Ben-Zvi–Sakellaridis–Venkatesh, arXiv:2409.04677 — Ex. 7.3.5 with (7.8)–(7.9)\n(p. 158), Ex. 7.6.1 (p. 168), §7.6.5 (p. 169). `refs.bib`: `BZSV`; Hilburn–Raskin and\nSakellaridis–Wang absent.\n\n### 2. Torus group case: $X = T$ under $G = T\\times T$ *(constructed, routine)*\n\n**What it is / why an instance.** Smooth affine; the Borel is $T\\times T$ itself, its open orbit\nis all of $T$ with stabilizer the antidiagonal $T$ — connected; the group case, so\n[the three standing hypotheses](../../../appendix/assum-intro.html)(c) is derived Satake via\n[known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(1)\n[`bezrukavnikov2008equivariant`, Thm 5]. Orbits $t^\\lambda L^+T$, $\\lambda\\in X_*(T)$, each open\nand closed; $K_\\lambda\\cong L^+T$ (antidiagonal), $U_\\lambda = \\ker(L^+T\\to T)$,\n$G_\\lambda = G_\\lambda^{\\mathrm{red}} = T$.\n\n**What the statement says here.** $K\\backslash LX_\\lambda\\simeq BL^+T$ and\n$\\mathcal{D}_c(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}_c(BT)$ for every $\\lambda$.\n\n### 3. Group case: $X = G$ under $G\\times G$ — where $G_\\lambda^{\\mathrm{red}}\\neq G_\\lambda$\n\n**What it is.** The Cartan strata of $\\mathrm{Gr}$. `zhu2016introduction` **Prop. 2.1.5**:\n$\\mathrm{Gr}_\\mu$ is a single $L^+G$-orbit with stabilizer $K_\\mu = L^+G\\cap t^\\mu L^+Gt^{-\\mu}$\n— clause (i) — and §2.1 p. 26 gives the fibration $p_\\mu\\colon\\mathrm{Gr}_\\mu\\to G/P_\\mu$ with\naffine-space fibres, the shadow of $\\mathrm{ev}_0(K_\\mu) = P_\\mu$, i.e. $G_\\mu = P_\\mu$ with\n$U_\\mu = K_\\mu\\cap\\ker(L^+G\\to G)$ — the identification\n$\\mathfrak{g}(\\mathcal{O})\\cap\\mathrm{Ad}_{t^\\mu}\\mathfrak{g}(\\mathcal{O})\\bmod t = \\mathfrak{p}_\\mu$\nis routine *(constructed)*.\n\n**Why it is an instance.** $X = G$ is smooth affine spherical with connected generic\n$B\\times B$-stabilizer ($\\cong T$); (c) is derived Satake,\n[known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(1).\n\n**What the statement says here.** $G_\\mu = P_\\mu$ is *not* reductive:\n$G_\\mu^{\\mathrm{red}} = L_\\mu$, the Levi, and (iii) asserts\n$\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr}_\\mu)\\simeq\\mathcal{D}_c(BP_\\mu)\\simeq\\mathcal{D}_c(BL_\\mu)$\n— the one instance here where the second equivalence does work. For $G = \\mathrm{SL}_2$,\n$\\mu = \\check\\alpha$: $\\mathcal{D}_c(BT)$.\n\n**Source.** Zhu, *An introduction to affine Grassmannians and the geometric Satake equivalence*,\narXiv:1603.05593, Prop. 2.1.5 and §2.1. `refs.bib`: `zhu2016introduction`.\n\n### 4. Symmetric, in print: linear periods $X = (\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$\n\n**What it is / why an instance.** $\\theta = \\mathrm{Ad}(\\mathrm{diag}(1_n,-1_n))$,\n$G^\\theta = \\mathrm{GL}_n\\times\\mathrm{GL}_n$ connected — Chen–Yi's standing setting verbatim,\nand symmetric $\\Rightarrow$ spherical. (c) is recorded only as upcoming work\n([known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(3)) — **not\ndischarged**.\n\n**What the statement says here.** Strata indexed by $\\Lambda_S^+$, $S$ of rank $n$ (Prop. 17),\nclosures by the coroot order (Thm. 18); Cor. 9(ii) realizes the abelian shadow of (iii):\n$L^+G$-equivariant local systems on $LX_\\lambda$ are representations of $\\pi_0(K_\\lambda)$ — a\nfinite-group statement only a finite-type quotient $G_\\lambda$ can deliver.\n\n**Source.** Chen–Yi, *Singularities of orbit closures in loop spaces of symmetric varieties*,\narXiv:2310.20006v4 — Prop. 17, Thm. 18, Cor. 9(ii), §1.2.3. `refs.bib`:\n`chenyi_2025singularitiesorbitclosuresloop`.\n\n## Promotion candidates\n\nNone new: the Iwasawa–Tate case already has its question-level node,\n[Q1-e2](../Q1-e2/index.html), whose statement carries the Hecke/Hom side; the orbit–stabilizer\ncomputation of instance 1 would enrich it if the lead-researcher wants the geometric half on\nrecord there too.\n\nEVIDENCE: instances\n";</script>
