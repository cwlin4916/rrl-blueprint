_{\\lambda,m}$, $U = U_\\lambda$ and $H_1 = G_\\lambda$. The failure it answers is recorded in [u2](../updates/u2.html), first \"Verified\" bullet: Steps 2–7 of [Q1-L4-L2](../index.html)'s draft name the stabilizer only through the ideal that cuts it out, so every word of them holds verbatim for an arbitrary closed subgroup scheme of $L^+G$ over a field of characteristic $0$. No existing node carries that generality.\n\n  **A theorem gained, not a statement widened** ([ADR 0019](../../../../../process/decisions/0019-the-update-operator.html) §3). [Q1-L4-L2](../index.html)'s refereed statement stands exactly as it is and its `proved` status is untouched; the strictly more general claim becomes this node, which that one specializes. Clause (C) is where the gain is visible: it is **stronger** than [Q1-L4-L2](../index.html)(b), which asks only that the transition kernels be unipotent.\n\n  **The route, recorded as route and not as claim.** Three ingredients were verified during [u2](../updates/u2.html) and are what the next `/prove` should try: the Hopf-algebra description of scheme-theoretic images, faithful flatness of a Hopf algebra over a Hopf subalgebra, and Cartier smoothness in characteristic $0$. The strengthening in (C) holds because in characteristic $0$ a closed subgroup scheme of $\\mathbb{V}(\\mathfrak{g})$ is reduced (Cartier), connected — a finite subgroup would be a finite subgroup of a torsion-free group — and linearly embedded, every homomorphism $\\mathbb{G}_a\\to\\mathbb{G}_a$ being a scalar there. The faithful-flatness route is recorded as unverified in [u2](../updates/u2.html): the theorem it invokes is outside the closed world, and nothing in the statement rests on it.\n\n  **Characteristic $0$ is a hypothesis of (A) and is load-bearing** for clause (B): the witness is the sibling example node [Q1-L4-L2-e1](../Q1-L4-L2-e1/index.html).\n";</script>
