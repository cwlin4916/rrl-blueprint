<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L2-L1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L2-L1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L2-L1 — jet images present a closed subgroup of $L^+G$ as a placid group scheme\n\n[node](index.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html) · [DAG index](../../../../../dag.html)\n\n- **uses:** [the standing notation](../../../../../appendix/subsec-notations.html), [loops, jets and positive loops](../../../../../appendix/ex-loops-placid.html), [placidity](../../../../../appendix/placid-ind-scheme.html); no `depends-on` — a ready leaf.\n- **notation:** $A_m:=\\mathcal{O}(L^mG)$, $A:=\\mathcal{O}(K)$, $\\mathfrak{a}\\subseteq A$ the Hopf ideal of $H$, $\\mathfrak{a}_m:=\\mathfrak{a}\\cap A_m$, $q_m\\colon H_{m+1}\\to H_m$ the transition, $\\varepsilon$ the counit of $\\mathcal{O}(G)$ and $\\mathfrak{m}_e$ its augmentation ideal; unsubscripted identifications of schemes are in affine $k$-schemes.\n\n## Lemma\n\n**(A) Setting.** Let $k$ be algebraically closed of characteristic $0$ and let $G$ be an affine algebraic group over $k$ ([the standing notation](../../../../../appendix/subsec-notations.html)); write $K = L^+G$ and $\\mathfrak{g} = \\operatorname{Lie}(G)$, and let $H\\subseteq K$ be a closed subgroup scheme. For $m\\ge 1$ let $\\mathrm{ev}_m\\colon K\\to L^mG$ be the jet evaluation ([loops, jets and positive loops](../../../../../appendix/ex-loops-placid.html); $L^1G = G$) and let $H_m\\subseteq L^mG$ be the scheme-theoretic image of $\\mathrm{ev}_m|_H$.\n\n**(B) Placid presentation.** Each $H_m$ is an affine group scheme of finite type over $k$, each transition $H_{m+1}\\to H_m$ is an affine, faithfully flat, smooth homomorphism of group schemes, and the canonical map\n\n$$\nH\\ \\xrightarrow{\\ \\sim\\ }\\ \\varprojlim_m H_m\n$$\n\nis an isomorphism; in particular $H$ is a placid group scheme ([placidity](../../../../../appendix/placid-ind-scheme.html)).\n\n**(C) Vector-group transition kernels.** For every $m\\ge 1$ there is a linear subspace $\\mathfrak{n}_m\\subseteq\\mathfrak{g}$ such that, under the canonical identification $\\ker\\left(L^{m+1}G\\to L^mG\\right)\\cong\\mathbb{V}(\\mathfrak{g})$,\n\n$$\n\\ker\\left(H_{m+1}\\to H_m\\right) = \\mathbb{V}(\\mathfrak{n}_m);\n$$\n\nin particular this kernel is a vector group, hence unipotent.\n\n**(D) Pro-unipotent radical and finite-type quotient.** The subgroup $U := \\ker(H\\to H_1)$ is normal in $H$ and pro-unipotent — every finite-type quotient group of $U$ is unipotent — and the fpqc-sheaf quotient $H/U\\simeq H_1$ is a closed subgroup scheme of $G$, hence an affine group scheme of finite type over $k$.\n\n## Proof\n\n**Step 1 — $G$ is smooth, so [loops, jets and positive loops](../../../../../appendix/ex-loops-placid.html) applies at $X=G$.**\n\n<details><summary>the argument</summary>\n\nAn affine algebraic group over a characteristic-$0$ field is reduced (Cartier), hence smooth. So $K=\\varprojlim_{m\\ge1}L^mG$, the $A_m$ finitely generated, the transitions smooth and affine. Connectedness and reductivity are used nowhere.\n\n</details>\n\n**Step 2 — the $A_m$ are nested with $A=\\bigcup_{m\\ge1}A_m$.**\n\n<details><summary>the argument</summary>\n\n$(t^m)\\subseteq R[t]/t^{m+1}$ squares to zero for $m\\ge1$, so formal smoothness of $G$ makes $L^{m+1}G(R)\\to L^mG(R)$ surjective for all $R$; at $R=A_m$ the universal point lifts to a section, splitting $A_m\\hookrightarrow A_{m+1}$. A cofiltered limit of affines is $\\operatorname{Spec}$ of the colimit of the rings.\n\n</details>\n\n**Step 3 — $(\\star)$: a homomorphism of affine $k$-group schemes has closed subgroup-scheme image.**\n\n<details><summary>the argument</summary>\n\nFor commutative Hopf $k$-algebras $f\\colon C\\to D$, $(\\operatorname{im}f)^{\\otimes2}\\to D^{\\otimes2}$ stays injective over a field, so $\\Delta_D(\\operatorname{im}f)\\subseteq\\operatorname{im}f\\otimes\\operatorname{im}f$; counit and antipode restrict. Thus $C\\twoheadrightarrow\\operatorname{im}f\\hookrightarrow D$ are Hopf maps, no finiteness assumed.\n\n</details>\n\n**Step 4 — $H_m$ is a closed subgroup scheme of $L^mG$, affine of finite type over $k$.**\n\n<details><summary>the argument</summary>\n\n$H=\\operatorname{Spec}(A/\\mathfrak{a})$, closed in the affine $K$. As $\\mathrm{ev}_m^*$ is $A_m\\subseteq A$ (Step 2), and a scheme-theoretic image of affines is $\\operatorname{Spec}$ of the image ring, $H_m=\\operatorname{Spec}(A_m/\\mathfrak{a}_m)$: finite type by Step 1, a subgroup scheme by $(\\star)$. At $m=1$, $H_1\\subseteq L^1G=G$.\n\n</details>\n\n**Step 5 — $q_m$ is an affine homomorphism, schematically dominant, restricting $L^{m+1}G\\to L^mG$.**\n\n<details><summary>the argument</summary>\n\nBy $(\\star)$, $A_m/\\mathfrak{a}_m$ and $A_{m+1}/\\mathfrak{a}_{m+1}$ are sub-Hopf-algebras of $A/\\mathfrak{a}$, nested because $A_m\\subseteq A_{m+1}$; that inclusion is injective and Hopf.\n\n</details>\n\n**Step 6 — $q_m$ is faithfully flat.**\n\n<details><summary>the argument</summary>\n\nA homomorphism of affine algebraic $k$-groups is faithfully flat onto its image, which is closed by Chevalley; by Step 5 that image is schematically dense, hence $H_m$.\n\n</details>\n\n**Step 7 — $\\ker(L^{m+1}G\\to L^mG)\\cong\\mathbb{V}(\\mathfrak{g})$ as group schemes over $k$, $m\\ge1$,**\n\n<details><summary>the argument</summary>\n\nwhere\n\n$$\n\\mathbb{V}(W)(R):=W\\otimes_kR .\n$$\n\nAn $R$-point of the kernel is a $k$-algebra map $\\gamma=\\varepsilon_R+t^mD\\colon\\mathcal{O}(G)\\to R[t]/t^{m+1}$ with $D$ $k$-linear. Since $t^{2m}=0$, $\\gamma$ is multiplicative exactly when $D$ is an $\\varepsilon$-derivation, i.e. $D\\in\\operatorname{Hom}_k(\\mathfrak{m}_e/\\mathfrak{m}_e^2,R)=\\mathfrak{g}\\otimes_kR$, the last equality because $\\mathfrak{m}_e/\\mathfrak{m}_e^2$ is finite-dimensional; and $\\gamma_1\\gamma_2=(\\gamma_1\\otimes\\gamma_2)\\Delta$ is $D_1+D_2$, functorially in $R$.\n\n</details>\n\n**Step 8 — in characteristic $0$ a closed subgroup scheme $\\Gamma\\subseteq\\mathbb{V}(W)$ is $\\mathbb{V}(\\mathfrak{n})$ for a linear $\\mathfrak{n}\\subseteq W$.**\n\n<details><summary>the argument</summary>\n\n$\\Gamma$ is affine of finite type, hence reduced (Cartier), and $k=\\bar k$, so $\\Gamma$ is the reduced subscheme on $\\Gamma(k)$. For $v\\in\\Gamma(k)\\setminus0$ the $nv$, $n\\in\\mathbb{Z}$, are pairwise distinct, so $\\Gamma(k)\\cap kv$ is an infinite closed subset of the line $kv$, hence $kv$. So $\\Gamma(k)=:\\mathfrak{n}$ is a subspace and $\\Gamma=_{\\mathbb{V}(W)}\\mathbb{V}(\\mathfrak{n})$.\n\n</details>\n\n**Step 9 — (C) holds.**\n\n<details><summary>the argument</summary>\n\n$H_{m+1}\\hookrightarrow L^{m+1}G$ is monic and $q_m$ restricts (Step 5), so $\\ker q_m=H_{m+1}\\cap\\ker(L^{m+1}G\\to L^mG)$ is a closed subgroup scheme of $\\mathbb{V}(\\mathfrak{g})$ (Step 7); Step 8 supplies $\\mathfrak{n}_m$ with $\\ker q_m=_{\\mathbb{V}(\\mathfrak{g})}\\mathbb{V}(\\mathfrak{n}_m)$, and $\\mathbb{V}(\\mathfrak{n}_m)\\cong\\mathbb{G}_a^{\\dim\\mathfrak{n}_m}$ is unipotent.\n\n</details>\n\n**Step 10 — $q_m$ is smooth.**\n\n<details><summary>the argument</summary>\n\nIt is flat of finite presentation (Steps 4, 6), with fibres torsors under the smooth $\\ker q_m=\\mathbb{V}(\\mathfrak{n}_m)$ (Step 9); smoothness descends along a trivializing cover, and flat with smooth fibres is smooth. Faithful flatness alone would not give this.\n\n</details>\n\n**Step 11 — $H\\xrightarrow{\\ \\sim\\ }\\varprojlim_mH_m$.**\n\n<details><summary>the argument</summary>\n\n$\\mathfrak{a}=\\bigcup_m\\mathfrak{a}_m$ (Step 2) and the transitions $A_m/\\mathfrak{a}_m\\to A_{m+1}/\\mathfrak{a}_{m+1}$ are injective (Step 5), so $A/\\mathfrak{a}=\\operatorname{colim}_mA_m/\\mathfrak{a}_m$ and $H(R)=\\operatorname{Hom}_{k\\text{-alg}}(A/\\mathfrak{a},R)=\\lim_mH_m(R)$ for all $R$: an isomorphism of fpqc sheaves. As $\\operatorname{Spec}$ is right adjoint to global sections, the same object is the limit in affine $k$-schemes and in all $k$-schemes.\n\n</details>\n\n**Step 12 — (B) holds.**\n\n<details><summary>the argument</summary>\n\nSteps 4–6, 10, 11 make $H$ a cofiltered limit of finite-type affine group schemes along smooth affine homomorphisms: a placid presentation ([placidity](../../../../../appendix/placid-ind-scheme.html)).\n\n</details>\n\n**Step 13 — $U$ is closed and normal in $H$, and $U=\\varprojlim_mU_m$,**\n\n<details><summary>the argument</summary>\n\nwhere\n\n$$\nU_m:=\\ker(H_m\\to H_1).\n$$\n\n$U$ is the kernel of the homomorphism $\\pi:=\\mathrm{ev}_1|_H\\colon H\\to H_1$ (Steps 4, 5). Kernels are fibre products and limits commute with limits, so base-changing Step 11 along $e\\to H_1$ gives the presentation, and $\\mathcal{O}(U)=\\operatorname{colim}_m\\mathcal{O}(U_m)$ because tensor commutes with filtered colimits.\n\n</details>\n\n**Step 14 — $\\pi$ is faithfully flat.**\n\n<details><summary>the argument</summary>\n\n$A/\\mathfrak{a}$ is a filtered colimit of the $A_m/\\mathfrak{a}_m$, each faithfully flat over $A_1/\\mathfrak{a}_1$ (Step 6), hence flat over it; and the fibre ring $\\operatorname{colim}_m(A_m/\\mathfrak{a}_m\\otimes_{A_1/\\mathfrak{a}_1}\\kappa(\\xi))$ at $\\xi\\in H_1$ is a filtered colimit of rings nonzero by that same faithful flatness, hence nonzero — $1=0$ would already hold at a finite stage.\n\n</details>\n\n**Step 15 — $H/U\\simeq_{\\mathrm{Shv}_{\\mathrm{fpqc}}}H_1$.**\n\n<details><summary>the argument</summary>\n\nThe presheaf $R\\mapsto H(R)/U(R)$ is monic into $H_1$ — $\\pi(g)=\\pi(h)$ forces $gh^{-1}\\in U(R)$ — and sheafification preserves a monomorphism into a sheaf. It is epic because $\\pi$ is faithfully flat and affine (Step 14), so $H\\times_{H_1}\\operatorname{Spec}R\\to\\operatorname{Spec}R$ is an fpqc cover splitting any $\\xi\\in H_1(R)$. Monic and epic is an isomorphism, and $H_1$ is closed in $G$ of finite type (Step 4).\n\n</details>\n\n**Step 16 — $U_m$ is unipotent.**\n\n<details><summary>the argument</summary>\n\nSet\n\n$$\nV^j:=\\ker(H_m\\to H_j).\n$$\n\nThis runs from $V^1=U_m$ to $V^m=1$, and $V^j\\to\\ker q_j=\\mathbb{V}(\\mathfrak{n}_j)$ has kernel $V^{j+1}$ and closed image (Chevalley). Closed subgroups and extensions of unipotent groups are unipotent.\n\n</details>\n\n**Step 17 — every finite-type quotient of $U$ is unipotent; (D) holds.**\n\n<details><summary>the argument</summary>\n\nLet $\\phi\\colon U\\to Q$ be faithfully flat with $Q$ affine of finite type — over a field every fpqc quotient of $U$ by a closed normal subgroup scheme is of this shape — so $\\phi^*$ is injective. With\n\n$$\nB_m:=\\operatorname{im}\\left(\\mathcal{O}(U_m)\\to\\mathcal{O}(U)\\right),\\quad P_m:=\\operatorname{Spec}B_m,\n$$\n\nthe $B_m$ increase with union $\\mathcal{O}(U)$ (Step 13), so the finitely many generators of $\\mathcal{O}(Q)$ lie in one $B_m$ and $\\phi^*$ factors through it. By $(\\star)$, $P_m$ is closed in $U_m$, hence unipotent (Step 16), and $\\mathcal{O}(Q)\\hookrightarrow B_m$ is Hopf, its coproduct composites agreeing after $B_m^{\\otimes2}\\hookrightarrow\\mathcal{O}(U)^{\\otimes2}$. So $P_m\\to Q$ is dominant with closed image (Chevalley), i.e. surjective; quotients of unipotent groups are unipotent. With Steps 13 and 15, (D). $\\blacksquare$\n\n</details>\n\n## Caveats\n\nCharacteristic $0$ is tight, and Step 8 uses it twice: Cartier's theorem, and the infinitude of $\\mathbb{Z}v$. In characteristic $p$ the closed subgroup scheme $\\alpha_p\\subseteq\\mathbb{V}(k)$ is neither reduced nor a linear subspace, so (C) fails.\n";</script>
