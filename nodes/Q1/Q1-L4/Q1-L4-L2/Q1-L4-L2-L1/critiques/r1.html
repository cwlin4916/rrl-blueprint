<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L4</a><i>›</i><a href="../../index.html">Q1-L4-L2</a><i>›</i><a href="../index.html">Q1-L4-L2-L1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4-L2-L1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L2/Q1-L4-L2-L1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee report on [proof.md](../proof.html) against [the node statement](../index.html). Round 1; no prior report. The word overflow (1201/900) is not raised as a flaw, per the orchestrator's instruction; my view on where to split is at the end.\n\n## What I verified, and how\n\nRecording this so round 2 does not re-do it.\n\n**Statement, word for word.** I diffed the draft's `## Lemma` against the node's `## Statement`. Clauses (A), (B), (C), (D) are character-identical, links and link depths included. No hypothesis added, no conclusion weakened, no `GAP:` marker. Nothing here is a restatement of the claim: (C) and (D) are both proved from scratch.\n\n**Closed world.** The draft uses exactly the three declared entries — [the standing notation](../../../../../../appendix/subsec-notations.html), [loops, jets and positive loops](../../../../../../appendix/ex-loops-placid.html), [placidity](../../../../../../appendix/placid-ind-scheme.html) — all three of which exist with the anchors the links target. There are **no** bib citations, **no** `main.tex` `\\label` references, and **no** link to any node. In particular the draft nowhere cites its consumer [Q1-L4-L2](../../index.html), which was the circularity to watch for. Clean.\n\n**Appendix entries against their source.** I read `main.tex:667–718`. [placidity](../../../../../../appendix/placid-ind-scheme.html) transcribes the definition faithfully — cofiltered limit of finite-type schemes, transitions *smooth and affine*, no surjectivity requirement. [loops, jets and positive loops](../../../../../../appendix/ex-loops-placid.html) transcribes the indexing faithfully: `main.tex:696` reads $L^nX(R):=X(R[t]/t^n)$, so $L^1G=G$ and the range $m\\ge1$ in the draft's Steps 2 and 7 is the correct one — the ideal $(t^m)\\subseteq R[t]/t^{m+1}$ squares to zero exactly for $m\\ge1$. No index shift. Neither entry mis-states its source.\n\n**The `ex-loops-placid` caveat does not bite.** The caveat concerns the pieces $LX^i$ of a loop space under the stricter [[raskin_dmodules_infinite_var, §4.2](../../../../../../../papers/raskin_dmodules_infinite_var.pdf)] convention requiring *surjective* transitions. Here the transitions $H_{m+1}\\to H_m$ are faithfully flat (Step 6), hence surjective, so the presentation of Step 12 is placid in the stricter sense too. The draft is silent on this; it is a bonus rather than a collision.\n\n**The repair the level above did not have is real, not cosmetic.** [Q1-L4-L2](../../index.html)'s Step 4 ran \"surjective, hence faithfully flat with smooth fibers (generic flatness plus translation) … hence smooth\" in one breath. Here Step 6 instead invokes the factorization theorem — a homomorphism of affine algebraic $k$-groups is faithfully flat onto its (closed) image — whose hypotheses I checked hold: $H_{m+1}$ and $H_m$ are affine of finite type over $k$ by Step 4, and Step 5's injectivity of $\\mathcal{O}(H_m)\\to\\mathcal{O}(H_{m+1})$ identifies that image with $H_m$. Step 10 then proves smoothness *separately* and correctly: flat of finite presentation, fibres are (nonempty, by faithful flatness) torsors under $\\mathbb{V}(\\mathfrak{n}_m)$, smoothness is fppf-local on the base, and flat + finite presentation + smooth fibres is smooth. The two properties are genuinely independent in the draft.\n\n**Step 7 and Step 8, the sharpest content.** Both check out in detail. Step 7: a kernel point is $\\gamma=\\varepsilon_R+t^mD$; $t^{2m}=0$ (valid for $m\\ge1$) makes multiplicativity equivalent to $D$ being an $\\varepsilon$-derivation; $\\operatorname{Der}_\\varepsilon(\\mathcal{O}(G),R)=\\operatorname{Hom}_k(\\mathfrak{m}_e/\\mathfrak{m}_e^2,R)=\\mathfrak{g}\\otimes_kR$; and $(\\gamma_1\\otimes\\gamma_2)\\Delta$ gives $D_1+D_2$ by the counit axioms. Step 8: Cartier gives $\\Gamma$ reduced, $k=\\bar k$ plus finite type gives $\\Gamma$ the reduced structure on $\\Gamma(k)$, $\\{nv\\}_{n\\in\\mathbb{Z}}\\subseteq\\Gamma(k)\\cap kv$ is infinite and closed in the line $kv$ hence equals it, so $\\Gamma(k)$ is a subgroup closed under $k$-scaling, i.e. a subspace. Characteristic $0$ is used exactly twice, as claimed. Step 9's identification $\\ker q_m=H_{m+1}\\cap\\ker(L^{m+1}G\\to L^mG)$ is correct (see Flaw 2 for a mis-naming inside it).\n\n**Step 11, the limit.** The category question is handled, not dodged: $\\mathcal{O}(H)=\\operatorname{colim}_m\\mathcal{O}(H_m)$ with **injective** transitions, the injectivity actually established (Step 5, via $\\mathcal{O}(H_m)\\hookrightarrow\\mathcal{O}(H)$) rather than assumed; the pointwise statement is an identity of fpqc sheaves; and $\\operatorname{Spec}\\dashv\\Gamma$ moves it to affine $k$-schemes and to all $k$-schemes. Correct on all three counts.\n\n**Step 17, the pro-unipotence bridge.** The factorization is complete: $\\phi^*$ injective, $\\mathcal{O}(Q)$ finitely generated, generators land in one $B_m$ because the $B_m$ increase with union $\\mathcal{O}(U)$ (Step 13), $\\phi^*(\\mathcal{O}(Q))\\subseteq B_m$ since $B_m$ is a subalgebra, $P_m$ closed in $U_m$ by $(\\star)$ hence unipotent, $\\mathcal{O}(Q)\\hookrightarrow B_m$ Hopf by injectivity of $B_m^{\\otimes2}\\hookrightarrow\\mathcal{O}(U)^{\\otimes2}$, and $P_m\\to Q$ schematically dominant with closed image, so surjective. The Hopf-image lemma it leans on *is* proved where the draft says, in Step 3, including the load-bearing \"tensor squares of injections stay injective over a field\". Unlike the level above, this is not caveated away.\n\n**Generality audit.** I checked Step 1's \"connectedness and reductivity are used nowhere\" claim step by step. What the proof actually consumes from $G$ is: smoothness (Steps 1, 2, 10), $\\mathcal{O}(G)$ finitely generated (Step 1, via the entry), and $\\dim_k\\mathfrak{m}_e/\\mathfrak{m}_e^2<\\infty$ (Step 7). None of these needs connectedness or reductivity. The claim stands. See Flaw 7 on the finite-type hypothesis.\n\n**Statement truth.** I could not refute any clause. (C) is exactly Step 8, which is true in characteristic $0$; (B) and (D) follow. Not `REFUTED`.\n\n**Hygiene.** No bare backticked appendix label outside a link. No `preamble.tex` macros. All display math in `$$` blocks with blank lines either side. All relative links at the correct depth `../../../../` for a node three `-L`s deep. Ambient subscripts: the load-bearing ones ($=_{\\mathbb{V}(W)}$, $=_{\\mathbb{V}(\\mathfrak{g})}$, $\\simeq_{\\mathrm{Shv}_{\\mathrm{fpqc}}}$) are all present. See Flaw 11 on the blanket convention.\n\n## Flaws\n\n**Flaw 1** [MINOR] — The step is stated for an arbitrary $W$ and its first move — \"$\\Gamma$ is affine of finite type\" — is false without $\\dim_kW<\\infty$: $\\mathbb{V}(W)$ is not of finite type for infinite-dimensional $W$, and the subsequent Jacobson move (\"$\\Gamma$ is the reduced subscheme on $\\Gamma(k)$\") is exactly the one that needs it.\n\n<details><summary>(Step 8: \"in characteristic $0$ a closed subgroup scheme $\\Gamma\\subseteq\\mathbb{V}(W)$ is $\\mathbb{V}(\\mathfrak{n})$ for a linear $\\mathfrak{n}\\subseteq W$\") · the finding</summary>\n\nNo damage, because the only application is at $W=\\mathfrak{g}$ (Step 9). Repair: three words — state Step 8 for $\\dim_kW<\\infty$, and note that $\\dim_k\\mathfrak{g}<\\infty$ is already in hand from Step 7's \"$\\mathfrak{m}_e/\\mathfrak{m}_e^2$ is finite-dimensional\".\n\n</details>\n\n**Flaw 2** [MINOR] — The monomorphism named is not the one the identification needs.\n\n<details><summary>(Step 9: \"$H_{m+1}\\hookrightarrow L^{m+1}G$ is monic and $q_m$ restricts (Step 5), so $\\ker q_m=H_{m+1}\\cap\\ker(L^{m+1}G\\to L^mG)$\") · the finding</summary>\n\nWriting $\\cap$ as a fibre product,\n\n$$\nH_{m+1}\\cap\\ker\\left(L^{m+1}G\\to L^mG\\right)\\ =\\ H_{m+1}\\times_{L^{m}G}e\\ =\\ H_{m+1}\\times_{H_m}\\left(H_m\\times_{L^mG}e\\right),\n$$\n\nso the identification with $\\ker q_m=H_{m+1}\\times_{H_m}e$ requires $H_m\\times_{L^mG}e=e$, i.e. that $H_m\\hookrightarrow L^mG$ is monic — the *target*-level embedding, not $H_{m+1}\\hookrightarrow L^{m+1}G$. Both hold by Step 4, so the conclusion is untouched; the citation is simply pointed at the wrong index. Repair: replace \"$H_{m+1}\\hookrightarrow L^{m+1}G$\" by \"$H_m\\hookrightarrow L^mG$\".\n\n</details>\n\n**Flaw 3** [MINOR] — The clause presumes that fpqc sheafification exists, which is exactly the thing that fails in general for the fpqc topology on a big site (Waterhouse's example).\n\n<details><summary>(Step 15: \"sheafification preserves a monomorphism into a sheaf\") · the finding</summary>\n\nThe draft does not need the general functor, and the repair is one clause: the presheaf $R\\mapsto H(R)/U(R)$ is a *subpresheaf of the sheaf $H_1$*, and the sheaf-closure of a subpresheaf of a sheaf always exists — take the subfunctor of sections that lie in the presheaf fpqc-locally. Defining $H/U$ that way makes the monomorphism claim a tautology and removes the foundational hostage. Everything else in Step 15 is correct: mono and epi are given separately, $\\pi$ is faithfully flat (Step 14) and affine hence an fpqc cover, and mono + epi is an isomorphism.\n\n</details>\n\n**Flaw 4** [MINOR] — Two things. First, the parenthetical is the one unnamed theorem in the write-up — it is Takeuchi's representability/faithful-flatness theorem for quotients of an affine group scheme (not of finite type: $U$ is pro-unipotent) over a field — and the draft was asked to name what it uses.\n\n<details><summary>(Step 17: \"be faithfully flat with $Q$ affine of finite type — over a field every fpqc quotient of $U$ by a closed normal subgroup scheme is of this shape\") · the finding</summary>\n\nSecond, it is not needed. The argument that follows consumes only *injectivity of $\\phi^*$*, and injectivity holds under every reading of \"finite-type quotient group\": if $\\phi\\colon U\\to Q$ is an fpqc epimorphism then its scheme-theoretic image, a closed subgroup scheme by $(\\star)$, is both mono and epi into $Q$, hence all of $Q$. Repair: hypothesize \"$\\phi\\colon U\\to Q$ a homomorphism with $Q$ affine of finite type and $\\phi^*$ injective\", add the one-line remark just given, and delete the parenthetical. This strictly strengthens the step and shortens it.\n\n</details>\n\n**Flaw 5** [MINOR] — The conclusion \"$V^j$ is unipotent\" needs $V^j$ to be an *extension* of $W^j:=\\operatorname{im}(V^j\\to\\ker q_j)$ by $V^{j+1}$, i.e. it needs $V^j\\to W^j$ faithfully flat, which is the factorization theorem of Step 6 applied again ($V^j$ is closed in $H_m$, hence affine of finite type, so the theorem applies).\n\n<details><summary>(Step 16: \"has kernel $V^{j+1}$ and closed image (Chevalley). Closed subgroups and extensions of unipotent groups are unipotent.\") · the finding</summary>\n\nThe draft asserts only that the image is closed. It also leaves the descending induction on $j$ — base $V^m=1$, step $V^{j+1}$ and $W^j$ unipotent $\\Rightarrow V^j$ unipotent — entirely to the reader. Both ingredients are in the draft; both should be said. Repair: one clause citing Step 6 for the flatness, one clause naming the induction as descending on $j$.\n\n</details>\n\n**Flaw 6** [MINOR] — Chevalley's theorem is about constructibility of images; the closedness of the image of a group-scheme homomorphism is a corollary of it in the classical setting, but the draft has already proved the scheme-theoretic form outright as $(\\star)$ in Step 3, \"no finiteness assumed\".\n\n<details><summary>(Steps 6, 16, 17: \"closed by Chevalley\", \"closed image (Chevalley)\") · the finding</summary>\n\nCiting \"Chevalley\" three times for something the draft owns is both redundant and a mis-attribution. Separately, the theorem Step 6 actually turns on — \"a homomorphism of affine algebraic $k$-groups is faithfully flat onto its image\" — is the homomorphism/factorization theorem and deserves to be named as such, since it is invoked again in Steps 16 and 17. Repair: replace \"(Chevalley)\" by \"($\\star$)\" throughout and name the factorization theorem once in Step 6.\n\n</details>\n\n**Flaw 7** [MINOR]\n\n<details><summary>(Step 1: \"An affine algebraic group over a characteristic-$0$ field is reduced (Cartier), hence smooth.\") · the finding</summary>\n\nFinite-typeness of $G$ is load-bearing in three places — it is a hypothesis of [loops, jets and positive loops](../../../../../../appendix/ex-loops-placid.html) (\"$X$ smooth affine of finite type\"), it is what makes \"the $A_m$ finitely generated\" in this same step, and it is what makes $\\mathfrak{m}_e/\\mathfrak{m}_e^2$ finite-dimensional in Step 7 — yet the draft never says that \"algebraic\" is being read as \"of finite type\". This matters more here than it usually would, because clause (A) deliberately *weakens* the standing $G$ of [the standing notation](../../../../../../appendix/subsec-notations.html) from connected reductive to an arbitrary affine algebraic group, so the reader cannot fall back on the entry for it. Repair: \"affine algebraic (= affine, of finite type)\" in Step 1, plus a half-sentence noting that reduced $\\Rightarrow$ smooth uses perfectness of $k$.\n\n</details>\n\n**Flaw 8** [MINOR]\n\n<details><summary>(Step 7: the display \"$\\mathbb{V}(W)(R):=W\\otimes_kR$\" and \"$\\gamma=\\varepsilon_R+t^mD$\") · the finding</summary>\n\nThree objects are used as if definitional and are not: $\\mathbb{V}(W)$ is never said to be representable (by $\\operatorname{Spec}\\operatorname{Sym}_k(W^\\vee)$ for finite-dimensional $W$), although Steps 8 and 9 treat it as a scheme and take closed subschemes of it; $\\mathfrak{g}=\\operatorname{Lie}(G)$ is never identified with $(\\mathfrak{m}_e/\\mathfrak{m}_e^2)^\\vee$, although the chain $\\operatorname{Hom}_k(\\mathfrak{m}_e/\\mathfrak{m}_e^2,R)=\\mathfrak{g}\\otimes_kR$ depends on it; and $\\varepsilon_R$ appears in the notation line only as \"$\\varepsilon$ the counit of $\\mathcal{O}(G)$\", not as its base change along $k\\to R[t]/t^{m+1}$. Each is one clause.\n\n</details>\n\n**Flaw 9** [MINOR] — The statement uses the definite article; the draft constructs one identification and never argues it is the canonical one, nor that the conclusion is independent of the choice.\n\n<details><summary>(clause (C): \"under the canonical identification $\\ker(L^{m+1}G\\to L^mG)\\cong\\mathbb{V}(\\mathfrak{g})$\"; Step 7 supplies *an* identification) · the finding</summary>\n\nThis is cheap to close and worth closing, because it is a genuine strengthening: in characteristic $0$ $\\operatorname{End}_{\\mathrm{gp}}(\\mathbb{G}_a)=k$, so every group-scheme automorphism of $\\mathbb{V}(\\mathfrak{g})$ is $k$-linear, hence carries linear subspaces to linear subspaces and (C) holds under *any* identification of the transition kernel with $\\mathbb{V}(\\mathfrak{g})$. One sentence in Step 9.\n\n</details>\n\n**Flaw 10** [MINOR] — The inference is elided. What $\\alpha_p$ exhibits is that *Step 8* fails in characteristic $p$; that *(C)* fails needs a closed subgroup scheme $H\\subseteq L^+G$ realising $\\alpha_p$ as a transition kernel, and the draft supplies none.\n\n<details><summary>(Caveats: \"the closed subgroup scheme $\\alpha_p\\subseteq\\mathbb{V}(k)$ is neither reduced nor a linear subspace, so (C) fails\") · the finding</summary>\n\nThe claim happens to be true and the witness is short, so I give it rather than merely complaining: over $k=\\bar k$ of characteristic $p$ take $G=\\mathbb{G}_a$, so $\\mathcal{O}(K)=k[a_0,a_1,a_2,\\dots]$ with $\\Delta(a_i)=a_i\\otimes1+1\\otimes a_i$, and set\n\n$$\n\\mathfrak{a}=\\left(a_0,\\ a_1^{\\,p},\\ a_2,\\ a_3,\\dots\\right).\n$$\n\nThis is a Hopf ideal — $\\Delta(a_1^p)=(a_1\\otimes1+1\\otimes a_1)^p=a_1^p\\otimes1+1\\otimes a_1^p$ in characteristic $p$ — so $H=\\operatorname{Spec}k[a_1]/(a_1^p)\\cong\\alpha_p$ is a closed subgroup scheme of $L^+\\mathbb{G}_a$ with $H_1=e$ and $H_2=\\alpha_p$, whence $\\ker(H_2\\to H_1)=\\alpha_p$, which is $\\mathbb{V}(\\mathfrak{n}_1)$ for neither $\\mathfrak{n}_1=0$ nor $\\mathfrak{n}_1=k$. Repair: either put this witness in, or downgrade the caveat to \"so the argument of Step 8 fails\". This also strengthens the record for the sibling [Q1-L4-L2-e1](../../Q1-L4-L2-e1/index.html), which carries the characteristic-$0$ load-bearingness for (B).\n\n</details>\n\n**Flaw 11** [MINOR] — A blanket default is not quite what the convention in [context](../../../../../../context.html) §Notation asks for — the subscript is meant to name the ambient *at the assertion*, and the two exemptions granted there are specific (the ambient is one of the two sides; the two sides share no ambient), not a licence to declare a default once.\n\n<details><summary>(notation line: \"unsubscripted identifications of schemes are in affine $k$-schemes\") · the finding</summary>\n\nThat said, every identification where the ambient is actually load-bearing *is* subscripted here, and the blanket covers only the routine ring- and scheme-level equalities, so nothing is hidden by it. Two small residues: Step 9's \"$\\mathbb{V}(\\mathfrak{n}_m)\\cong\\mathbb{G}_a^{\\dim\\mathfrak{n}_m}$\" is an equivalence with no common ambient (exemption 2 applies, so it is fine, but the blanket as worded claims it for affine $k$-schemes), and Step 7's \"$\\cong$ as group schemes over $k$\" names its ambient in prose rather than as a subscript, which is better than the blanket and should be the model.\n\n</details>\n\n## Where the cleanest split lies\n\nBoth of the prover's candidates are real, and my arithmetic says **neither alone gets the page under budget** — Steps 7–9 are about 235 words and Steps 16–17 about 172, against an overflow of 301 on top of a 205-word statement that cannot be touched. So the honest answer is: take both. If only one is taken, my ranking differs from the way the prover framed the second candidate.\n\n**First choice: clause (C), Steps 7–9, as a node.** It is the largest single block, it is the only place characteristic $0$ is load-bearing, and — decisively — clause (C) is *already a standalone statement given (A)*, so the sub-lemma needs no new interface: its statement is (A) + (C) verbatim. The parent then cites it three times (Step 10's smooth kernel, Step 16's $\\ker q_j$, and (C) itself) and never mentions $\\mathbb{V}$, $\\varepsilon$-derivations or $\\mathfrak{m}_e$ again. The cost is that the child must re-derive Steps 3–5 to know $H_m$ is a closed subgroup scheme with $q_m$ restricting the jet transition; that is perhaps 60 words of duplication, and it is the price of a clean statement. This split also pairs the new node naturally with the existing sibling [Q1-L4-L2-e1](../../Q1-L4-L2-e1/index.html).\n\n**Second choice, and state it differently from the way it was proposed: not \"the pro-unipotence half of (D)\" but an *abstract* pro-unipotence lemma.** Phrased as \"the pro-unipotence half of (D)\" it drags $H$, $U$, $H_1$ and the whole jet setting across the boundary and duplicates Step 13. Phrased abstractly it drags nothing:\n\n> Let $U=\\varprojlim_m U_m$ be affine group schemes over a field with each $U_m$ of finite type and unipotent and $\\mathcal{O}(U)=\\operatorname{colim}_m\\mathcal{O}(U_m)$. Then every affine finite-type group scheme $Q$ admitting a homomorphism $U\\to Q$ with injective $\\phi^*$ is unipotent.\n\nThat is Step 17 exactly, it needs neither characteristic $0$ nor loops nor jets, it uses only the standard Hopf-image fact, and it is reusable elsewhere in the tree. Step 16 (that each $U_m$ is unipotent) stays in the parent, where it belongs, since it is the one part that genuinely reads the jet filtration.\n\n**A third move, free, and orthogonal to the budget.** Step 5's header asserts three things and Step 17 asserts four; [ADR 0043](../../../../../../process/decisions/0043-a-proof-step-is-one-claim.html) wants one claim per step. Splitting those two would not save words but would make the remaining page legible, and Step 17 at 122 words is precisely the block that Flaw 4's repair shortens and the second split removes.\n\nVERDICT: PASS\n";</script>
