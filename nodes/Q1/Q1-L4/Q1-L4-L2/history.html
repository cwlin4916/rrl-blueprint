that placidity of the stabilizer is provable here, not only citable.\n- **2026-08-05 — proved** by `/prove` in one round ([r1](critiques/r1.html), PASS). The referee confirmed the four load-bearing steps — the Hopf-image lemma, the ideal-theoretic limit presentation, the square-zero kernel computation, and the Mittag-Leffler surjectivity behind the fpqc quotient $K_\\lambda/U_\\lambda \\simeq K_{\\lambda,1}$ — and recorded four MINORs, none obstructing; the statement-side nit (undefined $\\mathrm{ev}_0$) is left to `/update`.\n- **2026-08-05 — objection answered, statement corrected** by `/update` ([u1](updates/u1.html)): a user review passage held that a stabilizer in a placid group scheme need not be placid, because the transition maps of the image presentation $S_i = \\operatorname{im}(S\\to G_i)$ are not guaranteed affine. Verified in general — [placidity](../../../../appendix/placid-ind-scheme.html) asks the levels only to be of finite type, and in characteristic $p$ a surjective homomorphism of smooth groups can fail to be smooth — and refuted against this node: the levels here are the affine jet groups $L^mG$, so every transition is a morphism of affine schemes and affineness is free, while smoothness is bought with characteristic $0$ (Cartier), and Raskin Ex. 4.2.2 reaches the same conclusion in one line for any affine group scheme over such a field. The only edit is notational — the undefined $\\mathrm{ev}_0$ removed from the Statement and from its frozen copy in the draft, discharging [r1](critiques/r1.html) Flaw 4 — so the node stays `proved`.\n- **2026-08-05 — two words sharpened, a theorem gained, a hypothesis shown load-bearing** by `/update Q1-L4-L2 with input` ([u2](updates/u2.html)), on an external referee report whose verdict was that the lemma is true under exactly its stated hypotheses.\n\n  Two readings under which the statement would have been false are now closed. Clause (a) said the transitions are *surjective*, which on $R$-points they are not — $\\mathbb{G}_m\\xrightarrow{g\\mapsto g^n}\\mathbb{G}_m$ misses $s\\in k[s,s^{-1}]^\\times$ and catches it only after a faithfully flat cover — and now says *faithfully flat*, which is what Step 4 concludes. Clause (c) wrote $K_\\lambda/U_\\lambda$ with no topology attached; it is the fpqc-sheaf quotient, which is what Step 6 constructs. Neither is material, so the node stays `proved` and [r1](critiques/r1.html) stands.\n\n  What the report proves beyond the node is general: Steps 2–7 name $K_\\lambda$ only through the ideal that cuts it out, so they hold verbatim for **any** closed subgroup scheme of $L^+G$ in characteristic $0$, with the transition kernels not merely unipotent but vector groups. That is a theorem gained rather than a statement widened, so it is commissioned as a general node this one specializes, and the strengthened clause (b) goes there. The report's charge that closedness is assumed here is refuted — Step 1 proves it — but it names a real duplication, since [Q1-L4-L1](../Q1-L4-L1/index.html)(a) proves the same fact; the routing is commissioned with the general node.\n\n  Characteristic $0$ is load-bearing and now has a witness: over a field of characteristic $p$ the closed subgroup $x\\mapsto u(x^p+xt)$ of $L^+\\mathrm{SL}_2$ has Frobenius for its level-two transition, so (a)'s smoothness fails. Recomputed here and commissioned as an example node.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
