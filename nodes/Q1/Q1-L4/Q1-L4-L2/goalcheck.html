<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L2</a><i>›</i><span>goal check</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L2 — goal check</h1><p class="lead">What the key examples say when this statement is specialized to them. A ceiling on the node's confidence, never a citable input.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L2 — goal check against the key examples\n\n[Q1-L4-L2](index.html) · [key examples](../../../../key_examples/index.html) · [DAG index](../../../../dag.html) · [ADR 0040](../../../../process/decisions/0040-the-key-example-register.html)\n\n**Date:** 2026-08-05 · **Register read:** 12 entries · **Entries that could see the statement:** 8\n\nThe node is a statement about stabilizers and jet groups, not about categories, so what a\nregister entry supplies here is its pair $(G,X)$ and its presentation of $LX$ — never its\ntheorem, which is always about the two sides of the unramified equivalence. Where a row\nbelow computes $K_\\lambda$, $K_{\\lambda,m}$, $U_\\lambda$ or $G_\\lambda$, the computation is\nelementary and is *mine*, run on the entry's own variety; the entry's source neither\nperforms nor ratifies it. That distinction is carried in every row and is the reason §3\nexists.\n\n## 1. What the statement says on each entry\n\n### K1 — Iwasawa–Tate, $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ *(`positive`)* — **holds vacuously**\n\nHere $K=L^+\\mathbb{G}_m=k[[t]]^\\times$ and, by [Q1-L4-e1](../Q1-L4-e1/index.html) — the node the entry itself names — $\\Lambda_X^+=\\mathbb{Z}\\sqcup\\{\\ast\\}$ with $LX_n=K\\cdot t^n$ and $LX_\\ast=\\{0\\}$. Both kinds of $\\lambda$ are trivializing extremes. At $\\lambda=n$ the orbit map $u\\mapsto ut^n$ is an isomorphism, so $x_n=t^n$ has $K_n=1$, every $K_{n,m}=1$, and (a1)–(c3) are assertions about the trivial group: true, with the quantifier empty. At $\\lambda=\\ast$ the whole group fixes $0$, so $x_\\ast=0$ gives $K_\\ast=K$ and $K_{\\ast,m}=L^m\\mathbb{G}_m=(k[t]/t^m)^\\times$, the transitions are the projections with kernel $\\{1+at^m\\}\\cong\\mathbb{G}_a$, and $U_\\ast=1+tk[[t]]$, $G_\\ast=\\mathbb{G}_m$ — again true, but this is the statement handing back [loops, jets and positive loops](../../../../appendix/ex-loops-placid.html), the appendix entry it takes as input. At no stratum of the register's most computable positive is the scheme-theoretic image of a *proper, nontrivial* subgroup of $K$ ever formed.\n\n### K2 — the trivial period, $X=\\mathrm{pt}$ *(`positive`)* — **holds vacuously**\n\nOne stratum, one point, and $K_\\lambda=\\operatorname{Stab}_K(x_\\lambda)=K=L^+G$. The jet images are then the full jet groups, $K_{\\lambda,m}=L^mG$, because $\\mathrm{ev}_m$ is surjective for $G$ smooth; (a1)–(a4) become verbatim [loops, jets and positive loops](../../../../appendix/ex-loops-placid.html), (b) becomes $\\ker(L^{m+1}G\\to L^mG)\\cong\\mathbb{V}(\\mathfrak{g})$, and (c) becomes the classical congruence filtration $1\\to K^{(1)}\\to L^+G\\to G\\to1$ with $U_\\lambda=K^{(1)}$ and $G_\\lambda=G$. Every clause is true and none is tested: with $K_\\lambda=K$ the scheme-theoretic-image construction that is the node's whole content does nothing.\n\n### K3 — Gross–Prasad, $X=\\mathrm{SO}_N$ under $\\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$ *(`positive`)* — **holds**\n\nThe entry supplies the presentation $K\\backslash LX\\simeq\\mathrm{SO}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$, from which $\\operatorname{Stab}_K(x)\\cong L^+\\mathrm{SO}_{N-1}\\cap x^{-1}L^+\\mathrm{SO}_Nx$ for $x\\in LX(k)=\\mathrm{SO}_N(F)$. Take the smallest member $N=3$, so $\\mathrm{SO}_3\\cong\\mathrm{PGL}_2$ with $\\mathrm{SO}_2\\cong T$ a maximal torus, and take the $k$-point\n\n$$\nx_\\lambda=\\begin{pmatrix}1&0\\\\ t^{-1}&1\\end{pmatrix}\\in\\mathrm{PGL}_2(F)=LX(k).\n$$\n\nFor $u=\\mathrm{diag}(a,1)\\in T(\\mathcal{O})$ one computes $x_\\lambda u x_\\lambda^{-1}=\\left(\\begin{smallmatrix}a&0\\\\ t^{-1}(a-1)&1\\end{smallmatrix}\\right)$, which lies in $\\mathrm{PGL}_2(\\mathcal{O})$ exactly when $a\\equiv1\\bmod t$; so $K_\\lambda\\cong1+t\\mathcal{O}$, and writing $a=1+c_1t+c_2t^2+\\cdots$ the image $K_{\\lambda,m}$ is the unipotent group of dimension $m$ cut out by $(c_1,\\ldots,c_m)$, with projections for transitions and one-dimensional unipotent kernels. Then $G_\\lambda=K_{\\lambda,1}\\cong\\mathbb{G}_a$, the negative root subgroup of $\\mathrm{PGL}_2$ paired with $1\\in\\mathrm{SO}_2$ — proper, nontrivial and *unipotent* — and $U_\\lambda=1+t^2\\mathcal{O}$. All nine clauses hold, non-vacuously; what the entry does not underwrite is the range of $N$ in Braverman–Finkelberg–Travkin's theorem, which this row does not use.\n\n### K4 — Rankin–Selberg, $X=\\mathrm{GL}_N$ under $\\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$ *(`positive`)* — **holds**\n\nSame shape, and the sharpest bench substitution available. With $N=3$, $\\mathrm{GL}_2$ the lower-right block, and $x_\\lambda=t^\\mu=\\mathrm{diag}(t,t,1)\\in\\mathrm{GL}_3(F)=LX(k)$, the stabilizer is $K_\\lambda=\\{(t^\\mu\\tilde h\\,t^{-\\mu},\\,h)\\}$, where $\\tilde h=\\mathrm{diag}(1,h)$ and $h$ runs over the Iwahori $I=\\{h\\in\\mathrm{GL}_2(\\mathcal{O}):h_{21}\\in t\\mathcal{O}\\}$, since $\\mathrm{Ad}(t^\\mu)$ multiplies the lower-left entry by $t^{-1}$ and leaves the rest integral. Its level-one image is not $I\\bmod t$ but the graph group $G_\\lambda=K_{\\lambda,1}=\\{(\\mathrm{diag}(1,b^-),\\,b^+)\\}\\cong T_2\\ltimes\\mathbb{G}_a^2$, where $b^+$ is $h\\bmod t$ (upper triangular) and $b^-$ is lower triangular with the same diagonal and lower-left entry $\\overline{h_{21}/t}$ — four-dimensional, closed in $\\mathrm{GL}_3\\times\\mathrm{GL}_2$, non-reductive. Each $K_{\\lambda,m}$ is the image of a map factoring through $h\\bmod t^{m+1}$, hence affine of finite type with smooth surjective transitions and unipotent kernels, and $U_\\lambda=\\{h\\in I: h\\equiv1\\bmod t,\\ h_{21}\\in t^2\\mathcal{O}\\}$ is pro-unipotent. This row is the one that makes (c3) say something that could have been otherwise: the witness sits in $G$ through a conjugation, and is neither a subgroup of one factor nor reductive.\n\n### K5 — mirabolic, $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ *(`positive`)* — **holds**\n\nThe entry gives the action $(g_1,g_2)\\cdot(g,v)=(g_1^{-1}gg_2,\\,vg_2)$ and the loop quotient $\\mathrm{Gr}\\times\\mathcal{V}$ with $\\mathcal{V}=\\mathbf{V}\\otimes F$, so $LX(k)=\\mathrm{GL}_n(F)\\times F^n$. Take $n=2$ and $x_\\lambda=(1,(1,0))$: then $K_\\lambda=\\{(g,g):g\\in\\mathrm{GL}_2(\\mathcal{O}),\\ (1,0)g=(1,0)\\}$, the diagonal copy of $L^+(\\mathbb{G}_a\\rtimes\\mathbb{G}_m)=\\left\\{\\left(\\begin{smallmatrix}1&0\\\\ c&d\\end{smallmatrix}\\right):c\\in\\mathcal{O},\\ d\\in\\mathcal{O}^\\times\\right\\}$. The jet images are the diagonal $L^m(\\mathbb{G}_a\\rtimes\\mathbb{G}_m)$, affine of dimension $2m$, with projections for transitions and kernels $\\cong\\mathbb{G}_a^2$; $U_\\lambda$ is the part congruent to $1$ mod $t$ and $G_\\lambda\\cong\\mathbb{G}_a\\rtimes\\mathbb{G}_m$, closed in $\\mathrm{GL}_2\\times\\mathrm{GL}_2$ and non-reductive. Non-vacuous, but of the mild kind: $K_\\lambda$ is still $L^+H$ for a smooth finite-type $H$, so the images are jet groups and nothing has to be cut out.\n\n### K6 — symplectic (Jacquet–Rallis), $X=\\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$ *(`positive`)* — **holds**\n\nAt the base point $x_\\lambda=e\\cdot\\mathrm{Sp}_{2n}(F)$ one has $K_\\lambda=\\mathrm{GL}_{2n}(\\mathcal{O})\\cap\\mathrm{Sp}_{2n}(F)=L^+\\mathrm{Sp}_{2n}$, hence $K_{\\lambda,m}=L^m\\mathrm{Sp}_{2n}$ with kernels $\\mathbb{V}(\\mathfrak{sp}_{2n})$, $U_\\lambda$ the first congruence subgroup and $G_\\lambda=\\mathrm{Sp}_{2n}$, closed in $\\mathrm{GL}_{2n}$ and reductive. What makes the row worth having is Remark 1.4, quoted in the entry: the orbits here are **neither finite-dimensional nor finite-codimensional**, and this stratum is one of them — $K/K_\\lambda=L^+X$ is infinite-dimensional and of infinite codimension in $LX$. The clauses survive that intact, because finite-typeness is asserted level by level and never of $K_\\lambda$: $\\dim K_{\\lambda,m}=m\\dim\\mathrm{Sp}_{2n}$ grows with unbounded codimension inside $L^m\\mathrm{GL}_{2n}$, and (a1)–(a4) are indifferent to it. This is the entry that shows the node's presentation is compatible with the geometry the register calls its most instructive positive.\n\n### K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$ *(`adjacent`)* — **silent**\n\nThe entry names $\\check X$ and $\\check G$ on the spectral side only, never an $X$ and a $G$ on the automorphic side, and the register forbids using it before the source is read on the page; with no variety there is nothing to substitute into (H).\n\n### K8 — rank-1 affine homogeneous spherical varieties *(`weak`)* — **silent**\n\nThe entry settles which category sits on the automorphic side for a whole family $G/H$ of rank $1$; it computes no orbit, no stabilizer and no jet image, so it cannot see any of (a1)–(c3). It does confirm that (H) is inhabited by a large family, which is why §4 asks for a member of it to be worked out.\n\n### K9 — the group case, $X=H$ under $H\\times H$ *(`degenerate`)* — **holds**, and cannot on its own earn `consistent`\n\nThis is the only bench entry whose stabilizers the tree has already computed: by [Q1-L4-e3](../Q1-L4-e3/index.html), $K_\\mu=L^+H\\cap t^\\mu L^+Ht^{-\\mu}$ and $G_\\mu=P_\\mu$. For $H=\\mathrm{SL}_2$ and $\\mu=\\check\\alpha$, $K_\\mu=\\{g\\in\\mathrm{SL}_2(\\mathcal{O}):c\\equiv0\\bmod t^2\\}$; the images are $K_{\\mu,1}=B$ and $K_{\\mu,m}=\\{g\\bmod t^m:c\\equiv0\\bmod t^2\\}$ of dimension $3m-2$ for $m\\ge2$; the transitions are projections, surjective and smooth, with kernel $\\mathbb{G}_a^2$ at $m=1$ and $\\mathbb{V}(\\mathfrak{sl}_2)$ above it; $U_\\mu=K_\\mu\\cap\\ker(\\mathrm{ev}_1)$ is pro-unipotent and $G_\\mu=B$ is proper and non-reductive. Every clause holds non-vacuously — and the register's rule stands: [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) is the monoidal unit here, so this entry alone cannot lift the verdict.\n\n### K10 — the Whittaker period, $M=T^*(G/\\!\\!/_{\\psi}U)$ *(`out-of-class`)* — **silent**\n\nThe polarization is twisted and $M$ is not $T^*X$ for any $X$ in the class, so there is no smooth affine spherical $X$, no $LX$, no $\\Lambda_X^+$ and no $K_\\lambda$ — the specialization of (H) is empty rather than false.\n\n### K11 — $X=\\mathrm{PSL}_2/\\mathrm{PO}_2$ *(`out-of-class`)* — **holds**\n\nThe entry is out of class because the generic stabilizer is disconnected, and the node's hypotheses never ask for connectedness: $X$ is smooth, affine and spherical, so (H) applies verbatim. At the base point $K_\\lambda=L^+\\mathrm{PO}_2$, $K_{\\lambda,m}=L^m\\mathrm{PO}_2$, $U_\\lambda=\\ker(L^+\\mathrm{PO}_2\\to\\mathrm{PO}_2)$ and $G_\\lambda=\\mathrm{PO}_2$ — disconnected, and (c3) asks only for affine of finite type. Sharper, take the $k$-point of $LX=L(\\mathrm{PGL}_2/N(T))$ given by the maximal torus $T'$ of $\\mathrm{PGL}_{2,F}$ split by the ramified extension $F(\\sqrt{t})$, that is the image of $\\left\\{\\left(\\begin{smallmatrix}a&tb\\\\ b&a\\end{smallmatrix}\\right)\\right\\}$: then $K_\\lambda=N(T')(F)\\cap\\mathrm{PGL}_2(\\mathcal{O})$ consists of the classes with $a\\in\\mathcal{O}^\\times$, $b\\in\\mathcal{O}$ together with their translates by $\\mathrm{diag}(1,-1)$, and $G_\\lambda=K_{\\lambda,1}\\cong\\mathbb{G}_a\\rtimes\\mathbb{Z}/2$ — disconnected *and* non-reductive, closed in $\\mathrm{PGL}_2$. The register's standing warning about this entry is discharged rather than triggered: nothing in the nine clauses quietly assumes the connected-stabilizer clause of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html), and the witness produced here is exactly the disconnected one.\n\n### K12 — $X=(\\mathrm{SL}_2^{\\times3})\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ *(`negative`)* — **silent**\n\nMembership of the standing class is unsettled — the entry commissions it as [Q1-e8](../../Q1-e8/index.html) — so (H) cannot be checked, and the source's content is a function-theoretic statement about Satake parameters and $W_X$-orbits that computes no stabilizer. It is also the only entry whose field is not the standing $k((t))$ with $k$ of characteristic $0$, which §3 returns to.\n\n## 2. What no entry reached\n\nFour entries were silent on all nine clauses — **K7** (no automorphic variety named, source unread), **K8** (computes categories, not stabilizers), **K10** (no $X$ at all) and **K12** (class membership unsettled, and no stabilizer computed). No clause was missed by *every* entry, but three pieces of load-bearing content were reached by none of the twelve.\n\n- **(a2), the characteristic-$0$ content.** In every substitution above, $K_\\lambda$ is the group of $\\mathcal{O}$-points of a smooth affine $\\mathcal{O}$-model — $L^+H$, an Iwahori, a congruence or parahoric-type subgroup, or a twisted form of one — so smoothness and faithful flatness of the transitions are visible before Cartier's theorem is invoked. Nothing on the bench separates (a2) from a statement that is false in characteristic $p$; the referee's subgroup $x\\mapsto u(x^p+xt)$ of $L^+\\mathrm{SL}_2$, whose level-two transition is Frobenius, has no bench analogue, because every entry lives in characteristic $0$.\n- **(c1) in the form the node states it.** What the bench exercises is the classical fact that congruence subgroups are pro-unipotent. The clause claims more — that *every* finite-type quotient group of $U_\\lambda$ is unipotent, in the affine sense the write-up's caveat records — and no entry produces a single finite-type quotient of a $U_\\lambda$ to test it on.\n- **The universal quantifier over $\\Lambda_X^+$ in (H).** Only K1, K2 and K9 have their orbit sets classified, and those are precisely the two vacuous entries and the degenerate one. At K3, K4, K5 and K6 the index poset is not known here, so each of those rows checks the clauses at one hand-picked $x_\\lambda$ and not \"for every $\\lambda\\in\\Lambda_X^+$\".\n\n## 3. Where the pressure is\n\nThe finding is not that a clause bends but that the bench cannot reach the hypothesis the clauses rest on. Every register entry sits over $k$ of characteristic $0$, and in that setting a stabilizer $K_\\lambda=L^+G\\cap\\operatorname{Stab}_{LG}(x_\\lambda)$ is automatically the $\\mathcal{O}$-points of a *smooth* model — flat over $\\mathcal{O}$ with both fibres smooth by Cartier — which is why (a1)–(b) come out true in every substitution above without the write-up's Step 4 ever being stressed. The one entry on the other side of that line is K12, whose source is function-theoretic over $\\mathbb{F}_q((t))$ and whose transfer to characteristic zero the register itself records as not in print; it is silent here, so the bench neither confirms nor threatens (a2), and the correct reading of a `consistent` verdict on this node is *the bench has no purchase on its one fragile clause*.\n\nTwo smaller findings deserve recording. First, the register's flagship computable positive K1 is blind: both of its strata are trivializing extremes, $K_\\lambda=1$ and $K_\\lambda=K$, so the example everyone reaches for when they want Q1 made concrete cannot see this node at all — the non-vacuous work is done by K3, K4, K5, K6 and, degenerately, K9. Second, K11 produces a witness $G_\\lambda\\cong\\mathbb{G}_a\\rtimes\\mathbb{Z}/2$ that is disconnected and non-reductive; that is harmless for this node, whose (c3) asks only for affine of finite type, but it is live one level up, since [Q1-L4](../index.html) clause (iii) speaks of \"the quotient of $G_\\lambda$ by its unipotent radical\" and a disconnected $G_\\lambda$ needs that phrase fixed. That belongs to `/update` and to [Q1-L4-L3](../Q1-L4-L3/index.html), not to a correction here.\n\n## 4. What would test this further\n\n- **K6 with its orbits classified.** $(G,X)=(\\mathrm{GL}_{2n},\\ \\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n})$ at a stratum other than the base point: classify $\\Lambda_X^+$, and for one non-base $\\lambda$ compute $K_\\lambda=\\mathrm{GL}_{2n}(\\mathcal{O})\\cap x_\\lambda\\,\\mathrm{Sp}_{2n}(F)\\,x_\\lambda^{-1}$, the images $K_{\\lambda,m}$ with their codimension in $L^m\\mathrm{GL}_{2n}$ as a function of $m$, and $G_\\lambda$. This is the only bench case whose own source says the strata are neither finite-dimensional nor finite-codimensional, so it is where the universal quantifier of (H) would meet something that is not a jet group.\n- **A characteristic-$p$ entry on the bench.** The example *node* for the referee's $L^+\\mathrm{SL}_2$ counterexample is already commissioned in this node's history; what is missing is a bench case — a settled $(G,X)$ over $\\overline{\\mathbb{F}_p}((t))$, the analogue of K1 being the cheapest — together with one stabilizer there whose level-two transition is inseparable. Without such an entry the register cannot, even in principle, show that (a2)'s characteristic hypothesis is load-bearing. Only the user or `/update` may add it; this file may not.\n- **A member of K8 worked out.** One rank-1 affine homogeneous $G/H$ from Devalapurkar's family — $\\mathrm{SL}_2/T$ is the cheapest — with $\\Lambda_X^+$, a non-base $x_\\lambda$, and $(U_\\lambda,G_\\lambda)$ computed. That would turn the register's one `weak` entry from silent into a row, and it is the family where the clause list has the best chance of being exercised at every $\\lambda$ rather than at one.\n- **Promote the K11 nonsplit stratum to an example node.** The computation in §1 — $x_\\lambda$ the ramified maximal torus, $G_\\lambda\\cong\\mathbb{G}_a\\rtimes\\mathbb{Z}/2$ — is the only place on the bench where the witness is disconnected and non-reductive at once, which is exactly what [Q1-L4](../index.html) clause (iii) has to survive. A `Q1-L4-e5` carrying it would put the case inside the tree, where `/check-goal` cannot.\n\nGOALCHECK: consistent\n";</script>
