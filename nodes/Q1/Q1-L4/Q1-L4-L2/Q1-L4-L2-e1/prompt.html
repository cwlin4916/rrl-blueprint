<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L2-e1</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L2-e1 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q1-L4-L2-e1 — self-contained prompt: In characteristic $p$ a closed subgroup of $L^+\\mathrm{SL}_2$ whose jet transitions are Frobenius\n\n## Task\n\nVerify the example and explain precisely which hypotheses and conclusions it realizes. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q1: When is $\\mathcal{D}_{c}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_{c}(K\\backslash LX)$?](../../../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../../../Q1-L3/index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../../key_examples/k4.html), the symplectic period [K6](../../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../../key_examples/k9.html); and [K6](../../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This node is a concrete instance and illustrates rather than justifies the argument. It corroborates [Q1-L4-L2](../index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-05 — created** by the lead-researcher on commission from `/update` §6 ([ADR 0022](../../../../../process/decisions/0022-update-proposes-nodes-from-failures.html)). The witness came with the external referee report absorbed as [u2](../updates/u2.html) and was recomputed there, not adopted: its \"Verified\" section closes with the level-one and level-two images of $x\\mapsto u(x^p+xt)$ and the Frobenius transition between them. It illustrates and never justifies — containment without dependency ([ADR 0021](../../../../../process/decisions/0021-example-and-analogy-nodes-nest.html)), so no proof node lists it and it lists none.\n\n  **What it matches.** Clause (B) of [Q1-L4-L2-L1](../Q1-L4-L2-L1/index.html), and through the specialization $H = K_\\lambda$ clause (a) of [Q1-L4-L2](../index.html): specialize the general closed subgroup $H\\subseteq L^+G$ to $\\phi(\\mathbb{G}_a)\\subseteq L^+\\mathrm{SL}_2$ and drop the standing characteristic-$0$ convention of [the standing notation](../../../../../appendix/subsec-notations.html), and the word *smooth* in the transition maps fails at the very first level. It exhibits a closed subgroup of $L^+G$ whose jet-image presentation is not a placid presentation, which is why neither clause can be stated without that convention. The objection this answers was raised against [Q1-L4-L2](../index.html) as early as [u1](../updates/u1.html), where the general point — that in characteristic $p$ a surjective homomorphism of smooth groups can fail to be smooth — was verified without a witness; this is the witness.\n\n  **What it does not reach.** Nothing here bears on the standing setting, where the characteristic is $0$ by convention, and it says nothing about clauses (C) or (D) of [Q1-L4-L2-L1](../Q1-L4-L2-L1/index.html) — the Frobenius transition is faithfully flat, so it is smoothness alone that this case refutes.\n\n## Target statement\n\n**(A) Setting.** Let $k$ be algebraically closed of characteristic $p>0$ — the standing convention of [the standing notation](../../../../../appendix/subsec-notations.html) with its hypothesis on the characteristic dropped, and the only hypothesis dropped. Let\n\n$$\nu(z) = \\begin{pmatrix}1 & z\\\\ 0 & 1\\end{pmatrix}\n$$\n\nbe the root subgroup of $\\mathrm{SL}_2$, and let $\\phi\\colon\\mathbb{G}_a\\to L^+\\mathrm{SL}_2$ be given on points by $x\\mapsto u(x^p+xt)$.\n\n**(B) The jet presentation fails to be placid.** The map $\\phi$ is a homomorphism, because $(x+y)^p = x^p+y^p$, and a closed immersion, because the coefficient of $t$ recovers $x$; so $H := \\phi(\\mathbb{G}_a)$ is a closed subgroup scheme of $L^+\\mathrm{SL}_2$. Its level-one scheme-theoretic image $H_1\\subseteq\\mathrm{SL}_2$ is the whole root subgroup $\\mathbb{G}_a$, and its level-two image $H_2\\subseteq L^2\\mathrm{SL}_2$ ([loops, jets and positive loops](../../../../../appendix/ex-loops-placid.html)) is the graph $\\{a_0 = a_1^p\\}$ in the coordinates $u(a_0+a_1t)$, again $\\mathbb{G}_a$. Hence the transition $H_2\\to H_1$ is the Frobenius\n\n$$\nx\\longmapsto x^p,\n$$\n\nwhich is not smooth and has kernel $\\alpha_p$.\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the standing notation](../../../../../appendix/subsec-notations.html) — `subsec:notations`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n### [the three standing hypotheses](../../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../../appendix/conj-intro.html) holds for $X$.\n\n### [loops, jets and positive loops are placid — $L^nX$, $L^+X$, $LX$](../../../../../appendix/ex-loops-placid.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Example** (main.tex:694–718, unlabelled; cite by line). Let $X\\in\\mathrm{AffSch}^{f.t.}$ be smooth affine of finite type. The $n$-jets $L^nX$, defined on $k$-algebras by\n\n$$\nL^nX(R) := X\\left(R[t]/t^n\\right),\n$$\n\nare represented by affine schemes of finite type, and the presentation $L^+X\\simeq\\varprojlim_n L^nX$ exhibits the positive loop space $L^+X$ as a placid scheme ([placidity](../../../../../appendix/placid-ind-scheme.html)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **hypotheses:** $X$ smooth affine of finite type\n- **note:** applied to $X = G$ this presents $K = L^+G$ ([the standing notation](../../../../../appendix/subsec-notations.html)) as $\\varprojlim_m L^mG$ with the jet groups $L^mG$ as levels and homomorphic transitions; $L^1G = G$, so the level-one evaluation is evaluation at $t = 0$. Caveat transcribed from main.tex:710–717: if placid presentations are required to have *surjective* transitions, as in [[raskin_dmodules_infinite_var, §4.2](../../../../../../papers/raskin_dmodules_infinite_var.pdf)], the pieces $LX^i$ need not be placid in that stricter sense (see [[BZSV, Example 7.2.2](../../../../../../papers/BZSV.pdf)]).\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../../Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../../Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../../appendix/ic-0.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n```\n\n## The key examples this statement is tested against\n\nThe register at [key_examples.md](../../../../../key_examples/index.html) fixes the cases where the answer is known. A reading aid, outside the closed world: check the statement against it, never discharge a step with it.\n\n- **K1 — Iwasawa–Tate: $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$** *(`positive`)* — **The variety.** $\\mathbb{G}_m$ scaling the line, the simplest non-homogeneous member of the standing class — smooth affine, open orbit $\\mathbb{A}^1\\smallsetminus\\{0\\}$ with trivial stabilizer. The loop space is $LX(k) = k((t))$, stratified by valuation together with …\n- **K2 — The trivial period: $X = \\mathr
