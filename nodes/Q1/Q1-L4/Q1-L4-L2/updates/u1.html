<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L4</a><i>›</i><a href="../index.html">Q1-L4-L2</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L2 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L2/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html)\n\n**Date:** 2026-08-05 · **Operator:** `/update Q1-L4 with input` (a user review passage doubting that a stabilizer in a placid group scheme is placid) · **Status before → after:** `proved` → `proved`; the one statement correction is notational, and nothing the referee reviewed changed.\n\n## The input\n\n> i don't think (i) is true, because the stabilizer subgroup $S$ of a placid group scheme is not necessarily placid — e.g. the most natural placid presentation for $S = \\varprojlim_i S_i$ where $S_i = \\operatorname{im}(S\\to G\\to G_i)$ doesn't guarantee the transition maps are affine.\n\nThe passage was recomputed against this node, not adopted from it.\n\n## Verified\n\n**A stabilizer in a placid group scheme is not placid for formal reasons.** [placidity](../../../../../appendix/placid-ind-scheme.html) asks the levels only to be of finite type, not to be affine, so for a general placid group scheme nothing in the definition makes a morphism between two levels affine, and the argument used here is unavailable. The sharper obstruction is smoothness rather than affineness: the image $S_i$ of a closed subgroup need not be reduced, and a surjective homomorphism of smooth affine algebraic groups need not be smooth — in characteristic $p$ the Frobenius $\\mathbb{G}_a\\to\\mathbb{G}_a$, $x\\mapsto x^p$, is surjective, finite and not smooth.\n\n**The literature does not assert it either.** [examples.md](../../examples.html) records that Sakellaridis–Wang Prop. 2.3.7 exhibits the stabilizer through finite-type scheme-theoretic images with smooth unipotent congruence kernels — the very presentation of this node — and stops short of asserting placidity of $S$, while [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) places orbit *closures* and not stabilizers. So the passage names a real gap in the sources, which is what this node exists to close.\n\n## Refuted\n\n**The objection is addressed to the wrong clause.** Clause (i), proved as [Q1-L4-L1](../../Q1-L4-L1/index.html), asserts $K\\backslash LX_\\lambda\\simeq BK_\\lambda$ and nowhere mentions placidity; the placidity claim is clause (ii), which is this node's (a). Nothing in the passage bears on (i).\n\n**Affineness is free here, so it is not the load-bearing hypothesis.** The ambient levels are the jet groups $L^mG$, affine of finite type by [loops, jets and positive loops](../../../../../appendix/ex-loops-placid.html), and $K_{\\lambda,m}$ is a closed subscheme of $L^mG$, hence itself affine; every morphism of affine schemes is affine. The draft says exactly this and spends no hypothesis on it ([proof.md](../proof.html), Step 4, \"Affineness is automatic\"), buying instead the smoothness the passage does not mention — from Cartier's theorem, valid because $k$ has characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html)).\n\n**A second, independent route gives the same conclusion in one line.** Any affine group scheme over a field of characteristic $0$ is placid — Raskin Ex. 4.2.2, transcribed in the note on [Raskin torsor descent for $\\mathcal{D}^!$](../../../../../appendix/bb-raskin-torsor-descent.html) — and $K_\\lambda$ is affine, being closed in the affine $K = L^+G$. The jet-image presentation is still needed, because (b) and (c) are about the *unipotent structure* of that presentation and not about placidity alone.\n\n## Unverified\n\nNothing further: the passage cites no source and offers no example beyond the general shape of the presentation, so there was no third claim left to check.\n\n## The defect corrected\n\nThe Statement fixed the level-one evaluation by writing $\\mathrm{ev}_1 = \\mathrm{ev}_0$, and $\\mathrm{ev}_0$ is defined nowhere in this node, its draft or the appendix — [r1](../critiques/r1.html) Flaw 4, which the referee recorded as a statement-side blemish and left explicitly to `/update`.\n\n**Old** (verbatim): `([loops, jets and positive loops](../../../../Q1-L4/Q1-L4-L2/updates/…); $L^1G = G$, $\\mathrm{ev}_1 = \\mathrm{ev}_0$)`\n\n**New** (verbatim): `([loops, jets and positive loops](../../../../Q1-L4/Q1-L4-L2/updates/…); $L^1G = G$)`\n\nThe fact the clause was reaching for — that the level-one evaluation is evaluation at $t = 0$ — is already stated in the note of the entry the parenthesis links, so the correction removes an undefined symbol and stores the fact once. The `## Lemma` block of [proof.md](../proof.html), which invariant L1 requires to quote the Statement verbatim, was updated in the same two characters; the argument was not touched.\n\n## Why the status is not reset\n\n[ADR 0019](../../../../../process/decisions/0019-the-update-operator.html) resets a `proved` node when its statement *materially* changed. Here nothing was added, removed or weakened: an undefined symbol was deleted, every hypothesis and conclusion the referee reviewed stands word for word, and the draft proves the same lemma it proved on 2026-08-05.\n\n## Considered and not adopted\n\n- **Writing \"in characteristic $0$\" into clause (a).** It restates a standing convention that the statement already links through [the standing notation](../../../../../appendix/subsec-notations.html), against the rule that a fact is stored once, and it would put the draft at exactly $900/900$ words with no slack for a later round.\n- **Resetting the node to `open` so a fresh round could answer the passage on the record.** The passage was answered without changing what is proved, so a reset would discard a PASS to re-litigate a settled point.\n- **A new general node \"every closed subgroup scheme of $L^+G$ is placid\".** The general claim is worth having, but it is a citation and not a theorem this project must prove; the right home is an appendix entry for Raskin Ex. 4.2.2, proposed to the lead-researcher rather than created here.\n";</script>
