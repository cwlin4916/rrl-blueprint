<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L4</a><i>›</i><a href="../index.html">Q1-L4-L2</a><i>›</i><span>u2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L2 — update u2</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L2/updates/u2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html)\n\n**Date:** 2026-08-05 · **Operator:** `/update Q1-L4-L2 with input` (an external referee report on this node, verdict \"true under exactly the stated hypotheses\", strengthening clause (b) and recommending that the lemma be stated for an arbitrary closed subgroup) · **Status before → after:** `proved` → `proved`; both corrections sharpen words the draft already proves, so nothing the referee reviewed changed.\n\n## The input\n\nThe passage confirms (a), (b) and (c), proves a strictly more general theorem on the way, and makes six recommendations. Its one logical remark is that the argument starts from the hypothesis that $K_\\lambda$ is a closed subgroup scheme, which the target asserts rather than derives.\n\nEvery claim below was recomputed against this repository, not adopted from the passage.\n\n## Verified\n\n**The theorem is general: nothing after closedness is about $X$, $\\lambda$ or sphericality.** Steps 2–7 of [proof.md](../proof.html) name $K_\\lambda$ only through the ideal $I\\subseteq A = \\mathcal{O}(K)$ that cuts it out, so every word of them holds verbatim for an arbitrary closed subgroup scheme $H\\subseteq L^+G$ over a field of characteristic $0$. Only Step 1 — which *proves* closedness, using that $G$ and $X$ are affine with $X$ of finite type — touches the loop space. This is the §3 trigger of [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html) and is answered by the new general node proposed below, not by widening this statement.\n\n**Clause (b) is true in the stronger form \"vector group\".** By Step 5 the ambient kernel is $\\ker(L^{m+1}G\\to L^mG)\\cong\\mathbb{V}(\\mathfrak{g})$, and $\\ker(K_{\\lambda,m+1}\\to K_{\\lambda,m}) = K_{\\lambda,m+1}\\cap\\mathbb{V}(\\mathfrak{g})$ is a closed subgroup scheme of it. Over a field of characteristic $0$ such a subgroup is a linear subspace, in three steps: it is reduced, hence smooth, by Cartier; it is connected, because a finite subgroup would give a finite subgroup of the torsion-free group $(\\mathfrak{g},+)$; and a connected commutative unipotent group in characteristic $0$ is a vector group, embedded linearly because every homomorphism $\\mathbb{G}_a\\to\\mathbb{G}_a$ is a scalar there. The strengthening is real and it belongs to the general node, where it can be stated once.\n\n**\"Surjective\" admits a reading under which clause (a) is false.** Faithful flatness is surjectivity of $\\varprojlim$-level *fpqc* sheaf maps and not of $R$-points: for $\\mathbb{G}_m\\to\\mathbb{G}_m$, $g\\mapsto g^n$, the unit $s\\in k[s,s^{-1}]^\\times$ is not an $n$-th power in that ring and is one after the faithfully flat $k[s,s^{-1}][z]/(z^n-s)$. Step 4 proves the faithfully flat statement — \"surjective, hence faithfully flat\" — so the sharper word costs nothing and closes the false reading.\n\n**The quotient in (c) has no topology attached to it.** Step 6 constructs $K_\\lambda/U_\\lambda$ as the fpqc sheafification of $R\\mapsto K_\\lambda(R)/U_\\lambda(R)$ and proves *that* sheaf is $K_{\\lambda,1}$; the statement writes the bare quotient, which under the pointwise reading is false for the same reason.\n\n**Characteristic $0$ is load-bearing, and the passage's witness is correct.** Over $k$ of characteristic $p$, $\\phi\\colon\\mathbb{G}_a\\to L^+\\mathrm{SL}_2$, $x\\mapsto u(x^p+xt)$ with $u(z) = \\left(\\begin{smallmatrix}1&z\\\\0&1\\end{smallmatrix}\\right)$, is a homomorphism because $(x+y)^p = x^p+y^p$, and a closed immersion because $\\mathcal{O}(L^2\\mathrm{SL}_2)\\to k[x]$ already hits $x$. Its level-one image is the whole root subgroup and its level-two image is the graph $a_0 = a_1^p$, so the transition $H_2\\to H_1$ is Frobenius: not smooth, kernel $\\alpha_p$. Recomputed here; it is a counterexample to (a) with the standing characteristic hypothesis dropped, and it is proposed below as an example node.\n\n## Refuted\n\n**\"The present node should begin only after closedness is available.\"** [proof.md](../proof.html) Step 1 proves closedness outright, from the ind-affine presentation of $LX$ and quasi-compactness of $K$; the passage read the phrase \"a closed subgroup scheme of $K$\" in the Setting as a hypothesis when the write-up derives it. The recommendation still names something real — the fact is *also* proved as [Q1-L4-L1](../../Q1-L4-L1/index.html)(a), so the tree proves it twice — but that is a duplication to be routed through an edge, not a hole.\n\n**\"Raskin does not identify the finite levels, so the jet presentation is new.\"** Half right and recorded already: [u1](u1.html) says exactly this, and the abstract placidity citation was rejected there as a substitute for the presentation. The passage adds no source the repository does not have.\n\n## Unverified\n\n**That the passage's route through faithful flatness of a Hopf algebra over a Hopf subalgebra replaces the Mittag-Leffler step of Step 6.** The theorem invoked (Takeuchi) is not in [`blueprint/appendix.md`](../../../../../appendix/index.html) and has no `refs.bib` key, so it is outside the closed world and cannot be checked as cited. It is recorded as the route the next `/prove` of the general node should try, and nothing in this update rests on it.\n\n**Milne's two sets of course notes,** cited by the passage for Cartier and for unipotent groups. Neither is in `refs.bib` and neither is on disk in [`papers/`](../../../../../papers/guideline.html); the facts they are cited for are standard and were used as standard mathematics, not as citations.\n\n## The defects corrected\n\n**(1) Clause (a) says \"surjective\" where it means \"faithfully flat\".**\n\n**Old** (verbatim): `the transition maps $K_{\\lambda,m+1}\\to K_{\\lambda,m}$ are surjective smooth affine group homomorphisms`\n\n**New** (verbatim): `the transition maps $K_{\\lambda,m+1}\\to K_{\\lambda,m}$ are affine, faithfully flat, smooth group homomorphisms`\n\n**(2) Clause (c) writes a quotient without naming the topology it is taken in.**\n\n**Old** (verbatim): `and $G_\\lambda := K_\\lambda/U_\\lambda \\simeq K_{\\lambda,1}$ is a closed subgroup scheme of $G$`\n\n**New** (verbatim): `and the fpqc-sheaf quotient $G_\\lambda := K_\\lambda/U_\\lambda \\simeq K_{\\lambda,1}$ is a closed subgroup scheme of $G$`\n\nThe `## Lemma` block of [proof.md](../proof.html), which the frozen-statement test requires to quote the Statement verbatim, carries the same two edits and no others.\n\n## Why the status is not reset\n\n[ADR 0019](../../../../../process/decisions/0019-the-update-operator.html) resets a `proved` node when its statement *materially* changed. Neither correction changes what must be proved: Step 4 already concludes faithful flatness in as many words, and Step 6 already builds the fpqc sheaf quotient. What changed is that the statement now says what the draft proves, closing two readings under which it would have been false.\n\n## Considered and not adopted\n\n- **Strengthening clause (b) here to \"vector group\".** True, and it is a *strengthening* of a conclusion rather than a correction of a defect, so [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html) §3 sends it to the new general node and leaves the refereed statement standing. Stating it here would reset a PASS to gain a sentence the specialization does not use.\n- **Rewriting the Statement into labelled, spaced hypothesis blocks.** Wanted, and blocked by arithmetic: [proof.md](../proof.html) is at $894/900$ words and the frozen-statement test copies every word of the Statement into it. The presentation debt is real and is discharged by the split, not by spending the last six words — see [P19](../../../../../../blueprint/priorities.md).\n- **Replacing Step 6's Mittag-Leffler argument.** A proof-side change, which this operator does not make; recorded above as the route to try.\n";</script>
