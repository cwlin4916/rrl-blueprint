were recomputed, not skimmed:\n\n1. **Step 3 (the $\\mathbb{A}^1$ engine), recomputed.** The Koszul sequence $0\\to D_1\\xrightarrow{\\cdot\\partial}D_1\\to k[t]\\to 0$ is a short exact sequence of left $D_1$-modules ($D_1=\\bigoplus_i k[t]\\partial^i$ by PBW; right multiplication by $\\partial$ shifts the basis, cokernel $D_1/D_1\\partial\\cong k[t]$ with $\\partial$ acting as $d/dt$ on the quotient — checked: $\\partial\\cdot\\overline{f}=\\overline{f'}$). Tensoring over $k$ with $M$ is exact; the induced left $D_T\\otimes_kD_1$-structures on $M\\otimes_kD_1$ and on $M\\otimes_kk[t]=p^*M$ match the draft's descriptions. The extension-of-scalars/restriction adjunction along the flat $D_T\\to D_T\\otimes_kD_1$ is correctly handed (left adjoint = induction), and transporting precomposition with $\\mathrm{id}\\otimes(\\cdot\\partial)$ to postcomposition with the $\\partial$-action is correct: for $\\psi\\leftrightarrow\\bar\\psi$, $\\psi((-)\\cdot\\partial\\otimes m)$ corresponds to $\\partial\\cdot\\bar\\psi(m)$. The general finite-type affine base is handled *directly* (the whole computation runs over $D_T$, not by base change from a point), $\\operatorname{fib}(\\mathrm{id}\\otimes d/dt)\\simeq M'$ works for arbitrary complexes $M'$ because $-\\otimes_k-$ is exact in each variable, char $0$ enters exactly at surjectivity of $d/dt$, and the unit check ($p^*\\phi\\mapsto\\phi$ under restriction along $m\\mapsto m\\otimes 1$) makes $p^*$ an equivalence on mapping complexes by two-out-of-three. Shift bookkeeping is moot: full faithfulness is invariant under the shift relating $p^!$ and $p^*$, and that relation for smooth maps is licensed by the note in `defn:coherent_D_mod`.\n2. **Step 4 (totalization), recomputed at level $n$.** An object $x$ of $\\mathrm{Tot}_{[n]\\in\\Delta}\\,\\mathcal{D}(H^{\\times n})$ carries a coherent equivalence over *every* arrow of $\\Delta$; the arrow $[0]\\to[n]$ induces on the Čech nerve the unique map $\\pi_n\\colon H^{\\times n}\\to\\mathrm{pt}$, so $x_n\\simeq\\pi_n^!x_0$, and $\\pi_n$ factors through $q^{\\times n}$ trivially, putting every component in $\\mathcal{E}^n_0$. Stability of $\\mathcal{E}^\\bullet_0$ under all cofaces *and* codegeneracies follows from $q$ being a homomorphism ($B_\\bullet(q)$ a simplicial map) plus functoriality of $!$-pullback — checked for both. The limit-of-fully-faithfuls and cartesian-section facts are standard, and a $\\mathrm{DGCat}$-morphism that is an equivalence of underlying categories is a $\\mathrm{DGCat}$-equivalence. Essential surjectivity is genuinely proved, not waved at.\n3. **Step 1 (torsors), checked at its point of use.** The one torsor trivialized over an affine base is $q\\colon H\\to H/N$ over $H/N$ (affine by standard quotient theory); the iterated $\\mathbb{G}_a$-argument via $H^1(S,\\mathcal{O}_S)=0$ and the char-$0$ central series is correct. No equivariance of the trivialization is needed: Step 4 derives the cosimplicial compatibilities from $B_\\bullet(q)$, never from the trivializations, which enter only to identify each $q^{\\times n}$ with a projection $(H/N)^{\\times n}\\times\\mathbb{A}^{nd}\\to(H/N)^{\\times n}$ as a scheme map.\n4. **Step 5 (atlas detection), both directions.** *Only if* is a legitimate instantiation of the definition at the smooth finite-type test $b_K$. *If* handles the full quantifier: $v^!g^!\\mathcal{G}\\simeq w^!b_K^!\\mathcal{G}$ needs only commutativity of the square plus functoriality of $(-)^!$ (no base-change theorem — correctly so); $\\mathcal{D}_c(\\mathrm{pt})$-objects split as finite $\\bigoplus_ik^{d_i}[-i]$ (degree bookkeeping consistent with the cohomological-degree convention); the descent of coherence along the smooth affine surjective $v$ by t-exactness, conservativity and stabilization of the filtered union of coherent submodules is a correct hand-proof (quasi-compactness of $P$ supplies the finitely many generators). The lift-to-$BH$ problem for tests into $B(H/N)$ is genuinely circumvented: sed smooth descent but a second entry point.\n\n<details><summary>(Caveats, line 46: \"Smooth descent is the one black-boxed input: once (Step 2)\") · the finding</summary>\n\nRepair: widen the caveat to \"smooth (in particular Zariski) descent, Steps 2 and 5\".\n\n</details>\n\n**Flaw 3** [MINOR] — The phrasing presents a *replacement* of $S$ by $S^{\\mathrm{cl,red}}$, but if $S$ were genuinely derived, restricting the test along $S^{\\mathrm{cl,red}}\\hookrightarrow S$ would not preserve smoothness of $g$, and the later \"smooth over $\\mathrm{pt}$ (base change of $g$)\" would fail for the restricted test.\n\n<details><summary>(Step 5, line 40: \"base change along $S^{\\mathrm{cl,red}}\\hookrightarrow S$ leaves all below intact (flat over classical is classical, smooth over reduced is reduced), so take $S$ classical reduced\") · the finding</summary>\n\nThe argument survives because the two parentheticals actually prove $S^{\\mathrm{cl,red}}=S$: $g$ smooth $\\Rightarrow$ flat, and flatness/smoothness checked through the atlas base change $P\\to\\mathrm{pt}$ forces $P$, hence (by faithfully flat descent along $v$) $S$, classical and reduced. Silently used in that chain: $BK$ is classical and reduced (through its atlas $\\mathrm{pt}$), and $S$ is smooth over $k$ (composite $S\\to BK\\to\\mathrm{pt}$) — the latter is what makes \"quasi-coherent $\\mathcal{D}_S$-module\" literal. Repair: reorder into \"smoothness of $g$ forces $S$ smooth classical reduced (via $P$)\", dropping the replacement language; the crystal-insensitivity clause then carries only the dg-test-scheme-vs-classical-test-category bookkeeping it is actually needed for.\n\n</details>\n\n**Flaw 4** [MINOR] (Step 3, line 36: \"$\\operatorname{fib}(\\partial_*)\\simeq_{\\mathcal{D}(T)}M'$\")\nNotation overload: the display defines $\\partial_*$ as the endomap of the mapping complex (an object of $\\mathrm{Vect}$), but this clause uses the same symbol for the endomorphism $\\mathrm{id}\\otimes d/dt$ of $M'\\otimes_kk[t]$ in $\\mathcal{D}(T)$. Two different maps, one symbol, consecutive sentences. Repair: write $\\operatorname{fib}(\\partial\\ \\text{on}\\ M'\\otimes_kk[t])\\simeq_{\\mathcal{D}(T)}M'$.\n\n**Flaw 5** [MINOR] — The cited entry records the two-stage Kan-extension *construction* and states no colimit-to-limit property.\n\n<details><summary>(Step 2, line 22: \"colimit-to-limit property of [$\\mathcal{D}^!$, $\\mathcal{D}^*$]\") · the finding</summary>\n\nThe property is the standard universal property of right Kan extension along $\\mathrm{AffSch}^{op}\\hookrightarrow\\mathrm{PreStk}^{op}$ (the limit formula $\\mathcal{D}^!(\\mathcal{Y})=\\lim_{S\\to\\mathcal{Y}}\\mathcal{D}(S)$), so the mathematics is fine, but the attribution reads as if the entry asserts it. Repair: \"standard property of the right Kan extension recorded in [entry]\".\n\n</details>\n\n**Flaw 6** [MINOR] — The ambient $\\mathrm{DGCat}$ has an appendix entry (`conv-dgcat`, $\\mathrm{DGCat}:=\\mathrm{LinCat}_k$) that the draft never links.\n\n<details><summary>(notation line 6 and Steps 2, 4: \"$\\mathrm{DGCat}$\") · the finding</summary>\n\n\"Totalizations in $\\mathrm{DGCat}$ are computed in $\\mathrm{Cat}_\\infty$\" is acceptable as standard (limits in $\\mathrm{Pr}^L$-module categories are computed in $\\mathrm{Cat}_\\infty$), but the ambient category itself is a defined object of the closed world and should be a link, not a name.\n\n</details>\n\n**Flaw 7** [MINOR] (title, line 1)\n`node.md`'s H1 reads \"Unipotent invariance **at finite type**: ...\"; the draft's H1 drops \"at finite type\". The `## Lemma` block itself is verbatim, so nothing mathematical is narrowed, but the titles should match for traceability.\n\n## Verdict\n\nNo FATAL or MAJOR flaws. The mechanism the node exists to establish — de Rham contractibility of unipotent groups, run through the bar presentation — is proved on the page, with the one black box (smooth descent) honestly confessed and correctly scoped up to
