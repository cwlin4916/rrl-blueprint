d: the counterexample's stabilizers are trivial, so it stresses (iv) alone.\n\n## The counterexample, recomputed\n\nIndependently verified. It is the $n=1$ Iwasawa–Tate form (the $X$ of [Q1-e2](../../Q1-e2/index.html)) of the Godement–Jacquet witness already on record in [Q1-L5-e4](../../Q1-L5/Q1-L5-e4/index.html); the passage's single-$\\mathbb{G}_m$ version has trivial stabilizers, which isolates the failing clause.\n\nLet $X=\\mathbb{A}^1$ with $G=\\mathbb{G}_m$ acting by scaling: smooth affine and normal, the open $B=\\mathbb{G}_m$-orbit is $\\mathbb{A}^1\\setminus\\{0\\}$ with trivial — hence connected — stabilizer, so every clause of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) holds, and [the three standing hypotheses](../../../../appendix/assum-intro.html)(a) is supplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html). Then $K = L^+\\mathbb{G}_m$, the $k$-points of $LX$ are $k((t))$, and since every nonzero Laurent series is uniquely $t^n u$ with $u$ a unit of $k[[t]]$, the nonzero orbits are\n\n$$\n\\mathcal{O}_n = K\\cdot t^n = \\{f \\mid \\operatorname{val}_t(f) = n\\}, \\qquad n\\in\\mathbb{Z}.\n$$\n\nFix $N\\ge -n$ and work in the pole-bounded piece $Y_N = t^{-N}k[[t]] = \\operatorname{Spec}\\, k[a_{-N}, a_{-N+1}, \\dots]$ of the standard presentation. The orbit map $u\\mapsto u\\cdot t^n$ identifies\n\n$$\n\\mathcal{O}_n = V(a_{-N},\\dots,a_{n-1})\\cap D(a_n) \\subset Y_N,\n$$\n\nand $V(a_{-N},\\dots,a_{n-1}) = \\operatorname{Spec}\\, k[a_n, a_{n+1},\\dots]$ is integral with $D(a_n)$ a nonempty open subset, hence dense. So\n\n$$\n\\overline{\\mathcal{O}_n} = V(a_{-N},\\dots,a_{n-1}) = t^n k[[t]] \\supseteq \\mathcal{O}_m \\quad\\text{for every } m\\ge n,\n$$\n\nand the set of clause (iv) contains $\\{n, n+1, n+2, \\dots\\}$: infinite. The stabilizer of $t^n$ in $K$ is trivial, so (i)–(iii) hold trivially along these orbits — the failure is (iv)'s alone.\n\n## What was rechecked of (i)–(iii), so that they stand\n\nThe revision removes the false clause; it does not certify the survivors, which remain `/prove`'s obligation. Each was re-derived by the operator far enough to keep it in the statement:\n\n- **(i)** For the orbit $LX_\\lambda \\simeq K/K_\\lambda$, descent identifies $S$-points of $K\\backslash(K/K_\\lambda)$ with $K_\\lambda$-torsors: a $K$-equivariant map $P \\to K/K_\\lambda$ from a $K$-torsor is a reduction of structure group to $K_\\lambda$, and $Q \\mapsto Q\\times^{K_\\lambda}K$ inverts the assignment. Hence $K\\backslash LX_\\lambda \\simeq BK_\\lambda$.\n- **(ii)** Let $K^{(m)}$ be the congruence filtration (the kernel of evaluation $K \\to G(k[[t]]/t^m)$) and $K_{\\lambda,m}$ the scheme-theoretic image of $K_\\lambda$ in $K/K^{(m)}$. A closed subscheme of a cofiltered limit of affine schemes along affine transitions is the limit of its scheme-theoretic images, so $K_\\lambda \\simeq \\varprojlim_m K_{\\lambda,m}$; each transition $K_{\\lambda,m+1}\\to K_{\\lambda,m}$ is a surjective homomorphism of finite-type affine groups, faithfully flat, smooth in characteristic $0$ since source and target are (Cartier), and affine. So $K_\\lambda$ is a placid group scheme in the sense of [placidity](../../../../appendix/placid-ind-scheme.html) — which also discharges, at proof-sketch level, the sourcing gap the examples run flagged (placidity of the stabilizer is provable, not only citable). Taking $U_\\lambda := \\ker(\\mathrm{ev}_0|_{K_\\lambda})$: it is normal, pro-unipotent (each of its algebraic quotients embeds in one of the unipotent $K^{(1)}/K^{(m)}$), and $K_\\lambda/U_\\lambda$ is the scheme-theoretic image of $K_\\lambda$ in $G$ — a closed subgroup of $G$, hence affine of finite type. The existential clause (ii) thus has an explicit witness.\n- **(iii)** Retained on the standard contractibility mechanism — invariants under a pro-unipotent kernel do not change the category of $\\mathcal{D}$-modules, and coherence is tested by smooth pullback per [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) — but the operator did not re-prove it at the $\\mathcal{D}_c$-level; it stays exactly as much an open obligation as before this run.\n\n## Old statement (verbatim)\n\n> For each $\\lambda\\in\\Lambda_X^+$ fix $x_\\lambda\\in LX_\\lambda(k)$ and set $K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$. Then:\n>\n> (i) $K\\backslash LX_\\lambda \\simeq BK_\\lambda$;\n>\n> (ii) $K_\\lambda$ is a placid group scheme admitting a normal pro-unipotent subgroup $U_\\lambda\\trianglelefteq K_\\lambda$ such that $G_\\lambda := K_\\lambda/U_\\lambda$ is an affine group scheme of finite type over $k$;\n>\n> (iii) pullback induces equivalences\n>\n> $$\n> \\mathcal{D}_c(K\\backslash LX_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}}),\n> $$\n>\n> where $G_\\lambda^{\\mathrm{red}}$ is the quotient of $G_\\lambda$ by its unipotent radical;\n>\n> (iv) the set $\\{\\mu\\in\\Lambda_X^+ \\mid LX_\\mu\\subseteq\\overline{LX}_\\lambda\\}$ is finite.\n\n## New statement\n\nClauses (i)–(iii), verbatim; clause (iv) removed. A Remark on the node records the withdrawal, where the finiteness does hold ($X$ symmetric — Chen–Yi), and the commissioned node that now carries that scoped claim for the induction of [Q1-L6](../../Q1-L6/index.html).\n\n## What was considered and not adopted\n\n- **Renaming $G_\\lambda^{\\mathrm{red}}$** (the passage proposes $G_\\lambda^{\\mathrm{redq}}$, against confusion with reducedness): the node defines the symbol in words at its point of use — \"the quotient of $G_\\lambda$ by its unipotent radical\" — so the ambiguity the passage worries about does not arise in the tree, and the revision discipline forbids new notation.\n- **Restricting the whole node to symmetric $X$:** clauses (i)–(iii) hold and are consumed at the standing generality — the recollement expectations of [Q1-L5](../../Q1-L5/index.html) rest on the finite-type strata — so narrowing them to rescue (iv) would trade a false clause for a needlessly weak node.\n- **Keeping (iv) inside Q1-L4 under an added symmetric hypothesis:** the finiteness is a different claim with a different consumer ([Q1-L6](../../Q1-L6/index.html)'s induction); one node carrying two scopes is how the next drift starts. Commissioned as its own node instead.\n- **Adopting the passage's replacement clause** (orbit closures placid, embeddings finitely presented): that is the black box [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — a node restating an appendix entry adds nothing. Link, never restate.\n\n## Verification record for the input passage\n\n- **Verified, adopted:** that the node asserts exactly (i)–(iv) (checked against `node.md`, not the passage's summary); the $\\mathbb{A}^1$ counterexample, recomputed above, including the membership check against [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) done directly rather than through the passage's \"Definition 3.27\" numbering; the diagnosis that (i)–(iii) are unaffected; the orbit–stabilizer and jet-image recomputations recorded above for (i)–(ii).\n- **Verified against the repository's reading record:** the passage's Chen–Yi claims — placidity valid for general spherical $X$, finiteness proven only in the symmetric setting — agree with the twice-corrected v4 record in [papers/guideline.md](../../../../papers/guideline.html) (placidity: Thm 36 with Rem 37; orbit parametrization and closure relation: Prop 17 with Thm 18, proofs $\\theta$-twisted). The passage cites the v3 numbering (Thm 35, Rem 36), consistent with v4's shift by one; the PDF is not on disk and the v3 numbers were not re-fetched — nothing adopted rests on them.\n- **Verified as standard, no citation carried:** the three group-scheme facts the passage takes from Milne's notes — finite-type group schemes in characteristic $0$ are smooth, hence reduced; an affine group over a field is the limit of its finite-type quotients; unipotence is detected on algebraic quotients.\n- **Unverified, inert:** the attribution to Beraldo (`beraldo2017loop` is a real key; the PDF is not on disk) of pro-unipotent cohomological contractibility at the cited-page level — any future proof of (iii) must source or prove it, exactly as before this run; the passage's remark that the orbits in its $X=\\mathbb{G}_m$ example are the connected components of the loop space (true on reduced points, needed nowhere).\n- **Refuted:** nothing — every mathematical claim of the passage that was checked came out right. The passage arrives after the tree had already recorded the same failure ([examples.md](../examples.html), `EVIDENCE: counterexample`; [Q1-L5-e4](../../Q1-L5/Q1-L5-e4/index.html)), which it independently confirms with a cleaner witness.\n";</script>
