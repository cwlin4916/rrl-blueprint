 fails for $\\mathbb{G}_m\\to\\mathbb{G}_m$, $g\\mapsto g^n$; what the witness supplies, and what [Q1-L4-L4](../Q1-L4-L4/index.html) consumes, is the fpqc-sheaf quotient.\n\n**Old** (verbatim): `such that $G_\\lambda := K_\\lambda/U_\\lambda$ is an affine group scheme of finite type over $k$`\n\n**New** (verbatim): `such that the fpqc-sheaf quotient $G_\\lambda := K_\\lambda/U_\\lambda$ is an affine group scheme of finite type over $k$`\n\n## Verified\n\nThe witness proves the sheaf statement and nothing weaker: Step 6 of [Q1-L4-L2](../Q1-L4-L2/index.html)'s draft constructs $K_\\lambda/U_\\lambda$ as the fpqc sheafification of $R\\mapsto K_\\lambda(R)/U_\\lambda(R)$ and identifies *that* with $K_{\\lambda,1}$. The `## Decomposition` paragraph already routes clause (ii) through that witness, so no reassembly changes.\n\n## Refuted\n\nNothing. The walk found no clause of this node that its sub-lemmas fail to supply.\n\n## Considered and not adopted\n\n- **Resetting the node.** Its status is `open`; there is nothing to reset, and the correction is not material in any case.\n- **Writing the same qualification into clause (i).** (i) is a statement about quotient *stacks*, where the topology is already carried by [Q1-L4-L1](../Q1-L4-L1/index.html)'s \"equivalence of fpqc quotient stacks\". Repeating it would store the fact twice.\n";</script>
