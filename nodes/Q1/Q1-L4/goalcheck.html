<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4</a><i>›</i><span>goal check</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4 — goal check</h1><p class="lead">What the key examples say when this statement is specialized to them. A ceiling on the node's confidence, never a citable input.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4 — goal check against the key examples\n\n[Q1-L4](index.html) · [key examples](../../../key_examples/index.html) · [DAG index](../../../dag.html) · [ADR 0040](../../../process/decisions/0040-the-key-example-register.html)\n\n**Date:** 2026-08-06 · **Register read:** 12 entries · **Entries that could see the statement:** 8\n\nThe node is structural: it says what a single spherical stratum *is*, and nothing about\n$\\mathrm{IC}_0$, the Satake subcategory or generation. So what a register entry supplies here\nis its pair $(G,X)$ and whatever presentation of $LX$ it names — never its theorem, which is\nalways about the two sides of the unramified equivalence. Every stabilizer, jet image,\n$U_\\lambda$ and $G_\\lambda$ below is computed here, on the entry's own variety; the entry's\nsource neither performs nor ratifies the computation, and each row says so where it matters.\nClause labels are the orchestrator's: **Q** the quantifier over $\\Lambda_X^+$ with a $k$-point\nto fix, **C1** = (i), **C2**–**C4** = (ii), **C5**–**C6** = (iii).\n\n## 1. What the statement says on each entry\n\n### K1 — Iwasawa–Tate, $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ *(`positive`)* — **holds**\n\n$K=L^+\\mathbb{G}_m=k[[t]]^\\times$, $LX(k)=k((t))$, and by the entry's own pointer to\n[Q1-L4-e1](Q1-L4-e1/index.html), $\\Lambda_X^+=\\mathbb{Z}\\sqcup\\{\\ast\\}$ with\n$LX_n=\\{f:\\operatorname{val}_t f=n\\}=K\\cdot t^n$ and $LX_\\ast=\\{0\\}$. **Q holds in full** — this\nis one of only four entries where every stratum is classified and every clause can be checked at\nevery $\\lambda$. **C1 holds** and is the one place on the bench where ratified reading 3 of\n[Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) is *verified*\nrather than assumed: $u\\mapsto ut^n$ is an isomorphism $K\\xrightarrow{\\sim}LX_n$ with\n$\\overline{LX_n}=t^nk[[t]]$ computed in [updates/u1.md](updates/u1.html), so\n$K\\backslash LX_n\\simeq B\\{1\\}$, and $K\\backslash LX_\\ast\\simeq BL^+\\mathbb{G}_m$. **C2–C4 are\nvacuous at every $LX_n$** ($K_n=1$, so $U_n=G_n=1$) and non-vacuous only at the closed stratum:\n$K_\\ast=L^+\\mathbb{G}_m$ placid in the sense of\n[placidity](../../../appendix/placid-ind-scheme.html), $U_\\ast=1+tk[[t]]$ pro-unipotent,\n$G_\\ast=\\mathbb{G}_m$. **C5 holds** there as $\\mathcal{D}_c(BL^+\\mathbb{G}_m)\\simeq\\mathcal{D}_c(B\\mathbb{G}_m)$,\nwhose published shadow is BZSV (7.9): the Homs of the Hecke translates are one-dimensional in\ndegrees $0,2,4,\\ldots$, that is $H^{*}(B\\mathbb{G}_m)$. **C6 holds vacuously at every $\\lambda$** —\nevery $G_\\lambda$ here is already reductive. Finally, the entry is where the withdrawn clause (iv)\ndied, and the death is confined: $\\overline{LX_n}$ contains $\\{n,n+1,\\ldots\\}$, infinitely many\nstrata, and not one of C1–C6 notices, exactly as [updates/u1.md](updates/u1.html) diagnosed.\n\n### K2 — the trivial period, $X=\\mathrm{pt}$ *(`positive`)* — **holds**\n\n$\\Lambda_X^+=\\{\\ast\\}$, $LX=\\mathrm{pt}$, $K_\\ast=K=L^+G$, $U_\\ast=\\ker(\\mathrm{ev}_1)=K^{(1)}$,\n$G_\\ast=G$, $G_\\ast^{\\mathrm{red}}=G$. **Q holds** over a one-element index set and **C1 is\ntautological** ($K$ acts trivially on a point). **C2–C4 hold** but hand back the congruence\nfiltration $1\\to K^{(1)}\\to L^+G\\to G\\to1$, which is input rather than output. **C5 is the one\nclause this entry confirms at page level**: the register quotes BZSV §7.6.3 describing the whole\nautomorphic category — which here *is* the single stratum $BL^+G$ — as \"perfect modules under\n$H^{*}(BG)$\", i.e. $\\mathcal{D}_c(BG)$. The source therefore performs the reduction\n$BL^+G\\rightsquigarrow BG$ that C5 asserts. **C6 holds vacuously** ($G$ reductive).\n\n### K3 — Gross–Prasad, $X=\\mathrm{SO}_N$ under $\\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$ *(`positive`)* — **holds**\n\nTake $N=3$: $\\mathrm{SO}_3\\cong\\mathrm{PGL}_2$, $\\mathrm{SO}_2\\cong T$, $LX(k)=\\mathrm{PGL}_2(F)$\nwith $(g_1,g_2)\\cdot x=g_1xg_2^{-1}$, and\n\n$$\nx_\\lambda=\\begin{pmatrix}1&0\\\\ t^{-1}&1\\end{pmatrix},\\qquad\nx_\\lambda\\,\\mathrm{diag}(a,1)\\,x_\\lambda^{-1}=\\begin{pmatrix}a&0\\\\ (a-1)t^{-1}&1\\end{pmatrix},\n$$\n\nintegral exactly when $a\\equiv1\\bmod t$. So $K_\\lambda\\cong1+t\\mathcal{O}$, $U_\\lambda=1+t^2\\mathcal{O}$\nis normal pro-unipotent, and $G_\\lambda=\\mathrm{ev}_1(K_\\lambda)\\cong\\mathbb{G}_a$, the negative root\nsubgroup paired with $1\\in\\mathrm{SO}_2$ — **C1–C4 hold non-vacuously**, with $K_\\lambda$ neither\ntrivial nor all of $K$ nor of the form $L^+H$. This is the sharpest **C6** row on the bench:\n$G_\\lambda$ is *unipotent*, so $G_\\lambda^{\\mathrm{red}}=1$ and C6 reads\n$\\mathcal{D}_c(B\\mathbb{G}_a)\\simeq\\mathcal{D}_c(\\mathrm{pt})$ — the $\\mathbb{A}^1$-invariance\nStep 3 of [Q1-L4-L3](Q1-L4-L3/index.html) proves, and the clause whose truth is\ncharacteristic-$0$-specific. **Q is checked at one hand-picked $\\lambda$ only**: the orbit poset of\nthis $X$ is not classified here, and the entry's source does not classify it either.\n\n### K4 — Rankin–Selberg, $X=\\mathrm{GL}_N$ under $\\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$ *(`positive`)* — **holds**\n\n$N=3$, $\\mathrm{GL}_2$ the lower-right block, $x_\\lambda=\\mathrm{diag}(t,t,1)\\in\\mathrm{GL}_3(F)=LX(k)$.\nSince $\\mathrm{Ad}(x_\\lambda)$ multiplies the $(3,2)$ entry by $t^{-1}$ and leaves the rest integral,\n$K_\\lambda=\\{(x_\\lambda\\tilde h\\,x_\\lambda^{-1},h)\\}$ with $\\tilde h=\\mathrm{diag}(1,h)$ and $h$ in the\nIwahori $\\{h\\in\\mathrm{GL}_2(\\mathcal{O}):h_{21}\\in t\\mathcal{O}\\}$. Its level-one image is the fibre\nproduct $G_\\lambda\\cong B^-\\times_TB^+\\cong T_2\\ltimes\\mathbb{G}_a^2$, four-dimensional and closed in\n$\\mathrm{GL}_3\\times\\mathrm{GL}_2$, with $U_\\lambda=\\{h\\equiv1\\bmod t,\\ h_{21}\\in t^2\\mathcal{O}\\}$.\n**C1–C4 hold non-vacuously**, and **C6 holds non-vacuously**:\n$\\mathcal{D}_c(B(T_2\\ltimes\\mathbb{G}_a^2))\\simeq\\mathcal{D}_c(BT_2)$, a case where the second\nequivalence does real work and the witness is neither a subgroup of one factor nor reductive.\n**Q at one $\\lambda$ only.**\n\n### K5 — mirabolic, $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ *(`positive`)* — **holds**\n\nWith the entry's action $(g_1,g_2)\\cdot(g,v)=(g_1^{-1}gg_2,vg_2)$ and $LX(k)=\\mathrm{GL}_n(F)\\times F^n$,\ntake $n=2$. At $x_\\lambda=(1,(1,0))$ the stabilizer is the diagonal\n$\\{(g,g):g\\in\\mathrm{GL}_2(\\mathcal{O}),\\ g=\\left(\\begin{smallmatrix}1&0\\\\ c&d\\end{smallmatrix}\\right)\\}\n=L^+(\\mathbb{G}_a\\rtimes\\mathbb{G}_m)$, so $U_\\lambda$ is its first congruence subgroup and\n$G_\\lambda\\cong\\mathbb{G}_a\\rtimes\\mathbb{G}_m$: **C6 holds non-vacuously**, reading\n$\\mathcal{D}_c(B(\\mathbb{G}_a\\rtimes\\mathbb{G}_m))\\simeq\\mathcal{D}_c(B\\mathbb{G}_m)$. This is the\none entry besides K1 whose $X$ is non-homogeneous, and the boundary is visible: at\n$x_\\lambda=(1,(0,0))$ the stabilizer is the whole diagonal $L^+\\mathrm{GL}_2$, $G_\\lambda=\\mathrm{GL}_2$,\nand C6 falls back to vacuous — two strata of different shapes, both satisfying C1–C5. **Q is not\nreached**: the poset mixes Cartan data for $g$ with valuation data for $v$ and is not classified here.\n\n### K6 — symplectic (Jacquet–Rallis), $X=\\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$ *(`positive`)* — **holds**\n\nAt the base point $x_0=e\\cdot\\mathrm{Sp}_{2n}(F)$ one has $K_0=\\mathrm{GL}_{2n}(\\mathcal{O})\\cap\\mathrm{Sp}_{2n}(F)=L^+\\mathrm{Sp}_{2n}$,\n$U_0=\\ker(\\mathrm{ev}_1)$, $G_0=\\mathrm{Sp}_{2n}$ — C1–C5 hold, C6 vacuously. What makes this row\ncount twice: at $n=1$, $\\mathrm{Sp}_2=\\mathrm{SL}_2$ and $X\\cong\\mathbb{G}_m$ via the determinant, so\n$LX(k)=F^\\times$, $K=\\mathrm{GL}_2(\\mathcal{O})$ acts through $\\det$, $\\Lambda_X^+=\\mathbb{Z}$ is\nclassified, and $K_\\lambda=\\mathrm{SL}_2(\\mathcal{O})$ with $G_\\lambda=\\mathrm{SL}_2$ at *every*\n$\\lambda$ — **Q holds in full at a `positive`, in-class entry with $K_\\lambda\\neq1,K$**. Second, the\nentry carries Remark 1.4: these orbits are neither finite-dimensional nor finite-codimensional, and\nC1–C5 are indifferent to that, since finite-typeness is asserted of $G_\\lambda$ and never of\n$K_\\lambda$ or of the stratum. A cross-check that uses the entry's *theorem*: assembling the strata —\nwhich this node does not do, and which is [Q1-L5](../Q1-L5/index.html)'s business — gives\n$\\bigoplus_{m\\in\\mathbb{Z}}\\mathcal{D}_c(B\\mathrm{SL}_2)$, i.e. $\\mathbb{Z}$-graded perfect modules\nover $H^{*}(B\\mathrm{SL}_2)=k[c_2]$ with $|c_2|=4$, and Chen–Macerato–Nadler–O'Brien's right-hand\nside at $n=1$ is $D^{\\mathrm{GL}_1}_{\\mathrm{perf}}(\\mathrm{Sym}(\\mathfrak{gl}_1[-4]))$ — perfect\nmodules over a degree-$4$ generator with the $\\mathbb{Z}$-grading of the trivial $\\mathrm{GL}_1$-action.\nThey agree, subject to the entry's own caveat that their $D^b$ is the semi-analytic one. **C6 is\nvacuous** at both points computed.\n\n### K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$ *(`adjacent`)* — **silent**\n\nThe entry names $\\check X$ and $\\check G$ on the spectral side only, and its own text records that\nthe source has not been read on the page; with no automorphic $X$ there is nothing to substitute\ninto any clause.\n\n### K8 — rank-1 affine homogeneous spherical varieties *(`weak`)* — **silent**\n\nThe entry settles which category sits on the automorphic side for a whole family $G/H$; it names no\nsingle $X$ and computes no orbit, stabilizer or jet image, so it cannot see C1–C6. The only thing\nsayable about its members is the generic base-point row ($K_0=L^+H$, $G_0=H$ reductive), which uses\nnothing the entry supplies — which is why §4 asks for one member to be worked out instead.\n\n### K9 — the group case, $X=H$ under $H\\times H$ *(`degenerate`)* — **holds**, and cannot on its own earn `consistent`\n\nQuotienting by the right factor gives $K\\backslash LX\\simeq L^+H\\backslash\\mathrm{Gr}_H$ with strata\nthe Cartan cells, and by [Q1-L4-e3](Q1-L4-e3/index.html) — resting on `zhu2016introduction`\nProp. 2.1.5 for C1 — $K_\\mu=L^+H\\cap t^\\mu L^+Ht^{-\\mu}$, $U_\\mu=K_\\mu\\cap\\ker(\\mathrm{ev}_1)$ and\n$G_\\mu=P_\\mu$, so C6 reads $\\mathcal{D}_c(BP_\\mu)\\simeq\\mathcal{D}_c(BL_\\mu)$; for $H=\\mathrm{SL}_2$,\n$\\mu=\\check\\alpha$ this lands in $\\mathcal{D}_c(BT)$. Every clause holds non-vacuously, and this is\nthe **only** bench entry where $\\Lambda_X^+=X_*(T)^+$ is fully classified *and* $G_\\mu$ varies\nnon-trivially with $\\mu$ — so it is the only entry that reaches Q and a non-vacuous C6 at once. By\n[ADR 0040](../../../process/decisions/0040-the-key-example-register.html) it cannot lift the verdict:\n[$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the monoidal unit here.\n\n### K10 — the Whittaker period, $M=T^{*}(G/\\!\\!/_{\\psi}U)$ *(`out-of-class`)* — **silent**\n\nThe polarization is twisted and $M$ is not $T^{*}X$ for any $X$ in\n[untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html), so there is no\n$X$, no $LX$, no $\\Lambda_X^+$ and no $K_\\lambda$: the specialization is empty, not false.\n\n### K11 — $X=\\mathrm{PSL}_2/\\mathrm{PO}_2$ *(`out-of-class`)* — **holds**, out of scope, and the register's warning is discharged\n\nThe entry is out of class because the generic stabilizer is disconnected, which the standing\n[context](../../../context.html) requires, so Q1-L4 claims nothing here; the substitution is nevertheless\navailable, because C1–C6 use only \"smooth affine spherical\" and characteristic $0$. Writing\n$X\\cong\\mathrm{PGL}_2/N(T)$, the variety of maximal tori, take for $x_\\lambda$ the torus $T'$ split by\n$F(\\sqrt t)$, image of $\\left\\{\\left(\\begin{smallmatrix}a&tb\\\\ b&a\\end{smallmatrix}\\right)\\right\\}$.\nThen $K_\\lambda=N(T')(F)\\cap\\mathrm{PGL}_2(\\mathcal{O})$ and\n$G_\\lambda\\cong\\mathbb{G}_a\\rtimes\\mathbb{Z}/2$ — the bench's only **disconnected** witness — with\n$U_\\lambda$ the part congruent to $1$, so C1–C5 hold non-vacuously. C6 is the clause under test, since\n\"the quotient of $G_\\lambda$ by its unipotent radical\" is a phrase whose textbook home is connected\ngroups. It holds, and the closed world already covers it: Step 6 of\n[Q1-L4-L3](Q1-L4-L3/index.html)'s proof — a direct dependency of this node — shows that in\ncharacteristic $0$ unipotent groups are connected, hence $R_u(H)=R_u(H^\\circ)$ exists and is normal\nfor any affine finite-type $H$, and proves the equivalence for that $N$. Here\n$G_\\lambda^{\\mathrm{red}}=\\mathbb{Z}/2$ and $\\mathcal{D}_c(B(\\mathbb{G}_a\\rtimes\\mathbb{Z}/2))\\simeq\\mathcal{D}_c(B\\mathbb{Z}/2)$.\nThe register's standing warning — that a statement holding here is reporting a missing hypothesis —\nis discharged rather than triggered: nothing in C1–C6 quietly uses connectedness, and the clause\nsurvives the disconnected witness on a ratified reading rather than an improvised one.\n\n### K12 — $X=(\\mathrm{SL}_2^{\\times3})\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ *(`negative`)* — **silent**\n\nMembership of the standing class is unsettled — the entry commissions it as\n[Q1-e8](../Q1-e8/index.html) — so the hypothesis under which the node speaks is not known to\nhold, and the entry's content is a function-theoretic statement about Satake parameters and\n$W_X$-orbits over $\\mathbb{F}_q((t))$ that computes no stabilizer. Worth recording conditionally:\nwere it to enter the class, its base-point row would be the generic homogeneous one\n($K_0=L^+\\mathrm{SL}_2^{\\times3}$, $G_0$ reductive), so the register's one candidate negative bears\non generation and not on any clause of this node.\n\n## 2. What no entry reached\n\nNo clause of the list was missed by *every* entry: Q, C1, C2, C3, C4, C5 and C6 each got at least\none non-vacuous hit. What the bench never reached is finer, and each item below is load-bearing.\n\n- **Q together with a varying $G_\\lambda$, at a non-degenerate entry.** The quantifier is checked in\n  full at K1, K2, K6 ($n=1$) and K9 only. Of those, the first three have $G_\\lambda$ constant or\n  trivial along the poset, and the one entry where $G_\\lambda$ genuinely varies over a classified\n  $\\Lambda_X^+$ is K9 — `degenerate`. Every non-vacuous C6 hit at a `positive` entry (K3, K4, K5) is\n  a single hand-picked $\\lambda$.\n- **C2 and C4 where the scheme-theoretic image does real work.** At every substitution above,\n  $K_\\lambda$ is visibly the $\\mathcal{O}$-points of a smooth affine $\\mathcal{O}$-model — a jet\n  group, an Iwahori, a congruence subgroup, a twisted torus normalizer — so placidity and\n  finite-typeness are read off the model. No entry produces a stratum where the naive model is\n  non-flat and $G_\\lambda$ is strictly smaller than its special fibre, which is the case C2 and C4\n  are stated to cover.\n- **The fpqc-sheaf qualification in C4.** This is precisely what [updates/u2.md](updates/u2.html)\n  installed, and the bench cannot see it: at every $\\lambda$ substituted above the projection\n  $K_\\lambda\\to G_\\lambda$ splits by constant arcs (or, at K3, by $c_1\\mapsto1+c_1t$), so the\n  pointwise quotient presheaf is already a sheaf and the correction is invisible.\n- **The characteristic-$0$ hypothesis.** All twelve entries live over $k$ of characteristic $0$, and\n  the one whose source is over $\\mathbb{F}_q((t))$, K12, is silent. So nothing on the bench can show\n  that char $0$ is load-bearing — even though K3 exercises exactly the clause,\n  $\\mathcal{D}_c(B\\mathbb{G}_a)\\simeq\\mathcal{D}_c(\\mathrm{pt})$, that fails outside it.\n- **C6 at a disconnected $G_\\lambda$ inside the standing class.** The bench's only disconnected\n  witness is K11, which is out of class. The in-class instance is real and in print — Chen–Yi's\n  equivalence between equivariant local systems on $LX_\\lambda$ and representations of\n  $\\pi_0(K_\\lambda)$, carried by [Q1-L4-e4](Q1-L4-e4/index.html) — but it is not a register\n  entry, so `/check-goal` cannot use it.\n\n## 3. Where the pressure is\n\nThe informative finding is a question the bench raised and the closed world had already answered.\nK11 is the only entry that produces a disconnected $G_\\lambda$, and the previous run one level down\n— [Q1-L4-L2's goal check](Q1-L4-L2/goalcheck.html) §3 — flagged it as live *here*, on the ground that\nclause (iii) says \"the quotient of $G_\\lambda$ by its unipotent radical\" and a disconnected\n$G_\\lambda$ needs that phrase fixed. Reading the dependency shows it does not: Step 6 of\n[Q1-L4-L3](Q1-L4-L3/index.html)'s proof establishes $R_u(H)=R_u(H^\\circ)$ for arbitrary affine\nfinite-type $H$ in characteristic $0$ and proves the equivalence for it, so C6 has a ratified\nreferent at K11 and the flag is discharged. The residue is not a clause but the node's *title*,\nwhich promises \"reductive quotients\": at K11 $G_\\lambda^{\\mathrm{red}}=\\mathbb{Z}/2$, reductive only\nin the trivial-unipotent-radical sense, and the same disconnectedness occurs *inside* the class by\nChen–Yi. Whether a consumer of this node — [Q1-L5](../Q1-L5/index.html),\n[Q1-L6](../Q1-L6/index.html) — may treat $G_\\lambda^{\\mathrm{red}}$ as connected reductive is a\nquestion for `/update`, not a defect in what (iii) asserts.\n\nThe second finding is a division of labour the bench cannot repair on its own. The entries that\nreach **Q** (K1, K2, K6 at $n=1$) are exactly the entries where $G_\\lambda$ is trivial, the whole of\n$K$, or constant along the poset; the entries that reach **C6** non-vacuously (K3, K4, K5) each\nreach it at one hand-picked stratum. The single entry that does both is the degenerate one. So the\nnode has been checked at every stratum, and separately checked where its content bites, but never\nboth at once at a `positive` entry — which is exactly what §4 commissions. Third, and consistent\nwith the node's own [examples.md](examples.html): K1, the register's flagship computable positive and\nthe case that killed clause (iv), is blind to C6, because every $G_\\lambda$ there is reductive.\n\n## 4. What would test this further\n\n- **K6 at $n\\ge2$, away from the base point.** In $\\mathrm{GL}_4/\\mathrm{Sp}_4$ take the lattice on\n  which the symplectic form has elementary divisors $(1,t)$; then $K_\\lambda$ is the automorphism\n  group of a lattice-with-alternating-form whose naive $\\mathcal{O}$-model is *not* flat — the\n  special fibre, preserving a rank-2 degenerate form, is larger than the generic\n  $\\mathrm{Sp}_4$ — so $G_\\lambda$ is a proper scheme-theoretic image and is expected non-reductive,\n  with $G_\\lambda^{\\mathrm{red}}$ a product of symplectic groups. This is the only bench case where\n  C2 and C4 would have to work rather than be read off a smooth model, and it sits at a `positive`,\n  in-class entry.\n- **A member of K8 worked out.** One rank-1 affine homogeneous $G/H$ from Devalapurkar's family —\n  $\\mathrm{SL}_2/T$ is the cheapest — with $\\Lambda_X^+$ classified, a non-base $x_\\lambda$, and\n  $(U_\\lambda,G_\\lambda)$ at every $\\lambda$. Rank $1$ is where the poset is small enough for the\n  quantifier and $G_\\lambda$ to be checked *together* at a non-degenerate entry, which no current\n  entry does.\n- **An in-class entry with $\\pi_0(K_\\lambda)\\neq1$.** The linear-periods symmetric variety\n  $X=(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$, already in the tree as\n  [Q1-L4-e4](Q1-L4-e4/index.html) on Chen–Yi Cor. 9(ii), is the natural bench candidate: it\n  would put a disconnected $G_\\lambda$ *inside* the standing class and turn §2's last bullet into a\n  row. Only the user or `/update` may add it to the register.\n- **A characteristic-$p$ entry.** Any settled $(G,X)$ over $\\overline{\\mathbb{F}_p}((t))$ — the\n  analogue of K1 is cheapest — with one $G_\\lambda$ unipotent. Without one the bench cannot show\n  that the characteristic hypothesis behind C5 and C6 is load-bearing, even though K3 already sits\n  on the clause that needs it.\n\nGOALCHECK: consistent\n";</script>
