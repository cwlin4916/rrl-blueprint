ined symbol still standing in this node — twice — and in [Q1-L4-e1](../../Q1-L4-e1/index.html), [Q1-L4-e2](../../Q1-L4-e2/index.html) and the shared [examples.md](../../examples.html).\n\n## The defect\n\n**$\\mathrm{ev}_0$ is not defined.** The evaluations of this repository are $\\mathrm{ev}_m\\colon K\\to L^mG$ for $m\\ge 1$, and the one this statement means is $\\mathrm{ev}_1$, evaluation at $t = 0$ into $L^1G = G$. Nothing about the mathematics changes: the subgroup being named is the first congruence subgroup either way.\n\n**Old** (verbatim): `$U_\\mu = K_\\mu\\cap\\ker(\\mathrm{ev}_0\\colon L^+G\\to G)$` and `$G_\\mu = \\mathrm{ev}_0(K_\\mu) = P_\\mu$`\n\n**New** (verbatim): `$U_\\mu = K_\\mu\\cap\\ker(\\mathrm{ev}_1\\colon L^+G\\to G)$` and `$G_\\mu = \\mathrm{ev}_1(K_\\mu) = P_\\mu$`\n\n## Verified\n\nThe substitution is the identity on content. $L^1G = G$ and $\\mathrm{ev}_1$ *is* evaluation at $t = 0$, by the note on [loops, jets and positive loops](../../../../../appendix/ex-loops-placid.html). The second occurrence is the image rather than the kernel, and $\\mathrm{ev}_1(K_\\mu) = P_\\mu$ is the same parabolic.\n\n## Refuted\n\nNothing. The walk re-read this node's specialization against clauses (i)–(iii) of [Q1-L4](../../index.html) as they now stand and found it correct.\n\n## Considered and not adopted\n\n- **Defining $\\mathrm{ev}_0$ in the appendix instead.** It would add a second name for a map that already has one, against the rule that a fact is stored once, and it would leave three statements using an index the rest of the tree does not.\n- **Correcting the shared [examples.md](../../examples.html) in the same pass.** It carries the symbol twice and it is the example-finder's file, not this operator's; it is reported instead, for the next `/examples` run on [Q1-L4](../../index.html).\n";</script>
