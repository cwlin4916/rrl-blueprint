q\\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}})$, is genuinely tested here: it asserts contractibility of the unipotent radical of $P_\\mu$ rather than an identity. Clause 1 and the fibration behind clause 2 are `zhu2016introduction` Prop. 2.1.5 and §2.1; the mod-$t$ identification is *constructed* in [examples.md](../examples.html), not cited. The same $X$ at the level of [Q1-L5](../../Q1-L5/index.html)'s criterion is [Q1-L5-e2](../../Q1-L5/Q1-L5-e2/index.html).\n- **2026-08-05 — notational correction** by `/update` (full walk) ([u1](updates/u1.html)): both occurrences of the undefined $\\mathrm{ev}_0$ became $\\mathrm{ev}_1$ — once as the kernel $U_\\mu = K_\\mu\\cap\\ker(\\mathrm{ev}_1\\colon L^+G\\to G)$ and once as the image $G_\\mu = \\mathrm{ev}_1(K_\\mu) = P_\\mu$. The parabolic is the same one. This node is also the witness the walk used against [Q2-L2](../../../Q2/Q2-L2/index.html): it is where $G_\\mu$ is visibly **not** reductive, which is what made that node's description of the same group wrong.\n- **2026-08-05 — notation normalised, no claim changed** by `/update Q1`. Group names were written bare ($GL_n$, $SO_n$, …) against `\\mathrm{}` everywhere else in the repository, and several titles carried plain-text math — Unicode `×`, `∖` and in one case a Unicode minus — where every other title uses KaTeX. Both are now uniform across the tree. Typography only: no symbol denotes anything different and no claim moved.\n";</script>
