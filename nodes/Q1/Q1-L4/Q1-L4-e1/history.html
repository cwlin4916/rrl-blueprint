_2})\\simeq H^*(B\\mathbb{G}_m)$ is the published shadow of the $B\\mathbb{G}_m$ that clause 3 predicts — the division [examples.md](../examples.html)'s promotion-candidates paragraph proposed. Two caveats stand as in [examples.md](../examples.html): [the three standing hypotheses](../../../../appendix/assum-intro.html)(b), a dimension theory for $L\\mathbb{A}^1$, is not discharged from a numbered source (`BZSV` p. 158 uses exactly such a normalization, but no numbered citation was pinned); and since every $G_\\lambda$ here is reductive, the second equivalence of (iii) is untested — [Q1-L4-e3](../Q1-L4-e3/index.html) tests it. Each $\\overline{LX_n}$ contains infinitely many strata: that is the failure of the withdrawn clause (iv) ([updates/u1.md](../updates/u1.html)), not of the present statement.\n- **2026-08-05 — two notational corrections** by `/update` (full walk) ([u1](updates/u1.html)): $\\mathrm{ev}_0$, which is defined nowhere in the repository, became $\\mathrm{ev}_1$ — the level-one evaluation into $L^1G = G$, which is evaluation at $t = 0$ — and the placid presentation of $K_\\ast = L^+\\mathbb{G}_m$ is now said to run along **affine, faithfully flat, smooth** homomorphisms rather than \"smooth affine surjections\". Both are the corrections this run made in [Q1-L4-L2](../Q1-L4-L2/index.html), found still standing here; the computation is unchanged, and the same undefined symbol in the shared [examples.md](../examples.html) is reported rather than edited, that file being the example-finder's.\n";</script>
