<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q1-L4</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee report on [proof.md](../proof.html) (893/900 words), against the `## Statement` of [Q1-L4_node.md](../index.html), the three declared objects, and the four `depends-on` statements.\n\n## What was checked and found correct\n\nRecorded so round 2 need not redo it.\n\n- **Lemma block.** Lines 10–22 of the draft against lines 19–31 of the node file: identical, character for character, including the display in (iii) and the gloss on $G_\\lambda^{\\mathrm{red}}$. No hypothesis strengthened, no conclusion weakened.\n- **Hallucination sweep.** The draft cites no `refs.bib` key and no `main.tex` `\\label`, so the sweep reduces to links. All seven resolve on disk: [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), [placidity](../../../../appendix/placid-ind-scheme.html), the four dependency node files, plus `../../appendix/index.md`, `../../context.md`, `../../main_dag.md`. Relative depth is right for a node at `blueprint/nodes/Q1-L4/` ($d=1$, so `../../` reaches `blueprint/`).\n- **Step 9, the composite (the place most likely to break).** With $p_\\lambda=(Bu)^{-1}\\circ\\pi_1\\circ q$, contravariance gives $p_\\lambda^!=q^!\\circ\\pi_1^!\\circ((Bu)^{-1})^!$ — exactly as written. Domains compose: $((Bu)^{-1})^!\\colon\\mathcal{D}_c(BG_\\lambda)\\to\\mathcal{D}_c(BK_{\\lambda,1})$, then $\\pi_1^!\\colon\\mathcal{D}_c(BK_{\\lambda,1})\\to\\mathcal{D}_c(BK_\\lambda)$, then $q^!\\colon\\mathcal{D}_c(BK_\\lambda)\\to\\mathcal{D}_c(K\\backslash LX_\\lambda)$, total $\\mathcal{D}_c(BG_\\lambda)\\to\\mathcal{D}_c(K\\backslash LX_\\lambda)$, which is what line 52 claims. \"Its inverse is the first $\\simeq$ as the Lemma displays it, left to right\" is then literally right: the Lemma's first $\\simeq$ points $\\mathcal{D}_c(K\\backslash LX_\\lambda)\\to\\mathcal{D}_c(BG_\\lambda)$. No handedness slip.\n- **Step 8, direction.** [Q1-L4-L4](../Q1-L4-L4/index.html) supplies $\\mathcal{D}_c(BH_m)\\xrightarrow{\\sim}\\mathcal{D}_c(BH)$, finite level to placid level, along pullback against $BH\\to BH_m$. Line 44 states it in that direction and no other. $m=1$ is inside the entry's range $m\\ge1$.\n- **Step 7, discharge.** [Q1-L4-L2](../Q1-L4-L2/index.html)(a) supplies each of L4's named properties — affine finite-type levels, affine/faithfully flat/smooth transition homomorphisms, index range $m\\ge1$, consecutive-level transitions only — and (b) supplies unipotent $\\ker(H_{m+1}\\to H_m)$ verbatim. Nothing missing but the point in Flaw 3 below.\n- **Step 4 against [placidity](../../../../appendix/placid-ind-scheme.html).** The entry's clause is \"cofiltered limit of finite-type schemes whose transition maps are smooth and affine\"; L2(a)'s transitions are affine, faithfully flat and smooth, so the entry applies with room to spare, and the presentation is even by group schemes with homomorphisms — the sense in which L2(a) and L4 both use the undefined phrase \"placid group scheme\". Step 4 needs no clause the entry does not give.\n- **Step 5 and \"pro-unipotent.\"** The draft uses the term only where [Q1-L4-L2](../Q1-L4-L2/index.html)(c) supplies it, and nowhere reasons *from* pro-unipotence. Steps 7–8 use L2(b) (unipotent transition kernels), Step 10 uses $R_u(G_\\lambda)$ for the finite-type $G_\\lambda$; neither is the pro-unipotence of $U_\\lambda$ in a second sense. No quantifier or sense slip.\n- **Step 2's declination of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).** Verified by exhaustion over Steps 3–11: every fact about $LX$, $LX_\\lambda$ or the closure order enters only through the *statements* of [Q1-L4-L1](../Q1-L4-L1/index.html) and [Q1-L4-L2](../Q1-L4-L2/index.html), which are proved and whose internal citations are not this node's ledger. In particular no step needs placidity of $\\overline{LX}_\\lambda$, finite presentation of $j_\\lambda$ or $\\overline{i}_\\lambda$ (clause (a)), and no step needs the ind-presentation $LX=\\varinjlim_\\lambda\\overline{LX}_\\lambda$ (clause (b), the one the entry's `hypotheses:` block says is not established for general spherical $X$ on a page of the source). The declination is sound, and it is the right call: it keeps the node clear of clause (b)'s provenance defect.\n- **Step 1's non-emptiness inference.** $LX_\\lambda(k)\\ne\\emptyset$ is drawn from the ratified reading (\"the strata *are* the orbit images through their $k$-points\"), not from a general \"nonempty over algebraically closed $k$\" principle — which would be false here, $LX_\\lambda$ being nowhere claimed of finite type. Correctly sourced, and in any case not load-bearing: were $LX_\\lambda(k)$ empty the Lemma would be vacuous at that $\\lambda$, not false.\n- **Step 10.** [Q1-L4-L3](../Q1-L4-L3/index.html)'s two hypotheses ($H$ affine of finite type; $k$ algebraically closed of characteristic $0$) are both named at line 54, the first from Step 5 and the second standing. Its final clause is quoted at the right specialization, and the direction ($\\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}})\\xrightarrow{\\sim}\\mathcal{D}_c(BG_\\lambda)$, inverse read left to right) is right.\n- **Hygiene.** No bare backticked appendix label outside a link; no `preamble.tex` macro (only $\\mathcal{D}_c$, $\\varprojlim$, $\\operatorname{Stab}$, $\\trianglelefteq$, $\\mathrm{pt}$, $\\blacksquare$ and the like); three `$$` displays, each with a blank line either side; no `\\[`, `align` or `equation`. The two unsubscripted $\\simeq$ in clause (iii) and clause (i) fall under both exceptions in [context.md](../../../../context.html) `## Notation` and are correct as written. No `GAP:` marker.\n\n## Flaws\n\n**Flaw 1** [MINOR] — The inference is sound but its two premises are project-specific and go unnamed.\n\n<details><summary>(location: line 40, Step 6 — \"The category $\\mathcal{D}_c(\\mathcal{Y})$ is constructed from the prestack $\\mathcal{Y}$ alone\") · the finding</summary>\n\nThat $\\mathcal{Y}\\mapsto\\mathcal{D}^!(\\mathcal{Y})$ is a functor $\\mathrm{PreStk}^{op}\\to\\mathrm{DGCat}$ — used again at line 52 as \"contravariant functoriality of $!$-pullback\" — is the entry [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html); that $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ is cut out by a condition intrinsic to $\\mathcal{Y}$ (tested on smooth $f\\colon S\\to\\mathcal{Y}$) is [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html). Only *given* those is \"a functor preserves equivalences\" the standard mathematics the draft treats the whole step as. Neither entry is in the node's `objects:` line, though both are declared by the dependencies [Q1-L4-L3](../Q1-L4-L3/index.html) and [Q1-L4-L4](../Q1-L4-L4/index.html) whose conclusions the draft consumes, and CLAUDE.md's closed world is the whole of `blueprint/appendix/`. Repair: link both entries in Step 6 (and say in `notation:` which $\\mathcal{D}_c$ clause (iii) is about, since the Statement does not), flagging to the orchestrator that `objects:` should grow to match; or, if they are to stay undeclared, add the half-sentence that $f^!$ carries coherent to coherent because $f$ an equivalence identifies the smooth tests on the two sides. Substance is not at risk: the step is robust even to the reading of \"smooth morphism to a prestack\", which [Q1-L4-L4](../Q1-L4-L4/index.html)'s own caveat records as fixed by no entry — any reading of it is an invariant of the prestack, hence transported along $f$.\n\n</details>\n\n**Flaw 2** [MINOR] — Step 6 is quantified over prestacks; what Step 3 imports from [Q1-L4-L1](../Q1-L4-L1/index.html)(c) is an equivalence of *fpqc quotient stacks*, and the draft never says the two notions meet.\n\n<details><summary>(location: line 40, \"an equivalence of prestacks\", against line 30's import of an equivalence \"of fpqc quotient stacks\") · the finding</summary>\n\nThey do — fpqc stacks are a full subcategory of $\\mathrm{PreStk}=\\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$, so an equivalence of stacks is an equivalence of prestacks — and the reading is forced to be uniform, since [Q1-L4-L3](../Q1-L4-L3/index.html) and [Q1-L4-L4](../Q1-L4-L4/index.html) both write $B(-)$ for the fpqc quotient stack and L4's proof evaluates $\\mathcal{D}^!(BK)$ over affine tests classifying honest torsors. But the gap between the two readings is not innocent in general: for a naive prestack quotient and its stackification the right Kan extensions are a priori different categories, and nothing in the closed world identifies them — [Raskin torsor descent for $\\mathcal{D}^!$](../../../../appendix/bb-raskin-torsor-descent.html) says in terms that its base is never a stack and that the bridge is the citing node's own work. Repair: one clause, in `notation:` or at Step 6, fixing $K\\backslash LX_\\lambda$, $BK_\\lambda$, $BK_{\\lambda,1}$, $BG_\\lambda$, $BG_\\lambda^{\\mathrm{red}}$ as fpqc stacks and noting they are thereby prestacks. This matters downstream, where a node may want $\\mathcal{D}_c(K\\backslash LX_\\lambda)$ as a totalization over the Čech nerve of $LX_\\lambda$.\n\n</details>\n\n**Flaw 3** [MINOR]\n\n<details><summary>(location: line 26, \"the triple $(\\lambda, x_\\lambda, K_\\lambda)$ is verbatim the input of Q1-L4-L1 and Q1-L4-L2\"; and line 42) · the finding</summary>\n\nNot verbatim. [Q1-L4-L2](../Q1-L4-L2/index.html)'s Setting carries one clause the Lemma's data does not — \"$K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$, **a closed subgroup scheme of $K = L^+G$**\" — and [Q1-L4-L4](../Q1-L4-L4/index.html) requires its $H$ to *be* a group scheme, while [placidity](../../../../appendix/placid-ind-scheme.html) requires the placid object to be a scheme. All three are discharged by [Q1-L4-L1](../Q1-L4-L1/index.html)(a), a clause of a dependency, so nothing is missing from the closed world; but clause (a) of L1 is never cited anywhere in the draft, and Steps 4 and 7 read as if representability came for free. Repair: cite L1(a) once, at Step 1 or Step 4, as what makes $K_\\lambda$ a scheme.\n\n</details>\n\n**Flaw 4** [MINOR] — Incomplete as scoped. Clause (iii)'s first equivalence also inherits reading 3, since $q$ is the first factor of $p_\\lambda$ at line 49.\n\n<details><summary>(location: line 62, third caveat — \"Clause (i) inherits … its reliance on ratified reading 3\") · the finding</summary>\n\nThe caveat is honest about the dependence but understates its reach; a reader of clause (iii) alone would not learn that the identification of $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ with the stratum stands behind it. Repair: \"Clauses (i) and (iii) inherit …\". (Reading 3 is ratified and binding, so this is a disclosure and not a gap; the caveat is right to record it.)\n\n</details>\n\n**Flaw 5** [MINOR] — Redundant with its own source: [Q1-L4-L2](../Q1-L4-L2/index.html)(a) already ends \"in particular $K_\\lambda$ is a placid group scheme ([placidity](../../../../appendix/placid-ind-scheme.html))\", so the re-derivation from the presentation adds nothing but the naming of the isomorphism that Step 7 later needs.\n\n<details><summary>(location: line 36, Step 4) · the finding</summary>\n\nNoted because of the budget: the draft is at 893/900 words and Flaws 1–4 cost about three sentences. Compressing Step 4 to the citation plus the displayed isomorphism pays for them without splitting the node.\n\n</details>\n\n**Flaw 6** [MINOR] — The equivalence of clause (iii) is exhibited through a choice — $u$, the unnamed isomorphism $G_\\lambda\\xrightarrow{\\sim}K_{\\lambda,1}$ that [Q1-L4-L2](../Q1-L4-L2/index.html)(c) asserts but does not name — and the draft neither says which $u$ it takes (the one induced by $K_\\lambda\\to K_{\\lambda,1}$, whose kernel is $U_\\lambda$) nor that $p_\\lambda$ is independent of that choice.\n\n<details><summary>(location: lines 46–52, Step 9, and line 61, second caveat) · the finding</summary>\n\nThe Statement asks only that pullback *induce* equivalences, so nothing is unproved here; but the second caveat records non-canonicity only in $x_\\lambda$, and a downstream node wanting naturality in $\\lambda$ will need the choice pinned. Repair: name $u$ as the canonical isomorphism induced by $\\mathrm{ev}_1$, or extend caveat 2 to cover it.\n\n</details>\n\n**Flaw 7** [MINOR] — \"Pro-unipotent\" is undefined in the Statement and unglossed in the draft.\n\n<details><summary>(location: line 6, `notation:`, and line 38, Step 5) · the finding</summary>\n\nThe sense actually delivered is [Q1-L4-L2](../Q1-L4-L2/index.html)(c)'s — every finite-type quotient group of $U_\\lambda$ is unipotent — and clause (ii) is a public interface, `required-by` five nodes. Repair: put that gloss on the `notation:` line so no consumer reads a different sense (e.g. \"limit of unipotent groups along a chosen tower\") into clause (ii).\n\n</details>\n\n## Assessment\n\nEvery flaw above is presentational or bibliographic; none of them is a step that fails to hold. The assembly does what an assembly node should: it names the four inputs, checks each hypothesis against the situation, and composes in the right variance. The two places where an error was most likely — the three-fold composite of Step 9 and the direction of L4 at $m=1$ — are both correct, and the declination of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) is verified by exhaustion rather than asserted. The caveats are honest and conceal nothing that belongs in the body; caveat 1 correctly declines to claim the reductivity the node's *title* advertises, which is a defect of the title and not of the write-up.\n\nVERDICT: PASS\n";</script>
