tional content of the entry is that the strata *are* these images through their $k$-points, representability by the named locally closed sub-ind-schemes included. Verified on disk: the note on `def:orbits_iwahori_spherical`, reading 3 in `context.md` § Ratified readings, and the ADR file all exist and agree. The r1 requirement that base-point independence be part of what is ratified, not smuggled, is met: the reading quantifies over *each* $k$-point of the stratum, so instantiating at the arbitrary fixed $x_\\lambda \\in LX_\\lambda(k)$ of the Setting is a specialization, and no transitivity claim is used anywhere in the draft (checked line by line — Step 5 uses only the fixed base point $\\bar e = x_\\lambda$).\n- **r1 Flaw 2 [MAJOR]** (deference to \"the sense in force in the source\"; pro-scheme conflation; GAP prominence). Resolved: the ratified note is self-contained on the manuscript's own terms, explicitly does *not* identify the image sheaf with any pro-scheme presentation ($L^+Gx_v \\cong \\varprojlim_j L_j^+G/H_j$ stays a theorem where a node needs it), and Step 4 now invokes only the reading. The proof body nowhere uses a pro-scheme presentation — the Caveats say so and it is true. The GAP marker is gone because the gap is closed, not relocated.\n- **r1 Flaw 3 [MINOR]** (global fpqc sheafification functor). Resolved, by a better route than the one suggested: Step 3 constructs the sheafification of the one presheaf needed by hand, as the saturation $\\tilde P \\subseteq LX$, avoiding sheafification of arbitrary presheaves entirely. Correctness checked below.\n- **r1 Flaw 4 [MINOR]** (loop-functor formulas misattributed). Resolved: Step 1 now cites the entry [$F = k((t))$, $\\mathcal{O} = k[[t]]$] (`appendix.md#conv-ring-of-integers`), which states $K(R) = G(R[[t]])$ and $LX(R) = X(R((t)))$ verbatim, and the entry is in the node's `objects:` line.\n- **r1 Flaw 5 [MINOR]** (ambient subscript on the Step 2 display). Resolved: the first equality now reads $=_{\\mathrm{Shv}}$, the second drops it as sanctioned.\n\nThe stray entry `bb-chenyi-orbit-presentation` is absent from `blueprint/appendix.md` (grep confirms no occurrence anywhere under `blueprint/`), and the draft neither cites nor needs it.\n\n## Fresh pass\n\n**Statement fidelity.** The `## Lemma` block matches `node.md` `## Statement` word for word, links included — no renotation, no strengthening, no weakening.\n\n**Step 4 invocation is exact.** The note states the strata are the orbit images \"through their $k$-points\"; the draft renders this as \"through each of its $k$-points — in particular the fixed $x_\\lambda$\", which is precisely the universally quantified reading followed by instantiation. The displayed identity $LX_\\lambda =_{\\operatorname{Sub}_{\\mathrm{Shv}}(LX)} \\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ is then definitional, and the representability clause of the note is what delivers \"onto the locally closed sub-ind-scheme\" in (b). The equivariance remark ($a_\\lambda(gu) = g\\cdot a_\\lambda(u)$) is immediate.\n\n**Step 3 saturation.** The construction is correct. $\\tilde P$ is a subpresheaf (restrict a witness cover along $T \\otimes_R R'$), and a sheaf: a section of $LX$ glued from sections of $\\tilde P$ is locally in $P$ since faithfully flat maps compose. The universal property: for $f\\colon P \\to F$ with $F$ an fpqc sheaf and $s \\in \\tilde P(R)$ with witness $s|_{R'} \\in P(R')$, the two pullbacks of $s|_{R'}$ to $R' \\otimes_R R'$ are equal in $LX$, lie in $P$ (closed under restriction), hence are equal in $P$ because $P \\subseteq LX$ has injective value maps; naturality of $f$ then makes the two pullbacks of $f(s|_{R'})$ agree, and $F$ being a sheaf descends $f(s|_{R'})$ to $R$ — the draft's argument, verified. The chain $K/K_\\lambda = P^{\\#} = \\tilde P = \\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$: the coset presheaf is isomorphic to $P$ by levelwise orbit–stabilizer with $K_\\lambda(R)$ the stabilizer (Step 2); $\\tilde P$ is the smallest subsheaf of $LX$ containing $P$ (membership in a subsheaf is fpqc-local — both are sheaves and $LX$ is separated); and the sheaf image of $a_\\lambda$ is that smallest subsheaf. The mono claim of (b) and the epimorphy of $K \\to K/K_\\lambda$ (sections of $\\tilde P$ are locally in $P$, sections of $P$ lift levelwise to $K$) follow as stated.\n\n**Step 5.** The transporter derivation is now written and correct: a $T$-point of $\\operatorname{Spec}k \\times_{K\\backslash(K/K_\\lambda)} \\operatorname{Spec}k$ is an automorphism of the trivial left $K$-torsor — right translation $R_g$, the general form of such an automorphism — intertwining $u \\mapsto u\\cdot\\bar e$, i.e. $g\\cdot\\bar e = \\bar e$; and since $K/K_\\lambda = \\tilde P \\subseteq LX$ this reads $g\\cdot x_{\\lambda,T} = x_{\\lambda,T}$ in $LX(T)$, giving $g \\in K_\\lambda(T)$ directly from the Step 2 description — cleaner than the r1 route, no locality argument needed. The composition computation $(R_{g'} \\circ R_g)(u) = ugg'$, so $R_{g'} \\circ R_g = R_{gg'}$, is correct; see Flaw 1 below on the pairing-order clause. Both projections are the structure morphism, as claimed. Effective epimorphy of $c$: an $R$-point of the stack is an fpqc $K$-torsor with equivariant map, trivializable fpqc-locally, giving a local lift along the atlas $q$; a further cover lifts that point of $K/K_\\lambda$ along the sheaf epimorphism $K \\to K/K_\\lambda$ to $g$, and $q(g\\cdot\\bar e) \\cong q(\\bar e)$ via $g$ — so every point is fpqc-locally isomorphic to a pullback of $c$. (The draft reuses $R'$ for the composite cover; covers compose, so this is harmless.) Step (3), the identification of a stack with the quotient of the Čech groupoid of an effective epimorphism from a sheaf, is standard descent.\n\n**Sources.** The Caveats' page-level claims are unchanged from r1 and were verified then against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (v4): Thm 35 (p. 21, Drinfeld), Thm 36(i)–(ii) (p. 21, symmetric case), Rem. 37 (p. 22, extension to general spherical via [SW22, Lem. 2.3.10]). The provenance of the reading (Sakellaridis–Wang, no `refs.bib` key, not citable) now lives on the appendix entry, where it belongs.\n\n**Hygiene.** All seven object links resolve to existing anchors; `chenyi_2025singularitiesorbitclosuresloop` is in `refs.bib`; ADR 0028 exists on disk; no bare backticked labels outside links; KaTeX only; display math in `$$` blocks with blank lines; ambient subscripts where the convention demands ($=_{\\mathrm{Shv}}$, $=_{\\operatorname{Sub}_{\\mathrm{Shv}}(LX)}$, the stacks exception for (c)); proof body ≈ 690 words, inside the 900-word budget.\n\n## Flaws\n\n**Flaw 1** [MINOR] — The formula is correct, but \"the multiplication\" is convention-dependent as phrased: pairing the *first-then-second* arrow $(g, g')$ to $gg'$ is the multiplication in diagrammatic order, while the anti-ordering bookkeeping of the same formula reads as $K_\\lambda^{\\mathrm{op}}$.\n\n<details><summary>(Step 5: \"Composition is composition of right translations, $R_{g'}\\circ R_g = R_{gg'}$ — the multiplication of $K_\\lambda$\") · the finding</summary>\n\nNothing breaks — the same convention applied to the atlas of $\\mathrm{pt}/K_\\lambda$ produces the identical groupoid, so the conclusion (c) is convention-independent, and in the worst case $g \\mapsto g^{-1}$ canonically identifies $BK_\\lambda \\simeq BK_\\lambda^{\\mathrm{op}}$ — but one clause fixing the pairing order (\"composing first $R_g$, then $R_{g'}$\") would make the sentence unambiguous.\n\n</details>\n\n**Flaw 2** [MINOR] (Step 3: \"extends uniquely … compatibly under refinement of covers\")\nTwo half-line elisions in the universal property: uniqueness of the extension (immediate from separatedness of the target sheaf, since the extension is determined on a cover) and naturality in $R$ of the extended map (the refinement-compatibility phrase gestures at it). Both are one standard line each; stating the uniqueness reason would close the argument fully on the page.\n\n**Flaw 3** [MINOR] — As literally worded this attributes quasi-compactness to fpqc covers per se; what does the work is the quasi-compactness *clause in the definition* of an fpqc covering (every affine open of the base is the image of a quasi-compact open of the source), which for an affine base yields the finite affine refinement through which a section of the filtered colimit factors at one stage.\n\n<details><summary>(Step 1: \"$LX$, a filtered colimit of schemes along closed embeddings, is one, fpqc covers being quasi-compact\") · the finding</summary>\n\nThe r1 wording (\"covers of affines admitting quasi-compact refinements\") was the accurate one; restore it or equivalent.\n\nNo FATAL or MAJOR flaws. The three MINORs are wording-level and none obstructs the argument: (a), (b), (c) are proved in full within the closed world as ratified.\n\n</details>\n\nVERDICT: PASS\n";</script>
