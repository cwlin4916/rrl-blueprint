sage of the fiber product from $LX$ to $LX^i$ through the monomorphism give a closed subgroup scheme of the scheme $K$; the levelwise orbit–stabilizer plus sheafification (preserving epi and mono) correctly identifies $K/K_\\lambda$ with $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$; and Step 5's descent — effective epimorphy of $c$, transporter $=K_\\lambda$ via fpqc-locality of membership in a subsheaf, Čech groupoid $=(K_\\lambda\\rightrightarrows\\operatorname{Spec}k)$ — is genuinely unconditional given (b). All six appendix anchors resolve; `chenyi_2025singularitiesorbitclosuresloop` exists at `refs.bib:213`; the claim that Sakellaridis–Wang has no `refs.bib` key is correct (the key `SW20` is Scholze–Weinstein, not Sakellaridis–Wang). The Caveats' page-level source verification is accurate — I re-read the PDF and confirm Thm 35 (p. 21, Drinfeld), Thm 36(i)–(ii) (p. 21, proved in §5 for symmetric $X$), Rem. 37 (p. 22, extension to general spherical via [SW22, Lemma 2.3.10] and Thm 35), and the unnumbered $L^+Gx_v\\cong\\varprojlim_j L_j^+G/H_j$ on p. 22 inside the Iwahori half of the proof of Thm 36.\n\n**Flaw 1** [MAJOR] — The isomorphism half of (b) — and with it all of (c) — rests on\n\n<details><summary>(Step 4, line 44–50; Caveats, line 56 — the honestly flagged closed-world GAP) · the finding</summary>\n\n$$\nLX_\\lambda \\;=_{\\operatorname{Sub}_{\\mathrm{Shv}}(LX)}\\; \\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda),\n$$\n\nand this identification is nowhere in the closed world. `def:orbits_iwahori_spherical` (main.tex:734–747, verified) posits the poset of $L^+G$-orbits and the locally closed embeddings $i_\\lambda$ without ever defining \"orbit\" sheaf-theoretically; `thm:chen_Ti` states only the two placid presentations; and the Ratified readings section of context.md contains exactly two entries, neither of them this. The draft knows this and says so — the Caveats flag Step 4 as \"a **GAP** unless the reading is ratified or an entry is added\", with an accurate audit trail of what the source does and does not establish. That honesty is exactly what Caveats are for, and the source verification held up under my independent re-read. But the node's Statement claims (b) unconditionally, so an honest GAP on the load-bearing step means the Statement is not certified as proved. Precise scope, which the draft gets right: **(a) and the monomorphism claim of (b) are proved unconditionally**; the isomorphism-onto-$LX_\\lambda$ claim and (c) are conditional on the missing input.\n\nThe exact missing input, for the orchestrator: **an appendix entry (or a ratified reading in context.md) stating, for $X$ smooth affine spherical and each $\\lambda\\in\\Lambda_X^+$ and each $x_\\lambda\\in LX_\\lambda(k)$, that the orbit map induces $K/K_\\lambda\\xrightarrow{\\sim}LX_\\lambda$ as fpqc sheaves** — equivalently, that the stratum of `def:orbits_iwahori_spherical` is the fpqc-sheaf image of the orbit map through each of its $k$-points. The published form the draft points at is Sakellaridis–Wang, Prop. 2.3.7 with Lem. 2.3.10 (Chen–Yi's \"[SW22]\"); the path is: user adds the `refs.bib` key and the PDF to `papers/` (refs.bib is manuscript, humans only), the lead-researcher verifies the statement against the source and writes the external-black-box entry, and the node re-proves. The entry should be quantified over every $k$-point of the stratum — the Statement fixes an *arbitrary* $x_\\lambda\\in LX_\\lambda(k)$, so base-point independence ($K(k)$-transitivity on $LX_\\lambda(k)$, which in the source is Prop 17(i), p. 10, itself resting on [GN10, Thm 8.2.9] and [Nad04, Thm 4.2] and also not in the closed world) must be part of what is ratified, not smuggled.\n\n</details>\n\n**Flaw 2** [MAJOR] — Even granting ratification-by-deference, the proof body misattributes to the source a formulation the source does not use, and the two formulations are not interchangeable inside the closed world.\n\n<details><summary>(Step 4, \"In the sense in force in that entry's source … the orbit through $x_\\lambda$ is the fpqc-sheaf image of its orbit map\") · the finding</summary>\n\nWhat Chen–Yi actually write (p. 22, verified; the Caveat itself reports it correctly) is the pro-scheme description $L^+Gx_v\\cong\\varprojlim_j L_j^+G/H_j$, $H_j$ the jet-images of the stabilizer — and the space $L^+Gx_v$ is never *defined* in the visible text; the isomorphism is asserted, resting (per Lemma 34 and Rem. 37) on [SW22, Lemma 2.3.10]. The canonical map\n\n$$\nK/K_\\lambda \\longrightarrow \\varprojlim_j L_j^+G/H_j\n$$\n\nis a monomorphism, but its being an isomorphism of fpqc sheaves requires fpqc-local surjectivity of $K\\to\\varprojlim_j L_j^+G/H_j$ and $K_\\lambda\\twoheadrightarrow\\varprojlim_j H_j$ — a pro-torsor / Mittag-Leffler statement that is precisely the content the source outsources to [SW22]. Consequences: (i) \"the sense in force in the source\" is not well defined from the source's text, so a ratified reading that merely points at the source would not close Step 4 — the reading or entry must itself state the fpqc-quotient form $LX_\\lambda\\simeq K/K_\\lambda$ (or state the pro-limit form *and* the bridge lemma); (ii) prominence: the proof ends in an unconditional $\\blacksquare$ with the conditionality living only in Caveats — the **GAP** marker belongs at Step 4 in the body, or (b) should be split there into its unconditional and conditional halves. Repair: rewrite Step 4 to display the fork (fpqc-image reading vs. pro-limit reading vs. weak $k$-point reading), mark the GAP inline, and let the repair entry named in Flaw 1 discharge it.\n\n</details>\n\n**Flaw 3** [MINOR] — For the fpqc topology this left adjoint does not exist on all of $\\mathrm{PShv}$ — fpqc covers of an affine form a proper class and sheafification of an arbitrary presheaf fails set-theoretically (Waterhouse's classical observation; the Stacks Project warns against exactly this).\n\n<details><summary>(notation line 6, \"$(-)^{\\#}\\colon \\mathrm{PShv}\\to\\mathrm{Shv}$ the sheafification, left adjoint to the inclusion\") · the finding</summary>\n\nThe draft only ever applies $\\#$ to the one presheaf $P\\colon R\\mapsto K(R)/K_\\lambda(R)$, where the construction does exist: a would-be section is an fpqc $K_\\lambda$-torsor with an equivariant map to $K$, and torsors under the affine $K_\\lambda$ over an affine base are representable by affine faithfully flat schemes (fpqc descent for affine morphisms is effective), which bounds the plus-construction. Repair: one sentence restricting $\\#$ to this $P$ with that boundedness remark (or fix a cutoff cardinal); Step 3's \"left adjoint / left exact\" appeals then apply to the restricted construction verbatim.\n\n</details>\n\n**Flaw 4** [MINOR] — Neither cited location states these formulas: the appendix entry defines $L^nX(R)=X(R[t]/t^n)$ and the presentations, and main.tex:694–718 (verified) likewise.\n\n<details><summary>(Step 1, \"Functorially $K(R)=G(R[[t]])$ and $LX(R)=X(R((t)))$ ([loops, jets and positive loops], main.tex:694–718)\") · the finding</summary>\n\nThe formulas do live in the closed world — in the appendix entry [$F=k((t))$, $\\mathcal{O}=k[[t]]$](../../../../../appendix/conv-ring-of-integers.html) — but that entry is neither linked in the draft nor listed in the node's `objects:`. Repair: link `#conv-ring-of-integers` at first use and have the lead-researcher add it to `objects:`.\n\n</details>\n\n**Flaw 5** [MINOR] — context.md's Notation rule asks equalities of objects to carry the category they live in; the first fiber product is a priori formed in $\\mathrm{Shv}$ and the assertion that it coincides with a scheme is the point of the step. Write $=_{\\mathrm{Shv}}$ (the second equality may then drop it as internal to the first). Cosmetic, but this is the one display where the ambient does work.\n\n<details><summary>(Step 2 display, $K_\\lambda = K\\times_{a_\\lambda,\\,LX,\\,x_\\lambda}\\operatorname{Spec}k = K\\times_{LX^i}\\operatorname{Spec}k$) · the finding</summary>\n\n**Verdict discipline.** Flaws 1–2 are MAJOR: the draft is an honest, precisely scoped conditional proof of an unconditional Statement. The gap is fillable, and the draft has already done the source archaeology the fill requires; nothing in Steps 1–3, 5 needs to change once the Step 4 input exists in the closed world.\n\n</details>\n\nVERDICT: FAIL\n";</script>
