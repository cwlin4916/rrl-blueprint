<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1-L2</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1-L2 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1-L2 — history\n\n[Q1-L4-L1-L2](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by the lead-researcher on commission from `/update` §6 ([ADR 0022](../../../../../process/decisions/0022-update-proposes-nodes-from-failures.html)). It is clauses (b) and (c) of [Q1-L4-L1](../index.html) with everything specific to $LX$ removed: no spherical, placid or loop hypothesis appears, and the argument is orbit–stabilizer and descent for an arbitrary group sheaf acting on an arbitrary sheaf. The external referee report absorbed as [u1](../updates/u1.html) asked for exactly this separation — its \"What is formal\" finding, recomputed there, is that the monomorphism argument and the groupoid argument \"hold for any group sheaf acting on any sheaf\" — and the parent's scope entry, recorded the same day, says the same in its own words. No existing node carries the general statement: the parent asserts it only for $\\mathcal{K} = K$ acting on $\\mathcal{Y} = LX$.\n\n  **Why isolating it is worth a node: formal is not free.** Taking the image as a *sheaf* is where the work is. The pointwise image is in general a proper subfunctor of the sheaf image, so (B) is false with $\\mathcal{K}/\\mathcal{K}_y$ read as the pointwise quotient — the witness is clause (A) of the sibling example node [Q1-L4-L1-e1](../Q1-L4-L1-e1/index.html), which is where that computation now lives.\n\n  **What this node does not reach.** Nothing here says the sheaf image is representable, let alone by a locally closed sub-ind-scheme; that is [Q1-L4-L1-L3](../Q1-L4-L1-L3/index.html), and clause (B) of [Q1-L4-L1-e1](../Q1-L4-L1-e1/index.html) shows it does not follow from the formalism.\n";</script>
