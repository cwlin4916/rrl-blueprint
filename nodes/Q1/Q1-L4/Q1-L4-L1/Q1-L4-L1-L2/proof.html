<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1-L2</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1-L2 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1-L2 — Orbit–stabilizer and descent for a group sheaf action\n\n[node](index.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html) · [DAG index](../../../../../dag.html)\n\n- **uses:** [the standing notation](../../../../../appendix/subsec-notations.html), for the base field $k$ alone. A ready leaf: it rests on no other node and no other appendix entry.\n- **notation:** $\\mathrm{PShv}$, $\\mathrm{Shv}$: presheaves and fpqc sheaves of sets on affine $k$-schemes, evaluated on $k$-algebras $R$; $(-)^{\\sharp}\\colon\\mathrm{PShv}\\to\\mathrm{Shv}$ is sheafification, **left** adjoint to the inclusion $\\iota\\colon\\mathrm{Shv}\\to\\mathrm{PShv}$; $\\mathrm{pt}$ is the terminal sheaf; $y_R\\in\\mathcal{Y}(R)$ is the restriction of $y$ along $\\operatorname{Spec}R\\to\\operatorname{Spec}k$.\n\n## Lemma\n\n**(A) Setting.** Over the base field $k$ of [the standing notation](../../../../../appendix/subsec-notations.html), let $\\mathcal{K}$ be a group sheaf acting on a sheaf $\\mathcal{Y}$ for the fpqc topology on affine $k$-schemes, let $y\\in\\mathcal{Y}(k)$, let $\\mathcal{K}_y\\subseteq\\mathcal{K}$ be the stabilizer subsheaf of $y$, and let $a_y\\colon\\mathcal{K}\\to\\mathcal{Y}$, $g\\mapsto g\\cdot y$, be the orbit map. Write $\\mathcal{K}/\\mathcal{K}_y$ for the fpqc sheafification of the presheaf $R\\mapsto\\mathcal{K}(R)/\\mathcal{K}_y(R)$, and $\\operatorname{im}_{\\mathrm{Shv}}(a_y)\\subseteq\\mathcal{Y}$ for the fpqc sheaf image of $a_y$.\n\n**(B) Orbit–stabilizer.** The map $a_y$ factors through $\\mathcal{K}/\\mathcal{K}_y$ by a monomorphism of fpqc sheaves, and that monomorphism is an isomorphism onto the sheaf image:\n\n$$\n\\mathcal{K}/\\mathcal{K}_y\\ \\xrightarrow{\\ \\sim\\ }\\ \\operatorname{im}_{\\mathrm{Shv}}(a_y).\n$$\n\n**(C) Descent.** There is an equivalence of fpqc quotient stacks\n\n$$\n\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)\\ \\simeq\\ B\\mathcal{K}_y,\n$$\n\ncanonical once $y$ is fixed; for a second base point $y' = g\\cdot y$ with $g\\in\\mathcal{K}(k)$ it replaces $\\mathcal{K}_y$ by the conjugate $g\\mathcal{K}_yg^{-1}$.\n\n## Proof\n\n**Step 1 — the fibres of $a_y$ on $R$-points are the left cosets of $\\mathcal{K}_y(R)$.**\n\n<details><summary>the argument</summary>\n\nThe stabilizer subsheaf of the constant section $y$ is the fibre product $\\mathcal{K}_y=\\mathcal{K}\\times_{a_y,\\mathcal{Y},y}\\mathrm{pt}$, a limit and so computed levelwise:\n\n$$\n\\mathcal{K}_y(R)=\\{g\\in\\mathcal{K}(R)\\ :\\ g\\cdot y_R=y_R\\},\n$$\n\na subgroup of $\\mathcal{K}(R)$. For $g,h\\in\\mathcal{K}(R)$ one has $g\\cdot y_R=h\\cdot y_R$ iff $(h^{-1}g)\\cdot y_R=y_R$ iff $g\\in h\\mathcal{K}_y(R)$.\n\n</details>\n\n**Step 2 — $a_y$ factors in $\\mathrm{PShv}$ through the presheaf quotient by a levelwise injection.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\nQ(R):=\\mathcal{K}(R)/\\mathcal{K}_y(R)=\\{\\,g\\mathcal{K}_y(R)\\ :\\ g\\in\\mathcal{K}(R)\\,\\},\n$$\n\nfunctorial in $R$ because restriction maps are group homomorphisms carrying $\\mathcal{K}_y$ into $\\mathcal{K}_y$. By Step 1 the rule $g\\mathcal{K}_y(R)\\mapsto g\\cdot y_R$ is well defined and injective, so $a_y=\\bar a\\circ p$ in $\\mathrm{PShv}$ with $p\\colon\\mathcal{K}\\to Q$ the projection and $\\bar a\\colon Q\\to\\iota\\mathcal{Y}$ injective on $R$-points for every $R$.\n\n</details>\n\n**Step 3 — after sheafification the factorization persists and $\\bar a^{\\sharp}$ is a monomorphism.**\n\n<details><summary>the argument</summary>\n\nSince $\\mathcal{Y}$ is a sheaf, the unit of the adjunction $(-)^{\\sharp}\\dashv\\iota$ factors $\\bar a$ uniquely through $Q\\to\\iota Q^{\\sharp}$, giving $\\bar a^{\\sharp}\\colon\\mathcal{K}/\\mathcal{K}_y=Q^{\\sharp}\\to\\mathcal{Y}$ in $\\mathrm{Shv}$ with $a_y=\\bar a^{\\sharp}\\circ q$, where $q\\colon\\mathcal{K}\\to Q^{\\sharp}$ is $p$ followed by the unit. In $\\mathrm{PShv}$ limits are levelwise, so monomorphisms are exactly the levelwise injections and $\\bar a$ is one; $(-)^{\\sharp}$ preserves finite limits, hence monomorphisms, so $\\bar a^{\\sharp}$ is a monomorphism in $\\mathrm{Shv}$. As $\\iota$ is a right adjoint it too preserves monomorphisms, so $\\bar a^{\\sharp}$ is levelwise injective: the two senses agree.\n\n</details>\n\n**Step 4 — $\\bar a^{\\sharp}$ is an isomorphism onto $\\operatorname{im}_{\\mathrm{Shv}}(a_y)$, proving (B).**\n\n<details><summary>the argument</summary>\n\nLet $P\\subseteq\\iota\\mathcal{Y}$ be the presheaf image,\n\n$$\nP(R):=\\{\\,g\\cdot y_R\\ :\\ g\\in\\mathcal{K}(R)\\,\\}.\n$$\n\nStep 2 makes $\\bar a$ an isomorphism $Q\\xrightarrow{\\sim}P$ in $\\mathrm{PShv}$, so $\\bar a^{\\sharp}$ is an isomorphism $\\mathcal{K}/\\mathcal{K}_y\\xrightarrow{\\sim}P^{\\sharp}$ over $\\mathcal{Y}$. That $P^{\\sharp}$ is the sheaf image: it is a subsheaf through which $a_y$ factors, by Step 3 applied to $P\\subseteq\\iota\\mathcal{Y}$; and if $\\mathcal{Z}\\subseteq\\mathcal{Y}$ is any subsheaf through which $a_y$ factors then $P(R)\\subseteq\\mathcal{Z}(R)$ inside $\\mathcal{Y}(R)$ for all $R$, whence $P^{\\sharp}\\subseteq\\mathcal{Z}^{\\sharp}=\\mathcal{Z}$ over $\\mathcal{Y}$ by exactness of $(-)^{\\sharp}$. So $P^{\\sharp}$ is the smallest such subsheaf.\n\n</details>\n\n**Step 5 — every section of $\\operatorname{im}_{\\mathrm{Shv}}(a_y)$ is fpqc-locally of the form $g\\cdot y$.**\n\n<details><summary>the argument</summary>\n\nA subpresheaf $P$ of a sheaf $\\mathcal{Y}$ is separated, so one plus-construction already yields a sheaf:\n\n$$\nP^{\\sharp}(R)=\\{\\,s\\in\\mathcal{Y}(R)\\ :\\ s|_{R'}\\in P(R')\\ \\text{for some fpqc cover}\\ R\\to R'\\,\\}.\n$$\n\nWith Step 4: for $z\\in\\operatorname{im}_{\\mathrm{Shv}}(a_y)(R)$ there are a cover $R\\to R'$ and $g\\in\\mathcal{K}(R')$ with $z|_{R'}=g\\cdot y_{R'}$.\n\n</details>\n\n**Step 6 — a morphism of prestacks $\\Phi\\colon B^{\\mathrm{pre}}\\mathcal{K}_y\\to\\mathcal{Q}^{\\mathrm{pre}}$.**\n\n<details><summary>the argument</summary>\n\nLet $\\mathcal{Q}^{\\mathrm{pre}}$ be the prestack in groupoids with objects $\\operatorname{im}_{\\mathrm{Shv}}(a_y)(R)$ over $R$ and\n\n$$\n\\operatorname{Hom}_{\\mathcal{Q}^{\\mathrm{pre}}(R)}(z,z')=\\{\\,g\\in\\mathcal{K}(R)\\ :\\ g\\cdot z=z'\\,\\},\n$$\n\ncomposing first $g\\colon z\\to z'$, then $g'\\colon z'\\to z''$, to $g'g\\colon z\\to z''$; its fpqc stackification is $\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)$. Let $B^{\\mathrm{pre}}\\mathcal{K}_y$ send $R$ to the one-object groupoid with automorphisms $\\mathcal{K}_y(R)$ and the same composition order; its stackification is $B\\mathcal{K}_y$. Set $\\Phi_R(\\ast)=y_R$ and $\\Phi_R(h)=(h\\colon y_R\\to y_R)$, legitimate by Step 1, compatible with composition in that order and with restriction along $R\\to R'$.\n\n</details>\n\n**Step 7 — $\\Phi$ is fully faithful, equivalently $\\mathrm{pt}\\times_{\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)}\\mathrm{pt}\\simeq\\mathcal{K}_y$.**\n\n<details><summary>the argument</summary>\n\nBy Step 1, $\\operatorname{Hom}_{\\mathcal{Q}^{\\mathrm{pre}}(R)}(y_R,y_R)=\\mathcal{K}_y(R)$ and $\\Phi_R$ is the identity of that set; this holds compatibly for every $R\\to R'$, so $\\Phi$ is an isomorphism on $\\operatorname{Hom}$-presheaves. That $\\operatorname{Hom}$-presheaf is the isotropy at $y$, i.e. the self-fibre-product of $\\mathrm{pt}\\xrightarrow{y}\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)$, its group law the composition of Step 6.\n\n</details>\n\n**Step 8 — $\\Phi$ is locally essentially surjective, so (C) holds.**\n\n<details><summary>the argument</summary>\n\nFor $z\\in\\mathcal{Q}^{\\mathrm{pre}}(R)$, Step 5 gives a cover $R\\to R'$ and $g\\in\\mathcal{K}(R')$ with $g\\cdot y_{R'}=z|_{R'}$, i.e. an isomorphism $\\Phi_{R'}(\\ast)\\to z|_{R'}$. A morphism of prestacks in groupoids that is fully faithful and locally essentially surjective induces an equivalence of stackifications, so $B\\mathcal{K}_y\\simeq\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)$; $\\Phi$ used no datum beyond $y$.\n\n</details>\n\n**Step 9 — $\\mathcal{K}_{y'}=g\\mathcal{K}_yg^{-1}$ for $y'=g\\cdot y$, $g\\in\\mathcal{K}(k)$.**\n\n<details><summary>the argument</summary>\n\nThe action map is a morphism of sheaves, so $y'_R=g_R\\cdot y_R$. For $h\\in\\mathcal{K}(R)$: $h\\cdot y'_R=y'_R$ iff $(g_R^{-1}hg_R)\\cdot y_R=y_R$, i.e. iff $h\\in g_R\\mathcal{K}_y(R)g_R^{-1}$.\n\n</details>\n\n**Step 10 — $\\operatorname{im}_{\\mathrm{Shv}}(a_{y'})=\\operatorname{im}_{\\mathrm{Shv}}(a_y)$, giving the last clause of (C).**\n\n<details><summary>the argument</summary>\n\nRight translation $\\rho_g\\colon\\mathcal{K}\\to\\mathcal{K}$, $h\\mapsto hg$, is an automorphism of the sheaf $\\mathcal{K}$ and $a_{y'}=a_y\\circ\\rho_g$, so the presheaf images of Step 4 coincide and hence so do their sheafifications. Steps 8 and 9 applied at $y'$ therefore read $\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)\\simeq B(g\\mathcal{K}_yg^{-1})$.\n\n</details>\n\n## Caveats\n\nThe fpqc site is not small; (A) presupposes fpqc sheafification exists, and (C) stackification. The usual cardinality bound on covers is in force, and nothing above depends on which.\n";</script>
