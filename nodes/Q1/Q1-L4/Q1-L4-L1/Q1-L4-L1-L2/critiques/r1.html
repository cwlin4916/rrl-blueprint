what it is quoted for (the base field $k$). No dependency is invoked — correct, the node has none. Nothing in the appendix covers sheafification or stackification, so every foundational input here has to land as \"standard mathematics needing no citation\"; see the adjudication below.\n\n**No specialization.** I looked for the failure mode named in the brief and did not find it. $\\mathcal{K}$ and $\\mathcal{Y}$ are used only through their $R$-points and the naturality of the action; nothing assumes $\\mathcal{K}$ representable, affine, flat or a group *scheme*, nothing assumes $\\mathcal{Y}$ an ind-scheme, and no placidity, loop or spherical hypothesis appears. Step 10's $\\rho_g$ is an automorphism of the underlying *sheaf* $\\mathcal{K}$ (not of the group sheaf), which is all that is used.\n\n**Handedness.** $(-)^{\\sharp}\\dashv\\iota$ is declared with $(-)^{\\sharp}$ **left** adjoint, which is correct; Step 3 uses the unit $Q\\to\\iota Q^{\\sharp}$ in the right direction; Step 4 uses the counit $(\\iota\\mathcal{Z})^{\\sharp}\\xrightarrow{\\sim}\\mathcal{Z}$ for a sheaf. The draft does **not** commit the standard error of deducing preservation of monos for $(-)^{\\sharp}$ from its being a left adjoint: it invokes the special fact that sheafification is left exact, and separately invokes \"right adjoints preserve monos\" for $\\iota$. Both invocations are correctly handed.\n\n**Push point 1 — Step 3, where sheafification enters.** Both halves check out. The factorization survives because $\\bar a\\colon Q\\to\\iota\\mathcal{Y}$ is a map into (the inclusion of) a *sheaf*, so the adjunction transposes it to $\\bar a^{\\sharp}\\colon Q^{\\sharp}\\to\\mathcal{Y}$ with $\\iota\\bar a^{\\sharp}\\circ\\eta_Q=\\bar a$, hence $a_y=\\bar a^{\\sharp}\\circ q$; no levelwise statement is asserted after sheafifying. The mono survives because sheafification on a site is left exact, and a finite-limit-preserving functor preserves monos. The reconciliation of the two senses of \"monomorphism\" is done correctly and in the only order that works: categorical mono in $\\mathrm{Shv}$ first, then levelwise injectivity by applying the right adjoint $\\iota$ — not the reverse, which would be the fallacy.\n\n**Push point 2 — the site is not small.** Handled honestly in the Caveats, and the mathematics is unaffected; see Flaws 4 and 5 for the two clauses I would still want. Step 5 does **not** need the plus-construction to converge in one step in general: it needs it for the *separated* presheaf $P\\subseteq\\iota\\mathcal{Y}$, and \"separated $\\Rightarrow$ $P^{+}$ is a sheaf\" is true on any site. I checked the displayed formula independently: a matching family for $P$ over $R\\to R'$ is a matching family for $\\mathcal{Y}$, which glues uniquely, so $P^{+}(R)=\\{s\\in\\mathcal{Y}(R): s|_{R'}\\in P(R')\\ \\text{for some cover}\\}$, and separatedness of $P$ is immediate from $P(R)\\subseteq\\mathcal{Y}(R)$.\n\n**Push point 3 — Step 4, the two descriptions of the image.** The proof, not just the claim, is there and is correct: $\\bar a$ is a levelwise bijection onto $P$, so $Q^{\\sharp}\\cong P^{\\sharp}$; $P^{\\sharp}\\hookrightarrow\\mathcal{Y}$ is a subsheaf through which $a_y$ factors (left exactness again); and any subsheaf $\\mathcal{Z}$ through which $a_y$ factors contains $P$ levelwise — legitimately, since $\\mathcal{Z}\\subseteq\\mathcal{Y}$ is levelwise injective by the principle established one step earlier — whence $P^{\\sharp}\\subseteq\\mathcal{Z}^{\\sharp}=\\mathcal{Z}$. Minimality is proved, not assumed, so \"the sheaf image\" of (A) is shown to exist rather than presupposed.\n\n**Push point 4 — composition order in (C).** Verified consistent, and the answer is $B\\mathcal{K}_y$, not $B\\mathcal{K}_y^{\\mathrm{op}}$. In $\\mathcal{Q}^{\\mathrm{pre}}$, $g\\colon z\\to z'$ then $g'\\colon z'\\to z''$ composes to $g'g$, which is forced by the left action: $g'\\cdot(g\\cdot z)=(g'g)\\cdot z$. The same order is imposed on $B^{\\mathrm{pre}}\\mathcal{K}_y$, so its automorphism monoid *is* $\\mathcal{K}_y$ with its own multiplication, and $\\Phi(h'\\circ h)=h'h=\\Phi(h')\\circ\\Phi(h)$. The ambiguity flagged as Flaw 1 of [Q1-L4-L1 r2](../../critiques/r2.html) is closed here: the order is fixed in words, in both prestacks, and they agree.\n\n**Push point 5 — the conjugation clause.** Step 9: $h\\cdot(g_Ry_R)=g_Ry_R \\iff (g_R^{-1}hg_R)\\cdot y_R=y_R$, so $\\mathcal{K}_{y'}(R)=g_R\\mathcal{K}_y(R)g_R^{-1}$ for every $R$ — correct, and since $g\\in\\mathcal{K}(k)$ is global, conjugation by $g$ is a sheaf automorphism of $\\mathcal{K}$ carrying $\\mathcal{K}_y$ onto $\\mathcal{K}_{y'}$. Step 10: $a_{y'}=a_y\\circ\\rho_g$ with $\\rho_g$ an automorphism of $\\mathcal{K}$, so the presheaf images literally coincide, hence so do the sheaf images. Both halves hold, and together they give exactly the clause as written. \"Canonical once $y$ is fixed\" is supported to the extent such a phrase can be: $\\Phi$ is built from $y$ and the action alone, and stackification is functorial.\n\n**Push point 6 — $y$ is a $k$-point.** Explicit and used correctly. The notation line defines $y_R$ as the restriction of $y$ along $\\operatorname{Spec}R\\to\\operatorname{Spec}k$; Step 1 says \"the constant section\"; and constancy is exactly what makes $\\Phi_R(\\ast)=y_R$ compatible with restriction in Step 6. No varying section is smuggled in. (I also checked that $\\mathrm{pt}$ really is $h_{\\operatorname{Spec}k}$ on this site, so $\\mathcal{Y}(k)=\\operatorname{Hom}_{\\mathrm{Shv}}(\\mathrm{pt},\\mathcal{Y})$ and the Step 1 fibre product is the stabilizer; and that $\\mathrm{pt}\\to\\mathcal{Y}$ is automatically a mono, being out of a terminal object, so $\\mathcal{K}_y\\to\\mathcal{K}$ is a mono by base change.)\n\n**Adjudication of the flagged input (Step 8).** *A morphism of prestacks in groupoids that is fully faithful and locally essentially surjective induces an equivalence of stackifications.* I rule this **standard descent theory, requiring no appendix entry**, and I am not flagging it. Reasons, in order of weight. (i) It is the groupoid-level form of a fact the draft already uses uncited and unremarkably at the set level, and it decomposes into two textbook pieces: stackification induces an isomorphism on $\\mathrm{Isom}$ sheaves, and a morphism of stacks that is fully faithful with every object locally in the essential image is an equivalence. (ii) The hypotheses as the draft has them are the *strong* ones — $\\Phi$ is an isomorphism on $\\mathrm{Hom}$ **presheaves**, which implies the isomorphism on $\\mathrm{Isom}$ sheaves the general statement needs — so no gap opens between the fact quoted and the fact required. (iii) Both prestacks here have sheaf-valued $\\mathrm{Isom}$: $\\mathcal{K}_y$ is a fibre product of sheaves (Step 1), and so is the transporter $\\{g\\in\\mathcal{K}: g\\cdot z=z'\\}$; so the applicable form is the simplest one, where stackification only adds objects. (iv) Repository precedent: the same register of fact — \"descent along $c$ identifies the stack with the quotient of its Čech groupoid is standard descent\" — was accepted in the parent's [r2](../../critiques/r2.html) PASS, and demanding an entry here while accepting it there would be inconsistent refereeing, not rigour. (v) It is not a research result of any paper in `papers/`; the local library holds no descent foundations, and inventing a citation for it would be worse than leaving it standard. The prover's disclosure was the right call and costs nothing.\n\n**Hygiene.** All appendix links resolve from the draft's own depth (`../../../../appendix/…` lands in `blueprint/appendix/`); no bare backticked label outside a link; no house macro (`\\sharp` is standard KaTeX, not the `\\sh` of `preamble.tex`); no `\\[`, `\\begin{align}` or `\\begin{equation}`; every display is a `$$` block with a blank line on each side; no bib key or `\\label` is cited at all. The displays in (B) and (C) are covered by the second exception of the `## Notation` convention and I do not ask for subscripts there — but see Flaw 3 for three inline assertions that are not covered.\n\n## Flaws\n\n**Flaw 1** [MINOR] — The draft never checks that the action of $\\mathcal{K}$ **restricts to the sheaf image**.\n\n<details><summary>(Step 6: \"with objects $\\operatorname{im}_{\\mathrm{Shv}}(a_y)(R)$ over $R$ … its fpqc stackification is $\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)$\") · the finding</summary>\n\nWithout that, $\\mathcal{Q}^{\\mathrm{pre}}$ is not the action groupoid of $\\mathcal{K}$ on $\\operatorname{im}_{\\mathrm{Shv}}(a_y)$ and the symbol $\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)$ in (C) is not defined; the step's identification of the stackification is therefore asserted one hypothesis short. The fact is true and one clause long, and both ingredients are already on the page: $P$ is stable because $g\\cdot(h\\cdot y_R)=(gh)\\cdot y_R$, and Step 5's local description transports stability to $P^{\\sharp}$, since $z|_{R'}=h\\cdot y_{R'}$ gives $(g\\cdot z)|_{R'}=(g|_{R'}h)\\cdot y_{R'}$. This is the only flaw with mathematical content, and the only repair I would insist on.\n\n</details>\n\n**Flaw 2** [MINOR] — \"Equivalently\" overstates. What the step proves, and all that Step 8 consumes, is full faithfulness at the **prestack** level.\n\n<details><summary>(Step 7 header: \"equivalently $\\mathrm{pt}\\times_{\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)}\\mathrm{pt}\\simeq\\mathcal{K}_y$\", and the closing sentence \"That $\\operatorname{Hom}$-presheaf is … the self-fibre-product of $\\mathrm{pt}\\xrightarrow{y}\\mathcal{K}\\backslash\\operatorname{im}_{\\mathrm{Shv}}(a_y)$\") · the finding</summary>\n\nThe parenthetical is a statement about the **stackified** quotient, and getting from one to the other needs the extra input that stackification does not change $\\mathrm{Isom}$ sheaves (available here, since both $\\mathrm{Isom}$ presheaves are already sheaves — but unstated). So Step 7 concludes two things, one of them unjustified and decorative, which is also the [ADR 0043](../../../../../../process/decisions/0043-a-proof-step-is-one-claim.html) reading. Deleting the parenthetical and the final clause is the cheapest repair and frees the words Flaw 1 needs.\n\n</details>\n\n**Flaw 3** [MINOR] — Missing ambient subscripts, and here the omission is load-bearing rather than decorative: Step 10 needs equality **as subsheaves of $\\mathcal{Y}$**, not abstract isomorphism of sheaves, and Step 9 likewise inside $\\mathcal{K}$.\n\n<details><summary>(Step 7 header \"$\\simeq\\mathcal{K}_y$\"; Step 9 header \"$\\mathcal{K}_{y'}=g\\mathcal{K}_yg^{-1}$\"; Step 10 header \"$\\operatorname{im}_{\\mathrm{Shv}}(a_{y'})=\\operatorname{im}_{\\mathrm{Shv}}(a_y)$\") · the finding</summary>\n\nNeither exception of the `## Notation` convention applies — the ambient is not one of the two sides, and the two sides do share an ambient. The sibling precedent is explicit: [Q1-L4-L1](../../proof.html) writes $=_{\\operatorname{Sub}_{\\mathrm{Shv}}(LX)}$ and its [r2](../../critiques/r2.html) names that as the compliant form. Repair: $=_{\\operatorname{Sub}_{\\mathrm{Shv}}(\\mathcal{Y})}$, $=_{\\operatorname{Sub}_{\\mathrm{Shv}}(\\mathcal{K})}$, $\\simeq_{\\mathrm{Shv}}$. Cost in words: zero — the render gate splits on whitespace, and these add no space.\n\n</details>\n\n**Flaw 4** [MINOR] — The first half is right and necessary — without such a convention fpqc sheafification genuinely need not exist, so this caveat is not boilerplate.\n\n<details><summary>(Caveats: \"The usual cardinality bound on covers is in force, and nothing above depends on which.\") · the finding</summary>\n\nThe second half is a claim the draft neither needs nor supports as phrased: what the argument actually requires is that the admitted covers form a *topology* (stable under base change, which the plus-construction uses at $R'\\otimes_RR'$, and under composition, which is what makes $P^{+}$ a sheaf in Step 5), and that on the resulting site sheafification is the plus-construction and is left exact (Steps 3 and 4). Say instead that one site is fixed once and for all and that \"sheaf\", \"sheafification\" and \"stackification\" all refer to it; the argument is then uniform in the choice, which is the true content of \"nothing depends on which\".\n\n</details>\n\n**Flaw 5** [MINOR] — The draft never says what a covering is on this site.\n\n<details><summary>(Step 5: \"for some fpqc cover $R\\to R'$\") · the finding</summary>\n\nWriting a cover as a single faithfully flat $R\\to R'$ is the usual convention for $\\mathrm{Aff}_k$ and is harmless — for an affine base every fpqc covering is refined by a finite affine family, whose product is one faithfully flat map — but the displayed plus-construction formula uses that cofinality silently, and so does Step 8. One clause in the `notation:` line fixes it.\n\n</details>\n\n**Flaw 6** [MINOR] (Step 3 header \"the factorization persists **and** $\\bar a^{\\sharp}$ is a monomorphism\"; Step 4 header, which carries the isomorphism, the factorization through $P^{\\sharp}$ and minimality)\nTwo steps carry more than one claim, against [ADR 0043](../../../../../../process/decisions/0043-a-proof-step-is-one-claim.html). I record it and do not press it: splitting costs step headers, the draft is at 895/900, and the right reading of that collision is a signal about the node's size rather than a fault in the write-up.\n\n**Flaw 7** [MINOR] — $\\bar a^{\\sharp}$ is introduced as the adjunct of $\\bar a$ and then used as $(-)^{\\sharp}$ applied to $\\bar a$ when left exactness is invoked.\n\n<details><summary>(Step 3: the symbol $\\bar a^{\\sharp}$) · the finding</summary>\n\nThe two agree only through the counit isomorphism $(\\iota\\mathcal{Y})^{\\sharp}\\xrightarrow{\\sim}\\mathcal{Y}$, which is never named — though the same isomorphism is used again, equally silently, as \"$\\mathcal{Z}^{\\sharp}=\\mathcal{Z}$\" in Step 4. Half a clause, and nothing turns on it.\n\n</details>\n\n## Budget\n\nThe repairs fit. Flaw 1 costs roughly fifteen words, Flaw 2 returns about twelve, Flaw 3 costs none, and Flaws 4–5 are rewordings of clauses already present. Flaws 6 and 7 I do not require. If the prover would rather buy more room, Step 7's second sentence is the only text on the page that no later step uses.\n\nNo FATAL and no MAJOR flaw. (B) and (C), including the conjugation clause, are established in full from nothing but the node's own hypotheses and standard sheaf theory, and the statement stands as written — I looked for a counterexample to (B) with the pointwise quotient replaced by the sheafified one, and to the transitivity that (C) needs, and there is none: Step 5 supplies exactly the local transitivity, and the sheaf image is by construction where it holds.\n\nVERDICT: PASS\n";</script>
