<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1-L1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1-L1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1-L1 — The stabilizer of a loop is a closed subgroup scheme of $L^+G$\n\n[node](index.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html) · [DAG index](../../../../../dag.html)\n\n- **uses:** [the standing notation](../../../../../appendix/subsec-notations.html), [$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../../appendix/conv-ring-of-integers.html). No `depends-on`: this is a ready leaf and rests on no other node.\n- **notation:** $R$ is a commutative $k$-algebra, $R((t)) := R[[t]][t^{-1}]$, $\\mathcal{O}(Y)$ is the ring of functions of an affine $k$-scheme $Y$, and $L^+\\mathbb{A}^n$ is the $k$-functor $R\\mapsto R[[t]]^n$.\n\n## Lemma\n\n**(A) Setting.** Let $G$ be an affine algebraic group over $k$ and let $X$ be an affine $G$-variety of finite type over $k$ ([the standing notation](../../../../../appendix/subsec-notations.html)). Write $K = L^+G$, so that on a $k$-algebra $R$ one has $K(R) = G(R[[t]])$ and $LX(R) = X(R((t)))$ ([$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../../appendix/conv-ring-of-integers.html)). Fix $x\\in LX(k)$ and write $x_R\\in LX(R)$ for its image under $LX(k)\\to LX(R)$.\n\n**(B) Claim.** The stabilizer functor $K_x$, defined on $k$-algebras by\n\n$$\nK_x(R) = \\{\\,g\\in K(R)\\mid g\\cdot x_R = x_R\\ \\text{in}\\ LX(R)\\,\\},\n$$\n\nis represented by a closed subgroup scheme of $K$.\n\n## Proof\n\n**Step 1 — $K$ is representable by an affine group scheme over $k$.**\n\n<details><summary>the argument</summary>\n\nAs $G$ is affine of finite type, fix a closed immersion $G\\hookrightarrow\\mathbb{A}^s$ with vanishing ideal $I_G\\subset k[z_1,\\dots,z_s]$. For $m\\ge 1$ put $L^mG(R) := G(R[t]/t^m)$; under $\\mathbb{A}^s(R[t]/t^m)=R^{ms}$ (coefficients of truncated series) the conditions $f=0$, $f\\in I_G$, become polynomial equations in those $ms$ coordinates, so $L^mG$ is a closed subscheme of $\\mathbb{A}^{ms}_k$. Since $R[[t]]=\\lim_m R[t]/t^m$ and $\\mathrm{Hom}_{k\\text{-alg}}(\\mathcal{O}(G),-)$ preserves limits, $K(R)=\\lim_m L^mG(R)$; a cofiltered limit of affine schemes along affine transition maps is the affine scheme $\\mathrm{Spec}\\,\\mathrm{colim}_m\\,\\mathcal{O}(L^mG)$, with the levelwise group structure.\n\n</details>\n\n**Step 2 — $L^+\\mathbb{A}^n$ is affine and its zero section is a closed immersion.**\n\n<details><summary>the argument</summary>\n\nA $k$-algebra map $k[c_{j,i}]\\to R$ is exactly a tuple $\\big(\\sum_{i\\ge 0}r_{j,i}t^i\\big)_j\\in R[[t]]^n$, so\n\n$$\nL^+\\mathbb{A}^n = \\mathrm{Spec}\\,k[c_{j,i}\\ :\\ 1\\le j\\le n,\\ i\\ge 0].\n$$\n\nThe zero section $0:\\mathrm{Spec}\\,k\\to L^+\\mathbb{A}^n$ is cut out by the ideal generated by all the $c_{j,i}$, hence is a closed immersion.\n\n</details>\n\n**Step 3 — the stabilizer condition may be tested in $n$ coordinates.**\n\n<details><summary>the argument</summary>\n\nAs $X$ is affine of finite type, fix a closed immersion $\\iota:X\\hookrightarrow\\mathbb{A}^n$. A closed immersion is a monomorphism, so $X(S)\\to S^n$ is injective for every $k$-algebra $S$; taking $S=R((t))$ and $LX(R)=X(R((t)))$ ([$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../../appendix/conv-ring-of-integers.html)) gives, for $g\\in K(R)$,\n\n$$\ng\\cdot x_R = x_R\\ \\text{in}\\ LX(R)\\iff \\iota(g\\cdot x_R)=\\iota(x_R)\\ \\text{in}\\ R((t))^n .\n$$\n\nWrite $x_j\\in k((t))$ for the coordinates of $\\iota(x)$ and $x_{R,j}\\in R((t))$ for their images.\n\n</details>\n\n**Step 4 — the action is polynomial in these coordinates.**\n\n<details><summary>the argument</summary>\n\nThe composite $G\\times X\\xrightarrow{a}X\\xrightarrow{\\iota}\\mathbb{A}^n$ has components in $\\mathcal{O}(G)\\otimes\\mathcal{O}(X)$; lift them to $\\tilde a_j=\\sum_{|\\alpha|\\le d}b_{j,\\alpha}y^{\\alpha}\\in\\mathcal{O}(G)[y_1,\\dots,y_n]$. Writing $g^{\\sharp}:\\mathcal{O}(G)\\to R[[t]]$ for the algebra map corresponding to $g\\in K(R)$ and evaluating $\\tilde a_j$ at the $R((t))$-point $(g,x_R)$ of $G\\times X$,\n\n$$\n\\iota(g\\cdot x_R)_j \\;=\\; \\tilde a_j(g,x_R) \\;:=\\; \\sum_{|\\alpha|\\le d} g^{\\sharp}(b_{j,\\alpha})\\,x_R^{\\alpha}.\n$$\n\n</details>\n\n**Step 5 — a denominator bound uniform in $R$ and in $g$.**\n\n<details><summary>the argument</summary>\n\nChoose $N\\ge 0$ with $t^Nx_j\\in k[[t]]$ for all $j$, possible since $x_j\\in k[[t]][t^{-1}]$; then $t^Nx_{R,j}\\in R[[t]]$ for every $R$. As $g^{\\sharp}(b_{j,\\alpha})\\in R[[t]]$ and $x_R^{\\alpha}\\in t^{-N|\\alpha|}R[[t]]\\subseteq t^{-Nd}R[[t]]$, Step 4 gives $\\tilde a_j(g,x_R)\\in t^{-Nd}R[[t]]$. So with\n\n$$\nM := N(d+1)\n$$\n\nboth $t^M\\tilde a_j(g,x_R)$ and $t^Mx_{R,j}$ lie in $R[[t]]$, for all $R$, all $g\\in K(R)$ and all $j$.\n\n</details>\n\n**Step 6 — $\\phi$ is a morphism of $k$-schemes.**\n\n<details><summary>the argument</summary>\n\nDefine $\\phi:K\\to L^+\\mathbb{A}^n$ by\n\n$$\n\\phi_R(g) := \\big(t^M(\\tilde a_j(g,x_R)-x_{R,j})\\big)_{1\\le j\\le n}\\in R[[t]]^n,\n$$\n\nwhich lands in $L^+\\mathbb{A}^n(R)$ by Step 5. It is natural in $R$ because the $\\tilde a_j$ are polynomials and $x_R$ is the image of the fixed $x\\in LX(k)$, so both are compatible with any $R\\to R'$. Source and target are schemes by Steps 1 and 2, so $\\phi$ is a morphism by Yoneda.\n\n</details>\n\n**Step 7 — $K_x=\\phi^{-1}(0)$ as subfunctors of $K$.**\n\n<details><summary>the argument</summary>\n\nIn $R((t))=R[[t]][t^{-1}]$ the element $t$ is invertible, so $t^Mz=0\\iff z=0$ there. Hence $\\phi_R(g)=0$ iff $\\tilde a_j(g,x_R)=x_{R,j}$ for all $j$, iff $\\iota(g\\cdot x_R)=\\iota(x_R)$ by Step 4, iff $g\\cdot x_R=x_R$ in $LX(R)$ by Step 3.\n\n</details>\n\n**Step 8 — $K_x$ is a closed subscheme of $K$.**\n\n<details><summary>the argument</summary>\n\nThe fibre product $K\\times_{\\phi,\\,L^+\\mathbb{A}^n,\\,0}\\mathrm{Spec}\\,k$ represents $R\\mapsto\\phi_R^{-1}(0)$, which is $K_x$ by Step 7. Closed immersions are stable under base change and $0$ is one by Step 2, so $K_x\\hookrightarrow K$ is a closed immersion; in particular $K_x$ is representable.\n\n</details>\n\n**Step 9 — $K_x$ is a subgroup functor of $K$.**\n\n<details><summary>the argument</summary>\n\nFor each $R$ the map $G(R[[t]])\\to G(R((t)))$ is a group homomorphism, and $G(R((t)))$ acts on $X(R((t)))=LX(R)$ by functoriality of $a$. So $K_x(R)$ is the isotropy group of $x_R$ under an action of the group $K(R)$, hence contains $e$ and is stable under product and inverse.\n\n</details>\n\n**Step 10 — conclusion.**\n\n<details><summary>the argument</summary>\n\nMultiplication and inversion of $K$ carry $K_x$-points to $K_x$-points by Step 9, and $K_x\\times K_x$ and $K_x$ are schemes by Step 8, so by Yoneda they restrict to morphisms $K_x\\times K_x\\to K_x$ and $K_x\\to K_x$. With Step 8 this makes $K_x$ a closed subgroup scheme of $K$. $\\square$\n\n</details>\n\n## Caveats\n\nOnly that $G$ is affine of finite type and $X$ affine of finite type were used: not connectedness, reductivity, smoothness, sphericity, nor $\\mathrm{char}\\,k=0$. So the proof holds in the generality of (A), which is weaker than [the standing notation](../../../../../appendix/subsec-notations.html).\n\nSeparatedness of $LX$ is deliberately not invoked — $LX$ is an ind-scheme and no diagonal of it is used. Step 5 replaces the equalizer in $LX$ by one in the affine scheme $L^+\\mathbb{A}^n$; $M$ depends on $x$, on $\\iota$ and on the lift $\\tilde a_j$, while the resulting subfunctor $K_x$ does not.\n";</script>
