<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L4</a><i>›</i><a href="../../index.html">Q1-L4-L1</a><i>›</i><a href="../index.html">Q1-L4-L1-L1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4-L1-L1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L1/Q1-L4-L1-L1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee's summary: I attacked the denominator bound, the landing of $\\phi$ in $L^+\\mathbb{A}^n$, the closed-world budget and the generality claim, and all four hold. The argument is correct and the strategy — replacing the equalizer in the ind-scheme $LX$ by an equalizer in the affine scheme $L^+\\mathbb{A}^n$ after clearing a uniform denominator — is sound and honestly advertised. What I found is eight MINOR defects, one of which (Flaw 2) is load-bearing enough that the next revision should not skip it.\n\n---\n\n## Flaws\n\n**Flaw 1** [MINOR] — The draft declares \"$\\mathcal{O}(Y)$ is the ring of functions of an affine $k$-scheme $Y$\" *on the same bullet list* that links the appendix entry [$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../../../appendix/conv-ring-of-integers.html), whose entire content is that $\\mathcal{O}$ denotes $k[[t]]$.\n\n<details><summary>(location: line 6, `**notation:**`, and line 40, Step 4) · the finding</summary>\n\nLine 5 and line 6 therefore use the glyph $\\mathcal{O}$ with two different meanings one line apart, and $\\mathcal{O}(G)$ in Steps 1 and 4 reads at first glance as \"$\\mathcal{O}$-points of $G$\", i.e. $G(k[[t]]) = K(k)$ — exactly the object the lemma is about. The appendix entry's local-redeclaration allowance is granted to *corroboration files* quoting a source's $\\mathfrak{o}$, $\\varpi$; a `proof.md` is not one, so the draft is not covered by it.\n\nRepair: write $k[G]$ and $k[X]$ for the coordinate rings and delete the clause from the notation line. This is a pure renotation and *frees* about thirteen words.\n\n</details>\n\n**Flaw 2** [MINOR, but load-bearing] — The elements $t^M\\tilde a_j(g,x_R)$ and $t^Mx_{R,j}$ are constructed in $R((t))$, and Step 5 shows they lie in the *image* of $R[[t]]\\to R((t))$.\n\n<details><summary>(location: Step 5, \"both $t^M\\tilde a_j(g,x_R)$ and $t^Mx_{R,j}$ lie in $R[[t]]$\"; Step 6, \"$\\in R[[t]]^n$\") · the finding</summary>\n\nTo define $\\phi_R(g)$ as an element of $L^+\\mathbb{A}^n(R) = R[[t]]^n$ one needs that map to be injective, so that the preimage is unique; otherwise $\\phi_R$ is a relation, not a function, and Step 6's naturality claim and Step 7's \"$\\phi_R(g) = 0$\" are both ill-posed. The draft never says it.\n\nIt is true and cheap: $t$ is a nonzerodivisor in $R[[t]]$ for every commutative ring $R$ (if $t\\sum_i r_it^i = 0$ then every $r_i = 0$), and $R((t)) := R[[t]][t^{-1}]$ is the localization at $t$, whose kernel is the $t$-power torsion. One clause in Step 5 — \"$t$ is a nonzerodivisor in $R[[t]]$, so $R[[t]]\\subseteq R((t))$\" — closes it. I grade it MINOR only because the fact is standard commutative algebra needing no citation; it is not optional.\n\n</details>\n\n**Flaw 3** [MINOR] — $L^+\\mathbb{A}^n$ is *defined* on line 6 as the $k$-functor $R\\mapsto R[[t]]^n$, and $\\mathrm{Spec}\\,k[c_{j,i}]$ is a scheme; what Step 2 establishes is a natural isomorphism of functors on $k$-algebras, i.e. a representability statement, not an equality of two things of the same kind.\n\n<details><summary>(location: Step 2, the display `L^+\\mathbb{A}^n = \\mathrm{Spec}\\,k[c_{j,i} : \\dots]`) · the finding</summary>\n\nPer the `## Notation` section of [context.md](../../../../../../context.html) an $=$ asserted between two objects should name the ambient it is asserted in; neither of the two exceptions applies here (the two sides do share an ambient, the category of $k$-functors, and neither side is the ambient). Write $\\simeq$, or \"$L^+\\mathbb{A}^n$ is represented by $\\mathrm{Spec}\\,k[c_{j,i}]$\". Zero words.\n\n</details>\n\n**Flaw 4** [MINOR] — $\\tilde a_j$ is a lift of $a_j$ along the surjection $k[G][y_1,\\dots,y_n]\\twoheadrightarrow k[G]\\otimes_k k[X]$, so a priori $\\tilde a_j$ can only be evaluated at a point of $G\\times\\mathbb{A}^n$, and the claimed identity $\\iota(g\\cdot x_R)_j = \\tilde a_j(g,x_R)$ needs the observation that the kernel of that surjection is $I_X\\cdot k[G][y]$, which vanishes at $(g,\\iota(x_R))$ *because* $\\iota(x_R)$ is a point of $X$.\n\n<details><summary>(location: Step 4, \"evaluating $\\tilde a_j$ at the $R((t))$-point $(g,x_R)$ of $G\\times X$\") · the finding</summary>\n\nThe value is then independent of the lift. The claim is true; the sentence justifying it is missing, and the draft's own phrasing (\"$R((t))$-point of $G\\times X$\") papers over the very place where the lift is discharged. One clause repairs it.\n\n</details>\n\n**Flaw 5** [MINOR] — $x_R$ is an element of $LX(R) = X(R((t)))$, not a tuple, so $x_R^{\\alpha}$ is not defined by anything the draft has written; the intended meaning is $\\prod_{j}x_{R,j}^{\\alpha_j}$ with $x_{R,j}$ the coordinates fixed at the end of Step 3, i.e. $\\iota(x_R)^\\alpha$.\n\n<details><summary>(location: Steps 4 and 5, the symbol $x_R^{\\alpha}$) · the finding</summary>\n\nSince Step 5's whole bookkeeping runs on this symbol, it should be the one it declares. Repair: write $\\iota(x_R)^{\\alpha}$ throughout, or add \"$x_R^\\alpha := \\prod_j x_{R,j}^{\\alpha_j}$\" to Step 4.\n\n</details>\n\n**Flaw 6** [MINOR] — The tensor product carries no subscript; it is over $k$.\n\n<details><summary>(location: Step 4, \"$\\mathcal{O}(G)\\otimes\\mathcal{O}(X)$\") · the finding</summary>\n\nZero words to fix.\n\n</details>\n\n**Flaw 7** [MINOR] — Step 4 evaluates the action of $g\\in K(R)$ on $x_R$, and the statement (B) asserts \"$g\\cdot x_R = x_R$ in $LX(R)$\", but the sentence that *defines* this action — $K(R) = G(R[[t]])\\to G(R((t)))$ acting on $X(R((t)))$ — appears only in Step 9, five steps later.\n\n<details><summary>(location: Step 4 vs. Step 9 — ordering) · the finding</summary>\n\nUnder [ADR 0043](../../../../../../process/decisions/0043-a-proof-step-is-one-claim.html) a step gives the reason for its own claim; here Step 4's claim leans forward on Step 9. Repair: move Step 9's first clause up, e.g. into the notation line, and let Step 9 keep only the subgroup assertion. Also, \"$G(R((t)))$ acts on $X(R((t)))$ by functoriality of $a$\" is the wrong reason as stated — the relevant point is that the action axioms are identities of morphisms of schemes and therefore hold on $S$-points, functoriality alone giving only that $a$ induces a map.\n\n</details>\n\n**Flaw 8** [MINOR] — Step 10 restricts multiplication and inversion but never mentions the unit section $e\\colon\\mathrm{Spec}\\,k\\to K$, which factors through $K_x$ (Step 9 supplies $e\\in K_x(R)$) and is part of the data of a subgroup scheme; nor does it note that the group axioms are inherited because $K_x\\hookrightarrow K$ is a monomorphism.\n\n<details><summary>(location: Step 10) · the finding</summary>\n\nBoth are immediate; both are one phrase. Also, Step 1's \"along affine transition maps\" is a vacuous hypothesis — every morphism of affine schemes is affine — and deleting it frees four words for the repairs above.\n\n</details>\n\n---\n\n## What I verified, and how\n\nThese are recorded so round 2 need not redo them.\n\n**V1 — the `## Lemma` section is the node's `## Statement` verbatim.** I compared line 10 and lines 12–18 of `proof.md` against lines 19 and 21–27 of `Q1-L4-L1-L1_node.md` character by character, including the two appendix links and the display delimiters. There is no strengthening of (A) and no weakening of (B).\n\n**V2 — the denominator bound of Step 5 is correct and genuinely uniform.** I redid the bookkeeping. Since $x_j\\in k((t)) = k[[t]][t^{-1}]$ there is $N\\ge 0$ with $t^Nx_j\\in k[[t]]$; base change along $k((t))\\to R((t))$ gives $x_{R,j}\\in t^{-N}R[[t]]$ for every $R$. For a multi-index with $|\\alpha| = l\\le d$,\n\n$$\n\\prod_j x_{R,j}^{\\alpha_j}\\in t^{-Nl}R[[t]]\\subseteq t^{-Nd}R[[t]],\n$$\n\nthe inclusion because $N\\ge 0$ and $l\\le d$; the case $\\alpha = 0$ gives $1\\in R[[t]]\\subseteq t^{-Nd}R[[t]]$. The coefficients satisfy $g^{\\sharp}(b_{j,\\alpha})\\in R[[t]]$ *for every* $g\\in K(R)$, because $g\\in K(R) = G(R[[t]])$ is by definition an algebra map $k[G]\\to R[[t]]$ — this is precisely where uniformity in $g$ comes from, and it is airtight: no $g$-dependent denominator can arise. The sum being finite, $\\tilde a_j(g,x_R)\\in t^{-Nd}R[[t]]$. Then with $M = N(d+1)$,\n\n$$\nt^M\\tilde a_j(g,x_R) = t^{N}\\cdot\\big(t^{Nd}\\tilde a_j(g,x_R)\\big)\\in R[[t]],\\qquad\nt^Mx_{R,j} = t^{Nd}\\cdot\\big(t^{N}x_{R,j}\\big)\\in R[[t]].\n$$\n\nSo the bound holds with slack $N$ on the first and $Nd$ on the second; the sharp value is $\\max(N,Nd)$. **There is no off-by-one.** The edge cases check out too: $d = 0$ gives $M = N$ and $\\tilde a_j(g,x_R) = g^\\sharp(b_{j,0})\\in R[[t]]$; $N = 0$ (that is, $x\\in L^+X(k)$) gives $M = 0$ and $\\phi_R(g) = (\\tilde a_j(g,x_R)-x_{R,j})_j$. And $M$ is a function of $N$ (which depends on $x$ and $\\iota$ only, both fixed over $k$) and of $d$ (the lift only): it involves neither $R$ nor $g$, as the Caveats claim.\n\n**V3 — $\\phi$ lands in $L^+\\mathbb{A}^n$ on all of $K$, not only on the stabilizer, so the argument is not circular.** V2 bounds $\\tilde a_j(g,x_R)$ for every $g\\in K(R)$ whatsoever; the stabilizer condition is nowhere used in Step 5. Modulo Flaw 2 the definition of $\\phi_R$ is sound, and naturality holds: for $u\\colon R\\to R'$ one has $x_{R'} = u_*x_R$ (both are images of the fixed $x\\in LX(k)$), $\\tilde a_j$ is a polynomial, and $t^M$ is central, so $\\phi_{R'}(u_*g) = u_*\\phi_R(g)$ in $R'((t))^n$, hence in $R'[[t]]^n$.\n\n**V4 — $LX\\to L\\mathbb{A}^n$ is a monomorphism of functors, and that is what Step 3 needs.** $k[X] = k[y_1,\\dots,y_n]/I_X$ is a quotient, so $X(S) = \\mathrm{Hom}_{k\\text{-alg}}(k[X],S)\\to\\mathrm{Hom}_{k\\text{-alg}}(k[y],S) = S^n$ is injective for every $k$-algebra $S$; take $S = R((t))$ functorially in $R$. Step 3's biconditional follows, and only its nontrivial direction (\"equal in coordinates $\\Rightarrow$ equal in $LX(R)$\") is used, in Step 7.\n\n**V5 — Step 1 is correct.** $R[t]/t^m$ is $R$-free on $1,t,\\dots,t^{m-1}$ naturally in $R$, so $\\mathbb{A}^s(R[t]/t^m)\\cong R^{ms}$ functorially, and the coefficients of $f(z)\\in R[t]/t^m$ for $f\\in I_G$ are $k$-polynomials in the $ms$ coordinates: $L^mG$ is a closed subscheme of $\\mathbb{A}^{ms}_k$. $\\mathrm{Hom}_{k\\text{-alg}}(k[G],-)$ preserves the limit $R[[t]] = \\lim_m R[t]/t^m$, so $K(R) = \\lim_m L^mG(R)$, and $\\mathrm{Hom}(\\mathrm{colim}_m\\,k[L^mG],R) = \\lim_m\\mathrm{Hom}(k[L^mG],R)$ identifies the limit with an affine scheme. $K$ is affine, which is what Steps 6, 8 and 10 need.\n\n**V6 — Step 2 is correct.** $\\mathrm{Hom}_{k\\text{-alg}}(k[c_{j,i}: 1\\le j\\le n,\\ i\\ge 0],R)$ is an unconstrained choice of one element of $R$ per pair, which is $R[[t]]^n$; a polynomial ring on infinitely many variables is fine, and infinitely many equations still cut out a closed subscheme of an affine scheme, since $k[c_{j,i}]\\twoheadrightarrow k$ is surjective. So the zero section is a closed immersion, closed immersions are stable under base change, and Step 8's fibre product $K\\times_{\\phi,L^+\\mathbb{A}^n,0}\\mathrm{Spec}\\,k$ — whose functor of points is $\\{g\\in K(R): \\phi_R(g) = 0\\}$, since $\\mathrm{Spec}\\,k$ has singleton $R$-points — is a closed subscheme of $K$.\n\n**V7 — the Caveats' claim that separatedness of $LX$ is never invoked is honest.** The only injectivity used is $X(S)\\hookrightarrow S^n$ (V4), which is algebra about the quotient $k[y]\\twoheadrightarrow k[X]$ and not a diagonal of $LX$; the only \"equalizer is closed\" input is Step 2's zero section, which is free for an affine scheme. No diagonal, no ind-scheme separatedness, anywhere.\n\n**V8 — the generality audit of the Caveats passes, step by step.** Step 1 uses $G$ affine of finite type only. Step 2 uses nothing about $G$ or $X$. Step 3 uses $X$ affine of finite type only. Step 4 uses that $a$ is a morphism of affine schemes. Step 5 uses only that $x$ is a $k$-point (for a *uniform* $N$ — this is where the hypothesis $x\\in LX(k)$ of (A) is load-bearing, and it is used correctly) and that $d$ is finite. Steps 6–10 use nothing further. Connectedness, reductivity, smoothness, sphericity and $\\operatorname{char}k = 0$ are indeed all unused, as is reducedness of $X$ despite the word \"variety\". The write-up therefore does hold in the stated generality, which is weaker than [the standing notation](../../../../../../appendix/subsec-notations.html) — worth recording, since [Q1-L4-L1](../../index.html) and [Q1-L4-L2](../../../Q1-L4-L2/index.html) consume it in exactly that generality.\n\n**V9 — closed world clean.** The draft cites no bib key, no `main.tex` `\\label`, and no appendix entry beyond the two on the node's `objects:` line; both anchors exist on disk (`blueprint/appendix/subsec-notations.md`, `blueprint/appendix/conv-ring-of-integers.md`), as do `appendix/index.md`, `context.md`, `main_dag.md` and the node file. Every relative link uses `../../../../` , which is correct for depth $d = 3$. No `depends-on` is claimed and none is used. Everything else invoked — Yoneda for affine schemes, base change of closed immersions, limits of affine schemes, $t$ a nonzerodivisor in $R[[t]]$ — is EGA-level and needs no citation.\n\n**V10 — hygiene.** No bare backticked appendix label outside a link; no `preamble.tex` macro (`\\cD`, `\\Sat`, `\\Perf`, `\\Oblv`, `\\IC`, `\\sh`) anywhere; no `\\[`, `\\begin{align}` or `\\begin{equation}`; every display is a `$$` block with blank lines either side; sections are `## Lemma` / `## Proof` / `## Caveats`, matching the sibling drafts. The ambient-subscript convention is respected in substance: the equalities of *elements* are qualified in prose (\"in $LX(R)$\", \"in $R((t))^n$\"), matching the node statement's own phrasing, and the one place the convention bites is Flaw 3.\n\n**V11 — the reading $R((t)) := R[[t]][t^{-1}]$.** [$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../../../appendix/conv-ring-of-integers.html) writes $LX(R) = X(R((t)))$ without defining $R((t))$ for a non-field $R$; the draft supplies the standard definition on its notation line. That is the right reading (it is the one that makes $LX$ an ind-scheme and $L^+X\\to LX$ a monomorphism), it is declared before use, and Step 5's pole-order argument is exactly the argument that this definition supports. Not a flaw — but the appendix entry is thin here, and a future `/update` might consider adding the one line.\n\n## Budget\n\nThe eight repairs cost roughly $+32$ words and free roughly $-17$ (Flaw 1's renotation, Flaw 8's vacuous hypothesis), for a net near $+15$ against the 24 words of headroom. **The repairs fit**; Flaws 3, 5 and 6 are free, and if the count runs tight, Step 1's parenthetical gloss on \"algebraic group\" may be dropped before Flaw 2's clause, which must stay.\n\nVERDICT: PASS\n";</script>
