<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1-L1 — history\n\n[Q1-L4-L1-L1](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by the lead-researcher on commission from `/update` §6 ([ADR 0022](../../../../../process/decisions/0022-update-proposes-nodes-from-failures.html)), answering a failure of the machinery rather than of a proof: closedness of the stabilizer is currently established **twice** in this tree — once as [Q1-L4-L1](../index.html)(a), once as Step 1 of [Q1-L4-L2](../../Q1-L4-L2/index.html)'s draft — and no edge recorded the duplication. Both external referee reports verified today name it: [u1](../updates/u1.html) recomputes the closedness argument for the first, and [u2](../../Q1-L4-L2/updates/u2.html) (\"Refuted\", first bullet) records that the second proves the same fact outright, calling it \"a duplication to be routed through an edge, not a hole\". This node is the one place the fact now lives, and its two `required-by:` edges are that routing. No existing node carries the claim on its own: [Q1-L4-L1](../index.html) bundles it with the formal orbit–stabilizer and with ratified reading 3, and [Q1-L4-L2](../../Q1-L4-L2/index.html) names it in its Setting as a property of $K_\\lambda$ already in hand.\n\n  **What the statement spends.** Affineness of $G$, affineness and finite type of $X$, and nothing further — no sphericality, no smoothness, no placidity, no hypothesis on the characteristic. That is the scope [u1](../updates/u1.html) verified for [Q1-L4-L1](../index.html)(a), and it is why the node is stated for a general affine $G$-variety and a general $x\\in LX(k)$ rather than for the standing $X$ and a stratum point $x_\\lambda$: the specialization $G$ reductive, $X$ smooth affine spherical, $x = x_\\lambda$ is what the two consumers take.\n\n  **The one-page budget is the other reason.** [ADR 0043](../../../../../process/decisions/0043-a-proof-step-is-one-claim.html) reads a write-up that cannot state its steps one at a time as a report that its node is several nodes, and [Q1-L4-L1](../index.html)'s draft sits at $888/900$ words with this argument inside it.\n";</script>
