<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1 — history\n\n[Q1-L4-L1](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-04 — created** by `/decompose` of [Q1-L4](../index.html): the orbit–stabilizer geometry of the cut, isolated as its own one-page obligation. It is the only place where the geometry of the stratum, rather than of the group $K_\\lambda$, enters: the re-derivation of clause (i) in [u1](../updates/u1.html) *assumed* the presentation $LX_\\lambda\\simeq K/K_\\lambda$ and supplied only the descent step (b) $\\Rightarrow$ (c), so the presentation itself — via the placid levels of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) and finite-type orbit theory — is exactly what this node must prove.\n- **2026-08-05 — proved** by `/prove` after 2 rounds ([r1](critiques/r1.html), [r2](critiques/r2.html)). Round 1 failed on the closed-world sense of \"orbit\"; the repair is ratified reading 3 ([ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)) on [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — strata are fpqc-sheaf images, pro-scheme identifications stay theorems — plus the objects line widened by [$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../appendix/conv-ring-of-integers.html). A concurrent session's round-1 ran in the same working tree: its referee report overwrote this session's r1 on disk, and its repair — a transcribed orbit-presentation black box — was reverted per the ADR's considered-and-rejected clause; [r2](critiques/r2.html) reconciles both reports and confirms every flaw of each is resolved.\n- **2026-08-05 — examined and unchanged** by `/update`: the input passage was addressed to clause (i), which is this node, and does not reach it. Clause (i) asserts $K\\backslash LX_\\lambda\\simeq BK_\\lambda$ and asserts nothing about placidity — the statement it doubts is clause (ii), where the objection was answered and disposed of ([u1](../Q1-L4-L2/updates/u1.html)); the descent of Step 5 needs only that $K_\\lambda$ be a closed subgroup scheme, which Step 2 proves outright.\n- **2026-08-05 — statement corrected** by `/update Q1-L4-L1 with input` ([u1](updates/u1.html)), on an external referee report whose verdict was that all three clauses are true. Its one charge held: clause (b) conflated a formal theorem — that $K/K_\\lambda$ is the fpqc-sheaf image of the orbit map — with the identification of that image with the stratum, which ratified reading 3 ([ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)) *posits*, so half of (b) was assumed by the terminology rather than proved. Clause (b) is now split at that seam and a **Scope** section records what is geometry, what is formal and what is convention; the entailed mathematics is unchanged, so the status stays `proved` and [proof.md](proof.html) — whose Step 3 gives the image and Step 4 the identification — argues the revised statement line for line. Two findings came out of the verification and neither touches the claim: the geometric input the report wanted split off is already the black box [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a), reread at pp. 21–22 of the source this run; and the published form of reading 3, Sakellaridis–Wang Prop. 2.3.7 with Lem. 2.3.10, is stated over the nondegenerate locus $\\mathsf{L}^\\bullet X$ while [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) indexes the orbits of the full $LX$ — a gap the orbit of $0$ in $L\\mathbb{A}^1$ under $L^+\\mathbb{G}_m$ makes concrete, now tracked at [P18](../../../../../blueprint/priorities.md).\n- **2026-08-05 — scope recorded**, moved out of the node file: a node's own file carries the field block and the statement and nothing else, so the **Scope** section [u1](updates/u1.html) added to it belongs here, in the entry that explains why it was written. Nothing in it is part of the claim, and the claim is unchanged.\n\n  **What the node is for.** Part (c) is clause (i) of [Q1-L4](../index.html), and it is canonical once $x_\\lambda$ is fixed — another base point conjugates $K_\\lambda$. The identification of the image sheaf with the stratum in (b) is ratified reading 3 ([context.md](../../../../context.html), [ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).\n\n  **What is geometry.** Only (a) is a statement about $LX$, and it spends no more than that $G$ and $X$ are affine with $X$ of finite type — no sphericality, no smoothness, no placidity, no hypothesis on the characteristic. It gives closedness and nothing further: placidity of $K_\\lambda$, its pro-unipotent kernel and its finite-type quotient are clause (ii) of [Q1-L4](../index.html), carried by [Q1-L4-L2](../Q1-L4-L2/index.html).\n\n  **What is formal.** The isomorphism of (b) and the whole of (c) are orbit–stabilizer and descent for fpqc sheaves; they hold for any group sheaf acting on any sheaf. Formal is not the same as free: taking the image as a *sheaf* is doing work, since $\\mathbb{G}_m$ acting on $\\mathbb{G}_m$ by $g\\cdot y = g^n y$ puts $s\\in k[s,s^{-1}]^\\times$ in the fpqc image of the orbit map and not in the naive one.\n\n  **What is convention.** That the image sheaf *is* the locally closed stratum is posited by reading 3, and no argument here establishes it — for an infinite-dimensional group an orbit image need not even be locally closed, as $\\varinjlim_n\\mathbb{G}_a^n$ translating $\\operatorname{Spec}k[x_1,x_2,\\dots]$ shows, its orbit of $0$ being dense and containing no nonempty open. The independent geometric input available in the closed world is [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a), which makes each named $LX_\\lambda$ a placid scheme, open in its placid closure.\n\n  **Where the convention's provenance stops.** The published form of reading 3 — Sakellaridis–Wang, Prop. 2.3.7 with Lem. 2.3.10, not citable here and recorded for provenance only on [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — is stated for the orbits of the nondegenerate locus $\\mathsf{L}^\\bullet X$, whereas [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) indexes the $L^+G$-orbits of the full $LX$. The two differ once $X$ is not homogeneous: for $G=\\mathbb{G}_m$ acting on $X=\\mathbb{A}^1$, which is in the standing class, $K(R)=R[[t]]^\\times$ acts on $LX(R)=R((t))$ and the orbit of $0$ is $\\{0\\}$, an $L^+G$-orbit of $LX$ outside $\\mathsf{L}^\\bullet X$. That stratum is a closed point, so it contradicts nothing above; it marks the gap between the reading's scope and its provenance's, and it is tracked at [P18](../../../../../blueprint/priorities.md).\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged, and expanded rather than corrected. The external report of [u1](updates/u1.html) had already been absorbed on the same day, splitting clause (b) at the seam between the formal theorem and ratified reading 3; what remained unactioned was its structural recommendation, and this run commissions it — the closedness of the stabilizer, the formal orbit–stabilizer with descent, and the representability of the orbit sheaf across the whole of $LX$ become three sub-lemmas, with the report's two false variants a fourth, example node. The statement itself is correct as it stands and is not touched.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
