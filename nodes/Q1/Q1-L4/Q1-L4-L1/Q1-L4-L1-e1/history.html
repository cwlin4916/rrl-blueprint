 live, addressable and on the parent's page. It illustrates and never justifies — the containment is not a dependency ([ADR 0021](../../../../../process/decisions/0021-example-and-analogy-nodes-nest.html)), so no proof node lists it and it lists none.\n\n  **Which clause each one guards.** (A) matches the word *sheaf* in [Q1-L4-L1](../index.html)(b) and in clause (B) of [Q1-L4-L1-L2](../Q1-L4-L1-L2/index.html): specialize the general group sheaf $\\mathcal{K}$ acting on $\\mathcal{Y}$ to $\\mathbb{G}_m$ acting on itself by $n$-th-power scaling, and the isomorphism $\\mathcal{K}/\\mathcal{K}_y\\simeq\\operatorname{im}(a_y)$ is false with both sides read pointwise. (B) matches the clause of (b) that the parent does *not* prove — the identification of the image sheaf with a locally closed stratum, which ratified reading 3 posits ([ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)) — by specializing the group sheaf to an ind-group that is not of finite type: representability by a locally closed subscheme then fails outright. So (B) is why [Q1-L4-L1-L3](../Q1-L4-L1-L3/index.html) has to exist as a theorem rather than a formality.\n\n  **What neither reaches.** Neither computation takes place in $LX$ or involves $K = L^+G$, a spherical variety or a stratum, so neither is a counterexample to anything [Q1-L4-L1](../index.html) asserts: they bound the *generality* in which its clauses could be stated, and say nothing about whether the geometric input of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) suffices in the case at hand.\n- **2026-08-05 — statement re-spaced, no claim changed** by the presentation pass of `/update Q1` ([ADR 0031](../../../../../process/decisions/0031-presentation-is-a-stage-not-a-command.html)). The statement carried a prose paragraph over 90 words; it is now one assertion per paragraph, each opening with its own bolded label, with standalone assertions promoted to their own `$$` displays. The orchestrator ran the content-preservation gate itself: no `VERDICT:`, `EVIDENCE:`, status, type, role, human, created or dependency line changed.\n";</script>
