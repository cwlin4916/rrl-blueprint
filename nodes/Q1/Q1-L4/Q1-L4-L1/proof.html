<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1 — Orbit presentation: $LX_\\lambda \\simeq K/K_\\lambda$ and $K\\backslash LX_\\lambda \\simeq BK_\\lambda$\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the standing notation](../../../../appendix/subsec-notations.html), [$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../appendix/conv-ring-of-integers.html), [loops, jets and positive loops](../../../../appendix/ex-loops-placid.html), [placidity](../../../../appendix/placid-ind-scheme.html), [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) (ratified reading, ADR 0028), [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html), [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html). No node dependencies.\n- **notation:** $\\mathrm{Shv}$ is fpqc sheaves on affine $k$-schemes; $x_{\\lambda,R}\\in LX(R)$ is the image of $x_\\lambda$; $P\\subseteq LX$ is the image presheaf $R\\mapsto K(R)\\cdot x_{\\lambda,R}$.\n\n## Lemma\n\n**Setting.** Fix $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)), a point $x_\\lambda\\in LX_\\lambda(k)$ of its spherical stratum ([Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)). Write $K = L^+G$ ([the standing notation](../../../../appendix/subsec-notations.html)) and set $K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$.\n\n**Claim.** Then:\n\n**(a) Stabilizer.** $K_\\lambda$ is a closed subgroup scheme of $K$.\n\n**(b) Orbit–stabilizer.** The orbit map $a_\\lambda\\colon K\\to LX$, $g\\mapsto g\\cdot x_\\lambda$ induces a monomorphism of fpqc sheaves $K/K_\\lambda\\to LX$, an isomorphism onto its image sheaf; that this image is the stratum is reading 3, not proved here:\n\n$$\nK/K_\\lambda \\xrightarrow{\\ \\sim\\ } \\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda) = LX_\\lambda .\n$$\n\n**(c) Quotient description.** Consequently there is a canonical equivalence of fpqc quotient stacks\n\n$$\nK\\backslash LX_\\lambda \\simeq BK_\\lambda,\n$$\n\nwhere $BK_\\lambda = \\mathrm{pt}/K_\\lambda$ is the classifying stack.\n\n## Proof\n\n**Step 1 — $a_\\lambda$ lands in an affine piece of $LX$.**\n\n<details><summary>the argument</summary>\n\nFunctorially $K(R)=G(R[[t]])$ and $LX(R)=X(R((t)))$ ([$F = k((t))$, $\\mathcal{O} = k[[t]]$](../../../../appendix/conv-ring-of-integers.html)), and $G(R[[t]])\\subset G(R((t)))$ acts on $X(R((t)))$, defining the $K$-action on $LX$ and $a_\\lambda\\colon K\\to LX$, a map of fpqc sheaves ($LX$, a filtered colimit of schemes along closed embeddings, is one, fpqc covers being quasi-compact). By [loops, jets and positive loops](../../../../appendix/ex-loops-placid.html), $K=\\varprojlim_m L^mG$ with affine levels and transitions, so $K$ is affine. Fix a closed embedding $X\\subset\\mathbb{A}^n$. Then $a_\\lambda$ is one point of $LX(A)\\subset A((t))^n$, $A=\\Gamma(K,\\mathcal{O}_K)$; its $n$ coordinates have bounded pole order, so $a_\\lambda$ factors through $LX^i=LX\\cap t^{-i}L^+\\mathbb{A}^n$ for some $i$ with also $x_\\lambda\\in LX^i(k)$. Finally $LX^i$ is a closed subscheme of the affine $t^{-i}L^+\\mathbb{A}^n\\cong L^+\\mathbb{A}^n$, hence affine; $LX^i\\to LX$ is a closed embedding ([loops entry](../../../../appendix/ex-loops-placid.html), [placidity](../../../../appendix/placid-ind-scheme.html)).\n\n</details>\n\n**Step 2 — (a).**\n\n<details><summary>the argument</summary>\n\n$LX^i$ is affine, hence separated over $k$, so $x_\\lambda\\colon\\operatorname{Spec}k\\to LX^i$, a section of a separated morphism, is a closed immersion. Since $LX^i\\to LX$ is a monomorphism of sheaves through which $a_\\lambda$ and $x_\\lambda$ both factor,\n\n$$\nK_\\lambda \\;=_{\\mathrm{Shv}}\\; K\\times_{a_\\lambda,\\,LX,\\,x_\\lambda}\\operatorname{Spec}k \\;=\\; K\\times_{LX^i}\\operatorname{Spec}k,\n$$\n\na closed subscheme of $K$. Its points $K_\\lambda(R)=\\{g\\in K(R):\\ g\\cdot x_{\\lambda,R}=x_{\\lambda,R}\\}$ form the stabilizer subfunctor, a subgroup functorially in $R$: $K_\\lambda$ is a closed subgroup scheme.\n\n</details>\n\n**Step 3 — $K/K_\\lambda$ is the saturation of the image.**\n\n<details><summary>the argument</summary>\n\nFor each $R$, orbit–stabilizer for $K(R)$ acting on $LX(R)$ — $K_\\lambda(R)$ being the stabilizer of $x_{\\lambda,R}$, Step 2 — makes $gK_\\lambda(R)\\mapsto g\\cdot x_{\\lambda,R}$ an isomorphism from the coset presheaf $R\\mapsto K(R)/K_\\lambda(R)$ onto $P$. Let\n\n$$\n\\tilde P(R) \\;=\\; \\{\\,s\\in LX(R)\\ :\\ s|_{R'}\\in P(R')\\ \\text{for some faithfully flat}\\ R\\to R'\\,\\},\n$$\n\na subsheaf of $LX$ (a section glued from sections locally in $P$ is locally in $P$, faithfully flat maps composing). A map $f$ from $P$ to an fpqc sheaf extends uniquely to $\\tilde P$: $P$ is closed under restriction, so the two pullbacks of $f(s|_{R'})$ to $R'\\otimes_RR'$ agree and $f(s|_{R'})$ descends, compatibly under refinement of covers. Hence $\\tilde P$ is the sheafification of $P$ — no global fpqc sheafification functor needed — so the quotient fpqc sheaf $K/K_\\lambda$ of the Statement exists and equals $\\tilde P$, the smallest subsheaf of $LX$ containing $P$, i.e. $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$. In particular $K/K_\\lambda=\\tilde P\\subseteq LX$ is a monomorphism of fpqc sheaves — the first claim of (b) — and $K\\to K/K_\\lambda$ is an epimorphism in $\\mathrm{Shv}$.\n\n</details>\n\n**Step 4 — the image is $LX_\\lambda$; (b).**\n\n<details><summary>the argument</summary>\n\n[Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) supplies the locally closed embedding $i_\\lambda\\colon LX_\\lambda\\to LX$; its ratified reading (ADR 0028) states: the stratum is the fpqc-sheaf image of the orbit map through each of its $k$-points — in particular the fixed $x_\\lambda$. As subsheaves of $LX$,\n\n$$\nLX_\\lambda \\;=_{\\operatorname{Sub}_{\\mathrm{Shv}}(LX)}\\; \\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda).\n$$\n\nWith Step 3, $K/K_\\lambda\\xrightarrow{\\ \\sim\\ }LX_\\lambda$ in $\\mathrm{Shv}$, onto the locally closed sub-ind-scheme; it is $K$-equivariant for left translation, since $a_\\lambda(gu)=g\\cdot a_\\lambda(u)$.\n\n</details>\n\n**Step 5 — descent; (c).**\n\n<details><summary>the argument</summary>\n\nBy (b) and its equivariance, $K\\backslash LX_\\lambda\\simeq K\\backslash(K/K_\\lambda)$ (fpqc quotient stacks). Let $\\bar e\\in(K/K_\\lambda)(k)$ be the base coset — $x_\\lambda$ under (b) — and $c\\colon\\operatorname{Spec}k\\xrightarrow{\\bar e}K/K_\\lambda\\xrightarrow{q}K\\backslash(K/K_\\lambda)$, $q$ the atlas. *(1) $c$ is an effective epimorphism:* an $R$-point lifts fpqc-locally along $q$, then along the sheaf epimorphism $K\\to K/K_\\lambda$ to some $g\\in K(R')$; and $q(g\\cdot\\bar e)$ is canonically isomorphic to $q(\\bar e)$, $q$ coequalizing the action. *(2) Čech groupoid:* a point of $K\\backslash(K/K_\\lambda)$ is a $K$-torsor with equivariant map to $K/K_\\lambda$; $c$ is the trivial torsor with $u\\mapsto u\\cdot\\bar e$. A $T$-point of $\\operatorname{Spec}k\\times_{K\\backslash(K/K_\\lambda)}\\operatorname{Spec}k$ is thus an automorphism of the trivial $K$-torsor — right translation $R_g$ by $g\\in K(T)$ — intertwining the two maps: $ug\\cdot\\bar e=u\\cdot\\bar e$ for all $u$, equivalently $g\\cdot\\bar e=\\bar e$. As $K/K_\\lambda=\\tilde P\\subseteq LX$ (Step 3), this reads $g\\cdot x_{\\lambda,T}=x_{\\lambda,T}$ in $LX(T)$, so $g\\in K_\\lambda(T)$ by Step 2: the fiber product is $K_\\lambda$. Composition is composition of right translations, $R_{g'}\\circ R_g=R_{gg'}$ — the multiplication of $K_\\lambda$ — and both projections are the structure morphism, so the Čech groupoid is $(K_\\lambda\\rightrightarrows\\operatorname{Spec}k)$. *(3)* Descent along $c$ identifies $K\\backslash(K/K_\\lambda)$ with the quotient of its Čech groupoid: canonically $K\\backslash LX_\\lambda\\simeq\\mathrm{pt}/K_\\lambda=BK_\\lambda$. $\\blacksquare$\n\n</details>\n\n## Caveats\n\n**[orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) as cited.** Verified on [[chenyi_2025singularitiesorbitclosuresloop](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] v4, pp. 21–22: Thm 36(i)–(ii) for symmetric $X$; Rem. 37 extends to general spherical $X$, licensing the appendix hypothesis; Thm 35 (Drinfeld) matches the [loops entry](../../../../appendix/ex-loops-placid.html). Step 4 invokes only the ratified reading on [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — no pro-scheme presentation of the orbit is used; its provenance (Sakellaridis–Wang, no `refs.bib` key) lives on that entry.\n";</script>
