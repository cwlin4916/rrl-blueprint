<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L4</a><i>›</i><a href="../../index.html">Q1-L4-L1</a><i>›</i><a href="../index.html">Q1-L4-L1-L3</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u1 — the node stops claiming to replace the reading it cannot reach, and states what it proves</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L4-L1-L3](../index.html) · [history](../history.html) · [DAG index](../../../../../../dag.html) · [appendix](../../../../../../appendix/index.html)\n\nRun: `/update Q1-L4-L1-L3`, at the user's direction, as part of clearing the red layer of the\nDAG. The lead was this node's own [r1 critique](../critiques/r1.html), verdict `VERDICT: FAIL`,\nFlaw 1 at MAJOR. No external passage was supplied.\n\n## The defect, in one sentence\n\nClause **(B)** takes the fpqc-sheaf image $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ as its\nsubject and the node was commissioned to establish its geometry *without* quoting ratified\nreading 3, and no route from that subject to any provable content exists inside the node's\nclosed world — so the clause as written cannot be discharged by any prover.\n\n## What was verified, refuted, left unverified\n\n**Verified — the obstruction is structural, not a prover's failure.**\n[orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) is transcribed\n\"with orbits and embeddings as in\n[Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html)\",\nso the objects it speaks about are already the reading's objects. Strip\n[reading 3](../../../../../../context.html) and what the write-up's Steps 2–6 prove is a\nstatement about the **named stratum** — placid, open in its closure, locally closed in $LX$ —\nin which $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ does not occur at all. The only bridge\nfrom the clause's subject to the write-up's content is the reading the node exists to remove.\nThe r1 prover saw this, declined the commission explicitly rather than quietly, and said\nwhich halves were which; no step of the draft is wrong.\n\n**Verified — the escape route is closed, but for one reason and not the two on record.**\n[Q1-L4-L1's u1](../../updates/u1.html) and [r1](../critiques/r1.html) both say Chen–Yi has no\n`refs.bib` key. **That is false, and is corrected here:** the key is\n`chenyi_2025singularitiesorbitclosuresloop` at `refs.bib`:213 and the PDF is on disk, already\nread at page level by this node's own r2 prover. What is unkeyed is Sakellaridis–Wang, and\nonly the user adds keys.\n\nThe second reason stands and is sufficient alone. Transcribing Lemma 34 \"smuggles the same\ndependence one layer down\": its object is\n$LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^{+}\\mathcal{X}^{\\bullet}_\\lambda$,\ndefined through the fibrewise open $G$-orbit, so it presents the **named stratum** and supplies\nno bridge from $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ to it. Ratified reading 3 says in\nas many words that it \"does *not* identify the image with any pro-scheme presentation — that\nstays a theorem where a node needs it\", and Lemma 34 is such a presentation, not that theorem.\nSo the identification is still not reachable by another prover round, and r1 says in as many\nwords that it is not asking for one.\n\n**Verified — real content remains, so the node is not empty.** Steps 2–6 establish, for the\nnamed stratum and from\n[orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) alone, that it is\na placid scheme, locally closed in $LX$ and open in its closure — together with the scope\nclause that this holds for **every** $\\lambda\\in\\Lambda_X^+$, the index set running over the\n$L^{+}G$-orbits of all of $LX$ rather than only those meeting a prescribed open\nsub-ind-scheme. That scope clause is the reason the node was cut in the first place and it\nsurvives intact.\n\n**Left unverified — whether clause (a)'s generality itself rests on a nondegenerate locus.**\n[r1](../critiques/r1.html) Flaw 2 records that the source proves Theorem 36 about Lemma 34's\nobject with $\\lambda$ ranging over the *symmetric* index set $\\Lambda_S^+$, where $X$ is\nhomogeneous and degeneracy does not arise. If that narrowing is real it constrains\n[orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) itself and so\nevery node resting on it, not merely this one. It is recorded rather than resolved: the source\nis keyed and on disk, so this is answerable by a page-level reading, and it is left open only\nbecause it is a question about an appendix entry rather than about this node.\n\n## The old clause (B), verbatim\n\n> **(B) Representability.** The sheaf $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ is\n> represented by a sub-ind-scheme of $LX$ which is a placid scheme, locally closed in $LX$ and\n> open in its closure; and this holds for **every** $\\lambda\\in\\Lambda_X^+$, that index set\n> running over the $L^+G$-orbits of the whole of $LX$ and not only over those meeting a\n> prescribed open sub-ind-scheme of it.\n\n## The new statement\n\nClause **(B)** changes subject, from the image sheaf to the named stratum, and a new clause\n**(C)** states in the node's own voice what is *not* being proved, so that a reader cannot\nmistake the node for having discharged the reading. The setting **(A)** is untouched apart\nfrom no longer needing to introduce the image sheaf.\n\nThe identification $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda) = LX_\\lambda$ stays exactly\nwhere [ADR 0028](../../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)\nput it — in ratified reading 3, whose own text already calls representability by the named\nlocally closed sub-ind-schemes \"the entry's definitional content\".\n\n## What this does to [Q1-L4-L1](../../index.html)\n\nNothing to its `## Statement`, which already discloses the dependence: its clause (b) reads\n\"that this image is the stratum is reading 3, not proved here\". Its `## Decomposition`\nparagraph, however, described this node as supplying \"the identification with the stratum\n$LX_\\lambda$ that (b) currently quotes from ratified reading 3 rather than establishes\", and\nthat sentence is now false. It is corrected in the same run to say what this node supplies —\nthe geometry of the stratum — with the identification left to the reading. A decomposition\nparagraph says *why* the sub-lemmas reassemble, so a stale one is a false claim about the\nargument rather than commentary.\n\n## Considered and not adopted\n\n**Commissioning an appendix entry that makes the identification a theorem**, the first of the\ntwo remedies [r1](../critiques/r1.html) offers. Rejected, though **not** for the reason the prior\nrecord gives. Chen–Yi is keyed and on disk, so an entry transcribing its Lemma 34 is writable\ntoday; it simply does not help, because Lemma 34 presents the *named stratum* as a fibre product\nand supplies no bridge from the image sheaf to it — precisely the pro-scheme presentation\nratified reading 3 declines to identify with the image. An entry that would help must come from\nSakellaridis–Wang, which is unkeyed, and only the user adds keys.\n\n**Splitting Step 5 into a child node** (\"a quasi-compact open subscheme of a placid scheme is\nplacid\"), which r1 suggests as a way to free ~150 words. Not adopted *as the response to Flaw\n1*: r1 itself says the statement revision frees ~120 words by collapsing Steps 1 and 7, which\nis the more honest saving, and the draft's budget problem was a symptom of the clause it could\nnot prove. The split remains available and is worth taking if the redraft runs long.\n\n**Retracting the node.** Rejected: the scope clause — every $\\lambda\\in\\Lambda_X^+$, over all\nof $LX$ — is load-bearing for [Q1-L4-L1](../../index.html) and is proved here, and the\nplacidity and openness are what\n[Q1-L4](../../../index.html) consumes downstream.\n";</script>
