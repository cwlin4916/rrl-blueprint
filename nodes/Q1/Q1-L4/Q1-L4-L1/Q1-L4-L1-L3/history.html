<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1-L3 — history\n\n[Q1-L4-L1-L3](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-05 — created** by the lead-researcher on commission from `/update` §6 ([ADR 0022](../../../../../process/decisions/0022-update-proposes-nodes-from-failures.html)), to establish independently what a convention currently assumes. It is the geometric obligation that the rest of [Q1-L4-L1](../index.html) quotes rather than proves: [Q1-L4-L1-L2](../Q1-L4-L1-L2/index.html) is formal and says nothing about representability, and clause (B) of [Q1-L4-L1-e1](../Q1-L4-L1-e1/index.html) shows representability by a locally closed subscheme does not follow from the formalism. No existing node claims it: the parent's clause (b) names the stratum by way of the reading below.\n\n  **This node must not be discharged by quoting the definition.** Ratified reading 3 ([context.md](../../../../../context.html), [ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded as a note on [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html)) makes the identification of the orbit image with the named locally closed stratum *definitional* inside the closed world. So a write-up that cites the reading has proved nothing, and the node exists precisely to establish, on independent grounds, what the convention posits. The referee report absorbed as [u1](../updates/u1.html) called the parent \"partially tautological\" for exactly this reason, and the reply there — that the geometric input is already an appendix black box — is what this node is to make good on.\n\n  **The one independent input available in the closed world** is [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a), general spherical via the source's Remark 37 and reread at pp. 21–22 during [u1](../updates/u1.html): its clause 1 makes $\\overline{LX}_\\lambda$ an irreducible placid scheme with $\\overline{i}_\\lambda$ closed and finitely presented, and its clause 2 makes $j_\\lambda\\colon LX_\\lambda\\to\\overline{LX}_\\lambda$ a finitely presented open embedding. Clause (b) of that entry is not what is wanted here and carries its own generality caveat.\n\n  **Where the convention's provenance stops, and why clause (B) says \"every\".** The published form of reading 3 — Sakellaridis–Wang Prop. 2.3.7 with Lem. 2.3.10, **not citable** here and recorded for provenance only on [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) — is stated over the nondegenerate locus $\\mathsf{L}^\\bullet X$, whereas [$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html) indexes the $L^+G$-orbits of the full $LX$. The orbit of $0$ in $L\\mathbb{A}^1$ under $L^+\\mathbb{G}_m$ — a case inside the standing class, with $K(R) = R[[t]]^\\times$ acting on $LX(R) = R((t))$ and orbit $\\{0\\}$ — is the concrete case in the gap, recomputed in [u1](../updates/u1.html). It contradicts nothing, being a closed point, but it is why the quantifier is stated and not left implicit. The user action that would close the provenance gap is tracked at [P18](../../../../../../blueprint/priorities.md).\n\n- **2026-08-07 — the node stops claiming to replace the reading it cannot reach, and states what it proves.** `/update Q1-L4-L1-L3`, at the user's direction, as part of clearing the red layer. The record is [u1](updates/u1.html); the lead was this node's own [r1](critiques/r1.html), verdict `FAIL`, Flaw 1 at MAJOR.\n\n  **The defect.** Clause **(B)** took the fpqc-sheaf image $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ as its subject, and the node's commissioning entry of 2026-08-05 forbade discharging it by quoting ratified reading 3. No route from that subject to any provable content exists in this closed world: [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) is transcribed \"with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html)\", so its objects are already the reading's objects, and stripping the reading leaves Steps 2–6 proving a statement in which the image sheaf does not occur.\n\n  **Why this is not a prover's failure.** The r1 prover saw the instruction, declined it explicitly rather than quietly, and said which halves rested on the grant; no step of the draft is wrong. The referee looked for the independent route and found none, and the escape route is blocked, though for one reason and not the two on record. [Q1-L4-L1's u1](../updates/u1.html) and [r1](critiques/r1.html) both say Chen–Yi is unkeyed, and **that is false**: the key is `chenyi_2025singularitiesorbitclosuresloop` at `refs.bib`:213, with the PDF on disk and read at page level by this node's own r2 prover. What is unkeyed is Sakellaridis–Wang. The remaining reason is sufficient alone: transcribing Lemma 34 smuggles the same dependence one layer down, its object being defined through the fibrewise open $G$-orbit, so it presents the named stratum and supplies no bridge from the image sheaf to it.\n\n  **What replaced it.** Clause **(B)** changes subject to the named stratum: $LX_\\lambda$ is a placid scheme, locally closed in $LX$ and open in its closure, for every $\\lambda\\in\\Lambda_X^+$. Two Scope paragraphs now say in the node's own voice what is not proved — the identification, which stays where [ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html) put it — and what is, the scope clause being the load-bearing part, since it is what lets [Q1-L4-L1](../index.html) quantify over every $\\lambda$ without a further hypothesis.\n\n  **What moved in the parent.** [Q1-L4-L1](../index.html)'s `## Statement` is untouched: its clause (b) already read \"that this image is the stratum is reading 3, not proved here\". Its `## Decomposition` described this node as supplying the identification, and that sentence was false as of this run, so it was corrected in the same pass — a decomposition paragraph says why the sub-lemmas reassemble, so a stale one is a false claim about the argument rather than commentary. The parent's status is unchanged, its statement not having moved.\n\n  **What is owed, and by whom.** A `refs.bib` key for **Sakellaridis–Wang**, which is the user's alone to add — not for Chen–Yi, which is already keyed. Chen–Yi's Lemma 34 is transcribable today and does not reach the identification; SW22 Lemma 2.3.10, which is what Lemma 34's own proof invokes, is the source that would. With it the identification becomes writable as an appendix entry and clause **(B)** can be restored to its stronger form. Also left open by [r1](critiques/r1.html) Flaw 2: whether clause (a)'s own generality is narrowed to a nondegenerate locus, the source proving its theorem with $\\lambda$ over the symmetric index set $\\Lambda_S^+$ — if real that constrains [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) itself and every node resting on it.\n\n- **2026-08-07 — PASS at r2, on the strength of the statement change rather than a better argument.** `/prove Q1-L4-L1-L3`, one round, written as [r2](critiques/r2.html); the draft is [proof.md](proof.html), 1242/1500 words, of which 242 are the statement copied verbatim. Old Step 1 (the reading grant) and old Step 7 (the collapse to the image sheaf) were deleted, not rewritten.\n\n  **The check that mattered.** The referee verified by exhaustion that ratified reading 3 has not crept back: $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ occurs exactly once in the write-up, inside the Scope paragraph it must reproduce verbatim, and in no step, caveat or display. It further checked that no step *needs* it — the scheme-hood of $LX_\\lambda$ now comes from \"open embedding into a scheme\", a reading-free route, and Steps 2–3 read $j_\\lambda$ and $i_\\lambda$ off the body of [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) rather than off the reading's note.\n\n  **The scope clause is established and not assumed.** Steps 4, 5 and 7 are $\\lambda$-free, and Steps 1, 2, 3 and 6 quote entries with unrestricted quantifiers, so the clause is inherited from those quantifiers — which the referee notes is the only sense the closed world admits. The residual risk is relocated to a Caveat against [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) itself, where it belongs.\n\n  **Two MINORs were the statement's, not the draft's, and were fixed here.** The Scope said clause **(B)** \"follows from `thm:chen_Ti`(a) alone\", which the draft's own steps show is elliptical for \"clause (a) and not clause (b)\"; it now says that. And the title still advertised \"sub-ind-scheme\" from the pre-revision subject, when the stratum is a placid *scheme* locally closed in $LX$; the title now matches clause **(B)**.\n\n  **A correction to this node's own record.** Both [Q1-L4-L1's u1](../updates/u1.html) and [r1](critiques/r1.html) assert that Chen–Yi has no `refs.bib` key. That is false: the key is `chenyi_2025singularitiesorbitclosuresloop` at `refs.bib`:213 and the PDF is on disk, re-read at pp. 20–23 by both the r2 prover and the r2 referee. Sakellaridis–Wang is the unkeyed source, and it is the one that would break the circle, being what Lemma 34's own proof invokes.\n";</script>
