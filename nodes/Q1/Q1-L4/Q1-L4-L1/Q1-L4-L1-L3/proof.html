<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1-L3</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1-L3 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4-L1-L3 — Every spherical orbit stratum is a locally closed placid sub-ind-scheme of $LX$, open in its closure\n\n[node](index.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html) · [DAG index](../../../../../dag.html)\n\n- **uses:** [the standing notation](../../../../../appendix/subsec-notations.html), [$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html), [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html), [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) — clause (a) only, [placidity](../../../../../appendix/placid-ind-scheme.html). A ready leaf: `depends-on` is empty, so no assumed dependency enters. No step below invokes ratified reading 3, and $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ occurs nowhere in the argument.\n- **notation:** every $=$ and $\\simeq$ below is an assertion in schemes over $k$; for a placid presentation $Z\\simeq\\varprojlim_{i\\in I}Z_i$ we write $p_{ji}\\colon Z_j\\to Z_i$ ($j\\ge i$) for its transitions and $p_i\\colon Z\\to Z_i$ for its projections.\n\n## Lemma\n\n**(A) Setting.** Let $X$ be a smooth affine spherical $G$-variety in the standing class of [context.md](../../../../../context.html), and write $K = L^+G$ ([the standing notation](../../../../../appendix/subsec-notations.html)). Fix $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) and write $LX_\\lambda\\subseteq LX$ for the corresponding stratum ([Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html)).\n\n**(B) Geometry of the stratum.** $LX_\\lambda$ is a placid scheme ([placidity](../../../../../appendix/placid-ind-scheme.html)), locally closed in $LX$ and open in its closure ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html)); and this holds for **every** $\\lambda\\in\\Lambda_X^+$, that index set running over the $L^+G$-orbits of the whole of $LX$ and not only over those meeting a prescribed open sub-ind-scheme of it.\n\n**Scope — what this node does not prove.** Fix $x_\\lambda\\in LX_\\lambda(k)$ and let $a_\\lambda\\colon K\\to LX$, $g\\mapsto g\\cdot x_\\lambda$, be its orbit map. That the fpqc-sheaf image $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ *is* the stratum $LX_\\lambda$ is ratified reading 3 of [context.md](../../../../../context.html), and it is not established here. The node was commissioned to establish it on independent grounds, and no such route exists inside this closed world: [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) is transcribed with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html), so its objects are already the reading's objects, and every source that would break the circle is unkeyed ([u1](updates/u1.html)).\n\n**Scope — what it does prove, and why that is worth a node.** Clause **(B)** is about the named stratum and follows from [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) alone. Its load-bearing part is the final clause: the index set runs over the $L^+G$-orbits of all of $LX$, not merely those meeting some prescribed open sub-ind-scheme, which is what lets [Q1-L4-L1](../index.html) quantify over every $\\lambda$ without a further hypothesis.\n\n## Proof\n\n**Step 1 — $\\overline{LX}_\\lambda$ is a placid scheme.**\n\n<details><summary>the argument</summary>\n\nThis is [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a)(1), read for the reduced closure that [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html) fixes — that entry supplies what the closure *is* and imports placidity from here. Its hypothesis holds: $X$ is smooth affine spherical, being in the standing class of [context.md](../../../../../context.html), and clause (a) is stated in that generality by the entry's hypotheses note, resting on Remark 37, p. 22 of [[chenyi_2025singularitiesorbitclosuresloop](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (v4, read on disk).\n\n</details>\n\n**Step 2 — $LX_\\lambda$ is an open subscheme of its closure $\\overline{LX}_\\lambda$.**\n\n<details><summary>the argument</summary>\n\n[Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) supplies the open embedding $j_\\lambda\\colon LX_\\lambda\\to\\overline{LX}_\\lambda$; by Step 1 the target is a scheme, and an open subobject of a scheme is a scheme. That target is the closure of $LX_\\lambda$ in $LX$ by [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html), so this is openness in the closure.\n\n</details>\n\n**Step 3 — $LX_\\lambda$ is locally closed in $LX$.**\n\n<details><summary>the argument</summary>\n\n[Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) makes the composite $i_\\lambda=\\overline{i}_\\lambda\\circ j_\\lambda\\colon LX_\\lambda\\to LX$ a locally closed embedding, and by Step 2 its source is a scheme.\n\n</details>\n\n**Step 4 — a placid scheme admits a placid presentation indexed by a *directed* poset.**\n\n<details><summary>the argument</summary>\n\n[placidity](../../../../../appendix/placid-ind-scheme.html) supplies a **cofiltered** limit $Z\\simeq\\varprojlim_{i\\in I}Z_i$ of finite-type $k$-schemes with smooth affine transitions, and not a directed one. Every cofiltered diagram admits a cofinal functor from a directed poset; refining along it preserves the limit, and preserves both conditions, because the new terms are old terms and the new transitions are arrows of the old diagram — composites of old transitions — while smooth and affine are each closed under composition. Below, $I$ is directed; being cofiltered it is also nonempty.\n\n</details>\n\n**Step 5 — $\\overline{LX}_\\lambda$ is quasi-compact.**\n\n<details><summary>the argument</summary>\n\nFix a directed placid presentation $\\overline{LX}_\\lambda\\simeq\\varprojlim_{i\\in I}Z_i$ (Steps 1 and 4) and an index $i\\in I$. As $\\{j\\ge i\\}$ is cofinal in $I$, we may compute $\\overline{LX}_\\lambda\\simeq\\varprojlim_{j\\ge i}Z_j$ as a directed limit of schemes affine over $Z_i$, so $p_i$ is affine and therefore quasi-compact. Its target $Z_i$ is of finite type over $k$, therefore quasi-compact. A quasi-compact morphism whose target is quasi-compact has quasi-compact source.\n\n</details>\n\n**Step 6 — $LX_\\lambda$ is quasi-compact.**\n\n<details><summary>the argument</summary>\n\n[orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a)(2) makes $j_\\lambda$ finitely presented. I read this in the EGA sense — locally of finite presentation, quasi-compact and quasi-separated — so $j_\\lambda$ is quasi-compact, and by Step 5 its target is quasi-compact, whence the source is. The source's own notion is instead the placid one, the entry's provenance note quoting \"$j_\\lambda$ a placid fp-open embedding\" obtained by Noetherian descent at a finite level; no definition of that notion is in this closed world, so the argument runs under the EGA reading throughout. The choice is not load-bearing: quasi-compactness of $j_\\lambda$ is all this step consumes.\n\n</details>\n\n**Step 7 — a quasi-compact open subscheme $U$ of a placid scheme $Z$ is placid.**\n\n<details><summary>the argument</summary>\n\nFix a directed placid presentation $Z\\simeq\\varprojlim_{i\\in I}Z_i$ (Step 4). Each $Z_i$ is noetherian, hence quasi-compact and quasi-separated, and each $p_i$ is affine by the computation of Step 5, which used nothing about $\\overline{LX}_\\lambda$ beyond its presentation. Limit theory along affine transitions over a directed index (EGA IV §8) yields an index $i$ and a quasi-compact open $U_i\\subseteq Z_i$ with $U=p_i^{-1}(U_i)$. Set\n\n$$\nU_j \\;:=\\; p_{ji}^{-1}(U_i)\\ \\subseteq\\ Z_j \\qquad (j\\ge i).\n$$\n\nEach $U_j$ is a quasi-compact open in a finite-type $k$-scheme, hence of finite type. From $p_{ji}\\circ p_{j'j}=p_{j'i}$ we get $U_{j'}=Z_{j'}\\times_{Z_j}U_j$, so each transition $U_{j'}\\to U_j$ is a base change of $p_{j'j}$, hence smooth and affine. As $\\{j\\ge i\\}$ is directed and cofinal in $I$,\n\n$$\n\\varprojlim_{j\\ge i}U_j \\;\\simeq\\; \\Big(\\varprojlim_{j\\ge i}Z_j\\Big)\\times_{Z_i}U_i \\;=\\; p_i^{-1}(U_i) \\;=\\; U,\n$$\n\nwhich exhibits a placid presentation of $U$.\n\n</details>\n\n**Step 8 — $LX_\\lambda$ is a placid scheme.**\n\n<details><summary>the argument</summary>\n\nApply Step 7 with $Z=\\overline{LX}_\\lambda$, placid by Step 1, and $U=LX_\\lambda$, open in $Z$ by Step 2 and quasi-compact by Step 6.\n\n</details>\n\n**Step 9 — the three conclusions hold for every $\\lambda\\in\\Lambda_X^+$.**\n\n<details><summary>the argument</summary>\n\nNo step above restricted $\\lambda$. [$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html) indexes the $L^+G$-orbits of $LX$ itself, with no locus prescribed; [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) names $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ as the poset of those orbits; and [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a), as the appendix states it, is quantified over the orbits of that same entry. So Steps 2, 3 and 8 give (B) at every $\\lambda$. $\\blacksquare$\n\n</details>\n\n## Caveats\n\n**The scope clause rests on how clause (a) is quantified, not on a page.** On p. 21 of [[chenyi_2025singularitiesorbitclosuresloop](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] the source proves its Theorem 36 for $\\lambda$ ranging over the *symmetric* index set $\\Lambda_S^+$, about the object of its Lemma 34, which is defined through the fibrewise open $G$-orbit; Remark 37 then extends it to general spherical $X$. If that generality is in truth confined to a nondegenerate locus, the narrowing constrains [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) itself, hence Steps 1 and 6 here and every node resting on that entry — it is not an exposure peculiar to this argument. Settling it needs transcriptions of that Lemma 34 and of the Sakellaridis–Wang lemma Remark 37 leans on, which has no `refs.bib` key; recorded, not resolved.\n\n**The grants force the stratum to be reduced.** [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html) fixes the closure with the reduced scheme structure and [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) makes $j_\\lambda$ an open embedding into it, so the scheme of Step 2 is reduced. That is a constraint carried in with the grants rather than a consequence of anything proved, and it is benign only because $k$ has characteristic $0$.\n\n**Which clause of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) is consumed.** Only (a): part (1) in Step 1, part (2) in Step 6. Clause (b) is not used — no $\\varinjlim$ and no presentation of $LX$ occurs above — so no step needs $X$ symmetric or $G^\\theta$ connected.\n";</script>
