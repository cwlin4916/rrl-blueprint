<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L4</a><i>›</i><a href="../../index.html">Q1-L4-L1</a><i>›</i><a href="../index.html">Q1-L4-L1-L3</a><i>›</i><span>r2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4-L1-L3, round 2</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/critiques/r2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee report on [proof.md](../proof.html), second round, against the statement as revised by [u1](../updates/u1.html). [r1](r1.html) returned `VERDICT: FAIL` on one MAJOR and six MINORs.\n\n## What I verified, and how\n\n**Statement vs. Lemma — diffed, not skimmed.** The draft's `## Lemma` (lines 10, 12, 14, 16) against `## Statement` of [the node file](../index.html) (lines 25, 27, 29, 31): identical, character for character, links and link depths included, all four paragraphs — **(A)**, **(B)** and both **Scope** paragraphs. No hypothesis added to (A), no conclusion weakened in (B), and the scope clause carries its **every** in bold as the node has it.\n\n**The reading has not crept back.** I grepped the draft for $\\operatorname{im}_{\\mathrm{Shv}}$: it occurs exactly once, at line 14, inside the Scope paragraph that the draft is obliged to reproduce verbatim. It occurs in no step, no caveat and no display. I then checked by exhaustion that no step *needs* it: Step 1 is [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a)(1) about $\\overline{LX}_\\lambda$; Steps 2, 3 read $j_\\lambda$ and $i_\\lambda$ off the *body* of [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html) (main.tex:737's transcription), not off the ratified-reading note on that entry; Steps 4, 5, 7 mention no orbit at all; Step 6 is (a)(2); Steps 8, 9 assemble. The one place the reading could have re-entered — \"an open subobject of a scheme is a scheme\" in Step 2, where one might have been tempted to say *which* subobject — does not take it. Line 5's claim to this effect is accurate.\n\n**The closed world.** All six declared `objects:` exist as files with the anchors their links resolve to, at the correct depth ($d=3$, so five `../`): [the standing notation](../../../../../../appendix/subsec-notations.html), [$\\Lambda_X^+$](../../../../../../appendix/not-lambda-x-plus.html), [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../../appendix/def-orbit-closure.html), [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html), [placidity](../../../../../../appendix/placid-ind-scheme.html). Nothing outside these six and standard algebraic geometry is invoked; `depends-on` is empty and nothing is smuggled in. `chenyi_2025singularitiesorbitclosuresloop` is `refs.bib:213`. `[u1](updates/u1.md)` and `[Q1-L4-L1](../Q1-L4-L1_node.md)` both resolve. No bare backticked object label outside a link — `refs.bib` and `depends-on` are a filename and a field name, not labels. Displays are `$$` blocks with blank lines either side; no `.tex`-only macro; no `\\[\\]` or `align`.\n\n**Hypotheses of every entry invoked, checked one by one.** [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html) requires $X$ smooth affine spherical and its clause (a) is the general-spherical one — (A) supplies it via the standing class of [context.md](../../../../../../context.html), which is strictly stronger (connected $B$-stabilizers on the open orbit). Clause (b), the one carrying the symmetric / $G^\\theta$-connected caveat, is genuinely not used: no $\\varinjlim$ occurs in the draft and no presentation of $LX$ is invoked, so Caveat 3 is correct. [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../../appendix/def-orbit-closure.html) and [$\\Lambda_X^+$](../../../../../../appendix/not-lambda-x-plus.html) carry the same hypothesis and no other; [placidity](../../../../../../appendix/placid-ind-scheme.html) is a definition with none.\n\n**Page-level provenance, re-read myself (v4 on disk, pp. 20–23) rather than inherited from r1.** Theorem 36 is on p. 21 and its (i)/(ii) are transcribed faithfully as (a)(1)/(a)(2) — I compared clause by clause. Its proof does say \"For any $\\lambda\\in\\Lambda_S^+$, choose $i,i'$ …\", so the *proved* range is the symmetric index set, and the object is Lemma 34's $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$ (p. 20), with $\\mathcal{X}^\\bullet$ \"the open subscheme such that the fiber $\\mathcal{X}^\\bullet_a\\subset\\mathcal{X}_a$ over $a$ is the open $G$-orbit\". Remark 37 is on p. 22, verbatim: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites, Theorem 36 remains true for general spherical varieties.\" The proof of Thm 36 also contains, on p. 21, \"$j_\\lambda$ is a placid fp-open embedding and $i_\\lambda$ is a placid fp-closed emebdding (see, e.g., [BKV11, Lemma 1.3.6 and Lemma 1.3.11])\", which is the phrase the entry's provenance note quotes and Step 6 leans on. So the appendix entry does **not** mis-state its source, and Caveat 1's page-level claims are all accurate. I also confirmed SW22 (arXiv:2009.03943) has no `refs.bib` key — only `Sakellaridis_2008` and Sakellaridis–Venkatesh are there — so Caveat 1's \"which has no `refs.bib` key\" is true.\n\n**The mathematics of Steps 4–7, line by line.** This is where the node's content now sits and I checked it hostilely.\n\n*Step 4.* [placidity](../../../../../../appendix/placid-ind-scheme.html) does say \"cofiltered\", and the refinement is the right repair. Every small cofiltered category admits an initial functor from a codirected poset (Deligne, SGA 4 I 8.1.6; Lurie HTT 5.3.1.16 in the $\\infty$-form) — standard, needs no citation. The refined diagram's terms are old terms, hence finite type over $k$; its transitions are *arrows of the old diagram*, hence smooth and affine by hypothesis directly, so the draft's appeal to closure under composition is belt-and-braces rather than load-bearing. Initial functors preserve limits, so the limit is still $Z$. Nonemptiness is handled. Correct.\n\n*Step 5.* $\\{j\\ge i\\}$ is cofinal in a directed poset; $Z_j\\to Z_i$ is a transition, hence affine; a directed limit of schemes affine over $Z_i$ is affine over $Z_i$ and the scheme-theoretic limit represents the functor-theoretic one, so $p_i$ is affine, hence quasi-compact. $Z_i$ of finite type over the field $k$ is quasi-compact by definition. A quasi-compact morphism into a quasi-compact scheme has quasi-compact source (finite affine cover of the target, finite union of quasi-compacts). Correct, and it names the principle r1's Flaw 4 asked for.\n\n*Step 7.* $Z_i$ finite type over $k$ is noetherian, hence qcqs — that plus affine transitions plus directed index plus $U$ quasi-compact is exactly the hypothesis list of the descent statement (EGA IV 8.2.11), so the descent is licensed and not merely gestured at. $U_{j'}=p_{j'j}^{-1}(U_j)$ follows from $p_{ji}\\circ p_{j'j}=p_{j'i}$, giving $U_{j'}=Z_{j'}\\times_{Z_j}U_j$, so the transitions are base changes of smooth affine morphisms — and would remain surjective too, under the stricter convention that demands surjectivity. $U_j$ is open in a noetherian scheme, hence quasi-compact, hence of finite type over $k$. The final limit interchange is legitimate: $U_j=Z_j\\times_{Z_i}U_i$ with $Z_i,U_i$ constant in $j$, limits commute with limits, and cofinality of $\\{j\\ge i\\}$ gives $\\varprojlim_{j\\ge i}Z_j=Z$. Correct, and it is the one piece of genuine mathematics in the write-up.\n\n**Nothing was lost with old Steps 1 and 7.** Under the revised (B) the obligations are: $LX_\\lambda$ a placid scheme (Step 8), locally closed in $LX$ (Step 3), open in its closure (Step 2), for every $\\lambda$ (Step 9). Old Step 1 supplied representability *through the reading*; the draft now gets scheme-hood instead from the open embedding of [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html) into a target that Step 1 makes a scheme, which is a strictly reading-free route. Old Step 7's quantifier work survives as Step 9. No orphaned reference to a deleted step remains.\n\n**The scope clause is established, in the only sense the closed world admits.** Step 9's three citations are each accurate to the entry: [$\\Lambda_X^+$](../../../../../../appendix/not-lambda-x-plus.html) says \"$\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$\"; [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html) names $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ as that poset and quantifies its embeddings \"for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$\"; [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) is stated over the same orbits with no locus prescribed. I verified independently that no step restricts $\\lambda$ — Steps 4, 5, 7 are $\\lambda$-free lemmas about placid schemes, and Steps 1, 2, 3, 6 quote entries whose quantifiers are unrestricted. So the clause is **inherited from the entries' quantifiers, not assumed as a side condition**, which is the strongest thing available here; and the residual risk — that the entry's quantifier over-states its source — is exactly what Caveat 1 now records. That is the right place for it.\n\n## Disposition of r1's flaws\n\n- **Flaw 1 [MAJOR]** — resolved, by the route r1 itself named (\"a revision of (B) to what the closed world can actually deliver — a statement about the stratum $LX_\\lambda$ …, dropping the image-sheaf subject, with the identification left where ADR 0028 put it\"). [u1](../updates/u1.html) did precisely that, the draft reproduces the revised statement verbatim, and the two Scope paragraphs say in the node's own voice what is not proved. This is genuine resolution and not acknowledgement: the undischarged obligation is no longer part of the claim, and the record of why is on the node, in `updates/`, in the history and in the parent's corrected `## Decomposition`.\n- **Flaw 2 [MINOR]** — met. Caveat 1 now pins the nondegenerate-locus exposure on [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) itself and says in terms that it is \"not an exposure peculiar to this argument\", naming Steps 1 and 6 and every node resting on the entry.\n- **Flaw 3 [MINOR]** — met, and better than the repair r1 proposed: Step 4 is now a step of its own that states the cofiltered/directed distinction, names the refinement and says why both conditions survive it.\n- **Flaw 4 [MINOR]** — met. The vacuous $LX_\\lambda=j_\\lambda^{-1}(\\overline{LX}_\\lambda)$ is gone; Steps 5 and 6 name the principle and spell out affine $\\Rightarrow$ quasi-compact and finite type $\\Rightarrow$ quasi-compact.\n- **Flaw 5 [MINOR]** — met in substance (Step 6 declares the EGA reading and why), with a residue at Flaw 3 below.\n- **Flaw 6 [MINOR]** — met. Caveat 2 states the reducedness constraint, that it is carried in with the grants rather than proved, and that characteristic $0$ is what makes it benign.\n- **Flaw 7 [MINOR]** — **not** met; r1 recommended spending no words there and the draft spends some. Flaw 1 below.\n\n---\n\n## Flaws\n\n**Flaw 1** [MINOR] — r1's Flaw 7 recorded the ambient-subscript nitpick and closed with an explicit recommendation: \"I record this and recommend spending **no** words on it\".\n\n<details><summary>(location: line 6, \"**notation:** every $=$ and $\\simeq$ below is an assertion in schemes over $k$\") · the finding</summary>\n\nThe draft spends about thirteen. In mitigation the sentence does double duty — it also introduces the projection notation — and a single global declaration is cheaper than subscripting every $\\simeq$ in Steps 5 and 7, so the choice is defensible rather than wrong. But a referee's explicit \"spend nothing here\" was overridden without a word saying why, and on a page that is 233 words past the split signal every clause has to earn itself.\n\n</details>\n\n**Flaw 2** [MINOR] — Notation coined inline. [ADR 0060](../../../../../../process/decisions/0060-a-write-up-has-two-budgets.html)'s companion rule — \"a definition is a display\" — says notation is coined in its own `$$ … $$` block and that inline `$…$` refers to a symbol and never introduces one.\n\n<details><summary>(location: line 6, \"we write $p_{ji}\\colon Z_j\\to Z_i$ ($j\\ge i$) for its transitions and $p_i\\colon Z\\to Z_i$ for its projections\") · the finding</summary>\n\nTwo symbols carrying the whole of Steps 5 and 7 are introduced inside a prose bullet. Cost of the repair is one display and a blank line either side; it does not change a word of the mathematics.\n\n</details>\n\n**Flaw 3** [MINOR] — This is the one sentence in the write-up that asserts rather than argues, and it asserts about exactly the point where the two readings could diverge.\n\n<details><summary>(location: Step 6, \"The choice is not load-bearing: quasi-compactness of $j_\\lambda$ is all this step consumes.\") · the finding</summary>\n\nQuasi-compactness *is* the contested content: an open immersion is always locally of finite presentation and separated, so under the EGA reading \"finitely presented\" contributes quasi-compactness **and nothing else**, which is why the reading is not a free choice but the whole of the grant. Saying that — one clause — would turn the assertion into a proof that the two readings agree. The alternative clause, equally short, is the one I verified on p. 21 of the source: under the placid (BKV) reading the open is handed to you as $p_i^{-1}(U_i)$ at a finite level with $U_i$ quasi-compact, whence quasi-compactness again, and Step 7 becomes nearly free. Either sentence closes the residue of r1's Flaw 5; as written the step is correct but its self-justification is circular-sounding.\n\n</details>\n\n**Flaw 4** [MINOR]\n\n<details><summary>(location: the Lemma, \"Clause **(B)** is about the named stratum and follows from [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) alone.\") · the finding</summary>\n\nRead literally this is false, and the draft's own steps refute it: Steps 2 and 3 consume [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html) for $j_\\lambda$ and $i_\\lambda$, Steps 4, 5 and 7 consume [placidity](../../../../../../appendix/placid-ind-scheme.html) plus limit theory, and Step 1 consumes [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../../appendix/def-orbit-closure.html) for what the closure is. The intended reading is plainly \"clause (a) and not clause (b)\", which is true and which Caveat 3 confirms, so this is elliptical wording and not a mathematical defect — and it sits inside the `## Statement`, which the prover is obliged to reproduce verbatim and may not touch. Recorded against the statement, for `/update`: \"from clause (a) of that entry rather than clause (b)\" is the same length and says what is meant.\n\n</details>\n\n**Flaw 5** [MINOR] — The commissioning brief asks for a closing line saying no assumed dependency was used, and the sibling write-ups that carry this (for instance `Q1-L2-z1/proof.md:80`, `Q1-L6-z1/proof.md:74`) state it in both places, once in **uses** and once at the end.\n\n<details><summary>(location: the closing — the write-up ends on Caveat 3, and the dependency disclaimer sits at line 5) · the finding</summary>\n\nHere it appears only in **uses**. The fact is stated and stated accurately — `depends-on` is empty and I confirmed no node's conclusion enters — so this is placement, not content.\n\n</details>\n\n**Flaw 6** [MINOR] — The write-up never tallies what it derived against what it read off.\n\n<details><summary>(location: Steps 2, 3, 9 taken against Step 8) · the finding</summary>\n\nOf clause (B)'s four assertions, three — locally closed in $LX$, open in its closure, and the range of the index set — are read directly from the declared entries, and only placidity of the stratum is derived. That is not a restatement in the fatal sense: [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a)(1) gives placidity of the **closure** only, so Steps 4–8 add something the closed world did not contain, and each of Steps 2, 3 and 9 does name the entry it is quoting. But after a revision whose whole purpose was to make the grant/derivation split explicit, the split deserves one sentence in the write-up's own voice rather than reconstruction by the reader. It also bears on what `/update` should do next: the node's surviving mathematical content is one general lemma about placid schemes.\n\n</details>\n\n**Flaw 7** [MINOR] — A §-level pointer to a source with no `refs.bib` key.\n\n<details><summary>(location: Step 7, \"Limit theory along affine transitions over a directed index (EGA IV §8)\") · the finding</summary>\n\nIt is licensed — this is standard mathematics under [context.md](../../../../../../context.html)'s third clause, r1 accepted the identical pointer, and the draft states the hypotheses it uses rather than hiding behind the reference — so I ask for no change. Recorded only because a reader scanning for citations will see a bracketed source name and may take it for one.\n\n</details>\n\n**Flaw 8** [MINOR] — The title still advertises the pre-revision subject.\n\n<details><summary>(location: line 1, the title, \"locally closed placid **sub-ind-scheme** of $LX$\") · the finding</summary>\n\nClause (B) now concludes that $LX_\\lambda$ is a *placid scheme*; \"sub-ind-scheme\" was the wording that went with the image-sheaf formulation. Nothing is false — a scheme is an ind-scheme and Step 3 supplies the locally closed embedding into $LX$ — but the title is what the DAG readout and the graph card show, and it is the one place a passing reader is still told the old story. The draft's title matches the node file's exactly, so this is the node's to fix and not the prover's: for `/update`.\n\n</details>\n\n## Word budget, and the split I would take\n\n1233/1500: inside the gate, 233 past the split signal. The clean excision is **Steps 4, 5 and 7 together** — \"a placid scheme admits a directed placid presentation whose projections are affine, and a quasi-compact open subscheme of a placid scheme is placid\". That block mentions no $X$, no $\\lambda$, no orbit and no loop space; it is consumed by exactly two lines (Step 6's \"by Step 5\" and Step 8); and lifting it would take the page to roughly 750 words with every caveat intact.\n\nOf the two homes [ADR 0060](../../../../../../process/decisions/0060-a-write-up-has-two-budgets.html) offers, the **appendix entry** is the one that compounds: every node that has to upgrade placidity of a closure to placidity of a stratum needs it, and [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html) is used by more than twenty. A key is available — `bouthier_kazhdan_varshavsky_2022perversesheavesinfinitedimensionalstacks` at `refs.bib:145`, arXiv:2003.01428, which is what Chen–Yi's p. 21 cites as \"[BKV11, Lemma 1.3.6 and Lemma 1.3.11]\" for exactly this material — but the PDF is not in `papers/`, so the entry cannot be written to the local-first standard until the source is fetched. Failing that, a child node. Neither is a condition of this round's verdict.\n\n## Assessment\n\nThe revision does what r1 asked and does it without loosening anything: the statement changed subject, the write-up changed with it, the reading is genuinely absent from every step, the five actionable MINORs are met, and the two new steps (4 and 7) are correct as written and correct under the stricter conventions I tried against them. The eight items above are all MINOR, six of them presentational or addressed to `/update` rather than to the prover. The honest thing to say about the node is what Flaw 6 says: what it now proves is a placidity upgrade plus a quantifier audit, and it proves both.\n\nVERDICT: PASS\n";</script>
