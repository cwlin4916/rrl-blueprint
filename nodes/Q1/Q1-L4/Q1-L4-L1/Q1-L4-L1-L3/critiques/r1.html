<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L4</a><i>›</i><a href="../../index.html">Q1-L4-L1</a><i>›</i><a href="../index.html">Q1-L4-L1-L3</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L4-L1-L3, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee report on [proof.md](../proof.html), first round. No prior critiques.\n\n## What I verified, and how\n\n**Statement vs. Lemma.** Diffed the draft's `## Lemma` (lines 10, 12) against `## Statement` of [the node file](../index.html) (lines 19, 21). Identical, character for character, links included. No strengthening of (A), no weakening of (B).\n\n**Objects.** All six declared entries exist with the anchors the links resolve to: [the standing notation](../../../../../../appendix/subsec-notations.html), [$\\Lambda_X^+$](../../../../../../appendix/not-lambda-x-plus.html), [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html), [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../../appendix/def-orbit-closure.html), [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html), [placidity](../../../../../../appendix/placid-ind-scheme.html). Nothing outside these six and standard mathematics is invoked; the node has no `depends-on` and none is smuggled in. `chenyi_2025singularitiesorbitclosuresloop` is `refs.bib:213`. No bare backticked label outside a link; no `preamble.tex` macro; links resolve at depth 4; displays are `$$` blocks with blank lines.\n\n**Page-level provenance (read myself, v4 on disk, pp. 19–23).** Theorem 36 is on p. 21 and is exactly clause (a): (i) \"The orbit closures $\\overline{\\mathcal{O}}_v$ (resp. $\\overline{LX}_\\lambda$) are irreducible placid schemes and the closed embeddings $\\overline{\\mathcal{O}}_v\\to LX$ (resp. $\\overline{LX}_\\lambda\\to LX$) are finitely presented\"; (ii) \"The open embedding $\\mathcal{O}_v\\to\\overline{\\mathcal{O}}_v$ (resp. $LX_\\lambda\\to\\overline{LX}_\\lambda$) and the closed embedding $\\overline{\\mathcal{O}}_v\\to\\overline{\\mathcal{O}}_{v'}$ (resp. $\\overline{LX}_\\lambda\\to\\overline{LX}_{\\lambda'}$) are finitely presented\". The appendix transcription of (a)(1)/(a)(2) is faithful. Remark 37 is on p. 22, verbatim: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites, Theorem 36 remains true for general spherical varieties.\" Lemma 38 is on p. 22 and is proved through $\\Lambda_S$ and the exact sequences (7), which state \"note that we assume $K$ connected\"; Proposition 39 is on p. 23. The draft's Step 2 citation (\"Remark 37, p. 22\") is accurate, and the entry's warning about the manuscript's numbering is borne out.\n\n**Clause (b) is never used — checked by exhaustion.** Step 1 uses the reading; Step 2 uses (a)(1); Step 3 uses the entry's $j_\\lambda$ plus Step 2; Step 4 uses (a)(2) plus a $\\varprojlim$ (the placid-*scheme* half of [placidity](../../../../../../appendix/placid-ind-scheme.html), not the ind-colimit half); Steps 5–6 are pure limit theory; Step 7 uses a constant diagram; Step 8 is the quantifier. No $\\varinjlim$ occurs anywhere in the draft, and no colimit presentation of $LX$ is invoked. The phrase \"sub-ind-scheme of $LX$\" in Step 7 is used as \"subsheaf of $LX$ that is an ind-scheme\", which needs no presentation of $LX$. So the Caveat's claim to use only (a) is correct, and no step needs $X$ symmetric or $G^\\theta$ connected.\n\n**No circle at the closure.** Placidity of $\\overline{LX}_\\lambda$ enters once, from [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a)(1) (Step 2), and placidity of the stratum is derived from it (Steps 3–6). The implication is never run backwards, and [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../../appendix/def-orbit-closure.html) is used only for what the closure *is*. The note on that entry is respected.\n\n**Step 5 is correct.** I checked it line by line. $U_{j'}=p_{j'j}^{-1}(U_j)$ holds because $p_{ji}\\circ p_{j'j}=p_{j'i}$, so $U_{j'}=Z_{j'}\\times_{Z_j}U_j$ and the transition is a base change of $p_{j'j}$: smooth and affine are stable under base change, and so is surjectivity, so the step is robust even under the stricter convention that demands smooth *surjective* affine transitions. Each $U_j$ is an open in a noetherian scheme, hence quasi-compact, hence of finite type over $k$. Cofinality of $\\{j\\ge i\\}$ gives $\\varprojlim_{j\\ge i}U_j=\\varprojlim_{j\\ge i}(Z_j\\times_{Z_i}U_i)=Z\\times_{Z_i}U_i=p_i^{-1}(U_i)=U$. The descent of the quasi-compact open to a finite level is the standard EGA IV §8 statement and its hypotheses (directed index, affine transitions, terms quasi-compact and quasi-separated — noetherian here, $U$ quasi-compact by Step 4) are all present. This is the one genuinely new piece of mathematics in the write-up and it stands.\n\n**Step 4 is correct.** $j_\\lambda$ finitely presented $\\Rightarrow$ quasi-compact; $\\overline{LX}_\\lambda\\to Z_i$ affine $\\Rightarrow$ quasi-compact, and $Z_i$ finite type over $k$ is quasi-compact, so $\\overline{LX}_\\lambda$ is quasi-compact; a quasi-compact morphism with quasi-compact target has quasi-compact source. All three links hold.\n\n## Adjudication of the grant/derivation split\n\n**What is granted.** [ADR 0028](../../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded as a note on [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html) and as reading 3 of [context.md](../../../../../../context.html), says in terms: \"the strata $LX_\\lambda$ … *are* the orbit images through their $k$-points\", with representability by the *locally closed* sub-ind-schemes named in the entry its definitional content. So the draft's Step 1 grant — $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)=LX_\\lambda$ in $\\operatorname{Sub}_{\\mathrm{Shv}}(LX)$, with $i_\\lambda$ locally closed — is exactly the reading and no more. I agree it is granted; I checked the specialisation to a fixed $x_\\lambda\\in LX_\\lambda(k)$ is the reading's own quantifier (\"through *their* $k$-points\", so any $k$-point of the stratum).\n\n**What is derived.** Placidity of the stratum (Steps 2–6) and openness in the closure (Step 3) are genuinely derived, and are not granted anywhere: [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a)(1) gives placidity of the *closure* only, and (a)(2) gives finite presentation of $j_\\lambda$ only. The draft does not upgrade the reading into a theorem it then proves, and it does not assume more than the reading grants. On the orchestrator's two symmetric failure modes, neither is present, and the draft's own account of the split (Step 1's closing sentence, Step 7, Caveat 2) is accurate as far as it goes.\n\n**On the scope clause.** The three entries do quantify the way the last clause of (B) says. [$\\Lambda_X^+$](../../../../../../appendix/not-lambda-x-plus.html): \"$\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$\". [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html): \"$\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ … the posets of … $L^+G$-orbits, of $LX$\". [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a): stated for \"the orbit closures … $\\overline{LX}_\\lambda$\", with orbits as in that entry, hence over the same index set with no locus prescribed. No nondegenerate locus is named in any of the three. So Step 8 is legitimate inside the closed world as ratified, and I do not raise the scope clause as a flaw against the prover; the exposure is a property of the reading and belongs to the lead-researcher (P18). I also confirmed the $\\mathbb{A}^1$ boundary orbit is not a counterexample: for $X=\\mathbb{A}^1$, $G=\\mathbb{G}_m$, the orbits of $\\mathcal{O}^\\times$ on $k((t))$ are the valuation strata $t^n\\mathcal{O}^\\times$ and $\\{0\\}$, all locally closed and placid. Nothing here refutes (B).\n\n---\n\n## Flaws\n\n**Flaw 1** [MAJOR] — The node's commissioning entry, [`Q1-L4-L1-L3_history.md`](../history.html) of 2026-08-05, says in bold: \"**This node must not be discharged by quoting the definition.**\n\n<details><summary>(location: Step 1, \"Representability and local closedness are granted by the ratified reading, not derived here\"; Step 7, \"This is (B) at $\\lambda$\"; the $\\blacksquare$) · the finding</summary>\n\n… a write-up that cites the reading has proved nothing, and the node exists precisely to establish, on independent grounds, what the convention posits.\" The draft discharges two of (B)'s five conclusions — representability, and local closedness in $LX$ — by quoting exactly that reading, and closes as a completed proof without saying that the commission has not been met.\n\nThe situation is worse than the draft's own accounting shows, and this is the part it does not state. [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) is transcribed \"with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html)\", so the objects $LX_\\lambda$ and $\\overline{LX}_\\lambda$ that Steps 2–6 reason about are the reading's objects. Strip reading 3 and Steps 2–6 prove a statement about the *named stratum* — it is a placid scheme, open in its placid closure, locally closed in $LX$ — with no occurrence of $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ at all. The only bridge from (B)'s subject, the image sheaf, to the write-up's content is reading 3. So **nothing in this write-up is independent of the convention the node was created to replace**, and Step 1's \"placidity, openness in the closure and the scope clause remain\" reads as though what remains were independent of the grant, which it is not.\n\nI want to be clear about attribution, because it changes what should happen next. **No step is wrong, and the disclosure in Step 1 is honest and precise** — the prover saw the instruction, declined it explicitly rather than quietly, and said which halves are which. I looked for the independent route and there is none in the current closed world: [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a) presupposes the reading; no entry transcribes Chen–Yi's Lemma 34 or SW22 Prop. 2.3.7 / Lem. 2.3.10, and [u1](../../updates/u1.html) records that both routes were weighed and blocked (no `refs.bib` key — P23 — and transcribing the proof internals \"smuggles the same dependence one layer down\"). So the gap is **not fillable by another prover round**, and I am not asking for one. The remedy is `/update` or the lead-researcher: either an appendix entry that makes the image-to-stratum identification a theorem, or a revision of (B) to what the closed world can actually deliver — a statement about the stratum $LX_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html), dropping the image-sheaf subject, with the identification left where ADR 0028 put it. The severity is MAJOR because the node's core obligation is undischarged and the draft does not name that fact; it is not FATAL because the argument is sound, licensed and disclosed.\n\nWord cost of the minimal repair inside the draft (a sentence in the Caveats saying the commission cannot be met in the current closed world and why): ~40 words, which a 900/900 draft does not have.\n\n</details>\n\n**Flaw 2** [MINOR] — The exposure audit names one channel and not the second.\n\n<details><summary>(location: Caveats, \"The scope clause rests on a grant, not on a page\"; \"narrowing reading 3 to a nondegenerate locus would break (B) there\") · the finding</summary>\n\nThe Caveat pins the nondegenerate-locus problem on reading 3's provenance. But clause (a)'s *general-spherical* generality runs through the same locus: the entry's own hypotheses note grounds it in Remark 37, and I checked on p. 20 that the object Theorem 36 is proved about is Lemma 34's $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$, where $\\mathcal{X}^\\bullet\\subset\\mathcal{X}$ is by definition \"the open subscheme such that the fiber $\\mathcal{X}^\\bullet_a\\subset\\mathcal{X}_a$ over $a$ is the open $G$-orbit\", and whose proof reads in full: \"the stabilizer of $B$ on $X^\\circ$ is a smooth subgroup and the lemma follows from [SW22, Lemma 2.3.10].\" The source's own $\\lambda$ ranges over $\\Lambda_S^+$ (p. 21, \"For any $\\lambda\\in\\Lambda_S^+$\"), the symmetric index set, where $X$ is homogeneous and degeneracy does not arise. So narrowing *clause (a)* to a nondegenerate locus would break Steps 2 and 4 exactly as narrowing reading 3 breaks Step 1. The draft's hedge \"the appendix statement of [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a)\" gestures at this, but a reader who trusts the Caveat's last clause will believe the derived half is on firmer ground than the granted half, and it is on the same ground. Repair: ~20 words appended to Caveat 1.\n\n</details>\n\n**Flaw 3** [MINOR] — [placidity](../../../../../../appendix/placid-ind-scheme.html) says \"cofiltered limit\", not \"directed\".\n\n<details><summary>(location: Step 5, \"$I$ directed, so the system is cofiltered\") · the finding</summary>\n\nThe draft reads the definition as supplying a directed poset, which it does not, and the EGA IV §8 descent of the quasi-compact open is stated for directed systems. The repair is standard — a cofiltered diagram admits a cofinal functor from a directed poset, and the refinement preserves both conditions, since the new terms are old terms and the new transitions are composites of old ones, with smooth and affine both closed under composition — but it should be named rather than legislated. The same silent directedness is used in Step 4 to make $\\overline{LX}_\\lambda\\to Z_i$ affine (that needs $\\{j\\ge i\\}$ cofinal). Repair: replace \"$I$ directed, so the system is cofiltered\" with \"$I$ cofiltered; refining by a cofinal directed poset, which preserves both conditions, take $I$ directed\" — roughly word-neutral.\n\n</details>\n\n**Flaw 4** [MINOR] — The displayed identity is vacuous — the preimage of the whole target is the whole source — and it stands in for the principle actually used, which is that a quasi-compact morphism into a quasi-compact scheme has quasi-compact source.\n\n<details><summary>(location: Step 4, \"Hence $LX_\\lambda=j_\\lambda^{-1}(\\overline{LX}_\\lambda)$ is quasi-compact\") · the finding</summary>\n\nTwo further links are left implicit: affine $\\Rightarrow$ quasi-compact, and finite type over $k$ $\\Rightarrow$ quasi-compact, which is what makes the middle sentence conclude anything. Repair is word-neutral or better: delete the identity, name the principle.\n\n</details>\n\n**Flaw 5** [MINOR] — The draft silently reads \"finitely presented\" in (a)(2) in the EGA sense.\n\n<details><summary>(location: Step 4, \"[orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)(a)(2) makes $j_\\lambda$ finitely presented, hence quasi-compact\") · the finding</summary>\n\nOn a non-noetherian object like $\\overline{LX}_\\lambda$ the source's notion is the placid one — the entry's own provenance note quotes \"$j_\\lambda$ a placid fp-open embedding\", and the source's proof (p. 21) obtains it by Noetherian descent inside $L^iX$, i.e. already descended to a finite level. Both readings deliver quasi-compactness, so the step is robust and I raise no doubt about it. But the choice matters downstream: under the placid reading, Step 5 is close to free, because the open is given to you at a finite level and there is nothing to descend. Saying which reading is taken costs ~15 words and could refund far more.\n\n</details>\n\n**Flaw 6** [MINOR] — The grants jointly force something the draft does not remark on.\n\n<details><summary>(location: Step 3, \"an open subobject of a scheme is a scheme\") · the finding</summary>\n\n[$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../../appendix/def-orbit-closure.html) fixes the closure **with the reduced scheme structure**, and [Iwahori and spherical orbits on $LX$](../../../../../../appendix/def-orbits-iwahori-spherical.html) makes $j_\\lambda$ an open embedding into it, so the representing scheme of $\\operatorname{im}_{\\mathrm{Shv}}(a_\\lambda)$ is necessarily reduced. That is an extra constraint carried in with the grant, not a consequence of anything proved, and it is benign here only because $k$ has characteristic $0$. One clause, ~12 words.\n\n</details>\n\n**Flaw 7** [MINOR] — Nitpick against the `## Notation` rule of [context.md](../../../../../../context.html): these $=$ and $\\simeq$ carry no ambient subscript and neither exception applies literally (both sides live in schemes over $k$, and the ambient is not one of the sides).\n\n<details><summary>(location: Step 5, \"$\\varprojlim_{j\\ge i}U_j\\simeq Z\\times_{Z_i}U_i=U$\"; Step 4, \"$LX_\\lambda=j_\\lambda^{-1}(\\overline{LX}_\\lambda)$\") · the finding</summary>\n\nStep 1's $=_{\\operatorname{Sub}_{\\mathrm{Shv}}(LX)}$ shows the prover knows the rule and applies it where it is load-bearing. I record this and recommend spending no words on it: the rule exists to disambiguate comparisons of categories, and subscripting isomorphisms of schemes would be decoration.\n\n</details>\n\n## Word budget\n\nThe draft is at 900/900 with zero headroom, and the repairs above do not fit. Flaws 1, 2, 5 and 6 cost roughly $40+20+15+12\\approx 87$ words; Flaws 3, 4 and 7 are word-neutral or refunds. So about ninety words must be displaced, and I say so plainly rather than pretending the page can absorb them.\n\nThe cleanest displacement is **Step 5**, which is the obvious sub-lemma: \"a quasi-compact open subscheme of a placid scheme is placid\" mentions no $X$, no $\\lambda$, no orbit and no loop space, is self-contained in its own statement and proof, and is consumed by exactly one line of Step 6. Lifting it to a child node frees ~150 words and leaves this page to do what it is actually about. If instead Flaw 1 is answered by revising the statement, Steps 1 and 7 collapse together and free ~120 words, which is the larger and more honest saving of the two.\n\nVERDICT: FAIL\n";</script>
