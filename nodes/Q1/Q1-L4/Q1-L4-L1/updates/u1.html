<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L4</a><i>›</i><a href="../index.html">Q1-L4-L1</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L4/Q1-L4-L1/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html)\n\n**Date:** 2026-08-05 · **Operator:** `/update Q1-L4-L1 with input` (an external referee report on this node, verdict \"all three clauses are true\", recommending a logical reorganization) · **Status before → after:** `proved` → `proved`; the correction is one of attribution, and the write-up on disk already argues exactly the revised statement.\n\n## The input\n\nThe passage confirms (a), (b) and (c) and asks for no mathematical change. Its one substantive charge is that the node is *partially tautological*: clause (b) reads as a geometric theorem, but under ratified reading 3 ([ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)) the representability of the orbit image by the locally closed stratum is definitional, so that half of (b) is assumed by the terminology rather than proved by the argument.\n\nEvery claim below was recomputed against this repository, not adopted from the passage.\n\n## The defect\n\n**Clause (b) does not say which of its two halves the node proves.** As written it asserts one isomorphism onto \"the locally closed sub-ind-scheme $LX_\\lambda$\", conflating a formal theorem about fpqc sheaves — that $K/K_\\lambda$ is the sheaf image of the orbit map — with the definitional identification of that image with the stratum. [proof.md](../proof.html) already keeps the two apart (Step 3 is the image, Step 4 cites the ratified reading), so the write-up is right and the statement it is written against is silent.\n\n## Old statement, verbatim\n\n> **Setting.** Fix $\\lambda\\in\\Lambda_X^+$ and a point $x_\\lambda\\in LX_\\lambda(k)$ of the corresponding spherical stratum of [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html). Write $K = L^+G$ and set $K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$.\n>\n> **Claim.** Then:\n>\n> **(a) Stabilizer.** $K_\\lambda$ is a closed subgroup scheme of $K$.\n>\n> **(b) Orbit presentation.** The orbit map $a_\\lambda\\colon K\\to LX$, $g\\mapsto g\\cdot x_\\lambda$, induces a monomorphism of fpqc sheaves from the quotient fpqc sheaf $K/K_\\lambda$ to $LX$. This monomorphism is an isomorphism onto the locally closed sub-ind-scheme $LX_\\lambda$:\n>\n> $$K/K_\\lambda \\xrightarrow{\\ \\sim\\ } LX_\\lambda .$$\n>\n> **(c) Quotient description.** Consequently there is a canonical equivalence of fpqc quotient stacks\n>\n> $$K\\backslash LX_\\lambda \\simeq BK_\\lambda,$$\n>\n> where $BK_\\lambda = \\mathrm{pt}/K_\\lambda$ is the classifying stack.\n>\n> Part (c) is clause (i) of Q1-L4.\n\n## New statement\n\nClause (b) is split at the seam the defect names: the monomorphism onto the sheaf image is the node's theorem, the identification of that image with the stratum is quoted from the ratified reading. Clauses (a) and (c) are unchanged, and the sentence \"Part (c) is clause (i) of Q1-L4\" moves out of the frozen statement, being a remark about the statement and not part of it. A new **Scope** section carries it, together with what is geometry, what is formal, what is convention, and where the convention's published form stops — see [the node](../index.html).\n\nNothing is added to what the node asserts and nothing is withdrawn: the old (b) is the new (b) composed with reading 3, so the two statements are equivalent under the reading that was already in force. That is why the status stays `proved` and the round numbering is untouched.\n\n## Verified\n\n**The tautology charge is correct, and the repository already says so.** [ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html) decides that \"the definitional content of the entry is that these image sheaves are representable by the locally closed sub-ind-schemes it names\", and the note on [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) repeats it. So representability is posited, not derived, exactly as the passage says.\n\n**Clause (a) needs only affineness.** The passage proves closedness from the coordinate rings: with $A=k[X]$ finitely generated on $f_1,\\dots,f_m$, $C=\\mathcal{O}(K)$ and $\\gamma_{\\mathrm{univ}}\\in G(C[[t]])$ the universal loop given by Yoneda, the coefficients of $u_x(f_i)-x^\\#_C(f_i)\\in C((t))$ cut out a closed subscheme of $K$ representing the stabilizer. Recomputed and correct; it uses no sphericality, no smoothness, no placidity and no hypothesis on the characteristic. [proof.md](../proof.html) Step 2 reaches the same conclusion faster, as a section of the separated $LX^i\\to\\operatorname{Spec}k$ pulled back along $a_\\lambda$, so no repair is owed.\n\n**The formal half of (b) and all of (c) carry no spherical hypothesis.** The monomorphism argument (right $H$-invariance of $a_x$, then $g_2^{-1}g_1\\in H(S')$ after a cover) and the groupoid argument ($H\\rightrightarrows\\mathrm{pt}$ into the action groupoid, fully faithful and fpqc-locally essentially surjective) are the passage's §3–§4 and hold for any group sheaf acting on any sheaf. [proof.md](../proof.html) Steps 3 and 5 prove them by an explicit saturation and an explicit Čech groupoid, which is the same content.\n\n**Sheafification is load-bearing, on the passage's own example.** For $\\mathbb{G}_m$ acting on $\\mathbb{G}_m$ by $g\\cdot y=g^ny$ with $n>1$ and $x=1$, the stabilizer is $\\mu_n$; over $R=k[s,s^{-1}]$ the units are $cs^m$, so $s$ is not an $n$-th power in $R^\\times$, while $R'=R[z]/(z^n-s)$ is finite free of rank $n$, hence faithfully flat, and $s=z^n$ there. So $(K/K_x)(R)\\neq K(R)/K_x(R)$. Recomputed and correct; the write-up's $\\tilde P$ of Step 3 is the saturation this forces.\n\n**Local closedness of an orbit is not formal in infinite dimensions.** For $K=\\varinjlim_n\\mathbb{G}_a^n$ translating $Y=\\operatorname{Spec}k[x_1,x_2,\\dots]$, the orbit of $0$ is the finite-support locus: dense, since a polynomial vanishing on it involves finitely many variables and so vanishes identically, and containing no nonempty basic open $D(f)$, since the coordinates $f$ omits may be perturbed off zero. Dense and not open is not locally closed. Recomputed and correct — it is the reason ADR 0028 had to posit representability rather than argue it.\n\n**The published form of the reading is stated over the nondegenerate locus.** The repository's own page-level record of Sakellaridis–Wang (arXiv:2009.03943, read 2026-08-04, [papers/guideline.md](../../../../../papers/guideline.html)) has Thm. 2.3.5 and Prop. 2.3.7 describing the $L^+G$-orbits **on $\\mathsf{L}^\\bullet X$**, each of them $\\mathsf{L}^+G/S$ and open in its closure. Chen–Yi build the stratum the same way: p. 21 (v4, reread this run) derives $LX_\\lambda\\cong L^iX\\times_{L^{i'}\\mathfrak{X}_\\lambda}L^+\\mathfrak{X}_\\lambda^{\\bullet}$ from their Lemma 34, which is [SW22, Lem. 2.3.10], and Remark 37 (p. 22) extends Theorem 36 to general spherical $X$ on exactly that input. Meanwhile [$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html) indexes the $L^+G$-orbits of the full $LX$. So the reading's scope is wider than its provenance's.\n\n**A boundary stratum exists inside the standing class.** $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ is smooth, affine and spherical with connected $B$-stabilizer on the open orbit, so it satisfies the standing assumptions of [context.md](../../../../../context.html). Here $K(R)=R[[t]]^\\times$ acts on $LX(R)=R((t))$; the orbit of $0$ is $\\{0\\}$, with $K_0=K$ and $K\\backslash\\{0\\}=BK$, and it is an $L^+G$-orbit of $LX$ lying outside $\\mathsf{L}^\\bullet X$. Recomputed and correct. It is *not* a counterexample to anything this node claims — $\\{0\\}$ is a closed point, so representability is trivial for it — but it witnesses that the class of strata the reading covers is strictly larger than the class the cited source treats.\n\n## Refuted\n\n**\"Do not infer placidity of $K_\\lambda$ from closedness\" is a warning against something no node does.** This node claims only that $K_\\lambda$ is a closed subgroup scheme. Placidity, the pro-unipotent kernel and the finite-type quotient are clause (ii) of [Q1-L4](../../index.html), proved separately at [Q1-L4-L2](../../Q1-L4-L2/index.html) from a jet-image presentation, and its [u1](../../Q1-L4-L2/updates/u1.html) already disposed of the same objection in the other direction.\n\n**The geometric input is not missing from the closed world.** The passage asks for a node proving that each stratum is a locally closed placid scheme, open in its placid closure, and says only that node should invoke Chen–Yi. That statement is already an appendix black box: [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a), whose clause 2 makes $j_\\lambda\\colon LX_\\lambda\\to\\overline{LX}_\\lambda$ a finitely presented open embedding and whose clause 1 makes the closure placid with $\\overline{i}_\\lambda$ closed and finitely presented — verified on the source at pp. 21–22 (v4) this run, general spherical via Remark 37. What is definitional is not representability of the named stratum but the identification of the orbit *image* with it.\n\n## Unverified\n\n**Stacks Project tag 05YL.** The passage cites it for \"the quotient stack is the stackification of the action groupoid\". Not checked against the source, and not needed: [proof.md](../proof.html) Step 5 proves the descent it is offered for, from the Čech groupoid of $\\operatorname{Spec}k\\to K\\backslash(K/K_\\lambda)$, inside the closed world.\n\n**Whether $\\Lambda_X^+$ indexes strata of $LX$ that meet no $\\mathsf{L}^\\bullet X$.** Chen–Yi's Prop. 17 and Thm. 18 give the indexing and the closure order for *symmetric* $X$ only ([papers/guideline.md](../../../../../papers/guideline.html), 2026-08-04), so for general spherical $X$ neither the source nor this run establishes whether the boundary strata that the $\\mathbb{A}^1$ example shows to exist are in the poset or excluded from it. The scope note states the alternative rather than resolving it.\n\n**The Numdam reference for classical orbit theory.** Cited by the passage for stabilizers closed and orbits locally closed in finite type. Standard, not consulted, and invoked nowhere.\n\n## Considered and not adopted\n\n**Splitting the node into three (`-L1F`, `-L1C`, `-L1G`).** The split's content is real and is now carried by the revised (b) plus the Scope note, at no cost in directories: (a) is the geometric clause, the rest is formal, and the geometric input the third node would carry is [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a), already in the appendix. Three nodes whose statements are one page between them would also fail the one-node-one-page economy for nothing.\n\n**Reopening ADR 0028 to make representability a theorem.** The ADR weighed this and recorded why the alternatives fail: an SW22 appendix entry is blocked because `refs.bib` is the user's file and the citation policy forbids inventing keys; transcribing the presentation from inside Chen–Yi's proof of Thm 36 smuggles the same dependence one layer down. Nothing in the passage is new evidence against that decision, and reversing a ratified reading invalidates every consumer of the entry. The scope finding is recorded as a priority row instead, naming the user action that would unblock it.\n\n**Resetting the status to `open`.** The revised statement is the old one with its two halves labelled; [proof.md](../proof.html) proves it line for line, Step 3 giving the image and Step 4 the identification by the reading. Re-proving would change no argument.\n\n**Adding Sakellaridis–Wang to `refs.bib`.** Recommended by the passage and correct, but `refs.bib` is manuscript territory and humans-only. Raised as [P18](../../../../../../blueprint/priorities.md).\n";</script>
