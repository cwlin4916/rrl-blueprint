<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4-L1</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4-L1 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L4-L1\n\n[node](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\ncreated: 2026-08-04\n\nWhat the literature says about the orbit presentation $K/K_\\lambda\\xrightarrow{\\sim}LX_\\lambda$, $K\\backslash LX_\\lambda\\simeq BK_\\lambda$ of [Q1-L4-L1](index.html), and explicit instances, simplest first. This file is outside the closed world: it justifies believing or doubting the statement and no proof may cite it.\n\nEVIDENCE: precedent\n\n## Precedent\n\n**What was searched.** The local library first: `chenyi_2025singularitiesorbitclosuresloop` (pp. 1–6, 10–14, 20–24 read on disk), `mirkovic2007geometric` (pp. 4–8), the manuscript's [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) at main.tex:734–767. Then the web for the two sources not on disk: Sakellaridis–Wang (PDF fetched from jonathanpwang.com and read, pp. 22–25) and Zhu arXiv:1603.05593 (PDF fetched and read, pp. 24–27); one search for a general orbit–stabilizer theorem for placid group-scheme actions (Bouthier–Kazhdan–Varshavsky, arXiv:2003.01428 — nothing located by search).\n\n**What was found.** The statement is in print, at the node's own generality:\n\n- *(a)+(b), any affine spherical $X$.* Sakellaridis–Wang, *Intersection complexes and unramified $L$-factors*, JAMS **35** (2022), arXiv:2009.03943, **Prop. 2.3.7**: for $\\check\\theta\\in\\mathcal{V}\\cap\\check\\Lambda_X$, \"the $\\mathsf{L}^+G$-orbit $\\mathsf{L}^{\\check\\theta}X$ is a formally smooth $k$-scheme with $k$-points equal to $X^\\bullet(F)_{G:\\check\\theta}$, and is open in its closure in $\\mathsf{L}X$\". Its proof (p. 23) *is* the node's clause (b): \"*A priori*, the $\\mathsf{L}^+G$-orbit is defined as the fpqc sheaf quotient $\\mathsf{L}^+G/S$\", $S$ the stabilizer of $x_0t^{\\check\\theta}$, and $\\mathsf{L}^{\\check\\theta}X\\cong\\mathsf{L}^+G/S\\cong\\varprojlim_n\\mathsf{L}_n^+G/S_n$ with $S_n$ the image of $S$ in the jet group, the transitions smooth affine with smooth unipotent kernels; **Lemma 2.3.10** realizes the orbit as a locally closed sub-ind-scheme (fp-open inside a closed embedding). Char-$p$ needs \"the stabilizer of $B$ on $x_0\\in X^\\circ$ is smooth\"; in the node's char-0 setting that is automatic (Cartier), so the hypothesis is empty here. Two deltas to the node, both routine: (i) SW22 treat orbits meeting $\\mathsf{L}^\\bullet X$ (loops generically in the open $G$-orbit); an arbitrary stratum of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) is a nondegenerate orbit of $L\\overline{Y}\\subset LX$ for $\\overline{Y}$ the closure of the $G$-stratum the loop generically meets — an affine spherical, possibly singular, variety, which SW22 expressly allow; (ii) clause (c) is not stated there — it is formal fpqc descent from (b). So the node is close to a corollary of SW22; but SW22 has no appendix entry (and no `refs.bib` key), so inside the closed world the node still has to be proved. `refs.bib`: absent.\n- *Group case with the same proof shape.* `zhu2016introduction`, **Prop. 2.1.5**: $\\mathrm{Gr}_\\mu$ is a single $L^+G$-orbit, smooth quasi-projective of dimension $(2\\rho,\\mu)$, closure $\\mathrm{Gr}_{\\leq\\mu}$; the proof exhibits $L^+G/(L^+G\\cap t^\\mu L^+Gt^{-\\mu})\\to LG/L^+G$ as a locally closed embedding with image $\\mathrm{Gr}_\\mu$ — clause (b) verbatim for $\\mathrm{Gr}$. p. 26: $(LG)_\\mu$ is a scheme; $p_\\mu\\colon\\mathrm{Gr}_\\mu\\to G/P_\\mu$ with affine-space fibres.\n- *Symmetric case; the manuscript's own source.* `chenyi_2025singularitiesorbitclosuresloop` v4: **Prop. 17** ($k$-point parametrization $LX_\\mu=LG^+\\cdot x_\\mu$, $\\mu\\in\\Lambda_S^+$), and — inside the **proof of Thm. 36** (p. 22), not as a numbered result — the Cartesian diagram $\\mathcal{O}_v\\cong\\varprojlim_j(I_0)_j/H_j'\\to L^+Gx_v\\cong\\varprojlim_j L_j^+G/H_j$, $H_j,H_j'$ the jet-images of the stabilizers: the node's presentation, for both the spherical and the Iwahori strata at once. **Rem. 37** extends Thm. 36 to general spherical $X$. The finite-level mechanism is older: `mirkovic2007geometric` p. 4, \"$G_{\\mathcal{O}}$ acts on the $\\mathcal{G}r_n$ via a finite dimensional quotient\".\n- *Contradiction.* None found. The literature's own marker of delicacy is SW22's char-$p$ smoothness hypothesis, discharged here by characteristic 0.\n\n**What was not found.** A *general* orbit–stabilizer theorem — any placid pro-smooth group scheme acting on any placid ind-scheme — as a standalone numbered result (not located in BKV by search; SW22 and Chen–Yi each write the argument per-orbit). Clause (c) as a numbered statement in any source. And in Chen–Yi, the presentation itself carries no number — it lives inside the proof of Thm. 36 — which is exactly why the node has to state it.\n\n## Instances\n\n### 1. Iwasawa–Tate: $G=\\mathbb{G}_m$, $X=\\mathbb{A}^1$\n\n**What it is.** $K=k[[t]]^\\times$ on $LX(k)=k((t))$; strata $LX_n=\\{\\operatorname{val}=n\\}=K\\cdot t^n$ ($n\\in\\mathbb{Z}$) and $LX_\\ast=\\{0\\}$.\n\n**Why it is an instance.** Smooth affine spherical with trivial (connected) generic $B$-stabilizer *(constructed, one line)*; [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) applies; orbit set $F^\\times/\\mathcal{O}^\\times\\cong\\mathbb{Z}$ is SW22 Thm. 2.3.5 for this $X$.\n\n**What the statement says here.** $u t^n=t^n\\Leftrightarrow u=1$, so $K_n=\\{1\\}$: (a) trivially closed; (b) $K/\\{1\\}=K\\xrightarrow{\\sim}LX_n$, an isomorphism of schemes onto a locally closed (open-in-its-closure $t^nk[[t]]$) subscheme; (c) $K\\backslash LX_n\\simeq B\\{1\\}=\\mathrm{pt}$. Degenerate stratum: $K_\\ast=K$, $K\\backslash\\{0\\}\\simeq BL^+\\mathbb{G}_m$ — the case SW22's numbered statement does not cover and the reduction (i) above handles ($\\overline{Y}=\\{0\\}$). All *(constructed, unsourced)* except the orbit set.\n\n**Source.** Sakellaridis–Wang, arXiv:2009.03943, Thm. 2.3.5. `refs.bib`: absent.\n\n### 2. Group case: $X=G$ under $G\\times G$, spelled out for $\\mathrm{GL}_2$\n\n**What it is.** Strata $(LG)_\\mu=L^+Gt^\\mu L^+G$; the $\\mathrm{Gr}$-shadow is the Schubert cell $\\mathrm{Gr}_\\mu$.\n\n**Why it is an instance.** $X=G$ smooth affine spherical, generic $B\\times B$-stabilizer $\\cong T$ connected; $K=L^+(G\\times G)$, and $\\operatorname{Stab}(t^\\mu)=\\{(a,t^{-\\mu}at^\\mu)\\}\\cong L^+G\\cap t^\\mu L^+Gt^{-\\mu}$ *(constructed)*.\n\n**What the statement says here.** Zhu's Prop. 2.1.5 proof is (b) for $\\mathrm{Gr}$: $L^+G/(L^+G\\cap t^\\mu L^+Gt^{-\\mu})\\xrightarrow{\\sim}\\mathrm{Gr}_\\mu$ locally closed; $(LG)_\\mu$ is a scheme (p. 26), and the lift to $K/K_\\mu\\simeq(LG)_\\mu$ is the $L^+G$-torsor $(LG)_\\mu\\to\\mathrm{Gr}_\\mu$ *(constructed)*. For $G=\\mathrm{GL}_2$, $\\mu=(1,0)$: $t^{-\\mu}\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}t^{\\mu}=\\begin{pmatrix}a&t^{-1}b\\\\tc&d\\end{pmatrix}$, so $K_\\mu^{\\mathrm{Gr}}=\\{g\\in\\mathrm{GL}_2(\\mathcal{O})\\,:\\,b\\equiv0\\ (t)\\}$ — an Iwahori — and $\\mathrm{Gr}_{(1,0)}\\simeq L^+G/K_\\mu^{\\mathrm{Gr}}\\simeq G/P_\\mu\\simeq\\mathbb{P}^1$ (minuscule case, Lemma 2.1.13), dimension $(2\\rho,\\mu)=1$. ✓\n\n**Source.** Zhu, *An introduction to affine Grassmannians…*, arXiv:1603.05593 — Prop. 2.1.5 with proof, p. 26, Lemma 2.1.13. `refs.bib`: `zhu2016introduction`.\n\n### 3. Symmetric worked case: $X=\\mathrm{GL}_2/\\mathrm{O}_2$\n\n**What it is.** Chen–Yi's fundamental case (§3.2.1): orbits indexed by $\\{(p,q)\\in\\mathbb{Z}^2\\mid p\\geq q\\}$, representatives $\\tau(x_\\lambda)=t^\\lambda$, action $g\\cdot t^\\lambda=gt^\\lambda g^t$.\n\n**Why it is an instance.** Smooth affine (homogeneous, $\\mathrm{O}_2$ reductive), symmetric hence spherical. **Not discharged:** the standing connected-$B$-stabilizer hypothesis — the $B$-stabilizer of the base point is the diagonal $\\{\\pm1\\}^2$ *(constructed)*, disconnected — and [the three standing hypotheses](../../../../appendix/assum-intro.html)(c). Instructively, (a)–(c) hold anyway (SW22 §2.3 and Chen–Yi need no connectedness for the presentation): connectedness is load-bearing for the *local-system* clauses of the parent, not for this node.\n\n**What the statement says here.** $K_\\lambda=\\{g\\in\\mathrm{GL}_2(\\mathcal{O})\\,:\\,gt^\\lambda g^t=t^\\lambda\\}$, a loop-twisted orthogonal group; $K/K_\\lambda\\simeq LX_\\lambda$ is the $\\varprojlim_j L_j^+G/H_j$ of Thm. 36's proof; $\\pi_0(K_\\lambda)\\neq1$ feeds Cor. 9(ii)'s local systems.\n\n**Source.** Chen–Yi, arXiv:2310.20006v4 — §3.2.1, Prop. 17, Thm. 36 (proof, p. 22). `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`.\n\n### 4. Boundary: replace $K$ by the ind-group $N_{\\mathcal{K}}$ — the conclusion's form fails\n\n**What it is.** Semi-infinite orbits $S_\\nu=N_{\\mathcal{K}}\\cdot L_\\nu\\subset\\mathrm{Gr}$, $\\nu\\in X_*(T)$.\n\n**Why it is a boundary case.** The hypothesis \"$K=L^+G$\", a *placid pro-smooth group scheme*, fails: $N_{\\mathcal{K}}$ is a group ind-scheme. MV07 §3: the $S_\\nu$ \"are neither of finite dimension nor of finite codimension\", ind-varieties; Prop. 3.1(a): $\\overline{S_\\nu}=\\bigcup_{\\eta\\leq\\nu}S_\\eta$, infinitely many orbits per closure.\n\n**What it shows.** The orbit is still locally closed, but it is no scheme and no $\\varprojlim$ of finite-type quotients along smooth affine maps — the entire mechanism of (b) (jet-images of the stabilizer, MV07's finite-dimensional-quotient action) has no analogue. The group-scheme hypothesis is doing the work.\n\n**Source.** `mirkovic2007geometric`, §3 (p. 7) and Prop. 3.1. `refs.bib`: `mirkovic2007geometric`.\n";</script>
