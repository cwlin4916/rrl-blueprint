<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L4</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L4 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L4 — Strata are classifying stacks with finite-type reductive quotients\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), [placidity](../../../appendix/placid-ind-scheme.html); nodes [Q1-L4-L1](Q1-L4-L1/index.html), [Q1-L4-L2](Q1-L4-L2/index.html), [Q1-L4-L3](Q1-L4-L3/index.html), [Q1-L4-L4](Q1-L4-L4/index.html). Nothing else; the node's third declared object [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) is not consumed (Step 2).\n- **notation:** $K = L^+G$; $K_{\\lambda,m}\\subseteq L^mG$, $U_\\lambda$, $G_\\lambda$ are as in [Q1-L4-L2](Q1-L4-L2/index.html); $B(-) = \\mathrm{pt}/(-)$ is the fpqc quotient stack; $R_u(-)$ is the unipotent radical.\n\n## Lemma\n\nFor each $\\lambda\\in\\Lambda_X^+$ fix $x_\\lambda\\in LX_\\lambda(k)$ and set $K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$. Then:\n\n(i) $K\\backslash LX_\\lambda \\simeq BK_\\lambda$;\n\n(ii) $K_\\lambda$ is a placid group scheme admitting a normal pro-unipotent subgroup $U_\\lambda\\trianglelefteq K_\\lambda$ such that the fpqc-sheaf quotient $G_\\lambda := K_\\lambda/U_\\lambda$ is an affine group scheme of finite type over $k$;\n\n(iii) pullback induces equivalences\n\n$$\n\\mathcal{D}_c(K\\backslash LX_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}}),\n$$\n\nwhere $G_\\lambda^{\\mathrm{red}}$ is the quotient of $G_\\lambda$ by its unipotent radical.\n\n## Proof\n\n**Step 1 — the data the Lemma fixes is exactly the input the dependencies take.**\n\n<details><summary>the argument</summary>\n\nThe standing setting has $k$ algebraically closed of characteristic $0$, $K = L^+G$ and $X$ smooth affine spherical — the hypothesis [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) needs to name the poset $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ of $L^+G$-orbits. Its ratified reading makes each $LX_\\lambda$ the fpqc-sheaf image of an orbit map through a $k$-point, so $LX_\\lambda(k)\\neq\\emptyset$ and the Lemma's choice is possible. Everything below is asserted for that fixed choice, and the triple $(\\lambda, x_\\lambda, K_\\lambda)$ is verbatim the input of [Q1-L4-L1](Q1-L4-L1/index.html) and [Q1-L4-L2](Q1-L4-L2/index.html).\n\n</details>\n\n**Step 2 — the assembly does not consume [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).**\n\n<details><summary>the argument</summary>\n\nThe only facts about the stratum used below are that $\\lambda\\in\\Lambda_X^+$ indexes the $L^+G$-orbits of $LX$ and that $LX_\\lambda$ is the orbit through $x_\\lambda$, both from [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) under its ratified reading. Every placidity assertion below is about the group scheme $K_\\lambda$, measured against [placidity](../../../appendix/placid-ind-scheme.html), never about $LX$ or its orbit closures. So neither clause (a) nor (b) of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) enters, and their differing provenance does not bear on this node.\n\n</details>\n\n**Step 3 — clause (i) holds.**\n\n<details><summary>the argument</summary>\n\nIt is clause (c) of [Q1-L4-L1](Q1-L4-L1/index.html) at the input of Step 1: a canonical equivalence of fpqc quotient stacks, which we name\n\n$$\nq\\colon K\\backslash LX_\\lambda \\xrightarrow{\\ \\sim\\ } BK_\\lambda .\n$$\n\n</details>\n\n**Step 4 — $K_\\lambda$ is a placid group scheme.**\n\n<details><summary>the argument</summary>\n\nClause (a) of [Q1-L4-L2](Q1-L4-L2/index.html) gives affine finite-type $K_{\\lambda,m}$, transition homomorphisms $K_{\\lambda,m+1}\\to K_{\\lambda,m}$ that are affine, faithfully flat and smooth, and an isomorphism $K_\\lambda\\xrightarrow{\\sim}\\varprojlim_m K_{\\lambda,m}$. A cofiltered limit of finite-type schemes along smooth affine transitions is a placid presentation in the sense of [placidity](../../../appendix/placid-ind-scheme.html), so $K_\\lambda$ is placid.\n\n</details>\n\n**Step 5 — the pair $(U_\\lambda, G_\\lambda)$ witnesses clause (ii).**\n\n<details><summary>the argument</summary>\n\nClause (c) of [Q1-L4-L2](Q1-L4-L2/index.html) makes $U_\\lambda = \\ker(K_\\lambda\\to K_{\\lambda,1})$ a normal pro-unipotent subgroup of $K_\\lambda$ and the fpqc-sheaf quotient $G_\\lambda = K_\\lambda/U_\\lambda$ a closed subgroup scheme of $G$, hence affine of finite type over $k$. Its $G_\\lambda$ is defined by the Lemma's formula, so with Step 4 this is (ii).\n\n</details>\n\n**Step 6 — $!$-pullback along an equivalence of prestacks is an equivalence on $\\mathcal{D}_c$.**\n\n<details><summary>the argument</summary>\n\nThe category $\\mathcal{D}_c(\\mathcal{Y})$ is constructed from the prestack $\\mathcal{Y}$ alone. Hence for an equivalence $f\\colon\\mathcal{Y}\\xrightarrow{\\sim}\\mathcal{Z}$ the pullback $f^!\\colon\\mathcal{D}_c(\\mathcal{Z})\\to\\mathcal{D}_c(\\mathcal{Y})$ is an equivalence, a quasi-inverse being pullback along a quasi-inverse of $f$.\n\n</details>\n\n**Step 7 — the hypotheses of [Q1-L4-L4](Q1-L4-L4/index.html) hold at $H = K_\\lambda$, $H_m = K_{\\lambda,m}$.**\n\n<details><summary>the argument</summary>\n\nIt asks for a cofiltered-limit presentation by affine finite-type group schemes with affine, faithfully flat, smooth transition homomorphisms — the isomorphism of Step 4 — and for unipotent $\\ker(H_{m+1}\\to H_m)$, $m\\ge 1$, which is clause (b) of [Q1-L4-L2](Q1-L4-L2/index.html) verbatim.\n\n</details>\n\n**Step 8 — pullback along $\\pi_1\\colon BK_\\lambda\\to BK_{\\lambda,1}$ is an equivalence $\\mathcal{D}_c(BK_{\\lambda,1})\\xrightarrow{\\sim}\\mathcal{D}_c(BK_\\lambda)$.**\n\n<details><summary>the argument</summary>\n\nThis is [Q1-L4-L4](Q1-L4-L4/index.html) at $m = 1$, its hypotheses discharged in Step 7; $\\pi_1$ is induced by $K_\\lambda\\to K_{\\lambda,1}$, and the equivalence runs from the finite-level stack to the placid one.\n\n</details>\n\n**Step 9 — the first $\\simeq$ of clause (iii) holds and is induced by pullback.**\n\n<details><summary>the argument</summary>\n\nLet $u\\colon G_\\lambda\\xrightarrow{\\sim}K_{\\lambda,1}$ be the isomorphism of [Q1-L4-L2](Q1-L4-L2/index.html)(c) and set\n\n$$\np_\\lambda\\colon K\\backslash LX_\\lambda \\xrightarrow{\\ q\\ } BK_\\lambda \\xrightarrow{\\ \\pi_1\\ } BK_{\\lambda,1} \\xrightarrow{\\ (Bu)^{-1}\\ } BG_\\lambda .\n$$\n\nBy contravariant functoriality of $!$-pullback, $p_\\lambda^! = q^!\\circ\\pi_1^!\\circ((Bu)^{-1})^!$. The outer two factors are equivalences by Step 6 and the middle one by Step 8, so $p_\\lambda^!\\colon\\mathcal{D}_c(BG_\\lambda)\\xrightarrow{\\sim}\\mathcal{D}_c(K\\backslash LX_\\lambda)$. Its inverse is the first $\\simeq$ as the Lemma displays it, left to right.\n\n</details>\n\n**Step 10 — the second $\\simeq$ of clause (iii) holds and is induced by pullback.**\n\n<details><summary>the argument</summary>\n\nBy Step 5, $G_\\lambda$ is an affine group scheme of finite type over $k$, and $k$ is algebraically closed of characteristic $0$, so [Q1-L4-L3](Q1-L4-L3/index.html) applies at $H = G_\\lambda$. Its final clause, at $N = R_u(G_\\lambda)$, is the case at hand: $G_\\lambda/R_u(G_\\lambda)$ is the Lemma's $G_\\lambda^{\\mathrm{red}}$. It gives that $!$-pullback along $BG_\\lambda\\to BG_\\lambda^{\\mathrm{red}}$ is an equivalence $\\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}})\\xrightarrow{\\sim}\\mathcal{D}_c(BG_\\lambda)$, whose inverse is the second $\\simeq$ read left to right.\n\n</details>\n\n**Step 11 — the Lemma.**\n\n<details><summary>the argument</summary>\n\nClause (i) is Step 3, clause (ii) is Steps 4 and 5, and clause (iii) is the chain of Steps 9 and 10, its two equivalences induced by pullback along $p_\\lambda$ and along $BG_\\lambda\\to BG_\\lambda^{\\mathrm{red}}$ respectively. $\\blacksquare$\n\n</details>\n\n## Caveats\n\n- The Lemma asserts of $G_\\lambda^{\\mathrm{red}}$ only that it is $G_\\lambda/R_u(G_\\lambda)$. Reductivity, which the node's title advertises, is neither part of the statement nor proved here.\n- $K_\\lambda$, $U_\\lambda$ and $G_\\lambda$ depend on the chosen $x_\\lambda$; nothing above asserts independence of that choice.\n- Clause (i) inherits from [Q1-L4-L1](Q1-L4-L1/index.html)(b) its reliance on ratified reading 3 of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) — what identifies the orbit map's image sheaf with the stratum.\n\n## References\n\nThe write-up rests on [Q1-L4-L1](Q1-L4-L1/index.html)–[Q1-L4-L4](Q1-L4-L4/index.html), all four established; none is assumed.\n";</script>
