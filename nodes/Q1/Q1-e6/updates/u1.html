PSL}_2/\\mathrm{PO}_2$ has a spherical root of type $N$, and BZSV (arXiv:2409.04677) §7.6.5 (pp. 169–170) place it outside their hyperspherical setting for exactly this reason. By the note to [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html), absence of type-$N$ roots is what underwrites the connected-stabilizer clause (2), so a standing hypothesis of every Q1 node fails here.\n\n## New statement, clause (i)\n\n> **(i) Outside the hyperspherical setting.** The symmetric variety $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$ has a spherical root of type $N$, and BZSV (arXiv:2409.04677) §7.6.5 (pp. 169–170) place it outside their hyperspherical setting for exactly this reason. That is what puts $X$ outside the standing class of every Q1 node: the class is [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html), and BZSV's own treatment excludes this $X$ from it.\n\n> **(i′) What the type-$N$ root does not settle.** The note to [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) gives \"no roots of type $N$\" as a criterion under which the connected-stabilizer clause (2) *holds*. It is sufficient, not necessary, so a type-$N$ root does not on its own show that clause (2) fails here; what fails, and all this node needs, is membership in the class BZSV's results are stated for.\n\n## The three columns\n\n**Verified.** That the appendix note is a one-directional criterion — [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html), read this run: \"condition (2) holds **for example** when $X$ has no roots of type $N$\". That $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$ has a spherical root of type $N$ and is placed outside the hyperspherical setting by BZSV §7.6.5, which the node already carried with a page citation and which its `2026-08-04` creation entry records from the [Q1-L1 `/examples` run](../../Q1-L1/examples.html).\n\n**Refuted.** The entailment \"has a type-$N$ root, therefore clause (2) fails\". Nothing in the appendix, and nothing cited by the node, supports it.\n\n**Unverified, and deliberately not asserted either way.** Whether the $B$-stabilizers in the open $B$-orbit of $\\mathrm{PSL}_2/\\mathrm{PO}_2$ *are* in fact disconnected. It may well be true — $\\mathrm{PO}_2$ is disconnected — but no source in this repository's closed world states it, and the revised clause is written so that the node does not depend on the answer.\n\n## Considered and not adopted\n\n- **Deleting clause (i) and keeping only (ii)–(iii).** Rejected: (i) is what makes the node an example *of the class boundary* rather than a loose remark about braided categories; without it (iii) has no antecedent.\n- **Asserting outright that clause (2) fails, on the grounds that $\\mathrm{PO}_2$ is disconnected.** Rejected under §2 of `/update`: clause (2) is about $B$-stabilizers in the *open $B$-orbit*, not about the connectedness of the acting group, and no entry in the closed world makes that step. It would be trading a converse error for an unsourced claim.\n- **Strengthening the appendix note to a biconditional.** Rejected: the appendix records what the manuscript and BZSV Rmk 4.2.1 say, and neither states a converse. The appendix is also not `/update`'s to write.\n\n## Two consequential edits in the same revision\n\nClause (iii) and the node's title both asserted the claim clause (i′) withdraws, so both were brought into line in the same edit rather than left contradicting the statement beneath them.\n\n**Title.** \"…: the connected-stabilizer hypothesis is load-bearing\" became \"…: the standing-class hypothesis is load-bearing\". The node never established that the connected-stabilizer clause fails for this $X$; what it establishes is that $X$ lies outside the class, and that the expected statement changes shape there.\n\n**Clause (iii).** \"The hypothesis is therefore load-bearing. Dropping **it**…\" became \"The class hypothesis is therefore load-bearing. Dropping **membership in the standing class**…\", so the antecedent of the pronoun is the thing (i) actually shows.\n\nThe node's evidential force is unchanged: it is still the boundary witness that the standing class is not a convenience, because outside it a braided category replaces the symmetric-monoidal shape — clause (ii), which this revision does not touch.\n";</script>
