 [Q1](../../../../dag.html) — it delimits the standing class, and does not contradict [Q1-L1](../../Q1-L1/index.html) or any node inside that class.\n\n## Added\n\nThree labelled paragraphs, canonical in [the node](../index.html), of which the one worth stating separately is the reason this is not an instance of the main theorem: the obstruction is at the level of the **conclusion**, not of the proof. By clause (ii) the expected answer here is braided — a block equivalent to representations of quantum $\\mathrm{SL}_2$ at a fourth root of unity — where [unramified relative local Langlands](../../../../appendix/conj-relative-langlands-unramified.html) and the main theorem are symmetric monoidal, so restoring the class hypothesis is not a matter of proving more. The remaining two record the parent as [Q1](../../../../dag.html) with the register entry [K11](../../../../key_examples/k11.html), and that [Q3](../../../../dag.html) misses this $X$ twice — once through inheriting [Q1](../../../../dag.html)'s Setting, once because $\\mathrm{PO}_2$ is disconnected and hypothesis **(A)** of [Q3-L6](../../../Q3/Q3-L6/index.html) asks for connected fixed points.\n\n## Considered and not adopted\n\nReopening clause (i′), which the standing flaw block still quotes. Rejected: u1 already repaired the converse-of-a-sufficient-condition error the flaw names, (i′) now states the limitation correctly, and the flaw block is generated from the supersession record rather than from the current text.\n";</script>
