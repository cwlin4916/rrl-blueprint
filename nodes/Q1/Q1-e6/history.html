mined and unchanged: the class boundary, `K11`, where the connected-stabilizer hypothesis is shown load-bearing.\n- **2026-08-05 — statement revised** by `/update Q1`, recorded in [u1.md](updates/u1.html). Clause (i) inferred that the connected-stabilizer clause (2) of [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) **fails** here from the **presence** of a spherical root of type $N$; the appendix note it cited gives “no roots of type $N$” as a criterion under which clause (2) *holds*, so the inference was that criterion's converse. Clause (i) now concludes only what BZSV §7.6.5 licenses — that this $X$ is outside the class their results are stated for — and a new clause (i′) says explicitly what the type-$N$ root does not settle. The title and clause (iii) asserted the same withdrawn claim and were brought into line. The node's evidential force is unchanged: it is still the boundary witness that outside the standing class a braided category replaces the symmetric-monoidal shape.\n- **2026-08-07 — statement extended** by `/update Q1-e*` ([u2](updates/u2.html), user-commissioned: instance-of-the-main-theorem, parent relation, Q3 cross-check): three labelled paragraphs appended, replacing a closing line that named [Q1-L1](../Q1-L1/index.html) alongside the question. Not an instance of the main theorem, and the obstruction is at the level of the **conclusion**: by clause (ii) the expected answer is braided where the main theorem is symmetric monoidal, so restoring the class hypothesis is not a matter of proving more. [Q3](../../../dag.html) misses this $X$ twice, through [Q1](../../../dag.html)'s Setting and through the disconnectedness of $\\mathrm{PO}_2$. Clauses (i)–(iii) untouched.\n";</script>
