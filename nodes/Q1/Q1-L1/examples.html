<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L1</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L1 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L1\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [papers](../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L1](index.html) — the Satake subcategory of [the Satake subcategories](../../../appendix/def-satake-subcategory.html) as the thick, Hecke-stable hull of the Hecke orbit of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) — together with its function-theoretic shadow and the spherical varieties for which the categorical equivalence it feeds is known. This file is outside the closed world: it justifies believing or doubting the statement, and no proof may cite it. The machine-readable verdict is the last line.\n\n## Precedent\n\n**What was searched.** On disk: `BZSV.pdf` (arXiv:2409.04677v1) §7.3, §7.5–7.6, §8 opening, §9 in full (pp. 155–172, 189–201); `SV17.pdf` (arXiv:1203.0039v4) contents and §16 (pp. 238–246); `bezrukavnikov2008equivariant.pdf`, `bezrukavnikov2016two.pdf`, `arkhipov2004quantum.pdf`, `zhu2025tamecategoricallocallanglands.pdf` (introductions, theorem statements). Web: arXiv records 1909.11492, 2207.04078, 2310.20006, 0905.4244.\n\n**The construction, categorical level.** BZSV Conjecture 7.5.1 (p. 161) is the ambient statement, and its two desiderata are Q1-L1's objects: the pointing §7.5.2 sends the basic object $\\delta_X$ (normalised Verdier self-dual, $D\\delta_X = \\delta_X$, §7.3.2–7.3.3) to the sheared structure sheaf — the pointing note of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) — and the Hecke desideratum §7.5.3 works with exactly the translates $\\mathcal{T}_V\\star\\delta_X$, computes their Homs in (7.16), and concludes (p. 163) that under the conjecture *\"all sheaves on $X_F/G_O$ can be generated from the basic object through the action of Hecke functors.\"* Lemma 7.5.13 (p. 167) argues directly with the object Q1-L1 defines — \"the full subcategory it generates under the Hecke action\" is equivariantizable, and equals everything given Conjecture 7.5.1 — and §8 (p. 171) names its inner endomorphisms the *Plancherel algebra*, \"the part of the local conjecture that has to do with the basic object.\" What is **not** in BZSV: the small-category cut. Footnote 59 keeps small and large versions side by side, and the generated subcategory lives in the large category; the intersection with $\\mathcal{D}_c$, its thickness and idempotent-completeness — i.e.\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\\cap\\langle\\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\n$$\n\n— is the manuscript's regularisation (ratified in [Q1-L1](index.html)), and that def-check is this node's own content.\n\n**The function-theoretic analogue.** The dictionary is stated by BZSV, not reconstructed here (their $\\mathfrak{o}$ the ring of integers of the local field, $\\mathfrak{f}$ its residue field — [ring of integers](../../../appendix/conv-ring-of-integers.html)): the basic vector $\\mathbf{e} = \\mathbf{1}_{X(\\mathfrak{o})}$ (§9, p. 189); \"$\\mathcal{T}_V\\star\\delta_X$ matches with the function obtained by applying the corresponding Hecke operator $T_V$ to $1_{X(\\mathfrak{o})}$\" (§7.5.3, p. 162); \"the Plancherel measure encodes the inner products of all Hecke operators applied to the basic vector, while the Plancherel algebra encodes the Hom spaces between all Hecke functors applied to the basic object\" (p. 189, with (9.1)–(9.2)). The analogue of the Satake subcategory is therefore the Hecke submodule $\\mathcal{H}(G(F),K)\\cdot\\mathbf{e}\\subseteq C_c^\\infty(X(F))^K$, and BZSV §9.4, *Questions about the Hecke module structure of spherical functions* (p. 200), is devoted to it: (9.15) predicts $C_c^\\infty(X_{\\mathfrak{f}};k)^{G_{\\mathfrak{o}}}$ as derived functions on the $q^{-1/2}$-twisted inertia of $\\check{M}/\\check{G}$, and for $k=\\mathbb{C}$, where [Sak13] applies, deduces an isomorphism of Hecke modules with distinguished vector and inner product, $C_c^\\infty(X_F/G_O)\\simeq\\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$, $\\mathbf{e}\\mapsto 1$ (p. 201).\n\n**Theorem-level shadow.** The Frobenius trace of the conjecture is a theorem: BZSV Prop. 9.2.1 (density formula (9.5), conditional on their Conj. 8.1.8) matches, via Prop. 9.3.3 and the boxed summary of §9.3 (p. 193), the unconditional computations [Sak13, Thm 9.0.1] ($X$ homogeneous affine or Whittaker-induced, plus combinatorial conditions, p. 194) and [SW22, (1.11)] ($\\check{G}_X = \\check{G}$). SV17 quotes the same theorem: \"its unramified $L^2$-spectrum is supported on … the set of $X$-distinguished unramified Arthur parameters\" (§16.3, p. 243, conditions p. 244), inside their unitary local conjecture 16.2.2 (p. 241) — the classical form of [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html). Here [Sak13] = Sakellaridis, *Spherical functions on spherical varieties*, Amer. J. Math. 135 (2013) 1291–1381, arXiv:0905.4244 — cited through BZSV §9.3 and SV17 §16.3, primary not opened; no `refs.bib` key.\n\n**What was not found.** (a) Decategorification is open beyond the group case: \"One hopes that a suitable 'trace of Frobenius' on the category of sheaves recovers the vector space of $G_{\\mathfrak{o}}$-invariant functions on $X_{\\mathfrak{f}}$. This is studied in the group case in [Zhu18]; we do not know it is true for $X_{\\mathfrak{f}}/G_{\\mathfrak{o}}$\" (BZSV §9.4, p. 200). (b) No source asserts that $\\mathbf{e}$ *generates* $C_c^\\infty(X(F))^K$; under the $k=\\mathbb{C}$ identification, generation by $\\mathbf{e}$ becomes surjectivity of the twisted restriction $\\mathbb{C}[\\check{G}]^{\\check{G}}\\to\\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$ (constructed, unsourced) — the exact analogue of Q1's seed equality, posed in §9.4 and answered nowhere. (c) Neither primary source treats the Iwahori-level function theory; SV17 §16.3 is hyperspecial throughout. No published statement contradicts Q1-L1; the boundary phenomena below bear on Q1's exhaustion question, not on this def-check.\n\n## Instances\n\n### 1. The point, $X = \\mathrm{pt}$\n\n**What it is.** $X = \\mathrm{pt}$, any reductive $G$; the \"trivial period\". **Why an instance:** smooth affine, spherical (the open $B$-orbit is $X$), $B$-stabilizer $= B$ connected — all clauses of [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html). **What the statement says here:** the Satake subcategory is the thick Hecke hull of the constant sheaf on $BK$ inside sheaves on $BG_O$; per BZSV §7.6.3 (p. 169) the category is $\\mathrm{Perf}(H^*(BG))$, $\\check{M}/\\check{G}\\simeq\\mathfrak{c}_G$ is the Kostant slice, and \"the equivalence as module categories for the Hecke category is a theorem of Bezrukavnikov–Finkelberg [BF08]\". **Source.** BZSV §7.6.3; `refs.bib`: `BZSV`, `bezrukavnikov2008equivariant`.\n\n### 2. Iwasawa–Tate, $X = \\mathbb{A}^1$, $G = \\mathbb{G}_m$\n\n**What it is.** The simplest non-homogeneous case. **Why an instance:** smooth affine; open $\\mathbb{G}_m$-orbit with trivial (connected) stabilizer. **What the statement says here:** the Hecke translates of the basic object are the normalised constant sheaves $\\delta_l$ of BZSV (7.8), with $\\mathrm{Hom}(\\delta_{l_1},\\delta_{l_2})\\simeq H^*(B\\mathbb{G}_m)$ up to twist by $d = |l_1-l_2|$ (7.9), and Example 7.6.1 (p. 168) verifies the match with $\\check{G}$-equivariant modules on $\\check{M} = T^*\\mathbb{A}^1$ \"by hand\". Hilburn–Raskin proved a fully ramified de Rham version (reported BZSV §7.6.5, p. 169). **Source.** BZSV Ex. 7.3.5 (p. 158), Ex. 7.6.1, §7.6.5; `refs.bib`: `BZSV`.\n\n### 3. The group case, $X = H$ under $G = H\\times H$\n\n**What it is.** Q1's known extreme. **Why an instance:** smooth affine; Bruhat gives the open $B\\times B^-$-orbit; its stabilizer is the diagonal torus, connected (standard). Recorded as [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(1). **What the statement says here:** $\\mathrm{IC}_0$ is the monoidal unit, $\\mathcal{F}\\ast\\mathrm{IC}_0 = \\mathcal{F}$, so the Satake subcategory is all of $\\mathcal{D}_c(L^+H\\backslash LH/L^+H)$ (constructed, unsourced one-liner), and derived Satake computes it: $D^{\\check{H}}_{perf}(\\mathrm{Sym}^{[]}(\\check{\\mathfrak{h}}))\\cong D_{\\mathbf{H_O}}(\\mathrm{Gr})$, Bezrukavnikov–Finkelberg **Theorem 5** (p. 7, read). Iwahori level, the model of the main theorem: Bezrukavnikov, **Theorem 1** (p. 5, read), equivalences (2)–(4), e.g. $\\Phi_{II}\\colon D_{II}\\cong DGCoh^{\\check{H}}(\\tilde{\\mathcal{N}}\\times^L_{\\check{\\mathfrak{h}}}\\tilde{\\mathcal{N}})$; the tame arithmetic form is the aim of Zhu, arXiv:2504.07482, §1.1 (read). Function shadow in the group case: [Zhu18] per BZSV §9.4. **Source.** `refs.bib`: `bezrukavnikov2008equivariant`, `bezrukavnikov2016two`, `zhu2025tamecategoricallocallanglands`.\n\n### 4. The Whittaker period (twisted; one hypothesis not discharged)\n\n**What it is.** $M = T^*(G/_\\psi U)$, the dual extreme of the point. **Why it is only partly an instance:** the polarization is *twisted* by $\\psi$, so the untwisted clause of [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) is **not discharged** — this sits just outside the standing class, and is listed because it supplies the Iwahori-level black box [ABG](../../../appendix/bb-abg.html). **What the statement says here:** the Hecke category is Whittaker sheaves on $\\mathrm{Gr}$, $\\check{M} = \\mathrm{pt}$, and the equivalence with $\\mathrm{Rep}(\\check{G})$ (sheared) \"is due to Frenkel–Gaitsgory–Vilonen [[FGV01](../../../../papers/FGV01.pdf)]\" (BZSV §7.6.4, p. 169). Iwahori–Whittaker level: ABG diagram (1.1.1) and (1.1.2), $D^b\\mathrm{Perv}^{\\mathrm{mix}}(\\mathrm{Gr})\\cong D^b\\mathrm{Coh}^{G\\times\\mathbb{C}^*}(\\tilde{\\mathcal{N}})$, $\\mathrm{block}(\\mathsf{U})\\simeq\\mathrm{Perv}(\\mathrm{Gr})$ (pp. 2–3, read). **Source.** BZSV §7.6.4; `refs.bib`: `arkhipov2004quantum`; `FGV01` absent.\n\n### 5. Godement–Jacquet, $X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$, and the Rankin–Selberg/Gross–Prasad family\n\n**What it is.** The matrix space. **Why an instance:** smooth affine (a vector space); the open orbit $\\mathrm{GL}_n$ makes the sphericity and connected-stabilizer checks those of instance 3. BZSV list it among the placid cases (p. 155) and Example 7.3.7 computes the Hecke translates of the basic object explicitly: $\\mathcal{T}_j\\star\\delta_X = \\mathrm{I}_j$ up to twist by $j(n-j)$, formula (7.10) — Q1-L1's generating set, written out. **What the statement says here:** the unramified equivalence is a theorem, [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(2) citing [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)]; BZSV §7.6.5 (p. 170) reports the same papers and [BFT22a] also prove $X = \\mathrm{GL}_n$ ($\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$), $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ ($\\mathrm{GL}_n\\times\\mathrm{GL}_n$), $X = \\mathrm{SO}_n$ ($\\mathrm{SO}_n\\times\\mathrm{SO}_{n-1}$), and Travkin–Yang the $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$ case. **Source.** BZSV §7.3.4, §7.6.5; arXiv:1909.11492 (abstract read; Compositio 157 (2021)); `refs.bib`: `BravermanFinkelbergGinzburgTravkin_2021`, `BFT_orthosymplectic_satake`.\n\n### 6. A symmetric variety with the full derived equivalence: $X = \\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$\n\n**What it is.** The symplectic period (Jacquet–Rallis). **Why an instance:** homogeneous with reductive stabilizer, hence smooth affine; symmetric, hence spherical (standard); connectedness of the $B$-stabilizers on the open orbit is **not discharged** from the sources read here. **What the statement says here:** Chen–Macerato–Nadler–O'Brien establish derived Satake for $\\mathrm{GL}_n(\\mathbb{H})$ and deduce it for $\\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$ (abstract, arXiv:2207.04078, read); BZSV §7.6.5 (p. 169): \"[CMNO22] prove the local conjecture in the case $X = GL_{2n}/Sp_{2n}$\", with $\\check{M}\\simeq GL_{2n}\\times^{GL_n}M_n$. For general symmetric $X$ at perverse level, Chen–Yi (arXiv:2310.20006v4; numbers as verified in [papers/guideline.md](../../../papers/guideline.html)) prove $\\mathrm{Perv}(L^+G\\backslash LX)$ semisimple and $\\simeq\\mathrm{Rep}(\\check{G}_X)$ under even relative codimensions (v4 Cor. 9). **Source.** `refs.bib`: `chen2022quaternionic`, `chenyi_2025singularitiesorbitclosuresloop`.\n\n### 7. Boundary case: $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$ (hypothesis fails, conclusion changes shape)\n\n**What it is.** A symmetric variety with a root of type $N$. **Why it is a boundary case:** BZSV §7.6.5 (pp. 169–170, read) place it \"outside of our hyperspherical setting due to the presence of Type N roots\" — and the note to [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) ties absence of type-$N$ roots to the connected-stabilizer clause, so a standing hypothesis of every Q1 node fails here. **What happens:** per BZSV, Macerato–Taylor combined with Chen–Nadler imply the local category \"contains a block equivalent to representations of quantum $SL_2$ at a fourth root of unity\", so a braided category replaces the symmetric one — the hypothesis is load-bearing. This bears on the *scope* of Q1, not against Q1-L1. **Source.** BZSV §7.6.5; `refs.bib`: keys for [MT24], [CN24] absent.\n\n## Promotion candidates\n\nPer [ADR 0018](../../../process/decisions/0018-example-and-analogy-nodes.html); statements for the lead-researcher to materialize, not node directories.\n\n- **Q1-a1 — The Hecke module of the basic function.** For $X$ smooth affine spherical over $F = \\mathbb{F}_q((t))$, split with all colors defined over $\\mathbb{F}_q$, the unramified Hecke algebra $\\mathcal{H}(G(F),K)$ acts on $C_c^\\infty(X(F))^K$ and the basic vector $\\mathbf{e} = \\mathbf{1}_{X(\\mathfrak{o})}$ generates a submodule $\\mathcal{H}(G(F),K)\\cdot\\mathbf{e}$ — the trace-of-Frobenius shadow of [the Satake subcategories](../../../appendix/def-satake-subcategory.html). BZSV predict $C_c^\\infty(X_{\\mathfrak{f}};k)^{G_{\\mathfrak{o}}}$ as derived functions on the $q^{-1/2}$-twisted inertia of $\\check{M}/\\check{G}$, and for $k=\\mathbb{C}$, where [Sak13] applies, prove $C_c^\\infty(X_F/G_O)\\simeq\\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$ as Hecke modules, $\\mathbf{e}\\mapsto 1$. Whether $\\mathbf{e}$ generates the whole module is the function-theoretic form of Q1's seed equality and is not answered in print. *Source:* BZSV §9.4, (9.15), pp. 200–201. *Speaks to:* [Q1-L1](index.html), [Q1-L6](../Q1-L6/index.html), and the register of [key examples](../../../key_examples/index.html).\n- **Q1-a2 — The unramified Plancherel formula as decategorified conjecture.** The Plancherel density of $\\mathbf{e}$ in $L^2(X(F))$ is the measure $|W_X|^{-1}\\det(I-t|\\check{\\mathfrak{g}}_X/\\check{\\mathfrak{a}}_X)\\,/\\det(I-(t,q^{-1/2})|V_X)\\,dt$ on the compact form of $\\check{A}_X/W_X$; this is a theorem of [Sak13, Thm 9.0.1] ($X$ homogeneous affine, conditions) and [SW22, (1.11)] ($\\check{G}_X=\\check{G}$), and equals the Frobenius trace of the categorical conjecture (BZSV Prop. 9.2.1 + Prop. 9.3.3). *Source:* BZSV §9.2–9.3, pp. 192–199; SV17 §16.3, p. 243. *Speaks to:* the confidence of [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) as standing hypothesis, hence every Q1 node.\n- **Q1-a3 — The $X$-distinguished unramified spectrum.** SV17's local conjecture (weak form): $L^2(X(k)) = \\int_{[\\psi]}\\mathcal{H}_\\psi\\,\\mu(\\psi)$ over $\\check{G}_X$-conjugacy classes of $X$-distinguished Arthur parameters, with the unramified part supported on the associated Langlands parameters of unramified $X$-distinguished $\\psi$. *Source:* SV17 Conj. 16.2.2 (p. 241) and §16.3. *Speaks to:* the spectral side of the register of [key examples](../../../key_examples/index.html).\n- **Q1-e1 — Group case $X = H$.** Derived Satake $D^{\\check{H}}_{perf}(\\mathrm{Sym}^{[]}(\\check{\\mathfrak{h}}))\\cong D_{\\mathbf{H_O}}(\\mathrm{Gr})$; Iwahori level $\\Phi_{II}\\colon D_{II}\\cong DGCoh^{H^\\vee}(\\tilde{\\mathcal{N}}\\times^L_{\\mathfrak{h}^\\vee}\\tilde{\\mathcal{N}})$. *Source:* Bezrukavnikov–Finkelberg 2008, Thm 5; Bezrukavnikov 2016, Thm 1. *Speaks to:* the seed equality in the group case, where it is vacuous.\n- **Q1-e2 — Iwasawa–Tate $X = \\mathbb{A}^1$, $G = \\mathbb{G}_m$.** The equivalence verified by hand, Hom computation (7.9) vs its spectral match; ramified de Rham version by Hilburn–Raskin. *Source:* BZSV Ex. 7.3.5, Ex. 7.6.1, §7.6.5.\n- **Q1-e3 — Whittaker period.** $\\check{M} = \\mathrm{pt}$; equivalence due to [[FGV01](../../../../papers/FGV01.pdf)]; Iwahori–Whittaker: ABG (1.1.1)–(1.1.2). *Source:* BZSV §7.6.4; arkhipov2004quantum. Twisted polarization: outside the untwisted standing class, record as such.\n- **Q1-e4 — Godement–Jacquet $X = M_n$.** Unramified equivalence, [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)]; Hecke translates of the basic object explicit in BZSV (7.10). *Source:* as in instance 5.\n- **Q1-e5 — Symplectic period $X = \\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$.** Derived Satake via $\\mathrm{GL}_n(\\mathbb{H})$. *Source:* chen2022quaternionic (arXiv:2207.04078); BZSV §7.6.5.\n- **Q1-e6 — Boundary $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$.** Type-$N$ root; quantum-$SL_2$ block; the connected-stabilizer hypothesis is load-bearing. *Source:* BZSV §7.6.5, pp. 169–170.\n\nEVIDENCE: precedent\n";</script>
