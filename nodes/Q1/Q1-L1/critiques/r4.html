<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q1-L1</a><i>›</i><span>r4</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L1, round 4</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L1/critiques/r4.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReviewed: `blueprint/nodes/Q1-L1/Q1-L1.tex` (45 lines, the post-renotation rewrite) against the frozen statement in `blueprint/nodes/Q1-L1/node.md`, the six entries named in its `objects:` field, [`blueprint/appendix.md`](../../../../appendix/index.html), [`blueprint/context.md`](../../../../context.html), and the three earlier critiques `r1.md`, `r2.md`, `r3.md` in this directory.\n\n## Sweep performed\n\n- **Hallucination — citations.** No `\\cite` anywhere in the file (grep: zero matches for `\\cite`), so nothing to check against `refs.bib`. Vacuously clean.\n- **Hallucination — v2.tex labels and line numbers.** None quoted. In particular the draft does not invent a label for the unlabelled v2.tex:794 definition; it names the blueprint key [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) under the heading \"Appendix entries\", which is the correct handling.\n- **Hallucination — appendix keys.** The five keys in the \"Uses\" line (line 17) plus $\\mathrm{IC}_0$ resolve to real anchors: [the Satake subcategories](../../../../appendix/def-satake-subcategory.html), [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), [small relative tensor product](../../../../appendix/def-small-relative-tensor.html), [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html). The list matches `node.md`'s `objects:` field exactly — r3's Flaw 5 (three-way ledger mismatch) is fixed on the draft/`node.md` side; see Flaw 6 for the residue on the appendix side.\n- **Statement conformity.** Lines 23–27 reproduce `node.md` lines 17–26 **verbatim**, including the ambient subscript $=_{\\mathcal{D}_c(K\\backslash LX)}$, the clause \"where the generation operation … is formed inside the cocomplete ambient category\", the parenthetical \"(stable, idempotent-complete)\", the word \"full\", and — restored since r3 — the clause \"where $\\delta\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is the monoidal unit\", which Step 2 then actually consumes. r3's Flaw 7 is fixed. Nothing strengthened, nothing weakened.\n- **No `GAP` marker** (grep: zero matches).\n- **r3's Flaw 1 (the one place condensation had damaged the mathematics) is genuinely fixed.** Line 34 now writes $\\bigcap_f (f^!)^{-1}\\mathcal{D}_c(S')$, not $(f^!)^{-1}\\mathcal{D}(S')^\\omega$, and supplies the missing justification (\"coherence is a Serre condition; summands of coherent modules are coherent\"). The forbidden silent identification $\\mathcal{D}^\\omega = \\mathcal{D}_c$ is gone. This was the most serious defect in the previous draft and it has not been reintroduced.\n- **r3's Flaw 4 (over-declaration).** Fixed: `p:compact_generation_stable_case` no longer appears in either `objects:` or \"Uses\", and nothing in Steps 1–5 needs it.\n- **r3's Flaw 6 (\"fails in $\\mathcal{D}(K\\backslash LX)$\").** Moot — the caveat was deleted wholesale, and no claim about the non-renormalized reading survives.\n- **The heart of the node — thick versus cocomplete — is correct.** I checked Step 4 (line 40) link by link and it survives hostile reading. $L := \\mathrm{Ind}(j)$ preserves filtered colimits by construction and finite colimits because $j$ is exact, hence all small colimits (a stable category's small colimits are generated by finite ones and filtered ones). The full-faithfulness computation uses compactness in exactly the right place: $\\operatorname{Map}_{\\mathcal{N}}(\\varinjlim_i jy_i, -) \\simeq \\varprojlim_i\\operatorname{Map}_{\\mathcal{N}}(jy_i,-)$ is the universal property and needs nothing, while the interchange $\\operatorname{Map}_{\\mathcal{N}}(jy_i,\\varinjlim_{i'}jy'_{i'})\\simeq\\varinjlim_{i'}\\operatorname{Map}_{\\mathcal{N}}(jy_i,jy'_{i'})$ needs compactness of $jy_i$ in $\\mathcal{N}$, which Step 3 supplies ($y$ lands in $\\mathcal{N}^\\omega$). The identification with $\\operatorname{Map}_{\\mathrm{Ind}\\,\\mathcal{T}}$ uses full faithfulness of the Yoneda embedding and fullness of $\\mathcal{T}\\subseteq\\mathcal{M}_c$, both available. The essential image $\\mathcal{L}$ is then a cocomplete stable subcategory of $\\mathcal{N}$ (the lifting argument along the equivalence $\\mathrm{Ind}\\,\\mathcal{T}\\simeq\\mathcal{L}$ is correct because $L$ preserves all small colimits), so [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html)'s minimality applies to give $\\langle S\\rangle_{\\mathcal{N}}\\subseteq\\mathcal{L}$ — and *only* minimality against \"cocomplete stable\" is used, never a thickness-level minimality that `def:generation` would not license. The transport $c$ compact in $\\mathcal{N}$ $\\Rightarrow$ compact in $\\mathcal{L}$ (filtered colimits of $\\mathcal{L}$ are those of $\\mathcal{N}$) $\\Rightarrow$ $c$ corresponds to an object of $(\\mathrm{Ind}\\,\\mathcal{T})^\\omega = \\mathcal{T}$ is legitimate, and its one non-formal hypothesis — idempotent-completeness of $\\mathcal{T}$ — is genuinely proved in Step 2, from idempotent-completeness of $\\mathcal{M}_c$ in Step 1, not assumed. The retract-closure of $\\langle S\\rangle_{\\mathcal{N}}$ used in Step 3 is deduced from ambient small colimits (the $\\mathrm{Idem}$-diagram), i.e. from the *stronger* property, in the correct direction. This is the step the brief asked me not to skim; it holds.\n- **Retracts formed where.** Correctly: Step 1 proves $\\mathcal{M}_c$ itself idempotent-complete, Step 2 upgrades this to $\\mathcal{T}$, and every minimality argument (Steps 3 and 5) checks retract-closure *in $\\mathcal{M}_c$*. No retract is ever taken in $\\mathcal{N}$ and silently repatriated to $\\mathcal{M}_c$.\n- **Circularity.** `depends-on` is empty and no node is invoked; the only quasi-external inputs are the three the prover volunteered, treated below. The ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading is carried by [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) and by [context](../../../../context.html)'s ratified-readings list, so citing it is inside the closed world and not self-licensing. [the small Satake comparison](../../../../appendix/thm-f-cstr-sat.html) — the evidence for the reading — is invoked only in `node.md`'s Remark, never in the proof.\n\n## Flaws\n\n**Flaw 1** [MAJOR] — The stated composite does not type-check, and the missing input is not a triviality.\n\n<details><summary>(location: Step 5, line 42, \"each $\\mathcal{F}'\\ast(-)$ is exact (the bi-exact $\\mathcal{G}\\mapsto\\mathcal{F}'\\boxtimes\\mathcal{G}$ then the action map of Step 2, a morphism of $\\mathrm{Cat}^{\\mathrm{perf}}$)\", read against Step 2, line 36, \"$\\ast$ is the action $\\mathcal{H}_c\\times\\mathcal{M}_c\\rightarrow\\mathcal{M}_c$\") · the finding</summary>\n\n1. **Wrong source.** Step 2 declares the action as a functor out of the *product* $\\mathcal{H}_c\\times\\mathcal{M}_c$. Step 5 then calls \"the action map of Step 2\" a morphism of $\\mathrm{Cat}^{\\mathrm{perf}}$ and precomposes it with $\\mathcal{G}\\mapsto\\mathcal{F}'\\boxtimes\\mathcal{G}$. But $\\boxtimes$ lands in the tensor product $\\mathcal{H}_c\\otimes\\mathcal{M}_c$ of [small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(2), not in $\\mathcal{H}_c\\times\\mathcal{M}_c$, so as written the two functors are not composable at all.\n2. **The distinction is not cosmetic.** Exactness of a functor $F$ *on the product* is strictly weaker than exactness in each variable, and it is the latter that Step 5 needs. In $\\mathcal{H}_c\\times\\mathcal{M}_c$ the cofibre of $(\\mathrm{id}_{\\mathcal{F}'}, f)$ is $(0,\\mathrm{cofib}\\, f)$, so an exact $F$ on the product gives only $F(0,\\mathrm{cofib}\\, f)\\simeq\\mathrm{cofib}(F(\\mathcal{F}',m)\\rightarrow F(\\mathcal{F}',m'))$, which is not the assertion \"$\\mathcal{F}'\\ast(-)$ is exact\". So invoking [small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(1) (\"morphisms of $\\mathrm{Cat}^{\\mathrm{perf}}$ are exact\") against the $\\times$-typed functor of Step 2 does not deliver what Step 5 consumes. The correct route is the $\\otimes$-typed action, which is a different piece of data.\n3. **An unestablished membership.** Even after repairing $\\times\\rightsquigarrow\\otimes$, the repaired argument needs $\\mathcal{H}_c = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\in\\mathrm{Cat}^{\\mathrm{perf}}$ — both for $\\mathcal{H}_c\\otimes\\mathcal{M}_c$ to be formed by [small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(2) and for $\\mathcal{F}'\\boxtimes(-)$ to be the insertion into it. Step 1 establishes membership in $\\mathrm{Cat}^{\\mathrm{perf}}$ only for $\\mathcal{M}_c$; nothing in the draft says a word about $\\mathcal{H}_c$. (The Step 1 argument does apply verbatim, since [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) is stated for an arbitrary prestack $\\mathcal{Y}$ — but that sentence has to be written, and it inherits Flaw 3's undeclared inputs.)\n4. **What the listed objects actually say.** [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) says only \"The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left.\" It fixes neither the ambient in which \"monoidal\" and \"acts\" are meant, nor the exactness of the action bifunctor. So the prover's self-assessment (3) is right to be uneasy: exactness of $\\mathcal{F}'\\ast(-)$ is **not** obtainable from the declared objects by the argument given.\n\nThis matters because exactness is load-bearing: $\\mathcal{U}$ is thick only if each $(\\mathcal{F}'\\ast(-))^{-1}(\\mathcal{T})$ is closed under shifts and cofibres (retracts are free — every functor preserves retract diagrams), and without thickness of $\\mathcal{U}$ the minimality of $\\mathcal{T}$ cannot be applied and the submodule assertion of the frozen statement is unproved. Unitality and associativity of the action, also used in Steps 2 and 5, sit on exactly the same footing.\n\n**Fillable, cheaply, but not by the prover.** The entry that closes it is [module categories over a monoidal category](../../../../appendix/conv-module-categories.html), which states in terms that \"the action functor of an object $a\\in\\mathcal{A}$ on a module $\\mathcal{M}$ is $k$-linear and exact\", and says that for small categories the ambient is $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$ — precisely items 1–2 above — together with [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../../appendix/conv-hecke-action.html), which supplies $\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)$ and identifies the action on $LX$ with the convolution pull–push. Both exist in the appendix; neither is in this node's `objects:` field, so as the ledger stands the draft may not use them. Adding them to `objects:` is a lead-researcher edit; the prover then replaces the parenthetical in Step 5 by a citation and retypes Step 2's action as $\\mathcal{H}_c\\otimes\\mathcal{M}_c\\rightarrow\\mathcal{M}_c$. Note that r3's Flaw 2 already identified the convolution facts as \"the proof's single most fragile input\" and as invisible to the dependency ledger; half of that was fixed (declaring $\\mathrm{IC}_0$), and this half was instead papered over with a derivation that does not compose.\n\n</details>\n\n**Flaw 2** [MINOR] — Two objections, neither fatal.\n\n<details><summary>(location: Step 1, line 34, \"Smallness is standing data: `def:renormalized` forms $\\mathrm{Ind}\\,\\mathcal{M}_c$, and `def:small_relative_tensor`(2) defines $\\mathrm{Ind}$ on small categories\") · the finding</summary>\n\n(i) *Misparaphrase of a listed entry.* [small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(2) does not \"define $\\mathrm{Ind}$ on small categories\": it equips $\\mathrm{Cat}^{\\mathrm{perf}}$ with a symmetric monoidal structure and asserts the adjoint equivalence $\\mathrm{Ind}\\colon(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)\\rightleftarrows\\mathrm{Pr}^L_{\\mathrm{st},\\omega}$. Its domain is $\\mathrm{Cat}^{\\mathrm{perf}}$ — small **and idempotent-complete and stable** — not \"small categories\". The entry that says \"$\\mathrm{Ind}(\\mathcal{D})$, for $\\mathcal{D}$ small, is the ind-completion\" is [compact generation](../../../../appendix/def-compactly-generated-category.html), which is not in `objects:`.\n\n(ii) *The inference proves too much.* If the $\\mathrm{Ind}$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) really is the $\\mathrm{Ind}$ of `def:small_relative_tensor`(2), then well-formedness of $\\mathcal{D}^{\\mathrm{ren}} := \\mathrm{Ind}(\\mathcal{D}_c)$ already delivers $\\mathcal{M}_c\\in\\mathrm{Cat}^{\\mathrm{perf}}$ outright, and the entire remainder of Step 1 (the Serre-condition argument, retract-closure, idempotent splitting in $\\mathcal{D}(K\\backslash LX)$) is redundant. If it is the general ind-completion, only smallness follows — but then the cited entry is the wrong one. The draft cannot have it both ways; as written the sentence is a presupposition argument dressed as a citation.\n\nThe claim itself is true and is stated flatly in the appendix: [the standing notation](../../../../appendix/subsec-notations.html), \"$\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules\". That is the entry that closes it, and it belongs in `objects:`. The prover's self-assessment (2) is therefore over-optimistic in its route but harmless in its conclusion.\n\n</details>\n\n**Flaw 3** [MINOR] — *a repeat of r3's Flaw 3*\n\n<details><summary>(location: Step 1, line 34, \"$f^{!}$ is exact\"; \"the cocomplete stable $\\mathcal{D}(K\\backslash LX)$, where idempotents split\") · the finding</summary>\n\nCocompleteness and stability of the ambient $\\mathcal{D}(K\\backslash LX)$, and exactness of $f^!$, are load-bearing (they are what make $\\mathcal{M}_c$ idempotent-complete, hence $\\mathcal{T}$ idempotent-complete, hence $(\\mathrm{Ind}\\,\\mathcal{T})^\\omega=\\mathcal{T}$ in Step 4) and are supplied by no entry in `objects:`. [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) writes \"$\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$\" and attributes no property whatever to $\\mathcal{D}(\\mathcal{Y})$. The entries that close it are [the standing notation](../../../../appendix/subsec-notations.html) (\"$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules\") together with [`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html) ($\\mathrm{DGCat} = \\mathrm{LMod}_{\\mathrm{LMod}_k}(\\mathrm{Pr}^L)$, so its objects are presentable and stable and its morphisms colimit-preserving), and [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html) for $f^!$ being a $\\mathrm{DGCat}$-morphism. I agree with the prover's self-assessment (1) that this is the standing meaning of $\\mathcal{D}(-)$ — but \"standing meaning\" lives in appendix entries that this node does not declare, which is exactly the objection r3 raised at its Flaw 3 and which the rewrite did not act on. Graded MINOR rather than MAJOR only because the fact is unambiguous, undisputed, and closed by entries already written.\n\n</details>\n\n**Flaw 4** [MINOR] — *a repeat of r3's Flaw 8, second consecutive round*\n\n<details><summary>(location: whole file — no `% Response to critique` block) · the finding</summary>\n\nA round-4 draft carries no record of how r1's MAJOR (the `GAP` marker), r2's two MINORs and r3's eight MINORs were disposed of. I verified independently that r1's MAJOR is resolved (no marker; the ambiguity is settled at blueprint level and recorded in [the Satake subcategories](../../../../appendix/def-satake-subcategory.html)'s note and in [context](../../../../context.html)'s ratified readings 1–2), that r3's Flaws 1, 4, 6, 7 are fixed and r3's Flaw 5 half-fixed — but a reader of the `.tex` alone cannot distinguish deliberate retirement from loss in the rewrite, and this is now the second round in which a referee has had to reconstruct that by hand. One commented paragraph fixes it. (Because the draft was deleted and rewritten against the renotated statement, I do not treat this as a substantive regression, but it should not survive a third round.)\n\n</details>\n\n**Flaw 5** [MINOR] — Two relations with no ambient subscript, where [context](../../../../context.html)'s Notation section requires one: both are equalities of *objects*, so neither exception applies (the ambient is not one of the two sides, and the two sides do live in a common ambient).\n\n<details><summary>(location: line 27, \"$\\mathrm{IC}_0=\\delta\\ast\\mathrm{IC}_0$\"; line 40, \"for filtered $\\tilde y=\\varinjlim_i y_i$\") · the finding</summary>\n\nThe first is inherited verbatim from `node.md` line 22, so the defect is the frozen statement's, not the prover's, and the prover was right to copy rather than to \"improve\" it — but it should be fixed at the node, since [context](../../../../context.html) says the subscript \"is not optional\". The second is the prover's: it should read $\\tilde y\\simeq_{\\mathrm{Ind}\\,\\mathcal{T}}\\varinjlim_i y_i$. Everywhere else the draft is exemplary on this point (lines 34, 36, 38, 40, 42 all carry ambients, and every generation bracket carries its $\\mathcal{N}$ or $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$).\n\n</details>\n\n**Flaw 6** [MINOR] — *residue of r3's Flaw 5*\n\n<details><summary>(location: appendix back-links, versus `node.md` line 12) · the finding</summary>\n\nThe dependency transpose is still broken in the appendix direction: [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html)'s `used by` lists only Q1-L2-L3, [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)'s lists only Q1-L2-L1, and [small relative tensor product](../../../../appendix/def-small-relative-tensor.html) carries no `used by` line at all — yet all three are declared by this node and genuinely consumed by it. Only `def:satake_subcategory`, `def:generation` and `defn:coherent_D_mod` back-link to Q1-L1. An edit to the $\\mathrm{IC}_0$ entry would still silently break this node without any warning from the ledger. Lead-researcher fix; `python3 tools/build_dag_site.py --check` should be catching this.\n\n</details>\n\n**Flaw 7** [MINOR] — The [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) entry defines $\\mathrm{IC}_0$ as the $!$-extension of a constant $\\mathcal{D}$-module and never asserts that it is coherent; membership in $\\mathcal{M}_c$ is only a presupposition of the following sentence of that entry (\"acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ … whose Hecke orbit generates\").\n\n<details><summary>(location: Step 2, line 36, \"By $\\mathrm{IC}_0$, $\\mathrm{IC}_0\\in\\mathcal{M}_c$\") · the finding</summary>\n\nReading a presupposition off an entry is defensible, but \"By $\\mathrm{IC}_0$, $\\mathrm{IC}_0\\in\\mathcal{M}_c$\" overstates what the entry says, and the whole of Steps 2–5 (indeed the well-formedness of $\\mathcal{T}$) rests on it. [The spherical Hecke action entry](../../../../appendix/conv-hecke-action.html)'s display $\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)$ is the clean source; see Flaw 1.\n\n</details>\n\n## Assessment\n\nThe mathematics is right. Step 4 — the passage from \"cocomplete stable generation in $\\mathcal{D}^{\\mathrm{ren}}$\" to \"thick closure in $\\mathcal{D}_c$\", which is the entire content of the node and the step [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html)'s note warns about — is correct, and correct for the right reasons: it never confuses the two closure operations, it uses only \"cocomplete stable\" minimality against $\\langle S\\rangle_{\\mathcal{N}}$, and it earns its one non-formal hypothesis (idempotent-completeness of $\\mathcal{T}$) rather than assuming it. r3's one genuinely damaging finding is repaired, and the statement is now reproduced verbatim.\n\nWhat fails the draft is the closed world, at one specific and load-bearing place. Of the three items the prover volunteered, (1) and (2) are true, undisputed and closed by appendix entries the node merely forgot to declare — MINOR. Item (3) is different: the substitute derivation offered for exactness of $\\mathcal{F}'\\ast(-)$ routes a functor out of $\\mathcal{H}_c\\times\\mathcal{M}_c$ through a $\\boxtimes$ that lands in $\\mathcal{H}_c\\otimes\\mathcal{M}_c$, conflates exactness on a product with exactness in each variable, and needs $\\mathcal{H}_c\\in\\mathrm{Cat}^{\\mathrm{perf}}$, which the draft never establishes. Add [module categories over a monoidal category](../../../../appendix/conv-module-categories.html) and [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) to `objects:` — plus [the standing notation](../../../../appendix/subsec-notations.html), [`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html) and [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html) for Flaws 2–3 — and the round-5 draft is three sentences of work away from passing.\n\nVERDICT: FAIL\n";</script>
