<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L6-z1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L6-z1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L6-z1 — A generating distinguished object supplies stratumwise generation, and cuts support exactly when its extension is reachable\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html); the node's `depends-on` list is empty and no assumed dependency is used below.\n- **notation:** $\\mathcal{N}$ and $\\mathcal{T}_\\alpha$ abbreviate the two generated subcategories, coined in the display opening the proof.\n\n## Lemma\n\nLet $\\mathcal{C}$, $A$, $\\{\\mathcal{C}_\\alpha\\}_{\\alpha\\in A}$ and $S$ be as in [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html), let $\\{e_\\alpha\\dashv r_\\alpha\\}_{\\alpha\\in A}$ be a family of adjunctions between them, and for each $\\alpha\\in A$ let $\\omega_\\alpha\\in\\mathcal{C}_\\alpha$ be a distinguished object. Assume:\n\n**(A) A coreflective family.** Hypothesis **(A)** of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) holds: each $r_\\alpha\\colon\\mathcal{C}\\rightarrow\\mathcal{C}_\\alpha$ is continuous with fully faithful continuous left adjoint $e_\\alpha$.\n\n**(B) The distinguished object generates its member.** For every $\\alpha\\in A$, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html),\n\n$$\n\\left\\langle\\, \\omega_\\alpha[n] \\ \\middle|\\ n\\in\\mathbb{Z} \\,\\right\\rangle_{\\mathcal{C}_\\alpha}\\ =\\ \\mathcal{C}_\\alpha .\n$$\n\n**(C) A witness in the generated subcategory.** For every $\\alpha\\in A$ there are an object $G_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$ and an integer $n_\\alpha$ such that\n\n$$\nr_\\alpha\\, G_\\alpha\\ \\simeq_{\\mathcal{C}_\\alpha}\\ \\omega_\\alpha[n_\\alpha].\n$$\n\nThen, for $S$ and the family $\\{e_\\alpha\\dashv r_\\alpha\\}_{\\alpha\\in A}$:\n\n(i) *(stratumwise generation)* condition (1) of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) holds;\n\n(ii) *(support-cutting, exactly)* for each $\\alpha\\in A$, condition (2) of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) holds at $\\alpha$ if and only if\n\n$$\ne_\\alpha\\,\\omega_\\alpha\\ \\in\\ \\langle S\\rangle_{\\mathcal{C}} .\n$$\n\n## Proof\n\nWrite\n\n$$\n\\mathcal{N}\\ :=\\ \\langle S\\rangle_{\\mathcal{C}},\n\\qquad\n\\mathcal{T}_\\alpha\\ :=\\ \\left\\langle\\, r_\\alpha s \\ \\middle|\\ s\\in S \\,\\right\\rangle_{\\mathcal{C}_\\alpha}\\quad(\\alpha\\in A),\n$$\n\nboth formed as in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html); \"cocomplete stable subcategory\" always means the notion used there.\n\n**Step 1 — a continuous functor between stable categories admitting all small colimits is exact.**\n\n<details><summary>the argument</summary>\n\nLet $F\\colon\\mathcal{M}\\rightarrow\\mathcal{P}$ be such a functor. It preserves the empty colimit, which in a stable category is the zero object, and it preserves pushouts. The square with corners $M,0,0,M[1]$ exhibits $M[1]$ as a pushout, so $F(M[1])\\simeq_{\\mathcal{P}}(FM)[1]$; as $[1]$ is invertible on both sides, $F$ commutes with $[-1]$ too. A cofiber is a pushout, hence preserved, and in a stable category $\\mathrm{fib}(f)\\simeq\\mathrm{cofib}(f)[-1]$, so fibers are preserved as well.\n\n</details>\n\n**Step 2 — the preimage of a cocomplete stable subcategory under such an $F$ is a cocomplete stable subcategory.**\n\n<details><summary>the argument</summary>\n\nWith $F$ as in Step 1 and $\\mathcal{T}\\subseteq\\mathcal{P}$ a cocomplete stable subcategory, let\n\n$$\nF^{-1}\\mathcal{T}\\ :=\\ \\{\\, M\\in\\mathcal{M}\\ :\\ FM\\in\\mathcal{T} \\,\\}\n$$\n\nbe the full subcategory it spans. It is closed under equivalence and contains $0$; by Step 1 it is closed under both shifts and cofibers, because $\\mathcal{T}$ is; and it is closed under the small colimits of $\\mathcal{M}$, because $F$ is continuous and $\\mathcal{T}$ is closed under the small colimits of $\\mathcal{P}$.\n\n</details>\n\n**Step 3 — $r_\\alpha$ carries $\\mathcal{N}$ into $\\mathcal{T}_\\alpha$.**\n\n<details><summary>the argument</summary>\n\nFix $\\alpha\\in A$. By **(A)** the functor $r_\\alpha\\colon\\mathcal{C}\\rightarrow\\mathcal{C}_\\alpha$ is continuous, so Step 2 makes $r_\\alpha^{-1}\\mathcal{T}_\\alpha$ a cocomplete stable subcategory of $\\mathcal{C}$. It contains every $s\\in S$, since $r_\\alpha s\\in\\mathcal{T}_\\alpha$ by definition of $\\mathcal{T}_\\alpha$. As $\\mathcal{N}$ is the smallest such subcategory, $\\mathcal{N}\\subseteq r_\\alpha^{-1}\\mathcal{T}_\\alpha$.\n\n</details>\n\n**Step 4 — every shift of $\\omega_\\alpha$ lies in $\\mathcal{T}_\\alpha$.**\n\n<details><summary>the argument</summary>\n\nBy **(C)** we have $G_\\alpha\\in\\mathcal{N}$, so $r_\\alpha G_\\alpha\\in\\mathcal{T}_\\alpha$ by Step 3, and $r_\\alpha G_\\alpha\\simeq_{\\mathcal{C}_\\alpha}\\omega_\\alpha[n_\\alpha]$ by **(C)** again. Since $\\mathcal{T}_\\alpha$ is closed under equivalence and under shifts in both directions, $\\omega_\\alpha[n]\\in\\mathcal{T}_\\alpha$ for every $n\\in\\mathbb{Z}$.\n\n</details>\n\n**Step 5 — clause (i).**\n\n<details><summary>the argument</summary>\n\nBy Step 4 and minimality, $\\left\\langle\\,\\omega_\\alpha[n]\\mid n\\in\\mathbb{Z}\\,\\right\\rangle_{\\mathcal{C}_\\alpha}\\subseteq\\mathcal{T}_\\alpha$, and the left-hand side is $\\mathcal{C}_\\alpha$ by **(B)**. Hence $\\mathcal{T}_\\alpha=_{\\mathcal{C}_\\alpha}\\mathcal{C}_\\alpha$ for every $\\alpha\\in A$, which is condition (1) of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html).\n\n</details>\n\n**Step 6 — clause (ii), the direction from $e_\\alpha\\omega_\\alpha\\in\\mathcal{N}$ to condition (2) at $\\alpha$.**\n\n<details><summary>the argument</summary>\n\nBy **(A)** the left adjoint $e_\\alpha\\colon\\mathcal{C}_\\alpha\\rightarrow\\mathcal{C}$ is continuous, so $e_\\alpha^{-1}\\mathcal{N}$ is a cocomplete stable subcategory of $\\mathcal{C}_\\alpha$ by Step 2. Assuming $e_\\alpha\\omega_\\alpha\\in\\mathcal{N}$, it contains $\\omega_\\alpha$, hence every $\\omega_\\alpha[n]$, hence $\\mathcal{C}_\\alpha$ by **(B)** and minimality. So $e_\\alpha N\\in\\mathcal{N}$ for every $N\\in\\mathcal{C}_\\alpha$, in particular for $N=r_\\alpha s$ with $s\\in S$.\n\n</details>\n\n**Step 7 — clause (ii), the converse direction.**\n\n<details><summary>the argument</summary>\n\nThe composite $e_\\alpha r_\\alpha\\colon\\mathcal{C}\\rightarrow\\mathcal{C}$ is continuous, both factors being so by **(A)**, and $\\mathcal{N}$ is a cocomplete stable subcategory of $\\mathcal{C}$; so $(e_\\alpha r_\\alpha)^{-1}\\mathcal{N}$ is one too, by Step 2. Condition (2) at $\\alpha$ says it contains $S$, so by minimality it contains $\\mathcal{N}$, and hence $G_\\alpha$. Therefore $e_\\alpha r_\\alpha G_\\alpha\\in\\mathcal{N}$, and by **(C)** together with the exactness of $e_\\alpha$ from Step 1,\n\n$$\ne_\\alpha\\, r_\\alpha\\, G_\\alpha\\ \\simeq_{\\mathcal{C}}\\ e_\\alpha\\big(\\omega_\\alpha[n_\\alpha]\\big)\\ \\simeq_{\\mathcal{C}}\\ (e_\\alpha\\,\\omega_\\alpha)[n_\\alpha].\n$$\n\nAs $\\mathcal{N}$ is closed under shifts, $e_\\alpha\\omega_\\alpha\\in\\mathcal{N}$. With Step 6 this is clause (ii).\n\nThe node's `depends-on` list is empty, so no assumed dependency is used above; every step closes inside [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) together with standard category theory.\n\n</details>\n\n## Caveats\n\nHypothesis **(A)** is used only through the continuity of $r_\\alpha$ (Steps 3, 7) and of $e_\\alpha$ (Steps 6, 7). Neither the full faithfulness of $e_\\alpha$ nor the resulting unit equivalence $\\mathrm{id}_{\\mathcal{C}_\\alpha}\\simeq r_\\alpha e_\\alpha$ is read by any step, and no order on $A$ appears anywhere.\n\nBecause clause (ii) is an equivalence, $e_\\alpha\\omega_\\alpha\\in\\mathcal{N}$ is not a sufficient condition that a sharper argument might weaken: given **(A)**–**(C)**, it is what condition (2) at $\\alpha$ *is*. This write-up does not settle whether **(A)**–**(C)** already force it — an equivalence cannot — so an instance must produce that object rather than derive it here.\n";</script>
