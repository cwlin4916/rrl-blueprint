eighteen paragraphs that are the claim and stops, and the two it \"omits\" assert nothing. The second is not even about the mathematics — it is a fact about the node's own past, which is precisely what the history file is for, and keeping it in the statement means every future write-up must either copy a paragraph about a superseded version of itself or be reported as drifting.\n\n## What was verified this run\n\nThat the two paragraphs carry no hypothesis and no conclusion. The first argues that the converse direction of (ii) is available under **(A)**–**(C)** and is \"the half worth having\" — a remark about what the clause is for. The second says no order on $A$ and no dualizing property of $\\omega_\\alpha$ is used, which is a claim *about* the statement's economy rather than a clause of it, and then recounts the refutation history.\n\nThat the sixteen remaining paragraphs are exactly the write-up's `## Lemma`, so the drift closes with no edit to the draft at all.\n\n## What changed\n\nThe two paragraphs are deleted from `## Statement` and their content is preserved in a dated entry of [Q1-L6-z1_history.md](../history.html). Nothing the node claims is altered, so `status:` stands.\n\n## Considered and not adopted\n\n**Copying the two paragraphs into the write-up.** It would silence the gate and entrench the error: a write-up would then be restating, under a `## Lemma` heading, a paragraph about a version of the statement that was refuted.\n";</script>
