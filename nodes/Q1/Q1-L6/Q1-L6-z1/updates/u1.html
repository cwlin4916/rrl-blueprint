 What was verified, refuted, left unverified\n\n**Verified — condition (1) does follow, and from less than is assumed.** Steps 1–4 were\nre-derived. A continuous functor between stable categories admitting small colimits\npreserves finite colimits, hence is exact, so the preimage of a cocomplete stable\nsubcategory is one; applying this to $r_\\alpha$ gives\n$\\langle S\\rangle_{\\mathcal{C}}\\subseteq r_\\alpha^{-1}\\mathcal{T}_\\alpha$ for\n$\\mathcal{T}_\\alpha=\\langle r_\\alpha s\\mid s\\in S\\rangle_{\\mathcal{C}_\\alpha}$, so\n$r_\\alpha G_\\alpha\\simeq\\omega_\\alpha[n_\\alpha]$ lands in $\\mathcal{T}_\\alpha$, and closure\nunder shifts plus **(B)** forces $\\mathcal{T}_\\alpha=\\mathcal{C}_\\alpha$. Neither the partial\norder $\\le$ nor the vanishing clause of **(C)** enters this argument.\n\n**Verified — the counterexample, recomputed rather than quoted.** Take\n$\\mathcal{C}=\\mathrm{Fun}(\\Delta^1,\\mathrm{Vect})$, $A=\\{\\ast\\}$,\n$\\mathcal{C}_\\ast=\\mathrm{Vect}$, $r_\\ast=\\mathrm{fib}$ and $e_\\ast\\colon V\\mapsto(V\\to 0)$.\nThe mapping-space pullback of the arrow category gives\n$\\operatorname{Map}(e_\\ast V,M)\\simeq\\operatorname{Map}(V,\\mathrm{fib}(a_M))$, so\n$e_\\ast\\dashv r_\\ast$; setting $M=e_\\ast W$ collapses two of the three terms, so $e_\\ast$ is\nfully faithful; colimits are pointwise and $\\mathrm{fib}\\simeq\\mathrm{cofib}[-1]$, so both\nare continuous. That is **(A)**. With $\\omega_\\ast=k$, $S=\\{\\sigma\\}$ for\n$\\sigma=(0\\to k)$, $G_\\ast=\\sigma$ and $n_\\ast=-1$: **(B)** holds because $k$ and its shifts\ngenerate $\\mathrm{Vect}$, and **(C)** holds because $r_\\ast\\sigma=\\mathrm{fib}(0\\to k)\\simeq\nk[-1]$, its vanishing clause being vacuous on a one-element $A$. But\n$\\mathcal{Z}=\\{M\\mid M_0\\simeq 0\\}$ is a cocomplete stable subcategory containing $\\sigma$,\nso $\\langle S\\rangle_{\\mathcal{C}}\\subseteq\\mathcal{Z}$, while\n$e_\\ast r_\\ast\\sigma=(k[-1]\\to 0)\\notin\\mathcal{Z}$. Condition (2) fails.\n\n**Verified — the repair is forced, not chosen.** Steps 12–13 were re-derived and are an\nequivalence, not an implication. Forward: $e_\\alpha$ continuous makes\n$e_\\alpha^{-1}\\langle S\\rangle_{\\mathcal{C}}$ a cocomplete stable subcategory of\n$\\mathcal{C}_\\alpha$, so if it contains $\\omega_\\alpha$ it contains every shift and hence, by\n**(B)**, all of $\\mathcal{C}_\\alpha$ — in particular every $r_\\alpha s$. Backward:\n$(e_\\alpha r_\\alpha)^{-1}\\langle S\\rangle_{\\mathcal{C}}$ is a cocomplete stable subcategory\ncontaining $S$, hence containing $G_\\alpha$, so\n$e_\\alpha\\omega_\\alpha[n_\\alpha]\\in\\langle S\\rangle_{\\mathcal{C}}$. Because both directions\nhold under **(A)**–**(C)**, no weaker fourth hypothesis can exist: $e_\\alpha\\omega_\\alpha\\in\n\\langle S\\rangle_{\\mathcal{C}}$ is what condition (2) *is*.\n\n**Refuted — the mirror reading of the adjunction symbol.** The old statement named the\nfamily $\\{r_\\alpha\\dashv e_\\alpha\\}$, which reads \"$r_\\alpha$ is left adjoint to $e_\\alpha$\"\nand contradicts its own **(A)**, where $e_\\alpha$ is the left adjoint. The reading the symbol\nsuggested is false too, by the same $\\mathcal{C}$ with $r_\\ast=\\mathrm{ev}_1$ and $e_\\ast$\nthe constant diagram. The notation is corrected to $\\{e_\\alpha\\dashv r_\\alpha\\}$.\n\n**Left unverified — whether joint conservativity repairs (2) by another route.** The\ncounterexample's $r_\\ast=\\mathrm{fib}$ is not conservative, since it kills\n$(k\\xrightarrow{\\mathrm{id}}k)$, so importing hypothesis **(B)** of\n[Q1-L5-z1](../../../Q1-L5/Q1-L5-z1/index.html) is not excluded by this witness. It is\nalso not needed: the equivalence above already gives the exact condition, and a hypothesis\nthat is exactly the conclusion cannot be improved on.\n\n## The old statement, verbatim\n\n> Let $\\mathcal{C}$, $A$, $\\{\\mathcal{C}_\\alpha\\}_{\\alpha\\in A}$, $S$ and the family\n> $\\{r_\\alpha\\dashv e_\\alpha\\}$ be as in hypothesis **(A)** of Q1-L5-z1, let $\\le$ be a\n> partial order on $A$, and for each $\\alpha\\in A$ let $\\omega_\\alpha\\in\\mathcal{C}_\\alpha$ be\n> a distinguished object. Assume:\n>\n> **(A) A coreflective family.** Hypothesis **(A)** of Q1-L5-z1 holds: each $r_\\alpha$ is\n> continuous with fully faithful continuous left adjoint $e_\\alpha$.\n>\n> **(B) The distinguished object generates its member.** For every $\\alpha\\in A$, in the\n> sense of `def:generation`, $\\left\\langle\\, \\omega_\\alpha[n] \\mid n\\in\\mathbb{Z}\n> \\,\\right\\rangle_{\\mathcal{C}_\\alpha} = \\mathcal{C}_\\alpha$.\n>\n> **(C) Witnesses with clean costalks.** For every $\\alpha\\in A$ there are an object\n> $G_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$ and an integer $n_\\alpha$ such that\n> $r_\\beta\\, G_\\alpha \\simeq 0$ for every $\\beta\\in A$ with $\\beta\\not\\le\\alpha$, and\n> $r_\\alpha\\, G_\\alpha \\simeq_{\\mathcal{C}_\\alpha} \\omega_\\alpha[n_\\alpha]$.\n>\n> Then conditions (1) *(stratumwise generation)* and (2) *(support-cutting)* of Q1-L5-z1\n> hold for $S$ and the family $\\{r_\\alpha\\dashv e_\\alpha\\}$.\n\n## The new statement\n\nThree changes, each forced by the paragraph of the same name above.\n\n1. **The false conclusion becomes an equivalence.** Condition (1) stays a conclusion.\n   Condition (2) is stated per $\\alpha$ as holding *if and only if*\n   $e_\\alpha\\omega_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$.\n2. **The partial order $\\le$ and the vanishing clause of (C) are deleted.** Nothing in the\n   argument reads them, and neither condition (1) nor condition (2) of\n   [Q1-L5-z1](../../../Q1-L5/Q1-L5-z1/index.html) mentions an order on $A$. A\n   hypothesis no step uses is a hypothesis an instance must supply for nothing.\n3. **The adjunction is written the way (A) reads it**, $\\{e_\\alpha\\dashv r_\\alpha\\}$.\n\n## Considered and not adopted\n\n**Adding (D) as a fourth hypothesis with the conclusion unchanged**, which is what\n[the history entry of 2026-08-06](../history.html) proposed. It is sound, and it was\nrejected as strictly less informative: the equivalence is already proved, and stating only\nthe direction this node happens to consume hides from\n[Q1-L6](../../index.html) the fact that the condition is *unavoidable* rather than merely\nsufficient — which is the one thing an instance most needs to know before going looking for\nit.\n\n**Importing joint conservativity from\n[Q1-L5-z1](../../../Q1-L5/Q1-L5-z1/index.html)**, rejected for the reason recorded\nunder *left unverified*: it would add a hypothesis to a statement that already names the\nexact condition.\n\n**Retracting the node.** Rejected: Steps 1–4 prove condition (1) outright, which is half of\nwhat [Q1-L6](../../index.html) needs and is not in question.\n\n## What this hands to the instance\n\n[Q1-L6](../../index.html) supplies clause (a), a support condition, which was the\ngeometric source of the deleted vanishing clause. Under the new statement that clause is not\nwhat the dévissage consumes: what it must now produce is\n$e_\\lambda\\,\\omega_{K\\backslash LX_\\lambda}\\in\\langle S\\rangle$, a *reachability* statement\nabout the recollement's left adjoint. That is a change in what [Q1-L6](../../index.html)\nhas to prove, not merely in how it proves it, and it is flagged amber in\n[priorities.md](../../../../../../blueprint/priorities.md) rather than revised here, this run's scope\nbeing the one node named.\n";</script>
