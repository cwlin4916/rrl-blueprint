<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L6</a><i>›</i><a href="../index.html">Q1-L6-z1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L6-z1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L6/Q1-L6-z1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nRefereed against [`proof.md`](../proof.html), the revised [`Q1-L6-z1_node.md`](../index.html)\nand its revision record [u1](../updates/u1.html), the declared closed world\n([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html),\n[`DGCat`, `Vect`](../../../../../appendix/conv-dgcat.html)), the sibling\nstatement [Q1-L5-z1](../../../Q1-L5/Q1-L5-z1/index.html) and its\n[round-1 critique](../../../Q1-L5/Q1-L5-z1/critiques/r1.html), and — at page level —\n`papers/GR17vol1.pdf`, printed pp. 51–53 (PDF pp. 88–90, offset $+37$).\n\n## What was checked and passed\n\n- **Statement diff.** `## Lemma` (proof.md:10–34) reproduces `## Statement`\n  (Q1-L6-z1_node.md:24–48) character for character: the preamble sentence, all three bolded\n  hypothesis paragraphs, both hypothesis displays, the \"Then, for $S$ and the family\" line, both\n  clause parentheticals and the clause-(ii) display. Nothing strengthened, nothing weakened, no\n  renotation. The one omission is Flaw 3, and it carries no hypothesis and no conclusion. The draft\n  is a write-up against the **new** statement throughout; no trace of the refuted one survives.\n- **Both directions of (ii) are actually proved.** Step 6 is $e_\\alpha\\omega_\\alpha\\in\\mathcal{N}\n  \\Rightarrow$ condition (2) at $\\alpha$; Step 7 is the converse. Neither is a restatement of the\n  other and neither is asserted. The per-direction hypothesis budget is *smaller* than the licence:\n  Step 6 reads **(A)** and **(B)** and never **(C)**; Step 7 reads **(A)** and **(C)** and never\n  **(B)**. Both are entitled to all three, so there is no overdraft.\n- **Circularity.** `depends-on` is empty; no node is used as a fact. [Q1-L5-z1](../../../Q1-L5/Q1-L5-z1/index.html)\n  is named only where the statement itself names it — for the preamble, hypothesis **(A)**, and the\n  two conditions (1), (2) whose *definitions* the conclusion quotes. Nothing proved in that node is\n  invoked, which matters because it is `failing`. Steps 1 and 2 are proved from scratch rather than\n  imported.\n- **Hallucination sweep.** No bib key and no `main.tex` `\\label` is cited anywhere in the draft, so\n  nothing to hallucinate there. All eight relative links resolve from the draft's own depth\n  ($d=1$, so `../../../../` reaches `blueprint/`): both appendix anchors exist as files, and\n  `../../Q1-L5/Q1-L5-z1/Q1-L5-z1_node.md` exists. No appendix entry outside the declared two is\n  invoked. No bare backticked label appears outside a link.\n- **Minimality is used, the mapping-space criterion is not.** Every appeal to\n  [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) (Steps 3,\n  5, 6, 7) is to *minimality* — the definitional half — and never to the orthogonality criterion the\n  entry attributes to GR. This is what keeps the standing MAJOR of the sibling's round 1 (which is\n  about that criterion needing presentability) from landing here as a live defect; see Flaw 2 for\n  the residue that does.\n- **Step-level checks.** Step 1: $F$ preserves the empty colimit, which is $0$ in a pointed\n  category, and pushouts, so the square $M\\to 0$, $M\\to 0$ maps to one exhibiting $F(M[1])\\simeq\n  (FM)[1]$; invertibility of $[1]$ gives $[-1]$; cofibers are pushouts and\n  $\\mathrm{fib}\\simeq\\mathrm{cofib}[-1]$. Correct as an argument from the strong reading of\n  \"continuous\" (Flaw 1). Step 2: the preimage is closed under all small colimits of $\\mathcal{M}$\n  because $F$ is continuous, and closure under all small colimits plus $[-1]$ in a stable ambient is\n  exactly stability, so the three verifications suffice. Steps 3–5 give clause (i) with no use of\n  $e_\\alpha$ at all. Step 7's chain $e_\\alpha r_\\alpha G_\\alpha\\simeq e_\\alpha(\\omega_\\alpha\n  [n_\\alpha])\\simeq(e_\\alpha\\omega_\\alpha)[n_\\alpha]$ uses only the shift-commutation of Step 1 and\n  closure of $\\mathcal{N}$ under $[-n_\\alpha]$. No handedness slip: $e_\\alpha$ is the left adjoint\n  everywhere it appears, and no unit or counit is ever written down.\n- **Edge cases.** $A=\\varnothing$: both clauses vacuous, consistent. $S=\\varnothing$: **(C)** forces\n  $G_\\alpha\\simeq 0$, hence $\\omega_\\alpha\\simeq 0$, hence $\\mathcal{C}_\\alpha\\simeq 0$ by **(B)**,\n  and both sides of (ii) hold. $\\mathcal{C}_\\alpha\\simeq 0$: both sides hold. The equivalence is\n  also consistent with the refuting witness of [u1](../updates/u1.html) — there\n  $e_\\ast\\omega_\\ast=(k\\to 0)\\notin\\{M\\mid M_0\\simeq 0\\}\\supseteq\\langle S\\rangle_{\\mathcal{C}}$ and\n  condition (2) fails, so both sides are false together, as (ii) requires.\n- **Prover's claim 1 (the counterexample was dropped, not compressed) — verified, with one\n  residue.** No step of Steps 1–7 refers to it, and none could: the witness refuted the *old*\n  conclusion, and an equivalence needs no witness of failure. Dropping it leaves the proof of the\n  statement complete. The one thing it did support is a sentence of the second Caveat; see Flaw 6.\n- **Prover's claim 2 ((A) is over-strong) — verified.** I traced every step. Full faithfulness of\n  $e_\\alpha$ is nowhere used; the unit $\\mathrm{id}\\simeq r_\\alpha e_\\alpha$ is never written; no\n  triangle identity, no counit, no essential-image argument occurs. Under the house reading of\n  \"continuous\" the adjunction *itself* is unused, so the caveat is if anything understated —\n  see Flaw 5, and Flaw 1 for the one reading under which it would be wrong.\n\n---\n\n**Flaw 1** [MINOR] — Nothing in the closed world defines \"continuous\", and Step 1 silently fixes the strong reading\n(preserves *all* small colimits).\n\n<details><summary>(location: Step 1, heading \"a continuous functor between stable categories\nadmitting all small colimits is exact\", and its proof \"It preserves the empty colimit … and it\npreserves pushouts\") · the finding</summary>\n\nThat is not the reading of the source the appendix's own\nconventions follow. `papers/GR17vol1.pdf`, printed p. 51 (PDF p. 88), §5.1.6, verbatim:\n\n> Let $\\mathbf{C}$ and $\\mathbf{D}$ be a pair of cocomplete stable categories, and let\n> $F\\colon\\mathbf{D}\\to\\mathbf{C}$ be **an exact functor**. We shall say that $F$ is *continuous* if\n> it preserves filtered colimits.\n\nSo in GR's vocabulary exactness is part of the *hypothesis* of continuity, not a consequence of it,\nand Step 1's headline is a claim GR would regard as contentless rather than as a lemma. Under the\nthird possible reading — filtered colimits with exactness *not* presupposed — the headline is\noutright false (e.g. $\\Sigma^\\infty_+\\Omega^\\infty$ on spectra preserves filtered colimits and is\nnot exact), and the proof offered is exactly the step that fails.\n\nThis does not endanger the conclusion, which is why it is MINOR rather than MAJOR: under GR's\nreading everything Step 1 supplies (exactness, shift-commutation, preservation of cofibers and of\nall small colimits) is immediate from **(A)**; under the strong reading Step 1 proves it; and under\nthe weak reading it is still available, because $r_\\alpha$ is a right adjoint hence preserves finite\nlimits hence is exact, and $e_\\alpha$ is a left adjoint hence preserves all colimits. The theorem\nholds on all three readings. What is owed is one sentence in the `notation:` line fixing the reading\n— and, better, an appendix entry pinning \"continuous\" once for the repository, since three nodes now\nturn on it.\n\n</details>\n\n**Flaw 2** [MINOR] — The draft reads \"cocomplete stable subcategory\" as *full, closed under small colimits formed in the\nambient, and closed under shifts and cofibers* — that is what Step 2 verifies, and the only property\nof $\\langle-\\rangle$ used is minimality against subcategories of that kind.\n\n<details><summary>(location: the paragraph after the opening display, \"'cocomplete stable\nsubcategory' always means the notion used there\", and every appeal to minimality in Steps 3, 5, 6, 7) · the finding</summary>\n\nThe entry's literal\nwords and its own gloss (\"closed under arbitrary colimits, not merely finite ones and retracts\")\nlicense this, and on that reading the argument is airtight and needs no presentability anywhere.\nBut the entry's source does not read it that way. `papers/GR17vol1.pdf`, printed p. 51 (PDF p. 88),\nfootnote 8, verbatim: *\"When talking about cocomplete categories we will always assume that they are\npresentable.\"* — attached to §5.1.5, where \"cocomplete stable category\" is defined.\n\nSo the very object $\\langle S\\rangle_{\\mathcal{C}}$ has two candidate meanings at the ambient\ngenerality this node inherits (\"a stable category admitting all small colimits\", not presentable),\nand the draft never says which it takes. Two consequences, neither a defect against the closed world\nas it stands today, both worth recording:\n\n1. If the repair the sibling's [round-1 Flaw 1](../../../Q1-L5/Q1-L5-z1/critiques/r1.html) demands is\n   taken — `/update` on the entry to record GR's convention — then Step 2 no longer produces an\n   object minimality applies to, since $F^{-1}\\mathcal{T}$ is nowhere shown presentable, and Steps\n   3, 6 and 7 each need the extra sentence (that for small $T$ the generated subcategory is also the\n   closure of $T$ under shifts, cofibers and small colimits, hence sits inside any colimit-closed\n   stable subcategory containing $T$, presentable or not), plus presentable ambients in the\n   preamble. This write-up is not forward-compatible with that repair and should say so.\n2. Under GR's reading, minimality is not even formal: an intersection of presentable subcategories\n   need not be presentable, so \"smallest\" would owe an existence argument the entry does not give.\n\n</details>\n\n**Flaw 3** [MINOR] — The `## Lemma` drops the node's three closing paragraphs of `## Statement` (Q1-L6-z1_node.md:50–54):\nthe `**Scope.**` paragraph on how the three hypotheses divide the labour, the paragraph explaining\nwhy clause (ii) is an equivalence, and the paragraph recording that no order on $A$ and no dualizing\nproperty of $\\omega_\\alpha$ is used.\n\n<details><summary>(location: `## Lemma`, proof.md:34, end) · the finding</summary>\n\nNone declares a hypothesis or a conclusion, so nothing is\nstrengthened or weakened and this is not a restatement defect. It is still a diff against a\nstatement the write-up is required to reproduce, and the second of the three is the paragraph a\nreader most needs in order to see why Step 7 exists at all. Parity note: the same omission was\nrecorded as MINOR on the sibling's round 1.\n\n</details>\n\n**Flaw 4** [MINOR] — Steps 1 and 2 are stated with a hypothesis — \"between stable categories admitting all small\ncolimits\" — that Steps 3, 6 and 7 never check when they invoke them.\n\n<details><summary>(location: Steps 3, 6, 7 — \"By **(A)** the functor $r_\\alpha$ … is continuous, so\nStep 2 makes $r_\\alpha^{-1}\\mathcal{T}_\\alpha$ a cocomplete stable subcategory\") · the finding</summary>\n\nThe hypothesis *is* satisfied:\nit is the preamble the statement imports by the phrase \"as in Q1-L5-z1\". But the write-up never\nunfolds that phrase, so nowhere on the page does it say that $\\mathcal{C}$ and each\n$\\mathcal{C}_\\alpha$ are stable and cocomplete. A reader auditing Step 3 against Step 2 has to leave\nthe file to discharge the hypothesis of the draft's own lemma. One clause in the opening display\nparagraph fixes it, and the fix is worth taking because the phrase points at a `failing` sibling\nthat the draft is otherwise careful never to lean on.\n\n</details>\n\n**Flaw 5** [MINOR] — Correct as an inventory — I verified it step by step — but it stops one step short of the statement\nworth recording, in the same way the sibling's round-1 Flaw 3 noted.\n\n<details><summary>(location: first Caveat, \"Hypothesis **(A)** is used only through the continuity\nof $r_\\alpha$ (Steps 3, 7) and of $e_\\alpha$ (Steps 6, 7)\") · the finding</summary>\n\nTwo sharpenings:\n\n- **The adjunction itself is unread.** Since the caveat's inventory is exhaustive, what **(A)**\n  actually contributes is *two continuous functors*, in no relation to each other. The available\n  weakening of the statement is therefore not \"drop full faithfulness\" but \"replace **(A)** by: for\n  each $\\alpha$, continuous functors $r_\\alpha\\colon\\mathcal{C}\\to\\mathcal{C}_\\alpha$ and\n  $e_\\alpha\\colon\\mathcal{C}_\\alpha\\to\\mathcal{C}$\" — with the caveat of Flaw 1 that this is exactly\n  the weakening that becomes false on the weakest reading of \"continuous\", so the two caveats have\n  to be taken together.\n- **\"Continuous\" on $e_\\alpha$ is redundant, not merely unused.** `papers/GR17vol1.pdf`, printed\n  p. 53 (PDF p. 90), Lemma 5.3.2(d): *\"If a 1-morphism in $\\mathbf{1\\text{-}Cat}^{\\mathrm{St,cocmpl}}$\n  admits a left adjoint (as a plain functor), then this left adjoint is automatically a 1-morphism\n  in $\\mathbf{1\\text{-}Cat}^{\\mathrm{St,cocmpl}}_{\\mathrm{cont}}$.\"* A left adjoint preserves every\n  colimit that exists, so as long as **(A)** keeps the adjunction, the word is free. That is a\n  defect in the *statement* — inherited from [Q1-L5-z1](../../../Q1-L5/Q1-L5-z1/index.html)\n  **(A)**, where the sibling's critique already flagged it — and belongs to `/update`, not to the\n  prover.\n\n</details>\n\n**Flaw 6** [MINOR] — The first two clauses are exactly right and honestly put.\n\n<details><summary>(location: second Caveat, \"This write-up does not settle whether **(A)**–**(C)**\nalready force it — an equivalence cannot — so an instance must produce that object rather than\nderive it here\") · the finding</summary>\n\nThe third overreaches by one modal: \"an\ninstance **must** produce that object\" is licensed only by the refutation on record — the\narrow-category witness of [u1](../updates/u1.html), which shows **(A)**–**(C)** genuinely fail to\nforce $e_\\alpha\\omega_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$ — and that witness is not in this\nwrite-up. On the page as it stands, nothing rules out that the membership is automatic, in which\ncase clause (ii) would be a true but degenerate biconditional and the instance would have nothing to\nproduce. The write-up is right not to spend 250 words re-deriving the witness, and a caveat is not a\nproof step, so the cheap and correct fix is to name the record: \"the record at [u1] exhibits data\nsatisfying **(A)**–**(C)** with the membership false, so the condition is not automatic\". That\nnames a record rather than citing a fact into the closed world, which is permitted, and it is the\none place where dropping the counterexample left something unsupported.\n\n</details>\n\n**Flaw 7** [MINOR] — Quantifier housekeeping. $\\alpha$ is fixed at Step 3 and discharged at Step 5 (\"for every\n$\\alpha\\in A$\"); Steps 6 and 7 then use $\\alpha$ without re-fixing it.\n\n<details><summary>(location: Steps 6 and 7, \"By **(A)** the left adjoint $e_\\alpha$ …\", \"The\ncomposite $e_\\alpha r_\\alpha$ …\") · the finding</summary>\n\nNothing depends on this — both\nsteps are uniform in $\\alpha$ and clause (ii) is stated per $\\alpha$ — but the statement this node\nis certifying has already been wrong once about which quantifier sits where, and \"Fix $\\alpha\\in A$\nagain\" costs four words.\n\n</details>\n\n**Flaw 8** [MINOR] — The node's title still advertises the clean-costalk hypothesis that [u1](../updates/u1.html) deleted\nfrom **(C)**.\n\n<details><summary>(location: not the draft — Q1-L6-z1_node.md:1, \"Clean costalks supply stratumwise\ngeneration\") · the finding</summary>\n\nThe draft's own H1 (\"A generating distinguished object supplies stratumwise\ngeneration, and cuts support exactly when its extension is reachable\") is the accurate one. Recorded\nhere because a critique is where the discrepancy gets seen; the fix belongs to `/update`, and the\nprover is not at fault.\n\n</details>\n\n---\n\n## Assessment\n\nI hunted and did not find a break. The argument is four formal moves — a continuous functor between\nstable cocomplete categories is exact; preimages of colimit-closed stable subcategories are\ncolimit-closed stable subcategories; minimality against those; and closure under shifts — applied\nfour times, and each application type-checks: the functor's source and target are right, the\nsubcategory is formed in the ambient the subscript names, and the direction of every containment is\nthe one minimality gives. Clause (i) never touches $e_\\alpha$, which is exactly why it survived the\nrefutation of the old statement, and clause (ii)'s two directions are genuinely two arguments with\ndisjoint hypothesis budgets rather than one argument written twice. The revision has been absorbed\ncorrectly: the equivalence is proved in the direction the node's Scope paragraph claims is \"the half\nworth having\", and neither the deleted order on $A$ nor the deleted vanishing clause is smuggled\nback in.\n\n**Not REFUTED.** The statement is true, and I can say why on every reading of its two undefined\nterms: see the edge cases above and Flaw 1's three-reading analysis. The refuting witness of\n[u1](../updates/u1.html) is consistent with it — both sides of (ii) are false there together.\n\n**Not FAIL.** The two flaws that would carry weight if they landed — Flaw 1's reading of\n\"continuous\" and Flaw 2's reading of \"cocomplete stable subcategory\" — are defects in vocabulary the\nclosed world never pinned, and on the readings the appendix's literal words supply, the proof is\ncorrect as written. Flaw 2 is a genuine forward hazard rather than a present gap: when\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) is repaired\nto record GR's presentability convention, this node's write-up will need three extra sentences and\nits preamble will need a word. That is a bill against a future edit, not against this draft, and it\nshould be recorded in the node's history so the later prover does not have to rediscover it.\n\nThe remaining six are exposition: one omitted commentary block, one unchecked-in-situ hypothesis,\ntwo caveats that stop one clause short of what they could say, one unfixed quantifier, one stale\nnode title.\n\nVERDICT: PASS\n";</script>
