<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L6-z1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L6-z1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L6-z1 — history\n\n[Q1-L6-z1](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created**: cut at the user's direction as the second node of the dévissage axis, and as the one that tests the user's own reading directly. That reading was that [Q1-L6](../index.html) is a formal consequence of stratified spaces, and for this node it holds: every occurrence of $\\mathcal{F}_\\lambda\\ast\\mathrm{IC}_0$ in [Q1-L6](../index.html) is an occurrence of *some object of the generated subcategory*, and no step of the statement inspects how it was produced. Deleting $X$, $G$, $LX$, $\\mathrm{Gr}$ and the Hecke action leaves hypotheses **(A)**, **(B)** and **(C)** and nothing else.\n\n- **2026-08-06 — the abstraction named a hypothesis Q1-L6 was carrying silently**: at level 0 the conclusion \"the objects generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$\" follows from a clean costalk *only because* $\\omega$ generates the category of a stratum, and a stratum is $BK_\\lambda$ with $K_\\lambda$ having reductive finite-type quotient — which is [Q1-L4](../../Q1-L4/index.html), reached through [Q1-L6](../index.html)'s `depends-on` and nowhere stated as the thing cleanliness is being combined with. Here it is hypothesis **(B)**, standing on its own, about one member category and mentioning neither $\\mathcal{C}$ nor $S$. Making it explicit is the whole return on writing the node: it converts an implicit reliance into a check an instance either passes or fails.\n\n- **2026-08-06 — the edge is `instances`, not `depends-on`**: [Q1-L6](../index.html) is recorded as an instance, so its file is untouched, its status is untouched and its confidence is capped by nothing here — per [ADR 0061](../../../../process/decisions/0061-the-z-axis-is-abstraction-level.html), which is also why this node lists no `required-by`.\n\n- **2026-08-06 — where the geometry actually went**: hypothesis **(C)** is the residue, and it is not formal. Producing, for every $\\alpha$, an object of $\\langle S\\rangle_{\\mathcal{C}}$ with prescribed vanishing off $\\alpha$ and a prescribed costalk at $\\alpha$ is exactly what a convolution action is for, and at level 0 it is the open problem [Q1-L6](../index.html) assumes outright. Its sibling obligation — that the closure order have finite intervals at all, so that $\\le$ behaves — is [Q1-L6-L1](../Q1-L6-L1/index.html), which is hard geometry citing Chen–Yi and is **not** a consequence of anything on this axis. The two together are the honest answer to \"is this formal?\": the implication is, the witnesses are not.\n- **2026-08-06 — the statement is false as written; condition (2) is refuted, condition (1) proved.** `/prove Q1-L6-z1`, round 1, under the standing instruction that a prover which finds the statement false says so and writes the failing case out rather than producing an argument with a hole in it. The draft is [proof.md](proof.html), 1275/1500 words. The orchestrator re-derived the counterexample before recording it. No `## Statement` was touched: only `status:`, `draft:` and `critique:` moved, because a statement is `/update`'s and no other operator's.\n\n  **The refuted statement, verbatim, since it is about to be replaced.**\n\n  > Let $\\mathcal{C}$, $A$, $\\{\\mathcal{C}_\\alpha\\}_{\\alpha\\in A}$, $S$ and the family $\\{r_\\alpha\\dashv e_\\alpha\\}$ be as in hypothesis **(A)** of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html), let $\\le$ be a partial order on $A$, and for each $\\alpha\\in A$ let $\\omega_\\alpha\\in\\mathcal{C}_\\alpha$ be a distinguished object. Assume:\n  >\n  > **(A) A coreflective family.** Hypothesis **(A)** of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) holds: each $r_\\alpha$ is continuous with fully faithful continuous left adjoint $e_\\alpha$.\n  >\n  > **(B) The distinguished object generates its member.** For every $\\alpha\\in A$, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), $\\left\\langle\\, \\omega_\\alpha[n] \\ \\middle|\\ n\\in\\mathbb{Z} \\,\\right\\rangle_{\\mathcal{C}_\\alpha} = \\mathcal{C}_\\alpha$.\n  >\n  > **(C) Witnesses with clean costalks.** For every $\\alpha\\in A$ there are an object $G_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$ and an integer $n_\\alpha$ such that $r_\\beta\\, G_\\alpha \\simeq 0$ for every $\\beta\\in A$ with $\\beta\\not\\le\\alpha$, and $r_\\alpha\\, G_\\alpha \\simeq_{\\mathcal{C}_\\alpha} \\omega_\\alpha[n_\\alpha]$.\n  >\n  > Then conditions (1) *(stratumwise generation)* and (2) *(support-cutting)* of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) hold for $S$ and the family $\\{r_\\alpha\\dashv e_\\alpha\\}$.\n\n  **The failing case, with one index.** Neither the partial order nor the clean-costalk vanishing is at fault: the counterexample has $|A| = 1$, so both clauses are vacuous. Take the arrow category $\\mathcal{C} = \\mathrm{Fun}\\left(\\Delta^1,\\mathrm{Vect}\\right)$, whose objects are maps $M_0\\rightarrow M_1$, and $\\mathcal{C}_\\ast = \\mathrm{Vect}$, with\n\n  $$\n  r_\\ast = \\mathrm{fib}, \\qquad e_\\ast\\colon V\\longmapsto \\left(V\\rightarrow 0\\right).\n  $$\n\n  Then $e_\\ast$ is left adjoint to $r_\\ast$, since a map $\\left(V\\rightarrow 0\\right)\\rightarrow M$ is a map $V\\rightarrow M_0$ together with a nullhomotopy of its composite to $M_1$; it is fully faithful, since $\\mathrm{fib}\\left(V\\rightarrow 0\\right)\\simeq V$; and both functors are continuous. That is **(A)**.\n\n  Take $S = \\{\\sigma\\}$ with $\\sigma = \\left(0\\rightarrow k\\right)$, and $\\omega_\\ast = k$, $n_\\ast = -1$, $G_\\ast = \\sigma$. Then $r_\\ast\\sigma = \\mathrm{fib}\\left(0\\rightarrow k\\right) \\simeq k[-1] = \\omega_\\ast[n_\\ast]$, which is **(C)**, and $k$ with its shifts generates $\\mathrm{Vect}$, which is **(B)**. Condition (1) holds, since $\\langle k[-1]\\rangle_{\\mathrm{Vect}} = \\mathrm{Vect}$.\n\n  Condition (2) fails. Every object of $S$ has first component $0$, and the full subcategory $\\left\\{M \\mid M_0\\simeq 0\\right\\}$ is cocomplete and stable, so\n\n  $$\n  \\langle S\\rangle_{\\mathcal{C}} \\subseteq \\left\\{M\\in\\mathcal{C} \\mid M_0\\simeq 0\\right\\}, \\qquad\\text{while}\\qquad e_\\ast\\, r_\\ast\\,\\sigma = \\left(k[-1]\\rightarrow 0\\right)\n  $$\n\n  has first component $k[-1]\\neq 0$. So $e_\\ast r_\\ast\\sigma\\notin\\langle S\\rangle_{\\mathcal{C}}$ and (2) is false.\n\n  **Why it fails, which is the useful part.** Hypotheses (A)–(C) constrain only the **right** adjoints $r_\\alpha$ — (B) is about $\\mathcal{C}_\\alpha$ alone, (C) about the images $r_\\beta G_\\alpha$ — while condition (2) is a statement about the **left** adjoints $e_\\alpha$. Nothing in the hypotheses reaches $e_\\alpha$ at all, and the counterexample simply exercises that freedom. This is the same shape as the two-stratum recollement failure already on record for [Q1-L5](../../Q1-L5/index.html), where stratumwise generation holds and gluing is not seen; that one is also an arrow category, which is worth noticing rather than treating as coincidence.\n\n  **A suggested corrected statement — a suggestion only, adopted by nobody, and citable by no proof.** Steps 12–13 of the draft prove that, given **(A)** and **(B)**, condition (2) at $\\alpha$ is *equivalent* to the single membership $e_\\alpha\\,\\omega_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$. So the minimal repair is a fourth hypothesis saying exactly that:\n\n  > **(D) The distinguished object is reachable.** For every $\\alpha\\in A$, $e_\\alpha\\,\\omega_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$.\n\n  with the conclusion unchanged. That is not a weakening dressed up as a hypothesis: by the same equivalence it is the *only* thing (2) can be, so a statement carrying it asserts precisely as much as before and no longer asserts anything false. Whether the intended geometric instance supplies (D) — through a recollement cofibre sequence identifying $\\mathrm{cofib}\\left(e_\\alpha r_\\alpha s\\rightarrow s\\right)$ across the remaining strata — is the question [Q1-L6](../index.html) actually has to answer, and this refutation is what moves it from implicit to stated.\n\n  **Two caveats the draft records and this entry does not swallow.** The counterexample's family is **not** jointly conservative, so it leaves open whether importing hypothesis **(B)** of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) would repair (2) by a different route than (D). And the mirror reading of the opening line's $\\{r_\\alpha\\dashv e_\\alpha\\}$ — with $r_\\alpha$ the *left* adjoint — is refuted by the same $\\mathcal{C}$ and $S$ with $r_\\ast = \\mathrm{ev}_1$ and $e_\\ast$ the constant diagram, so the notation is not hiding a true reading.\n\n  **What this run did not do.** The refutation branch also calls for a literature pass — whether the corrected form is already in print — and it was not run. It is owed, as `/examples Q1-L6-z1`.\n\n- **2026-08-07 — the false half becomes an equivalence, and two hypotheses nobody read are deleted.** `/update Q1-L6-z1`, at the user's direction, as the first step of clearing the red layer. The record is [u1](updates/u1.html); no external passage was supplied, and every step of [proof.md](proof.html) was re-derived before any of it was adopted.\n\n  **The defect.** The statement concluded condition (2) *(support-cutting)* of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) from **(A)**, **(B)** and **(C)**, and no hypothesis among the three constrains the left adjoints $e_\\alpha$, which is what condition (2) is about. The arrow-category witness of [proof.md](proof.html) Steps 5–11 makes the failure explicit on a one-element $A$, where the deleted order carries no information at all.\n\n  **What replaced it.** Condition (1) stays a conclusion, proved by Steps 1–4. Condition (2) is now stated per $\\alpha$ as holding *if and only if* $e_\\alpha\\omega_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$, which is the equivalence Steps 12–13 establish; because both directions hold under **(A)**–**(C)**, no weaker hypothesis exists to be found later.\n\n  **What was dropped, and why that is the mathematics and not tidying.** The partial order $\\le$ and the vanishing clause $r_\\beta G_\\alpha\\simeq 0$ of **(C)** are read by no step of the draft — Step 4 says so in as many words — and neither condition (1) nor condition (2) of [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html) mentions an order on $A$. A hypothesis no step uses is one an instance must supply for nothing, so deleting it strictly widens what the node covers. The family is also renamed $\\{e_\\alpha\\dashv r_\\alpha\\}$, the old symbol having asserted the adjunction in the direction its own **(A)** contradicts.\n\n  **What this hands to [Q1-L6](../index.html).** Its clause (a) was the geometric source of the deleted vanishing clause, and the dévissage no longer consumes it; what the instance must now produce is $e_\\lambda\\,\\omega_{K\\backslash LX_\\lambda}\\in\\langle S\\rangle$, a reachability statement about the recollement's left adjoint. That is a change in what [Q1-L6](../index.html) has to prove, and it is flagged amber rather than revised here, this run's scope being the one node named.\n\n  **Status unchanged at `failing`.** `/update` may move a status only to `open`, and only from `drafted` or `proved`; the way out of `failing` is the next `/prove`, which continues at round r1 since no critique round was ever opened on this node.\n- **2026-08-07 — two commentary paragraphs moved out of `## Statement`** ([u2](updates/u2.html)). The render gate reported this node as drifting from its write-up; the node was what had drifted. Neither paragraph carries a hypothesis or a conclusion, and the second is a fact about the node's own past. Both are preserved here verbatim, and the claim is unchanged, so the status stands.\n\n  > Clause (ii) is an equivalence rather than an implication because both directions are available under **(A)**–**(C)**, and the converse is the half worth having. It says that nothing weaker than $e_\\alpha\\omega_\\alpha\\in\\langle S\\rangle_{\\mathcal{C}}$ can deliver support-cutting, so an instance unable to reach that object must enlarge its generating set rather than look for a better argument.\n\n  > Nothing here requires $\\omega_\\alpha$ to be a dualizing object, and no order on $A$ is used. An earlier form of this statement carried a partial order together with a vanishing clause in **(C)**, concluded condition (2) outright, and was false; neither the order nor the vanishing clause is read by any step ([u1](updates/u1.html)).\n\n";</script>
