neration alone no longer implies equality. The hypotheses (a) (support in the closure) and (b) (clean costalk) were not touched; only the routing clause changed.\n\nThe statement below is the current one; the flag is standing, and nothing in this packet clears it.\n\n## Task\n\nProve the target claim rigorously under exactly the stated hypotheses. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q1: When is $\\mathcal{D}_{c}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_{c}(K\\backslash LX)$?](../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../Q1-L3/index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../key_examples/k3.html), Rankin–Selberg [K4](../../../key_examples/k4.html), the symplectic period [K6](../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../key_examples/k9.html); and [K6](../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It is currently a terminal result of its proof branch.\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: clean costalks along all strata, a statement about Hecke translates and costalks with no group scheme in it.\n\n## Target statement\n\nAssume that for every $\\lambda\\in\\Lambda_X^+$ there exist $\\mathcal{F}_\\lambda\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and $n_\\lambda\\in\\mathbb{Z}$ such that\n\n(a)\n\n$$\n\\operatorname{supp}\\left(\\mathcal{F}_\\lambda\\ast\\mathrm{IC}_0\\right)\\subseteq\\overline{LX}_\\lambda;\n$$\n\n(b) (clean costalk along the open stratum)\n\n$$\ni_\\lambda^!\\left(\\mathcal{F}_\\lambda\\ast\\mathrm{IC}_0\\right) \\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} \\omega_{K\\backslash LX_\\lambda}[n_\\lambda].\n$$\n\nThen conditions (1) *(stratumwise generation)* and (2) *(support-cutting)* of [Q1-L5](../Q1-L5/index.html) hold; consequently, under the recollement hypotheses of [Q1-L5](../Q1-L5/index.html), $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)$.\n\n## Direct prerequisites\n\n### [Q1-L4](../Q1-L4/index.html) — Strata are classifying stacks with finite-type reductive quotients\n\n- **current effective status:** proved\n- **use policy:** This prerequisite is proved and may be used as stated.\n\nFor each $\\lambda\\in\\Lambda_X^+$ fix $x_\\lambda\\in LX_\\lambda(k)$ and set $K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$. Then:\n\n(i) $K\\backslash LX_\\lambda \\simeq BK_\\lambda$;\n\n(ii) $K_\\lambda$ is a placid group scheme admitting a normal pro-unipotent subgroup $U_\\lambda\\trianglelefteq K_\\lambda$ such that the fpqc-sheaf quotient $G_\\lambda := K_\\lambda/U_\\lambda$ is an affine group scheme of finite type over $k$;\n\n(iii) pullback induces equivalences\n\n$$\n\\mathcal{D}_c(K\\backslash LX_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}}),\n$$\n\nwhere $G_\\lambda^{\\mathrm{red}}$ is the quotient of $G_\\lambda$ by its unipotent radical.\n\n### [Q1-L5](../Q1-L5/index.html) — Dévissage: equality ⟺ stratumwise generation + support-cutting\n\n- **current effective status:** open\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nLet $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ be the embeddings of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), and let $LX = \\varinjlim_{\\mu\\in\\Lambda_X^+}\\overline{LX}_\\mu$ be the presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html). For $LX_\\lambda\\subseteq\\overline{LX}_\\mu$ write $i_{\\lambda,\\overline{LX}_\\mu}$ for the locally closed embedding through which $i_\\lambda$ factors, so that $i_\\lambda = \\overline{i}_\\mu\\circ i_{\\lambda,\\overline{LX}_\\mu}$. Assume:\n\n**(H1)** each induced functor\n\n$$\ni_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n$$\n\nis continuous and admits a fully faithful continuous left adjoint $i_{\\lambda!}$;\n\n**(H2)** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ of the presentation identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) \\simeq \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$ — the presentation read through [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html);\n\n**(H3)** for every $\\mu\\in\\Lambda_X^+$ the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\mu)$.\n\nThen\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\n$$\n\nholds **if and only if both** of the following hold:\n\n1. *(stratumwise generation)* for every $\\lambda\\in\\Lambda_X^+$, the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html);\n\n2. *(support-cutting)* for every $\\lambda\\in\\Lambda_X^+$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\n\n   $$\n   i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right) \\in \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}.\n   $$\n\nMoreover the forward direction — equality implies (1), and trivially (2) — uses only the continuity of each $i_\\lambda^!$ and the section $i_\\lambda^!\\, i_{\\lambda!} \\simeq \\mathrm{id}$, so (H2) and (H3) are needed only for \"(1) and (2) imply equality\". What that direction uses of them is joint conservativity of the global family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$, which they supply: if $i_\\lambda^!\\mathcal{M} = 0$ for every $\\lambda$ then, since $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$ whenever $LX_\\lambda\\subseteq\\overline{LX}_\\mu$, (H3) gives $\\overline{i}_\\mu^!\\mathcal{M} = 0$ for every $\\mu$, and (H2) then gives $\\mathcal{M} = 0$.\n\n### [Q1-L6-L1](Q1-L6-L1/index.html) — Per-closure finiteness of $L^+G$-orbits for symmetric $X$\n\n- **current effective status:** ready\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nAssume, in addition to the standing hypotheses on $X$ ([untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html)), that $X$ is *symmetric*: $X = G/G^\\theta$ for an involution $\\theta$ of $G$ with connected fixed-point subgroup $G^\\theta$ — the standing setting of the Chen–Yi closure theory ([Chen–Yi symmetric orbits](../../../appendix/bb-chenyi-symmetric-orbits.html)). Then for every $\\lambda\\in\\Lambda_X^+$ the set\n\n$$\n\\left\\{\\, \\mu\\in\\Lambda_X^+ \\ \\middle|\\ LX_\\mu\\subseteq\\overline{LX}_\\lambda \\,\\right\\}\n$$\n\nis finite. Here $\\Lambda_X^+$, $LX_\\mu$ and $\\overline{LX}_\\lambda$ are as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), so the claim reads: every $L^+G$-orbit closure in $LX$ contains only finitely many $L^+G$-orbits.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../appendix/conj-intro.html) holds for $X$.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n- **note:** *the ambient $\\mathcal{C}$ is part of the data and main.tex does not name it at the point of use, which is why the blueprint writes it as a subscript everywhere.* See the ratification recorded at [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and in [Q1-L1](../Q1-L1/index.html): for Satake subcategories the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$. \"Cocomplete stable\" is strictly stronger than \"thick\"; $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits, not merely finite ones and retracts.\n- **note:** **Where the presentability comes from, verified on the page.** GR's standing convention is footnote 8 to §5.1.5 of [[GR17vol1](../../../../papers/GR17vol1.pdf)] (printed p. 51, PDF p. 88), attached to the sentence defining \"cocomplete\": *\"When talking about cocomplete categories we will always assume that they are presentable.\"* So GR's \"cocomplete stable category\" means \"presentable stable category\", and §5.4.1 opens \"Let $\\mathbf{C}$ be an object of $1\\text{-Cat}^{\\mathrm{St,cocmpl}}$\". The convention is load-bearing rather than decorative: the printed proof of Prop. 5.4.5 (p. 55, PDF p. 92) forms the smallest cocomplete stable full subcategory $\\mathbf{C}'\\subseteq\\mathbf{C}$ and continues *\"The inclusion $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ admits an (a priori non-continuous) right adjoint\"*, which is the Adjoint Functor Theorem in GR's form: Thm. 2.5.4(a) (printed p. 32, PDF p. 69), *\"Any morphism in $1\\text{-Cat}_{\\mathrm{Prs}}$, viewed as a functor between $(\\infty,1)$-categories, admits a right adjoint\"*, stated there for **presentable** categories. Footnote 3 of that page, hanging off §2.5.1 where $1\\text{-Cat}_{\\mathrm{Prs}}$ is introduced, says presentability *\"is necessary for the Adjoint Functor Theorem to hold\"* and adds that they *\"will omit the adjective 'presentable' even when it should properly be there\"*. It is that right adjoint the proof uses to pass from the vanishing to $\\mathbf{C}'=\\mathbf{C}$, so the hypothesis is consumed exactly in the direction *orthogonality $\\Rightarrow$ generation*.\n- **note:** **Why the converse direction is free.** *Generation $\\Rightarrow$ orthogonality* needs only minimality: by [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html), applied with $\\mathcal{D}=\\mathcal{C}$, $T=\\{c_\\alpha\\}$ and $M=c$, the displayed vanishing puts every $c_\\alpha$ in ${}^{\\perp_{\\mathcal{C}}}c$, hence puts $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ there; if that is all of $\\mathcal{C}$ then $c\\in{}^{\\perp_{\\mathcal{C}}}c$, so $\\operatorname{Map}_{\\mathcal{C}}(c,c)=0$ and $c=0$. No presentability, and no circularity — that entry invokes this one through the minimality description alone.\n- **note:** **Two discrepancies with the printed sources, and the readings in force.** (a) The attribution is to both numbers because the entry carries both halves: the display is verbatim [[GR17vol1, Def. 5.4.1](../../../../papers/GR17vol1.pdf)], which is GR's *definition* of \"generate\", while the biconditional with the smallest-subcategory description is [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] (\"A collection $\\{c_\\alpha\\}$ of objects generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory that contains all $c_\\alpha$\"). (b) main.tex:511–513 prints the vanishing as \"$\\forall i\\ge 0$\" with no quantifier on $\\alpha$; GR print \"$\\forall\\alpha$, $\\forall i=0,1,\\dots$\", and the reading in force is GR's, restored in the display above. GR write the vanishing itself as $\\mathrm{Maps}_{\\mathbf{C}}(c_\\alpha[-i],c)=\\ast$ in Def. 5.4.1 and as $=0$ inside the proof of Prop. 5.4.5, main.tex writing $=0$; by [`Ani`, `Map`, `underline-Map`](../../../appendix/conv-anima.html) the value is an anima, and both notations say that it is contractible. What is *not* settled by notation is the **range of shifts**: this display tests $i\\ge 0$ only, so an argument needing closure under all of $\\mathbb{Z}$ must reconcile the two ranges, which is clause (1) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html).\n\n### [placidity](../../../appendix/placid-ind-scheme.html) — `placid_ind_scheme`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:669).\n\n- A scheme/algebraic space $X$ *admits a placid presentation* if $X\\simeq\\varprojlim_i X_i$ is a cofiltered limit of finite-type schemes/algebraic spaces whose transition maps $X_i\\rightarrow X_j$ are smooth and affine; such an $X$ is a *placid* scheme/algebraic space.\n- An ind-scheme $X$ is *placid* if $X = \\varinjlim_i X_i$ is a filtered colimit of placid schemes along closed embeddings of finite presentation. If a placid group scheme $H$ acts on a placid ind-scheme $X$ and each $X_i$ in the presentation is $H$-stable, $X$ is an *$H$-placid ind-scheme*.\n\n### [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) — `ex:sheaf_placid_ind`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Example** (main.tex:730). Let $X = \\varinjlim_i X_i$ be a placid ind-scheme. Then\n\n$$\n\\mathcal{D}^!(X) = \\varinjlim_i\\mathcal{D}^!(X_i), \\qquad \\mathcal{D}^*(X) = \\varinjlim_i\\mathcal{D}^*(X_i),\n$$\n\nwith connecting morphisms the left adjoint of $!$-pullback, respectively the right adjoint of $*$-pushforward. If $X$ admits a dimension theory there is a canonical duality $\\mathcal{D}^!(X)\\simeq\\mathcal{D}^*(X)$ [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)], and we then do not distinguish the $!$- and $*$-versions.\n\n- **hypotheses:** $X$ a placid ind-scheme; a dimension theory for the identification $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ — supplied for $LX$ by [the three standing hypotheses](../../../appendix/assum-intro.html)(b)\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [Chen–Yi symmetric orbit parametrization and closure relation](../../../appendix/bb-chenyi-symmetric-orbits.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 17(i) and Thm. 18](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$ whose fixed-point subgroup $G^\\theta$ is connected. Let $S$ be a maximal $\\theta$-split torus of $G$, and let $\\Lambda_S^+$ and $\\check\\Phi^+$ be the dominant coweights of $S$ and the positive coroots, both taken for the restricted root data of §3.1 of the source. Then:\n\n1. *(Prop. 17(i))* The $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$; that is, the index set $\\Lambda_X^+$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) is identified with $\\Lambda_S^+$.\n2. *(Thm. 18)* For every $\\mu\\in\\Lambda_S^+$,\n\n$$\n\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu} LX_\\lambda, \\qquad\\text{where}\\quad \\lambda\\le\\mu \\iff \\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+,\n$$\n\ni.e. $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative integral sum of positive coroots.\n\n- **hypotheses:** $X$ symmetric with $G^\\theta$ connected — **not** general spherical. The proofs run through $\\theta$-twisted $\\mathrm{SL}_2$-computations ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 20, Cor. 21](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]), and no remark in the source extends them beyond the symmetric case — unlike the placidity theorem (Thm 36 with Rem 37) black-boxed as [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), which the source does extend to general spherical $X$.\n\n### [$\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$, $\\Delta_{\\lambda,a}$ — stratum generating collections and the standard objects](../../../appendix/not-standard-objects.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (blueprint notation, coined in the [Q2](../../../dag.html) framing block and recorded here so that no node coins it again; main.tex names no such objects, and the two ingredients it does supply are the generation operation [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) at main.tex:502 and the locally closed embeddings $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) at main.tex:737). Let $X$ be a smooth affine spherical $G$-variety and $K = L^+G$. The two categories in play are the renormalized categories ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ of the whole loop space and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ of the spherical stratum $LX_\\lambda$ indexed by $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)); both are written out in full wherever they occur, and no abbreviation for either is introduced here or licensed elsewhere.\n\nA **generating collection** for the stratum $\\lambda$ is a small collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, indexed by a set $A_\\lambda$, which generates that category in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nLet $i_{\\lambda!}$ denote the left adjoint of the restriction functor $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ along the locally closed embedding $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html). Given a generating collection, the **standard objects** of the stratum $\\lambda$ are its images\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nWhen a single object suffices — $\\#A_\\lambda = 1$ — the index $a$ is dropped and one writes $E_\\lambda$ and $\\Delta_\\lambda = i_{\\lambda!}E_\\lambda$.\n\n**Two worked examples.** The definitions above fix symbols and settle nothing, so a reader cannot tell from them whether $A_\\lambda$ is ever bigger than a point, or what an $E_{\\lambda,a}$ looks like when it is. The two cases below are written out for that reason alone. Each is an *illustration of the notation*, not a claim this entry makes: the mathematics in both is asserted and proved at the node named, and a proof that needs either fact cites that node and never this paragraph.\n\n*Example 1 — one generator per stratum: $X = G$ under $G\\times G$.* Take $K = L^+G\\times L^+G$, so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ is the ordinary spherical Hecke situation and $\\Lambda_X^+$ is the set $\\Lambda^+$ of dominant coweights ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), the stratum at $\\nu$ being the orbit $LX_\\nu = \\mathrm{Gr}_\\nu = L^+G\\cdot t^\\nu$. The stabilizer of $t^\\nu$ has connected finite-type reductive quotient — the centralizer $Z_G(\\nu)$, connected because a torus centralizer in a connected reductive group is — so the dualizing object generates the stratum on its own and the collection may be taken to be a single object:\n\n$$\n\\#A_\\nu = 1, \\qquad E_\\nu = \\omega_{K\\backslash LX_\\nu}, \\qquad \\Delta_\\nu = i_{\\nu!}\\,\\omega_{K\\backslash LX_\\nu} .\n$$\n\nThis is [Q2-e1-L1](../../Q2/Q2-e1/Q2-e1-L1/index.html), resting on [Q2-L2](../../Q2/Q2-L2/index.html)(i).\n\n*Example 2 — more than one, and the index set named: $X = \\mathrm{GL}_2/\\mathrm{O}_2$.* Here $LX = \\{A\\in\\mathrm{GL}_2(F) : A^t = A\\}$ with $K = \\mathrm{GL}_2(\\mathcal{O})$ acting by $g\\cdot A = gAg^t$ ([$F$, $\\mathcal{O}$](../../../appendix/conv-ring-of-integers.html)), and the strata are indexed by pairs $\\lambda = (p,q)$ with $p\\ge q$. At a diagonal stratum $\\lambda = (p,p)$ the finite-type quotient of the stabilizer is $\\mathrm{O}_2$, whose component group is $\\mathbb{Z}/2$ with the two characters $\\mathrm{triv}$ and $\\mathrm{sgn} = \\det|_{\\mathrm{O}_2}$. One generator per character is then a generating collection, and two are needed:\n\n$$\nA_\\lambda = \\{\\mathrm{triv},\\ \\mathrm{sgn}\\}, \\qquad E_{\\lambda,\\mathrm{triv}} = \\omega_{K\\backslash LX_\\lambda}, \\qquad E_{\\lambda,\\mathrm{sgn}} = \\omega_{K\\backslash LX_\\lambda}\\otimes\\mathrm{sgn},\n$$\n\nwith $\\Delta_{\\lambda,\\mathrm{triv}} = i_{\\lambda!}E_{\\lambda,\\mathrm{triv}}$ and $\\Delta_{\\lambda,\\mathrm{sgn}} = i_{\\lambda!}E_{\\lambda,\\mathrm{sgn}}$ the two standard objects of that one stratum. The dualizing object alone does not generate: $\\mathrm{sgn}$ is right-orthogonal to it in every shift. This is [Q2-e3-L2](../../Q2/Q2-e3/Q2-e3-L2/index.html)(B), resting on [Q2-L2](../../Q2/Q2-L2/index.html)(ii)–(iii); the same node's clause (C) shows $\\#A_\\lambda = 4$ at every off-diagonal stratum, so the size of $A_\\lambda$ varies with $\\lambda$ within one $X$.\n\n### [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) — `def:polarized_hyperspherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:875). A *spherical $G$-variety* is a normal $G$-variety $X$ over $k$ with a right $G$-action such that for every Borel $B\\subset G$, $X$ has a Zariski-open $B$-orbit. We further assume\n\n1. $X$ is smooth and affine;\n2. the $B$-stabilizers of points in the open $B$-orbit are connected.\n\nUnder these conditions $M = T^*(2)X$ is a *polarized hyperspherical $G$-variety*, with the weight-$2$ $\\mathbb{G}_m$-action on fibres, in the sense of [[BZSV, §3.5.1](../../../../papers/BZSV.pdf)] (proof: [[BZSV, Prop. 3.7.4](../../../../papers/BZSV.pdf)]). In particular $M$ is a *graded Hamiltonian $G$-variety*.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../appendix/ic-0.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the Satake subcategories](../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n- **note:** **Ratified reading.** main.tex names no ambient cocomplete category for the $\\langle-\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), while $\\mathcal{D}_c$ itself is small and not cocomplete, so the definition as printed is incomplete. The blueprint fixes the reading\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\n  the generation being formed inside $\\mathcal{D}^{\\mathrm{ren}}$. This is forced by the essential-image assertion in the proof of [the small Satake comparison](../../../appendix/thm-f-cstr-sat.html) (main.tex:1391–1392). Ratified in round 2 of [Q1-L1](../Q1-L1/index.html); every downstream node presupposes it. See [ADR 0001](../../../process/decisions/0001-satake-generation-ambient-category.html).\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@article{GR17vol1,\n    author = {Dennis Gaitsgory and Nick Rozenblyum},\n    title = {A study in Derived Algebraic Geometry, volume 1},\n    year = {20
