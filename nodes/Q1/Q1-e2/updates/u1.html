n, and the node carries no `proof.md`.\n\n## Removed, verbatim\n\n> Speaks to: [Q1-L1](../../Q1-L1/index.html) — the generating family of the Satake subcategory, written out in the smallest non-homogeneous case.\n\n## Added\n\nThree labelled paragraphs, canonical in [the node](../index.html). The one that changes the reading of this example:\n\n**Instance of the main theorem — conditionally, and the condition in doubt is not the expected one.** [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) *holds* here: BZSV Example 7.6.1 (p. 168) verifies the unramified conjecture by hand for $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$, so the hypothesis the manuscript expects to be the hard one is discharged. What is in doubt is (a): $X$ has the $G$-fixed point $0$ and $\\dim X = 1$, which is exactly the pair of hypotheses of [Q3-L2](../../../Q3/Q3-L2/index.html), whose clause 4 concludes that the finite presentation asserted by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) fails at the constant-loop stratum. The register's flagship positive, [K1](../../../../key_examples/k1.html), may therefore sit outside the main theorem's own hypotheses.\n\nThe other two record that the parent is [Q1](../../../../dag.html) with [Q1-L1](../../Q1-L1/index.html) demoted to a non-dependency mention, and that directedness is not the obstacle here, $L\\mathbb{A}^1$ being connected.\n\n## Considered and not adopted\n\nReporting (a) as **refuted** for this $X$. Rejected: [Q3-L2](../../../Q3/Q3-L2/index.html) is `ready` and unproved, so what the record supports is that the standing hypothesis and a stated node of [Q3](../../../../dag.html) are in direct tension, not that the hypothesis is false. Resolving it is [Q3-L2](../../../Q3/Q3-L2/index.html)'s `/prove`, and it is this run's first recommended route.\n";</script>
