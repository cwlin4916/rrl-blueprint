lness alone does not constrain the spanning class — and that stability is genuinely consumed at Step 3c to transport $c$ along $c\\simeq_{\\mathcal{C}}\\operatorname{colim}_{J}\\varphi$. The fact itself is standard and provable in one line: $\\mathcal{B}$ is closed under the small colimits formed in $\\mathcal{C}$, a colimit is defined only up to equivalence, and the colimit of the point-indexed diagram at $b\\in\\mathcal{B}$ is any $b'\\simeq b$; so the smallest closed full subcategory is automatically equivalence-closed — exactly parallel to the direct argument the draft does give for $\\mathcal{C}^{\\omega}$. Fix: give that one-line argument for $\\mathcal{B}$, or declare the spanning convention as local to the write-up rather than sourcing it to `context.md`. Substance unaffected, hence MINOR.\n\n</details>\n\n**Flaw 2** [MINOR] — Internal bookkeeping inconsistency. Step 3a invokes the cocompleteness hypothesis to form $\\operatorname{colim}_{J}\\varphi$, but the Caveats' inventory of consumed hypotheses omits cocompleteness.\n\n<details><summary>(Step 3a, \"the colimit formed in $\\mathcal{C}$ — which admits all small colimits by hypothesis\"; vs. Caveats, \"What the proof consumes is exactly compact generation of $\\mathcal{C}$ (Step 3a) and the closure properties…\") · the finding</summary>\n\nIn fact clause (1) of `def:compactly_generated_category` already grants that $\\mathcal{C}$ admits small filtered colimits, which is all that the (filtered) colimit in question needs; so the Caveats' \"exactly\" is right and Step 3a's parenthetical appeals to a stronger hypothesis than it uses. Harmless either way — cocompleteness is a standing hypothesis of the statement — but the two passages currently disagree about what is consumed, and in a lemma whose selling point is precise hypothesis accounting that should be reconciled.\n\n</details>\n\n## Checks performed and passed\n\nRecorded so the PASS is auditable as a genuine hunt.\n\n1. **Statement fidelity.** The `## Lemma` block is character-for-character identical to the Statement of `node.md`, including the display in (3) and the relative link targets (`proof.md` and `node.md` sit at the same depth, so identical paths resolve identically). No renotation, no strengthened hypothesis, no weakened conclusion. The node's Remark is invoked by link, not restated — correct.\n2. **Hallucination / closed world.** All three appendix anchors (`#def-generation`, `#def-compact-objects`, `#def-compactly-generated-category`) exist in `blueprint/appendix.md`; every object mention is a link, no bare backticked labels; no bib keys and no `main.tex` labels are cited; no DAG node is invoked as a mathematical dependency — the mention of Q1-L2 in the Caveats is consumer bookkeeping matching `required-by:`, not a citation. The node is a ready leaf and the draft respects that.\n3. **No detection-form smuggling.** The [[GR17vol1, Prop. 5.4.5](../../../../../../papers/GR17vol1.pdf)] detection characterization inside `def:generation` is never used; every step runs on the closure form fixed by the node's Remark. The appendix entry `p:compact_generation_stable_case` is likewise untouched.\n4. **The Caveats' idleness claim.** Verified step by step: Step 0 applies $\\langle-\\rangle_{\\mathcal{C}}$ to an arbitrary collection (no smallness), Steps 1–2 are pure object-class bookkeeping, Step 3 consumes compact generation of $\\mathcal{C}$ and closure of $\\langle S\\rangle_{\\mathcal{C}}$ only. Neither smallness of $S$ nor $S\\subset\\mathcal{C}^{\\omega}$ is used anywhere. The claim is accurate.\n5. **(2) $\\Leftrightarrow$ (3) bookkeeping.** Step 0 legitimately renders (1)–(3) as statements about equivalence-stable object classes ($\\mathcal{C}^{\\omega}$'s stability is proved, not assumed); the intersection is the full subcategory spanned by the intersection of the classes; Step 1's two directions are sound at that level, and correctly use no hypothesis on $\\mathcal{C}$ or $S$.\n6. **(2) $\\Rightarrow$ (1
