<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-L2</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L2 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-L2 — Generation by compacts is decided on the compacts\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), [compact objects](../../../../appendix/def-compact-objects.html), [compact generation](../../../../appendix/def-compactly-generated-category.html). No `depends-on` nodes (ready leaf).\n- **notation:** $\\mathcal{B} := \\langle S\\rangle_{\\mathcal{C}}$ throughout; full subcategories of $\\mathcal{C}$ are spanned by classes of objects stable under equivalence, and $\\subset$, $\\cap$ and $=_{\\mathcal{C}}$ between them compare those classes inside $\\mathcal{C}$, as in the Notation of [context](../../../../context.html).\n\n## Lemma\n\nLet $\\mathcal{C}$ be a stable category which admits all small colimits and is compactly generated in the sense of [compact generation](../../../../appendix/def-compactly-generated-category.html), and let $S\\subset\\mathcal{C}^{\\omega}$ be a small set of compact objects. Then, with $\\langle S\\rangle_{\\mathcal{C}}$ the generated subcategory of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), the following are equivalent:\n\n1. $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$;\n2. $\\mathcal{C}^{\\omega}\\subset\\langle S\\rangle_{\\mathcal{C}}$;\n3.\n\n   $$\n   \\mathcal{C}^{\\omega}\\ =_{\\mathcal{C}}\\ \\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}} .\n   $$\n\n## Proof\n\n**Step 0 — all three sides are full subcategories of $\\mathcal{C}$, so (1)–(3) are statements about object classes.**\n\n<details><summary>the argument</summary>\n\nBy [compact objects](../../../../appendix/def-compact-objects.html), $\\mathcal{C}^{\\omega}\\subset\\mathcal{C}$ is a full subcategory, and its object class is stable under equivalence because the defining property — $\\operatorname{Map}_{\\mathcal{C}}(c,-)\\colon\\mathcal{C}\\to\\mathrm{Ani}$ preserves filtered colimits — is invariant under replacing $c$ by an equivalent object. By [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), whose note records that \"cocomplete stable\" is strictly stronger than \"thick\" — $\\langle-\\rangle_{\\mathcal{C}}$ being closed under arbitrary colimits, not merely finite ones and retracts — $\\mathcal{B}$ is the smallest full subcategory of $\\mathcal{C}$ containing $S$ and closed under shifts, cofibres, and the small colimits formed in $\\mathcal{C}$; as a full subcategory its object class is equivalence-stable. Finally $\\mathcal{C}^{\\omega}\\cap\\mathcal{B}$ is the full subcategory spanned by the objects lying in both. Each of (1)–(3) is therefore an inclusion or equality of equivalence-stable object classes inside $\\mathcal{C}$, and is proved as such below.\n\n</details>\n\n**Step 1 — (2) $\\Leftrightarrow$ (3).**\n\n<details><summary>the argument</summary>\n\nThe inclusion $\\mathcal{C}^{\\omega}\\cap\\mathcal{B}\\subset\\mathcal{C}^{\\omega}$ holds in $\\mathcal{C}$ for any pair of full subcategories. Assume (2). Then every object of $\\mathcal{C}^{\\omega}$ lies in $\\mathcal{B}$ as well, hence in $\\mathcal{C}^{\\omega}\\cap\\mathcal{B}$; together with the standing inclusion this gives $\\mathcal{C}^{\\omega} =_{\\mathcal{C}} \\mathcal{C}^{\\omega}\\cap\\mathcal{B}$, which is (3). Conversely, assume (3). Then $\\mathcal{C}^{\\omega} =_{\\mathcal{C}} \\mathcal{C}^{\\omega}\\cap\\mathcal{B} \\subset \\mathcal{B}$ in $\\mathcal{C}$, which is (2). No hypothesis on $\\mathcal{C}$ or on $S$ is used.\n\n</details>\n\n**Step 2 — (1) $\\Rightarrow$ (2).**\n\n<details><summary>the argument</summary>\n\nIf $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$, then $\\mathcal{C}^{\\omega}\\subset\\mathcal{C} = \\langle S\\rangle_{\\mathcal{C}}$ in $\\mathcal{C}$, the first inclusion being [compact objects](../../../../appendix/def-compact-objects.html).\n\n</details>\n\n**Step 3 — (2) $\\Rightarrow$ (1): every object of $\\mathcal{C}$ is a small filtered colimit of compacts, and $\\mathcal{B}$ absorbs such colimits.**\n\n<details><summary>the argument</summary>\n\nAssume (2), i.e. $\\mathcal{C}^{\\omega}\\subset\\mathcal{B}$ in $\\mathcal{C}$, and fix $c\\in\\mathcal{C}$.\n\n*(3a) The diagram.* $\\mathcal{C}$ is compactly generated by hypothesis, so clause (1) of [compact generation](../../../../appendix/def-compactly-generated-category.html) supplies a small filtered category $J$ and a diagram $\\varphi\\colon J\\to\\mathcal{C}$ with $\\varphi(j)\\in\\mathcal{C}^{\\omega}$ for every $j\\in J$ and $c \\simeq_{\\mathcal{C}} \\operatorname{colim}_{J}\\varphi$, the colimit formed in $\\mathcal{C}$ — which admits all small colimits by hypothesis.\n\n*(3b) The diagram lies in $\\mathcal{B}$.* By (2), each $\\varphi(j)$ lies in $\\mathcal{B}$. A functor to $\\mathcal{C}$ all of whose values lie in a full subcategory factors through that subcategory (standard: a full subcategory is spanned by its objects), so $\\varphi$ factors as $J\\to\\mathcal{B}\\hookrightarrow\\mathcal{C}$.\n\n*(3c) The colimit lies in $\\mathcal{B}$.* By the note on [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) — the reading of \"cocomplete stable subcategory\" in force throughout the blueprint, restated in the Notation section of [context](../../../../context.html) — $\\mathcal{B}$ is closed under the small colimits formed in $\\mathcal{C}$. Applied to the diagram of (3b), $\\operatorname{colim}_{J}\\varphi\\in\\mathcal{B}$; since the object class of $\\mathcal{B}$ is equivalence-stable (Step 0), $c\\in\\mathcal{B}$.\n\n*(3d) Conclusion.* Every object of $\\mathcal{C}$ lies in the full subcategory $\\mathcal{B}\\subset\\mathcal{C}$, and a full subcategory of $\\mathcal{C}$ containing every object of $\\mathcal{C}$ equals $\\mathcal{C}$ as a full subcategory of $\\mathcal{C}$ — the subscript on this equality is dropped, per [context](../../../../context.html), because the ambient is one of the two sides. This is (1).\n\n</details>\n\n**Step 4 — assembly.**\n\n<details><summary>the argument</summary>\n\nSteps 2 and 3 give (1) $\\Leftrightarrow$ (2); Step 1 gives (2) $\\Leftrightarrow$ (3). Hence (1)–(3) are equivalent. $\\blacksquare$\n\n</details>\n\n## Caveats\n\nNo step uses the smallness of $S$ or the containment $S\\subset\\mathcal{C}^{\\omega}$: they are carried so that the statement is quoted in the regime where its consumer applies it. What the proof consumes is exactly compact generation of $\\mathcal{C}$ (Step 3a) and the closure properties of $\\langle S\\rangle_{\\mathcal{C}}$ fixed by the note on [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) (Steps 0 and 3c).\n";</script>
