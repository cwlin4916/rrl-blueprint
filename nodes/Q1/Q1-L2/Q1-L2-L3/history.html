<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-L3 — history\n\n[Q1-L2-L3](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-03 — created** by `/decompose` of [Q1-L2](../index.html): the concrete half of the expansion — the Hecke family must actually satisfy the hypotheses (small, shift-stable, compact) that the two abstract sub-lemmas consume; the only sub-lemma with a dependency, since compactness is read off the identification of [Q1-L2-L1](../Q1-L2-L1/index.html).\n- **2026-08-04 — relocated** inside its parent's directory ([ADR 0012](../../../../process/decisions/0012-sub-lemmas-nest-in-their-parent.html)): the id is unchanged and is now the path.\n- **2026-08-04 — proved** in one round ([r1](critiques/r1.html)), once [Q1-L2-L1](../Q1-L2-L1/index.html) had landed, in the four-invocation run that closed the Q1-L2 chain.\n- **2026-08-05 — statement revised** ([u1](updates/u1.html)), by `/update Q1-L2-L3` at the user's reading that the statement is formal and the proof should be three paragraphs. The reading held. Clause 2 had asserted that $\\{s[n]\\}$ and $S$ have the same objects up to equivalence — not the hypothesis either consumer takes — so it now reads, in [Q1-L2-L4](../Q1-L2-L4/index.html)'s own words, that each $s[n]$ is equivalent to some $s'\\in S$; and old clauses 1 and 3 stated one membership twice, so they merged into the display $S\\subset\\mathcal{D}_c(K\\backslash LX) =_{\\mathcal{C}} \\mathcal{C}^{\\omega}$. Status reset `proved` → `open`. The revision confirmed why the node exists rather than folding into [Q1-L2](../index.html)'s proof: everything it asserts is formal — a set-theoretic image, one citation of the action's $k$-linearity, one essential-image identification — *except* the membership $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$, which says a $!$-extension is coherent and is imported rather than derived. This node is where the argument's one non-formal ingredient is isolated and named.\n- **2026-08-05 — re-proved** in the same run at [r2](critiques/r2.html), six steps down to three. The three MINOR flaws standing from [r1](critiques/r1.html) were disposed at source: the [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) entry now ratifies $\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX)$ explicitly instead of leaving it to the grammar of two entries, the draft no longer names $\\mathrm{Cat}^{\\mathrm{perf}}$, and two citation drifts were corrected against `main.tex` (922 for the Hecke action, 79–80 and 952–953 for $\\mathrm{IC}_0$). r2 was run inline rather than by the `critic` subagent and says so at its head — a self-review, and weaker evidence than an independent round.\n- **2026-08-05 — closed-world violation caught by the test suite, after [r2](critiques/r2.html) had passed the draft** ([u1](updates/u1.html), final section). The revised statement closed with a sentence naming this node's two consumers, and Step 1 named them too — but neither is in `depends-on:`, so neither may be cited, and the sentence was in `## Statement` without being in the write-up's `## Lemma`, breaking the verbatim match r2 claims to have checked. Both repaired; the observation itself is true and now lives here instead, which is where commentary about why a statement has its shape belongs: clause 1 is what [Q1-L2-L2](../Q1-L2-L2/index.html) asks of a generating family, and clause 2 is [Q1-L2-L4](../Q1-L2-L4/index.html)'s shift-stability hypothesis word for word. A history entry may say this; a proof may not.\n- **2026-08-05 — `human: approved`** at the user's direction. This is the only node in the repository the user has approved; it lifts the 80% cap, and what now limits the node's confidence is [Q1-L2-L1](../Q1-L2-L1/index.html) beneath it, whose own [r2](../Q1-L2-L1/critiques/r2.html) left two flaws standing.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined against the corrected [Q1-L4](../../Q1-L4/index.html) subtree and unaffected — the Hecke family's smallness, compactness and shift-stability are claims about objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, not about the stabilizers. It carries the tree's only `human: approved`, so its cap is lifted and nothing this run did lowers it.\n- **2026-08-05 — notation de-coined, no claim changed** by `/update Q1`. The statement opened by coining $\\mathcal{C} := \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, a symbol the appendix now owns ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html)); it now uses the symbol and links the entry instead of defining it again. No symbol and no claim changed, so no status was reset. The render gate refuses a second definition from now on (I26, [ADR 0044](../../../../process/decisions/0044-a-question-states-a-problem-not-its-route.html)).\n- **2026-08-07 — the write-up's `## Lemma` re-synced; the drift was immaterial.** The repo-wide `/update` compared the draft against the statement: four of ten paragraphs differed, and all four were the same substitution — the draft wrote $\\mathcal{C}$ where the node writes $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, having coined the abbreviation in its own opening line. No hypothesis, conclusion or ambient category differs, so this is the one case where re-syncing is honest rather than a way of hiding a superseded argument: the operator certifies that no step depends on the difference, and here none can. The `## Lemma` is now the statement verbatim and the abbreviation has moved to the write-up's `notation:` line, where the steps still read as before. `status:` stands.\n";</script>
