<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L2</a><i>›</i><a href="../../index.html">Q1-L2-L3</a><i>›</i><a href="../index.html">Q1-L2-L3-z1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L2-L3-z1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L2/Q1-L2-L3/Q1-L2-L3-z1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nDraft under review: [proof.md](../proof.html). Statement: [Q1-L2-L3-z1_node.md](../index.html).\n\nThe `## Lemma` section of the draft (lines 10–34) is a **verbatim** copy of the node's `## Statement` (lines 20–44), hypothesis labels, displays and links included. There is no renotation defect and no silent re-statement of the claim. Every link in the draft resolves: the four `objects:` entries exist at the paths given, and the six `../` in the appendix links and the two `../` to [Q1-L2-z1](../../../Q1-L2-z1/index.html) are correct for this node's depth. No bib key and no `main.tex` `\\label` is cited directly, so there is nothing to grep for hallucination on that axis.\n\nWhat follows is what the hunt turned up.\n\n---\n\n**Flaw 1** [FATAL] — Clause 1 says \"$S$ is a small set\".\n\n<details><summary>(location: Step 5, line 64 — \"the family $S$ is small up to equivalence in $\\mathcal{M}$, which is the reading of \\\"small set\\\" that **(A)** supports\"; and Caveat 1, line 84) · the finding</summary>\n\nStep 5 does not prove that sentence and cannot. It proves a strictly weaker one: that a small $S_{0}\\subset S$ exists meeting every equivalence class of $S$. The draft knows this — Caveat 1 says so plainly, and the honesty is worth crediting — but an honest substitution of a weaker claim for the claim is still a failure to establish the claim.\n\nThree reasons why the substitution cannot be waved through.\n\n*(i) No authority licenses the weak reading.* [context.md](../../../../../../context.html) fixes exactly three ratified readings, and none of them is about smallness. So the repository has not adopted \"small set of objects $=$ essentially small collection\", and the draft may not adopt it unilaterally; a ratified reading is `/update`'s to write, not the prover's.\n\n*(ii) The repository's own precedent is the literal reading.* [Q1-L2-L3's proof](../../proof.html), Step 2, reads it literally and earns it literally: \"$\\mathcal{H}_{c,K}$ is small, so its objects form a small set. $S$ is the image of that set under $\\mathcal{F}\\mapsto\\mathcal{F}\\ast\\mathrm{IC}_0$ … and the image of a small set under a function is small.\" That node is `proved` and `human: approved`. A $z$-node that abstracts it and then quietly changes what its clause 1 means is not abstracting it.\n\n*(iii) The abstraction dropped the hypothesis that made the instance work.* This is the crisp diagnosis. In [Q1-L2-L3](../../index.html) smallness came from $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ being a **small** category outright. Hypothesis **(A)** here records only that $\\mathcal{A}^{\\omega}$ is *essentially* small, which is what compact generation gives and is strictly weaker. In the universe convention that [`DGCat`, `Vect`](../../../../../../appendix/conv-dgcat.html) inherits from $\\mathrm{Pr}^{L}$, the gap is real and not a scruple: for $\\mathcal{A}=\\mathrm{Vect}$ the category $\\mathcal{A}^{\\omega}=\\mathrm{Perf}_{k}$ has countably many equivalence classes and a **non-small** collection of objects. So $S$ is the image of a non-small collection under the object-function of $(-)\\ast m_{0}$, and nothing in the hypotheses makes that image small.\n\nI stop short of `REFUTED` on this point, deliberately, and say why so the record shows the boundary. To refute I would have to exhibit one $(\\mathcal{A},\\mathcal{M},m_{0})$ admitted by **(A)**–**(C)** for which $S$ is demonstrably non-small. The natural candidate — $\\mathcal{A}=\\mathcal{M}=\\mathrm{Vect}$, $m_{0}=k$, so that $S=\\{a\\otimes_{k}k\\}$ ranges over a non-small collection of perfect complexes — turns on whether the object-function of a *chosen* model of the action bifunctor collapses that collection to a small one. The image of a non-small class under a class function *can* be small, and neither [module categories over a monoidal category](../../../../../../appendix/conv-module-categories.html) nor [`DGCat`, `Vect`](../../../../../../appendix/conv-dgcat.html) pins down a strict model in which I can compute it. That is suspicion, not refutation, so it is recorded here as a FATAL flaw rather than as a verdict about the statement — per the instruction that suspicion is not refutation.\n\nThe repair is in the statement, not the write-up, and belongs to `/update`: either strengthen **(A)** to \"$\\mathcal{A}^{\\omega}$ is small\" (which is what the instance actually has), or define $S$ from a small $\\mathcal{A}_{0}\\subset\\mathcal{A}^{\\omega}$ meeting every equivalence class, or ratify the up-to-equivalence reading of \"small set\" in [context.md](../../../../../../context.html) and let every node in the repository inherit it. Until one of those happens, clause 1 stands unproved.\n\n</details>\n\n---\n\n**Flaw 2** [MAJOR] — The Caveat's repair does not repair what it claims to repair, and its stated reason is not the reason.\n\n<details><summary>(location: Caveat 1, line 84 — \"that form suffices for clause 3 … so $S$ may be replaced by the small $S_{0}$ of Step 5 with nothing downstream changed\") · the finding</summary>\n\n*It rescues the pipeline, not clause 3.* Clause 3 asserts that **$S$** satisfies hypothesis (B) of [Q1-L2-z1](../../../Q1-L2-z1/index.html), and that hypothesis reads \"$S$ is a small set and $S\\subset\\mathcal{C}^{\\omega}$\". If $S$ is not small then clause 3 is false alongside clause 1, and the availability of a small $S_{0}$ that would have done instead changes nothing about the sentence clause 3 asserts. Step 8 inherits the defect verbatim (\"Step 5 gives the first conjunct\"), and so does Step 7 (\"$S$ is a family of objects of $\\mathcal{M}$, small by Step 5\"). So Flaw 1 propagates through three of the nine steps, and the Caveat does not stop it.\n\n*The reason given is wrong.* \"Hypotheses (B), (C) … are invariant under replacing a member by an equivalent object\" is true and irrelevant: passing from $S$ to $S_{0}$ does not replace a member by an equivalent object, it **deletes** members. What is actually needed is that $S_{0}$ itself is shift-stable, and no step proves that. It is true — for $s_{0}\\in S_{0}$ and $n\\in\\mathbb{Z}$, Step 6 supplies $s'\\in S$ with $s'\\simeq_{\\mathcal{M}}s_{0}[n]$, and $S_{0}$ meets $s'$'s equivalence class, so some $s_{0}'\\in S_{0}$ has $s_{0}'\\simeq_{\\mathcal{M}}s_{0}[n]$ — but that two-line argument appears nowhere in the draft, and Step 6 concludes $s'\\in S$, never $s'\\in S_{0}$. As written the draft delivers no object that literally satisfies both (B) and (C) of [Q1-L2-z1](../../../Q1-L2-z1/index.html): $S$ satisfies (C) and not demonstrably (B), $S_{0}$ satisfies (B) and is never shown to satisfy (C).\n\n</details>\n\n---\n\n**Flaw 3** [MAJOR] — The trailing phrase has two readings and one of them is false, so the statement cannot be certified until `/update` picks one.\n\n<details><summary>(location: clause 3, line 34 — \"$S$ satisfies hypotheses **(B)** and **(C)** of [Q1-L2-z1] **as a set of generators of $\\mathcal{M}$**\") · the finding</summary>\n\nUnder the strong reading — \"$S$ is a set of generators of $\\mathcal{M}$, and as such satisfies (B) and (C)\" — clause 3 asserts $\\langle S\\rangle_{\\mathcal{M}}=\\mathcal{M}$, and that is false under **(A)**–**(C)**. Failing case, entirely inside the hypotheses: take $\\mathcal{A}=\\mathrm{Vect}$, $\\mathcal{M}=\\mathrm{Vect}\\times\\mathrm{Vect}$ with the diagonal action, $m_{0}=(k,0)$. Then $\\mathcal{M}\\in\\mathrm{DGCat}$ is compactly generated with $\\mathcal{M}^{\\omega}=\\mathrm{Perf}_{k}\\times\\mathrm{Perf}_{k}$, so **(A)** holds; $a\\ast(-)$ acts componentwise and preserves compacts, so **(B)** holds; $m_{0}$ is compact, so **(C)** holds. But $S=\\{(a\\ast k,\\ a\\ast 0)\\}$ lies in $\\mathrm{Vect}\\times 0$, so $\\langle S\\rangle_{\\mathcal{M}}=\\mathrm{Vect}\\times 0\\neq\\mathcal{M}$, and the object $(0,k)\\neq 0$ is invisible to every $\\operatorname{Map}_{\\mathcal{M}}(s[n],-)$.\n\nUnder the weak reading — \"$S$, in the role a set of generators would play, satisfies (B) and (C)\" — clause 3 is exactly Steps 8–9 and is fine. The draft takes the weak reading (Caveat 3, line 88: \"It asserts neither $\\langle S\\rangle_{\\mathcal{M}}=\\mathcal{M}$ nor …\") without saying on whose authority, and the node's `## Scope` paragraph does not adjudicate. Because the weak reading is grammatically available and is the one the write-up proves, I decline `REFUTED` here too; but the counterexample above is exhibited so that `/update` can see what leaving the phrase ambiguous costs.\n\n</details>\n\n---\n\n**Flaw 4** [MINOR] — That disclosure is not accurate. Steps 7, 8 and 9 read the text of hypotheses (A), (B), (C) of [Q1-L2-z1](../../../Q1-L2-z1/index.html) and quote them at $\\mathcal{C}=\\mathcal{M}$; Step 8 in particular reproduces (B) word for word.\n\n<details><summary>(location: the **uses** line, line 5 — \"No node is invoked: `depends-on` is empty\") · the finding</summary>\n\nThat node is in neither `depends-on` (empty) nor `objects:`, and is not an appendix entry, so under the closed-world rule of [context.md](../../../../../../context.html) it is outside what the proof may invoke. Two mitigations, which is why this is MINOR and not MAJOR: the node's *own* `## Statement` contains the link, so the reference is forced by the claim rather than smuggled in; and only the *hypotheses* are read, never the conclusion, so there is no circularity and no import of an unproved result.\n\nThe residue is a real fragility the DAG does not record. [Q1-L2-z1](../../../Q1-L2-z1/index.html) is `status: open` with `required-by: —`, and this node has `depends-on: —` and `required-by: —`, so nothing in the graph couples them. If `/update` relabels or rewords that node's (B) or (C), Steps 7–9 break silently and no check fires. `/update` should record the coupling.\n\nCross-check performed on the substance, since clause 3 was to be verified quantifier-for-quantifier rather than declared. [Q1-L2-z1](../../../Q1-L2-z1/index.html)(B) is \"$S$ is a small set and $S\\subset\\mathcal{C}^{\\omega}$\" and (C) is \"for every $s\\in S$ and every $n\\in\\mathbb{Z}$ there is $s'\\in S$ with $s'\\simeq_{\\mathcal{C}}s[n]$\". At $\\mathcal{C}=\\mathcal{M}$ these are, symbol for symbol, clause 1 and clause 2: same quantifier order $\\forall s\\,\\forall n\\,\\exists s'$, same ranges $S$ and $\\mathbb{Z}$, same ambient subscript on $\\simeq$, and the same $\\mathcal{C}^{\\omega}$ of [compact objects](../../../../../../appendix/def-compact-objects.html). Steps 8–9 are therefore correct **as reductions**; they fail only through Flaws 1–2, upstream of them. Step 7's substitution $\\mathcal{C}:=\\mathcal{M}$ is admissible: [Q1-L2-z1](../../../Q1-L2-z1/index.html) quantifies over a stable $\\mathcal{C}$, and $\\mathcal{M}\\in\\mathrm{DGCat}$ is stable by Step 2.\n\n</details>\n\n---\n\n**Flaw 5** [MINOR] — The generation operation is [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../../appendix/def-generation.html), which is not in this node's `objects:` and is not linked at the point of use.\n\n<details><summary>(location: Caveat 1, line 84 — \"the bracket $\\langle S\\rangle_{\\mathcal{M}}$ they feed\") · the finding</summary>\n\nThe ambient subscript is correctly present, so the render gate is satisfied, but an appendix object is being invoked outside the declared closed world. It occurs in a Caveat rather than a step, which is the only reason this is MINOR — except that Caveat 1 is where the whole \"suffices for clause 3\" argument lives, so it is not as decorative as its placement suggests.\n\n</details>\n\n---\n\n**Flaw 6** [MINOR] — Checked against the source, as instructed, rather than inherited.\n\n<details><summary>(location: Step 6, line 72 — \"The *second* equivalence of the last display of [`conv:module_categories`]\") · the finding</summary>\n\n`main.tex` lines 587–602 (the unlabelled *Module categories* subsection the entry cites) contain the algebra/module definitions, $\\mathrm{LMod}_{\\mathcal{A}}\\simeq\\mathrm{RMod}_{\\mathcal{A}^{\\mathrm{rev}}}$, the bimodule identification and the relative tensor product — and **no shift display at all**. The display\n\n$$\na\\ast(m[n])\\ \\simeq_{\\mathcal{M}}\\ (a\\ast m)[n]\\ \\simeq_{\\mathcal{M}}\\ (a[n])\\ast m\n$$\n\nthat Step 6 rests on is the appendix entry's own addition; it is disclosed in the entry's `note:` field but not in its `**Convention** (main.tex:589–602 …)` attribution, which reads as though the whole entry came off those lines. Two further observations, both against the entry rather than the draft. First, the entry's stated reason — \"the action functor of an object $a\\in\\mathcal{A}$ … is $k$-linear and exact\" — justifies only the *first* equivalence, the one Step 6 explicitly does not use; the *second* needs linearity in the $\\mathcal{A}$-variable, and only the `note:`'s broader claim about the bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$ covers it. Second, the same entry's sentence about $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$ likewise has no source at the cited lines. The mathematics is correct — $k$-linearity of the $\\mathrm{DGCat}$-tensor does move $k[n]$ across the two slots — and the entry is the closed world, so the draft is entitled to the display it cites. But a load-bearing step of a $z$-node should not rest on an entry whose attribution over-reaches, and the entry's line reference should be corrected.\n\n</details>\n\n---\n\n**Flaw 7** [MINOR] — Three small things. The identification is HA 4.8.2.18 and is invoked with no citation; it is standard enough to pass under \"standard mathematics needing no citation\", but it is the one non-trivial import in the step.\n\n<details><summary>(location: Step 2, line 40 — \"$\\mathrm{Mod}_{\\mathrm{Sp}}(\\mathrm{Pr}^{L})=\\mathrm{Pr}^{L}_{\\mathrm{st}}$\") · the finding</summary>\n\nThe notation drifts from $\\mathrm{LMod}$ (used two clauses earlier, and by [`DGCat`, `Vect`](../../../../../../appendix/conv-dgcat.html)) to $\\mathrm{Mod}$ with no remark; harmless since $\\mathrm{Sp}$ is $\\mathbb{E}_{\\infty}$, but the repository's convention is to keep one symbol. And the detour is avoidable: $\\mathcal{C}\\in\\mathrm{DGCat}$ is tensored over $\\mathrm{Vect}$, $k[1]$ is $\\otimes$-invertible in $\\mathrm{Vect}$ with inverse $k[-1]$, so $[1]=k[1]\\otimes(-)$ is an equivalence in one line and $\\mathrm{Sp}$ never enters. Step 3's own argument is correct as it stands: $\\operatorname{Map}_{\\mathcal{A}}(a[n],-)\\simeq\\operatorname{Map}_{\\mathcal{A}}(a,-)\\circ[-n]$ naturally, $[-n]$ preserves all colimits because it is an equivalence, so the composite preserves filtered ones.\n\n</details>\n\n---\n\n**Flaw 8** [MINOR] — Confirmed independently, step by step: Step 1 uses only membership in $\\mathrm{DGCat}$; Step 2 only presentability plus the $\\mathrm{Vect}$-action; Step 3 only $\\mathcal{A}$; Step 4 only **(B)**, **(C)** and the definition of $\\mathcal{M}^{\\omega}$; Step 5 only essential smallness of $\\mathcal{A}^{\\omega}$; Steps 6–9 nothing.\n\n<details><summary>(location: Caveat 2, line 86 — \"compact generation of $\\mathcal{M}$ enters no step\") · the finding</summary>\n\nThe $\\mathcal{M}$-half of **(A)** is indeed never consumed.\n\nMy judgement on whether that is a defect: **not in substance, but the statement should say so.** The $\\mathcal{M}$-half is precisely hypothesis (A) of [Q1-L2-z1](../../../Q1-L2-z1/index.html) — together with cocompleteness, which comes free from $\\mathcal{M}\\in\\mathrm{Pr}^{L}$ — so it is what makes the package clause 3 assembles actually pluggable into that node. Carrying it is right; leaving it unconsumed by any clause is what looks odd. The clean fix for `/update` is to widen clause 3 to \"$S$ satisfies hypotheses **(A)**, **(B)** and **(C)** of [Q1-L2-z1]\", after which the hypothesis is load-bearing and the node delivers a complete input rather than two thirds of one. The draft's further claim that essential smallness of $\\mathcal{M}^{\\omega}$ would supply Step 5 by a second route is correct but under-stated: it needs a choice, for each member of a small skeleton of $\\mathcal{M}^{\\omega}$ whose class meets $S$, of an element of $S$ in that class — small choice, so harmless, but it is a step and not an observation.\n\n</details>\n\n---\n\n**Flaw 9** [MINOR] — Recorded because it sharpens Flaw 1 and because a $z$-node that does not cover its declared instance is not doing its job.\n\n<details><summary>(location: `instances:` [Q1-L2-L3](../../index.html), node file line 12) · the finding</summary>\n\nRead at the categories [Q1-L2-L3](../../index.html) actually works in — $\\mathcal{A}=\\mathcal{D}_{c}(K\\backslash\\mathrm{Gr})$ and $\\mathcal{M}=\\mathcal{D}_{c}(K\\backslash LX)$, which that node's Step 3 places in the *small* ambient $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$ of [module categories over a monoidal category](../../../../../../appendix/conv-module-categories.html) — hypothesis **(A)** fails outright: a small stable idempotent-complete category does not admit small filtered colimits, so it is not compactly generated in the sense of [compact generation](../../../../../../appendix/def-compactly-generated-category.html), and it is not an object of $\\mathrm{DGCat}$ either. The instance only typechecks after passing to $\\mathcal{A}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathrm{Gr})$, $\\mathcal{M}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, whose compacts are the two coherent categories. That is presumably the intent, and it is not the draft's fault since the draft never mentions the instance — but it is worth writing down that in that reading $\\mathcal{A}^{\\omega}=\\mathcal{D}_{c}(K\\backslash\\mathrm{Gr})$ is **genuinely small**, which is exactly the hypothesis **(A)** throws away and Flaw 1 needs back.\n\n</details>\n\n---\n\n### Checks that found nothing\n\nRecorded so the review's coverage is auditable.\n\n- **Scope-paragraph attribution.** The node's `## Scope` says clause (2) follows from the shift display of [module categories over a monoidal category](../../../../../../appendix/conv-module-categories.html) \"together with shift-stability of $\\mathcal{A}^{\\omega}$, which holds in any stable category because $[n]$ is an equivalence.\" The draft's report is accurate and no flaw arises: the entry supplies the display and nothing about compacts, and Scope never claimed otherwise — it names shift-stability as a separate ingredient and gives its reason. Step 3 discharging it is correct behaviour, not a discrepancy.\n- **Type-checking.** $\\mathcal{A}$ an algebra object of $\\mathrm{DGCat}$, $\\mathcal{M}\\in\\mathrm{LMod}_{\\mathcal{A}}$, both with underlying object in $\\mathrm{DGCat}$; the action a bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$; $(-)\\ast m_{0}\\colon\\mathcal{A}\\rightarrow\\mathcal{M}$ obtained by fixing the second slot. All well-defined, all matching the entries.\n- **Handedness.** $[n]$ and $[-n]$ are used in the correct positions throughout; the natural equivalence in Step 3 has the shift on the correct argument; Step 6 takes the second and not the first equivalence of the display, and says why the first is not needed.\n- **Compactness bookkeeping.** $\\mathcal{C}^{\\omega}$ is used consistently in the sense of [compact objects](../../../../../../appendix/def-compact-objects.html) (anima-valued $\\operatorname{Map}$, matching `main.tex`:518–523, not the $\\mathrm{Vect}$-enriched $\\underline{\\operatorname{Map}}$ of `main.tex`:254), and Step 8 explicitly checks it is the same subcategory as in clause 1. No `ren`/non-`ren` confusion arises because no sheaf theory enters.\n- **Source-checking.** [`DGCat`, `Vect`](../../../../../../appendix/conv-dgcat.html), [compact objects](../../../../../../appendix/def-compact-objects.html) and [compact generation](../../../../../../appendix/def-compactly-generated-category.html) all match `main.tex` at the lines they cite (246–256, 518–523, 526–535 respectively; the entries' line numbers are one or two lines off but land inside the right environment). Only [module categories over a monoidal category](../../../../../../appendix/conv-module-categories.html) over-attributes — Flaw 6.\n- **Geometric hypotheses.** None are invoked, correctly: no space, group, placidity, ind-properness or dimension theory appears anywhere in the statement or the draft. This is the intended content of a $z$-node.\n- **Circularity.** No appeal to any node's conclusion; `depends-on` is empty and the closing disclosure at line 80 says so, which is what this run required it to say. The only closed-world leaks are Flaws 4 and 5, and neither is an unproved result.\n\n---\n\nVERDICT: FAIL\n";</script>
