<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L2</a><i>›</i><a href="../../index.html">Q1-L2-L3</a><i>›</i><a href="../index.html">Q1-L2-L3-z1</a><i>›</i><span>r2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L2-L3-z1, round 2</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L2/Q1-L2-L3/Q1-L2-L3-z1/critiques/r2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nDraft under review: [proof.md](../proof.html). Statement: [Q1-L2-L3-z1_node.md](../index.html). Previous round: [r1.md](r1.html). Statement revision: [u1.md](../updates/u1.html).\n\n## Statement fidelity\n\nDiffed line by line rather than declared. The draft's `## Lemma` (lines 10–34) reproduces the node's `## Statement` (lines 30–54) **verbatim** — hypothesis labels, the two displays, the clause numbering and the relative link targets all identical, the last being possible only because `proof.md` and `<id>_node.md` sit at the same depth and so carry the same five-`../` prefixes. The two `**Scope**` paragraphs (node lines 56, 58) are commentary and their omission is correct; the substance of the first is reproduced anyway as Caveat 1. No hypothesis is strengthened, no conclusion weakened, and the write-up is 962 words, inside both the 1500-word gate and the 1000-word split signal.\n\n## Disposal of the round-1 FATAL and MAJORs\n\nChecked against the draft rather than against the prover's report.\n\n**r1 Flaw 1 [FATAL] — resolved, and resolved the right way.** Step 5 now proves the sentence clause 1 asserts: $S$ is the image of $\\mathrm{Ob}(\\mathcal{A}^{\\omega})$ under the object-function of $(-)\\ast m_{0}$, hypothesis **(A)** supplies literal smallness of that domain, and the image of a small set under a function is small. A grep of the draft for `up to equivalence` and `essentially small` returns exactly one hit, inside the quoted text of **(A)** itself; the phrase never occurs in a step. No new ratified reading is adopted anywhere, which matters because [context.md](../../../../../../context.html) fixes exactly three and none is about smallness.\n\n**r1 Flaw 2 [MAJOR] — dissolved rather than patched.** There is no $S_{0}$, no $\\mathcal{A}_{0}$, and no surviving hedge: Steps 5, 6, 7, 9 and 10 all speak of $S$ itself, and the object delivered to [Q1-L2-z1](../../../Q1-L2-z1/index.html) is one object satisfying both its **(B)** and its **(C)**, which is precisely what r1 said the old draft never produced.\n\n**r1 Flaw 3 [MAJOR] — resolved.** Clause 3 now reads \"taken there with $\\mathcal{C}:=\\mathcal{M}$\", the draft matches it verbatim, and Caveat 1 states outright that no equivalent condition (1)–(3) of that node is asserted. There is no generation bracket anywhere in the draft — the strong reading is not smuggled back in.\n\nI also checked the three claims the round was asked to test independently. Step 8 genuinely needs $\\mathcal{M}$ **stable**, not merely $[n]$ invertible: [Q1-L2-z1](../../../Q1-L2-z1/index.html) opens \"Let $\\mathcal{C}$ be a stable category\", so stability is a typing condition on the substitution, and the one-line route r1's Flaw 7 suggested ($[1]=k[1]\\otimes(-)$ is invertible because $k[1]$ is $\\otimes$-invertible in $\\mathrm{Vect}$) yields invertibility of the shift and nothing about biCartesian squares. Retaining the $\\mathrm{Sp}$ route is therefore correct, and r1's shortcut would have sufficed for Steps 3–4 alone. The citation [[HA, Prop. 4.8.2.18](../../../../../../../papers/HA.pdf)] is real and says what the draft says: `HA` is `refs.bib`:548, and page 722 of `papers/HA.pdf` reads \"the forgetful functor $\\mathrm{Mod}_{\\mathrm{Sp}}(\\mathrm{Pr}^{L})\\rightarrow\\mathrm{Pr}^{L}$ determines a fully faithful embedding whose essential image is the full subcategory $\\mathrm{Pr}^{\\mathrm{St}}\\subseteq\\mathrm{Pr}^{L}$ spanned by the stable presentable $\\infty$-categories\" — the $\\mathrm{Mod}$/$\\mathrm{LMod}$ discrepancy the draft discloses is exactly right, and in fact cheaper than disclosed, since the same proposition makes $(\\mathrm{Sp},S)$ idempotent so that being an $\\mathrm{Sp}$-module is a property.\n\nWhat follows is what the hunt turned up. Nothing rises to FATAL or MAJOR.\n\n---\n\n**Flaw 1** [MINOR] — The map is misnamed. $\\mathrm{Sp}$ is not the unit of $\\mathrm{Pr}^{L}$ and not the initial object of $\\mathrm{CAlg}(\\mathrm{Pr}^{L})$ — both are $\\mathrm{Ani}$; $\\mathrm{Sp}$ is the initial object of $\\mathrm{CAlg}(\\mathrm{Pr}^{L}_{\\mathrm{st}})$.\n\n<details><summary>(location: Step 2, line 40 — \"Restriction along the unit map $\\mathrm{Sp}\\rightarrow\\mathrm{Vect}$ of $\\mathrm{CAlg}(\\mathrm{Pr}^{L})$\") · the finding</summary>\n\nThe morphism the step wants is $\\mathrm{LMod}_{(-)}$ applied to the unit $\\mathbb{S}\\rightarrow k$ of $\\mathrm{CAlg}(\\mathrm{Sp})$, giving $\\mathrm{Sp}=\\mathrm{LMod}_{\\mathbb{S}}\\rightarrow\\mathrm{LMod}_{k}=\\mathrm{Vect}$ in $\\mathrm{CAlg}(\\mathrm{Pr}^{L})$. That map exists, is canonical, and restriction of scalars along it does run $\\mathrm{LMod}_{\\mathrm{Vect}}(\\mathrm{Pr}^{L})\\rightarrow\\mathrm{LMod}_{\\mathrm{Sp}}(\\mathrm{Pr}^{L})$ — the handedness is right — so nothing downstream breaks. It is a naming slip in the one step of the draft that leaves the appendix's vocabulary.\n\n</details>\n\n---\n\n**Flaw 2** [MINOR] — The label under-reports the dependence. Step 2's second sentence is not oriented by 4.8.2.18; it *is* 4.8.2.18, quoted with $\\mathrm{LMod}$ for $\\mathrm{Mod}$.\n\n<details><summary>(location: References, line 86 — \"[[HA, Prop. 4.8.2.18](../../../../../../../papers/HA.pdf)], orientation only\") · the finding</summary>\n\nThe fact is standard enough to travel under \"standard mathematics needing no citation\", so this is a labelling inaccuracy and not a closed-world breach, and giving the pointer at all is an improvement on r1's Flaw 7. Recorded because a reader auditing which imports are load-bearing would be misled by \"orientation only\".\n\nAn observation for the lead-researcher, against the manuscript and not against this draft: `main.tex`:244 cites `\\cite[Proposition 4.8.2.18]{HA}` for the lax monoidality of a functor category, which is not what that proposition says. The draft's use of the number is the correct one.\n\n</details>\n\n---\n\n**Flaw 3** [MINOR] — A closed-world bookkeeping flaw, in the **statement** rather than in the write-up.\n\n<details><summary>(location: node file line 56, the first `**Scope**` paragraph — \"$\\langle S\\rangle_{\\mathcal{M}}=\\mathrm{Vect}\\times 0$\") · the finding</summary>\n\nThe generation bracket is the operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../../appendix/def-generation.html), which exists in the appendix (`index.md`:97) but is **not** among this node's declared `objects:` and is not linked at the point of use. This is r1's Flaw 5 migrated: u1 removed the bracket from the draft's Caveat and put it into the node's Scope. The subscript is present so the render gate passes, and the draft itself is clean — I grepped it and there is no `\\langle` anywhere. The fix belongs to whoever maintains `objects:`, i.e. the lead-researcher, not to the prover.\n\n</details>\n\n---\n\n**Flaw 4** [MINOR] — Stale after u1, and stale in a way that matters.\n\n<details><summary>(location: node file line 58, the second `**Scope**` paragraph — \"The one hypothesis that is not formal is **(B)**\") · the finding</summary>\n\nBefore the revision, **(A)** was a pure consequence of the ambient conventions in any instance one cares about, so \"the one hypothesis that is not formal is (B)\" was defensible. After the revision, **(A)** carries a clause — $\\mathrm{Ob}(\\mathcal{A}^{\\omega})$ literally a small set — which is *not* formal, is not implied by compact generation, and is exactly what Flaw 5 below says an instance must go out of its way to supply. Two paragraphs in one statement both labelled `Scope` is also awkward; the second now contradicts the emphasis of the first. Not the draft's fault, and the draft correctly omits both. For `/update`.\n\n</details>\n\n---\n\n**Flaw 5** [MINOR] — The strengthened clause is not invariant under equivalence of $\\mathcal{A}$, and the statement nowhere says so.\n\n<details><summary>(location: hypothesis **(A)**, line 12 of the draft / line 32 of the node — \"the objects of $\\mathcal{A}^{\\omega}$ form a small set, not merely an essentially small collection\") · the finding</summary>\n\nBy [compact objects](../../../../../../appendix/def-compact-objects.html), $\\mathcal{A}^{\\omega}$ is the full subcategory spanned by *all* compact objects, hence closed under equivalence; in the usual presheaf models of a presentable category every nonzero equivalence class has a non-small collection of representatives, and there **(A)** fails for every nonzero $\\mathcal{A}$. So a reader could reasonably fear the lemma is vacuous.\n\nI checked and it is not, which is why this is MINOR and why I decline `REFUTED` — vacuity would not falsify the statement in any case, but it would gut it. Two witnesses. (i) A minimal model in the sense of [[HTT](../../../../../../../papers/HTT.pdf)] §2.3.3 of any compactly generated $\\mathcal{A}\\in\\mathrm{DGCat}$ has one object per equivalence class, so its compacts form a small set, and presentability, the algebra structure and compact generation all transport along the equivalence. (ii) More to the point, the declared instance has it on the nose: [Q1-L2-L3](../../index.html) clause 1 asserts $\\mathcal{D}_{c}(K\\backslash LX)=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\omega}$, an equality of full subcategories, with $\\mathcal{D}_{c}$ small by construction — so u1's diagnosis, that the abstraction had dropped a hypothesis the instance already pays, is correct and this is the right repair.\n\nThe residue worth writing into Scope one day: **(A)** now asks an instance to *exhibit a model*, not to *check a property*, and the r1 Flaw 9 caveat still applies — the instance only typechecks after passing to $\\mathcal{A}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathrm{Gr})$, never at $\\mathcal{D}_{c}$ inside $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$, which is not compactly generated.\n\n</details>\n\n---\n\n**Flaw 6** [MINOR] — Compressed to the point of inaccuracy.\n\n<details><summary>(location: Caveat 2, line 82 — \"The $\\mathcal{M}$-half is hypothesis (A) of [Q1-L2-z1]\") · the finding</summary>\n\n[Q1-L2-z1](../../../Q1-L2-z1/index.html)(A) is the conjunction \"$\\mathcal{C}$ admits all small colimits **and** is compactly generated\"; the $\\mathcal{M}$-half of this node's **(A)** supplies only the second conjunct, the first coming free from $\\mathcal{M}\\in\\mathrm{Pr}^{L}$ via Step 1. r1 spelled this out; the redraft dropped the parenthetical. One clause would restore it.\n\n</details>\n\n---\n\n**Flaw 7** [MINOR]\n\n<details><summary>(location: Caveat 2, line 82 — \"compact generation — of $\\mathcal{A}$ or of $\\mathcal{M}$ — enters no step\") · the finding</summary>\n\nVerified independently, step by step, and the claim is **true**: Step 1 uses only membership in $\\mathrm{DGCat}$; Step 2 only that membership; Steps 3–4 only stability of $\\mathcal{A}$ and [compact objects](../../../../../../appendix/def-compact-objects.html); Step 5 only the \"moreover\" clause of **(A)**; Step 6 only **(B)** and **(C)**; Steps 7–10 only earlier steps and the appendix display. So Caveat 2 is right and the prover's report of it is right.\n\nThe consequence is worth recording for a later `/update` rather than against the draft: after u1 the $\\mathcal{A}$-half of **(A)** is dead weight twice over, since literal smallness of $\\mathrm{Ob}(\\mathcal{A}^{\\omega})$ subsumes the essential smallness that compact generation of $\\mathcal{A}$ was there to produce. **(A)** could be weakened to \"$\\mathcal{M}$ is compactly generated, and $\\mathrm{Ob}(\\mathcal{A}^{\\omega})$ is a small set\" with no step touched. Whether to do so is a judgement about the interface, not about correctness: the unused $\\mathcal{M}$-half is what makes clause 3 a complete input to the sibling, and r1's Flaw 8 suggestion — widen clause 3 to name **(A)** there too — remains the cleaner alternative and was not taken up by u1.\n\n</details>\n\n---\n\n**Flaw 8** [MINOR] — The disclosure is now accurate and is a genuine improvement on the round-1 version.\n\n<details><summary>(location: the **uses** line, line 5 — \"clause 3 makes the proof read the *hypotheses* **(B)**, **(C)** of the sibling [Q1-L2-z1]\") · the finding</summary>\n\nWhat r1's Flaw 4 asked for beyond the disclosure has still not happened: neither node records the coupling — this node has `depends-on: —`, [Q1-L2-z1](../../../Q1-L2-z1/index.html) has `required-by: —` — so a reword of that node's **(B)** or **(C)** breaks Steps 8–10 of this draft silently and no gate fires. The coupling is now live in one more sense than it was at r1: that node has moved to `status: proved`, so downstream work will treat its clause numbering as settled. Strictly speaking Step 8 also reads its *preamble* (\"Let $\\mathcal{C}$ be a stable category and let $S$ be a set of objects of $\\mathcal{C}$\"), which is not (B) or (C); the `uses` line's word \"hypotheses\" covers this loosely enough.\n\n</details>\n\n---\n\n**Flaw 9** [MINOR] — Re-verified against the source rather than inherited from r1, and the *entry* is still defective.\n\n<details><summary>(location: Step 7, line 68 — \"the shift display of [module categories over a monoidal category](../../../../../../appendix/conv-module-categories.html), which that entry records as $k$-linearity of the action bifunctor\") · the finding</summary>\n\n`main.tex`:587–602, the unlabelled *Module categories* subsection the entry attributes itself to, contains the algebra/module definitions, $\\mathrm{LMod}_{\\mathcal{A}}\\simeq\\mathrm{RMod}_{\\mathcal{A}^{\\mathrm{rev}}}$, the bimodule identification and the relative tensor product, and **no shift display**; the entry's $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$ sentence is sourced, but at `main.tex`:562–579, outside the cited range. So the entry's `**Convention** (main.tex:589–602)` attribution over-reaches on both counts, and this has now survived a full round.\n\nThe draft's own handling is the correct one and answers r1's Flaw 6 precisely: it warrants the *second* equivalence by the entry's `note:` — $k$-linearity of the bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$, which is what moves $k[n]$ across the two slots of a tensor over $\\mathrm{Vect}$ — rather than by the entry's body sentence about the action functor of a fixed $a\\in\\mathcal{A}$, which justifies only the first. The mathematics is right and the appendix is the closed world, so the step stands. The line reference is the lead-researcher's to fix.\n\n</details>\n\n---\n\n### Checks that found nothing\n\nRecorded so the coverage is auditable.\n\n- **Hallucination.** `HA` is present at `refs.bib`:548; Prop. 4.8.2.18 verified at `papers/HA.pdf` p. 722; no `main.tex` `\\label` is cited by name anywhere in the draft. All four declared `objects:` links resolve to files on disk at the paths given, as do the header links and the two links to the sibling node; the six-`../` and five-`../` prefixes are right for the respective depths. No appendix entry is invoked that the node does not declare — [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../../appendix/def-generation.html) is absent from the draft entirely (Flaw 3 concerns the node file).\n- **Type-checking.** $\\mathcal{A}$ an algebra object of $\\mathrm{DGCat}$, $\\mathcal{M}\\in\\mathrm{LMod}_{\\mathcal{A}}(\\mathrm{DGCat})$, action a bifunctor into $\\mathcal{M}$, $(-)\\ast m_{0}\\colon\\mathcal{A}\\rightarrow\\mathcal{M}$ by fixing the second slot, $[n]$ an endofunctor of whichever of the two the object lies in (declared on the `notation` line). Every composition is defined. The only pedantry available: a functor out of the Lurie tensor product $\\mathcal{A}\\otimes\\mathcal{M}$ has one variable, so \"fixing its second variable\" passes silently through $\\mathcal{A}\\times\\mathcal{M}\\rightarrow\\mathcal{A}\\otimes\\mathcal{M}$; that passage is standard and the entry itself writes the action that way.\n- **Handedness.** Restriction of scalars along an algebra map $A\\rightarrow B$ runs $\\mathrm{LMod}_{B}\\rightarrow\\mathrm{LMod}_{A}$, and Step 2 uses it in that direction. Step 4 puts $[-n]$ on the correct argument and reads $\\operatorname{Map}_{\\mathcal{A}}(a[n],-)\\simeq\\operatorname{Map}_{\\mathcal{A}}(a,-)\\circ[-n]$, whose right side preserves filtered colimits as a composite of an equivalence with a filtered-colimit-preserving functor. Step 7 takes the second and not the first equivalence of the display and says why the first is idle.\n- **Compactness bookkeeping.** $\\mathcal{C}^{\\omega}$ is used throughout in the anima-valued sense of [compact objects](../../../../../../appendix/def-compact-objects.html) (`main.tex`:518–523), never the $\\mathrm{Vect}$-enriched $\\underline{\\operatorname{Map}}$ of `main.tex`:254, and Step 9 checks that the $\\mathcal{M}^{\\omega}$ of clause 1 and the $\\mathcal{C}^{\\omega}$ of the sibling's (B) are the same subcategory. No `ren` / non-`ren` question arises: no sheaf theory enters.\n- **Quantifiers.** Step 10's match of clause 2 against the sibling's (C) is checked symbol for symbol here too: same order $\\forall s\\,\\forall n\\,\\exists s'$, same ranges $S$ and $\\mathbb{Z}$, same ambient subscript on $\\simeq$. Step 7's choice of a preimage $a$ for a given $s$ is a choice over a small set and is made one $s$ at a time.\n- **Geometric hypotheses.** None invoked and none needed — no space, group, placidity, ind-properness, orbit finiteness or dimension theory occurs. Correct for a $z$-node.\n- **Circularity.** `depends-on` is empty, the closing line at 76 says so, and no node's *conclusion* is used; only the hypotheses and the ambient typing of the sibling are read, which the statement itself forces.\n\n---\n\nVERDICT: PASS\n";</script>
