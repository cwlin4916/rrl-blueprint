<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-L3-z1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L3-z1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-L3-z1 — history\n\n[Q1-L2-L3-z1](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created**: cut at the user's direction as the second half of the minimal test bed for the abstraction layer, alongside [Q1-L2-z1](../../Q1-L2-z1/index.html). The brief was one abstract statement proving [Q1-L2](../../index.html) directly and one contributing to a lemma below it; this is the second, and the lemma it abstracts is [Q1-L2-L3](../index.html). Deleting $\\mathrm{Gr}$, $LX$, $K$ and $\\mathrm{IC}_0$ from that lemma leaves a monoidal category acting on a module category, a compact basepoint, and the assertion that the orbit is a shift-stable set of compacts — which is this node.\n\n- **2026-08-06 — what the abstraction isolates**: the point of stating it this way is clause **(B)**, the only hypothesis that a geometric instance has to earn. Smallness and shift-stability fall out of stability and of [module categories over a monoidal category](../../../../../appendix/conv-module-categories.html) with no input at all, so in [Q1-L2-L3](../index.html) the entire mathematical content is that the spherical Hecke action preserves coherence, and the rest of that node is bookkeeping this node now carries once.\n\n- **2026-08-06 — the edge is `instances`, not `depends-on`**: [Q1-L2-L3](../index.html) is recorded as an instance, so its status, its proof and its confidence are untouched by this node and this node caps nothing. The relation drawn on the $z$ axis is specialization and not dependency, which is why it is stored in its own field rather than in `depends-on`.\n- **2026-08-06 — first refereed, `FAIL` at [r1](critiques/r1.html) on a `FATAL`: the abstraction dropped the hypothesis its own instance has.** `/prove Q1-L2-L3-z1`; the write-up is [proof.md](proof.html), 969/1500 words. No assumed dependency was used: `depends-on` is empty.\n\n  **The defect.** Clause 1 asserts that $S$ is a **small set**, and hypothesis **(A)** supplies only that $\\mathcal{A}^{\\omega}$ is *essentially* small — strictly weaker, since for $\\mathcal{A}=\\mathrm{Vect}$ the category $\\mathrm{Perf}_k$ has countably many equivalence classes and a non-small collection of objects. The instance this node was abstracted from, [Q1-L2-L3](../index.html), earns literal smallness honestly, because $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is a genuinely small category; the abstraction kept the conclusion and lost the reason. The draft substituted a small skeleton $S_0\\subseteq S$ and disclosed the substitution in a caveat, which is the honest move and is not a proof of the clause as written.\n\n  **Not refuted, and the referee said why.** Exhibiting falsity needs one admitted triple where $S$ is *demonstrably* non-small, and that turns on the object-function of a chosen model of the action bifunctor, which no declared entry pins down. The doubt is recorded as `FATAL` instead. The repair is `/update`'s and the referee named three routes: strengthen **(A)** to \"$\\mathcal{A}^{\\omega}$ is small\", build $S$ from a small $\\mathcal{A}_0$, or ratify the weak reading repository-wide in [context](../../../../../context.html).\n\n  **A second `MAJOR`, with a counterexample attached.** Clause 3's phrase \"as a set of generators of $\\mathcal{M}$\" is ambiguous, and its strong reading is false: $\\mathcal{A}=\\mathrm{Vect}$, $\\mathcal{M}=\\mathrm{Vect}\\times\\mathrm{Vect}$, $m_0=(k,0)$ satisfies (A)–(C) while $\\langle S\\rangle_{\\mathcal{M}}=\\mathrm{Vect}\\times 0\\neq\\mathcal{M}$. The weak reading — that $S$ satisfies hypotheses **(B)** and **(C)** of [Q1-L2-z1](../../Q1-L2-z1/index.html), without asserting that it generates — is available and is what the draft takes, so the verdict is `FAIL` rather than `REFUTED`; the counterexample is on record so that `/update` can price the ambiguity rather than rediscover it. A third `MAJOR` notes that the skeleton repair rescues the pipeline and not clause 3, since passing from $S$ to $S_0$ deletes members rather than replacing them by equivalents, and shift-stability of $S_0$ is proved nowhere.\n\n  **Raised against the appendix rather than the draft.** [module categories over a monoidal category](../../../../../appendix/conv-module-categories.html) attributes its shift display to main.tex:589–602, and those lines carry no shift display at all — the display is the entry's own addition, disclosed only in a `note:`, and the entry's stated reason justifies the first of its two equivalences while this write-up's Step 6 uses the second.\n\n  **One hypothesis is never consumed.** Compact generation of $\\mathcal{M}$ — the $\\mathcal{M}$-half of **(A)** — enters no step of clauses 1–3. The referee judged this *not* a substantive defect: it is exactly hypothesis (A) of [Q1-L2-z1](../../Q1-L2-z1/index.html), and carrying it is what makes clause 3's package pluggable. The clean fix is to widen clause 3 to name (A), (B) and (C).\n\n- **2026-08-07 — the smallness the instance actually has is put back, and an ambiguous phrase is decided.** `/update Q1-L2-L3-z1`, at the user's direction, as part of clearing the red layer. The record is [u1](updates/u1.html); the lead was this node's own [r1](critiques/r1.html), verdict `FAIL`, Flaw 1 at FATAL and Flaws 2–3 at MAJOR, and both of its failing cases were recomputed before anything was adopted.\n\n  **The first defect.** Clause 1 asserted that $S=\\{a\\ast m_0\\mid a\\in\\mathcal{A}^{\\omega}\\}$ is a small set, and hypothesis **(A)** supplied only that $\\mathcal{A}^{\\omega}$ is *essentially* small. The gap is real under the universe convention inherited from $\\mathrm{Pr}^{L}$: for $\\mathcal{A}=\\mathrm{Vect}$ the category $\\mathcal{A}^{\\omega}=\\mathrm{Perf}_k$ has countably many equivalence classes and a non-small collection of objects, so $S$ is the image of a non-small collection and nothing made it small.\n\n  **Why the repair is a strengthening and not a weakening.** [Q1-L2-L3](../index.html), which this node abstracts and which is `proved` and `human: approved`, earns smallness literally at its Step 2 — $\\mathcal{H}_{c,K}$ is small, so its objects form a small set, and the image of a small set under a function is small. The abstraction had recorded only the essential smallness that compact generation gives, and so abstracted away the very fact its instance was using. Hypothesis **(A)** now carries \"the objects of $\\mathcal{A}^{\\omega}$ form a small set, not merely an essentially small collection\", which costs the intended instance nothing.\n\n  **The second defect.** Clause 3's trailing phrase \"as a set of generators of $\\mathcal{M}$\" had two readings, and the strong one is false: with $\\mathcal{A}=\\mathrm{Vect}$, $\\mathcal{M}=\\mathrm{Vect}\\times\\mathrm{Vect}$ under the diagonal action and $m_0=(k,0)$, every hypothesis holds while $\\langle S\\rangle_{\\mathcal{M}}=\\mathrm{Vect}\\times 0$ and $(0,k)\\neq 0$ is invisible to every $\\operatorname{Map}_{\\mathcal{M}}(s[n],-)$. The phrase is replaced by \"taken there with $\\mathcal{C}:=\\mathcal{M}$\", and a new Scope paragraph states outright what the clause does not assert, keeping the failing case where a reader meets it.\n\n  **The third flaw needed no statement change.** [r1](critiques/r1.html) Flaw 2 was about the draft's Caveat 1, which proposed replacing $S$ by a small $S_0$ meeting every equivalence class and justified it by an invariance that does not apply, since passing to $S_0$ deletes members rather than replacing them by equivalent ones. Once $S$ is genuinely small there is no $S_0$, no deletion, and no second shift-stability obligation: the repair dissolves the flaw rather than answering it.\n\n  **Rejected: ratifying the up-to-equivalence reading of \"small set\" in [context.md](../../../../../context.html).** A ratified reading is inherited by every node in the repository, and this one would silently reinterpret hypothesis **(B)** of [Q1-L2-z1](../../Q1-L2-z1/index.html) and clause 1 of the approved [Q1-L2-L3](../index.html), neither written under it.\n";</script>
