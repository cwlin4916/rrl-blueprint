<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-L3-z1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L3-z1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-L3-z1 — The orbit of one compact under a compact-preserving action is a shift-stable set of compacts\n\n[node](index.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html) · [DAG index](../../../../../dag.html)\n\n- **uses:** [module categories over a monoidal category](../../../../../appendix/conv-module-categories.html), [`DGCat`, `Vect`](../../../../../appendix/conv-dgcat.html), [compact objects](../../../../../appendix/def-compact-objects.html), [compact generation](../../../../../appendix/def-compactly-generated-category.html). `depends-on` is empty, so no node supplies a fact; clause 3 makes the proof read the *hypotheses* **(B)**, **(C)** of the sibling [Q1-L2-z1](../../Q1-L2-z1/index.html) at $\\mathcal{C}:=\\mathcal{M}$, never its conclusion.\n- **notation:** $\\mathcal{C}^{\\omega}\\subset\\mathcal{C}$ is the full subcategory of compacts of [compact objects](../../../../../appendix/def-compact-objects.html), $[n]$ is the $n$-fold shift of whichever of $\\mathcal{A}$, $\\mathcal{M}$ the shifted object lies in, and $\\mathrm{Ob}(\\mathcal{D})$ is the objects of $\\mathcal{D}$.\n\n## Lemma\n\nLet $\\mathcal{A}$ be a monoidal category and let $\\mathcal{M}$ be a left $\\mathcal{A}$-module in $\\mathrm{DGCat}$, both in the sense of [module categories over a monoidal category](../../../../../appendix/conv-module-categories.html), with the action written $a\\ast m$. Assume:\n\n**(A) Both sides are compactly generated, and the compacts of $\\mathcal{A}$ form a small set.** $\\mathcal{A}$ and $\\mathcal{M}$ are compactly generated in the sense of [compact generation](../../../../../appendix/def-compactly-generated-category.html), so that $\\mathcal{A}^{\\omega}$ and $\\mathcal{M}^{\\omega}$ are essentially small; moreover the objects of $\\mathcal{A}^{\\omega}$ form a small set, not merely an essentially small collection.\n\n**(B) The action preserves compactness.** For every $a\\in\\mathcal{A}^{\\omega}$ the functor $a\\ast(-)\\colon\\mathcal{M}\\rightarrow\\mathcal{M}$ carries $\\mathcal{M}^{\\omega}$ into $\\mathcal{M}^{\\omega}$.\n\n**(C) A compact basepoint.** A fixed object $m_0\\in\\mathcal{M}^{\\omega}$ is given.\n\nThen the Hecke-type family\n\n$$\nS \\ :=\\ \\left\\{\\, a\\ast m_0 \\ \\middle|\\ a\\in\\mathcal{A}^{\\omega} \\,\\right\\}\n$$\n\nsatisfies:\n\n1. *(small and compact)* $S$ is a small set and $S\\subset\\mathcal{M}^{\\omega}$;\n\n2. *(shift-stable)* for every $s\\in S$ and every $n\\in\\mathbb{Z}$ there is $s'\\in S$ with\n\n   $$\n   s' \\ \\simeq_{\\mathcal{M}}\\ s[n];\n   $$\n\n3. *(hypotheses discharged)* consequently $S$ satisfies hypotheses **(B)** and **(C)** of [Q1-L2-z1](../../Q1-L2-z1/index.html), taken there with $\\mathcal{C}:=\\mathcal{M}$.\n\n## Proof\n\n**Step 1 — $\\mathcal{A}$ and $\\mathcal{M}$ are objects of $\\mathrm{DGCat}$.**\n\n<details><summary>the argument</summary>\n\nBy [module categories over a monoidal category](../../../../../appendix/conv-module-categories.html) a monoidal category is an algebra object of $\\mathrm{DGCat}$ and a left $\\mathcal{A}$-module is an object of $\\mathrm{LMod}_{\\mathcal{A}}$, the left $\\mathcal{A}$-module objects in $\\mathrm{DGCat}$. The Lemma puts $\\mathcal{A}$ and $\\mathcal{M}$ in those two positions, and the underlying category of an algebra or of a module object lies in $\\mathrm{DGCat}$.\n\n</details>\n\n**Step 2 — $\\mathcal{A}$ and $\\mathcal{M}$ are stable categories.**\n\n<details><summary>the argument</summary>\n\nBy [`DGCat`, `Vect`](../../../../../appendix/conv-dgcat.html), $\\mathrm{DGCat}=\\mathrm{LMod}_{\\mathrm{Vect}}(\\mathrm{Pr}^{L})$ with $\\mathrm{Vect}=\\mathrm{LMod}_{k}\\in\\mathrm{CAlg}(\\mathrm{Pr}^{L})$, and Step 1 places both categories there. Restriction along the unit map $\\mathrm{Sp}\\rightarrow\\mathrm{Vect}$ of $\\mathrm{CAlg}(\\mathrm{Pr}^{L})$ lands each of them in $\\mathrm{LMod}_{\\mathrm{Sp}}(\\mathrm{Pr}^{L})$, whose forgetful functor to $\\mathrm{Pr}^{L}$ is fully faithful with image the stable presentable categories.\n\n</details>\n\n**Step 3 — $[n]\\colon\\mathcal{A}\\rightarrow\\mathcal{A}$ is an equivalence with inverse $[-n]$.**\n\n<details><summary>the argument</summary>\n\nIn a stable category the suspension $[1]$ is an equivalence with inverse $[-1]$, and $[n]$ is an $|n|$-fold composite of one of the two. Step 2 makes $\\mathcal{A}$ stable.\n\n</details>\n\n**Step 4 — $\\mathcal{A}^{\\omega}$ is shift-stable: $a\\in\\mathcal{A}^{\\omega}$ and $n\\in\\mathbb{Z}$ give $a[n]\\in\\mathcal{A}^{\\omega}$.**\n\n<details><summary>the argument</summary>\n\nApplying the equivalence $[-n]$ of Step 3 to both arguments gives, naturally in $x\\in\\mathcal{A}$,\n\n$$\n\\operatorname{Map}_{\\mathcal{A}}(a[n],x)\\ \\simeq_{\\mathrm{Ani}}\\ \\operatorname{Map}_{\\mathcal{A}}(a,x[-n]).\n$$\n\nBeing an equivalence, $[-n]$ preserves filtered colimits, so the right-hand functor of $x$ preserves them whenever $\\operatorname{Map}_{\\mathcal{A}}(a,-)$ does. That is the criterion of [compact objects](../../../../../appendix/def-compact-objects.html) read in $\\mathcal{A}$.\n\n</details>\n\n**Step 5 — clause 1, smallness: $S$ is a small set.**\n\n<details><summary>the argument</summary>\n\nThe action of [module categories over a monoidal category](../../../../../appendix/conv-module-categories.html) is a bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$; fixing its second variable at the basepoint $m_{0}$ of hypothesis **(C)** gives a functor\n\n$$\n(-)\\ast m_{0}\\colon\\mathcal{A}\\longrightarrow\\mathcal{M}.\n$$\n\nThe display defining $S$ exhibits it as the image of $\\mathrm{Ob}(\\mathcal{A}^{\\omega})$ under the object-function of that functor. Hypothesis **(A)** says $\\mathrm{Ob}(\\mathcal{A}^{\\omega})$ is a small set, and the image of a small set under a function is a small set.\n\n</details>\n\n**Step 6 — clause 1, compactness: $S\\subset\\mathcal{M}^{\\omega}$.**\n\n<details><summary>the argument</summary>\n\nLet $s\\in S$ and choose $a\\in\\mathcal{A}^{\\omega}$ with $s=a\\ast m_{0}$. Hypothesis **(C)** gives $m_{0}\\in\\mathcal{M}^{\\omega}$, and hypothesis **(B)** at this $a$ carries $\\mathcal{M}^{\\omega}$ into $\\mathcal{M}^{\\omega}$, so $s\\in\\mathcal{M}^{\\omega}$.\n\n</details>\n\n**Step 7 — clause 2.**\n\n<details><summary>the argument</summary>\n\nFix $s\\in S$, choose $a\\in\\mathcal{A}^{\\omega}$ with $s=a\\ast m_{0}$, fix $n\\in\\mathbb{Z}$, and put\n\n$$\ns'\\ :=\\ (a[n])\\ast m_{0}.\n$$\n\nThen $a[n]\\in\\mathcal{A}^{\\omega}$ by Step 4, so $s'\\in S$. The *second* equivalence of the shift display of [module categories over a monoidal category](../../../../../appendix/conv-module-categories.html), which that entry records as $k$-linearity of the action bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$, reads at $m=m_{0}$ as $(a\\ast m_{0})[n]\\simeq_{\\mathcal{M}}(a[n])\\ast m_{0}$, that is $s'\\simeq_{\\mathcal{M}}s[n]$. Its first equivalence, which moves the shift onto $m$, is not needed: the basepoint is fixed.\n\n</details>\n\n**Step 8 — the substitution $\\mathcal{C}:=\\mathcal{M}$ into [Q1-L2-z1](../../Q1-L2-z1/index.html) is admissible.**\n\n<details><summary>the argument</summary>\n\nThat statement quantifies over a stable category $\\mathcal{C}$ and a set $S$ of objects of $\\mathcal{C}$. Step 2 makes $\\mathcal{M}$ stable and Steps 5–6 make $S$ such a set; the $[n]$ there is the shift of $\\mathcal{M}$ used in Step 7.\n\n</details>\n\n**Step 9 — hypothesis (B) of [Q1-L2-z1](../../Q1-L2-z1/index.html) holds for $S$.**\n\n<details><summary>the argument</summary>\n\nRead at $\\mathcal{C}=\\mathcal{M}$, it is the conjunction of \"$S$ is a small set\" and \"$S\\subset\\mathcal{M}^{\\omega}$\", the compacts there being those of [compact objects](../../../../../appendix/def-compact-objects.html) and hence the same subcategory as in clause 1. Step 5 gives the first conjunct and Step 6 the second.\n\n</details>\n\n**Step 10 — hypothesis (C) of [Q1-L2-z1](../../Q1-L2-z1/index.html) holds for $S$, which with Step 9 is clause 3.**\n\n<details><summary>the argument</summary>\n\nRead at $\\mathcal{C}=\\mathcal{M}$, it is: for every $s\\in S$ and every $n\\in\\mathbb{Z}$ there is $s'\\in S$ with $s'\\simeq_{\\mathcal{M}}s[n]$. That is clause 2 with the same quantifier order $\\forall s$, $\\forall n$, $\\exists s'$, the same ranges $S$ and $\\mathbb{Z}$, and the same ambient $\\mathcal{M}$ on the equivalence; Step 7 proves it. $\\blacksquare$\n\nNo assumed dependency was used: `depends-on` is empty, and no conclusion of any node enters the argument.\n\n</details>\n\n## Caveats\n\n**Clause 3 discharges hypotheses only.** It says that $S$ is admissible input to [Q1-L2-z1](../../Q1-L2-z1/index.html) at $\\mathcal{C}=\\mathcal{M}$ and asserts none of that node's equivalent conditions (1)–(3); the failing case in this node's own Scope shows what a stronger reading would cost.\n\n**Only the last clause of (A) is consumed.** Smallness of $\\mathrm{Ob}(\\mathcal{A}^{\\omega})$ is used once, at Step 5, and compact generation — of $\\mathcal{A}$ or of $\\mathcal{M}$ — enters no step. The $\\mathcal{M}$-half is hypothesis (A) of [Q1-L2-z1](../../Q1-L2-z1/index.html), which clause 3 does not assert; carrying it is what makes this node's output a complete input there.\n\n## References\n\n- [[HA, Prop. 4.8.2.18](../../../../../../papers/HA.pdf)], orientation only — $\\mathrm{Mod}_{\\mathrm{Sp}}(\\mathrm{Pr}^{L})\\rightarrow\\mathrm{Pr}^{L}$ is fully faithful with image the stable presentable categories. Behind Step 2, whose $\\mathrm{LMod}_{\\mathrm{Sp}}(\\mathrm{Pr}^{L})$ is the same, $\\mathrm{Sp}$ being $\\mathbb{E}_{\\infty}$.\n";</script>
