<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L2</a><i>›</i><a href="../../index.html">Q1-L2-L3</a><i>›</i><a href="../index.html">Q1-L2-L3-z1</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u1 — the smallness the instance actually has is put back, and an ambiguous phrase is decided</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L2/Q1-L2-L3/Q1-L2-L3-z1/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L2-L3-z1](../index.html) · [history](../history.html) · [DAG index](../../../../../../dag.html) · [appendix](../../../../../../appendix/index.html)\n\nRun: `/update Q1-L2-L3-z1`, at the user's direction, as part of clearing the red layer of the\nDAG. The lead was this node's own [r1 critique](../critiques/r1.html), verdict `VERDICT: FAIL`,\nFlaw 1 at FATAL and Flaws 2–3 at MAJOR. No external passage was supplied; the record on disk\nis the input, and both of its failing cases were recomputed rather than adopted.\n\n## The defect, in two sentences\n\nClause 1 asserts that $S=\\{a\\ast m_0\\mid a\\in\\mathcal{A}^{\\omega}\\}$ is a **small set**, and\nhypothesis **(A)** supplies only that $\\mathcal{A}^{\\omega}$ is *essentially* small, which is\nstrictly weaker and does not make the image small. Separately, clause 3's trailing phrase\n\"as a set of generators of $\\mathcal{M}$\" has a reading under which it is false.\n\n## What was verified, refuted, left unverified\n\n**Verified — the gap between small and essentially small is real here, not a scruple.** Under\nthe universe convention [`DGCat`, `Vect`](../../../../../../appendix/conv-dgcat.html)\ninherits from $\\mathrm{Pr}^{L}$, take $\\mathcal{A}=\\mathrm{Vect}$: then\n$\\mathcal{A}^{\\omega}=\\mathrm{Perf}_k$ has countably many equivalence classes and a non-small\ncollection of objects. So $S$ is the image of a non-small collection under the object-function\nof $(-)\\ast m_0$, and nothing in **(A)**–**(C)** makes that image small.\n\n**Verified — the abstraction dropped a hypothesis the instance has outright.** This is the\ncrisp diagnosis and the reason the repair is a strengthening rather than a weakening. In\n[Q1-L2-L3](../../index.html), Step 2 of its proof earns smallness literally:\n\"$\\mathcal{H}_{c,K}$ is small, so its objects form a small set. $S$ is the image of that set\nunder $\\mathcal{F}\\mapsto\\mathcal{F}\\ast\\mathrm{IC}_0$ … and the image of a small set under a\nfunction is small.\" That node is `proved` and `human: approved`. The $z$-node abstracting it\nrecorded only the essential smallness that compact generation gives, and so abstracted away\nthe very fact its instance was using.\n\n**Verified — the strong reading of clause 3 is false, by a failing case recomputed here.**\nTake $\\mathcal{A}=\\mathrm{Vect}$, $\\mathcal{M}=\\mathrm{Vect}\\times\\mathrm{Vect}$ with the\ndiagonal action, $m_0=(k,0)$. Then $\\mathcal{M}$ is compactly generated with\n$\\mathcal{M}^{\\omega}=\\mathrm{Perf}_k\\times\\mathrm{Perf}_k$, so **(A)** holds; $a\\ast(-)$ acts\ncomponentwise and preserves compacts, so **(B)** holds; $m_0$ is compact, so **(C)** holds.\nBut $S\\subseteq\\mathrm{Vect}\\times 0$, so $\\langle S\\rangle_{\\mathcal{M}}=\\mathrm{Vect}\\times\n0\\neq\\mathcal{M}$, and $(0,k)\\neq 0$ is invisible to every\n$\\operatorname{Map}_{\\mathcal{M}}(s[n],-)$. Every hypothesis holds and $S$ does not generate.\n\n**Not a statement defect — Flaw 2.** It is about the draft's Caveat 1, which proposed\nreplacing $S$ by a small $S_0$ meeting every equivalence class and gave a reason (\"invariance\nunder replacing a member by an equivalent object\") that is true and irrelevant, since passing\nto $S_0$ deletes members rather than replacing them. The repair below dissolves it: once $S$\nis genuinely small there is no $S_0$, no deletion, and nothing to show shift-stable a second\ntime.\n\n## The old hypotheses and clauses, verbatim\n\n> **(A) Both sides are compactly generated.** $\\mathcal{A}$ and $\\mathcal{M}$ are compactly\n> generated in the sense of `def:compactly_generated_category`, so that $\\mathcal{A}^{\\omega}$\n> and $\\mathcal{M}^{\\omega}$ are essentially small.\n>\n> 1. *(small and compact)* $S$ is a small set and $S\\subset\\mathcal{M}^{\\omega}$;\n>\n> 3. *(hypotheses discharged)* consequently $S$ satisfies hypotheses **(B)** and **(C)** of\n>    Q1-L2-z1 **as a set of generators of $\\mathcal{M}$**.\n\n## The new statement\n\nTwo changes.\n\n1. **Hypothesis (A) carries the literal smallness.** It now reads \"…and the compact objects of\n   $\\mathcal{A}$ form a small set — not merely an essentially small collection\", which is what\n   [Q1-L2-L3](../../index.html) has and uses. Clause 1 then follows as the instance's own\n   Step 2 has it: the image of a small set under a function is small.\n2. **Clause 3 names the role instead of gesturing at it.** The phrase \"as a set of generators\n   of $\\mathcal{M}$\" is deleted in favour of \"with $\\mathcal{C}:=\\mathcal{M}$\", and the Scope\n   paragraph now says outright what the clause does not assert, with the failing case above\n   naming what would go wrong if it did.\n\n## Considered and not adopted\n\n**Ratifying \"small set $=$ essentially small collection\" in\n[context.md](../../../../../../context.html)**, the third option [r1](../critiques/r1.html)\noffers. Rejected, and it is the option worth explaining: a ratified reading is inherited by\n*every* node in the repository, and this one would silently reinterpret hypothesis **(B)** of\n[Q1-L2-z1](../../../Q1-L2-z1/index.html) and clause 1 of the `human: approved`\n[Q1-L2-L3](../../index.html), neither of which was written under it. Paying a\nrepository-wide reading to spare one node a hypothesis its own instance already satisfies is\nthe wrong trade.\n\n**Defining $S$ from a small $\\mathcal{A}_0\\subset\\mathcal{A}^{\\omega}$ meeting every\nequivalence class**, the second option. Rejected as a strictly worse version of the first:\nit complicates the *conclusion* — every downstream use would carry $\\mathcal{A}_0$ and owe the\nshift-stability argument for it that [r1](../critiques/r1.html) Flaw 2 shows the draft never\ngave — in order to avoid strengthening a hypothesis that costs the intended instance nothing.\nPut the cost where it is already paid.\n\n**Weakening clause 3 to name $S_0$.** Rejected for the same reason, and because clause 3's job\nis to hand [Q1-L2-z1](../../../Q1-L2-z1/index.html) an object satisfying both its\n**(B)** and its **(C)**; as [r1](../critiques/r1.html) Flaw 2 observes, the old draft delivered\nno such object at all — $S$ satisfied (C) and not demonstrably (B), $S_0$ satisfied (B) and was\nnever shown to satisfy (C). One small shift-stable $S$ discharges both.\n";</script>
