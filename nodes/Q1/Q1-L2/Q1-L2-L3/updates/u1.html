<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L2</a><i>›</i><a href="../index.html">Q1-L2-L3</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L3 — update u1 (2026-08-05)</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L2/Q1-L2-L3/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [history](../history.html) · [r1](../critiques/r1.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html)\n\n**Date:** 2026-08-05 · **Operator:** `/update Q1-L2-L3`, at the user's direction: *this statement just looks abstractly and formally true; simplify the proof into three concise paragraphs.* · **Status before → after:** `proved` → `open` → `proved` (re-proved in the same run at [r2](../critiques/r2.html)).\n\n## §2 — Verifying the input\n\nThe input is a reading, not a passage from a source, so verifying it means re-deriving each clause from the closed world and asking at each step whether anything geometric enters.\n\n**Verified.** The reading is correct, and sharper than it was offered. Clause 1's smallness is the image of a set under a function, once [Q1-L2-L1](../../Q1-L2-L1/index.html) makes $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ small. Clause 2 is the last display of [module categories](../../../../../appendix/conv-module-categories.html) read at $a=\\mathcal{F}$, $m=\\mathrm{IC}_0$ — one citation, not an argument. Clause 3 is the essential-image identification of [Q1-L2-L1](../../Q1-L2-L1/index.html) at $\\mathcal{Y}=K\\backslash LX$ applied to objects already known to lie in $\\mathcal{D}_c(K\\backslash LX)$. Nothing in any of the three needs a geometric fact.\n\n**Refuted.** Nothing. No clause of the old statement was false.\n\n**Unverified — and this is the exception the input did not see.** One step is *not* formal: the membership\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nwhich asserts that a $!$-extension is coherent. That is a genuine finiteness statement about $K\\backslash LX$, and the old proof obtained it by a typing argument from the grammar of a pair of appendix entries — the defect [r1](../critiques/r1.html) raised as Flaw 1 and the draft itself disclosed under Caveats. It is not re-derived here either; it is now **ratified explicitly** in the [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) entry, on the manuscript's own presupposition at main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action. So the node is formal, resting on one imported membership that the appendix now states rather than implies.\n\n## §4 — The defect\n\nThe old clause 2 asserted that $\\{s[n]\\mid s\\in S,\\ n\\in\\mathbb{Z}\\}$ and $S$ \"have the same objects up to equivalence in $\\mathcal{C}$\", which is *not* the hypothesis either consumer takes: [Q1-L2-L2](../../Q1-L2-L2/index.html) asks only for a small set of compacts, and [Q1-L2-L4](../../Q1-L2-L4/index.html) asks, verbatim, that for all $s\\in S$ and $n\\in\\mathbb{Z}$ there be $s'\\in S$ with $s'\\simeq_{\\mathcal{C}}s[n]$. Proving the stronger, differently-shaped proposition cost the draft two steps — a separate argument that $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is shift-closed, and a transport of the whole family along $\\iota$ — whose conclusion no downstream node reads.\n\nA second, smaller defect: clause 1 placed $S$ in $\\mathcal{D}_c(K\\backslash LX)$ and clause 3 placed it in $\\mathcal{C}^{\\omega}$, which under [Q1-L2-L1](../../Q1-L2-L1/index.html) are the same subcategory. The node stated one membership twice and proved it twice.\n\n## Old `## Statement`, verbatim\n\n> Write $\\mathcal{C} := \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and let\n>\n> $$\n> S := \\left\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\}\n> $$\n>\n> be the Hecke family generating [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html). Then:\n>\n> 1. $S$ is a small set of objects of $\\mathcal{D}_c(K\\backslash LX)$;\n> 2. $S$ is stable under cohomological shift: for every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and every $n\\in\\mathbb{Z}$ one has $\\mathcal{F}[n]\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and\n>\n>    $$\n>    \\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n]\\ \\simeq_{\\mathcal{D}_c(K\\backslash LX)}\\ \\left(\\mathcal{F}[n]\\right)\\ast\\mathrm{IC}_0 ,\n>    $$\n>\n>    so that $\\{s[n]\\mid s\\in S,\\ n\\in\\mathbb{Z}\\}$ and $S$ have the same objects up to equivalence in $\\mathcal{C}$;\n> 3. $S\\subset\\mathcal{C}^{\\omega}$: every element of $S$ is a compact object of $\\mathcal{C}$.\n\n## New `## Statement`\n\nTwo clauses, each written in the words its consumer uses, and the membership stated once. The full text is in [`Q1-L2-L3_node.md`](../index.html); in outline:\n\n> … Then $S$ is a **small set of compact objects of $\\mathcal{C}$, stable under shifts**:\n>\n> 1. $S$ is a small set and $S\\subset\\mathcal{D}_c(K\\backslash LX) =_{\\mathcal{C}} \\mathcal{C}^{\\omega}$;\n> 2. for every $s\\in S$ and every $n\\in\\mathbb{Z}$ there is $s'\\in S$ with $s'\\simeq_{\\mathcal{C}} s[n]$.\n\nNothing is lost. The old clause 2's \"same objects up to equivalence\" is the immediate consequence of the new clause 2 together with $s = s[0]$, and no node ever invoked it; the old clause 2's display survives inside the proof as the one line that produces $s'$.\n\n## Considered and not adopted\n\n- **Retiring the node into [Q1-L2](../../index.html)'s proof.** Now that it is three paragraphs, Q1-L2-L3 could be a step of its parent. Rejected: Q1-L2 is already at 836 of 900 words, and the node is the only place the geometric import above is isolated and named. A hypothesis check that carries the argument's one non-formal ingredient earns its own page.\n- **Dropping smallness.** [Q1-L2-L2](../../Q1-L2-L2/index.html) and [Q1-L2-L4](../../Q1-L2-L4/index.html) both write \"small set\", so the clause stays even though nothing in this setting threatens it.\n- **Proving $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$ geometrically.** Coherence of the $!$-extension over $K\\backslash LX$ is a real theorem about loop spaces and is not in the closed world. Ratifying the manuscript's presupposition is the honest move; deriving it is a node nobody has commissioned, and §6 of this run records why it was not.\n\n## Appendix corrections this update forced\n\nThree, all cite-by-line or ratification, none changing a statement:\n\n1. [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) now states the membership $\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX)$ explicitly, with main.tex:79–80 as its source — [r1](../critiques/r1.html) Flaw 1(a).\n2. [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html)'s line citation read main.tex:81, 954; 81 is a comment line and the content is at 79–80, and the pointing condition is at 952–953.\n3. [the spherical Hecke action $\\ast$](../../../../../appendix/conv-hecke-action.html) cited its quoted phrase as main.tex:924; the phrase is at main.tex:922 — [r1](../critiques/r1.html) Flaw 3, verified by opening the file.\n\n[r1](../critiques/r1.html) Flaw 2 — Step 4 naming $\\mathrm{Cat}^{\\mathrm{perf}}$'s membership condition without that entry being declared — is disposed of by the rewrite, which takes the second remedy the critic offered and says only that both categories are small, stable and idempotent-complete, as [module categories](../../../../../appendix/conv-module-categories.html) requires of its small ambient.\n\n## Corrected within the same run, after [r2](../critiques/r2.html)\n\nThe first draft of this revision closed the statement with a sentence naming its two\nconsumers — \"These two clauses are, verbatim, the hypotheses Q1-L2-L2 and Q1-L2-L4 place\non a generating family\" — and the write-up's Step 1 named them too. Both were wrong, in two\nways at once, and `tests/run_tests.py` caught what [r2](../critiques/r2.html) did not:\n\n1. **A closed-world violation.** Neither node is in this one's `depends-on:`, so neither\n   may be cited by its proof. `test_operations.test_L2_drafts_cite_only_the_closed_world`\n   failed on exactly those two names.\n2. **A statement/lemma mismatch.** The sentence sat in `## Statement` but not in the\n   write-up's `## Lemma` block, so the two were no longer verbatim identical — which\n   r2's opening paragraph asserts it compared and found identical. That assertion was\n   false when it was written.\n\nBoth are repaired: the sentence is gone from the statement, and Step 1 makes the same point\nwithout naming a node. The observation itself is true and worth keeping, so it lives in the\n[history](../history.html) instead, which is where commentary about *why* a statement\nhas its shape belongs.\n\n[r2](../critiques/r2.html) is left standing, unedited, as the append-only record requires.\nThat it passed a draft containing a closed-world violation is the substantive argument\nagainst the arrangement its own header discloses: a self-review by the operator that wrote\nthe draft is not a referee round, and what should follow is an independent r3.\n";</script>
