–[Q1-L2-L4](Q1-L2-L4/index.html), the statement frozen by the expansion. The split is honest about where the content sits: (1) ⟺ (2) needs L1 + L2, and (2) ⟺ (3) is L4, which had to reconcile the $n\\in\\mathbb{Z}$ of clause (3) with the $i\\ge 0$ of the GR17 clause quoted in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) — a discrepancy sitting in plain sight until the decomposition confronted it.\n- **2026-08-04 — proved** in one round ([r1](critiques/r1.html)) as the assembly node, once all four sub-lemmas had landed: every hypothesis of the two abstract lemmas discharged verbatim from the sub-lemmas' statements, and the referee verified the one omission from the uses line as legitimate rather than symptomatic.\n- **2026-08-05 — examined and unchanged** by `/update Q1-L2-L3`, as the neighbour whose statement cites the revised one. The Decomposition paragraph describes [Q1-L2-L3](Q1-L2-L3/index.html) as checking \"that $S$ is a small, shift-stable set of compact objects of $\\mathcal{C}$\" — which is now that node's statement almost word for word rather than a summary of three clauses, so no edit was owed here. Statement, proof and status untouched.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): a statement purely about compact generation in a stable category; the run's corrections are about group schemes and do not reach it. Its five dependencies were re-read and the equivalence (1)$\\Leftrightarrow$(2)$\\Leftrightarrow$(3) still assembles from them exactly as the `## Decomposition` says.\n- **2026-08-05 — notation unified, no claim changed** by `/update Q1`. The `## Decomposition` coined $\\mathcal{A} := \\langle S\\rangle_{\\mathcal{C}}$ for the object the appendix now calls $\\mathcal{A}_X$ ([the Satake subcategories](../../../appendix/def-satake-subcategory.html)) — one object under two names across Q1 and Q2. It now uses $\\mathcal{A}_X$ and links the entry. The `## Statement` writes
