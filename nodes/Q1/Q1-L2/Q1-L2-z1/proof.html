<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-z1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-z1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-z1 — Generation, saturation and detection agree for a shift-stable set of compacts\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), [compact objects](../../../../appendix/def-compact-objects.html), [compact generation](../../../../appendix/def-compactly-generated-category.html), [detecting compact generation](../../../../appendix/p-compact-generation-stable-case.html). No `depends-on` node: this is a ready leaf.\n- **notation:** $\\operatorname{Map}_{\\mathcal{C}}(-,-)$ is the anima-valued mapping functor of [compact objects](../../../../appendix/def-compact-objects.html), $0$ denotes its contractible object as in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), and $[n]$ is the shift of the stable category $\\mathcal{C}$, so $[-1]$ is the loop functor $\\Omega$.\n\n## Lemma\n\nLet $\\mathcal{C}$ be a stable category and let $S$ be a set of objects of $\\mathcal{C}$. Write $\\mathcal{C}^{\\omega}$ for the compact objects of [compact objects](../../../../appendix/def-compact-objects.html) and $\\langle S\\rangle_{\\mathcal{C}}$ for the subcategory generated in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html). Assume:\n\n**(A) Compact generation.** $\\mathcal{C}$ admits all small colimits and is compactly generated in the sense of [compact generation](../../../../appendix/def-compactly-generated-category.html).\n\n**(B) The generators are a small set of compacts.** $S$ is a small set and $S\\subset\\mathcal{C}^{\\omega}$.\n\n**(C) Shift stability.** For every $s\\in S$ and every $n\\in\\mathbb{Z}$ there is $s'\\in S$ with $s'\\simeq_{\\mathcal{C}} s[n]$.\n\nThen the following are equivalent:\n\n1. *(saturation on the compacts)*\n\n   $$\n   \\mathcal{C}^{\\omega} \\ =_{\\mathcal{C}}\\ \\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}};\n   $$\n\n2. *(generation of the ambient category)*\n\n   $$\n   \\langle S\\rangle_{\\mathcal{C}} \\ =\\ \\mathcal{C};\n   $$\n\n3. *(detection)* for every $0\\neq M\\in\\mathcal{C}$ there exist $s\\in S$ and $n\\in\\mathbb{Z}$ with\n\n   $$\n   \\operatorname{Map}_{\\mathcal{C}}\\left(s[n], M\\right)\\ \\neq\\ 0 .\n   $$\n\nWhen they hold, $S$ compactly generates $\\mathcal{C}$ in the sense of [detecting compact generation](../../../../appendix/p-compact-generation-stable-case.html).\n\n## Proof\n\n**Step 1 — By (C), every shifted generator is equivalent in $\\mathcal{C}$ to an unshifted one.**\n\n<details><summary>the argument</summary>\n\nWrite\n\n$$\nS^{\\mathbb{Z}} \\ :=\\ \\{\\ s[n]\\ :\\ s\\in S,\\ n\\in\\mathbb{Z}\\ \\}\n$$\n\nfor the collection of shifted generators. Given $s\\in S$ and $n\\in\\mathbb{Z}$, hypothesis (C) supplies $s'\\in S$ with $s'\\simeq_{\\mathcal{C}}s[n]$. Hence every object of $S^{\\mathbb{Z}}$ is equivalent in $\\mathcal{C}$ to an object of $S$; conversely $S\\subset S^{\\mathbb{Z}}$, by $n=0$.\n\n</details>\n\n**Step 2 — For a fixed object, testing against $\\{s[-i]\\}_{i\\ge0}$ and against $S^{\\mathbb{Z}}$ are the same condition.**\n\n<details><summary>the argument</summary>\n\nFor $M\\in\\mathcal{C}$,\n\n$$\n\\Big(\\operatorname{Map}_{\\mathcal{C}}(s[-i],M)=0\\ \\ \\forall s\\in S,\\ \\forall i\\ge 0\\Big)\\iff\\Big(\\operatorname{Map}_{\\mathcal{C}}(s[n],M)=0\\ \\ \\forall s\\in S,\\ \\forall n\\in\\mathbb{Z}\\Big).\n$$\n\n($\\Leftarrow$) is the restriction to $n=-i\\le0$. For ($\\Rightarrow$), fix $s\\in S$ and $n\\in\\mathbb{Z}$ and take $s'\\in S$ with $s'\\simeq_{\\mathcal{C}}s[n]$ from Step 1. The functor $\\operatorname{Map}_{\\mathcal{C}}(-,M)$ carries equivalences of $\\mathcal{C}$ to equivalences of anima, so $\\operatorname{Map}_{\\mathcal{C}}(s[n],M)\\simeq\\operatorname{Map}_{\\mathcal{C}}(s'[-0],M)$, which vanishes by the left-hand side applied to $s'$ and $i=0$.\n\n</details>\n\n**Step 3 — What [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) licenses here.**\n\n<details><summary>the argument</summary>\n\nAbbreviate by $(\\dagger)$ the implication displayed in that entry, for the collection $S$:\n\n$$\n(\\dagger)\\qquad \\Big(\\operatorname{Map}_{\\mathcal{C}}(s[-i],c)=0\\ \\ \\forall s\\in S,\\ \\forall i\\ge0\\Big)\\implies c=0 .\n$$\n\nThe entry offers $\\langle S\\rangle_{\\mathcal{C}}$ — the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing $S$ — and, \"equivalently\", $(\\dagger)$. An implication quantified over all $c\\in\\mathcal{C}$ is not a subcategory, so what the entry asserts to be equivalent to $(\\dagger)$ is that this smallest subcategory exhausts $\\mathcal{C}$: the claim licensed is $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}\\iff(\\dagger)$. This is the reading recorded in the note of [detecting compact generation](../../../../appendix/p-compact-generation-stable-case.html). It is invoked with $\\mathcal{C}$ stable and cocomplete by (A), and presentable because [compact generation](../../../../appendix/def-compactly-generated-category.html)(2) gives $\\mathcal{C}\\simeq\\mathrm{Ind}(\\mathcal{C}^{\\omega})$ with $\\mathcal{C}^{\\omega}$ small, so no side condition on the ambient is at risk.\n\n</details>\n\n**Step 4 — (2) $\\Rightarrow$ (3).**\n\n<details><summary>the argument</summary>\n\nAssume $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}$, so $(\\dagger)$ holds by Step 3, and let $0\\neq M\\in\\mathcal{C}$. If $\\operatorname{Map}_{\\mathcal{C}}(s[-i],M)$ vanished for all $s\\in S$ and all $i\\ge0$, then $(\\dagger)$ would force $M=0$. So there are $s\\in S$ and $i\\ge0$ with $\\operatorname{Map}_{\\mathcal{C}}(s[-i],M)\\neq0$, and $n:=-i\\in\\mathbb{Z}$ witnesses (3).\n\n</details>\n\n**Step 5 — (3) $\\Rightarrow$ $(\\dagger)$.**\n\n<details><summary>the argument</summary>\n\nAssume (3) and let $c\\in\\mathcal{C}$ satisfy the hypothesis of $(\\dagger)$. By Step 2, $\\operatorname{Map}_{\\mathcal{C}}(s[n],c)=0$ for all $s\\in S$ and all $n\\in\\mathbb{Z}$. Read contrapositively, (3) then gives $c=0$.\n\n</details>\n\n**Step 6 — (3) $\\Rightarrow$ (2).**\n\n<details><summary>the argument</summary>\n\nStep 5 yields $(\\dagger)$, and Step 3 converts $(\\dagger)$ into $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}$.\n\n</details>\n\n**Step 7 — (2) $\\Rightarrow$ (1).**\n\n<details><summary>the argument</summary>\n\nIf $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}$ then, as full subcategories of $\\mathcal{C}$, $\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}^{\\omega}\\cap\\mathcal{C}=_{\\mathcal{C}}\\mathcal{C}^{\\omega}$, which is (1).\n\n</details>\n\n**Step 8 — (1) $\\Rightarrow$ (2).**\n\n<details><summary>the argument</summary>\n\nAssume (1), i.e. every object of $\\mathcal{C}^{\\omega}$ lies in $\\langle S\\rangle_{\\mathcal{C}}$, and let $M\\in\\mathcal{C}$. By (A) and [compact generation](../../../../appendix/def-compactly-generated-category.html)(1) there is a small filtered $J$ and a diagram $F\\colon J\\to\\mathcal{C}$ landing in $\\mathcal{C}^{\\omega}$ with $M\\simeq_{\\mathcal{C}}\\operatorname{colim}_{j\\in J}F(j)$. Each $F(j)$ lies in $\\langle S\\rangle_{\\mathcal{C}}$ by (1). By the closing note of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), $\\langle S\\rangle_{\\mathcal{C}}$ is closed under arbitrary small colimits formed in $\\mathcal{C}$, so $M\\in\\langle S\\rangle_{\\mathcal{C}}$. The full subcategory $\\langle S\\rangle_{\\mathcal{C}}\\subset\\mathcal{C}$ thus contains every object of $\\mathcal{C}$, i.e. $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}$.\n\n</details>\n\n**Step 9 — (1), (2) and (3) are equivalent.**\n\n<details><summary>the argument</summary>\n\nSteps 8, 4, 6 and 7 give (1)$\\Rightarrow$(2), (2)$\\Rightarrow$(3), (3)$\\Rightarrow$(2) and (2)$\\Rightarrow$(1) respectively, and these four implications connect any two of the three.\n\n</details>\n\n**Step 10 — When they hold, $S$ compactly generates $\\mathcal{C}$ in the sense of [detecting compact generation](../../../../appendix/p-compact-generation-stable-case.html).**\n\n<details><summary>the argument</summary>\n\nClause (2) of that Proposition asks, of a stable $\\mathcal{C}$ admitting all small colimits, for a small set $S\\hookrightarrow\\mathcal{C}^{\\omega}$ of compact objects satisfying $(\\dagger)$. Stability is part of the present statement and cocompleteness is (A); smallness and compactness of $S$ are (B); and $(\\dagger)$ is Step 5 applied to (3), which holds by Step 9. So $S$ witnesses clause (2) of the Proposition for $\\mathcal{C}$, as claimed. $\\square$\n\nNo assumed dependency was used: the node's `depends-on` list is empty, and every step closes inside the four appendix entries named in **uses** together with standard category theory.\n\n</details>\n\n## Caveats\n\n**(C) is consumed once, at Step 1, and it is not tight.** In a stable $\\mathcal{C}$ the functor $\\operatorname{Map}_{\\mathcal{C}}(x,-)$ preserves limits and $[-1]=\\Omega$, so $\\operatorname{Map}_{\\mathcal{C}}(x[n+1],M)\\simeq\\Omega\\operatorname{Map}_{\\mathcal{C}}(x[n],M)$ and vanishing at $n$ propagates to $n+1$; Step 2 therefore holds for an arbitrary set $S$, and with it the equivalence of (1)–(3). Hypothesis (C) replaces that computation by an identification of index sets. The statement as written is sound, but (C) is not needed for it.\n\n**Step 3 is a reading of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html).** The entry's displayed criterion is a condition on $\\mathcal{C}$ rather than a construction of a subcategory, so its \"equivalently\" must be read as characterising the equality $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}$. No step uses the entry in any other way.\n\n## References\n\n- `GR17vol1`, Def. 5.4.1 and Prop. 5.4.5 — the orthogonality criterion and the closure description that [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) records, read for Step 3. Orientation only; the closed world is the **uses** line.\n";</script>
