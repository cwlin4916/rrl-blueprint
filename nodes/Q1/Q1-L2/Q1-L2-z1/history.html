$\\mathrm{Gr}$ and the Hecke action from it, leaving a compactly generated stable category and a shift-stable set of compacts; what is left is this node. The specialization that recovers [Q1-L2](../index.html) is the dictionary $\\mathcal{C} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, $\\mathcal{C}^{\\omega} = \\mathcal{D}_c(K\\backslash LX)$ — which is [Q1-L2-L1](../Q1-L2-L1/index.html) — and $S$ the Hecke family, whose hypotheses (B) and (C) are [Q1-L2-L3](../Q1-L2-L3/index.html), abstracted in turn by [Q1-L2-L3-z1](../Q1-L2-L3/Q1-L2-L3-z1/index.html).\n\n- **2026-08-06 — the edge is `instances`, not `depends-on`**: [Q1-L2](../index.html) is recorded here as an instance and not as a dependent, so nothing about it changes and this node caps no confidence. [Q1-L2](../index.html) already has a proof of its own that does not route through this node; what the edge records is that a second, shorter route exists, and that the geometry it drops was never load-bearing. Proving this node would replace [Q1-L2-L2](../Q1-L2-L2/index.html) and [Q1-L2-L4](../Q1-L2-L4/index.html) with a single citable statement, which is the payoff the abstraction layer is being tested for.\n- **2026-08-06 — proved**, `PASS` at [r1](critiques/r1.html) on the first round. `/prove Q1-L2-z1`; the write-up is [proof.md](proof.html), 977/1500 words, ten steps of one claim each. The equivalence closes acyclically as (2)⇒(3)⇒(2), (2)⇒(1), (1)⇒(2), and the closing clause is checked against [detecting compact generation](../../../../appendix/p-compact-generation-stable-case.html) one condition at a time rather than declared. No assumed dependency was used: `depends-on` is empty. Twelve `MINOR` flaws stand disposed of by the `PASS`.\n\n  **Hypothesis (C) is redundant, and the node's own Scope paragraph says the opposite.** The referee settled this independently of the prover. (C) enters once, to identify the half-line family $\\{s[-i]\\}_{i\\ge0}$ with the full-line family $\\{s[n]\\}_{n\\in\\mathbb{Z}}$ — and that identification is available without it, because $\\operatorname{Map}_{\\mathcal{C}}(x,-)$ preserves limits and $[-1]$ is the loop functor, so vanishing propagates upward in $n$ from $n=0$, which is the direction the argument needs. The step uses only the trivial implication $Y\\simeq0\\Rightarrow\\Omega Y\\simeq0$ and not its reflection. The **Scope.** paragraph claims \"(C) … is what turns (2) into the pointwise test (3)\", which is now known to be false; a redundant hypothesis makes the statement weaker rather than wrong, so the node is `proved` and the correction is `/update`'s.\n\n  **The source was read, and it answers a question another node could not.** `papers/GR17vol1.pdf` PDF p. 92 (printed 55), volume 1, Chapter 1 §5.4: Def. 5.4.1 gives the orthogonality display and Prop. 5.4.5 reads \"*A collection $\\{c_\\alpha\\}$ of objects generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory that contains all $c_\\alpha$*\". GR's standing presentability convention — footnote 8, printed p. 51 — is met here, but *not* for the reason the write-up gives: the proof needs $\\langle S\\rangle_{\\mathcal{C}}$ presentable, and what supplies that is smallness of $S$, hypothesis **(B)**, rather than compact generation of $\\mathcal{C}$, hypothesis (A). The same footnote is the standing `MAJOR` against [Q1-L5-z1](../../Q1-L5/Q1-L5-z1/index.html), which hypothesises neither and therefore cannot discharge it; the two rounds together locate the line between the nodes that inherit the defect and the nodes that do not.\n\n  **The one MINOR worth acting on.** Step 3 attributes its reading of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) to the `note:` field of [detecting compact generation](../../../../appendix/p-compact-generation-stable-case.html), which records an unrelated defect. The reading is correct and independently confirmed against the source; only the attribution is wrong.\n";</script>
