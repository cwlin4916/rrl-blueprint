mall categories; the node's content is stability, idempotent completeness, and the identification of the essential image.\n- **2026-08-04 — relocated** inside its parent's directory ([ADR 0012](../../../../process/decisions/0012-sub-lemmas-nest-in-their-parent.html)): the id is unchanged and is now the path.\n- **2026-08-04 — proved** after two rounds ([r1](critiques/r1.html)–[r2](critiques/r2.html)). The r1 FAIL was closed-world, not mathematical: the draft consumed exactness of the test pullbacks $f^!$ without declaring their appendix home ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)). The lead-researcher widened `objects:` by that one entry mid-round — the first use of the objects-widening path — after confirming the entry says what the referee demanded, and the r2 referee verified the disposal rather than taking it on faith. Two MINORs stand recorded under the PASS.\n- **2026-08-05 — examined and unchanged** by `/update Q1-L2-L3`, the only node that depends on it. Its statement was re-read against the revised dependent and still supplies exactly what that node instantiates at $\\mathcal{Y} = K\\backslash\\mathrm{Gr}$ and $\\mathcal{Y} = K\\backslash LX$; nothing was edited. Worth recording, though: those two MINORs still standing are now what limits [Q1-L2-L3](../Q1-L2-L3/index.html)'s confidence, since the weakest-link rule takes the minimum over a dependency's full confidence and this node has no human channel. Disposing of them in an r3 is the cheapest available lift to the whole Q1-L2 chain.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): framework-level and untouched by this run: $\\mathcal{Y}$ is an arbitrary prestack and no group scheme appears. Re-read against [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) and [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html).\n";</script>
