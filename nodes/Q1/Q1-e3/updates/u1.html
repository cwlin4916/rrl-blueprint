o: [Q1-L1](../../Q1-L1/index.html), as the twisted counterpart of its Hecke-orbit construction.\n\n## Added\n\nThree labelled paragraphs, canonical in [the node](../index.html). The distinction the run turned on:\n\n**Ingredient, not instance.** The main theorem is stated for a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../appendix/assum-intro.html), and the Whittaker period is a twisted polarization with $\\check M = \\mathrm{pt}$ arising from no such $X$ — the register's [K10](../../../../key_examples/k10.html), `KEY: out-of-class`. Arkhipov–Bezrukavnikov–Ginzburg nevertheless appears *inside* the manuscript's proof: the equivariance at `main.tex` `\\label{equation:algebra}` is read there as the self-tensor product of ABG over derived geometric Satake. So this node records a tool the argument consumes, not a case the theorem covers, and saying so is the point of the revision.\n\nThe remaining two record the parent as [Q1](../../../../dag.html) and that [Q3](../../../../dag.html), taking its Setting from [Q1](../../../../dag.html), does not reach this case either.\n\n## Considered and not adopted\n\nRetiring the node as out-of-scope. Rejected: an out-of-class example that the proof *uses* is more informative than one it merely excludes, and [ADR 0047](../../../../process/decisions/0047-an-example-node-is-a-proposition.html) makes a boundary example a proposition in its own right.\n";</script>
