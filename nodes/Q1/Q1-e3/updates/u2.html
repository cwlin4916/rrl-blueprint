have made it the Iwahori-level counterpart of the period the node is about.\n\nThree further errors travelled with it:\n\n- $\\mathrm{Gr}$ is ABG's loop Grassmannian of the **dual** group $G^{\\vee}$ while $\\tilde{\\mathcal{N}} = G\\times_{B}\\mathfrak{n}$ is the Springer resolution for $G$ (adjoint type). The old display named both with no indication that they are dual to each other, so read in this repository's convention — where $\\check{G}$ is the dual and $\\mathrm{Gr}$ is $\\mathrm{Gr}_{G}$ — it pairs a group with its own Grassmannian, which is the pairing backwards.\n- The display printed the two end terms of the three-way equivalence (1.1.1) and then (1.1.2), dropping the quantum-group term $D^{b}\\mathrm{block}^{\\mathrm{mix}}(\\mathsf{U})$ that is the only thing giving $\\mathrm{block}(\\mathsf{U})$ a referent. The symbol was undefined in the node.\n- The period itself was parenthesised: the statement wrote $T^{*}(G/_{\\psi}U)$, the cotangent bundle of a quotient. BZSV §7.6.4 print $M = T^{*}G/\\!\\!/_{\\psi}U$ with no parentheses — the Hamiltonian reduction of $T^{*}G$ by $U$ at $\\psi$ — and the two are different constructions, the second of which is the one whose dual is a point. The statement now carries the source's form with the reduction named. The register's [K10](../../../../key_examples/k10.html) parenthesises it the same way and is listed below.\n\nThere is no write-up on disk (`draft: —`), so §4a of [the update skill](../../../../skills/update.html) has nothing to settle: the status stays `open` and no draft is superseded.\n\n## Removed, verbatim\n\n> The Whittaker period: $M = T^{*}(G/_{\\psi}U)$, the dual extreme of the point, with hyperspherical dual $\\check{M} = \\mathrm{pt}$. The unramified equivalence — Whittaker sheaves on $\\mathrm{Gr}$ against $\\mathrm{Rep}(\\check{G})$, sheared — is due to Frenkel–Gaitsgory–Vilonen, as recorded in BZSV (arXiv:2409.04677) §7.6.4 (p. 169). At Iwahori–Whittaker level the spectral description is Arkhipov–Bezrukavnikov–Ginzburg [[arkhipov2004quantum](../../../../../papers/arkhipov2004quantum.pdf)], diagram (1.1.1)–(1.1.2):\n>\n> $$\n> D^{b}\\mathrm{Perv}^{\\mathrm{mix}}(\\mathrm{Gr})\\;\\cong\\; D^{b}\\mathrm{Coh}^{G\\times\\mathbb{C}^{*}}(\\tilde{\\mathcal{N}}),\\qquad \\mathrm{block}(\\mathsf{U})\\;\\simeq\\;\\mathrm{Perv}(\\mathrm{Gr}),\n> $$\n>\n> the black box [ABG / Iwahori–Whittaker spectral descriptions](../../../../appendix/bb-abg.html).\n>\n> **Relation to its parent [Q1](../../../../dag.html).** This is the dual extreme of the point, and it lies *outside* [Q1](../../../../dag.html)'s standing class: the register carries it as [K10](../../../../key_examples/k10.html), `KEY: out-of-class`. It bounds the question's scope from the twisted side and says nothing about the equality for any $X$ inside the class.\n\nThe two closing paragraphs of [u1](u1.html) — instance of the main theorem, and against [Q3](../../../../dag.html)'s package — are kept, the first with the `equation:algebra` sentence corrected (below).\n\n## Added\n\nClause **(i)** now transcribes BZSV §7.6.4 rather than paraphrasing it, and names the Hecke category $\\mathrm{Shv}(G_{F}/G_{O})^{U(F),\\psi}$ the source gives.\n\nClause **(ii)** is the out-of-class judgement, unchanged in substance and moved out of the closing paragraph so it reads before the black box rather than after.\n\nClause **(iii)** states ABG (1.1.1)–(1.1.2) as the source states it, with $\\mathsf{U}$, $\\mathrm{block}(\\mathsf{U})$, $\\tilde{\\mathcal{N}}$, $G$ and $G^{\\vee}$ all identified.\n\nClause **(iii′)** is the correction itself, and closes on what the manuscript actually consumes:\n\n$$\n\\mathcal{D}_{c}(I\\backslash\\mathrm{Gr})\\;\\simeq\\;\\mathrm{Perf}(\\tilde{\\check{\\mathfrak{g}}}^{*}[2]/\\check{G})\n$$\n\nat `main.tex`:1424 — Iwahori-**equivariant**, over the **Grothendieck–Springer** resolution $\\tilde{\\check{\\mathfrak{g}}}^{*}$ and not the Springer resolution $\\tilde{\\mathcal{N}}$, attributed there to [[arkhipov2004quantum](../../../../../papers/arkhipov2004quantum.pdf)] and [[gaitsgory-semiinfinite-intersection-coh](../../../../../papers/gaitsgory-semiinfinite-intersection-coh.pdf)] together. So the node's own automorphic side (Whittaker sheaves on $\\mathrm{Gr}$) and the black box it names are two different descriptions, and no source on disk supplies the first at Iwahori level.\n\nThe **Instance of the main theorem** paragraph is corrected in one respect: `equation:algebra` is the equivalence of endomorphism algebras *with respect to which* the main theorem is equivariant, not \"the equivariance\". The manuscript's own caveat is added — `main.tex`:138, \"We do not prove the actions of (equation:algebra) are compatible with those of Bezrukavnikov's equivalence\".\n\n## Verified · refuted · unverified\n\nNo external passage was supplied; the three columns are over the claims the standing statement made.\n\n**Verified** (each against the source on disk, not against a paraphrase):\n\n- BZSV §7.6.4, p. 169, verbatim: $M = T^{*}G/\\!\\!/_{\\psi}U$; $\\mathcal{H}_{M} = \\mathrm{Shv}(G_{F}/G_{O})^{U(F),\\psi}$; $\\check{M} = \\mathrm{pt}$ so $QC(\\check{M}/\\check{G})\\simeq\\mathrm{Rep}(\\check{G})$; \"due to Frenkel–Gaitsgory–Vilonen [[FGV01](../../../../../papers/FGV01.pdf)] (see also [ABB+05])\". The section opens \"Dually\", following §7.6.3's $H^{*}(BG)$ discussion, which is what \"the dual extreme of the point\" records.\n- ABG (1.1.1) and (1.1.2) as displayed in the new clause (iii), including the three-way form, the identification of $\\tilde{\\mathcal{N}}$, $\\mathsf{U}$ and $\\mathrm{block}(\\mathsf{U})$, and $\\mathrm{Gr}$ as the loop Grassmannian of $G^{\\vee}$ — `papers/arkhipov2004quantum.pdf` p. 2.\n- `main.tex`:130–132, 138 (the algebra equivalence, the self-tensor-product reading, and the compatibility caveat) and `main.tex`:1424 (the Iwahori-equivariant equivalence, unlabelled, cited by line).\n- `FGV01` is a key in `refs.bib` (line 261): Frenkel–Gaitsgory–Vilonen, *Whittaker patterns in the geometry of moduli spaces of bundles on curves*, Ann. of Math. **153** (2001) 699–748. The node may cite it, and now does.\n\n**Refuted:**\n\n- \"At Iwahori–Whittaker level the spectral description is [[arkhipov2004quantum](../../../../../papers/arkhipov2004quantum.pdf)], diagram (1.1.1)–(1.1.2).\" Zero occurrences of *Whittaker* in the full extracted text of that PDF; four of *Iwahori*, one of them the definition of the stratification. The diagram is Iwahori-constructible.\n\n**Unverified** (asserted nowhere in the new statement, and left as the node's open question):\n\n- That any source establishes an Iwahori–Whittaker spectral description for this period. `arkhipov2009perverse` (Arkhipov–Bezrukavnikov, *Perverse sheaves on affine flags and Langlands dual group*, Israel J. Math. **170** (2009) 135–183) is in `refs.bib` and is the suspected home of one, but the PDF is not in `papers/` and nobody in this repository has read it. Nothing in the new statement rests on it.\n\n## Reaches past this node — recorded, not acted on\n\nA node-local run writes inside `blueprint/nodes/Q1/Q1-e3/` and nowhere else ([ADR 0072](../../../../process/decisions/0072-a-run-is-node-local-or-repo-wide.html)). The same misattribution stands in five files a repo-wide run or the owning operator should correct:\n\n1. `blueprint/appendix/9-external-black-boxes/bb-abg.md` — titled *ABG / Iwahori–Whittaker spectral descriptions*, and its one-line theorem says \"Iwahori–Whittaker and spherical spectral descriptions, as cited in main.tex\". Neither cited paper, as read, supplies an Iwahori–Whittaker description; what `main.tex` cites the pair for is the Iwahori-equivariant equivalence at line 1424. The appendix is not this run's to edit, and the entry is a black box whose hypotheses read \"as cited\", so the fix is a retitle plus the actual statement — not a deletion.\n2. `blueprint/appendix/index.md`, the listing line for the same entry, which repeats the title.\n3. `blueprint/key_examples.md` [K10](../../../../key_examples/k10.html) — three corrections: \"`FGV01.pdf`, no `refs.bib` key\" is false, the key is at `refs.bib`:261; \"`arkhipov2004quantum` for the Iwahori–Whittaker spectral side\" is the misattribution itself; and its heading writes the period as $T^{*}(G/\\!\\!/_{\\psi}U)$ where the source prints $T^{*}G/\\!\\!/_{\\psi}U$. The register is `/update`'s to write, repo-wide only.\n4. `blueprint/nodes/Q1/Q1-L1/examples.md`, lines 41 and 64 — where the error originated, in the 2026-08-04 `/examples` run that also created this node. Only the example-finder writes that file.\n5. `papers/guideline.md`, lines 86 and 208 — \"the Iwahori–Whittaker input\" and \"the Iwahori–Whittaker instance\". Entries there are appended by the prover and the example-finder and never rewritten by this operator.\n\n`blueprint/context.md`:102 also cites this black box, but for the spectral side of the argument, which is the Iwahori-equivariant use and is correct as it stands.\n\n**For §8 of the next repo-wide run.** The reading that produced the error recorded the right page numbers and the right diagram numbers and got the *name of the category* wrong, and the name then became the title of an appendix entry — at which point every node citing the entry inherited a Whittaker hypothesis no source imposes. A page-verified citation is not a verified attribution, and a black box titled after a property is a black box asserting that property.\n\n## Considered and not adopted\n\n- **Retitling the appendix entry in this run.** Rejected on write discipline: the appendix is created by the lead-researcher and never by `/update`, and a node-local run may not write outside its own directory. Recorded above instead.\n- **Dropping clause (iii) and citing only what the manuscript uses.** Rejected: the node exists to record which black box the Iwahori level consumes, so what ABG actually proves is exactly the thing this node should carry — and stating it correctly is what makes the gap in (iii′) visible.\n- **Setting a `needs:` line.** Not set: with `status: open`, `human: —`, `examples: —` and no dependencies, all four channels are silent or vacuous and the node sits at $0$, not negative, so [ADR 0077](../../../../process/decisions/0077-the-ask-is-a-line-on-the-node.html) does not fire. The ask that would go there — read `arkhipov2009perverse` and decide whether an Iwahori–Whittaker statement exists to cite — belongs to the appendix entry, which is not a node.\n";</script>
