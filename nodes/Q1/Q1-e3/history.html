ck box [bb-abg](../../../appendix/bb-abg.html) used at Iwahori level.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: the Whittaker period, `K10` and out-of-class, bearing on scope rather than on any statement.\n- **2026-08-07 — statement extended** by `/update Q1-e*` ([u1](updates/u1.html), user-commissioned: instance-of-the-main-theorem, parent relation, Q3 cross-check): three labelled paragraphs appended, replacing a closing line that named [Q1-L1](../Q1-L1/index.html). The node is now explicit that the Whittaker period is an **ingredient** of the manuscript's proof and not an instance of its theorem — `main.tex` `\\label{equation:algebra}` reads the equivariance as the self-tensor product of ABG over derived geometric Satake — and that [Q3](../../../dag.html), inheriting [Q1](../../../dag.html)'s Setting, does not reach the case either.\n- **2026-08-08 — misattribution corrected** by `/update Q1-e3` ([u2](updates/u2.html), node-local). The statement had called ABG's diagram (1.1.1)–(1.1.2) the *Iwahori–Whittaker* spectral description.\n\n  **What the source says.** The word *Whittaker* occurs nowhere in `papers/arkhipov2004quantum.pdf`, and ABG p. 2 defines $\\mathcal{P}erv(\\mathrm{Gr})$ by constructibility along Iwahori orbits. Its $\\mathrm{Gr}$ is the loop Grassmannian of the dual group, while $\\tilde{\\mathcal{N}}$ is the Springer resolution for $G$. The old display had dropped the quantum-group term that gives $\\mathrm{block}(\\mathsf{U})$ its referent. The period was also parenthesised: BZSV §7.6.4 print $M = T^{*}G/\\!\\!/_{\\psi}U$, the Hamiltonian reduction of $T^{*}G$ by $U$ at $\\psi$, and not the cotangent bundle $T^{*}(G/_{\\psi}U)$ of a quotient.\n\n  **What the statement now says.** It states ABG as the source states it, and adds clause (iii′). What the manuscript consumes is the Iwahori-*equivariant* $\\mathcal{D}_{c}(I\\backslash\\mathrm{Gr})\\simeq\\mathrm{Perf}(\\tilde{\\check{\\mathfrak{g}}}^{*}[2]/\\check{G})$ over the Grothendieck–Springer resolution (`main.tex`:1424). No source on disk gives an Iwahori-level description of the Whittaker period itself. `FGV01` was also found to be a real `refs.bib` key, and is now cited.\n\n  **Reaches past this node.** The same misattribution stands in the [bb-abg](../../../appendix/bb-abg.html) title, the appendix listing, [K10](../../../key_examples/k10.html), [Q1-L1's examples](../Q1-L1/examples.html) and `papers/guideline.md`. These are outside a node-local run's write scope, and are listed in [u2](updates/u2.html) for the next repo-wide run.\n\n  **Status unchanged at `open`.** There is no write-up to supersede.\n";</script>
