The statement also silently transposed the paper's characteristic-zero setting to $F = \\mathbb{F}_q((t))$.\n\n## Verdict on the counterexample\n\n**It stands.** For $X = (SL_2\\times SL_2\\times SL_2)\\backslash(Sp_4\\times Sp_4)$ (his Example 8.0.1), the basic vector generates the proper submodule $\\mathcal{H}_X \\subsetneq C_c^\\infty(X)^K$, and no single vector generates. The logic, assembled from verified pieces:\n\n1. **Theorem 8.0.2** (p. 64): under §8's standing assumptions there is a canonical isomorphism $C_c^\\infty(X)^K \\simeq \\mathbb{C}[\\delta_{(X)}^{1/2}A_X^*]^{W_X}$, compatible with the $\\mathcal{H}(G,K)$-structure and the Satake isomorphism, sending $\\mathbf{1}_{X(\\mathfrak{o})}$ to $1$. The Hecke algebra acts through $\\mathcal{H}_X$, the image of the restriction map $\\mathbb{C}[A^*]^W \\to \\mathbb{C}[\\delta_{(X)}^{1/2}A_X^*]^{W_X}$ (p. 63). Hence $\\mathcal{H}(G,K)\\cdot\\mathbf{e} = \\mathcal{H}_X$, and generation is *equivalent* to surjectivity of the restriction map — \"⇐\" is his Corollary 8.0.4(1), \"⇒\" is immediate from the factorization.\n2. **Example 8.0.1** (p. 64): for this $X$, $W_X$ equals the normalizer of $A_X^*$ in $W$, $\\delta_{(X)}$ is trivial, and $W_X$-nonconjugate points of $A_X^*$ can be $W$-conjugate; \"the restriction map … is not surjective in this case\" (verbatim).\n3. **pp. 65–66** (verbatim): \"there are distinct points of $\\delta_{(X)}^{1/2}A_X^*/W_X$ which map to the same point of $A^*/W$; at those points the multiplicity of the fiber of $C_c^\\infty(X)^K$ over $\\mathcal{H}_X$ is greater than one, even though the generic multiplicity is one.\" A cyclic module over a commutative algebra has fibers of dimension $\\le 1$, so this rules out cyclicity by *any* generator, not merely by $\\mathbf{e}$.\n4. The paper unambiguously places Example 8.0.1 under §8's standing assumptions: the example is used to *correct* [Sa08, Theorem 6.3.2] (Remark, p. 65) and to make the multiplicity assertion of (3), both of which presuppose Theorem 8.0.2 for it.\n\n**Independent check of the fusion claim** (operator's own computation, not adopted from any source). Coordinatize $A^* = \\{(x_1,x_2;y_1,y_2)\\}$ for $\\check{G} = SO_5\\times SO_5$ and write the image of the maximal torus of $SL_2\\times SL_2^{\\mathrm{diag}}\\times SL_2$ as $A_X^* = \\{(ab,\\,a^{-1}b;\\,bc,\\,b^{-1}c)\\}$, a three-dimensional subtorus on which $W_X = (\\mathbb{Z}/2)^3$ acts by inverting $a, b, c$. Matching $W$-invariants $\\{z+z^{-1}\\}$ pairwise, the points of $A_X^*$ parametrized by $(a,b,c) = (a,b,\\pm a)$ and $(b,a,\\pm b)$ are $W$-conjugate; for generic $(a,b)$ they are not $W_X$-conjugate, since $W_X$ inverts coordinates but never swaps $a \\leftrightarrow b$. So the fused locus is a two-parameter family off which the map $A_X^*/W_X \\to A^*/W$ is injective — exactly \"generic multiplicity one, multiplicity $> 1$ at special points\". Since finite-group invariants separate orbits on an affine variety, a $W_X$-invariant function separating a fused pair is not the restriction of any $W$-invariant function: non-surjectivity confirmed.\n\n## The hypotheses, spelled out\n\nThe counterexample is proved in print under, exactly:\n\n- **Global setting** (§1.1, §1.7): $G$ split reductive with simply connected derived group over $\\mathfrak{o}$, the ring of integers of a **local non-archimedean field $k$ of characteristic zero** with residue cardinality $q$ (§1.1 further assumes $k/\\mathbb{Q}_p$ unramified, calling its removal trivial — the removal of characteristic zero is *not* so called); $X$ homogeneous quasi-affine spherical over $\\mathfrak{o}$, with his §1.7 axioms.\n- **§7 standing** (p. 55 of the numbered text): no spherical root of type $N$; every Levi $L_\\gamma$ classical — whence Statement 6.3.1 (the prescribed rank-one cocycle $B_{w_\\gamma}$ per root type) holds for all normalized spherical roots, by his Proposition 6.4.2.\n- **Theorem 7.2.1's hypotheses**: Statement 6.3.1 for all simple spherical roots, and Statement 7.1.5 for the virtual weighted color set $\\Theta$ (p. 60: every $\\check{\\theta}\\in\\Theta$ has a sign, and for each $\\gamma\\in\\Delta_X$ the set $\\{\\check\\theta\\in\\Theta^+ \\mid w_\\gamma\\check\\theta < 0\\}$ is precisely the virtual weighted colors belonging to $\\gamma$) — conjectured by him for every affine homogeneous $X$, \"very easy to check in each particular case\".\n- **§8 standing** (p. 63): $X$ homogeneous and *affine* ($H$ reductive), the assumptions of Theorem 7.2.1, and a unique open $B(k)$-orbit, giving the strong Cartan decomposition $X/K \\simeq \\Lambda_X^+$.\n\nExample 8.0.1 satisfies all of these on the paper's authority (item 4 above); its data as printed: normalized spherical roots $\\gamma_1 = \\alpha_1+\\alpha_2$, $\\gamma_2 = \\alpha_1+\\alpha_1'$, $\\gamma_3 = \\alpha_1'+\\alpha_2'$, dual group the image of $SL_2\\times SL_2^{\\mathrm{diag}}\\times SL_2 \\to SO_4\\times SO_4 \\to SO_5\\times SO_5$.\n\n## What the revision did not adopt\n\n- **Equal characteristic.** The node's setting is $F = \\mathbb{F}_q((t))$; the paper's is characteristic zero. No printed source was found transferring Theorem 8.0.2 to equal characteristic, so the revised statement asserts the dichotomy over characteristic-zero local fields and names the transfer as open. (Expected routine — the Satake-module structure constants are combinatorial — but expectation is not a citation.)\n- **Membership in the standing class.** Whether $X = (SL_2)^3\\backslash(Sp_4)^2$ satisfies [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) — clause (2), connected open-orbit $B$-stabilizers — is asserted nowhere read. The appendix note derives (2) from \"no roots of type $N$\" [[BZSV, Rmk 4.2.1](../../../../../papers/BZSV.pdf)], and the paper's §7 standing gives no-type-$N$ in *its* sense; identifying the two senses and checking the clause is a crisp claim, commissioned this run as a question-level example node rather than adopted. The old `examples.md` fork (\"either the hyperspherical hypotheses exclude such fusion, or …\") therefore leans: exclusion is *unlikely*.\n- **BZSV's categorical generation is not contradicted.** BZSV p. 163: Conjecture 7.5.1 makes all sheaves on $X_F/G_O$ generated from the basic object through Hecke functors — generation *under colimits* in a cocomplete category. Example 8.0.1 (if in the class) shows the trace-of-Frobenius shadow of that statement fails as *module* generation; the two are compatible, and the revised statement does not present the counterexample as evidence against Conjecture 7.5.1.\n\n## Verification record (§4 of the operator's discipline)\n\n**Verified** (acted on): Thm 8.0.2 with $\\mathbf{e}\\mapsto 1$ and action through $\\mathcal{H}_X$ (p. 63–64); Ex. 8.0.1's data and verbatim non-surjectivity (p. 64); Cor. 8.0.4(1)–(3) (p. 65); fiber multiplicity $>1$ at fused points for Ex. 8.0.1 (pp. 65–66); correction of [Sa08, Thm 6.3.2] via Ex. 8.0.1 (p. 65 Remark); §7/§8 standing hypotheses and Statements 6.3.1 (p. 44–45), 7.1.5 (p. 60); Prop. 6.4.2 (p. 55 of text layer); characteristic-zero setting (§1.1); torsion-freeness of $C_c^\\infty(X)^K$ over $\\mathcal{H}_X$ quoted from [Sa08, Thm 6.2.1] (p. 64); the fusion phenomenon (independent computation above); BZSV p. 163 (categorical generation) and pp. 200–201 (§9.4, the \"?\" on (9.15), the $k=\\mathbb{C}$ deduction from [Sak13] \"in the situations to which that work is applicable\", and the distinguished-vector-and-inner-product identification \"when Proposition 9.2.1 applies\"), both against the local `papers/BZSV.pdf`.\n\n**Refuted** (removed from the statement): \"is not answered in print\" — the question is answered both ways; the criterion is the surjectivity of the restriction map.\n\n**Unverified** (inert — not relied on): equal-characteristic validity of Thm 8.0.2; $X_{8.0.1}$'s membership in [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) (commissioned as its own node); explicit verification of Statement 7.1.5 for Ex. 8.0.1 beyond the paper's implicit assertion; connectedness of open-orbit $B$-stabilizers for Ex. 8.0.1.\n\n## Old `## Statement`, verbatim\n\n> Let $X$ be a smooth affine spherical $G$-variety over $F = \\mathbb{F}_q((t))$, split with all colors defined over $\\mathbb{F}_q$, with $\\mathfrak{o} = \\mathbb{F}_q[[t]]$ and $K = G(\\mathfrak{o})$. The unramified Hecke algebra $\\mathcal{H}(G(F),K)$ acts on $C_c^\\infty(X(F))^K$, and the basic vector $\\mathbf{e} = \\mathbf{1}_{X(\\mathfrak{o})}$ generates a submodule $\\mathcal{H}(G(F),K)\\cdot\\mathbf{e}$ — the trace-of-Frobenius shadow of the Satake subcategory [the Satake subcategories](../../../../appendix/def-satake-subcategory.html), with $\\mathbf{e}$ the shadow of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html). BZSV (arXiv:2409.04677) §9.4, (9.15), pp. 200–201, predict $C_c^\\infty(X_{\\mathfrak{f}};k)^{G_{\\mathfrak{o}}}$ as derived functions on the $q^{-1/2}$-twisted inertia of $\\check{M}/\\check{G}$, and for complex coefficients, where Sakellaridis (*Spherical functions on spherical varieties*, arXiv:0905.4244) applies, deduce an isomorphism of Hecke modules with distinguished vector,\n>\n> $$\n> C_c^\\infty(X_F/G_O)\\;\\simeq\\;\\mathbb{C}[\\check{G}_X]^{\\check{G}_X},\\qquad \\mathbf{e}\\mapsto 1.\n> $$\n>\n> Whether $\\mathbf{e}$ generates the whole module $C_c^\\infty(X(F))^K$ is the function-theoretic form of Q1's seed equality, and is not answered in print. Speaks to: [Q1-L1](../../Q1-L1/index.html), [Q1-L6](../../Q1-L6/index.html), Q1-e7 *(node removed 2026-08-05)*.\n\nThe new `## Statement` is in [`node.md`](../index.html); the first paragraph and the display were verified accurate and kept.\n";</script>
