<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-a1</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-a1 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-a1\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [papers](../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-a1](index.html), and explicit instances of it, simplest first. Throughout, $\\mathfrak{o}$ is the ring of integers of the ambient nonarchimedean field and $\\varpi$ a uniformizer, in the sources' notation ([ring of integers](../../../appendix/conv-ring-of-integers.html)). This file is outside the closed world: it justifies believing or doubting the statement and no proof may cite it.\n\nEVIDENCE: counterexample\n\n## Precedent\n\n**What was searched.** The local library first: BZSV.pdf pp. 162–163, 189–202 (§7.5.3, §§9.1–9.4) and SV17.pdf pp. 65–69 printed (§5.1) with its bibliography, read directly. Then the two papers the statement cites that are not on disk, fetched and read on their own pages: Sakellaridis, *Spherical functions on spherical varieties*, arXiv:0905.4244v3 (§1, §8, §9) and Aizenbud–Sayag, arXiv:1709.08214 (in full, 6 pp.). Web search for cyclicity/generation of Hecke modules of basic functions.\n\n**What was found.**\n\n1. *The displayed isomorphism has a precedent stronger than the node states.* Sakellaridis, arXiv:0905.4244, **Theorem 1.4.1 = Theorem 8.0.2** (p. 64): for $X$ homogeneous affine spherical over split $G$, under the assumptions of his Theorem 7.2.1, there is a **canonical** isomorphism $C_c^\\infty(X)^K \\simeq \\mathbb{C}[\\delta_{(X)}^{1/2}A_X^*]^{W_X}$, compatible with the $\\mathcal{H}(G,K)$-structure and the Satake isomorphism, **under which $\\mathbf{1}_{X(\\mathfrak{o})} \\mapsto 1$**. Since $\\mathbb{C}[\\check{G}_X]^{\\check{G}_X} \\simeq \\mathbb{C}[\\check{T}_X]^{W_X}$, this is the node's display, in print in 2013. BZSV pp. 200–201 (§9.4) is the repackaging the node quotes — verified: (9.15) carries a question mark (the derived/general-$k$ form is open), and the $k=\\mathbb{C}$ isomorphism with distinguished vector and inner product is deduced there from [Sak13].\n2. *The node's closing sentence is contradicted in print — the generation question is answered, both ways.* On p. 63 the Hecke algebra acts through the quotient $\\mathcal{H}_X$ = image of the restriction map (8.2), $\\mathbb{C}[A^*]^W \\to \\mathbb{C}[\\delta_{(X)}^{1/2}A_X^*]^{W_X}$; so by Theorem 8.0.2, $\\mathcal{H}(G,K)\\cdot\\mathbf{e} = \\mathcal{H}_X$. **Corollary 8.0.4(1)**: if (8.2) is surjective, $C_c^\\infty(X)^K$ is a *principal* module generated by $\\mathbf{1}_{X(\\mathfrak{o})}$ — generation holds. **Example 8.0.1**: for the split, homogeneous, affine spherical $X = (SL_2\\times SL_2\\times SL_2)\\backslash (Sp_4\\times Sp_4)$ (two copies embedded as $Sp_2$'s, the third diagonally; $\\check{G}_X \\to SO_5\\times SO_5$ through a diagonal $SO_4$), $W_X$-nonconjugate points of $A_X^*$ are fused by $W$, the restriction map \"is not surjective in this case\" (p. 64, verbatim), and pp. 65–66 note the fiber multiplicity exceeds one at fused points — a cyclic module over a commutative algebra has fibers of dimension $\\le 1$, so **$\\mathbf{e}$ generates a proper submodule $\\mathcal{H}_X \\subsetneq C_c^\\infty(X)^K$**.\n3. *Which hypotheses the counterexample satisfies.* Split $G$, $X$ smooth affine homogeneous spherical, Sakellaridis' §8 standing assumptions — all satisfied, on his authority. Not discharged by any source: that $T^*X$ is hyperspherical, that the open-orbit $B$-stabilizers are connected, that the unramified conjecture holds for this $X$. So this is a counterexample to the node's *sentence as written* and to unconditional generation; whether it lies inside the project's exact standing class is open. The fork it forces: either the hyperspherical hypotheses exclude such fusion, or trace of Frobenius does not carry the categorical generation (BZSV p. 163: *all* sheaves on $X_F/G_O$ generated from the basic object, as a consequence of Conj. 7.5.1) to function level, or the conjecture fails for such $X$. This is a referral to the critic and to `/update`, not a resolution.\n4. *Supporting module structure in print.* [`SV17`] Remark 5.1.7 (printed p. 68, verified): $C_c^\\infty(X)^J$ is finitely generated over $\\mathcal{H}(G,J)$ [AAG12]. Torsion-freeness over $\\mathcal{H}_X$ is [`Sakellaridis_2008`] Theorem 6.2.1, as quoted at arXiv:0905.4244 p. 64.\n\n**What was not found.** No source states the generation question for the exactly-hyperspherical class (BZSV §9.4, its natural home, is silent on generation — the section poses only the module-structure question); no derived/general-$k$ result beyond the \"?\" of (9.15); no Iwahori-level analogue at hyperspecial sources (arXiv:2406.16070 treats Iwahori-fixed functions on symmetric spaces but was not read beyond its listing).\n\n## Instances\n\n### 1. Iwasawa–Tate: $X=\\mathbb{A}^1$, $G=\\mathbb{G}_m$\n\n**What it is.** $F = \\mathbb{F}_q((t))$, $K=\\mathfrak{o}^\\times$ acting on $F$; $\\mathcal{H} \\simeq \\mathbb{C}[T^{\\pm 1}]$, $T = \\mathbf{1}_{t\\mathfrak{o}^\\times}$; $\\mathbf{e} = \\mathbf{1}_{\\mathfrak{o}}$.\n\n**Why it is an instance.** Smooth, affine, spherical (the $\\mathbb{G}_m$-orbit $\\mathbb{G}_m \\subset \\mathbb{A}^1$ is open with trivial — connected — stabilizer); split, one color, defined over $\\mathbb{F}_q$. Not homogeneous, so Sakellaridis' §8 does not formally apply; checked by hand instead *(constructed, unsourced)*.\n\n**What the statement says here.** $C_c^\\infty(F)^{\\mathfrak{o}^\\times}$ = sequences $(a_n)_{n\\in\\mathbb{Z}}$ (value on $t^n\\mathfrak{o}^\\times$) vanishing for $n \\ll 0$ and constant $= a_0$-value for $n \\gg 0$. Since $T^n\\cdot\\mathbf{e} = \\mathbf{1}_{t^n\\mathfrak{o}}$ and $\\mathbf{1}_{t^n\\mathfrak{o}^\\times} = \\mathbf{1}_{t^n\\mathfrak{o}} - \\mathbf{1}_{t^{n+1}\\mathfrak{o}}$, the translates of $\\mathbf{e}$ span everything and are free: $C_c^\\infty(F)^{\\mathfrak{o}^\\times} \\simeq \\mathbb{C}[\\check{G}_X] = \\mathbb{C}[x^{\\pm}]$, $\\mathbf{e}\\mapsto 1$, and generation *holds*. Categorical shadow: `BZSV` p. 163 footnote 62 (Hecke translate of the basic object in Example 7.3.5).\n\n**Source.** hand computation; `BZSV` p. 163 fn. 62. `refs.bib`: `BZSV`.\n\n### 2. The group case: $X = H$, $G = H\\times H$\n\n**What it is.** $H$ split reductive over $\\mathbb{F}_q$; $C_c^\\infty(H(F))^{K_H\\times K_H} = \\mathcal{H}(H)$, $\\mathbf{e} = \\mathbf{1}_{H(\\mathfrak{o})}$ = the unit.\n\n**Why it is an instance.** Smooth affine spherical for $H\\times H$ (open $B\\times B^-$-orbit, connected stabilizer $T$); split, colors over $\\mathbb{F}_q$; the hyperspherical group case of BZSV. *(constructed, unsourced)*\n\n**What the statement says here.** $(f\\otimes\\mathbf{1}_{K_H})\\cdot\\mathbf{e} = f$, so $\\mathbf{e}$ generates trivially, and the node's display is the classical Satake isomorphism $\\mathcal{H}(H) \\simeq \\mathbb{C}[\\check{H}]^{\\check{H}}$ with $\\check{G}_X = \\check{H}$ diagonal, $\\mathbf{e}\\mapsto 1$.\n\n**Source.** standard (Satake isomorphism); the framework instance of arXiv:0905.4244 §8. `refs.bib`: absent (Satake 1963 has no key).\n\n### 3. Split Gross–Prasad: $X = SO_n\\backslash(SO_n\\times SO_{n+1})$\n\n**What it is.** All groups split; the rank-one-per-factor spherical period of Gross–Prasad type.\n\n**Why it is an instance.** Homogeneous (so affine, $SO_n$ reductive), smooth, spherical, split — Sakellaridis' own Example 7.2.5 (p. 63, verified): $\\check{G}_X = \\check{G}$ and his Statement 7.1.5 holds, so §8's standing assumptions are satisfied.\n\n**What the statement says here.** $\\check{G}_X = \\check{G}$ forces $A_X^* = A^*$, $W_X = W$, so the restriction map (8.2) is onto and Corollary 8.0.4(1) applies: $C_c^\\infty(X)^K$ is *principal, generated by $\\mathbf{e}$* — the positive answer to the seed's shadow, in print, with the multiplicity-one and good-test-vector corollaries alongside.\n\n**Source.** Sakellaridis, *Spherical functions on spherical varieties*, Amer. J. Math. 135 (2013), arXiv:0905.4244 — Ex. 7.2.5, Thm. 8.0.2, Cor. 8.0.4. `refs.bib`: absent.\n\n### 4. Boundary (split fails): Hermitian forms\n\n**What it is.** $E/F$ unramified quadratic, residual characteristic $\\neq 2$; $X$ = determinant-$1$ Hermitian forms on $E^n$, $G = SL_n(E) = (\\mathrm{Res}_{E/F}SL_n)(F)$, $K_0 = SL_n(\\mathcal{O}_E)$.\n\n**Why it is a boundary case.** Smooth affine spherical (symmetric, stabilizer $SU_n$) — but $\\mathrm{Res}_{E/F}SL_n$ is **not split**, so the node's split/colors-over-$\\mathbb{F}_q$ hypothesis fails, and nothing else does.\n\n**What the statement says here.** Generation fails maximally: $\\mathcal{S}(X)^{K_0}$ is **free of rank $2^{n-1}$** over $\\mathcal{H}(G,K_0)$ (Theorem A = Theorem 3.0.1, verified on the paper's own pages), hence not cyclic for $n\\ge 2$; the $GL_n$ version is Hironaka's (Rem. 1.0.1; [Hir99] = *Spherical functions and local densities on Hermitian forms*, J. Math. Soc. Japan 51 (1999)). Their §1.2, verbatim: \"One can not expect that the conclusion of the Theorem holds for any spherical space.\" The split hypothesis is load-bearing — though instance 8.0.1 above shows it is not sufficient.\n\n**Source.** Aizenbud, Sayag, *A short proof of Hironaka's theorem on freeness of some Hecke modules*, arXiv:1709.08214. `refs.bib`: absent.\n\n## Searches run\n\nBZSV.pdf pp. 162–163, 189–202; SV17.pdf printed pp. 61–69 and bibliography p. 287 ([AAG12] = Aizenbud–Avni–Gourevitch, Comment. Math. Helv. 87 (2012) 929–962); arXiv:0905.4244v3 pp. 1–5, 63–68; arXiv:1709.08214 pp. 1–5; arXiv abstracts of 0905.4244, 1709.08214; WebSearch \"Hecke module basic function spherical variety generated/cyclic\" (surfaced arXiv:2406.16070, math/0606130 = [`Sakellaridis_2008`]). The objects of the node are the shadows of [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and [$\\mathrm{IC}_0$](../../../appendix/ic-0.html); their categorical generation statement was checked at `BZSV` p. 163.\n";</script>
