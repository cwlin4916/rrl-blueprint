dates/u1.html)) reduced the first branch to this node's crisp claim: clause (2) of the standing definition for $X_0$, via the no-type-$N$ criterion. No existing node carries it — [Q1-e6](../Q1-e6/index.html) records the *failure* of clause (2) for $\\mathrm{PSL}_2/\\mathrm{PO}_2$, and [Q1-a1](../Q1-a1/index.html) carries only the function-theoretic record, not the class membership. Settling it decides whether [Q1](../../../dag.html)'s standing class contains a variety with function-level failure of generation, which disciplines what the exact criterion sought by Q1's Problem statement can look like.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: membership of the fusion counterexample in the standing class, `K12`'s open half. It remains the one place where an answer of \"no\" to [Q1](../../../dag.html) is in reach, and the two transfers it names are still not in print.\n- **2026-08-05 — statement re-spaced, no claim changed** by the presentation pass of `/update Q1` ([ADR 0031](../../../process/decisions/0031-presentation-is-a-stage-not-a-command.html)). The statement carried a prose paragraph over 90 words; it is now one assertion per paragraph, each opening with its own bolded label, with standalone assertions promoted to their own `$$` displays. The orchestrator ran the content-preservation gate itself: no `VERDICT:`, `EVIDENCE:`, status, type, role, human, created or dependency line changed.\n- **2026-08-07 — statement extended** by `/update Q1-e*` ([u1](updates/u1.html), user-commissioned: instance-of-the-main-theorem, parent relation, Q3 cross-check): three labelled paragraphs appended after clause (v); nothing removed. Uniquely among [Q1](../../../dag.html)'s examples the hypothesis in doubt is [the three standing hypotheses](../../../appendix/assum-intro.html)(c) itself, so the main theorem is vacuous here until the unramified conjecture is settled for $X_0$. Against [Q3](../../../dag.html): no $G$-fixed point, not symmetric, both groups simply connected — no node of [Q3](../../../dag.html) obstructs the package here, which makes $X_0$ the best available test case for **(H1)**–**(H3)**.\n";</script>
