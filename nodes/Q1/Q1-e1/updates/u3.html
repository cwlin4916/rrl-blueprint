e carries no `proof.md` to re-sync.\n\n## Removed, verbatim\n\n> Speaks to: [Q1](../../../../dag.html)'s seed equality in its one degenerate extreme — the unramified equivalence is a theorem here, and the equality is vacuous.\n\n## Added\n\nThree labelled paragraphs, canonical in [the node](../index.html):\n\n- **Relation to its parent [Q1](../../../../dag.html).** Keeps what the removed sentence said and names the register entry, [K9](../../../../key_examples/k9.html), `KEY: degenerate`.\n- **Instance of the main theorem.** Yes and unconditionally — [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) is derived geometric Satake, a theorem for $X = H$ — so the main theorem here re-derives Bezrukavnikov 2016, Theorem 1(2). Left open, and stated as open: whether the two targets agree, hence whether $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}$ exhausts $\\mathcal{D}_c(I\\backslash LX)$ at Iwahori level.\n- **Against [Q3](../../../../dag.html)'s package.** New, and the finding of this run for this node: no $G$-fixed point, so [Q3-L2](../../../Q3/Q3-L2/index.html) does not bite, but $\\pi_0(LX)\\cong\\pi_1(H)$, so **(H2)**'s index is filtered only for $H$ simply connected, and for $H = T$ of positive rank [Q3-L3](../../../Q3/Q3-L3/index.html)(4) makes **(H2)** false outright.\n\n## Considered and not adopted\n\nRecording the group case as a **positive** for [Q3](../../../../dag.html) on the strength of $H$ simply connected. Rejected: [Q3-L6](../../../Q3/Q3-L6/index.html)(2) delivers directedness of the index only, which is one of the two things **(H2)** needs — the other, bounded supports for coherent objects, is untouched here.\n";</script>
