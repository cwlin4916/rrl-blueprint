s a symmetric variety with the full derived equivalence.\n\n## Added\n\nThree labelled paragraphs, canonical in [the node](../index.html). The new mathematics is in the third:\n\n**$\\pi_0(L X)$ is infinite for the symplectic period.** $X = \\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$ is $G/G^\\theta$ with $G^\\theta = \\mathrm{Sp}_{2n}$ connected, so hypothesis **(A)** of [Q3-L6](../../../Q3/Q3-L6/index.html) holds and its criterion is available. Since $\\mathrm{Sp}_{2n}\\subseteq\\mathrm{SL}_{2n}$, the determinant is trivial on the stabilizer and descends to a $G$-equivariant $\\det\\colon X\\rightarrow\\mathbb{G}_m$, whence a surjection\n\n$$\n\\pi_0(LX)\\ \\twoheadrightarrow\\ \\pi_0(L\\mathbb{G}_m)\\ \\cong\\ \\mathbb{Z}.\n$$\n\nEquivalently, in [Q3-L6](../../../Q3/Q3-L6/index.html)(2)'s lattice form: the centre of $\\mathrm{GL}_{2n}$ is $\\theta$-split, so $\\Lambda_S$ contains the cocharacter $t\\mapsto t\\cdot\\mathrm{Id}$, of coordinate sum $2n\\ne 0$, and $\\Lambda_S\\not\\subseteq Q$. So $\\Lambda_X^+$ is not filtered, and [Q3-L4](../../../Q3/Q3-L4/index.html), which requires a filtered index, does not apply.\n\nThe other two record the parent as [Q1](../../../../dag.html) with the register entry [K6](../../../../key_examples/k6.html), and that this is the instance of the main theorem with the fewest outstanding hypotheses — $X$ is homogeneous, so [Q3-L2](../../../Q3/Q3-L2/index.html)'s obstruction to (a) does not arise, and (c) is Chen–Macerato–Nadler–O'Brien.\n\n## Considered and not adopted\n\nConcluding that **(H2)** *fails* here, by running [Q3-L3](../../../Q3/Q3-L3/index.html)'s witness over the connected components of $LX$ instead of over its strata. Rejected as an assertion and kept as a prediction: [Q3-L3](../../../Q3/Q3-L3/index.html) assumes each **stratum** is open and closed, which is false here, and its clause 1 identification of $\\mathcal{D}_c$ with a product would have to be re-established for an infinite disjoint union of components before the witness carries over. That transposition is the node this run proposes for [Q3](../../../../dag.html), recorded in the journal entry.\n";</script>
