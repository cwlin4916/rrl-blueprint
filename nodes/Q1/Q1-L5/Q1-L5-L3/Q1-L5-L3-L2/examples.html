<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L2</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L2 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L5-L3-L2\n\n[node](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [papers](../../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L5-L3-L2](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: gap\n\n**The dictionary.** The sources state charts for *schemes* and for $\\ell$-adic sheaf theories; the\nnode states them for quotient prestacks and $\\mathcal{D}$-modules. *(D1)* \"$S\\rightarrow K\\backslash Y$\nsmooth\" corresponds to \"$m\\colon K\\times S\\rightarrow Y$ smooth\": Chen–Yi state only the scheme side\nand only *formally* smooth (Prop. 47(iii), Cor. 49(i)), Zhu only the stack side (Def. 10.114(1));\njoining them is mine, not in print. *(D2)* a node *test* is a smooth map from a **finite-type**\ndg-scheme, whereas an atlas member is coh. pro-smooth from a **standard placid** space (Zhu,\nDef. 10.114(1)) or a smooth covering by a scheme admitting a placid presentation (Chen–Yi, A.5(2));\nthe dictionary drops finite type, and that is where the node's difficulty sits. *(D3)*\n[coherent](../../../../../appendix/defn-coherent-d-mod.html) corresponds to constructible — both are\n\"coherent after pullback to an atlas\". No theorem is transported across (D3) below.\n\n## Precedent\n\n**What was searched.** Local library first: `chenyi_2025singularitiesorbitclosuresloop` §6.1 and\nAppendix A.1/A.5 (pp. 24–29, 53–59), `zhu2025tamecategoricallocallanglands` §10.5 (pp. 371–374),\n`mirkovic2007geometric` p. 4. Then the web for Bouthier–Kazhdan–Varshavsky (arXiv:2003.01428), the\ncited home of this placid technology, not on disk and not read at page level.\n\n**What was found.**\n\n**(1) Chen–Yi, Prop. 47 with Cor. 49 (pp. 25–28) — the closure analogue in print, for *symmetric*\n$X$.** There is a contracting transversal slice $S^\\lambda\\subseteq LX$ at $x_\\lambda$ with\n$S^\\lambda\\cap LX_\\lambda=\\{x_\\lambda\\}$ (Prop. 47(iv)), whose intersections\n$S^\\lambda_{\\le\\mu}=S^\\lambda\\cap\\overline{LX}_\\mu$ are **finite type and affine** (Lemma 45(iii) via\n$S^\\lambda\\cong L^\\lambda$, Prop. 47(i)); $m\\colon L^+G\\times S^\\lambda\\rightarrow LX$ is formally\nsmooth (Prop. 47(iii)) and so is $m\\colon L^+G\\times S^\\lambda_{\\le\\mu}\\rightarrow\\overline{LX}_\\mu$\n(Cor. 49(i)). *Match:* under (D1) this is the existence of clause 2's family with\nfinite-dimensional members, and clause 1 realized on such a chart as the closed immersion\n$S^\\lambda\\cap\\overline{LX}_{\\lambda'}\\hookrightarrow S^\\lambda\\cap\\overline{LX}_\\mu$ of finite-type\naffine schemes. Cor. 49(i) is proved in one line as the base change of Prop. 47(iii) along the\nembedding $\\overline{LX}_\\mu$, so it holds verbatim with the node's **finite union $Y$** there\ninstead: non-disjointness costs the source's own argument nothing. *Not reached:* $X$ symmetric —\n§6 runs through the involution and Remark 37 extends Theorem 36 alone, so for general spherical $X$\nno slice is in print; *formally* smooth, not smooth; and no joint-surjectivity or\nfinitely-many-suffice clause anywhere.\n\n**(2) Chen–Yi, A.1(2) (p. 53).** A finitely presented $f\\colon X\\rightarrow Y$ with $Y$ admitting a\nplacid presentation descends to a morphism of finite-type schemes, and\n$X\\cong\\lim_{j}X_{j_0}\\times_{Y_{j_0}}Y_j$. *Match:* compatible finite-dimensional models for a\nclosed embedding — at scheme level, non-equivariantly, and **with the ambient placid**, the\nhypothesis the node refuses. Silent on the quotients.\n\n**(3) Zhu, Def. 10.114(1), Ex. 10.117, §10.5.2 (pp. 371–373).** A *quasi-placid atlas* is a family\n$\\{U_i\\rightarrow X\\}$ of representable coh. pro-smooth maps from standard placid spaces such that\nfor every $S$ some **finite** subset has $\\{U_i\\times_XS\\rightarrow S\\}$ jointly surjective — clause\n2's shape verbatim under (D2). Ex. 10.117 puts $K\\backslash\\overline{LX}_\\lambda$ in the class, and\n§10.5.2 supplies the descent [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) wants: constructible\niff constructible on *some, equivalently any* quasi-placid atlas. The same page then says \"By\ndefinition, the constructible categories are preserved by !-pullback along **any** morphism\" — the\nobstruction this node exists to remove is an artefact of testing\n[coherence](../../../../../appendix/defn-coherent-d-mod.html) along *smooth* maps only.\n\n**What was not found.** Nobody states this for quotient prestacks with **finite-type** tests, and\nthe omission looks deliberate. For two charts $S,S'\\rightarrow K\\backslash\\overline{LX}_\\lambda$ the\nfibre product $S\\times_{K\\backslash\\overline{LX}_\\lambda}S'$ is a transporter — a torsor under a\nstabiliser of the $K$-action — and in the group case `mirkovic2007geometric` p. 4 (\"the group\n$G_{\\mathcal{O}}$ acts on the $\\mathrm{Gr}_n$ via a finite dimensional quotient\") puts an\ninfinite-dimensional congruence kernel inside every stabiliser; for general spherical $X$ the same\nis [Q1-L4](../../../Q1-L4/index.html)(ii)'s pro-unipotent $U_\\lambda$, which is in the tree and\nwas not read on a page this run. So clause 2's demand that\n$S\\times_{K\\backslash\\overline{LX}_\\lambda}S_\\alpha$ be representable by finite-type dg-schemes *with\nprojections jointly surjective onto $S$* cannot be met for nonempty $S$: clause 2 is vacuous if\nthese quotients admit no nonempty test, and false otherwise. A referral for the critic, not a\nrefutation; the repair the literature suggests is \"placid\" for \"finite-type\", or a prior reduction\nto a finite jet level of the kind [Q1-L4](../../../Q1-L4/index.html)(iii) performs for strata.\n\n## Instances\n\n### 1. $X=\\mathrm{pt}$ — instance\n\n**What it is.** $LX=\\mathrm{pt}$, one stratum, $\\overline{LX}_0=Y=\\mathrm{pt}$, $K\\backslash Y=BK$.\n\n**Why it is an instance.** Smooth affine spherical (K2 of the\n[bench](../../../../../key_examples/k2.html)); $Y$ is a one-member finite union and\n$\\overline{\\imath}_{0,Y}$ is the identity.\n\n**What it matches.** Both clauses, under $X=\\mathrm{pt}$, $\\lambda=0$, any $G$. It reaches no\ngeometry: the closed immersion is an isomorphism.\n\n**What the statement says here.** Every test of $BK$ pulls back to itself; take $A$ = all tests.\nBoth clauses hold — and whether *with content or vacuously* is exactly whether $BK$ has a nonempty\nfinite-type smooth test, so the gap above is visible on the simplest instance.\n\n**Source.** `BZSV` §7.6.3, p. 169, through the [bench](../../../../../key_examples/k2.html). `refs.bib`: `BZSV`.\n\n### 2. $X=\\mathrm{GL}_3$ under $\\mathrm{GL}_3\\times\\mathrm{GL}_3$, a genuinely non-disjoint union — instance at finite level\n\n**What it is.** $K\\backslash LX\\simeq L^+\\mathrm{GL}_3\\backslash\\mathrm{Gr}$ with\n$\\overline{LX}_\\lambda\\leftrightarrow\\overline{\\mathrm{Gr}}_\\lambda$; take $\\lambda=(3,3,0)$ and\n$Y=\\overline{\\mathrm{Gr}}_{(3,3,0)}\\cup\\overline{\\mathrm{Gr}}_{(4,1,1)}$.\n\n**Why it is an instance.** The group case is smooth affine spherical; $Y$ is closed, $K$-stable, a\nunion of two orbit closures, **non-nested and non-disjoint** — partial sums $(3,6,6)$, $(4,5,6)$ are\nincomparable while $(2,2,2)$ is below both, so both contain $\\mathrm{Gr}_{(2,2,2)}$, by the closure\norder of [$\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(2) (the order is\nsourced; the hand check is constructed, unsourced).\n\n**What it matches.** Clauses 1 and 2 for\n$(L^m\\mathrm{GL}_3\\backslash\\overline{\\mathrm{Gr}}_\\lambda,\\ L^m\\mathrm{GL}_3\\backslash Y)$ — the\nstatement with $K$ replaced by the finite jet quotient through which it acts (`mirkovic2007geometric`\np. 4). One chart $\\tilde S_1=Y$ suffices, $S_1=\\overline{\\mathrm{Gr}}_\\lambda$ is closed in it, and\nthe fibre products are finite-type $L^m\\mathrm{GL}_3$-torsors. It does **not** reach $K=L^+G$: the\ncongruence kernel reappears in every fibre product, which is the gap above.\n\n**What the statement says here.** $\\overline{\\mathrm{Gr}}_{(3,3,0)}\\hookrightarrow\n\\overline{\\mathrm{Gr}}_{(3,3,0)}\\cup\\overline{\\mathrm{Gr}}_{(4,1,1)}$ is a closed immersion of\nprojective schemes, charted equivariantly by one finite-dimensional model.\n\n**Source.** `mirkovic2007geometric`, p. 4 with (2.1)–(2.2), read 2026-08-06. `refs.bib`: `mirkovic2007geometric`.\n\n### 3. $X=\\mathrm{GL}_2/\\mathrm{O}_2$: the model is two crossing lines — instance (one chart)\n\n**What it is.** $\\lambda=0$, $Y=\\overline{LX}_{\\omega_2}$, chart $\\tilde S=S^0_{\\le\\omega_2}$.\n\n**Why it is an instance.** Homogeneous with reductive stabiliser, hence smooth affine, and symmetric\nhence spherical; $Y$ is a one-member finite union and $\\overline{\\imath}_{0,Y}$ is finitely presented\nby [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a). *Not discharged:* the source's ground\nfield is not the blueprint's char-$0$ $k$, and $\\mathrm{O}_2$ is disconnected, so $X$ meets this\nnode's hypotheses while sitting outside the polarized hyperspherical class.\n\n**What it matches.** Clause 1 on one chart, explicitly: $S^0_{\\le\\omega_2}\\cong\\{xy=0\\}\\subset k^2$\n(Prop. 51 with Ex. 52) and $S^0\\cap\\overline{LX}_0=\\{x_0\\}$ (Prop. 47(iv)), so\n$K\\backslash\\overline{LX}_0\\hookrightarrow K\\backslash Y$ is modelled by $\\{0\\}\\hookrightarrow\\{xy=0\\}$.\nNo covering statement is made, so clause 2 is untouched, as is general spherical $X$.\n\n**What the statement says here.** The finite-dimensional model of a *single* closure is already a\nnon-disjoint union of two lines, reducible and non-normal: what a chart must carry is the ambient's\nsingularity, not the finite union.\n\n**Source.** Chen–Yi, *Singularities of orbit closures in loop spaces of symmetric varieties*,\narXiv:2310.20006v4, Prop. 47, Prop. 51, Ex. 52, pp. 25–28, read 2026-08-06. `refs.bib`:\n`chenyi_2025singularitiesorbitclosuresloop`.\n\n### 4. The unsheafified quotient — boundary case (constructed, unsourced)\n\n**What it is.** $K\\backslash Y$ read literally as the quotient *prestack*, no sheafification, as the\nnode's phrase \"quotient prestacks\" permits.\n\n**Why it is a boundary case.** Every hypothesis still holds; only the reading of the symbol changes.\n\n**What it matches.** Clause 1, negatively: a $T$-point of the fibre product is $(a,b,g)$ with\n$g\\cdot b=\\tilde h(a)$, and $K$-stability of $\\overline{LX}_\\lambda$ makes the condition on $g$\nempty, so the fibre product is $(\\tilde S\\times_Y\\overline{LX}_\\lambda)\\times K$ — neither finite\ntype nor closed in $\\tilde S$.\n\n**What the statement says here.** Nothing: clause 1 fails, so the fppf-sheaf reading of\n$K\\backslash(-)$ — which no entry of the node's closed world declares — is load-bearing. This is\nFlaw 4(ii) of the parent's [round-1 critique](../critiques/r1.html) from the example side.\n";</script>
