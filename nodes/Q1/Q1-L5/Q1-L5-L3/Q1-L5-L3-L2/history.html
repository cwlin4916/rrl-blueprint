<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L2</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L2 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L3-L2 — history\n\n[Q1-L5-L3-L2](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by the lead-researcher, expanding [Q1-L5-L3](../index.html) after its `/prove` run failed at round 1 on the `GAP:` at Step 4 of [the draft](../proof.html). This node is the geometric half of that gap, and it is the half [r1](../critiques/r1.html) said no node of the tree supplies: \"a **geometric** statement about compatible finite-dimensional models for the pair $\\left(K\\backslash\\overline{LX}_\\lambda,\\ K\\backslash Z\\right)$ — the analogue for *closures* of what [Q1-L4](../../../Q1-L4/index.html) supplies for *strata*\". Clause 1 is the representability the closed embedding must have along the tests of the ambient; clause 2 is the covering family, which is what carries a test of the small quotient back to a test of the large one.\n\n  **Why the ambient is a finite union and not $Z$.** Flaw 2(iii) of [r1](../critiques/r1.html) refuses a placidity hypothesis: the parent's $Z$ ranges over a single closure, a finite union and $LX$, and a non-disjoint finite union of orbit closures carries placidity from nothing in the closed world. So the ambient here is characterised by what it is — a union of finitely many orbit closures, hence a closed $K$-stable **scheme** — and no placidity of $Y$ is assumed; only the closures inside it are placid, by [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)**(a)**. The remaining ambients, where $Z$ is not reached by any finite union, are [Q1-L5-L3-L3](../Q1-L5-L3-L3/index.html)'s business, and that is where the case $Z = LX$ the critique calls substantive is faced.\n\n  **Why [Q1-L4](../../../Q1-L4/index.html).** [r1](../critiques/r1.html) records that Q1-L4 is *not* load-bearing on the round-1 draft but \"likely becomes so if the gap is closed by a chart-lifting sub-node\". It does: a chart of $K\\backslash Y$ through a boundary point of $\\overline{LX}_\\lambda$ is a finite-type transversal to the $K$-orbit through it, and what makes such a transversal finite-dimensional is clause (i)–(ii) of Q1-L4 — the stratum is $BK_\\lambda$ and $K_\\lambda$ has a finite-type quotient. There is no `blocked` ([ADR 0045](../../../../../process/decisions/0045-there-is-no-blocked-node.html)), so Q1-L4 being unproved is not an obstacle to proving this.\n\n  **Which sibling clauses it also serves.** Clause 1 is stated for *every* test of $K\\backslash Y$, not only the members of the family, because that is the form the pushforward direction needs: clause 2 of [Q1-L5-L4](../../Q1-L5-L4/index.html) — \"$\\overline{i}_{\\lambda,Z*}$ sends $\\mathcal{D}_c(K\\backslash\\overline{LX}_\\lambda)$ into $\\mathcal{D}_c(K\\backslash Z)$\" — is checked test by test on the ambient, and clause 1 is exactly what makes each such test restrict to a closed immersion of finite-type dg-schemes. Clause 1 of [Q1-L5-L6](../../Q1-L5-L6/index.html) is the $Z = LX$ case of the parent's clause 1 and is served through [Q1-L5-L3-L3](../Q1-L5-L3-L3/index.html). Neither edge is drawn here — this expansion is [Q1-L5-L3](../index.html)'s alone, and the wiring is `/update`'s or the orchestrator's to do.\n";</script>
