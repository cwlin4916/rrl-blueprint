s, and let $\\overline{\\imath}_{\\lambda,Z}\\colon\\overline{LX}_\\lambda\\hookrightarrow Z$ be the closed embedding of an orbit closure contained in it. Then $!$-restriction along the induced morphism of **quotient prestacks**\n\n$$\nK\\backslash\\overline{LX}_\\lambda\\longrightarrow K\\backslash Z\n$$\n\nsends $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c\\left(K\\backslash\\overline{LX}_\\lambda\\right)$, coherence being that of the entry [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html).\n\n## Where the argument stalls\n\nStep 4 of the write-up needs exactly the display above and cites nothing that reaches it.\n\nThe draft proposed that **either** of two existing entries would discharge it. The referee checked both and rejected the first on three counts, of which the first is the one that generalises:\n\n**Wrong category.** The statement to be discharged is about the quotient prestacks $K\\backslash Z$ and $K\\backslash\\overline{LX}_\\lambda$. The proposed entry is about **ind-schemes**. Coherence on $K\\backslash Y$ is defined by smooth tests *of the stack*, and the projection $Y\\rightarrow K\\backslash Y$ is not among them, because $Y$ is not of finite type. So an ind-scheme-level statement does not transfer, and the appendix says as much in as many words in two separate entries — for instance [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../../appendix/bb-raskin-fp-pushforward.html), whose own hypotheses are about ind-schemes and never about their quotients.\n\nThis is the general shape of the trap, and it is worth stating for whoever writes the entry: **a fact about the space is not a fact about the quotient stack.** The bridge is smooth descent along a test, and it has to be part of the statement rather than assumed to be free.\n\nThe second proposed entry is closer but was not checked in the round; treat it as a lead, not as settled.\n\n## What to deliver\n\nTwo items. The second exists because the first, stated carelessly, is the trap above.\n\n1. **`new entry` — coherence-preservation along a closed embedding, at stack level.** State the display in the `## Statement` section above as a theorem, with hypotheses that are actually about $K\\backslash Z$ and $K\\backslash\\overline{LX}_\\lambda$ and not about $Z$ and $\\overline{LX}_\\lambda$. Say precisely what is required of $K$ (affine? pro-smooth? placid?) and of the embedding (finitely presented? of finite type after a chart?). If the honest statement needs a hypothesis this node cannot supply, **say so and stop** — that answer sends the node to `/update` for a corrected statement, which is more useful than an entry that quietly assumes what it should prove.\n\n2. **`new entry` or `amends` — the descent bridge, whichever the source supports.** Whatever carries item 1 from the scheme level to the stack level: that coherence on $K\\backslash Y$, defined by smooth finite-type tests, may be checked on a chart, and that a closed embedding of the quotients restricts to one on charts. If an entry already in `blueprint/appendix/5-sheaf-theory/` states this, do not duplicate it — name it and say why it reaches, since the referee's objection was precisely that the entries offered do not.\n\n**Do not accept an ind-scheme-level statement for either item.** That is the defect this gap exists to record.\n\n## Rules\n\n**Read locally first.** The source PDFs are in `papers/`, indexed by `papers/guideline.md`. Open the PDF before relying on memory and before searching the web. If the source is not on disk, say so and record what page-level check is owed rather than asserting the statement as verified.\n\n**One file per object**, at `blueprint/appendix/5-sheaf-theory/<anchor>.md`, opening with `# <a id=\"anchor\"></a> <title>`.\n\n**Every entry carries**: the statement in full; a `role:` line; a `hypotheses:` line saying what the source actually requires and which hypothesis does the work; a `used by:` line; and a **dictionary note** reconciling the source's conventions with this repository's — which functor is which, which category is which, what base field, and whether the transfer is automatic or declared. Model the shape on `blueprint/appendix/5-sheaf-theory/bb-htt-holonomic-shriek.md`.\n\n**Citations.** Only bib keys present in `refs.bib`. If the source has no key, carry the full bibliographic data in prose and say the key is absent.\n\n**Markdown, not LaTeX.** Standard KaTeX only, no house macros. Display math in `$$ … $$` blocks with a blank line either side.\n\n**Stop rather than paper over.** If item 1 is false at stack level without a hypothesis this node does not have, that is the finding, and it is worth more than an entry that hides it.\n";</script>
