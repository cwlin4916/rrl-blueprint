<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L3 — Costalk restriction preserves coherence and induces continuous functors\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html), [placidity](../../../../appendix/placid-ind-scheme.html); [Q1-L4](../../Q1-L4/index.html), not invoked — see the closing disclosure.\n- **notation:** a *test* of a prestack $\\mathcal{Y}$ is a smooth $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a finite-type dg-scheme ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), ratified reading); $\\overline{\\imath}_{\\lambda,Z}$, $\\jmath_\\lambda$ are the closed and open halves of $i_{\\lambda,Z}$, each map standing also for its $K$-quotient.\n\n## Lemma\n\nLet $Z\\subseteq LX$ be a closed $K$-stable sub-ind-scheme which is a union of orbit closures $\\overline{LX}_\\mu$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — for instance a single $\\overline{LX}_\\mu$, a finite union, or $LX$ itself via the presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html). For $LX_\\lambda\\subseteq Z$ let $i_{\\lambda,Z}\\colon LX_\\lambda\\hookrightarrow Z$ denote the locally closed embedding through which $i_\\lambda$ factors, so $i_{\\lambda,LX}=i_\\lambda$. Then:\n\n1. $!$-restriction along $i_{\\lambda,Z}$ sends $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c(K\\backslash LX_\\lambda)$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html));\n\n2. consequently its ind-extension\n\n   $$\n   i_{\\lambda,Z}^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash Z)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n   $$\n\n   is a continuous exact functor ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) whose restriction to compact objects is the $!$-restriction of clause 1.\n\nFor $Z=LX$ this realizes the induced functor $i_\\lambda^!$ of [Q1-L5](../index.html) and discharges its first recollement hypothesis: each $i_\\lambda^!$ is continuous.\n\n## Proof\n\n**Step 1 — $i_{\\lambda,Z}$ factors as an open embedding followed by a closed one.**\n\n<details><summary>the argument</summary>\n\n$Z$ is closed in $LX$ and contains $LX_\\lambda$, hence contains its closure $\\overline{LX}_\\lambda$, and the factorization $i_\\lambda=\\overline{i}_\\lambda\\circ j_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) restricts to\n\n$$\ni_{\\lambda,Z}\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{\\imath}_{\\lambda,Z}\\ } Z .\n$$\n\nHere $\\overline{\\imath}_{\\lambda,Z}$ is a closed embedding, factoring the closed $\\overline{i}_\\lambda$ through the monomorphism $Z\\hookrightarrow LX$. All maps are $K$-equivariant, so functoriality of $\\mathcal{D}^!$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)) gives $i_{\\lambda,Z}^!=\\jmath_\\lambda^!\\circ\\overline{\\imath}_{\\lambda,Z}^!$ on quotient prestacks.\n\n</details>\n\n**Step 2 — $\\overline{\\imath}_{\\lambda,Z}$ is finitely presented, uniformly in $Z$.**\n\n<details><summary>the argument</summary>\n\nInside $LX$, $\\overline{LX}_\\lambda=\\overline{LX}_\\lambda\\times_{LX}Z$, so $\\overline{\\imath}_{\\lambda,Z}$ is the base change of $\\overline{i}_\\lambda$ along $Z\\hookrightarrow LX$; and $\\overline{i}_\\lambda$ is finitely presented by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)**(a)**(1), finite presentation being base-change stable. No induction over the union occurs: $Z=LX$ is not distinguished from a single closure.\n\n</details>\n\n**Step 3 — the open half sends $\\mathcal{D}_c(K\\backslash\\overline{LX}_\\lambda)$ into $\\mathcal{D}_c(K\\backslash LX_\\lambda)$.**\n\n<details><summary>the argument</summary>\n\n$\\jmath_\\lambda$ is representable by open embeddings: an affine test $T\\rightarrow K\\backslash\\overline{LX}_\\lambda$ is a $K$-torsor $P\\rightarrow T$ with equivariant $\\phi\\colon P\\rightarrow\\overline{LX}_\\lambda$, and the fibre product with $K\\backslash LX_\\lambda$ is the quotient of the $K$-stable open $\\phi^{-1}(LX_\\lambda)$, descending along $P\\rightarrow T$ to an open of $T$. So $\\jmath_\\lambda$ is smooth, and for a test $g\\colon S\\rightarrow K\\backslash LX_\\lambda$ the composite $\\jmath_\\lambda\\circ g$ is a test of $K\\backslash\\overline{LX}_\\lambda$ with $g^!\\jmath_\\lambda^!\\mathcal{G}\\simeq_{\\mathcal{D}(S)}(\\jmath_\\lambda g)^!\\mathcal{G}$.\n\n</details>\n\n**Step 4 — the closed half is not reached by the closed world.**\n\n<details><summary>the argument</summary>\n\n**GAP:** clause 1 still needs that $\\overline{\\imath}_{\\lambda,Z}^!$ sends $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c(K\\backslash\\overline{LX}_\\lambda)$. Step 3's mechanism does not adapt: a closed embedding is not smooth, so $\\overline{\\imath}_{\\lambda,Z}\\circ h$ is no test of $K\\backslash Z$ for a test $h$ of $K\\backslash\\overline{LX}_\\lambda$, and [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) constrains an object only along tests. Either of two entries would discharge it: that $!$-restriction along a finitely presented closed embedding of $K$-placid ind-schemes ([placidity](../../../../appendix/placid-ind-scheme.html)) preserves coherence; or that every test of $K\\backslash\\overline{LX}_\\lambda$ is, after a smooth surjective base change, the pullback along $\\overline{\\imath}_{\\lambda,Z}$ of a test $\\tilde h\\colon\\tilde S\\rightarrow K\\backslash Z$. The second suffices: the base change $c\\colon\\tilde S\\times_{K\\backslash Z}(K\\backslash\\overline{LX}_\\lambda)\\rightarrow\\tilde S$ is a finitely presented closed embedding of finite-type dg-schemes (Step 2), $h^!\\overline{\\imath}_{\\lambda,Z}^!\\mathcal{F}\\simeq_{\\mathcal{D}(S)}c^!\\tilde h^!\\mathcal{F}$, and $c^!$ preserves coherence on finite-type schemes.\n\n</details>\n\n**Step 5 — clause 1, granting Step 4.**\n\n<details><summary>the argument</summary>\n\nCompose Step 4 with Step 3 along Step 1's factorization.\n\n</details>\n\n**Step 6 — $\\mathcal{D}_c(\\mathcal{Y})$ is thick in $\\mathcal{D}(\\mathcal{Y})$, for every prestack $\\mathcal{Y}$.**\n\n<details><summary>the argument</summary>\n\n$\\mathcal{D}^!$ takes values in $\\mathrm{DGCat}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)), so each $f^!$ is exact and preserves retracts; on a finite-type, hence Noetherian, $S$ the finite complexes with coherent cohomology are closed under shifts, cofibres and retracts. The intersection of their preimages under the tests is therefore stable and retract-closed, and essentially small since [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) forms $\\mathrm{Ind}$ of it.\n\n</details>\n\n**Step 7 — the ind-extension exists and restricts to clause 1's functor.**\n\n<details><summary>the argument</summary>\n\nBy Steps 5 and 6, $F:=i_{\\lambda,Z}^!|_{\\mathcal{D}_c(K\\backslash Z)}$ is an exact functor of small stable categories, a restriction of the exact $i_{\\lambda,Z}^!$ to thick subcategories. Its ind-extension is the unique filtered-colimit-preserving $\\mathrm{Ind}(F)\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash Z)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ with $\\mathrm{Ind}(F)|_{\\mathcal{D}_c(K\\backslash Z)}\\simeq_{\\mathrm{Fun}}F$.\n\n</details>\n\n**Step 8 — that restriction is the restriction to compact objects.**\n\n<details><summary>the argument</summary>\n\nFor $\\mathcal{C}$ small, stable and idempotent-complete, $(\\mathrm{Ind}\\,\\mathcal{C})^{\\omega}\\simeq\\mathcal{C}$; Step 6 applies it to $\\mathcal{C}=\\mathcal{D}_c(K\\backslash Z)$. This is compactness in $\\mathcal{D}^{\\mathrm{ren}}$; in $\\mathcal{D}(\\mathcal{Y})$ the note to [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) separates compactness from coherence.\n\n</details>\n\n**Step 9 — $\\mathrm{Ind}(F)$ is exact.**\n\n<details><summary>the argument</summary>\n\nFinite colimits in $\\mathrm{Ind}\\,\\mathcal{C}$ are filtered colimits of finite colimits formed in $\\mathcal{C}$; $F$ preserves the latter (Step 7) and $\\mathrm{Ind}(F)$ the former.\n\n</details>\n\n**Step 10 — $\\mathrm{Ind}(F)$ is continuous.**\n\n<details><summary>the argument</summary>\n\nIn a stable presentable category every small colimit is a filtered colimit of finite ones, and $\\mathrm{Ind}(F)$ preserves both (Steps 7 and 9). At $Z=LX$, $i_{\\lambda,LX}=i_\\lambda$, so this is the induced $i_\\lambda^!$ of [Q1-L5](../index.html). $\\blacksquare$\n\n</details>\n\n## Caveats\n\n*Which clause of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).* Every step uses clause **(a)** alone, through Step 2. Clause **(b)** is used once and outside the proof: it puts $Z=LX$ among the admissible $Z$, and for general spherical $X$ rests on main.tex:772, not on a page of the source — Proposition 39 (p. 23) is deduced from Theorem 36 with Lemma 38 (p. 22), whose proof assumes $G^\\theta$ connected, and Remark 37 extends Theorem 36 only.\n\n*The GAP is not a formality.* Where a prestack's tests fail to reach a non-open stratum, [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) imposes no condition there.\n\n*Dependency disclosure.* No clause of [Q1-L4](../../Q1-L4/index.html) — (i), (ii) or (iii) — is used above; the argument nowhere passes to the stratum stabilizer or its finite-type quotient. Q1-L4 would enter only in discharging Step 4.\n";</script>
