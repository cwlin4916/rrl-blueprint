<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L3</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L3 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L5-L3-L3\n\n[node](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [papers](../../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L5-L3-L3](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies believing or\ndoubting the statement and no proof may cite it.\n\nThe statement has three pieces, and every finding below names which one it touches: **(H)** the\nsetting — $Z\\subseteq LX$ a closed $K$-stable union of orbit closures, $Z=LX$ allowed; **(A)** the\nstep hypothesis, that some finite union $Y$ with $\\overline{LX}_\\lambda\\subseteq Y\\subseteq Z$ has\nevery smooth finite-type test of $K\\backslash Y$ remain smooth after composition with\n$K\\backslash Y\\rightarrow K\\backslash Z$; **(C)** the conclusion, that $\\overline{\\imath}_{\\lambda,Z}^!$\ncarries $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c(K\\backslash\\overline{LX}_\\lambda)$.\n\n**The dictionary.** Entries 3 and 4 are analogues, not instances. Three lines, and the third is the\nloose one.\n\n- **D1 — \"smooth\" means pro-smooth.** Chen–Yi, Appendix A.1(3) (p. 53) defines $f\\colon X\\rightarrow Y$\n  *pro-smooth* when étale-locally $X\\cong\\varprojlim_jX_j$ over $Y$ with all $X_j\\rightarrow Y$ smooth\n  finitely presented and all transitions smooth, finitely presented, affine; A.1(8) (p. 54) extends this\n  to stacks through coverings. Their **footnote 8** (p. 54) is the sourced half: \"In [BKV11, Section\n  1.3.1 (c)] and [FKV10, Section 1.2 (b)], the authors used the term *smooth morphisms* for our\n  pro-smooth morphisms.\"\n- **D2 — $K\\backslash Z$ is a placid ind-stack.** Chen–Yi A.1(7) (p. 54): a stack is placid if it has a\n  pro-smooth representable covering by a placid scheme, an ind-stack if it is a colimit of those along\n  finitely presented representable closed embeddings, and \"the quotient stack $\\mathcal{Y}\\cong H\\backslash Y$\n  of an $H$-placid ind scheme $Y$ is an example of placid ind-stack\". With\n  [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)**(b)** this is $K\\backslash LX$ verbatim.\n- **D3 — $\\mathcal{D}_c$ against the $\\ell$-adic constructible category.** Chen–Yi A.5 (p. 58) is\n  $\\overline{\\mathbb{Q}}_\\ell$-linear over $k=\\overline{\\mathbb{F}}_p$; the blueprint is de Rham in\n  characteristic $0$. **This line is not in print and I am extending it myself.** What it drops:\n  constructible complexes correspond to *regular holonomic* $\\mathcal{D}$-modules, a proper subcategory\n  of the coherent ones, and the note to [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)\n  separates coherent from compact on stacks. Raskin's Remark 1.7.1 (p. 2) licenses only the reverse\n  traffic, and only for the holonomic theory.\n\n## Precedent\n\n**What was searched.** The local library, for what a *smooth test* of an infinite-type quotient means\nand for coherence-preservation under $!$-restriction: `raskin_dmodules_infinite_var` §§4.2, 4.5, 4.9–4.11,\n6.2–6.9; `zhu2025tamecategoricallocallanglands` §10.5 (pp. 371–378); `chenyi_2025singularitiesorbitclosuresloop`\nv4 Appendix A (pp. 53–60), the natural home since it is the paper the setting comes from;\n`mirkovic2007geometric` p. 4 for the group case. The tree's own reading was read alongside —\n[Q1-L4-L4](../../../Q1-L4/Q1-L4-L4/proof.html) Step 5 (B1) and its Caveat, and Flaw 1 of\n[r1](../critiques/r1.html). `bouthier_kazhdan_varshavsky_2022perversesheavesinfinitedimensionalstacks`\n(arXiv:2003.01428) is in `refs.bib` but **not on disk**; it was reached only through Chen–Yi's footnote 8,\nso nothing is claimed from its own pages.\n\n**What was found.**\n\n1. *The reading question is settled, and in favour of the loose reading.* Chen–Yi footnote 8 (p. 54)\n   states that BKV and FKV write \"smooth morphism\" for what Chen–Yi call pro-smooth. This touches the\n   word \"smooth\" inside **(A)** and inside\n   [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), and it says the pro-smooth\n   reading is the standard one in exactly this setting. It does **not** touch **(C)**, and it does not\n   by itself make **(A)** true — see item 3.\n\n2. *The conclusion **(C)** has a full analogue in print, with no analogue of **(A)**.* Chen–Yi A.5(2)\n   (p. 58) *defines* the constructible category of a placid ind-stack $\\mathcal{Y}\\cong\\mathrm{colim}_i\\mathcal{Y}^i$\n   as $D(\\mathcal{Y})=\\mathrm{colim}_{i,!}D(\\mathcal{Y}^i)$ along $!$-pushforward on the steps, with a\n   $!$-version $D_!(\\mathcal{Y})$; A.5(3) then gives $f_*,f_!,f^*,f^!$ between these categories for every\n   *finitely presented representable* morphism of placid **stacks**. Under D1–D3,\n   $\\overline{\\imath}_{\\lambda,Z}$ is such a morphism by\n   [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)**(a)**, and an object of the ind-stack category\n   lives on a step by A.5(2)'s definition, so **(C)** follows at every step — with no hypothesis of the\n   shape of **(A)**, because membership on a step is definitional there and not hypothetical. The one\n   loose joint: A.5(3) is stated for placid stacks and the ind-stack case is left to the colimit, so the\n   passage to $Z=LX$ is one sentence the source does not write out.\n   Zhu says the same for quasi-placid stacks twice: p. 373, \"By definition, the constructible categories\n   are preserved by $!$-pullback along any morphism\", and p. 377, \"$f^!$ always preserves constructible\n   subcategories\"; his Ex. 10.117 (p. 372) puts $K\\backslash\\overline{LX}_\\lambda$ in the class. Neither\n   source reaches coherent $\\mathcal{D}$-modules (D3), so this is an analogue and not a precedent.\n\n3. *Nothing found discharges **(A)**, and the sources push against it.* Chen–Yi's preamble to Lemma 101\n   (p. 56) records that \"a smooth morphism $f\\colon X\\rightarrow Y$ is an open morphism, in particular\n   the image $f(X)\\subset Y$ has non-empty intersection with any open dense subset\", and Lemma 101 extends\n   the conclusion to placid morphisms; pro-smooth morphisms are formally smooth (their Lemma 95, p. 54).\n   A composite $S\\rightarrow K\\backslash Y\\rightarrow K\\backslash Z$ with $Y\\subsetneq Z$ has image inside\n   a closed substack meeting no stratum outside $Y$, so on the strict *and* on the pro-smooth reading it\n   is not smooth unless $S$ is empty. **(A)** with $Y\\subsetneq Z$ therefore holds only vacuously — only\n   if $K\\backslash Y$ admits no non-empty test at all, which is the collapse the node's history flags.\n   This is my inference from the cited statements, not a published result.\n\n**What was not found.** No source defines coherence on an infinite-type prestack by quantifying over\n*all* smooth finite-type tests. Raskin never introduces $\\mathcal{D}_c$ on a prestack at all — he works\nwith compact objects and, for a reasonable ind-scheme, with (6.5.1), $D^!(T)=\\mathrm{colim}_iD^!(T_i)$\nalong $\\alpha_{*,!-dR}$ (p. 35, Def. 6.4.1 p. 34) — and both Zhu (§10.5.2, p. 373: constructible iff\nconstructible on \"some, equivalently any\" quasi-placid atlas) and Chen–Yi (A.5(2)) test on **one atlas**.\nThat is the informative absence: the two published frameworks replace the universal quantifier by an\natlas precisely so that no hypothesis of the shape of **(A)** is ever needed, and **(A)** is the price\n[coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) charges for not doing that.\n\n## Instances\n\n### 1. The point — instance\n\n**What it is.** $X=\\mathrm{pt}$, any $G$; $LX=\\mathrm{pt}=\\overline{LX}_0$, $K\\backslash LX=BL^+G$,\n$Z=LX$, $\\lambda=0$.\n\n**Why it is an instance.** **(H)**: $\\mathrm{pt}$ is smooth affine spherical and $LX$ is the single orbit\nclosure, so [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)**(b)** is trivial here. **(A)**: $Z$ is a\nfinite union, so $Y=Z$ meets it by the statement's own rider.\n\n**What it matches.** **(A)** through its rider and **(C)**; it does not reach the ind-direction of **(H)**,\nwhich is the whole difficulty.\n\n**What the statement says here.** $\\overline{\\imath}$ is the identity of $BL^+G$ and **(C)** is vacuous.\n\n**Source.** `BZSV` §7.6.3, p. 169; register entry [K2](../../../../../key_examples/k2.html).\n\n### 2. Schubert closures inside a Schubert closure — instance\n\n**What it is.** $X=G$ under $G\\times G$, so $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ and the\nstrata are the $\\mathrm{Gr}_\\nu$. Take $Z=Y=\\overline{\\mathrm{Gr}}_\\mu$ and $\\lambda=\\nu\\leq\\mu$.\n\n**Why it is an instance.** **(H)**: $\\overline{\\mathrm{Gr}}_\\mu=\\bigsqcup_{\\nu\\leq\\mu}\\mathrm{Gr}_\\nu$ is a\nsingle reduced orbit closure, Mirković–Vilonen (2.2), p. 4. **(A)**: $Y=Z$, the rider again. The test\ncategory is genuine here and not a convention: $\\mathrm{Gr}=\\varinjlim\\mathcal{G}r_n$ with the\n$\\mathcal{G}r_n$ finite dimensional and \"$G_\\mathcal{O}$ acts on the $\\mathcal{G}r_n$ via a finite\ndimensional quotient\" (MV p. 4, with (2.1)), so $K\\backslash\\overline{\\mathrm{Gr}}_\\mu$ is an algebraic\nstack of finite type up to a pro-unipotent kernel and carries honest finite-type smooth atlases.\n\n**What it matches.** **(C)** in the one case where every hypothesis is discharged and the conclusion has\ncontent: it is the classical fact that $i^!$ preserves $D^b_{\\mathrm{coh}}$ along a closed immersion of\nfinite-type stacks. It reaches **(A)** only through the rider, so it says nothing about the case the\nparent needs.\n\n**What the statement says here.** $!$-restriction $\\mathcal{D}_c(L^+G\\backslash\\overline{\\mathrm{Gr}}_\\mu)\n\\rightarrow\\mathcal{D}_c(L^+G\\backslash\\overline{\\mathrm{Gr}}_\\nu)$ is well defined.\n\n**Source.** `mirkovic2007geometric`, p. 4, (2.1) and (2.2) (read 2026-08-06). `refs.bib`: present.\n\n### 3. The affine Grassmannian itself — analogue, and the boundary case\n\n**What it is.** The same $X=G$, but $Z=\\mathrm{Gr}$ and $\\lambda=\\mu$: the ind-scheme ambient, which is\nthe case Flaw 1 of [r1](../critiques/r1.html) isolates as substantive.\n\n**Why it is (only) an analogue.** **(H)** is satisfied literally. **(C)** is true and standard — under D3,\n$D(L^+G\\backslash\\mathrm{Gr})=\\mathrm{colim}_\\mu D(L^+G\\backslash\\overline{\\mathrm{Gr}}_\\mu)$ by Chen–Yi\nA.5(2), so a constructible object lives on a step and its $!$-restriction is computed there. **(A) is not\ndischarged**, by anything: no finite union $Y\\subsetneq\\mathrm{Gr}$ has its tests become tests of\n$\\mathrm{Gr}$, by Precedent item 3.\n\n**What it matches.** **(C)** at $Z$ an ind-scheme, under D1–D3; and it matches **(A)** *negatively* — the\nconclusion holds here for a reason **(A)** does not supply. It does not reach coherent-but-not-holonomic\nobjects.\n\n**What the statement says here.** $\\overline{\\imath}_\\mu^!$ sends $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$\ninto $\\mathcal{D}_c(L^+G\\backslash\\overline{\\mathrm{Gr}}_\\mu)$ — true, and provable without **(A)**.\n\n**Source.** `chenyi_2025singularitiesorbitclosuresloop` v4, A.1(7) p. 54 and A.5(2)–(3) p. 58;\n`raskin_dmodules_infinite_var` (6.5.1), p. 35 (read 2026-08-06). `refs.bib`: both present.\n\n### 4. Infinite codimension — analogue, showing finite presentation is load-bearing\n\n**What it is.** A closed embedding $f\\colon S\\rightarrow T$ of placid schemes of **infinite** codimension —\nthe hypothesis [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)**(a)** rules out for\n$\\overline{\\imath}_{\\lambda,Z}$.\n\n**Why it is an analogue.** Raskin Warning 4.9.2 (p. 23): for such an $f$, $f_{*,\\mathrm{ren}}$ \"does not\npreserve compact objects and therefore does not admit a continuous right adjoint at all\", and\n\"$f^!f_{*,\\mathrm{ren}}$ is typically zero\".\n\n**What it matches.** Not **(C)** directly — the warning is about $f_{*,\\mathrm{ren}}$ — but it shows the\nfinite presentation clause of **(H)** doing real work in this exact category, and it is the direction in\nwhich a careless generalization of **(C)** fails.\n\n**What the statement says here.** Nothing: the hypothesis fails, so the node does not apply.\n\n**Source.** `raskin_dmodules_infinite_var`, Warning 4.9.2, p. 23 (read 2026-08-06). `refs.bib`: present.\n\nEVIDENCE: gap\n";</script>
