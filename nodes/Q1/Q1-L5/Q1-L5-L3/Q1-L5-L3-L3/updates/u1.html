<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L5</a><i>›</i><a href="../../index.html">Q1-L5-L3</a><i>›</i><a href="../index.html">Q1-L5-L3-L3</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L3 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L3/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L5-L3-L3](../index.html) · [history](../history.html) · [DAG index](../../../../../../dag.html) · [appendix](../../../../../../appendix/index.html)\n\n**Date:** 2026-08-07 · **Operator:** `/update Q1-L5-L3-L3`, on commentary the user supplied against [Q1-L5-L3](../../index.html) · **Status before:** `open` · **Status after:** `open`\n\n## The defect, in one sentence\n\nHypothesis **(A)** — that some finite union $Y$ with $\\overline{LX}_\\lambda\\subseteq Y\\subseteq Z$ has every smooth finite-type test of $K\\backslash Y$ remain smooth after composition into $K\\backslash Z$ — holds only when $Y$ is a union of connected components of $Z$, so it is satisfied in exactly the one case the statement already names as trivial ($Y=Z$) and fails for every proper step, which is the case the hypothesis was written to supply.\n\n## The failing case, recomputed this run\n\n$K\\backslash Y\\rightarrow K\\backslash Z$ is induced by the closed embedding $Y\\hookrightarrow Z$, so it is a closed immersion. Smoothness may be checked after a smooth surjective base change on the source, and the smooth finite-type tests of $K\\backslash Y$ are jointly surjective — they must be, or [coherent $\\mathcal{D}$-modules](../../../../../../appendix/defn-coherent-d-mod.html) would impose no condition on $K\\backslash Y$ at all. So **(A)** says precisely that this closed immersion is smooth.\n\nA smooth morphism is flat, and a flat closed immersion of finite presentation is an open immersion. Hence $Y$ is open and closed in $Z$: a union of connected components.\n\nThe one-line scheme shadow, which needs none of the above and is what makes the failure concrete. Take $Y=\\{0\\}\\hookrightarrow Z=\\mathbb{A}^1$. The identity\n\n$$\n\\operatorname{Spec}k \\longrightarrow \\{0\\}\n$$\n\nis a smooth test of the source — it is an isomorphism — and its composite $\\operatorname{Spec}k\\rightarrow\\mathbb{A}^1$ is not smooth, not being flat. A single test defeats the hypothesis, with no covering argument needed.\n\nApplied here: $Z=LX$ and $Y$ a finite union of orbit closures is a proper closed step whenever the orbit poset is infinite, which is the standing situation — so **(A)** is unavailable in exactly the configuration [Q1-L5-L3](../../index.html) needs, namely $Z=LX$ through the presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html).\n\n## The three columns\n\n**Verified.**\n\nThe argument above, recomputed from the definition of a flat closed immersion and not taken from the commentary. It is standard mathematics needing no citation, so it invokes nothing outside the closed world.\n\nThat the statement's own escape clause is the degenerate case of it: \"when $Z$ is itself the union of a finite set of orbit closures, $Y = Z$ meets this\" is the instance $Y=Z$, where the composite is the identity. So the hypothesis was true only where it did no work.\n\nThat the parent quantifies over the case now lost. [Q1-L5-L3](../../index.html)'s Setup reads \"a single $\\overline{LX}_\\mu$, a finite union, **or $LX$ itself** via the presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../../../../appendix/thm-chen-ti.html)\", so restricting this node to finite $Z$ leaves the parent's third case unsupplied. Recorded on the parent rather than hidden here.\n\n**Refuted.**\n\nHypothesis **(A)** as a mechanism for passing from a finite stage to $LX$. Not merely unproved — false for every proper step that is not a union of connected components.\n\n**Unverified, and therefore NOT asserted in the new statement.**\n\nThe replacement the commentary proposes — a covering family of Cartesian charts $H_\\alpha\\backslash S_\\alpha\\rightarrow K\\backslash\\overline{LX}_\\lambda$ over $H_\\alpha\\backslash\\widetilde S_\\alpha\\rightarrow K\\backslash Z$, with $H_\\alpha$ affine of finite type, $\\widetilde S_\\alpha$ smooth of finite type with finitely many $H_\\alpha$-orbits, and $S_\\alpha\\hookrightarrow\\widetilde S_\\alpha$ closed and $H_\\alpha$-stable. It is the right shape and it is a new claim, so it is commissioned rather than substituted: writing it into this node would replace one unestablished hypothesis with another under cover of a revision.\n\nWhether the charts exist. The commentary reports finding no such theorem in Chen–Yi, Sakellaridis–Wang or Raskin, and this run did not verify that survey; what *is* on record here is [Q1-L5-L3-L2](../../Q1-L5-L3-L2/index.html), which is the repository's own statement of the chart-construction problem and is `open`.\n\n## What changed\n\n$Z$ is restricted to a **finite** union of orbit closures, and hypothesis **(A)** is deleted rather than repaired — at finite $Z$ it was the identity step and carried nothing.\n\nA closing paragraph names what the node no longer reaches: $Z=LX$, and why no hypothesis of this shape can supply it.\n\nThe conclusion, the ambient conventions and the objects are untouched.\n\n## Considered and not adopted\n\n**Keeping (A) and marking it doubtful.** A hypothesis that is false except in the trivial case is not a hypothesis, it is a way of stating a theorem about the trivial case while appearing to state more. Deleting it makes the node's reach visible on the DAG, which is what [Q1-L5-L3](../../index.html) needs in order to see that its $Z=LX$ case is unsupplied.\n\n**Substituting the chart hypothesis directly.** Rejected above: it is a new claim, and this run verified the defect, not the repair.\n\n**Refuting the node outright.** The conclusion is not refuted — for finite $Z$ the node is a reasonable statement with an argument route through [Q1-L5-L3-L1](../../Q1-L5-L3-L1/index.html) and [Q1-L5-L3-L2](../../Q1-L5-L3-L2/index.html). What is refuted is one hypothesis, and a node with a false hypothesis deleted is a smaller true statement, not a dead one.\n";</script>
