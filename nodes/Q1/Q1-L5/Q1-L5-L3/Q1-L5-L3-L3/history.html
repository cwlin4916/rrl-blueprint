<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L3-L3 — history\n\n[Q1-L5-L3-L3](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by the lead-researcher, expanding [Q1-L5-L3](../index.html) after its `/prove` run failed at round 1 on the `GAP:` at Step 4 of [the draft](../proof.html). This node is the assembly: it states the missing fact of Flaw 1 of [r1](../critiques/r1.html) in the parent's own generality — every admissible $Z$, the parent's clause 1 minus its open half — and it is the one the parent's Step 4 will cite. Given hypothesis **(A)**, restriction along $Y\\hookrightarrow Z$ lands a coherent $\\mathcal{F}$ in $\\mathcal{D}_c(K\\backslash Y)$ because every test of $K\\backslash Y$ has become a test of $K\\backslash Z$, and [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) applied to the family of [Q1-L5-L3-L2](../Q1-L5-L3-L2/index.html) carries it from $K\\backslash Y$ to $K\\backslash\\overline{LX}_\\lambda$; the two restrictions compose to $\\overline{\\imath}_{\\lambda,Z}^!$.\n\n  **Why (A) is a hypothesis and not a claim.** [r1](../critiques/r1.html) warns that $Z = LX$ is the substantive case and does not reduce, since $\\overline{\\imath}_{\\lambda,LX}^! = \\overline{\\imath}_{\\lambda,\\overline{LX}_\\mu}^!\\circ\\overline{\\imath}_{\\mu,LX}^!$ only relocates the problem. What the relocation exposes is a reading, not a theorem. Read smoothness of $S\\rightarrow K\\backslash Z$ in the strict sense — representable, with smooth base change along every affine test — and a finite-type $S$ maps into the ind-scheme $Z$ through a step, so its base change along a test reaching a larger step has closed non-open image and is not flat: on that reading $K\\backslash LX$ admits **no** non-empty test at all, [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) imposes nothing, and $\\mathcal{D}_c(K\\backslash LX)$ collapses to $\\mathcal{D}(K\\backslash LX)$ — which would make the parent's clause 1 false rather than hard. Read it in the ind-sense the tree already uses elsewhere — [Q1-L4-L4](../../../Q1-L4/Q1-L4-L4/proof.html) computes the base change of $Q\\rightarrow\\mathrm{pt}\\rightarrow BH$ as the pro-smooth $Q\\times H\\rightarrow Q$ and calls it smooth, recording in its Caveats that \"*smoothness to a prestack* is in no entry\" — and **(A)** holds. The hypothesis is the exact quantum of that reading this node consumes, stated so that it travels with every use instead of being assumed silently, which is what Flaw 4(ii) and Flaw 7 of [r1](../critiques/r1.html) faulted the round-1 draft for. Fixing the reading itself is a ratification: a note on the appendix entry and a decision record, which is `/update`'s or the user's to make, not this node's.\n\n  **Which sibling clauses it also serves.** At $Z = LX$ the conclusion is verbatim clause 1 of [Q1-L5-L6](../../Q1-L5-L6/index.html) — \"$!$-restriction along $\\overline{i}_\\mu$ sends $\\mathcal{D}_c(K\\backslash LX)$ into $\\mathcal{D}_c(K\\backslash\\overline{LX}_\\mu)$\" — with $\\mu$ for $\\lambda$, and it is the input clause 3 of [Q1-L5-L4](../../Q1-L5-L4/index.html) needs on the restriction side of its adjunction. No edge to either is drawn here: this expansion is [Q1-L5-L3](../index.html)'s alone, and there is no `blocked` ([ADR 0045](../../../../../process/decisions/0045-there-is-no-blocked-node.html)), so an unproved dependency stops nothing.\n- **2026-08-07 — hypothesis (A) deleted as false, and $Z$ restricted to a finite union** ([u1](updates/u1.html)). `/update Q1-L5-L3-L3`, on commentary the user supplied against [Q1-L5-L3](../index.html). (A) asked that some finite union $Y$ with $\\overline{LX}_\\lambda\\subseteq Y\\subseteq Z$ have every smooth finite-type test of $K\\backslash Y$ stay smooth into $K\\backslash Z$. Recomputed this run: that map is a closed immersion, the tests are jointly surjective — they must be, or [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) imposes nothing on the source — so (A) says the closed immersion is smooth, hence flat, hence open; $Y$ is then a union of connected components of $Z$. The scheme shadow needs no covering argument at all: $\\operatorname{Spec}k\\rightarrow\\{0\\}$ is a smooth test and $\\operatorname{Spec}k\\rightarrow\\mathbb{A}^1$ is not smooth. So (A) was satisfiable in exactly the case the statement itself called trivial, $Y=Z$, and failed for every proper step — which is the step it existed to license. The node now states what it can support: $Z$ a finite union, no (A), conclusion unchanged, and a closing paragraph naming $Z=LX$ as what it no longer reaches.\n- **2026-08-07 — what was not adopted from the same commentary.** It proposes replacing (A) with a covering family of Cartesian charts $H_\\alpha\\backslash S_\\alpha\\rightarrow K\\backslash\\overline{LX}_\\lambda$ over $H_\\alpha\\backslash\\widetilde{S}_\\alpha\\rightarrow K\\backslash Z$, with $H_\\alpha$ affine of finite type, $\\widetilde{S}_\\alpha$ smooth of finite type with finitely many orbits, and $S_\\alpha\\hookrightarrow\\widetilde{S}_\\alpha$ closed and stable. That is the right shape and it is a **new claim**, so it is commissioned and not substituted: swapping one unestablished hypothesis for another inside a revision is how a statement gets weaker without anybody noticing. The repository's own version of the chart-construction problem is [Q1-L5-L3-L2](../Q1-L5-L3-L2/index.html), which is `open`, and that is where the claim belongs.\n";</script>
