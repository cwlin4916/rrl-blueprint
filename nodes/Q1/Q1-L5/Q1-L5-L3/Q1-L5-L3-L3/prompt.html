athcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../../../Q1-L3/index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../../key_examples/k4.html), the symplectic period [K6](../../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../../key_examples/k9.html); and [K6](../../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It refines [Q1-L5-L3](../index.html). Its conclusion is required directly by [Q1-L5-L3](../index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-07 — what was not adopted from the same commentary.** It proposes replacing (A) with a covering family of Cartesian charts $H_\\alpha\\backslash S_\\alpha\\rightarrow K\\backslash\\overline{LX}_\\lambda$ over $H_\\alpha\\backslash\\widetilde{S}_\\alpha\\rightarrow K\\backslash Z$, with $H_\\alpha$ affine of finite type, $\\widetilde{S}_\\alpha$ smooth of finite type with finitely many orbits, and $S_\\alpha\\hookrightarrow\\widetilde{S}_\\alpha$ closed and stable. That is the right shape and it is a **new claim**, so it is commissioned and not substituted: swapping one unestablished hypothesis for another inside a revision is how a statement gets weaker without anybody noticing. The repository's own version of the chart-construction problem is [Q1-L5-L3-L2](../Q1-L5-L3-L2/index.html), which is `open`, and that is where the claim belongs.\n\n## Target statement\n\nLet $K = L^+G$ ([the standing notation](../../../../../appendix/subsec-notations.html)) and let $Z\\subseteq LX$ be a closed $K$-stable sub-ind-scheme which is the union of a **finite** set of orbit closures of [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html), taken reduced as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html) — a single $\\overline{LX}_\\mu$, or a finite union of them. Fix $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) with $LX_\\lambda\\subseteq Z$ and let $\\overline{\\imath}_{\\lambda,Z}\\colon\\overline{LX}_\\lambda\\hookrightarrow Z$ be the induced closed embedding.\n\nThen $!$-restriction along the map $K\\backslash\\overline{LX}_\\lambda\\rightarrow K\\backslash Z$ induced by $\\overline{\\imath}_{\\lambda,Z}$ — the functor $\\overline{\\imath}_{\\lambda,Z}^!$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) — preserves coherence in the sense of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html):\n\n$$\n\\overline{\\imath}_{\\lambda,Z}^!\\mathcal{F}\\in\\mathcal{D}_c\\left(K\\backslash\\overline{LX}_\\lambda\\right) \\qquad\\text{for every }\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash Z).\n$$\n\n**What this no longer reaches.** The case $Z = LX$, which is the one [Q1-L5-L3](../index.html) consumes through the presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)**(b)**. It was previously carried by a hypothesis asking that the smooth finite-type tests of some finite stage $K\\backslash Y$ stay smooth after composition into $K\\backslash Z$; that hypothesis is false for every proper step ([u1](updates/u1.html)). The map $K\\backslash Y\\rightarrow K\\backslash Z$ is a closed immersion, the tests are jointly surjective, and a smooth closed immersion is flat and therefore open — so the hypothesis holds only when $Y$ is a union of connected components of $Z$. No hypothesis of that shape can bridge a finite stage to $LX$, and what would is a claim about finite-dimensional charts for the ambient map itself, which the repository states at [Q1-L5-L3-L2](../Q1-L5-L3-L2/index.html) and has not established.\n\n## Direct prerequisites\n\n### [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) — A covering family of closed-immersion charts transfers coherence\n\n- **current effective status:** ready\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nLet $u\\colon\\mathcal{Y}_0\\rightarrow\\mathcal{Y}$ be a morphism of prestacks, and call a *test* of a prestack $\\mathcal{W}$ a smooth morphism $S\\rightarrow\\mathcal{W}$ with $S$ a finite-type dg-scheme — the morphisms along which [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) constrains an object, read as in ratified reading 1 of [context](../../../../../context.html). Assume:\n\n**(A) Closed restriction.** For every test $\\tilde h\\colon\\tilde S\\rightarrow\\mathcal{Y}$ the fibre product $\\tilde S\\times_{\\mathcal{Y}}\\mathcal{Y}_0$ is representable by a finite-type dg-scheme and its projection to $\\tilde S$ is a closed immersion.\n\n**(B) A covering family.** There is a family of tests $\\left\\{\\tilde h_\\alpha\\colon\\tilde S_\\alpha\\rightarrow\\mathcal{Y}\\right\\}_{\\alpha\\in A}$ such that, writing\n\n$$\nS_\\alpha := \\tilde S_\\alpha\\times_{\\mathcal{Y}}\\mathcal{Y}_0, \\qquad g_\\alpha\\colon S_\\alpha\\rightarrow\\mathcal{Y}_0\n$$\n\nfor the fibre product of (A) and its projection to $\\mathcal{Y}_0$, each $g_\\alpha$ is smooth and every test $h\\colon S\\rightarrow\\mathcal{Y}_0$ admits a finite subset $A_0\\subseteq A$ for which the fibre products $S\\times_{\\mathcal{Y}_0}S_\\alpha$, $\\alpha\\in A_0$, are representable by finite-type dg-schemes and their projections to $S$ are jointly surjective.\n\n**(C) Chart-level preservation.** For every $\\alpha\\in A$, $!$-restriction along the closed immersion $c_\\alpha\\colon S_\\alpha\\hookrightarrow\\tilde S_\\alpha$ of (A) sends $\\mathcal{D}_c(\\tilde S_\\alpha)$ into $\\mathcal{D}_c(S_\\alpha)$.\n\nThen $!$-restriction along $u$ — the functor $u^!$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) — preserves coherence: $u^!\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y}_0)$ for every $\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y})$.\n\n### [Q1-L5-L3-L2](../Q1-L5-L3-L2/index.html) — Compatible finite-dimensional models for an orbit closure inside a finite union\n\n- **current effective status:** ready\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nLet $X$ be a smooth affine spherical $G$-variety and $K = L^+G$ ([the standing notation](../../../../../appendix/subsec-notations.html)), with strata and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) and closures taken reduced as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html). Fix $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) and let $Y\\subseteq LX$ be the union of a **finite** set of orbit closures with $\\overline{LX}_\\lambda\\subseteq Y$, so that $Y$ is a closed $K$-stable subscheme of $LX$ and the induced $\\overline{\\imath}_{\\lambda,Y}\\colon\\overline{LX}_\\lambda\\hookrightarrow Y$ is a closed embedding of finite presentation between $K$-stable schemes ([orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)**(a)**, [placidity](../../../../../appendix/placid-ind-scheme.html)). Call a *test* of a prestack $\\mathcal{W}$ a smooth morphism $S\\rightarrow\\mathcal{W}$ with $S$ a finite-type dg-scheme ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), ratified reading 1). Then, for the map $K\\backslash\\overline{LX}_\\lambda\\rightarrow K\\backslash Y$ of quotient prestacks induced by $\\overline{\\imath}_{\\lambda,Y}$:\n\n1. for every test $\\tilde h\\colon\\tilde S\\rightarrow K\\backslash Y$ the fibre product $\\tilde S\\times_{K\\backslash Y}\\left(K\\backslash\\overline{LX}_\\lambda\\right)$ is representable by a finite-type dg-scheme and its projection to $\\tilde S$ is a closed immersion;\n\n2. there is a family of tests $\\left\\{\\tilde h_\\alpha\\colon\\tilde S_\\alpha\\rightarrow K\\backslash Y\\right\\}_{\\alpha\\in A}$ such that, writing\n\n   $$\n   S_\\alpha := \\tilde S_\\alpha\\times_{K\\backslash Y}\\left(K\\backslash\\overline{LX}_\\lambda\\right),\n   $$\n\n   each projection $S_\\alpha\\rightarrow K\\backslash\\overline{LX}_\\lambda$ is smooth, and every test $h\\colon S\\rightarrow K\\backslash\\overline{LX}_\\lambda$ admits a finite subset $A_0\\subseteq A$ for which the fibre products $S\\times_{K\\backslash\\overline{LX}_\\lambda}S_\\alpha$, $\\alpha\\in A_0$, are representable by finite-type dg-schemes and their projections to $S$ are jointly surjective.\n\nTogether, clauses 1 and 2 are hypotheses **(A)** and **(B)** of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) for the pair $\\left(K\\backslash\\overline{LX}_\\lambda,\\ K\\backslash Y\\right)$.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the standing notation](../../../../../appendix/subsec-notations.html) — `subsec:notations`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n### [the three standing hypotheses](../../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../../appendix/conj-intro.html) holds for $X$.\n\n- **note:** (a) is exactly the conclusion of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) for $X$ smooth affine spherical, so it is not an extra restriction in that generality; it is stated as an assumption because main.tex wants it available before the sheaf-theoretic section. (b) is what makes $\\mathcal{D}^!$ and $\\mathcal{D}^*$ agree ([sheaves on a placid ind-scheme](../../../../../appendix/ex-sheaf-placid-ind.html)). (c) is the input the whole paper is conditional on.\n\n**Key spherical varieties.** The class these hypotheses carve out is abstract, so the rows below fix the concrete $(G,X)$ this project keeps in mind — simplest first, then the two instructive ways to fall out of the class. \"(c)\" is hypothesis (c) above. The rows are orientation pointers, at the user's s not discharged in those sources | [Q1-e5](../../../Q1-e5/index.html) |\n| $(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation, $Hx\\cdot g=Hxg$ for $H=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ block-diagonal | [linear periods](../../../../../appendix/exam-hyperspherical-duality.html) | **upcoming** work of Chen–Yi; the orbit geometry is already in print ([Chen–Yi orbit parametrization](../../../../../appendix/bb-chenyi-symmetric-orbits.html)) | — |\n| $\\mathrm{SO}_{n-1}\\backslash(\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n)$ | $\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n$ — right translation, $Hx\\cdot g=Hxg$, where $H=\\mathrm{SO}_{n-1}$ sits diagonally, $h\\mapsto(h,h)$, via $\\mathrm{SO}_{n-1}\\subset\\mathrm{SO}_n$ | [Gan–Gross–Prasad / theta](../../../../../appendix/exam-hyperspherical-duality.html) | **proved** — [[BFT_orthosymplectic_satake](../../../../../../papers/BFT_orthosymplectic_satake.pdf)] | — |\n| rank-$1$ affine homogeneous $X=H\\backslash G$ | various $G$ — right translation, $Hx\\cdot g=Hxg$ | [rank one](../../../../../appendix/exam-hyperspherical-duality.html) | **proved under hypotheses** — [[devalapurkar2024kutheoreticspectraldecompositionsspheres, Table 4](../../../../../../papers/devalapurkar2024kutheoreticspectraldecompositionsspheres.pdf)] | — |\n| $G/_{\\psi}U$ | $G$ — left translation through $G/U$, $g:xU\\mapsto gxU$, $U$ maximal unipotent; the twist is the generic character $\\psi$ of $U$ | [Whittaker](../../../Q1-e3/index.html) | *outside the untwisted class* — twisted polarization; the equivalence per [[BZSV, §7.6.4](../../../../../../papers/BZSV.pdf)]; kept because it supplies [ABG](../../../../../appendix/bb-abg.html) at Iwahori level | [Q1-e3](../../../Q1-e3/index.html) |\n| $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | $\\mathrm{PSL}_2$ — left translation, $g:x\\,\\mathrm{PO}_2\\mapsto gx\\,\\mathrm{PO}_2$ | [boundary case](../../../Q1-e6/index.html) | *outside the class* — a type-$N$ spherical root breaks connected stabilizers, and the expected statement itself changes shape | [Q1-e6](../../../Q1-e6/index.html) |\n\nThe first four rows are where (c) is a theorem or a verified computation — the working instances of the standing class — with the linear periods next in line. $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, the linear periods and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ are symmetric, the territory where the [Chen–Yi orbit machinery](../../../../../appendix/bb-chenyi-symmetric-orbits.html) applies and [Q1-L6](../../../Q1-L6/index.html)'s induction closes. The last two rows are kept deliberately: Whittaker for the Iwahori-level black box it supplies, and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ because it shows clause (2) of [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html) is load-bearing.\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../../../appendix/conv-d-shriek-d-star.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), ratified at [Q1-L1](../../../Q1-L1/index.html).\n\n### [placidity](../../../../../appendix/placid-ind-scheme.html) — `placid_ind_scheme`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:669).\n\n- A scheme/algebraic space $X$ *admits a placid presentation* if $X\\simeq\\varprojlim_i X_i$ is a cofiltered limit of finite-type schemes/algebraic spaces whose transition maps $X_i\\rightarrow X_j$ are smooth and affine; such an $X$ is a *placid* scheme/algebraic space.\n- An ind-scheme $X$ is *placid* if $X = \\varinjlim_i X_i$ is a filtered colimit of placid schemes along closed embeddings of finite presentation. If a placid group scheme $H$ acts on a placid ind-scheme $X$ and each $X_i$ in the presentation is $H$-stable, $X$ is an *$H$-placid ind-scheme*.\n\n### [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html)); ratified at [Q1-L1](../../../Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../../Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../../Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n- **note:** this is what makes [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a) automatic in the paper's generality, and it is the source of every stratification argument in Q1. Which clause the citing nodes actually consume, and whether they consume it inside the range clause (a) now states — twenty node files link this entry from their `objects:` field (grep of `blueprint/nodes`, 2026-08-09):\n\n  *Inside the range.* [Q1-L3](../../../Q1-L3/index.html) does not read (a) off this entry at all: its hypothesis **(C)** posits a subset $\\Lambda'\\subseteq\\Lambda_X^+$ carrying the finite presentation, and its own text already records that the source establishes (a) only over the open-$G$-orbit range. [Q1-L4-e4](../../../Q1-L4/Q1-L4-e4/index.html) and [Q3-L6](../../../../Q3/Q3-L6/index.html) restrict $X$ to symmetric, where $\\mathring{X} = X$ and the restriction is vacuous.\n\n  *Outside it.* Twelve nodes take clause (a) at an unrestricted index — some $\\lambda\\in\\Lambda_X^+$, or a pair $\\mu\\le\\mu'$ — with $X$ only smooth affine spherical and so possibly non-homogeneous: [Q1-L3-L4](../../../Q1-L3/Q1-L3-L4/index.html), [Q1-L3-L5](../../../Q1-L3/Q1-L3-L5/index.html), [Q1-L4](../../../Q1-L4/index.html), [Q1-L4-L1](../../../Q1-L4/Q1-L4-L1/index.html), [Q1-L4-L1-L3](../../../Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/index.html), [Q1-L5-L3](../index.html), [Q1-L5-L3-L2](../Q1-L5-L3-L2/index.html), [Q1-L5-L3-L3](index.html), [Q1-L5-L4](../../Q1-L5-L4/index.html), [Q1-L5-L5](../../Q1-L5-L5/index.html), [Q1-L5-L6](../../Q1-L5-L6/index.html) and [Q3-L4](../../../../Q3/Q3-L4/index.html). What each needs is the finite presentation of $j_\\lambda$, of $\\overline{i}_\\mu$ and of $\\overline{LX}_\\mu\\hookrightarrow\\overline{LX}_{\\mu'}$ — clause (a) — and on this entry as now stated it has that at the indices of $\\Lambda_X^{+,\\circ}$ and, beyond them, from main.tex:770–772 alone. Naming them is this entry's job; repairing them is `/update`'s and `/prove`'s.\n\n  *At the boundary the range excludes.* [Q3-L2](../../../../Q3/Q3-L2/index.html) states the failure itself — for $X$ with a $G$-fixed point the closed stratum $\\{x_0\\}$ has $\\overline{i}_{\\lambda_0}$ not finitely presented — so the amendment supports that node rather than damaging it. [Q1-L4-e1](../../../Q1-L4/Q1-L4-e1/index.html) for $X = \\mathbb{A}^1$ and [Q1-L5-e4](../../Q1-L5-e4/index.html) for $X = M_n$ are the two non-homogeneous instances whose index sets contain such a boundary index.\n\n  *Neither clause's range.* [Q1-L5](../../index.html)(H2) consumes clause (b), the indexing of the limit. [Q1-L3-a2](../../../Q1-L3/Q1-L3-a2/index.html) names this entry for the loop-space-to-$p$-adic dictionary and consumes neither.\n- **note:** *Provenance, checked at page level on 2026-08-05 against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025).* In v4, Theorem 36 (§5.2, p. 21) is clause (a) above and **not** the presentation; the presentation is Proposition 39(ii) (§5.3, p. 23), whose part (i) is the $I_0$-statement. Proposition 39 states the steps as the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$, indexed by tuples $\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}$ and called *locally equidimensional* placid presentations; the single-index form displayed above is the manuscript's (main.tex:772), and the two agree when $LX$ is connected. The proof of Thm 36 (pp. 21–22) also fixes the mechanism: $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ is the Noetherian-descent factorization of a finitely presented morphism **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$, with $j_\\lambda$ a placid fp-open and $i_\\lambda$ a placid fp-closed embedding.\n\n  *The manuscript's numbers are another version's.* main.tex:772 cites the presentation as \"[Theorem 36]\" and main.tex:1227 cites $K$-placidity of $\\overline{LX}_\\beta$ as \"[Prop. 29.(ii)]\"; neither matches v4, where those are Prop. 39(ii) and Thm 36(i). Recorded as provenance for whoever reads the source alongside the manuscript — not as a correction to main.tex, which no agent edits.\n- **note:** *The index range of clause (a), checked at page level on 2026-08-09 against the same PDF (arXiv:2310.20006**v4**, 10 Jul 2025), pp. 19–24.* Reported twice before it was acted on, and confirmed on the pages.\n\n  *§5 is set in the symmetric case, and its construction lives on the open $G$-orbit.* §5.1 (p. 20) opens \"Let $X^\\circ = BK/K\\subset X$ be the open $B$-orbit\", so $X = G/K$ is homogeneous, and p. 22 derives its exact sequences (7) from \"the fibration $K\\rightarrow G\\rightarrow G/K = X$ (note that we assume $K$ is connected)\". In the affine degeneration $\\pi\\colon\\mathcal{X}\\rightarrow A$ built there, each fibre $\\mathcal{X}_a$ is \"an affine spherical variety for $G$ (not necessary smooth and homogeneous)\", and $\\mathcal{X}^\\bullet\\subseteq\\mathcal{X}$ is defined as the open subscheme whose fibre $\\mathcal{X}^\\bullet_a\\subseteq\\mathcal{X}_a$ is the open $G$-orbit.\n\n  *Lemma 34 (p. 20) is where the range enters.* It is stated under \"Let $\\lambda\\in\\Lambda_S^+$\", fixed one paragraph above, and says that $f_\\lambda$ induces an isomorphism $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$ — the stratum is arcs into the open-$G$-orbit locus. Here $\\Lambda_S^+$ is the symmetric index set of [Chen–Yi symmetric orbit parametrization and closure relation](../../../../../appendix/bb-chenyi-symmetric-orbits.html)(1), for which $\\mathring{X} = X$.\n\n  *Theorem 36's own statement carries no index restriction; its proof does.* On p. 21 the theorem quantifies $v$, $v'$, $\\lambda$, $\\lambda'$ nowhere, while the proof reads \"For any $\\lambda\\in\\Lambda_S^+$, choose $i, i'$ satisfying (6) and $LX_\\lambda\\subset L^iX$. Then Lemma 34 implies there is a Cartesian diagram …\", and obtains the fp-locally closed $\\eta_\\lambda$ by base change from $\\eta\\colon L^+\\mathcal{X}^\\bullet_\\lambda\\rightarrow L^+\\mathcal{X}_\\lambda\\rightarrow L^{i'}\\mathcal{X}_\\lambda$. So the invocation of Lemma 34 is exactly what constrains the range, and the constraint is visible only inside the proof. The Iwahori half (p. 22) is reduced to the spherical one — \"it suffices to show that the embedding $\\mathcal{O}_v\\rightarrow L^+Gx_v$ into the spherical orbit through $x_v\\in\\mathcal{O}_v$ is finitely presented\" — and so inherits the same range.\n\n  *Remark 37 (p. 22) widens the variety class and not the range.* In full: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites (spelling as in the source), Theorem 36 remains true for general spherical varieties.\" Both named inputs are steps of the proof — [SW22, Lem. 2.3.10] is what Lemma 34's own proof invokes, Theorem 35 is Drinfeld's placidity — and nothing in the remark revisits $\\mathcal{X}^\\bullet$ or the quantifier over $\\Lambda_S^+$. The two qualifications are therefore independent and both stand.\n\n### [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../../Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../../appendix/ic-0.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{chen2022quaternionic,\n  title={Quaternionic Satake equivalence},\n  author={Chen, Tsao-Hsien and Macerato, Mark and Nadler, David and O'Brien, John},\n  journal={arXiv preprint arXiv:2207.04078},\n  year={2022}\n}\n\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@article{BravermanFinkelbergGinzburgTravkin_2021,\n   title={Mirabolic Satake equivalence and supergroups},\n   volume={157},\n   ISSN={1570-5846},\n   url={http://dx.doi.org/10.1112/S0010437X21007387},\n   DOI={10.1112/s0010437x21007387},\n   number={8},\n   journal={Compositio Mathematica},\n   publisher={Wiley},\n   author={Braverman, Alexander and Finkelberg, Michael and Ginzburg, Victor and Travkin, Roman},\n   year={2021},\n   month=jul, pages={1724–1765} }\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{devalapurkar2024kutheoreticspectraldecompositionsspheres,\n      title={ku-theoretic spectral decompositions for spheres and projective spaces},\n      author={Sanath K. Devalapurkar},\n      year={2024},\n      eprint={2402.03995},\n      archivePrefix={arXiv},\n      primaryClass={math.AT},\n      url={https://arxiv.org/abs/2402.03995},\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n\n@ tifies $K\\backslash LX \\simeq \\mathrm{SO}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$, the presentation Q1-L5-e3 works in.\n- **K4 — Rankin–Selberg: $X = \\mathrm{GL}_N$ under $G = \\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$** *(`positive`)* — **The variety.** The $\\mathrm{GL}$ analogue of K3, homogeneous with $K\\backslash LX \\simeq \\mathrm{GL}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{GL}_N}$. BZSV list it among the cases whose loop space is placid by strata of the affine Grassmannian (p. 156).\n- **K5 — Mirabolic: $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$** *(`positive`)* — **The variety.** The dual of the Godement–Jacquet space, with $(g,v)$ acted on by $(g_1,g_2)\\mapsto(g_1^{-1}gg_2,\\, vg_2)$. Its loop quotient is the mirabolic affine Grassmannian $\\mathrm{Gr}\\times\\mathcal{V}$ with $\\mathcal{V} = \\mathbf{V}\\otimes F$, $\\dim\\mathbf{V} = n$, acted on diagonally …\n- **K6 — Symplectic (Jacquet–Rallis) period: $X = \\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$** *(`positive`)* — **The variety.** Symmetric, hence spherical, and homogeneous with reductive stabilizer, hence smooth affine. Its dual is the Shalika-Whittaker reduction $\\check M = T^*(\\mathrm{GL}_{2n}/\\mathrm{GL}_n\\ltimes U,\\psi)$.\n- **K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m < n-1$** *(`adjacent`)* — **The variety.** The dual is $\\check X = \\mathrm{Mat}_{m\\times n}$ acted on by $\\check G = \\mathrm{GL}_m\\times\\mathrm{GL}_n$; the automorphic side is the Rankin–Selberg period for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$ outside the adjacent range covered by K4.\n- **K8 — Rank-1 affine homogeneous spherical varieties: the weakened form, in print** *(`weak`)* — **Why it is here.** This is the entry that shows the distinction this register turns on is real, and not a reading the blueprint imposed on the literature.\n- **K9 — The group case: $X = H$ under $G = H\\times H$** *(`degenerate`)* — **Why it
