<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L4</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L4 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L3-L4 — history\n\n[Q1-L5-L3-L4](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by the lead-researcher, commissioned by the failure audit of `/update Q1-L5-L3-L1` ([ADR 0022](../../../../../process/decisions/0022-update-proposes-nodes-from-failures.html)). It exists to discharge hypothesis **(C)** of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) — *chart-level preservation* — at charts where a finite-type group acts with finitely many orbits, which is the one place in the tree where that hypothesis can be met without touching the ambient category.\n\n  **The failure it answers.** [r1](../critiques/r1.html) of the parent [Q1-L5-L3](../index.html) is `FAIL` on two flaws that are the same flaw at two prices. **Flaw 1** is the prover's own honest `GAP:` at Step 4 — clause 1 still needs that $\\overline{\\imath}_{\\lambda,Z}^{\\,!}$ sends $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c\\left(K\\backslash\\overline{LX}_\\lambda\\right)$ — which is the ind-level form of exactly this claim. **Flaw 2** priced the repair at \"one appendix entry\", showed that estimate was too cheap on three counts, and named what a real repair has to be: *equivariant*, *placidity-free* and *sourced*. This node is the first candidate that is all three — it names no placidity, it is stated on quotient prestacks rather than on ind-schemes, and its step 4 has a numbered source.\n\n  **Why here and not inside [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html).** [u1](../Q1-L5-L3-L1/updates/u1.html) is the run that turned that node's false clause into hypothesis **(C)**, and it recorded this very route under *Considered and not adopted*. It was rejected **there** for a reason that does not apply **here**: writing \"holonomic\" into that statement is a hypothesis on the *object*, and would move the whole of [Q1-L5](../../index.html) from $\\mathcal{D}_c$ to $\\mathcal{D}_h$, reaching [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) and the manuscript's $\\mathcal{D}^{\\mathrm{ren}}$. Discharging (C) at the charts leaves the ambient category alone: holonomicity is *derived* from the geometry of the chart, never assumed of the sheaf, so it never appears in any statement above this one.\n\n  **Why hypothesis (A) is the right hypothesis and not a convenience.** Instance 3 of [examples.md](../Q1-L5-L3-L1/examples.html) for the sibling node shows that equivariance *alone* rescues nothing: the equivariant pair $K\\backslash Y'\\hookrightarrow K\\backslash Y$ reduces at $K=\\{1\\}$ to $\\{0\\}\\hookrightarrow\\mathbb{A}^1$, where the conclusion fails on $\\mathcal{F}=\\mathcal{D}_{\\mathbb{A}^1}$. That reduction is precisely a case with *infinitely many* orbits, which is what **(A)** excludes. The hypothesis is therefore load-bearing at the exact point the counterexample enters, and not a comfort added to make a proof go through.\n\n  **The mechanism, in four steps, so that the node is visibly provable and not a black box.** (1) Coherence on $H\\backslash\\tilde S$ is $H$-equivariant coherence on $\\tilde S$: the torsor projection $\\tilde S\\rightarrow H\\backslash\\tilde S$ is a smooth surjective test in the sense of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html). (2) For $M$ an $H$-equivariant coherent $\\mathcal{D}$-module on $\\tilde S$, $\\mathrm{Ch}(M)\\subseteq\\mu^{-1}(0)$, where $\\mu\\colon T^{*}\\tilde S\\rightarrow\\mathfrak{h}^{*}$ is the moment map: equivariance makes the symbols of the vector fields generated by $\\mathfrak{h}$ vanish on the characteristic variety. (3) $\\mu^{-1}(0)=\\bigcup_{\\mathcal{O}}T^{*}_{\\mathcal{O}}\\tilde S$ over the $H$-orbits, because $\\mu(y,\\xi)=0$ says exactly that $\\xi$ annihilates $T_y\\left(H\\cdot y\\right)$; under **(A)** that is a *finite* union of conormal bundles, each of dimension $\\dim\\tilde S$, hence Lagrangian, so $M$ is holonomic. (4) $!$-restriction preserves holonomicity along **any** morphism, and holonomic implies coherent, so $c^{\\,!}M$ is holonomic and therefore coherent. **Step 4 is the one carried by a source** — [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html), Hotta–Takeuchi–Tanisaki Thm. 3.2.3(ii) — while steps 2 and 3 are standard and are black-boxed together as [equivariant coherent with finitely many orbits is holonomic](../../../../../appendix/bb-equivariant-finite-orbits-holonomic.html); step 1 is the node's own descent work.\n\n  **An example, and where it stops.** Take $H=\\mathbb{G}_m$ acting on $\\tilde S=\\mathbb{A}^1$ by scaling — two orbits, so **(A)** holds — with $S=\\{0\\}$. The object that broke the sibling statement, $\\mathcal{D}_{\\mathbb{A}^1}$, has $\\mathrm{Ch}=T^{*}\\mathbb{A}^1$ of dimension $2$ and so carries no equivariant structure at all: it is coherent on $\\mathbb{A}^1$ and is *not* an object of $\\mathcal{D}_c\\left(\\mathbb{G}_m\\backslash\\mathbb{A}^1\\right)$. Every object that is lies in the finite list generated by $\\mathcal{O}_{\\mathbb{A}^1}$ and the delta module at $0$, all holonomic, and $\\bar c^{\\,!}$ carries them to finite complexes of finite-dimensional vector spaces on $B\\mathbb{G}_m$. Deleting the group — $H=\\{1\\}$ on $\\mathbb{A}^1$, infinitely many orbits — is the boundary instance, and it is the counterexample of [u1](../Q1-L5-L3-L1/updates/u1.html) verbatim.\n\n  **Scope, stated so the node's reach is explicit rather than implicit.** [Q1-L6-L1](../../../Q1-L6/Q1-L6-L1/index.html) proves per-closure finiteness of $L^+G$-orbits for *symmetric* $X$, which is where **(A)** is available at the finite-dimensional models; [Q1-L5-e4](../../Q1-L5-e4/index.html), $X=M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$, is where per-closure finiteness fails, and hence where this node supplies nothing. Both are recorded here because a hypothesis whose availability is not written down is a hypothesis the next round will assume.\n\n  **A blocker recorded and not worked around.** Hotta–Takeuchi–Tanisaki has **no key in `refs.bib`**, and the key `HTT` with the file `papers/HTT.pdf` are Lurie's *Higher Topos Theory* — a different book, verified on p. 1 of that PDF this run, and a trap already recorded in [examples.md](../Q1-L5-L3-L1/examples.html) for the sibling node. `refs.bib` is manuscript territory that no agent writes, so both appendix entries carry their bibliographic data in prose, cite no key, and say in a `note:` that adding one is the user's call. The book is also not in `papers/`, so neither entry was verified at page level on this run: the first reproduces a page-level reading made in this repository on 2026-08-06, and the second is a pointer to §11.6 rather than a transcription, standing as the closed world's own statement of a standard fact with its argument recorded in the entry. A page-level check is owed on both.\n- **2026-08-07 — the commentary recommends the route this node already declares, and already failed on.** It argues this node is \"essentially true\" and should be promoted to `proved`, by: equivariant coherent with finitely many orbits $\\Rightarrow$ holonomic, then $!$-restriction preserves holonomicity, hence coherence. Both ingredients are already in the closed world and already in this node's `objects:` — [an equivariant coherent $\\mathcal{D}$-module on a space with finitely many orbits is holonomic](../../../../../appendix/bb-equivariant-finite-orbits-holonomic.html) and [$!$-restriction preserves holonomicity along any morphism](../../../../../appendix/bb-htt-holonomic-shriek.html). So this is not a new route; it is the route [r1](critiques/r1.html) reviewed and failed, on five MAJOR flaws none of which is about holonomicity: Flaw 1 is a `GAP` at \"the Lemma assumes no smoothness of $S$, and two ingredients are then absent\", and Flaws 3 and 4 are the strong-equivariance and quotient-descent steps — precisely the passage from $H\\backslash\\widetilde{S}$ to the atlas that the commentary compresses into \"coherence is smooth-local on the finite-type quotient stack\". The status is **not** changed: a status is the `/prove` orchestrator's to write, and the argument that would earn it is the one on record as not yet closing. What the commentary adds is confidence that the shape is right, which is worth having and is not evidence.\n- **2026-08-09 — `/update` with an external passage: the statement survives untouched, and the route it needs is now sourced at stack level.** A node-local run against the response pasted on 2026-08-08, verified against the PDFs rather than adopted. **No defect could be stated against the `## Statement`,** so nothing in it changed; what changed is the `needs:` line, set here for the first time.\n\n  **Verified.** (1) Gunningham [[gunningham2017deriveddecompositionequivariant](../../../../../../papers/gunningham2017deriveddecompositionequivariant.pdf)] **Rem. 2.28, p. 18**, quoted: \"When $X$ is a finite orbit stack (for example, a quotient stack $Y/K$ where $K$ acts on $Y$ with finitely many orbits), every coherent complex on $X$ is regular holonomic.\" (2) His **Rem. 2.25, p. 17**: \"Although coherent complexes are not always preserved by the $\\mathcal{D}$-module functors, the holonomic subcategory is preserved (for safe morphisms)\", with $\\mathcal{D}_{\\mathrm{hol}}\\subseteq\\mathcal{D}_{\\mathrm{coh}}$ true by the definition that remark opens with. (3) Drinfeld–Gaitsgory [[drinfeld2013some](../../../../../../papers/drinfeld2013some.pdf)] **Def. 10.2.2, p. 112** (safe $=$ quasi-compact $+$ every geometric fibre has unipotent neutral automorphism component) and **§11.2.1, p. 122**: \"In particular, a quasi-compact representable morphism is safe.\" (4) His **§2.4, p. 15** builds $\\mathcal{D}(X)$ for $X=Y/K$ with $Y$ any **variety**, smoothness entering only to identify the homotopy category with classical $\\mathcal{D}$-modules. (5) Raskin **Rem. 5.1.1, p. 30** with footnote 6 and $\\mathcal{D}_{\\mathrm{hol}}:=\\mathrm{Ind}(\\mathcal{D}_{\\mathrm{coh},\\mathrm{hol}})$: in infinite type holonomic does **not** imply coherent. (6) Chen–Yi **Cor. 27** sits in §4, *Iwahori orbits*, and is proved through $\\tau$ and the involutions $\\psi_v=\\mathrm{Ad}_{n_v}\\circ\\theta$ — symmetric machinery; **Rem. 37** extends Theorem 36 alone.\n\n  **Refuted.** The passage's headline, that the theorem asked for in [g1](../gaps/g1.html) is false and this is news, is not news: the witness is [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html)'s own hypotheses note, citing Hotta–Takeuchi–Tanisaki **Rem. 1.5.10, p. 33**, on disk since 2026-08-06, and it is the recorded defect of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html). Its second proposed entry, a coherence criterion attributed to Raskin Prop. 3.17.2, is refuted **as a citation**: [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../../appendix/bb-raskin-torsor-descent.html) already transcribes that proposition and states that nothing is asserted there about $\\mathcal{D}_c$. Its proof step \"the morphism is representable and hence belongs to the safe class\" carried no citation; the citation exists, and is (3) above.\n\n  **Unverified.** That Gunningham's $\\mathcal{D}_{\\mathrm{coh}}$ — bounded complexes with coherent cohomology, his §2.4 — agrees with $\\mathcal{D}_c$ of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), which quantifies over smooth finite-type tests; standard for a finite-type quotient stack and not checked against a page. The field: he works over $\\mathbb{C}$, this repository over $k$ algebraically closed of characteristic $0$, and the transfer is declared exactly as [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html) already declares it for the same reason. The §11.6 pointer of [equivariant coherent with finitely many orbits is holonomic](../../../../../appendix/bb-equivariant-finite-orbits-holonomic.html) remains unverified at page level, the book still not being in `papers/`.\n\n  **Why this leaves the statement alone and moves the route.** The five MAJORs of [r1](critiques/r1.html) are not about holonomicity — Flaw 1 is the missing smoothness of $S$, Flaws 3 and 4 the strong-equivariance and quotient-descent steps — and every one of them is an objection to *descending to the atlas* $\\tilde S\\rightarrow H\\backslash\\tilde S$ and arguing there. Gunningham's two remarks are stated on the stack, so the composite $\\mathcal{D}_c(H\\backslash\\tilde S)=\\mathcal{D}_{\\mathrm{hol}}\\xrightarrow{\\ \\bar c^{\\,!}\\ }\\mathcal{D}_{\\mathrm{hol}}\\subseteq\\mathcal{D}_c(H\\backslash S)$ never leaves it, and the objections have nothing to attach to. This is not the 2026-08-07 commentary re-run: that one proposed the same *ingredients* through the same atlas descent, and is the route r1 failed; this one deletes the descent. The hypotheses need no strengthening — $H$ affine of finite type, $\\tilde S$ smooth of finite type and **(A)** finitely many orbits are exactly Rem. 2.28's, and $\\bar c$ is representable and quasi-compact because $c$ is a closed immersion of finite-type schemes.\n\n  **Recorded for a repo-wide run, not acted on here** ([ADR 0072](../../../../../process/decisions/0072-a-run-is-node-local-or-repo-wide.html)). The appendix entry above is the commission, and this node's `needs:` names it. Two findings reach past this directory and are logged rather than applied: (5) says the same chain **fails** in the placid ambient setting that [Q1-L5-L3](../index.html) works in, so nothing here may be lifted to $K=L^+G$; and (6) says *finitely many $L^+G$-orbits in a closure* is sourced for **symmetric** $X$ only, which is the availability of hypothesis **(A)** at the models and is asserted nowhere in the appendix. Status is untouched: it is the `/prove` orchestrator's field, and the entry that would clear the round is not yet written.\n- **2026-08-09 — `/prove` r2: the atlas descent is deleted and the argument survives, the closing paragraph does not.** Round 2 on disk, `VERDICT: FAIL` ([r2](critiques/r2.html)), 994/1500 words. The draft was a **rebuild** and not a patch: the new entry [Gunningham: $!$-restriction preserves coherence on finite-orbit quotient stacks](../../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html) states the conclusion at stack level, so the descent to the atlas $\\tilde S$ that every one of [r1](critiques/r1.html)'s five MAJORs attacked is simply not performed. Flaws 1, 3, 4, 8, 9 and 10 of r1 are gone with it, and none was answered — they were deleted along with the manoeuvre they objected to.\n\n  **The referee checked the three entries written that same day against their sources and they hold.** `gunningham2017deriveddecompositionequivariant` pp. 15–18 and `drinfeld2013some` pp. 112–113 and 122 were read on the page: Rem. 2.28, Rem. 2.25, §2.4, Prop. 2.20, Ex. 2.27, Rem. 2.26, Def. 10.2.2, Cor. 10.2.7 and §11.2.1 are quoted verbatim and in scope. That is worth recording, because all three had had exactly one pass of scrutiny when the round began.\n\n  **What now stands, sorted by owner.** Flaw 1 [MAJOR] and Flaw 2 [MAJOR] are the **closed world** coming up short; Flaw 3 [FATAL] is the **statement's** and exposes a **decomposition** cut wrong. Because not every standing flaw is the closed world, the status is `failing` and not `gapped`.\n\n  - **Flaw 1** — the entry is about the quotient *stack* and the Lemma about the quotient *prestack*, and Step 8 bridged them by observing that [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) applies to both. It does, and that is not an argument: the two have different test categories, and the inclusion runs the same way on source and target, so neither $\\mathcal{D}_c$ contains the other formally. Commissioned as [g2](gaps/g2.html).\n  - **Flaw 3** — the closing paragraph claimed the conclusion \"is exactly hypothesis **(C)**\" of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html). The prover found it false and the referee confirmed it independently: **(C)** quantifies over finite-type dg-scheme tests and $H\\backslash\\tilde S$ is not one — for $\\tilde S=\\mathrm{pt}$ it is $BH$ — and the $\\mathbb{G}_m$-on-$\\mathbb{A}^1$ case has the stack-level conclusion **true** and literal **(C)** **false**. `REFUTED` was declined only because the sentence admits a substitution reading under which it is true and vacuous.\n\n  **§3g acted on the statement in this invocation** — [u1](updates/u1.html). The closing paragraph is **deleted**, and $\\tilde S$ gains *separated* and $S$ gains *reduced*, which the argument consumes through the entry's declared reading of *variety* and did not declare. The revision is **material**: Steps 9 and 10 of the draft are about the deleted sentence, so `proof.md` now argues a claim the node no longer makes and the next `/prove` rebuilds those two steps; Steps 1–8, which prove the surviving conclusion, stand. No re-proof here — the cap counts rounds per invocation.\n\n  **The finding that reaches furthest, and this run did not act on it.** The referee argues the same computation shows **(C)** is unsatisfiable at *any* smooth chart of positive codimension, which would make the L2 + L4 $\\Rightarrow$ L1 route mis-cut rather than merely unproved, and that no equivariant variant of L4 repairs it. This run verified the single exhibited case and not the universal claim; it is recorded in [u1](updates/u1.html) for a repo-wide run and is the most consequential thing on this page.\n";</script>
