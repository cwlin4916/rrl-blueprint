<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L4</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L4 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L3-L4 — Finitely many orbits discharge chart-level preservation of coherence\n\n[node](index.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html) · [DAG index](../../../../../dag.html)\n\n- **uses:** [Gunningham: finite-orbit stacks](../../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html), [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html), [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html), [Raskin: infinite type](../../../../../appendix/bb-raskin-holonomic-not-coherent.html), [Chen–Yi: finite orbits](../../../../../appendix/bb-chenyi-finite-orbits-in-closure.html). A ready leaf: **no assumed dependency is used**.\n- **notation:** *the entry* is the Gunningham entry above; $\\mathcal{D}_c$ is [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) throughout.\n\n## Lemma\n\nLet $H$ be an affine algebraic group of finite type over $k$ acting on a smooth finite-type $k$-scheme $\\tilde S$, let $c\\colon S\\hookrightarrow\\tilde S$ be an $H$-stable closed immersion, and let\n\n$$\n\\bar c\\colon H\\backslash S\\longrightarrow H\\backslash\\tilde S\n$$\n\nbe the induced morphism of quotient prestacks. Assume:\n\n**(A) Finitely many orbits.** $H$ has finitely many orbits on $\\tilde S$.\n\nThen $!$-restriction along $\\bar c$ — the functor $\\bar c^{\\,!}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) — sends $\\mathcal{D}_c\\left(H\\backslash\\tilde S\\right)$ into $\\mathcal{D}_c\\left(H\\backslash S\\right)$, coherence on each of the two prestacks being that of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html).\n\nRead for the pair $\\left(H\\backslash\\tilde S,\\ H\\backslash S\\right)$ in place of $\\left(\\tilde S_\\alpha,\\ S_\\alpha\\right)$, this conclusion is exactly hypothesis **(C)** of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) for a chart taken equivariantly, discharged under the finite-orbit hypothesis above and no other.\n\n## Proof\n\n**Step 1 — the Lemma's $H$ and $\\tilde S$ meet the entry's group-and-target hypotheses, and smoothness of $\\tilde S$ is never consumed.**\n\n<details><summary>the argument</summary>\n\nThe entry wants $H$ affine of finite type acting on a finite-type variety; the Lemma gives that over $k$ algebraically closed of characteristic $0$ ([context](../../../../../context.html)), $\\tilde S$ smooth — hence reduced — of finite type. Smoothness is used nowhere below: here the Lemma is strictly narrower than the entry.\n\n</details>\n\n**Step 2 — two clauses of the entry's declared reading of *variety* are not among the Lemma's hypotheses, and what follows assumes them.**\n\n<details><summary>the argument</summary>\n\nThat reading is *reduced separated of finite type*, and the same note puts a non-reduced $S$ outside what was checked, while the Lemma allows $\\tilde S$ non-separated and $S$ non-reduced. Steps 3–6 establish it for $\\tilde S$ separated and $S$ reduced.\n\n</details>\n\n**Step 3 — hypothesis (A) is the entry's load-bearing hypothesis.**\n\n<details><summary>the argument</summary>\n\nThe entry requires finitely many $H$-orbits on the **target** $\\tilde S$ and nothing of the orbit set on $S$; **(A)** is exactly that.\n\n</details>\n\n**Step 4 — $c$ and $\\bar c$ are the entry's remaining data.**\n\n<details><summary>the argument</summary>\n\nA closed subscheme of a finite-type $k$-scheme is of finite type, so $c$ is the entry's $H$-stable closed immersion of finite-type schemes, and $\\bar c$ the morphism it calls induced.\n\n</details>\n\n**Step 5 — the entry's side condition on $\\bar c$ is discharged inside the entry, and inherited here rather than re-derived.**\n\n<details><summary>the argument</summary>\n\nSafety of $\\bar c$ is automatic there: it is representable and quasi-compact, hence safe. Quasi-compactness is $S$ and $\\tilde S$ of finite type; representability is flagged as **an inference of the entry, not a sentence read off a page**, and I grant it on the entry's word.\n\n</details>\n\n**Step 6 — the Lemma's displayed conclusion holds.**\n\n<details><summary>the argument</summary>\n\nSteps 1–5 supply every hypothesis of the entry under Step 2's reading, so it applies and gives\n\n$$\n\\bar c^{\\,!}\\left(\\mathcal{D}_c\\left(H\\backslash\\tilde S\\right)\\right)\\ \\subseteq_{\\mathcal{D}^!\\left(H\\backslash S\\right)}\\ \\mathcal{D}_c\\left(H\\backslash S\\right),\n$$\n\nthe Lemma's conclusion. The argument never leaves the two quotient prestacks.\n\n</details>\n\n**Step 7 — Step 6 consumes the harder half of an identification the entry declares owed.**\n\n<details><summary>the argument</summary>\n\nThe entry records the agreement of Gunningham's $\\mathbf{D}_{coh}$ with $\\mathcal{D}_c$ as **not checked against a page**. The easy inclusion is $\\mathcal{D}_c\\subseteq\\mathbf{D}_{coh}$: the atlas $\\tilde S\\rightarrow H\\backslash\\tilde S$ is itself a smooth finite-type test, which already imposes boundedness with coherent cohomology there. The reverse is what Step 6 uses, on the **source** stack $H\\backslash S$; it needs coherence to descend along $T\\times_{H\\backslash S}S\\rightarrow T$ for an arbitrary test $T$, which no entry supplies. Inherited and undischarged; I do not claim to prove it.\n\n</details>\n\n**Step 8 — the entry's *stack* and the Lemma's *prestack* are reconciled by the entry's own notation, not by anything proved here.**\n\n<details><summary>the argument</summary>\n\nThe entry names quotient **stacks** but states its conclusion in $\\mathcal{D}_c$ of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), defined on a **prestack**, so the categories it asserts about are those the Lemma names. That is asserted, not proved: the closed world has no fppf descent for $\\mathcal{D}_c$.\n\n</details>\n\n**Step 9 — the Lemma's closing paragraph is not an instantiation of hypothesis (C) of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) as that node writes it.**\n\n<details><summary>the argument</summary>\n\nThere **(A)** and **(B)** quantify $\\alpha$ over *tests* $\\tilde h_\\alpha\\colon\\tilde S_\\alpha\\rightarrow\\mathcal{Y}$ — smooth morphisms from finite-type dg-schemes — and **(C)** speaks of $\\mathcal{D}_c(\\tilde S_\\alpha)$ for those. Putting $H\\backslash\\tilde S$ into that slot requires it to be such a dg-scheme, which it is not once a stabilizer is non-trivial — for $\\tilde S=\\mathrm{pt}$ it is $BH$. So the substitution names **(C)** of an equivariantly-charted variant the repository does not have — and the family for the actual **(B)**, from [Q1-L5-L3-L2](../Q1-L5-L3-L2/index.html), carries no named $H$-action.\n\n</details>\n\n**Step 10 — the literal (C) at those charts is false, so no reading makes the closing paragraph an instance of it.**\n\n<details><summary>the argument</summary>\n\nLet $H=\\mathbb{G}_m$ scale $\\tilde S=\\mathbb{A}^1$, with two orbits, and $S=\\{0\\}$; the Lemma's hypotheses hold, as do Step 2's clauses. Both $\\mathcal{Y}=H\\backslash\\mathbb{A}^1$ and $\\mathcal{Y}_0=B\\mathbb{G}_m$ are smooth, so any family as in **(B)** has an $\\alpha$ with $S_\\alpha\\ne\\emptyset$, and there $c_\\alpha$ is a closed immersion of smooth schemes of codimension $\\dim\\mathcal{Y}-\\dim\\mathcal{Y}_0=1$. Then $\\mathcal{D}_{\\tilde S_\\alpha}\\in\\mathcal{D}_c(\\tilde S_\\alpha)$ while $c_\\alpha^{\\,!}\\mathcal{D}_{\\tilde S_\\alpha}\\notin\\mathcal{D}_c(S_\\alpha)$ — the witness in the hypotheses note of [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html), an entry whose own page-level check is owed. Step 6 is true here and **(C)** false.\n\n</details>\n\n## Caveats\n\n**What is proved.** Steps 1–6 give the Lemma's displayed conclusion, under Step 2's reading; the closing paragraph is **not** certified (Steps 9–10). That is a statement defect, not a missing fact — `/update`'s, not a `GAP`.\n\n**Three debts inherited from the entry.** Representability of $\\bar c$ as its own inference (Step 5); the $\\mathbf{D}_{coh}$-versus-$\\mathcal{D}_c$ identification, harder half consumed (Steps 7–8); the $\\mathbb{C}$-to-$k$ transfer, declared there and not sourced.\n\n**Two scope limits.** None of this lifts to $K=L^{+}G$ on a placid ind-scheme: the entry's last inclusion is what fails in infinite type ([Raskin](../../../../../appendix/bb-raskin-holonomic-not-coherent.html)). And for the loop-space application **(A)** is sourced for **symmetric** $X$ only ([Chen–Yi](../../../../../appendix/bb-chenyi-finite-orbits-in-closure.html)), not general spherical $X$.\n\nEntries used: the six in **uses**.\n";</script>
