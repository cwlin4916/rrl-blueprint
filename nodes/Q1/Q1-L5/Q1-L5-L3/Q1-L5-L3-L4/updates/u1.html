<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L5</a><i>›</i><a href="../../index.html">Q1-L5-L3</a><i>›</i><a href="../index.html">Q1-L5-L3-L4</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u1 — Q1-L5-L3-L4: the closing paragraph is withdrawn, and two hypotheses the argument used are declared</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [r2](../critiques/r2.html) · [write-up](../proof.html) · [history](../history.html)\n\n**Written:** 2026-08-09, by the §3g reconciliation stage of `/prove Q1-L5-L3-L4` — the round closed `VERDICT: FAIL` at r2 and one of its standing flaws is the statement's, not the write-up's.\n\n## The defect, in one sentence against the current statement\n\nThe closing paragraph asserts that the Lemma's conclusion \"is exactly hypothesis **(C)** of [Q1-L5-L3-L1](../../Q1-L5-L3-L1/index.html) for a chart taken equivariantly\", and it is not: **(C)** is stated for a closed immersion $c_\\alpha\\colon S_\\alpha\\hookrightarrow\\tilde S_\\alpha$ of finite-type dg-**schemes** serving as smooth tests, whereas this Lemma concludes about the quotient **prestacks** $H\\backslash\\tilde S$ and $H\\backslash S$, which are not such tests — for $\\tilde S=\\mathrm{pt}$ the source is $BH$.\n\n## Old statement, verbatim\n\n> Let $H$ be an affine algebraic group of finite type over $k$ acting on a smooth finite-type $k$-scheme $\\tilde S$, let $c\\colon S\\hookrightarrow\\tilde S$ be an $H$-stable closed immersion, and let\n>\n> $$\n> \\bar c\\colon H\\backslash S\\longrightarrow H\\backslash\\tilde S\n> $$\n>\n> be the induced morphism of quotient prestacks. Assume:\n>\n> **(A) Finitely many orbits.** $H$ has finitely many orbits on $\\tilde S$.\n>\n> Then $!$-restriction along $\\bar c$ — the functor $\\bar c^{\\,!}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$] — sends $\\mathcal{D}_c\\left(H\\backslash\\tilde S\\right)$ into $\\mathcal{D}_c\\left(H\\backslash S\\right)$, coherence on each of the two prestacks being that of [`defn:coherent_D_mod`].\n>\n> Read for the pair $\\left(H\\backslash\\tilde S,\\ H\\backslash S\\right)$ in place of $\\left(\\tilde S_\\alpha,\\ S_\\alpha\\right)$, this conclusion is exactly hypothesis **(C)** of [Q1-L5-L3-L1] for a chart taken equivariantly, discharged under the finite-orbit hypothesis above and no other.\n\n## New statement\n\nTwo changes, and no third.\n\n1. **The closing paragraph is deleted.** What it claimed is withdrawn, not weakened: the node no longer says anything about hypothesis **(C)**.\n2. **$\\tilde S$ gains *separated* and $S$ gains *reduced*.** These are consumed by the argument through the appendix entry's declared reading of *variety* and were undeclared. This is r2 Flaw 2's cheap exit, taken here because the alternative — amending [Gunningham: $!$-restriction preserves coherence on finite-orbit quotient stacks](../../../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html) to cover non-separated and non-reduced input — changes what every node citing that anchor asserts and is not this run's to make.\n\nThe conclusion is otherwise untouched, and in particular it still speaks about **prestacks**. That the appendix entry speaks about **stacks** is r2 Flaw 1, which the referee sorted to the closed world and not to the statement; it is commissioned as [g2](../gaps/g2.html).\n\n## §2 — the three columns\n\n**Verified.** That **(C)** of [Q1-L5-L3-L1](../../Q1-L5-L3-L1/index.html) quantifies over the *tests* of its own hypothesis **(B)**, which are finite-type dg-schemes, so a quotient prestack is not among them — read off that node's own statement. That the prover's $\\mathbb{G}_m$-on-$\\mathbb{A}^1$ case has the stack-level conclusion true and literal **(C)** false — confirmed independently by the referee at r2 Flaw 3, and consistent with the witness already recorded in the hypotheses note of [$!$-restriction preserves holonomicity](../../../../../../appendix/bb-htt-holonomic-shriek.html), Hotta–Takeuchi–Tanisaki Rem. 1.5.10, p. 33. That the argument consumes separatedness and reducedness: the entry's `hypotheses:` block declares *variety* to mean reduced separated of finite type and says a non-reduced $S$ is outside what was checked.\n\n**Refuted.** Nothing. The referee declined `REFUTED` on the closing paragraph because it admits a textual-substitution reading under which it is true but vacuous — ill-posed rather than false — and deleting an ill-posed sentence is the same repair either way.\n\n**Unverified.** Whether **(C)** is *unsatisfiable* at every smooth chart of positive codimension, which the referee asserts and which would make the L2 + L4 $\\Rightarrow$ L1 route mis-cut rather than merely unproved. It follows from the same HTT witness applied at each chart, and this run did not check that it applies at *every* admissible family of **(B)** rather than at the one exhibited. Recorded below for the run that can act on it, and **not** acted on here.\n\n## Considered and not adopted\n\n**Restating the node at stack level**, so that it becomes the appendix entry directly. Rejected: every consumer above this node — [Q1-L5-L3](../../index.html) and the recollement of [Q1-L5](../../../index.html) — is written about $\\mathcal{D}_c$ of a quotient *prestack* in the sense of [coherent $\\mathcal{D}$-modules](../../../../../../appendix/defn-coherent-d-mod.html), and moving this one node to a different ambient would hide the missing descent rather than record it. The descent is a real fact the closed world lacks, and g2 asks for it.\n\n**Weakening the closing paragraph** to \"bears on **(C)**\" or \"is the equivariant analogue of **(C)**\". Rejected: a sentence whose content is that two claims are related, with the relation unstated, is not checkable, and it was the unstated relation that carried the defect through r1 and into r2.\n\n**Deleting hypothesis (A)** as unused now that the closing paragraph is gone. Rejected outright — **(A)** is what upgrades coherent to holonomic in the appendix entry and is the single load-bearing hypothesis of the whole node.\n\n## Reaches past this directory — recorded, not acted on\n\nThis is a node-local run ([ADR 0072](../../../../../../process/decisions/0072-a-run-is-node-local-or-repo-wide.html)), so the following are written down for a repo-wide `/update` or a `/decompose` and changed nothing outside this node's directory.\n\n1. **[Q1-L5-L3-L1](../../Q1-L5-L3-L1/index.html)'s hypothesis (C) may be unsatisfiable**, in which case that node is vacuous and the route through it is cut wrong — the referee's owner **(d)**. Nothing in the tree now discharges **(C)**, because this node no longer claims to and no other node ever did.\n2. **Hypothesis (A)'s availability is sourced for symmetric $X$ only** — [Chen–Yi: finitely many orbits in an orbit closure](../../../../../../appendix/bb-chenyi-finite-orbits-in-closure.html). Any node discharging **(A)** at the finite-dimensional models of a general spherical $X$ is leaning on something not in print.\n3. **Nothing here lifts to $K=L^{+}G$** — [Raskin: in infinite type, holonomic does not imply coherent](../../../../../../appendix/bb-raskin-holonomic-not-coherent.html).\n\n## Write-up disposition (§4a)\n\n**Material.** The deleted paragraph is the subject of the write-up's Steps 9 and 10, so `proof.md` now argues about a sentence the statement no longer contains. The status was already `failing` and stays `failing`; the next `/prove` is a **rebuild of Steps 9–10 and not a patch**, and the rest of the draft — Steps 1–8, the part that proves the surviving conclusion — stands.\n";</script>
