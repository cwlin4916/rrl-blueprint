<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L5</a><i>›</i><a href="../../index.html">Q1-L5-L3</a><i>›</i><a href="../index.html">Q1-L5-L3-L4</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L5-L3-L4, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nChecks that passed before the flaws below, recorded so a later round need not redo them.\n\n- **Statement fidelity.** The draft's `## Lemma` (lines 10–22) is character-for-character the node's `## Statement` (lines 19–31 of the node file), display block and closing paragraph included. No strengthening, no weakening.\n- **Hallucination.** No bib key and no `main.tex` `\\label` is cited anywhere in the draft, so there is nothing to grep. All four object links resolve to real files — [coherent $\\mathcal{D}$-modules](../../../../../../appendix/defn-coherent-d-mod.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../../appendix/conv-d-shriek-d-star.html), [$!$-restriction preserves holonomicity](../../../../../../appendix/bb-htt-holonomic-shriek.html), [equivariant coherent with finitely many orbits is holonomic](../../../../../../appendix/bb-equivariant-finite-orbits-holonomic.html) — as does the link to [Q1-L5-L3-L1](../../Q1-L5-L3-L1/index.html), and \"ratified reading 1\" is really item 1 of `context.md`.\n- **Circularity.** `depends-on` is empty and nothing outside the four objects is invoked as a fact. The disclosure is present, though housed in the `uses:` bullet (\"A ready leaf: **no assumed dependency is used**\") rather than in a closing *Dependency disclosure* caveat as in the sibling write-up `Q1-L5-L3/proof.md`.\n- **Use of (A).** Hypothesis **(A)** is consumed exactly once, at Step 6, and it is genuinely load-bearing: without holonomicity the conclusion is false in general, as the cited entry's own witness (Remark 1.5.10) shows. The draft's \"Only this step uses **(A)**\" is correct.\n- **Step 3** is right and is the good idea of the write-up: because $H\\backslash Y$ is the *unsheafified* quotient prestack, $(H\\backslash Y)(T)=[Y(T)/H(T)]$ objectwise, every $T$-point lifts, and the fibre product trivializes. **Step 7** is right.\n\n---\n\n**Flaw 1** [MAJOR] — An honest `GAP:` is automatically FAIL, and this one is exemplary in form: it says which steps fail (4, 5, 8), why each fails, and it does not smuggle the missing fact in as \"standard\".\n\n<details><summary>(location: line 56, \"**GAP:** the Lemma assumes no smoothness of $S$, and two ingredients are then absent\") · the finding</summary>\n\nThe honesty deserves saying out loud, and so does the scale of what is left: the gapped case is not a corner case but *the* case the node exists to serve. The draft's own Caveats concede it — \"the chart $S_\\alpha$ of hypothesis **(C)** in Q1-L5-L3-L1 is a fibre product $\\tilde S_\\alpha\\times_{\\mathcal{Y}}\\mathcal{Y}_0$, singular in general\" — so as it stands the write-up proves a statement strictly weaker than the node's, and the weaker statement discharges nothing downstream. The gap is fillable in the literature (Kashiwara's equivalence plus stability of holonomicity under $R\\Gamma_{[S]}$ are standard), but not from the four declared objects, so it must be commissioned.\n\n</details>\n\n**Flaw 2** [MAJOR] — The gap is named at the right *place* but scoped too narrowly, and this matters because the next operator will commission a node from exactly this sentence.\n\n<details><summary>(location: line 56, \"What would discharge the gap: an entry declaring $\\mathcal{D}_c(S)$ … together with the statement that $c_{*,dR}c^!M\\simeq R\\Gamma_{[S]}M$ is holonomic\") · the finding</summary>\n\nThe two named ingredients live on the **scheme** $S$; the Lemma's conclusion is about the **prestack** $H\\backslash S$, and the bridge from one to the other is Step 5, which the draft has just declared \"empty for $Y=S$\". Granting both named ingredients, the proof still cannot be finished, because at least two further facts are missing:\n\n- that $g^!$ preserves the new notion of coherence for $g\\colon T'\\rightarrow S$ smooth with $S$ singular — in the smooth case this came from the dictionary of [$!$-restriction preserves holonomicity](../../../../../../appendix/bb-htt-holonomic-shriek.html) (its Prop. 1.5.13(ii) line), which is declared for smooth targets only;\n- that boundedness and the new coherence descend along the smooth surjection $\\pi\\colon T'\\rightarrow T$ with $T$, $T'$ singular.\n\nWorse, \"an entry **declaring** $\\mathcal{D}_c(S)$ … through Kashiwara's equivalence\" would not do what is wanted even if written. The Lemma's conclusion says \"coherence on each of the two prestacks being that of [coherent $\\mathcal{D}$-modules](../../../../../../appendix/defn-coherent-d-mod.html)\", i.e. testing along smooth $f\\colon T\\rightarrow H\\backslash S$ with $T$ a finite-type dg-scheme. A private Kashiwara-based declaration of $\\mathcal{D}_c(S)$ changes what the conclusion asserts; what is actually needed is a *ratified reading* of \"finite complex of $\\mathcal{D}$-modules with coherent cohomology\" on a singular test — a change to the closed world binding every node that uses $\\mathcal{D}_c$ — together with a proof that it agrees with the Kashiwara description. The gap sentence should say so, or the commissioned node will close while leaving Q1-L5-L3-L4 unproved.\n\n</details>\n\n**Flaw 3** [MAJOR] — The hypotheses of the quoted black box are not satisfied by the object it is applied to.\n\n<details><summary>(location: Step 6, line 48, \"$M$ is coherent by Step 5 for the smooth $Y=\\tilde S$; $M$ is strongly equivariant by Step 2 … Clauses (1)–(3) give $\\dim\\mathrm{Ch}(M)=\\dim\\tilde S$ and $M$ holonomic\") · the finding</summary>\n\n[equivariant coherent with finitely many orbits is holonomic](../../../../../../appendix/bb-equivariant-finite-orbits-holonomic.html) reads \"Let $M$ be an $H$-equivariant coherent $\\mathcal{D}$-module on $\\tilde S$, and let $\\mathrm{Ch}(M)\\subseteq T^{*}\\tilde S$ be its characteristic variety\" — a single module, whose characteristic variety is the support of $\\mathrm{gr}$ of a good filtration. The draft's $M:=q_{\\tilde S}^{\\,!}\\mathcal{F}$ is an object of the DG-category $\\mathcal{D}(\\tilde S)$, which Step 5 places in $D^b_c(\\mathcal{D}_{\\tilde S})$: a bounded complex. For such an $M$, clause 1 of the entry ($\\mathrm{Ch}(M)\\subseteq\\mu^{-1}(0)$) is not even a well-formed assertion until $\\mathrm{Ch}$ is read as $\\bigcup_i\\mathrm{Ch}\\left(\\mathcal{H}^i(M)\\right)$, and the entry does not license that reading.\n\nRepairing it requires the step the draft omits entirely: pass to cohomology and check that each $\\mathcal{H}^i(M)$ is a *strongly $H$-equivariant coherent* $\\mathcal{D}$-module. That is true — $a$ and $\\mathrm{pr}$ are smooth of the same relative dimension, so $a^!$ and $\\mathrm{pr}^!$ are t-exact up to the same shift and $\\theta$ induces isomorphisms $a^!\\mathcal{H}^i(M)\\simeq\\mathrm{pr}^!\\mathcal{H}^i(M)$ compatible with the cocycle — but \"true and one sentence away\" is not \"written\", and this is precisely the hinge the entry refuses to supply (\"the identification … is the citing node's own work\"). Note also that the entry's exclusion clause is sharp: $\\mathcal{D}_{\\tilde S}$ itself is coherent with $\\dim\\mathrm{Ch}=2\\dim\\tilde S$, so nothing here is robust to a slip about which structure the equivariance is.\n\n</details>\n\n**Flaw 4** [MAJOR] — Two defects in the one step that carries the node's central obligation.\n\n<details><summary>(location: Step 2, line 34, \"It is an $M\\in\\mathcal{D}(Y)$ with an isomorphism $\\theta\\colon a^!M\\xrightarrow{\\ \\sim\\ }\\mathrm{pr}^!M$ … obeying the cocycle condition … so differentiating the cocycle at $e\\in H$ identifies … the operator differentiating the $H$-action on $M$ with the action of the vector field $v_Y\\in\\mathcal{D}_Y$\") · the finding</summary>\n\n*(a) The description of the totalization is stated as an identification and is not one.* $\\lim_{[n]\\in\\Delta}\\mathcal{D}\\left(H^{\\times n}\\times Y\\right)$ is a limit over all of $\\Delta$; an object is $M$ together with $\\theta$, the cocycle, **and** a coherent system of higher compatibilities. Writing \"It **is** an $M$ … with an isomorphism … obeying the cocycle condition\" asserts an equivalence with $2$-truncated data, which is false in a DG setting. Nothing downstream needs the converse, so the fix is to weaken \"is\" to \"gives in particular\" — but as written the step claims more than is true.\n\n*(b) Strong equivariance is asserted, not derived.* \"Being an isomorphism of $\\mathcal{D}_{H\\times Y}$-modules, $\\theta$ is horizontal along $H$, so differentiating the cocycle at $e\\in H$ identifies …\" is a gesture at the standard argument with no computation in it, and the phrase \"the operator differentiating the $H$-action on $M$\" refers to something not yet defined: $M$ carries no $H$-action, only the datum $\\theta$; the $\\mathfrak{h}$-action being compared to $v_Y$ is the one obtained by first extracting a *weak* (i.e. $\\mathcal{O}$-linear) equivariant structure from $\\theta$ and then differentiating. Since the black box's hypothesis block says in terms that strong equivariance \"is what makes clause 1 true\" and that \"a merely weakly equivariant module is not covered\", the difference between the two is the whole content of this step, and the write-up spends one clause on it.\n\n</details>\n\n**Flaw 5** [MAJOR] — This sentence is part of what the node asks to be certified, the draft copies it into the Lemma, and the Proof never mentions it again.\n\n<details><summary>(location: line 22, \"Read for the pair $\\left(H\\backslash\\tilde S,\\ H\\backslash S\\right)$ in place of $\\left(\\tilde S_\\alpha,\\ S_\\alpha\\right)$, this conclusion is exactly hypothesis **(C)** of Q1-L5-L3-L1 for a chart taken equivariantly\") · the finding</summary>\n\nIt is not a free restatement. In [Q1-L5-L3-L1](../../Q1-L5-L3-L1/index.html), hypotheses **(A)** and **(B)** quantify $\\alpha$ over *tests* $\\tilde h_\\alpha\\colon\\tilde S_\\alpha\\rightarrow\\mathcal{Y}$, i.e. over **finite-type dg-schemes**, with $S_\\alpha:=\\tilde S_\\alpha\\times_{\\mathcal{Y}}\\mathcal{Y}_0$ again a finite-type dg-scheme; **(C)** then speaks of $\\mathcal{D}_c(\\tilde S_\\alpha)$ for those. A quotient prestack $H\\backslash\\tilde S$ is not one of them, so the substitution the sentence invites is not an instantiation of **(C)** as **(C)** is written — it is an instance of a hypothetical equivariant variant of Q1-L5-L3-L1 which does not exist in the repository.\n\nThe mismatch is not cosmetic, and it is visible in the intended consumer: [Q1-L5-L3-L2](../../Q1-L5-L3-L2/index.html) produces exactly the family $\\left\\{\\tilde h_\\alpha\\colon\\tilde S_\\alpha\\rightarrow K\\backslash Y\\right\\}$ of finite-type dg-scheme tests, with **no $H$-action on $\\tilde S_\\alpha$ named and no finite-orbit hypothesis available for them**, while the parent [Q1-L5-L3](../../index.html) asserts in its `## Decomposition` that \"the chain is L4 discharging (C) at the charts L2 produces\". On the present statements that chain does not connect. Either the write-up must exhibit the passage (each $\\tilde S_\\alpha$ refined to an $H$-stable smooth chart with finitely many orbits, and coherence transferred), or the statement needs `/update`. I am flagging, not refuting: read as the signpost \"in the equivariantly-charted variant of (C)\", the sentence is not false, merely unsupported and, as the parent shows, already being read as more than it says.\n\n</details>\n\n**Flaw 6** [MINOR] — They are not literally the Lemma's own.\n\n<details><summary>(location: Step 6, line 48, \"Hypotheses of [equivariant coherent with finitely many orbits is holonomic]: $H$ affine of finite type over $k$ and $\\tilde S$ smooth of finite type over $k$ **are the Lemma's own**\") · the finding</summary>\n\nBoth black boxes are stated for smooth algebraic **varieties** ($\\tilde S$ in one, $X$ and $Y$ in the other); the Lemma hypothesizes a smooth finite-type **scheme**, which may be disconnected with components of different dimensions, or non-separated. The entry's clauses 2–3 turn on \"each of pure dimension $\\dim\\tilde S$\" and on the single number $\\dim\\tilde S$, so a non-equidimensional $\\tilde S$ needs the argument run per component before the dimension count means anything. Relatedly, the dictionary of [$!$-restriction preserves holonomicity](../../../../../../appendix/bb-htt-holonomic-shriek.html) declares $f^{\\dagger}=f^{!}$ \"on $\\mathrm{AffSch}^{f.t.}$\", while Steps 4 and 8 apply it to schemes not assumed affine. Both are repairable in a clause (component-wise; Zariski-local), but the draft should say the clause rather than claim a match that is not there.\n\n</details>\n\n**Flaw 7** [MINOR] — Both black boxes carry, in their own text, an owed obligation the citing node inherits: \"A page-level check is owed before a write-up leans on the entry\", and, for the finite-orbit entry, \"**not verified at page level** … A node citing this entry inherits that status\".\n\n<details><summary>(location: the `uses:` bullet, line 5, and the Caveats, lines 60–61) · the finding</summary>\n\nNeither is mentioned anywhere in the draft. The Caveats section is otherwise scrupulous — it discloses the Kashiwara ingredient as outside the closed world and declines to cite it — which makes the silence about the two unverified, keyless black boxes the odd omission rather than an acceptable one. One sentence naming the inherited status belongs in Caveats.\n\n</details>\n\n**Flaw 8** [MINOR] — Objectwise in $\\mathrm{Gpd}$ read strictly, the colimit of the bar construction is the coequalizer, i.e. the *set* of orbits $Y(T)/H(T)$ — which contradicts Step 3's \"$(H\\backslash Y)(T)$ is objectwise the action groupoid $[Y(T)/H(T)]$\".\n\n<details><summary>(location: Step 1, line 26, \"the colimit, computed objectwise in $\\mathrm{PreStk}=\\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$, of the bar simplicial prestack\") · the finding</summary>\n\nThe two steps are consistent only under the $(2,1)$-categorical reading of the colimit, which the draft never states; it is the intended one and it is the correct one (stabilizers are discrete, so the realization is $1$-truncated), so this is an imprecision rather than an error, but Step 1 is the step that licenses Step 2's descent description and should not be ambiguous about which colimit it means.\n\n</details>\n\n**Flaw 9** [MINOR] — Step 3 produces the trivialization $T\\times_{H\\backslash Y}Y\\simeq T\\times H$ only for **affine** $T$, where a lift of the $T$-point exists by construction of the quotient prestack; Step 4 applies it to a test $T$ that is a general finite-type dg-scheme, for which no global lift need exist.\n\n<details><summary>(location: Step 3, line 36, \"For affine $T$ …\" used at Step 4, line 44, \"with $T'$ of finite type by Step 3\") · the finding</summary>\n\nWhat is true is that $\\pi$ is Zariski-locally on $T$ of that form, hence a Zariski-locally trivial $H$-torsor, which is all Step 4 and Step 5 need — but the write-up asserts the global form. In the same vein, \"smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$\" is undefined in the closed world for a prestack target, and Step 4's \"$g$ is a base change of $f$, hence smooth\" silently fixes a reading. Here the reading is harmless, because the diagonal of $H\\backslash Y$ is affine (it is $H\\times Y\\rightarrow Y\\times Y$) so every morphism to $H\\backslash Y$ from a scheme is representable and \"smooth\" has its usual meaning; the draft should record that observation rather than leave the reading implicit.\n\n</details>\n\n**Flaw 10** [MINOR] — Half a sentence for the whole descent half of the step.\n\n<details><summary>(location: Step 5, line 46, \"boundedness and coherence descend along it\") · the finding</summary>\n\nTwo remarks. First, the reader cannot reconstruct the argument from the declared objects, and the obvious shortcut is a trap: $\\pi$ is Zariski-locally split, but restricting along a section is $!$-restriction along a closed embedding, which the cited entry states in as many words does *not* preserve coherence — so the intended route must be flat descent of finite presentation for the $\\mathcal{H}^i$ (via $\\mathcal{H}^i(\\pi^{\\dagger}N)=\\pi^{*}\\mathcal{H}^{i+d}(N)$ and faithful flatness), and that should be the sentence. Second, this repository does not treat the fact as free: Q1-L5-L3's `## Decomposition` says Q1-L5-L3-L1 exists partly to package \"the smooth descent of coherence the draft's sketch left unmentioned\". Asserting it here in a subordinate clause is out of step with the standard the sibling node was created to enforce.\n\n</details>\n\n---\n\nAssessment of the two questions the round was asked to weigh, stated plainly. **(1)** The smooth case is *nearly* proved: the architecture (Steps 1–8) is the right one, Steps 3 and 7 are correct, Steps 4–5 are correct in outline with the elisions of Flaws 9–10, and the two genuine holes are Flaws 3 and 4 — both in the identification the black box refuses to supply, both fillable in a few sentences, neither written. **(2)** The gap is at the right *place* (Step 8/9, the singular $S$) but is scoped short of what the reassembly needs, and its proposed remedy would, taken literally, redefine the term the conclusion is stated in; see Flaw 2. I have no counterexample and expect the statement true: for $M$ holonomic on smooth $\\tilde S$, $R\\Gamma_{[S]}M$ is holonomic and Kashiwara's equivalence carries it to $S$, so the obstruction is a reading in the closed world and not the mathematics.\n\nVERDICT: FAIL\n";</script>
