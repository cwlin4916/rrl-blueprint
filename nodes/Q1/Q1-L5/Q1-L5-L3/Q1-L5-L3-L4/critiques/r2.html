\mathbf{D}_{coh}(H\\backslash S)$ and the Lemma wants $\\mathcal{D}_c(H\\backslash S)$, so the direction consumed is the descent direction, as claimed.\n\n---\n\n**Flaw 1** [MAJOR] [G] — This is the load-bearing joint and the reason given is a non-sequitur.\n\n<details><summary>(Step 8, line 46: \"so the categories it asserts about are those the Lemma names. That is asserted, not proved\") · the finding</summary>\n\n`defn:coherent_D_mod` is defined for *every* prestack, and a stack is a prestack; so the entry's $\\mathcal{D}_c(H\\backslash S)$ is that definition evaluated at the **stack**, and the Lemma's is the same definition at the **unsheafified quotient prestack**. These are different objects of $\\mathrm{PreStk}$ with different test categories — a $T$-point of the prestack is a map $T\\rightarrow S$ up to $H(T)$, of the stack an $H$-torsor $P\\rightarrow T$ with equivariant $P\\rightarrow S$ — so a priori $\\mathcal{D}_c(\\text{stack})\\subseteq\\mathcal{D}_c(\\text{prestack})$, with the inclusion the *same* way round on source and target, and neither statement entails the other. Notation cannot decide this; only descent can. The draft's own closing clause is right that the closed world has none: [Raskin torsor descent](../../../../../../appendix/bb-raskin-torsor-descent.html) is for $\\mathcal{D}^!$ over a **scheme** base, its note calls the stack case \"the gap a user must bridge\", and it says in terms that \"nothing is asserted about $\\mathcal{D}_c$\". A step wanting a fact no appendix entry supplies is a `GAP` and belongs in `gaps/g1.md`; asserting it inside the chain, and retracting it two steps *after* Step 6 has declared the Lemma proved, is the wrong disposal. The prover's \"no `GAP`\" is incorrect.\n\n</details>\n\n**Flaw 2** [MAJOR] [H] — Steps 3–6 therefore establish something strictly narrower than the Lemma, under two hypotheses the node's `## Statement` does not carry.\n\n<details><summary>(Step 2, line 28: \"the Lemma allows $\\tilde S$ non-separated and $S$ non-reduced. Steps 3–6 establish it for $\\tilde S$ separated and $S$ reduced\") · the finding</summary>\n\nThe entry is explicit that this is outside it (\"A node whose $S$ is non-reduced is outside what was checked\"), so citing the entry cannot close the general case. Disclosure is not proof, and the Caveats' \"under Step 2's reading\" concedes rather than repairs. Three exits — an entry covering non-reduced/non-separated, a `GAP`, or `/update` adding the hypotheses — and the draft chooses none.\n\n</details>\n\n**Flaw 3** [FATAL] [F] — I confirm Steps 9–10 independently; they sharpen [r1](r1.html) Flaw 5 from \"unsupported\" to \"cannot be supported\".\n\n<details><summary>(Lemma, line 22: \"this conclusion is exactly hypothesis **(C)** of Q1-L5-L3-L1 for a chart taken equivariantly\") · the finding</summary>\n\nFor $H=\\mathbb{G}_m$ on $\\tilde S=\\mathbb{A}^1$, $S=\\{0\\}$: $\\mathcal{Y}_0=B\\mathbb{G}_m\\subset\\mathcal{Y}=\\mathbb{G}_m\\backslash\\mathbb{A}^1$ is closed with empty interior, so no component of a test $\\tilde S_\\alpha$ maps into it and every nonempty $S_\\alpha\\hookrightarrow\\tilde S_\\alpha$ is a codimension-1 closed immersion of smooth finite-type schemes; $\\mathcal{D}_{\\tilde S_\\alpha}\\in\\mathcal{D}_c(\\tilde S_\\alpha)$ while $c_\\alpha^{\\,!}\\mathcal{D}_{\\tilde S_\\alpha}=\\mathcal{D}_{S_\\alpha\\rightarrow\\tilde S_\\alpha}$ is locally free of infinite rank over $\\mathcal{D}_{S_\\alpha}$ (HTT Rem. 1.5.10, as the [holonomic-shriek](../../../../../../appendix/bb-htt-holonomic-shriek.html) entry records). Some $S_\\alpha$ is nonempty by (B) applied to the test $\\mathrm{pt}\\rightarrow B\\mathbb{G}_m$. So (C) fails while the displayed conclusion holds. The prover has **not** manufactured a defect.\n\nI stop short of `REFUTED` for one reason: the sentence admits a second reading — perform the textual substitution and the result *is* the displayed conclusion — under which it is true and vacuous. It is ill-posed rather than demonstrably false; `/update` must delete or rewrite it either way.\n\nThe consequence the draft does not draw, and the one worth more than the flaw: the same computation shows (C) is **unsatisfiable at smooth charts of positive codimension**, whatever L4 proves. No equivariant variant repairs the link, so the chain L2 (giving (A),(B)) + L4 (giving (C)) $\\Rightarrow$ L1 is cut wrong at the decomposition, not at L4.\n\n</details>\n\n**Flaw 4** [MINOR] [G] The Lemma's $\\bar c^{\\,!}$ is the Kan-extended functor of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../../appendix/conv-d-shriek-d-star.html) and the entry's is Gunningham/DG's $f^!$ on stacks; the entry declares only the *object* dictionary, and Step 6 identifies the two *functors* silently — one more line for Step 7's ledger.\n\n**Flaw 5** [MINOR] [N] Step 1's headline \"smoothness of $\\tilde S$ is never consumed\" contradicts its own body, which consumes smoothness to get $\\tilde S$ reduced and hence a \"variety\"; say \"consumed only for reducedness\".\n\n**Flaw 6** [MINOR] [G] Step 10's \"Both $\\mathcal{Y}$ and $\\mathcal{Y}_0$ are smooth, so any family as in (B) has an $\\alpha$ with $S_\\alpha\\ne\\emptyset$\" — smoothness gives no nonemptiness; it gives smoothness of $c_\\alpha$'s source and target, which is what the witness needs.\n\n**Flaw 7** [MINOR] [B] The node's `objects:` still lists [equivariant coherent … is holonomic](../../../../../../appendix/bb-equivariant-finite-orbits-holonomic.html), which the rebuilt draft no longer uses; one line for the orchestrator.\n\n**Flaw 8** [MINOR] \"Smooth morphism to a prestack\" is still undefined in the closed world and Step 7 uses it for the atlas test — see [r1](r1.html) Flaw 9.\n\n---\n\n**Sort of the standing FATAL/MAJOR.** Flaw 1: **(c)** the closed world short — no descent or sheafification statement for $\\mathcal{D}_c$ — aggravated by the write-up disposing of it as an assertion instead of a `GAP`. Flaw 2: **(c)** the entry's \"variety\" reading does not reach the node's hypotheses, with **(b)** as the cheap alternative. Flaw 3: **(b)** the statement's, and it exposes **(d)** — L1's (C) is unsatisfiable at smooth charts, so the L2+L4 route into L1 does not close. Not every standing flaw is the closed world coming up short, so this round is `failing` and not `gapped`.\n\nVERDICT: FAIL\n";</script>
