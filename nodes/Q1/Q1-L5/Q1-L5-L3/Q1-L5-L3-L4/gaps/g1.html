<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L5</a><i>›</i><a href="../../index.html">Q1-L5-L3</a><i>›</i><a href="../index.html">Q1-L5-L3-L4</a><i>›</i><span>g1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Gap g1 — Q1-L5-L3-L4: coherence has no reading on a singular scheme</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/gaps/g1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [write-up](../proof.html) · [critique r1](../critiques/r1.html) · [appendix](../../../../../../appendix/index.html)\n\n**Opened:** 2026-08-07, from `proof.md` line 56 and the rescoping in `critiques/r1.md` Flaws 1–2.\n**Wanted:** appendix entries for `blueprint/appendix/5-sheaf-theory/`, plus one ratified reading in `blueprint/context.md`.\n\nThis file is a **prompt**. Paste it whole into a model that has never seen this repository; what comes back should be appendix entries ready to land. It is append-only and outside the closed world: nothing cites it, and it justifies nothing.\n\n## Statement\n\nThis is the claim that cannot currently be proved. It is not in dispute — the prover expected it true and had no counterexample.\n\nLet $H$ be an affine algebraic group of finite type over $k$ acting on a smooth finite-type $k$-scheme $\\tilde S$, let $c\\colon S\\hookrightarrow\\tilde S$ be an $H$-stable closed immersion, and let\n\n$$\n\\bar c\\colon H\\backslash S\\longrightarrow H\\backslash\\tilde S\n$$\n\nbe the induced morphism of quotient prestacks. Assume:\n\n**(A) Finitely many orbits.** $H$ has finitely many orbits on $\\tilde S$.\n\nThen $!$-restriction along $\\bar c$ sends $\\mathcal{D}_c(H\\backslash\\tilde S)$ into $\\mathcal{D}_c(H\\backslash S)$, coherence on each of the two prestacks being that of the entry [coherent $\\mathcal{D}$-modules](../../../../../../appendix/defn-coherent-d-mod.html).\n\n**Note that $S$ is not assumed smooth.** $\\tilde S$ is; $S$ is a closed subscheme of it and is singular in general. That asymmetry is the whole of the difficulty.\n\n## Where the argument stalls\n\nThe write-up proves the statement when $S$ is smooth, in eight steps, and stops at Step 8 otherwise. Two things go missing at once.\n\n**(i) Coherence on $H\\backslash S$ has no reading.** The repository defines coherence by testing: an object of $\\mathcal{D}(\\mathcal{Y})$ is coherent when its $!$-restriction along every **smooth** map $f\\colon T\\rightarrow\\mathcal{Y}$ from a finite-type dg-scheme is a finite complex with coherent cohomology. For $\\mathcal{Y}$ smooth this is a definition with content. For $\\mathcal{Y}$ singular, the tests still exist but the repository has never said what \"coherent cohomology\" means on a singular $T$, so the condition is empty and Step 5 asserts nothing.\n\n**(ii) Preservation is unavailable, and is not a formality.** The entry the smooth case leans on — [$!$-restriction preserves holonomicity](../../../../../../appendix/bb-htt-holonomic-shriek.html) — requires **both** varieties smooth. It also records, in its source's own words, that $!$-restriction along a general morphism does *not* preserve coherence, with an explicit witness where the morphism is a closed embedding. So the wanted preservation cannot be assumed; holonomicity, not coherence, is what survives, and the argument has to route through it.\n\n**What the referee added.** The write-up asked for two facts. The referee checked and found that **granting both, the proof still cannot be finished**: the two named facts live on the *scheme* $S$, while the conclusion is about the *prestack* $H\\backslash S$, and the bridge between them is exactly the step the smooth case got for free. Items (4) and (5) below are the referee's additions, and item (1) is its observation that one of the four is not a new entry at all.\n\n## What to deliver\n\nFive items. **Item 1 is not a new entry** — it changes a reading the whole repository already depends on, and writing it as a new file beside the old one would silently alter what a dozen proved nodes claim.\n\n1. **`amends` the ratified reading of coherence** (belongs in `blueprint/context.md` as a ratified reading, and the entry `defn:coherent_D_mod` must then point at it). State what \"a finite complex with coherent cohomology\" means on a **singular** finite-type test scheme, so that the testing definition has content for a singular target. Then prove that this reading agrees with the Kashiwara description of item 2 wherever both apply — otherwise the conclusion of the node is being stated in a term that means two things.\n\n2. **`new entry` — Kashiwara's equivalence.** For a closed immersion $c\\colon S\\hookrightarrow\\tilde S$ into a smooth scheme, the direct image induces an equivalence\n   $$c_{*,\\mathrm{dR}}\\colon \\mathcal{D}(S)\\;\\xrightarrow{\\ \\sim\\ }\\;\\mathcal{D}_S(\\tilde S)$$\n   onto the full subcategory of objects supported on $S$. State the hypotheses exactly, including what is needed of $S$ (nothing, beyond being a closed subscheme) and of $\\tilde S$ (smooth).\n\n3. **`new entry` — local cohomology preserves holonomicity.** That $c_{*,\\mathrm{dR}}c^!M\\simeq R\\Gamma_{[S]}M$ is holonomic for $M\\in D^b_h(\\mathcal{D}_{\\tilde S})$. Equivalently: that $j_*$ preserves holonomicity for the open complement $j\\colon\\tilde S\\setminus S\\hookrightarrow\\tilde S$. Say which of the two you are stating and derive the other, or state both.\n\n4. **`new entry` — smooth $!$-restriction preserves the reading of item 1, with singular target.** For $g\\colon T'\\rightarrow S$ smooth and $S$ singular, $g^!$ preserves the item-1 notion of coherence. In the smooth case this came from the Prop. 1.5.13(ii) line of the holonomicity entry, which is declared for smooth targets only, so it does not transfer.\n\n5. **`new entry` — smooth descent of coherence and boundedness, singular.** That boundedness and the item-1 notion descend along a smooth surjection $\\pi\\colon T'\\rightarrow T$ with $T$ and $T'$ both singular. Note for whoever writes this: the obvious shortcut is a trap — $\\pi$ is Zariski-locally split, but restricting along a section is $!$-restriction along a *closed* embedding, which is exactly what does not preserve coherence. The intended route is flat descent of finite presentation for the cohomology sheaves.\n\n## Rules\n\n**Read locally first.** The source PDFs are in `papers/`, indexed by `papers/guideline.md`. Open the PDF before relying on memory and before searching the web. If a wanted source is not on disk, say so explicitly and record what page-level check is still owed rather than asserting the statement as verified.\n\n**One file per object**, at `blueprint/appendix/5-sheaf-theory/<anchor>.md`, opening with `# <a id=\"anchor\"></a> <title>`.\n\n**Every entry carries**: the statement in full; a `role:` line; a `hypotheses:` line spelling out what the source actually requires and, where it matters, which hypothesis is doing the work; a `used by:` line; and a **dictionary note** reconciling the source's conventions with this repository's — which functor is which, which category is which, what base field the source works over and whether the transfer is automatic. Model the shape on `blueprint/appendix/5-sheaf-theory/bb-htt-holonomic-shriek.md`, whose dictionary note is three lines and is the reason that entry is usable.\n\n**Citations.** Use only bib keys present in `refs.bib`. If the source has no key, carry the full bibliographic data in prose and say the key is absent — `refs.bib` is manuscript territory and no agent writes it.\n\n**Markdown, not LaTeX.** Standard KaTeX only; no house macros. Display math in `$$ … $$` blocks with a blank line either side; `$…$` is for symbols inside a sentence.\n\n**Stop rather than paper over.** If one of the five turns out to be false, or to need a hypothesis this node does not have — in particular if item 1 cannot be made to agree with item 2 — say so and stop. That answer is worth more than an entry that hides the mismatch, because the node would then need its statement changed rather than its appendix widened.\n";</script>
