<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L5</a><i>›</i><a href="../../index.html">Q1-L5-L3</a><i>›</i><a href="../index.html">Q1-L5-L3-L4</a><i>›</i><span>g2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Gap g2 — Q1-L5-L3-L4: coherence on a quotient prestack is not known to agree with coherence on the quotient stack</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/gaps/g2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [write-up](../proof.html) · [critique r2](../critiques/r2.html) · [g1](g1.html) · [appendix](../../../../../../appendix/index.html)\n\n**Opened:** 2026-08-09, from `critiques/r2.md` Flaw 1, which the referee sorted to the closed world and not to the statement.\n**Wanted:** one appendix entry, and it must be about the comparison itself rather than about either side of it.\n\nThis file is a **prompt**. Paste it whole into a model that has never seen this repository. It is append-only and outside the closed world: nothing cites it, and it justifies nothing.\n\n## Statement\n\nThe node's Step 8 needs the following, and nothing in the appendix supplies it.\n\nLet $H$ be an affine algebraic group of finite type over $k$ acting on a separated finite-type $k$-scheme $Y$. Write $H\\backslash Y$ for the quotient **prestack** — the functor of points, before any sheafification — and $\\left[H\\backslash Y\\right]$ for the quotient **stack**, its sheafification in the smooth topology. Coherence on a prestack $\\mathcal{Y}$ is that of `defn:coherent_D_mod`: $\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y})$ when $f^!\\mathcal{F}$ is a finite complex with coherent cohomology for every smooth $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a finite-type dg-scheme.\n\nWanted: that the canonical map $H\\backslash Y\\rightarrow\\left[H\\backslash Y\\right]$ induces an identification\n\n$$\n\\mathcal{D}_c\\left(\\left[H\\backslash Y\\right]\\right)\\;\\simeq\\;\\mathcal{D}_c\\left(H\\backslash Y\\right),\n$$\n\nor, failing an equivalence, whichever one-sided containment is true, stated with the hypotheses that carry it.\n\n## Where the argument stalls\n\nThe node's conclusion is about the **prestack** $H\\backslash S$, because every consumer above it — `Q1-L5-L3`, and the recollement of `Q1-L5` — is written in those terms. The entry that supplies the mathematics, [Gunningham: $!$-restriction preserves coherence on finite-orbit quotient stacks](../../../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html), is about the **stack**: its source sets up $\\mathbf{D}(Y/K)$ for $Y/K$ a quotient stack and says so on the page.\n\nThe draft bridged the two in one sentence — that `defn:coherent_D_mod` \"applies to every prestack, so the categories it asserts about are those the Lemma names\" — and the referee rejected it as a non-sequitur, correctly. The definition applying to both objects does not make the two objects the same, and it does not make the two categories the same: **a prestack and its sheafification have different test categories**, so $\\mathcal{D}_c$ of each is a limit over a different diagram. The inclusion of test categories runs the same way on source and target, so no containment follows formally in either direction.\n\n**A second consumer, and it is the same question from the other side.** The note *Open tension on ind-schemes* in [$\\omega_{\\mathcal{Y}}$](../../../../../../appendix/not-dualizing-object.html) records a conflict nobody has resolved: taking $\\mathcal{D}^!$ as the Kan extension, $\\omega_{\\mathcal{Y}} = p_{\\mathcal{Y}}^!(k)$ exists for $\\mathcal{Y} = \\mathrm{Gr}$ or $LX$ and satisfies $f^!\\omega_{\\mathcal{Y}} = \\omega_S$ at every smooth finite-type test, so **the letter of `defn:coherent_D_mod` makes it coherent with support everything** — which contradicts the colimit presentations of [sheaves on a placid ind-scheme](../../../../../../appendix/ex-sheaf-placid-ind.html), under which every object comes from a stage and has bounded support. That entry's guess is that the colimit categories are a *subcategory* of the Kan-extended $\\mathcal{D}^!(\\mathcal{Y})$, and it is currently quarantined to one-stage $\\mathcal{Y}$ pending a resolution.\n\nThe two questions have one root. **`defn:coherent_D_mod` quantifies over \"every smooth $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a finite-type dg-scheme\", and when $\\mathcal{Y}$ is not a scheme nothing in the appendix pins down what that quantifier ranges over** — not across stackification, which is this gap, and not across Kan extension versus colimit, which is that note. An answer that fixes the quantifier properly should settle both; an answer that only compares the two categories in this gap's display will settle one. **Prefer the first**, and say explicitly which of the two you have delivered.\n\nThis is the same shape as the trap recorded in [g1](g1.html) and in the sibling gap on `Q1-L5-L3`: **a fact about one geometric object is not a fact about another one that maps to it.** The bridge has to be part of the statement rather than assumed to be free.\n\n## What to deliver\n\nTwo items. The second exists because the first may not be an equivalence.\n\n1. **`new entry` — the comparison, stated with its hypotheses.** Say what is true of $\\mathcal{D}_c\\left(H\\backslash Y\\right)$ versus $\\mathcal{D}_c\\left(\\left[H\\backslash Y\\right]\\right)$ for $H$ affine of finite type acting on a separated finite-type $Y$, and say precisely which hypotheses carry it — on $H$ (smooth? connected? reductive?), on $Y$, and on the topology in which the sheafification is taken. If the honest answer is a containment in one direction only, that is the entry; state which direction and stop. **If it is false or unknown in the generality asked for, say so and stop** — that answer sends the node to `/update` for a statement at the other level, which is more useful than an entry that quietly assumes what it should prove.\n\n2. **`new entry` or `amends` — the descent that carries it, whichever the source supports.** The suspected mechanism is that a smooth test of the *stack* pulls back along the atlas $Y\\rightarrow\\left[H\\backslash Y\\right]$ to an $H$-torsor, and coherence of $\\mathcal{D}$-modules on finite-type schemes is smooth-local; so coherence may be checked on the atlas, and the atlas is common to the prestack and the stack. If an entry already in `blueprint/appendix/` states this, **do not duplicate it — name it and say why it reaches**, since the referee's objection at r2 was precisely that the entry offered does not. In particular [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../../../appendix/bb-raskin-torsor-descent.html) is the nearest thing on disk and is **not** it: it is stated over a scheme base and its own hypotheses line says that nothing is asserted there about $\\mathcal{D}_c$.\n\nSuspected homes, none verified: `drinfeld2013some` §§9–10 (the safety and coherence material, pp. 100–120 of the arXiv PDF, on disk); `GR17vol1` III.4; `gaitsgory2014crystalsdmodules` for the prestack-level definition of $\\mathcal{D}$ by right Kan extension.\n\n**Do not accept a statement about the stack alone for either item.** That is the defect this gap exists to record.\n\n## Rules\n\n**Read locally first.** The source PDFs are in `papers/`, indexed by `papers/guideline.md`. Open the PDF before relying on memory and before searching the web. If the source is not on disk, say so and record what page-level check is owed rather than asserting the statement as verified.\n\n**One file per object**, at `blueprint/appendix/<section>/<anchor>.md`, opening with `# <a id=\"anchor\"></a> <title>`. The appendix is sectioned by topic — `coherence-holonomicity`, `sheaf-functoriality`, `placid-geometry`, `orbits-and-strata` and others; `blueprint/appendix/index.md` is the listing and an entry it omits is invisible to the builder. This one most likely belongs in `coherence-holonomicity`.\n\n**Every entry carries**: the statement in full; a `role:` line; a `hypotheses:` line saying what the source actually requires and which hypothesis does the work; and a **dictionary note** reconciling the source's conventions with this repository's — which functor is which, which category is which, what base field, and whether the transfer is automatic or declared. Model the shape on `blueprint/appendix/sheaf-functoriality/bb-htt-holonomic-shriek.md`.\n\n**Citations.** Only bib keys present in `refs.bib`. If the source has no key, carry the full bibliographic data in prose and say the key is absent.\n\n**Markdown, not LaTeX.** Standard KaTeX only, no house macros. Display math in `$$ … $$` blocks with a blank line either side.\n\n**Stop rather than paper over.** If item 1 is false in the generality asked for, that is the finding, and it is worth more than an entry that hides it.\n";</script>
