a closed immersion $c_\\alpha\\colon S_\\alpha\\hookrightarrow\\tilde S_\\alpha$ of finite-type dg-**schemes** serving as smooth tests, whereas this Lemma concludes about the quotient **prestacks** $H\\backslash\\tilde S$ and $H\\backslash S$, which are not such tests — for …\n\nThe statement below is the current one; the flag is standing, and nothing in this packet clears it.\n\n## What this node needs before it can be settled\n\nThe repository's own one-line statement of what is missing here. It is a request, not a premise: nothing in it is established and nothing in it may be used as a step. If you can supply it — with a source — that is the most useful thing you can return.\n\n> The Gunningham entry this line used to ask for is written and checked, so what is left is one fact and it is named in [g2](gaps/g2.html): that coherence in the sense of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) on the quotient **prestack** $H\\backslash S$ agrees with coherence on the quotient **stack**, the two having different test categories and neither inclusion being formal. [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../../appendix/bb-raskin-torsor-descent.html) is the nearest entry and states in as many words that nothing is asserted there about $\\mathcal{D}_c$; the suspected home is smooth descent of coherence along a torsor atlas, in [[drinfeld2013some](../../../../../../papers/drinfeld2013some.pdf)] §§9–10 or [[GR17vol1](../../../../../../papers/GR17vol1.pdf)] III.4. Separately and for the **user**, not for a model: whether hypothesis **(C)** of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html) is satisfiable at all — [r2](critiques/r2.html) Flaw 3 argues it is not, at any smooth chart of positive codimension, which would make the route through that node mis-cut rather than unproved. This is a leaf, so a `PASS` alone takes $D$ from $-1$ to $+1$: $100$ points, $-50\\%\\rightarrow+50\\%$; nothing beneath it has to move, and `/examples` is worth a further $21$ at most, $L$ being silent.\n\n## Task\n\nProve the target claim rigorously under exactly the stated hypotheses. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q1: When is $\\mathcal{D}_{c}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_{c}(K\\backslash LX)$?](../../../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../../../Q1-L3/index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../../key_examples/k4.html), the symplectic period [K6](../../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../../key_examples/k9.html); and [K6](../../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It refines [Q1-L5-L3](../index.html). Its conclusion is required directly by [Q1-L5-L3](../index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-09 — `/prove` r2: the atlas descent is deleted and the argument survives, the closing paragraph does not.** Round 2 on disk, `VERDICT: FAIL` ([r2](critiques/r2.html)), 994/1500 words. The draft was a **rebuild** and not a patch: the new entry [Gunningham: $!$-restriction preserves coherence on finite-orbit quotient stacks](../../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html) states the conclusion at stack level, so the descent to the atlas $\\tilde S$ that every one of [r1](critiques/r1.html)'s five MAJORs attacked is simply not performed. Flaws 1, 3, 4, 8, 9 and 10 of r1 are gone with it, and none was answered — they were deleted along with the manoeuvre they objected to.\n\n  **The referee checked the three entries written that same day against their sources and they hold.** `gunningham2017deriveddecompositionequivariant` pp. 15–18 and `drinfeld2013some` pp. 112–113 and 122 were read on the page: Rem. 2.28, Rem. 2.25, §2.4, Prop. 2.20, Ex. 2.27, Rem. 2.26, Def. 10.2.2, Cor. 10.2.7 and §11.2.1 are quoted verbatim and in scope. That is worth recording, because all three had had exactly one pass of scrutiny when the round began.\n\n  **What now stands, sorted by owner.** Flaw 1 [MAJOR] and Flaw 2 [MAJOR] are the **closed world** coming up short; Flaw 3 [FATAL] is the **statement's** and exposes a **decomposition** cut wrong. Because not every standing flaw is the closed world, the status is `failing` and not `gapped`.\n\n  - **Flaw 1** — the entry is about the quotient *stack* and the Lemma about the quotient *prestack*, and Step 8 bridged them by observing that [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) applies to both. It does, and that is not an argument: the two have different test categories, and the inclusion runs the same way on source and target, so neither $\\mathcal{D}_c$ contains the other formally. Commissioned as [g2](gaps/g2.html).\n  - **Flaw 3** — the closing paragraph claimed the conclusion \"is exactly hypothesis **(C)**\" of [Q1-L5-L3-L1](../Q1-L5-L3-L1/index.html). The prover found it false and the referee confirmed it independently: **(C)** quantifies over finite-type dg-scheme tests and $H\\backslash\\tilde S$ is not one — for $\\tilde S=\\mathrm{pt}$ it is $BH$ — and the $\\mathbb{G}_m$-on-$\\mathbb{A}^1$ case has the stack-level conclusion **true** and literal **(C)** **false**. `REFUTED` was declined only because the sentence admits a substitution reading under which it is true and vacuous.\n\n  **§3g acted on the statement in this invocation** — [u1](updates/u1.html). The closing paragraph is **deleted**, and $\\tilde S$ gains *separated* and $S$ gains *reduced*, which the argument consumes through the entry's declared reading of *variety* and did not declare. The revision is **material**: Steps 9 and 10 of the draft are about the deleted sentence, so `proof.md` now argues a claim the node no longer makes and the next `/prove` rebuilds those two steps; Steps 1–8, which prove the surviving conclusion, stand. No re-proof here — the cap counts rounds per invocation.\n\n  **The finding that reaches furthest, and this run did not act on it.** The referee argues the same computation shows **(C)** is unsatisfiable at *any* smooth chart of positive codimension, which would make the L2 + L4 $\\Rightarrow$ L1 route mis-cut rather than merely unproved, and that no equivariant variant of L4 repairs it. This run verified the single exhibited case and not the universal claim; it is recorded in [u1](updates/u1.html) for a repo-wide run and is the most consequential thing on this page.\n\n## Target statement\n\nLet $H$ be an affine algebraic group of finite type over $k$ acting on a smooth, separated, finite-type $k$-scheme $\\tilde S$, let $c\\colon S\\hookrightarrow\\tilde S$ be an $H$-stable closed immersion with $S$ reduced, and let\n\n$$\n\\bar c\\colon H\\backslash S\\longrightarrow H\\backslash\\tilde S\n$$\n\nbe the induced morphism of quotient prestacks. Assume:\n\n**(A) Finitely many orbits.** $H$ has finitely many orbits on $\\tilde S$.\n\nThen $!$-restriction along $\\bar c$ — the functor $\\bar c^{\\,!}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) — sends $\\mathcal{D}_c\\left(H\\backslash\\tilde S\\right)$ into $\\mathcal{D}_c\\left(H\\backslash S\\right)$, coherence on each of the two prestacks being that of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html).\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../../appendix/conj-intro.html) holds for $X$.\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../../../appendix/conv-d-shriek-d-star.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), ratified at [Q1-L1](../../../Q1-L1/index.html).\n\n### [$!$-restriction preserves holonomicity along any morphism](../../../../../appendix/bb-htt-holonomic-shriek.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** (Hotta, Takeuchi, Tanisaki, *D-Modules, Perverse Sheaves, and Representation Theory*, Progress in Mathematics **236**, Birkhäuser 2008, **Theorem 3.2.3(ii)**, p. 84; external, no main.tex label, and no `refs.bib` key — see the notes). Let $f\\colon X\\rightarrow Y$ be a morphism of smooth algebraic varieties, and write\n\n$$\nf^{\\dagger} := Lf^{*}[\\dim X-\\dim Y]\n$$\n\nfor the inverse-image functor. Let $D^b_h(\\mathcal{D}_Y)\\subseteq D^b(\\mathcal{D}_Y)$ denote the full subcategory of complexes whose cohomology is holonomic. Then $f^{\\dagger}$ restricts to a functor\n\n$$\nf^{\\dagger}\\colon D^b_h(\\mathcal{D}_Y)\\longrightarrow D^b_h(\\mathcal{D}_X).\n$$\n\nNo hypothesis is placed on $f$: it need not be smooth, proper, flat, or non-characteristic for the object being restricted.\n\n- **hypotheses:** $X$ and $Y$ smooth algebraic varieties and $f$ an arbitrary morphism between them. The hypothesis that carries the theorem is on the **object**, not on the morphism: the complex must have *holonomic* cohomology. Coherence alone does not suffice, and the source says so in as many words — §3.2.1, p. 84: \"neither $\\int_f$ nor $f^{\\dagger}$ preserves the coherency for general morphisms $f$\", with the witness at Remark 1.5.10, p. 33, where $f$ is a closed embedding with $\\dim X<\\dim Y$ and $D_{X\\rightarrow Y}=Lf^{*}D_Y$ is locally free of infinite rank over $D_X$. Since a holonomic complex is in particular coherent, the conclusion gives $f^{\\dagger}M\\in D^b_c(\\mathcal{D}_X)$ as a corollary, and that corollary is what a citing node uses.\n- **note:** *Dictionary with the blueprint's conventions.* Three lines, each of which a citing node inherits.\n\n  $f^{\\dagger}$ **is** the blueprint's $f^{!}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) on $\\mathrm{AffSch}^{f.t.}$: the source's Prop. 1.5.16 identifies $i^{\\dagger}$ with $Ri^{\\flat}$, the right adjoint of $\\int_i$, which is the $!$-pullback the blueprint's Kan extension is built from. A degree shift affects neither coherence nor holonomicity, so the two may be used interchangeably inside this entry.\n\n  $D^b_c(\\mathcal{D}_Y)$ **is** $\\mathcal{D}_c(Y)$ of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) for $Y$ smooth of finite type: the test $f=\\mathrm{id}$ gives one inclusion, and the source's Prop. 1.5.13(ii) — for $f$ smooth, $f^{*}$ is exact and carries coherent modules to coherent modules — gives the other. A scheme smooth over a smooth $Y$ is itself smooth, so admitting dg-scheme tests adds nothing here.\n\n  The source works over $\\mathbb{C}$, the blueprint over $k$ algebraically closed of characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html)). Nothing in the statement or in the dimension estimate behind it is sensitive to the difference; the transfer is declared by this entry rather than read off a line of the source.\n- **note:** **The bibliography key is absent, and adding one is the user's call.** `refs.bib` has no entry for this book. The key `HTT` and the file `papers/HTT.pdf` are **Lurie, *Higher Topos Theory*, Annals of Mathematics Studies 170** — a different book, verified on p. 1 of that PDF on 2026-08-06. `refs.bib` is manuscript territory and no agent writes it, so this entry carries the full bibliographic data in prose above and cites no key; a node invoking it must do the same.\n- **note:** *Provenance, and what is owed.* The book is not in `papers/`, so the page could not be opened on the run that wrote this entry. The theorem number, the page and the two quoted sentences reproduce a page-level reading made inside this repository on 2026-08-06 by an operator that had the book to hand; they were not re-verified here. A page-level check is owed before a write-up leans on the entry, and the cheapest way to discharge it is to put the PDF in `papers/` under whatever key the user chooses.\n\n### [Gunningham: $!$-restriction preserves coherence along a closed immersion of finite-orbit quotient stacks](../../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[gunningham2017deriveddecompositionequivariant, Rem. 2.28, p. 18 and Rem. 2.25, p. 17](../../../../../../papers/gunningham2017deriveddecompositionequivariant.pdf)], together with [[drinfeld2013some, Def. 10.2.2, p. 112 and §11.2.1, p. 122](../../../../../../papers/drinfeld2013some.pdf)]; external, no main.tex label). Let $H$ be an affine algebraic group of finite type acting on a variety $\\tilde S$ of finite type with **finitely many $H$-orbits**, let\n\n$$\nc\\colon S\\hookrightarrow\\tilde S\n$$\n\nbe an $H$-stable closed immersion of finite-type schemes, and let $\\overline{c}\\colon H\\backslash S\\rightarrow H\\backslash\\tilde S$ be the induced morphism of quotient stacks. Then $\\overline{c}^{\\,!}$ restricts to a functor\n\n$$\n\\overline{c}^{\\,!}\\colon\\mathcal{D}_c\\left(H\\backslash\\tilde S\\right)\\longrightarrow\\mathcal{D}_c\\left(H\\backslash S\\right).\n$$\n\nNeither $S$ nor $\\tilde S$ is required to be smooth, and no finiteness is required of the $H$-orbit set on $S$: finiteness of the orbit set is a hypothesis on the **target** $\\tilde S$ alone.\n\n- **hypotheses:** three, of which only the first does any work.\n\n  *Finitely many $H$-orbits on $\\tilde S$* is the load-bearing hypothesis. It is what upgrades *coherent* to *holonomic* on the source stack, by the source's Rem. 2.28, p. 18: \"When $X$ is a finite orbit stack (for example, a quotient stack $Y/K$ where $K$ acts on $Y$ with finitely many orbits), every coherent complex on $X$ is regular holonomic.\" Without it the conclusion fails for the same reason it fails on schemes — coherence is not preserved by $!$-pullback along a closed immersion, which is the witness recorded in the hypotheses note of [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html).\n\n  *Safety of $\\overline{c}$* is a side condition and is automatic here, not something a citing node checks: $\\overline{c}$ is representable and quasi-compact, hence safe by [[drinfeld2013some, §11.2.1, p. 122](../../../../../../papers/drinfeld2013some.pdf)] — \"a quasi-compact algebraic space is safe in the sense of Definition 10.2.2. In particular, a quasi-compact representable morphism is safe.\" Safety is defined at Def. 10.2.2, p. 112: a stack is *locally safe* if the neutral connected component of the automorphism group of every geometric point is unipotent, a morphism is locally safe if all its geometric fibres are, and *safe* is locally safe together with quasi-compact.\n\n  *Finite type on $H$, $\\tilde S$, $S$*, over the base field of the source. This entry asserts nothing for a group or a space of infinite type; the failure of the analogous chain there is the whole content of [Raskin: in infinite type, holonomic does not imply coherent](../../../../../appendix/bb-raskin-holonomic-not-coherent.html), and a node working on $L^{+}G\\backslash LX$ may not read this entry as covering it.\n\n  Two pieces of the source's vocabulary are left imprecise by it, and the entry does not paper over either. The source never defines *finite orbit stack*; Rem. 2.28 offers the parenthetical \"for example, a quotient stack $Y/K$ where $K$ acts on $Y$ with finitely many orbits\", and the statement above uses **only** that parenthesized case and claims nothing for any wider reading of the term. The source likewise never defines *variety* (§2.4, p. 15 says only \"Let $Y$ be an algebraic variety\"); a closed subscheme of a variety need not be one under every convention, so the safe reading, and the one this entry intends, is *reduced separated of finite type* — which is exactly what the blueprint's orbit closures are, since [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html) takes them reduced. A node whose $S$ is non-reduced is outside what was checked.\n- **note:** *The three ingredients, and which step is an inference rather than a quotation.* The composite runs\n\n  $$\n  \\mathcal{D}_c\\left(H\\backslash\\tilde S\\right)\\subseteq\\mathbf{D}_{hol}\\left(H\\backslash\\tilde S\\right)\\xrightarrow{\\ \\overline{c}^{\\,!}\\ }\\mathbf{D}_{hol}\\left(H\\backslash S\\right)\\subseteq\\mathbf{D}_{coh}\\left(H\\backslash S\\right).\n  $$\n\n  The first inclusion is Rem. 2.28, p. 18, quoted above. The middle arrow is Rem. 2.25, p. 17: \"The category $\\mathbf{D}_{hol}(X)$ of holonomic complexes is the subcategory of $\\mathbf{D}_{coh}(X)$ consisting of complexes whose cohomology objects are holonomic. Although coherent complexes are not always preserved by the $D$-module functors, the holonomic subcategory is preserved (for safe morphisms). By Verdier duality it follows that we have the full six functors, including adjoint pairs $(f^{*},f_{*})$ and $(f_!,f^!)$ on holonomic complexes for any safe morphism $f$.\" The last inclusion is the definition Rem. 2.25 opens with, so it costs nothing.\n\n  **That $\\overline{c}$ is representable is an inference made by this entry, not a sentence read off a page.** The argument: $\\overline{c}$ becomes the closed immersion $c$ after the smooth surjective base change $\\tilde S\\rightarrow H\\backslash\\tilde S$, and being a closed immersion is smooth-local on the target, so $\\overline{c}$ is a closed immersion of stacks and in particular representable in the sense of [[drinfeld2013some, §11.1.2, p. 122](../../../../../../papers/drinfeld2013some.pdf)] (base change by any affine test yields an algebraic space); quasi-compactness is then $S$ and $\\tilde S$ of finite type. A node that wants this checked rather than granted must check it there.\n- **note:** **Prop. 2.20 is not a route to this, and the reader should stop looking for one.** [[gunningham2017deriveddecompositionequivariant, Prop. 2.20, p. 16](../../../../../../papers/gunningham2017deriveddecompositionequivariant.pdf)] lists what the $D$-module functors do on **coherent** complexes for a safe morphism of quotient stacks, and it covers exactly two cases: clause (1), $f$ proper, where $f_{*}$ preserves coherence; and clause (2), $f$ smooth of relative dimension $d$, where $f^{!}$ preserves coherence. A closed immersion is neither, and it appears nowhere in the proposition. So the conclusion above is reachable through Rem. 2.28 and Rem. 2.25 and through no shortcut in Prop. 2.20; the detour through holonomicity is the content, not a stylistic choice.\n\n  Rem. 2.25 is a *remark* and carries no proof in the source. What is black-boxed here is therefore an assertion the source makes in passing about its own six-functor formalism, not a numbered proposition with an argument attached.\n- **note:** *Dictionary with the blueprint's conventions.* Four lines, each of which a citing node inherits.\n\n  **Singular $S$ is in scope.** The source's §2.4, p. 15 opens: \"Let $Y$ be an algebraic variety, and $K$ an affine algebraic group acting on $Y$; let $X = Y/K$ denote the quotient stack (in general, the term *quotient stack* will refer to a stack that is of this form–these are the only stacks we will need to consider in this paper).\" Smoothness enters only in the next paragraph and only to identify the homotopy category — \"**If $X$ is a smooth variety**, then the (triangulated) homotopy category of $\\mathbf{D}(X)$ is the derived category of (the abelian category of) $D$-modules on $X$.\" So $\\mathbf{D}(Y/K)$ is set up for $Y$ an arbitrary variety, and a **singular** $S$ is within the scope of the statement above. This was verified on the page and is load-bearing: it is why the entry may be applied to an orbit closure.\n\n  **Left and right quotients.** The source writes $Y/K$ for the quotient of a $K$-variety and the blueprint writes $H\\backslash S$; the two name the same stack and the difference is notational only. This entry adopts the blueprint's side.\n\n  **Coherence.** Gunningham's $\\mathbf{D}_{coh}(X)$ is defined at §2.4, p. 15 as \"the category of bounded complexes each of whose cohomology objects is a coherent $D$-module\". That this agrees with $\\mathcal{D}_c$ of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), which instead quantifies over smooth tests $f\\colon S'\\rightarrow\\mathcal{Y}$ by finite-type dg-schemes, is standard for a finite-type quotient stack but **was not checked against a page on the run that wrote this entry, and is owed.** Until it is discharged, a node leaning on this entry is leaning on that identification as well.\n\n  **Field.** The source works over $\\mathbb{C}$ — §1.1, p. 1: \"Let $G$ be a connected, complex reductive group with Lie algebra $\\mathfrak{g}$\" — while the blueprint works over $k$ algebraically closed of characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html)). Nothing in the statement or in the orbit-dimension count behind Rem. 2.28 is sensitive to the difference; **the transfer is declared by this entry rather than read off a line of the source.**\n- **note:** *Two corroborations of the coherent-versus-compact warning, one of them sourced.* Note (ii) of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) records that coherent and compact part company on stacks. Gunningham says the same at §2.4, p. 15 — \"$\\mathbf{D}_{com}(X)\\subset\\mathbf{D}_{coh}(X)$, with equality when $X$ is a variety, but for a non-safe stack the inclusion is strict\" — with the witness at Ex. 2.27, p. 18: for $X = \\mathrm{pt}/T$ with $T$ an algebraic torus, $\\mathbf{D}_{com}(X) = \\Lambda-\\mathbf{Perf}$ and $\\mathbf{D}_{coh}(X) = \\Lambda-\\mathbf{Coh}$ for $\\Lambda = H_{*}(T) = \\mathrm{Sym}(\\mathfrak{t}[1])$, and Rem. 2.26 on the same page adds that $\\check{\\mathbf{D}}(X) = \\mathbf{D}(X)$ exactly when $X$ is safe. The *sourced* form of the dichotomy is [[drinfeld2013some, Cor. 10.2.7, pp. 112–113](../../../../../../papers/drinfeld2013some.pdf)], whose equivalent conditions on a quasi-compact algebraic stack $\\mathcal{Y}$ include (i) $\\mathrm{D\\text{-}mod}(\\mathcal{Y})^c = \\mathrm{D\\text{-}mod}_{coh}(\\mathcal{Y})$, (iv) all objects of $\\mathrm{D\\text{-}mod}(\\mathcal{Y})$ are safe, and (v) $\\mathcal{Y}$ is safe. Neither is needed for the statement above; both are recorded because a node reading this entry will be reasoning about $\\mathcal{D}_c$ on a stack and should have the boundary in view.\n\n### [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html)); ratified at [Q1-L1](../../../Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [An equivariant coherent $\\mathcal{D}$-module on a space with finitely many orbits is holonomic](../../../../../appendix/bb-equivariant-finite-orbits-holonomic.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** (Hotta, Takeuchi, Tanisaki, *D-Modules, Perverse Sheaves, and Representation Theory*, Progress in Mathematics **236**, Birkhäuser 2008, §11.6; external, no main.tex label, no `refs.bib` key, and **not verified at page level** — see the notes). Let $H$ be an affine algebraic group of finite type over $k$, with Lie algebra $\\mathfrak{h}$, acting on a smooth finite-type $k$-variety $\\tilde S$, and let\n\n$$\n\\mu\\colon T^{*}\\tilde S\\longrightarrow\\mathfrak{h}^{*}\n$$\n\nbe the moment map of the induced Hamiltonian action, $\\mu(y,\\xi)(v)=\\xi\\left(v_y\\right)$ for $v\\in\\mathfrak{h}$ with induced vector field $v_y\\in T_y\\tilde S$. Let $M$ be an $H$-equivariant coherent $\\mathcal{D}$-module on $\\tilde S$, and let $\\mathrm{Ch}(M)\\subseteq T^{*}\\tilde S$ be its characteristic variety. Then:\n\n1. $\\mathrm{Ch}(M)\\subseteq\\mu^{-1}(0)$;\n\n2. $\\mu^{-1}(0)=\\bigcup_{\\mathcal{O}}T^{*}_{\\mathcal{O}}\\tilde S$, the union taken over the $H$-orbits $\\mathcal{O}\\subseteq\\tilde S$ of their conormal bundles, each of pure dimension $\\dim\\tilde S$;\n\n3. if $H$ has only finitely many orbits on $\\tilde S$, then $\\dim\\mu^{-1}(0)=\\dim\\tilde S$, hence $\\dim\\mathrm{Ch}(M)=\\dim\\tilde S$ and $M$ is holonomic.\n\n- **hypotheses:** $H$ affine of finite type and $\\tilde S$ smooth of finite type, both over $k$ algebraically closed of characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html)). $M$ must be **equivariant in the strong sense** — the $\\mathfrak{h}$-action differentiating the $H$-action agrees with the one through the vector fields in $\\mathcal{D}_{\\tilde S}$ — which is what makes clause 1 true; a merely weakly equivariant module is not covered, and neither is a coherent module carrying no equivariant structure at all ($\\mathcal{D}_{\\tilde S}$ itself has $\\mathrm{Ch}=T^{*}\\tilde S$, of dimension $2\\dim\\tilde S$, so for $\\dim\\tilde S\\ge1$ it is excluded by clause 1 whenever clause 3's finiteness holds). Clause 3 needs the finiteness of the orbit set and nothing else: with $H$ trivial, $\\mu^{-1}(0)=T^{*}\\tilde S$ and the conclusion is false. Nothing is asserted here about $\\mathcal{D}_c$ on a quotient prestack — the identification of $\\mathcal{D}_c(H\\backslash\\tilde S)$ ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)) with the $H$-equivariant coherent $\\mathcal{D}$-modules on $\\tilde S$ is the citing node's own work.\n- **note:** *The mechanism, so that a reader can see what is being black-boxed.* Clause 1 is equivariance read on symbols: for $v\\in\\mathfrak{h}$ the vector field $v_{\\tilde S}$ acts on $M$ by an operator that the equivariant structure makes zero on the associated graded, so its symbol vanishes on $\\mathrm{Ch}(M)$, and those symbols are exactly the components of $\\mu$. Clause 2 is the identity $\\mu(y,\\xi)=0\\iff\\xi$ annihilates $T_y\\left(H\\cdot y\\right)$, i.e. $(y,\\xi)\\in T^{*}_{H\\cdot y}\\tilde S$; a conormal bundle to a locally closed smooth $\\mathcal{O}$ of dimension $d$ has dimension $d+\\left(\\dim\\tilde S-d\\right)=\\dim\\tilde S$. Clause 3 is the dimension count over a finite union, together with Bernstein's inequality $\\dim\\mathrm{Ch}(M)\\ge\\dim\\tilde S$ for $M\\ne0$ coherent.\n- **note:** **Not verified at page level, and the bibliography key is absent.** Two separate defects, both recorded rather than worked around.\n\n  The book is not in `papers/` — the key `HTT` and the file `papers/HTT.pdf` are **Lurie, *Higher Topos Theory*, Annals of Mathematics Studies 170**, a different book, verified on p. 1 of that PDF on 2026-08-06 — so the run that wrote this entry could not open the page. §11.6 is named above as the natural home in print for the equivariant theory this statement belongs to, and it is a *pointer, not a transcription*: no numbered result of the source is being quoted, and until a page is verified the three clauses above are the closed world's own statement of a standard fact, with its argument recorded in the note above. A node citing this entry inherits that status, and a page-level check is owed.\n\n  `refs.bib` has no key for the book, and `refs.bib` is manuscript territory that no agent writes; hence the full bibliographic data in prose above and no key anywhere. Adding a key is the user's call.\n\n### [Raskin: in infinite type, holonomic does not imply coherent](../../../../../appendix/bb-raskin-holonomic-not-coherent.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition, and the warning it carries** ([[raskin_dmodules_infinite_var, §5.1–§5.2, pp. 30–31, with §6.19, p. 44](../../../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). Let $S$ be a scheme of finite type, let $D_{coh}(S)\\subseteq D(S)$ be the compact objects, and let $D_{coh,hol}(S)\\subseteq D_{coh}(S)$ be the full subcategory of those coherent complexes whose cohomologies are holonomic in the usual sense. The source **defines** the holonomic category to be the ind-completion\n\n$$\nD_{hol}(S) := \\mathrm{Ind}\\left(D_{coh,hol}(S)\\right)\\subseteq D(S),\n$$\n\nand extends it to a quasi-compact quasi-separated $S$ by Kan extension, as $D^!_{hol}(S)$ and $D^*_{hol}(S)$, and to an indscheme likewise in §6.19. Consequently\n\n$$\nD_{hol}(S)\\not\\subseteq D_{coh}(S)\n$$\n\n**by construction**: an ind-completion has non-compact objects, and for $S$ of finite type $D_{coh}(S)$ *is* the subcategory of compact objects. The source states the intent in as many words at Rem. 5.1.1, p. 30 — \"Since many 'standard' $D$-modules in infinite type are not compact (e.g., the delta $D$-module concentrated at a point in an infinite type placid scheme), it is convenient to break conventions with the usual $D$-module theory and allow some non-compact $D$-modules to be counted as holonomic\" — and states the cost at footnote 6, p. 31: this \"completely ruins all the nice finiteness conditions that 'usual' (coherent) holonomic complexes satisfy, e.g., finiteness of de Rham cohomology.\"\n\n- **hypotheses:** none to check, because nothing is being concluded. The entry is a definition of the source together with the boundary that definition draws, and it is cited to **block** a step rather than to take one. What a node must instead check are the hypotheses of the two positive statements recorded below.\n\n  *Prop. 5.2.1, p. 31*, in the source's own words: \"For $f\\colon S\\rightarrow T$ a morphism of quasi-compact quasi-separated schemes, the morphism $f_{*,dR}\\colon D^*_{hol}(S)\\rightarrow D^*_{hol}(T)$ admits a left adjoint $f^{*,dR}$. If $T$ is placid and $f$ is finitely presented, then the morphism $f^{!}\\colon D^!_{hol}(T)\\rightarrow D^!_{hol}(S)$ admits a left adjoint $f_!$.\" So the $f_!$ half carries two hypotheses that the $f_{*,dR}$ half does not — **$T$ placid and $f$ finitely presented** — and the source repeats them at the end of the same proposition (\"Of course, we are assuming $f$ finitely presented and $T$ placid when discussing $f_!$\"). Its proof is deferred to §5.4.\n\n  *§6.19, p. 44*, the indscheme rendering. $D^!_{hol}$ and $D^*_{hol}$ are defined for an indscheme by Kan extension \"as in the definition of $D^!$ and $D^*$\"; there are forgetful functors $D^!_{hol}(S)\\rightarrow D^!(S)$ and $D^*_{hol}(S)\\rightarrow D^*(S)$, and \"For $S$ reasonable (resp. placid), $D^*_{hol}(S)\\rightarrow D^*(S)$ (resp. $D^!_{hol}(S)\\rightarrow D^!(S)$) is fully-faithful.\" Prop. 6.19.2 gives the partially-defined left adjoints, for $f$ a reasonable morphism of reasonable indschemes and, for the $f_!$ half, for $f$ of ind-finite presentation between placid indschemes. Cor. 6.19.4 reads: \"For $S$ and $T$ placid indschemes with a dimension theories and $f\\colon S\\rightarrow T$ a morphism, $f_{*,ren}$ and $f^{!,ren}$ preserve holonomic objects in $D^!$ and $D^*$ respectively.\"\n- **note:** **Why this entry exists: the finite-type chain breaks at its last link.** The standard argument in finite type runs\n\n  $$\n  \\text{finitely many orbits}\\ \\Rightarrow\\ \\text{coherent is holonomic}\\ \\Rightarrow\\ f^{!}\\ \\text{preserves holonomic}\\ \\Rightarrow\\ f^{!}\\ \\text{preserves coherent},\n  $$\n\n  which is exactly [Gunningham: $!$-restriction preserves coherence along a closed immersion of finite-orbit quotient stacks](../../../../../appendix/bb-gunningham-finite-orbit-stack-shriek.html), and whose last implication is also what the hypotheses note of [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html) currently hands a citing node as a free corollary — \"Since a holonomic complex is in particular coherent, the conclusion gives $f^{\\dagger}M\\in D^b_c(\\mathcal{D}_X)$ as a corollary, and that corollary is what a citing node uses.\" That last implication is *definitionally true* in finite type, where $D_{hol}\\subseteq D_{coh}$, and it is *false* in the source's infinite-type theory, where $D_{hol}$ is an ind-completion and $D_{coh}$ is the compacts inside it.\n\n  The operative consequence: **nothing proved at the level of finite-dimensional charts may be lifted to an $L^{+}G$-quotient of a placid ind-scheme ([placidity](../../../../../appendix/placid-ind-scheme.html), [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html)) on the strength of holonomicity.** Cor. 6.19.4 does say that $f^{!,ren}$ preserves holonomic objects there, and that statement is of no use for coherence, because the word \"holonomic\" in it has been redefined to include non-compact objects. A node that wants $f^{!}\\mathcal{F}\\in\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)) on an infinite-type space must obtain it some other way, and citing holonomicity is not a way.\n- **note:** *Dictionary with the blueprint's conventions.* Three lines.\n\n  The source's $D^!$ and $D^*$ are the blueprint's ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html)); §5.2 and §6.19 build $D^!_{hol}$ and $D^*_{hol}$ by the same Kan extension from finite type, so the holonomic categories sit over the blueprint's categories by the same construction and no transfer is being declared here.\n\n  The source's $D_{coh}(S)$ for $S$ of finite type is the compact objects — the parenthetical is the source's own, at §5.2, p. 30 — and it is that identification, valid in finite type, which makes \"non-compact\" and \"non-coherent\" the same word in the display above. On a stack the two part company, which is note (ii) of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html); nothing in this entry depends on the stacky case.\n\n  The source works over a field $k$ of characteristic $0$ (§1.13, p. 4: \"We work always over a field $k$ of characteristic 0\"), not assumed algebraically closed; the blueprint's $k$ is algebraically closed of characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html)), so the blueprint's setting is a special case of the source's and there is nothing to declare.\n- **note:** *Provenance, verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf`: §5 *Holonomic D-modules* opens on p. 30 with §5.1 and Rem. 5.1.1; the definition of $D_{hol}(S)$ is §5.2 on the same page; the sentence \"We refer to objects of $D_{hol}(S)$ simply as holonomic objects\", its footnote 6, the Kan extension to quasi-compact quasi-separated $S$ and Prop. 5.2.1 are all on p. 31; §6.19 with Def. 6.19.1, Prop. 6.19.2, Prop. 6.19.3 and Cor. 6.19.4 is on p. 44. Two transcription details kept as the source has them: footnote 6 reads \"This loss is obvious necessary for the infinite dimensional setting\", and §6.19 opens \"For $T$ an indscheme\" and then writes $S$ throughout.\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q1-L3-L4](../../../Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../../Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly the computation that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n### [Chen–Yi: an orbit closure in $LX$ contains only finitely many orbits — symmetric $X$ only](../../../../../appendix/bb-chenyi-finite-orbits-in-closure.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Cor. 27, p. 17](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/K$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$, $K = G^\\theta$ its fixed-point subgroup, assumed **connected**, and $I_0\\subseteq L^{+}G$ the Iwahori subgroup attached to the $\\theta$-stable Borel $B_0$. Then, in the source's own words:\n\n1. *(Cor. 27(i))* The closure of each $I_0$-orbit contains only finitely many $I_0$-orbits.\n2. *(Cor. 27(ii))* Each $L^{+}G$-orbit on $LX$ is a union of finitely many $I_0$-orbits.\n\n**Usable form, obtained here by derivation and not quoted from the source.** For every $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ ([$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html)) contains only finitely many $L^{+}G$-orbits; that is, the set $\\{\\mu\\in\\Lambda_X^+\\mid LX_\\mu\\subseteq\\overline{LX}_\\lambda\\}$ is finite.\n\n- **hypotheses:** three, of which the first does the work.\n\n  ***$X$ is symmetric.*** This is the hypothesis the statement rests on, and it is not removable by any remark in the source. Cor. 27 sits in §4 *Iwahori orbits* (pp. 14–20) and its proof is two lines, each of which invokes Lemma 26, p. 17 — \"The map $p\\colon\\mathcal{V}\\rightarrow\\mathcal{I}$ has finite fibers\" — whose own proof runs through the twisted-conjugation map $\\tau(g) = g\\theta(g)^{-1}$, the set $\\mathcal{V} = \\{g\\in LG\\mid\\tau(g)\\in N_{LG}(LT_0)\\}$ of §4.1, p. 15, the representatives $\\tau(\\dot v) = \\bar n_v t^\\lambda$ of Lemma 25, p. 17, the involutions $\\psi_{\\bar v} = \\mathrm{Ad}_{\\bar n_v}\\circ\\theta$, and the finiteness of $\\pi_0\\left(T_0^{\\mathrm{inv}\\circ\\psi_{\\bar v}}\\right)$. Every one of these objects presupposes the involution $\\theta$ and the presentation $X = G/K$. **So finitely many $L^{+}G$-orbits in a closure is sourced for symmetric $X$ only, and is not available for general spherical $X$.**\n\n  *$K = G^\\theta$ is connected.* The source declares this at the head of §4, p. 14: \"We will assume $K$ is connected from Section 4-Section 10. In the last Section 11, we discuss the case when $K$ is disconnected.\" Cor. 27 is inside that range, so the hypothesis is in force for it and a node may not drop it on the strength of §11 without reading §11.\n\n  *$\\Lambda_X^+$ is the source's $\\Lambda_S^+$.* The derived form above is stated in the blueprint's index set ([Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html)); the identification with the dominant restricted coweights $\\Lambda_S^+$ is clause 1 of [Chen–Yi symmetric orbit parametrization and closure relation](../../../../../appendix/bb-chenyi-symmetric-orbits.html), which carries the same symmetric hypothesis.\n- **note:** *The derivation, in full, so a reader can audit it.* By Cor. 27(ii) write $LX_\\lambda = \\mathcal{O}_{v_1}\\cup\\cdots\\cup\\mathcal{O}_{v_n}$, a finite union of $I_0$-orbits. Closure commutes with a finite union, so $\\overline{LX}_\\lambda = \\overline{\\mathcal{O}}_{v_1}\\cup\\cdots\\cup\\overline{\\mathcal{O}}_{v_n}$, and by Cor. 27(i) each $\\overline{\\mathcal{O}}_{v_i}$ contains only finitely many $I_0$-orbits; hence $\\overline{LX}_\\lambda$ contains only finitely many $I_0$-orbits. Now $I_0\\subseteq L^{+}G$, so every $L^{+}G$-orbit contained in $\\overline{LX}_\\lambda$ contains at least one $I_0$-orbit contained in $\\overline{LX}_\\lambda$, and distinct $L^{+}G$-orbits are disjoint. Finiteness follows. **This is an inference of the entry, not a corollary printed in the source**, and a node relying on it is relying on the entry rather than on a page.\n\n  *An immediate consequence when combined with the closure relation.* [Chen–Yi symmetric orbit parametrization and closure relation](../../../../../appendix/bb-chenyi-symmetric-orbits.html), clause 2 (the source's Thm. 18) gives $\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$ for symmetric $X$, so under that entry's hypotheses the derived form says exactly that each down-set $\\{\\lambda\\in\\Lambda_S^+\\mid\\lambda\\le\\mu\\}$ is finite. That is a statement about the closure order alone, and it inherits both entries' symmetric hypothesis.\n- **note:** **Two distinct scope limits ride on the same Remark 37, and they must not be conflated.** [[chenyi_2025singularitiesorbitclosuresloop, Rem. 37, p. 22](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] reads in full: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites, Theorem 36 remains true for general spherical varieties.\" It extends Theorem 36 and nothing else.\n\n  The limit recorded on [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) is that Remark 37 reaches clause (a) — placidity of the closures and finite presentation of the embeddings — and does **not** reach clause (b), the placid presentation of $LX$, because that is deduced from Lemma 38 (filteredness, p. 22), which the remark does not mention and whose proof is symmetric.\n\n  The limit recorded here is different in kind: Cor. 27 is not a clause of Theorem 36 at all. It lives two sections earlier, is proved by the symmetric-space machinery of §4, and Remark 37 says nothing whatever about it. So a node may not argue \"Remark 37 extends the results of the source to general spherical $X$\" and thereby acquire finiteness of the orbit set in a closure. The two limits share a remark and share nothing else.\n- **note:** *The source's own Appendix A.8 treats this as a hypothesis, not a theorem.* [[chenyi_2025singularitiesorbitclosuresloop, §A.8 *Pointwise purity*, p. 62](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] opens by fixing a locally equidimensional $H$-placid scheme $Y$ and assuming, among three standing conditions, \"(2) $Y$ is a union of finitely many $H$-orbits and for any orbit $\\mathcal{O}\\subset Y$ the inclusion $j\\colon\\mathcal{O}\\rightarrow Y$ is finitely presented.\" The source therefore assumes finiteness of the orbit set where it needs it rather than deriving it in that generality — which corroborates that it is a hypothesis and not a general theorem about placid orbit closures.\n- **note:** *Dictionary with the blueprint's conventions.* Three lines, one of which is a declared transfer.\n\n  **The Iwahori.** The source's $I_0$ is the Iwahori attached to the **$\\theta$-stable** Borel $B_0$ (§4.1, p. 14), while the blueprint's $I$ is the Iwahori attached to a chosen Borel $B$ ([the standing notation](../../../../../appendix/subsec-notations.html), main.tex:212). Reading the statement with the blueprint's $\\mathcal{O}_v$ of [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) requires taking $B = B_0$; that choice is available in the symmetric setting and is **declared here**, not read off a line of either text. The same identification is already in force in [Chen–Yi filtered orbit order and $\\pi_0(LX)$](../../../../../appendix/bb-chenyi-filtered-orbit-order.html).\n\n  **Field.** The source's standing field is $k = \\overline{\\mathbb{F}}_p$ of characteristic $p\\ne 2$ (§2.1, p. 9, repeating the opening of §1, p. 2), whereas the blueprint's $k$ is algebraically closed of characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html)). The source addresses this itself at §1.2.6, p. 9: \"In this paper, we work with $\\ell$-adic sheaves on schemes over fields of positive characteristic since Deligne's theory of weights plays a crucial role. The proofs are all geometric and hence are applicable in the setting of $D$-modules on schemes over complex numbers where one uses Saito's theory of mixed Hodge modules.\" That sentence is about the *sheaf-theoretic* arguments; Cor. 27 is not one of those — its proof is group-theoretic throughout, using only $\\tau$, $N_{LG}(LT_0)$, the Bruhat decomposition of $I_0$-double cosets and $\\pi_0$ of a fixed-point torus. **The transfer to the blueprint's characteristic-$0$ $k$ is declared by this entry rather than read off a line of the source**, in the same terms as the transfer declared on [$!$-restriction preserves holonomicity](../../../../../appendix/bb-htt-holonomic-shriek.html). A closely related but weaker sourced statement is the source's Rem. 19, p. 10, which says its argument for Thm. 18 \"is algebraic and works over an arbitrary algebraically closed field whose characteristic is not two\"; that remark is attached to Thm. 18 and not to Cor. 27.\n\n  **Orbit strata.** \"Orbit\" in the blueprint is fixed by the ratified reading on [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) as the fpqc-sheaf image of an orbit map, represented by a locally closed stratum; the finiteness assertions above are counts of those strata, and closures are the reduced ones of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html).\n- **note:** *Provenance, verified on the page.* Read in `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025, dated July 11 2025). Corollary 27 with its two-line proof is on **p. 17**, immediately after Lemma 25 and Lemma 26 on the same page; §4 *Iwahori orbits* opens on p. 14 and §5 opens on p. 20, so §4 occupies pp. 14–19. Remark 37 is on p. 22, Theorem 36 on p. 21, §A.8 on p. 62, §1.2.6 and §2.1 on p. 9. One notational flattening: the source distinguishes a script $V$, the quotient $L^{+}T_0\\backslash\\mathcal{V}/LK$ indexing $I_0$-orbits, from the calligraphic $\\mathcal{V}\\subseteq LG$ of §4.1, and writes the twisted involutions in the extended affine Weyl group with a script $I$; all of these are written $\\mathcal{V}$ and $\\mathcal{I}$ above, so a node needing the distinction should go to pp. 15–17 rather than take it from here.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../../appendix/ic-0.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{gunningham2017deriveddecompositionequivariant,\n      title={A Derived Decomposition for Equivariant $D$-modules},\n      author={Sam Gunningham},\n      year={2017},\n      eprint={1705.04297},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/1705.04297},\n}\n\n@book {HTT,\n    AUTHOR = {Lurie, Jacob},\n     TITLE = {Higher topos theory},\n    SERIES = {Annals of Mathematics Studie — **The variety.** The $\\mathrm{GL}$ analogue of K3, homogeneous with $K\\backslash LX \\simeq \\mathrm{GL}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{GL}_N}$. BZSV list it among the cases whose loop space is placid by strata of the affine Grassmannian (p. 156).\n- **K5 — Mirabolic: $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$** *(`positive`)* — **The variety.** The dual of the Godement–Jacquet space, with $(g,v)$ acted on by $(g_1,g_2)\\mapsto(g_1^{-1}gg_2,\\, vg_2)$. Its loop quotient is the mirabolic affine Grassmannian $\\mathrm{Gr}\\times\\mathcal{V}$ with $\\mathcal{V} = \\mathbf{V}\\otimes F$, $\\dim\\mathbf{V} = n$, acted on diagonally …\n- **K6 — Symplectic (Jacquet–Rallis) period: $X = \\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$** *(`positive`)* — **The variety.** Symmetric, hence spherical, and homogeneous with reductive stabilizer, hence smooth affine. Its dual is the Shalika-Whittaker reduction $\\check M = T^*(\\mathrm{GL}_{2n}/\\mathrm{GL}_n\\ltimes U,\\psi)$.\n- **K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m < n-1$** *(`adjacent`)* — **The variety.** The dual is $\\check X = \\mathrm{Mat}_{m\\times n}$ acted on by $\\check G = \\mathrm{GL}_m\\times\\mathrm{GL}_n$; the automorphic side is the Rankin–Selberg period for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$ outside the adjacent range covered by K4.\n- **K8 — Rank-1 affine homogeneous spherical varieties: the weakened form, in print** *(`weak`)* — **Why it is here.** This is the entry that shows the distinction this register turns on is real, and not a reading the blueprint imposed on the literature.\n- **K9 — The group case: $X = H$ under $G = H\\times H$** *(`degenerate`)* — **Why it is here.** To keep it out. BZSV §7.6.2 (pp. 168–169) identify the conjecture here with derived Satake, so the case is as settled as anything in the register — and useless as a …\n- **K10 — The Whittaker period: $M = T^*(G/\\!\\!/_{\\psi}U)$** *(`out-of-clas
