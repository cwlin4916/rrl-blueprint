<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L5</a><i>›</i><a href="../../index.html">Q1-L5-L3</a><i>›</i><a href="../index.html">Q1-L5-L3-L1</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u1 — the chart-level preservation the descent was assuming becomes a hypothesis</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L1/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L5-L3-L1](../index.html) · [history](../history.html) · [DAG index](../../../../../../dag.html) · [appendix](../../../../../../appendix/index.html)\n\nRun: `/update Q1-L5-L3-L1`, at the user's direction, as the first step of raising\n[Q1-L5](../../../index.html). The lead was this node's own\n[`/examples` run](../examples.html), verdict `EVIDENCE: counterexample`. No external passage\nwas supplied; the record on disk is the input, and it was re-derived rather than adopted.\n\n## The defect, in one sentence\n\nThe statement concludes that $u^!$ preserves coherence from hypotheses that hold for\n**every** closed immersion of smooth finite-type schemes, and $!$-restriction along such an\nimmersion does not preserve coherence.\n\n## What was verified, refuted, left unverified\n\n**Verified — the counterexample, recomputed rather than quoted.** For\n$i\\colon\\{0\\}\\hookrightarrow\\mathbb{A}^1$ the transfer bimodule is\n\n$$\nD_{\\mathrm{pt}\\rightarrow\\mathbb{A}^1} \\;=\\; \\mathcal{O}_{\\mathrm{pt}}\\otimes_{i^{-1}\\mathcal{O}_{\\mathbb{A}^1}} i^{-1}D_{\\mathbb{A}^1} \\;=\\; k\\otimes_{k[x]}k[x]\\langle\\partial\\rangle \\;\\simeq\\; k[\\partial],\n$$\n\nfree of infinite rank over $D_{\\mathrm{pt}}=k$, so $i^!\\mathcal{D}_{\\mathbb{A}^1}\\simeq k[\\partial][-1]$\nis an infinite-dimensional vector space in a single degree and is not coherent, while\n$\\mathcal{D}_{\\mathbb{A}^1}$ is. This is [examples.md](../examples.html) instance 2 and its\nsource, Hotta–Takeuchi–Tanisaki Remark 1.5.10 (p. 33), and the computation is the one the\nRemark records.\n\n**Verified — the hypotheses are discharged by that witness.** With $A=\\{\\alpha_0\\}$ and\n$\\tilde h_{\\alpha_0}=\\mathrm{id}_{\\mathbb{A}^1}$: **(A)** holds because closed immersions are\nstable under base change, so $\\tilde S\\times_{\\mathbb{A}^1}\\{0\\}=\\tilde h^{-1}(0)$ is closed\nin a finite-type $\\tilde S$; **(B)** holds because $S_{\\alpha_0}=\\{0\\}$ with\n$g_{\\alpha_0}=\\mathrm{id}$ smooth, and every test $h\\colon S\\rightarrow\\{0\\}$ has\n$S\\times_{\\{0\\}}\\{0\\}\\simeq S$ surjecting on $S$. Nothing is left over, so the conclusion is\nthe only thing that can fail, and it does.\n\n**Verified — the descent half is true, and it is the whole of what (B) was for.** Written out\nbelow as the reason the repair is a hypothesis and not a retraction.\n\n**Verified — equivariance alone does not rescue it.** Instance 3 of\n[examples.md](../examples.html) reduces to instance 2 at $K=\\{1\\}$. What that instance does\nestablish is where the missing hypothesis has to live: at the charts, not at the group.\n\n**Refuted — nothing.** The examples run's every load-bearing claim came out right.\n\n**Unverified — the two repairs the examples run names in print** (HTT Thm. 2.4.6,\nnon-characteristic; Thm. 3.2.3(ii), holonomic) were read as reported and not re-derived.\nNeither is adopted into a statement here; the second is the ground of the proposal in the\nreport, which is commissioned rather than assumed.\n\n## Old statement, verbatim\n\n> Let $u\\colon\\mathcal{Y}_0\\rightarrow\\mathcal{Y}$ be a morphism of prestacks, and call a\n> *test* of a prestack $\\mathcal{W}$ a smooth morphism $S\\rightarrow\\mathcal{W}$ with $S$ a\n> finite-type dg-scheme — the morphisms along which\n> [coherent $\\mathcal{D}$-modules](../../../../../../appendix/defn-coherent-d-mod.html)\n> constrains an object, read as in ratified reading 1 of\n> [context](../../../../../../context.html). Assume:\n>\n> **(A) Closed restriction.** For every test $\\tilde h\\colon\\tilde S\\rightarrow\\mathcal{Y}$\n> the fibre product $\\tilde S\\times_{\\mathcal{Y}}\\mathcal{Y}_0$ is representable by a\n> finite-type dg-scheme and its projection to $\\tilde S$ is a closed immersion.\n>\n> **(B) A covering family.** There is a family of tests\n> $\\left\\{\\tilde h_\\alpha\\colon\\tilde S_\\alpha\\rightarrow\\mathcal{Y}\\right\\}_{\\alpha\\in A}$\n> such that, writing\n>\n> $$\n> S_\\alpha := \\tilde S_\\alpha\\times_{\\mathcal{Y}}\\mathcal{Y}_0, \\qquad g_\\alpha\\colon S_\\alpha\\rightarrow\\mathcal{Y}_0\n> $$\n>\n> for the fibre product of (A) and its projection to $\\mathcal{Y}_0$, each $g_\\alpha$ is\n> smooth and every test $h\\colon S\\rightarrow\\mathcal{Y}_0$ admits a finite subset\n> $A_0\\subseteq A$ for which the fibre products $S\\times_{\\mathcal{Y}_0}S_\\alpha$,\n> $\\alpha\\in A_0$, are representable by finite-type dg-schemes and their projections to $S$\n> are jointly surjective.\n>\n> Then $!$-restriction along $u$ — the functor $u^!$ of\n> [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../../appendix/conv-d-shriek-d-star.html)\n> — preserves coherence: $u^!\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y}_0)$ for every\n> $\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y})$.\n\n## New statement\n\n(A) and (B) are unchanged, word for word. One hypothesis is added:\n\n> **(C) Chart-level preservation.** For every $\\alpha\\in A$, $!$-restriction along the closed\n> immersion $c_\\alpha\\colon S_\\alpha\\hookrightarrow\\tilde S_\\alpha$ of (A) sends\n> $\\mathcal{D}_c(\\tilde S_\\alpha)$ into $\\mathcal{D}_c(S_\\alpha)$.\n\nThe conclusion is unchanged.\n\n## Why this is the minimal correction\n\n**The node's title was already the true claim.** *A covering family of closed-immersion\ncharts transfers coherence* — **transfers** is descent, and descent is what (B) is a\nhypothesis about. The statement failed because it also silently asserted, of each chart, the\nthing being transferred. (C) is that assertion made visible, and nothing else moves.\n\n**The descent it leaves behind is a real implication, not a tautology.** Let\n$\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y})$ and let $h\\colon S\\rightarrow\\mathcal{Y}_0$ be a\ntest, with $A_0$ as in (B). Write $p_\\alpha\\colon S\\times_{\\mathcal{Y}_0}S_\\alpha\\rightarrow S$\nand $q_\\alpha\\colon S\\times_{\\mathcal{Y}_0}S_\\alpha\\rightarrow S_\\alpha$ for the two\nprojections. Then $p_\\alpha$ is smooth as a base change of the smooth $g_\\alpha$, and\n$q_\\alpha$ is smooth as a base change of the test $h$; and\n\n$$\np_\\alpha^!\\,h^!\\,u^!\\mathcal{F} \\;\\simeq\\; q_\\alpha^!\\,g_\\alpha^!\\,u^!\\mathcal{F} \\;\\simeq\\; q_\\alpha^!\\,c_\\alpha^!\\,\\tilde h_\\alpha^!\\mathcal{F},\n$$\n\nthe last identification because $u\\circ g_\\alpha$ is $\\tilde h_\\alpha\\circ c_\\alpha$. Now\n$\\tilde h_\\alpha^!\\mathcal{F}$ is coherent because $\\tilde h_\\alpha$ is a test, **(C)** makes\n$c_\\alpha^!\\tilde h_\\alpha^!\\mathcal{F}$ coherent, and smooth pullback preserves coherence,\nso each $p_\\alpha^!h^!u^!\\mathcal{F}$ is coherent. The $p_\\alpha$, $\\alpha\\in A_0$, are\nsmooth and jointly surjective, along which coherence descends. Hence $h^!u^!\\mathcal{F}$ is\ncoherent, for every test $h$.\n\nThe composite $u\\circ h$ is *not* a test — $u$ is a closed immersion — which is exactly why\nthe conclusion cannot be read off the definition and why (B) is needed. That implication is\nthe node's content, and it survives intact.\n\n## Considered and not adopted\n\n**Retract the node.** Rejected: the descent above is used by\n[Q1-L5-L3](../../index.html) and [Q1-L5-L3-L3](../../Q1-L5-L3-L3/index.html),\nand deleting a true lemma because a false clause was packed into it loses the true half too.\n\n**Add \"$\\mathcal{F}$ holonomic\" to the node instead.** Rejected here, and proposed as a node\nof its own instead. It is a hypothesis on the *object*, so writing it into this statement\nwould change the category the whole of [Q1-L5](../../../index.html) runs in from\n$\\mathcal{D}_c$ to $\\mathcal{D}_h$ — a change reaching [Q1-L2](../../../../Q1-L2/index.html),\n[the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../../appendix/def-renormalized.html) and the\nmanuscript's $\\mathcal{D}^{\\mathrm{ren}}$, none of which this run examined. The route that\ndoes not touch the ambient category is to discharge (C) where it stands, and the report\ncommissions it.\n\n**Add a non-characteristic hypothesis (HTT Def. 2.4.2).** Rejected for the same reason —\nit constrains $\\mathrm{Ch}\\,\\mathcal{F}$, hence the object — and additionally because it is\nthe weaker of the two and would still need checking on each chart.\n\n**Weaken the conclusion to \"preserves the property tested on the charts\".** Rejected as\ncircular: it would make the statement true by making it say nothing about coherence.\n\n## What this does not fix\n\nThe parent [Q1-L5-L3](../../index.html) is `failing` on\n[r1](../../critiques/r1.html) Flaw 1, an honest `GAP:` naming the ind-level form of exactly\n(C). This revision does not close that gap; it names it, moves it out of a false statement\nand into a labelled hypothesis, and leaves the parent needing a child that discharges it.\nFlaw 2 of that critique priced the repair at \"one appendix entry\" and was right to doubt it:\nwhat it asked for is a statement that is equivariant, placidity-free and sourced, and the\nholonomicity route in the report is the first candidate that is all three.\n";</script>
