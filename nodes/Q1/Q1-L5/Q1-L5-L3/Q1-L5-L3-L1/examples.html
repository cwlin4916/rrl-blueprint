<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L1</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L1 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L5-L3-L1\n\n[node](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [papers](../../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L5-L3-L1](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\n**Referral, at the top.** The statement is **contradicted in print**. Hotta–Takeuchi–Tanisaki\nrecord, with a number, that $!$-restriction along a closed embedding of smooth varieties does\n*not* preserve coherence of $\\mathcal{D}$-modules; hypotheses **(A)** and **(B)** hold for every\nsuch embedding, with the identity as the only chart. Only a critic round or the user may act on\nthis; the repair the literature offers is named below.\n\n**The dictionary.** The source is classical, so three lines of translation, used by every entry.\n\n- HTT's $f^{\\dagger} := Lf^{*}[\\dim X-\\dim Y]$ **is** the node's $u^{!}$ for a closed embedding:\n  HTT Prop. 1.5.16 identifies $i^{\\dagger}$ with $Ri^{\\flat}$, the right adjoint of $\\int_i$,\n  which is the $!$-pullback of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html)\n  on $\\mathrm{AffSch}^{f.t.}$. A shift does not affect coherence.\n- HTT's $D^b_c(D_Y)$ **is** $\\mathcal{D}_c(Y)$ of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)\n  for $Y$ a smooth finite-type variety: the test $f=\\mathrm{id}$ gives one inclusion, HTT\n  Prop. 1.5.13(ii) — for $f$ smooth, $f^{*}$ is exact and sends $\\mathrm{Mod}_c(D_Y)$ to\n  $\\mathrm{Mod}_c(D_X)$ — the other. A morphism smooth over a smooth $Y$ has smooth source, so\n  allowing the test $S$ to be a dg-scheme adds nothing.\n- Dropped: HTT works over $\\mathbb{C}$, the node over $k=\\bar k$ of characteristic $0$. The cited\n  computation is the freeness of $D_{X\\rightarrow Y}$ over $D_X$ and is insensitive to this.\n\n## Precedent\n\n**What was searched.** The two halves of the statement separately: \"closed immersion $\\Rightarrow$\n$c^{!}$ preserves $D^b_{\\mathrm{coh}}$\", and \"coherence descends along a smooth surjection\". On\ndisk: [`papers/raskin_dmodules_infinite_var.pdf`](../../../../../papers/guideline.html) (Table 1,\np. 3) and `papers/GR17vol1.pdf` (contents). Off disk: Hotta–Takeuchi–Tanisaki, *D-Modules,\nPerverse Sheaves, and Representation Theory*, §§1.5, 2.4, 2.5, 3.2, fetched and read at page\nlevel. *Naming trap:* `papers/HTT.pdf` and the key `HTT` in `refs.bib` are **Lurie's Higher\nTopos Theory**, not this book.\n\n**What was found.**\n\n1. **Contradiction. HTT Remark 1.5.10** (p. 33), verbatim: \"*Note that $Lf^{*}D_Y = D_{X\\rightarrow Y}$.\n   If $f$ is a closed embedding with $\\dim X<\\dim Y$, then the $D_X$-module $D_{X\\rightarrow Y}$\n   is locally free of infinite rank. We see from this that the functor $Lf^{*}$ for\n   $f\\colon X\\rightarrow Y$ does not necessarily send $D^b_c(D_Y)$ to $D^b_c(D_X)$.*\" This hits\n   **the conclusion** — \"$u^{!}\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y}_0)$ for every\n   $\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y})$\" — in the direction *contradicts*, on the witness\n   $\\mathcal{F}=D_Y$, for any $u$ satisfying (A) and (B) as in instance 2 below. It leaves the\n   smooth-descent half of **(B)** untouched, which is a true statement (HTT Prop. 1.5.13).\n2. **The same, as the author's own summary.** §2.4 opening (p. 64): \"*the inverse images with\n   respect to non-smooth morphisms do not necessarily preserve coherency as we saw in Example\n   1.5.10*\"; §3.2.1 (p. 84): \"*neither $\\int_f$ nor $f^{\\dagger}$ preserves the coherency for\n   general morphisms $f$*\", after recording that $f^{\\dagger}$ does for $f$ **smooth**.\n3. **The repair, in print.** Two sufficient conditions, neither implied by (A)+(B).\n   *Non-characteristic:* HTT Def. 2.4.2 and **Thm. 2.4.6** (p. 67) — if\n   $\\varpi_f^{-1}(\\mathrm{Ch}\\,M)\\cap T^{*}_XY$ lies in the zero section, then $Lf^{*}M$ is\n   concentrated in degree $0$ and coherent. *Holonomic:* **Thm. 3.2.3(ii)** (p. 84) — $f^{\\dagger}$\n   sends $D^b_h(D_Y)$ to $D^b_h(D_X)$ for **any** $f$. Both match the node's conclusion, each\n   after adding a hypothesis on $\\mathcal{F}$ that the node does not carry.\n\n**What was not found.** Nothing anywhere asserts the fact Flaw 1 of [r1](../critiques/r1.html) called\nstandard. Raskin's Table 1 (p. 3) lists $f^{!}\\colon D^{!}(T)\\rightarrow D^{!}(S)$ under\n\"Hypotheses: None\" and says nothing about coherence in any row — confirming Flaw 2(ii): the source\nthe parent pointed at is silent, and it is silent because the assertion is false.\n\n## Instances\n\n### 1. A component inclusion — instance (positive)\n\n**What it is.** $\\mathcal{Y}=Y_1\\sqcup Y_2$ smooth finite type, $\\mathcal{Y}_0=Y_1$, $u$ the inclusion.\n\n**Why it is an instance.** **(A)**: $\\tilde S\\times_{\\mathcal{Y}}Y_1$ is the open-and-closed piece of\n$\\tilde S$ over $Y_1$, finite type, closed in $\\tilde S$. **(B)**: the single chart\n$\\mathrm{id}_{\\mathcal{Y}}$ gives $S_1=Y_1$, $g_1=\\mathrm{id}$ smooth, and $S\\times_{Y_1}Y_1\\simeq S$\nsurjects on $S$.\n\n**What it matches.** Hypotheses (A) and (B) and the conclusion, all three. It shows the statement is\n**false but not vacuous**: (A)+(B) are satisfiable with the conclusion true. It does not reach the\ncase $\\dim\\mathcal{Y}_0<\\dim\\mathcal{Y}$, which is where everything happens.\n\n**What the statement says here.** $u^{!}=u^{-1}$ preserves coherence — HTT Ex. 1.5.12.\n\n**Source.** Hotta, Takeuchi, Tanisaki, *D-Modules, Perverse Sheaves, and Representation Theory*,\nProgress in Math. 236, Birkhäuser 2008 — Ex. 1.5.12, p. 34. `refs.bib`: **absent** (`HTT` is Lurie).\n\n### 2. $\\mathrm{pt}\\hookrightarrow\\mathbb{A}^1$ — instance (boundary; the counterexample)\n\n**What it is.** $\\mathcal{Y}=\\mathbb{A}^1$, $\\mathcal{Y}_0=\\{0\\}$, $u=i$, and\n$\\mathcal{F}=\\mathcal{D}_{\\mathbb{A}^1}$, free of rank one, hence in $\\mathcal{D}_c(\\mathbb{A}^1)$.\n\n**Why it is an instance.** **(A)**: for a test $\\tilde h\\colon\\tilde S\\rightarrow\\mathbb{A}^1$,\n$\\tilde S\\times_{\\mathbb{A}^1}\\{0\\}=\\tilde h^{-1}(0)$ is finite type and closed in $\\tilde S$, closed\nimmersions being stable under base change. **(B)**: take $A=\\{\\alpha_0\\}$ and\n$\\tilde h_{\\alpha_0}=\\mathrm{id}$; then $S_{\\alpha_0}=\\{0\\}$ and $g_{\\alpha_0}=\\mathrm{id}$ is smooth,\nand every test $h\\colon S\\rightarrow\\{0\\}$ has $S\\times_{\\{0\\}}\\{0\\}\\simeq S$ mapping onto $S$ by the\nidentity. Both hypotheses discharged; nothing is left over.\n\n**What it matches.** The **conclusion**, negatively, under the specialisation above. It says nothing\nagainst (A) or (B), which are the hypotheses it discharges.\n\n**What the statement says here.** That $i^{!}\\mathcal{D}_{\\mathbb{A}^1}$ is a finite complex of\nfinite-dimensional vector spaces. It is $D_{\\mathrm{pt}\\rightarrow\\mathbb{A}^1}[-1]\\simeq k[\\partial][-1]$,\nfree of **infinite** rank. The conclusion fails.\n\n**Source.** HTT Remark 1.5.10, p. 33 (as above), which is this computation. `refs.bib`: absent.\n\n### 3. $K\\backslash Y'\\hookrightarrow K\\backslash Y$ — instance (equivariant; the parent's shape)\n\n**What it is.** $K$ and $Y$ of finite type, $Y'\\subseteq Y$ closed and $K$-stable, $u$ the induced map\nof quotient prestacks.\n\n**Why it is an instance.** **(A)**: $u$ becomes $Y'\\hookrightarrow Y$ after the smooth cover\n$Y\\rightarrow K\\backslash Y$, so $u$ is representable and a closed immersion, being so smooth-locally\non the target; hence $\\tilde S\\times_{K\\backslash Y}(K\\backslash Y')$ is closed in the finite-type\n$\\tilde S$, so finite type. **(B)**: the single chart $Y\\rightarrow K\\backslash Y$ gives\n$S_{\\alpha_0}=Y'$ with $g_{\\alpha_0}\\colon Y'\\rightarrow K\\backslash Y'$ the torsor projection,\nsmooth; and for a test $h\\colon S\\rightarrow K\\backslash Y'$ the fibre product\n$S\\times_{K\\backslash Y'}Y'$ is a $K$-torsor over $S$, hence finite type and surjective on $S$.\n\n**What it matches.** (A), (B) and the conclusion, in the form the parent [Q1-L5-L3](../index.html)\nactually needs — the pair $\\left(K\\backslash\\overline{LX}_\\lambda,\\ K\\backslash Z\\right)$ with the\ninfinite dimensions removed. Taking $K$ trivial reduces it to instance 2, so **the conclusion fails\nhere too**; equivariance does not rescue it. It does not reach the genuinely infinite-dimensional\ncase, where whether $\\mathcal{D}_c(K\\backslash Z)$ contains an analogue of $\\mathcal{D}_Y$ is open.\n\n**What the statement says here.** That $u^{!}$ carries $\\mathcal{D}_c(K\\backslash Y)$ into\n$\\mathcal{D}_c(K\\backslash Y')$. False already for $K=\\{1\\}$, $Y=\\mathbb{A}^1$, $Y'=\\{0\\}$.\n\n**Source.** Constructed, unsourced for the two hypothesis checks (routine base change and torsor\ndescent); the failure of the conclusion is HTT Remark 1.5.10, p. 33.\n\n### 4. Holonomic $\\mathcal{F}$ — instance of the *repaired* statement\n\n**What it is.** As instance 2 but with $\\mathcal{F}=\\mathcal{O}_{\\mathbb{A}^1}$, holonomic.\n\n**Why it is an instance.** (A) and (B) are discharged exactly as in 2; the added hypothesis\n\"$\\mathcal{F}$ holonomic\" is not one of the node's.\n\n**What it matches.** The **conclusion** only, and only under an extra hypothesis. It is the measure of\nwhat the node is missing: $i^{!}\\mathcal{O}_{\\mathbb{A}^1}\\simeq k[-1]$ is coherent, and HTT\nThm. 3.2.3(ii) says this holds for every $\\mathcal{F}\\in D^b_h$ and every morphism. It does not\nsupport the node as written.\n\n**What the statement says here.** The conclusion holds, and the mechanism is holonomicity, not (A).\n\n**Source.** HTT Thm. 3.2.3(ii), p. 84; Def. 2.4.2 and Thm. 2.4.6, pp. 65–67, for the weaker\nnon-characteristic hypothesis. `refs.bib`: absent.\n\nEVIDENCE: counterexample\n";</script>
