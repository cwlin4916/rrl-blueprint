<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L3-L1 — history\n\n[Q1-L5-L3-L1](index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by the lead-researcher, expanding [Q1-L5-L3](../index.html) after its `/prove` run failed at round 1 on an isolated `GAP:` at Step 4 of [the draft](../proof.html). Flaw 1 of [r1](../critiques/r1.html) named the missing fact — that $!$-restriction along the finitely presented closed embedding $\\overline{LX}_\\lambda\\hookrightarrow Z$ carries $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c(K\\backslash\\overline{LX}_\\lambda)$ — and diagnosed it as two things bolted together: a standard finite-type fact (\"$c^!$ preserves $D^b_{\\mathrm{coh}}$ along a closed immersion of finite-type dg-schemes\") and a geometric statement about compatible finite-dimensional models. This node is the first half, stated for an arbitrary morphism of prestacks so that the geometry is the only thing left to check.\n\n  **What it spends, and what it repairs.** Hypotheses **(A)** and **(B)** are the only inputs; nothing about placidity, about $K$, or about orbit closures appears, so Flaw 2(iii) — an entry hypothesizing \"$K$-placid ind-schemes\" would not cover the finite unions the parent quantifies over — cannot recur here. The conclusion is reached without base change: for a test $h$ of $\\mathcal{Y}_0$ and a member of the family, the two composites $S\\times_{\\mathcal{Y}_0}S_\\alpha\\rightarrow S\\rightarrow\\mathcal{Y}_0\\rightarrow\\mathcal{Y}$ and $S\\times_{\\mathcal{Y}_0}S_\\alpha\\rightarrow S_\\alpha\\rightarrow\\tilde S_\\alpha\\rightarrow\\mathcal{Y}$ agree, so functoriality of $\\mathcal{D}^!$ alone relates $h^!u^!\\mathcal{F}$ to $\\tilde h_\\alpha^!\\mathcal{F}$. The last step — coherence descends along a smooth surjection of finite-type dg-schemes — is the sentence Flaw 3 found missing from the round-1 sketch, and it is inside this statement rather than left to a reader; the same argument is already run at Step 5 of [Q1-L4-L4](../../../Q1-L4/Q1-L4-L4/proof.html).\n\n  **Why it is a node and not an appendix entry.** Flaw 2(ii) of [r1](../critiques/r1.html): both Raskin entries the draft pointed at explicitly disclaim $\\mathcal{D}_c$, so no source on disk supplies the fact, and an entry asserting it would black-box the lemma. It is a ready leaf instead — provable from [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) and standard mathematics — which is what makes the expansion start somewhere.\n- **2026-08-06 — statement corrected; the chart-level fact it was assuming is now hypothesis (C)** by `/update Q1-L5-L3-L1` ([u1](updates/u1.html)), at the user's direction as the first step of raising [Q1-L5](../../index.html). The defect: the conclusion followed from hypotheses that hold for **every** closed immersion of smooth finite-type schemes, and $!$-restriction along such an immersion does not preserve coherence. The witness is $i\\colon\\{0\\}\\hookrightarrow\\mathbb{A}^1$ with $\\mathcal{F}=\\mathcal{D}_{\\mathbb{A}^1}$, recomputed this run rather than quoted — $D_{\\mathrm{pt}\\rightarrow\\mathbb{A}^1}=k\\otimes_{k[x]}k[x]\\langle\\partial\\rangle\\simeq k[\\partial]$, free of infinite rank, so $i^!\\mathcal{D}_{\\mathbb{A}^1}\\simeq k[\\partial][-1]$ is not coherent. (A) and (B) are unchanged word for word and the conclusion is unchanged; the new **(C)** asks of each chart exactly what the counterexample removes. Status was already `open`, so nothing was reset.\n\n  **The creation entry above records the error in its own words.** It says the conclusion is reached \"without base change: … so functoriality of $\\mathcal{D}^!$ alone relates $h^!u^!\\mathcal{F}$ to $\\tilde h_\\alpha^!\\mathcal{F}$.\" Functoriality does relate them — it gives $p_\\alpha^!h^!u^!\\mathcal{F}\\simeq q_\\alpha^!c_\\alpha^!\\tilde h_\\alpha^!\\mathcal{F}$ — and then one still has to know that $c_\\alpha^!$ carried a coherent object to a coherent one. That step was never stated, so it was never doubted, and the node was created around the one thing in it that is false.\n\n  **What the node is now.** Pure descent: (B) is a hypothesis about covering, (C) about the charts, and the implication between them is the content. The argument is written out in [u1](updates/u1.html) — smooth base change on both projections, (C) at the charts, then descent of coherence along the smooth surjective $\\{p_\\alpha\\}_{\\alpha\\in A_0}$ — and it is a real implication, because the composite $u\\circ h$ is not a test and the conclusion cannot be read off [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html).\n\n  **What it does not fix.** The parent's `GAP:` is not closed; it is named and moved out of a false statement into a labelled hypothesis. Discharging (C) is commissioned separately, and the route this run judges most likely — equivariant coherent objects on a quotient with finitely many orbits are holonomic, and $!$-restriction preserves holonomicity along any morphism — is recorded in [u1](updates/u1.html) under *Considered and not adopted*, since it is a hypothesis on the object and writing it here would move the whole of [Q1-L5](../../index.html) from $\\mathcal{D}_c$ to $\\mathcal{D}_h$.\n- **2026-08-07 — examined and unchanged; a proof route is on record and is not adopted.** External commentary the user supplied rules this node \"a good formal lemma — the problem is not L1\", and sketches the argument: take a test $h\\colon S\\rightarrow\\mathcal{Y}_0$, use hypothesis (B) to get finitely many smooth $T_\\alpha = S\\times_{\\mathcal{Y}_0}S_\\alpha\\rightarrow S$ jointly surjective, rewrite $g_\\alpha^{!}u^{!}\\mathcal{F}\\simeq c_\\alpha^{!}\\widetilde{h}_\\alpha^{!}\\mathcal{F}$, apply (C), and descend coherence along the finite smooth cover. Nothing here is revised: whether that argument closes is a referee's question and this operator does not answer it, and the route is recorded so the next `/prove` starts from it rather than rediscovering it. The statement was re-read against its three hypotheses this run and stands.\n";</script>
