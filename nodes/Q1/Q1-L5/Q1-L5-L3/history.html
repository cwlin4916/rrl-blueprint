1-L5-L5](../Q1-L5-L5/index.html) consumes exactly that generality.\n- **2026-08-05 — examined and unchanged** by `/update` of the parent ([Q1-L5/u2](../updates/u2.html)): stated over a closed union of orbit closures $Z$, so it discharges the parent's (H1) at $Z = LX$ and supplies the same package over a single $\\overline{LX}_\\mu$ for (H3). The parent's revision moved towards this node's indexing, not away from it.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: coherence of $!$-restriction along the stratum embeddings, with no group-scheme quotient in sight.\n- **2026-08-06 — expanded** by the lead-researcher into [Q1-L5-L3-L1](Q1-L5-L3-L1/index.html), [Q1-L5-L3-L2](Q1-L5-L3-L2/index.html) and [Q1-L5-L3-L3](Q1-L5-L3-L3/index.html), on commission from the `/prove` failure at round 1: Flaws 1 and 2 of [r1](critiques/r1.html) named the missing fact at Step 4 and ruled out the cheap route to it — the wanted appendix entry would be about quotient prestacks and not ind-schemes, has no source among the papers on disk, and could carry no placidity hypothesis without losing the finite-union $Z$. The cut follows the critique's own diagnosis: a formal criterion (L1), the geometric compatible-models statement it consumes (L2), and the assembly over the parent's own $Z$ (L3). The statement is untouched and the status is untouched; the new `## Decomposition` records how the three recombine, and the round-1 draft survives it except at Step 4.\n- **2026-08-07 — the $Z=LX$ case of this node is now unsupplied, and that is a gain in honesty.** External commentary the user supplied was verified against the record this run. Its decisive finding lands on [Q1-L5-L3-L3](Q1-L5-L3-L3/index.html), whose hypothesis (A) was the mechanism for passing from a finite stage to the whole of $LX$: (A) says a closed immersion of quotient prestacks is smooth, hence flat, hence open, so it holds only when the stage is a union of connected components ([u1](Q1-L5-L3-L3/updates/u1.html)). That node is now restricted to finite $Z$. This node's Setup still quantifies over \"a single $\\overline{LX}_\\mu$, a finite union, **or $LX$ itself**\", so its third case has no child supplying it — where before it had one supplying it falsely. The statement here is **not** revised: the defect was in the child's hypothesis, not in what this node claims, and the missing input is now visible on the DAG instead of buried in a hypothesis that read as satisfiable.\n- **2026-08-07 — the commentary's overall verdict, and where it agrees with the record.** It declines to call the target false — \"I did not find a counterexample satisfying all of your spherical-loop-space hypotheses\" — and rules the correct status `GAP`/MAJOR, which is what this node already carries as `failing` after [r1](critiques/r1.html). Its own counterexample, $Li^{*}D_{\\mathbb{A}^1}$ having infinite rank over $k$, disproves the *general* principle that $!$-restriction along a finitely presented closed embedding preserves coherence — not this node's statement. That distinction is the useful part: the route through finite presentation alone is closed, and what remains open is the geometry, not the formalism. Clause 2 it rules formal once clause 1 holds, by the universal property of Ind-completion; nothing in this run contradicts that, and nothing in the repository yet establishes clause 1.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed. The paragraph's one fact that no other file carries is which part of the draft the children replace, kept here: the three supply **Step 4** of the round-1 [draft](proof.html) and nothing else — Steps 1–3 and 5–10 stand as written and none of them depends on how the closed half is filled.\n";</script>
