<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L5</a><i>›</i><a href="../index.html">Q1-L5-L3</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L5-L3, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L3/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n## What was checked and passed\n\nRecorded first, because most of this write-up is correct and the report below should not be read as a verdict on the whole.\n\n*Statement fidelity.* The draft's `## Lemma` was diffed against `## Statement` of `Q1-L5-L3_node.md` character by character, links included. It is **verbatim**: same $Z$-hypothesis, same \"for instance\" list, same two clauses, same closing sentence, same relative link targets. No hypothesis strengthened, no conclusion weakened.\n\n*Hallucination check.* All six appendix anchors resolve in `blueprint/appendix.md`: `#def-orbits-iwahori-spherical`, `#thm-chen-ti`, `#defn-coherent-d-mod`, `#def-renormalized`, `#conv-d-shriek-d-star`, `#placid-ind-scheme`. Both node links resolve. No bib key is cited. `main.tex:772` is the display inside `\\label{thm:chen_Ti}` and says what the Caveats say it says. The four page-level claims about the source were checked on the page in `papers/chenyi_2025singularitiesorbitclosuresloop.pdf`: Theorem 36(i)–(ii) p. 21, Remark 37 p. 22, Lemma 38 p. 22 (proved through $\\Lambda_S$, a $\\theta$-split parabolic and the sequences (7), which say \"note that we assume $K$ is connected\" for $K = G^\\theta$), Proposition 39(ii) p. 23. Every one is accurate.\n\n*Dependency disclosure — verified.* I traced every step for a use of Q1-L4. Steps 1–2 use only the factorization and base change; Step 3 uses the torsor description of a quotient; Steps 5–10 are formal. Nothing passes to $K_\\lambda$, to $U_\\lambda$, to $G_\\lambda$, or to $BK_\\lambda$. **The disclosure is true: no clause of Q1-L4 is used**, and on this write-up `depends-on: Q1-L4` is not load-bearing. (Flaw 1 explains why it may become load-bearing again.)\n\n*Uniformity in $Z$ (Step 2) — verified.* $\\overline{LX}_\\lambda \\subseteq Z$ and $Z \\hookrightarrow LX$ a monomorphism give $\\overline{LX}_\\lambda \\simeq \\overline{LX}_\\lambda\\times_{LX}Z$, so $\\overline{\\imath}_{\\lambda,Z}$ really is the base change of $\\overline{\\imath}_\\lambda$, and finite presentation is base-change stable. There is no hidden induction and no finite-union argument standing in for the colimit. The claim \"$Z = LX$ is not distinguished from a single closure\" is correct **for Step 2**; see Flaw 1 for where the distinction reappears.\n\n*Coherent versus compact — verified.* Step 8 says exactly the right thing (\"This is compactness in $\\mathcal{D}^{\\mathrm{ren}}$; in $\\mathcal{D}(\\mathcal{Y})$ the note to `defn:coherent_D_mod` separates compactness from coherence\"), and nowhere does the argument use compactness in $\\mathcal{D}(\\mathcal{Y})$ to get continuity. Continuity in Step 10 comes from $\\mathrm{Ind}$-extension and not from any compact generation claim. Handedness is right throughout: $i_{\\lambda,Z}=\\overline{\\imath}_{\\lambda,Z}\\circ\\jmath_\\lambda$ gives $i_{\\lambda,Z}^! = \\jmath_\\lambda^!\\circ\\overline{\\imath}_{\\lambda,Z}^!$, in that order.\n\n*Not refuted, and why.* I took the `thm:chen_Ti` scope trap seriously and read pp. 21–23. The entry's `hypotheses` field is a faithful transcription: Remark 37 extends **Theorem 36** and nothing else, and the filteredness that turns $\\mathrm{colim}_\\lambda\\overline{LX}_\\lambda$ into an ind-placid presentation is Lemma 38, which is symmetric-only. So clause (b) is indeed main.tex-grounded rather than source-grounded in general spherical generality. But that does **not** falsify the statement: `assum:intro`(a) — \"the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme\" — is a **standing hypothesis in force for every node of the DAG unless a node says otherwise**, and it is verbatim the clause the statement needs to put $Z = LX$ among the admissible $Z$. The statement is therefore true as written under the project's standing hypotheses, and `REFUTED` is not available. See Flaw 8.\n\n---\n\n**Flaw 1** [MAJOR]\n\n<details><summary>(location: Step 4, \"**GAP:** clause 1 still needs that $\\overline{\\imath}_{\\lambda,Z}^!$ sends $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c(K\\backslash\\overline{LX}_\\lambda)$\") · the finding</summary>\n\nAn honest `GAP:` is automatically FAIL at MAJOR, and this one is exemplary: the prover names the missing statement precisely, says why the mechanism of Step 3 cannot be reused (\"a closed embedding is not smooth, so $\\overline{\\imath}_{\\lambda,Z}\\circ h$ is no test of $K\\backslash Z$\"), isolates the gap in a step of its own so that Steps 5–10 visibly do not depend on how it is filled, and adds a Caveat refusing to call it a formality. This is exactly how a gap should be reported, and the diagnosis is correct: `defn:coherent_D_mod` constrains an object only along smooth tests, so a non-smooth map has no purchase on it.\n\n*Is it fillable?* In substance, yes; at the cost the draft quotes, no. At the level of a single finite-type test the fact is standard — $c^!$ preserves $D^b_{\\mathrm{coh}}$ along a closed immersion of finite-type dg-schemes — so the whole difficulty is transporting a test of $K\\backslash\\overline{LX}_\\lambda$ to a test of $K\\backslash Z$. That is a **geometric** statement about compatible finite-dimensional models for the pair $\\left(K\\backslash\\overline{LX}_\\lambda,\\ K\\backslash Z\\right)$ — the analogue for *closures* of what Q1-L4 supplies for *strata* — and no node of the tree currently supplies it. Note also that Step 2's uniformity, correct as it is, does not make the case $Z = LX$ free: it makes the closed embedding uniformly finitely presented, but the chart-lifting must then hold with an ind-scheme, not a placid scheme, on the ambient side, and that is the substantive case. There is no reduction of $Z = LX$ to $Z = \\overline{LX}_\\mu$ either, since $\\overline{\\imath}_{\\lambda,LX}^! = \\overline{\\imath}_{\\lambda,\\overline{LX}_\\mu}^!\\circ\\overline{\\imath}_{\\mu,LX}^!$ only relocates the same problem onto the pair $(\\overline{LX}_\\mu, LX)$.\n\n</details>\n\n**Flaw 2** [MAJOR] — The draft asserts that **either** of two entries discharges the gap.\n\n<details><summary>(location: Step 4, \"that $!$-restriction along a finitely presented closed embedding of $K$-placid ind-schemes ([`placid_ind_scheme`]) preserves coherence\") · the finding</summary>\n\nFor the first this is false, on three counts, and since the user is being asked to decide between \"write one entry\" and \"decompose\", the count matters.\n\n(i) *Wrong category.* The statement to be discharged is about the quotient prestacks $K\\backslash Z$ and $K\\backslash\\overline{LX}_\\lambda$; the proposed entry is about ind-schemes. Coherence on $K\\backslash Y$ is defined by smooth tests **of the stack**, and $Y \\rightarrow K\\backslash Y$ is not among them ($Y$ is not of finite type), so an ind-scheme-level statement does not transfer. The appendix says this in as many words twice — `bb-raskin-fp-pushforward`: \"$S$ and $T$ are ind-schemes, never quotient stacks, so a node working on $K\\backslash LX$ supplies the descent from the ind-scheme statement itself\"; `bb-raskin-torsor-descent`: \"**The base is a scheme, never a stack — the gap a user must bridge.**\"\n\n(ii) *No source on disk.* Both Raskin entries additionally disclaim the coherence half — \"Nothing is asserted about $\\mathcal{D}_c$ ... or about $\\mathcal{D}^{\\mathrm{ren}}$\" appears in each. So the wanted entry is not a transcription of anything already indexed in `papers/`; whoever writes it must either produce a source that treats $\\mathcal{D}_c$ on quotient prestacks, or write an entry that simply asserts the closed half of clause 1 — which is black-boxing the lemma, not proving it.\n\n(iii) *Hypotheses that do not fit the statement's own $Z$.* The proposed entry hypothesizes \"$K$-placid ind-schemes\". $\\overline{LX}_\\lambda$ is a placid **scheme** (`thm:chen_Ti`(a)(1)), not an ind-scheme; and for $Z$ a *finite union* of orbit closures — an instance the statement explicitly admits — nothing in the closed world makes $Z$ placid at all. `thm:chen_Ti`(a)(1) gives placidity of each closure, and Prop. 39 of the source handles only the $\\pi_0$-wise **disjoint** unions; a non-disjoint finite union of placid schemes carries no placidity from anything declared. So an entry carrying a placidity hypothesis would not even cover every $Z$ the statement quantifies over.\n\nThe actionable consequence: **the honest cost is not \"one appendix entry, no other change\"**. It is either a sourced entry stated for the quotient prestacks and for all admissible $Z$ (placidity-free), or a new sub-node proving the chart-lifting from finite-dimensional models — with a Q1-L4-analogue for closures likely needed underneath it, in which case `depends-on: Q1-L4` becomes load-bearing again.\n\n</details>\n\n**Flaw 3** [MINOR] — The displayed equivalence does not typecheck, and the subscript makes the mismatch explicit.\n\n<details><summary>(location: Step 4, \"$h^!\\overline{\\imath}_{\\lambda,Z}^!\\mathcal{F}\\simeq_{\\mathcal{D}(S)}c^!\\tilde h^!\\mathcal{F}$\") · the finding</summary>\n\nBy the chart-lifting statement as the draft phrases it, the source of $c$ is $\\tilde S\\times_{K\\backslash Z}\\left(K\\backslash\\overline{LX}_\\lambda\\right)$, which is identified with $S$ only *after a smooth surjective base change* $p\\colon S'\\rightarrow S$; so $c^!\\tilde h^!\\mathcal{F}$ lives in $\\mathcal{D}(S')$, and what actually holds is\n\n$$\np^!h^!\\overline{\\imath}_{\\lambda,Z}^!\\mathcal{F}\\ \\simeq_{\\mathcal{D}(S')}\\ c^!\\tilde h^!\\mathcal{F} .\n$$\n\nConcluding coherence of $h^!\\overline{\\imath}_{\\lambda,Z}^!\\mathcal{F}$ then needs one further step the draft never mentions: that coherence descends along a smooth surjection, i.e. $p^!\\mathcal{M}$ coherent $\\Rightarrow$ $\\mathcal{M}$ coherent for $p$ smooth surjective of finite-type schemes. That is standard mathematics needing no citation (for smooth $p$, $p^!$ is $p^*$ up to shift, and $p^*$ is faithfully exact for $p$ faithfully flat), so the repair is one sentence — but as written the sketch does not establish \"the second suffices\", and a reader closing the gap from this paragraph would carry the type error into the new entry.\n\n</details>\n\n**Flaw 4** [MINOR] — Two quantifier/convention slips in the one mechanism Step 3 has.\n\n<details><summary>(location: Step 3, \"an affine test $T\\rightarrow K\\backslash\\overline{LX}_\\lambda$ is a $K$-torsor $P\\rightarrow T$ with equivariant $\\phi$\") · the finding</summary>\n\n(i) The draft's own notation line defines a *test* as a **smooth** map from a finite-type dg-scheme, so \"an affine test\" ranges over smooth affine points only. Representability of $\\jmath_\\lambda$ — which is what licenses \"so $\\jmath_\\lambda$ is smooth\" and hence that $\\jmath_\\lambda\\circ g$ is again a test — must be checked against **all** affine $T$-points of $K\\backslash\\overline{LX}_\\lambda$, not only the smooth ones. The argument given works verbatim for arbitrary $T$; the repair is to delete the word \"test\".\n\n(ii) The torsor description of $T$-points is the description of maps into the **stack** quotient. No entry of the node's closed world defines the symbol $K\\backslash Y$, and in particular none says it denotes an fppf-sheafified quotient rather than the quotient prestack, for which $T$-points are not torsors. Since $\\mathcal{D}^!$ is a right Kan extension from $\\mathrm{AffSch}$ (`conv-d-shriek-d-star`), the two readings are not interchangeable for free. The draft should declare the reading it uses.\n\n</details>\n\n**Flaw 5** [MINOR] — Two small gaps in the formal half, both repairable in a clause each.\n\n<details><summary>(location: Step 6, \"essentially small since `def:renormalized` forms $\\mathrm{Ind}$ of it\"; Step 8, \"Step 6 applies it to $\\mathcal{C}=\\mathcal{D}_c(K\\backslash Z)$\") · the finding</summary>\n\n(i) Essential smallness is read off a definition's presupposition: `def:renormalized` *forms* $\\mathrm{Ind}\\left(\\mathcal{D}_c\\right)$, and inferring smallness from the well-formedness of that expression is arguing from what the entry assumes rather than from what it says. The convention that actually asserts it is `subsec:notations` — \"$\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules\" — which is not among this node's declared `objects:`. Either declare it or state the appeal as a convention rather than a deduction.\n\n(ii) Step 8 needs $\\mathcal{D}_c$ **idempotent-complete**, and Step 6 delivers only closure under retracts *inside* $\\mathcal{D}(\\mathcal{Y})$. The two agree because $\\mathcal{D}(\\mathcal{Y})$ is itself idempotent-complete, which holds since $\\mathcal{D}^!$ lands in $\\mathrm{DGCat}=\\mathrm{LinCat}_k$, whose objects are presentable. True, and unstated.\n\n</details>\n\n**Flaw 6** [MINOR] — The inference is topological; what Step 1 goes on to use is a **scheme-theoretic** factorization of $\\overline{\\imath}_\\lambda$ through $Z$.\n\n<details><summary>(location: Step 1, \"$Z$ is closed in $LX$ and contains $LX_\\lambda$, hence contains its closure $\\overline{LX}_\\lambda$\") · the finding</summary>\n\nThat step is licensed by $\\overline{LX}_\\lambda$ being the closure *taken reduced*, which is fixed by the appendix entry $\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ (anchor `#def-orbit-closure`) — an entry this node does not declare in its `objects:`. Either declare it, or give the one-line argument from $Z\\hookrightarrow LX$ being a closed monomorphism.\n\n</details>\n\n**Flaw 7** [MINOR] — The write-up moves between the unadorned $\\mathcal{D}(-)$ of the statement and the $\\mathcal{D}^!$ of `conv-d-shriek-d-star` without ever declaring that it reads the first as the second.\n\n<details><summary>(location: throughout — $\\mathcal{D}_c(K\\backslash Z)\\subset\\mathcal{D}(K\\backslash Z)$ versus \"functoriality of $\\mathcal{D}^!$\" in Steps 1 and 6) · the finding</summary>\n\nThe reading is harmless here — every functor in the proof is a $!$-pullback, and `defn:coherent_D_mod` itself tests with $f^!$ — but the identification $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ that `assum:intro`(b) supplies is asserted for placid ind-schemes, not for the quotient prestacks $K\\backslash Z$, so the reading should be stated rather than left to the reader.\n\n</details>\n\n**Flaw 8** [MINOR] — The caveat is accurate and correctly sourced, but it leaves the statement looking more exposed than it is.\n\n<details><summary>(location: Caveats, \"*Which clause of `thm:chen_Ti`*\") · the finding</summary>\n\n`assum:intro`(a) asserts precisely the presentation the statement's \"or $LX$ itself\" needs, and its role field makes it a **standing hypothesis in force for every node unless a node says otherwise** — so the admissibility of $Z = LX$ does not in fact depend on whether clause (b) of `thm:chen_Ti` was established on a page of the source for general spherical $X$. Recording this so the user does not spend a decomposition on a scope problem the standing hypotheses already absorb. (Not an error; a strengthening the draft is entitled to and did not take. It also disposes of the `REFUTED` question raised at commission.)\n\n</details>\n\n---\n\n*Assessment for the orchestrator.* Every step other than Step 4 stands, subject only to the MINOR repairs above; Steps 5–10 are correct and are insulated from how the gap is filled, so nothing outside Step 4 changes when it is. The node's `depends-on: Q1-L4` is genuinely unused **by this draft**, and the statement is not refuted. What the user must decide is Flaw 2: the draft's estimate of one appendix entry is too cheap, because the entry must be equivariant, must be placidity-free to cover the finite-union $Z$, and has no source among the papers on disk.\n\nVERDICT: FAIL\n";</script>
