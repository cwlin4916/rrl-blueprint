$. The mathematics of the witness is untouched; only its pointers move — to the withdrawal record.\n\n## Old statement (the two changed places, verbatim)\n\nThe title read\n\n> where Q1-L4(iv) fails\n\nclause 3 read\n\n> hence hypothesis (iv) of [Q1-L4](../../../Q1-L4/index.html) **fails** for this $X$: the set $\\{\\mu\\in\\Lambda_X^+\\mid LX_\\mu\\subseteq\\overline{LX}_\\lambda\\}$ is infinite for $\\lambda = (0,\\dots,0)$ — already for $n = 1$, where $LX = k((t))$ and $\\overline{LX}_0 = O$ contains $t^m O^\\times$ for every $m\\ge 0$, and $\\{0\\}$.\n\nand the closing paragraph read\n\n> In particular [Q1-L4](../../../Q1-L4/index.html) is false as stated for this (non-homogeneous) $X$, and the locally-finite-stratification hypothesis that the reverse direction of [Q1-L5](../../index.html) inherits through [Q1-L4](../../../Q1-L4/index.html) is load-bearing; no assertion is made that the equivalence of [Q1-L5](../../index.html) itself fails here — it is untested.\n\n## New statement\n\nTitle: \"where per-closure orbit finiteness fails\". Clause 3 asserts the same infinitude, now naming the claim itself — the per-closure finiteness that Q1-L4 carried as clause (iv) until its withdrawal — with the reference routed through [Q1-L4/updates/u1.md](../../../Q1-L4/updates/u1.html). The closing paragraph records that the withdrawn clause, not the current Q1-L4, is what this $X$ refutes, and keeps the caveat that [Q1-L5](../index.html) itself is untested here. The Remark's pointer to the induction that needs the finiteness is aimed at [Q1-L6](../../../Q1-L6/index.html), where that induction actually lives.\n\n## Verification record\n\nNo new mathematics entered: the orbit computation (Smith normal form; $\\overline{LX}_0 = \\mathrm{Mat}_n(O)$ containing all non-negative tuples) is unchanged from the examples run that created the node, and the operator re-checked the $n=1$ case against the recomputation in [Q1-L4/updates/u1.md](../../../Q1-L4/updates/u1.html) — the two witnesses agree. Nothing considered and rejected beyond leaving the dangling references in place, rejected because a statement that calls a live node false when it no longer is would be exactly the drift the neighbour pass exists to catch.\n";</script>
