([examples.md](examples.html)) — not a missing example but a false premise in the dependency [Q1-L4](../Q1-L4/index.html), whose per-closure finiteness the dévissage's induction would consume; the card went 0 to −12% on the first build after the commit.\n- **2026-08-04 — statement revised** by `/update` ([u1](updates/u1.html)), from a user-supplied review passage verified before adoption: the unqualified ⟸ fails at recollement generality — in the two-stratum recollement of arrow categories, $j_!k$ generates both strata stratumwise yet $\\operatorname{Map}(j_!k,\\, i_!k) = 0$ with $i_!k \\neq 0$ — so condition (2), support-cutting, is exactly the gluing datum the restrictions of a generating family do not see, and the three recollement hypotheses are now recorded in the statement. Both directions of the corrected criterion were re-proved by the operator before adoption. Whether the Hecke-stability of the family $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\}$ forces (2) given (1) in the present setting — which would restore the old statement — is open and tracked in [priorities](../../../../blueprint/priorities.md). The three hypotheses are expected from $K$-placidity ([orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html)) together with the finite-type strata of [Q1-L4](../Q1-L4/index.html); a proof must discharge them or a `/decompose` must isolate them.\n- **2026-08-04 — the run's four instances became children** [Q1-L5-e1](Q1-L5-e1/index.html)–[Q1-L5-e4](Q1-L5-e4/index.html) (ADR 0021), materialized by the lead-researcher against the corrected statement; the commission surfaced that joint conservativity of $\\{i_\\lambda^!\\}$ is not automatic even for the torus, so the third recollement hypothesis is genuinely load-bearing.\n- **2026-08-05 — statement revised** by `/update` ([u2](updates/u2.html)), from a user review of the closure level, verified against the local Chen–Yi PDF before adoption: the third hypothesis had been joint conservativity of $\\{i_\\lambda^!\\}$ over the whole infinite $\\Lambda_X^+$ — indexed by the strata, which are the steps of no presentation, so no child could reach it. The setting presents $LX$ by orbit **closures** ([orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)), and over one closure with finitely many orbits joint conservativity is already the \"In particular\" of [Q1-L5-L5](Q1-L5-L5/index.html). The hypotheses are now (H1) as before, (H2) that $!$-restriction along the $\\overline{i}_\\mu$ identifies $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ with the limit over the closures, and (H3) the per-closure form of joint conservativity; the old hypothesis is derived from (H2)+(H3) in one line inside the statement, so the criterion proves what it proved before. Conditions (1) and (2) are untouched, so [Q1-L5-L1](Q1-L5-L1/index.html), [Q1-L5-L2](Q1-L5-L2/index.html) and [Q1-L6](../Q1-L6/index.html) still cite them by number. (H2) is now the node's one undischarged hypothesis, and the run commissioned a child for it.\n- **2026-08-05 — motivation added for condition (2)**, at the user's request: the node stated support-cutting without saying why it is there, so the reason recorded in [u1](updates/u1.html) now sits in the statement itself as \"Why condition (2) is there\" — what the backward direction consumes it for (orthogonality against the stratum truncations $i_{\\lambda!}\\,i_\\lambda^!$, not against the generators), and the two-stratum $A_2$ counterexample showing (2) does not follow from (1). No hypothesis, condition or claim changed; prose only.\n- **2026-08-05 — the motivation for condition (2) moved here** from the statement, at the user's request that a node file give the statement and nothing else. It was added to the statement earlier the same day, in the entry above; a `### Why condition (2) is there` inside `## Statement` is commentary rendered where only the claim belongs, and the widened invariant I23 now refuses headings at every depth, not only `##`. Every word is below, unchanged — the motivation, the two-stratum counterexample and the open question are readable here and reachable from the node page's Pages list. No hypothesis, condition or claim moved with it.\n\n  **Setting.** Write $\\mathcal{A} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$ for the subcategory the Hecke family generates, so that by [Q1-L2](../Q1-L2/index.html) the equality to be proved is $\\mathcal{A} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\n  The $\\perp$-criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) tests that equality one object at a time: it holds if and only if the only object satisfying the following hypothesis is $0$.\n\n  **(⊥)** the object $\\mathcal{M}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ satisfies\n\n  $$\n  \\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\left(\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n],\\ \\mathcal{M}\\right) = 0 \\qquad\\text{for all } \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ n\\in\\mathbb{Z}.\n  $$\n\n  **Step 1 — conservativity moves the problem to the strata.** Assume (⊥). By the joint conservativity that (H2) and (H3) supply, it is enough to prove $i_\\lambda^!\\mathcal{M} = 0$ for every $\\lambda\\in\\Lambda_X^+$.\n\n  **Step 2 — condition (1) tests that stratum by stratum.** By (1) the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$ generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, so the same $\\perp$-criterion turns $i_\\lambda^!\\mathcal{M} = 0$ into the vanishing, for all $\\mathcal{F}$ and all $n\\in\\mathbb{Z}$, of\n\n  $$\n  \\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\left(i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n],\\ i_\\lambda^!\\mathcal{M}\\right)\\ \\simeq\\ \\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\left(i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n],\\ \\mathcal{M}\\right),\n  $$\n\n  the identification being the adjunction $i_{\\lambda!}\\dashv i_\\lambda^!$ of (H1).\n\n  **The gap, and what closes it.** Hypothesis (⊥) is vanishing against the generators $\\mathcal{F}\\ast\\mathrm{IC}_0$, while Step 2 consumes vanishing against their stratum truncations $i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$ — objects (⊥) says nothing about.\n\n  Condition (2) is exactly that bridge. It places the truncations inside $\\mathcal{A}$, and (⊥) propagates from the generators to all of $\\mathcal{A}$, because the objects right-orthogonal to $\\mathcal{M}$ in every shift form a cocomplete stable subcategory.\n\n  **(2) does not follow from (1).** At recollement generality the implication already fails with two strata, which is the defect that [u1](updates/u1.html) corrected.\n\n  **The example.** Let $\\mathcal{E}$ be the category of arrows $V_1\\to V_2$ in $D(k)$, with restrictions\n\n  $$\n  j^!\\left(V_1\\to V_2\\right) = V_1, \\qquad i^!\\left(V_1\\to V_2\\right) = V_2,\n  $$\n\n  whose left adjoints $j_!W = \\left(W\\xrightarrow{\\ \\mathrm{id}\\ }W\\right)$ and $i_!W = \\left(0\\to W\\right)$ are fully faithful and whose pair $\\{j^!,i^!\\}$ is jointly conservative — the two-stratum form of (H1) and (H3).\n\n  Take the single object $P := j_!k$. Its restrictions $j^!P = k$ and $i^!P = k$ each generate $D(k)$, so $P$ satisfies (1).\n\n  **What (⊥) fails to see here.** By the adjunction $j_!\\dashv j^!$,\n\n  $$\n  \\operatorname{Map}_{\\mathcal{E}}\\left(P[n],\\ i_!k\\right)\\ \\simeq\\ \\operatorname{Map}_{D(k)}\\left(k[n],\\ j^!i_!k\\right)\\ =\\ \\operatorname{Map}_{D(k)}\\left(k[n],\\ 0\\right)\\ =\\ 0\n  $$\n\n  for every $n\\in\\mathbb{Z}$, so $\\mathcal{M} := i_!k$ satisfies (⊥) for the family $\\{P\\}$ while $\\mathcal{M}\\neq 0$. Hence $\\langle P\\rangle_{\\mathcal{E}} \\neq \\mathcal{E}$: stratumwise generation holds and global generation fails.\n\n  What fails is precisely (2), since that same computation exhibits $i_!\\, i^!P = i_!k$ as a nonzero object right-orthogonal to $\\langle P\\rangle_{\\mathcal{E}}$, so $i_!\\, i^!P \\notin \\langle P\\rangle_{\\mathcal{E}}$.\n\n  **The reading.** Condition (1) sees each stratum in isolation and records nothing of how the strata are glued, and (2) is that missing gluing datum.\n\n  Whether Hecke-stability of $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\}$ forces (2) from (1) in the present setting — which would restore the criterion to (1) alone — is open, and tracked as P4 in [priorities](../../../../blueprint/priorities.md).\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: (H1)–(H3) and the two conditions are statements about functors between renormalized categories, and this run corrected words about group schemes. All eight dependencies were re-read; the dévissage still assembles as stated.\n- **2026-08-05 — notation de-coined, no claim changed** by `/update Q1`. The statement opened by coining $\\mathcal{C} := \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, a symbol the appendix now owns ([$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../appendix/not-standard-objects.html)); it now uses the symbol and links the entry instead of defining it again. No symbol and no claim changed, so no status was reset. The render gate refuses a second definition from now on (I26, [ADR 0044](../../../process/decisions/0044-a-question-states-a-problem-not-its-route.html)).\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n";</script>
