ion $i_\\lambda^!\\, i_{\\lambda!}\\simeq\\mathrm{id}$ applied to compact objects of the stratum categories — one-line arguments that are the intended proof; [examples.md](../examples.html), written against the pre-correction statement ([updates/u1.md](../updates/u1.html)), records the same reduction in the old numbering. The closure relation in clause 2 is the classical one for the affine Grassmannian.\n- **2026-08-04 — statement renotated** by `/update` ([u1](updates/u1.html), notation audit): the opening sentence used $K$ in two readings at once — the ambient $L^+(G\\times G)$ in $K\\backslash LX$ and the factor $L^+G$ in $K\\backslash\\mathrm{Gr}$ — the drift the audit flagged; the statement now writes $G'$, $K'$ for the ambient pair, after Q1-e7 *(node removed 2026-08-05)*'s model, and $L^+G\\backslash\\mathrm{Gr}_G$ for the factor Hecke side. Clause 2's citation of the withdrawn Q1-L4 clause (iv) now routes through the withdrawal ([Q1-L4/updates/u1.md](../../Q1-L4/updates/u1.html)) and names [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html). No mathematical content changed.\n- **2026-08-05 — reference retargeted**: the question-level example **Q1-e7** (*Group case: equality holds*) was removed at the user's direction — with $\\mathrm{IC}_0$ the monoidal unit the equality there is formal, so the node tested no clause of the criterion. The aside citing its notation is gone — the convention is spelled out in place ([updates/u2.md](updates/u2.html)).\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: the group case, where $\\mathcal{F}\\ast\\mathrm{IC}_0\\simeq\\mathcal{F}$ makes the equality formal. The walk re-confirmed what the [key-example register](../../../../key_examples/index.html) says about this case — `K9`, degenerate — so nothing here can support a statement on its own.\n- **2026-08-05 — notation normalised, no claim changed** by `/update Q1`. Group names were written bare ($GL_n$, $SO_n$, …) against `\\mathrm{}` eve
