<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L5</a><i>›</i><a href="../index.html">Q1-L5-L2</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L5-L2, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L2/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReferee's summary of what was hunted and not found. The `## Lemma` block is a character-for-character copy of the node's `## Statement`, including the relative link targets, so there is no fidelity defect. Every anchor the draft links (`#def-generation`, `#def-renormalized`, `#def-orbits-iwahori-spherical`, `#ic-0`, `#conv-hecke-action`, `#defn-coherent-d-mod`) exists in `blueprint/appendix.md`; no bib key and no `main.tex` `\\label` is cited, so there is nothing to hallucinate. The only non-appendix identity used, $K = L^+G$, is standing notation (`blueprint/context.md` line 11, `subsec:notations` at `appendix.md` line 61), not a closed-world crossing.\n\nThe five substantive points I was asked to press all survive, and I record the verifications because they are the information this node's decomposition depends on.\n\n*Hypothesis (2) is load-bearing, not decorative.* Strike it and Step 8 has nothing: Step 6 delivers orthogonality of $\\mathcal{M}$ only against $\\mathcal{C} = \\langle\\mathcal{S}\\rangle$, while Step 7's transposed anima is indexed by the *support-cut* object $i_{\\lambda!}\\,i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$, which is not $\\mathcal{F}\\ast\\mathrm{IC}_0$ and has no other route into $\\mathcal{C}$. No other step in the write-up mentions (2), and no other step supplies the vanishing Step 9 consumes. The write-up therefore proves the lemma the node cuts and not a stronger one.\n\n*The unconsumed hypotheses are genuinely unconsumed.* Full faithfulness of $i_{\\lambda!}$ (equivalently the unit $\\mathrm{id}\\xrightarrow{\\ \\simeq\\ }i_\\lambda^!\\,i_{\\lambda!}$ — the draft's handedness is right) appears nowhere: Steps 7–8 use only the adjunction $i_{\\lambda!}\\dashv i_\\lambda^!$, Step 9 only hypothesis (1), Step 10 only joint conservativity. Continuity of $i_\\lambda^!$ likewise appears nowhere; no step commutes $i_\\lambda^!$ past a colimit. This is corroborated from the other side: the sibling forward direction consumes continuity of $i_\\lambda^!$ at its Step 4 and the section at its Step 6, exactly as the draft's second Caveat says. The information for the cut of Q1-L5 is that hypothesis (H1) is a *forward*-direction hypothesis in full, and that this direction needs only the bare adjunction plus joint conservativity.\n\n*The shift quantifier is handled correctly and is load-bearing.* $\\pi_j\\operatorname{Map}(c[-i],\\mathcal{M}) = \\pi_0\\operatorname{Map}(c[j-i],\\mathcal{M})$ is right, $j-i$ does sweep $\\mathbb{Z}$, and the upgrade from $i\\ge 0$ to $n\\in\\mathbb{Z}$ is not cosmetic: Step 4's long exact sequence for the cofibre relates *neighbouring* degrees, and an $i\\ge0$-only orthogonality would not be closed under cofibres. Nothing later escapes the quantifier — Step 7 is stated for a fixed but arbitrary $i\\ge0$ and Step 8 quantifies it back.\n\n*The variances are consistent.* ${}^{\\perp}\\mathcal{M}$ is the orthogonality in the **first** variable, which is the variable `def:generation` tests, and it is the first variable that is closed under colimits; the right orthogonal $\\mathcal{M}^{\\perp}$ would have been closed under limits and the minimality argument at Step 6 would have collapsed. Minimality is used legitimately: Step 4 verifies exactly the three closure properties that make ${}^{\\perp}\\mathcal{M}$ a member of the class $\\langle-\\rangle$ minimizes over.\n\n*The small/large crossings are all made explicitly*, and one of them is doing real work. GR17 vol. 1, §5.4 (read on the page, `papers/GR17vol1.pdf`, book p. 55): 5.4.1 *defines* \"generates\" by the detection criterion and Prop. 5.4.5 states \"A collection $\\{c_\\alpha\\}$ of objects generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory that contains all $c_\\alpha$.\" So the appendix entry's \"Equivalently\" is faithful and is a genuine biconditional: detection $\\Rightarrow$ generation at Step 5 and generation $\\Rightarrow$ detection at Step 9 are both available, and the draft names its ambient at each use. GR's proof of the harder direction runs through a right adjoint to $\\mathbf{C}'\\hookrightarrow\\mathbf{C}$ whose existence needs the collection small and the ambient accessible; the draft's Step 1 (smallness of $\\mathcal{S}$) and Step 2 (presentability of both ambients) supply precisely that, so the instance is legitimate.\n\n---\n\n**Flaw 1** [MINOR] — The reason offered in that sentence — closure under shifts and cofibres, $f^!$ exact — establishes *stability* and says nothing about *smallness*, which is the half actually needed twice over (for $\\mathrm{Ind}$ to be formed, and for $\\mathcal{S}$ to be a small collection at Step 5).\n\n<details><summary>(location: Step 2, \"so it is a small stable category\") · the finding</summary>\n\nThe presupposition argument is given at Step 1 for $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ (\"small because `def:renormalized` forms $\\mathrm{Ind}$ of it\") but is not carried over to $\\mathcal{Y} = K\\backslash LX$ and $\\mathcal{Y} = K\\backslash LX_\\lambda$, where the same one-clause remark would settle it. The sibling forward write-up states it explicitly (\"it is essentially small, since `def:renormalized` presupposes as much\"); this draft should read the same way.\n\n</details>\n\n**Flaw 2** [MINOR] — Exactness of $!$-pullback, and stability of the ambient $\\mathcal{D}(\\mathcal{Y})$ inside which `defn:coherent_D_mod` cuts out $\\mathcal{D}_c(\\mathcal{Y})$, are asserted rather than sourced.\n\n<details><summary>(location: Step 2, \"each $f^!$ being exact\") · the finding</summary>\n\nNeither is in the declared closed world — `defn:coherent_D_mod` says only that $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ is the full subcategory of $\\mathcal{F}$ with $f^!\\mathcal{F}$ a finite complex with coherent cohomology. Both are standard for a functor of stable $k$-linear categories and I do not think a citation is owed, but the write-up should say that it is treating them as standard rather than as consequences of the entry it links.\n\n</details>\n\n**Flaw 3** [MINOR] — Preservation of colimits gives commutation with $\\Sigma = [+1]$, and $[-i] = \\Omega^i$ is a *limit*.\n\n<details><summary>(location: Step 7, \"is exact — a left adjoint between stable categories preserves finite colimits — it commutes with $[-i]$\") · the finding</summary>\n\nThe conclusion is correct, but it needs the further clause that $\\Sigma$ is invertible in a stable category, so that $F\\Sigma\\simeq\\Sigma F$ forces $F\\Omega\\simeq\\Omega F$. As written the stated reason reaches $[+i]$ and stops one step short of $[-i]$, which is the shift the criterion actually runs over.\n\n</details>\n\n**Flaw 4** [MINOR] — $\\pi_0$ does not commute with limits, so the functor named is not the one that carries colimits to limits.\n\n<details><summary>(location: Step 4, \"$\\pi_0\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}(-,\\mathcal{M})$ carries a colimit to a limit of anima\") · the finding</summary>\n\nThe intended and correct statement is that $\\operatorname{Map}(-,\\mathcal{M})$ does, and that a limit of contractible anima is contractible. Cosmetically related: the separate cofibre argument in the same step is redundant, a cofibre being a pushout and hence already covered by closure under small colimits — though it is the sentence that shows the shift quantifier earning its keep, so it may be worth keeping and saying so.\n\n</details>\n\n**Flaw 5** [MINOR] — The entry states its ambient as $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and then records the detection criterion as an equivalence \"by [[GR17vol1, Prop. 5.4.5](../../../../../../papers/GR17vol1.pdf)]\".\n\n<details><summary>(location: the appendix entry `def:generation`, as invoked at Steps 2, 5, 6, 9 — raised against the entry, not the draft) · the finding</summary>\n\nThe source states both 5.4.1 and Prop. 5.4.5 for $\\mathbf{C}\\in 1\\text{-}\\mathrm{Cat}^{\\mathrm{St,cocmpl}}$, and its proof further uses a right adjoint to the inclusion of the generated subcategory, which is where smallness of the collection enters. So the entry's \"Equivalently\" is stated in more generality than the page supports, and a future write-up that invokes it without checking stability, cocompleteness and smallness would be leaning on something false. This draft is not that write-up — Steps 1 and 2 restore exactly the missing hypotheses before either direction is used, which is the correct response — but the entry should be tightened so the next node does not inherit the gap.\n\n</details>\n\n**Flaw 6** [MINOR] — \"Downstairs\" here means the *ambient* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, the opposite of the reading a reader will reach for, in which the stratum $LX_\\lambda$ is the smaller object and so the one downstairs.\n\n<details><summary>(location: Step 7 heading, \"moves each stratum test object downstairs\"; Caveat 1, \"leaves Step 7 with the object $i_{\\lambda!}\\,i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ downstairs\") · the finding</summary>\n\nThe two uses are consistent with each other, so nothing is wrong, but a lemma whose entire content is which of two ambients a $\\operatorname{Map}$ is computed in should not leave the direction to an informal word. Naming the category, as the write-up does everywhere else, would cost nothing.\n\n</details>\n\n**Flaw 7** [MINOR] — What the caveat establishes is that *this argument* has no step left, not that the implication \"(1) $\\Rightarrow$ conclusion\" is false; those are different claims and the sentence slides between them.\n\n<details><summary>(location: Caveat 1, \"so Step 8 fails and with it Step 9\") · the finding</summary>\n\nThe stronger claim is true and is on the record elsewhere in the node's trail, but the caveat as written does not exhibit a situation in which (1) holds and the conclusion fails, and should not be read as doing so.\n\n</details>\n\n**Flaw 8** [MINOR] — `blueprint/context.md` §Notation asks that $=$ carry as a subscript the category in which the assertion is made, \"for two objects, the category they live in\".\n\n<details><summary>(location: Step 9 heading \"$i_\\lambda^!\\mathcal{M}=0$\"; Step 10 \"$\\mathcal{M}=0$\") · the finding</summary>\n\nThese vanishings carry none, so the two $\\mathcal{M}$-vanishings in Step 9 and Step 10 do not display which of the two renormalized categories each is asserted in — the one distinction this node exists to police. Inherited from the frozen `## Statement`, which writes the joint-conservativity clause the same way, and not enforced by the render gate, so this is cosmetic; recorded because the whole point of the convention is the case where the ambient is ambiguous.\n\n</details>\n\nVERDICT: PASS\n";</script>
