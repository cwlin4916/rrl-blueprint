<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L2</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L2 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L2 — Backward dévissage: stratumwise generation and support-cutting rebuild global generation\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html), [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html), [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html). No node dependencies (ready leaf).\n- **notation:** $\\mathcal{S}$ is the Hecke family and $\\mathcal{C}$ its bracket (Step 1), $\\perp_{\\mathcal{D}}$ the shifted orthogonality of Step 3 and ${}^{\\perp}\\mathcal{M}$ its left orthogonal (Step 4).\n\n## Lemma\n\nSuppose given, for each $\\lambda\\in\\Lambda_X^+$ ([Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)), a continuous functor\n\n$$\ni_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n$$\n\nadmitting a fully faithful continuous left adjoint $i_{\\lambda!}$, and suppose the family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ is jointly conservative: $i_\\lambda^!\\mathcal{M}=0$ for all $\\lambda$ implies $\\mathcal{M}=0$. Assume conditions (1) and (2) of [Q1-L5](../index.html):\n\n1. for every $\\lambda$, the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html);\n\n2. for every $\\lambda$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right) \\in \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$.\n\nThen\n\n$$\n\\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX).\n$$\n\n## Proof\n\n**Step 1 — the Hecke family is a small collection of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\n\\mathcal{S} := \\left\\{\\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\}\n$$\n\nand\n\n$$\n\\mathcal{C} := \\left\\langle\\mathcal{S}\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\nSince $K = L^+G$, the ratified membership of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) reads $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$, and [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) gives $\\mathcal{F}\\ast\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$ for each $\\mathcal{F}$ in the *small* $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ — small because [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) forms $\\mathrm{Ind}$ of it. Yoneda $\\mathcal{D}_c(K\\backslash LX)\\hookrightarrow\\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$ places $\\mathcal{S}$ in the *large* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, where the bracket is formed.\n\n</details>\n\n**Step 2 — both ambients are stable and cocomplete.**\n\n<details><summary>the argument</summary>\n\nBy [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), $\\mathcal{D}_c(\\mathcal{Y})$ is closed under shifts and cofibres, each $f^!$ being exact and finite complexes with coherent cohomology being closed under shift and cone; so it is a small stable category and $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) = \\mathrm{Ind}\\,\\mathcal{D}_c(\\mathcal{Y})$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) is stable presentable. Apply this at $\\mathcal{Y} = K\\backslash LX$ and at $\\mathcal{Y} = K\\backslash LX_\\lambda$ ([Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)); [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is then available with either as ambient.\n\n</details>\n\n**Step 3 — the orthogonality tested by [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is invariant under all shifts of its first argument.**\n\n<details><summary>the argument</summary>\n\nFor $\\mathcal{D}$ stable and $c,\\mathcal{M}\\in\\mathcal{D}$ write\n\n$$\nc\\perp_{\\mathcal{D}}\\mathcal{M}\\ :\\iff\\ \\operatorname{Map}_{\\mathcal{D}}\\left(c[-i],\\mathcal{M}\\right)=0\\ \\text{ for every } i\\ge 0 .\n$$\n\nA mapping anima of a stable category is an infinite loop space, so it vanishes exactly when $\\pi_j$ does for all $j\\ge0$. Since $[-1]=\\Omega$,\n\n$$\n\\pi_j\\operatorname{Map}_{\\mathcal{D}}(c[-i],\\mathcal{M}) = \\pi_0\\operatorname{Map}_{\\mathcal{D}}(c[j-i],\\mathcal{M}) .\n$$\n\nAs $i,j$ range over the non-negative integers $j-i$ ranges over all of $\\mathbb{Z}$, so $c\\perp_{\\mathcal{D}}\\mathcal{M}$ says exactly that $\\pi_0\\operatorname{Map}_{\\mathcal{D}}(c[n],\\mathcal{M})=0$ for every $n\\in\\mathbb{Z}$. That condition is unchanged on replacing $c$ by $c[m]$, any $m\\in\\mathbb{Z}$.\n\n</details>\n\n**Step 4 — for each $\\mathcal{M}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ the left orthogonal is a cocomplete stable subcategory.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\n{}^{\\perp}\\mathcal{M} := \\left\\{c\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ c\\perp_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\mathcal{M}\\right\\} .\n$$\n\nIt contains $0$ and is closed under shifts by Step 3. It is closed under small colimits, which exist by Step 2: shifts commute with colimits, and $\\pi_0\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}(-,\\mathcal{M})$ carries a colimit to a limit of anima, contractible when each term is.\n\nIt is closed under cofibres: for $a\\to b\\to c$ with $a,b\\in{}^{\\perp}\\mathcal{M}$, the long exact sequence obtained from $\\pi_0\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}(-[n],\\mathcal{M})$ traps $\\pi_0\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}(c[n],\\mathcal{M})$ between two vanishing terms. Closed under shifts and cofibres and containing $0$, it is stable.\n\n</details>\n\n**Step 5 — it suffices to prove that every $\\mathcal{M}$ with $\\mathcal{S}\\subseteq{}^{\\perp}\\mathcal{M}$ vanishes.**\n\n<details><summary>the argument</summary>\n\nThis is the detection form recorded in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), read in the ambient $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ for the collection $\\mathcal{S}$ of Step 1: that criterion is equivalent to $\\mathcal{C} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, the conclusion sought. Fix such an $\\mathcal{M}$ for Steps 6–9.\n\n</details>\n\n**Step 6 — $\\mathcal{C}\\subseteq{}^{\\perp}\\mathcal{M}$.**\n\n<details><summary>the argument</summary>\n\nBy Step 4, ${}^{\\perp}\\mathcal{M}$ is a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, and it contains $\\mathcal{S}$ by the choice of $\\mathcal{M}$ in Step 5. Minimality of $\\langle-\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$ in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) gives the inclusion.\n\n</details>\n\n**Step 7 — the adjunction moves each stratum test object downstairs.**\n\n<details><summary>the argument</summary>\n\nFix $\\lambda\\in\\Lambda_X^+$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and $i\\ge0$. As $i_{\\lambda!}$ is the *left* adjoint of the pair $i_{\\lambda!}\\dashv i_\\lambda^!$, and is exact — a left adjoint between stable categories preserves finite colimits — it commutes with $[-i]$, whence\n\n$$\n\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\left(i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[-i],\\ i_\\lambda^!\\mathcal{M}\\right)\\ \\simeq\\ \\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\left(\\left(i_{\\lambda!}\\,i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\right)[-i],\\ \\mathcal{M}\\right).\n$$\n\n</details>\n\n**Step 8 — that anima vanishes, by hypothesis (2).**\n\n<details><summary>the argument</summary>\n\nHypothesis (2) says precisely that $i_{\\lambda!}\\,i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ lies in $\\mathcal{C}$, so Step 6 puts it in ${}^{\\perp}\\mathcal{M}$:\n\n$$\ni_{\\lambda!}\\,i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\perp_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\mathcal{M} .\n$$\n\nBy the definition of $\\perp_{\\mathcal{D}}$ in Step 3 the right-hand side of Step 7 is therefore $0$ for every $i\\ge0$.\n\n</details>\n\n**Step 9 — $i_\\lambda^!\\mathcal{M}=0$ for every $\\lambda\\in\\Lambda_X^+$.**\n\n<details><summary>the argument</summary>\n\nHypothesis (1) says the objects $i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ generate the ambient $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$. By the equivalence in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) read in that ambient, an $\\mathcal{N}$ with\n\n$$\n\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\left(i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[-i],\\ \\mathcal{N}\\right) = 0\n$$\n\nfor all $\\mathcal{F}$ and all $i\\ge0$ is itself $0$. Steps 7–8 supply exactly that vanishing for $\\mathcal{N} = i_\\lambda^!\\mathcal{M}$.\n\n</details>\n\n**Step 10 — conclusion.**\n\n<details><summary>the argument</summary>\n\nJoint conservativity of $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ applied to Step 9 gives $\\mathcal{M}=0$. As $\\mathcal{M}$ was an arbitrary object with $\\mathcal{S}\\subseteq{}^{\\perp}\\mathcal{M}$, Step 5 yields $\\mathcal{C} =\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, which is the assertion. $\\square$\n\n</details>\n\n## Caveats\n\n- **Where (1) alone fails.** Deleting (2) leaves Step 7 with the object $i_{\\lambda!}\\,i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ downstairs — the support-cut of a Hecke generator — and Step 5 grants orthogonality of $\\mathcal{M}$ only against $\\mathcal{C}$. Nothing makes $\\mathcal{C}$, generated by *global* objects, closed under cutting supports, so Step 8 fails and with it Step 9.\n- **Two hypotheses go unconsumed.** Full faithfulness of $i_{\\lambda!}$ — only the adjunction is used, never the section $i_\\lambda^!\\,i_{\\lambda!}\\simeq\\mathrm{id}$ it supplies — and continuity of $i_\\lambda^!$. The forward direction needs both, so the statement carries them.\n";</script>
