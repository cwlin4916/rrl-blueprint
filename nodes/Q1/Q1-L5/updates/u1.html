ted\n\nIndependently verified, in the cleanest form (the input's degreewise $\\operatorname{Hom}/\\operatorname{Ext}$ computation reaches the same conclusion). Let $\\mathcal{C}$ be the category of arrows $V_1 \\to V_2$ in $D(k)$ — equivalently $D(kQ)$ for the $A_2$-quiver $Q$ — a recollement with restrictions $j^!(V_1\\to V_2)=V_1$, $i^!(V_1\\to V_2)=V_2$ and fully faithful continuous left adjoints\n\n$$\nj_!W = (W \\xrightarrow{\\;\\mathrm{id}\\;} W), \\qquad i_!W = (0 \\to W),\n$$\n\nthe pair $\\{j^!, i^!\\}$ jointly conservative. Take the single generator $P_1 = j_!k$. Then $j^!P_1 = k$ and $i^!P_1 = k$ generate both stratum categories $D(k)$. But by adjunction\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(j_!k,\\; i_!k) \\simeq \\operatorname{Map}_{D(k)}(k,\\; j^! i_! k) = \\operatorname{Map}_{D(k)}(k, 0) = 0,\n$$\n\nand this persists under all shifts, so $0 \\neq i_!k$ lies in the right orthogonal of $\\langle P_1\\rangle_{\\mathcal{C}}$; by the $\\perp$-criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), $P_1$ does not generate $\\mathcal{C}$. Stratumwise generation holds, global generation fails. What is missing is exactly $i_! i^! P_1 = i_!k \\in \\langle P_1\\rangle_{\\mathcal{C}}$ — the *support-cutting* condition the new statement adds.\n\n## Old statement (verbatim)\n\n> The following are equivalent:\n>\n> 1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)$;\n> 2. for every $\\lambda\\in\\Lambda_X^+$, the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), where $i_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ is induced by the locally closed embedding $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n## New statement\n\nThe equivalence now reads $(1) \\Leftrightarrow (2)\\wedge(3)$, under three recorded recollement hypotheses (continuity of each $i_\\lambda^!$; a fully faithful continuous left adjoint $i_{\\lambda!}$; joint conservativity of the family), with (3) the support-cutting condition $i_{\\lambda!}\\, i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0) \\in \\langle \\mathcal{F}'\\ast\\mathrm{IC}_0\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$. Both directions were re-proved by the operator before adoption: $(1)\\Rightarrow(2)$ uses only continuity and the section $i_\\lambda^! i_{\\lambda!} \\simeq \\mathrm{id}$; $(1)\\Rightarrow(3)$ is immediate; $(2)\\wedge(3)\\Rightarrow(1)$: (3) with (2) gives $i_{\\lambda!}\\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\right) \\subseteq \\langle \\mathcal{F}'\\ast\\mathrm{IC}_0\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$, and an object right-orthogonal to the family is then killed by every $i_\\lambda^!$ (adjunction), hence zero (joint conservativity).\n\n## Verification record for the input passage\n\n- **Verified, adopted:** that the node stated the unqualified equivalence (checked against `node.md`, not the passage's paraphrase); the $A_2$ counterexample (recomputed above); the corrected criterion and both directions of its proof (re-proved above); the diagnosis that the missing content is extension-back-of-restrictions.\n- **Verified, already in the tree:** the small-vs-large concern (its §7) is the ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading of [ADR 0001](../../../../process/decisions/0001-satake-generation-ambient-category.html) plus [Q1-L2](../../Q1-L2/index.html) and its sub-lemmas — noted, nothing to adopt. Its Chen–Yi claims (placidity; symmetric-only hypotheses) agree with [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) and with the caveat already recorded in [examples.md](../examples.html).\n- **Verified in part:** Fiorenza–Loregian, *Recollements in stable $\\infty$-categories*, arXiv:1507.03913 — exists, is on-topic (checked 2026-08-04); its \"Lemma 2.16\" result number was **not** checked against the paper's pages and nothing here relies on it.\n- **Unverified, inert:** the passage's \"Definition 3.7 of main.pdf\" numbering (the blueprint cites [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) at main.tex:502); its Higher-Algebra page reference for compact generation (the appendix carries its own black box).\n- **Not adopted:** the claim that the counterexample refutes the node *as such*. The node's family is Hecke-stable and its strata are the $K$-orbits of a spherical loop space; the quiver refutes the implication **at recollement generality**, hence the node's proof route, not the specific instance. Whether $(2)\\Rightarrow(1)$ holds for the Hecke family without (3) is recorded as an open sub-question in [priorities](../../../../../blueprint/priorities.md). Also not adopted: the passage's stronger closure variant $i_{\\lambda!}\\, i_\\lambda^!\\left(\\langle-\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\right) \\subseteq \\langle-\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$ (its (6.3)) — the per-generator form (3) is weaker, sufficient, and checkable object by object; and its suggestion to demote the node from `prop` (the corrected statement is again a proposition-shaped claim).\n";</script>
