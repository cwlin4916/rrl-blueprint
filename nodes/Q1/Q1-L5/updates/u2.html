tml)). Read through [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html), a colimit along the closed embeddings $\\overline{i}_\\mu$ is a limit along the $!$-restrictions $\\overline{i}_\\mu^!$, and over one closure with finitely many orbits joint conservativity is already a theorem — the \"In particular\" of [Q1-L5-L5](../Q1-L5-L5/index.html). The hypothesis was therefore stated one level too high: at the closure level it is discharged, at the stratum level it is unreachable.\n\n## What was verified before revising\n\n**Verified, adopted.**\n\n1. *The appendix has no entry for the closure.* [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) names $\\overline{LX}_\\lambda$ (\"Denote their orbit closures to be …\", main.tex:749–751) and defines nothing; the ratified reading of [ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html) fixes the meaning of *orbit* as an fpqc-sheaf image and explicitly declines any further presentation. No other entry supplies the scheme structure, the reducedness or the placidity of $\\overline{LX}_\\lambda$.\n\n2. *The source does define it, and the definition is relative.* Chen–Yi, `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (v4, 10 Jul 2025), §3.2 p. 10: \"Let $\\overline{LX}_\\mu$ be the closure of $LX_\\mu$ in $LX$ (with the reduced scheme structure).\" Its placidity is not automatic: in the proof of Thm 36, pp. 20–21, the closure appears only as the middle term of a factorization $LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ produced by Noetherian descent for finitely presented morphisms **inside the placid scheme** $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (their Thm 35). The closure is placid because it is finitely presented inside a placid scheme, not because closures of placid things are placid.\n\n3. *The transcription of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) omits the clause the children need.* In v4, Theorem 36 reads: the orbit closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ are irreducible placid schemes, the closed embeddings into $LX$ are finitely presented, and the open embeddings $LX_\\lambda\\hookrightarrow\\overline{LX}_\\lambda$ and closed embeddings $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$, $\\lambda\\le\\lambda'$, are finitely presented. The presentation the appendix records under that number is **Proposition 39(ii)** of v4, which follows from Thm 36 together with the filtered structure of §5.3 (Lemma 38).\n\n4. *The reformulation is sound.* $i_\\lambda = \\overline{i}_\\mu\\circ i_{\\lambda,\\overline{LX}_\\mu}$ whenever $LX_\\lambda\\subseteq\\overline{LX}_\\mu$, so $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$. If $i_\\lambda^!\\mathcal{M}=0$ for all $\\lambda$, then per-closure joint conservativity gives $\\overline{i}_\\mu^!\\mathcal{M}=0$ for every $\\mu$, and the limit description gives $\\mathcal{M}=0$. The old hypothesis is a consequence of the two new ones, so nothing the reverse direction used has been lost.\n\n**Verified, already in the tree.** That the dévissage is stated over strata while every child — [Q1-L5-L3](../Q1-L5-L3/index.html), [Q1-L5-L4](../Q1-L5-L4/index.html), [Q1-L5-L5](../Q1-L5-L5/index.html) — is stated over a closed union of closures $Z$: read off the three statements, not the passage.\n\n**Unverified, not acted on.** Whether the limit description of the new (H2) holds for $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash-) = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash-)$ on the quotient **stack**. [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) is a statement about $\\mathcal{D}^!$ of a placid ind-scheme, not about the renormalized equivariant category; the passage from one to the other is exactly the content commissioned this run as a new child, and until it exists (H2) stays a hypothesis of the statement rather than a citation.\n\n**Refuted.** Nothing in the input was refuted.\n\n## Old statement (verbatim)\n\n> Assume, for the locally closed embeddings $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), that each induced functor\n>\n> $$\n> i_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n> $$\n>\n> is continuous, admits a fully faithful continuous left adjoint $i_{\\lambda!}$, and that the family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ is jointly conservative. Then\n>\n> $$\n> \\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\n> $$\n>\n> holds **if and only if both** of the following hold: … *(conditions (1) and (2), unchanged)* …\n>\n> Moreover the forward direction — equality implies (1), and trivially (2) — uses only the continuity of each $i_\\lambda^!$ and the section $i_\\lambda^!\\, i_{\\lambda!} \\simeq \\mathrm{id}$; joint conservativity is needed only for \"(1) and (2) imply equality\".\n\n## New statement\n\nThe two conditions (1) and (2) are unchanged — [Q1-L5-L1](../Q1-L5-L1/index.html), [Q1-L5-L2](../Q1-L5-L2/index.html) and [Q1-L6](../../Q1-L6/index.html) cite them by number and are untouched. What changed is the hypothesis package:\n\n- **(H1)** unchanged: each $i_\\lambda^!$ continuous with a fully faithful continuous left adjoint $i_{\\lambda!}$ — discharged by [Q1-L5-L3](../Q1-L5-L3/index.html) and [Q1-L5-L4](../Q1-L5-L4/index.html) at $Z = LX$;\n- **(H2)** new: $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ of the presentation identifies $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ with the limit of the $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\mu)$;\n- **(H3)** replaces the old global joint conservativity by its per-closure form, which is the \"In particular\" clause of [Q1-L5-L5](../Q1-L5-L5/index.html).\n\nThe old hypothesis is now derived from (H2) and (H3) in one line inside the statement, so the criterion proves exactly what it proved before under hypotheses the tree can reach.\n\n## Considered and not adopted\n\n- **Restating the whole criterion one closure at a time** — \"for every $\\mu$, equality holds over $\\overline{LX}_\\mu$\" — with the global conclusion assembled afterwards. It is the more thorough repair and it makes the finiteness scope visible in the conclusion, but it changes what conditions (1) and (2) say and would force matching edits in [Q1-L5-L1](../Q1-L5-L1/index.html), [Q1-L5-L2](../Q1-L5-L2/index.html) and [Q1-L6](../../Q1-L6/index.html), none of which is wrong. Minimality wins: the defect was in the hypotheses, and the hypotheses are what moved.\n- **Assuming per-closure orbit finiteness in Q1-L5 itself.** It is what makes (H3) true, but it is false for general spherical $X$ — $\\overline{LX}_{(0,\\dots,0)} = \\mathrm{Mat}_n(\\mathcal{O})$ for $X = M_n$ contains infinitely many orbits ([examples.md](../examples.html), instance 4) — and it is already carried, at the scope where it is a theorem, by [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html). Q1-L5 states the categorical hypothesis; the geometry that supplies it stays where it is.\n- **Writing the closure entry into the appendix, and correcting `thm:chen_Ti`, here.** `/update` does not write the appendix ([ADR 0019](../../../../process/decisions/0019-the-update-operator.html)); both went to the lead-researcher as commissions this run.\n";</script>
