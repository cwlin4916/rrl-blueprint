<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L5\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [papers](../../../papers/guideline.html)\n\nExplicit instances of the statement of [Q1-L5](index.html), simplest first. These illustrate and\nstress the statement; they do not prove it, and no proof may cite them.\n\nEVIDENCE: gap\n\n## Precedent\n\n**The criterion itself is not in print; its two halves are.** *Ind-direction:* for a reasonable\nind-scheme $T=\\varinjlim_i T_i$, $\\mathcal{D}^!(T)=\\varinjlim_i\\mathcal{D}^!(T_i)$ and\n$\\mathcal{D}^*(T)=\\varinjlim_{i\\in\\mathcal{I}^{\\mathrm{op}}}\\mathcal{D}^*(T_i)$ — Raskin, *D-modules on\ninfinite dimensional varieties*, (6.5.1) — and for $T$ placid (Def. 6.8.1) both are **compactly\ngenerated** (Rem. 6.8.3), which is what makes $\\{\\overline{i}_\\lambda^!\\}$ jointly conservative and the\n$\\perp$-form of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) usable. *Finite direction:*\n$\\overline{LX}_\\mu=\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$ — Chen–Yi, arXiv:2310.20006, Thm 17 of v3\n(= Thm 18 of v4; the numbering moved between versions). Neither draws the \"iff\". `refs.bib`:\n`raskin_dmodules_infinite_var`, `chenyi_2025singularitiesorbitclosuresloop`.\n\n**The source that should have contained it.** Chen–Yi build exactly this stratification (§*Placidness of\norbit closures*) and apply it to the relative Satake category, but stop at purity and parity. Their\nstanding setting is $X=G/K$ **symmetric** — the title, and the definition \"$K=G^\\theta$ … $X=G/K$ is a\nsymmetric variety\" — whereas [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) records the hypothesis as\n\"$X$ smooth affine spherical\". The abstract's \"results for singularities of spherical orbit closures\"\ndoes not close the gap: *spherical* there means the $L^+G$-orbits, as against the Iwahori orbits, on a\nsymmetric $X$ — so Cor. 9 and Cor. 14 of v4 are still statements about symmetric $X$. I also could not\nlocate a \"Thm 36\" in v3 or v4, so the appendix's result number should be checked against the version it\nwas taken from. This is the gap the verdict names: the criterion is unpublished, and the locally finite\nstratification it consumes is sourced only for symmetric $X$.\n\n**Strictly stronger statement.** None found: a general dévissage for placid ind-schemes with locally\nfinite stratification would make Q1-L5 a corollary of it plus\n[orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\n**Where the hypotheses bite.** Drinfeld–Gaitsgory, *Compact generation of the category of D-modules on\nthe stack of $G$-bundles on a curve* (CJM 2015, arXiv:1112.2402), Thm. 12.1.1: for $Y$ smooth\nirreducible with $\\{y\\in Y-U\\mid\\dim_y(Y-U)=\\dim Y-1\\}$ not quasi-compact, $\\mathcal{D}$-modules on $Y$\nare **not** compactly generated; Ex. 12.1.2 is $\\mathbb{A}^1$ with the origin repeated infinitely often.\nThere the subcategory generated by all compacts is proper (Cor. 12.2.7) *and* its restriction to the\nopen stratum also fails to generate (Lem. 12.2.6) — not a counterexample to Q1-L5, but a published\ninfinite stratification where the ambient category itself misbehaves. `refs.bib`: **absent**\n(`drinfeld2013some` is the other, GAFA, paper).\n\n## Instances\n\n### 1. $G=T$ a torus, $X=T$ *(constructed, routine)*\n\n**What it is.** $LX=LT$, $K=L^+T\\times L^+T$, $\\mathrm{IC}_0$ the $!$-extension of the constant sheaf on\n$K\\backslash L^+T$.\n\n**Why it is an instance.** Smooth affine, one $B$-orbit, generic stabiliser the antidiagonal $T$,\nconnected ([untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html)); the group\ncase, so [the three standing hypotheses](../../../appendix/assum-intro.html)(c) is derived Satake\n[[bezrukavnikov2008equivariant, Thm 5](../../../../papers/bezrukavnikov2008equivariant.pdf)] via\n[known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(1). Chen–Yi's closure\ntheorem applies with $\\Lambda_S^+=X_*(T)$; a torus has no coroots, so $\\mu\\le\\lambda$ forces $\\mu=\\lambda$\nand $\\overline{LX}_\\lambda=LX_\\lambda=t^\\lambda L^+T$ — each stratum open **and** closed, and\nthe per-closure finiteness — [Q1-L4](../Q1-L4/index.html)'s clause (iv) when this file was written, since\nwithdrawn ([u1](../Q1-L4/updates/u1.html)) — is a one-element set.\n\n**What the statement says here.** $i_\\lambda^!$ is projection to the $\\lambda$-th factor and\n$\\delta_\\lambda\\ast\\mathrm{IC}_0$ its generator, so (1) $\\Leftrightarrow$ (2) is \"compact objects, one\nper factor, generate a product iff each generates its factor\": the statement with the gluing off.\n\n### 2. $X=G$ under $G\\times G$ — the group case\n\n**What it is.** $K\\backslash LX=L^+G\\backslash LG/L^+G$, strata the Cartan cells, $\\mathrm{IC}_0=\\delta_e$\nthe unit for the [Hecke action](../../../appendix/conv-hecke-action.html).\n\n**Why it is an instance.** $X$ is the symmetric variety of the swap involution, so Chen–Yi's closure\ntheorem gives $\\overline{LX}_\\mu=\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$ with $\\Lambda_S^+$ the dominant\ncoweights in the dominance order — locally finite, discharging the finiteness then carried as [Q1-L4](../Q1-L4/index.html)'s clause (iv), since withdrawn ([u1](../Q1-L4/updates/u1.html)). (c) is\nderived Satake.\n\n**What the statement says here.** $\\mathcal{F}\\ast\\mathrm{IC}_0=\\mathcal{F}$ exhausts\n$\\mathcal{D}_c(K\\backslash LX)$, so (1) holds; $i_\\lambda^!i_{\\lambda!}\\mathcal{G}=\\mathcal{G}$ shows (2)\nholds, one $\\lambda$ at a time. Both sides true — the \"known extreme\" of the seed question, and the\ncheck that (2) is not vacuous.\n\n### 3. A symmetric pair: Gan–Gross–Prasad\n\n**What it is.** $G=\\mathrm{SO}_{N-1}\\times\\mathrm{SO}_N$, $X=\\mathrm{SO}_{N-1}\\backslash G$, so\n$K\\backslash LX=\\mathrm{SO}_{N-1}(O)\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$.\n\n**Why it is an instance.** Symmetric, so Chen–Yi's closure theorem and its locally finite $\\Lambda_S^+$\napply; (c) is a theorem here per\n[known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(3), citing\n[[BFT_orthosymplectic_satake](../../../../papers/BFT_orthosymplectic_satake.pdf)] — that result number was not independently verified.\n\n**What the statement says here.** (1) becomes one finite-dimensional question per $\\lambda$: do the\ncostalks $i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ generate $\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)$,\n$G_\\lambda$ the finite-type quotient of the stabiliser ([Q1-L4](../Q1-L4/index.html)(ii),(iii))? Chen–Yi\ncompute the abelian shadow (Cor. 9 of v4): for even orbit codimensions $\\mathrm{Perv}(L^+G\\backslash LX)$\nis semisimple, $\\simeq\\mathrm{Rep}(\\check G_X)$.\n\n### 4. Boundary: $X=M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ *(orbit computation constructed, unsourced)*\n\n**What it is.** [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html)(2). For\n$n=1$: $X=\\mathbb{A}^1$, $G=\\mathbb{G}_m\\times\\mathbb{G}_m$, $LX=k((t))$, $K=O^\\times\\times O^\\times$.\n\n**Why it is an instance.** Smooth affine spherical, connected generic $B$-stabiliser; (c) holds by\n[[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] as catalogued in the appendix; and\n$LX=\\varinjlim_m t^{-m}\\mathrm{Mat}_n(O)$ is a placid ind-scheme whose steps are single orbit closures, so\n[the three standing hypotheses](../../../appendix/assum-intro.html)(a) holds. Chen–Yi does **not** apply: $X$ is not\nhomogeneous, let alone symmetric.\n\n**What fails.** Orbits are elementary divisors $(a_1\\le\\dots\\le a_n)$, $a_i\\in\\mathbb{Z}\\cup\\{\\infty\\}$\n(Smith normal form over $k[[t]]$), and $\\overline{LX}_{(0,\\dots,0)}=\\mathrm{Mat}_n(O)$ contains every orbit\nwith all $a_i\\ge0$ — infinitely many; already for $n=1$, $\\overline{LX}_0=O$ contains $t^mO^\\times$ for\nall $m\\ge0$ and $\\{0\\}$. So [Q1-L4](../Q1-L4/index.html)(iv) is false here, the index set is not\n$\\Lambda_X^+$, and the induction inside a single $\\overline{LX}_\\lambda$ that (2) $\\Rightarrow$ (1) would\nrun is infinite. Q1-L5's conclusion is not thereby false; a hypothesis its proof inherits is.\n";</script>
