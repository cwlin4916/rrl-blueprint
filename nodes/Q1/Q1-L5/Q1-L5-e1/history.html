 subcategory is closed under retracts), not established in [examples.md](../examples.html). Clause 4 is deliberately conditional: over an infinite open-and-closed decomposition $\\mathcal{D}_c$ contains product-type objects, and $\\mathrm{Ind}(\\mathcal{D}_c)$ can then contain nonzero filtered colimits killed by every $i_\\lambda^!$ — the Drinfeld–Gaitsgory mechanism quoted in the precedent section of [examples.md](../examples.html) — so joint conservativity is a genuine obligation in this instance, not bookkeeping. Both sides of the equivalence are separately expected true here, as in the group case [Q1-L5-e2](../Q1-L5-e2/index.html).\n- **2026-08-04 — statement renotated** by `/update` ([u1](updates/u1.html), notation audit): clause 2 cited “hypothesis (iv) of Q1-L4” as live after that clause was withdrawn ([Q1-L4/updates/u1.md](../../Q1-L4/updates/u1.html)); the citation now routes through the withdrawal and names the surviving scoped claim [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html). The singleton-set fact itself is unchanged.\n- **2026-08-05 — examined and unchanged** by `/update` of the parent ([Q1-L5/u2](../updates/u2.html)): clause 4 still grants joint conservativity of $\\{i_\\lambda^!\\}_{\\lambda\\in X_*(T)}$, which the parent now derives from (H2)+(H3) rather than assuming. For this $X$ the strata are open and closed, so (H3) is trivial and the whole of what clause 4 grants is the parent's (H2): the tail mechanism this instance carries is now attached to the hypothesis that names it.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged. It consumes the stratum presentation only through $K_\\lambda\\cong L^+T$ and never writes the finite-type quotient, so the fpqc-quotient correction made to [Q1-L4](../../Q1-L4/index.html)(ii) does not reach its text.\n- **2026-08-05 — notation normalised, no claim changed** by `/update Q1`. Group names were written bare ($GL_n$, $SO_n$, …) against `\\mathrm{}` everywhere else in the
