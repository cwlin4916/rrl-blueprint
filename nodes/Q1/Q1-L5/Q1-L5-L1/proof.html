<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-L1 — Forward dévissage: global generation restricts to every stratum\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html), [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html), [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html), [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html). No node dependencies (ready leaf).\n- **notation:** $\\mathcal{S}$ is the Hecke family of Step 1, $\\mathcal{B}_\\lambda$ the stratum bracket and $\\mathcal{E}_\\lambda$ its preimage, both coined in Step 4; the two renormalized categories are written out in full throughout.\n\n## Lemma\n\nSuppose given, for each $\\lambda\\in\\Lambda_X^+$ ([Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)), a continuous functor\n\n$$\ni_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n$$\n\nadmitting a fully faithful continuous left adjoint $i_{\\lambda!}$, so that the unit is an equivalence $\\mathrm{id}\\simeq i_\\lambda^!\\, i_{\\lambda!}$. If\n\n$$\n\\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX),\n$$\n\nthen both conditions of [Q1-L5](../index.html) hold:\n\n1. for every $\\lambda\\in\\Lambda_X^+$, the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html);\n\n2. for every $\\lambda\\in\\Lambda_X^+$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\n\n   $$\n   i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right) \\in \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}.\n   $$\n\nJoint conservativity of the family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ is not assumed.\n\n## Proof\n\n**Step 1 — the Hecke family is a collection of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.**\n\n<details><summary>the argument</summary>\n\nSet\n\n$$\n\\mathcal{S} := \\left\\{\\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\}.\n$$\n\nSince $K = L^+G$, the ratified membership of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) reads $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$, and [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) then gives $\\mathcal{F}\\ast\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$ for every $\\mathcal{F}$ in the **small** category $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$. The Yoneda embedding $\\mathcal{D}_c(K\\backslash LX)\\hookrightarrow\\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$ of [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) places $\\mathcal{S}$ in the **large** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, which is where the hypothesis and both conclusions form their brackets.\n\n</details>\n\n**Step 2 — $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ are stable and cocomplete.**\n\n<details><summary>the argument</summary>\n\nBy [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ is closed under shifts and cofibres: each $f^!$ is exact, and complexes with finitely many coherent cohomologies are closed under shift and cone. So $\\mathcal{D}_c(\\mathcal{Y})$ is stable; it is essentially small, since [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) presupposes as much in forming $\\mathrm{Ind}\\,\\mathcal{D}_c(\\mathcal{Y})$.\n\nThe Ind-completion of a small stable category is stable presentable, hence cocomplete. Apply this at $\\mathcal{Y} = K\\backslash LX$ and at $\\mathcal{Y} = K\\backslash LX_\\lambda$ ([Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)).\n\nConsequently the operation $\\langle-\\rangle$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is available in either as ambient.\n\n</details>\n\n**Step 3 — $i_\\lambda^!$ is exact.**\n\n<details><summary>the argument</summary>\n\nIt is the *right* adjoint of the pair $i_{\\lambda!}\\dashv i_\\lambda^!$ given in the hypothesis, so it preserves limits; in particular it preserves the zero object and fibre sequences, and a functor between stable $\\infty$-categories preserving fibre sequences is exact.\n\n</details>\n\n**Step 4 — the preimage $\\mathcal{E}_\\lambda$ of the stratum bracket is a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.**\n\n<details><summary>the argument</summary>\n\nFix $\\lambda\\in\\Lambda_X^+$ and put\n\n$$\n\\mathcal{B}_\\lambda := \\left\\langle i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)},\n$$\n\n$$\n\\mathcal{E}_\\lambda := \\left\\{c\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ i_\\lambda^! c\\in\\mathcal{B}_\\lambda\\right\\}.\n$$\n\nBy [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), $\\mathcal{B}_\\lambda$ is a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$: a full subcategory containing $0$ and closed under small colimits and fibres formed there — not merely a thick one. All such colimits exist, by Step 2.\n\nNow $\\mathcal{E}_\\lambda$ is closed under small colimits, because $i_\\lambda^!$ is continuous by hypothesis:\n\n$$\ni_\\lambda^!\\left(\\operatorname{colim}_\\alpha c_\\alpha\\right)\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\operatorname{colim}_\\alpha i_\\lambda^! c_\\alpha ,\n$$\n\na colimit of objects of $\\mathcal{B}_\\lambda$. And it is closed under $0$ and fibres because $i_\\lambda^!$ is exact by Step 3.\n\nThis is the only use made of continuity of $i_\\lambda^!$.\n\n</details>\n\n**Step 5 — $\\mathcal{E}_\\lambda =_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.**\n\n<details><summary>the argument</summary>\n\nEvery member of $\\mathcal{S}$ lies in $\\mathcal{E}_\\lambda$, because $i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ is by construction one of the objects $\\mathcal{B}_\\lambda$ is generated by. So $\\mathcal{E}_\\lambda$ is a cocomplete stable subcategory containing $\\mathcal{S}$ (Step 4), and minimality in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) gives $\\langle\\mathcal{S}\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\subseteq\\mathcal{E}_\\lambda$.\n\nThe hypothesis of the Lemma identifies the left-hand side with all of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\n</details>\n\n**Step 6 — conclusion (1): $\\mathcal{B}_\\lambda =_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$.**\n\n<details><summary>the argument</summary>\n\nLet $d\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$. Then $i_{\\lambda!}d$ is an object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, so $i_{\\lambda!}d\\in\\mathcal{E}_\\lambda$ by Step 5, that is $i_\\lambda^!\\,i_{\\lambda!}d\\in\\mathcal{B}_\\lambda$.\n\nFull faithfulness of the left adjoint $i_{\\lambda!}$ makes the unit an equivalence $d\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} i_\\lambda^!\\,i_{\\lambda!}d$; this is the one place the section is used. A cocomplete stable subcategory is closed under equivalences in its ambient, an object equivalent to a member being the colimit of the one-object diagram on that member, so $d\\in\\mathcal{B}_\\lambda$.\n\nThe reverse inclusion holds by definition, giving the asserted equality of subcategories, which is (1). By the equivalence recorded in [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), the detection form of generation follows from it.\n\n</details>\n\n**Step 7 — conclusion (2).**\n\n<details><summary>the argument</summary>\n\nFix $\\lambda$ and $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$. Then $i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ is an object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ by Step 1, hence $i_{\\lambda!}\\,i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ is an object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\nThe hypothesis of the Lemma says that this category *is* $\\langle\\mathcal{S}\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$, so the object lies in that bracket. That is (2). $\\square$\n\n</details>\n\n## Caveats\n\n- Continuity of $i_{\\lambda!}$ is never invoked; it is automatic for a left adjoint. Continuity of $i_\\lambda^!$ is invoked exactly once, in Step 4, and the section $\\mathrm{id}\\simeq i_\\lambda^!\\,i_{\\lambda!}$ exactly once, in Step 6.\n- Joint conservativity of $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ is used nowhere: no step compares an object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ with the whole family of its restrictions. Nothing here bears on the converse implication, which is [Q1-L5-L2](../Q1-L5-L2/index.html).\n";</script>
