<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L5</a><i>›</i><a href="../index.html">Q1-L5-L1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L5-L1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-L1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReviewed: `blueprint/nodes/Q1-L5/Q1-L5-L1/proof.md` against `Q1-L5-L1_node.md`, `blueprint/appendix.md`\n(entries `def:generation`, `def:renormalized`, `def:orbits_iwahori_spherical`, $\\mathrm{IC}_0$,\n`conv:hecke_action`, `defn:coherent_D_mod`) and `blueprint/context.md`.\n\nI hunted hard for a hole in the generation-transport step, which is where this kind of draft usually\noverstates, and did not find one: the argument is a genuine minimality argument against an explicitly\nconstructed competitor subcategory, not an assertion. What follows is seven MINOR defects, all of them\nmatters of justification quality, attribution or house convention. None of them touches the conclusion.\n\n---\n\n**Flaw 1** [MINOR] — This is an argument from the *grammar* of an appendix entry, not from a stated fact.\n\n<details><summary>(location: Step 2, \"it is essentially small, since [`def:renormalized`] presupposes as\nmuch in forming $\\mathrm{Ind}\\,\\mathcal{D}_c(\\mathcal{Y})$\") · the finding</summary>\n\n`def:renormalized`\nrecords only the formula $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}(\\mathcal{D}_c(\\mathcal{Y}))$;\nit asserts nothing about the size of $\\mathcal{D}_c(\\mathcal{Y})$, and a reader could as well take the\n$\\mathrm{Ind}$ there to be a universe-enlarged one. The conclusion drawn from it — essential smallness — is\nload-bearing: it is what makes $\\mathrm{Ind}\\,\\mathcal{D}_c$ presentable, hence cocomplete, hence what\nsupplies the colimits Step 4 forms and the ambient in which the hypothesis's bracket is taken.\n\nThe fact itself is not in doubt: it is standing notation (`subsec:notations`, main.tex:207–228, transcribed\nin the appendix as \"$\\mathcal{D}_c(-)$ its **small** full subcategory of coherent $\\mathcal{D}$-modules\"),\nand inside the appendix $\\mathrm{Ind}(-)$ is introduced only for small input (`def:compactly_generated_category`).\nNeither entry is in this node's declared `objects:`, which is presumably why the draft improvised. The\nright fix is not the prover's: the node's object list should carry `subsec:notations`. Recorded here so the\nnext `/update` can see it.\n\n</details>\n\n**Flaw 2** [MINOR] — Two small attribution slips in one sentence.\n\n<details><summary>(location: Step 1, \"for every $\\mathcal{F}$ in the **small** category\n$\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\" and \"The Yoneda embedding … of [`def:renormalized`]\") · the finding</summary>\n\n(i) The bolded smallness of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\nis asserted and never argued; Step 2's smallness discussion is explicitly applied only at\n$\\mathcal{Y} = K\\backslash LX$ and $\\mathcal{Y} = K\\backslash LX_\\lambda$, and $\\mathrm{Gr}$ is neither.\nNothing in the proof actually needs it — `def:generation` quantifies over a \"collection of objects\" with no\nsmallness clause — so the bolding advertises a hypothesis the argument does not consume. (ii) The fully\nfaithful $\\mathcal{D}_c(\\mathcal{Y})\\hookrightarrow\\mathrm{Ind}\\,\\mathcal{D}_c(\\mathcal{Y})$ is credited to\n`def:renormalized`, which records no such map. It is standard for an Ind-completion and so is legitimately\navailable as standard mathematics; it is simply not *that* entry's content.\n\n</details>\n\n**Flaw 3** [MINOR] — \"Continuous\" is nowhere fixed in `blueprint/appendix.md` or `blueprint/context.md`, and the two live\nreadings differ here.\n\n<details><summary>(location: Step 4, \"closed under small colimits because $i_\\lambda^!$ is continuous by\nhypothesis\"; Caveats, \"Continuity of $i_\\lambda^!$ is invoked exactly once, in Step 4\") · the finding</summary>\n\nIf continuous means \"preserves all small colimits\", Step 4's displayed equivalence\n\n$$\ni_\\lambda^!\\left(\\operatorname*{colim}_\\alpha c_\\alpha\\right)\\ \\simeq\\ \\operatorname*{colim}_\\alpha i_\\lambda^! c_\\alpha\n$$\n\nis immediate and the Caveat is exact as written. If it is read in the Gaitsgory–Rozenblyum sense — commutes\nwith *filtered* colimits, which is the sense the appendix's own $\\mathrm{Fun}^\\omega$ notation at\n`def:compactly_generated_category` uses — then the display for an arbitrary small diagram needs the finite\nhalf as well, i.e. it needs Step 3's exactness in addition to continuity. The ingredient is present (a small\ncolimit is a filtered colimit of finite ones, and Step 3 gives finite colimits), so there is no gap in\nsubstance; but under that reading the Caveat's clean separation — continuity in Step 4, exactness for\n$0$ and fibres — misdescribes the proof's own dependency structure. Say which reading is in force, or\nroute the colimit closure through Step 3 as well.\n\n</details>\n\n**Flaw 4** [MINOR] — The load-bearing word is \"there\": the argument needs $\\mathcal{B}_\\lambda$ closed under colimits computed in\nthe *ambient* $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, not merely cocomplete as a category in\nits own right.\n\n<details><summary>(location: Step 4, \"By [`def:generation`], $\\mathcal{B}_\\lambda$ is a cocomplete stable\nsubcategory … closed under small colimits and fibres formed **there**\") · the finding</summary>\n\nUnder the intrinsic reading of the phrase \"cocomplete stable subcategory\", Step 4 would\ncollapse. The closure reading is licensed — but by the **note** on `def:generation` (\"$\\langle-\\rangle_{\\mathcal{C}}$\nis closed under arbitrary colimits, not merely finite ones and retracts\", and \"strictly stronger than thick\",\nthickness already carrying closure under fibres and retracts), corroborated by `def:satake_subcategory` —\nand not by the entry's definition line, which is what the draft cites. Since this is exactly the point at\nwhich a weaker-than-intended reading of the entry would sink the proof, the citation should be to the note.\n\nI note in the draft's favour that the reading is *stated* rather than smuggled, and that the minimality step\nis robust to the ambiguity in the other direction: $\\mathcal{E}_\\lambda$, being closed under ambient colimits\nand fibres, is an admissible competitor under either reading, so Step 5's\n$\\langle\\mathcal{S}\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\subseteq\\mathcal{E}_\\lambda$ holds\nwhichever way \"cocomplete stable subcategory\" is taken.\n\n</details>\n\n**Flaw 5** [MINOR] — Step 4 itself lists what is to be checked — full, contains $0$, closed under small colimits, closed under\nfibres — and then verifies three of the four: fullness of $\\mathcal{E}_\\lambda$ is never checked.\n\n<details><summary>(location: Step 4, the four clauses listed for $\\mathcal{E}_\\lambda$; Step 6, \"an object\nequivalent to a member being the colimit of the one-object diagram on that member\") · the finding</summary>\n\nIt is\nimmediate (a preimage of a full subcategory under a functor is full), which is why this is MINOR and not\nmore, but a step that enumerates its own obligations should discharge all of them.\n\nRelatedly, Step 6's repleteness argument is closer to a restatement than a derivation: \"closed under small\ncolimits\", in the ambient-closure sense Flaw 4 discusses, already presupposes that membership is invariant\nunder equivalence, colimits being defined only up to equivalence. The cleaner reason is that a full\nsubcategory of an $\\infty$-category is replete by construction, being determined by a set of equivalence\nclasses of objects. The conclusion $d\\in\\mathcal{B}_\\lambda$ stands either way.\n\n</details>\n\n**Flaw 6** [MINOR] — Step 1 places $\\mathcal{F}\\ast\\mathrm{IC}_0$ in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and says nothing\nabout the stratum category.\n\n<details><summary>(location: Step 7, \"$i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$ is an object of\n$\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ by Step 1\") · the finding</summary>\n\nWhat carries the object across is the declared codomain of $i_\\lambda^!$ in the\nLemma's hypothesis. Since typing across the small/large and global/stratum boundaries is precisely what this\nnode is asked to keep honest, the citation should name the hypothesis, not Step 1.\n\n</details>\n\n**Flaw 7** [MINOR] — House convention, `blueprint/context.md` line 43: the ambient subscript on $=$ \"is dropped when the ambient\nis already one of the two sides\".\n\n<details><summary>(location: the headings of Step 5 and Step 6) · the finding</summary>\n\nBoth headings —\n$\\mathcal{E}_\\lambda =_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\nand $\\mathcal{B}_\\lambda =_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$\n— have the right-hand side as the ambient, so the subscript is decorative there and the convention says to\ndrop it. (The two $\\simeq$ subscripts, in Step 4 and Step 6, compare two *objects* and are correctly\nretained.) The render gate enforces only the generation-bracket half of the rule, so this passes the gate.\n\n</details>\n\n---\n\n## Checks that passed, recorded for the audit trail\n\n**Statement fidelity.** `## Lemma` (proof.md:10–32) is character-for-character the node's `## Statement`\n(`Q1-L5-L1_node.md`:18–40), including the closing sentence \"Joint conservativity … is not assumed\". No\nhypothesis strengthened, no conclusion weakened. Its clauses (1) and (2) likewise match Q1-L5's (1)\n*(stratumwise generation)* and (2) *(support-cutting)* verbatim, so the node does deliver what its parent's\n\"Moreover\" clause assigns it.\n\n**Handedness.** $i_{\\lambda!}\\dashv i_\\lambda^!$ with $i_{\\lambda!}$ the left adjoint; the unit is an\nendo-transformation $\\mathrm{id}\\to i_\\lambda^!\\,i_{\\lambda!}$ of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$,\nwhich is where $d$ of Step 6 lives, and full faithfulness of a left adjoint is equivalent to the unit being\nan equivalence. Step 3's use of right-adjointness for exactness is the correct handedness, and it preserves\n*all* limits, which is more than the fibre sequences the step then invokes.\n\n**The two Caveat claims, both verified against the text.** Continuity of $i_\\lambda^!$ appears only in\nStep 4 (subject to Flaw 3). The section $\\mathrm{id}\\simeq i_\\lambda^!\\,i_{\\lambda!}$ appears only in Step 6;\nStep 7 uses $i_{\\lambda!}i_\\lambda^!$ for its typing alone and not for the unit. Joint conservativity is\nindeed used nowhere: no step compares an object of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ against the\nwhole family $\\{i_\\lambda^!\\}_{\\lambda}$, and Step 6 runs one $\\lambda$ at a time. Continuity of\n$i_{\\lambda!}$ is genuinely unused and genuinely automatic (left adjoints preserve colimits under either\nreading of \"continuous\"), so hypothesis (H1) of Q1-L5 carries one redundant clause — worth recording for\n`/update`, not a defect of this draft.\n\n**The detection form (Step 6, closing sentence).** I checked that the appendix's criterion, quantified over\n$i\\ge 0$ only, really does follow from $\\mathcal{B}_\\lambda = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$\nwith no compactness of the generators — which matters, because $i_\\lambda^!$ is not assumed to preserve\ncompacts (that would need a continuous *right* adjoint to $i_\\lambda^!$, which is not among the hypotheses).\nVanishing of $\\operatorname{Map}(c_\\alpha[-i],c)$ for all $i\\ge 0$ forces the whole mapping spectrum\n$\\operatorname{map}(c_\\alpha,c)$ to vanish, after which $\\{x : \\operatorname{Map}(x,c)=0\\}$ is closed under\ncolimits and shifts and contains every $c_\\alpha$, hence contains $c$ itself. So the remark is sound as well\nas licensed by the entry.\n\n**Closed world and hallucination check.** Six appendix links, six anchors that exist: `#def-generation`\n(l. 253), `#def-renormalized` (l. 692), `#def-orbits-iwahori-spherical` (l. 589), `#ic-0` (l. 783),\n`#conv-hecke-action` (l. 797), `#defn-coherent-d-mod` (l. 684) — exactly the declared `objects:`, none\nmissing, none extra. Relative depth is right ($d = 2$, so `../../../` reaches `blueprint/`). No bib key and\nno main.tex `\\label` is cited anywhere in the draft, so there is nothing to grep against `refs.bib`. The\ntyping chain in Step 1 uses the entries as written: $\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX)$ is the\nratified membership of the $\\mathrm{IC}_0$ entry with $K = L^+G$ standing (context.md l. 11), and\n$\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)$ for\n$\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)$ is the\ndisplay of the Hecke-action entry, hypotheses matched slot for slot. The link to Q1-L5-L2 in the Caveats is\nnavigational — it imports no statement — and Q1-L5 is named only inside the frozen statement, so neither is\na closed-world violation on a node whose `depends-on` is empty.\n\n**No `GAP:` marker**, and none is owed.\n\nVERDICT: PASS\n";</script>
