<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L5</a><i>›</i><a href="../index.html">Q1-L5-z1</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u1 — the presentability clause (ii) was already spending becomes a hypothesis</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-z1/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L5-z1](../index.html) · [history](../history.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html)\n\nRun: `/update Q1-L5-z1`, at the user's direction, as part of clearing the red layer of the\nDAG. The lead was this node's own [r1 critique](../critiques/r1.html), verdict\n`VERDICT: FAIL`, Flaw 1 at MAJOR. No external passage was supplied; the record on disk is\nthe input, and its page citations were re-opened against `papers/GR17vol1.pdf` rather than\nadopted from the critique's paraphrase.\n\n## The defect, in one sentence\n\nClause (ii) is proved by way of the orthogonality criterion of\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html), and\nthat criterion holds only for **presentable** $\\mathcal{C}$, while the statement hypothesises\nmerely a stable category admitting all small colimits.\n\n## What was verified, refuted, left unverified\n\n**Verified — presentability is load-bearing in the source, not a convention.** Two page\ncitations, both re-opened. `GR17vol1` printed p. 51 (PDF p. 88), footnote 8: *\"When talking\nabout cocomplete categories we will always assume that they are presentable.\"* It is attached\nto §5.1.5, which is where GR define \"cocomplete stable category\", so GR's \"cocomplete stable\"\n**means** \"presentable stable\". And the proof of Prop. 5.4.5 (printed p. 55, PDF p. 92) opens\nby asserting that the inclusion admits an *a priori non-continuous* right adjoint — an appeal\nto the Adjoint Functor Theorem, GR's Thm. 2.5.4(a), whose footnote 3 (printed p. 32) records\nthat presentability *\"is necessary for the Adjoint Functor Theorem to hold\"*. The hypothesis\nis consumed inside the proof of the very result the entry cites.\n\n**Verified — only $\\mathcal{C}$ needs it, and only clause (ii).** Clause (i) reaches the\ncriterion nowhere: it argues by minimality alone, which is hypothesis-free. Within clause\n(ii), Step 9 concludes $r_\\alpha M\\simeq 0$ from self-orthogonality at $n=0$ rather than by\ninvoking the criterion a second time inside $\\mathcal{C}_\\alpha$, so the member categories\n$\\mathcal{C}_\\alpha$ never need presentability either. That is why the repair below is a\nseparate labelled hypothesis rather than a word in the preamble: a hypothesis stated where it\nis spent tells an instance exactly what it must check, and one stated globally does not.\n\n**Verified — the statement is not false, only under-hypothesised.** For $A$ a singleton the\nconclusion holds with no presentability whatever: the triangle identity makes\n$r\\epsilon_M$ an equivalence, exactness of $r$ gives $r\\,\\mathrm{cofib}(\\epsilon_M)\\simeq 0$,\n**(B)** gives $\\mathrm{cofib}(\\epsilon_M)\\simeq 0$, so $e$ is essentially surjective and hence\nan equivalence; then (1) gives $\\langle e\\,r\\,S\\rangle_{\\mathcal{C}}=\\mathcal{C}$ and (2) with\nminimality gives $\\mathcal{C}\\subseteq\\langle S\\rangle_{\\mathcal{C}}$. The defect is therefore\nin what the argument is entitled to at general $A$, not in the claim.\n\n**Left unverified — whether the conclusion survives at general $A$ without presentability.**\nThe critic searched for a cocomplete stable non-presentable $\\mathcal{C}$ carrying **(A)**,\n**(B)**, (1), (2) with $\\langle S\\rangle_{\\mathcal{C}}\\neq\\mathcal{C}$ and could not produce\none, and neither could this run. Absence of a witness is not a proof, so the hypothesis is\nadded rather than argued away.\n\n**Not adopted here — the primary defect is in the appendix entry.** The write-up uses\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html)\n*exactly as the entry is written*; it is the entry that drops its source's standing\nhypothesis. The appendix is the lead-researcher's to write and no operator's to edit in\npassing, so that correction was commissioned separately in this run, together with a new entry\nfor the right-orthogonal closure lemma that Steps 1–3 currently re-prove inline.\n\n## The old hypotheses, verbatim\n\n> Let $\\mathcal{C}$ be a stable category admitting all small colimits, let $A$ be a set, and\n> for each $\\alpha\\in A$ let $\\mathcal{C}_\\alpha$ be a stable category admitting all small\n> colimits. […]\n>\n> **(B) Joint conservativity.** If $M\\in\\mathcal{C}$ satisfies $r_\\alpha M\\simeq 0$ for every\n> $\\alpha\\in A$, then $M\\simeq 0$. This hypothesis is used in clause (ii) alone.\n>\n> […] (ii) *(backward)* under **(B)**, conditions (1) and (2) together imply\n> $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$.\n\n## The new statement\n\nOne change. A third labelled hypothesis is added,\n\n> **(C) Presentability of the ambient.** $\\mathcal{C}$ is presentable. This hypothesis is used\n> in clause (ii) alone.\n\nand clause (ii) now reads \"under **(B)** and **(C)**\". The preamble, **(A)**, **(B)**,\nconditions (1) and (2) and clause (i) are untouched, and Steps 1–6 and 8–10 of the existing\nwrite-up survive the edit verbatim.\n\n## Considered and not adopted\n\n**Putting \"presentable\" in the preamble on $\\mathcal{C}$**, which is what the critique\nliterally proposed (\"one word in the node's hypothesis on $\\mathcal{C}$\"). Rejected as less\ninformative for no saving: the node already accounts hypothesis by clause — **(B)** carries\nthe sentence \"used in clause (ii) alone\", and clause (i) advertises that it does not use it —\nso burying presentability in the preamble would be the one hypothesis whose scope the reader\ncannot see. An instance discharging clause (i) alone should not have to check it.\n\n**Requiring the $\\mathcal{C}_\\alpha$ presentable as well.** Rejected: Step 9 avoids the\ncriterion inside $\\mathcal{C}_\\alpha$, so nothing asks for it, and a hypothesis nothing asks\nfor is one an instance supplies for nothing.\n\n**Deleting \"continuous\" from $e_\\alpha$ in (A)**, which [r1](../critiques/r1.html) Flaw 3 shows\nis *redundant* rather than merely unused — a left adjoint preserves every colimit that exists,\nand both categories are cocomplete, so $e_\\alpha$ is continuous automatically. The deletion is\nright and is **deferred, not rejected**: hypothesis **(A)** is cited by link rather than\nrestated from [Q1-L6-z1](../../../Q1-L6/Q1-L6-z1/index.html), which passed its r1 today\nand whose Step 6 reads the continuity of $e_\\alpha$ off **(A)**. Taking the word out would\nleave that citation dangling for a property that still holds, so the two edits belong in one\npass, and it is booked into this run's simplification stage rather than made here.\n";</script>
