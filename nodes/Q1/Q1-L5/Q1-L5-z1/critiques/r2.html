character for character: preamble, **(A)** with its display, **(B)**,\n  the new **(C)**, conditions (1) and (2) with their displays, and clauses (i) and (ii) including\n  both parentheticals. The single omission — the closing `**Scope.**` paragraph — is declared at\n  proof.md:42 in one line. Nothing strengthened, nothing weakened. Flaw 5 of r1 is met exactly.\n\n- **Hallucination sweep.** The draft cites no bib key and no `main.tex` `\\label`; the only\n  external references are the three appendix links, all of which resolve from the draft's own\n  depth (`../../../../appendix/…` reaches `blueprint/appendix/`), all three files exist, and all\n  three carry the anchors their filenames imply\n  (`<a id=\"def-generation\">`, `<a id=\"left-orthogonal-closure\">`, `<a id=\"conv-dgcat\">`). The new\n  entry is listed in `blueprint/appendix/index.md` (line 98). `GR17vol1` is `refs.bib`:350. The\n  draft's `uses:` line is exactly the node's `objects:` line.\n\n- **Closed world.** Three declared entries, nothing else, no node cited, `depends-on` empty and\n  said to be so twice (line 5 and Step 10). The remaining ingredients — \"a functor between stable\n  categories preserving finite colimits is exact\", \"a left adjoint preserves colimits\", \"a limit\n  of contractible anima is contractible\" — are standard and need no entry.\n\n- **Where (C) is spent, verified step by step.** Presentability is invoked at Step 5 and nowhere\n  else. Step 3 uses only the hypothesis-free minimality half; Step 6 and Step 8 use clause (3) of\n  the left-orthogonal entry, which the entry certifies as presentability-free at every clause;\n  Step 7 uses only the adjunction and exactness; Step 8 concludes $r_\\alpha M\\simeq 0$ from\n  $r_\\alpha M\\in{}^{\\perp_{\\mathcal{C}_\\alpha}}(r_\\alpha M)$ at $n=0$ rather than re-invoking the\n  criterion inside $\\mathcal{C}_\\alpha$. So no $\\mathcal{C}_\\alpha$ is ever asked for\n  presentability, and the scoping sentence in **(C)** is accurate. This is the whole content of\n  the r1 repair and it lands.\n\n- **Both instantiations of the new entry discharge its hypotheses.** At $\\mathcal{D}=\\mathcal{C}$\n  (Steps 5, 6): stable with all small colimits by the preamble, $M\\in\\mathcal{C}$ fixed at Step 5,\n  and $T=S$ a set by hypothesis. At $\\mathcal{D}=\\mathcal{C}_\\alpha$ (Step 8): stable with all\n  small colimits by the preamble, test object $r_\\alpha M$, and $T=\\{r_\\alpha s\\}_{s\\in S}$ a set\n  as the image of one — the draft says so rather than assuming it. No presentability is smuggled\n  into either.\n\n- **Adjunction handedness.** $e_\\alpha\\dashv r_\\alpha$ throughout. Step 4 uses the unit\n  $\\mathrm{id}\\simeq r_\\alpha e_\\alpha$ (the correct one for a fully faithful *left* adjoint);\n  Step 7 uses\n  $\\operatorname{Map}_{\\mathcal{C}_\\alpha}(Y,r_\\alpha M)\\simeq\\operatorname{Map}_{\\mathcal{C}}(e_\\alpha Y,M)$\n  at $Y=r_\\alpha s[n]$, which is the right direction. No silent inversion.\n\n- **The source, on the page.** Printed p. 55 (PDF p. 92) reads, in the proof of Prop. 5.4.5:\n  *\"Let $\\mathbf{C}'$ be the smallest cocomplete stable full subcategory of $\\mathbf{C}$ that\n  contains the objects of the form $c_\\alpha$. The inclusion $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$\n  admits an (a priori non-continuous) right adjoint, denoted $\\iota^R$\"*, and closes *\"the\n  inclusion $\\iota$ is an equivalence if and only if $\\jmath^L$ is zero if and only if\n  $\\mathbf{C}''=0$\"* with $\\jmath^L(c)=\\mathrm{coFib}(\\iota\\iota^R(c)\\to c)$. GR route both\n  directions through $\\iota^R$, but only *orthogonality $\\Rightarrow$ generation* needs it: the\n  converse is the one-line argument the entry gives. So the appendix's assignment of the\n  hypothesis to that one direction is correct, and Step 5 uses the charged direction and pays for\n  it. Printed p. 51 (PDF p. 88), footnote 8, is verbatim as quoted: *\"When talking about cocomplete\n  categories we will always assume that they are presentable.\"* Def. 5.4.1's display on p. 55\n  carries $\\forall\\alpha$, as the entry restores.\n\n- **Quantifiers and edge cases.** $M$ is fixed at Step 5 before $\\alpha$ is fixed at Step 7, and\n  Step 9 re-opens $\\alpha$ correctly. $A=\\varnothing$: **(B)** forces $\\mathcal{C}\\simeq 0$ and\n  Step 9's premise is vacuously met. $S=\\varnothing$: (1) forces each $\\mathcal{C}_\\alpha\\simeq 0$,\n  then **(B)** forces $\\mathcal{C}\\simeq 0$. Neither breaks a step.\n\n- **Caveat 3 checks out.** $\\mathrm{DGCat}:=\\mathrm{LinCat}_k=\\mathrm{LMod}_{\\mathrm{LMod}_k}(\\mathrm{Pr}^L)$\n  by [`DGCat`, `Vect`](../../../../../appendix/conv-dgcat.html), so an object of\n  $\\mathrm{DGCat}$ is presentable and **(C)** is discharged by naming the ambient — which is also\n  what the hypotheses line of\n  [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) says. The\n  repair therefore does not hollow the node out for its intended instances.\n\n## Disposal of the round-1 items\n\n- **Flaw 1 [MAJOR] — resolved, and by the right route.** The gap was not papered over in the\n  write-up: the *statement* gained **(C)** through `/update` ([u1](../updates/u1.html)), the appendix\n  entry gained the hypothesis it had dropped from its source, and Step 5 now names the hypothesis,\n  names the direction and names the entry that charges for it. The Caveat that r1 objected to\n  (\"A referee declining that generality\") is gone.\n- **Flaw 2 [MINOR] — resolved at the level it belonged to.** The two readings of \"cocomplete stable\n  subcategory\" are now adjudicated by the entry itself: minimality is declared hypothesis-free, and\n  the draft uses that reading uniformly (Steps 3, 6, 8 and Caveat 2). See Flaw 3 below for the one\n  residue, which is against the entry and not the draft.\n- **Flaw 3 [MINOR] — met.** Caveat 1 (proof.md:86) says \"redundant, not merely unused\", gives the\n  reason (a left adjoint preserves every colimit that exists; both categories are cocomplete), and\n  explicitly protects the property from going with the word. Caveat 2 carries the $\\mathcal{F}_\\alpha$\n  route and stops it in the right place: \"What the route lacks is the dévissage assembling $M$ from\n  the $e_\\alpha r_\\alpha M$, which **(B)** does not supply\". I re-checked the route — exactness and\n  continuity of $e_\\alpha$ make $\\mathcal{F}_\\alpha$ colimit- and shift-closed, (2) puts $r_\\alpha s$\n  in it, (1) with minimality gives $\\mathcal{F}_\\alpha=\\mathcal{C}_\\alpha$ — and it is correct.\n- **Flaw 4 [MINOR] — met, and the derivation is valid.** Step 2 derives exactness of $r_\\alpha$\n  from continuity alone: preserving small colimits gives finite ones, and a functor between stable\n  categories preserving finite colimits preserves finite limits, since a square there is a pushout\n  iff it is a pullback. That is correct (see Flaw 4 below for the one elision). Step 10's audit now\n  matches the steps exactly — continuity at Steps 2–3, minimality at Step 3, the section at Step 4,\n  **(B)** at Step 9 alone, **(C)** at Step 5 alone — and no longer contradicts the clause-(i)\n  parenthetical.\n- **Flaw 5 [MINOR] — met.** See \"Statement fidelity\" above.\n- **Flaw 6 [MINOR] — met.** No occurrence of \"right-orthogonal\" survives (grepped); the\n  `notation:` line at proof.md:6 now fixes the left orthogonal and spells out that membership means\n  $X$ maps trivially *into* $M$.\n\n---\n\n**Flaw 1** [MINOR] — The word \"continuous\" appears in hypothesis **(A)** of the node's own statement, and no entry of\n`blueprint/appendix/` and no line of `blueprint/context.md` fixes its meaning — I grepped both.\n\n<details><summary>(location: proof.md:6, the `notation:` line — \"'continuous' means 'preserves\nsmall colimits'\"; consumed at Step 2, proof.md:54) · the finding</summary>\n\nThe draft supplies the reading itself. That is legitimate, and the reading is the standard one in\n$\\mathrm{Pr}^L$, but it is load-bearing twice over: Step 2's derivation of exactness needs\n\"preserves *finite* colimits\", and clause (i)'s parenthetical — a clause of the statement this node\nis certifying — is a claim about precisely that word.\n\nThe source behind [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html)\nuses the word differently. GR17vol1 §5.1.6 (printed p. 51, PDF p. 88) reads: *\"Let $\\mathbf{C}$ and\n$\\mathbf{D}$ be a pair of cocomplete stable categories, and let $F\\colon\\mathbf{D}\\to\\mathbf{C}$ be\nan **exact** functor. We shall say that $F$ is *continuous* if it preserves filtered colimits.\"* So\nfor GR the word presupposes exactness and asks only for filtered colimits. The statement survives\neither reading — under GR's, Step 2 is an unpacking rather than a derivation, and the parenthetical\nstill holds because exactness is then part of **(A)** — so nothing here is wrong. But the closed\nworld should not leave a word of a node statement to be pinned by the write-up that consumes it; a\none-line convention entry, or \"colimit-preserving\" in **(A)**, closes it for every node that\ninstantiates this one.\n\n</details>\n\n**Flaw 2** [MINOR] — The entry states the orthogonality criterion for an arbitrary *collection*, with no smallness\nhypothesis.\n\n<details><summary>(location: not the draft — the criterion paragraph of\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html), \"let\n$\\{c_\\alpha\\}$ be a collection of objects … Assume in addition that $\\mathcal{C}$ is presentable\") · the finding</summary>\n\nIts source's proof needs one. On printed p. 55 the Adjoint Functor Theorem is applied\nto $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$, which requires $\\mathbf{C}'$ itself to be presentable;\nfor a small collection that is the standard fact that the colimit closure of a set of objects in a\npresentable category is presentable, and for a general collection it is not available. The entry\nhas therefore inherited $\\mathcal{C}$'s presentability from its source but not the smallness its\nsource's proof also consumes.\n\nThis is a flaw against the entry, not against the draft: Step 5 (proof.md:66) says \"Applied to the\nsmall set $S$\", $S$ is a set by the node's preamble, and the draft is on the safe side of the\nmissing hypothesis. Recorded so that the next node to reach for the criterion with a large\ncollection does not walk into it.\n\n</details>\n\n**Flaw 3** [MINOR] — The residue of r1's Flaw 2.\n\n<details><summary>(location: Step 5, \"the orthogonality criterion … is available in $\\mathcal{C}$\nin the direction *orthogonality $\\Rightarrow$ generation*\", read against the minimality half used at\nStep 3) · the finding</summary>\n\nThe entry now fixes minimality as hypothesis-free, i.e. $\\langle\nS\\rangle_{\\mathcal{C}}$ is the smallest full subcategory closed under shifts and small colimits\ncontaining $S$; the criterion is imported from a source whose own convention (footnote 8, verified\nabove) makes \"cocomplete stable subcategory\" mean *presentable* stable subcategory, so what GR's\nProp. 5.4.5 concludes to be all of $\\mathbf{C}$ is the smallest **presentable** such subcategory,\nwhich a priori only contains the entry's $\\langle S\\rangle_{\\mathcal{C}}$. The two agree in the\nsituation Step 5 is in — $\\mathcal{C}$ presentable by **(C)**, $S$ small — because the colimit\nclosure of a small set in a presentable stable category is presentable, hence is a competitor in\nGR's minimization. So the step is true, and under the entry as ratified the draft is entitled to it\nverbatim; but the reconciliation is a sentence nobody has written, in either place, and it is the\nsame sentence Flaw 2 wants.\n\nTwo smaller items of the same kind, neither of which the draft mis-uses.\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) never\n*defines* \"cocomplete stable subcategory\"; the only unfolding in the closed world is clause (2) of\n[the left-orthogonal entry](../../../../../appendix/left-orthogonal-closure.html)\n(\"full …, closed under equivalence, containing $0$, closed under $X\\mapsto X[m]$ …, and closed\nunder all small colimits formed in $\\mathcal{D}$\"), reached only through an entry that cites the\nfirst. And that clause's closing phrase \"in the sense of\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html)\" is itself\ntrue only on the naive reading, since ${}^{\\perp_{\\mathcal{D}}}M$ has no reason to be presentable.\nThe appendix is internally consistent on the naive reading; it is its relation to the printed source\nthat is one sentence short.\n\n</details>\n\n**Flaw 4** [MINOR] — Two elisions, both trivially fillable, both in the two steps that carry clause (i).\n\n<details><summary>(location: Step 2, \"since there a square is a pushout exactly when it is a\npullback\"; Step 3, \"its preimage $\\mathcal{E}_\\alpha$ is a full subcategory of $\\mathcal{C}$ closed\nunder shifts, fibers, cofibers and small colimits\") · the finding</summary>\n\nStep 2's stated reason covers pullbacks but not the terminal object, and finite limits are generated\nby the two. The missing half is free — the empty colimit is a finite colimit, so $r_\\alpha$\npreserves the initial object, which in a stable category is also terminal — but the sentence as\nwritten does not say it.\n\nStep 3 lists closure properties and then applies minimality, which is a statement about *cocomplete\nstable subcategories*; the draft never says that $\\mathcal{E}_\\alpha$ is one. It is (containment of\n$0$ again comes from the empty colimit, and closure under equivalence from fullness plus an\nequivalence-invariant defining condition), and clause (2) of the left-orthogonal entry shows the\nform the identification is supposed to take. One clause, in the entry's own vocabulary, would make\nStep 3 self-contained.\n\n</details>\n\n**Flaw 5** [MINOR] — The subscripted equivalence $\\simeq_{\\mathcal{C}}$ is coined nowhere — not in the draft's\n`notation:` line, which coins only \"continuous\" and the left orthogonal, not in\n[context](../../../../../context.html), not in the appendix.\n\n<details><summary>(location: Step 4, \"$Y\\simeq_{\\mathcal{C}_\\alpha} r_\\alpha e_\\alpha Y$\"; Step 7,\n\"$e_\\alpha(r_\\alpha s[n])\\simeq_{\\mathcal{C}}(e_\\alpha r_\\alpha s)[n]$\") · the finding</summary>\n\nThe repository's ambient-as-subscript\nconvention is about $\\langle-\\rangle_{\\mathcal{C}}$ and $\\operatorname{Map}_{\\mathcal{C}}$, where the\nambient changes the object; an equivalence between two objects of one category does not need\ndisambiguating, and decorating it invites a reader to look for a meaning that is not there. Drop the\nsubscripts or coin them.\n\n</details>\n\n**Flaw 6** [MINOR] — Under the hard cap of 1500 and over the split signal of 1000, so this fails no gate and is a note.\n\n<details><summary>(location: the write-up as a whole, 1230 words) · the finding</summary>\n\nRecording it because the arithmetic is worth seeing: r1 estimated that factoring the old Steps 1–3\ninto an appendix entry would save some 350 words, the factoring happened, and the write-up came down\nby 53 — the Caveats absorbed the rest. That is the right trade for one round, since two of those\nCaveats were r1's own asks. The next reduction available is Caveat 2's $\\mathcal{F}_\\alpha$ route,\nwhich is a finding about where presentability is spent rather than a step of this proof, and whose\nhome is the dated entry in `Q1-L5-z1_history.md`; the proof proper (Steps 1–10) is at roughly 700\nwords and is not the problem.\n\n</details>\n\n---\n\n## Assessment\n\nThe MAJOR is genuinely gone, and gone by the route the pipeline prefers: the missing hypothesis was\nput into the *statement* by `/update` rather than argued around in the write-up, the appendix entry\nthat had dropped it from its source was corrected, and a new entry now carries the three formal\nclauses the old Steps 1–3 re-proved inline. The scoping that the repair turns on — **(C)** consumed\nat exactly one step, and only for $\\mathcal{C}$ — is real and I verified it step by step rather than\ntaking Step 10's word for it; Step 8's self-orthogonality trick is what keeps the $\\mathcal{C}_\\alpha$\nfree of the hypothesis, and it is correct. All four of r1's remaining MINORs were met, and met in the\nsharper form r1 asked for rather than the form that was easiest to write. What is left is six MINORs,\nthree of which (Flaws 2, 3 and half of 1) are against the appendix rather than the draft.\n\n**Not REFUTED.** With **(C)** in place the statement is proved by the write-up, so there is nothing\nto refute; and the doubt r1 recorded — whether clause (ii) survives at general $A$ without\npresentability — is now moot for this node, since the hypothesis is carried rather than hoped for. I\nrepeated r1's search for a cocomplete stable non-presentable witness and, like r1 and like u1, found\nnone; it is a question about the strength of the hypothesis, not about the truth of the statement,\nand it belongs in the history, where u1 has already put it.\n\n**One forward note, not a flaw of this node.** The node requires $S$ to be a *small set*, and Flaws 2\nand 3 show how much rests on that. The instance [Q1-L5](../../index.html) takes for its generators\nthe objects $\\mathcal{F}\\ast\\mathrm{IC}_0$ indexed by $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\nwhich is a category and not a set. Discharging **(A)**–**(C)** there will also mean producing a small\nset — a set of compact generators, presumably — and that obligation is invisible from this node's\nstatement. Worth a line in the instance's own record.\n\nVERDICT: PASS\n";</script>
