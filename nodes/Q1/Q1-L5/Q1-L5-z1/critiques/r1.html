<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L5</a><i>›</i><a href="../index.html">Q1-L5-z1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L5-z1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L5/Q1-L5-z1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nRefereed against [`proof.md`](../proof.html), [`Q1-L5-z1_node.md`](../index.html), the declared\nclosed world ([the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html),\n[`DGCat`, `Vect`](../../../../../appendix/conv-dgcat.html)) and, at page level,\n`papers/GR17vol1.pdf`.\n\n## What was checked and passed\n\n- **Statement diff.** `## Lemma` (proof.md:10–38) reproduces `## Statement`\n  (Q1-L5-z1_node.md:20–48) character for character, including both display blocks and both\n  parentheticals. Nothing strengthened, nothing weakened; see Flaw 5 for the one omission.\n- **Hallucination sweep.** `GR17vol1` is at `refs.bib`:350. Both `objects:` links resolve to files\n  that exist; all six relative links in the draft resolve from its own depth. No `main.tex` `\\label`\n  is cited. No appendix entry outside the declared two is invoked.\n- **Circularity.** `depends-on` is empty and the draft cites no node. Steps 1–3 are proved from\n  scratch rather than imported.\n- **Adjunction handedness.** $e_\\alpha\\dashv r_\\alpha$ throughout: Step 5 takes $r_\\alpha$ exact as a\n  right adjoint, Step 9 uses $\\operatorname{Map}_{\\mathcal{C}_\\alpha}(Y,r_\\alpha M)\\simeq\n  \\operatorname{Map}_{\\mathcal{C}}(e_\\alpha Y,M)$ in the correct direction, Step 6 uses the unit\n  $\\mathrm{id}\\simeq r_\\alpha e_\\alpha$ (the correct one for a fully faithful *left* adjoint). No\n  silent inversion. \"Coreflective\" is the right word: $e_\\alpha$ is the fully faithful inclusion and\n  it has a right adjoint.\n- **Brief item 1 — clause (i) is free of (B).** Confirmed by inspection. Step 4 uses nothing; Step 5\n  uses continuity and exactness of $r_\\alpha$ plus minimality; Step 6 uses the section. Steps 1–3,\n  which Step 5 does not even call on, are also (B)-free. No lemma in the chain smuggles it.\n- **Brief item 4 — where (2) is consumed, and the propagation.** Honest. Step 8 is the only consumer\n  of (2) and the draft says so in its own words (\"$M$ was only assumed orthogonal to the generators\n  $S$, while Step 9 consumes orthogonality to their truncations\"). The propagation is *proved*: Step\n  2 verifies that ${}^{\\perp_{\\mathcal{D}}}M$ is closed under $0$, all small colimits, all shifts and\n  hence fibers, and Step 3 then invokes minimality — it is not asserted. The shift range matches:\n  [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) quantifies\n  over $i\\ge 0$ with $[-i]=\\Omega^i$, which is verbatim GR's Def. 5.4.1 (printed p. 55, \"where $[-i]$\n  denotes the shift functor on $\\mathbf{C}$, i.e., the $i$-fold loop functor $\\Omega^i$\"), and Step 1\n  supplies exactly the missing reconciliation with the $n\\in\\mathbb{Z}$ range that Steps 2 and 9 need.\n  Step 1's homotopy-group argument is correct as written.\n- **Edge cases.** $A=\\varnothing$ forces $\\mathcal{C}\\simeq 0$ through (B) and both clauses hold;\n  $S=\\varnothing$ forces $\\mathcal{C}_\\alpha\\simeq 0$ through (1) and then $\\mathcal{C}\\simeq 0$. No\n  quantifier slip: $M$ is fixed at Step 7 before $\\alpha$ is fixed at Step 9, and Step 10 re-opens\n  $\\alpha$ correctly.\n\n---\n\n**Flaw 1** [MAJOR] — Clause (ii) is established only for **presentable** $\\mathcal{C}$, and the node hypothesises merely\n\"a stable category admitting all small colimits\".\n\n<details><summary>(location: Step 7, \"By the criterion of `def:generation`, applied in $\\mathcal{C}$\nto the small set $S$\", together with the first Caveat) · the finding</summary>\n\nThe draft's Caveat reports the discrepancy\naccurately but then treats it as a matter of a referee's taste (\"A referee declining that\ngenerality\"). It is not taste — the source's proof visibly fails without the hypothesis. Verified on\nthe page:\n\n- Printed p. 51 (PDF p. 88), footnote 8, verbatim: *\"When talking about cocomplete categories we will\n  always assume that they are presentable.\"* Attached to §5.1.5, which is where GR define \"cocomplete\n  stable category\". So GR's \"cocomplete stable\" **means** \"presentable stable\", and §5.4.1 opens \"Let\n  $\\mathbf{C}$ be an object of $1\\text{-Cat}^{\\mathrm{St,cocmpl}}$\".\n- Printed p. 55 (PDF p. 92), the proof of Prop. 5.4.5, second sentence: *\"The inclusion\n  $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ admits an (a priori non-continuous) right adjoint.\"* This is\n  an appeal to the Adjoint Functor Theorem, GR's own Thm. 2.5.4(a), whose footnote 3 (printed p. 32)\n  says presentability *\"is necessary for the Adjoint Functor Theorem to hold\"*. Presentability is\n  therefore load-bearing in the cited proof, not a convention that could be dropped.\n\nSo the direction Step 7 uses — orthogonality $\\Rightarrow$ generation — is not available at the\nnode's stated generality from the source the entry names. The write-up uses the entry exactly as the\nentry is written, so the primary defect is **in the appendix entry**, which drops its source's\nstanding hypothesis; but the consequence lands on this node, because clause (ii) as stated is then\nunproved. The remedy is small and should be taken in both places: `/update` on\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) to record\nGR's convention, and one word (\"presentable\") in the node's hypothesis on $\\mathcal{C}$. Steps 1–6\nand 8–10 survive that edit verbatim.\n\nTwo further remarks on the same entry, neither of which the draft mis-uses. (a) The display the\nentry attributes to Prop. 5.4.5 is verbatim GR's **Definition 5.4.1**; Prop. 5.4.5 is the *bridge*\nbetween that definition and the \"smallest cocomplete stable subcategory\" description. The\nbiconditional the entry asserts is genuinely Prop. 5.4.5, so the attribution is substantively right\nand one number off. (b) The entry's display drops GR's \"$\\forall\\alpha$\" from the hypothesis; Step 7\nrestores it correctly (\"for all $s\\in S$ and all $i\\ge 0$\"), so nothing is lost here.\n\n</details>\n\n**Flaw 2** [MINOR] — The draft reads \"cocomplete stable subcategory\" in two incompatible senses in the same proof.\n\n<details><summary>(location: Step 2 heading \"${}^{\\perp_{\\mathcal{D}}}M$ is a cocomplete stable\nsubcategory of $\\mathcal{D}$\", read against Step 7) · the finding</summary>\n\nAt\nSteps 2, 3 and 5 it means \"full, closed under shifts and under small colimits formed in\n$\\mathcal{D}$\" — the naive sense — because that is all it verifies of ${}^{\\perp_{\\mathcal{D}}}M$ and\nof $\\mathcal{E}_\\alpha$ before appealing to minimality. At Step 7 it needs the criterion, which is\ntrue in GR's sense. Under the repair proposed in Flaw 1 this becomes live: if\n[the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) is read\nGR-style, then $\\langle T\\rangle_{\\mathcal{D}}$ is minimal among *presentable* stable subcategories,\nand Steps 3 and 5 need one extra sentence — that $\\langle T\\rangle_{\\mathcal{D}}$ for small $T$ is\nalso the closure of $T$ under shifts, cofibers and small colimits, hence sits inside any\ncolimit-closed stable subcategory containing $T$ whether or not that subcategory is presentable. The\nsentence is true and cheap, but the draft's proposed one-word repair does not by itself say which\nreading the entry carries, and the answer changes what Steps 3 and 5 owe.\n\n</details>\n\n**Flaw 3** [MINOR] — The observation is correct — I confirm continuity of $e_\\alpha$ is nowhere consumed — but it is the\nweaker of the two available statements and, as phrased, invites the wrong edit.\n\n<details><summary>(location: second Caveat, \"Continuity of $e_\\alpha$ is never used: Step 9 needs\nonly that $e_\\alpha$ is a left adjoint, which already makes it exact.\") · the finding</summary>\n\nThe sharp statement\nis that the word **\"continuous\" on $e_\\alpha$ in (A) is redundant, not merely unused**: a left\nadjoint preserves every colimit that exists, and both categories are cocomplete, so $e_\\alpha$ is\ncontinuous automatically. That is what `/update` should act on, and it is a defect in the statement\nworth flagging.\n\nDeleting the *property* would be premature, though, and the Caveat as written does not distinguish\nthe two. There is a presentability-free route to a large part of clause (ii) that does consume it:\nsetting $\\mathcal{F}_\\alpha:=\\{Y\\in\\mathcal{C}_\\alpha\\mid e_\\alpha Y\\in\\langle S\\rangle_{\\mathcal{C}}\\}$,\nexactness and continuity of $e_\\alpha$ make $\\mathcal{F}_\\alpha$ a cocomplete stable subcategory of\n$\\mathcal{C}_\\alpha$, condition (2) puts $r_\\alpha S$ in it, and condition (1) then gives\n$\\mathcal{F}_\\alpha=\\mathcal{C}_\\alpha$, i.e.\n\n$$\ne_\\alpha r_\\alpha M \\in \\langle S\\rangle_{\\mathcal{C}}\\quad\\text{for every } M\\in\\mathcal{C}\n\\text{ and every }\\alpha\\in A ,\n$$\n\nwith no criterion and no presentability anywhere. What is missing from *that* route is the dévissage\nassembling $M$ from the $e_\\alpha r_\\alpha M$, which joint conservativity alone does not supply — and\nthat is precisely why Step 7 reaches for the criterion. Recording this in the node's history would\ntell a later prover where the presentability is really being spent.\n\n</details>\n\n**Flaw 4** [MINOR] — The audit is not accurate. Step 5 also consumes **exactness** of $r_\\alpha$, and the draft derives\nthat exactness at Step 5 from \"being a right adjoint it preserves finite limits\" — i.e. from the\nadjunction, which the audit assigns to Step 9 alone.\n\n<details><summary>(location: Step 11, \"Continuity of $r_\\alpha$ was used at Step 5 and the\nadjunction of **(A)** at Step 9\") · the finding</summary>\n\nAs written the audit therefore contradicts the\nstatement's own clause-(i) parenthetical, which claims clause (i) uses \"only continuity of each\n$r_\\alpha$ and the section of **(A)**\".\n\nThe parenthetical is in fact defensible, by a cheaper route the draft passes over: $r_\\alpha$ is\ncontinuous, hence preserves finite colimits, hence is exact, no adjunction required. Substituting\nthat one clause into Step 5 makes the statement's accounting literally true and repairs the audit.\nNothing mathematical is at stake — both routes give exactness — but a clause of the statement that\nthe node is certifying should not be contradicted by the node's own audit paragraph.\n\n</details>\n\n**Flaw 5** [MINOR] — The `## Lemma` omits the node's closing `**Scope.**` paragraph (Q1-L5-z1_node.md:50).\n\n<details><summary>(location: `## Lemma`, proof.md:38, end) · the finding</summary>\n\nThe paragraph\ndeclares no hypothesis and no conclusion — it says that no geometry enters (A), (B), (1), (2) or\n(i)–(ii) — so nothing is strengthened or weakened by the omission, and this is not a restatement\ndefect. It is still a diff against a statement the write-up is required to reproduce, and it is the\none paragraph that tells a reader why the hypotheses are stated abstractly.\n\n</details>\n\n**Flaw 6** [MINOR] — The draft names as \"right-orthogonality\" a membership in ${}^{\\perp_{\\mathcal{D}}}M$, which the\nleft-superscript notation coined in Step 1 makes the *left* orthogonal of $M$.\n\n<details><summary>(location: Step 3 heading, \"right-orthogonality propagates\"; Step 9, \"$r_\\alpha M$\nis right-orthogonal to itself\") · the finding</summary>\n\nThe intended reading\n($M$ is right-orthogonal to $X$) is recoverable and used consistently, and no step depends on the\nname, but \"right-orthogonal\" is never defined and the notation points the other way. One clause in\nthe `notation:` line fixes it.\n\n</details>\n\n---\n\n## Assessment\n\nThe mathematics of Steps 1–6 and 8–10 is correct and, for a formal dévissage, unusually careful:\nStep 1 is exactly the shift-range reconciliation that this kind of argument usually leaves implicit,\nStep 2 verifies rather than asserts, and Step 9's trick of concluding $r_\\alpha M\\simeq 0$ from\n$\\mathcal{C}_\\alpha={}^{\\perp_{\\mathcal{C}_\\alpha}}(r_\\alpha M)$ by self-orthogonality at $n=0$\navoids invoking the criterion a second time in $\\mathcal{C}_\\alpha$ — so only $\\mathcal{C}$, not the\n$\\mathcal{C}_\\alpha$, ever needs the hypothesis of Flaw 1. The Caveats section is honest and its\nfirst entry is exactly right about the source; the failure is that the draft treats a genuine\nhypothesis gap as a stylistic preference and proceeds, which under this pipeline's own rule is a\nMAJOR and a FAIL.\n\n**Not REFUTED, and deliberately so.** I looked for a cocomplete stable non-presentable $\\mathcal{C}$\ncarrying data (A), (B), (1), (2) with $\\langle S\\rangle_{\\mathcal{C}}\\neq\\mathcal{C}$ and could not\nproduce one; and there is positive evidence against falsity, namely that for $A$ a singleton the\nstatement is provable with no presentability at all. In that case the triangle identity makes\n$r\\epsilon_M$ an equivalence, exactness of $r$ gives $r\\,\\mathrm{cofib}(\\epsilon_M)\\simeq 0$, (B)\ngives $\\mathrm{cofib}(\\epsilon_M)\\simeq 0$, so $e$ is essentially surjective and hence an\nequivalence; then (1) gives $\\langle e r S\\rangle_{\\mathcal{C}}=\\mathcal{C}$ and (2) with minimality\ngives $\\mathcal{C}\\subseteq\\langle S\\rangle_{\\mathcal{C}}$. So the statement is not false in\nsubstance; what is wrong is that the *argument* for general $A$ needs a hypothesis the statement does\nnot carry. Suspicion of falsity at large $A$ is not refutation, and I record it as doubt rather than\nas a verdict.\n\n**On the 1283 words.** Not a flaw and not a second claim. Steps 1–3 are a self-contained lemma about\nright-orthogonals in a cocomplete stable category — invariance under shift, closure of\n${}^{\\perp}M$, propagation to the generated subcategory — that has nothing to do with coreflective\nfamilies and will be re-proved by every node that runs this pattern. That is precisely the second\nremedy of the two-budget rule: an appendix entry for \"${}^{\\perp_{\\mathcal{C}}}M$ is a cocomplete\nstable subcategory and contains $\\langle T\\rangle_{\\mathcal{C}}$ whenever it contains $T$\" would cut\nroughly 350 words here and shorten every future write-up that restates it. Splitting the node would\nnot.\n\nVERDICT: FAIL\n";</script>
