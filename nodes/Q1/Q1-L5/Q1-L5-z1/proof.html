<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-z1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-z1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-z1 — Dévissage for a coreflective family: generation is stratumwise generation plus support-cutting\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../../appendix/left-orthogonal-closure.html), [`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html). The `depends-on` list is empty and no assumed dependency is used.\n- **notation:** \"continuous\" means \"preserves small colimits\", and ${}^{\\perp_{\\mathcal{D}}}M$ is the **left** orthogonal of $M$ fixed in [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../../appendix/left-orthogonal-closure.html), membership of $X$ saying that $X$ maps trivially *into* $M$ in every degree.\n\n## Lemma\n\nLet $\\mathcal{C}$ be a stable category admitting all small colimits, let $A$ be a set, and for each $\\alpha\\in A$ let $\\mathcal{C}_\\alpha$ be a stable category admitting all small colimits. Let $S$ be a small set of objects of $\\mathcal{C}$, and write $\\langle S\\rangle_{\\mathcal{C}}$ for the subcategory generated in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html). Assume:\n\n**(A) A coreflective family.** For every $\\alpha\\in A$ a continuous functor $r_\\alpha\\colon\\mathcal{C}\\rightarrow\\mathcal{C}_\\alpha$ is given, admitting a fully faithful continuous left adjoint $e_\\alpha\\colon\\mathcal{C}_\\alpha\\rightarrow\\mathcal{C}$, so that the unit is an equivalence\n\n$$\n\\mathrm{id}_{\\mathcal{C}_\\alpha}\\ \\simeq\\ r_\\alpha\\, e_\\alpha .\n$$\n\n**(B) Joint conservativity.** If $M\\in\\mathcal{C}$ satisfies $r_\\alpha M\\simeq 0$ for every $\\alpha\\in A$, then $M\\simeq 0$. This hypothesis is used in clause (ii) alone.\n\n**(C) Presentability of the ambient.** $\\mathcal{C}$ is presentable. This hypothesis is used in clause (ii) alone, and only for $\\mathcal{C}$: no $\\mathcal{C}_\\alpha$ is required to be presentable.\n\nConsider the two conditions:\n\n1. *(stratumwise generation)* for every $\\alpha\\in A$,\n\n   $$\n   \\left\\langle\\, r_\\alpha s \\ \\middle|\\ s\\in S \\,\\right\\rangle_{\\mathcal{C}_\\alpha}\\ =\\ \\mathcal{C}_\\alpha ;\n   $$\n\n2. *(support-cutting)* for every $\\alpha\\in A$ and every $s\\in S$,\n\n   $$\n   e_\\alpha\\, r_\\alpha\\, s\\ \\in\\ \\langle S\\rangle_{\\mathcal{C}} .\n   $$\n\nThen:\n\n(i) *(forward)* if $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$, then (1) and (2) hold — using only continuity of each $r_\\alpha$ and the section of **(A)**, and not **(B)**;\n\n(ii) *(backward)* under **(B)** and **(C)**, conditions (1) and (2) together imply $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$.\n\n*The node's closing* **Scope.** *paragraph is deliberately omitted: it declares no hypothesis and no conclusion.*\n\n## Proof\n\nFor $\\alpha\\in A$ abbreviate the left-hand side of condition (1) as\n\n$$\n\\langle r_\\alpha S\\rangle_{\\mathcal{C}_\\alpha}\\ :=\\ \\left\\langle\\, r_\\alpha s \\ \\middle|\\ s\\in S \\,\\right\\rangle_{\\mathcal{C}_\\alpha} .\n$$\n\n**Step 1 — clause (i), condition (2).**\n\n<details><summary>the argument</summary>\n\nAssume $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$. For $\\alpha\\in A$ and $s\\in S$ the object $e_\\alpha r_\\alpha s$ lies in $\\mathcal{C}$, hence in $\\langle S\\rangle_{\\mathcal{C}}$, which is (2).\n\n</details>\n\n**Step 2 — each $r_\\alpha$ is exact, by continuity alone.**\n\n<details><summary>the argument</summary>\n\nBy **(A)** it preserves small colimits, hence finite ones. A functor between stable categories preserving finite colimits preserves finite limits too, since there a square is a pushout exactly when it is a pullback. So $r_\\alpha$ is exact, with no appeal to the adjunction.\n\n</details>\n\n**Step 3 — $r_\\alpha$ carries $\\langle S\\rangle_{\\mathcal{C}}$ into $\\langle r_\\alpha S\\rangle_{\\mathcal{C}_\\alpha}$.**\n\n<details><summary>the argument</summary>\n\nFix $\\alpha\\in A$ and set\n\n$$\n\\mathcal{E}_\\alpha\\ :=\\ \\left\\{X\\in\\mathcal{C}\\ \\middle|\\ r_\\alpha X\\in\\langle r_\\alpha S\\rangle_{\\mathcal{C}_\\alpha}\\right\\} .\n$$\n\nBy [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) the target $\\langle r_\\alpha S\\rangle_{\\mathcal{C}_\\alpha}$ is a cocomplete stable subcategory of $\\mathcal{C}_\\alpha$. Since $r_\\alpha$ is continuous by **(A)** and exact by Step 2, its preimage $\\mathcal{E}_\\alpha$ is a full subcategory of $\\mathcal{C}$ closed under shifts, fibers, cofibers and small colimits, and it contains $S$. Minimality — the half of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) that carries no hypothesis — gives $\\langle S\\rangle_{\\mathcal{C}}\\subseteq\\mathcal{E}_\\alpha$.\n\n</details>\n\n**Step 4 — clause (i), condition (1).**\n\n<details><summary>the argument</summary>\n\nAssume $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$, so Step 3 gives $\\mathcal{E}_\\alpha = \\mathcal{C}$. For $Y\\in\\mathcal{C}_\\alpha$ take $X = e_\\alpha Y$: then $r_\\alpha e_\\alpha Y\\in\\langle r_\\alpha S\\rangle_{\\mathcal{C}_\\alpha}$, while the unit equivalence of **(A)** gives $Y\\simeq_{\\mathcal{C}_\\alpha} r_\\alpha e_\\alpha Y$. The target is closed under equivalence, so $Y$ lies in it. With Step 1 this proves (i).\n\n</details>\n\n**Step 5 — clause (ii) reduces to a vanishing statement.**\n\n<details><summary>the argument</summary>\n\nAssume (1) and (2). By **(C)** the ambient $\\mathcal{C}$ is presentable, so the orthogonality criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is available in $\\mathcal{C}$ in the direction *orthogonality $\\Rightarrow$ generation* — the one direction that entry charges for. Applied to the small set $S$ it gives $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$ as soon as every $M\\in\\mathcal{C}$ with $\\operatorname{Map}_{\\mathcal{C}}(s[-i],M) = 0$ for all $s\\in S$ and all $i\\ge 0$ vanishes. Clause (1) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../../appendix/left-orthogonal-closure.html), at $\\mathcal{D}=\\mathcal{C}$ — stable with all small colimits by hypothesis — reads that condition as $S\\subseteq{}^{\\perp_{\\mathcal{C}}}M$. Fix such an $M$.\n\n</details>\n\n**Step 6 — condition (2) puts each $e_\\alpha r_\\alpha s$ in ${}^{\\perp_{\\mathcal{C}}}M$.**\n\n<details><summary>the argument</summary>\n\nClause (3) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../../appendix/left-orthogonal-closure.html), at $\\mathcal{D}=\\mathcal{C}$ with $T=S$, a set by hypothesis, turns $S\\subseteq{}^{\\perp_{\\mathcal{C}}}M$ into $\\langle S\\rangle_{\\mathcal{C}}\\subseteq{}^{\\perp_{\\mathcal{C}}}M$; and condition (2) places $e_\\alpha r_\\alpha s$ in $\\langle S\\rangle_{\\mathcal{C}}$ for all $\\alpha$ and $s$. This is the bridge the reduction needs, $M$ having been assumed orthogonal to the generators alone.\n\n</details>\n\n**Step 7 — every $r_\\alpha s$ lies in ${}^{\\perp_{\\mathcal{C}_\\alpha}}(r_\\alpha M)$.**\n\n<details><summary>the argument</summary>\n\nFix $\\alpha\\in A$. A left adjoint between stable categories preserves finite colimits and is therefore exact, so $e_\\alpha(r_\\alpha s[n])\\simeq_{\\mathcal{C}}(e_\\alpha r_\\alpha s)[n]$, and the adjunction of **(A)** — $e_\\alpha$ left adjoint, $r_\\alpha$ right adjoint — gives for $s\\in S$ and $n\\in\\mathbb{Z}$\n\n$$\n\\operatorname{Map}_{\\mathcal{C}_\\alpha}\\!\\left(r_\\alpha s[n],\\, r_\\alpha M\\right)\\ \\simeq\\ \\operatorname{Map}_{\\mathcal{C}}\\!\\left(e_\\alpha\\!\\left(r_\\alpha s[n]\\right),\\, M\\right)\\ \\simeq\\ \\operatorname{Map}_{\\mathcal{C}}\\!\\left(\\left(e_\\alpha r_\\alpha s\\right)[n],\\, M\\right)\\ =\\ 0 ,\n$$\n\nthe last equality by Step 6. Over all $n\\in\\mathbb{Z}$, that is the asserted membership.\n\n</details>\n\n**Step 8 — condition (1) forces $r_\\alpha M\\simeq 0$.**\n\n<details><summary>the argument</summary>\n\nThe collection $\\{r_\\alpha s\\}_{s\\in S}$ is a set, being the image of one, and $\\mathcal{C}_\\alpha$ is stable with all small colimits; so clause (3) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../../appendix/left-orthogonal-closure.html) applies at $\\mathcal{D}=\\mathcal{C}_\\alpha$ with $T=\\{r_\\alpha s\\}_{s\\in S}$ and test object $r_\\alpha M$, upgrading Step 7 to $\\langle r_\\alpha S\\rangle_{\\mathcal{C}_\\alpha}\\subseteq{}^{\\perp_{\\mathcal{C}_\\alpha}}(r_\\alpha M)$. Condition (1) makes the left side $\\mathcal{C}_\\alpha$, so $r_\\alpha M$ lies in its own left orthogonal; at $n=0$ that makes $\\mathrm{id}_{r_\\alpha M}$ null, whence $r_\\alpha M\\simeq 0$.\n\n</details>\n\n**Step 9 — hypothesis (B) concludes clause (ii).**\n\n<details><summary>the argument</summary>\n\nStep 8 holds for every $\\alpha\\in A$, so **(B)** gives $M\\simeq 0$. By Step 5 this proves $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$, which is (ii). $\\square$\n\n</details>\n\n**Step 10 — the clause-(i) parenthetical is exact as stated.**\n\n<details><summary>the argument</summary>\n\nSteps 1–4 prove (i), and consume only continuity of $r_\\alpha$, which by itself yields the exactness Step 3 needs (Step 2); the hypothesis-free minimality half of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) (Step 3); and the section of **(A)** (Step 4). Neither **(B)**, used at Step 9 alone, nor **(C)**, used at Step 5 alone, enters. This node's `depends-on` list is empty and no assumed dependency was used above.\n\n</details>\n\n## Caveats\n\n**\"Continuous\" on $e_\\alpha$ in (A) is redundant, not merely unused.** A left adjoint preserves every colimit that exists, and both categories admit all small colimits, so continuity of $e_\\alpha$ follows from the rest of **(A)**. The redundancy is in the wording of the hypothesis; the property itself is consumed by the route below and should not go with the word.\n\n**Where (C) is spent, and how far one gets without it.** Step 5 alone charges for presentability, and only in $\\mathcal{C}$: Step 8 concludes from self-orthogonality rather than invoking the criterion a second time, so no $\\mathcal{C}_\\alpha$ needs it. Part of clause (ii) is free of it. Put\n\n$$\n\\mathcal{F}_\\alpha\\ :=\\ \\left\\{Y\\in\\mathcal{C}_\\alpha\\ \\middle|\\ e_\\alpha Y\\in\\langle S\\rangle_{\\mathcal{C}}\\right\\} ;\n$$\n\nexactness and continuity of $e_\\alpha$ make $\\mathcal{F}_\\alpha$ a cocomplete stable subcategory of $\\mathcal{C}_\\alpha$, condition (2) puts every $r_\\alpha s$ in it, and condition (1) with minimality gives $\\mathcal{F}_\\alpha = \\mathcal{C}_\\alpha$ — that is, $e_\\alpha r_\\alpha M\\in\\langle S\\rangle_{\\mathcal{C}}$ for every $M\\in\\mathcal{C}$ and $\\alpha\\in A$, with no criterion and no presentability. What the route lacks is the dévissage assembling $M$ from the $e_\\alpha r_\\alpha M$, which **(B)** does not supply; that is why Step 5 reaches for the criterion.\n\n**Discharging (C).** In the intended instances $\\mathcal{C}$ is an object of [$\\mathrm{DGCat}$](../../../../appendix/conv-dgcat.html), built inside $\\mathrm{Pr}^L$, hence presentable, so **(C)** is discharged by naming the ambient.\n";</script>
