<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-z1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-z1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L5-z1 — history\n\n[Q1-L5-z1](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created**: cut at the user's direction as the first node of the *second* abstraction axis. The user's reading was that the nodes under [Q1-L6](../../Q1-L6/index.html) and [Q1-L3](../../Q1-L3/index.html) are formal consequences of stratified spaces. Testing that against the statements showed it half right, and the correction is what this node records: the formal content of [Q1-L5-L1](../Q1-L5-L1/index.html) and [Q1-L5-L2](../Q1-L5-L2/index.html) is **weaker than a stratification**. Neither uses a space, a topology or a closure order; both use only a family of continuous functors admitting fully faithful continuous left adjoints, and — for the backward direction alone — joint conservativity of that family. A stratification is one supplier of such a family, not the content of the claim.\n\n- **2026-08-06 — the node's own source is Q1-L5's \"Moreover\" paragraph**: the split this node formalizes is already written down at level 0. [Q1-L5](../index.html) states that the forward direction \"uses only the continuity of each $i_\\lambda^!$ and the section $i_\\lambda^!\\, i_{\\lambda!}\\simeq\\mathrm{id}$\", and that what the backward direction needs of **(H2)** and **(H3)** is joint conservativity of the global family, which they *supply*. Clauses (i) and (ii) here are that sentence with the geometry deleted, which is why the abstraction was available without any new mathematics: it was latent in a hypothesis-accounting remark the node had already made about itself.\n\n- **2026-08-06 — the edge is `instances`, not `depends-on`**: [Q1-L5-L1](../Q1-L5-L1/index.html) and [Q1-L5-L2](../Q1-L5-L2/index.html) are both **proved**, by routes that do not pass through this node, and [Q1-L5](../index.html) is open on other grounds. Recording the relation as a dependency would, under [ADR 0014](../../../../process/decisions/0014-confidence-is-three-signed-channels.html), have capped two proved nodes at this open one's confidence — driving a number down for stating a fact about their generality. Per [ADR 0061](../../../../process/decisions/0061-the-z-axis-is-abstraction-level.html) the fact lives on the general node, has no transpose, and is never followed by the confidence derivation.\n\n- **2026-08-06 — what the abstraction is for**: (H2) and (H3) of [Q1-L5](../index.html) exist only to produce joint conservativity, which is hypothesis **(B)** here. Separating them says that the ind-scheme presentation and the per-closure conservativity are *one* obligation and not two, and that the obligation is discharged the moment any jointly conservative family is exhibited — by whatever means. That is the reusable half. The half it does not touch is that the family exists at all, which is [Q1-L5-L3](../Q1-L5-L3/index.html) and [Q1-L5-L4](../Q1-L5-L4/index.html), and [Q1-L5-L3](../Q1-L5-L3/index.html) is **failing**.\n- **2026-08-06 — first refereed, `FAIL` at [r1](critiques/r1.html), on a defect in the appendix and not in the write-up.** `/prove Q1-L5-z1`, round 1; the draft is [proof.md](proof.html), 1275/1500 words, past the 1000-word split signal and inside the cap. Clause (i) is two closure arguments, clause (ii) the $\\perp$-reduction, the bridge where condition (2) is consumed, the adjunction with (1), and joint conservativity last. No assumed dependency was used: `depends-on` is empty.\n\n  **The MAJOR, and why it reaches past this node.** Clause (ii) rests on the orthogonality criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), and the entry states that criterion without the hypothesis its source's proof consumes. The referee checked the pages: `papers/GR17vol1.pdf` printed p. 51 carries footnote 8 verbatim — \"*When talking about cocomplete categories we will always assume that they are presentable*\" — and the proof of Prop. 5.4.5 (printed p. 55) opens by producing a right adjoint to the inclusion, which is the Adjoint Functor Theorem, whose own footnote 3 (printed p. 32) says presentability \"*is necessary for the Adjoint Functor Theorem to hold*\". So presentability is load-bearing where the entry is silent. The primary defect is the entry's; the consequence lands here because this node hypothesises only *stable and admitting all small colimits*.\n\n  **What that means for the rest of the repository, which is the reason this is recorded here rather than only in the critique.** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) is invoked by roughly thirty nodes across all three questions, and any of them using the $\\perp$-form inherits the same silence. [Q1-L2-z1](../../Q1-L2/Q1-L2-z1/index.html), refereed the same day, does **not** inherit it: its hypothesis **(A)** gives $\\mathcal{C}\\simeq\\mathrm{Ind}\\left(\\mathcal{C}^{\\omega}\\right)$ with $\\mathcal{C}^{\\omega}$ small, which is presentability. The distinction is exactly which nodes assume compact generation and which assume only cocompleteness, and nothing in the repository currently draws it.\n\n  **Not refuted, and the referee said why.** For $A$ a singleton the statement is provable with no presentability at all — the triangle identity together with **(B)** makes $e$ an equivalence — so the defect is a missing hypothesis and not a false claim. The remedy the round names is one word in this node's hypotheses and an `/update` on the entry; Steps 1–6 and 8–10 survive verbatim, so nothing here is wasted.\n\n  **Three MINORs worth acting on.** Continuity of $e_\\alpha$ in **(A)** is not merely unused but *redundant*, a left adjoint preserving all colimits — though the referee warns against deleting it, since a presentability-free route through $\\mathcal{F}_\\alpha := \\left\\{Y \\mid e_\\alpha Y\\in\\langle S\\rangle_{\\mathcal{C}}\\right\\}$ consumes it and would localize where the presentability is really being spent. Step 11's audit contradicts the statement's own clause-(i) parenthetical, repairable by deriving exactness of $r_\\alpha$ from continuity rather than from the adjunction. And two readings of \"cocomplete stable subcategory\" are in play at once, which becomes live under the proposed repair.\n\n- **2026-08-07 — the presentability clause (ii) was already spending becomes a hypothesis.** `/update Q1-L5-z1`, at the user's direction, as part of clearing the red layer. The record is [u1](updates/u1.html); the lead was this node's own [r1](critiques/r1.html), verdict `FAIL`, Flaw 1 at MAJOR, and its page citations were re-opened against `papers/GR17vol1.pdf` rather than adopted from the critique's paraphrase.\n\n  **The defect.** Clause (ii) is proved through the orthogonality criterion of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), and that criterion holds only for presentable $\\mathcal{C}$, while the statement hypothesised merely a stable category admitting all small colimits. `GR17vol1` p. 51 fn. 8 makes GR's \"cocomplete stable\" *mean* \"presentable stable\", and the proof of Prop. 5.4.5 on p. 55 spends the hypothesis on the Adjoint Functor Theorem, whose own p. 32 fn. 3 records that presentability is necessary for it.\n\n  **What replaced it.** A third labelled hypothesis, **(C) Presentability of the ambient**, carrying the sentence \"used in clause (ii) alone, and only for $\\mathcal{C}$\"; clause (ii) now reads \"under **(B)** and **(C)**\". Nothing else moved: the preamble, **(A)**, **(B)**, conditions (1) and (2) and clause (i) are untouched, and Steps 1–6 and 8–10 of the existing write-up survive verbatim.\n\n  **Why a labelled hypothesis and not a word in the preamble.** The node already accounts hypothesis by clause — **(B)** says \"used in clause (ii) alone\" and clause (i) advertises that it does not use it — so presentability in the preamble would have been the one hypothesis whose scope a reader could not see, and an instance discharging clause (i) alone would have had to check it for nothing. Step 9 concludes $r_\\alpha M\\simeq 0$ by self-orthogonality rather than by invoking the criterion inside $\\mathcal{C}_\\alpha$, which is why no member category needs it either.\n\n  **The statement was never false.** For $A$ a singleton the conclusion holds with no presentability at all, by the triangle identity and **(B)**; the defect was in what the argument for general $A$ was entitled to. No counterexample at general $A$ was found by the critic or by this run, so the hypothesis is added rather than argued away.\n\n  **The primary defect is in the appendix, and was commissioned out.** The write-up uses [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) exactly as the entry is written; it is the entry that drops its source's standing hypothesis. Correcting it — and adding a separate entry for the right-orthogonal closure lemma that Steps 1–3 re-prove inline, worth roughly 350 words here and in every future write-up running the same pattern — went to the lead-researcher in this run, the appendix being no other operator's to edit.\n\n  **One simplification deferred, not rejected.** [r1](critiques/r1.html) Flaw 3 shows the word \"continuous\" on $e_\\alpha$ in **(A)** is *redundant*, a left adjoint preserving every colimit that exists between cocomplete categories. Hypothesis **(A)** is cited by link from [Q1-L6-z1](../../Q1-L6/Q1-L6-z1/index.html), which passed its r1 today and reads the continuity off it, so the two edits belong in one pass and are booked into this run's simplification stage.\n\n- **2026-08-07 — PASS at r2, on the strength of the statement repair rather than a better argument.** `/prove Q1-L5-z1`, one round, written as [r2](critiques/r2.html); the draft is [proof.md](proof.html), 1230/1500 words, down from 1283 despite absorbing four MINOR repairs. Steps 1–3 were deleted outright and replaced by citations to [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../../appendix/left-orthogonal-closure.html), the entry commissioned for exactly that in the same run.\n\n  **What the referee checked rather than accepted.** That **(C)** is consumed at Step 5 and nowhere else, so no $\\mathcal{C}_\\alpha$ is asked for presentability — Step 8 concludes $r_\\alpha M\\in{}^{\\perp_{\\mathcal{C}_\\alpha}}(r_\\alpha M)$ by self-orthogonality at $n=0$, which is what keeps the member categories free of it. That both instantiations of the new entry discharge its hypotheses and both sets are genuinely sets. And that `GR17vol1` p. 55 spends the Adjoint Functor Theorem on $\\iota^R$, hence on *orthogonality $\\Rightarrow$ generation*, which is the direction Step 5 pays for.\n\n  **Three MINORs against the appendix, not this draft, and worth carrying forward.** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html)'s criterion carries no **smallness** hypothesis on $\\{c_\\alpha\\}$ although its source's proof needs one. Its hypothesis-free minimality is one sentence away from GR's presentable-minimality, the two agreeing here only because $\\mathcal{C}$ is presentable and $S$ is small. And \"continuous\" is pinned nowhere in the closed world despite being a word of this node's own **(A)** — `GR17vol1` §5.1.6 uses it for *exact* functors preserving *filtered* colimits, a reading under which the statement still holds but Step 2 changes character. None is mis-used here; each is a trap a later node could walk into.\n- **2026-08-07 — examined and unchanged; the reported drift was the gate's, not this node's.** The render gate listed this write-up among those stating a different lemma from their node. It does not: all nineteen paragraphs of the `## Statement` are reproduced, and the twentieth line of the `## Lemma` is the write-up's own disclosure that the node's closing `**Scope.**` paragraph is deliberately omitted because it declares no hypothesis and no conclusion. The comparison skipped a line *starting* with `**Scope`, which the node's paragraph does and the disclosure does not. Both `tools/check_render.py` and `tools/build_dag_site.py` now skip any line mentioning it, and this node reports clean. Nothing here was edited.\n";</script>
