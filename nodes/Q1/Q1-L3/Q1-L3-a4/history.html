ws the connected-stabilizer hypothesis of the standing class [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) load-bearing for the hoped-for equality of Q1. It is loose in that item 1 is a non-split pair over a finite residue field, item 2's splitting mode is absent over algebraically closed residue fields, and only mechanism 3 — disconnectedness — survives base change to $\\mathbb{C}((t))$, which is exactly why the standing class excludes it; item 3 is a constructed witness, not a published one, and item 1 does not contradict [Q1-L3](../index.html), which asserts necessity of saturation, not saturation itself. Sources: Aizenbud–Sayag, arXiv:1709.08214, Thm A and Rem. 1.0.1 (no `refs.bib` key); Hironaka, *Spherical functions and local densities on Hermitian forms*, J. Math. Soc. Japan 51 (1999) 553–581 (no key); Sakellaridis, Algebra & Number Theory 6 (2012), arXiv:0905.4245, Rem. 2.3.9 (no key); pointer at Sakellaridis–Venkatesh, Astérisque 396 (2017), §16.3, p. 243 (`refs.bib`: `SV17`).\n- **2026-08-04 — statement renotated** by `/update` ([u1](updates/u1.html), notation audit): the equal-characteristic toy in clause 3 wrote its ring $\\mathfrak{o} = k[[t]]$ and now writes the blueprint's $\\mathcal{O}$ ([ring of integers](../../../../appendix/conv-ring-of-integers.html)); clause 2's $\\mathfrak{o}_F$ is Sakellaridis's own symbol and is now declared as such. No mathematical content changed.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): three failures of saturation, all outside the standing class. Re-read: clause 3's toy witness is a valuation computation and stands.\n- **2026-08-05 — notation normalised, no claim changed** by `/update Q1`. Group names were written bare ($GL_n$, $SO_n$, …) against `\\mathrm{}` everywhere else in the repository, and several titles carried plain-text math — Unicode `×`, `∖` and in one case a Unicode minus — where every other title uses KaTeX. Both are now uniform across the tree. Typography only: no symbol denotes anything different and no claim moved.\n";</script>
