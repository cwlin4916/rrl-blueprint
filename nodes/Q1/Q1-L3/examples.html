<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L3\n\n[node](index.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [papers](../../../papers/guideline.html)\n\nRun of **2026-08-08**, superseding the pass of 2026-08-04. That pass weighed a four-piece\nstatement; [u3](updates/u3.html) added the declared hypothesis **(C)** and restricted clause (ii)\nto a sub-range, so every match below is re-stated against the current piece list and every\ncarried-forward identifier re-checked.\n\nThis file is outside the closed world: no proof, node or appendix entry may cite it.\n\n## The pieces of the statement\n\n- **(S)** the construction of $LX^{\\mathrm{sat}}$: the union over $\\mu\\in\\Lambda^+$ of the images on geometric points of the ind-proper $m_\\mu$; a $K$-stable subset of $|LX|$, no scheme structure, not claimed closed.\n- **(A)** coherent $=$ compact inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n- **(B)** $\\mathcal{S}_F$ closed under all small colimits — after the second assumption, $\\mathcal{S}_F=\\ker(j_F^!)$ with $j_F^!$ continuous; vanishing local on $LX$ and surviving the $K$-quotient.\n- **(C1)** finite presentation of $\\overline{\\imath}_\\lambda\\colon\\overline{LX}_\\lambda\\to LX$ on some $\\Lambda'\\subseteq\\Lambda_X^+$.\n- **(C2)** *that the same sub-range exhausts:* $\\bigcup_{\\lambda\\in\\Lambda'}|\\overline{LX}_\\lambda|=|LX|$.\n- **(i)** the support bound $|\\operatorname{supp}\\mathcal{G}|\\subseteq LX^{\\mathrm{sat}}$ for $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$.\n- **(ii)** the orbit-closure witness $\\overline{i}_{\\lambda,*}\\,\\omega$ nonzero, coherent, support exactly $\\overline{LX}_\\lambda$.\n- **(iii)** necessity: Satake exhausts $\\mathcal{D}_c$ $\\Rightarrow$ $LX^{\\mathrm{sat}}=|LX|$.\n- **(iv)** the representability upgrade to $Z=(LX)_{\\mathrm{red}}$.\n- **(U)** unconditionality: (i)–(iii) do not invoke [the three standing hypotheses](../../../appendix/assum-intro.html)(c).\n\n## Dictionary\n\nOnly entry 5 works under one; entries 1–4 are literal. The correspondence is the one\nBen-Zvi–Sakellaridis–Venkatesh state in print (§7.5.3, p. 162, read):\n\n- $\\mathcal{D}_c(K\\backslash LX)\\rightsquigarrow C_c^\\infty(X(F))^{K}$, with $K=G(\\mathfrak{o})$;\n- $L^+X\\rightsquigarrow X(\\mathfrak{o})$;\n- the Hecke action on $\\mathrm{IC}_0\\rightsquigarrow$ the spherical Hecke algebra\n  $\\mathcal{H}(G(F),K)$ acting on $\\mathbf{e}=\\mathbf{1}_{X(\\mathfrak{o})}$;\n- hence $LX^{\\mathrm{sat}}\\rightsquigarrow G(F)\\cdot X(\\mathfrak{o})$.\n\nIt is decategorified, so a sheaf on a positive-codimension stratum has no shadow: nothing reached\nthrough it can match (ii), (C1) or (C2).\n\n## Precedent\n\n**What was searched.** On disk and read this run: `chenyi_2025singularitiesorbitclosuresloop.pdf`\n(arXiv:2310.20006v4) pp. 9–10 and 20–23 in full; `BZSV.pdf` pp. 155–158; `mirkovic2007geometric.pdf`\np. 4. Fetched and read: Bouthier–Ngô–Sakellaridis, *On the formal arc space of a reductive monoid*\n(arXiv:1412.6174), pp. 1–4 and 9–12; Aizenbud–Sayag (arXiv:1709.08214) pp. 1–2.\n\nWeb searches for a support/necessity direction in the 2024–2026 relative-Langlands literature, and\nfor arc-space sources on non-finitely-presented or degenerate loci.\n\n**What was found.**\n\n- **Chen–Yi, arXiv:2310.20006v4, Thm 36 (p. 21) and Prop. 39(ii) (p. 23)** (read). Thm 36(i): the closed embeddings $\\overline{LX}_\\lambda\\to LX$ are finitely presented; the proof quantifies \"For any $\\lambda\\in\\Lambda_S^+$\" and runs through Lemma 34 (p. 20), which describes $LX_\\lambda$ by arcs into the **open-$G$-orbit** subfamily $L^+\\mathcal{X}^\\bullet_\\lambda$. Prop. 39(ii): $LX\\cong\\operatorname{colim}_{\\underline\\lambda}\\overline{LX}_{\\underline\\lambda}$. Together these are exactly **(C1) with $\\Lambda'=\\Lambda_X^+$, and (C2)** — but only for the source's $X$, which is $X=G/K$ **homogeneous** (§2.1, p. 9; and p. 20: the fibres of both $\\pi_\\lambda$ and $\\pi^\\bullet_\\lambda$ over $\\mathbb{G}_m$ are $X\\times\\mathbb{G}_m$, i.e. $X$ is its own open orbit). This is a **special case in print of hypothesis (C)**, entailing it for homogeneous $X$. It touches no other piece: (S), (A), (B), (i)–(iv), (U) are all absent from that paper.\n- **Remark 37 (p. 22)** (read), verbatim: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites, Theorem 36 remains true for general spherical varieties.\" It widens the **variety class** and not the **index range**: the objects it quantifies over are still the $\\lambda\\in\\Lambda_S^+$ that Lemma 34 reaches through the open-orbit locus. The u3 reading is confirmed on the page.\n- **Bouthier–Ngô–Sakellaridis, arXiv:1412.6174, §1 p. 3 and §3 p. 12** (read). For $X$ integral with smooth dense open $X^\\circ$ and $Z=X\\setminus X^\\circ$, arcs generically into $X^\\circ$ are called **non-degenerate**, and (1.3) reads $\\mathscr{L}^\\circ X(k)=\\mathscr{L}X(k)-\\mathscr{L}Z(k)$; in the toric case (p. 12) $\\mathscr{L}^\\circ X$ \"is represented by an open subscheme of $\\mathscr{L}X$ which is the complement of $\\mathscr{L}(X-T)$\", with (3.6) $X(\\mathcal{O})\\cap T(F)=\\bigsqcup_{\\lambda\\in\\mathfrak{c}}T(\\mathcal{O})t^\\lambda$. This is the **sourced name for the set (C2) has to absorb**: the complement of the range (C1) is available on is the arcs/loops in the boundary. It matches (C1)/(C2) only by delimiting them and reaches nothing else.\n- **BZSV §7.3.1, p. 155 with Ex. 7.3.5, p. 158** (read). The placid case posits an exhaustion $X_F=\\varinjlim X^l$ with $X^l=\\varprojlim_n X^l_n$; for $X=H$ a group \"we can take the $X^l$ to come from strata of the affine Grassmannian\", and for Iwasawa–Tate $X^l_n(R)=t^{-l}R[t]/t^n$. This is (C2)'s *shape* in print for the listed cases — an exhaustion by $L^+G$-stable closed pieces — and does not say those pieces are orbit closures except in the group case.\n- **BZSV p. 163** (read): under Conjecture 7.5.1, \"all sheaves on $X_F/G_O$ can be generated from the basic object through the action of Hecke functors\". This is the **converse** of (iii): it asserts (iii)'s antecedent as a consequence of the conjecture. No support bound accompanies it; (S), (i), (ii), (C1), (C2), (iv) are untouched.\n- **Mirković–Vilonen, Ann. of Math. 166 (2007), p. 4, (2.1)–(2.2)** (read): $\\mathcal{G}r=\\varinjlim\\mathcal{G}r_n$ with the $\\mathcal{G}r_n$ finite-dimensional and $G_{\\mathcal{O}}$-invariant, orbits $\\mathcal{G}r^\\lambda=G_{\\mathcal{O}}\\cdot L_\\lambda$ indexed by dominant coweights, and $\\mathcal{G}r^\\mu\\subset\\overline{\\mathcal{G}r^\\lambda}$ iff $\\lambda-\\mu$ is a sum of positive coroots. Matches (S) and the *conclusion* of (iii) in the single case $X=G$; silent on (i), (ii), (A), (B).\n\n**Nothing contradicts any clause.** No published result was found that is incompatible with (i)–(iv)\nor with (C) under the standing hypotheses, and the search for a counterexample to (C2) — a smooth\naffine spherical $X$ with a boundary loop outside every $\\overline{LX}_\\lambda$ — returned nothing.\n\n**What was not found.**\n\n- (a) The support/necessity direction, at sheaf level, anywhere. BZSV §7.5 is still its natural\n  home and still poses generation from the basic object only as a *consequence* of Conjecture\n  7.5.1; the 2024–2026 searches turned up no statement bounding the support of a Hecke translate.\n- (b) **(C2) for non-homogeneous $X$.** The natural home is Chen–Yi §5.2–5.3, and it demonstrably\n  does not contain it: its $X$ is $G/K$, and Remark 37's widening is of the class, not the range.\n  The second natural home is the arc-space literature, and there the exclusion is explicit and by\n  design — BNS work on $\\mathscr{L}^\\circ X$ and remove $\\mathscr{L}Z$ by definition (1.3), and\n  their footnote 1 (p. 3) records that Bouthier–Kazhdan's perverse-sheaf foundations are likewise\n  built \"on the space of non-degenerate formal arcs\".\n- (c) A general placidity statement covering the non-homogeneous case: BZSV themselves write\n  (p. 156, read) that placidity of $X_F$ for all smooth $X$ \"seems possible\" by Drinfeld's\n  techniques, \"cf. [CN24, §8.1]\", and that \"the details of this have not appeared in print at the\n  time of typing this sentence.\"\n\n## Hypothesis (C): what the literature supplies\n\n**(C1) — finite presentation.** Supplied in print, over $\\Lambda'=\\Lambda_S^+$, by Chen–Yi Thm 36(i),\nfor $X$ homogeneous spherical (Rem. 37; symmetric with $K$ connected in the body). The mechanism is\nNoetherian descent inside the placid $L^iX=LX\\cap t^iL^+V$ of Drinfeld's Thm 35, factoring\n\n$$\n\\eta_\\lambda\\colon LX_\\lambda\\to\\overline{LX}_\\lambda\\to L^iX\n$$\n\ninto an fp-open followed by an fp-closed embedding (proof, pp. 21–22, read).\n\nNothing in print establishes (C1) at a $\\lambda$ whose orbit lies in the boundary\n$L(X\\setminus X^\\circ)$, and the repository's own witness\n([Q1-L3-L4 r1](Q1-L3-L4/critiques/r1.html)) says it is false there for $X=\\mathbb{A}^1$.\n\n**(C2) — that the range still exhausts.** Supplied in print **only** for homogeneous $X$, where it is\nChen–Yi Prop. 39(ii) and is trivial in the sense that $\\Lambda'$ is then all of $\\Lambda_X^+$. For\nnon-homogeneous $X$ it is a genuine claim and **no source states it**.\n\nNote it is strictly stronger than density of the open-orbit locus: the inclusion\n\n$$\n\\bigcup_{\\lambda\\in\\Lambda'}\\overline{LX}_\\lambda\\subseteq\\overline{L^\\bullet X}\n$$\n\ncan be proper when $\\Lambda'$ is infinite, so (C2) asks each boundary loop to be absorbed into a\n*single* orbit closure.\n\nIn every case checked below it is, and the reason is uniform and worth recording: when the\nexhaustion of BZSV §7.3.1 can be taken with each $X^l$ an $L^+G$-orbit closure, (C1) and (C2) hold\ntogether. That is a pattern, not a theorem, and it is unsourced.\n\n## Instances\n\n### 1. Iwasawa–Tate, $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ — **instance**\n\n**What it is.** $LX=k((t))$, $K=\\mathcal{O}^\\times$; the $K$-orbits are $LX_n=t^n\\mathcal{O}^\\times$ for $n\\in\\mathbb{Z}$, together with the closed orbit $\\{0\\}$.\n\n**Why it is an instance.** Smooth affine: $\\mathbb{A}^1$ is. Spherical with connected $B$-stabilizer: $G=B=T=\\mathbb{G}_m$ acts with open orbit $\\mathbb{G}_m$ and trivial stabilizer. [the three standing hypotheses](../../../appendix/assum-intro.html)(a): BZSV §7.3.1 p. 155 lists Iwasawa–Tate among the placid cases and Ex. 7.3.5 gives the presentation. (c) is verified by hand at BZSV Ex. 7.6.1 — not needed, by (U).\n\n**What it matches.** **(C1) and (C2)**, in the case the node names as breaking finite presentation.\nTake $\\Lambda'=\\mathbb{Z}$, the open-orbit range: $\\overline{LX}_n=t^n\\mathcal{O}$, whose embedding\ninto the stage $t^{-l}\\mathcal{O}=\\operatorname{Spec}k[x_j]_{j\\ge-l}$ is cut out by the finitely many\nequations $x_{-l}=\\dots=x_{n-1}=0$, hence finitely presented; and\n$\\bigcup_{n\\in\\mathbb{Z}}t^n\\mathcal{O}=k((t))=|LX|$, because $0\\in t^n\\mathcal{O}$ for every $n$\n*(constructed, unsourced — the identification $\\overline{LX}_{-l}=X^l$ with BZSV's Ex. 7.3.5 stage\n$X^l=\\varprojlim_nt^{-l}R[t]/t^n$, plus a coordinate count)*. So (C) **holds here**, with the origin\n— the orbit at which (C1) fails — covered by (C2) rather than needing it.\n\nIt does not reach (ii) at $\\lambda=\\{0\\}$, which is precisely the $\\lambda$ (C) excludes; it does not\nreach (A), (B) or (iv).\n\n**What the statement says here.** Clause (iii) delivers full exhaustion:\n\n$$\nLX^{\\mathrm{sat}}=\\bigcup_n t^n\\mathcal{O}\\cdot\\mathcal{O}^\\times=k((t)),\n$$\n\nso saturation holds and (iii)'s necessary condition is satisfied — consistent with\n$\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ being everything, which is what\n[the three standing hypotheses](../../../appendix/assum-intro.html)(c) asserts for this $X$.\n\n**Source.** BZSV, *Relative Langlands duality*, arXiv:2409.04677 — §7.3.1 p. 155, Ex. 7.3.5 p. 158 (read). Bouthier–Ngô–Sakellaridis, *On the formal arc space of a reductive monoid*, Amer. J. Math. 138 (2016) 81–108, arXiv:1412.6174 — §3, (3.5)–(3.6) and p. 12 (read). `refs.bib`: `BZSV`; BNS **absent**.\n\n### 2. The group case $X=H$ under $G=H\\times H$ — **instance**\n\n**What it is.** $H$ connected reductive, $X=H$ with the two-sided action, $LX=LH$, $K$-orbits $L^+H\\,t^\\lambda L^+H$ indexed by $\\Lambda^+$.\n\n**Why it is an instance.** Smooth affine spherical with connected $B$-stabilizer: the open Bruhat cell. Homogeneous, and **symmetric with connected $K$**: $\\theta$ is the swap on $H\\times H$ and $(H\\times H)^\\theta=H$ diagonal — so Chen–Yi's standing hypotheses hold verbatim. [the three standing hypotheses](../../../appendix/assum-intro.html)(c) is proved here (derived Satake).\n\n**What it matches.** **(C1) and (C2) in print**, by Chen–Yi Thm 36(i) and Prop. 39(ii) applied to\nthis symmetric pair, with $\\Lambda'=\\Lambda_X^+=\\Lambda^+$; and independently by Mirković–Vilonen\n(2.1)–(2.2), the orbit closures $\\overline{\\mathcal{G}r^\\lambda}$ exhausting $\\mathcal{G}r$. It also\nmatches **(S)** with $m_\\mu$ the convolution on $\\mathrm{Gr}_H$, **(ii)** in its standard form on a\nSchubert closure, and **(iii)** with the conclusion *true*.\n\nIt does not reach the content of (i): $LX^{\\mathrm{sat}}=|LX|$ here, so the bound bounds nothing and\nno stratum outside the saturation exists to test it. (A), (B), (iv) untouched.\n\n**What the statement says here.** $LX^{\\mathrm{sat}}=|LH|$, so (iii)'s necessary condition holds; (i) is vacuous; (ii) is the standard nonvanishing of $\\overline{i}_{\\lambda,*}\\omega$ on a Schubert closure.\n\n**Source.** Chen–Yi, *Singularities of orbit closures in loop spaces of symmetric varieties*, arXiv:2310.20006v4 — Thm 36 p. 21, Prop. 39(ii) p. 23 (read). Mirković–Vilonen, *Geometric Langlands duality and representations of algebraic groups over commutative rings*, Ann. of Math. 166 (2007) — p. 4, (2.1)–(2.2) (read). `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`, `mirkovic2007geometric`.\n\n### 3. Godement–Jacquet, $X=M_n$ under $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — **instance**\n\n**What it is.** $LX=M_n(F)$, $K=\\mathrm{GL}_n(\\mathcal{O})\\times\\mathrm{GL}_n(\\mathcal{O})$ acting by $\\gamma\\mapsto g_1\\gamma g_2^{-1}$; orbits by elementary divisors $\\mu_1\\ge\\dots\\ge\\mu_n$, with degenerate orbits where some divisor is absent.\n\n**Why it is an instance.** Smooth affine spherical with connected $B$-stabilizer, and **non-homogeneous** — the open $G$-orbit is $\\mathrm{GL}_n$, the boundary is the singular matrices, so this case falls *outside* Chen–Yi's hypotheses and inside the node's. [the three standing hypotheses](../../../appendix/assum-intro.html)(a): BZSV §7.3.1 p. 155 lists \"the Godement–Jacquet and Iwasawa–Tate periods, $X=M_n$\" among the placid cases; (c) is proved ([the three standing hypotheses](../../../appendix/assum-intro.html) key-variety table).\n\n**What it matches.** **(C1) and (C2)** in the first case where (C2) has content. Take\n$\\Lambda'=\\{(a,\\dots,a):a\\in\\mathbb{Z}\\}$: the orbit\n$LX_{(a,\\dots,a)}=t^a\\mathrm{GL}_n(\\mathcal{O})$ is open dense in the integral $t^aM_n(\\mathcal{O})$\n(complement the hypersurface $\\det=0$), which is closed in $LX$, so\n$\\overline{LX}_{(a,\\dots,a)}=t^aM_n(\\mathcal{O})$; that embeds in $t^{-l}M_n(\\mathcal{O})$ by\nfinitely many coordinate equations, hence is finitely presented, and\n$\\bigcup_a t^aM_n(\\mathcal{O})=M_n(F)$ *(constructed, unsourced — Smith normal form plus a\ncoordinate count)*. So a **non-homogeneous** $X$ in the standing class satisfies (C), with\n$\\Lambda'$ a proper sub-range of the open-orbit range.\n\nIt reaches neither (ii) at the degenerate $\\lambda$, nor (A), (B), (i), (iv).\n\n**What the statement says here.** (iii) delivers $LX^{\\mathrm{sat}}=|M_n(F)|$ as the necessary condition, over a $\\Lambda'$ that already exhausts — so the weakening u3 recorded costs nothing in this case.\n\n**Source.** BZSV arXiv:2409.04677, §7.3.1 p. 155 (read) for the placid presentation and the naming of the case; footnote 57 there (read) records that \"$G_O$-orbit closures can be singular even though $X_F$ is very simple\". `refs.bib`: `BZSV`.\n\n### 4. A homogeneous symmetric $X$: $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$ — **instance**\n\n**What it is.** $G=\\mathrm{GL}_{2n}$, $\\theta$ the symplectic involution, $K=\\mathrm{Sp}_{2n}$ connected, $X=G/K$; $LX$ with its $L^+G$-orbits indexed by $\\Lambda_S^+$ for $S$ a maximal $\\theta$-split torus.\n\n**Why it is an instance.** Smooth affine spherical; homogeneous; symmetric with $K$ connected, so Chen–Yi's §3–§5 hypotheses hold in full — including Lemma 38 and hence Prop. 39, which the group of hypotheses for general spherical $X$ does not give. [the three standing hypotheses](../../../appendix/assum-intro.html)(c) is proved for this $X$ (key-variety table, `chen2022quaternionic`).\n\n**What it matches.** **(C1) and (C2), both in print and both at full strength**: Thm 36(i) gives\nfinite presentation for every $\\lambda\\in\\Lambda_S^+$, Prop. 39(ii) gives\n$LX\\cong\\operatorname{colim}\\overline{LX}_{\\underline\\lambda}$. This is the cleanest published\ndischarge of hypothesis (C), and the only one where $\\Lambda'=\\Lambda_X^+$ is *proved* rather than\nchecked by hand.\n\nIt touches (S), (A), (B), (i)–(iv), (U) not at all.\n\n**What the statement says here.** (ii) holds for every $\\lambda$, so (iii) reads in its original, unweakened form: if the Satake subcategory is all of $\\mathcal{D}_c(K\\backslash LX)$ then $LX^{\\mathrm{sat}}=|LX|$.\n\n**Source.** Chen–Yi arXiv:2310.20006v4 — §2.1 p. 9 (setting), Thm 36 p. 21, Rem. 37 p. 22, Prop. 39 p. 23 (read). `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`.\n\n### 5. Boundary: where saturation fails — **(a) analogue, (b) instance of the mechanism**\n\n**What it is.** **(a)** $E/F$ unramified quadratic, residual characteristic $\\neq2$,\n$G=\\mathrm{SL}_n(E)$, $X$ the space of Hermitian forms on $E^n$ of determinant $1$:\n$\\mathcal{S}(X)^{K_0}$ is a **free $\\mathcal{H}(G,K_0)$-module of rank $2^{\\dim(V)-1}$**\n(Aizenbud–Sayag Thm A, read verbatim), hence not cyclic for $n\\ge2$ — no basic function generates.\n\n**(b)** Toy, char $0$: $X=\\mathbb{G}_m$ with $\\mathbb{G}_m$ acting by $t\\cdot x=t^2x$; then\n\n$$\nL^+X=\\mathcal{O}^\\times,\\qquad \\overline{LG}_\\mu\\cdot L^+X=t^{2\\mu}\\mathcal{O}^\\times,\n$$\n\nso $LX^{\\mathrm{sat}}$ is the even-valuation locus, proper in $LX$ *(constructed, unsourced — a\nvaluation computation)*.\n\n**Why (a) is only an analogue, and which hypotheses fail.** Finite residue field and a non-split\nform $\\mathrm{Res}_{E/F}$: it is a $p$-adic statement, reaching the node only through the\ndictionary, which drops (ii), (C1) and (C2) entirely.\n\n(b) is at sheaf level but the generic stabilizer $\\mu_2$ is **disconnected**, so the standing\nconnectedness hypothesis of [context](../../../context.html) fails; it is therefore not an instance of\nthe node.\n\n**What it matches.** (a) matches **(iii)'s antecedent, decategorified and negated**: a free module\nof rank $\\ge2$ is not cyclic. (b) matches **(S), (i) and (iii)** with the saturation proper — the\nonly place in this file where (i) is a nonvacuous bound, and where the contrapositive of (iii) does\nwork.\n\nNeither reaches (A), (B), (C1), (C2), (ii) or (iv), and (b) refutes nothing: it violates a standing\nhypothesis, which is what makes it evidence that the hypothesis is load-bearing.\n\n**What the statement says here.** In (b): every odd orbit lies outside $LX^{\\mathrm{sat}}$, so by (i) and (ii) the objects $\\overline{i}_{2k+1,*}\\omega$ lie in $\\mathcal{D}_c(K\\backslash LX)$ and not in its Satake subcategory.\n\n**Source.** Aizenbud, Sayag, *A short proof of Hironaka's theorem on freeness of some Hecke modules*, arXiv:1709.08214 — **Theorem A** and §1.2 (\"One can not expect that the conclusion of the Theorem holds for any spherical space\"), pp. 1–2 (read). `refs.bib`: **absent**.\n\n## Coverage\n\n- **(C1)** is matched by entries 1–4 and by Chen–Yi Thm 36 in print.\n- **(C2)** is matched by entries 1–4: in print for the homogeneous cases (2, 4) and by routine\n  construction for the two non-homogeneous ones (1, 3).\n- **(S)** by entries 2, 5(b) and Mirković–Vilonen.\n- **(ii)** by entry 2 alone, where it reduces to the standard nonvanishing on a Schubert closure.\n- **(iii)** by entries 1, 2, 3, 5(a), 5(b) and BZSV p. 163, in both directions.\n- **(i)** by entry 5(b) only, and only outside the standing class.\n\n**What nothing found touches.**\n\n- **(A)** and **(B)** — no source located says anything about coherent-equals-compact on\n  $K\\backslash LX$ or about $\\mathcal{S}_F=\\ker(j_F^!)$ surviving the $K$-quotient.\n- **(iv)** — the representability upgrade appears in no source and in no instance.\n- **(U)** — nothing in print separates the necessary condition from the unramified conjecture.\n- **(ii) in the generality the node states it**, and **(C2) for non-homogeneous $X$ as a theorem**:\n  the four instances discharge (C2) case by case, and the general statement is in no source, with\n  the two natural homes — Chen–Yi §5.2–5.3 and the arc-space literature — both restricting by\n  construction to the open-orbit/non-degenerate range.\n\nEVIDENCE: instances\n\n## Promotion candidates\n\n1. **Q1-L3-e1 — hypothesis (C) holds for the lattice-exhausted cases.** Role: `example`, polarity `positive`. *Statement:* for $X=\\mathbb{A}^1$ under $\\mathbb{G}_m$ and $X=M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$, the subset $\\Lambda'\\subseteq\\Lambda_X^+$ of orbits whose closures are the lattice stages $t^aL^+V\\cap LX$ satisfies both halves of (C): each $\\overline{\\imath}_\\lambda$ is cut out by finitely many coordinates, and the stages exhaust $|LX|$. *Sources:* BZSV §7.3.1 p. 155, Ex. 7.3.5 p. 158. *Matches:* (C1), (C2); reaches (ii) at boundary $\\lambda$ not at all. *A third case worth including, on weaker grounds:* the Hecke period $X=\\mathbb{A}^2$ under $\\mathrm{SL}_2$, proposed only because BZSV §7.3.1 p. 155 lists it as a placid case — the $\\Lambda'$ and the exhaustion are **not** computed anywhere in this file, and a node adopting it would have to do that work first.\n\n**Withdrawn.** A second candidate on the Aizenbud–Sayag material was drafted and is not proposed: the id `Q1-L3-a1` is taken, and the content is already carried by [Q1-L3-a4](Q1-L3-a4/index.html), whose clause 1 is Theorem A with the rank $2^{n-1}$ and whose clause 3 is entry 5(b) above. What a refresh of that node would gain from this run's re-reading of pp. 1–2: the source states the rank as $2^{\\dim(V)-1}$, and its §1.2 says in its own words that \"One can not expect that the conclusion of the Theorem holds for any spherical space\" — the sentence that keeps clause 1 from reading as a generic failure. Neither changes the claim.\n";</script>
