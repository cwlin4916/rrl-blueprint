ances`). The precedent half came back negative in the telling way — BZSV §7.5 poses generation from the basic object as a consequence of their conjecture and never raises the unconditional support obstruction that makes saturation *necessary*, and the Gaitsgory–Nadler and Sakellaridis results live on the open-orbit loop space where the boundary strata are absent by construction. The instances half is a five-rung classical ladder, of which four rungs were promoted to the analogy children [Q1-L3-a1](Q1-L3-a1/index.html)–[Q1-L3-a4](Q1-L3-a4/index.html) (Tate's case deliberately not — [Q1-e2](../Q1-e2/index.html) already carries it).\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): the support bound and the necessity of Hecke saturation; no group-scheme quotient appears, and the run's corrections do not reach it. Re-read against [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and the ind-properness of $\\mathrm{Gr}$ that clause (i) rests on.\n- **2026-08-06 — statement corrected** by `/update Q1-L3` on an external verdict the user supplied ([u1](updates/u1.html)). The setup asserted that $LX^{\\mathrm{sat}}$ is a closed ind-subscheme *because* each $m_\\mu$ is ind-proper, and that inference is invalid: ind-properness makes each image closed and says nothing about their filtered union, as a two-line counterexample recomputed this run shows. The node now declares $LX^{\\mathrm{sat}}$ for what its argument uses — a $K$-stable subset of geometric points — clauses (i) and (iii) are containments and an equality of sets, the ind-scheme upgrade survives as the conditional clause (iv), and the title says *set-theoretic*. What was refuted is the inference, not the conclusion: $LX^{\\mathrm{sat}}$ may well be closed, and is in both cases the tree carries.\n- **2026-08-06 — the hypothesis this node does not use, and what that says about the question.** The same run verified that no clause invokes [the three standing hypotheses](../../../appendix/assum-intro.html)(c), and the statement now says so. Following that thread past the node: BZSV (arXiv:2409.04677) p. 163, read this run, states that under their conjecture *\"all sheaves on $X_F/G_O$ can be generated from the basic object through the action of Hecke functors\"* — the converse of clause (iii), already recorded in [examples.md](examples.html) precedent (a). Since [Q1](../../../dag.html)'s Setting puts (c) in force, and [Q1-L2](../Q1-L2/index.html) (proved) carries the equality between the renormalized and the coherent readings, Q1 as framed assumed a hypothesis from which its own affirmative answer follows on the source's own reading. Q1's **Problem statement** now suspends (c) for the question; ratifying that suspension is the user's call, and it is ranked in [priorities](../../../../blueprint/priorities.md).\n- **2026-08-06 — decomposed** by `/decompose Q1-L3` into five sub-lemmas, listed in [`## Decomposition`](index.html). What the expansion cuts out is what the node used without stating: the ind-properness and closed images that make the saturation a directed union of closed sets ([Q1-L3-L1](Q1-L3-L1/index.html)); the Schubert-boundedness that confines each generator to one member of it ([Q1-L3-L2](Q1-L3-L2/index.html)); the categorical step carrying that containment from the generators to every compact object of the subcategory they generate ([Q1-L3-L3](Q1-L3-L3/index.html)) — together clause (i); the orbit-closure witness that is clause (ii) ([Q1-L3-L4](Q1-L3-L4/index.html)); and the representability and closedness question clause (iv) alone is conditional on ([Q1-L3-L5](Q1-L3-L5/index.html)), which is where the assertion `/update` withdrew from the setup now lives, as a claim someone has to prove.\n- **2026-08-06 — a tension between two appendix entries, flagged and not resolved.** [Q1-L3-L2](Q1-L3-L2/index.html) rests on [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(4), which says a coherent object of $\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$ is pushed forward from a single Schubert closure. Against it: by the letter of the finite-type test-scheme reading of [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), the dualizing object of [$\\omega_{\\mathcal{Y}}$](../../../appendix/not-dualizing-object.html) on $K\\backslash\\mathrm{Gr}$ would be coherent with support all of $\\mathrm{Gr}$. The likely resolution is that no such object exists — $\\mathcal{D}^!(\\mathrm{Gr})$ is a colimit along pushforwards by [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html), so every object comes from a stage, and the structure map of an ind-scheme is not schematic, so $p^!$ need not be defined. If that is right, the $\\omega_{\\mathcal{Y}}$ entry over-claims by defining $p_{\\mathcal{Y}}^!(k)$ for every prestack without a caveat. Two entries cannot both be read literally; whichever gives way, [Q1-L3-L2](Q1-L3-L2/index.html) must also cross from the Iwahori quotient the source states to the spherical one it uses. Ranked in [priorities](../../../../blueprint/priorities.md); no entry was edited, the appendix not being `/update`'s to write.\n- **2026-08-06 — the guess in the entry above is refuted, and the tension bites the other way.** That entry proposed that $\\omega_{K\\backslash\\mathrm{Gr}}$ simply does not exist, the structure map of an ind-scheme not being schematic. It does. Bouthier–Kazhdan–Varshavsky, *Perverse sheaves on infinite-dimensional stacks*, Adv. Math. **408** (2022), §0.1.4(a) — read this run and recorded in [papers/guideline.md](../../../papers/guideline.html) — define $\\omega_{\\mathcal{X}}$ as the $!$-pullback of the unit *for every prestack*, and §0.1.4(c) uses $\\omega$ of an ind-infinite quotient stack as a genuine perverse object. So the [$\\omega_{\\mathcal{Y}}$](../../../appendix/not-dualizing-object.html) entry is right and the pressure falls on the other side: the same run found that every \"comes from a stage\" result in print — Raskin §4.3 for placid $T$, Mirković–Vilonen p. 6 for the abelian perverse category — is about **compact** objects or about an abelian colimit, and none is about $\\mathcal{D}_c$. Since [Q1-L2-L1](../Q1-L2/Q1-L2-L1/index.html) makes coherent-equals-compact hold in $\\mathcal{D}^{\\mathrm{ren}}$ and not in $\\mathcal{D}$, the literature's class is the strictly smaller one, and [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(4) reads wider than its sources. What that costs [Q1-L3-L2](Q1-L3-L2/index.html)(1) is the business of that node's own `/examples` verdict.\n- **2026-08-06 — the grounding pass, and the one finding that reaches this node's own statement.** `/examples` ran on all five children: [L1](Q1-L3-L1/index.html) `instances`, [L2](Q1-L3-L2/index.html) `gap`, [L3](Q1-L3-L3/index.html) `precedent`, [L4](Q1-L3-L4/index.html) `instances`, [L5](Q1-L3-L5/index.html) `instances`. The finding that reaches *this* file is L4's: clause (ii) above quantifies over **every** $\\lambda\\in\\Lambda_X^+$, and the finite presentation of $\\overline{i}_\\lambda$ that the witness needs is not available over that range when $X$ is non-homogeneous. The origin of $L\\mathbb{A}^1$ is an $L^+G$-orbit whose closed embedding has infinite codimension, and [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) does not reach it — its proof runs through the open-orbit locus, which is the same scope defect the panel already carries against ratified reading 3. Clause (ii) is therefore *not* corrected here: the defect is in an appendix entry's range, not in this statement, and correcting it means fixing the entry first. Ranked in [priorities](../../../../blueprint/priorities.md).\n- **2026-08-06 — and one finding that lands on a sibling.** L5's run establishes that its hypothesis (A), finite orbit intervals, is **false** for Iwasawa–Tate — $\\overline{LX}_n = t^n\\mathcal{O}$ meets infinitely many orbits, as [Q1-L4-e1](../Q1-L4/Q1-L4-e1/index.html)(1) already computes — so [Q1-L3-L5](Q1-L3-L5/index.html) cannot deliver clause (iv) for the non-homogeneous key examples. In the symmetric case it is not needed: Chen–Yi §11 makes $LX^{\\mathrm{sat}}$ a union of connected components, hence closed, with no appeal to (A) at all. What that leaves as the node's live content is clause (1) for a saturation properly contained in one connected component, which nothing in print touches.\n- **2026-08-06 — the cut as it settled: five nodes, and what each carries.** The entry above named three ids while listing four pieces, and the run closed on five: [Q1-L3-L1](Q1-L3-L1/index.html) the ind-properness and the closed images, [Q1-L3-L2](Q1-L3-L2/index.html) the support of a Hecke translate, [Q1-L3-L3](Q1-L3-L3/index.html) the abstract compactness step that carries a containment from the generators to the generated subcategory, [Q1-L3-L4](Q1-L3-L4/index.html) the orbit-closure witness of clause (ii), and [Q1-L3-L5](Q1-L3-L5/index.html) the representability clause (iv) is conditional on. All five are listed in this node's **depends-on**, [Q1-L3-L3](Q1-L3-L3/index.html) and [Q1-L3-L4](Q1-L3-L4/index.html) being ready leaves. The statement above was not touched: the expansion says how clauses (i)–(iv) will be proved and changes nothing about what they claim, and the recombination is the **Decomposition** paragraph.\n- **2026-08-06 — a sixth child, attached because the cut above lost an input.** `/update Q1-L3-L2` deleted that node's closing sentence as false ([u1](Q1-L3-L2/updates/u1.html)): a coherent Hecke kernel need not be supported in one Schubert closure, nor in any finite union of them, so nothing there any longer puts an arbitrary generator $\\mathcal{F}\\ast\\mathrm{IC}_0$ inside a single $Z_F$ — and that sentence was the first input of clause (i). [Q1-L3-L6](Q1-L3-L6/index.html) is the reduction that restores ody carried out.** u1's **Unverified** column already named the continuity input — \"$x^!$ is exact and preserves arbitrary colimits on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\" — and closed on the words *\"this input is now cut out as a child, where it can be discharged or fail visibly rather than being assumed inside a proof.\"* No child of this node carries it: the six are ind-properness, the bounded kernel, the abstract compactness lemma, the orbit witness, the ind-subscheme upgrade, and bounded generation. The fact went back to being assumed inside a paragraph, which is what u1 was trying to stop. Hypothesis **(B)** is the interim record of it, and the child itself is commissioned this run.\n- **2026-08-07 — the new hypothesis (B) was itself overstated, and the child caught it.** As first written, **(B)** offered \"$j_F^{!}$ preserves small colimits\" as *equivalent* to the colimit-closure, on the ground that $\\mathcal{S}_F=\\ker(j_F^{!})$. Only $\\ker(j_F^{!})\\subseteq\\mathcal{S}_F$ follows from the support convention; the converse says a cover by opens of vanishing forces vanishing on the union, which is a locality statement for $\\mathcal{D}^!$ on $K\\backslash LX$ that no appendix entry carries — and it is the direction the caller needs. Caught by the lead-researcher writing [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html), where the locality is hypothesis (A) and the continuity is clause (1). **(B)** now states the colimit-closure and names both halves separately ([u2](updates/u2.html), closing section). The defect was the shape this very update was written to remove — a property asserted in apposition to a definition, invariant I28 — which is worth recording against the operator and not only against the node.\n- **2026-08-07 — clause (ii)'s quantifier is restricted, and the necessary condition weakens with it** ([u3](updates/u3.html)). [Q1-L3-L4](Q1-L3-L4/index.html) was `REFUTED` at [r1](Q1-L3-L4/critiques/r1.html): for $X=\\mathbb{A}^1$ with $G=\\mathbb{G}_m$ — key example [K1](../../../key_examples/k1.html) — the origin of $L\\mathbb{A}^1$ is a closed orbit equal to its own closure whose embedding is cut out in the stage $t^{-l}\\mathcal{O}$ by the non-finitely-generated ideal $(x_j)_{j\\ge-l}$, so $\\overline{\\imath}_\\lambda$ is not finitely presented there. What that refutes is a claim about **finite presentation**, not about coherence, so clause (ii) is unsupported over part of its quantifier rather than false. A new hypothesis **(C)** declares the range on which finite presentation is available, clause (ii) is stated on it, and (iii) inherits it.\n- **2026-08-07 — what (C) costs, stated rather than absorbed.** Clause (iii) exhausts $|LX|$ by running (i) and (ii) over every $\\lambda$; on a sub-range $\\Lambda'$ it yields only $\\bigcup_{\\lambda\\in\\Lambda'}|\\overline{LX}_\\lambda|\\subseteq LX^{\\mathrm{sat}}$, and the equality $LX^{\\mathrm{sat}}=|LX|$ needs that union to exhaust $|LX|$ already. So the **necessary condition this node hands [Q1](../../../dag.html) is weaker than it read**, and the missing part is exactly the $\\lambda$ the source behind [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) does not reach — for K1, the origin. The entry itself over-claims: read this run at `papers/chenyi_2025singularitiesorbitclosuresloop.pdf`, Lemma 34 (p. 20) indexes by arcs into the open-$G$-orbit locus, Thm 36's proof (p. 21) quantifies over $\\Lambda_S^+$, and Remark 37 (p. 22) widens the variety class and not the index range. Correcting the entry is the lead-researcher's and is commissioned.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed.\n- **2026-08-08 — literature examined** by `/examples Q1-L3`, verdict `EVIDENCE: instances`, recorded in [examples.md](examples.html). It supersedes the 2026-08-04 pass, which weighed the pre-[u3](updates/u3.html) statement and so could not weigh hypothesis **(C)**. The run was aimed at (C), and it found (C) *in print*: Chen–Yi Thm 36(i) with Prop. 39(ii) is exactly both halves — finite presentation on a range, and that range exhausting — with $\\Lambda'=\\Lambda_X^+$. What it is not is a statement about this node's class. Verified on the page this run, p. 22 of `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` derives its exact sequences (7) from \"the fibration $K\\rightarrow G\\rightarrow G/K = X$ (note that we assume $K$ is connected)\", so the source's $X$ is **homogeneous**, and Remark 37 widens the variety class exactly as [u3](updates/u3.html) read it.\n- **2026-08-08 — (C) is discharged in both non-homogeneous key cases, by a mechanism the (C) paragraph does not anticipate.** The paragraph presents [K1](../../../key_examples/k1.html) as the case that costs (C), and it does not. Take $\\Lambda'=\\mathbb{Z}$, the open-orbit range: $\\overline{LX}_n=t^n\\mathcal{O}$ is cut out of the stage $t^{-l}\\mathcal{O}$ by the finitely many equations $x_{-l}=\\dots=x_{n-1}=0$, while $\\bigcup_{n}t^n\\mathcal{O}=k((t))$ **because the origin lies in every one of them**. The $\\lambda$ at which (C1) fails is absorbed by (C2) rather than needing it, and the same happens for Godement–Jacquet $M_n$ with $\\Lambda'=\\{(a,\\dots,a)\\}$. So what (C) costs is not what the paragraph says it costs, and the sentence naming K1 as the obstruction is a candidate for `/update`.\n- **2026-08-08 — what nothing in print touches.** **(A)** coherent-equals-compact on $K\\backslash LX$ and **(B)** $\\mathcal{S}_F=\\ker(j_F^{!})$ surviving the $K$-quotient are matched by no source and by no instance in the file. **(iv)**, the reduced-ind-subscheme upgrade, appears nowhere; **(U)**, the independence of the necessary condition from [the three standing hypotheses](../../../appendix/assum-intro.html)(c), is separated by nothing in print. Clause **(ii)** is still matched only by the group case, where it is the standard Schubert-closure nonvanishing. **(C2)** for non-homogeneous $X$ as a theorem is matched by four hand computations and no source. The two natural homes both exclude the boundary by construction — Chen–Yi through Lemma 34's open-orbit locus, Bouthier–Ngô–Sakellaridis by defining $\\mathscr{L}^\\circ X(k)=\\mathscr{L}X(k)-\\mathscr{L}Z(k)$ at (1.3) — and BZSV records at p. 156 that the general placidity statement \"ha[s] not appeared in print\".\n\n- **2026-08-09 — measured against the bench, and capped at $+25\\%$** ([goalcheck.md](goalcheck.html)). `/check-goal Q1-L3` specialized the statement to all twelve register entries and closed `GOALCHECK: tension`, a ceiling on this node's confidence that can never raise it.\n\n  **The strain is [K6](../../../key_examples/k6.html), and it is named rather than suspected.** The entry's own text carries CMNO Remark 1.4 — the orbits there are neither finite-dimensional nor finite-codimensional, so the naive stratum-by-stratum reading of [Q1](../index.html) is unavailable — and clauses (ii) and (iii) *are* that reading. What no one has written is a reconciliation of Remark 1.4's geometry, stated on the ind-finite-type presentation $L\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}$ where finite presentation is free, with the placid orbit-closure presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) on which hypothesis (C) is asserted. No non-finitely-presented $\\overline{\\imath}_\\lambda$ is exhibited, so this is a strain and not a refutation, and the $n=1$ corner — $\\mathrm{Sp}_2=\\mathrm{SL}_2$, $X\\cong\\mathbb{G}_m$, orbits clopen — satisfies (C) outright.\n\n  **The bench reproduced the 2026-08-08 absorption finding independently.** Specializing to [K1](../../../key_examples/k1.html) from the register rather than from the literature, the check recomputed that the origin is the only index the [Q1-L3-L4](Q1-L3-L4/index.html) [r1](Q1-L3-L4/critiques/r1.html) refutation removes, that every other $\\overline{\\imath}_n$ is cut out by finitely many coordinates, and that $0\\in t^nk[[t]]$ for every $n$, so $\\Lambda'=\\mathbb{Z}$ still exhausts $|LX|$. That is the entry above, reached by a different route, and the agreement is the point: (C)'s second half survives at K1 and clauses (ii) and (iii) are undamaged there.\n\n  **The finding that reaches the question rather than the node.** For $X=G/H$ homogeneous with $H$ connected, $F=k((t))$ has cohomological dimension $\\le 1$, so $H^1(F,H)=1$ and $LX(k)=G(F)/H(F)$ is a single $LG$-orbit; since $L^+X\\neq\\emptyset$, $LX^{\\mathrm{sat}}=|LX|$ automatically. Set-theoretic Hecke saturation therefore holds at [K3](../../../key_examples/k3.html), [K4](../../../key_examples/k4.html), [K6](../../../key_examples/k6.html), [K8](../../../key_examples/k8.html), [K9](../../../key_examples/k9.html) — and by the same argument at [K12](../../../key_examples/k12.html), the register's one candidate *negative*, where [Q1](../index.html)'s equality is expected to fail. So the necessary condition this node hands the question as (A1) is **automatic on the entire homogeneous half of the standing class**, and holds exactly where the answer is expected to be no. Clause (iii) is exercised non-vacuously only at [K1](../../../key_examples/k1.html), [K5](../../../key_examples/k5.html) and the out-of-class [K11](../../../key_examples/k11.html), which is also the only entry where clause (i)'s support bound cuts anything.\n\n  **What nothing on the bench touched** — the same list the 2026-08-08 literature pass returned, now confirmed from the other side: hypothesis (B) entire, including its separately flagged identification $\\mathcal{S}_F=\\ker(j_F^{!})$; the unconditionality claim, which is a fact about this node's argument and not about a pair $(G,X)$; clause (iv) with a *proper* $Z$, since every in-class entry meets its hypothesis only through $LX^{\\mathrm{sat}}=|LX|$; and hypothesis (A) anywhere but the one-point case [K2](../../../key_examples/k2.html).\n\n  **What the ceiling costs the repair programme.** While `tension` stands this node is pinned at $+25\\%$: a `PASS` here reaches the cap on its own, and clearing [Q1-L3-L4](Q1-L3-L4/index.html) and [Q1-L3-L2](Q1-L3-L2/index.html) — which lifts the raw score from $26\\%$ to $50\\%$ — moves the reported number by nothing at all. Lifting the cap means answering K6's reconciliation, not proving another child.\n\n- **2026-08-09 — proved in part, and `gapped` on clause (iv)** ([r1](critiques/r1.html), [r2](critiques/r2.html), [proof.md](proof.html), [g1](gaps/g1.html)). The node's first `/prove`. Clauses **(i)**, **(ii)**, **(iii)** and the orbit form are established in full; **(iv)** stalls on a fact the appendix does not carry, and the status records that and nothing worse.\n\n  **Round 1 found two ordinary defects and one honest want.** [r1](critiques/r1.html) closed `FAIL` at 0 FATAL / 3 MAJOR / 5 MINOR, and its sort mattered more than its count. *Flaw 1*: Step 3 verified hypothesis (B) of [Q1-L3-L3](Q1-L3-L3/index.html) for $[+1]$ only, by a colimit argument that **provably cannot reach** $[-1]$ — desuspension is a limit, and connective spectra inside $\\mathrm{Sp}$ are the one-line counterexample, being closed under all small colimits, cofibres, retracts and $[+1]$ but not $[-1]$. *Flaw 2*: Step 9 applied [Q1-L3-L4](Q1-L3-L4/index.html) having checked its hypothesis (A) and not its (B), whose second half asserts base change against $!$-pullback for the equivariant pushforward and is a mathematical claim rather than notation; the draft called it \"inherited by clause (ii)\", which is a claim about the statement that the statement does not make.\n\n  **Round 2 repaired both inside the existing closed world.** Shift-stability now comes from **exactness** rather than colimits: the support convention of [Q1-L3-L2](Q1-L3-L2/index.html)'s Setup is cut out by vanishing of $!$-restrictions to opens, those restrictions are colimit-preserving between stable presentables by [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) and [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), hence exact, giving $|\\operatorname{supp}\\mathcal{G}[n]| = |\\operatorname{supp}\\mathcal{G}|$ for **all** $n\\in\\mathbb{Z}$. And hypothesis (B) of [Q1-L3-L4](Q1-L3-L4/index.html) is now *discharged* rather than inherited: two steps prove $K\\backslash\\overline{LX}_\\lambda\\rightarrow K\\backslash LX$ finitely presented in the prestack sense from (C1), using the affine $K$-torsor of [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../../../appendix/fp-convolution-morphism.html) note (e), and then apply clause (iv) of [Raskin: pushforward along a finitely presented morphism](../../../appendix/bb-raskin-fp-pushforward.html), verified on the page at `papers/raskin_dmodules_infinite_var.pdf` §3.16.\n\n  **Why the status is `gapped` and not `failing`, and what that is worth.** [r2](critiques/r2.html) closed `FAIL` at 0 FATAL / 1 MAJOR / 6 MINOR and certified the [ADR 0076](../../../process/decisions/0076-a-gap-is-a-prompt.html) condition explicitly: *every* standing MAJOR is the closed world coming up short, the sole one being the gap itself. Under that reading the mathematical channel scores **silent** rather than $-1.0$, and the node reads $-4.3\\%$ instead of $-39.3\\%$ — the whole 35-point difference turning on the referee's sort rather than on any fact about the mathematics.\n\n  **The gap, and how the referee rescoped it.** [g1](gaps/g1.html) asks for a reduction $(-)_{\\mathrm{red}}$ for ind-schemes and for geometric points to detect a closed sub-ind-scheme — [placidity](../../../appendix/placid-ind-scheme.html) supplies neither, its transition maps being smooth and affine but **not surjective**, so a $k$-point of a stage need not lift to the limit. Both referees granted the two items and confirmed clause (iv) then **finishes with nothing further owed**. The rescoping worth keeping: the engine is item **4**, very-density of $k$-points on one reduced placid stage, from which item 2 follows stagewise; and item 3 must be a *new entry* and never an amendment to [placidity](../../../appendix/placid-ind-scheme.html), which transcribes main.tex:669 verbatim.\n\n  **Left standing, and named so the next run does not rediscover them.** *Flaw 12* is statement-owned and was **not** acted on this run: read alone, clause (ii) binds neither $\\overline{i}_{\\lambda,*}$ nor $\\omega_{K\\backslash\\overline{LX}_\\lambda}$, the write-up supplying the binding, and a one-line `/update` on the Setup fixes it. It was deferred deliberately — the write-up is byte-identical to the statement today, and editing the Setup would supersede it immediately before the split the referee asks for. *Flaw 13*: [g1](gaps/g1.html) still cites pre-repair step numbers, which costs more in a packet written for a reader outside this repository than anywhere else. *Flaw 15*: the write-up sits at **1499/1500 words**, so the next repair has no room — `/tighten` first, `/decompose` after, with Steps 9–10 the self-contained candidate.\n";</script>
