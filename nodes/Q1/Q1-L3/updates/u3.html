of $L\\mathbb{A}^1$ is a closed $L^+G$-orbit equal to its own closure, and in the stage $t^{-l}\\mathcal{O}=\\operatorname{Spec}k[x_j]_{j\\ge-l}$ its embedding is cut out by $(x_j)_{j\\ge-l}$, not finitely generated.\n\n**Not refuted:** clause (ii) itself. Coherence of $\\overline{\\imath}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a conclusion; finite presentation is the hypothesis the known argument uses to reach it. The witness closes that route at those $\\lambda$ and exhibits no non-coherent object. The clause is therefore **unsupported** outside a restricted range, not false, and this update declares the hypothesis rather than narrowing the claim.\n\n## What the source says\n\nRead at page level this run in `papers/chenyi_2025singularitiesorbitclosuresloop.pdf`: Lemma 34 (p. 20) describes $LX_\\lambda$ by arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$; the proof of Thm 36 (p. 21) quantifies \"For any $\\lambda\\in\\Lambda_S^+$\"; Remark 37 (p. 22) widens the **variety class** and not the **index range**. [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) as transcribed reads wider than its source. Correcting the entry is not this operator's to do — the appendix is the lead-researcher's — and it is commissioned.\n\n## The consequence for clause (iii), which is the part that matters\n\nClause (iii) deduces $LX^{\\mathrm{sat}} = |LX|$ from (i) and (ii) against the presentation $LX=\\varinjlim_\\lambda\\overline{LX}_\\lambda$: each witness lies in the Satake subcategory, (i) puts its support inside $LX^{\\mathrm{sat}}$, and the closures exhaust $|LX|$. That argument needs a witness at **every** $\\lambda$. With (ii) available only on a sub-range $\\Lambda'\\subseteq\\Lambda_X^+$, the deduction yields\n\n$$\n\\bigcup_{\\lambda\\in\\Lambda'}\\left|\\overline{LX}_\\lambda\\right|\\ \\subseteq\\ LX^{\\mathrm{sat}},\n$$\n\nand $LX^{\\mathrm{sat}} = |LX|$ only if that union already exhausts $|LX|$. So the **necessary condition [Q1](../../../../dag.html) consumes is weaker than it read**, and the gap is exactly the $\\lambda$ the entry's source does not reach — for K1, the origin. This is recorded and not hidden: it is the substantive finding of the run.\n\n## What changed\n\nClause (ii) gains the declared hypothesis **(C) Finite presentation on the range used**, in the Setup beside (A) and (B), and (ii) and (iii) are stated under it. The clause's conclusion is unchanged. A sentence in the **Unconditionality** paragraph records that (iii) now delivers exhaustion only over the range (C) supplies.\n\n## Considered and not adopted\n\n**Narrowing clause (ii)'s quantifier to the open-orbit range.** That range is what one *source* establishes; another may reach further, and the node would then understate. A declared hypothesis is the same information without freezing the range into the claim.\n\n**Asserting finite presentation more widely via a new appendix entry.** Refuted by the witness — an entry saying that would be false.\n";</script>
