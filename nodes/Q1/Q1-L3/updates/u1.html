<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q1-L3</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L3](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-06 · **Operator:** `/update Q1-L3`, on an external verdict supplied by the user · **Status before:** `open` · **Status after:** `open`\n\n## The defect, in one sentence\n\nThe setup of the statement asserted that\n\n$$\nLX^{\\mathrm{sat}} := \\bigcup_{\\mu\\in\\Lambda^+} m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\n$$\n\nis a closed ind-subscheme of $LX$, offering the ind-properness of each $m_\\mu$ as the reason, and clause (iii) then concluded an equality $LX^{\\mathrm{sat}} = LX$ of ind-schemes; but ind-properness of the members of a filtered family gives closedness of each image and not of their union, and the support argument that proves (iii) sees only underlying reduced loci, so neither the closedness nor the scheme-theoretic equality was established by anything in the node.\n\n## The counterexample to the inference, verified independently of the passage that reported it\n\nThe implication \"each $m_\\mu$ is ind-proper $\\Rightarrow \\bigcup_\\mu\\operatorname{im}(m_\\mu)$ is closed\" is false already for a single ind-proper map of ind-schemes. Fix pairwise distinct $a_1,a_2,\\ldots\\in\\mathbb{A}^1(k)$ not exhausting $\\mathbb{A}^1(k)$, put\n\n$$\nP_n = \\coprod_{j=1}^{n}\\operatorname{Spec}k, \\qquad P = \\varinjlim_n P_n,\n$$\n\nand let $f\\colon P\\to\\mathbb{A}^1$ send the $j$-th point of $P_n$ to $a_j$. Each $f_n\\colon P_n\\to\\mathbb{A}^1$ is finite, hence proper, so $f$ is ind-proper stagewise; but $f(|P|) = \\{a_1,a_2,\\ldots\\}$ is an infinite proper subset of $\\mathbb{A}^1(k)$, and over $k = \\bar{k}$ every proper Zariski-closed subset of $\\mathbb{A}^1$ is finite. So the image is not closed.\n\nThe shape matches the node: assembling the $m_\\mu$ into $m\\colon LG\\times^{K}L^+X\\to LX$ over the filtered index $\\Lambda^+$, the union of images is exactly $\\operatorname{im}(m)$, and the counterexample says an ind-proper map need not have closed image.\n\nTwo further points the counterexample does not need, and which stand on their own.\n\nFirst, \"the union of the images\" fixes no scheme structure — ordinary image, reduced scheme-theoretic image, or a colimit of closed ind-subschemes are three different objects, and the node named none of them.\n\nSecond, the support of a $\\mathcal{D}$-module detects only an underlying reduced locus, so no support argument can ever separate two subschemes sharing a topological space, and clause (iii) could not have proved a scheme-theoretic equality even if the closedness had been available.\n\n**What is *not* refuted:** that $LX^{\\mathrm{sat}}$ is in fact closed in $LX$. The inference is invalid; the conclusion may well be true, and is true in the two cases on the tree — the group case, where $LX^{\\mathrm{sat}} = LX$, and the toy witness of [Q1-L3-a4](../Q1-L3-a4/index.html)(3), where it is a union of connected components of $L\\mathbb{G}_m$. That is now its own node rather than a free assertion inside this one.\n\n## Old statement, verbatim\n\n> For $\\mu\\in\\Lambda^+$ let\n>\n> $$\n> m_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X \\longrightarrow LX\n> $$\n>\n> be the convolution map, where $\\overline{LG}_\\mu\\subset LG$ is the preimage of $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$. Each $m_\\mu$ is ind-proper ($\\mathrm{Gr}$ is ind-proper), and\n>\n> $$\n> LX^{\\mathrm{sat}} := \\bigcup_{\\mu\\in\\Lambda^+} m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\n> $$\n>\n> is a $K$-stable closed ind-subscheme of $LX$. Then:\n>\n> (i) every $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ satisfies $\\operatorname{supp}\\mathcal{G}\\subseteq LX^{\\mathrm{sat}}$;\n>\n> (ii) for every $\\lambda\\in\\Lambda_X^+$, $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a nonzero object of $\\mathcal{D}_c(K\\backslash LX)$ with support $\\overline{LX}_\\lambda$;\n>\n> (iii) hence if $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)$, then $LX^{\\mathrm{sat}} = LX$, i.e. every $K$-orbit $LX_\\lambda$ lies in $LX^{\\mathrm{sat}}$ (Hecke saturation).\n\n## What changed\n\nThe title gains the word **set-theoretic**, because that is what the node establishes.\n\n$LX^{\\mathrm{sat}}$ keeps its name and is now declared for what the argument uses: a $K$-stable subset of the geometric points of $LX$, with no scheme structure and no closedness asserted.\n\nClause (i) becomes a containment of underlying sets, and clause (iii) becomes the orbitwise containment $|LX_\\lambda|\\subseteq LX^{\\mathrm{sat}}$ for every $\\lambda$ — which is the form the necessary half of [Q1](../../../../dag.html) actually consumes. Clause (ii) is unchanged in substance; the object it produces is the witness the deduction runs on.\n\nA new clause (iv) carries the upgrade the old statement claimed outright, as a conditional on the representability the node no longer assumes, and a closing paragraph records that (i)–(iii) do not use [the three standing hypotheses](../../../../appendix/assum-intro.html)(c).\n\nThe symbol $LX^{\\mathrm{sat}}$ is deliberately not renamed. [Q1-L3-a4](../Q1-L3-a4/index.html)(3) uses it \"as defined in [Q1-L3](../index.html)\" and asserts that in *that* case it is a proper closed subset — which remains true, since there it is a union of connected components — so the analogy node needs no amendment and keeps its link.\n\n## The three columns\n\n**Verified.**\n\nThe counterexample above, recomputed this run from the definition of the Zariski topology on $\\mathbb{A}^1$ and not taken from the passage.\n\nThe coherence argument for the witness of clause (ii): $\\overline{i}_\\lambda$ is a finitely presented closed embedding by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a)(1); base change against $!$-pullback holds for a finitely presented morphism with **no hypothesis on the other leg**, by [Raskin's pushforward entry](../../../../appendix/bb-raskin-fp-pushforward.html)(ii); so for a smooth test morphism $f\\colon T\\to K\\backslash LX$ with $T$ of finite type the pullback is $i_{\\lambda,T,*}\\omega_{Y_{\\lambda,T}}$ on a finite-type scheme, which is coherent. That is exactly the ratified finite-type reading of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html).\n\nThat [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) is unused by this node: its inputs are the Hecke action, the placid presentation (a), and a dimension theory (b) for the dualizing object of [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html); no clause invokes the unramified conjecture.\n\nThat BZSV state the converse as a consequence of their conjecture — read this run at BZSV (arXiv:2409.04677) p. 163: *\"In particular all sheaves on $X_F/G_O$ can be generated from the basic object through the action of Hecke functors\"*, and, the sentence after, that the local conjecture *\"guarantees that all sheaf theory on $X_F/G_O$ can be reduced using the Hecke action to inherently finite-dimensional calculations on $X_O$\"*. The passage's §6 reading of the literature is correct, and it has a consequence the passage did not draw — see the history entry.\n\n**Refuted.**\n\nThe setup clause as it stood: that ind-properness of the $m_\\mu$ makes $LX^{\\mathrm{sat}}$ a closed ind-subscheme. The inference is invalid.\n\nThe scheme-theoretic reading of clause (iii)'s conclusion: no support argument can prove it, whatever the closedness turns out to be.\n\n**Unverified, and therefore NOT asserted in the new statement.**\n\nWhether $LX^{\\mathrm{sat}}$ is closed, and whether it is representable by a reduced closed ind-subscheme. Split off as its own node this run.\n\nThe continuity input the passage's §2 leans on — that $x^!$ is exact and preserves arbitrary colimits on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, which is what carries the vanishing from the generators to the whole cocomplete subcategory they generate. The passage asserts it in one clause.\n\nThe repository does not have it: the stratumwise form is [Q1-L5-L3](../../Q1-L5/Q1-L5-L3/index.html), which is `failing`. Clause (i) is stated as before and this input is now cut out as a child, where it can be discharged or fail visibly rather than being assumed inside a proof.\n\nWhether clause (ii)'s witness argument survives the passage from $\\overline{LX}_\\lambda$ to the quotient $K\\backslash\\overline{LX}_\\lambda$: the base-change entry is stated for ind-schemes, and the test-morphism definition of coherence is stated for prestacks, so the reduction is plausible and is not written down anywhere in the closed world. Also cut out as a child.\n\n## Considered and not adopted\n\n**Deleting clause (iv) rather than making it conditional.** The passage recommends dropping the ind-scheme formulation entirely. But the upgrade is what a reader of [Q1](../../../../dag.html) will want as soon as the closedness is settled, and stating it as a conditional costs one sentence and makes the dependency visible on the DAG instead of leaving it in a referee's note. The node's own words now say that (i)–(iii) are free of it.\n\n**Renaming $LX^{\\mathrm{sat}}$ to $|LX|^{\\mathrm{sat}}$,** as the passage writes it. Rejected: [Q1-L3-a4](../Q1-L3-a4/index.html) links the symbol by name, and a rename buys notation where the fix wanted is a declaration. The set-level reading is stated where the symbol is coined instead.\n\n**Removing [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) from [Q1](../../../../dag.html)'s Setting,** which is where (c) reaches this node from — the node never declared it. Rejected as beyond this operator's reach: (c) is an appendix entry, the appendix is not `/update`'s to write, and (c) is the standing hypothesis of the whole manuscript. What is recorded instead is a scope sentence in this node's statement, a paragraph in [Q1](../../../../dag.html)'s **Problem statement** suspending (c) for the question, and a red priority row, since the finding is about the goal question and not about this node.\n";</script>
