<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q1-L3</a><i>›</i><span>u2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3 — update u2</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/updates/u2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L3](../index.html) · [history](../history.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html)\n\n**Date:** 2026-08-07 · **Operator:** `/update Q1-L3` · **Status before:** `open` · **Status after:** `open`\n\n## The defect, in one sentence\n\nClause (i) is assembled from [Q1-L3-L1](../Q1-L3-L1/index.html), [Q1-L3-L2](../Q1-L3-L2/index.html), [Q1-L3-L6](../Q1-L3-L6/index.html) and [Q1-L3-L3](../Q1-L3-L3/index.html) through two further inputs that no clause of the statement declares and no child of this node supplies — the identification of the coherent objects with the compact ones, and the closure of the support-bounded subcategories under small colimits — both of them asserted only inside the `## Decomposition` paragraph, which is prose about the reassembly and carries no prover, no critic and no dependency behind it.\n\n## Where each input is actually used\n\n[Q1-L3-L3](../Q1-L3-L3/index.html) concludes about $\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}$ — the **compact** objects of the generated subcategory. Clause (i) quantifies over $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$, which by the ratified reading of [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) is $\\mathcal{D}_c(K\\backslash LX)\\cap\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ — the **coherent** ones. Nothing joins the two quantifiers except the identification $\\mathcal{D}_c = (\\mathcal{D}^{\\mathrm{ren}})^{\\omega}$.\n\n[Q1-L3-L3](../Q1-L3-L3/index.html) is applied with $\\mathcal{S}_F := \\{\\mathcal{G}\\mid|\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F\\}$, and its hypothesis **(B)** asks each member to be closed under all small colimits formed in the ambient. Writing $j_F$ for the open complement of $Z_F$, the support convention of [Q1-L3-L2](../Q1-L3-L2/index.html)'s Setup makes $\\mathcal{S}_F=\\ker(j_F^{!})$, so the hypothesis is exactly continuity of $j_F^{!}$ on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. [Q1-L3-L1](../Q1-L3-L1/index.html) produces the sets $Z_F$ and their directedness and stops there; it is a statement about $|LX|$ and says nothing about sheaves.\n\n## The three columns\n\n**Verified.**\n\nThat the first input is established and available. [Q1-L2-L1](../../Q1-L2/Q1-L2-L1/index.html) is `proved` and its statement is the equality $\\mathcal{D}_c(\\mathcal{Y}) =_{\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})} (\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}))^{\\omega}$ for a prestack $\\mathcal{Y}$, closing on the sentence *\"This applies in particular to $\\mathcal{Y} = K\\backslash LX$ and to $\\mathcal{Y} = K\\backslash\\mathrm{Gr}$.\"* So the mathematics of the step is not in question; its **declaration** is what is missing, and the node it comes from is not among this node's `depends-on`.\n\nThat the second input is not established anywhere in the repository. The nearest statement is [Q1-L5-L3](../../Q1-L5/Q1-L5-L3/index.html)(2), which gives continuity of $i_{\\lambda,Z}^{!}$ for the **locally closed orbit** embeddings, not for the open complements $j_F$ of the saturation stages, and which is itself `failing`. Read this run: neither its clause 1 nor its clause 2 mentions an open immersion.\n\nThat [u1](u1.html) already knew. Its **Unverified** column names *\"that $x^!$ is exact and preserves arbitrary colimits on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, which is what carries the vanishing from the generators to the whole cocomplete subcategory they generate\"*, and says it *\"is now cut out as a child\"*. No child of this node carries it: the six are ind-properness, the bounded kernel, the abstract compactness lemma, the orbit witness, the ind-subscheme upgrade, and bounded generation. The commission was recorded and never carried out.\n\n**Refuted.**\n\nThe `## Decomposition`'s reading that the four children *are* clause (i). They are clause (i) **under** the two inputs above, and the paragraph's own phrase \"those four are clause (i)\" states otherwise.\n\n**Unverified, and therefore NOT asserted in the new statement.**\n\nWhether $j_F^{!}$ is continuous on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. For an open immersion $j$ one expects $j^{!}\\simeq j^{*}$ with $j^{*}$ left adjoint to $j_{*}$ and therefore cocontinuous; but the ambient here is the **renormalized** category, where a functor's continuity is a statement about its ind-extension and not inherited from the naive one, and the repository's one node in that shape is `failing`. Declared as hypothesis **(B)** rather than asserted.\n\n## What changed\n\nThe Setup gains two labelled hypothesis paragraphs, **(A)** and **(B)**, each naming where the input is established or that it is not. Clauses (i) and (iii) are stated **under (A) and (B)**; clauses (ii) and (iv) are untouched, (ii) because the witness argument uses neither and (iv) because it is already conditional on (iii).\n\nThe **Unconditionality** paragraph records that (A) and (B) are themselves free of [the three standing hypotheses](../../../../appendix/assum-intro.html)(c), so the necessary condition [Q1](../../../../dag.html) consumes stays independent of the unramified conjecture — it is now independent *and conditional*, which is a weaker readout and the true one.\n\nThe `## Decomposition` paragraph stops asserting the compactness identification in prose and points at **(A)** instead, and says in its own words that **(B)** is undischarged.\n\n## Considered and not adopted\n\n**Adding `depends-on: Q1-L2-L1` and dropping (A).** This is the right end state and it is not this operator's to write — edges belong to the lead-researcher ([ADR 0019](../../../../process/decisions/0019-the-update-operator.html)). Commissioned in §6 of this run. Declaring the hypothesis is what makes the debt visible **now**, and it stays correct after the edge lands: a hypothesis discharged by a declared dependency is how every other node in this subtree is written.\n\n**Cutting (B) out as a new child, as [u1](u1.html) said it would.** A node stating \"$j_F^{!}$ is continuous on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\" is worth having, and it is a `/decompose` and not an `/update`. Commissioned in §6. Until it exists, a declared hypothesis is strictly better than the status quo, where the same fact was assumed silently inside a paragraph no gate reads.\n\n**Weakening clause (i) to compact objects, so that (A) is not needed.** Rejected: clause (iii) is what [Q1](../../../../dag.html) consumes as its **necessary** condition, and it is stated for $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ because that is the category the question's equality is about. Restating the node in a category the question does not ask about would move the gap rather than close it.\n\n## Correction, same run: hypothesis (B) was itself overstated\n\nThe paragraph above under **Where each input is actually used** writes \"the support convention of [Q1-L3-L2](../Q1-L3-L2/index.html)'s Setup makes $\\mathcal{S}_F=\\ker(j_F^{!})$\", and the first draft of hypothesis **(B)** repeated it as an equivalence. That is wrong in one direction, and the lead-researcher of §6 caught it while writing the child this run commissioned.\n\nThe convention defines $|\\operatorname{supp}\\mathcal{G}|$ as the complement of the union of the open sub-ind-schemes on which the $!$-restriction of $\\mathcal{G}$ vanishes. So $j_F^{!}\\mathcal{G}=0$ makes $U_F$ one of those opens and gives $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F$ — that is $\\ker(j_F^{!})\\subseteq\\mathcal{S}_F$. The converse reads only that $U_F$ is **covered** by opens of vanishing, and passing from a cover to the union is Zariski-local vanishing for $\\mathcal{D}^!$, on the quotient $K\\backslash LX$ and for the equivariant restriction. Nothing in the appendix asserts it.\n\nThe direction that fails is the one the caller needs: a colimit of objects of $\\mathcal{S}_F$ is killed by $j_F^{!}$ only if each member is, so closure under colimits is argued through $\\ker(j_F^{!})$ and needs $\\mathcal{S}_F\\subseteq\\ker(j_F^{!})$.\n\n**(B)** is therefore stated as the colimit-closure itself, with the two things that would establish it named and separated — the locality, which is hypothesis (A) of [Q1-L3-L3-L1](../Q1-L3-L3/Q1-L3-L3-L1/index.html), and the continuity, which is its clause (1). Recorded here rather than silently fixed because a defect this run introduced and corrected within the run is still a defect the record should carry: the shape of it — an identification asserted in apposition to a definition, with no prover and no dependency behind it — is invariant I28's, which is the same shape this update was written to remove from the `## Decomposition` two paragraphs up.\n";</script>
