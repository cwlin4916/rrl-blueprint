l{D}_{c}(K\\backslash LX)$?](../../../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../../index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../../key_examples/k4.html), the symplectic period [K6](../../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../../key_examples/k9.html); and [K6](../../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It refines [Q1-L3-L3](../index.html). Its conclusion is required directly by [Q1-L3](../../index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-08 — what the run establishes about the node, which is that it is not bloated.** The write-up is dense rather than padded: the cut found **21 words** in 1495, and nothing at all under the run's other three headings — no repetition beyond the one re-derivation, no slop, no ornament. Of the 474 words above the 1000-word split signal, the `## Lemma` block accounts for 359 and is [`/update`](../../../../../process/pipeline/operators/update.html)'s to change, not a write-up's; the remaining sixteen steps average 62 words each and none is doing two jobs. **The length is the step count**, so the remedy is `/decompose` — and the drafting of [ADR 0083](../../../../../process/decisions/0083-tightening-is-its-own-operator.html) had asserted the opposite about this node, naming four facts as restatement where checking the entries shows only one is. That correction was made against the entries and is recorded in the ADR. **No appendix entry is owed by this run**: every cut landed against an entry already on disk.\n\n## Target statement\n\n**Setup.** In the standing setting of [context](../../../../../context.html). Let $Z\\subseteq|LX|$ be a closed $K$-stable subset and let $U_Z\\subseteq LX$ be the open sub-ind-scheme complementary to it, formed stagewise along the presentation $LX=\\varinjlim_\\lambda\\overline{LX}_\\lambda$ of [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a) by the orbit closures of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html) as\n\n$$\nU_Z \\; := \\; \\varinjlim_\\lambda\\left(\\overline{LX}_\\lambda\\smallsetminus Z\\right),\n$$\n\nwhich is $K$-stable because $Z$ is. Write $j_Z\\colon U_Z\\hookrightarrow LX$ for the open immersion and, by the same symbol, for the induced map $K\\backslash U_Z\\rightarrow K\\backslash LX$ of prestacks.\n\nFor $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)) write $|\\operatorname{supp}\\mathcal{G}|\\subseteq|LX|$ for the complement of the union of those open sub-ind-schemes $U\\subseteq LX$ whose $!$-restriction of $\\mathcal{G}$ vanishes — the support convention of the Setup of [Q1-L3-L2](../../Q1-L3-L2/index.html) — and put\n\n$$\n\\mathcal{S}_Z \\; := \\; \\left\\{\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ |\\operatorname{supp}\\mathcal{G}|\\subseteq Z\\right\\}.\n$$\n\nAssume:\n\n**(A) Vanishing propagates to the union.** For every $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and every closed $K$-stable $Z'\\subseteq|LX|$ with $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$, the restriction $j_{Z'}^{!}\\mathcal{G}$ built in clause (1) — which is itself free of this hypothesis — vanishes. The convention above makes $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$ say only that $U_{Z'}$ is *covered* by open sub-ind-schemes on which $\\mathcal{G}$ restricts to zero, so what is assumed here is that vanishing is local on $LX$ and survives the passage to the $K$-quotient. No entry of the appendix asserts it; it is assumed and not cited. The converse implication, that $j_{Z'}^{!}\\mathcal{G}=0$ forces $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$, is immediate from the convention and is not assumed.\n\nThen:\n\n**(1) Continuity.** $!$-restriction along $j_Z$ in the theory $\\mathcal{D}^!$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) carries $\\mathcal{D}_c(K\\backslash LX)$ into $\\mathcal{D}_c(K\\backslash U_Z)$ ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)), and its ind-extension — written $j_Z^{!}$ again, and the functor with which the support convention above is formed —\n\n$$\nj_Z^{!}\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash U_Z)\n$$\n\nis exact and preserves all small colimits.\n\n**(2) The support-bounded subcategory verifies hypothesis (B).** Under **(A)** one has $\\mathcal{S}_Z=\\ker\\left(j_Z^{!}\\right)$, and $\\mathcal{S}_Z$ is closed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ under shifts, under cofibres, under all small colimits formed there, and under retracts — the condition that hypothesis **(B)** of [Q1-L3-L3](../index.html) imposes on each member of its family. Hence, still under **(A)**, for every family $\\{Z_\\alpha\\}_{\\alpha\\in A}$ of closed $K$-stable subsets of $|LX|$ the full subcategories $\\{\\mathcal{S}_{Z_\\alpha}\\}_{\\alpha\\in A}$ meet that hypothesis; at the family $\\{Z_F\\}$ of [Q1-L3-L1](../../Q1-L3-L1/index.html)(3) this is hypothesis **(B)** of [Q1-L3](../../index.html).\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../../appendix/conj-intro.html) holds for $X$.\n\n- **note:** (a) is exactly the conclusion of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) for $X$ smooth affine spherical, so it is not an extra restriction in that generality; it is stated as an assumption because main.tex wants it available before the sheaf-theoretic section. (b) is what makes $\\mathcal{D}^!$ and $\\mathcal{D}^*$ agree ([sheaves on a placid ind-scheme](../../../../../appendix/ex-sheaf-placid-ind.html)). (c) is the input the whole paper is conditional on.\n\n**Key spherical varieties.** The class these hypotheses carve out is abstract, so the rows below fix the concrete $(G,X)$ this project keeps in mind — simplest first, then the two instructive ways to fall out of the class. \"(c)\" is hypothesis (c) above. The rows are orientation pointers, at the user's direction (2026-08-04): each writes its action out and its period name links to where the case is developed — the example node when the tree has one, the catalogue [known cases of the unramified equivalence](../../../../../appendix/exam-hyperspherical-duality.html) otherwise — but the duals, the hypotheses and the sources live in the catalogue and the nodes, never in a row, and no proof may cite one. [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html) fixes right actions; the two rows presented as left quotients say so and act by left translation.\n\n| $X$ | acted on by — the action | period | where (c) stands | in the tree |\n|---|---|---|---|---|\n| $G$ | $G\\times G$ — two-sided translation, $x\\cdot(g_1,g_2)=g_1^{-1}x\\,g_2$ | [group case](../../../Q1-e1/index.html) | **proved** — derived Satake [[bezrukavnikov2008equivariant, Thm 5](../../../../../../papers/bezrukavnikov2008equivariant.pdf)] | [Q1-e1](../../../Q1-e1/index.html) |\n| $\\mathbb{A}^1$ | $\\mathbb{G}_m$ — scaling, $x\\cdot t=tx$ | [Iwasawa–Tate](../../../Q1-e2/index.html) | **verified by hand** — [[BZSV, Ex. 7.6.1](../../../../../../papers/BZSV.pdf)] | [Q1-e2](../../../Q1-e2/index.html) |\n| $M_n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — two-sided translation on $n\\times n$ matrices, $m\\cdot(g_1,g_2)=g_1^{-1}m\\,g_2$ | [Godement–Jacquet](../../../Q1-e4/index.html) | **proved** — [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] | [Q1-e4](../../../Q1-e4/index.html) |\n| $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation on cosets, $\\mathrm{Sp}_{2n}x\\cdot g=\\mathrm{Sp}_{2n}xg$ | [symplectic (Jacquet–Rallis)](../../../Q1-e5/index.html); its dual is the Shalika side | **proved** — quaternionic Satake [[chen2022quaternionic](../../../../../../papers/chen2022quaternionic.pdf)]; the $B$-stabilizer connectedness of the standing class is not discharged in those sources | [Q1-e5](../../../Q1-e5/index.html) |\n| $(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation, $Hx\\cdot g=Hxg$ for $H=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ block-diagonal | [linear periods](../../../../../appendix/exam-hyperspherical-duality.html) | **upcoming** work of Chen–Yi; the orbit geometry is already in print ([Chen–Yi orbit parametrization](../../../../../appendix/bb-chenyi-symmetric-orbits.html)) | — |\n| $\\mathrm{SO}_{n-1}\\backslash(\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n)$ | $\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n$ — right translation, $Hx\\cdot g=Hxg$, where $H=\\mathrm{SO}_{n-1}$ sits diagonally, $h\\mapsto(h,h)$, via $\\mathrm{SO}_{n-1}\\subset\\mathrm{SO}_n$ | [Gan–Gross–Prasad / theta](../../../../../appendix/exam-hyperspherical-duality.html) | **proved** — [[BFT_orthosymplectic_satake](../../../../../../papers/BFT_orthosymplectic_satake.pdf)] | — |\n| rank-$1$ affine homogeneous $X=H\\backslash G$ | various $G$ — right translation, $Hx\\cdot g=Hxg$ | [rank one](../../../../../appendix/exam-hyperspherical-duality.html) | **proved under hypotheses** — [[devalapurkar2024kutheoreticspectraldecompositionsspheres, Table 4](../../../../../../papers/devalapurkar2024kutheoreticspectraldecompositionsspheres.pdf)] | — |\n| $G/_{\\psi}U$ | $G$ — left translation through $G/U$, $g:xU\\mapsto gxU$, $U$ maximal unipotent; the twist is the generic character $\\psi$ of $U$ | [Whittaker](../../../Q1-e3/index.html) | *outside the untwisted class* — twisted polarization; the equivalence per [[BZSV, §7.6.4](../../../../../../papers/BZSV.pdf)]; kept because it supplies [ABG](../../../../../appendix/bb-abg.html) at Iwahori level | [Q1-e3](../../../Q1-e3/index.html) |\n| $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | $\\mathrm{PSL}_2$ — left translation, $g:x\\,\\mathrm{PO}_2\\mapsto gx\\,\\mathrm{PO}_2$ | [boundary case](../../../Q1-e6/index.html) | *outside the class* — a type-$N$ spherical root breaks connected stabilizers, and the expected statement itself changes shape | [Q1-e6](../../../Q1-e6/index.html) |\n\nThe first four rows are where (c) is a theorem or a verified computation — the working instances of the standing class — with the linear periods next in line. $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, the linear periods and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ are symmetric, the territory where the [Chen–Yi orbit machinery](../../../../../appendix/bb-chenyi-symmetric-orbits.html) applies and [Q1-L6](../../../Q1-L6/index.html)'s induction closes. The last two rows are kept deliberately: Whittaker for the Iwahori-level black box it supplies, and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ because it shows clause (2) of [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html) is load-bearing.\n\n### [presentable categories](../../../../../appendix/conv-prl.html) — `Pr^L`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:243–249). $(\\mathrm{Pr}^L,\\otimes,\\mathrm{Ani})$ is the subcategory of $\\widehat{\\mathrm{Cat}}_\\infty$ spanned by presentable $\\infty$-categories and colimit-preserving functors, with the symmetric monoidal structure of [[HA, §4.8.1](../../../../../../papers/HA.pdf)] and unit $\\mathrm{Ani}$. $\\mathrm{Pr}^L_{\\mathrm{st}}\\hookrightarrow\\mathrm{Pr}^L$ is the full subcategory of presentable stable categories, whose induced structure is lax monoidal [[HA, Prop. 4.8.2.18](../../../../../../papers/HA.pdf)].\n\n### [compactly generated stable presentables](../../../../../appendix/def-stable-categories.html) — `def:stable_categories`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:540). $\\mathrm{Pr}^L_{\\mathrm{st},\\omega}\\hookrightarrow\\mathrm{Pr}^L$ is the full subcategory of compactly generated stable presentable categories.\n\n### [`DGCat`, `Vect`](../../../../../appendix/conv-dgcat.html) — $k$-linear categories\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:249–258). For $R$ an $\\mathbb{E}_\\infty$-ring spectrum, $\\mathrm{LMod}_R\\in\\mathrm{CAlg}(\\mathrm{Pr}^L)$ and $\\mathrm{LinCat}_R := \\mathrm{LMod}_{\\mathrm{LMod}_R}(\\mathrm{Pr}^L)$ is the $\\infty$-category of $R$-linear categories. Following [[GR17vol1](../../../../../../papers/GR17vol1.pdf)] we write\n\n$$\n\\mathrm{DGCat} := \\mathrm{LinCat}_k, \\qquad \\mathrm{Vect} := \\mathrm{LMod}_k,\n$$\n\nthe latter being the unit object.\n\n### [compact generation](../../../../../appendix/def-compactly-generated-category.html) — `def:compactly_generated_category`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:528). $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ is *compactly generated* if the following equivalent conditions hold:\n\n1. $\\mathcal{C}$ admits small filtered colimits and every object is a colimit of a small filtered diagram of compact objects;\n2. the natural functor $\\mathrm{Ind}(\\mathcal{C}^\\omega)\\rightarrow\\mathcal{C}$ is an equivalence.\n\nHere $\\mathrm{Ind}(\\mathcal{D})$, for $\\mathcal{D}$ small, is the ind-completion: it admits a map $\\mathcal{D}\\rightarrow\\mathrm{Ind}(\\mathcal{D})$ and small filtered colimits, and precomposition induces\n\n$$\n\\mathrm{Fun}^\\omega(\\mathrm{Ind}(\\mathcal{D}),\\mathcal{E})\\xrightarrow{\\ \\simeq\\ }\\mathrm{Fun}(\\mathcal{D},\\mathcal{E}),\n$$\n\n$\\mathrm{Fun}^\\omega$ denoting functors commuting with small filtered colimits [[HTT, §5.3](../../../../../../papers/HTT.pdf)].\n\n### [small relative tensor product](../../../../../appendix/def-small-relative-tensor.html) — `def:small_relative_tensor`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:562).\n\n1. $\\mathrm{Cat}^{\\mathrm{perf}}\\hookrightarrow\\mathrm{Cat}$ is the subcategory of small idempotent-complete stable $\\infty$-categories with exact functors.\n2. $\\mathrm{Cat}^{\\mathrm{perf}}$ is symmetric monoidal via $\\mathcal{A}\\otimes\\mathcal{B}\\simeq(\\mathrm{Ind}\\,\\mathcal{A}\\otimes\\mathrm{Ind}\\,\\mathcal{B})^\\omega$, giving a symmetric monoidal adjoint equivalence\n\n$$\n\\mathrm{Ind}\\colon (\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)\\rightleftarrows \\mathrm{Pr}^L_{\\mathrm{st},\\omega}\\colon (-)^\\omega .\n$$\n\n3. The relative tensor product in $\\mathrm{Cat}^{\\mathrm{perf}}$ is\n\n$$\n\\mathcal{M}\\otimes_{\\mathcal{A}}\\mathcal{N} := \\left(\\mathrm{Ind}\\,\\mathcal{M}\\otimes_{\\mathrm{Ind}\\,\\mathcal{A}}\\mathrm{Ind}\\,\\mathcal{N}\\right)^\\omega .\n$$\n\n4. For $R$ an $\\mathbb{E}_\\infty$-ring spectrum, $\\mathrm{Perf}(R)\\in\\mathrm{CAlg}(\\mathrm{Cat}^{\\mathrm{perf}})$ and $\\mathrm{Cat}^{\\mathrm{perf}}_R := \\mathrm{LMod}_{\\mathrm{Perf}(R)}(\\mathrm{Cat}^{\\mathrm{perf}})$.\n\n- **note:** $\\mathrm{Cat}^{\\mathrm{perf}}_R\\rightarrow\\mathrm{Cat}^{\\mathrm{perf}}$ preserves finite limits and colimits but *not* the monoidal structures.\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../../../appendix/conv-d-shriek-d-star.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), ratified at [Q1-L1](../../../Q1-L1/index.html).\n\n### [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html)); ratified at [Q1-L1](../../../Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n- **note:** this definition carries **no `\\label` in main.tex** — cite it as `main.tex:794`, never as a label, and do not invent one. It is the ambient category in which every Satake generation is formed; see [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) and [Q1-L1](../../../Q1-L1/index.html).\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../Q1-L3-L4/index.html) was refuted at [r1](../../Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../../appendix/ic-0.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{chen2022quaternionic,\n  title={Quaternionic Satake equivalence},\n  author={Chen, Tsao-Hsien and Macerato, Mark and Nadler, David and O'Brien, John},\n  journal={arXiv preprint arXiv:2207.04078},\n  year={2022}\n}\n\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@article{BravermanFinkelbergGinzburgTravkin_2021,\n   title={Mirabolic Satake equivalence and supergroups},\n   volume={157},\n   ISSN={1570-5846},\n   url={http://dx.doi.org/10.1112/S0010437X21007387},\n   DOI={10.1112/s0010437x21007387},\n   number={8},\n   journal={Compositio Mathematica},\n   publisher={Wiley},\n   author={Braverman, Alexander and Finkelberg, Michael and Ginzburg, Victor and Travkin, Roman},\n   year={2021},\n   month=jul, pages={1724–1765} }\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix=
