html), [compactly generated stable presentables](../../../../../appendix/def-stable-categories.html), [compact generation](../../../../../appendix/def-compactly-generated-category.html), [small relative tensor product](../../../../../appendix/def-small-relative-tensor.html); no `depends-on`. The last five are not in `objects:`.\n- **notation:** a *test* of a prestack $\\mathcal{Y}$ is a smooth $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a finite-type dg-scheme ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), ratified reading 1); $j_{Z,c}^{!}$ is clause (1)'s functor on coherent objects, before ind-extension.\n\n## Lemma\n\n**Setup.** In the standing setting of [context](../../../../../context.html). Let $Z\\subseteq|LX|$ be a closed $K$-stable subset and let $U_Z\\subseteq LX$ be the open sub-ind-scheme complementary to it, formed stagewise along the presentation $LX=\\varinjlim_\\lambda\\overline{LX}_\\lambda$ of [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a) by the orbit closures of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html) as\n\n$$\nU_Z \\; := \\; \\varinjlim_\\lambda\\left(\\overline{LX}_\\lambda\\smallsetminus Z\\right),\n$$\n\nwhich is $K$-stable because $Z$ is. Write $j_Z\\colon U_Z\\hookrightarrow LX$ for the open immersion and, by the same symbol, for the induced map $K\\backslash U_Z\\rightarrow K\\backslash LX$ of prestacks.\n\nFor $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)) write $|\\operatorname{supp}\\mathcal{G}|\\subseteq|LX|$ for the complement of the union of those open sub-ind-schemes $U\\subseteq LX$ whose $!$-restriction of $\\mathcal{G}$ vanishes — the support convention of the Setup of [Q1-L3-L2](../../Q1-L3-L2/index.html) — and put\n\n$$\n\\mathcal{S}_Z \\; := \\; \\left\\{\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ |\\operatorname{supp}\\mathcal{G}|\\subseteq Z\\right\\}.\n$$\n\nAssume:\n\n**(A) Vanishing propagates to the union.** For every $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and every closed $K$-stable $Z'\\subseteq|LX|$ with $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$, the restriction $j_{Z'}^{!}\\mathcal{G}$ built in clause (1) — which is itself free of this hypothesis — vanishes. The convention above makes $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$ say only that $U_{Z'}$ is *covered* by open sub-ind-schemes on which $\\mathcal{G}$ restricts to zero, so what is assumed here is that vanishing is local on $LX$ and survives the passage to the $K$-quotient. No entry of the appendix asserts it; it is assumed and not cited. The converse implication, that $j_{Z'}^{!}\\mathcal{G}=0$ forces $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$, is immediate from the convention and is not assumed.\n\nThen:\n\n**(1) Continuity.** $!$-restriction along $j_Z$ in the theory $\\mathcal{D}^!$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html) carries $\\mathcal{D}_c(K\\backslash LX)$ into $\\mathcal{D}_c(K\\backslash U_Z)$ ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)), and its ind-extension — written $j_Z^{!}$ again, and the functor with which the support convention above is formed —\n\n$$\nj_Z^{!}\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash U_Z)\n$$\n\nis exact and preserves all small colimits.\n\n**(2) The support-bounded subcategory verifies hypothesis (B).** Under **(A)** one has $\\mathcal{S}_Z=\\ker\\left(j_Z^{!}\\right)$, and $\\mathcal{S}_Z$ is closed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ under shifts, under cofibres, under all small colimits formed there, and under retracts — the condition that hypothesis **(B)** of [Q1-L3-L3](../index.html) imposes on each member of its family. Hence, still under **(A)**, for every family $\\{Z_\\alpha\\}_{\\alpha\\in A}$ of closed $K$-stable subsets of $|LX|$ the full subcategories $\\{\\mathcal{S}_{Z_\\alpha}\\}_{\\alpha\\in A}$ meet that hypothesis; at the family $\\{Z_F\\}$ of [Q1-L3-L1](../../Q1-L3-L1/index.html)(3) this is hypothesis **(B)** of [Q1-L3](../../index.html).\n\n## Proof\n\n**Step 1 — the naive $j_Z^{!}\\colon\\mathcal{D}^!(K\\backslash LX)\\rightarrow\\mathcal{D}^!(K\\backslash U_Z)$ is a morphism of $\\mathrm{DGCat}$.**\n\n<details><summary>the argument</summary>\n\nIt is the value on $j_Z$ of the functor $\\mathcal{D}^!\\colon\\mathrm{PreStk}^{op}\\rightarrow\\mathrm{DGCat}$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../../appendix/conv-d-shriek-d-star.html). An object of $\\mathrm{DGCat}$ ([`DGCat`, `Vect`](../../../../../appendix/conv-dgcat.html)) is tensored over $\\mathrm{Vect}$, hence pointed with invertible suspension $-\\otimes k[1]$, hence stable; its morphisms are those of $\\mathrm{Pr}^L$ ([presentable categories](../../../../../appendix/conv-prl.html)). The same holds of $f^{!}$ at every map $f$ of prestacks.\n\n</details>\n\n**Step 2 — $j_Z\\colon K\\backslash U_Z\\rightarrow K\\backslash LX$ is representable by open immersions, hence smooth.**\n\n<details><summary>the argument</summary>\n\nAn affine test $T\\rightarrow K\\backslash LX$ is a $K$-torsor $P\\rightarrow T$ with a $K$-equivariant $\\phi\\colon P\\rightarrow LX$; $P$ is affine, being fpqc-locally $K\\times T$ with $K=L^+G$ affine. So $\\phi$ factors through a stage $\\overline{LX}_\\lambda$ of the presentation of [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a) — fpqc-locally on $P$ at worst, which suffices because open immersions descend along fpqc covers — and there $P\\times_{LX}U_Z=\\phi^{-1}\\left(\\overline{LX}_\\lambda\\smallsetminus Z\\right)$ is open in $P$. Being $K$-stable ($\\phi$ is equivariant, $U_Z$ is $K$-stable), it descends along $P\\rightarrow T$ to an open subscheme of $T$ representing $T\\times_{K\\backslash LX}(K\\backslash U_Z)$; open immersions are smooth.\n\n</details>\n\n**Step 3 — $j_Z^{!}$ carries $\\mathcal{D}_c(K\\backslash LX)$ into $\\mathcal{D}_c(K\\backslash U_Z)$.**\n\n<details><summary>the argument</summary>\n\nLet $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)$ and let $g\\colon S\\rightarrow K\\backslash U_Z$ be a test. By Step 2 and stability of smoothness under composition, $j_Z\\circ g$ is smooth out of the same $S$: a test of $K\\backslash LX$. Functoriality of $\\mathcal{D}^!$ gives\n\n$$\ng^{!}j_Z^{!}\\mathcal{G}\\;\\simeq_{\\mathcal{D}(S)}\\;(j_Z\\circ g)^{!}\\mathcal{G},\n$$\n\na finite complex with coherent cohomology by [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) applied to $\\mathcal{G}$. As $g$ was arbitrary, $j_Z^{!}\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash U_Z)$.\n\n</details>\n\n**Step 4 — for $\\mathcal{Y}\\in\\{K\\backslash LX,\\,K\\backslash U_Z\\}$, $\\mathcal{D}_c(\\mathcal{Y})$ is a stable full subcategory of $\\mathcal{D}^!(\\mathcal{Y})$ closed under retracts.**\n\n<details><summary>the argument</summary>\n\nFor a test $f\\colon S\\rightarrow\\mathcal{Y}$ the functor $f^{!}$ is exact (Step 1), so it carries a shift, a cofibre or a retract diagram in $\\mathcal{D}^!(\\mathcal{Y})$ to one in $\\mathcal{D}(S)$. There the finite complexes with coherent cohomology are closed under all three: coherent $\\mathcal{D}_S$-modules are closed under kernels, cokernels and extensions, so a cofibre triangle's long exact sequence keeps the cohomology coherent and bounded, and each $H^i$ of a retract is a direct summand. Containing $0$ and closed under shifts and cofibres, $\\mathcal{D}_c(\\mathcal{Y})$ is stable.\n\n</details>\n\n**Step 5 — $\\mathcal{D}_c(\\mathcal{Y})$ is an object of $\\mathrm{Cat}^{\\mathrm{perf}}$.**\n\n<details><summary>the argument</summary>\n\nStable by Step 4. Idempotent-complete: $\\mathcal{D}^!(\\mathcal{Y})$ is presentable (Step 1), hence cocomplete and idempotent-complete, and a full subcategory closed under retracts inherits that. Small, as [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) presupposes in taking $\\mathrm{Ind}$ of it ([compact generation](../../../../../appendix/def-compactly-generated-category.html)). These are [small relative tensor product](../../../../../appendix/def-small-relative-tensor.html)(1)'s three conditions.\n\n</details>\n\n**Step 6 — $j_{Z,c}^{!}\\colon\\mathcal{D}_c(K\\backslash LX)\\rightarrow\\mathcal{D}_c(K\\backslash U_Z)$ is a morphism of $\\mathrm{Cat}^{\\mathrm{perf}}$.**\n\n<details><summary>the argument</summary>\n\nIt is defined by Step 3; by Step 4 finite limits and colimits in either $\\mathcal{D}_c$ are computed in the ambient $\\mathcal{D}^!$, where Step 1 has $j_Z^{!}$ preserving them. So it is exact — the condition [small relative tensor product](../../../../../appendix/def-small-relative-tensor.html)(1) puts on a morphism.\n\n</details>\n\n**Step 7 — $\\mathrm{Ind}\\left(j_{Z,c}^{!}\\right)\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash U_Z)$ preserves all small colimits.**\n\n<details><summary>the argument</summary>\n\nBy [small relative tensor product](../../../../../appendix/def-small-relative-tensor.html)(2), $\\mathrm{Ind}$ is a functor $\\mathrm{Cat}^{\\mathrm{perf}}\\rightarrow\\mathrm{Pr}^L_{\\mathrm{st},\\omega}$, so Steps 5 and 6 make it a morphism of $\\mathrm{Pr}^L_{\\mathrm{st},\\omega}$ ([compactly generated stable presentables](../../../../../appendix/def-stable-categories.html)), which preserves all small colimits by Step 1. Source and target are named by [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html).\n\n</details>\n\n**Step 8 — $\\mathrm{Ind}\\left(j_{Z,c}^{!}\\right)$ is *the* ind-extension of $j_{Z,c}^{!}$.**\n\n<details><summary>the argument</summary>\n\nIt preserves filtered colimits (Step 7) and restricts along $\\mathcal{D}_c\\rightarrow\\mathrm{Ind}\\,\\mathcal{D}_c$ to $j_{Z,c}^{!}$, that unit being an equivalence onto the compacts by the adjoint equivalence of Step 7. The universal property of [compact generation](../../../../../appendix/def-compactly-generated-category.html) makes it the unique such functor; it is what clause (1) calls $j_Z^{!}$.\n\n</details>\n\n**Step 9 — $j_Z^{!}$ on $\\mathcal{D}^{\\mathrm{ren}}$ is exact.**\n\n<details><summary>the argument</summary>\n\nFinite colimits are small ones, so by Step 7 it preserves the zero object and cofibres; hence it commutes with $[1]=\\operatorname{cofib}(-\\rightarrow 0)$, and with $[-1]$ because $[1]$ is an equivalence with that inverse. In a stable category a square is a pushout iff it is a pullback, so finite limits are preserved too. With Steps 3 and 7 this is clause **(1)**, and no step so far used hypothesis **(A)** — as **(A)**'s own proviso requires.\n\n</details>\n\n**Step 10 — $\\ker\\left(j_Z^{!}\\right)\\subseteq\\mathcal{S}_Z$, from the convention alone.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\n\\ker\\left(j_Z^{!}\\right)\\;:=\\;\\left\\{\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ j_Z^{!}\\mathcal{G}\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash U_Z)}0\\right\\}.\n$$\n\nThe presentation of [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a) by the closures of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html) gives $|LX|=\\bigcup_\\lambda|\\overline{LX}_\\lambda|$, so the Setup's stagewise $U_Z$ has $|U_Z|=|LX|\\smallsetminus Z$. If $j_Z^{!}\\mathcal{G}\\simeq 0$ then $U_Z$ is one of the opens whose union the convention takes the complement of — clause (1) names $j_Z^{!}$ as the functor forming that convention at $U_Z$ — whence $|\\operatorname{supp}\\mathcal{G}|\\subseteq|LX|\\smallsetminus|U_Z|=Z$.\n\n</details>\n\n**Step 11 — $\\mathcal{S}_Z\\subseteq\\ker\\left(j_Z^{!}\\right)$, by hypothesis (A).**\n\n<details><summary>the argument</summary>\n\nFor $\\mathcal{G}\\in\\mathcal{S}_Z$ apply **(A)** at $Z'=Z$, closed and $K$-stable by the Setup: it gives $j_Z^{!}\\mathcal{G}=0$. With Step 10,\n\n$$\n\\mathcal{S}_Z\\;=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\;\\ker\\left(j_Z^{!}\\right).\n$$\n\n</details>\n\n**Step 12 — $\\ker\\left(j_Z^{!}\\right)$ is closed under shifts.**\n\n<details><summary>the argument</summary>\n\nFor $\\mathcal{G}$ in it and $n\\in\\mathbb{Z}$,\n\n$$\nj_Z^{!}(\\mathcal{G}[n])\\;\\simeq\\;\\left(j_Z^{!}\\mathcal{G}\\right)[n]\\;\\simeq\\;0,\n$$\n\nexactness (Step 9) commuting with $[1]$ and $[-1]$.\n\n</details>\n\n**Step 13 — $\\ker\\left(j_Z^{!}\\right)$ is closed under cofibres.**\n\n<details><summary>the argument</summary>\n\nFor $u\\colon\\mathcal{G}\\rightarrow\\mathcal{G}'$ between objects of the kernel,\n\n$$\nj_Z^{!}\\operatorname{cofib}(u)\\;\\simeq\\;\\operatorname{cofib}\\left(j_Z^{!}u\\right)\\;\\simeq\\;\\operatorname{cofib}(0\\rightarrow 0)\\;\\simeq\\;0,\n$$\n\nagain by Step 9.\n\n</details>\n\n**Step 14 — $\\ker\\left(j_Z^{!}\\right)$ is closed under all small colimits formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.**\n\n<details><summary>the argument</summary>\n\nFor a small diagram $D\\colon I\\rightarrow\\ker\\left(j_Z^{!}\\right)$, Step 7 gives\n\n$$\nj_Z^{!}\\operatorname{colim}D\\;\\simeq\\;\\operatorname{colim}\\left(j_Z^{!}\\circ D\\right),\n$$\n\na colimit of zero objects. That colimit is zero: it corepresents $\\lim_{i}\\operatorname{Map}(0,-)=\\ast$, so it is initial.\n\n</details>\n\n**Step 15 — $\\ker\\left(j_Z^{!}\\right)$ is closed under retracts.**\n\n<details><summary>the argument</summary>\n\nAny functor preserves a retract diagram, so a retract $\\mathcal{G}'$ of $\\mathcal{G}$ in the kernel has $j_Z^{!}\\mathcal{G}'$ a retract of $0$; then $\\mathrm{id}_{j_Z^{!}\\mathcal{G}'}$ factors through $0$, which in a pointed category forces $j_Z^{!}\\mathcal{G}'\\simeq 0$. Steps 11–15 are the first two assertions of clause **(2)**: hypothesis **(B)** of [Q1-L3-L3](../index.html) at $\\mathcal{S}_Z$.\n\n</details>\n\n**Step 16 — the family clause, and its specialization.**\n\n<details><summary>the argument</summary>\n\nSteps 1–15 used of $Z$ only that it is a closed $K$-stable subset of $|LX|$, and **(A)** is quantified over all such $Z'$; so the argument applies to each member of a family $\\{Z_\\alpha\\}_{\\alpha\\in A}$ of them, and each $\\mathcal{S}_{Z_\\alpha}$ — full, being cut out by a condition on objects — meets that hypothesis. [Q1-L3-L1](../../Q1-L3-L1/index.html)(3) declares each $Z_F$ a closed $K$-stable subset of $|LX|$, so $\\{Z_F\\}$ is such a family; at it, closure of $\\mathcal{S}_F$ under all small colimits formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — Step 14 — is hypothesis **(B)** of [Q1-L3](../../index.html) verbatim, the two $\\mathcal{S}_F$ being one formula at $Z=Z_F$. $\\blacksquare$\n\n</details>\n\n## Caveats\n\nSmallness of $\\mathcal{D}_c(\\mathcal{Y})$ (Step 5) is read off [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) rather than proved; every use of $\\mathcal{D}^{\\mathrm{ren}}$ presupposes it.\n\nStep 16 takes from [Q1-L3-L1](../../Q1-L3-L1/index.html)(3), not a `depends-on` here, exactly one thing: that the $Z_F$ are closed and $K$-stable. Should that fail, the specialization is empty and the general clause untouched.\n";</script>
