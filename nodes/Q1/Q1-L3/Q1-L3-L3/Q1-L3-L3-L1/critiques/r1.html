<header class="bar"><nav class="crumbs"><a href="../../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../../index.html">nodes</a><i>›</i><a href="../../../index.html">Q1-L3</a><i>›</i><a href="../../index.html">Q1-L3-L3</a><i>›</i><a href="../index.html">Q1-L3-L3-L1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L3-L3-L1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L3/Q1-L3-L3-L1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nChecked and clean: statement diff (gate); hallucination sweep — all ten appendix links resolve, no bib key, no `main.tex` label, and zero occurrences of `Q1-L5` or of a `GAP:` marker; Steps 12–15 (shifts, cofibres, colimits, retracts) are correct as written. **Step 9's independence claim survives audit**: Steps 1–8 use functoriality of $\\mathcal{D}^!$, representability of $j_Z$, fpqc descent of *opens*, closure properties of coherent complexes and functoriality of $\\mathrm{Ind}$ — descent of geometry, never locality of vanishing of a sheaf. Clause (1) is genuinely constructed, the hard inclusion is genuinely charged to **(A)** at Step 11, and the draft never confuses the two. The findings below are all MINOR.\n\n**Flaw 1** [MINOR] [G] — Step 10 is the load-bearing *easy* inclusion — without it Step 14 does not return the colimit to $\\mathcal{S}_Z$ — and its whole warrant is the appositive inside clause (1), i.e. a piece of the conclusion used as a premise.\n\n<details><summary>(Step 10, \"clause (1) names $j_Z^{!}$ as the functor forming that convention at $U_Z$\") · the finding</summary>\n\nThe convention it must match is [Q1-L3-L2](../../../Q1-L3-L2/index.html)'s Setup, which names no target category and says nothing about ind-extensions, and the identification is a *choice*, not a forced reading: [$\\Delta_{\\lambda,a}$, the standard objects](../../../../../../appendix/not-standard-objects.html) already writes an unexplained $i_\\lambda^{!}\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ that is not built as an ind-extension. MINOR because the draft is transparent about its warrant and because the statement is authoritative for the prover; the fix is not the prover's — an appendix entry (or a ratified reading) fixing $!$-restriction on $\\mathcal{D}^{\\mathrm{ren}}$ along an open immersion is what discharges it, and until it exists clause (2) is contingent on a reading no entry supplies.\n\n</details>\n\n**Flaw 2** [MINOR] [N] (Setup, \"those open sub-ind-schemes $U\\subseteq LX$\") — The convention quantifies over *all* opens of $LX$, including non-$K$-stable ones, at which $K\\backslash U$ and hence clause (1)'s functor do not typecheck.\nHarmless here — a larger union only shrinks $|\\operatorname{supp}\\mathcal{G}|$, which is the direction Step 10 wants — but the quantifier should be restricted to $K$-stable $U$ by `/update` on the parent's Setup.\n**Flaw 3** [MINOR] [B] — The specialization to $\\{Z_F\\}$ takes from [Q1-L3-L1](../../../Q1-L3-L1/index.html)(3) exactly \"each $Z_F$ is closed and $K$-stable\", and that node is not in `depends-on`.\n\n<details><summary>(Step 16 and Caveat 2; the ruling the brief asked for) · the finding</summary>\n\nThis is bookkeeping, not an unchecked hypothesis: the general clause is proved for *every* closed $K$-stable family and is untouched, the borrowed fact is one clause quoted verbatim, and the consumer [Q1-L3](../../../index.html) already lists both nodes. The fix is one `depends-on` line, the lead-researcher's.\n\n</details>\n\n**Flaw 4** [MINOR] [N] — The draft never says whether $K\\backslash LX$ is the naive quotient prestack or its fppf stackification.\n\n<details><summary>(Step 2, \"An affine test $T\\rightarrow K\\backslash LX$ is a $K$-torsor $P\\rightarrow T$ …\") · the finding</summary>\n\nOnly for the latter is that the description of $T$-points; for the former the step is easier ($T\\times_{K\\backslash LX}(K\\backslash U_Z)=\\phi^{-1}(U_Z)$, since a $K$-stable open gives a monomorphism of quotient prestacks) and the fpqc-descent detour is not needed at all. One sentence fixing the reading makes the step self-contained. (Affineness of $P$ by effective fpqc descent for affine morphisms is correct and standard.)\n\n</details>\n\n**Flaw 5** [MINOR] [G] — Factoring a quasi-compact map through a single stage needs the presentation of [the three standing hypotheses](../../../../../../appendix/assum-intro.html)(a) to be directed, which presentation by orbit closures does not say; \"a finite union of stages\" is what is available and changes nothing downstream.\n\n<details><summary>(Step 2, \"So $\\phi$ factors through a stage $\\overline{LX}_\\lambda$\") · the finding</summary>\n\nLikewise $\\overline{LX}_\\lambda\\smallsetminus Z$ is open only because closed in $|LX|$ means closed in each stage — the colimit topology, unstated.\n\n</details>\n\n**Flaw 6** [MINOR] [B] — Latent inconsistency between two invoked entries, not a defect of the draft: `def:stable_categories` makes $\\mathrm{Pr}^L_{\\mathrm{st},\\omega}$ the **full** subcategory of $\\mathrm{Pr}^L$, under which `def:small_relative_tensor`(2)'s adjoint *equivalence* is false (one must restrict to functors preserving compacts).\n\n<details><summary>(Step 7, \"a subcategory of $\\mathrm{Pr}^L$\") · the finding</summary>\n\nBoth of the draft's uses — $\\mathrm{Ind}$ lands there with colimit-preserving morphisms, and $\\mathcal{D}\\simeq(\\mathrm{Ind}\\,\\mathcal{D})^\\omega$ at the object level in Step 8 — hold under either reading, so nothing here breaks; the two entries should be reconciled.\n\n</details>\n\n**Flaw 7** [MINOR] [G] (Step 5 and Caveat 1, \"Small, as presupposed by `def:renormalized`\") — Smallness is one of the three conditions of `def:small_relative_tensor`(1) and is the single hypothesis of an invoked entry that the draft checks by citation rather than argument.\nHonestly flagged, and repository-wide rather than local to this node.\n**Flaw 8** [MINOR] [B] (length) — 1483 words, well past the 1000-word split signal.\nSteps 4–8 prove a general fact — $\\mathrm{Ind}$ of an exact functor between the $\\mathcal{D}_c$'s of two prestacks is continuous — that would shorten this write-up and several others as one appendix entry.\nVERDICT: PASS\n";</script>
