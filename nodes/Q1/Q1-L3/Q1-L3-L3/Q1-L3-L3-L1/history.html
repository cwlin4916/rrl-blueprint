<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L3-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L3-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L3-L1 — history\n\n[Q1-L3-L3-L1](index.html) · [Q1-L3-L3](../index.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-07 — created** by §6 of `/update Q1-L3`, to discharge one named hypothesis for one named caller. [u2](../../updates/u2.html) declares as hypothesis **(B)** of [Q1-L3](../../index.html) that each support-bounded subcategory $\\mathcal{S}_F$ is closed under all small colimits formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, and records where it is used: [Q1-L3-L3](../index.html) is applied to the family $\\{\\mathcal{S}_F\\}$, and its own hypothesis **(B)** asks exactly that of each member. This node is that claim, stated for an arbitrary closed $K$-stable $Z\\subseteq|LX|$ so that the whole family is covered by one statement.\n- **2026-08-07 — why it sits under [Q1-L3-L3](../index.html) and is depended on by [Q1-L3](../../index.html).** [Q1-L3](../../index.html) already has ten direct children — Q1-L3-L1…L6 and Q1-L3-a1…a4 — and a container holds at most ten ([ADR 0050](../../../../../process/decisions/0050-a-node-has-at-most-ten-children.html)), so the directory goes under the sibling this claim was written to serve, which is ADR 0050's own remedy. The dependency does not follow the directory: [Q1-L3-L3](../index.html) is an abstract lemma that assumes its hypothesis **(B)** and is proved without this node, while [Q1-L3](../../index.html) is where this claim is consumed — it is that node's declared hypothesis **(B)** — so [Q1-L3](../../index.html) lists this node in `depends-on` and [Q1-L3-L3](../index.html) does not. Containment is not dependency ([ADR 0059](../../../../../process/decisions/0059-a-container-is-a-directory.html)).\n- **2026-08-07 — the edge was moved the same run, from [Q1-L3-L3](../index.html) to [Q1-L3](../../index.html).** §6 of `/update Q1-L3` commissioned this node with `required-by: Q1-L3-L3`; on the lead-researcher's objection the coordinator took the correction and the dependency was re-pointed, the directory staying where it was. Three reasons, all of them about the abstract statement above being untouched by the concrete one here: a write-up of [Q1-L3-L3](../index.html) may not cite a claim about $LX$, so an edge whose head the proof may not touch is a false edge; by the weakest-link rule it would have capped that node's confidence at an unproved dependency its argument never uses; and the ten-child cap counts directory containment rather than `depends-on`, so the move costs nothing against the cap that put the directory here.\n- **2026-08-07 — [u1](../../updates/u1.html) commissioned this a day earlier and nothing carried it out.** Its **Unverified** column names *\"that $x^!$ is exact and preserves arbitrary colimits on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, which is what carries the vanishing from the generators to the whole cocomplete subcategory they generate\"*, and says the input *\"is now cut out as a child\"*; no child of [Q1-L3](../../index.html) carries it, as [u2](../../updates/u2.html) verifies by walking the six. This node is that child, a day late.\n- **2026-08-07 — the two clauses are separated because they cost different things, and hypothesis (A) is not in the commission.** Shifts, cofibres and retracts follow from exactness of $j_Z^{!}$ alone; the colimits need clause (1), and clause (1) needs the renormalized form, since in [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) continuity is a property of an ind-extension and is not inherited from the naive functor — that is why the repository has [Q1-L5-L3](../../../Q1-L5/Q1-L5-L3/index.html) as a node rather than a remark, and that node is the adjacent statement for the locally closed orbit embeddings, not this one, and is `failing`. Writing the statement out exposed a third thing neither [u2](../../updates/u2.html) nor the commission anticipated: the support convention makes $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z$ a statement about a *union* of opens of vanishing, so the identification $\\mathcal{S}_Z=\\ker(j_Z^{!})$ — which both of them take for granted — needs vanishing to be local on $LX$ and to survive the $K$-quotient. It is declared as hypothesis **(A)** rather than assumed inside a proof.\n- **2026-08-07 — `proved` at [r1](critiques/r1.html), first round, eight MINOR flaws standing.** Created and proved the same day it was commissioned. The write-up (1483 words, sixteen steps) does the two things the commission asked and the referee confirmed both. **Hypothesis (A) is used at exactly one step**: Step 10 gets $\\ker(j_Z^{!})\\subseteq\\mathcal{S}_Z$ from the support convention alone, Step 11 gets the converse only by applying (A) at $Z'=Z$, and the hard direction is never disguised as the easy one. And **clause (1) is provably independent of (A)** — the referee checked Steps 1–8 use only functoriality of $\\mathcal{D}^!$, representability of $j_Z$ by open immersions, fpqc descent of opens, closure of finite-coherent complexes under shifts/cofibres/retracts, and functoriality of $\\mathrm{Ind}$, never locality of vanishing — so (A) is not self-supporting, which is what its own proviso requires. The ind-extension is constructed rather than assumed, through $\\mathrm{Ind}\\colon\\mathrm{Cat}^{\\mathrm{perf}}\\rightleftarrows\\mathrm{Pr}^L_{\\mathrm{st},\\omega}$, and identified as *the* ind-extension by a universal property.\n- **2026-08-07 — the standing flaw, and the entry that would close it.** [r1](critiques/r1.html) Flaw 1 (MINOR, kind `G`): the *easy* inclusion at Step 10 is warranted only by clause (1)'s own appositive — \"the functor with which the support convention is formed\" — which is a piece of the conclusion used as a premise. [Q1-L3-L2](../../Q1-L3-L2/index.html)'s Setup names no target category for its support convention, and the appendix elsewhere takes an unexplained $i_\\lambda^{!}$ on $\\mathcal{D}^{\\mathrm{ren}}$ that is **not** an ind-extension, so the identification is a choice no entry supplies. Scored MINOR because the statement is authoritative for a prover and the draft is transparent about its warrant; the durable fix is an appendix entry fixing $!$-restriction on $\\mathcal{D}^{\\mathrm{ren}}$ along an open immersion. Commissioned.\n- **2026-08-07 — an edge the referee ruled bookkeeping.** The closing specialization to $\\{Z_F\\}$ borrows one verbatim clause of [Q1-L3-L1](../../Q1-L3-L1/index.html)(3) — that those sets are closed and $K$-stable — while `Q1-L3-L1` is not in this node's `depends-on`. The referee ruled this bookkeeping and **not** a missing hypothesis (Flaw 3): the general clause is proved for every closed $K$-stable family, and the consumer [Q1-L3](../../index.html) already depends on both. One `depends-on` line, the lead-researcher's to write.\n- **2026-08-08 — `/tighten`, the operator's first run: 1495 → 1474 words, four cuts, no step touched, and the honest remedy is `/decompose`.** Four restatements of entries the write-up already links came out ([ADR 0083](../../../../../process/decisions/0083-tightening-is-its-own-operator.html)): Step 1's unpacking of $\\mathrm{DGCat}=\\mathrm{LMod}_{\\mathrm{Vect}}(\\mathrm{Pr}^L)$ and its derivation that morphisms of $\\mathrm{Pr}^L$ preserve small colimits, which [presentable categories](../../../../../appendix/conv-prl.html) gives by definition; Step 7's second derivation of the same fact; Step 5's gloss that $\\mathrm{Ind}$ is ind-completion of a small category, verbatim in [compact generation](../../../../../appendix/def-compactly-generated-category.html); and Step 8's reproduction of that entry's universal-property display. The `## Lemma` block is byte-identical at 3621 characters and all sixteen `**Step n**` headlines are unchanged, so [r1](critiques/r1.html)'s verdict still applies step for step and the status is untouched.\n- **2026-08-08 — what the run establishes about the node, which is that it is not bloated.** The write-up is dense rather than padded: the cut found **21 words** in 1495, and nothing at all under the run's other three headings — no repetition beyond the one re-derivation, no slop, no ornament. Of the 474 words above the 1000-word split signal, the `## Lemma` block accounts for 359 and is [`/update`](../../../../../process/pipeline/operators/update.html)'s to change, not a write-up's; the remaining sixteen steps average 62 words each and none is doing two jobs. **The length is the step count**, so the remedy is `/decompose` — and the drafting of [ADR 0083](../../../../../process/decisions/0083-tightening-is-its-own-operator.html) had asserted the opposite about this node, naming four facts as restatement where checking the entries shows only one is. That correction was made against the entries and is recorded in the ADR. **No appendix entry is owed by this run**: every cut landed against an entry already on disk.\n";</script>
