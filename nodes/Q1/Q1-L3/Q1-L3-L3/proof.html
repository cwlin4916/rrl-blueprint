<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L3</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L3 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L3 — A compact object of a subcategory generated by a directed family lies in one member\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), [compact objects](../../../../appendix/def-compact-objects.html), [`Ani`, `Map`](../../../../appendix/conv-anima.html). No `depends-on` node: this is a leaf.\n- **notation:** $\\mathcal{T}_0$ and $\\mathcal{L}$ are the auxiliary full subcategories of $\\mathcal{C}$ introduced in Steps 2 and 4; writing $x\\to y\\to z$ as a cofibre sequence means $z\\simeq_{\\mathcal{C}}\\mathrm{cofib}(x\\to y)$, equivalently $x\\simeq_{\\mathcal{C}}\\mathrm{fib}(y\\to z)$.\n\n## Lemma\n\nLet $\\mathcal{C}$ be a stable category admitting all small colimits, let $(A,\\le)$ be a directed partially ordered set, let $\\{\\mathcal{S}_\\alpha\\}_{\\alpha\\in A}$ be full subcategories of $\\mathcal{C}$, and let $S$ be a small set of objects of $\\mathcal{C}$. Assume:\n\n**(A) Monotonicity.** For $\\alpha\\le\\beta$ in $A$ one has $\\mathcal{S}_\\alpha\\subseteq\\mathcal{S}_\\beta$ as full subcategories of $\\mathcal{C}$.\n\n**(B) Each member is cocomplete, stable and retract-closed.** Each $\\mathcal{S}_\\alpha$ is closed in $\\mathcal{C}$ under shifts, under cofibres, under all small colimits formed in $\\mathcal{C}$, and under retracts.\n\n**(C) The generators are compact and covered.** Every $s\\in S$ is a compact object of $\\mathcal{C}$ in the sense of [compact objects](../../../../appendix/def-compact-objects.html) and lies in $\\mathcal{S}_{\\alpha}$ for some $\\alpha\\in A$.\n\nThen, with $\\langle S\\rangle_{\\mathcal{C}}$ the generated subcategory of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html),\n\n$$\n\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}\\ \\subseteq\\ \\bigcup_{\\alpha\\in A}\\mathcal{S}_\\alpha\n$$\n\nas full subcategories of $\\mathcal{C}$: every compact object of $\\mathcal{C}$ lying in $\\langle S\\rangle_{\\mathcal{C}}$ already lies in $\\mathcal{S}_\\alpha$ for a single $\\alpha\\in A$.\n\n## Proof\n\n**Step 1 — $\\mathcal{C}^{\\omega}$ contains $0$ and is closed under shifts, cofibres and fibres.**\n\n<details><summary>the argument</summary>\n\nCompactness is preservation of filtered colimits by $\\operatorname{Map}_{\\mathcal{C}}(c,-)\\colon\\mathcal{C}\\to\\mathrm{Ani}$, [compact objects](../../../../appendix/def-compact-objects.html). For $c=0$ that functor is constant at the point, and a filtered colimit of the constant diagram at the point is the point. For a shift, $\\operatorname{Map}_{\\mathcal{C}}(c[n],-)\\simeq\\operatorname{Map}_{\\mathcal{C}}(c,-)\\circ[-n]$, and $[-n]\\colon\\mathcal{C}\\to\\mathcal{C}$ is an equivalence, hence preserves filtered colimits. For a cofibre sequence $c_1\\to c_2\\to c_3$ with $c_1,c_2$ compact, $\\operatorname{Map}_{\\mathcal{C}}(c_3,-)$ is the pointwise pullback of $\\ast\\to\\operatorname{Map}_{\\mathcal{C}}(c_1,-)\\leftarrow\\operatorname{Map}_{\\mathcal{C}}(c_2,-)$, and filtered colimits in $\\mathrm{Ani}$ commute with finite limits; so $c_3$ is compact. Fibres are shifted cofibres.\n\n</details>\n\n**Step 2 — the finitely built subcategory $\\mathcal{T}_0$ consists of compact objects.**\n\n<details><summary>the argument</summary>\n\nLet\n\n$$\n\\mathcal{T}_0\\ :=\\ \\bigcap\\ \\bigl\\{\\ \\mathcal{E}\\subseteq\\mathcal{C}\\ \\text{full and closed under equivalence}\\ :\\ S\\cup\\{0\\}\\subseteq\\mathcal{E},\\ \\ \\mathcal{E}[\\pm1]\\subseteq\\mathcal{E},\\ \\ \\mathcal{E}\\ \\text{closed under cofibres}\\ \\bigr\\},\n$$\n\nso $\\mathcal{T}_0$ is itself such a subcategory and is the smallest one. Now $\\mathcal{C}^{\\omega}$ is one of the $\\mathcal{E}$: it contains $S$ by the compactness half of **(C)**, and contains $0$ and has both closure properties by Step 1. Hence $\\mathcal{T}_0\\subseteq_{\\mathcal{C}}\\mathcal{C}^{\\omega}$.\n\n</details>\n\n**Step 3 — every object of $\\mathcal{T}_0$ lies in a single member of the family.**\n\n<details><summary>the argument</summary>\n\nPut $\\mathcal{T}:=\\bigcup_{\\alpha\\in A}\\mathcal{S}_\\alpha$. It contains $S$ by the covering half of **(C)**; it contains $0$, since $A$ is nonempty and each $\\mathcal{S}_\\alpha$ is closed under the colimit of the empty diagram by **(B)**; it is closed under shifts, each $\\mathcal{S}_\\alpha$ being so by **(B)**. It is closed under cofibres: given $u\\to v$ with $u\\in\\mathcal{S}_\\alpha$ and $v\\in\\mathcal{S}_\\beta$, directedness of $A$ gives $\\gamma\\ge\\alpha,\\beta$, monotonicity **(A)** puts $u,v\\in\\mathcal{S}_\\gamma$, fullness puts the map there, and $\\mathcal{S}_\\gamma$ is closed under cofibres by **(B)**. So $\\mathcal{T}$ is one of the $\\mathcal{E}$ of Step 2, whence $\\mathcal{T}_0\\subseteq_{\\mathcal{C}}\\mathcal{T}$.\n\n</details>\n\n**Step 4 — the subcategory $\\mathcal{L}$ contains $S\\cup\\{0\\}$.**\n\n<details><summary>the argument</summary>\n\nLet $\\mathcal{L}\\subseteq\\mathcal{C}$ be the full subcategory on\n\n$$\n\\mathcal{L}\\ :=\\ \\bigl\\{\\ x\\in\\mathcal{C}\\ :\\ \\text{every}\\ g\\in\\operatorname{Map}_{\\mathcal{C}}(c,x)\\ \\text{with}\\ c\\in\\mathcal{C}^{\\omega}\\ \\text{admits}\\ c\\xrightarrow{\\,a\\,}t\\xrightarrow{\\,b\\,}x,\\ t\\in\\mathcal{T}_0,\\ ba\\simeq g\\ \\bigr\\}.\n$$\n\nFor $x=s\\in S$ take $t=s$, $a=g$, $b=\\mathrm{id}_s$; for $x=0$ take $t=0$. Both lie in $\\mathcal{T}_0$.\n\n</details>\n\n**Step 5 — $\\mathcal{L}$ is closed under shifts.**\n\n<details><summary>the argument</summary>\n\nLet $x\\in\\mathcal{L}$, $n\\in\\mathbb{Z}$, and $g\\colon c\\to x[n]$ with $c$ compact. Then $c[-n]$ is compact by Step 1, so $g[-n]\\colon c[-n]\\to x$ factors as $c[-n]\\xrightarrow{a}t\\xrightarrow{b}x$ with $t\\in\\mathcal{T}_0$; shifting by $n$ factors $g$ through $t[n]$, which lies in $\\mathcal{T}_0$.\n\n</details>\n\n**Step 6 — $\\mathcal{L}$ is closed under extensions.**\n\n<details><summary>the argument</summary>\n\nLet $x\\xrightarrow{f}y\\xrightarrow{p}z$ be a cofibre sequence with $x,z\\in\\mathcal{L}$, let $c\\in\\mathcal{C}^{\\omega}$ and $g\\colon c\\to y$. As $z\\in\\mathcal{L}$, $pg$ factors as $c\\xrightarrow{a}t\\xrightarrow{b}z$ with $t\\in\\mathcal{T}_0$. Set $c':=\\mathrm{fib}(a)$, with structure map $j\\colon c'\\to c$ and its nullhomotopy of $aj$; here $t$ is compact by Step 2, so $c'$ is compact by Step 1. Then $pgj\\simeq baj$ is null with that inherited nullhomotopy, and $\\operatorname{Map}_{\\mathcal{C}}(c',x)\\to\\operatorname{Map}_{\\mathcal{C}}(c',y)\\to\\operatorname{Map}_{\\mathcal{C}}(c',z)$ is a fibre sequence of anima, so the point $gj$ with that nullhomotopy lifts to $g'$ with $fg'\\simeq gj$. As $x\\in\\mathcal{L}$ and $c'$ is compact, $g'$ factors as $c'\\xrightarrow{a'}t'\\xrightarrow{b'}x$ with $t'\\in\\mathcal{T}_0$. Form the pushout\n\n$$\nt''\\ :=\\ t'\\sqcup_{c'}c\\qquad\\text{along}\\ a'\\colon c'\\to t'\\ \\text{and}\\ j\\colon c'\\to c .\n$$\n\nOpposite edges of a pushout square have equivalent cofibres, so $\\mathrm{cofib}(t'\\to t'')\\simeq_{\\mathcal{C}}\\mathrm{cofib}(j)\\simeq_{\\mathcal{C}}t$; rotating, $t''\\simeq_{\\mathcal{C}}\\mathrm{cofib}(t[-1]\\to t')$, and $t''\\in\\mathcal{T}_0$ because $\\mathcal{T}_0$ contains $t[-1]$ and $t'$ and is closed under cofibres. Finally the pushout gives $\\operatorname{Map}_{\\mathcal{C}}(t'',y)\\simeq\\operatorname{Map}_{\\mathcal{C}}(t',y)\\times_{\\operatorname{Map}_{\\mathcal{C}}(c',y)}\\operatorname{Map}_{\\mathcal{C}}(c,y)$, and $(fb',g)$ with the homotopy $(fb')a'=fg'\\simeq gj$ is a point of the target. The resulting $h\\colon t''\\to y$ restricts along the leg $c\\to t''$ to $g$, so $g$ factors through $t''\\in\\mathcal{T}_0$.\n\n</details>\n\n**Step 7 — $\\mathcal{L}$ is closed under filtered colimits formed in $\\mathcal{C}$.**\n\n<details><summary>the argument</summary>\n\nLet $x\\simeq_{\\mathcal{C}}\\mathrm{colim}_{i\\in I}x_i$ with $I$ filtered and each $x_i\\in\\mathcal{L}$, with structure maps $\\phi_i\\colon x_i\\to x$, and let $g\\colon c\\to x$ with $c$ compact. By [compact objects](../../../../appendix/def-compact-objects.html), $\\operatorname{Map}_{\\mathcal{C}}(c,x)\\simeq\\mathrm{colim}_i\\operatorname{Map}_{\\mathcal{C}}(c,x_i)$ in $\\mathrm{Ani}$, and $\\pi_0$ of a filtered colimit of anima is the colimit of the $\\pi_0$, so $g\\simeq\\phi_i g_i$ for some $i$ and $g_i\\colon c\\to x_i$. As $x_i\\in\\mathcal{L}$, $g_i$ factors through some $t\\in\\mathcal{T}_0$; then so does $g$.\n\n</details>\n\n**Step 8 — $\\mathcal{L}$ is a cocomplete stable subcategory of $\\mathcal{C}$.**\n\n<details><summary>the argument</summary>\n\nFor $x,y\\in\\mathcal{L}$ and $z=\\mathrm{cofib}(x\\to y)$, the rotated cofibre sequence $y\\to z\\to x[1]$ has outer terms in $\\mathcal{L}$ by Step 5, so $z\\in\\mathcal{L}$ by Step 6: with $0\\in\\mathcal{L}$ this makes $\\mathcal{L}$ a stable subcategory. A biproduct is the middle term of the split cofibre sequence $x\\to x\\oplus y\\to y$, so Step 6 gives finite coproducts, hence pushouts, $x\\sqcup_w y\\simeq_{\\mathcal{C}}\\mathrm{cofib}(w\\to x\\oplus y)$, hence all finite colimits. Step 7 gives filtered colimits, and a small colimit in $\\mathcal{C}$ is the filtered colimit, over the finite subcomplexes of the indexing diagram, of the finite colimits they index.\n\n</details>\n\n**Step 9 — $\\langle S\\rangle_{\\mathcal{C}}\\subseteq_{\\mathcal{C}}\\mathcal{L}$.**\n\n<details><summary>the argument</summary>\n\nBy [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), $\\langle S\\rangle_{\\mathcal{C}}$ is the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing $S$; Steps 4 and 8 exhibit $\\mathcal{L}$ as one such. This is the minimality half of that entry, which carries no hypothesis beyond the colimits it names — in particular $\\mathcal{C}$ is not required to be presentable.\n\n</details>\n\n**Step 10 — conclusion.**\n\n<details><summary>the argument</summary>\n\nLet $x\\in\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}$. By Step 9, $x\\in\\mathcal{L}$; applying the defining property of $\\mathcal{L}$ to $\\mathrm{id}_x\\in\\operatorname{Map}_{\\mathcal{C}}(x,x)$, legitimate because $x$ is compact, gives $t\\in\\mathcal{T}_0$ and $x\\xrightarrow{a}t\\xrightarrow{b}x$ with $ba\\simeq\\mathrm{id}_x$, i.e. $x$ is a retract of $t$ in $\\mathcal{C}$. By Step 3 there is a single $\\alpha\\in A$ with $t\\in\\mathcal{S}_\\alpha$, and $\\mathcal{S}_\\alpha$ is closed under retracts by **(B)**, so $x\\in\\mathcal{S}_\\alpha\\subseteq\\bigcup_{\\beta\\in A}\\mathcal{S}_\\beta$. $\\blacksquare$\n\n</details>\n\n## Caveats\n\n**$A$ is nonempty.** This is part of \"directed\" as standardly defined, and it is automatic from **(C)** as soon as $S\\neq\\emptyset$. It is not decorative: for $S=A=\\emptyset$ one has $\\langle\\emptyset\\rangle_{\\mathcal{C}}=_{\\mathcal{C}}\\{0\\}$ with $0$ compact, while the right-hand side is empty.\n\n**Which part of (B) is consumed.** Only closure of each $\\mathcal{S}_\\alpha$ under shifts, cofibres, retracts and the empty colimit is used — in Steps 3 and 10. Closure under infinite colimits is never invoked, since $\\mathcal{T}_0$ is built by finite operations alone; a caller who can supply only the finite closure still gets the conclusion.\n";</script>
