<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L3</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L3 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L3-L3\n\n[node](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L3-L3](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nEVIDENCE: precedent\n\n**The pieces matched below.** (Amb) $\\mathcal{C}$ stable with all small colimits — *not*\nassumed compactly generated; (A) monotone family over a directed $(A,\\le)$; (B) each\n$\\mathcal{S}_\\alpha$ closed under shifts, cofibres, all small colimits formed in\n$\\mathcal{C}$, and retracts; (C) $S$ a small set of $\\mathcal{C}$-compact objects, each in\nsome $\\mathcal{S}_\\alpha$; (Concl) $\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}\n\\subseteq\\bigcup_\\alpha\\mathcal{S}_\\alpha$. It is useful to split (Concl) at the thick\nclosure $\\mathrm{thick}_{\\mathcal{C}}(S)$ — smallest subcategory containing $S$ and closed\nunder shifts, cofibres, retracts:\n\n$$\n\\text{(Concl-thick)}\\quad \\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}\\subseteq\\mathrm{thick}_{\\mathcal{C}}(S),\n\\qquad\n\\text{(Concl-abs)}\\quad \\mathrm{thick}_{\\mathcal{C}}(S)\\subseteq\\bigcup_{\\alpha}\\mathcal{S}_\\alpha .\n$$\n\n**The dictionary** (used only by hit 1, which is triangulated rather than stable). $\\mathcal{C}$\nstable with small colimits $\\mapsto h\\mathcal{C}$ triangulated with small coproducts;\n$\\mathcal{C}^{\\omega}\\mapsto(h\\mathcal{C})^{c}$ (Neeman Def. 1.1, printed p. 551; compactness is detected\non $h\\mathcal{C}$, [[GR17vol1, Ch. 1, §7.1.1](../../../../../papers/GR17vol1.pdf)]: preserving filtered colimits $\\Leftrightarrow$\npreserving direct sums); [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html)\n$\\langle S\\rangle_{\\mathcal{C}}\\mapsto$ smallest *localising* subcategory of $h\\mathcal{C}$\ncontaining $S$ (Neeman Def. 1.3); hypothesis (B) $\\mapsto$ *épaisse* subcategory (Neeman,\nIntroduction p. 547). **What it drops:** all higher coherence, and the identification\n$h\\langle S\\rangle_{\\mathcal{C}}=\\mathrm{Loc}_{h\\mathcal{C}}(S)$ is routine but is stated in\nneither source — I supply it, so treat that line as constructed, not cited.\n\n## Precedent\n\n**What was searched.** Local library first: `GR17vol1.pdf` Ch. 1 §§5.4, 7.1–7.4 (pp. 55, 64–70)\nand `HTT.pdf` §§4.4.5, 5.1.4 (pp. 305–313, 321) read on the page. Then the triangulated\nliterature: Neeman's 1992 *Ann. Sci. ENS* paper (full text fetched from Numdam, §§1–2 read),\nand the Stacks Project §13.37 *Compact objects* (tags 09SM, 09SN, 09SP). Queries were for the\nThomason–Neeman form \"compacts of the localizing subcategory generated by compacts = thick\nclosure\", and separately for any statement about a *directed family of subcategories*.\n*Second pass, same day:* `GR17vol1.pdf` Ch. 1 §7 re-read on the page (printed pp. 64–70:\nDef. 7.1.3, Lemma 7.2.2, Lemma 7.2.4(1)–(3'), Cor. 7.2.7, Prop. 7.3.2, Prop. 7.4.2) and Neeman's\npaper read at printed pp. 550–557 (Thm 2.1 in both its statements, Def. 1.1, Ex. 1.2, Def. 1.3,\nLemma 1.5, Constr. 1.6, Cor. 0.9, Cor. 0.10, Lemmas 2.2–2.5). Every Neeman and [[GR17vol1](../../../../../papers/GR17vol1.pdf)] number\nbelow has now been seen on the page, and the one correction and three additions that pass produced\nare folded in above; the four [[HTT](../../../../../papers/HTT.pdf)] numbers in the redundancy paragraph are the first pass's and\nwere **not** re-verified on this one.\n\n**What was found.**\n\n1. **Neeman, Lemma 2.2 with Lemma 2.3** (pp. 555–556), in *The connection between the K-theory\n   localization theorem of Thomason, Trobaugh and Yao and the smashing subcategories of\n   Bousfield and Ravenel*, Ann. Sci. É.N.S. **25** (1992) 547–566. Lemma 2.2 verbatim: \"*The\n   category $\\mathcal{R}^{c}$ is contained in $\\mathcal{S}^{c}$. In fact, more is true. The\n   category $\\mathcal{R}^{c}$ is the smallest épaisse subcategory containing R.*\" Lemma 2.3\n   (printed p. 556, re-read on the page this run) is stated under exactly \"*Let $\\mathcal{S}$ be a\n   triangulated category closed under the formation of coproducts. Let R be a set of objects in\n   $\\mathcal{S}^{c}$, closed under suspension. Let $\\mathcal{R}$ be the localising subcategory of\n   $\\mathcal{S}$ generated by R. Let $\\langle R\\rangle$ be the épaisse subcategory of $\\mathcal{S}$\n   generated by R*\", and the text between the two reads \"*Thus Lemma 2.2 is an immediate\n   consequence of Lemma 2.3*\", with the deduction printed in full.\n   **Direction: strictly stronger than (Concl-thick).** Under the dictionary, $\\mathcal{R}=\n   \\langle S\\rangle_{\\mathcal{C}}$ and Neeman's $\\mathcal{R}^{c}$ (compact *in* $\\mathcal{R}$)\n   contains $\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}$, so the lemma gives\n   (Concl-thick) with room to spare, and gives it as an equality.\n   **Ambient compact generation:** Lemma 2.3 does not assume it; Lemma 2.2 sits under\n   Theorem 2.1's standing hypotheses, which do ($\\mathcal{S}^{c}$ small and localising-generating),\n   but its printed proof invokes only Construction 1.6, Lemma 1.5 and Lemma 2.3, none of which\n   carry it. So this route matches (Amb) as the node states it.\n   **What it does not reach:** (A), (B) and (Concl-abs) — nothing in the paper concerns a family\n   of subcategories. Also needs $S$ closed under suspension, a harmless normalisation here since\n   (B) closes each $\\mathcal{S}_\\alpha$ under shifts.\n   `refs.bib`: **absent** (no key for Neeman 1992).\n\n2. **Gaitsgory–Rozenblyum, [[GR17vol1](../../../../../papers/GR17vol1.pdf)], Ch. 1, Lemma 7.2.4 (1'') and (3)** (printed pp. 65–66).\n   (3): a full subcategory $\\mathbf{C}^{0}\\subset\\mathbf{C}^{c}$ that generates $\\mathbf{C}$\n   induces an equivalence $\\mathrm{Ind}(\\mathbf{C}^{0})\\to\\mathbf{C}$; (1''): \"*Any compact object\n   in $\\mathrm{Ind}(\\mathbf{C}^{0})$ is a direct summand of one in the essential image*\".\n   **Direction: entails (Concl-thick)**, applied to $\\mathbf{C}=\\langle S\\rangle_{\\mathcal{C}}$\n   and $\\mathbf{C}^{0}$ the smallest stable subcategory containing $S$.\n   **What it does not reach:** (A), (B), (Concl-abs); and it is *weaker on (Amb)* than hit 1 —\n   GR17's \"cocomplete\" carries the standing convention \"we will always assume that they are\n   presentable\" (footnote 8, printed p. 51), so this route silently wants\n   $\\langle S\\rangle_{\\mathcal{C}}$ presentable, which the node does not state. Neeman's route\n   needs only coproducts.\n\n3. **Stacks Project, Lemma 13.37.4 (tag 09SP)**, under Lemma 13.37.3 (tag 09SN: \"$\\mathcal{D}$\n   a triangulated category with direct sums, $E_i$, $i\\in I$, a family of compact objects such\n   that $\\bigoplus E_i$ generates $\\mathcal{D}$\"): a map from a compact $C$ into a stage $X_n$\n   \"*factors $C\\to E\\to X_n$ where $E$ is an object of $\\langle E_{i_1}\\oplus\\ldots\\oplus\n   E_{i_t}\\rangle$ for some $i_1,\\ldots,i_t\\in I$*\".\n   **Direction: a partial match on (Concl-thick)** — it is exactly the *finitely many generators*\n   half, which is what (A) then converts into a single $\\alpha$. It is a factorisation, not a\n   membership, and it assumes the $E_i$ compactly generate the ambient, which the node does not.\n\n**What was not found.** No source states the node in its own packaging — a **directed family of\nsubcategories of one ambient $\\mathcal{C}$**, with $\\bigcup_\\alpha\\mathcal{S}_\\alpha$ *not*\nassumed to exhaust $\\langle S\\rangle_{\\mathcal{C}}$. The natural home would have been\n[[GR17vol1](../../../../../papers/GR17vol1.pdf)] Ch. 1 §7.2.6–7.2.8, which treats the neighbouring situation (a filtered *colimit of\ncategories*, Cor. 7.2.7) and never the subcategory form; and Neeman §2, which treats one\nlocalising subcategory. So (Concl-abs) — three lines from (A) and (B) — is in print nowhere I\nlooked, and the node is a corollary of hit 1 rather than a lemma needing its own argument.\n\n**One hypothesis is redundant, not wrong.** (B)'s \"and under retracts\" follows from the rest of\n(B): a retract diagram in $\\mathcal{C}$ extends to a strong retraction diagram [[HTT, Cor. 4.4.5.7](../../../../../papers/HTT.pdf)],\nthe retract is then the colimit of $X\\xrightarrow{e}X\\xrightarrow{e}\\cdots$ [[HTT, Prop. 4.4.5.12\nwith Rem. 4.4.5.18](../../../../../papers/HTT.pdf)], and $\\mathcal{S}_\\alpha$ is closed under that colimit; cf. [[HTT,\nCor. 4.4.5.15](../../../../../papers/HTT.pdf)]. This is a referral to the critic about economy of hypotheses, not about truth.\nThe same redundancy is in print on the triangulated side, older and with the swindle written out:\nNeeman, Construction 1.6 (printed p. 553), \"*It is relatively trivial to show that $\\mathcal{R}$ is\népaisse (every localising subcategory is)*\", proved by taking the hocolim of $r\\xrightarrow{e}\nr\\xrightarrow{e}\\cdots$, \"*since the construction of the hocolim involves only coproducts and\ntriangles on objects of $\\mathcal{R}$*\"; attributed there to Bökstedt–Neeman, *Homotopy limits in\ntriangulated categories*, Compositio Math. **86** (1993) 209–234, Remark 1.4 and §3 (`refs.bib`:\nabsent). What the clause would have bought without (B)'s coproducts is measured exactly: Neeman\nCor. 0.10 (printed p. 550, credited to Thomason and Trobaugh) — for a full triangulated\n$\\mathcal{S}\\subseteq\\mathcal{T}$ with épaisse closure $\\mathcal{T}$, an object $X$ lies in\n$\\mathcal{S}$ **iff** its class in $K_{0}(\\mathcal{T})/K_{0}(\\mathcal{S})$ vanishes. So\nretract-closure is a genuine $K_{0}$ obstruction in general, and it is closure under coproducts,\nnot the clause, that kills it here.\n\n## Instances\n\n### 1. A one-member family — instance\n\n**What it is.** $A=\\{\\ast\\}$, one subcategory $\\mathcal{S}$; $\\mathcal{C}$, $S$ arbitrary\nsubject to (C).\n\n**Why it is an instance.** (A) vacuous; (B) as given; (C) as given.\n\n**What it matches.** The full conclusion under the specialisation $|A|=1$. It does **not**\nreach the compactness clause of (C) or the force of (A): $\\mathcal{S}$ is itself a cocomplete\nstable subcategory containing $S$, so $\\langle S\\rangle_{\\mathcal{C}}\\subseteq\\mathcal{S}$ by\nminimality of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) and compactness is unused.\n\n**What the statement says here.** $\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}\n\\subseteq\\mathcal{S}$ — true, and true without hypothesis (C)'s compactness.\n\n**Source.** None needed *(constructed, unsourced)*.\n\n### 2. Perfect complexes over $k[x]$ along an exhausting chain of finite point sets — instance\n\n**What it is.** $\\mathcal{C}=\\mathcal{D}(k[x])$; $A=\\mathbb{N}$; $Z_n=\\{1,\\dots,n\\}\\subset\n\\mathbb{A}^{1}$ and $\\mathcal{S}_n=\\mathcal{D}_{Z_n}(k[x])$ the complexes with cohomology\nsupported in $Z_n$; $S=\\{k[x]/(x-m)\\}_{m\\ge1}$.\n\n**Why it is an instance.** (Amb): $\\mathcal{D}(k[x])$ is stable and cocomplete. (A): $Z_n\\subseteq\nZ_{n+1}$, so the $\\mathcal{S}_n$ increase along the directed $\\mathbb{N}$. (B): support is read\noff cohomology, so $\\mathcal{S}_n$ is closed under shifts, cofibres, arbitrary direct sums and\nretracts. (C): each $k[x]/(x-m)$ has the length-one free resolution $k[x]\\xrightarrow{x-m}k[x]$,\nhence is perfect, hence compact (Stacks Project, §15.80, tag 07LQ, *Characterizing perfect\ncomplexes*), and lies in $\\mathcal{S}_m$.\n\n**What it matches.** The whole statement, and it is the smallest instance in which (A) and the\ncompactness clause of (C) both do work. It does not test the non-noetherian or non-affine\ndirections, and the family here is a chain, not a general directed poset.\n\n**What the statement says here.** Every perfect complex lying in the localising subcategory\ngenerated by $\\{k[x]/(x-m)\\}_{m\\ge1}$ has support in finitely many of the points $1,2,3,\\dots$\nThe witness that this needs compactness: $\\bigoplus_{m\\ge1}k[x]/(x-m)$ lies in that localising\nsubcategory with support the whole of $\\{1,2,\\dots\\}$, and lies in no $\\mathcal{S}_n$ — it is\nnot perfect, its cohomology not being finitely generated. Drop \"compact\" from (Concl) and the\nstatement is false; this is the boundary case for hypothesis (C).\n\n**Source.** Stacks Project, §15.80 (tag 07LQ) for perfect $=$ compact; independently, and read on\nthe page this run, Neeman, Example 1.2 (printed p. 551): \"*If X is a quasi-compact, separated\nscheme and $\\mathcal{T}$ is the derived category of the category of quasicoherent sheaves on X,\nthen $\\mathcal{T}^{c}$ is the full subcategory of all perfect complexes*\", which is this case at\n$X=\\mathbb{A}^{1}$. The rest is a check by hand *(constructed, unsourced)*. `refs.bib`: absent.\n\n### 3. Filtered colimits of compactly generated categories — analogue, not an instance\n\n**What it is.** *This is an analogue.* [[GR17vol1](../../../../../papers/GR17vol1.pdf)], Ch. 1, Cor. 7.2.7 (printed p. 66): for a\nfiltered diagram $\\mathbf{C}_{\\mathbf{I}}$ of compactly generated cocomplete stable categories\nwith compactness-preserving transition functors,\n$\\mathrm{Ind}(\\mathrm{colim}_{\\mathbf{I}}\\mathbf{C}^{c}_{\\mathbf{I}})\\to\\mathbf{C}_{\\ast}$ is an\nequivalence and $\\mathbf{C}_{\\ast}$ is compactly generated by the images of the\n$\\mathbf{C}^{c}_{i}$.\n\n**Why it is not an instance.** Its objects are a diagram of *separate* categories, not\nsubcategories of one $\\mathcal{C}$; hypotheses (A)–(C) are not what it assumes.\n\n**What it matches.** (Concl-thick)+(Concl-abs) *combined*, under the dictionary\nstage $\\mathbf{C}_i\\mapsto$ member $\\mathcal{S}_\\alpha$, transition functor $\\mapsto$ inclusion,\n$\\mathbf{C}_{\\ast}\\mapsto\\langle S\\rangle_{\\mathcal{C}}$: with Lemma 7.2.4(1'') it says every\ncompact of the colimit is a retract of a compact from a single stage. Three places the\ncorrespondence stops. (i) It requires the stages to *exhaust* the colimit; in the node\n$\\bigcup_\\alpha\\mathcal{S}_\\alpha$ is generally a proper subcategory of\n$\\langle S\\rangle_{\\mathcal{C}}$, which is the whole reason the conclusion is restricted to\ncompact objects. (ii) Compactness in the node is measured in $\\mathcal{C}$, not in the union.\n(iii) It imposes compact generation on every stage and compactness-preservation on every\ntransition; hypothesis (B) imposes neither.\n\n**What the statement says here.** For an exhausting family: the compacts of the union are\nretracts of compacts of the stages, one stage at a time.\n\n**Source.** Gaitsgory, Rozenblyum, *A Study in Derived Algebraic Geometry I*, 2017 — Ch. 1,\nCor. 7.2.7 and Lemma 7.2.4. `refs.bib`: `GR17vol1`.\n\n### 4. The Hecke support filtration on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — instance\n\n**What it is.** $\\mathcal{C}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\n([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)); $A$ the finite subsets of\n$\\Lambda^{+}$ under inclusion; $\\mathcal{S}_F$ the objects supported in $Z_F=\\bigcup_{\\mu\\in\nF}|m_\\mu(\\overline{LG}_\\mu\\times^{K}L^{+}X)|$; $S$ the Hecke generators\n$\\mathcal{F}\\ast\\mathrm{IC}_0$ of\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html).\n\n**Why it is an instance.** (A) is the directedness of finite subsets. (B) and (C) are **not\ndischarged from the literature here**: that each $\\mathcal{S}_F$ is closed under the colimits\nof $\\mathcal{D}^{\\mathrm{ren}}$, and that each $\\mathcal{F}\\ast\\mathrm{IC}_0$ is coherent and\nlands in a single $Z_\\mu$, are what the sibling nodes [Q1-L3-L1](../Q1-L3-L1/index.html)\nand [Q1-L3-L2](../Q1-L3-L2/index.html) assert, and both are open.\n\n**What it matches.** The whole statement, under the specialisation above. It reaches none of the\nhypotheses on its own — it is the intended application, listed so the reader sees what the\nabstract hypotheses are shaped for.\n\n**What the statement says here.** Every coherent object of the Satake subcategory is supported\ninside a *single* $Z_F$, hence inside $LX^{\\mathrm{sat}}$ — clause (i) of\n[Q1-L3](../index.html).\n\n**Source.** No published source; the discharge is internal to this blueprint and unproved.\n\n### 5. A two-element antichain — boundary case, hypothesis (A) fails\n\n**What it is.** $\\mathcal{C}=\\mathcal{D}(k)\\times\\mathcal{D}(k)$; index set $\\{1,2\\}$ with no\nrelations, so **not** directed; $\\mathcal{S}_1=\\mathcal{D}(k)\\times0$ and\n$\\mathcal{S}_2=0\\times\\mathcal{D}(k)$; $S=\\{(k,0),(0,k)\\}$.\n\n**Why the hypotheses fail exactly here.** (Amb): a product of stable cocomplete categories is\nstable and cocomplete. (B): each $\\mathcal{S}_i$ is a coordinate factor, so it is closed under\nshifts, cofibres, all small colimits of $\\mathcal{C}$ (computed componentwise) and retracts.\n(C): $\\mathrm{Map}((k,0),-)$ is $\\mathrm{Map}_{\\mathcal{D}(k)}(k,-)$ on the first coordinate,\nwhich preserves filtered colimits, so both generators are compact, and each lies in a member.\nOnly (A) fails, and it fails for the family and not for the index set.\n\n**What it matches.** Hypothesis (A) alone. It reaches neither (B) nor (C) nor the shape of the\nconclusion; what it establishes is that (A) is load-bearing, so no proof of the node can be\nwritten that does not consume it.\n\n**What the statement says here.** $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}$, and $(k,k)$ is a\ncompact object of it lying in neither $\\mathcal{S}_1$ nor $\\mathcal{S}_2$: the conclusion is\nfalse. Adjoining a top member $\\mathcal{S}_3=\\mathcal{C}$ makes the family directed and monotone\nand restores the conclusion trivially — which is why (A) has to be read as a condition on the\n$\\mathcal{S}_\\alpha$, not as a condition one may always arrange on $(A,\\le)$.\n\n**Source.** None needed *(constructed, unsourced)*.\n";</script>
