<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L3 — history\n\n[Q1-L3-L3](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose Q1-L3`: the propagation step that clause (i) of [Q1-L3](../index.html) needs, isolated with the geometry stripped out. It is the only piece of the parent that is not about $LX$ at all, which is why it is stated for an abstract $\\mathcal{C}$ and a directed family, and why it is a ready leaf.\n- **2026-08-06 — why the conclusion is not simply \"$\\langle S\\rangle_{\\mathcal{C}}\\subseteq\\bigcup_\\alpha\\mathcal{S}_\\alpha$\".** That inclusion is false as stated: a union of a directed family of cocomplete subcategories is closed under finite colimits but not under arbitrary ones, so it is not a candidate for the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) to land in. Compactness is exactly what repairs it — an object of $\\langle S\\rangle_{\\mathcal{C}}$ is a filtered colimit of objects each lying in some single $\\mathcal{S}_\\alpha$, and a compact one is a retract of one of them. This is why hypothesis (B) carries retract-closure and hypothesis (C) carries compactness of the generators; both are load-bearing.\n- **2026-08-06 — the directedness is imported, not assumed of the natural index.** In the application the members are the subcategories of objects supported in the closed sets $Z_F$ of [Q1-L3-L1](../Q1-L3-L1/index.html)(3), indexed by the finite subsets of $\\Lambda^+$ rather than by $\\Lambda^+$ itself; the family indexed by $\\Lambda^+$ is not directed, for the reason recorded in that node's history.\n- **2026-08-06 — examined and unchanged** by `/update Q1-L3-L2`. Re-read to check whether correcting [Q1-L3-L2](../Q1-L3-L2/index.html) breaks the abstract lemma that consumes it ([u1](../Q1-L3-L2/updates/u1.html)). It does not: this node is already stated over an arbitrary directed $(A,\\le)$, so the widening from $\\{Z_\\mu\\}_{\\mu\\in\\Lambda^+}$ — which is not directed — to the finite unions $\\{Z_F\\}$ — which is — makes hypothesis (A) *easier* to meet rather than harder. What the correction does put at risk is hypothesis (C), that every generator lies in some $\\mathcal{S}_\\alpha$: [Q1-L3-L2](../Q1-L3-L2/index.html)(4) shows the generating family has members no $Z_F$ bounds. That debt belongs to the node commissioned this run, not to this one.\n- **2026-08-07 — gains one child directory, [Q1-L3-L3-L1](Q1-L3-L3-L1/index.html), commissioned by §6 of `/update Q1-L3`.** It is the instance of hypothesis **(B)** at the one family this lemma is applied to: for $\\mathcal{C}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and $\\mathcal{S}_Z$ the objects supported in a closed $K$-stable $Z\\subseteq|LX|$, it gives continuity of $!$-restriction to the open complement and, from it, the four closures (B) asks for. [u2](../updates/u2.html) is what forced it: (B) is now a declared hypothesis of [Q1-L3](../index.html) that nothing in the repository establishes, [u1](../updates/u1.html) had already recorded the same debt on 2026-08-06 as *\"now cut out as a child\"*, and no child was created. It sits in *this* node's directory and not in [Q1-L3](../index.html)'s because that node stands at the ten-child cap ([ADR 0050](../../../../process/decisions/0050-a-node-has-at-most-ten-children.html)), whose own remedy puts a claim written to serve one sibling under that sibling.\n- **2026-08-07 — this node's `depends-on` is unchanged, and that is deliberate.** The child is contained here and depended on by [Q1-L3](../index.html), which is where the claim is consumed; containment is not dependency ([ADR 0059](../../../../process/decisions/0059-a-container-is-a-directory.html)). The commission first drew the edge at this node, and it was moved the same run: this node's statement is abstract — arbitrary $\\mathcal{C}$, arbitrary directed family, **(B)** assumed — so its write-up cannot cite a concrete claim about $LX$, an edge whose head the proof may not touch is a false edge, and by the weakest-link rule it would have capped this node's confidence at an unproved child its argument never uses. The cap of [ADR 0050](../../../../process/decisions/0050-a-node-has-at-most-ten-children.html) counts directory containment and not `depends-on`, so moving the edge to [Q1-L3](../index.html) costs nothing against it. The `## Decomposition` paragraph in the node file says the same thing where a reader meets it first.\n- **2026-08-07 — `proved` at [r1](critiques/r1.html), first round, six MINOR flaws standing.** The write-up (1152 words) proves the lemma at its stated generality — $\\mathcal{C}$ only stable and cocomplete — and **avoids Ind-completion entirely**, which the referee confirmed is genuine rather than verbal: nothing forms $\\mathrm{Ind}(\\mathcal{T}_0)$, and the node's declared [compact generation](../../../../appendix/def-compactly-generated-category.html) is correctly never used. The step that could have failed, Step 6's auxiliary $c'=\\mathrm{fib}(c\\to t)$, needs only small colimits and stability, with both endpoints compact. Each hypothesis is spent where the statement suggests: **(A)** with directedness at Step 3, **(B)** at Steps 3 and 10, **(C)**'s compactness half at Step 2 and its covering half at Step 3.\n- **2026-08-07 — two findings about the statement, deliberately not acted on this run.** The referee ruled that **(B) is stronger than the proof consumes**: it may be weakened to *each $\\mathcal{S}_\\alpha$ contains $0$ and is closed under shifts, cofibres and retracts*, closure under infinite colimits never being invoked — and that the \"contains $0$\" clause may **not** be dropped, since with $S=\\emptyset$ and every $\\mathcal{S}_\\alpha=\\emptyset$ the conclusion fails. It also ruled that $A\\neq\\emptyset$, whose failing case the prover exhibited correctly, is already carried by \"directed partially ordered set\" under the reading in force, so the statement stands and is **not** refuted. Weakening (B) is an improvement and not a defect, and weakening a hypothesis under a write-up that has just passed is the exact operation that produced this repository's four superseded write-ups; it is left to a deliberate `/update` with a fresh `/prove` behind it. What it means meanwhile is that [Q1-L3-L3-L1](Q1-L3-L3-L1/index.html), which discharges **(B)** in full, is proving more than any caller needs.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed. The paragraph's one fact that no other file carries is the direction of its containment, kept here: [Q1-L3-L3-L1](Q1-L3-L3-L1/index.html) is **not** a step in proving this lemma and a write-up of it neither cites nor may cite the child — the child is the instance of *this* node's hypothesis **(B)** at the one family the lemma is applied to, and it sits here only because [Q1-L3](../index.html) is at the ten-child cap, which is why [Q1-L3](../index.html) and not this node lists it in `depends-on`.\n";</script>
