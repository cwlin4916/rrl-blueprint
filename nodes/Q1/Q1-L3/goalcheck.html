<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3</a><i>›</i><span>goal check</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3 — goal check</h1><p class="lead">What the key examples say when this statement is specialized to them. A ceiling on the node's confidence, never a citable input.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3 — goal check against the key examples\n\n[Q1-L3](index.html) · [key examples](../../../key_examples/index.html) · [DAG index](../../../dag.html) · [ADR 0040](../../../process/decisions/0040-the-key-example-register.html)\n\n**Date:** 2026-08-09 · **Register read:** 12 entries · **Entries that could see the statement:** 8\n\nOne reformulation is used throughout, and it is computed here rather than imported. Since\n$LG=\\bigcup_{\\mu\\in\\Lambda^+}\\overline{LG}_\\mu$ by the Cartan decomposition, the union of the\nimages of the convolution maps collapses:\n\n$$\nLX^{\\mathrm{sat}} \\;=\\; \\left|\\,\\bigcup_{\\mu}\\overline{LG}_\\mu\\cdot L^{+}X\\,\\right| \\;=\\; \\left|\\,LG\\cdot L^{+}X\\,\\right| .\n$$\n\nSo clause **(iii)** reads, on every entry, *every geometric point of $LX$ is carried into the arc\nspace by some element of $LG$*. That is what is checked below.\n\nClause labels are the orchestrator's: hypotheses **(A)**, **(B)**, **(C)**, setup object **(S)**,\nconclusions **(i)**–**(iv)**, and unconditionality **(U)**.\n\n## 1. What the statement says on each entry\n\n### K1 — Iwasawa–Tate, $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ *(`positive`)* — **holds** on (C), (ii), (iii), (S)\n\n$K=L^+\\mathbb{G}_m=k[[t]]^\\times$, $LX(k)=k((t))$, $\\Lambda^+=X_*(\\mathbb{G}_m)=\\mathbb{Z}$, and by\n[Q1-L4-e1](../Q1-L4/Q1-L4-e1/index.html)(1) $\\Lambda_X^+=\\mathbb{Z}\\sqcup\\{\\ast\\}$ with\n$\\overline{LX}_n=t^nk[[t]]$ and $\\overline{LX}_\\ast=\\{0\\}$.\n\n$\\mathrm{Gr}_{\\mathbb{G}_m}$ is discrete, so $\\overline{LG}_\\mu\\cdot L^{+}X=t^\\mu k[[t]]$ and\n\n$$\nLX^{\\mathrm{sat}}=\\bigcup_{n\\in\\mathbb{Z}}t^nk[[t]]=k((t))=|LX| .\n$$\n\n**(C) holds, and it is the pressure point the record suspected.** The refutation at\n[Q1-L3-L4 r1](Q1-L3-L4/critiques/r1.html) kills $\\overline{\\imath}_\\ast$ — the origin is cut out in\nthe stage $t^{-l}\\mathcal{O}=\\operatorname{Spec}k[x_j]_{j\\ge-l}$ by the non-finitely-generated\nideal $(x_j)_{j\\ge-l}$ — and kills nothing else: for $n\\in\\mathbb{Z}$ the ideal of\n$t^n\\mathcal{O}$ in that stage is $(x_{-l},\\dots,x_{n-1})$, finitely many generators, so\n$\\overline{\\imath}_n$ is finitely presented.\n\nTake $\\Lambda'=\\mathbb{Z}=\\Lambda_X^+\\setminus\\{\\ast\\}$. The **second half of (C) survives**, and\ncleanly: $0\\in t^n k[[t]]$ for every $n$, so the bad orbit is *absorbed* into every good closure\nand $\\bigcup_{n}|\\overline{LX}_n|=|LX|$. So (C) is satisfiable on K1, not merely unverified, and\n(ii) and (iii) are undamaged there.\n\n**(ii) holds** on that $\\Lambda'$: $\\overline{LX}_n=t^n\\mathcal{O}\\cong L^{+}\\mathbb{A}^1$ is a\n[placid scheme](../../../appendix/placid-ind-scheme.html) — which is what the r1\nFlaw-3 gap wanted and (C) does not declare — so\n[$\\omega_{\\mathcal{Y}}$](../../../appendix/not-dualizing-object.html) is licensed\nunder [the three standing hypotheses](../../../appendix/assum-intro.html)(b), the pushforward is\ncoherent by\n[Raskin's fp pushforward](../../../appendix/bb-raskin-fp-pushforward.html), and\nit is nonzero with support $|t^n\\mathcal{O}|$.\n\n**(iii) holds**: its conclusion is the computation above, and it uses the Hecke sweep genuinely —\n$LG=F^\\times$ is *not* transitive on $|LX|$ (the origin is a fixed point), and saturation holds\nbecause $L^{+}X=k[[t]]$ already meets every valuation stratum.\n\n**(S) holds**, with its caution unexercised: each $Z_\\mu=t^\\mu\\mathcal{O}$ is closed and their\nunion is $|LX|$, so nothing here tests \"not claimed closed\". **(i) holds vacuously** — the bound\nis the whole space. **(iv) holds vacuously** — $Z=(LX)_{\\mathrm{red}}$ trivially.\n\n**(A), (B), (U): silent.** The entry's own \"What it does not reach\" says BZSV take their limits in\nthe large category and assert nothing about $\\mathcal{D}_c$, which is exactly what (A) and (B) are\nabout.\n\n### K2 — the trivial period, $X=\\mathrm{pt}$ *(`positive`)* — **holds** on (A), everything else vacuous\n\n$K\\backslash LX=BL^{+}G$, $\\Lambda_X^+=\\{\\ast\\}$, $|LX|$ a single point.\n\n**(A) holds, non-vacuously, and this is the only entry that can see it.** The register quotes\nBZSV §7.6.3: the automorphic category here is *perfect modules* under $H^{*}(BG)$. Perfect modules\nare precisely the compact objects of $\\mathrm{Mod}(H^{*}(BG))=\\mathrm{Ind}(\\mathrm{Perf})$, which\nis what (A) asserts for $\\mathcal{D}^{\\mathrm{ren}}=\\mathrm{Ind}\\,\\mathcal{D}_c$\n([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n\nWorth recording because the appendix's own caution reads the other way: note (ii) of\n[coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) says the\nconstant $\\mathcal{D}$-module on $BG$ is coherent and *not compact*. That is a statement about\n$\\mathcal{D}(BG)$, not about $\\mathcal{D}^{\\mathrm{ren}}(BG)$, so it does not bite on (A) — and K2\nis where the two could have been confused.\n\n**(B), (C), (S), (i)–(iv) hold vacuously.** $|LX|$ is one point: every $Z_F$ is that point,\n$\\mathcal{S}_F$ is everything and the open complement is empty; $\\overline{\\imath}_\\ast$ is the\nidentity; $LX^{\\mathrm{sat}}=|LX|$; and (ii)'s witness is $\\omega_{BL^{+}G}$ under the identity\nembedding.\n\n**(U): silent.** The register's source for K2 is\n[derived Satake](../../../appendix/bb-derived-satake.html), where\n[the three standing hypotheses](../../../appendix/assum-intro.html)(c) is a theorem, so nothing here\ncan tell whether a clause leans on it.\n\n### K3 — Gross–Prasad, $X=\\mathrm{SO}_N$ under $\\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$ *(`positive`)* — **holds vacuously** on (iii); **holds** on (C)\n\n$LX(k)=\\mathrm{SO}_N(F)$ with $(g_1,g_2)\\cdot x=g_1^{-1}xg_2$, $L^{+}X=\\mathrm{SO}_N(\\mathcal{O})$,\nand $K\\backslash LX\\simeq\\mathrm{SO}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$.\n\n**(iii) holds, and the entry gives it twice — which is why it does not discriminate.** The\nregister quotes BFT Lemma 2.3.2: each orbit, indexed by\n$\\Lambda_{\\mathsf s}^{+}\\times\\Lambda_{\\mathsf b}^{+}$, is open in the image of the corresponding\ntwo-sided Hecke convolution, so every orbit lies in $LX^{\\mathrm{sat}}$ and the orbits cover\n$|LX|$.\n\nBut the reformulation makes the lemma unnecessary: the first factor $\\mathrm{SO}_N(F)$ acts simply\ntransitively on $LX(k)=\\mathrm{SO}_N(F)$, so $LG\\cdot L^{+}X=|LX|$ before any geometry is done. The\nconclusion is therefore **true and content-free**, and the hit is recorded as vacuous.\n\n**(C) holds** with $\\Lambda'=\\Lambda_X^+$: the r1 witness is a stratum lying over a *non-open*\n$G$-orbit of $X$, and a homogeneous $X$ has none, so\n[orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) is unrestricted here —\nthough the exhaustion half is then trivial and nothing tests it. **(i) holds vacuously** (the\nbound is $|LX|$); **(iv) holds vacuously**.\n\n**(A), (B), (ii): silent** — the entry's own text says its equivalence is for the bounded\nconstructible category over $\\mathbb{C}$ in the topological setting, and the $\\mathcal{D}$-module\nreading is a matter it does not settle. **(U): silent.**\n\n### K4 — Rankin–Selberg, $X=\\mathrm{GL}_N$ under $\\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$ *(`positive`)* — **holds vacuously** on (iii)\n\nIdentical shape to K3: $LX(k)=\\mathrm{GL}_N(F)$, first factor transitive, so\n$LG\\cdot L^{+}X=|LX|$ and **(iii) holds vacuously**; **(C) holds** with $\\Lambda'=\\Lambda_X^+$ for\nthe same homogeneity reason; **(i)** and **(iv) hold vacuously**.\n\nK4 is strictly weaker than K3 as a test: the register carries no orbit-image lemma for it, only\nBFGT §1.7's equivalence, so even the non-discriminating confirmation of (iii) that K3 supplies is\nabsent.\n\n**(A), (B), (ii), (S), (U): silent** — the entry records a category and no support, closure or\ncompactness computation.\n\n### K5 — mirabolic, $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ *(`positive`)* — **holds** on (iii)\n\n$LX(k)=\\mathrm{GL}_n(F)\\times F^n$ with $(g,v)\\cdot(g_1,g_2)=(g_1^{-1}gg_2,\\,vg_2)$ and\n$L^{+}X=\\mathrm{GL}_n(\\mathcal{O})\\times\\mathcal{O}^n$. This is the second non-homogeneous entry,\nso the sweep is not automatic and has to be computed.\n\n**(iii) holds, non-vacuously.** Given $(h,w)\\in LX(k)$, pick $N\\le\\operatorname{val}(w)$ and set\n\n$$\ng_2=t^N,\\qquad g_1=t^Nh^{-1},\\qquad (g,v)=(1,\\,wt^{-N})\\in L^{+}X .\n$$\n\nThen $(g_1^{-1}gg_2,\\,vg_2)=(h,w)$, and $(g_1,g_2)$ lies in $\\overline{LG}_\\mu$ for $\\mu$ large.\n\nSo $LG\\cdot L^{+}X=|LX|$ and set-theoretic Hecke saturation holds — by a genuine sweep, using that\n$L^{+}X$ is not one orbit, not by transitivity of $LG$. **(S) holds**, caution unexercised.\n**(i)** and **(iv) hold vacuously**, the bound again being everything.\n\n**(C): silent, and this is the gap that matters.** $X$ is non-homogeneous with closed $G$-orbit\nlocus $\\mathrm{GL}_n\\times\\{0\\}$, so the r1 obstruction has an analogue here; whether the K1\nabsorption recurs — whether the strata over $v=0$ lie inside closures of finitely presented\n$\\overline{LX}_\\lambda$ that still exhaust $|LX|$ — needs the orbit poset, which neither the\nregister nor the tree classifies.\n\n**(A), (B), (ii), (U): silent**; BFGT realize $D^{!}$, $D^{!*}$ and $D^{*}$ of the mirabolic\nGrassmannian and compute no support-bounded subcategory.\n\n### K6 — symplectic (Jacquet–Rallis), $X=\\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$ *(`positive`)* — **strains** on (C), hence on (ii) and (iii)\n\n$k$ is algebraically closed of characteristic $0$, so $F=k((t))$ has cohomological dimension\n$\\le1$ and $H^1(F,\\mathrm{Sp}_{2n})=1$; hence $LX(k)=\\mathrm{GL}_{2n}(F)/\\mathrm{Sp}_{2n}(F)$ is a\nsingle $LG$-orbit and $LX^{\\mathrm{sat}}=|LX|$. So **(iii) holds vacuously**, as at K3 and K4, and\n**(i)**, **(iv)** with it.\n\n**(C) strains, and K6 is where the pressure is.** The register's own text carries CMNO Remark 1.4:\nthe orbits here \"are neither finite-dimensional nor finite-codimensional, so this is a case where\nthe naive stratum-by-stratum reading of Q1 is unavailable\".\n\nClauses (ii) and (iii) *are* a closure-by-closure reading — a witness at each\n$\\lambda\\in\\Lambda'$, its support inside $LX^{\\mathrm{sat}}$, and the closures over $\\Lambda'$\nexhausting $|LX|$ — and the finite presentation (C) demands is exactly the property that failed at\nK1 at an infinite-codimension closed orbit.\n\nWhat is missing, precisely: a reconciliation of Remark 1.4's orbit geometry, stated on the\nind-finite-type presentation $L\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}$ where finite\npresentation is automatic, with the *placid* presentation\n$LX=\\varinjlim_\\lambda\\overline{LX}_\\lambda$ that\n[orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) supplies and on which (C) is\nasserted.\n\nThe node claims neither, and the entry's source declines the stratum-by-stratum reading in as many\nwords. The strain is not a refutation: no non-finitely-presented $\\overline{\\imath}_\\lambda$ is\nexhibited here.\n\n**The $n=1$ corner escapes it.** $\\mathrm{Sp}_2=\\mathrm{SL}_2$ and $X\\cong\\mathbb{G}_m$ via the\ndeterminant, so\n\n$$\nLX=L\\mathbb{G}_m=\\bigsqcup_{m\\in\\mathbb{Z}}t^m\\mathcal{O}^\\times\n$$\n\nwith $\\Lambda_X^+=\\mathbb{Z}$ and each $\\overline{LX}_m=LX_m$ open *and* closed, hence finitely\npresented. $\\det(\\overline{LG}_\\mu)\\subseteq t^{|\\mu|}\\mathcal{O}^\\times$ gives\n$LX^{\\mathrm{sat}}=|LX|$ directly.\n\nSo **(C) holds at $n=1$** and the pathology Remark 1.4 records is a phenomenon of $n\\ge2$.\n**(A), (B), (ii), (U): silent** — the entry's $D^b$ is the semi-analytic quotient category, not the\n$\\mathcal{D}$-module one.\n\n### K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$ *(`adjacent`)* — **silent**\n\nThe entry names $\\check X$ and $\\check G$ on the spectral side only and records that the source has\nnot been read on the page, so no automorphic $X$, no $LX$ and no orbit is available to substitute\ninto any clause.\n\n### K8 — rank-1 affine homogeneous spherical varieties *(`weak`)* — **silent**\n\nThe entry settles which category sits on the automorphic side for a whole family $G/H$ and names\nno single $X$, computes no orbit and no closure, so it cannot see (A), (B), (C), (S), (i), (ii) or\n(iv).\n\nOn **(U)** it is the entry the orchestrator flagged, and the honest reading is still silent: (U) is\na claim about which hypotheses this node's *own* clauses invoke, and no choice of $(G,X)$ can\nverify a dependency claim.\n\nWhat K8 does establish is that (U) is not idle — a large family where\n[the three standing hypotheses](../../../appendix/assum-intro.html)(c) is in print and Q1 is untouched\nis exactly where an unconditional necessary condition would have work to do.\n\nOn **(iii)** the family is homogeneous with connected reductive stabilizer over a field of\ncohomological dimension $\\le1$, so the vacuity of §3 applies to every member; but that is the\ngeneral argument speaking, not the entry.\n\n### K9 — the group case, $X=H$ under $H\\times H$ *(`degenerate`)* — **holds vacuously**, and cannot on its own earn any verdict\n\n$LX=LH$, $K\\backslash LX\\simeq L^{+}H\\backslash LH/L^{+}H$ with strata the Cartan cells,\n$\\Lambda_X^+=X_*(T)^+$, $\\overline{LX}_\\lambda=L^{+}Ht^\\lambda L^{+}H$ the preimage of\n$\\overline{\\mathrm{Gr}}_\\lambda$.\n\n**(C) holds** and is the one place on the bench where its fp half is transparent:\n$\\overline{\\mathrm{Gr}}_\\lambda\\subset\\mathrm{Gr}$ is a finite-type closed subscheme of an\nind-finite-type ind-scheme, and finite presentation descends along the $L^{+}H$-torsor.\n**(ii) holds** for the same reason.\n\nBut **(iii) holds vacuously twice over**: the first factor of $H\\times H$ acts transitively on\n$LX(k)=H(F)$, and separately\n[$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the monoidal unit of\n[the Hecke action](../../../appendix/conv-hecke-action.html), so\n$\\mathcal{D}_c^{\\mathrm{Sat}}=\\mathcal{D}_c$ before any geometry and **(i)** is the statement that\nevery object has support in $|LX|$.\n\nPer [ADR 0040](../../../process/decisions/0040-the-key-example-register.html) this entry cannot\nlift the verdict, and here it would not deserve to: every clause it satisfies, it satisfies for a\nreason the clause does not supply. **(A), (B), (S), (U): silent.**\n\n### K10 — the Whittaker period, $M=T^{*}(G/\\!\\!/_{\\psi}U)$ *(`out-of-class`)* — **silent**\n\nThe polarization is twisted and $M$ is not $T^{*}X$ for any $X$ in\n[untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html),\nso there is no $X$, no $LX$, no $L^{+}X$ and no $\\Lambda_X^+$: every specialization is empty rather\nthan false.\n\n### K11 — $X=\\mathrm{PSL}_2/\\mathrm{PO}_2$ *(`out-of-class`)* — **holds** on (i) and (iii), out of scope\n\n$X\\cong\\mathrm{PGL}_2/N(T)$, the variety of maximal tori, realized as $\\mathbb{P}^2$ minus the\ndiscriminant conic; $LX(k)=\\{[q]\\in\\mathbb{P}^2(F):\\operatorname{disc}(q)\\neq0\\}$ and\n$L^{+}X=X(\\mathcal{O})$.\n\nThe stabilizer is disconnected, which is why the entry is out of class, and that is exactly what\nmakes it the **only entry on the bench where saturation fails**.\n\nThe $LG$-orbit invariant is $\\operatorname{disc}$ modulo $(F^\\times)^2$, and\n$F^\\times/(F^\\times)^2=\\{1,t\\}$ for $k$ algebraically closed of characteristic $0$; an\n$\\mathcal{O}$-point forces $\\operatorname{disc}\\in\\mathcal{O}^\\times=(\\mathcal{O}^\\times)^2$, so\n$X(\\mathcal{O})$ lies wholly in the split orbit and\n\n$$\nLX^{\\mathrm{sat}} \\;=\\; LG\\cdot L^{+}X \\;=\\; \\{\\operatorname{val}(\\operatorname{disc})\\ \\text{even}\\} \\;\\subsetneq\\; |LX| .\n$$\n\n**(iii) holds and is the one non-trivial exercise of the implication on the bench**, read\ncontrapositively: saturation fails, so the equality must fail — and it does, since $\\omega$ on the\nramified clopen part is a nonzero object of $\\mathcal{D}_c(K\\backslash LX)$ whose support misses\n$LX^{\\mathrm{sat}}$.\n\n**(i) holds non-vacuously** for the same reason: it is the only place where the support bound cuts\nanything, and it cuts correctly, since\n[$\\mathrm{IC}_0$](../../../appendix/ic-0.html) lives on $X(\\mathcal{O})$ and bounded\nHecke translates cannot leave the split component. **(S) holds** with its caution again\nunexercised — $\\operatorname{val}(\\operatorname{disc})$ is locally constant, so\n$LX^{\\mathrm{sat}}$ is clopen.\n\nThe register's standing warning is **discharged rather than triggered**: a node reporting `holds`\nhere is worrying when its conclusion ought to fail out of class, and this node's conclusion is a\nnecessary condition that correctly fails alongside the equality. It is nevertheless out of scope\nand drives no verdict.\n\n**(A), (B), (C), (ii), (iv), (U): silent** —\n[orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(b) is restricted to symmetric\n$X$ with $G^\\theta$ connected, which this is not, so the presentation the clauses run on is not in\nforce.\n\n### K12 — $X=(\\mathrm{SL}_2^{\\times3})\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ *(`negative`)* — **silent**\n\nMembership of the standing class is unsettled — the entry commissions it as\n[Q1-e8](../Q1-e8/index.html) — and the source works over a local field of characteristic zero\nrather than the equal-characteristic setting, so the hypotheses under which the node speaks are not\nknown to hold and every clause is formally silent.\n\nThe one computation the entry permits is recorded in §3, because it is the most consequential thing\nthe bench says about (iii).\n\n## 2. What no entry reached\n\n- **(B), entire, and its flagged sub-claim.** No entry computes\n  $\\mathcal{S}_F=\\{\\mathcal{G}:|\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F\\}$ or its closure under\n  colimits, and none tests the separate identification $\\mathcal{S}_F=\\ker(j_F^!)$ — locality of\n  vanishing on $LX$ plus survival under the $K$-quotient, which is hypothesis (A) of\n  [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html). K2 satisfies it over a one-point space\n  and is the only hit. The node's own text says nothing in the repository establishes it; nothing on\n  the bench does either.\n- **(U), unconditionality.** Twelve entries, no verdict. Whether clauses (i)–(iii) invoke\n  [the three standing hypotheses](../../../appendix/assum-intro.html)(c) is a fact about this node's\n  argument, and a register of $(G,X)$ cannot see it. K8 shows the clause is not idle and confirms\n  nothing.\n- **(S)'s actual content.** The setup is careful that $LX^{\\mathrm{sat}}$ carries no scheme\n  structure and is not claimed closed, because a filtered union of the closed images $Z_\\mu$ need\n  not be closed. At every entry that can see it, $LX^{\\mathrm{sat}}$ is either $|LX|$ (K1–K6, K9) or\n  clopen (K11). The caution is never exercised, so nothing on the bench distinguishes (iii) from\n  (iv) either.\n- **(iv).** Its hypothesis — $LX^{\\mathrm{sat}}$ the points of a reduced closed ind-subscheme — is\n  met at every in-class entry only because $LX^{\\mathrm{sat}}=|LX|$, so the conclusion\n  $Z=(LX)_{\\mathrm{red}}$ is a tautology at all eight. No entry produces a proper $Z$.\n- **(A) beyond one point.** K2 is the only entry whose source identifies the automorphic category\n  concretely enough to see compactness. K3, K4, K5 and K6 all work in constructible, $!/*$- or\n  semi-analytic categories that the register itself flags as not the $\\mathcal{D}$-module reading.\n- **(ii) at a non-degenerate, non-homogeneous entry other than K1.** K5 is the natural second\n  instance and its orbit poset is unclassified; K9 supplies it degenerately; K3, K4 and K6 supply\n  $\\Lambda'=\\Lambda_X^+$ by homogeneity, which is the case where (C) has nothing to exclude.\n\n## 3. Where the pressure is\n\n**The headline is not a defect but a blindness, and it is computable in one line.** For $X=G/H$\nhomogeneous with $H$ connected, $F=k((t))$ with $k$ algebraically closed of characteristic $0$ has\ncohomological dimension $\\le1$, so $H^1(F,H)=1$ and $LX(k)=G(F)/H(F)$ is a *single* $LG$-orbit;\nsince $L^{+}X\\neq\\emptyset$, $LX^{\\mathrm{sat}}=LG\\cdot L^{+}X=|LX|$ automatically.\n\nSet-theoretic Hecke saturation therefore holds at K3, K4, K6, K8, K9 — and, by the same argument\nover a local field, at **K12**, where $H=\\mathrm{SL}_2^{\\times3}$ is simply connected and\n$H^1(F,H)=1$. So the register's one candidate *negative*, the case where Q1's equality is expected\nto fail, **satisfies this node's necessary condition**. Clause (iii) is true there and sees nothing.\n\nOn the two non-homogeneous entries, K1 and K5, saturation also holds, by elementary sweeps computed\nabove. The net reading: (iii) is satisfied at every entry the bench can see except the out-of-class\nK11, and it is the *only* place where the implication is exercised at all.\n\nWhat the node hands [Q1](../../../dag.html) as answer-strength (A1) is therefore a condition\nthat is automatic for the entire homogeneous half of the standing class — a fact the node's own\n[u3](updates/u3.html) weakening did not anticipate and that its Unconditionality paragraph does not\nrecord.\n\n**The verdict is set by K6.** The register's most instructive positive carries CMNO Remark 1.4 —\norbits neither finite-dimensional nor finite-codimensional, so the naive stratum-by-stratum reading\nof Q1 is unavailable — and clauses (ii) and (iii) are precisely that reading.\n\nFinite presentation of $\\overline{\\imath}_\\lambda$ is the property that already failed, at K1, at\nan infinite-codimension closed orbit; hypothesis (C) asserts it on a range that must still exhaust\n$|LX|$; and nothing in the node, the appendix or the entry reconciles Remark 1.4's geometry, stated\non the ind-finite-type presentation $L\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}$ where finite\npresentation is free, with the placid presentation on which (C) is asserted.\n\nThat is a named missing thing, not a refutation: no bad $\\overline{\\imath}_\\lambda$ is exhibited,\nand the $n=1$ corner satisfies (C) outright.\n\n**The good news, since a goal check should report it.** K1 answers the question the record put to\nit: the second half of (C) survives there.\n\nThe origin is the *only* index the r1 refutation removes, every other $\\overline{\\imath}_n$ is\nfinitely presented, and $0\\in t^n k[[t]]$ for every $n$, so the excluded orbit is absorbed and\n$\\Lambda'=\\mathbb{Z}$ still exhausts $|LX|$. Whether that absorption is a mechanism or a\none-variable accident is the question §4 commissions.\n\n## 4. What would test this further\n\n- **K5's orbit poset, computed.** $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ at $n=1$ — that is\n  $\\mathrm{GL}_1\\times\\mathbb{A}^1$ under $\\mathrm{GL}_1\\times\\mathrm{GL}_1$ — is the cheapest\n  non-homogeneous case with a genuine closed $G$-orbit locus after K1. What would have to be\n  computed: the $K$-orbits on $LX$, their closures, which $\\overline{\\imath}_\\lambda$ are finitely\n  presented, and whether the good closures still exhaust $|LX|$. This decides whether K1's\n  absorption is the general mechanism protecting (C) on non-homogeneous $X$ or a coincidence of one\n  variable, and it is the single cheapest thing on this list.\n- **An in-class $X$ where saturation genuinely fails.** The whole of §3's first paragraph says the\n  bench has none. The shape that would supply one is K11's: a non-homogeneous $X$ whose boundary\n  carries an $LG$-orbit meeting no $\\mathcal{O}$-point, inside\n  [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html).\n  Without such an entry clause (iii) is a necessary condition no in-class bench case can violate, and\n  [Q1](../../../dag.html)'s answer-strength (A1) is untested rather than confirmed.\n- **K6 at $n\\ge2$, one orbit closure worked out.** Take $\\mathrm{GL}_4/\\mathrm{Sp}_4$ and one\n  non-base $\\lambda$: is $\\overline{\\imath}_\\lambda$ finitely presented on the placid presentation,\n  and is CMNO's \"not finite-codimensional\" a statement about the ind-direction that leaves finite\n  presentation intact? Either answer closes the strain of §3.\n- **K12 promoted from a decategorified statement to a support computation.** The entry currently\n  carries a Hecke-module fact ([Q1-a1](../Q1-a1/index.html)(H)). What would decide whether this\n  node has any purchase on it is $LX^{\\mathrm{sat}}$ computed there directly — §3 predicts it is all\n  of $|LX|$, and a confirmation would establish, on the register's own terms, that saturation is\n  necessary and far from sufficient.\n\nGOALCHECK: tension\n";</script>
