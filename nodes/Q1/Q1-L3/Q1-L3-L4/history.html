<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L4</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L4 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L4 — history\n\n[Q1-L3-L4](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose Q1-L3`: clause (ii) of [Q1-L3](../index.html), the orbit-closure witness, cut out as a node of its own. It is the clause the parent's own [examples.md](../examples.html) reports as unmatched by anything in the literature — \"**Nothing in the literature matches (ii) in the generality the node states it**\", since a decategorified statement has no object supported on a positive-codimension stratum — so it is where the parent is new and where the referee channel, not the literature channel, has to carry it.\n- **2026-08-06 — coherence is the delicate half, and the dualizing object is what makes it tractable.** The witness has to lie in $\\mathcal{D}_c(K\\backslash LX)$, not merely in $\\mathcal{D}(K\\backslash LX)$: that is what puts it inside the category whose exhaustion clause (iii) of the parent assumes. Coherence is tested on smooth finite-type test schemes by [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), and the new appendix entry [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html) is written so that this test can be run: $\\omega$ is $p^!k$, so it is stable under $!$-pullback, and base change through hypothesis **(B)** turns the test into the same statement about a dualizing complex on a finite-type scheme.\n- **2026-08-06 — which ground the node stands on.** Hypothesis (A) invokes clause (a) of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), which that entry's `hypotheses` field records as valid for general spherical $X$ by the source's Remark 37. Clause (b) — the presentation, established in the source only for symmetric $X$ with $G^\\theta$ connected — is not used here; it is used by the sibling [Q1-L3-L5](../Q1-L3-L5/index.html), which stands on [the three standing hypotheses](../../../../appendix/assum-intro.html)(a) instead.\n- **2026-08-07 — `REFUTED` at [r1](critiques/r1.html): hypothesis (A)'s parenthetical is false, and the parent's quantifier with it.** `/prove Q1-L3-L4`. The prover drafted, flagged the scope rather than routing around it, and the referee verified the witness from the definitions and the source at page level.\n\n  **The failing case.** Take $X=\\mathbb{A}^1$ with $G=\\mathbb{G}_m$ — in the standing class, and key example [K1](../../../../key_examples/k1.html). The origin of $L\\mathbb{A}^1$ is a closed $L^+G$-orbit, indexed by $\\Lambda_X^+$ as [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) and [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) define it, and equal to its own closure. Base-changed along the stage $t^{-l}\\mathcal{O}=\\operatorname{Spec}k[x_j]_{j\\ge-l}$, its embedding is cut out by the ideal $(x_j)_{j\\ge-l}$, which is not finitely generated. So $\\overline{i}_\\lambda$ is **not** finitely presented at that $\\lambda$.\n\n  **The refuted statement, verbatim.** Only hypothesis (A) is false; the rest is quoted for the record.\n\n  > **(A) Finite presentation.** $\\overline{i}_\\lambda$ is a finitely presented closed embedding, which is clause **(a)** of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) and holds for $X$ smooth affine spherical.\n\n  **False only as stated, not in substance.** The node fixes $\\lambda$ and *assumes* (A), so the conditional core survives at every $\\lambda$ where (A) holds; what is false is the parenthetical asserting (A) holds throughout the standing class. `draft:` therefore keeps pointing at [proof.md](proof.html), which proves that conditional — this is not the empty-write-up case §3f was written for.\n\n  **What the source actually says**, read this run in `papers/chenyi_2025singularitiesorbitclosuresloop.pdf`: Lemma 34 (p. 20) describes $LX_\\lambda$ by arcs into the **open-$G$-orbit** locus $L^+\\mathcal{X}^\\bullet_\\lambda$; the proof of Thm 36 (p. 21) quantifies \"For any $\\lambda\\in\\Lambda_S^+$\"; Remark 37 (p. 22) widens the **variety class** and not the **index range**. So [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) as transcribed reads wider than its source — a MAJOR `M` against the entry, not against this node.\n\n  **A second MAJOR the prover did not flag.** Step 1 imports placidity of $\\overline{LX}_\\lambda$ from the same disputed clause, at the same arbitrary $\\lambda$, so the conditional is proved only where that clause independently applies.\n\n  **Suggested corrected statement — a suggestion only, adopted by nothing.** Replace (A)'s parenthetical with a declared range: *\"$\\overline{i}_\\lambda$ is a finitely presented closed embedding — clause **(a)** of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), available for $\\lambda$ in the index range that entry's source establishes and not for all of $\\Lambda_X^+$\"* — and declare placidity of $\\overline{LX}_\\lambda$ as a hypothesis beside it. The next action is `/update Q1-L3-L4`, never another `/prove`, and the durable fix is an appendix entry **restricting** clause (a)'s index range; an entry asserting (A) more widely is refuted by the witness above.\n";</script>
