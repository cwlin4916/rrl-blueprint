[$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html), [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html), [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html); no `depends-on` nodes.\n- **notation:** $K = L^+G$, $\\mathcal{Y} := K\\backslash LX$, $\\mathcal{Y}_\\lambda := K\\backslash\\overline{LX}_\\lambda$, $q\\colon LX\\rightarrow\\mathcal{Y}$ the quotient map, and $\\mathcal{F} := \\overline{i}_{\\lambda,*}\\,\\omega_{\\mathcal{Y}_\\lambda}$.\n\n## Lemma\n\n**Setup.** In the standing setting of [context](../../../../context.html), fix $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)), let $\\overline{LX}_\\lambda$ be the reduced orbit closure of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html) with its closed embedding $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), and let $\\omega_{K\\backslash\\overline{LX}_\\lambda}$ be the dualizing object of [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html). Assume:\n\n**(A) Finite presentation.** $\\overline{i}_\\lambda$ is a finitely presented closed embedding, which is clause **(a)** of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) and holds for $X$ smooth affine spherical.\n\n**(B) The equivariant closed pushforward.** $\\overline{i}_{\\lambda,*}\\colon\\mathcal{D}^!(K\\backslash\\overline{LX}_\\lambda)\\rightarrow\\mathcal{D}^!(K\\backslash LX)$ denotes the $K$-equivariant form of the pushforward of [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html) along $\\overline{i}_\\lambda$ — the functor main.tex:1221–1227 writes $i_*$ — and it satisfies base change against $!$-pullback, as clause (ii) of that entry does for ind-schemes.\n\nThen $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a **coherent** object of $\\mathcal{D}(K\\backslash LX)$ in the sense of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), it is **nonzero**, and its support is the whole orbit closure:\n\n$$\n\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}\\ \\in\\ \\mathcal{D}_c(K\\backslash LX), \\qquad \\left|\\operatorname{supp}\\ \\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}\\right| = \\left|\\overline{LX}_\\lambda\\right| .\n$$\n\n## Proof\n\n**Step 1 — $\\omega_{\\mathcal{Y}_\\lambda}$ is defined and lies inside the range its entry licenses.**\n\n<details><summary>the argument</summary>\n\nBy [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a)(1) the reduced closure $\\overline{LX}_\\lambda$ of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html) is a placid **scheme**, so $\\mathcal{Y}_\\lambda$ is the $K$-quotient of a placid scheme — the one case [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html) licenses, its ind-scheme tension being unresolved. Hypothesis **(B)** then makes $\\mathcal{F}\\in\\mathcal{D}^!(\\mathcal{Y})$.\n\n</details>\n\n**Step 2 — the atlas formula for base changes of $\\overline{i}_\\lambda$ over the quotient.**\n\n<details><summary>the argument</summary>\n\nWrite $Z_{\\mathcal{T}} := \\mathcal{T}\\times_{\\mathcal{Y}}\\mathcal{Y}_\\lambda$ and $P_{\\mathcal{T}} := \\mathcal{T}\\times_{\\mathcal{Y}}LX$ for a prestack $\\mathcal{T}$ over $\\mathcal{Y}$. The subscheme $\\overline{LX}_\\lambda\\subseteq LX$ is $K$-stable — it is the closure of the $K$-orbit $LX_\\lambda$, and **(B)** presupposes this in speaking of the $K$-equivariant form of $\\overline{i}_{\\lambda,*}$ — so pulling $\\mathcal{Y}_\\lambda\\rightarrow\\mathcal{Y}$ back along the $K$-torsor $q$ returns $\\overline{i}_\\lambda$, and associativity of fibre products gives\n\n$$\nZ_{\\mathcal{T}}\\times_{\\mathcal{T}}P_{\\mathcal{T}}\\ \\simeq\\ P_{\\mathcal{T}}\\times_{LX}\\overline{LX}_\\lambda .\n$$\n\n</details>\n\n**Step 3 — what coherence asks for.**\n\n<details><summary>the argument</summary>\n\n$\\mathrm{PreStk}$ is functors on the $(1,1)$-category of **classical** affine schemes ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)), so a dg-scheme test enters [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) only through its classical truncation; with that entry's ratified finite-type reading, $\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y})$ is the assertion that $f^!\\mathcal{F}$ is a finite complex with coherent cohomology for every smooth $f\\colon T\\rightarrow\\mathcal{Y}$ with $T$ a classical scheme of finite type. Fix such an $f$; smoothness of $f$ is never used below.\n\n</details>\n\n**Step 4 — $P_T\\rightarrow T$ is an fpqc cover by a placid scheme.**\n\n<details><summary>the argument</summary>\n\n$K = \\varprojlim_m L^mG$ with the jet groups $L^mG$ smooth affine of finite type ([loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html)), and each transition $L^{m+1}G\\rightarrow L^mG$ is surjective, affine and smooth, its kernel being a vector group. So $K\\times T\\rightarrow T$ is a projective limit of smooth $T$-group schemes under smooth surjective affine maps, and the companion checks of [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) (Ex. 4.2.3 and Rem. 4.2.7 there) make the torsor $P_T\\rightarrow T$ a placid scheme, hence quasi-compact and quasi-separated; it is faithfully flat because $K$ is flat.\n\n</details>\n\n**Step 5 — $Z_T$ is a closed subscheme of $T$, hence of finite type.**\n\n<details><summary>the argument</summary>\n\nBy **(A)** and the sense of *finitely presented* recalled in [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html) — schematic, with finitely presented base change along any scheme — the right-hand side of Step 2 at $\\mathcal{T}=T$ is a finitely presented closed subscheme of the scheme $P_T$. Closed immersions are fpqc-local on the base, so the descent of $Z_T\\times_TP_T\\hookrightarrow P_T$ along the cover of Step 4 shows $i_T\\colon Z_T\\rightarrow T$ is a finitely presented closed immersion; $T$ is of finite type, so $Z_T$ is too.\n\n</details>\n\n**Step 6 — base change computes the test.**\n\n<details><summary>the argument</summary>\n\nThe square with corners $Z_T,\\mathcal{Y}_\\lambda,T,\\mathcal{Y}$ is Cartesian by definition of $Z_T$, and its right leg $\\overline{i}_\\lambda$ is finitely presented by **(A)**, so hypothesis **(B)** — clause (ii) of the entry carries no hypothesis on the other leg $f$ — gives, in $\\mathcal{D}^!(T)$,\n\n$$\nf^!\\,\\mathcal{F}\\ \\simeq\\ i_{T,*}\\,\\psi_T^!\\,\\omega_{\\mathcal{Y}_\\lambda}\\ \\simeq\\ i_{T,*}\\,\\omega_{Z_T},\n$$\n\nthe second equivalence being the $!$-pullback compatibility of [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html), which holds for every morphism of prestacks.\n\n</details>\n\n**Step 7 — $\\mathcal{F}$ is coherent.**\n\n<details><summary>the argument</summary>\n\n$Z_T$ is a finite-type scheme by Step 5, so $\\omega_{Z_T}\\in\\mathcal{D}_c(Z_T)$ by the closing clause of [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html). Since $i_T$ is a finitely presented closed, hence proper, morphism of finite-type schemes, clause (iii) of [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html) identifies $i_{T,*}$ as the left adjoint of $i_T^!$, which is the usual $\\mathcal{D}$-module direct image; direct image along a closed immersion of finite-type schemes carries coherent complexes to coherent complexes (Kashiwara). By Step 6 this holds for every test $f$, which is Step 3's criterion.\n\n</details>\n\n**Step 8 — the support convention.**\n\n<details><summary>the argument</summary>\n\nNo appendix entry defines the support of an object of $\\mathcal{D}^!$ on a prestack. The reading used here, and used by clause (i) of the parent on $|LX|$, is nonvanishing of $!$-fibres: for $\\mathcal{G}\\in\\mathcal{D}^!(\\mathcal{Y})$,\n\n$$\n\\left|\\operatorname{supp}\\mathcal{G}\\right| := \\left\\{x\\in|LX| \\ :\\ (q\\circ x)^!\\,\\mathcal{G}\\ \\neq\\ 0 \\ \\text{ in } \\mathcal{D}^!(\\mathrm{pt}) = \\mathrm{Vect}\\right\\}.\n$$\n\n</details>\n\n**Step 9 — $\\left|\\overline{LX}_\\lambda\\right|\\subseteq\\left|\\operatorname{supp}\\mathcal{F}\\right|$.**\n\n<details><summary>the argument</summary>\n\nLet $x\\in\\left|\\overline{LX}_\\lambda\\right|$ and put $\\mathcal{T}=\\mathrm{pt}$, $\\varphi = q\\circ x$. The lift $x$ trivializes $P_{\\mathrm{pt}}\\simeq K$, and $K\\times_{LX}\\overline{LX}_\\lambda = K$ by $K$-stability, so Step 2 makes the base change of the monomorphism $Z_{\\mathrm{pt}}\\rightarrow\\mathrm{pt}$ along the faithfully flat $K\\rightarrow\\mathrm{pt}$ an isomorphism; by descent $Z_{\\mathrm{pt}}\\simeq\\mathrm{pt}$. Step 6 with $f$ replaced by $\\varphi$ then gives $\\varphi^!\\mathcal{F}\\simeq\\omega_{\\mathrm{pt}} = k\\neq 0$.\n\n</details>\n\n**Step 10 — $\\left|\\operatorname{supp}\\mathcal{F}\\right|\\subseteq\\left|\\overline{LX}_\\lambda\\right|$.**\n\n<details><summary>the argument</summary>\n\nLet $x\\in|LX|$ lie outside $\\left|\\overline{LX}_\\lambda\\right|$. By $K$-stability no $K$-translate of $x$ meets $\\overline{LX}_\\lambda$, so $K\\times_{LX}\\overline{LX}_\\lambda = \\emptyset$ and Step 2 gives $Z_{\\mathrm{pt}}\\times_{\\mathrm{pt}}K=\\emptyset$, whence $Z_{\\mathrm{pt}}=\\emptyset$ by faithful flatness. Since $\\mathcal{D}^!(\\emptyset) = 0$, Step 6 gives $(q\\circ x)^!\\mathcal{F}\\simeq i_{\\emptyset,*}(0) = 0$. With Step 9 this proves the displayed support equality.\n\n</details>\n\n**Step 11 — $\\mathcal{F}\\neq 0$.**\n\n<details><summary>the argument</summary>\n\nThe stratum $LX_\\lambda$ indexed by $\\lambda$ is an orbit through a $k$-point ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html), [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)), so $\\left|\\overline{LX}_\\lambda\\right|\\neq\\emptyset$. Pick $x$ in it: Step 9 gives $(q\\circ x)^!\\mathcal{F}\\simeq k\\neq 0$, and a functor sends $0$ to $0$, so $\\mathcal{F}\\neq 0$ in $\\mathcal{D}^!(\\mathcal{Y})$. $\\blacksquare$\n\n</details>\n\n## Caveats\n\n**1. Which $\\lambda$ hypothesis (A) is available at.** The parenthetical inside **(A)** — that finite presentation \"holds for $X$ smooth affine spherical\" — over-reaches, and [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) cannot supply it at every $\\lambda\\in\\Lambda_X^+$ as [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) reads that set, namely as indexing *all* $L^+G$-orbits of $LX$. For $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ the origin of $L\\mathbb{A}^1$ is one $K$-orbit and is its own closure; its base change along $t^{-l}\\mathcal{O}=\\operatorname{Spec}k[x_j]_{j\\geq-l}\\rightarrow L\\mathbb{A}^1$ is cut out by $(x_j)_{j\\geq -l}$, an ideal that is not finitely generated, since finitely many of its elements involve only $x_{-l},\\dots,x_N$ and so vanish at the point with $x_{N+1}=1$ and all other coordinates $0$, where $x_{N+1}$ does not. So $\\overline{i}_\\lambda$ is not finitely presented there and this write-up proves nothing at that $\\lambda$. Chen–Yi's Theorem 36 runs through the description of $LX_\\lambda$ by arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ (its Lemma 34, p. 20, with Remark 37, p. 22), indexed by $\\Lambda_S^+$: those are the $\\lambda$ the argument reaches, and for non-homogeneous $X$ they are not all of $\\Lambda_X^+$. What would close it is an entry restricting the index range of clause (a) — not one asserting (A) more widely, which the example refutes.\n\n**2. Two ingredients no entry carries.** The support convention of Step 8 is fixed here and by no appendix entry. That direct image along a closed immersion of finite-type schemes preserves coherence (Step 7) is invoked as standard finite-type $\\mathcal{D}$-module theory; the appendix has no entry for it.\n\n**3. (B) is a hypothesis.** [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html) says in as many words that no equivariance is asserted, so the $K$-equivariant base change spent at Steps 6, 9 and 10 is assumed, not derived.\n\n*Entries used beyond the node's `objects:` field:* [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html), [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html), [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html).\n";</script>
