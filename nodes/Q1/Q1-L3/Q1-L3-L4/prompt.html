athcal{D}_{c}(K\\backslash LX)$?](../../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../key_examples/k4.html), the symplectic period [K6](../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../key_examples/k9.html); and [K6](../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It refines [Q1-L3](../index.html). Its conclusion is required directly by [Q1-L3](../index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-07 — `REFUTED` at [r1](critiques/r1.html): hypothesis (A)'s parenthetical is false, and the parent's quantifier with it.** `/prove Q1-L3-L4`. The prover drafted, flagged the scope rather than routing around it, and the referee verified the witness from the definitions and the source at page level.\n\n  **The failing case.** Take $X=\\mathbb{A}^1$ with $G=\\mathbb{G}_m$ — in the standing class, and key example [K1](../../../../key_examples/k1.html). The origin of $L\\mathbb{A}^1$ is a closed $L^+G$-orbit, indexed by $\\Lambda_X^+$ as [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) and [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) define it, and equal to its own closure. Base-changed along the stage $t^{-l}\\mathcal{O}=\\operatorname{Spec}k[x_j]_{j\\ge-l}$, its embedding is cut out by the ideal $(x_j)_{j\\ge-l}$, which is not finitely generated. So $\\overline{i}_\\lambda$ is **not** finitely presented at that $\\lambda$.\n\n  **The refuted statement, verbatim.** Only hypothesis (A) is false; the rest is quoted for the record.\n\n  > **(A) Finite presentation.** $\\overline{i}_\\lambda$ is a finitely presented closed embedding, which is clause **(a)** of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) and holds for $X$ smooth affine spherical.\n\n  **False only as stated, not in substance.** The node fixes $\\lambda$ and *assumes* (A), so the conditional core survives at every $\\lambda$ where (A) holds; what is false is the parenthetical asserting (A) holds throughout the standing class. `draft:` therefore keeps pointing at [proof.md](proof.html), which proves that conditional — this is not the empty-write-up case §3f was written for.\n\n  **What the source actually says**, read this run in `papers/chenyi_2025singularitiesorbitclosuresloop.pdf`: Lemma 34 (p. 20) describes $LX_\\lambda$ by arcs into the **open-$G$-orbit** locus $L^+\\mathcal{X}^\\bullet_\\lambda$; the proof of Thm 36 (p. 21) quantifies \"For any $\\lambda\\in\\Lambda_S^+$\"; Remark 37 (p. 22) widens the **variety class** and not the **index range**. So [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) as transcribed reads wider than its source — a MAJOR `M` against the entry, not against this node.\n\n  **A second MAJOR the prover did not flag.** Step 1 imports placidity of $\\overline{LX}_\\lambda$ from the same disputed clause, at the same arbitrary $\\lambda$, so the conditional is proved only where that clause independently applies.\n\n  **Suggested corrected statement — a suggestion only, adopted by nothing.** Replace (A)'s parenthetical with a declared range: *\"$\\overline{i}_\\lambda$ is a finitely presented closed embedding — clause **(a)** of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), available for $\\lambda$ in the index range that entry's source establishes and not for all of $\\Lambda_X^+$\"* — and declare placidity of $\\overline{LX}_\\lambda$ as a hypothesis beside it. The next action is `/update Q1-L3-L4`, never another `/prove`, and the durable fix is an appendix entry **restricting** clause (a)'s index range; an entry asserting (A) more widely is refuted by the witness above.\n\n## Target statement\n\n**Setup.** In the standing setting of [context](../../../../context.html), fix $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)), let $\\overline{LX}_\\lambda$ be the reduced orbit closure of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html) with its closed embedding $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), and let $\\omega_{K\\backslash\\overline{LX}_\\lambda}$ be the dualizing object of [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html). Assume:\n\n**(A) Finite presentation.** $\\overline{i}_\\lambda$ is a finitely presented closed embedding, which is clause **(a)** of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) and holds for $X$ smooth affine spherical.\n\n**(B) The equivariant closed pushforward.** $\\overline{i}_{\\lambda,*}\\colon\\mathcal{D}^!(K\\backslash\\overline{LX}_\\lambda)\\rightarrow\\mathcal{D}^!(K\\backslash LX)$ denotes the $K$-equivariant form of the pushforward of [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html) along $\\overline{i}_\\lambda$ — the functor main.tex:1221–1227 writes $i_*$ — and it satisfies base change against $!$-pullback, as clause (ii) of that entry does for ind-schemes.\n\nThen $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a **coherent** object of $\\mathcal{D}(K\\backslash LX)$ in the sense of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), it is **nonzero**, and its support is the whole orbit closure:\n\n$$\n\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}\\ \\in\\ \\mathcal{D}_c(K\\backslash LX), \\qquad \\left|\\operatorname{supp}\\ \\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}\\right| = \\left|\\overline{LX}_\\lambda\\right| .\n$$\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../appendix/conj-intro.html) holds for $X$.\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../../appendix/conv-d-shriek-d-star.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), ratified at [Q1-L1](../../Q1-L1/index.html).\n\n### [loops, jets and positive loops are placid — $L^nX$, $L^+X$, $LX$](../../../../appendix/ex-loops-placid.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Example** (main.tex:694–718, unlabelled; cite by line). Let $X\\in\\mathrm{AffSch}^{f.t.}$ be smooth affine of finite type. The $n$-jets $L^nX$, defined on $k$-algebras by\n\n$$\nL^nX(R) := X\\left(R[t]/t^n\\right),\n$$\n\nare represented by affine schemes of finite type, and the presentation $L^+X\\simeq\\varprojlim_n L^nX$ exhibits the positive loop space $L^+X$ as a placid scheme ([placidity](../../../../appendix/placid-ind-scheme.html)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **hypotheses:** $X$ smooth affine of finite type\n- **note:** applied to $X = G$ this presents $K = L^+G$ ([the standing notation](../../../../appendix/subsec-notations.html)) as $\\varprojlim_m L^mG$ with the jet groups $L^mG$ as levels and homomorphic transitions; $L^1G = G$, so the level-one evaluation is evaluation at $t = 0$. Caveat transcribed from main.tex:710–717: if placid presentations are required to have *surjective* transitions, as in [[raskin_dmodules_infinite_var, §4.2](../../../../../papers/raskin_dmodules_infinite_var.pdf)], the pieces $LX^i$ need not be placid in that stricter sense (see [[BZSV, Example 7.2.2](../../../../../papers/BZSV.pdf)]).\n\n### [$\\omega_{\\mathcal{Y}}$ — the dualizing object of a prestack](../../../../appendix/not-dualizing-object.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (blueprint notation; main.tex uses no symbol for this object — the letter $\\omega$ appears in the manuscript only as the compactness superscript $(-)^\\omega$ of [compact objects](../../../../appendix/def-compact-objects.html), main.tex:523. What the notation names is the $!$-pullback of the unit along the structure map in the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html), main.tex:651–668). Let $\\mathcal{Y}\\in\\mathrm{PreStk}$ with structure map $p_{\\mathcal{Y}}\\colon\\mathcal{Y}\\rightarrow\\mathrm{pt}$, and identify $\\mathcal{D}^!(\\mathrm{pt}) = \\mathrm{Vect}$ with unit $k$ ([`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html), [`DGCat`, `Vect`](../../../../appendix/conv-dgcat.html)). The **dualizing object** of $\\mathcal{Y}$ is\n\n$$\n\\omega_{\\mathcal{Y}} := p_{\\mathcal{Y}}^!(k)\\ \\in\\ \\mathcal{D}^!(\\mathcal{Y}).\n$$\n\nSince $\\mathcal{D}^!$ is a functor on $\\mathrm{PreStk}^{op}$, every morphism $f\\colon\\mathcal{Y}'\\rightarrow\\mathcal{Y}$ satisfies $p_{\\mathcal{Y}'} = p_{\\mathcal{Y}}\\circ f$ and hence carries a canonical identification\n\n$$\nf^!\\,\\omega_{\\mathcal{Y}}\\ \\simeq\\ \\omega_{\\mathcal{Y}'} .\n$$\n\nFor $S$ a nonempty scheme of finite type this is the usual dualizing complex: $\\omega_S\\in\\mathcal{D}_c(S)$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) and $\\omega_S\\neq 0$.\n\n- **note:** *What the entry does and does not supply.* The definition and the $!$-pullback compatibility are formal consequences of $\\mathcal{D}^!$ being contravariantly functorial on prestacks, and hold for every $\\mathcal{Y}$ with no placidity or finiteness hypothesis. The closing sentence, about finite-type schemes, is standard and is recorded so that a node may lower a statement about $\\omega_{\\mathcal{Y}}$ to a finite-type test scheme and finish there. Nothing here asserts that $\\omega_{\\mathcal{Y}}$ is coherent, or nonzero, for an infinite-dimensional $\\mathcal{Y}$ such as $K\\backslash\\overline{LX}_\\lambda$: that is a claim a node proves, and it is the content of [Q1-L3-L4](index.html).\n- **note:** *Not the same as a dimension theory.* [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) and [the three standing hypotheses](../../../../appendix/assum-intro.html)(b) supply the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ on $LX$; they are what let a node stop distinguishing $!$- and $*$-versions, and they are not needed to write down $\\omega_{\\mathcal{Y}}$, which lives on the $\\mathcal{D}^!$ side by construction.\n- **note:** **Open tension on ind-schemes, flagged and not resolved.** Two readings in this appendix cannot both be taken literally on an ind-scheme, and the conflict is recorded at [Q1-L3](../history.html) and ranked on [Q1's pipeline](../../index.html#pipeline). Taking $\\mathcal{D}^!$ as the Kan extension of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html), the structure map $p_{\\mathcal{Y}}$ is a morphism of prestacks like any other, so $\\omega_{\\mathcal{Y}} = p_{\\mathcal{Y}}^!(k)$ exists for $\\mathcal{Y} = \\mathrm{Gr}$ or $\\mathcal{Y} = LX$; and since $f^!\\omega_{\\mathcal{Y}} = \\omega_S$ for every smooth finite-type test $f\\colon S\\rightarrow\\mathcal{Y}$, the letter of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) then makes it *coherent with support everything*. That contradicts the colimit presentations of [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) and of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(4), under which every object comes from a stage and so has bounded support. The likely resolution is that the colimit categories are not the Kan-extended $\\mathcal{D}^!(\\mathcal{Y})$ but a subcategory of it, and $\\omega_{\\mathcal{Y}}$ lies outside for ind-infinite $\\mathcal{Y}$. **Until it is settled, use this entry only for $\\mathcal{Y}$ an ind-scheme that is one stage — a placid scheme, or a $K$-quotient of one, such as $K\\backslash\\overline{LX}_\\lambda$** — which is the only use [Q1-L3-L4](index.html) makes of it, and never for $\\mathcal{Y} = \\mathrm{Gr}$ or $\\mathcal{Y} = LX$.\n\n### [Raskin: descent for $\\mathcal{D}^!$ along a torsor under a quasi-compact group scheme](../../../../appendix/bb-raskin-torsor-descent.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.17 and Prop. 3.17.2](../../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). Let $S$ be a quasi-compact quasi-separated base scheme and let $\\mathcal{G}\\rightarrow S$ be a quasi-compact quasi-separated group scheme over $S$; no finite-type hypothesis is placed on $\\mathcal{G}$. For a quasi-compact quasi-separated $S$-scheme $\\mathcal{P}$ carrying an action of $\\mathcal{G}$, the bar complex of the action,\n\n$$\n\\cdots\\ \\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{P},\n$$\n\ninduces a diagram of $!$-pullbacks, and the *$\\mathcal{G}$-equivariant derived category of $\\mathcal{P}$* is defined to be its limit:\n\n$$\n\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}} := \\varprojlim\\left(\\mathcal{D}^!(\\mathcal{P})\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\cdots\\right).\n$$\n\nCall $\\mathcal{P}\\rightarrow S$ a *$\\mathcal{G}$-torsor* if $\\mathcal{G}$ acts on $\\mathcal{P}$ and there is an fppf base change $S'\\rightarrow S$ admitting a $\\mathcal{G}$-equivariant identification $\\mathcal{P}\\times_S S' = \\mathcal{G}\\times_S S'$. Then for every $\\mathcal{G}$-torsor $\\mathcal{P}\\rightarrow S$ the canonical functor, given by $!$-pullback along $\\mathcal{P}\\rightarrow S$,\n\n$$\n\\varphi\\colon\\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}}\n$$\n\nis an equivalence.\n\n- **hypotheses:** $S$ quasi-compact quasi-separated, $\\mathcal{G}\\rightarrow S$ a quasi-compact quasi-separated $S$-group scheme, and $\\mathcal{P}$ a quasi-compact quasi-separated $S$-**scheme** — representability of $\\mathcal{P}$ is part of the hypothesis, while finite type on $\\mathcal{G}$ is not required. The action must exhibit $\\mathcal{P}\\rightarrow S$ as an fppf-locally trivial torsor as displayed, and the conclusion concerns $\\mathcal{D}^!$ alone: nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)), about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), or about the $\\mathcal{D}^*$-coinvariant analogue, which is the source's §3.24.\n- **note:** **The base is a scheme, never a stack — the gap a user must bridge.** The source's $S$ is a scheme and $\\mathcal{P}\\rightarrow S$ an honest torsor of schemes, so this entry does *not* by itself evaluate $\\mathcal{D}^!$ on a quotient stack $B\\mathcal{G}=\\mathrm{pt}/\\mathcal{G}$.\n\n  The dictionary a node must supply is this. $\\mathcal{D}^!$ is a right Kan extension from $\\mathrm{AffSch}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)), so $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{T\\rightarrow B\\mathcal{G}}\\mathcal{D}^!(T)$ over the affine tests, and each test pulls the atlas $\\mathrm{pt}\\rightarrow B\\mathcal{G}$ back to an honest $\\mathcal{G}$-torsor $\\mathcal{P}_T\\rightarrow T$ to which the entry applies; assembling those pointwise equivalences into the single statement $\\mathcal{D}^!(B\\mathcal{G})\\simeq\\varprojlim_{[n]}\\mathcal{D}^!(\\mathcal{G}^{\\times n})$ is the citing node's own work.\n- **note:** *Provenance.* Read on the page in `papers/raskin_dmodules_infinite_var.pdf`: the setting and the definition of $\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}}$ are §3.17, p. 15; the equivalence is Prop. 3.17.2, p. 16, proved there by reduction along an fppf base change to a trivial bundle, where the bar complex splits. The standing base field has characteristic $0$ (§1.13, p. 4), and §3.14, p. 14 is what licenses writing $\\mathcal{D}^!$ for the $\\widetilde{\\mathcal{D}}^!$ of §3.12.\n\n  *Why the $h$-descent statements do not suffice.* In the source $h$-coverings are **finitely presented** (§3.12 with footnote 2, p. 12), so neither Prop. 3.12.1, p. 12 nor its indschematic form Prop. 6.6.1, p. 35 reaches an atlas whose fibres are placid and not of finite type. The entry above is the statement that does, because its $\\mathcal{G}$ is only quasi-compact quasi-separated.\n\n  *Companion checks, same source.* Any affine group scheme over a characteristic-$0$ field is placid (Ex. 4.2.2, p. 19); a placid scheme is automatically quasi-compact and quasi-separated (Rem. 4.2.7, p. 20); and for $S$ of finite type and $\\mathcal{G}\\rightarrow S$ a projective limit of smooth $S$-group schemes under smooth surjective affine maps, every $\\mathcal{G}$-torsor over $S$ is placid (Ex. 4.2.3, p. 19). These are the pages a node cites when discharging the quasi-compactness hypotheses above.\n\n  *The indscheme rendering.* §6.7, p. 36 repeats the definition for a group indscheme over an indscheme base, and Prop. 6.7.1 asserts the same equivalence $\\mathcal{D}^!(S)\\simeq\\mathcal{D}^!(\\mathcal{P}_{\\mathcal{G}})^{\\mathcal{G}}$ there — the statement main.tex:1217 already cites. It moves the base from a scheme to an indscheme and still not to a stack, so it closes no part of the gap named above.\n\n  *Orientation, not licensed.* Remark 2.3.1, p. 5 says that \"for a nice enough stack $\\mathcal{Y}$\" with a hypercovering by affine schemes $Y_n$ one has $\\mathcal{D}^!(\\mathcal{Y})=\\varprojlim_{[n]\\in\\Delta}\\mathcal{D}^!(Y_n)$; it is unnumbered and \"nice enough\" is never made precise, so it is recorded here for orientation only and is not part of what this entry licenses.\n\n  *Index category.* The source calls the displayed bar complex *semisimplicial* and draws only its face maps, leaving the index category of the limit unnamed; a node needing $\\Delta$ rather than $\\Delta_{\\mathrm{inj}}$, or the reverse, supplies that cofinality itself.\n- **note:** *Commissioned by* the round-1 critique of [Q1-L4-L4](../../Q1-L4/Q1-L4-L4/critiques/r1.html), Flaw 3: an entry asserting $\\mathcal{D}^!(BH)\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m)$ would assume that node's own conclusion, so what was asked for was the primitive descent statement one level below. Beraldo's pro-unipotent results are *not* that primitive and are not black-boxed here: [[beraldo2017loop, Cor. 4.3.1, Thm. 4.3.2](../../../../../papers/beraldo2017loop.pdf)] assume $H$ pro-unipotent, and the surrounding §4.2 assumes a Levi decomposition $H\\simeq H^r\\ltimes H^u$ — hypotheses no node in Q1 currently has.\n\n### [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../../appendix/bb-raskin-fp-pushforward.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.9 with Prop. 3.9.2, §6.3, and Table 1](../../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). A morphism $f\\colon S\\rightarrow T$ of ind-schemes is *finitely presented* if it is schematic and its base change along any scheme is a finitely presented morphism (the source's §6.3). For such $f$ the source constructs a pushforward on the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html),\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(T),\n$$\n\nwhich it names the *\"$!$-dR $*$-pushforward functor\"*, and:\n\n**(i) Functoriality through correspondences.** $\\mathcal{D}^!$ upgrades, by left Kan extension, to a functor $\\mathcal{D}^{!,\\mathrm{enh}}$ out of the category of ind-schemes under correspondences $T\\xleftarrow{\\ \\alpha\\ }H\\xrightarrow{\\ \\beta\\ }S$ whose right leg $\\beta$ is finitely presented and whose left leg $\\alpha$ is arbitrary, carrying such a correspondence to $\\beta_{*,!-\\mathrm{dR}}\\,\\alpha^!$. In particular $f\\mapsto f_{*,!-\\mathrm{dR}}$ is compatible with composition of finitely presented morphisms.\n\n**(ii) Base change against $!$-pullback.** For a Cartesian square of ind-schemes\n\n$$\n\\begin{array}{ccc} S' & \\xrightarrow{\\ \\psi\\ } & S\\\\ \\downarrow f' & & \\downarrow f\\\\ T' & \\xrightarrow{\\ \\varphi\\ } & T\\end{array}\n$$\n\nwith $f$ finitely presented, the canonical map $\\varphi^!\\,f_{*,!-\\mathrm{dR}}\\rightarrow f'_{*,!-\\mathrm{dR}}\\,\\psi^!$ is an equivalence; Table 1 records this as \"always satisfies base-change with upper-$!$ functors\", with no hypothesis on $\\varphi$.\n\n**(iii) The proper adjunction.** If $f$ is in addition proper, then $f^!$ is canonically right adjoint to $f_{*,!-\\mathrm{dR}}$ — equivalently, $f_{*,!-\\mathrm{dR}}$ is the left adjoint of $f^!$.\n\n**(iv) The same construction for prestacks** *(added 2026-08-08; this clause **amends** the entry and, with it, what every node citing this anchor asserts — see the amendment note below)*. The source states the definition and the pushforward one generality up, for prestacks rather than ind-schemes. A morphism $f\\colon\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks is *finitely presented* if it is schematic and if for every $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathrm{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented; for every such $f$ there is a functor\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(\\mathcal{Y})\\longrightarrow\\mathcal{D}^!(\\mathcal{Z})\n$$\n\ncompatible with base change. *Schematic is meant classically*: the source's Remark 3.16.1 emphasises that \"by *schematic*, we mean schematic in the sense of classical (i.e., non-derived) algebraic geometry, which is a more forgiving notion than that of derived algebraic geometry\", the example given there being the embedding of $0$ inside the ind-scheme attached to an infinite-dimensional $k$-vector space — classically schematic, not DG schematic.\n\n**A quotient prestack is a prestack, and this is the clause to cite there.** For a group $K$ acting on $\\mathcal{Y}$ and on $\\mathcal{Z}$, the induced $K\\backslash\\mathcal{Y}\\rightarrow K\\backslash\\mathcal{Z}$ is a morphism of prestacks and is covered by the definition above verbatim. A node computing a pushforward and its base change on $K\\backslash LX$ therefore does **not** owe the assembly of [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) for that step; what it owes instead is finite presentation of the quotient morphism itself, in the sense just displayed.\n\n- **hypotheses:** $f$ **finitely presented** in the source's sense — for (i)–(iii) the ind-scheme sense recalled at the top, for (iv) the prestack sense of that clause — and, for (iii) alone, in addition **proper**. Placidity is *not* a hypothesis of any clause, and neither is any equivariance. *What each generality reaches.* Clauses (i)–(iii) are stated for ind-schemes: the correspondence functoriality, the base change in the displayed form, and the proper adjunction are asserted there and nowhere wider. Clause (iv) is stated for **prestacks**, hence for quotient prestacks $K\\backslash(-)$, but it asserts only the existence of $f_{*,!-\\mathrm{dR}}$ and its compatibility with base change — the source states neither (i) nor (iii) at that generality, so a node wanting the correspondence formalism or the proper adjunction on a quotient prestack still owes them. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) or about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)).\n- **note:** **There is one pushforward on $\\mathcal{D}^!$, and its name carries a $*$.** A node writing $f_!$ for the left adjoint of $f^!$ and a node writing $f_*$ for the pushforward defining a convolution ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) are, on $\\mathcal{D}^!$ and for finitely presented $f$, naming the same functor $f_{*,!-\\mathrm{dR}}$ of this entry. That is the whole of what the source licenses on this point.\n\n  **What is *not* licensed** is the identification of $f_{*,!-\\mathrm{dR}}$ with the $\\mathcal{D}^*$-pushforward $f_{*,\\mathrm{dR}}\\colon\\mathcal{D}^*(S)\\rightarrow\\mathcal{D}^*(T)$ across the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ that a dimension theory supplies ([sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html), [the three standing hypotheses](../../../../appendix/assum-intro.html)(b)). The source introduces the subscript precisely \"to avoid confusion\" between the two (§3.9, p. 9), and Table 1 lists two further renormalized functors $f_{*,\\mathrm{ren}}$ and $f^{!,\\mathrm{ren}}$ for placid $S,T$ equipped with dimension theories. A node needing that identification still owes it.\n- **note:** *Provenance, verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-06. Table 1, p. 3, row 3: hypothesis \"$f$ ind-finitely presented\", functor $f_{*,!-\\mathrm{dR}}\\colon D^!(S)\\rightarrow D^!(T)$, adjunctions \"Left adjoint to $f^!$ for $f$ ind-proper; right adjoint to $f^!$ up to cohomological shift for $f$ smooth\", base change \"Always satisfies base-change with upper-$!$ functors\", references §3.9 and §6.3. §3.9, p. 9 introduces $f_{*,!-\\mathrm{dR}}$ for a finitely presented map of quasi-compact quasi-separated **schemes** and notes that \"the formalism of correspondences implies that we have base-change between $*$-pushforward and $!$-pullback for Cartesian squares\"; Prop. 3.9.2, p. 10 is the proper adjunction in that scheme setting. §6.3, p. 34 is the ind-scheme upgrade quoted above, ending \"If $f$ is additionally assumed proper or smooth, we again have the usual adjunctions.\"\n\n  *A typo on the page.* The displayed compatibility inside Prop. 3.9.2 is printed as $f_{*,\\mathrm{dR}}\\varphi^!\\xrightarrow{\\ \\simeq\\ }\\psi^!f'_{*,!-\\mathrm{dR}}$, whose subscripts and primes do not typecheck against the Cartesian square drawn immediately above it. Clause (ii) states the base change in the form that does, which is the form Table 1 asserts.\n- **note:** *Commissioned by* the `/prove Q2` failure audit of 2026-08-06: **GAP (Prop)** at Step 4 of [Q2-L5](../../../Q2/Q2-L5/index.html)'s write-up, which asked for four clauses. Three are above. The fourth, \"$f_!\\simeq f_*$\", is reached only in the notational sense recorded in the first note and **not** as an identification across the $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ duality.\n- **note:** *Provenance of clause (iv), verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-08. §3.16, printed p. 15, titled *Correspondences for prestacks*, reads verbatim: \"We say that a morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ is finitely presented if it is schematic, and if for any $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathsf{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented. As another corollary of Proposition 3.6.1, we obtain that there is a functor $f_{*,!-dR}$ compatible with base-change for any finitely presented morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks.\" Remark 3.16.1, immediately below on the same page, is the classical-schematic caveat quoted in clause (iv). §3.17, the equivariant setting behind [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html), begins on the same printed page.\n\n  *Two readings in clause (iv) are the transcriber's and not the page's.* First, the source writes only \"compatible with base-change\" and does not display the square; that this means the equivalence $\\varphi^!f_{*,!-\\mathrm{dR}}\\simeq f'_{*,!-\\mathrm{dR}}\\psi^!$ of clause (ii), now for a Cartesian square of prestacks, is read from Table 1's \"always satisfies base-change with upper-$!$ functors\" and from §3.9's own sentence about the formalism of correspondences. Second, $\\mathcal{D}^!$ on a prestack is here the one of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html) (main.tex:651–668); identifying it with the source's is the same dictionary clauses (i)–(iii) already rest on, and this entry does not re-derive it.\n- **note:** *What the amendment of 2026-08-08 changed, and what it withdrew.* Before that date this entry was transcribed from §3.9, §6.3 and Table 1 alone — schemes and ind-schemes — and its hypotheses line asserted that \"$S$ and $T$ are ind-schemes, never quotient stacks, so a node working on $K\\backslash LX$ supplies the descent from the ind-scheme statement itself, exactly as [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) requires.\" **That sentence was too restrictive and is withdrawn**, not merely supplemented: §3.16 states the definition and the base-change-compatible pushforward for prestacks outright, so on $K\\backslash(-)$ the pushforward and its base change are clause (iv) and no descent argument is owed for them. What survives of the old sentence: the torsor-descent entry is still what a node needs in order to *evaluate* $\\mathcal{D}^!$ on a quotient by an atlas, and clauses (i) and (iii) are still ind-scheme statements. A node whose write-up was built against the withdrawn sentence has an argument that is sound and longer than it needs to be, not one that is wrong.\n\n### [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)); ratified at [Q1-L1](../../Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q1-L3-L4](index.html) was refuted at [r1](critiques/r1.html) on exactly the computation that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n- **note:** this is what makes [the three standing hypotheses](../../../../appendix/assum-intro.html)(a) automatic in the paper's generality, and it is the source of every stratification argument in Q1. Which clause the citing nodes actually consume, and whether they consume it inside the range clause (a) now states — twenty node files link this entry from their `objects:` field (grep of `blueprint/nodes`, 2026-08-09):\n\n  *Inside the range.* [Q1-L3](../index.html) does not read (a) off this entry at all: its hypothesis **(C)** posits a subset $\\Lambda'\\subseteq\\Lambda_X^+$ carrying the finite presentation, and its own text already records that the source establishes (a) only over the open-$G$-orbit range. [Q1-L4-e4](../../Q1-L4/Q1-L4-e4/index.html) restricts $X$ to symmetric, where $\\mathring{X} = X$ and the restriction is vacuous.\n\n  *Outside it.* Eleven nodes take clause (a) at an unrestricted index — some $\\lambda\\in\\Lambda_X^+$, or a pair $\\mu\\le\\mu'$ — with $X$ only smooth affine spherical and so possibly non-homogeneous: [Q1-L3-L4](index.html), [Q1-L3-L5](../Q1-L3-L5/index.html), [Q1-L4](../../Q1-L4/index.html), [Q1-L4-L1](../../Q1-L4/Q1-L4-L1/index.html), [Q1-L4-L1-L3](../../Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/index.html), [Q1-L5-L3](../../Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L3-L2](../../Q1-L5/Q1-L5-L3/Q1-L5-L3-L2/index.html), [Q1-L5-L3-L3](../../Q1-L5/Q1-L5-L3/Q1-L5-L3-L3/index.html), [Q1-L5-L4](../../Q1-L5/Q1-L5-L4/index.html), [Q1-L5-L5](../../Q1-L5/Q1-L5-L5/index.html), and [Q1-L5-L6](../../Q1-L5/Q1-L5-L6/index.html). What each needs is the finite presentation of $j_\\lambda$, of $\\overline{i}_\\mu$ and of $\\overline{LX}_\\mu\\hookrightarrow\\overline{LX}_{\\mu'}$ — clause (a) — and on this entry as now stated it has that at the indices of $\\Lambda_X^{+,\\circ}$ and, beyond them, from main.tex:770–772 alone. Naming them is this entry's job; repairing them is `/update`'s and `/prove`'s.\n\n  *At the boundary the range excludes.* The failure itself — for $X$ with a $G$-fixed point the closed stratum $\\{x_0\\}$ has $\\overline{i}_{\\lambda_0}$ not finitely presented — is what the amendment records, and no node states it at present: [Q3](../../../Q3/index.html) has none, its first decomposition having been removed unattempted on 2026-08-09 ([the register](../../../removed.html)). [Q1-L4-e1](../../Q1-L4/Q1-L4-e1/index.html) for $X = \\mathbb{A}^1$ and [Q1-L5-e4](../../Q1-L5/Q1-L5-e4/index.html) for $X = M_n$ are the two non-homogeneous instances whose index sets contain such a boundary index.\n\n  *Neither clause's range.* [Q1-L5](../../Q1-L5/index.html)(H2) consumes clause (b), the indexing of the limit. [Q1-L3-a2](../Q1-L3-a2/index.html) names this entry for the loop-space-to-$p$-adic dictionary and consumes neither.\n- **note:** *Provenance, checked at page level on 2026-08-05 against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025).* In v4, Theorem 36 (§5.2, p. 21) is clause (a) above and **not** the presentation; the presentation is Proposition 39(ii) (§5.3, p. 23), whose part (i) is the $I_0$-statement. Proposition 39 states the steps as the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$, indexed by tuples $\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}$ and called *locally equidimensional* placid presentations; the single-index form displayed above is the manuscript's (main.tex:772), and the two agree when $LX$ is connected. The proof of Thm 36 (pp. 21–22) also fixes the mechanism: $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ is the Noetherian-descent factorization of a finitely presented morphism **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$, with $j_\\lambda$ a placid fp-open and $i_\\lambda$ a placid fp-closed embedding.\n\n  *The manuscript's numbers are another version's.* main.tex:772 cites the presentation as \"[Theorem 36]\" and main.tex:1227 cites $K$-placidity of $\\overline{LX}_\\beta$ as \"[Prop. 29.(ii)]\"; neither matches v4, where those are Prop. 39(ii) and Thm 36(i). Recorded as provenance for whoever reads the source alongside the manuscript — not as a correction to main.tex, which no agent edits.\n- **note:** *The index range of clause (a), checked at page level on 2026-08-09 against the same PDF (arXiv:2310.20006**v4**, 10 Jul 2025), pp. 19–24.* Reported twice before it was acted on, and confirmed on the pages.\n\n  *§5 is set in the symmetric case, and its construction lives on the open $G$-orbit.* §5.1 (p. 20) opens \"Let $X^\\circ = BK/K\\subset X$ be the open $B$-orbit\", so $X = G/K$ is homogeneous, and p. 22 derives its exact sequences (7) from \"the fibration $K\\rightarrow G\\rightarrow G/K = X$ (note that we assume $K$ is connected)\". In the affine degeneration $\\pi\\colon\\mathcal{X}\\rightarrow A$ built there, each fibre $\\mathcal{X}_a$ is \"an affine spherical variety for $G$ (not necessary smooth and homogeneous)\", and $\\mathcal{X}^\\bullet\\subseteq\\mathcal{X}$ is defined as the open subscheme whose fibre $\\mathcal{X}^\\bullet_a\\subseteq\\mathcal{X}_a$ is the open $G$-orbit.\n\n  *Lemma 34 (p. 20) is where the range enters.* It is stated under \"Let $\\lambda\\in\\Lambda_S^+$\", fixed one paragraph above, and says that $f_\\lambda$ induces an isomorphism $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$ — the stratum is arcs into the open-$G$-orbit locus. Here $\\Lambda_S^+$ is the symmetric index set of [Chen–Yi symmetric orbit parametrization and closure relation](../../../../appendix/bb-chenyi-symmetric-orbits.html)(1), for which $\\mathring{X} = X$.\n\n  *Theorem 36's own statement carries no index restriction; its proof does.* On p. 21 the theorem quantifies $v$, $v'$, $\\lambda$, $\\lambda'$ nowhere, while the proof reads \"For any $\\lambda\\in\\Lambda_S^+$, choose $i, i'$ satisfying (6) and $LX_\\lambda\\subset L^iX$. Then Lemma 34 implies there is a Cartesian diagram …\", and obtains the fp-locally closed $\\eta_\\lambda$ by base change from $\\eta\\colon L^+\\mathcal{X}^\\bullet_\\lambda\\rightarrow L^+\\mathcal{X}_\\lambda\\rightarrow L^{i'}\\mathcal{X}_\\lambda$. So the invocation of Lemma 34 is exactly what constrains the range, and the constraint is visible only inside the proof. The Iwahori half (p. 22) is reduced to the spherical one — \"it suffices to show that the embedding $\\mathcal{O}_v\\rightarrow L^+Gx_v$ into the spherical orbit through $x_v\\in\\mathcal{O}_v$ is finitely presented\" — and so inherits the same range.\n\n  *Remark 37 (p. 22) widens the variety class and not the range.* In full: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites (spelling as in the source), Theorem 36 remains true for general spherical varieties.\" Both named inputs are steps of the proof — [SW22, Lem. 2.3.10] is what Lemma 34's own proof invokes, Theorem 35 is Drinfeld's placidity — and nothing in the remark revisits $\\mathcal{X}^\\bullet$ or the quantifier over $\\Lambda_S^+$. The two qualifications are therefore independent and both stand.\n\n### [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../appendix/ic-0.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@
