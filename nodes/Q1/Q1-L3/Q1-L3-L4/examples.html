<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L4</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L4 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L3-L4\n\n[node](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L3-L4](index.html) — that\n$\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is coherent, nonzero and\nsupported exactly on the orbit closure — and explicit instances of it, simplest first. This file\nis outside the closed world: it justifies believing or doubting the statement and no proof may\ncite it.\n\n**What a finding has to match** ([ADR 0036](../../../../process/decisions/0036-an-example-says-what-it-matches.html)). The statement has six separable pieces:\n\n- **(A)** the hypothesis \"$\\overline{i}_\\lambda$ is a finitely presented closed embedding\";\n- **(B)** the hypothesis that the $K$-equivariant $\\overline{i}_{\\lambda,*}$ exists on $\\mathcal{D}^!$ and satisfies base change against $!$-pullback;\n- **(W)** the unstated premise that $\\omega_{K\\backslash\\overline{LX}_\\lambda}=p^!k$ is a legitimate *nonzero* object of that category;\n- **(C1)** coherence of $\\overline{i}_{\\lambda,*}\\,\\omega$ in the test-scheme sense of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html);\n- **(C2)** nonvanishing;\n- **(C3)** the support equality $\\left|\\operatorname{supp}\\right| = \\left|\\overline{LX}_\\lambda\\right|$.\n\n**The dictionary.** Entries marked *analogue* live in $\\ell$-adic sheaf theory rather than in de\nRham $\\mathcal{D}$-modules. Two sentences in print license the transport, and are the whole of\nwhat does: Raskin's Remark 1.7.1, p. 2 (\"This material could just as well be given for $\\ell$-adic\nsheaves\"), and BZSV p. 156 (\"we will freely use at later points that the same discussion\ntransposes to the de Rham theory\"). Line by line: $\\mathcal{D}^!(K\\backslash Y)\\rightsquigarrow\n\\mathrm{Shv}(Y/G_{\\mathcal{O}})$; $\\mathcal{D}_c\\rightsquigarrow\\mathrm{Shv}_c$ (constructible);\n$\\omega_{\\mathcal{Y}}\\rightsquigarrow\\omega_{\\mathcal{Y}}$. What it drops: Zhu's base is the\nperfection of a regular noetherian ring of characteristic $p$ and Raskin's is a field of\ncharacteristic $0$; weights and torsion coefficients have no de Rham shadow; and *nothing* in the\ndictionary transports a compactness statement, since compactness is exactly where the two sheaf\ntheories are known to differ.\n\n## Precedent\n\n**What was searched.** On disk: `raskin_dmodules_infinite_var.pdf` §§1–2 (pp. 1–7), §4.2–4.9\n(pp. 20–23), §6.2–6.18 (pp. 33–42); `zhu2025tamecategoricallocallanglands.pdf` §10.5 (pp. 371–378);\n`GR17vol1.pdf` Ch. 4 §§4, 6 (pp. 193, 201–204); `BZSV.pdf` §7.3 (pp. 155–158);\n`mirkovic2007geometric.pdf` p. 4. Also main.tex:775–793 and main.tex:1208–1227, the manuscript's\nown use of the reduction at issue.\n\n**What was found.** No source states (C1)–(C3) for a $K$-equivariant object on a placid ind-scheme.\nFour hits, each with what it covers.\n\n- **(a) Gaitsgory–Rozenblyum, vol. I, Ch. 4 §6** (printed p. 201; `refs.bib`: `GR17vol1`). The\n  section opens: \"the direct image functor under a closed embedding for IndCoh preserves\n  compactness, which is not the case for QCoh\". **Proposition 6.1.3** then gives, for $i\\colon\n  Z\\rightarrow X$ a closed embedding of schemes almost of finite type and $j$ the complementary\n  open: (b) $\\mathrm{IndCoh}(X)_Z:=\\ker(j^{\\mathrm{IndCoh},*})$ is generated by the essential image\n  of $i_*^{\\mathrm{IndCoh}}$; (c) $i^!$ is conservative on $\\mathrm{IndCoh}(X)_Z$; (d)\n  $\\mathrm{IndCoh}(X)_Z=\\mathrm{Ind}(\\mathrm{Coh}(X)_Z)$. This is the classical form of all three\n  conclusions at once — (C1) is the compactness-preservation sentence, (C2) is (c), (C3) is the\n  membership in $\\ker(j^{*})$ that (b) describes — in a **neighbouring sheaf theory and in finite\n  type**. It reaches neither (A) nor (B), nor any object of the node's setting: $\\overline{LX}_\\lambda$\n  is almost of finite type only when $X=\\mathrm{pt}$, and the transfer to $\\mathcal{D}$-modules runs\n  through $\\mathcal{D}(X)=\\mathrm{IndCoh}(X_{\\mathrm{dR}})$, which is vol. II and was not read here.\n- **(b) Zhu, *Tame categorical local Langlands*, §10.5.2–10.5.3** (printed pp. 374, 376;\n  `refs.bib`: `zhu2025tamecategoricallocallanglands`) — **analogue**. **Lemma 10.127**:\n  $\\mathrm{Shv}(X,\\Lambda)^\\omega\\subset\\mathrm{Shv}_c(X,\\Lambda)$ for $X$ quasi-placid, and the text\n  on p. 374 adds that the two \"usually do not agree\" and that compact generation and even\n  dualizability of $\\mathrm{Shv}(X,\\Lambda)$ are open. **Example 10.134**: for $H$ connected as in\n  Ex. 10.117, $\\omega_{\\mathbb{B}H}$ is a *generalized constant sheaf* — hence by **Def. 10.128** an\n  object of $\\mathrm{Shv}_c(\\mathbb{B}H)$ — it generates $\\mathrm{Shv}_c(\\mathbb{B}H)$ as an\n  idempotent-complete stable category, and \"is in general not compact (e.g. $H=\\mathbb{G}_m$)\".\n  Under the dictionary this covers **(W)**, and covers **(C1)** and **(C2)** in the degenerate\n  specialisation $\\mathcal{Y}=\\mathbb{B}L^+G$ of instance 1 below. It says nothing about a\n  pushforward, hence nothing about (A), (B) or (C3).\n- **(c) Raskin, §4.7–4.8 and §6.14–6.15** (printed pp. 22, 40–41; `refs.bib`:\n  `raskin_dmodules_infinite_var`). For a placid *scheme* $T$ the renormalized dualizing sheaf\n  $\\omega_T^{\\mathrm{ren}}\\in D^*(T)$ is constructed (§4.7), is the constant sheaf $k_T$ when the\n  placid presentation has smooth stages (Ex. 4.7.2), and the proof of **Prop. 4.8.1** identifies it\n  as the image of $\\omega_T\\in D^!(T)$ under the equivalence $\\eta_T$. For a placid *ind-scheme*\n  with a dimension theory the $\\tau$-renormalized $\\omega_T^\\tau\\in D^*(T)$ is constructed the same\n  way (§6.14), characterized by $\\iota^!\\omega_T^\\tau=\\omega_S^{\\mathrm{ren}}[2\\tau_S]$ on reasonable\n  subschemes, and $\\eta_T^\\tau$ is again an equivalence (§6.15). This covers **(W)** in the de Rham\n  setting the node actually works in: the dualizing object of a placid scheme is a defined,\n  canonical object. It asserts nothing about coherence — §1.10 (\"Mea culpa\", p. 3) says the theory\n  \"completely ignores ... the forgetful functor to quasi-coherent sheaves\" — so (C1) is untouched.\n- **(d) Raskin, Warning 4.9.2** (printed p. 23) — the near-counterexample, and it is *not* one.\n  \"If $f\\colon S\\rightarrow T$ is a closed embedding of placid schemes, then $f_{*,ren}$ is not left\n  adjoint to $f^!$. In fact, if $f$ is a closed embedding of **infinite codimension**, then\n  $f_{*,ren}$ does not preserve compact objects and therefore does not admit a continuous right\n  adjoint at all. Moreover, the composition $f^!f_{*,ren}$ is typically zero in this case.\" Two\n  hypotheses of the node fail in its setting, and that is why it does not contradict: it concerns\n  the renormalized $f_{*,ren}$, whereas (B) names the $f_{*,!-\\mathrm{dR}}$ of\n  [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html),\n  and it requires infinite codimension, which (A) excludes. What it does establish is that (A) is\n  load-bearing: on placid schemes the finite-type intuition for closed pushforwards fails, and it\n  fails at exactly the vanishing $f^!f_*\\simeq 0$ that (C2) needs to avoid.\n\n**Bearing on the $\\omega$ tension recorded at [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html).**\nThe literature settles the phenomenon and refutes the entry's conjectured resolution. Raskin\ndefines $D^!$ on prestacks by **right** Kan extension (§2.3, p. 5), so $D^!(\\mathcal{Y})=\\varprojlim_i D^!(Y_i)$\nfor any presentation; and (6.5.1), p. 35 writes $D^!(T)=\\varinjlim_i D^!(T_i)$ along\n$\\alpha_{*,!-\\mathrm{dR}}$ for the *same* category $T$ reasonable. Both presentations therefore name\none category, and the colimit presentation of [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html)\ncarries no \"every object comes from a stage\" content — that is a statement about *compact* objects\nonly. Positively, §6.14 constructs a dualizing object on a placid ind-scheme, so the entry's guess\nthat \"$\\omega_{\\mathcal{Y}}$ lies outside\" the colimit category is not what the source says. What\nsurvives is a **constructible-versus-compact** discrepancy, in print: Zhu Lemma 10.127 with p. 374\nand Ex. 10.134. So the restriction of the entry to one-stage $\\mathcal{Y}$ is not needed for\n$\\omega$ to exist; what is genuinely in doubt is the reduction \"$\\mathcal{F}=\\iota_*c$\" that\n[$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(4) and\nmain.tex:1221 assert for all of $\\mathcal{D}_c$, which is a compactness claim made about a\ntest-scheme-defined category. That is a referral to the critic **for the parent and for that entry**,\nnot for this node, whose $\\mathcal{Y}$ is one stage either way.\n\n**What was not found.** Raskin §6 is the natural home and demonstrably lacks it: Table 1, p. 3\nrecords adjunctions and base change for $f_{*,!-\\mathrm{dR}}$ and says nothing about $\\mathcal{D}_c$,\nand §1.10 disclaims coherence-theoretic content outright. Chen–Yi (arXiv:2310.20006v4) supplies the\ngeometry — Thm. 36, Rem. 37, the content of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) —\nand states nothing at sheaf level about $\\omega$ on an orbit closure. BZSV §7.3 constructs the\nobjects and its p. 156 caveat box declines theorem status for exactly these properties. Nothing was\nfound that defines $\\operatorname{supp}$ for a $\\mathcal{D}$-module on a placid ind-stack; the\navailable surrogate is GR's $\\ker(j^{\\mathrm{IndCoh},*})$.\n\n## Instances\n\n### 1. $X=\\mathrm{pt}$, $\\lambda=0$ — **instance**, degenerate\n\n**What it is.** $X=\\mathrm{pt}$ under any connected reductive $G$ ([key example K2](../../../../key_examples/index.html)).\nThen $LX=\\mathrm{pt}$, $\\Lambda_X^+=\\{0\\}$, $\\overline{LX}_0=LX$, $\\overline{i}_0=\\mathrm{id}$, and\n$K\\backslash LX=\\mathbb{B}L^+G$.\n\n**Why it is an instance.** Smooth affine: a point is. Spherical: $B$ acts with dense orbit\ntrivially. (A): the identity is a finitely presented closed embedding. (B): the identity\npushforward, base change trivial.\n\n**What it matches.** **(W)**, **(C1)** and **(C2)**, stripped of the pushforward; **(C3)** only\ntrivially, and (A), (B) vacuously. Its printed match is the *analogue* Zhu Ex. 10.134, and the\nhypothesis check is: $L^+G=\\varprojlim_n L^+_nG$ is a cofiltered system of smooth affine group\nschemes with smooth affine transitions and $1\\rightarrow L^{+,>0}G\\rightarrow L^+G\\rightarrow\nG\\rightarrow 1$ has pro-unipotent kernel, so Ex. 10.117 applies, and $L^+G$ is connected because $G$\nis. What the analogue does not reach: the $\\ell$-adic-to-de Rham line of the dictionary, and the\n$\\mathrm{Shv}_c$-versus-$\\mathcal{D}_c$ identification, which no source read here makes.\n\n**What the statement says here.** $\\omega_{\\mathbb{B}L^+G}$ is coherent and nonzero — and, by the\nanalogue, generates $\\mathrm{Shv}_c(\\mathbb{B}L^+G)$ while failing to be compact.\n\n**Source.** Zhu, *Tame categorical local Langlands* (2025), arXiv:2504.07482 — Def. 10.128,\nEx. 10.117, Ex. 10.134, Lemma 10.127. `refs.bib`: `zhu2025tamecategoricallocallanglands`.\n\n### 2. The group case $X=H$ under $G=H\\times H$ — **instance**, classical\n\n**What it is.** $H$ connected reductive ([key example K9](../../../../key_examples/index.html)); $LX=LH$, and\nfor $\\mu\\in\\Lambda^+$ the closure $\\overline{LX}_\\mu$ is the preimage of $\\overline{\\mathrm{Gr}}_\\mu$,\nso $K\\backslash\\overline{LX}_\\mu\\simeq L^+H\\backslash\\overline{\\mathrm{Gr}}_\\mu$ with\n$\\overline{\\mathrm{Gr}}_\\mu$ a **finite-type** projective variety on which $L^+H$ acts through a\nfinite-type quotient.\n\n**Why it is an instance.** (A): $\\mathrm{Gr}=\\varinjlim_n\\mathrm{Gr}_n$ with finite-type stages and\nclosed transitions, and $\\overline{\\mathrm{Gr}}_\\mu$ is a closed subscheme of a stage, so the\nembedding is finitely presented [[mirkovic2007geometric, p. 4, (2.1)](../../../../../papers/mirkovic2007geometric.pdf)]. (B): $\\overline{i}_\\mu$ is a\nfinitely presented closed, hence proper, morphism, so\n[Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html)(ii)–(iii)\napply verbatim; the $K$-equivariant form is the descent that entry leaves to the citing node, and is\n*not* discharged here.\n\n**What it matches.** All of (A), (B), (C1), (C2), (C3), under the specialisation $G=H\\times H$,\n$X=H$, $\\Lambda_X^+=\\Lambda^+$ — the one entry that is a literal case of the whole statement. What it\ndoes not reach: the case that makes the node hard. Here the stack $K\\backslash\\overline{LX}_\\mu$ is\na finite-type stack up to a pro-unipotent kernel, so (C1) reduces to GR Prop. 6.1.3 and none of the\nplacid pathology of Warning 4.9.2 can arise.\n\n**What the statement says here.** $\\overline{i}_{\\mu,*}\\,\\omega_{L^+H\\backslash\\overline{\\mathrm{Gr}}_\\mu}$\nis coherent, nonzero, and supported on $\\overline{\\mathrm{Gr}}_\\mu=\\bigsqcup_{\\nu\\le\\mu}\\mathrm{Gr}^\\nu$,\nthe closure being the dominance order.\n\n**Source.** Mirković–Vilonen, *Geometric Langlands duality and representations of algebraic groups\nover commutative rings*, Ann. of Math. **166** (2007), p. 4, (2.1)–(2.2) (`refs.bib`:\n`mirkovic2007geometric`); Gaitsgory–Rozenblyum vol. I, Ch. 4, Prop. 6.1.3 (`refs.bib`: `GR17vol1`).\n\n### 3. Iwasawa–Tate, $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ — **instance**, the witness computed in print\n\n**What it is.** [Key example K1](../../../../key_examples/index.html). $X_F=\\varinjlim_l X^l$ with\n$X^l=t^{-l}\\mathcal{O}$, and $X^l$ is the closure of the valuation-$(-l)$ orbit. BZSV (7.8) set\n$\\delta_l=\\underline{k}_{X^l}\\langle l\\rangle$, the constant sheaf on $X^l$ with its trivial\n$G_{\\mathcal{O}}$-equivariant structure, pushed into $\\mathrm{Shv}(X_F/G_{\\mathcal{O}})$ by (7.6).\n\n**Why it is an instance.** Smooth affine spherical with connected stabilizer. (A): $X^l\\subset X_F$\nis closed and cut out inside the stage $t^{-m}\\mathcal{O}$ by finitely many coordinates. (B):\nclosed, hence proper and finitely presented. **The identification with the node's object**: $X^l =\n\\varprojlim_n X^l_n$ with each $X^l_n$ an affine space, so by Raskin Ex. 4.7.2 its renormalized\ndualizing sheaf is the constant sheaf — which is what BZSV write as $\\delta_l$, up to the twist\n$\\langle l\\rangle$. So $\\delta_l = \\overline{i}_{-l,*}\\,\\omega$ up to shift.\n\n**What it matches.** **(C2)** in print and **(C1)** in mechanism. (C2): BZSV (7.9) gives\n$\\mathrm{Hom}(\\delta_{l_1},\\delta_{l_2})\\simeq H^*(B\\mathbb{G}_m)\\langle-d\\rangle$ with\n$d=|l_1-l_2|$, so $\\mathrm{End}(\\delta_l)\\simeq H^*(B\\mathbb{G}_m)\\neq 0$ and $\\delta_l\\neq 0$.\n(C1): $\\delta_l$ arises from $\\mathrm{Shv}^l_n$, the *constructible* $\\ell$-adic sheaves on the Artin\nstack $X^l_n/G_N$ (§7.3.3 with (7.6)) — the finite-level mechanism the node's coherence test\nimitates. What it does not reach: **(C3)** is never stated, and the p. 156 caveat box withholds\ntheorem status from everything in §7.3, so this is a computation and not a proof. It also\nillustrates the tension concretely: each $\\delta_l$ comes from a stage, whereas\n$\\omega_{X_F/G_{\\mathcal{O}}}$ would be $\\varinjlim_l\\delta_l$ and comes from none.\n\n**What the statement says here.** For each $l$, the extension by $\\omega$ of the closed\n$X^l=t^{-l}\\mathcal{O}$ is a nonzero coherent object of $\\mathcal{D}_c(\\mathcal{O}^\\times\\backslash\nL\\mathbb{A}^1)$ with support $\\{v\\geq -l\\}$ — the object BZSV call $\\delta_l$, whose endomorphisms\nthey compute as $H^*(B\\mathbb{G}_m)$.\n\n**Source.** Ben-Zvi–Sakellaridis–Venkatesh, *Relative Langlands duality*, arXiv:2409.04677 —\n§7.3.1 (p. 155), §7.3.3 (pp. 157–158), Ex. 7.3.5 with (7.8)–(7.9) (p. 158). `refs.bib`: `BZSV`.\n\n### 4. Boundary: the infinite-codimension closed embedding — **instance of a failure**\n\n**What it is.** $f\\colon S\\rightarrow T$ a closed embedding of placid schemes of **infinite**\ncodimension — e.g. $\\mathrm{pt}\\hookrightarrow L^+\\mathbb{A}^1$ *(constructed, unsourced; the\nstatement below is Raskin's)*.\n\n**Why it is not an instance of the node.** Hypothesis (A) fails: an infinite-codimension closed\nembedding is not finitely presented. Hypothesis (B) also fails as read, since the failure is stated\nfor $f_{*,ren}$ and not for $f_{*,!-\\mathrm{dR}}$.\n\n**What it matches.** The *negation* of (C1) and of (C2)'s mechanism, with (A) removed:\n$f_{*,ren}$ does not preserve compact objects, and $f^!f_{*,ren}$ is typically zero — so the\nself-intersection identity $f^!f_*\\simeq\\mathrm{id}$ that produces nonvanishing collapses. This is\nwhat shows hypothesis (A) is doing work rather than decorating the statement.\n\n**What the statement says here.** Nothing — and that is the point: drop finite presentation and the\nwitness can die.\n\n**Source.** Raskin, *D-modules on infinite dimensional varieties*, Warning 4.9.2, printed p. 23.\n`refs.bib`: `raskin_dmodules_infinite_var`.\n\n## Coverage\n\n**(A)** is matched by instances 2 and 3 and shown load-bearing by 4; **(B)** by 2 and 3 at\nind-scheme level, with the $K$-equivariant descent discharged by no entry; **(W)** by precedent\n(b) and (c); **(C1)** by precedent (a) in finite-type IndCoh, by (b) under the dictionary, and in\nmechanism by instance 3; **(C2)** by precedent (a) and by instance 3 in print. **Nothing found\nmatches (C3) in the node's setting** — no source read here even defines the support of a\n$\\mathcal{D}$-module on a placid ind-stack, and the only sourced surrogate is GR's\n$\\ker(j^{\\mathrm{IndCoh},*})$ in finite type. That clause, and the $K$-equivariance of (B), are\nwhere the referee channel and not the literature channel has to carry the node.\n\nEVIDENCE: instances\n";</script>
