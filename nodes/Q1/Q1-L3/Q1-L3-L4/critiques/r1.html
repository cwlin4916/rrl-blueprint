on the open orbit $\\mathbb{G}_m$; it is [key example K1](../../../../../key_examples/index.html). On $k$-points $L\\mathbb{A}^1(R)=R((t))$ and $K=L^+\\mathbb{G}_m$ acts by multiplication, so the $K$-orbits are the valuation strata $t^n\\mathcal{O}^\\times$, $n\\in\\mathbb{Z}$, **and the origin**. The origin is the fpqc image of its orbit map, represented by the closed subscheme $\\{0\\}=\\operatorname{Spec}k$, so under the ratified reading of [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) it is a stratum, and by [$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html) — \"the poset indexing the $L^+G$-orbits of $LX$\" — it carries an index $\\lambda_0\\in\\Lambda_X^+$. It is closed, so $\\overline{LX}_{\\lambda_0}=\\{0\\}$ reduced. Its base change along $t^{-l}\\mathcal{O}=\\operatorname{Spec}k[x_j]_{j\\ge-l}\\rightarrow L\\mathbb{A}^1$ is cut out by $(x_j)_{j\\ge-l}$, not finitely generated (any $m$ generators involve only $x_{-l},\\dots,x_N$, hence vanish at the point $x_{N+1}=1$, all others $0$, where $x_{N+1}$ does not), and a closed immersion of affines is finitely presented iff its ideal is. So $\\overline{i}_{\\lambda_0}$ is not finitely presented, and the quoted clause is false at $\\lambda_0$. This is [examples.md](../examples.html) instance 4 — $\\mathrm{pt}\\hookrightarrow L^+\\mathbb{A}^1$, infinite codimension — recognised as an orbit.\n\nThe parenthetical is not decoration: with $\\lambda$ universally quantified in the Setup, it asserts that (A) is free in the standing class, which is exactly how the parent [Q1-L3](../../index.html)(ii) reads it (\"for every $\\lambda\\in\\Lambda_X^+$\"). The statement is false **only as stated** — the scope of one clause is too wide, not the substance. The repair is to delete the parenthetical and restrict $\\lambda$ to the strata Chen–Yi's mechanism reaches, and the same repair is owed at the parent's clause (ii).\n\n</details>\n\n**Flaw 2** [MAJOR] [M] — I read `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` pp. 20–22 and confirm the prover's report in all three parts.\n\n<details><summary>(proof.md line 62; [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html), clause (a) with its `hypotheses` field) · the finding</summary>\n\nLemma 34 (p. 20) reads $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$, with $\\mathcal{X}^\\bullet\\subset\\mathcal{X}$ the locus whose fibre is the **open $G$-orbit**; the proof of Theorem 36 (p. 21) opens its main case with \"For any $\\lambda\\in\\Lambda_S^+$, choose $i,i'$ satisfying (6)\"; Remark 37 (p. 22) widens the *variety class* (\"Theorem 36 remains true for general spherical varieties\") on the strength of [SW22, Lem. 2.3.10] and Theorem 35, and touches the index set not at all. So the mechanism reaches the strata that are arcs into the open-orbit locus and demonstrably not the origin of $L\\mathbb{A}^1$. The appendix entry, transcribed with hypotheses \"$X$ smooth affine spherical\" and read against the $\\Lambda_X^+$ entry's \"indexing the $L^+G$-orbits\", therefore asserts something false in this closed world. Twenty nodes cite it. What the parent needs is a new entry (or a restricted `hypotheses` field on this one) **restricting clause (a)'s index range** — not an entry asserting (A) more widely, which Flaw 1 refutes.\n\n</details>\n\n**Flaw 3** [MAJOR] [H] — Step 1 takes placidity of $\\overline{LX}_\\lambda$ — needed to put $\\mathcal{Y}_\\lambda$ inside the one-stage restriction that [$\\omega_{\\mathcal{Y}}$](../../../../../appendix/not-dualizing-object.html) imposes, so that $\\omega_{\\mathcal{Y}_\\lambda}$ is licensed at all — from `thm:chen_Ti`(a)(1), at the same arbitrary $\\lambda$ whose reach the draft's own Caveat 1 denies.\n\n<details><summary>(Step 1, proof.md line 24) · the finding</summary>\n\nThe node's hypotheses supply only (A), and an fp closed sub-ind-scheme of an ind-scheme need not be a scheme, let alone placid. So even read as a conditional at fixed $\\lambda$, the write-up proves the lemma only where the disputed clause independently applies. Fix: make \"$\\overline{LX}_\\lambda$ is a placid scheme\" a declared hypothesis alongside (A).\n\n</details>\n\n**Flaw 4** [MINOR] [N] — Coining the $!$-fibre reading of $\\operatorname{supp}$ here is legitimate — no entry defines it (I grepped), the parent's conclusion is stated in the same symbol, and it is coined in its own display.\n\n<details><summary>(Step 8, proof.md lines 48–52) · the finding</summary>\n\nBut the parent's [Q1-L3](../../index.html) reads support by the *open-cover* convention (\"$U_F$ is covered by opens on which $\\mathcal{G}$ restricts to zero\"), which is a strictly larger set. The two agree here, and the one sentence that says so is: run Step 6 with $\\mathcal{T}=K\\backslash(LX\\setminus\\overline{LX}_\\lambda)$, whose base change is empty. Add it, and commission an appendix entry fixing the convention once.\n\n</details>\n\n**Flaw 5** [MINOR] [G] (Step 5, proof.md line 36) — \"Closed immersions are fpqc-local on the base\" descends the *property* but presumes $Z_T\\rightarrow T$ is already schematic; what is available is only that its pullback to $P_T$ is.\nOne clause naming fpqc descent of affine morphisms (a closed immersion is affine) closes it.\n**Flaw 6** [MINOR] [N] — The draft works throughout in $\\mathcal{D}^!$ while the conclusion asserts membership in $\\mathcal{D}_c(K\\backslash LX)\\subset\\mathcal{D}(K\\backslash LX)$, unqualified; and hypothesis (B)'s \"base change against $!$-pullback\" is read maximally, over Cartesian squares with an arbitrary *prestack* left leg, where the entry it is modelled on quantifies over ind-schemes.\n\n<details><summary>(Steps 1, 6 and the conclusion) · the finding</summary>\n\nBoth are within (B) as declared, but each deserves its sentence.\n\n**Rulings on the two remaining flagged gaps.** Step 7's coherence of direct image along a closed immersion of finite-type schemes is standard $\\mathcal{D}$-module theory and needs no citation — correctly *not* cited, since Hotta–Takeuchi–Tanisaki has no `refs.bib` key; say only that the singular-$Z_T$ formulation is the one meant. And (B) is declared and spent as a hypothesis at Steps 6, 9, 10, never upgraded: Caveat 3 is accurate and the honesty is worth saying.\n\n</details>\n\nVERDICT: REFUTED\n";</script>
