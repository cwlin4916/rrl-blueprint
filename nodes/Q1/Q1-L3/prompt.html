of [context](../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../key_examples/k3.html), Rankin–Selberg [K4](../../../key_examples/k4.html), the symplectic period [K6](../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../key_examples/k9.html); and [K6](../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It is currently a terminal result of its proof branch.\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-09 — proved in part, and `gapped` on clause (iv)** ([r1](critiques/r1.html), [r2](critiques/r2.html), [proof.md](proof.html), [g1](gaps/g1.html)). The node's first `/prove`. Clauses **(i)**, **(ii)**, **(iii)** and the orbit form are established in full; **(iv)** stalls on a fact the appendix does not carry, and the status records that and nothing worse.\n\n  **Round 1 found two ordinary defects and one honest want.** [r1](critiques/r1.html) closed `FAIL` at 0 FATAL / 3 MAJOR / 5 MINOR, and its sort mattered more than its count. *Flaw 1*: Step 3 verified hypothesis (B) of [Q1-L3-L3](Q1-L3-L3/index.html) for $[+1]$ only, by a colimit argument that **provably cannot reach** $[-1]$ — desuspension is a limit, and connective spectra inside $\\mathrm{Sp}$ are the one-line counterexample, being closed under all small colimits, cofibres, retracts and $[+1]$ but not $[-1]$. *Flaw 2*: Step 9 applied [Q1-L3-L4](Q1-L3-L4/index.html) having checked its hypothesis (A) and not its (B), whose second half asserts base change against $!$-pullback for the equivariant pushforward and is a mathematical claim rather than notation; the draft called it \"inherited by clause (ii)\", which is a claim about the statement that the statement does not make.\n\n  **Round 2 repaired both inside the existing closed world.** Shift-stability now comes from **exactness** rather than colimits: the support convention of [Q1-L3-L2](Q1-L3-L2/index.html)'s Setup is cut out by vanishing of $!$-restrictions to opens, those restrictions are colimit-preserving between stable presentables by [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) and [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), hence exact, giving $|\\operatorname{supp}\\mathcal{G}[n]| = |\\operatorname{supp}\\mathcal{G}|$ for **all** $n\\in\\mathbb{Z}$. And hypothesis (B) of [Q1-L3-L4](Q1-L3-L4/index.html) is now *discharged* rather than inherited: two steps prove $K\\backslash\\overline{LX}_\\lambda\\rightarrow K\\backslash LX$ finitely presented in the prestack sense from (C1), using the affine $K$-torsor of [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../../../appendix/fp-convolution-morphism.html) note (e), and then apply clause (iv) of [Raskin: pushforward along a finitely presented morphism](../../../appendix/bb-raskin-fp-pushforward.html), verified on the page at `papers/raskin_dmodules_infinite_var.pdf` §3.16.\n\n  **Why the status is `gapped` and not `failing`, and what that is worth.** [r2](critiques/r2.html) closed `FAIL` at 0 FATAL / 1 MAJOR / 6 MINOR and certified the [ADR 0076](../../../process/decisions/0076-a-gap-is-a-prompt.html) condition explicitly: *every* standing MAJOR is the closed world coming up short, the sole one being the gap itself. Under that reading the mathematical channel scores **silent** rather than $-1.0$, and the node reads $-4.3\\%$ instead of $-39.3\\%$ — the whole 35-point difference turning on the referee's sort rather than on any fact about the mathematics.\n\n  **The gap, and how the referee rescoped it.** [g1](gaps/g1.html) asks for a reduction $(-)_{\\mathrm{red}}$ for ind-schemes and for geometric points to detect a closed sub-ind-scheme — [placidity](../../../appendix/placid-ind-scheme.html) supplies neither, its transition maps being smooth and affine but **not surjective**, so a $k$-point of a stage need not lift to the limit. Both referees granted the two items and confirmed clause (iv) then **finishes with nothing further owed**. The rescoping worth keeping: the engine is item **4**, very-density of $k$-points on one reduced placid stage, from which item 2 follows stagewise; and item 3 must be a *new entry* and never an amendment to [placidity](../../../appendix/placid-ind-scheme.html), which transcribes main.tex:669 verbatim.\n\n  **Left standing, and named so the next run does not rediscover them.** *Flaw 12* is statement-owned and was **not** acted on this run: read alone, clause (ii) binds neither $\\overline{i}_{\\lambda,*}$ nor $\\omega_{K\\backslash\\overline{LX}_\\lambda}$, the write-up supplying the binding, and a one-line `/update` on the Setup fixes it. It was deferred deliberately — the write-up is byte-identical to the statement today, and editing the Setup would supersede it immediately before the split the referee asks for. *Flaw 13*: [g1](gaps/g1.html) still cites pre-repair step numbers, which costs more in a packet written for a reader outside this repository than anywhere else. *Flaw 15*: the write-up sits at **1499/1500 words**, so the next repair has no room — `/tighten` first, `/decompose` after, with Steps 9–10 the self-contained candidate.\n\n## Target statement\n\n**Setup.** For $\\mu\\in\\Lambda^+$ let\n\n$$\nm_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X \\longrightarrow LX\n$$\n\nbe the convolution map, where $\\overline{LG}_\\mu\\subset LG$ is the preimage of $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$; each $m_\\mu$ is ind-proper, since $\\mathrm{Gr}$ is. Write\n\n$$\nLX^{\\mathrm{sat}} := \\bigcup_{\\mu\\in\\Lambda^+}\\left|m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\\right| \\;\\subseteq\\; |LX|\n$$\n\nfor the union of their images on geometric points. This is a $K$-stable subset of $|LX|$ and nothing more: no scheme structure is declared on it, and none is claimed to be closed. Ind-properness of the individual $m_\\mu$ makes each image closed and says nothing about their filtered union.\n\nFor a finite $F\\subseteq\\Lambda^+$ write $Z_F\\subseteq|LX|$ for the closed $K$-stable subset of [Q1-L3-L1](Q1-L3-L1/index.html)(3), and $j_F$ for the open complement of $Z_F$ in $LX$. Two inputs are used below and established by no clause of this node.\n\n**(A) Coherent objects are compact.** Inside the renormalized category [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html),\n\n$$\n\\mathcal{D}_c(K\\backslash LX) \\;=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\; \\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\right)^{\\omega} .\n$$\n\nThis is the statement of [Q1-L2-L1](../Q1-L2/Q1-L2-L1/index.html) at $\\mathcal{Y}=K\\backslash LX$. It is declared here rather than used silently because [Q1-L3-L3](Q1-L3-L3/index.html) concludes about compact objects while clause (i) quantifies over coherent ones, and (A) is the only thing joining the two.\n\n**(B) Support-bounded subcategories are closed under colimits.** For every finite $F\\subseteq\\Lambda^+$ the full subcategory\n\n$$\n\\mathcal{S}_F := \\left\\{\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ |\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F\\right\\}\n$$\n\nis closed under all small colimits formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. This is hypothesis (B) of [Q1-L3-L3](Q1-L3-L3/index.html) for the family this node applies it to, and no statement in the repository establishes it.\n\nContinuity of $j_F^{!}$ delivers (B) once $\\mathcal{S}_F=\\ker(j_F^{!})$, and **that identification is a second assumption and not a consequence of the support convention**: writing $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F$ says $U_F$ is *covered* by opens on which $\\mathcal{G}$ restricts to zero, which gives $\\ker(j_F^{!})\\subseteq\\mathcal{S}_F$ and not the converse. The converse asks vanishing to be local on $LX$ and to survive the passage to the $K$-quotient. Both halves are the business of [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html), where the locality is its hypothesis (A) and the continuity its clause (1). The nearest adjacent statement is the locally closed orbit form at [Q1-L5-L3](../Q1-L5/Q1-L5-L3/index.html)(2), which is about $i_{\\lambda,Z}^{!}$ and not about an open complement.\n\n**(C) Finite presentation on the range used.** There is a subset $\\Lambda'\\subseteq\\Lambda_X^+$ such that for every $\\lambda\\in\\Lambda'$ the closed embedding $\\overline{\\imath}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$ is finitely presented, and $\\bigcup_{\\lambda\\in\\Lambda'}|\\overline{LX}_\\lambda| = |LX|$.\n\nThis is what clause (ii)'s witness argument consumes, and it is **not** available over all of $\\Lambda_X^+$: for $X=\\mathbb{A}^1$ with $G=\\mathbb{G}_m$ the origin of $L\\mathbb{A}^1$ is a closed orbit equal to its own closure whose embedding is cut out by a non-finitely-generated ideal ([Q1-L3-L4 r1](Q1-L3-L4/critiques/r1.html)). [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) is stated for all of $\\Lambda_X^+$ and its source establishes it only over the open-$G$-orbit range, so the second half of (C) — that the range still exhausts $|LX|$ — is the part nothing supplies.\n\nThen:\n\n(i) under (A) and (B), every $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ satisfies $|\\operatorname{supp}\\mathcal{G}|\\subseteq LX^{\\mathrm{sat}}$;\n\n(ii) for every $\\lambda\\in\\Lambda'$ of (C), $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a nonzero object of $\\mathcal{D}_c(K\\backslash LX)$ with support $\\overline{LX}_\\lambda$ — this clause uses neither (A) nor (B), and is stated on the range (C) supplies;\n\n(iii) hence, under (A), (B) and (C), if $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)$, then $LX^{\\mathrm{sat}} = |LX|$ — every $K$-orbit satisfies $|LX_\\lambda|\\subseteq LX^{\\mathrm{sat}}$, which is set-theoretic Hecke saturation;\n\n(iv) if in addition $LX^{\\mathrm{sat}}$ is the set of geometric points of a reduced closed ind-subscheme $Z\\subseteq LX$, then under the hypothesis of (iii) that ind-subscheme is $Z = (LX)_{\\mathrm{red}}$.\n\n**Unconditionality.** Clauses (i)–(iii) use [the three standing hypotheses](../../../appendix/assum-intro.html)(a) and (b) alone — the placid presentation and the dimension theory that supplies the dualizing object of [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) — together with the Hecke action, the orbit-closure geometry of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), and the two declared hypotheses (A) and (B), which invoke (c) no more than the clauses do. No clause invokes [the three standing hypotheses](../../../appendix/assum-intro.html)(c), so the necessary condition this node supplies to [Q1](../../../dag.html) is independent of the unramified conjecture — independent, and conditional on (A), (B) and (C). What (C) costs is stated plainly: clause (iii) exhausts $|LX|$ only over the range (C) supplies, so the necessary condition this node hands [Q1](../../../dag.html) is weaker than it read before 2026-08-07 ([u3](updates/u3.html)).\n\n## Direct prerequisites\n\n### [Q1-L3-L1](Q1-L3-L1/index.html) — The convolution maps are ind-proper, with closed $K$-stable images\n\n- **current effective status:** proved\n- **use policy:** This prerequisite is proved and may be used as stated.\n\n**Setup.** In the standing setting of [context](../../../context.html), write $\\Lambda^+ := X_*(T)^+$ for the dominant cocharacters and, for $\\mu\\in\\Lambda^+$, let $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$ be the Schubert closure of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html) and $\\overline{LG}_\\mu\\subset LG$ its preimage under $LG\\rightarrow\\mathrm{Gr}$. Let\n\n$$\nm_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X\\longrightarrow LX, \\qquad (g,x)\\longmapsto g\\cdot x,\n$$\n\nbe the convolution map of [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), and put $Z_\\mu := \\left|m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\\right|\\subseteq|LX|$. Then:\n\n**(1) Ind-properness.** For every $\\mu\\in\\Lambda^+$ the map $m_\\mu$ is ind-proper.\n\n**(2) Closed $K$-stable image.** For every $\\mu\\in\\Lambda^+$ the subset $Z_\\mu$ is closed in $|LX|$ and stable under the action of $K$.\n\n**(3) A directed family exhausting the saturation.** For a finite subset $F\\subseteq\\Lambda^+$ put $Z_F := \\bigcup_{\\mu\\in F}Z_\\mu$. Each $Z_F$ is a closed $K$-stable subset of $|LX|$; the family $\\{Z_F\\}$, indexed by the finite subsets of $\\Lambda^+$ ordered by inclusion, is directed; and\n\n$$\n\\bigcup_{F\\subseteq\\Lambda^+\\ \\text{finite}} Z_F \\;=\\; LX^{\\mathrm{sat}},\n$$\n\nthe subset defined in the Setup of [Q1-L3](index.html).\n\n### [Q1-L3-L2](Q1-L3-L2/index.html) — A bounded Hecke kernel keeps $\\mathrm{IC}_0$ inside $Z_F$, and coherence does not bound\n\n- **current effective status:** failing\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Setup.** In the standing setting of [context](../../../context.html), with $\\Lambda^+ := X_*(T)^+$ and the Schubert closures $\\overline{\\mathrm{Gr}}_\\mu$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html). For a finite subset $F\\subseteq\\Lambda^+$ write\n\n$$\n\\mathrm{Gr}_F \\ := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu \\ \\subseteq\\ \\mathrm{Gr},\n$$\n\nand let $Z_F\\subseteq|LX|$ be the closed $K$-stable subset of [Q1-L3-L1](Q1-L3-L1/index.html)(3). For $\\mathcal{Y}\\in\\{\\mathrm{Gr}, LX\\}$ and $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y})$ write $|\\operatorname{supp}\\mathcal{G}|\\subseteq|\\mathcal{Y}|$ for the complement of the union of those open sub-ind-schemes $U\\subseteq\\mathcal{Y}$ whose $!$-restriction of $\\mathcal{G}$ vanishes. Call $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ *$F$-bounded* when $|\\operatorname{supp}\\mathcal{F}|\\subseteq\\mathrm{Gr}_F$, and *bounded* when it is $F$-bounded for some finite $F\\subseteq\\Lambda^+$. Then:\n\n**(1) An $F$-bounded kernel keeps $\\mathrm{IC}_0$ inside $Z_F$.** For every finite $F\\subseteq\\Lambda^+$ and every $F$-bounded $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, the Hecke translate of the basic object [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) under [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html) satisfies\n\n$$\n\\left|\\operatorname{supp}\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\right|\\ \\subseteq\\ Z_F .\n$$\n\n**(2) The bounding sets are the stages.** The subsets $\\mathrm{Gr}_F$, over the finite subsets $F\\subseteq\\Lambda^+$, are cofinal among the stages $\\mathrm{Gr}_n$ of the presentation of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(3): every $\\mathrm{Gr}_F$ is contained in some $\\mathrm{Gr}_n$, and every $\\mathrm{Gr}_n$ is contained in some $\\mathrm{Gr}_F$.\n\n**(3) One $\\mu$ does not suffice.** Let $S=\\mathbb{G}_m$ and let $X=S$ carry the action of $G = S\\times S$ by $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$ — a member of the standing class, and the torus sub-case of [K9](../../../key_examples/k9.html). The standing maximal torus is then $T=S\\times S$, so $\\Lambda^+=X_*(T)^+=\\mathbb{Z}^2$. There is an $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ that is $F$-bounded for no singleton $F=\\{\\mu\\}$, and whose translate satisfies $|\\operatorname{supp}(\\mathcal{F}\\ast\\mathrm{IC}_0)|\\subseteq Z_\\mu$ for no $\\mu\\in\\Lambda^+$.\n\n**(4) Whether coherence bounds a kernel is not settled.** Assume $G\\neq 1$. The two readings of $\\mathcal{D}_c$ on an ind-scheme recorded as an open tension at [$\\omega_{\\mathcal{Y}}$](../../../appendix/not-dualizing-object.html) answer this clause differently. Under the reading on which every object comes from a stage of the presentation of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(3) — the shape of that entry's clause (4) and of [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) — clause (2) makes every kernel bounded and clause (1) covers the whole family $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\}$ that generates [the Satake subcategories](../../../appendix/def-satake-subcategory.html). Under the pointwise test-scheme definition of [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) it does not: $\\omega_{K\\backslash\\mathrm{Gr}}$ is then coherent with $|\\operatorname{supp}\\omega_{K\\backslash\\mathrm{Gr}}| = |\\mathrm{Gr}|$ and is bounded by no finite $F$. So boundedness is a hypothesis on the kernel until that tension is settled, and clause (1) is stated with it.\n\n**Scope of (4).** The hypothesis $G\\neq1$ is what makes the clause non-empty, not a restriction on what it says: at $G=1$ the two readings agree — $\\mathrm{Gr}$ is a point, $\\Lambda^+=\\{0\\}$, and $F=\\{0\\}$ bounds every object — so there is nothing there for the clause to distinguish.\n\n### [Q1-L3-L3](Q1-L3-L3/index.html) — A compact object of a subcategory generated by a directed family lies in one member\n\n- **current effective status:** proved\n- **use policy:** This prerequisite is proved and may be used as stated.\n\nLet $\\mathcal{C}$ be a stable category admitting all small colimits, let $(A,\\le)$ be a directed partially ordered set, let $\\{\\mathcal{S}_\\alpha\\}_{\\alpha\\in A}$ be full subcategories of $\\mathcal{C}$, and let $S$ be a small set of objects of $\\mathcal{C}$. Assume:\n\n**(A) Monotonicity.** For $\\alpha\\le\\beta$ in $A$ one has $\\mathcal{S}_\\alpha\\subseteq\\mathcal{S}_\\beta$ as full subcategories of $\\mathcal{C}$.\n\n**(B) Each member is cocomplete, stable and retract-closed.** Each $\\mathcal{S}_\\alpha$ is closed in $\\mathcal{C}$ under shifts, under cofibres, under all small colimits formed in $\\mathcal{C}$, and under retracts.\n\n**(C) The generators are compact and covered.** Every $s\\in S$ is a compact object of $\\mathcal{C}$ in the sense of [compact objects](../../../appendix/def-compact-objects.html) and lies in $\\mathcal{S}_{\\alpha}$ for some $\\alpha\\in A$.\n\nThen, with $\\langle S\\rangle_{\\mathcal{C}}$ the generated subcategory of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html),\n\n$$\n\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}\\ \\subseteq\\ \\bigcup_{\\alpha\\in A}\\mathcal{S}_\\alpha\n$$\n\nas full subcategories of $\\mathcal{C}$: every compact object of $\\mathcal{C}$ lying in $\\langle S\\rangle_{\\mathcal{C}}$ already lies in $\\mathcal{S}_\\alpha$ for a single $\\alpha\\in A$.\n\n### [Q1-L3-L4](Q1-L3-L4/index.html) — The orbit-closure witness: $\\overline{i}_{\\lambda,*}\\,\\omega$ is coherent, nonzero, and supported on $\\overline{LX}_\\lambda$\n\n- **current effective status:** failing\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Setup.** In the standing setting of [context](../../../context.html), fix $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)), let $\\overline{LX}_\\lambda$ be the reduced orbit closure of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html) with its closed embedding $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), and let $\\omega_{K\\backslash\\overline{LX}_\\lambda}$ be the dualizing object of [$\\omega_{\\mathcal{Y}}$](../../../appendix/not-dualizing-object.html). Assume:\n\n**(A) Finite presentation.** $\\overline{i}_\\lambda$ is a finitely presented closed embedding, which is clause **(a)** of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) and holds for $X$ smooth affine spherical.\n\n**(B) The equivariant closed pushforward.** $\\overline{i}_{\\lambda,*}\\colon\\mathcal{D}^!(K\\backslash\\overline{LX}_\\lambda)\\rightarrow\\mathcal{D}^!(K\\backslash LX)$ denotes the $K$-equivariant form of the pushforward of [Raskin: pushforward along a finitely presented morphism](../../../appendix/bb-raskin-fp-pushforward.html) along $\\overline{i}_\\lambda$ — the functor main.tex:1221–1227 writes $i_*$ — and it satisfies base change against $!$-pullback, as clause (ii) of that entry does for ind-schemes.\n\nThen $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a **coherent** object of $\\mathcal{D}(K\\backslash LX)$ in the sense of [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), it is **nonzero**, and its support is the whole orbit closure:\n\n$$\n\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}\\ \\in\\ \\mathcal{D}_c(K\\backslash LX), \\qquad \\left|\\operatorname{supp}\\ \\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}\\right| = \\left|\\overline{LX}_\\lambda\\right| .\n$$\n\n### [Q1-L3-L5](Q1-L3-L5/index.html) — Finite orbit intervals make $LX^{\\mathrm{sat}}$ a reduced closed ind-subscheme\n\n- **current effective status:** ready\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Setup.** In the standing setting of [context](../../../context.html), the strata $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) partition $|LX|$, their reduced closures $\\overline{LX}_\\lambda$ are the closed subschemes of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html), and $LX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ is the $K$-placid presentation ([placidity](../../../appendix/placid-ind-scheme.html)) put in force by [the three standing hypotheses](../../../appendix/assum-intro.html)(a). Assume:\n\n**(A) Finite orbit intervals.** For every $\\lambda\\in\\Lambda_X^+$ the set $\\{\\lambda'\\in\\Lambda_X^+\\ \\mid\\ |LX_{\\lambda'}|\\subseteq|\\overline{LX}_\\lambda|\\}$ is finite.\n\nThen:\n\n**(1) Representability of specialization-closed unions of orbits.** For every $K$-stable subset $C\\subseteq|LX|$ that is closed under specialization, writing $\\Sigma := \\{\\lambda\\in\\Lambda_X^+\\mid |LX_\\lambda|\\subseteq C\\}$, the subset $C$ is closed in $|LX|$ and is the set of geometric points of the reduced closed ind-subscheme\n\n$$\nZ\\ :=\\ \\varinjlim_{E\\subseteq\\Sigma\\ \\text{finite}}\\ \\bigcup_{\\lambda\\in E}\\overline{LX}_\\lambda\\ \\subseteq\\ LX ,\n$$\n\nthe colimit being taken along the finitely presented closed embeddings of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a).\n\n**(2) The symmetric case satisfies the hypothesis.** If $X = G/G^\\theta$ is symmetric with $G^\\theta$ connected, then hypothesis (A) above holds, by the closure relation of [Chen–Yi symmetric orbit parametrization](../../../appendix/bb-chenyi-symmetric-orbits.html).\n\nIn particular the subset $LX^{\\mathrm{sat}}$ of [Q1-L3](index.html) is such a $C$ — it is $K$-stable and a union of the closed subsets $Z_\\mu$ of [Q1-L3-L1](Q1-L3-L1/index.html)(2), hence closed under specialization — so under **(A)** the hypothesis of clause (iv) of [Q1-L3](index.html) is met.\n\n### [Q1-L3-L6](Q1-L3-L6/index.html) — The bounded kernels generate the whole Satake subcategory\n\n- **current effective status:** open\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\n**Setup.** In the standing setting of [context](../../../context.html), with $\\Lambda^+ := X_*(T)^+$ and the Schubert closures $\\overline{\\mathrm{Gr}}_\\mu$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html). Call $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) *bounded* exactly as the Setup of [Q1-L3-L2](Q1-L3-L2/index.html) defines the word — $|\\operatorname{supp}\\mathcal{F}|\\subseteq\\mathrm{Gr}_F$ for some finite $F\\subseteq\\Lambda^+$, with $\\mathrm{Gr}_F := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ and the support that Setup's. Generation is the operation $\\langle-\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), formed throughout inside the renormalized category [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html). Then:\n\n**(1) The bounded translates generate what all the coherent ones do.** The two generated subcategories of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ — the Hecke translates ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) of the basic object [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) by bounded kernels, and by all coherent kernels — agree:\n\n$$\n\\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\ \\text{bounded}\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} \\;=\\; \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} \\;=\\; \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe right-hand equality being the definition in [the Satake subcategories](../../../appendix/def-satake-subcategory.html)(1).\n\n### [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html) — $!$-restriction to an open complement is continuous, and $\\mathcal{S}_Z$ is closed under colimits\n\n- **current effective status:** proved\n- **use policy:** This prerequisite is proved and may be used as stated.\n\n**Setup.** In the standing setting of [context](../../../context.html). Let $Z\\subseteq|LX|$ be a closed $K$-stable subset and let $U_Z\\subseteq LX$ be the open sub-ind-scheme complementary to it, formed stagewise along the presentation $LX=\\varinjlim_\\lambda\\overline{LX}_\\lambda$ of [the three standing hypotheses](../../../appendix/assum-intro.html)(a) by the orbit closures of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html) as\n\n$$\nU_Z \\; := \\; \\varinjlim_\\lambda\\left(\\overline{LX}_\\lambda\\smallsetminus Z\\right),\n$$\n\nwhich is $K$-stable because $Z$ is. Write $j_Z\\colon U_Z\\hookrightarrow LX$ for the open immersion and, by the same symbol, for the induced map $K\\backslash U_Z\\rightarrow K\\backslash LX$ of prestacks.\n\nFor $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) write $|\\operatorname{supp}\\mathcal{G}|\\subseteq|LX|$ for the complement of the union of those open sub-ind-schemes $U\\subseteq LX$ whose $!$-restriction of $\\mathcal{G}$ vanishes — the support convention of the Setup of [Q1-L3-L2](Q1-L3-L2/index.html) — and put\n\n$$\n\\mathcal{S}_Z \\; := \\; \\left\\{\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ |\\operatorname{supp}\\mathcal{G}|\\subseteq Z\\right\\}.\n$$\n\nAssume:\n\n**(A) Vanishing propagates to the union.** For every $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and every closed $K$-stable $Z'\\subseteq|LX|$ with $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$, the restriction $j_{Z'}^{!}\\mathcal{G}$ built in clause (1) — which is itself free of this hypothesis — vanishes. The convention above makes $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$ say only that $U_{Z'}$ is *covered* by open sub-ind-schemes on which $\\mathcal{G}$ restricts to zero, so what is assumed here is that vanishing is local on $LX$ and survives the passage to the $K$-quotient. No entry of the appendix asserts it; it is assumed and not cited. The converse implication, that $j_{Z'}^{!}\\mathcal{G}=0$ forces $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z'$, is immediate from the convention and is not assumed.\n\nThen:\n\n**(1) Continuity.** $!$-restriction along $j_Z$ in the theory $\\mathcal{D}^!$ of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) carries $\\mathcal{D}_c(K\\backslash LX)$ into $\\mathcal{D}_c(K\\backslash U_Z)$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)), and its ind-extension — written $j_Z^{!}$ again, and the functor with which the support convention above is formed —\n\n$$\nj_Z^{!}\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash U_Z)\n$$\n\nis exact and preserves all small colimits.\n\n**(2) The support-bounded subcategory verifies hypothesis (B).** Under **(A)** one has $\\mathcal{S}_Z=\\ker\\left(j_Z^{!}\\right)$, and $\\mathcal{S}_Z$ is closed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ under shifts, under cofibres, under all small colimits formed there, and under retracts — the condition that hypothesis **(B)** of [Q1-L3-L3](Q1-L3-L3/index.html) imposes on each member of its family. Hence, still under **(A)**, for every family $\\{Z_\\alpha\\}_{\\alpha\\in A}$ of closed $K$-stable subsets of $|LX|$ the full subcategories $\\{\\mathcal{S}_{Z_\\alpha}\\}_{\\alpha\\in A}$ meet that hypothesis; at the family $\\{Z_F\\}$ of [Q1-L3-L1](Q1-L3-L1/index.html)(3) this is hypothesis **(B)** of [Q1-L3](index.html).\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the standing notation](../../../appendix/subsec-notations.html) — `subsec:notations`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n### [the three standing hypotheses](../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../appendix/conj-intro.html) holds for $X$.\n\n- **note:** (a) is exactly the conclusion of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) for $X$ smooth affine spherical, so it is not an extra restriction in that generality; it is stated as an assumption because main.tex wants it available before the sheaf-theoretic section. (b) is what makes $\\mathcal{D}^!$ and $\\mathcal{D}^*$ agree ([sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html)). (c) is the input the whole paper is conditional on.\n\n**Key spherical varieties.** The class these hypotheses carve out is abstract, so the rows below fix the concrete $(G,X)$ this project keeps in mind — simplest first, then the two instructive ways to fall out of the class. \"(c)\" is hypothesis (c) above. The rows are orientation pointers, at the user's direction (2026-08-04): each writes its action out and its period name links to where the case is developed — the example node when the tree has one, the catalogue [known cases of the unramified equivalence](../../../appendix/exam-hyperspherical-duality.html) otherwise — but the duals, the hypotheses and the sources live in the catalogue and the nodes, never in a row, and no proof may cite one. [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) fixes right actions; the two rows presented as left quotients say so and act by left translation.\n\n| $X$ | acted on by — the action | period | where (c) stands | in the tree |\n|---|---|---|---|---|\n| $G$ | $G\\times G$ — two-sided translation, $x\\cdot(g_1,g_2)=g_1^{-1}x\\,g_2$ | [group case](../Q1-e1/index.html) | **proved** — derived Satake [[bezrukavnikov2008equivariant, Thm 5](../../../../papers/bezrukavnikov2008equivariant.pdf)] | [Q1-e1](../Q1-e1/index.html) |\n| $\\mathbb{A}^1$ | $\\mathbb{G}_m$ — scaling, $x\\cdot t=tx$ | [Iwasawa–Tate](../Q1-e2/index.html) | **verified by hand** — [[BZSV, Ex. 7.6.1](../../../../papers/BZSV.pdf)] | [Q1-e2](../Q1-e2/index.html) |\n| $M_n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — two-sided translation on $n\\times n$ matrices, $m\\cdot(g_1,g_2)=g_1^{-1}m\\,g_2$ | [Godement–Jacquet](../Q1-e4/index.html) | **proved** — [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] | [Q1-e4](../Q1-e4/index.html) |\n| $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation on cosets, $\\mathrm{Sp}_{2n}x\\cdot g=\\mathrm{Sp}_{2n}xg$ | [symplectic (Jacquet–Rallis)](../Q1-e5/index.html); its dual is the Shalika side | **proved** — quaternionic Satake [[chen2022quaternionic](../../../../papers/chen2022quaternionic.pdf)]; the $B$-stabilizer connectedness of the standing class is not discharged in those sources | [Q1-e5](../Q1-e5/index.html) |\n| $(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation, $Hx\\cdot g=Hxg$ for $H=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ block-diagonal | [linear periods](../../../appendix/exam-hyperspherical-duality.html) | **upcoming** work of Chen–Yi; the orbit geometry is already in print ([Chen–Yi orbit parametrization](../../../appendix/bb-chenyi-symmetric-orbits.html)) | — |\n| $\\mathrm{SO}_{n-1}\\backslash(\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n)$ | $\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n$ — right translation, $Hx\\cdot g=Hxg$, where $H=\\mathrm{SO}_{n-1}$ sits diagonally, $h\\mapsto(h,h)$, via $\\mathrm{SO}_{n-1}\\subset\\mathrm{SO}_n$ | [Gan–Gross–Prasad / theta](../../../appendix/exam-hyperspherical-duality.html) | **proved** — [[BFT_orthosymplectic_satake](../../../../papers/BFT_orthosymplectic_satake.pdf)] | — |\n| rank-$1$ affine homogeneous $X=H\\backslash G$ | various $G$ — right translation, $Hx\\cdot g=Hxg$ | [rank one](../../../appendix/exam-hyperspherical-duality.html) | **proved under hypotheses** — [[devalapurkar2024kutheoreticspectraldecompositionsspheres, Table 4](../../../../papers/devalapurkar2024kutheoreticspectraldecompositionsspheres.pdf)] | — |\n| $G/_{\\psi}U$ | $G$ — left translation through $G/U$, $g:xU\\mapsto gxU$, $U$ maximal unipotent; the twist is the generic character $\\psi$ of $U$ | [Whittaker](../Q1-e3/index.html) | *outside the untwisted class* — twisted polarization; the equivalence per [[BZSV, §7.6.4](../../../../papers/BZSV.pdf)]; kept because it supplies [ABG](../../../appendix/bb-abg.html) at Iwahori level | [Q1-e3](../Q1-e3/index.html) |\n| $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | $\\mathrm{PSL}_2$ — left translation, $g:x\\,\\mathrm{PO}_2\\mapsto gx\\,\\mathrm{PO}_2$ | [boundary case](../Q1-e6/index.html) | *outside the class* — a type-$N$ spherical root breaks connected stabilizers, and the expected statement itself changes shape | [Q1-e6](../Q1-e6/index.html) |\n\nThe first four rows are where (c) is a theorem or a verified computation — the working instances of the standing class — with the linear periods next in line. $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, the linear periods and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ are symmetric, the territory where the [Chen–Yi orbit machinery](../../../appendix/bb-chenyi-symmetric-orbits.html) applies and [Q1-L6](../Q1-L6/index.html)'s induction closes. The last two rows are kept deliberately: Whittaker for the Iwahori-level black box it supplies, and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ because it shows clause (2) of [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) is load-bearing.\n\n### [`Ani`, `Map`, `underline-Map`](../../../appendix/conv-anima.html) — anima and mapping objects\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:234–258). $\\mathrm{Ani}$ is the $\\infty$-category of $\\infty$-groupoids (anima). For $c_1,c_2$ in an $\\infty$-category $\\mathcal{C}$, $\\operatorname{Map}_{\\mathcal{C}}(c_1,c_2)\\in\\mathrm{Ani}$ is the mapping anima. $\\widehat{\\mathrm{Cat}}_\\infty$ is the category of not-necessarily-small $\\infty$-categories. For $\\mathcal{C}\\in\\mathrm{DGCat}$, $\\underline{\\operatorname{Map}}_{\\mathcal{C}}(c_1,c_2)$ denotes the $\\mathrm{Vect}$-enriched mapping space; $\\operatorname{Map}_{\\mathcal{C}}(c_1,c_2)$ is its underlying anima.\n\n### [presentable categories](../../../appendix/conv-prl.html) — `Pr^L`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:243–249). $(\\mathrm{Pr}^L,\\otimes,\\mathrm{Ani})$ is the subcategory of $\\widehat{\\mathrm{Cat}}_\\infty$ spanned by presentable $\\infty$-categories and colimit-preserving functors, with the symmetric monoidal structure of [[HA, §4.8.1](../../../../papers/HA.pdf)] and unit $\\mathrm{Ani}$. $\\mathrm{Pr}^L_{\\mathrm{st}}\\hookrightarrow\\mathrm{Pr}^L$ is the full subcategory of presentable stable categories, whose induced structure is lax monoidal [[HA, Prop. 4.8.2.18](../../../../papers/HA.pdf)].\n\n### [compactly generated stable presentables](../../../appendix/def-stable-categories.html) — `def:stable_categories`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:540). $\\mathrm{Pr}^L_{\\mathrm{st},\\omega}\\hookrightarrow\\mathrm{Pr}^L$ is the full subcategory of compactly generated stable presentable categories.\n\n### [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) — $k$-linear categories\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:249–258). For $R$ an $\\mathbb{E}_\\infty$-ring spectrum, $\\mathrm{LMod}_R\\in\\mathrm{CAlg}(\\mathrm{Pr}^L)$ and $\\mathrm{LinCat}_R := \\mathrm{LMod}_{\\mathrm{LMod}_R}(\\mathrm{Pr}^L)$ is the $\\infty$-category of $R$-linear categories. Following [[GR17vol1](../../../../papers/GR17vol1.pdf)] we write\n\n$$\n\\mathrm{DGCat} := \\mathrm{LinCat}_k, \\qquad \\mathrm{Vect} := \\mathrm{LMod}_k,\n$$\n\nthe latter being the unit object.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n- **note:** *the ambient $\\mathcal{C}$ is part of the data and main.tex does not name it at the point of use, which is why the blueprint writes it as a subscript everywhere.* See the ratification recorded at [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and in [Q1-L1](../Q1-L1/index.html): for Satake subcategories the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$. \"Cocomplete stable\" is strictly stronger than \"thick\"; $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits, not merely finite ones and retracts.\n- **note:** **Where the presentability comes from, verified on the page.** GR's standing convention is footnote 8 to §5.1.5 of [[GR17vol1](../../../../papers/GR17vol1.pdf)] (printed p. 51, PDF p. 88), attached to the sentence defining \"cocomplete\": *\"When talking about cocomplete categories we will always assume that they are presentable.\"* So GR's \"cocomplete stable category\" means \"presentable stable category\", and §5.4.1 opens \"Let $\\mathbf{C}$ be an object of $1\\text{-Cat}^{\\mathrm{St,cocmpl}}$\". The convention is load-bearing rather than decorative: the printed proof of Prop. 5.4.5 (p. 55, PDF p. 92) forms the smallest cocomplete stable full subcategory $\\mathbf{C}'\\subseteq\\mathbf{C}$ and continues *\"The inclusion $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ admits an (a priori non-continuous) right adjoint\"*, which is the Adjoint Functor Theorem in GR's form: Thm. 2.5.4(a) (printed p. 32, PDF p. 69), *\"Any morphism in $1\\text{-Cat}_{\\mathrm{Prs}}$, viewed as a functor between $(\\infty,1)$-categories, admits a right adjoint\"*, stated there for **presentable** categories. Footnote 3 of that page, hanging off §2.5.1 where $1\\text{-Cat}_{\\mathrm{Prs}}$ is introduced, says presentability *\"is necessary for the Adjoint Functor Theorem to hold\"* and adds that they *\"will omit the adjective 'presentable' even when it should properly be there\"*. It is that right adjoint the proof uses to pass from the vanishing to $\\mathbf{C}'=\\mathbf{C}$, so the hypothesis is consumed exactly in the direction *orthogonality $\\Rightarrow$ generation*.\n- **note:** **Why the converse direction is free.** *Generation $\\Rightarrow$ orthogonality* needs only minimality: by [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html), applied with $\\mathcal{D}=\\mathcal{C}$, $T=\\{c_\\alpha\\}$ and $M=c$, the displayed vanishing puts every $c_\\alpha$ in ${}^{\\perp_{\\mathcal{C}}}c$, hence puts $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ there; if that is all of $\\mathcal{C}$ then $c\\in{}^{\\perp_{\\mathcal{C}}}c$, so $\\operatorname{Map}_{\\mathcal{C}}(c,c)=0$ and $c=0$. No presentability, and no circularity — that entry invokes this one through the minimality description alone.\n- **note:** **Two discrepancies with the printed sources, and the readings in force.** (a) The attribution is to both numbers because the entry carries both halves: the display is verbatim [[GR17vol1, Def. 5.4.1](../../../../papers/GR17vol1.pdf)], which is GR's *definition* of \"generate\", while the biconditional with the smallest-subcategory description is [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] (\"A collection $\\{c_\\alpha\\}$ of objects generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory that contains all $c_\\alpha$\"). (b) main.tex:511–513 prints the vanishing as \"$\\forall i\\ge 0$\" with no quantifier on $\\alpha$; GR print \"$\\forall\\alpha$, $\\forall i=0,1,\\dots$\", and the reading in force is GR's, restored in the display above. GR write the vanishing itself as $\\mathrm{Maps}_{\\mathbf{C}}(c_\\alpha[-i],c)=\\ast$ in Def. 5.4.1 and as $=0$ inside the proof of Prop. 5.4.5, main.tex writing $=0$; by [`Ani`, `Map`, `underline-Map`](../../../appendix/conv-anima.html) the value is an anima, and both notations say that it is contractible. What is *not* settled by notation is the **range of shifts**: this display tests $i\\ge 0$ only, so an argument needing closure under all of $\\mathbb{Z}$ must reconcile the two ranges, which is clause (1) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html).\n\n### [compact objects](../../../appendix/def-compact-objects.html) — `def:compact_objects`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:520). An object $c\\in\\mathcal{C}$ is *compact* if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c,-)\\colon\\mathcal{C}\\longrightarrow\\mathrm{Ani}\n$$\n\npreserves filtered colimits. $\\mathcal{C}^\\omega\\subset\\mathcal{C}$ is the full subcategory of compact objects.\n\n### [compact generation](../../../appendix/def-compactly-generated-category.html) — `def:compactly_generated_category`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:528). $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ is *compactly generated* if the following equivalent conditions hold:\n\n1. $\\mathcal{C}$ admits small filtered colimits and every object is a colimit of a small filtered diagram of compact objects;\n2. the natural functor $\\mathrm{Ind}(\\mathcal{C}^\\omega)\\rightarrow\\mathcal{C}$ is an equivalence.\n\nHere $\\mathrm{Ind}(\\mathcal{D})$, for $\\mathcal{D}$ small, is the ind-completion: it admits a map $\\mathcal{D}\\rightarrow\\mathrm{Ind}(\\mathcal{D})$ and small filtered colimits, and precomposition induces\n\n$$\n\\mathrm{Fun}^\\omega(\\mathrm{Ind}(\\mathcal{D}),\\mathcal{E})\\xrightarrow{\\ \\simeq\\ }\\mathrm{Fun}(\\mathcal{D},\\mathcal{E}),\n$$\n\n$\\mathrm{Fun}^\\omega$ denoting functors commuting with small filtered colimits [[HTT, §5.3](../../../../papers/HTT.pdf)].\n\n### [small relative tensor product](../../../appendix/def-small-relative-tensor.html) — `def:small_relative_tensor`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:562).\n\n1. $\\mathrm{Cat}^{\\mathrm{perf}}\\hookrightarrow\\mathrm{Cat}$ is the subcategory of small idempotent-complete stable $\\infty$-categories with exact functors.\n2. $\\mathrm{Cat}^{\\mathrm{perf}}$ is symmetric monoidal via $\\mathcal{A}\\otimes\\mathcal{B}\\simeq(\\mathrm{Ind}\\,\\mathcal{A}\\otimes\\mathrm{Ind}\\,\\mathcal{B})^\\omega$, giving a symmetric monoidal adjoint equivalence\n\n$$\n\\mathrm{Ind}\\colon (\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)\\rightleftarrows \\mathrm{Pr}^L_{\\mathrm{st},\\omega}\\colon (-)^\\omega .\n$$\n\n3. The relative tensor product in $\\mathrm{Cat}^{\\mathrm{perf}}$ is\n\n$$\n\\mathcal{M}\\otimes_{\\mathcal{A}}\\mathcal{N} := \\left(\\mathrm{Ind}\\,\\mathcal{M}\\otimes_{\\mathrm{Ind}\\,\\mathcal{A}}\\mathrm{Ind}\\,\\mathcal{N}\\right)^\\omega .\n$$\n\n4. For $R$ an $\\mathbb{E}_\\infty$-ring spectrum, $\\mathrm{Perf}(R)\\in\\mathrm{CAlg}(\\mathrm{Cat}^{\\mathrm{perf}})$ and $\\mathrm{Cat}^{\\mathrm{perf}}_R := \\mathrm{LMod}_{\\mathrm{Perf}(R)}(\\mathrm{Cat}^{\\mathrm{perf}})$.\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../appendix/conv-d-shriek-d-star.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), ratified at [Q1-L1](../Q1-L1/index.html).\n\n### [placidity](../../../appendix/placid-ind-scheme.html) — `placid_ind_scheme`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:669).\n\n- A scheme/algebraic space $X$ *admits a placid presentation* if $X\\simeq\\varprojlim_i X_i$ is a cofiltered limit of finite-type schemes/algebraic spaces whose transition maps $X_i\\rightarrow X_j$ are smooth and affine; such an $X$ is a *placid* scheme/algebraic space.\n- An ind-scheme $X$ is *placid* if $X = \\varinjlim_i X_i$ is a filtered colimit of placid schemes along closed embeddings of finite presentation. If a placid group scheme $H$ acts on a placid ind-scheme $X$ and each $X_i$ in the presentation is $H$-stable, $X$ is an *$H$-placid ind-scheme*.\n\n- **note:** $H$-placidity is a property *of a chosen presentation*, not of $X$ alone. Two presentations of the same $LX$ — the $K$-orbit-closure one and the $I$-orbit-closure one — are both supplied by [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\n### [loops, jets and positive loops are placid — $L^nX$, $L^+X$, $LX$](../../../appendix/ex-loops-placid.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Example** (main.tex:694–718, unlabelled; cite by line). Let $X\\in\\mathrm{AffSch}^{f.t.}$ be smooth affine of finite type. The $n$-jets $L^nX$, defined on $k$-algebras by\n\n$$\nL^nX(R) := X\\left(R[t]/t^n\\right),\n$$\n\nare represented by affine schemes of finite type, and the presentation $L^+X\\simeq\\varprojlim_n L^nX$ exhibits the positive loop space $L^+X$ as a placid scheme ([placidity](../../../appendix/placid-ind-scheme.html)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **hypotheses:** $X$ smooth affine of finite type\n\n### [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) — `ex:sheaf_placid_ind`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Example** (main.tex:730). Let $X = \\varinjlim_i X_i$ be a placid ind-scheme. Then\n\n$$\n\\mathcal{D}^!(X) = \\varinjlim_i\\mathcal{D}^!(X_i), \\qquad \\mathcal{D}^*(X) = \\varinjlim_i\\mathcal{D}^*(X_i),\n$$\n\nwith connecting morphisms the left adjoint of $!$-pullback, respectively the right adjoint of $*$-pushforward. If $X$ admits a dimension theory there is a canonical duality $\\mathcal{D}^!(X)\\simeq\\mathcal{D}^*(X)$ [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)], and we then do not distinguish the $!$- and $*$-versions.\n\n- **hypotheses:** $X$ a placid ind-scheme; a dimension theory for the identification $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ — supplied for $LX$ by [the three standing hypotheses](../../../appendix/assum-intro.html)(b)\n\n### [$\\omega_{\\mathcal{Y}}$ — the dualizing object of a prestack](../../../appendix/not-dualizing-object.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (blueprint notation; main.tex uses no symbol for this object — the letter $\\omega$ appears in the manuscript only as the compactness superscript $(-)^\\omega$ of [compact objects](../../../appendix/def-compact-objects.html), main.tex:523. What the notation names is the $!$-pullback of the unit along the structure map in the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), main.tex:651–668). Let $\\mathcal{Y}\\in\\mathrm{PreStk}$ with structure map $p_{\\mathcal{Y}}\\colon\\mathcal{Y}\\rightarrow\\mathrm{pt}$, and identify $\\mathcal{D}^!(\\mathrm{pt}) = \\mathrm{Vect}$ with unit $k$ ([`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html)). The **dualizing object** of $\\mathcal{Y}$ is\n\n$$\n\\omega_{\\mathcal{Y}} := p_{\\mathcal{Y}}^!(k)\\ \\in\\ \\mathcal{D}^!(\\mathcal{Y}).\n$$\n\nSince $\\mathcal{D}^!$ is a functor on $\\mathrm{PreStk}^{op}$, every morphism $f\\colon\\mathcal{Y}'\\rightarrow\\mathcal{Y}$ satisfies $p_{\\mathcal{Y}'} = p_{\\mathcal{Y}}\\circ f$ and hence carries a canonical identification\n\n$$\nf^!\\,\\omega_{\\mathcal{Y}}\\ \\simeq\\ \\omega_{\\mathcal{Y}'} .\n$$\n\nFor $S$ a nonempty scheme of finite type this is the usual dualizing complex: $\\omega_S\\in\\mathcal{D}_c(S)$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) and $\\omega_S\\neq 0$.\n\n### [Raskin: descent for $\\mathcal{D}^!$ along a torsor under a quasi-compact group scheme](../../../appendix/bb-raskin-torsor-descent.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.17 and Prop. 3.17.2](../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). Let $S$ be a quasi-compact quasi-separated base scheme and let $\\mathcal{G}\\rightarrow S$ be a quasi-compact quasi-separated group scheme over $S$; no finite-type hypothesis is placed on $\\mathcal{G}$. For a quasi-compact quasi-separated $S$-scheme $\\mathcal{P}$ carrying an action of $\\mathcal{G}$, the bar complex of the action,\n\n$$\n\\cdots\\ \\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{G}\\times_S\\mathcal{P}\\ \\rightrightarrows\\ \\mathcal{P},\n$$\n\ninduces a diagram of $!$-pullbacks, and the *$\\mathcal{G}$-equivariant derived category of $\\mathcal{P}$* is defined to be its limit:\n\n$$\n\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}} := \\varprojlim\\left(\\mathcal{D}^!(\\mathcal{P})\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\rightrightarrows\\ \\mathcal{D}^!\\left(\\mathcal{G}\\times_S\\mathcal{G}\\times_S\\mathcal{P}\\right)\\ \\cdots\\right).\n$$\n\nCall $\\mathcal{P}\\rightarrow S$ a *$\\mathcal{G}$-torsor* if $\\mathcal{G}$ acts on $\\mathcal{P}$ and there is an fppf base change $S'\\rightarrow S$ admitting a $\\mathcal{G}$-equivariant identification $\\mathcal{P}\\times_S S' = \\mathcal{G}\\times_S S'$. Then for every $\\mathcal{G}$-torsor $\\mathcal{P}\\rightarrow S$ the canonical functor, given by $!$-pullback along $\\mathcal{P}\\rightarrow S$,\n\n$$\n\\varphi\\colon\\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(\\mathcal{P})^{\\mathcal{G}}\n$$\n\nis an equivalence.\n\n- **hypotheses:** $S$ quasi-compact quasi-separated, $\\mathcal{G}\\rightarrow S$ a quasi-compact quasi-separated $S$-group scheme, and $\\mathcal{P}$ a quasi-compact quasi-separated $S$-**scheme** — representability of $\\mathcal{P}$ is part of the hypothesis, while finite type on $\\mathcal{G}$ is not required. The action must exhibit $\\mathcal{P}\\rightarrow S$ as an fppf-locally trivial torsor as displayed, and the conclusion concerns $\\mathcal{D}^!$ alone: nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)), about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), or about the $\\mathcal{D}^*$-coinvariant analogue, which is the source's §3.24.\n\n### [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[raskin_dmodules_infinite_var, §3.9 with Prop. 3.9.2, §6.3, and Table 1](../../../../papers/raskin_dmodules_infinite_var.pdf)]; external, no main.tex label). A morphism $f\\colon S\\rightarrow T$ of ind-schemes is *finitely presented* if it is schematic and its base change along any scheme is a finitely presented morphism (the source's §6.3). For such $f$ the source constructs a pushforward on the $\\mathcal{D}^!$-theory of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html),\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(S)\\longrightarrow\\mathcal{D}^!(T),\n$$\n\nwhich it names the *\"$!$-dR $*$-pushforward functor\"*, and:\n\n**(i) Functoriality through correspondences.** $\\mathcal{D}^!$ upgrades, by left Kan extension, to a functor $\\mathcal{D}^{!,\\mathrm{enh}}$ out of the category of ind-schemes under correspondences $T\\xleftarrow{\\ \\alpha\\ }H\\xrightarrow{\\ \\beta\\ }S$ whose right leg $\\beta$ is finitely presented and whose left leg $\\alpha$ is arbitrary, carrying such a correspondence to $\\beta_{*,!-\\mathrm{dR}}\\,\\alpha^!$. In particular $f\\mapsto f_{*,!-\\mathrm{dR}}$ is compatible with composition of finitely presented morphisms.\n\n**(ii) Base change against $!$-pullback.** For a Cartesian square of ind-schemes\n\n$$\n\\begin{array}{ccc} S' & \\xrightarrow{\\ \\psi\\ } & S\\\\ \\downarrow f' & & \\downarrow f\\\\ T' & \\xrightarrow{\\ \\varphi\\ } & T\\end{array}\n$$\n\nwith $f$ finitely presented, the canonical map $\\varphi^!\\,f_{*,!-\\mathrm{dR}}\\rightarrow f'_{*,!-\\mathrm{dR}}\\,\\psi^!$ is an equivalence; Table 1 records this as \"always satisfies base-change with upper-$!$ functors\", with no hypothesis on $\\varphi$.\n\n**(iii) The proper adjunction.** If $f$ is in addition proper, then $f^!$ is canonically right adjoint to $f_{*,!-\\mathrm{dR}}$ — equivalently, $f_{*,!-\\mathrm{dR}}$ is the left adjoint of $f^!$.\n\n**(iv) The same construction for prestacks** *(added 2026-08-08; this clause **amends** the entry and, with it, what every node citing this anchor asserts — see the amendment note below)*. The source states the definition and the pushforward one generality up, for prestacks rather than ind-schemes. A morphism $f\\colon\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks is *finitely presented* if it is schematic and if for every $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathrm{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented; for every such $f$ there is a functor\n\n$$\nf_{*,!-\\mathrm{dR}}\\colon\\ \\mathcal{D}^!(\\mathcal{Y})\\longrightarrow\\mathcal{D}^!(\\mathcal{Z})\n$$\n\ncompatible with base change. *Schematic is meant classically*: the source's Remark 3.16.1 emphasises that \"by *schematic*, we mean schematic in the sense of classical (i.e., non-derived) algebraic geometry, which is a more forgiving notion than that of derived algebraic geometry\", the example given there being the embedding of $0$ inside the ind-scheme attached to an infinite-dimensional $k$-vector space — classically schematic, not DG schematic.\n\n**A quotient prestack is a prestack, and this is the clause to cite there.** For a group $K$ acting on $\\mathcal{Y}$ and on $\\mathcal{Z}$, the induced $K\\backslash\\mathcal{Y}\\rightarrow K\\backslash\\mathcal{Z}$ is a morphism of prestacks and is covered by the definition above verbatim. A node computing a pushforward and its base change on $K\\backslash LX$ therefore does **not** owe the assembly of [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html) for that step; what it owes instead is finite presentation of the quotient morphism itself, in the sense just displayed.\n\n- **hypotheses:** $f$ **finitely presented** in the source's sense — for (i)–(iii) the ind-scheme sense recalled at the top, for (iv) the prestack sense of that clause — and, for (iii) alone, in addition **proper**. Placidity is *not* a hypothesis of any clause, and neither is any equivariance. *What each generality reaches.* Clauses (i)–(iii) are stated for ind-schemes: the correspondence functoriality, the base change in the displayed form, and the proper adjunction are asserted there and nowhere wider. Clause (iv) is stated for **prestacks**, hence for quotient prestacks $K\\backslash(-)$, but it asserts only the existence of $f_{*,!-\\mathrm{dR}}$ and its compatibility with base change — the source states neither (i) nor (iii) at that generality, so a node wanting the correspondence formalism or the proper adjunction on a quotient prestack still owes them. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) or about $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n- **note:** **There is one pushforward on $\\mathcal{D}^!$, and its name carries a $*$.** A node writing $f_!$ for the left adjoint of $f^!$ and a node writing $f_*$ for the pushforward defining a convolution ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) are, on $\\mathcal{D}^!$ and for finitely presented $f$, naming the same functor $f_{*,!-\\mathrm{dR}}$ of this entry. That is the whole of what the source licenses on this point.\n\n  **What is *not* licensed** is the identification of $f_{*,!-\\mathrm{dR}}$ with the $\\mathcal{D}^*$-pushforward $f_{*,\\mathrm{dR}}\\colon\\mathcal{D}^*(S)\\rightarrow\\mathcal{D}^*(T)$ across the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ that a dimension theory supplies ([sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html), [the three standing hypotheses](../../../appendix/assum-intro.html)(b)). The source introduces the subscript precisely \"to avoid confusion\" between the two (§3.9, p. 9), and Table 1 lists two further renormalized functors $f_{*,\\mathrm{ren}}$ and $f^{!,\\mathrm{ren}}$ for placid $S,T$ equipped with dimension theories. A node needing that identification still owes it.\n- **note:** *Provenance, verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-06. Table 1, p. 3, row 3: hypothesis \"$f$ ind-finitely presented\", functor $f_{*,!-\\mathrm{dR}}\\colon D^!(S)\\rightarrow D^!(T)$, adjunctions \"Left adjoint to $f^!$ for $f$ ind-proper; right adjoint to $f^!$ up to cohomological shift for $f$ smooth\", base change \"Always satisfies base-change with upper-$!$ functors\", references §3.9 and §6.3. §3.9, p. 9 introduces $f_{*,!-\\mathrm{dR}}$ for a finitely presented map of quasi-compact quasi-separated **schemes** and notes that \"the formalism of correspondences implies that we have base-change between $*$-pushforward and $!$-pullback for Cartesian squares\"; Prop. 3.9.2, p. 10 is the proper adjunction in that scheme setting. §6.3, p. 34 is the ind-scheme upgrade quoted above, ending \"If $f$ is additionally assumed proper or smooth, we again have the usual adjunctions.\"\n\n  *A typo on the page.* The displayed compatibility inside Prop. 3.9.2 is printed as $f_{*,\\mathrm{dR}}\\varphi^!\\xrightarrow{\\ \\simeq\\ }\\psi^!f'_{*,!-\\mathrm{dR}}$, whose subscripts and primes do not typecheck against the Cartesian square drawn immediately above it. Clause (ii) states the base change in the form that does, which is the form Table 1 asserts.\n- **note:** *Commissioned by* the `/prove Q2` failure audit of 2026-08-06: **GAP (Prop)** at Step 4 of [Q2-L5](../../Q2/Q2-L5/index.html)'s write-up, which asked for four clauses. Three are above. The fourth, \"$f_!\\simeq f_*$\", is reached only in the notational sense recorded in the first note and **not** as an identification across the $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ duality.\n- **note:** *Provenance of clause (iv), verified on the page.* Read in `papers/raskin_dmodules_infinite_var.pdf` on 2026-08-08. §3.16, printed p. 15, titled *Correspondences for prestacks*, reads verbatim: \"We say that a morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ is finitely presented if it is schematic, and if for any $S\\rightarrow\\mathcal{Z}$ with $S\\in\\mathsf{AffSch}$ the map $\\mathcal{Y}\\times_{\\mathcal{Z}}S\\rightarrow S$ is finitely presented. As another corollary of Proposition 3.6.1, we obtain that there is a functor $f_{*,!-dR}$ compatible with base-change for any finitely presented morphism $f:\\mathcal{Y}\\rightarrow\\mathcal{Z}$ of prestacks.\" Remark 3.16.1, immediately below on the same page, is the classical-schematic caveat quoted in clause (iv). §3.17, the equivariant setting behind [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html), begins on the same printed page.\n\n  *Two readings in clause (iv) are the transcriber's and not the page's.* First, the source writes only \"compatible with base-change\" and does not display the square; that this means the equivalence $\\varphi^!f_{*,!-\\mathrm{dR}}\\simeq f'_{*,!-\\mathrm{dR}}\\psi^!$ of clause (ii), now for a Cartesian square of prestacks, is read from Table 1's \"always satisfies base-change with upper-$!$ functors\" and from §3.9's own sentence about the formalism of correspondences. Second, $\\mathcal{D}^!$ on a prestack is here the one of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) (main.tex:651–668); identifying it with the source's is the same dictionary clauses (i)–(iii) already rest on, and this entry does not re-derive it.\n- **note:** *What the amendment of 2026-08-08 changed, and what it withdrew.* Before that date this entry was transcribed from §3.9, §6.3 and Table 1 alone — schemes and ind-schemes — and its hypotheses line asserted that \"$S$ and $T$ are ind-schemes, never quotient stacks, so a node working on $K\\backslash LX$ supplies the descent from the ind-scheme statement itself, exactly as [Raskin: descent for $\\mathcal{D}^!$ along a torsor](../../../appendix/bb-raskin-torsor-descent.html) requires.\" **That sentence was too restrictive and is withdrawn**, not merely supplemented: §3.16 states the definition and the base-change-compatible pushforward for prestacks outright, so on $K\\backslash(-)$ the pushforward and its base change are clause (iv) and no descent argument is owed for them. What survives of the old sentence: the torsor-descent entry is still what a node needs in order to *evaluate* $\\mathcal{D}^!$ on a quotient by an atlas, and clauses (i) and (iii) are still ind-scheme statements. A node whose write-up was built against the withdrawn sentence has an argument that is sound and longer than it needs to be, not one that is wrong.\n\n### [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../../../appendix/fp-convolution-morphism.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Proposition** (derived inside this appendix from [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) (main.tex:694–718), [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](../../../appendix/bb-zhu-pi0-cartan.html)(2) and the prestack definition of [Raskin: pushforward along a finitely presented morphism of ind-schemes](../../../appendix/bb-raskin-fp-pushforward.html)(iv); no main.tex label, and no page of `papers/` states it — the argument is written out in the second note below). Let $k$, $G$, $T\\subseteq B\\subseteq G$ and $K = L^+G$ be as in [the standing notation](../../../appendix/subsec-notations.html), let $X$ be a smooth affine $G$-variety of finite type over $k$, and write $\\Lambda^+ := X_*(T)^+$. For a finite subset $F\\subseteq\\Lambda^+$ put\n\n$$\n\\mathrm{Gr}_F := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu\\ \\subseteq\\ \\mathrm{Gr},\n$$\n\nwith $\\overline{\\mathrm{Gr}}_\\mu$ the Schubert closures of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(2), let $\\overline{LG}_F\\subseteq LG$ be the preimage of $\\mathrm{Gr}_F$ under $LG\\rightarrow\\mathrm{Gr}$, let $\\overline{LG}_F\\times^{K}(-)$ denote the fppf quotient of $\\overline{LG}_F\\times(-)$ by $(g,x)\\cdot\\kappa = (g\\kappa,\\kappa^{-1}x)$, and let\n\n$$\nm_F\\colon\\ \\overline{LG}_F\\times^{K}L^+X\\longrightarrow LX,\\qquad [g,x]\\longmapsto g\\cdot x .\n$$\n\nThen, all three in the prestack sense of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) — schematic in the classical sense, with finitely presented base change along every affine scheme over the target:\n\n**(1) The jet embedding.** The canonical monomorphism $L^+X\\hookrightarrow LX$ is finitely presented, and its base change along any morphism of prestacks $\\mathcal{Z}\\rightarrow LX$ is a finitely presented closed embedding.\n\n**(2) The bounded convolution morphism.** For every finite $F\\subseteq\\Lambda^+$ the morphism $m_F$ is finitely presented.\n\n**(3) The quotient morphism.** For every finite $F\\subseteq\\Lambda^+$ the induced morphism of quotient prestacks\n\n$$\nK\\backslash\\left(\\overline{LG}_F\\times^{K}L^+X\\right)\\longrightarrow K\\backslash LX\n$$\n\nis finitely presented, so [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) applies to it directly.\n\n- **hypotheses:** $X$ **smooth affine of finite type** over $k$ — the hypothesis of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html), which supplies the presentation $LX = \\varinjlim_i LX^i$ the argument runs on; the standing $X$ of [context](../../../context.html) is smooth affine spherical, hence covered. $G$ **connected reductive** over the standing algebraically closed $k$, which is what [Zhu](../../../appendix/bb-zhu-pi0-cartan.html)(2) needs in order to make each $\\overline{\\mathrm{Gr}}_\\mu$ projective; $F\\subseteq\\Lambda^+$ **finite**, which is what makes $\\mathrm{Gr}_F$ a scheme rather than an ind-scheme; clauses (2) and (3) are not asserted for infinite $F$, and they fail for $F = \\Lambda^+$, where $\\mathrm{Gr}_F = \\mathrm{Gr}$ is an ind-scheme not of finite type and step (c) of the argument below has nothing to say. Nothing here asserts **properness** of $m_F$, so clause (iii) of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html) — the adjunction $m_{F,*,!-\\mathrm{dR}}\\dashv m_F^!$ — is *not* reached: $\\mathrm{Gr}_F$ is proper but $L^+X\\hookrightarrow LX$ is not, and the composite in the argument below is a closed embedding followed by a proper projection only after the untwisting, which does not make it proper. Nothing is asserted about $\\mathcal{D}_c$ ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) or $\\mathcal{D}^{\\mathrm{ren}}$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)).\n- **note:** *Which appendix entry each ingredient comes from.* Clause (1) is the only one with content beyond bookkeeping, and the two entries the appendix already carries that look as if they cover it do **not**. [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) gives the presentation $LX = \\varinjlim_i LX^i$ with $LX^i = LX\\cap t^{-i}L^+\\mathbb{A}^N$ and asserts placidity; it says nothing about finite presentation, of the transitions or of the $i = 0$ stage. [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) gives finite presentation of the closed embeddings $\\overline{LX}_\\lambda\\rightarrow LX$ of **orbit closures**, which is a different family: $L^+X$ is not one of them unless a node proves it is, and no node should assume so.\n- **note:** *Why this holds. Written out here because no page of `papers/` located by this transcription states clauses (1)–(3); a citing node cites the entry and does not repeat th
