e argument.* Throughout, a morphism of prestacks is *finitely presented* in the sense of [Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv), and two formal facts about that notion are used and are immediate from its definition together with the corresponding facts for schemes: it is stable under base change and under composition, and — since the defining condition is tested on affine schemes over the target — it is fppf-local on the target.\n\n  **(a) Clause (1).** Fix a closed embedding $X\\subseteq\\mathbb{A}^N$, available because $X$ is affine of finite type. Then $L^+X = LX\\times_{L\\mathbb{A}^N}L^+\\mathbb{A}^N$, so $L^+X = LX^0$ in the notation of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html), and inside the stage $LX^i$ the subscheme $LX^0$ is cut out by the $Ni$ coefficient functions $a_{j,m}$, $1\\le j\\le N$ and $-i\\le m\\le-1$, of the coordinates $x_j = \\sum_{m\\ge-i}a_{j,m}t^m$. A closed subscheme defined by a finitely generated ideal is a finitely presented closed embedding, so $LX^0\\hookrightarrow LX^i$ is one for every $i$. Any morphism to $LX$ from a quasi-compact scheme — in particular from an affine one — factors through some stage of the presentation, whose transitions are closed embeddings. Hence for affine $S\\rightarrow LX$ one has $L^+X\\times_{LX}S = LX^0\\times_{LX^i}S$ for some $i$, a base change of a finitely presented closed embedding: an affine scheme, finitely presented and closed over $S$. That is clause (1), classical schematicity included, and the parenthetical about a general $\\mathcal{Z}\\rightarrow LX$ is the same computation after base change.\n\n  **(b) The untwisting isomorphism.** The $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\mathrm{Gr}_F\\times LX$, $(g,y)\\mapsto(gK,gy)$, descends to $\\theta\\colon\\overline{LG}_F\\times^{K}LX\\rightarrow\\mathrm{Gr}_F\\times LX$; the $K$-invariant morphism $\\overline{LG}_F\\times LX\\rightarrow\\overline{LG}_F\\times^{K}LX$, $(g,y)\\mapsto[g,g^{-1}y]$, descends along the $K$-torsor $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$ to a morphism inverse to $\\theta$. No trivialization is chosen and no local statement is used: both formulas are globally defined on the covers, and both invariances are one line. Under $\\theta$ the morphism $m_F$ becomes $\\mathrm{pr}_2\\circ\\theta\\circ\\iota$, where $\\iota\\colon\\overline{LG}_F\\times^{K}L^+X\\hookrightarrow\\overline{LG}_F\\times^{K}LX$ is the inclusion induced by $L^+X\\subseteq LX$.\n\n  **(c) The projection.** By [Zhu](../../../appendix/bb-zhu-pi0-cartan.html)(2) each $\\overline{\\mathrm{Gr}}_\\mu$ is a projective $k$-variety, so the finite union $\\mathrm{Gr}_F$ is a projective $k$-scheme, in particular of finite presentation over $k$. Base change of $\\mathrm{Gr}_F\\rightarrow\\operatorname{Spec}k$ along an affine $S\\rightarrow LX$ gives $\\mathrm{Gr}_F\\times S\\rightarrow S$, so $\\mathrm{pr}_2\\colon\\mathrm{Gr}_F\\times LX\\rightarrow LX$ is schematic and finitely presented.\n\n  **(d) The incidence inclusion.** The square with top arrow $\\mathrm{id}\\times(L^+X\\hookrightarrow LX)$, bottom arrow $\\iota$, and the two quotient maps as verticals is Cartesian, and the verticals are $K$-torsors — the pullbacks of $\\overline{LG}_F\\rightarrow\\mathrm{Gr}_F$, which is the restriction of $LG\\rightarrow\\mathrm{Gr}$ and is even Zariski-locally trivial for a constant reductive $G$ ([[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../../../papers/zhu2016introduction.pdf)]). For affine $S\\rightarrow\\overline{LG}_F\\times^{K}LX$ the pulled-back torsor $P\\rightarrow S$ is an fppf cover with $P$ affine, since $K$ is an affine group scheme and affineness is fppf-local; over $P$ the pullback of $\\iota$ is a base change of the top arrow, hence of clause (1), hence finitely presented. Finite presentation being fppf-local on the target, $\\iota$ is finitely presented.\n\n  **(e) Clauses (2) and (3).** Clause (2) is (b) + (c) + (d) and the stability of finite presentation under composition. For clause (3), let $S\\rightarrow K\\backslash LX$ be affine and let $P := LX\\times_{K\\backslash LX}S$, again an affine $K$-torsor over $S$. Because $\\overline{LG}_F\\times^{K}L^+X\\rightarrow LX$ is $K$-equivariant and $LX\\rightarrow K\\backslash LX$ is a $K$-torsor, the base change of the clause-(3) morphism along $P\\rightarrow K\\backslash LX$ is $(\\overline{LG}_F\\times^{K}L^+X)\\times_{LX}P\\rightarrow P$, finitely presented by clause (2); descend along $P\\rightarrow S$.\n- **note:** *Provenance.* The one page-level citation in the argument is [[zhu2016introduction, Prop. 1.3.6 with Rem. 1.3.8, printed p. 14](../../../../papers/zhu2016introduction.pdf)], read in `papers/zhu2016introduction.pdf` on 2026-08-08: Proposition 1.3.6 identifies $\\mathrm{Gr}_{\\underline{G}}$ with the fpqc quotient $[L\\underline{G}/L^+\\underline{G}]$ and Remark 1.3.8 records that the $L^+\\underline{G}$-torsor $L\\underline{G}\\rightarrow\\mathrm{Gr}_{\\underline{G}}$ \"is locally trivial for the étale topology. If $\\underline{G} = G\\otimes\\mathcal{O}$ is constant reductive … it is even locally trivial for the Zariski topology\". Everything else is the appendix entries named in the attribution line, plus standard scheme theory. The statement was **commissioned by** [round 4 of Q1-L3-L2's critique](Q1-L3-L2/critiques/r4.html), commission **E1**, which asked for exactly clause (2); clauses (1) and (3) are what the argument for (2) needs and what the citing nodes use separately.\n\n### [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)); ratified at [Q1-L1](../Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n- **note:** this definition carries **no `\\label` in main.tex** — cite it as `main.tex:794`, never as a label, and do not invent one. It is the ambient category in which every Satake generation is formed; see [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and [Q1-L1](../Q1-L1/index.html).\n\n### [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda = \\mathrm{Gr}_{\\le\\lambda}$ — the affine Grassmannian by Schubert closures](../../../appendix/gr-schubert.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2, p. 4: the paragraph on $G_{\\mathcal{O}}$-orbits, together with (2.1) and (2.2)](../../../../papers/mirkovic2007geometric.pdf)] for clauses (1)–(3); main.tex:831 and main.tex:1100 for the ind-properness in clause (3); main.tex:1208 and main.tex:1221 for clause (4)). Let $G$, $T$, $W$, $K = L^+G$ and $\\mathrm{Gr}$ be as in [the standing notation](../../../appendix/subsec-notations.html), write $X_*(T)$ for the cocharacter lattice and $\\Lambda^+ := X_*(T)^+$ for the dominant cone.\n\n**(1) Orbits.** The group scheme $K$ acts on $\\mathrm{Gr}$ with finite-dimensional orbits, and the $K$-orbits are parameterized by the $W$-orbits in $X_*(T)$ — equivalently by $\\Lambda^+$. The orbit attached to $\\lambda$ is\n\n$$\n\\mathrm{Gr}^\\lambda = K\\cdot L_\\lambda\\ \\subset\\ \\mathrm{Gr},\n$$\n\nwhere $L_\\lambda$ is the image in $\\mathrm{Gr}$ of the point $\\lambda\\in X_*(T)\\subset LG$.\n\n**(2) Closure order.** For $\\lambda,\\mu\\in\\Lambda^+$,\n\n$$\n\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}\\quad\\text{if and only if}\\quad \\lambda-\\mu\\ \\text{is a sum of positive coroots.}\n$$\n\nThe blueprint writes $\\overline{\\mathrm{Gr}}_\\lambda := \\overline{\\mathrm{Gr}^\\lambda}$ for the closure, taken reduced.\n\n**(3) Presentation and ind-properness.** $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$, where the $\\mathrm{Gr}_n$ are finite-dimensional $K$-invariant schemes and every transition map is a closed embedding, and $\\mathrm{Gr}$ is ind-proper.\n\n**(4) Coherent sheaves come from a stage.** With $\\mathrm{Gr}_{\\le\\alpha}$ the manuscript's name for $\\overline{\\mathrm{Gr}}_\\alpha$,\n\n$$\n\\mathcal{D}(\\mathrm{Gr})\\simeq\\varinjlim_{\\alpha\\in\\Lambda^+}\\mathcal{D}\\left(\\mathrm{Gr}_{\\le\\alpha}\\right),\n$$\n\nand every $\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$ may be written $\\mathcal{F} = \\iota_*c$ with $\\iota\\colon\\mathrm{Gr}_{\\le\\alpha}\\hookrightarrow\\mathrm{Gr}$ the closed embedding and $c\\in\\mathcal{D}_c(\\mathrm{Gr}_{\\le\\alpha})^I$, for some $\\alpha\\in\\Lambda^+$.\n\n- **hypotheses:** $G$ connected reductive. Three caveats a citing node must carry. *Ground field.* The source works over $\\mathbb{C}$, with $\\mathcal{O} = \\mathbb{C}[[z]]$ and $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing $k$ is any algebraically closed field of characteristic $0$ ([the standing notation](../../../appendix/subsec-notations.html), [$F = k((t))$](../../../appendix/conv-ring-of-integers.html)); the presentation in clause (4) is asserted over the standing $k$ by main.tex:1208, and clauses (1)–(3) are used at that generality on the manuscript's authority, not on the source's page. *Equivariance in clause (4).* main.tex:1221 prints the reduction $\\mathcal{F} = \\iota_*c$ for **Iwahori**-equivariant coherent objects. A node needing the spherical form — $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ written as $\\iota_*c$ with $c\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}_{\\le\\alpha})$ — is making the same reduction one parahoric up, out of the same colimit presentation, and must say that it is doing so. *Two defects in the index and the category of clause (4), which a citing node must carry.* The colimit is indexed by $\\alpha\\in\\Lambda^+$ under the closure order of clause (2), and that poset is **not directed** once $\\mathrm{Gr}$ is disconnected: $\\lambda-\\mu$ a sum of positive coroots forces $\\lambda\\equiv\\mu$ modulo the coroot lattice, so a single $\\overline{\\mathrm{Gr}}_\\alpha$ lies in one connected component. Finite unions $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ are the directed replacement, and they are cofinal among the stages of clause (3) — [Q1-L3-L2](Q1-L3-L2/index.html)(2). Separately, \"$\\mathcal{F} = \\iota_*c$ for some $\\alpha$\" is a statement about **compact** objects, whereas $\\mathcal{D}_c$ is defined pointwise by [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html) and coherent is not compact on a stack: $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support and comes from no stage — [Q1-L3-L2](Q1-L3-L2/index.html)(4). So clause (4) may be invoked to move an object *off* a stage, never to put an arbitrary coherent object *onto* one.\n\n### [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../appendix/bb-mv-components-dimension.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2: printed p. 4 for clauses (1) and (2), printed p. 5 for clause (3)](../../../../papers/mirkovic2007geometric.pdf)]; external, no main.tex label). Let $G$ be a complex connected reductive algebraic group, $\\mathcal{O} = \\mathbb{C}[[z]]$, $\\mathcal{K} = \\mathbb{C}((z))$, and $\\mathrm{Gr} = G_{\\mathcal{K}}/G_{\\mathcal{O}}$ the affine Grassmannian, taken as a reduced ind-scheme throughout as the source does. Fix a maximal torus $T\\subset G$ and a Borel $B\\supset T$, write $X_*(T)$ for the cocharacter lattice, and let $\\mathrm{Gr}^\\lambda$ be the $G_{\\mathcal{O}}$-orbits of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html)(1). The three clauses are **separately citable** and are stated at the source's generality; see the hypotheses line for the ground field.\n\n**(1) Components.** The connected components of $\\mathrm{Gr}$ are exactly parameterized by the component group of $G_{\\mathcal{K}}$, and that group is isomorphic to the topological fundamental group of $G$:\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ G_{\\mathcal{K}}/(G_{\\mathcal{K}})^0\\ \\cong\\ \\pi_1(G).\n$$\n\n**(2) The torus case.** If $G = T$ is a torus of rank $r$ then, as a reduced ind-scheme,\n\n$$\n\\mathrm{Gr}\\ \\cong\\ X_*(T) = \\mathrm{Hom}(\\mathbb{C}^*, T),\n$$\n\nthe right-hand side regarded as a discrete ind-scheme — a disjoint union of reduced points indexed by the lattice $X_*(T)$. In the source's words, \"in this case the loop Grassmannian is discrete\".\n\n**(3) Dimension.** If the parameter $\\lambda\\in X_*(T)$ of the orbit $\\mathrm{Gr}^\\lambda$ is chosen dominant, then\n\n$$\n\\dim\\left(\\mathrm{Gr}^\\lambda\\right)\\ =\\ \\langle 2\\rho,\\lambda\\rangle,\n$$\n\nwhere $\\rho\\in X^*(T)$ is half the sum of the positive roots with respect to $B$. (The source writes the right-hand side as $2\\rho(\\lambda)$.)\n\n- **hypotheses:** *Per clause.* Clause (1) needs $G$ connected reductive; it asserts a bijection onto a group and **not** that the group is finite — clause (2) exhibits $\\pi_0(\\mathrm{Gr})\\cong X_*(T)\\cong\\mathbb{Z}^r$, infinite for $r\\ge1$. Clause (2) needs $G = T$ a torus, and is an isomorphism of **reduced** ind-schemes only: p. 4 declares \"it suffices for our purposes to consider the spaces $G_{\\mathcal{O}}$, $G_{\\mathcal{K}}$, and $\\mathcal{G}r$ as reduced ind-schemes. We will do so for the rest of the paper\", so no non-reduced structure is asserted; a product of tori is a torus, so $G = T\\times T$ is covered. Clause (3) needs $G$ connected reductive, a choice of $B\\supset T$, and $\\lambda$ **dominant** for that choice — the formula is false for non-dominant $\\lambda$, whose orbit is $\\mathrm{Gr}^{\\lambda^+}$ for the dominant $W$-conjugate. *Ground field — a genuine narrowing, not a formality.* The source fixes $G$ **complex** with $\\mathcal{O} = \\mathbb{C}[[z]]$, $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing base field is any algebraically closed $k$ of characteristic $0$ ([the standing notation](../../../appendix/subsec-notations.html), [$F = k((t))$](../../../appendix/conv-ring-of-integers.html)). **This entry is stated over $\\mathbb{C}$, at the source's generality, and is not asserted over the standing $k$**; unlike [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../appendix/gr-schubert.html), no line of main.tex re-asserts any of these three facts at the standing generality, so there is no manuscript authority to lean on. A node citing any clause over $k\\neq\\mathbb{C}$ is making a **declared widening** and must say so. For clauses (2) and (3) the widening is the routine one — read $\\mathbb{G}_m$ for $\\mathbb{C}^*$ and $k[[t]]$, $k((t))$ for $\\mathcal{O}$, $\\mathcal{K}$. For clause (1) it is not routine: \"the topological fundamental group of $G$\" has no meaning over a general $k$, so over $k$ the right-hand side must be replaced by the algebraic fundamental group, equivalently by $X_*(T)/Q$ with $Q$ the coroot lattice — and that replacement is not on the source's page and is **not carried by this entry**.\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q1-L3-L4](Q1-L3-L4/index.html) was refuted at [r1](Q1-L3-L4/critiques/r1.html) on exactly the computation that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n- **note:** this is what makes [the three standing hypotheses](../../../appendix/assum-intro.html)(a) automatic in the paper's generality, and it is the source of every stratification argument in Q1. Which clause the citing nodes actually consume, and whether they consume it inside the range clause (a) now states — twenty node files link this entry from their `objects:` field (grep of `blueprint/nodes`, 2026-08-09):\n\n  *Inside the range.* [Q1-L3](index.html) does not read (a) off this entry at all: its hypothesis **(C)** posits a subset $\\Lambda'\\subseteq\\Lambda_X^+$ carrying the finite presentation, and its own text already records that the source establishes (a) only over the open-$G$-orbit range. [Q1-L4-e4](../Q1-L4/Q1-L4-e4/index.html) restricts $X$ to symmetric, where $\\mathring{X} = X$ and the restriction is vacuous.\n\n  *Outside it.* Eleven nodes take clause (a) at an unrestricted index — some $\\lambda\\in\\Lambda_X^+$, or a pair $\\mu\\le\\mu'$ — with $X$ only smooth affine spherical and so possibly non-homogeneous: [Q1-L3-L4](Q1-L3-L4/index.html), [Q1-L3-L5](Q1-L3-L5/index.html), [Q1-L4](../Q1-L4/index.html), [Q1-L4-L1](../Q1-L4/Q1-L4-L1/index.html), [Q1-L4-L1-L3](../Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/index.html), [Q1-L5-L3](../Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L3-L2](../Q1-L5/Q1-L5-L3/Q1-L5-L3-L2/index.html), [Q1-L5-L3-L3](../Q1-L5/Q1-L5-L3/Q1-L5-L3-L3/index.html), [Q1-L5-L4](../Q1-L5/Q1-L5-L4/index.html), [Q1-L5-L5](../Q1-L5/Q1-L5-L5/index.html), and [Q1-L5-L6](../Q1-L5/Q1-L5-L6/index.html). What each needs is the finite presentation of $j_\\lambda$, of $\\overline{i}_\\mu$ and of $\\overline{LX}_\\mu\\hookrightarrow\\overline{LX}_{\\mu'}$ — clause (a) — and on this entry as now stated it has that at the indices of $\\Lambda_X^{+,\\circ}$ and, beyond them, from main.tex:770–772 alone. Naming them is this entry's job; repairing them is `/update`'s and `/prove`'s.\n\n  *At the boundary the range excludes.* The failure itself — for $X$ with a $G$-fixed point the closed stratum $\\{x_0\\}$ has $\\overline{i}_{\\lambda_0}$ not finitely presented — is what the amendment records, and no node states it at present: [Q3](../../Q3/index.html) has none, its first decomposition having been removed unattempted on 2026-08-09 ([the register](../../removed.html)). [Q1-L4-e1](../Q1-L4/Q1-L4-e1/index.html) for $X = \\mathbb{A}^1$ and [Q1-L5-e4](../Q1-L5/Q1-L5-e4/index.html) for $X = M_n$ are the two non-homogeneous instances whose index sets contain such a boundary index.\n\n  *Neither clause's range.* [Q1-L5](../Q1-L5/index.html)(H2) consumes clause (b), the indexing of the limit. [Q1-L3-a2](Q1-L3-a2/index.html) names this entry for the loop-space-to-$p$-adic dictionary and consumes neither.\n- **note:** *Provenance, checked at page level on 2026-08-05 against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025).* In v4, Theorem 36 (§5.2, p. 21) is clause (a) above and **not** the presentation; the presentation is Proposition 39(ii) (§5.3, p. 23), whose part (i) is the $I_0$-statement. Proposition 39 states the steps as the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$, indexed by tuples $\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}$ and called *locally equidimensional* placid presentations; the single-index form displayed above is the manuscript's (main.tex:772), and the two agree when $LX$ is connected. The proof of Thm 36 (pp. 21–22) also fixes the mechanism: $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ is the Noetherian-descent factorization of a finitely presented morphism **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$, with $j_\\lambda$ a placid fp-open and $i_\\lambda$ a placid fp-closed embedding.\n\n  *The manuscript's numbers are another version's.* main.tex:772 cites the presentation as \"[Theorem 36]\" and main.tex:1227 cites $K$-placidity of $\\overline{LX}_\\beta$ as \"[Prop. 29.(ii)]\"; neither matches v4, where those are Prop. 39(ii) and Thm 36(i). Recorded as provenance for whoever reads the source alongside the manuscript — not as a correction to main.tex, which no agent edits.\n- **note:** *The index range of clause (a), checked at page level on 2026-08-09 against the same PDF (arXiv:2310.20006**v4**, 10 Jul 2025), pp. 19–24.* Reported twice before it was acted on, and confirmed on the pages.\n\n  *§5 is set in the symmetric case, and its construction lives on the open $G$-orbit.* §5.1 (p. 20) opens \"Let $X^\\circ = BK/K\\subset X$ be the open $B$-orbit\", so $X = G/K$ is homogeneous, and p. 22 derives its exact sequences (7) from \"the fibration $K\\rightarrow G\\rightarrow G/K = X$ (note that we assume $K$ is connected)\". In the affine degeneration $\\pi\\colon\\mathcal{X}\\rightarrow A$ built there, each fibre $\\mathcal{X}_a$ is \"an affine spherical variety for $G$ (not necessary smooth and homogeneous)\", and $\\mathcal{X}^\\bullet\\subseteq\\mathcal{X}$ is defined as the open subscheme whose fibre $\\mathcal{X}^\\bullet_a\\subseteq\\mathcal{X}_a$ is the open $G$-orbit.\n\n  *Lemma 34 (p. 20) is where the range enters.* It is stated under \"Let $\\lambda\\in\\Lambda_S^+$\", fixed one paragraph above, and says that $f_\\lambda$ induces an isomorphism $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$ — the stratum is arcs into the open-$G$-orbit locus. Here $\\Lambda_S^+$ is the symmetric index set of [Chen–Yi symmetric orbit parametrization and closure relation](../../../appendix/bb-chenyi-symmetric-orbits.html)(1), for which $\\mathring{X} = X$.\n\n  *Theorem 36's own statement carries no index restriction; its proof does.* On p. 21 the theorem quantifies $v$, $v'$, $\\lambda$, $\\lambda'$ nowhere, while the proof reads \"For any $\\lambda\\in\\Lambda_S^+$, choose $i, i'$ satisfying (6) and $LX_\\lambda\\subset L^iX$. Then Lemma 34 implies there is a Cartesian diagram …\", and obtains the fp-locally closed $\\eta_\\lambda$ by base change from $\\eta\\colon L^+\\mathcal{X}^\\bullet_\\lambda\\rightarrow L^+\\mathcal{X}_\\lambda\\rightarrow L^{i'}\\mathcal{X}_\\lambda$. So the invocation of Lemma 34 is exactly what constrains the range, and the constraint is visible only inside the proof. The Iwahori half (p. 22) is reduced to the spherical one — \"it suffices to show that the embedding $\\mathcal{O}_v\\rightarrow L^+Gx_v$ into the spherical orbit through $x_v\\in\\mathcal{O}_v$ is finitely presented\" — and so inherits the same range.\n\n  *Remark 37 (p. 22) widens the variety class and not the range.* In full: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites (spelling as in the source), Theorem 36 remains true for general spherical varieties.\" Both named inputs are steps of the proof — [SW22, Lem. 2.3.10] is what Lemma 34's own proof invokes, Theorem 35 is Drinfeld's placidity — and nothing in the remark revisits $\\mathcal{X}^\\bullet$ or the quantifier over $\\Lambda_S^+$. The two qualifications are therefore independent and both stand.\n\n### [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n### [Chen–Yi symmetric orbit parametrization and closure relation](../../../appendix/bb-chenyi-symmetric-orbits.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 17(i) and Thm. 18](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$ whose fixed-point subgroup $G^\\theta$ is connected. Let $S$ be a maximal $\\theta$-split torus of $G$, and let $\\Lambda_S^+$ and $\\check\\Phi^+$ be the dominant coweights of $S$ and the positive coroots, both taken for the restricted root data of §3.1 of the source. Then:\n\n1. *(Prop. 17(i))* The $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$; that is, the index set $\\Lambda_X^+$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) is identified with $\\Lambda_S^+$.\n2. *(Thm. 18)* For every $\\mu\\in\\Lambda_S^+$,\n\n$$\n\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu} LX_\\lambda, \\qquad\\text{where}\\quad \\lambda\\le\\mu \\iff \\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+,\n$$\n\ni.e. $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative integral sum of positive coroots.\n\n- **hypotheses:** $X$ symmetric with $G^\\theta$ connected — **not** general spherical. The proofs run through $\\theta$-twisted $\\mathrm{SL}_2$-computations ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 20, Cor. 21](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]), and no remark in the source extends them beyond the symmetric case — unlike the placidity theorem (Thm 36 with Rem 37) black-boxed as [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), which the source does extend to general spherical $X$.\n\n### [Campbell–Dhillon: the counit is fully faithful](../../../appendix/thm-cd-counit.html) — `thm:CD_counit`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[campbell2021affine, Prop. 3.1.3 and Thm 3.1.5](../../../../papers/campbell2021affine.pdf)]; main.tex:833). If $H/K$ is ind-proper, then\n\n1. the left adjoint in [the induction/invariants adjunction](../../../appendix/eq-adjunction.html) is fully faithful;\n2. the counit $c\\colon \\mathcal{D}(H/K)\\otimes_{\\mathcal{H}}\\mathcal{C}^K\\rightarrow\\mathcal{C}$ is fully faithful and admits a continuous $\\mathcal{D}(H)$-equivariant right adjoint $c^R$.\n\n- **hypotheses:** **$H/K$ ind-proper** (satisfied for $\\mathrm{Gr} = LG/L^+G$); prounipotent radical of $K$ of finite codimension\n\n### [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) — `def:polarized_hyperspherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:875). A *spherical $G$-variety* is a normal $G$-variety $X$ over $k$ with a right $G$-action such that for every Borel $B\\subset G$, $X$ has a Zariski-open $B$-orbit. We further assume\n\n1. $X$ is smooth and affine;\n2. the $B$-stabilizers of points in the open $B$-orbit are connected.\n\nUnder these conditions $M = T^*(2)X$ is a *polarized hyperspherical $G$-variety*, with the weight-$2$ $\\mathbb{G}_m$-action on fibres, in the sense of [[BZSV, §3.5.1](../../../../papers/BZSV.pdf)] (proof: [[BZSV, Prop. 3.7.4](../../../../papers/BZSV.pdf)]). In particular $M$ is a *graded Hamiltonian $G$-variety*.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../appendix/ic-0.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n- **note:** the pointing condition of [unramified relative local Langlands](../../../appendix/conj-relative-langlands-unramified.html) is exactly the requirement that $\\mathrm{IC}_0\\mapsto\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n  **Ratified reading.** The displayed membership is a genuine finiteness statement — it says the $!$-extension is coherent — and no node in the blueprint derives it. It is imported from main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action, which presupposes it; the same presupposition is what lets [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html) accept $\\mathrm{IC}_0$ in the second slot of its module action. Before 2026-08-05 it was carried only by the grammar of those two entries, and round 1 of [Q1-L2-L3](../Q1-L2/Q1-L2-L3/critiques/r1.html) asked for it to be stated; it is stated here so that a proof may cite it rather than infer it from a typing argument. Anyone who later wants it *proved* wants a node about coherence of $!$-extensions on $K\\backslash LX$, which is not in the closed world.\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and [the Satake subcategories](../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n- **note:** main.tex writes the convolution diagram only for the Hecke category itself (main.tex:1096–1102) and describes the action on $LX$ in words — \"which are given by the convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\", main.tex:922. This entry records the reading that the two are the same pull–push construction, which is how every node in the DAG uses $\\ast$.\n\n### [the Satake subcategories](../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n- **note:** **Ratified reading.** main.tex names no ambient cocomplete category for the $\\langle-\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), while $\\mathcal{D}_c$ itself is small and not cocomplete, so the definition as printed is incomplete. The blueprint fixes the reading\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\n  the generation being formed inside $\\mathcal{D}^{\\mathrm{ren}}$. This is forced by the essential-image assertion in the proof of [the small Satake comparison](../../../appendix/thm-f-cstr-sat.html) (main.tex:1391–1392). Ratified in round 2 of [Q1-L1](../Q1-L1/index.html); every downstream node presupposes it. See [ADR 0001](../../../process/decisions/0001-satake-generation-ambient-category.html).\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{chen2022quaternionic,\n  title={Quaternionic Satake equivalence},\n  author={Chen, Tsao-Hsien and Macerato, Mark and Nadler, David and O'Brien, John},\n  journal={arXiv preprint arXiv:2207.04078},\n  year={2022}\n}\n\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@article{BravermanFinkelbergGinzburgTravkin_20
