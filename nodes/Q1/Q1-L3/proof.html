<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3 — Support bound; set-theoretic Hecke saturation is necessary\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [the Satake subcategories](../../../appendix/def-satake-subcategory.html), [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html), [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), [compact objects](../../../appendix/def-compact-objects.html), [$\\ast$](../../../appendix/conv-hecke-action.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), [the three standing hypotheses](../../../appendix/assum-intro.html), [$\\overline{LX}_\\lambda$](../../../appendix/def-orbit-closure.html), [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html), [placidity](../../../appendix/placid-ind-scheme.html), [$\\mathcal{D}^!$](../../../appendix/conv-d-shriek-d-star.html), [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), [Raskin: fp pushforward](../../../appendix/bb-raskin-fp-pushforward.html), [$m_F$ is fp](../../../appendix/fp-convolution-morphism.html); [Q1-L3-L1](Q1-L3-L1/index.html), [Q1-L3-L2](Q1-L3-L2/index.html), [Q1-L3-L3](Q1-L3-L3/index.html), [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html), [Q1-L3-L4](Q1-L3-L4/index.html), [Q1-L3-L6](Q1-L3-L6/index.html).\n- **notation:** $\\mathcal{C}:=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, $K=L^+G$; $A$ the finite subsets of $\\Lambda^+$; $|\\operatorname{supp}(-)|$, *bounded* as in [Q1-L3-L2](Q1-L3-L2/index.html)'s Setup; $|Y|$ the geometric points of $Y$.\n\n## Lemma\n\n**Setup.** For $\\mu\\in\\Lambda^+$ let\n\n$$\nm_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X \\longrightarrow LX\n$$\n\nbe the convolution map, where $\\overline{LG}_\\mu\\subset LG$ is the preimage of $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$; each $m_\\mu$ is ind-proper, since $\\mathrm{Gr}$ is. Write\n\n$$\nLX^{\\mathrm{sat}} := \\bigcup_{\\mu\\in\\Lambda^+}\\left|m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\\right| \\;\\subseteq\\; |LX|\n$$\n\nfor the union of their images on geometric points. This is a $K$-stable subset of $|LX|$ and nothing more: no scheme structure is declared on it, and none is claimed to be closed. Ind-properness of the individual $m_\\mu$ makes each image closed and says nothing about their filtered union.\n\nFor a finite $F\\subseteq\\Lambda^+$ write $Z_F\\subseteq|LX|$ for the closed $K$-stable subset of [Q1-L3-L1](Q1-L3-L1/index.html)(3), and $j_F$ for the open complement of $Z_F$ in $LX$. Two inputs are used below and established by no clause of this node.\n\n**(A) Coherent objects are compact.** Inside the renormalized category [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html),\n\n$$\n\\mathcal{D}_c(K\\backslash LX) \\;=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\; \\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\right)^{\\omega} .\n$$\n\nThis is the statement of [Q1-L2-L1](../Q1-L2/Q1-L2-L1/index.html) at $\\mathcal{Y}=K\\backslash LX$. It is declared here rather than used silently because [Q1-L3-L3](Q1-L3-L3/index.html) concludes about compact objects while clause (i) quantifies over coherent ones, and (A) is the only thing joining the two.\n\n**(B) Support-bounded subcategories are closed under colimits.** For every finite $F\\subseteq\\Lambda^+$ the full subcategory\n\n$$\n\\mathcal{S}_F := \\left\\{\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ |\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F\\right\\}\n$$\n\nis closed under all small colimits formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. This is hypothesis (B) of [Q1-L3-L3](Q1-L3-L3/index.html) for the family this node applies it to, and no statement in the repository establishes it.\n\nContinuity of $j_F^{!}$ delivers (B) once $\\mathcal{S}_F=\\ker(j_F^{!})$, and **that identification is a second assumption and not a consequence of the support convention**: writing $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F$ says $U_F$ is *covered* by opens on which $\\mathcal{G}$ restricts to zero, which gives $\\ker(j_F^{!})\\subseteq\\mathcal{S}_F$ and not the converse. The converse asks vanishing to be local on $LX$ and to survive the passage to the $K$-quotient. Both halves are the business of [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html), where the locality is its hypothesis (A) and the continuity its clause (1). The nearest adjacent statement is the locally closed orbit form at [Q1-L5-L3](../Q1-L5/Q1-L5-L3/index.html)(2), which is about $i_{\\lambda,Z}^{!}$ and not about an open complement.\n\n**(C) Finite presentation on the range used.** There is a subset $\\Lambda'\\subseteq\\Lambda_X^+$ such that for every $\\lambda\\in\\Lambda'$ the closed embedding $\\overline{\\imath}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$ is finitely presented, and $\\bigcup_{\\lambda\\in\\Lambda'}|\\overline{LX}_\\lambda| = |LX|$.\n\nThis is what clause (ii)'s witness argument consumes, and it is **not** available over all of $\\Lambda_X^+$: for $X=\\mathbb{A}^1$ with $G=\\mathbb{G}_m$ the origin of $L\\mathbb{A}^1$ is a closed orbit equal to its own closure whose embedding is cut out by a non-finitely-generated ideal ([Q1-L3-L4 r1](Q1-L3-L4/critiques/r1.html)). [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html)(a) is stated for all of $\\Lambda_X^+$ and its source establishes it only over the open-$G$-orbit range, so the second half of (C) — that the range still exhausts $|LX|$ — is the part nothing supplies.\n\nThen:\n\n(i) under (A) and (B), every $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ satisfies $|\\operatorname{supp}\\mathcal{G}|\\subseteq LX^{\\mathrm{sat}}$;\n\n(ii) for every $\\lambda\\in\\Lambda'$ of (C), $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a nonzero object of $\\mathcal{D}_c(K\\backslash LX)$ with support $\\overline{LX}_\\lambda$ — this clause uses neither (A) nor (B), and is stated on the range (C) supplies;\n\n(iii) hence, under (A), (B) and (C), if $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)$, then $LX^{\\mathrm{sat}} = |LX|$ — every $K$-orbit satisfies $|LX_\\lambda|\\subseteq LX^{\\mathrm{sat}}$, which is set-theoretic Hecke saturation;\n\n(iv) if in addition $LX^{\\mathrm{sat}}$ is the set of geometric points of a reduced closed ind-subscheme $Z\\subseteq LX$, then under the hypothesis of (iii) that ind-subscheme is $Z = (LX)_{\\mathrm{red}}$.\n\n**Unconditionality.** Clauses (i)–(iii) use [the three standing hypotheses](../../../appendix/assum-intro.html)(a) and (b) alone — the placid presentation and the dimension theory that supplies the dualizing object of [sheaves on a placid ind-scheme](../../../appendix/ex-sheaf-placid-ind.html) — together with the Hecke action, the orbit-closure geometry of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html), and the two declared hypotheses (A) and (B), which invoke (c) no more than the clauses do. No clause invokes [the three standing hypotheses](../../../appendix/assum-intro.html)(c), so the necessary condition this node supplies to [Q1](../../../dag.html) is independent of the unramified conjecture — independent, and conditional on (A), (B) and (C). What (C) costs is stated plainly: clause (iii) exhausts $|LX|$ only over the range (C) supplies, so the necessary condition this node hands [Q1](../../../dag.html) is weaker than it read before 2026-08-07 ([u3](updates/u3.html)).\n\n## Proof\n\n**Step 1 — $\\mathcal{C}$ is stable and cocomplete.**\n\n<details><summary>the argument</summary>\n\n[the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) sets\n\n$$\n\\mathcal{C}=\\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)\n$$\n\nwhose source is stable — [coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)'s condition survives shifts and cofibres — and *small* by a convention read off the appendix's use of $\\mathrm{Ind}$; so $\\mathcal{C}$ is presentable stable.\n\n</details>\n\n**Step 2 — hypothesis (A) of [Q1-L3-L3](Q1-L3-L3/index.html) holds.**\n\n<details><summary>the argument</summary>\n\nBy [Q1-L3-L1](Q1-L3-L1/index.html)(3), $A$ is directed and $Z_F=\\bigcup_{\\mu\\in F}Z_\\mu$, so $F\\subseteq F'$ gives $Z_F\\subseteq Z_{F'}$; the condition defining $\\mathcal{S}_F$ weakens, so $\\mathcal{S}_F\\subseteq\\mathcal{S}_{F'}$.\n\n</details>\n\n**Step 3 — each $\\mathcal{S}_F$ is closed under $[n]$ for every $n\\in\\mathbb{Z}$.**\n\n<details><summary>the argument</summary>\n\nMembership is cut out by vanishing of $!$-restrictions to opens ([Q1-L3-L2](Q1-L3-L2/index.html)'s Setup). Each ind-extends a value of the $\\mathrm{DGCat}$-valued $\\mathcal{D}^!$ ([$\\mathcal{D}^!$](../../../appendix/conv-d-shriek-d-star.html), [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html)), so is colimit-preserving between stable categories, hence **exact** — the form [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html)(1) records on $\\mathcal{C}$, free of its (A).\n\nThen $[1]$ and $[-1]$ pass through, and $\\mathcal{G},\\mathcal{G}[n]$ vanish on the same opens:\n\n$$\n\\left|\\operatorname{supp}\\mathcal{G}[n]\\right| = \\left|\\operatorname{supp}\\mathcal{G}\\right| ,\\qquad n\\in\\mathbb{Z} .\n$$\n\nNo colimit argument reaches $n<0$: desuspension is a limit.\n\n</details>\n\n**Step 4 — the rest of (B) for [Q1-L3-L3](Q1-L3-L3/index.html).**\n\n<details><summary>the argument</summary>\n\nThe Lemma's (B) is the small colimits, and cofibres and retracts are small colimits of diagrams inside $\\mathcal{S}_F$: $0$ is the empty colimit, $\\operatorname{cofib}(f)$ the pushout of $0\\leftarrow\\mathcal{G}\\xrightarrow{f}\\mathcal{G}'$, and a retract of $\\mathcal{G}\\in\\mathcal{S}_F$ presents a **split** idempotent, which is what extends to $\\mathrm{Idem}\\rightarrow\\mathcal{C}$ with colimit that retract ([[HTT, 4.4.5.14–16](../../../../papers/HTT.pdf)]).\n\nFullness of $\\mathcal{S}_F$ at its vertex $\\mathcal{G}$ keeps the diagram inside.\n\n</details>\n\n**Step 5 — the generating set is small and coherent.**\n\n<details><summary>the argument</summary>\n\nPut\n\n$$\nS:=\\left\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\ \\text{bounded}\\right\\} .\n$$\n\nIt is indexed by a subset of the small $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ (Step 1's convention); and $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$ ([$\\mathrm{IC}_0$](../../../appendix/ic-0.html), $K=L^+G$), so [$\\ast$](../../../appendix/conv-hecke-action.html) gives $S\\subseteq\\mathcal{D}_c(K\\backslash LX)$.\n\n</details>\n\n**Step 6 — hypothesis (C) of [Q1-L3-L3](Q1-L3-L3/index.html) holds.**\n\n<details><summary>the argument</summary>\n\n(A) reads $\\mathcal{D}_c(K\\backslash LX)=_{\\mathcal{C}}\\mathcal{C}^{\\omega}$, so each member of $S$ is compact ([compact objects](../../../appendix/def-compact-objects.html)).\n\nFor $F$-bounded $\\mathcal{F}$, [Q1-L3-L2](Q1-L3-L2/index.html)(1) puts $\\mathcal{F}\\ast\\mathrm{IC}_0$ in $\\mathcal{S}_F$.\n\n</details>\n\n**Step 7 — $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\subseteq\\bigcup_{F\\in A}\\mathcal{S}_F$.**\n\n<details><summary>the argument</summary>\n\nSteps 1–6 discharge [Q1-L3-L3](Q1-L3-L3/index.html):\n\n$$\n\\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}\\subseteq\\bigcup_{F}\\mathcal{S}_F\n$$\n\nHere $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ by [Q1-L3-L6](Q1-L3-L6/index.html)(1), bracket [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), and $\\mathcal{C}^{\\omega}=\\mathcal{D}_c(K\\backslash LX)$ by (A). The intersection is $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ by the ratified reading of [the Satake subcategories](../../../appendix/def-satake-subcategory.html).\n\n</details>\n\n**Step 8 — clause (i).**\n\n<details><summary>the argument</summary>\n\nStep 7 puts $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ in one $\\mathcal{S}_F$, so\n\n$$\n|\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F\\subseteq\\bigcup_{F'\\in A}Z_{F'}=LX^{\\mathrm{sat}}\n$$\n\nby [Q1-L3-L1](Q1-L3-L1/index.html)(3).\n\n(A), (B) entered only at Steps 6, 4.\n\n</details>\n\n**Step 9 — for $\\lambda\\in\\Lambda'$ the quotient morphism**\n\n<details><summary>the argument</summary>\n\n\n\n$$\n\\overline{q}_\\lambda\\colon K\\backslash\\overline{LX}_\\lambda\\longrightarrow K\\backslash LX\n$$\n\n**is finitely presented ([Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv)'s prestack sense).** Being a reduced $K$-orbit closure ([$\\overline{LX}_\\lambda$](../../../appendix/def-orbit-closure.html)), $\\overline{LX}_\\lambda$ is $K$-stable, so the square over $\\overline{\\imath}_\\lambda$ with $\\overline{q}_\\lambda$ below is Cartesian.\n\nFor affine $S\\rightarrow K\\backslash LX$,\n\n$$\nP:=LX\\times_{K\\backslash LX}S\n$$\n\nis an affine $K$-torsor ([$m_F$ is fp](../../../appendix/fp-convolution-morphism.html), note (e)). The base change of $\\overline{q}_\\lambda$ along $P\\rightarrow K\\backslash LX$ is $\\overline{\\imath}_\\lambda$'s along $P\\rightarrow LX$, finitely presented by (C).\n\nNow $P\\rightarrow S$ is an fppf cover and the notion is fppf-local on the target (same entry).\n\n</details>\n\n**Step 10 — hypothesis (B) of [Q1-L3-L4](Q1-L3-L4/index.html) holds.**\n\n<details><summary>the argument</summary>\n\n[Raskin](../../../appendix/bb-raskin-fp-pushforward.html)(iv) applies to $\\overline{q}_\\lambda$ — the clause its quotient-prestack paragraph directs one to, owing exactly Step 9 — giving\n\n$$\n\\overline{i}_{\\lambda,*}:=\\overline{q}_{\\lambda,*,!-\\mathrm{dR}}\\colon\\mathcal{D}^!(K\\backslash\\overline{LX}_\\lambda)\\rightarrow\\mathcal{D}^!(K\\backslash LX)\n$$\n\nwith base change against $!$-pullback.\n\n</details>\n\n**Step 11 — clause (ii).**\n\n<details><summary>the argument</summary>\n\nFor $\\lambda\\in\\Lambda'$, (C)'s first half is hypothesis (A) of [Q1-L3-L4](Q1-L3-L4/index.html) and Step 10 its (B), so it concludes: $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is nonzero in $\\mathcal{D}_c(K\\backslash LX)$, of support $|\\overline{LX}_\\lambda|$.\n\nThe Lemma's (A), (B) did not enter.\n\n</details>\n\n**Step 12 — under (iii)'s hypothesis, $|\\overline{LX}_\\lambda|\\subseteq LX^{\\mathrm{sat}}$ on $\\Lambda'$.**\n\n<details><summary>the argument</summary>\n\nStep 11's witness lies in $\\mathcal{D}_c(K\\backslash LX)$, hence in $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ by the assumed equality. Clause (i) bounds its support $|\\overline{LX}_\\lambda|$.\n\n</details>\n\n**Step 13 — clause (iii).**\n\n<details><summary>the argument</summary>\n\nUniting Step 12 over $\\Lambda'$,\n\n$$\n|LX| = \\bigcup_{\\lambda\\in\\Lambda'}\\left|\\overline{LX}_\\lambda\\right|\\ \\subseteq\\ LX^{\\mathrm{sat}}\\ \\subseteq\\ |LX| ,\n$$\n\nthe first equality being (C)'s second half, the last inclusion the Setup.\n\n</details>\n\n**Step 14 — the orbit form.**\n\n<details><summary>the argument</summary>\n\nEvery stratum of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) has $|LX_\\lambda|\\subseteq|LX|=LX^{\\mathrm{sat}}$, over all $\\Lambda_X^+$, not just $\\Lambda'$.\n\n</details>\n\n**Step 15 — Unconditionality.**\n\n<details><summary>the argument</summary>\n\nNo statement of [Q1-L3-L1](Q1-L3-L1/index.html), [Q1-L3-L2](Q1-L3-L2/index.html), [Q1-L3-L3](Q1-L3-L3/index.html), [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html), [Q1-L3-L4](Q1-L3-L4/index.html), [Q1-L3-L6](Q1-L3-L6/index.html) mentions [the three standing hypotheses](../../../appendix/assum-intro.html)(c), and no entry invoked above carries it: [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) names the unramified conjecture in a note, not its statement.\n\n</details>\n\n**Step 16 — clause (iv) is uniqueness of a reduced structure.**\n\n<details><summary>the argument</summary>\n\nStep 13 gives $|Z|=|LX|$ for the $Z$ of (iv). The stages of [the three standing hypotheses](../../../appendix/assum-intro.html)(a)'s presentation are reduced ([$\\overline{LX}_\\lambda$](../../../appendix/def-orbit-closure.html)), so on any reading of $(-)_{\\mathrm{red}}$ as largest reduced closed sub-ind-scheme, $(LX)_{\\mathrm{red}}=LX$: (iv) says two reduced closed ind-subschemes with equal geometric points coincide.\n\n**GAP.** No entry supplies that. Wanted: a reduction for ind-schemes, and very-density of geometric points on the stages $\\overline{LX}_\\lambda$, which [placidity](../../../appendix/placid-ind-scheme.html) stops short of: its transitions are smooth and affine, not surjective. Commissioned as [g1](gaps/g1.html).\n\n</details>\n\n## Caveats\n\nStep 11 uses [Q1-L3-L4](Q1-L3-L4/index.html)'s conditional only, never the sentence in its (A) claiming finite presentation over all $\\Lambda_X^+$, refuted at round 1. (C) supplies it on $\\Lambda'$.\n\n**Assumed dependencies used:** [Q1-L3-L2](Q1-L3-L2/index.html)(1) at Step 6, [Q1-L3-L6](Q1-L3-L6/index.html)(1) at Step 7, [Q1-L3-L4](Q1-L3-L4/index.html) at Step 11, [Q1-L3-L3-L1](Q1-L3-L3/Q1-L3-L3-L1/index.html)(1) at Step 3. [Q1-L3-L5](Q1-L3-L5/index.html) is unused.\n\n**Off `objects:`:** [$\\mathcal{D}^!$](../../../appendix/conv-d-shriek-d-star.html), [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), [Raskin](../../../appendix/bb-raskin-fp-pushforward.html), [$m_F$ is fp](../../../appendix/fp-convolution-morphism.html).\n";</script>
