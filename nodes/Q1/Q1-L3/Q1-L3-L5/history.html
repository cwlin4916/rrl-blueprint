that is checkable orbit by orbit and that the symmetric case discharges.\n- **2026-08-06 — what makes the refuted inference true after all.** The counterexample the update run used is the generic one: an increasing union of closed subsets of a Noetherian space need not be closed. Hypothesis **(A)** blocks exactly that mechanism — if each orbit closure meets only finitely many orbits, then the trace of a specialization-closed union of orbits on each stage $\\overline{LX}_\\lambda$ is a *finite* union of strata and the ascending chain stabilizes there. So the conclusion the parent withdrew is recovered, under a hypothesis, rather than reasserted.\n- **2026-08-06 — which ground the node stands on.** The presentation $LX = \\varinjlim_\\lambda\\overline{LX}_\\lambda$ is taken from [the three standing hypotheses](../../../../appendix/assum-intro.html)(a), the standing hypothesis, and **not** from clause (b) of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), which that entry's `hypotheses` field records as established in the source only for symmetric $X$ with $G^\\theta$ connected; clause (a), used for the finitely presented closed embeddings, is general spherical. Conclusion (2) is the one place the symmetric restriction enters, and it enters as a *verification* of hypothesis **(A)** rather than as a hypothesis of the node.\n";</script>
