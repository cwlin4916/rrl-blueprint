tml)\n\n**Standing setting.** The standing setting of [context](../../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../key_examples/k4.html), the symplectic period [K6](../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../key_examples/k9.html); and [K6](../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It refines [Q1-L3](../index.html). Its conclusion is required directly by [Q1-L3](../index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-06 — which ground the node stands on.** The presentation $LX = \\varinjlim_\\lambda\\overline{LX}_\\lambda$ is taken from [the three standing hypotheses](../../../../appendix/assum-intro.html)(a), the standing hypothesis, and **not** from clause (b) of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), which that entry's `hypotheses` field records as established in the source only for symmetric $X$ with $G^\\theta$ connected; clause (a), used for the finitely presented closed embeddings, is general spherical. Conclusion (2) is the one place the symmetric restriction enters, and it enters as a *verification* of hypothesis **(A)** rather than as a hypothesis of the node.\n\n## Target statement\n\n**Setup.** In the standing setting of [context](../../../../context.html), the strata $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) partition $|LX|$, their reduced closures $\\overline{LX}_\\lambda$ are the closed subschemes of [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html), and $LX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ is the $K$-placid presentation ([placidity](../../../../appendix/placid-ind-scheme.html)) put in force by [the three standing hypotheses](../../../../appendix/assum-intro.html)(a). Assume:\n\n**(A) Finite orbit intervals.** For every $\\lambda\\in\\Lambda_X^+$ the set $\\{\\lambda'\\in\\Lambda_X^+\\ \\mid\\ |LX_{\\lambda'}|\\subseteq|\\overline{LX}_\\lambda|\\}$ is finite.\n\nThen:\n\n**(1) Representability of specialization-closed unions of orbits.** For every $K$-stable subset $C\\subseteq|LX|$ that is closed under specialization, writing $\\Sigma := \\{\\lambda\\in\\Lambda_X^+\\mid |LX_\\lambda|\\subseteq C\\}$, the subset $C$ is closed in $|LX|$ and is the set of geometric points of the reduced closed ind-subscheme\n\n$$\nZ\\ :=\\ \\varinjlim_{E\\subseteq\\Sigma\\ \\text{finite}}\\ \\bigcup_{\\lambda\\in E}\\overline{LX}_\\lambda\\ \\subseteq\\ LX ,\n$$\n\nthe colimit being taken along the finitely presented closed embeddings of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a).\n\n**(2) The symmetric case satisfies the hypothesis.** If $X = G/G^\\theta$ is symmetric with $G^\\theta$ connected, then hypothesis (A) above holds, by the closure relation of [Chen–Yi symmetric orbit parametrization](../../../../appendix/bb-chenyi-symmetric-orbits.html).\n\nIn particular the subset $LX^{\\mathrm{sat}}$ of [Q1-L3](../index.html) is such a $C$ — it is $K$-stable and a union of the closed subsets $Z_\\mu$ of [Q1-L3-L1](../Q1-L3-L1/index.html)(2), hence closed under specialization — so under **(A)** the hypothesis of clause (iv) of [Q1-L3](../index.html) is met.\n\n## Direct prerequisites\n\n### [Q1-L3-L1](../Q1-L3-L1/index.html) — The convolution maps are ind-proper, with closed $K$-stable images\n\n- **current effective status:** proved\n- **use policy:** This prerequisite is proved and may be used as stated.\n\n**Setup.** In the standing setting of [context](../../../../context.html), write $\\Lambda^+ := X_*(T)^+$ for the dominant cocharacters and, for $\\mu\\in\\Lambda^+$, let $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$ be the Schubert closure of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html) and $\\overline{LG}_\\mu\\subset LG$ its preimage under $LG\\rightarrow\\mathrm{Gr}$. Let\n\n$$\nm_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X\\longrightarrow LX, \\qquad (g,x)\\longmapsto g\\cdot x,\n$$\n\nbe the convolution map of [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html), and put $Z_\\mu := \\left|m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\\right|\\subseteq|LX|$. Then:\n\n**(1) Ind-properness.** For every $\\mu\\in\\Lambda^+$ the map $m_\\mu$ is ind-proper.\n\n**(2) Closed $K$-stable image.** For every $\\mu\\in\\Lambda^+$ the subset $Z_\\mu$ is closed in $|LX|$ and stable under the action of $K$.\n\n**(3) A directed family exhausting the saturation.** For a finite subset $F\\subseteq\\Lambda^+$ put $Z_F := \\bigcup_{\\mu\\in F}Z_\\mu$. Each $Z_F$ is a closed $K$-stable subset of $|LX|$; the family $\\{Z_F\\}$, indexed by the finite subsets of $\\Lambda^+$ ordered by inclusion, is directed; and\n\n$$\n\\bigcup_{F\\subseteq\\Lambda^+\\ \\text{finite}} Z_F \\;=\\; LX^{\\mathrm{sat}},\n$$\n\nthe subset defined in the Setup of [Q1-L3](../index.html).\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the standing notation](../../../../appendix/subsec-notations.html) — `subsec:notations`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n### [the three standing hypotheses](../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../appendix/conj-intro.html) holds for $X$.\n\n- **note:** (a) is exactly the conclusion of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) for $X$ smooth affine spherical, so it is not an extra restriction in that generality; it is stated as an assumption because main.tex wants it available before the sheaf-theoretic section. (b) is what makes $\\mathcal{D}^!$ and $\\mathcal{D}^*$ agree ([sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html)). (c) is the input the whole paper is conditional on.\n\n**Key spherical varieties.** The class these hypotheses carve out is abstract, so the rows below fix the concrete $(G,X)$ this project keeps in mind — simplest first, then the two instructive ways to fall out of the class. \"(c)\" is hypothesis (c) above. The rows are orientation pointers, at the user's direction (2026-08-04): each writes its action out and its period name links to where the case is developed — the example node when the tree has one, the catalogue [known cases of the unramified equivalence](../../../../appendix/exam-hyperspherical-duality.html) otherwise — but the duals, the hypotheses and the sources live in the catalogue and the nodes, never in a row, and no proof may cite one. [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) fixes right actions; the two rows presented as left quotients say so and act by left translation.\n\n| $X$ | acted on by — the action | period | where (c) stands | in the tree |\n|---|---|---|---|---|\n| $G$ | $G\\times G$ — two-sided translation, $x\\cdot(g_1,g_2)=g_1^{-1}x\\,g_2$ | [group case](../../Q1-e1/index.html) | **proved** — derived Satake [[bezrukavnikov2008equivariant, Thm 5](../../../../../papers/bezrukavnikov2008equivariant.pdf)] | [Q1-e1](../../Q1-e1/index.html) |\n| $\\mathbb{A}^1$ | $\\mathbb{G}_m$ — scaling, $x\\cdot t=tx$ | [Iwasawa–Tate](../../Q1-e2/index.html) | **verified by hand** — [[BZSV, Ex. 7.6.1](../../../../../papers/BZSV.pdf)] | [Q1-e2](../../Q1-e2/index.html) |\n| $M_n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — two-sided translation on $n\\times n$ matrices, $m\\cdot(g_1,g_2)=g_1^{-1}m\\,g_2$ | [Godement–Jacquet](../../Q1-e4/index.html) | **proved** — [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] | [Q1-e4](../../Q1-e4/index.html) |\n| $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation on cosets, $\\mathrm{Sp}_{2n}x\\cdot g=\\mathrm{Sp}_{2n}xg$ | [symplectic (Jacquet–Rallis)](../../Q1-e5/index.html); its dual is the Shalika side | **proved** — quaternionic Satake [[chen2022quaternionic](../../../../../papers/chen2022quaternionic.pdf)]; the $B$-stabilizer connectedness of the standing class is not discharged in those sources | [Q1-e5](../../Q1-e5/index.html) |\n| $(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation, $Hx\\cdot g=Hxg$ for $H=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ block-diagonal | [linear periods](../../../../appendix/exam-hyperspherical-duality.html) | **upcoming** work of Chen–Yi; the orbit geometry is already in print ([Chen–Yi orbit parametrization](../../../../appendix/bb-chenyi-symmetric-orbits.html)) | — |\n| $\\mathrm{SO}_{n-1}\\backslash(\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n)$ | $\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n$ — right translation, $Hx\\cdot g=Hxg$, where $H=\\mathrm{SO}_{n-1}$ sits diagonally, $h\\mapsto(h,h)$, via $\\mathrm{SO}_{n-1}\\subset\\mathrm{SO}_n$ | [Gan–Gross–Prasad / theta](../../../../appendix/exam-hyperspherical-duality.html) | **proved** — [[BFT_orthosymplectic_satake](../../../../../papers/BFT_orthosymplectic_satake.pdf)] | — |\n| rank-$1$ affine homogeneous $X=H\\backslash G$ | various $G$ — right translation, $Hx\\cdot g=Hxg$ | [rank one](../../../../appendix/exam-hyperspherical-duality.html) | **proved under hypotheses** — [[devalapurkar2024kutheoreticspectraldecompositionsspheres, Table 4](../../../../../papers/devalapurkar2024kutheoreticspectraldecompositionsspheres.pdf)] | — |\n| $G/_{\\psi}U$ | $G$ — left translation through $G/U$, $g:xU\\mapsto gxU$, $U$ maximal unipotent; the twist is the generic character $\\psi$ of $U$ | [Whittaker](../../Q1-e3/index.html) | *outside the untwisted class* — twisted polarization; the equivalence per [[BZSV, §7.6.4](../../../../../papers/BZSV.pdf)]; kept because it supplies [ABG](../../../../appendix/bb-abg.html) at Iwahori level | [Q1-e3](../../Q1-e3/index.html) |\n| $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | $\\mathrm{PSL}_2$ — left translation, $g:x\\,\\mathrm{PO}_2\\mapsto gx\\,\\mathrm{PO}_2$ | [boundary case](../../Q1-e6/index.html) | *outside the class* — a type-$N$ spherical root breaks connected stabilizers, and the expected statement itself changes shape | [Q1-e6](../../Q1-e6/index.html) |\n\nThe first four rows are where (c) is a theorem or a verified computation — the working instances of the standing class — with the linear periods next in line. $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, the linear periods and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ are symmetric, the territory where the [Chen–Yi orbit machinery](../../../../appendix/bb-chenyi-symmetric-orbits.html) applies and [Q1-L6](../../Q1-L6/index.html)'s induction closes. The last two rows are kept deliberately: Whittaker for the Iwahori-level black box it supplies, and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ because it shows clause (2) of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) is load-bearing.\n\n### [placidity](../../../../appendix/placid-ind-scheme.html) — `placid_ind_scheme`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:669).\n\n- A scheme/algebraic space $X$ *admits a placid presentation* if $X\\simeq\\varprojlim_i X_i$ is a cofiltered limit of finite-type schemes/algebraic spaces whose transition maps $X_i\\rightarrow X_j$ are smooth and affine; such an $X$ is a *placid* scheme/algebraic space.\n- An ind-scheme $X$ is *placid* if $X = \\varinjlim_i X_i$ is a filtered colimit of placid schemes along closed embeddings of finite presentation. If a placid group scheme $H$ acts on a placid ind-scheme $X$ and each $X_i$ in the presentation is $H$-stable, $X$ is an *$H$-placid ind-scheme*.\n\n- **note:** $H$-placidity is a property *of a chosen presentation*, not of $X$ alone. Two presentations of the same $LX$ — the $K$-orbit-closure one and the $I$-orbit-closure one — are both supplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).\n\n### [loops, jets and positive loops are placid — $L^nX$, $L^+X$, $LX$](../../../../appendix/ex-loops-placid.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Example** (main.tex:694–718, unlabelled; cite by line). Let $X\\in\\mathrm{AffSch}^{f.t.}$ be smooth affine of finite type. The $n$-jets $L^nX$, defined on $k$-algebras by\n\n$$\nL^nX(R) := X\\left(R[t]/t^n\\right),\n$$\n\nare represented by affine schemes of finite type, and the presentation $L^+X\\simeq\\varprojlim_n L^nX$ exhibits the positive loop space $L^+X$ as a placid scheme ([placidity](../../../../appendix/placid-ind-scheme.html)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **hypotheses:** $X$ smooth affine of finite type\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda = \\mathrm{Gr}_{\\le\\lambda}$ — the affine Grassmannian by Schubert closures](../../../../appendix/gr-schubert.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2, p. 4: the paragraph on $G_{\\mathcal{O}}$-orbits, together with (2.1) and (2.2)](../../../../../papers/mirkovic2007geometric.pdf)] for clauses (1)–(3); main.tex:831 and main.tex:1100 for the ind-properness in clause (3); main.tex:1208 and main.tex:1221 for clause (4)). Let $G$, $T$, $W$, $K = L^+G$ and $\\mathrm{Gr}$ be as in [the standing notation](../../../../appendix/subsec-notations.html), write $X_*(T)$ for the cocharacter lattice and $\\Lambda^+ := X_*(T)^+$ for the dominant cone.\n\n**(1) Orbits.** The group scheme $K$ acts on $\\mathrm{Gr}$ with finite-dimensional orbits, and the $K$-orbits are parameterized by the $W$-orbits in $X_*(T)$ — equivalently by $\\Lambda^+$. The orbit attached to $\\lambda$ is\n\n$$\n\\mathrm{Gr}^\\lambda = K\\cdot L_\\lambda\\ \\subset\\ \\mathrm{Gr},\n$$\n\nwhere $L_\\lambda$ is the image in $\\mathrm{Gr}$ of the point $\\lambda\\in X_*(T)\\subset LG$.\n\n**(2) Closure order.** For $\\lambda,\\mu\\in\\Lambda^+$,\n\n$$\n\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}\\quad\\text{if and only if}\\quad \\lambda-\\mu\\ \\text{is a sum of positive coroots.}\n$$\n\nThe blueprint writes $\\overline{\\mathrm{Gr}}_\\lambda := \\overline{\\mathrm{Gr}^\\lambda}$ for the closure, taken reduced.\n\n**(3) Presentation and ind-properness.** $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$, where the $\\mathrm{Gr}_n$ are finite-dimensional $K$-invariant schemes and every transition map is a closed embedding, and $\\mathrm{Gr}$ is ind-proper.\n\n**(4) Coherent sheaves come from a stage.** With $\\mathrm{Gr}_{\\le\\alpha}$ the manuscript's name for $\\overline{\\mathrm{Gr}}_\\alpha$,\n\n$$\n\\mathcal{D}(\\mathrm{Gr})\\simeq\\varinjlim_{\\alpha\\in\\Lambda^+}\\mathcal{D}\\left(\\mathrm{Gr}_{\\le\\alpha}\\right),\n$$\n\nand every $\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$ may be written $\\mathcal{F} = \\iota_*c$ with $\\iota\\colon\\mathrm{Gr}_{\\le\\alpha}\\hookrightarrow\\mathrm{Gr}$ the closed embedding and $c\\in\\mathcal{D}_c(\\mathrm{Gr}_{\\le\\alpha})^I$, for some $\\alpha\\in\\Lambda^+$.\n\n- **hypotheses:** $G$ connected reductive. Three caveats a citing node must carry. *Ground field.* The source works over $\\mathbb{C}$, with $\\mathcal{O} = \\mathbb{C}[[z]]$ and $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing $k$ is any algebraically closed field of characteristic $0$ ([the standing notation](../../../../appendix/subsec-notations.html), [$F = k((t))$](../../../../appendix/conv-ring-of-integers.html)); the presentation in clause (4) is asserted over the standing $k$ by main.tex:1208, and clauses (1)–(3) are used at that generality on the manuscript's authority, not on the source's page. *Equivariance in clause (4).* main.tex:1221 prints the reduction $\\mathcal{F} = \\iota_*c$ for **Iwahori**-equivariant coherent objects. A node needing the spherical form — $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ written as $\\iota_*c$ with $c\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}_{\\le\\alpha})$ — is making the same reduction one parahoric up, out of the same colimit presentation, and must say that it is doing so. *Two defects in the index and the category of clause (4), which a citing node must carry.* The colimit is indexed by $\\alpha\\in\\Lambda^+$ under the closure order of clause (2), and that poset is **not directed** once $\\mathrm{Gr}$ is disconnected: $\\lambda-\\mu$ a sum of positive coroots forces $\\lambda\\equiv\\mu$ modulo the coroot lattice, so a single $\\overline{\\mathrm{Gr}}_\\alpha$ lies in one connected component. Finite unions $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ are the directed replacement, and they are cofinal among the stages of clause (3) — [Q1-L3-L2](../Q1-L3-L2/index.html)(2). Separately, \"$\\mathcal{F} = \\iota_*c$ for some $\\alpha$\" is a statement about **compact** objects, whereas $\\mathcal{D}_c$ is defined pointwise by [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) and coherent is not compact on a stack: $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support and comes from no stage — [Q1-L3-L2](../Q1-L3-L2/index.html)(4). So clause (4) may be invoked to move an object *off* a stage, never to put an arbitrary coherent object *onto* one.\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../Q1-L3-L4/index.html) was refuted at [r1](../Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n- **note:** this is what makes [the three standing hypotheses](../../../../appendix/assum-intro.html)(a) automatic in the paper's generality, and it is the source of every stratification argument in Q1. Which clause the citing nodes actually consume, and whether they consume it inside the range clause (a) now states — twenty node files link this entry from their `objects:` field (grep of `blueprint/nodes`, 2026-08-09):\n\n  *Inside the range.* [Q1-L3](../index.html) does not read (a) off this entry at all: its hypothesis **(C)** posits a subset $\\Lambda'\\subseteq\\Lambda_X^+$ carrying the finite presentation, and its own text already records that the source establishes (a) only over the open-$G$-orbit range. [Q1-L4-e4](../../Q1-L4/Q1-L4-e4/index.html) and [Q3-L6](../../../Q3/Q3-L6/index.html) restrict $X$ to symmetric, where $\\mathring{X} = X$ and the restriction is vacuous.\n\n  *Outside it.* Twelve nodes take clause (a) at an unrestricted index — some $\\lambda\\in\\Lambda_X^+$, or a pair $\\mu\\le\\mu'$ — with $X$ only smooth affine spherical and so possibly non-homogeneous: [Q1-L3-L4](../Q1-L3-L4/index.html), [Q1-L3-L5](index.html), [Q1-L4](../../Q1-L4/index.html), [Q1-L4-L1](../../Q1-L4/Q1-L4-L1/index.html), [Q1-L4-L1-L3](../../Q1-L4/Q1-L4-L1/Q1-L4-L1-L3/index.html), [Q1-L5-L3](../../Q1-L5/Q1-L5-L3/index.html), [Q1-L5-L3-L2](../../Q1-L5/Q1-L5-L3/Q1-L5-L3-L2/index.html), [Q1-L5-L3-L3](../../Q1-L5/Q1-L5-L3/Q1-L5-L3-L3/index.html), [Q1-L5-L4](../../Q1-L5/Q1-L5-L4/index.html), [Q1-L5-L5](../../Q1-L5/Q1-L5-L5/index.html), [Q1-L5-L6](../../Q1-L5/Q1-L5-L6/index.html) and [Q3-L4](../../../Q3/Q3-L4/index.html). What each needs is the finite presentation of $j_\\lambda$, of $\\overline{i}_\\mu$ and of $\\overline{LX}_\\mu\\hookrightarrow\\overline{LX}_{\\mu'}$ — clause (a) — and on this entry as now stated it has that at the indices of $\\Lambda_X^{+,\\circ}$ and, beyond them, from main.tex:770–772 alone. Naming them is this entry's job; repairing them is `/update`'s and `/prove`'s.\n\n  *At the boundary the range excludes.* [Q3-L2](../../../Q3/Q3-L2/index.html) states the failure itself — for $X$ with a $G$-fixed point the closed stratum $\\{x_0\\}$ has $\\overline{i}_{\\lambda_0}$ not finitely presented — so the amendment supports that node rather than damaging it. [Q1-L4-e1](../../Q1-L4/Q1-L4-e1/index.html) for $X = \\mathbb{A}^1$ and [Q1-L5-e4](../../Q1-L5/Q1-L5-e4/index.html) for $X = M_n$ are the two non-homogeneous instances whose index sets contain such a boundary index.\n\n  *Neither clause's range.* [Q1-L5](../../Q1-L5/index.html)(H2) consumes clause (b), the indexing of the limit. [Q1-L3-a2](../Q1-L3-a2/index.html) names this entry for the loop-space-to-$p$-adic dictionary and consumes neither.\n- **note:** *Provenance, checked at page level on 2026-08-05 against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025).* In v4, Theorem 36 (§5.2, p. 21) is clause (a) above and **not** the presentation; the presentation is Proposition 39(ii) (§5.3, p. 23), whose part (i) is the $I_0$-statement. Proposition 39 states the steps as the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$, indexed by tuples $\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}$ and called *locally equidimensional* placid presentations; the single-index form displayed above is the manuscript's (main.tex:772), and the two agree when $LX$ is connected. The proof of Thm 36 (pp. 21–22) also fixes the mechanism: $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ is the Noetherian-descent factorization of a finitely presented morphism **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$, with $j_\\lambda$ a placid fp-open and $i_\\lambda$ a placid fp-closed embedding.\n\n  *The manuscript's numbers are another version's.* main.tex:772 cites the presentation as \"[Theorem 36]\" and main.tex:1227 cites $K$-placidity of $\\overline{LX}_\\beta$ as \"[Prop. 29.(ii)]\"; neither matches v4, where those are Prop. 39(ii) and Thm 36(i). Recorded as provenance for whoever reads the source alongside the manuscript — not as a correction to main.tex, which no agent edits.\n- **note:** *The index range of clause (a), checked at page level on 2026-08-09 against the same PDF (arXiv:2310.20006**v4**, 10 Jul 2025), pp. 19–24.* Reported twice before it was acted on, and confirmed on the pages.\n\n  *§5 is set in the symmetric case, and its construction lives on the open $G$-orbit.* §5.1 (p. 20) opens \"Let $X^\\circ = BK/K\\subset X$ be the open $B$-orbit\", so $X = G/K$ is homogeneous, and p. 22 derives its exact sequences (7) from \"the fibration $K\\rightarrow G\\rightarrow G/K = X$ (note that we assume $K$ is connected)\". In the affine degeneration $\\pi\\colon\\mathcal{X}\\rightarrow A$ built there, each fibre $\\mathcal{X}_a$ is \"an affine spherical variety for $G$ (not necessary smooth and homogeneous)\", and $\\mathcal{X}^\\bullet\\subseteq\\mathcal{X}$ is defined as the open subscheme whose fibre $\\mathcal{X}^\\bullet_a\\subseteq\\mathcal{X}_a$ is the open $G$-orbit.\n\n  *Lemma 34 (p. 20) is where the range enters.* It is stated under \"Let $\\lambda\\in\\Lambda_S^+$\", fixed one paragraph above, and says that $f_\\lambda$ induces an isomorphism $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$ — the stratum is arcs into the open-$G$-orbit locus. Here $\\Lambda_S^+$ is the symmetric index set of [Chen–Yi symmetric orbit parametrization and closure relation](../../../../appendix/bb-chenyi-symmetric-orbits.html)(1), for which $\\mathring{X} = X$.\n\n  *Theorem 36's own statement carries no index restriction; its proof does.* On p. 21 the theorem quantifies $v$, $v'$, $\\lambda$, $\\lambda'$ nowhere, while the proof reads \"For any $\\lambda\\in\\Lambda_S^+$, choose $i, i'$ satisfying (6) and $LX_\\lambda\\subset L^iX$. Then Lemma 34 implies there is a Cartesian diagram …\", and obtains the fp-locally closed $\\eta_\\lambda$ by base change from $\\eta\\colon L^+\\mathcal{X}^\\bullet_\\lambda\\rightarrow L^+\\mathcal{X}_\\lambda\\rightarrow L^{i'}\\mathcal{X}_\\lambda$. So the invocation of Lemma 34 is exactly what constrains the range, and the constraint is visible only inside the proof. The Iwahori half (p. 22) is reduced to the spherical one — \"it suffices to show that the embedding $\\mathcal{O}_v\\rightarrow L^+Gx_v$ into the spherical orbit through $x_v\\in\\mathcal{O}_v$ is finitely presented\" — and so inherits the same range.\n\n  *Remark 37 (p. 22) widens the variety class and not the range.* In full: \"Since [SW22, Lemma 2.3.10] and Theorem 35 are valid for general spherical varieites (spelling as in the source), Theorem 36 remains true for general spherical varieties.\" Both named inputs are steps of the proof — [SW22, Lem. 2.3.10] is what Lemma 34's own proof invokes, Theorem 35 is Drinfeld's placidity — and nothing in the remark revisits $\\mathcal{X}^\\bullet$ or the quantifier over $\\Lambda_S^+$. The two qualifications are therefore independent and both stand.\n\n### [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [Chen–Yi symmetric orbit parametrization and closure relation](../../../../appendix/bb-chenyi-symmetric-orbits.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 17(i) and Thm. 18](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$ whose fixed-point subgroup $G^\\theta$ is connected. Let $S$ be a maximal $\\theta$-split torus of $G$, and let $\\Lambda_S^+$ and $\\check\\Phi^+$ be the dominant coweights of $S$ and the positive coroots, both taken for the restricted root data of §3.1 of the source. Then:\n\n1. *(Prop. 17(i))* The $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$; that is, the index set $\\Lambda_X^+$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) is identified with $\\Lambda_S^+$.\n2. *(Thm. 18)* For every $\\mu\\in\\Lambda_S^+$,\n\n$$\n\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu} LX_\\lambda, \\qquad\\text{where}\\quad \\lambda\\le\\mu \\iff \\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+,\n$$\n\ni.e. $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative integral sum of positive coroots.\n\n- **hypotheses:** $X$ symmetric with $G^\\theta$ connected — **not** general spherical. The proofs run through $\\theta$-twisted $\\mathrm{SL}_2$-computations ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 20, Cor. 21](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]), and no remark in the source extends them beyond the symmetric case — unlike the placidity theorem (Thm 36 with Rem 37) black-boxed as [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), which the source does extend to general spherical $X$.\n- **note:** *Provenance, verified on the page.* The PDF is on disk as `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025), and both statements were re-checked there on 2026-08-05 by the lead-researcher for `/update Q1-L5`. **Proposition 17(i)**, p. 10: the $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$ — for each $\\mu\\in\\Lambda_S^+$ there is $x_\\mu\\in LX(k) = X(F)$ with $\\tau(x_\\mu) = t^\\mu\\in S(F)$, and $LX_\\mu = L^+G\\cdot x_\\mu$ is the corresponding orbit. **Theorem 18**, p. 10: for every $\\mu\\in\\Lambda_S^+$, $\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$; the order is the one the source fixes on $\\Lambda_S$ just above Prop. 17 on the same page, by restriction from $\\Lambda_T$ — $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative sum of positive coroots. Both check out as transcribed above.\n\n  Same page, Remark 19: for $k = \\mathbb{C}$ the closure relation is the source's [Nad04, Thm. 10.1], proved there through real affine Grassmannians, whereas the source's own argument is algebraic and valid over any algebraically closed field of characteristic $\\ne 2$ — so it covers the blueprint's standing $k$ of characteristic $0$ ([the standing notation](../../../../appendix/subsec-notations.html)). Prop. 17(ii), the bijection $G(F)/K(F)\\cong X(F)$, is the part that needs $G^\\theta$ connected on the page; the reading record in [`papers/guideline.md`](../../../../papers/guideline.html) notes that in [Nad04] part (i) holds without that hypothesis.\n\n### [Campbell–Dhillon: the counit is fully faithful](../../../../appendix/thm-cd-counit.html) — `thm:CD_counit`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[campbell2021affine, Prop. 3.1.3 and Thm 3.1.5](../../../../../papers/campbell2021affine.pdf)]; main.tex:833). If $H/K$ is ind-proper, then\n\n1. the left adjoint in [the induction/invariants adjunction](../../../../appendix/eq-adjunction.html) is fully faithful;\n2. the counit $c\\colon \\mathcal{D}(H/K)\\otimes_{\\mathcal{H}}\\mathcal{C}^K\\rightarrow\\mathcal{C}$ is fully faithful and admits a continuous $\\mathcal{D}(H)$-equivariant right adjoint $c^R$.\n\n- **hypotheses:** **$H/K$ ind-proper** (satisfied for $\\mathrm{Gr} = LG/L^+G$); prounipotent radical of $K$ of finite codimension\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../appendix/ic-0.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) and [the Satake subcategories](../../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n### [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{chen2022quaternionic,\n  title={Quaternionic Satake equivalence},\n  author={Chen, Tsao-Hsien and Macerato, Mark and Nadler, David and O'Brien, John},\n  journal={arXiv preprint arXiv:2207.04078},\n  year={2022}\n}\n\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@article{BravermanFinkelbergGinzburgTravkin_2021,\n   title={Mirabolic Satake equivalence and supergroups},\n   volume={157},\n   ISSN={1570-5846},\n   url={http://dx.doi.org/10.1112/S0010437X21007387},\n   DOI={10.1112/s0010437x21007387},\n   number={8},\n   journal={Compositio Mathematica},\n   publisher={Wiley},\n   author={Braverman, Alexander and Finkelberg, Michael and Ginzburg, Victor and Travkin, Roman},\n   year={2021},\n   month=jul, pages={1724–1765} }\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{devalapurkar2024kutheoreticspectraldecompositionsspheres,\n      title={ku-theoretic spectral decompositions for spheres and projective spaces},\n      author={Sanath K. Devalapurkar},\n      year={2024},\n      eprint={2402.03995},\n      archivePrefix={arXiv},\n      primaryClass={math.AT},\n      url={https://arxiv.org/abs/2402.03995},\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n\n@article{bezrukavnikov2008equivariant,\n  title={Equivariant Satake category and Kostant--Whittaker reduction},\n  author={Bezrukavnikov, Roman Vladimirovich and Finkel'berg, Mikhail Vladlenovich},\n  journal={Moscow Mathematical Journal},\n  volume={8},\n  number={1},\n  pages={39--72},\n  year={2008},\n  publisher={Независимый Московский университет--МЦНМО}\n}\n\n@article{mirkovic2007geometric,\n  title={Geometric Langlands duality and representations of algebraic groups over commutative rings},\n  author={Mirkovi{\\'c}, Ivan and Vilonen, Kari},\n  journal={Annals of mathematics},\n  volume={166},\n  number={1},\n  pages={95--143},\n  year={2007},\n  publisher={JSTOR}\n}\n\n@article{BFT_orthosymplectic_satake,\n   title={Orthosymplectic Satake equivalence},\n   volume={16},\n   ISSN={1931-4531},\n   url={http://dx.doi.org/10.4310/CNTP.2022.v16.n4.a2},\n   DOI={10.4310/cntp.2022.v16.n4.a2},\n   number={4},\n   journal={Communications in Number Theory and Physics},\n   publisher={International Press of Boston},\n   author={Braverman, Alexander and Finkelberg, Michael and Travkin, Roman},\n   year={2022},\n   pages={695–732} }\n\n@article{campbell2021affine,\n  title={Affine Harish-Chandra bimodules and Steinberg--Whittaker localization},\n  author={Campbell, Justin and Dhillon, Gurbir},\n  journal={arXiv preprint arXiv:2108.02806},\n  year={2021}\n}\n```\n\n## The key examples this statement is tested against\n\n
