<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L5</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L5 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L3-L5\n\n[node](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L3-L5](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\nThe statement decomposes into four pieces a finding can match: hypothesis **(A)** (finite\norbit intervals); the *closedness* half of **(1)** ($C$ closed in $|LX|$); the\n*representability* half of **(1)** ($C$ is the point set of the reduced closed ind-subscheme\n$Z=\\varinjlim_E\\bigcup_{\\lambda\\in E}\\overline{LX}_\\lambda$); and **(2)** (symmetric $X$\nsatisfies (A)).\n\n## Precedent\n\n**What was searched.** Local library first: `chenyi_2025singularitiesorbitclosuresloop` v4 at\npage level — §3.1–3.2 (p. 10), §4.2 with Cor. 27 (pp. 16–18), §5.3 with Lemma 38 and Prop. 39\n(pp. 22–23), and §11 *Disconnected groups* (p. 53); `mirkovic2007geometric` pp. 4–9 ((2.1),\n(2.2), Prop. 3.1, Rem. 3.3); `raskin_dmodules_infinite_var` §6.2–6.8 (pp. 34–36); `BZSV` §7.3\n(pp. 155–159); `SV17` §5.3 (printed pp. 76–78). Then the web, for closedness of the image of an\nind-proper map, for finiteness of $L^+G$-orbits in a closure, and for a citable form of \"a\nlocally finite directed union of closed subschemes is a closed ind-subscheme\"; and\nGaitsgory–Nadler (arXiv:math/0611323) at p. 4.\n\n**What was found.**\n\n- **Hypothesis (A) is in print for symmetric $X$, by a route the node does not use.**\n  Chen–Yi, **Corollary 27** (p. 17): \"(i) The closure of each $I_0$-orbit contains only\n  finitely many $I_0$-orbits. (ii) Each $L^+G$-orbit on $LX$ is a union of finitely many\n  $I_0$-orbits.\" Since $\\overline{LX}_\\lambda$ is then the closure of a *finite* union of\n  $I_0$-orbits, hence a finite union of $I_0$-orbit closures, it contains finitely many\n  $I_0$-orbits; every $L^+G$-orbit inside it contains at least one of them, and distinct\n  $L^+G$-orbits are disjoint. That is **(A)**, i.e. exactly clause **(2)** — and it is also\n  verbatim the statement of the sibling node\n  [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html), so one source answers both. Setting:\n  $X=G/K$ symmetric with $K$ connected (Cor. 27 runs through Lemma 23(iii), which uses\n  Prop. 17(ii)) — the hypothesis of clause (2) and no more; §11(1) (p. 53) extends it to the\n  orbits inside $\\pi(LG)$ when $K$ is disconnected. It touches neither half of (1).\n- **The node's own route to (2) is one step short of the page, and that step is sourced\n  elsewhere.** Chen–Yi **Thm. 18** (p. 10) gives\n  $\\overline{LX}_\\mu=\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$, and §3.1 on the same page fixes\n  $\\Lambda_S^+=\\Lambda_S\\cap\\Lambda_T^+$ with the order restricted from $\\Lambda_T$\n  ($\\mu-\\lambda$ a non-negative sum of positive coroots) — so the interval is a *dominance*\n  interval, inside the dominant cone of an honest root datum. Finiteness of it is not stated\n  there; but the proof of **Cor. 21** (p. 11) reduces the containment to \"the orbits closure\n  relation in affine Grassmannian\", where it *is* on a page: `mirkovic2007geometric`\n  **Rem. 3.3** (p. 9), $L_\\nu\\in\\overline{\\mathcal{G}r^\\lambda}$ iff $\\nu$ is a weight of the\n  irreducible $\\check G$-representation of highest weight $\\lambda$ — a finite set. So (A) for\n  symmetric $X$ has two independent sourced routes, Cor. 27 and Thm. 18 + Rem. 3.3.\n- **Clause (1) is in print only for $C=|LX|$.** Chen–Yi **Prop. 39(ii)** (p. 23): the\n  disjoint unions $\\overline{LX}_{\\underline\\lambda}=\\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$\n  are placid schemes and $LX\\cong\\mathrm{colim}_{\\underline\\lambda}\\overline{LX}_{\\underline\\lambda}$\n  is an $L^+G$-placid presentation. That is (1) at $\\Sigma=\\Lambda_X^+$, where both halves are\n  vacuous ($C=|LX|$ is closed for free). Nothing in the source treats a proper $C$.\n- **Lemma 38 is filteredness, not finiteness — and the node needs it anyway.** Chen–Yi\n  **Lemma 38** (p. 22) says $\\Lambda_{S,\\beta}^+$ and $\\mathcal{V}_\\beta$ are *filtered*\n  (upward-directed) sets, proved with \"note that we assume $K$ is connected\". Upward\n  directedness is logically independent of **(A)**, which is downward finiteness, so §5.3 —\n  the natural home the node points at — is **not** the precedent for (A). It is, however, what\n  makes each stage $\\bigcup_{\\lambda\\in E}\\overline{LX}_\\lambda$ of the colimit $Z$ a *scheme*\n  rather than merely a closed subspace: a finite $E$ is dominated by a single $\\gamma$, so the\n  union sits inside the placid scheme $\\overline{LX}_\\gamma$ and a reduced closed subset of a\n  scheme is a scheme. The node's `objects:` field links nothing that supplies this, and a\n  prover will want it.\n- **For symmetric $X$ the application is settled in print, and (A) is not what settles it.**\n  Chen–Yi **Prop. 17(ii)** (p. 10): for $K$ connected, $LG\\rightarrow LX$ induces a bijection\n  $G(F)/K(F)\\cong X(F)$, so $LG$ is transitive on $LX(k)$ and, since $L^+X(k)\\ni eK$,\n  $LX^{\\mathrm{sat}}=|LX|$ before closedness is asked. Chen–Yi **§11** (p. 53) removes the\n  connectedness: \"the image $LX_{\\mathcal{L}}=\\pi(LG)\\subset LX$ is an union of components\",\n  and §11(2) adds that it is $LG$-invariant with $L^+X\\subset LX_{\\mathcal{L}}$. Those two\n  give $LX^{\\mathrm{sat}}=LX_{\\mathcal{L}}$ — $\\subseteq$ by invariance, $\\supseteq$ because\n  $\\pi(e)=eK\\in L^+X$ — so the saturation is a *union of connected components*, hence closed,\n  and proper exactly when $G(F)$ is not transitive on $X(F)$. This is the strongest thing\n  found: it settles the closedness the \"In particular\" wants, for symmetric $X$, **with no\n  appeal to (A) and no appeal to either clause of the node**. The classical shadow of the\n  connected case (correspondence: $LX(k)\\leftrightarrow X(F)$, $K\\leftrightarrow\n  G(\\mathfrak{o})$, over a $p$-adic rather than an equal-characteristic field) is `SV17`\n  **Thm. 5.3.3** (printed p. 78), under its standing $x_0\\in\\mathring{\\mathbf{X}}(\\mathfrak{o})$:\n  $A_X^+$ contains a complete set of representatives for the $K$-orbits on $X$, i.e.\n  $X(F)=G(F)\\cdot X(\\mathfrak{o})$.\n- **Nothing found contradicts the node.**\n\n**What was not found.** No numbered statement of the general principle clause **(1)** turns on —\nthat a subset of $|T|$ meeting each stage of an ind-presentation in a closed subset is the point\nset of a reduced closed sub-ind-scheme. `raskin_dmodules_infinite_var` §6 is the local library's\nhome for ind-scheme foundations and demonstrably does not contain it: §6.2 defines an indscheme as\na filtered colimit of qcqs schemes along closed embeddings, Def. 6.4.1 and Lemma 6.4.6 treat\n*reasonable* subschemes, (6.5.1) the sheaf categories and Def. 6.8.1 placidity — and no clause\nanywhere concerns subsets of the underlying space. Beyond that, no source states the\nrepresentability half of **(1)**, and none states\neither half of (1) for a proper $C$ that is *not* a union of components: Chen–Yi §5.3 stops at\n$\\Sigma=\\Lambda_X^+$ and §11 gets closedness from $\\pi_0$, which says nothing about a $C$\ninside one component. The natural home for the same geometry on a *non-symmetric* spherical\n$X$ is Gaitsgory–Nadler, and it says on its p. 4 that it deliberately avoids $LX$: \"In a less\ncomplicated world, we would not need to consider $Z$ but could work directly with the loop\nspace of $X$. Unfortunately, we do not know how to deal with the infinite-dimensionality of\nthis space.\"\n\n## Instances\n\n### 1. The group case, $X=G$ under $G\\times G$ — instance\n\n**What it is.** $K=L^+G\\times L^+G$ on $|LX|=|LG|$; strata $L^+Gt^\\mu L^+G$ indexed by\n$\\Lambda_X^+=\\Lambda^+$ (Cartan), closures given by the dominance order.\n\n**Why it is an instance.** Smooth affine spherical with connected generic $B$-stabilizers;\n[the three standing hypotheses](../../../../appendix/assum-intro.html)(a) holds. **(A)**: `mirkovic2007geometric`\np. 4 gives the orbit parametrization and (2.2), $\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}$\niff $\\lambda-\\mu$ is a sum of positive coroots; and Rem. 3.3 (p. 9) makes the interval\n$\\{\\mu\\in\\Lambda^+\\mid\\mu\\le\\lambda\\}$ finite on the source's own page, since it is carried by the\nweights of a finite-dimensional representation.\n\n**What it matches.** Hypothesis **(A)** and both halves of **(1)**. The degenerate reading —\n$C=LX^{\\mathrm{sat}}=|LX|$, since $1\\in L^+X$ and $LG\\cdot 1\\cdot LG=|LG|$ — tests nothing.\nA non-degenerate reading does: take $G=G_1\\times G_2$ and\n$\\Sigma=\\Lambda^+_{G_1}\\times\\{0\\}$, a proper *infinite* lower set (dominant $\\mu'$ with\n$-\\mu'\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+$ forces $\\mu'=0$). Then $C=|LG_1\\times L^+G_2|$, whose\nstages $\\overline{LX}_{(\\lambda,0)}=\\overline{LG_1}_\\lambda\\times L^+G_2$ have colimit\n$Z=LG_1\\times L^+G_2$: a proper reduced closed ind-subscheme *(constructed, unsourced —\nCartan and (2.2), plus closedness of $L^+G_2\\subset LG_2$)*. This is the one place a finding\ntests the representability half of (1) with $\\Sigma$ infinite and $C$ proper. It does not\nreach clause (2).\n\n**What the statement says here.** Every $K$-stable specialization-closed set of double cosets\nis closed and is the colimit of the finite unions of the Schubert-type closures it contains.\n\n**Source.** Mirković–Vilonen, *Geometric Langlands duality and representations of algebraic\ngroups over commutative rings*, 2007 — p. 4, (2.1)–(2.2); p. 9, Rem. 3.3. `refs.bib`:\n`mirkovic2007geometric`.\n\n### 2. $X=\\mathbb{G}_m$ under the square action — instance of (A) $\\Rightarrow$ (1) with proper $C$, outside the standing class\n\n**What it is.** $k$ of characteristic $0$, $G=\\mathbb{G}_m$ acting by $t\\cdot x=t^2x$, the toy\nwitness of [Q1-L3-a4](../Q1-L3-a4/index.html)(3). Squaring is onto\n$\\mathcal{O}^\\times=k^\\times\\times(1+t\\mathcal{O})$, so the $K$-orbits are still\n$LX_n=t^n\\mathcal{O}^\\times$, $n\\in\\mathbb{Z}$, and $LX^{\\mathrm{sat}}=(F^\\times)^2\\mathcal{O}^\\times$\nis the even-valuation locus.\n\n**Why it is an instance of the mechanism and not of the node.** $X$ is smooth affine\nspherical, but the generic stabilizer $\\mu_2$ is disconnected, so it fails the standing class\nof [context](../../../../context.html); the node's Setup is therefore not in force. What *is* in\nforce is the geometry: in the ind-presentation $L\\mathbb{G}_m=\\varinjlim_i\\{-i\\le\\mathrm{val}\\le i\\}$\neach stage is a finite disjoint union of the strata, each of which is open and closed in it,\nso every orbit is its own closure and **(A)** holds with intervals of size one.\n\n**What it matches.** The closedness half of **(1)** in the one configuration the parent cares\nabout — $C=LX^{\\mathrm{sat}}$ *proper*: intersecting the even-valuation locus with stage $i$\ngives a finite union of clopen strata, hence closed, so the saturation is closed, by the\nmechanism\n(A) supplies *(constructed, unsourced; the valuation computation is\n[Q1-L3-a4](../Q1-L3-a4/index.html)(3)'s)*. Its **published general form is Chen–Yi\n§11**: the even-valuation locus is the union of components $\\pi(LG)$, and closedness there\ncomes from $\\pi_0$ rather than from (A) — which is the warning this entry carries, that a\nproper saturation found so far is always a union of components and never tests (A). It does\nnot reach clause (2), and it discharges no hypothesis of the standing setting.\n\n**What the statement says here.** $LX^{\\mathrm{sat}}=\\bigsqcup_{m}t^{2m}\\mathcal{O}^\\times$ is\nclosed and is $\\varinjlim$ of its finite sub-unions of components — a proper reduced closed\nind-subscheme, so clause (iv) of [Q1-L3](../index.html) would give\n$Z\\subsetneq(LX)_{\\mathrm{red}}$ and the Satake subcategory would omit the odd orbits.\n\n**Source.** The variety is the repository's, at\n[Q1-L3-a4](../Q1-L3-a4/index.html)(3); the general form is Chen–Yi, arXiv:2310.20006v4,\n**§11** with §11(2) (p. 53). `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`.\n\n### 3. Symmetric $X=G/K$, $K$ connected — instance\n\n**What it is.** Any symmetric member of the standing class — $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$,\n$(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$ — with $\\Lambda_X^+=\\Lambda_S^+$.\n\n**Why it is an instance.** The orbits and reduced closures are those of\n[Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html); (a) of\n[the three standing hypotheses](../../../../appendix/assum-intro.html) is Prop. 39(ii); **(A)** is Cor. 27 as\ndeduced above, and independently Thm. 18 plus the finiteness of dominance intervals.\n\n**What it matches.** Clause **(2)** entirely, and the $\\Sigma=\\Lambda_X^+$ case of **(1)**.\nWhat it does not reach: any proper $C$ — and Prop. 17(ii) says the one $C$ the node is\nbuilt for, $LX^{\\mathrm{sat}}$, is not proper here.\n\n**What the statement says here.** (A) holds, so every $K$-stable specialization-closed union\nof orbits is closed and representable; applied to $LX^{\\mathrm{sat}}=|LX|$ this returns\n$Z=(LX)_{\\mathrm{red}}$.\n\n**Source.** Chen–Yi, *Singularities of orbit closures in loop spaces of symmetric varieties*,\narXiv:2310.20006v4 — Cor. 27 (p. 17), Thm. 18 with Prop. 17 (p. 10), Lemma 38 and Prop. 39\n(pp. 22–23). `refs.bib`: `chenyi_2025singularitiesorbitclosuresloop`.\n\n### 4. Iwasawa–Tate, $X=\\mathbb{A}^1$ under $\\mathbb{G}_m$ — boundary case: hypothesis (A) fails inside the standing class\n\n**What it is.** $K=\\mathcal{O}^\\times$ on $LX(k)=k((t))$, with $\\Lambda_X^+=\\mathbb{Z}\\sqcup\\{\\ast\\}$,\n$LX_n=\\{\\mathrm{val}=n\\}$ and $LX_\\ast=\\{0\\}$.\n\n**Why the hypothesis fails.** $X$ is in the standing class — smooth affine, open orbit\n$\\mathbb{A}^1\\smallsetminus\\{0\\}$ with trivial stabilizer, and (c) verified by hand in\n`BZSV` Ex. 7.6.1 — and $LX=\\varinjlim_n t^{-n}\\mathcal{O}$ is the orbit-closure presentation,\nwhich is `BZSV` Ex. 7.3.5 (p. 158) with $X^l_n(R)=t^{-l}R[t]/t^n$. But\n$\\overline{LX}_n=t^n\\mathcal{O}$ contains $LX_m$ for every $m\\ge n$ and the origin:\n**infinitely many** orbits, so **(A)** is false *(constructed, unsourced, and routine:\n$t^n\\mathcal{O}$ is cut out of a stage by the vanishing of finitely many coefficients, and\n$s\\mapsto t^n(s+t^j)$ degenerates $LX_n$ onto $t^{n+j}$)*. The same stratification is recorded at\n[Q1-L4-e1](../../Q1-L4/Q1-L4-e1/index.html)(1); p. 159 of the source carries the resulting\nchain, whose $l\\to-\\infty$ colimit is the Dirac object $\\delta_0$. The mechanism is generic to\nnon-homogeneous $X$: for Godement–Jacquet $X=M_n$, `BZSV` Ex. 7.3.7 (p. 159) puts every Hecke\ntranslate on the closed $M_{n,\\mathcal{O}}$, which is $\\overline{LX}_0$ and carries the infinitely\nmany Smith-normal-form orbits.\n\n**What it matches.** Hypothesis **(A)**, negatively, and it shows (A) is strictly stronger\nthan [the three standing hypotheses](../../../../appendix/assum-intro.html)(a). It does *not* contradict the node,\nwhich is conditional on (A) — and it shows (A) is not necessary for **(1)**: here the poset is\na chain, so the only specialization-closed sets are $\\{0\\}$, the $t^n\\mathcal{O}$ and $|LX|$,\nall closed, and $LX^{\\mathrm{sat}}=F^\\times\\mathcal{O}=|LX|$ *(constructed, unsourced)*.\n\n**What the statement says here.** Nothing: the hypothesis is unsatisfiable, so this node\ncannot supply clause (iv) of [Q1-L3](../index.html) for the non-homogeneous key examples.\n\n**Source.** `BZSV`, Ben-Zvi–Sakellaridis–Venkatesh, arXiv:2409.04677 — Ex. 7.3.5 (p. 158) and\nthe chain on p. 159 for the placid presentation of $X_F$, Ex. 7.3.7 (p. 159) for $M_n$,\nEx. 7.6.1 (p. 168) for hypothesis (c). `refs.bib`: `BZSV`.\n\n### 5. Semi-infinite orbits on $\\mathrm{Gr}$ — analogue, and infinite intervals in print\n\n**This is an analogue, not an instance.** The acting group is the ind-group $N_{\\mathcal{K}}$ and\nnot $K=L^+G$, so no clause of the node has an instance here. The dictionary is the identity on the\nspace $\\mathrm{Gr}$ and replaces $L^+G$-orbits by $N_{\\mathcal{K}}$-orbits; it drops the one\nhypothesis that the finiteness in **(A)** comes from, namely that the acting group is a jet group.\n\n**What it matches.** Hypothesis **(A)**, by exhibiting a published orbit stratification of the same\nind-scheme with **infinite** intervals: `mirkovic2007geometric` **Prop. 3.1(a)** (p. 7),\n$\\overline{S_\\nu}=\\bigcup_{\\eta\\le\\nu}S_\\eta$ with $\\eta$ ranging over all of $X_*(T)$ — infinite\nas soon as $G$ has a coroot — the same page noting that these orbits are \"neither of finite\ndimension nor of finite codimension\". It reaches neither half of **(1)** and not clause **(2)**.\n\n**What the statement says here.** That **(A)** is a property of the $L^+G$-action and not of the\nind-scheme: the node's hypothesis does work that the ambient does not do by itself, and the\ngroup-case instance above is not evidence that closure intervals are finite for *any* reasonable\ngroup acting on $LX$.\n\n**Source.** Mirković–Vilonen, 2007 — Prop. 3.1(a), p. 7. `refs.bib`: `mirkovic2007geometric`.\n\nEVIDENCE: instances\n";</script>
