bounds only the *bounded* kernels, and [Q1-L3-L2](../Q1-L3-L2/index.html)(4) shows the generating family contains unbounded ones — $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support. This node is the missing reduction: if it holds, [Q1-L3-L3](../Q1-L3-L3/index.html) applies to the smaller generating family and [Q1-L3](../index.html)(i) is restored unchanged. What makes it plausible and not free: in $\\mathcal{D}(K\\backslash\\mathrm{Gr})$ one has $\\mathcal{F}\\simeq\\varinjlim_n\\iota_{n*}\\iota_n^!\\mathcal{F}$ from the presentation of [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html), each $\\iota_{n*}\\iota_n^!\\mathcal{F}$ is bounded by [Q1-L3-L2](../Q1-L3-L2/index.html)(2), and $-\\ast\\mathrm{IC}_0$ preserves colimits — but the colimit that is needed is one in $\\mathcal{D}^{\\mathrm{ren}} = \\mathrm{Ind}(\\mathcal{D}_c)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), and a colimit in $\\mathcal{D}$ is not a colimit in $\\mathrm{Ind}(\\mathcal{D}_c)$ for free. That gap is the whole content of the node.\n- **2026-08-06 — no existing node already carries the claim.** [Q1-L3-L2](../Q1-L3-L2/index.html) is now explicit that it does not: its clause (4) states that clause (1) fails to reach the whole generating family, and [u1](../Q1-L3-L2/updates/u1.html) lists this equality under *Unverified, and therefore NOT asserted*. [Q1-L3-L3](../Q1-L3-L3/index.html) takes the generating family as given and says nothing about which family it is.\n- **2026-08-06 — which reading makes this node hard.** Added by the same `/update Q1-L3-L2` run, after clause (4) of [Q1-L3-L2](../Q1-L3-L2/index.html) was restated as the open tension recorded at [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html) rather than as a settled counterexample. Under the colimit reading of $\\mathcal{D}_c$ this node is immediate — every kernel is already bounded, so the two generating families are the same set. Under the pointwise reading of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) the families genuinely differ and the node carries the whole reduction. It is worth proving either way: a proof valid under both readings is what makes [Q1-L3](../index.html)(i) independent of a question nobody has settled.\n";</script>
