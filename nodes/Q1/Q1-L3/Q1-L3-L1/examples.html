<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L1</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L1 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L3-L1\n\n[node](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L3-L1](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\n**The pieces a finding can match.** **(1)** $m_\\mu$ is ind-proper; **(2a)** $Z_\\mu$ is closed in $|LX|$; **(2b)** $Z_\\mu$ is $K$-stable; **(3a)** each $Z_F$ is closed and $K$-stable; **(3b)** $\\{Z_F\\}$ is directed; **(3c)** $\\bigcup_F Z_F = LX^{\\mathrm{sat}}$.\n\n## Precedent\n\n**What was searched.** Local library first. `mirkovic2007geometric` pp. 4, 7–8 (§3, semi-infinite orbits) and pp. 13–14 (§4, the convolution product); `chenyi_2025singularitiesorbitclosuresloop` v4 pp. 9–10, 36–44 (§8.1, the affine Hecke action on $LX$) and pp. 50–53 (§10.2, its spherical form); the reading-list records for `NP01` §9 and `BZSV` §7.5.3. On the web: Zhu's *Introduction to affine Grassmannians* — no numbered properness statement was verified on the page, so nothing is cited from it.\n\n**What was found.**\n\n**Chen–Yi, §8.1.1 (p. 37), Prop. 70 and its proof (pp. 38–40).** They define the affine Hecke action on $D(I_0\\backslash LX)$ as $\\mathcal{M}\\star\\mathcal{F}:=a_!(\\ldots)$ along\n\n$$\nLG/I_0\\times LX\\ \\xleftarrow{\\ p\\times\\mathrm{id}\\ }\\ LG\\times LX\\ \\xrightarrow{\\ q\\ }\\ LG\\times^{I_0}LX\\ \\xrightarrow{\\ a\\ }\\ LX,\n$$\n\nand §10.2 (p. 52) declares the spherical action \"defined similarly as in Section 8.1.1 (replacing $I_0$ by $L^+G$)\", naming $L^+X = LX_0$ the closed $L^+G$-orbit. In the proof of Prop. 70 the action map is restricted to $\\overline{LG}_w\\times^{I_0}\\overline{\\mathcal{O}}_v\\to\\overline{\\mathcal{O}}_{v'}$, and pp. 39–40 read: \"since $a$ proper it follows from [Gro65, Theorem 8.10.5] that each $a^{[n]}_j$ is proper\".\n\n*Match.* Clause **(1)** in a recognisable reformulation, and clause **(2a)** in a form that is *stronger* where it applies — the image lands in a single orbit closure $\\overline{\\mathcal{O}}_{v'}$, closed by construction. The correspondence is Chen–Yi's own: $I_0\\rightsquigarrow K=L^+G$ by §10.2, $\\overline{LG}_w\\rightsquigarrow\\overline{LG}_\\mu$, $\\overline{\\mathcal{O}}_v\\rightsquigarrow\\overline{LX}_0=L^+X$.\n\n*Not reached.* Their $X=G/K$ is **symmetric and homogeneous**, so $L^+X$ is one orbit closure; for a non-homogeneous smooth affine spherical $X$ — Iwasawa–Tate is instance 2 below — $L^+X$ is a closed placid subscheme meeting infinitely many [orbits](../../../../appendix/def-orbits-iwahori-spherical.html), and nothing there covers that. Properness of $a$ is *asserted inside a proof*, never proved. The setting is $\\ell$-adic in char $p$ (§1.2.6 transfers the proofs to $\\mathcal{D}$-modules over $\\mathbb{C}$, not over a general char-$0$ $k$). Clauses **(2b)** and all of **(3)** are untouched.\n\n**Mirković–Vilonen, Lemma 4.4 with definition (4.4) (p. 14).** \"The multiplication map $G_{\\mathcal{K}}\\times_{G_{\\mathcal{O}}}\\mathrm{Gr}\\xrightarrow{m}\\mathrm{Gr}$ is a stratified semi-small map\", and clause (a) of their definition (4.4) of that term is \"for any $T\\in\\mathcal{T}$ the map $f|\\overline{T}$ is proper\", with $\\mathcal{T}$ the strata $\\widetilde{\\mathrm{Gr}}^{\\lambda,\\mu}=p^{-1}(\\mathrm{Gr}^\\lambda)\\times_{G_{\\mathcal{O}}}\\mathrm{Gr}^\\mu$. *Match:* clause **(1)** for the group case, with an arbitrary Schubert closure in the second slot rather than $L^+X$; the second stratum $\\mathrm{Gr}^0$ is the node's map, after dividing by the right $L^+G$-torsor. Numbered, and in that one case stronger than the node needs. *Not reached:* $\\mathrm{Gr}$ and not $LX$; the properness half is not proved (the proof of 4.4 verifies only the dimension estimate); nothing on **(2b)** or **(3)**.\n\n**Ngô–Polo, §9 (p. 22)** — recorded in [papers](../../../../papers/guideline.html) from the `/examples Q2-L6` run of 2026-08-06 and *not* re-read here: the affine Demazure convolution $m_{\\mu_\\bullet}\\colon\\bar{\\mathcal{Q}}_{\\mu_\\bullet}\\to\\bar{\\mathcal{Q}}_{|\\mu_\\bullet|}$ is \"un morphisme propre\". Same clause **(1)** for $\\mathrm{Gr}$, this time written out as an assertion of the text rather than folded into a definition.\n\n**What was not found.** No source states clause (1) with $L^+X$ — as against an orbit closure — in the second slot, and **no source proves it at all**: the two natural homes, MV07 §4 and Chen–Yi §8.1, both assert properness of the convolution map and pass on. That is exactly the parenthesis [Q1-L3](../index.html) was carrying before this node was cut out, so the node is repairing a gap the literature also has, not one peculiar to the manuscript. Clause **(3)** — finite subsets, directedness, the identification with $LX^{\\mathrm{sat}}$ — is in no source read: the literature never forms the union, so it never needs the bookkeeping.\n\n## Instances\n\n### 1. The point — instance\n\n**What it is.** $X=\\mathrm{pt}$, $G$ any connected reductive; $LX=L^+X=\\mathrm{pt}$ and $K\\backslash LX=BK$. Register entry K2.\n\n**Why it is an instance.** Smooth and affine; spherical, since $B$ has an open (the only) orbit, whose $B$-stabilizer is $B$, connected. Placidity ([loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html)) is trivial, and [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) is the one the appendix defines.\n\n**What it matches.** All of (1), (2), (3), degenerately: $m_\\mu$ *is* the structure map $\\overline{\\mathrm{Gr}}_\\mu\\to\\mathrm{pt}$, so clause (1) is precisely properness of $\\overline{\\mathrm{Gr}}_\\mu$ and nothing else. It does not reach the geometry of $LX$: with one point, (2a) and (3) carry no information, and the case cannot see whether $L^+X$ being closed in $LX$ matters.\n\n**What the statement says here.** $\\overline{\\mathrm{Gr}}_\\mu\\to\\mathrm{pt}$ is proper, and $Z_\\mu=Z_F=LX^{\\mathrm{sat}}=\\mathrm{pt}$.\n\n**Source.** [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(3) for ind-properness of $\\mathrm{Gr}$, with that entry's own note that properness of an individual closure is a deduction the citing node makes; `BZSV` §7.6.3, p. 169 for K2. The specialisation itself is (constructed, unsourced). `refs.bib`: `BZSV`.\n\n### 2. Iwasawa–Tate: $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ — instance\n\n**What it is.** Register entry K1, the simplest non-homogeneous member of the standing class. $L^+X=k[[t]]$, $LX=\\varinjlim_n t^{-n}k[[t]]$, $K=L^+\\mathbb{G}_m$.\n\n**Why it is an instance.** Smooth affine with open orbit $\\mathbb{G}_m$ and trivial — hence connected — stabilizer, so it lies in the class of [context](../../../../context.html); the hypotheses of the statement are the standing ones and nothing more.\n\n**What it matches.** Every clause, literally. $\\Lambda^+=\\mathbb{Z}$, $\\mathrm{Gr}\\cong\\mathbb{Z}$ is discrete and reduced, $\\overline{\\mathrm{Gr}}_\\mu$ is one point, $\\overline{LG}_\\mu=t^\\mu L^+\\mathbb{G}_m$, and $m_\\mu$ is $x\\mapsto t^\\mu x$: an isomorphism onto the closed subscheme $t^\\mu L^+X\\subset LX$, hence a closed embedding and ind-proper. Because $\\overline{\\mathrm{Gr}}_\\mu$ is a *point*, clause (1) carries no properness content here and the entire weight falls on $L^+X$ being **closed** in $LX$ — the second input to the node, invisible in instance 1, and the one that uses affineness of $X$.\n\n**A caution this instance supplies.** $\\{Z_\\mu\\}_{\\mu\\in\\Lambda^+}$ *is* directed here — $Z_\\mu\\subseteq Z_\\nu$ exactly when $\\nu\\le\\mu$ — even though $\\{\\overline{\\mathrm{Gr}}_\\mu\\}$ is not, $\\mathrm{Gr}_{\\mathbb{G}_m}$ having $\\pi_1(\\mathbb{G}_m)=\\mathbb{Z}$ components. This contradicts nothing in the statement, which asserts directedness only of $\\{Z_F\\}$; but the argument recorded in this node's [history](history.html) — non-directedness of the $\\overline{\\mathrm{Gr}}_\\mu$ across components of $\\mathrm{Gr}$ — does **not** transfer to $\\{Z_\\mu\\}$, and a prover who imports it will be proving something false about this $X$.\n\n**What the statement says here.** $Z_\\mu=t^\\mu k[[t]]$, closed and $L^+\\mathbb{G}_m$-stable; $Z_F=t^{\\min F}k[[t]]$; the directed family $\\{Z_F\\}$ is the standard ind-presentation of $L\\mathbb{A}^1$, and $LX^{\\mathrm{sat}}=k((t))=|LX|$.\n\n**Source.** `BZSV`, Ex. 7.6.1, p. 168 for K1; the loop-space stratification is [Q1-L4-e1](../../Q1-L4/Q1-L4-e1/index.html). The computation above is (constructed, unsourced). `refs.bib`: `BZSV`.\n\n### 3. The group case: $X=H$ under $G=H\\times H$ — instance\n\n**What it is.** Register entry K9. $LX=LH$, $L^+X=L^+H$, $K=L^+H\\times L^+H$, $\\mathrm{Gr}=\\mathrm{Gr}_H\\times\\mathrm{Gr}_H$, and $(g_1,g_2)\\cdot x=g_1xg_2^{-1}$.\n\n**Why it is an instance.** $H$ is smooth affine, and spherical for $H\\times H$ with open orbit everything and connected stabilizer the diagonal Borel; the loop space is placid by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html).\n\n**What it matches.** (2a), (2b) and (3c). For $\\mu=(\\mu_1,0)$ the image is $Z_\\mu=\\overline{LH}_{\\mu_1}\\cdot L^+H=\\overline{LH}_{\\mu_1}$, the preimage of the closed $\\overline{\\mathrm{Gr}}_{\\mu_1}$, so it is closed and left $K$-stable; and $\\bigcup_\\mu Z_\\mu\\supseteq\\bigcup_{\\mu_1}\\overline{LH}_{\\mu_1}=LH$ by the Cartan decomposition. It does not reach (1) beyond what MV07 Lemma 4.4 already gives, and K9's warning that the group case cannot discriminate for [Q1](../../../../dag.html) does not apply here — that warning is about $\\mathrm{IC}_0$ being the monoidal unit, and this node is pure geometry.\n\n**What the statement says here.** $LX^{\\mathrm{sat}}=|LX|$: Hecke saturation holds, and the family $\\{Z_F\\}$ exhausts $LH$.\n\n**Source.** `mirkovic2007geometric`, p. 4: the $G_{\\mathcal{O}}$-orbits on $\\mathrm{Gr}$ parametrised by $\\Lambda^+$, with (2.1) and (2.2) (read 2026-08-06). `refs.bib`: `mirkovic2007geometric`.\n\n### 4. Semi-infinite orbits — **analogue**, and a boundary case\n\n**What it is.** *Not an instance of the node.* $G$ semisimple, $N\\subset B$ the unipotent radical, $N_{\\mathcal{K}}$ the loop **ind-group** of $N$, and $S_\\nu=N_{\\mathcal{K}}\\cdot L_\\nu\\subseteq\\mathrm{Gr}$.\n\n**The dictionary, and the one line of it that breaks.** Target $LX\\rightsquigarrow\\mathrm{Gr}$; second factor $L^+X\\rightsquigarrow$ the single point $L_\\nu$; acting family $\\overline{LG}_\\mu\\rightsquigarrow N_{\\mathcal{K}}$. Every line but the last is the group-case reading of instance 3. The last line is the hypothesis: $\\overline{LG}_\\mu$ is the preimage of a **proper** $\\overline{\\mathrm{Gr}}_\\mu$, whereas $N_{\\mathcal{K}}$ has no such bound.\n\n**What it matches.** Clause **(2a)**, negatively. MV07 record on p. 7 that these orbits are \"neither of finite dimension nor of finite codimension\", and Prop. 3.1(a) gives $\\overline{S_\\nu}=\\bigcup_{\\eta\\le\\nu}S_\\eta$, the proof showing $S_{\\nu-\\check\\alpha}\\subseteq\\overline{S_\\nu}$ for every positive coroot $\\check\\alpha$. So for non-abelian $G$ the image of this action map is **not closed**. It reaches nothing about **(1)**: the action map of an ind-group is not ind-proper either, so this is not a case where (1) holds and (2) fails, and it is not a counterexample to anything the node says.\n\n**What the statement says here.** Nothing — the node has no instance with $N_{\\mathcal{K}}$ in place of $\\overline{LG}_\\mu$. What the case shows is that clause (1) is what earns clause (2), and that restricting to one $\\mu$ rather than to all of $LG$ is load-bearing rather than cosmetic — the same moral as the counterexample recorded in [Q1-L3 u1](../updates/u1.html).\n\n**Source.** `mirkovic2007geometric`, §3, p. 7 (the definition of $S_\\nu$ and Prop. 3.1(a)) with the proof on pp. 7–8 (read 2026-08-06). `refs.bib`: `mirkovic2007geometric`.\n\nEVIDENCE: instances\n";</script>
