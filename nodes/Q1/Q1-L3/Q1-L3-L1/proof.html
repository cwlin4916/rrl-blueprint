<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L1 — The convolution maps are ind-proper, with closed $K$-stable images\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html), [the standing notation](../../../../appendix/subsec-notations.html), [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html), [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html), [placidity](../../../../appendix/placid-ind-scheme.html), [Campbell–Dhillon: the counit is fully faithful](../../../../appendix/thm-cd-counit.html). No `depends-on` nodes — this is a leaf.\n- **notation:** $\\pi\\colon LG\\rightarrow\\mathrm{Gr}$ is the quotient map, $S_\\mu := \\overline{LG}_\\mu\\times^{K}L^+X$, $\\iota\\colon L^+X\\rightarrow LX$ the inclusion, and $|Y|$ the set of geometric points of an ind-scheme $Y$ with its Zariski topology, so $A\\subseteq|Y|$ is closed exactly when $A\\cap|Y_i|$ is closed for every stage $Y_i$ of an ind-presentation.\n\n## Lemma\n\n**Setup.** In the standing setting of [context](../../../../context.html), write $\\Lambda^+ := X_*(T)^+$ for the dominant cocharacters and, for $\\mu\\in\\Lambda^+$, let $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$ be the Schubert closure of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html) and $\\overline{LG}_\\mu\\subset LG$ its preimage under $LG\\rightarrow\\mathrm{Gr}$. Let\n\n$$\nm_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X\\longrightarrow LX, \\qquad (g,x)\\longmapsto g\\cdot x,\n$$\n\nbe the convolution map of [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html), and put $Z_\\mu := \\left|m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\\right|\\subseteq|LX|$. Then:\n\n**(1) Ind-properness.** For every $\\mu\\in\\Lambda^+$ the map $m_\\mu$ is ind-proper.\n\n**(2) Closed $K$-stable image.** For every $\\mu\\in\\Lambda^+$ the subset $Z_\\mu$ is closed in $|LX|$ and stable under the action of $K$.\n\n**(3) A directed family exhausting the saturation.** For a finite subset $F\\subseteq\\Lambda^+$ put $Z_F := \\bigcup_{\\mu\\in F}Z_\\mu$. Each $Z_F$ is a closed $K$-stable subset of $|LX|$; the family $\\{Z_F\\}$, indexed by the finite subsets of $\\Lambda^+$ ordered by inclusion, is directed; and\n\n$$\n\\bigcup_{F\\subseteq\\Lambda^+\\ \\text{finite}} Z_F \\;=\\; LX^{\\mathrm{sat}},\n$$\n\nthe subset defined in the Setup of [Q1-L3](../index.html).\n\n## Proof\n\n**Step 1 — $\\iota\\colon L^+X\\rightarrow LX$ is a closed embedding.**\n\n<details><summary>the argument</summary>\n\n$X$ is smooth affine of finite type, so choose a closed embedding $X\\subseteq\\mathbb{A}^n$. By [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) the pieces $LX^i = LX\\cap t^{-i}L^+\\mathbb{A}^n$ give an ind-presentation $LX\\simeq\\varinjlim_i LX^i$ by placid schemes along closed embeddings, each stage closed in $LX$. An $R((t))$-point of $X$ with coordinates in $R[[t]]$ is an $R[[t]]$-point of $X$, the equations of $X\\subseteq\\mathbb{A}^n$ already vanishing in $R[[t]]$ because $R[[t]]\\rightarrow R((t))$ is injective; hence $L^+X = LX\\cap L^+\\mathbb{A}^n = LX^0$, a closed stage.\n\n</details>\n\n**Step 2 — $K$ is an affine scheme.**\n\n<details><summary>the argument</summary>\n\nBy [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) applied to the smooth affine finite-type $G$, the jets $L^mG$ are affine of finite type and $K = L^+G\\simeq\\varprojlim_m L^mG$ is a placid scheme; by [placidity](../../../../appendix/placid-ind-scheme.html) the transition maps of a placid presentation are affine. A cofiltered limit of affine schemes along affine transitions is affine, so $K$ is affine and in particular quasi-compact.\n\n</details>\n\n**Step 3 — $\\overline{\\mathrm{Gr}}_\\mu$ is a proper $k$-scheme.**\n\n<details><summary>the argument</summary>\n\nBy [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(3) the ind-scheme $\\mathrm{Gr}$ is ind-proper, so it admits a presentation $\\mathrm{Gr}\\simeq\\varinjlim_j P_j$ by proper schemes along closed embeddings. The orbit map\n\n$$\na_\\mu\\colon K\\longrightarrow\\mathrm{Gr},\\qquad g\\longmapsto g\\cdot L_\\mu,\n$$\n\nhas quasi-compact source by Step 2, and a morphism from a quasi-compact scheme into a filtered colimit along closed embeddings factors through a stage; fix $j$ with $a_\\mu$ factoring through $P_j$. By [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(1) the orbit $\\mathrm{Gr}^\\mu = K\\cdot L_\\mu$ is the image of $a_\\mu$, so $|\\mathrm{Gr}^\\mu|\\subseteq|P_j|$; as $P_j$ is closed in $\\mathrm{Gr}$, the reduced closure $\\overline{\\mathrm{Gr}}_\\mu$ of clause (2) of that entry is a closed subscheme of $P_j$, hence proper.\n\n</details>\n\n**Step 4 — $S_\\mu$ is the bundle over $\\overline{\\mathrm{Gr}}_\\mu$ associated with $L^+X$, and the torsor trivializes it.**\n\n<details><summary>the argument</summary>\n\n$\\mathrm{Gr} = LG/L^+G$ ([Campbell–Dhillon: the counit is fully faithful](../../../../appendix/thm-cd-counit.html), hypotheses), so $\\pi$ is an fpqc $K$-torsor for right multiplication and its restriction $\\overline{LG}_\\mu = \\pi^{-1}(\\overline{\\mathrm{Gr}}_\\mu)\\rightarrow\\overline{\\mathrm{Gr}}_\\mu$ is one too; since $K$ is affine (Step 2), that torsor is an affine morphism, so $\\overline{LG}_\\mu$ is a scheme. The source of the convolution map of [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) is the fpqc quotient\n\n$$\nS_\\mu \\;=\\; \\left(\\overline{LG}_\\mu\\times L^+X\\right)/K,\\qquad k\\cdot(g,x) = \\left(gk^{-1},\\,k\\cdot x\\right),\n$$\n\nthe associated bundle; pulling back along the torsor trivializes it, by\n\n$$\n\\overline{LG}_\\mu\\times L^+X\\ \\xrightarrow{\\ \\sim\\ }\\ S_\\mu\\times_{\\overline{\\mathrm{Gr}}_\\mu}\\overline{LG}_\\mu,\\qquad (g,x)\\longmapsto\\left([g,x],\\,g\\right).\n$$\n\n</details>\n\n**Step 5 — the graph of $m_\\mu$ is a closed embedding.**\n\n<details><summary>the argument</summary>\n\nSet\n\n$$\n\\tilde m_\\mu\\colon S_\\mu\\longrightarrow\\overline{\\mathrm{Gr}}_\\mu\\times LX,\\qquad [g,x]\\longmapsto\\left(\\pi(g),\\,g\\cdot x\\right),\n$$\n\nwell defined because $\\pi(gk^{-1}) = \\pi(g)$ and $(gk^{-1})\\cdot(k\\cdot x) = g\\cdot x$. By Step 4 its base change along the fpqc cover $\\overline{LG}_\\mu\\times LX\\rightarrow\\overline{\\mathrm{Gr}}_\\mu\\times LX$ is $(g,x)\\mapsto(g,g\\cdot x)$ on $\\overline{LG}_\\mu\\times L^+X$, which is $\\mathrm{id}\\times\\iota$ — a closed embedding by Step 1 — followed by the automorphism $(g,y)\\mapsto(g,g\\cdot y)$ of $\\overline{LG}_\\mu\\times LX$, a morphism with inverse $(g,y)\\mapsto(g,g^{-1}\\cdot y)$ because the action $LG\\times LX\\rightarrow LX$ is one. Closed immersions are affine and affine morphisms are fpqc-local on the base, applied over each stage $\\overline{\\mathrm{Gr}}_\\mu\\times LX^i$; hence $\\tilde m_\\mu$ is a closed embedding, and $S_\\mu$ is a closed sub-ind-scheme of $\\overline{\\mathrm{Gr}}_\\mu\\times LX$.\n\n</details>\n\n**Step 6 — clause (1).**\n\n<details><summary>the argument</summary>\n\nLet $T\\rightarrow LX$ be any scheme. Base-changing the closed embedding $\\tilde m_\\mu$ of Step 5 along $\\overline{\\mathrm{Gr}}_\\mu\\times T\\rightarrow\\overline{\\mathrm{Gr}}_\\mu\\times LX$ exhibits $S_\\mu\\times_{LX}T$ as a closed subscheme of the scheme $\\overline{\\mathrm{Gr}}_\\mu\\times T$, which is proper over $T$ by Step 3 and base change. As $m_\\mu$ is $\\tilde m_\\mu$ followed by the projection to $LX$, the base change $S_\\mu\\times_{LX}T\\rightarrow T$ is the restriction of $\\overline{\\mathrm{Gr}}_\\mu\\times T\\rightarrow T$, hence proper. So $m_\\mu$ is schematic with proper base change along every scheme, which is ind-properness; in particular $m_\\mu^{-1}(LX^i)\\rightarrow LX^i$ is a proper morphism of schemes for every stage of Step 1.\n\n</details>\n\n**Step 7 — $Z_\\mu$ is closed in $|LX|$.**\n\n<details><summary>the argument</summary>\n\nWrite $f_i\\colon m_\\mu^{-1}(LX^i)\\rightarrow LX^i$, proper by Step 6, so its image is a closed subset $C_i\\subseteq LX^i$. Every geometric point of $C_i$ lifts: the fibre of $f_i$ over it is a nonempty proper $k$-scheme, hence has a $k$-point, $k$ being algebraically closed. So the geometric-point image of $f_i$ is $|C_i|$, closed in $|LX^i|$. Since $LX^i\\rightarrow LX$ is a monomorphism, $m_\\mu^{-1}(LX^i) = S_\\mu\\times_{LX}LX^i$ has geometric-point image exactly $Z_\\mu\\cap|LX^i|$. Thus $Z_\\mu\\cap|LX^i|$ is closed for every $i$, i.e. $Z_\\mu$ is closed in $|LX|$.\n\n</details>\n\n**Step 8 — $Z_\\mu$ is $K$-stable.**\n\n<details><summary>the argument</summary>\n\nFor $h\\in K(k)$ left translation by $h$ is an automorphism of $\\mathrm{Gr}$ carrying the $K$-orbit $\\mathrm{Gr}^\\mu$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(1) to itself, hence a homeomorphism preserving $|\\overline{\\mathrm{Gr}}_\\mu|$; as $\\pi(hg) = h\\cdot\\pi(g)$, the geometric points of $\\overline{LG}_\\mu$ are stable under left translation by $K(k)$. Therefore, for $g\\in\\overline{LG}_\\mu(k)$ and $x\\in L^+X(k)$,\n\n$$\nh\\cdot m_\\mu\\left([g,x]\\right) \\;=\\; (hg)\\cdot x \\;=\\; m_\\mu\\left([hg,x]\\right)\\ \\in\\ Z_\\mu .\n$$\n\n</details>\n\n**Step 9 — each $Z_F$ is closed and $K$-stable.**\n\n<details><summary>the argument</summary>\n\n$Z_F$ is a finite union of the $Z_\\mu$, $\\mu\\in F$, each closed by Step 7 and $K$-stable by Step 8. A finite union of closed subsets of $|LX|$ is closed, and any union of $K$-stable subsets is $K$-stable; for $F = \\emptyset$ the set $Z_\\emptyset = \\emptyset$ is both.\n\n</details>\n\n**Step 10 — the family $\\{Z_F\\}$ is directed.**\n\n<details><summary>the argument</summary>\n\nThe finite subsets of $\\Lambda^+$ ordered by inclusion form a directed poset, since $F,F'\\subseteq F\\cup F'$ with $F\\cup F'$ finite; and $F\\mapsto Z_F$ is monotone with $Z_F\\cup Z_{F'} = Z_{F\\cup F'}$. So any two members of $\\{Z_F\\}$ are contained in a third.\n\n</details>\n\n**Step 11 — the union is $LX^{\\mathrm{sat}}$.**\n\n<details><summary>the argument</summary>\n\nEach $Z_F$ is a union of sets $Z_\\mu$ with $\\mu\\in\\Lambda^+$, and each $Z_\\mu = Z_{\\{\\mu\\}}$ occurs as a member of the family. Hence\n\n$$\n\\bigcup_{F\\subseteq\\Lambda^+\\ \\text{finite}}Z_F \\;=\\; \\bigcup_{\\mu\\in\\Lambda^+}Z_\\mu \\;=\\; LX^{\\mathrm{sat}},\n$$\n\nthe second equality being the definition of $LX^{\\mathrm{sat}}$ in the Setup of [Q1-L3](../index.html). $\\square$\n\n</details>\n\n## Caveats\n\n*The reading of \"ind-proper\".* No appendix entry defines properness for a morphism of ind-schemes. Step 6 proves the strongest standard reading — schematic, with proper base change along every scheme — which implies stage-wise properness on every ind-presentation of $LX$, so any weaker reading follows.\n\n*Properness of $\\overline{\\mathrm{Gr}}_\\mu$ is a deduction.* [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html) states ind-properness of $\\mathrm{Gr}$ and not of the individual Schubert closures, and its own note assigns that deduction to the citing node; Step 3 makes it. That entry's ground-field caveat is carried: its clauses (1)–(3) are used over the standing algebraically closed $k$ of characteristic $0$ on the manuscript's authority, not on the source's page.\n\n*Nothing is claimed about $\\{Z_\\mu\\}$.* Step 10 uses nothing about the Schubert order, so no non-directedness of $\\{\\overline{\\mathrm{Gr}}_\\mu\\}$ across the components of $\\mathrm{Gr}$ is transported to the images $Z_\\mu$, in either direction.\n";</script>
