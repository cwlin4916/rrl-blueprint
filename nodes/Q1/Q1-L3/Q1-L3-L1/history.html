<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L1 — history\n\n[Q1-L3-L1](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose Q1-L3`: the geometry underneath the whole of [Q1-L3](../index.html), cut out so that the parent's one-page write-up may quote it. The parent's Setup asserts ind-properness of $m_\\mu$ in a parenthesis — \"since $\\mathrm{Gr}$ is\" — and that is a claim about the twisted product, not about $\\mathrm{Gr}$: what has to be shown is that the graph $(g,x)\\mapsto([g],g\\cdot x)$ lands in $\\overline{\\mathrm{Gr}}_\\mu\\times LX$ as a closed sub-ind-scheme, after which properness of $\\overline{\\mathrm{Gr}}_\\mu$ does the rest. Clause (2) is what the ind-properness is *for* — a closed image — and is the only closedness [Q1-L3](../index.html) claims after the correction recorded in its [u1](../updates/u1.html).\n- **2026-08-06 — why the family is indexed by finite subsets.** Clause (3) does not assert that $\\{Z_\\mu\\}_{\\mu\\in\\Lambda^+}$ is directed, and it is not: $\\overline{\\mathrm{Gr}}_\\mu$ is irreducible, so it meets one connected component of $\\mathrm{Gr}$, and for $\\mu,\\nu$ in different components of the Schubert order there is no $\\rho$ with $\\overline{\\mathrm{Gr}}_\\mu\\cup\\overline{\\mathrm{Gr}}_\\nu\\subseteq\\overline{\\mathrm{Gr}}_\\rho$ — the components of $\\mathrm{Gr}$ are indexed by $\\pi_1(G)$. Passing to finite unions restores directedness without changing the union, which is what [Q1-L3-L3](../Q1-L3-L3/index.html) consumes.\n- **2026-08-06 — examined and unchanged** by `/update Q1-L3-L2`. This node was re-read as the sibling the corrected statement now rests on, and nothing in it needed revising: it never claimed a single $Z_\\mu$ suffices, and clause (3) — the finite unions $Z_F$, closed, $K$-stable and directed — is precisely the family the correction moves [Q1-L3-L2](../Q1-L3-L2/index.html) onto ([u1](../Q1-L3-L2/updates/u1.html)). The repair cost nothing here because the right family was already stated here.\n- **2026-08-07 — `proved` at [r1](critiques/r1.html), first round, six MINOR flaws standing.** The write-up (1280 words, eleven steps) factors $m_\\mu$ as a graph followed by a projection and shows the graph is a closed embedding by fpqc descent along the torsor $\\overline{LG}_\\mu\\rightarrow\\overline{\\mathrm{Gr}}_\\mu$, where it becomes $(g,x)\\mapsto(g,g\\cdot x)$ — the closed embedding $L^+X\\hookrightarrow LX$ twisted by an automorphism. That is the step [Q1-L3](../index.html)'s history recorded as missing from its own parenthesis, and affineness of $X$ enters there. The referee could not construct a failure of any clause, and confirmed all three recorded caveats: the ind-properness reading proved at Step 6 dominates the weaker ones, the $\\overline{\\mathrm{Gr}}_\\mu$-properness deduction at Step 3 is valid and carries its ground-field caveat, and clause (3)'s directedness is about $\\{Z_F\\}$ over finite subsets with nothing slipping into $\\{Z_\\mu\\}$.\n- **2026-08-07 — a circularity the referee downgraded, and the entry that would remove it.** Step 4 takes its descent infrastructure from a parenthetical in [Campbell–Dhillon: the counit is fully faithful](../../../../appendix/thm-cd-counit.html)'s **hypotheses** line, which asserts only the identification $\\mathrm{Gr}=LG/L^+G$ — no topology and no local triviality — while Step 5 needs $\\pi$ to be an fpqc *covering*, and the draft reaches quasi-compactness through affineness of the torsor, itself proved by descent along that same torsor. As written that is circular. The referee scored it MINOR on the ground that étale-local triviality of $LG\\rightarrow\\mathrm{Gr}$ is standard, and named the durable fix: an appendix entry saying $LG\\rightarrow\\mathrm{Gr}$ is a locally trivial $L^+G$-torsor, which nothing in `blueprint/appendix/` supplies. Recorded here because a circularity excused by a fact the closed world does not carry is exactly what an entry is for.\n\n";</script>
