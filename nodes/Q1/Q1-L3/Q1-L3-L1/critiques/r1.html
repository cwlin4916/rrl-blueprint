<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L1</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L3-L1, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L1/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nStatement diff, hallucination sweep (six appendix links, no bib keys, no `\\label`s) and object declaration: clean. I checked the mathematics of all eleven steps; the argument is, I believe, correct, and I could not construct a failure of any clause. What follows is six defects of citation and of compression, none of which I can promote to MAJOR without pretending that a textbook fact is unavailable.\n\n**Verified as asked.** Step 2 is right: [placidity](../../../../../appendix/placid-ind-scheme.html) does give affine (indeed smooth affine) transitions, and $\\varprojlim_m L^mG$ of affines is affine, hence quasi-compact. The hypotheses of [Campbell–Dhillon: the counit is fully faithful](../../../../../appendix/thm-cd-counit.html) are in force here — $\\mathrm{Gr}$ ind-proper by [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(3), and the prounipotent radical $\\ker(L^+G\\to G)$ of $K$ of finite codimension — so the entry's parenthetical is available in principle (but see Flaw 2). Step 1's $L^+X = LX\\cap L^+\\mathbb{A}^n$, Step 3's factorization through a stage, Step 7's lifting of geometric points out of a nonempty proper fibre, and Steps 8–11 all check out. Caveat 3 is honest: Step 10 uses only that finite subsets of $\\Lambda^+$ are directed under $\\cup$ and that $F\\mapsto Z_F$ is a join map, and nothing anywhere needs $\\{\\overline{\\mathrm{Gr}}_\\mu\\}$ or $\\{Z_\\mu\\}$ to be directed.\n\n**Flaw 1** [MINOR] [G] — The descent statement invoked delivers only that $\\tilde m_\\mu$ is **affine**; \"hence ...\n\n<details><summary>(Step 5, \"Closed immersions are affine and affine morphisms are fpqc-local on the base ... hence $\\tilde m_\\mu$ is a closed embedding\") · the finding</summary>\n\nclosed embedding\" does not follow from it. The fact wanted is that *being a closed immersion* is itself fpqc-local on the base (equivalently: surjectivity of $\\mathcal{O}\\to f_*\\mathcal{O}$ descends along a faithfully flat quasi-compact map). That is standard and true, so the conclusion stands, but the reason printed is not the reason. One clause fixes it.\n\n</details>\n\n**Flaw 2** [MINOR] [M] — Two things, and the second is the sharper.\n\n<details><summary>(Step 4, \"$\\mathrm{Gr} = LG/L^+G$ ([Campbell–Dhillon: the counit is fully faithful](../../../../../appendix/thm-cd-counit.html), hypotheses), so $\\pi$ is an fpqc $K$-torsor ... since $K$ is affine (Step 2), that torsor is an affine morphism\") · the finding</summary>\n\n(i) The entry's parenthetical asserts an identification of sheaves; it names no topology, and says nothing about local triviality. (ii) The whole of Step 5 needs $\\pi$ to be an fpqc **covering**, i.e. faithfully flat *and quasi-compact*; the draft gets quasi-compactness from affineness of $\\pi$, and affineness of a torsor is itself proved by descent along that same torsor. As written the argument is circular. Note also that the usual \"an fppf torsor under an affine group is affine\" does not apply verbatim, since $K = L^+G$ is not locally of finite presentation. The clean route is the standard one — $LG\\to\\mathrm{Gr}$ admits sections étale- (for most $G$, Zariski-) locally, hence is affine and faithfully flat — declared as standard mathematics, or, better, given an appendix entry \"$LG\\to\\mathrm{Gr}$ is a locally trivial $L^+G$-torsor\", which no entry currently supplies.\n\n</details>\n\n**Flaw 3** [MINOR] [N] — The Caveats disclaim only the missing definition of ind-properness *for a morphism*; the reading of ind-properness *for an ind-scheme* is coined here just as silently, and Step 3 turns on it — [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(3) says its own stages $\\mathrm{Gr}_n$ are finite-dimensional, not proper.\n\n<details><summary>(Step 3, \"the ind-scheme $\\mathrm{Gr}$ is ind-proper, so it admits a presentation $\\mathrm{Gr}\\simeq\\varinjlim_j P_j$ by proper schemes along closed embeddings\") · the finding</summary>\n\nAll standard readings agree here, so nothing breaks; say which one is taken.\n\n</details>\n\n**Flaw 4** [MINOR] [G] (Step 5 → Step 6, \"Let $T\\rightarrow LX$ be any scheme\") — Step 5 descends stage-wise, \"over each stage $\\overline{\\mathrm{Gr}}_\\mu\\times LX^i$\"; Step 6 base-changes along an arbitrary $T$, which factors through a stage only when $T$ is quasi-compact.\nThe bridge — cover $T$ by quasi-compact opens and use that being a closed immersion is Zariski-local on the target — is one sentence and is not written.\n**Flaw 5** [MINOR] [N] — Clause (2)'s meaning rests on this reading, which no appendix entry fixes, and the indefinite article hides an independence-of-presentation claim that consumers will lean on: [Q1-L3](../../index.html) and [Q1-L3-L2](../../Q1-L3-L2/index.html) meet $Z_F$ against the orbit-closure presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html), not against $\\{LX^i\\}$.\n\n<details><summary>(`notation:` line, \"$A\\subseteq|Y|$ is closed exactly when $A\\cap|Y_i|$ is closed for every stage $Y_i$ of an ind-presentation\") · the finding</summary>\n\nStages here are quasi-compact, so the two presentations are mutually cofinal and the topology agrees — say so.\n\n</details>\n\n**Flaw 6** [MINOR] [M] (Step 4, \"The source of the convolution map of [the spherical Hecke action $\\ast$] is the fpqc quotient $S_\\mu = (\\overline{LG}_\\mu\\times L^+X)/K$\") — That entry's convolution morphism $q$ has source $K\\backslash LG\\times^{K}\\mathrm{Gr}$, and with $\\mathrm{Gr}$ replaced by $LX$ — never $\\overline{LG}_\\mu\\times^{K}L^+X$, and the entry does not unpack $\\times^K$ at all.\nUnpacking it as the balanced fpqc quotient is right and is what the node's own Setup intends; it is the draft's reading, not the entry's words, and should be marked as such.\nVERDICT: PASS\n";</script>
