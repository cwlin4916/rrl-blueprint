<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-c1</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-c1 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-c1/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L3-c1](../index.html) · [history](../history.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html)\n\n**Date:** 2026-08-07 · **Operator:** `/update Q2-L7`, on the user's finding · **Status before:** `drafted` · **Status after:** `open` · **Id before:** `Q2-L7` · **Id after:** `Q1-L3-c1`\n\n## The defect, in one sentence\n\nThe node sat under [Q2](../../../../../dag.html) as though it contributed to that question, when what it actually states is a necessary condition for [Q1](../../../../../dag.html)'s equality obtained by contraposition — it *follows from* the argument rather than feeding it, and no id class existed to say so.\n\n## Why this is a real defect and not a presentational one\n\nPlacement is load-bearing in this repository, in three separate mechanisms. A question's tally and its confidence aggregate over its own proof chain, so a node in the wrong question distorts the readout of a question it does not belong to. **Reach** — the transitive `required-by` closure — sizes a card, and a node nothing requires, sitting among nodes that require each other, reads as a lemma nobody has got to yet rather than as a corollary nobody needs to. And the [Q2](../../../../../dag.html) Problem statement declared this node the carrier of its **necessary** strength, which is a claim about what would count as an answer to [Q2](../../../../../dag.html); a $K_0$ obstruction to [Q1](../../../../../dag.html)'s equality is not that.\n\nThe record already said so and nothing read it. `required-by:` was empty from creation, so no node of [Q2](../../../../../dag.html) ever used this one; the creation entry states that the claim \"can never be a step in the categorical argument\"; and clause (i) concludes, in its own words, that \"the answer to [Q1](../../../../../dag.html) for this $X$ is no\". Three signals, all present since 2026-08-05, and the id said `Q2-L7` throughout.\n\n## What changed in the statement\n\n**The two cross-question dependencies are gone.** `depends-on: Q2-L3, Q2-L8` became `—`. [ADR 0039](../../../../../process/decisions/0039-one-graph-for-every-question.html) forbids a node of one question depending on a node of another, so migration forced the question of whether the statement could stand without them. It can, and the restatement is what establishes that rather than assuming it.\n\n**Clause (i) is now stated against its host.** It concluded \"no family of triangular objects as in [Q2-L3](../../../../Q2/Q2-L3/index.html)(D) exists\", a conclusion in [Q2](../../../../../dag.html)'s vocabulary. It now concludes the inequality $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\neq\\mathcal{D}_c(K\\backslash LX)$ directly, and names what it is: the decategorification of [Q1-L3](../../index.html)(iii), which contraposes the same equality into a statement about supports where this contraposes it into a statement about classes.\n\n**Clause (ii) names $m_\\mu$ where it named $\\pi_\\lambda$.** The Hecke word's predictive content was expressed through the candidate resolutions $\\pi_\\lambda$ of [Q2-L5](../../../../Q2/Q2-L5/index.html). It is now expressed through the convolution maps $m_\\mu$ of [Q1-L3](../../index.html)'s own Setup, and the prediction is sharper for it: the coweights the word names are exactly those for which $m_\\mu$ must cover $LX_\\lambda$ if the set-theoretic saturation of [Q1-L3](../../index.html)(iii) is to hold.\n\n**The cyclicity supposition is now a labelled hypothesis (C).** It was an unlabelled \"Suppose\" between the setup and the clauses, which made it easy to read the three conclusions as unconditional. It is unchanged in content.\n\n**What it settles for [Q2](../../../../../dag.html) is reported, not relied on.** The refutation of [Q2-L3](../../../../Q2/Q2-L3/index.html)(D) that clause (i) also delivers is kept, in a closing paragraph that links [Q2](../../../../../dag.html) and depends on nothing there.\n\n**Clause (iii) is unchanged.** It already spoke in [Q1](../../../../../dag.html)'s terms, referring to conditions (1) and (2) of [Q1-L5](../../../Q1-L5/index.html).\n\n## What this leaves open elsewhere\n\n[Q2-L8](../../../../Q2/Q2-L8/index.html) — \"the classes of the standard objects span $K_0$\", `proved`, with two sub-lemmas — was required by this node and by nothing else. It is now a terminal proved branch of [Q2](../../../../../dag.html) with no dependant. It could not follow this node across, because its own sub-lemma [Q2-L8-L2](../../../../Q2/Q2-L8/Q2-L8-L2/index.html) depends on [Q2-L2](../../../../Q2/Q2-L2/index.html), which stays; carrying it over would have replaced two forbidden cross-question edges with another one.\n\n[Q2](../../../../../dag.html)'s Problem statement listed three declared strengths and this node was the **necessary** one. That paragraph now declares two, and the gap is real rather than clerical: [Q2](../../../../../dag.html) has no node stating a necessary condition for its own membership question. Commissioning one is the failure this run records.\n";</script>
