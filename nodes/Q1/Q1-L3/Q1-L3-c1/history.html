<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-c1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-c1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-c1 — history\n\n[Q1-L3-c1](index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it. The node was created as `Q2-L7` and carries its entries from before the migration of 2026-08-07 unchanged.\n\n## History\n\n- **2026-08-05 — created** as `Q2-L7` by `/decompose` of [Q2](../../../../dag.html), from the user's input passage (§6 of it), with **role `evidence`**: the claim is about the Grothendieck group and so can never be a step in the categorical argument, but clause (i) can refute the question for a given $X$ before anyone builds a single correspondence, and clause (ii) tells a computation where to look. Role `evidence` is exactly the case [ADR 0015](../../../../process/decisions/0015-every-node-declares-its-role.html) describes — a precise provable claim that supports the expected answer without being a step of it — so it is on the DAG and out of the proof chain.\n- **2026-08-05 — the supposition is stated as a hypothesis, deliberately.** That $K_0$ of the Satake subcategory is the Hecke submodule generated by $[\\mathrm{IC}_0]$ is not free: the subcategory is *cocomplete*, generated in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), and $K_0$ of a cocompletely generated subcategory is not in general the subgroup generated by the classes of the generators. Making it a hypothesis keeps the node honest about what a $K_0$ computation would and would not establish; a prover who wants it unconditional needs the compact-generation statement of [Q1-L2](../../Q1-L2/index.html) applied to $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ itself.\n- **2026-08-05 — the first computation to run.** Chen–Yi construct the affine Hecke module for symmetric loop spaces with its standard and Kazhdan–Lusztig bases and explicit simple-reflection actions, which is the natural tool for (ii); it is formulated at Iwahori level and must be related to the spherical basic-vector problem before it answers this node.\n- **2026-08-05 — examined and unchanged** by `/update` (full walk): examined and unchanged: the $K_0$ cyclicity test, the decategorified shadow of [Q1-a1](../../Q1-a1/index.html) and the cheapest obstruction in the tree.\n- **2026-08-06 — examined and unchanged against a revised neighbour.** [Q2-L3](../../../Q2/Q2-L3/index.html) was revised that run ([u2](../../../Q2/Q2-L3/updates/u2.html)) and its four hypothesis labels **(A)**–**(D)** were unchanged, so every reference by letter still resolved. What moved was inside them: $\\operatorname{supp}$ and \"the objects supported on $\\partial\\overline{LX}_\\lambda$\" were replaced by $\\mathcal{D}^{\\mathrm{ren}}_T$, defined as the objects killed by $i_\\mu^!$ for every $\\mu\\notin T$. The node named [Q2-L3](../../../Q2/Q2-L3/index.html)(A), (B) and (D) — clause (i) contraposed (D), Step 4 cited (A), the closing paragraph cited (B) — and all three references still resolved to the hypotheses they meant.\n- **2026-08-07 — migrated to [Q1](../../../../dag.html) as a consequence, and renamed `Q2-L7` → `Q1-L3-c1`** ([u1](updates/u1.html)), on the user's finding that the node does not contribute to [Q2](../../../../dag.html) but *follows from* it. The record agreed: `required-by:` was already empty, so nothing in [Q2](../../../../dag.html)'s argument used it, and its own creation entry says the claim \"can never be a step in the categorical argument\". Its real content is a necessary condition for [Q1](../../../../dag.html)'s equality obtained by contraposition — which is what [Q1-L3](../index.html)(iii) does geometrically — so it now hangs off [Q1-L3](../index.html) as the same contrapositive decategorified. **Role `consequence`** and the `-c<k>` id class are both new with [ADR 0073](../../../../process/decisions/0073-a-consequence-is-a-node-class.html): `evidence` had no addressable id, so a node that follows from the argument was indistinguishable in its label from a lemma feeding it. Status reset `drafted` → `open`, because the statement was revised in the same run; [proof.md](proof.html) predates the revision and its Step 4 `GAP` is superseded by it.\n- **2026-08-07 — what the migration cost, and what it left behind.** Two `depends-on` edges were dropped, [Q2-L3](../../../Q2/Q2-L3/index.html) and [Q2-L8](../../../Q2/Q2-L8/index.html), because [ADR 0039](../../../../process/decisions/0039-one-graph-for-every-question.html) forbids a node of one question depending on a node of another; the statement was restated so that neither is needed, clause (ii) now naming the convolution maps $m_\\mu$ of [Q1-L3](../index.html)'s own Setup where it used to name $\\pi_\\lambda$ of [Q2-L5](../../../Q2/Q2-L5/index.html). The cost is recorded where it fell: [Q2-L8](../../../Q2/Q2-L8/index.html) was proved solely to feed this node and is now a terminal branch of [Q2](../../../../dag.html) with no dependant, and [Q2](../../../../dag.html)'s Problem statement no longer has a node carrying its **necessary** strength.\n";</script>
