<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-c1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-c1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-c1 — The decategorified cyclicity test in $K_0$\n\n[node](index.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html) · [DAG index](../../../../dag.html)\n\n- **uses:** [the Satake subcategories](../../../../appendix/def-satake-subcategory.html), [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html), [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html), [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html), [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), [Chen–Yi symmetric orbits](../../../../appendix/bb-chenyi-symmetric-orbits.html); no `depends-on`.\n- **notation:** $\\mathrm{cl}(\\mathcal{S})\\subseteq K_0(\\mathcal{T})$ is the set of classes of objects of a full stable $\\mathcal{S}\\subseteq\\mathcal{T}$.\n\n## Lemma\n\nLet $K_0 := K_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)$ and $\\mathcal{H} := K_0\\left(\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right)$, the latter acting on the former through [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html). Write $m_{\\lambda,a} := \\left[\\Delta_{\\lambda,a}\\right]\\in K_0$ for the classes of the standard objects of [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html), when these are compact. Suppose\n\n$$\nK_0\\left(\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\right) = \\mathcal{H}\\cdot\\left[\\mathrm{IC}_0\\right]\\ \\subseteq\\ K_0 .\n$$\n\nThen:\n\n**(i) A decategorified obstruction.** If $\\mathcal{H}\\cdot[\\mathrm{IC}_0]\\subsetneq K_0$, then $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\neq\\mathcal{D}_c(K\\backslash LX)$: the answer to [Q1](../../../../dag.html) for this $X$ is no, and no family of triangular objects as in [Q2-L3](../../../Q2/Q2-L3/index.html)(D) exists.\n\n**(ii) Unitriangularity is the decategorified form of (D).** If for every $\\lambda,a$ there is $h_{\\lambda,a}\\in\\mathcal{H}$ with\n\n$$\nh_{\\lambda,a}\\cdot\\left[\\mathrm{IC}_0\\right]\\ =\\ u_{\\lambda,a}\\,m_{\\lambda,a}\\ +\\ \\sum_{\\mu<\\lambda,\\ b\\in A_\\mu}c_{\\mu,b}\\,m_{\\mu,b}, \\qquad u_{\\lambda,a}\\in\\mathcal{H}^\\times,\n$$\n\nthen $\\mathcal{H}\\cdot[\\mathrm{IC}_0] = K_0$, and the Hecke word $h_{\\lambda,a}$ predicts the coweights $\\nu_1,\\dots,\\nu_r$ and the shift $n_{\\lambda,a}$ of a candidate $\\pi_\\lambda$ in [Q2-L5](../../../Q2/Q2-L5/index.html).\n\n**(iii) It is not sufficient.** The converse of (ii) fails: $K_0$ sees neither the extensions that distinguish condition (2) of [Q1-L5](../../Q1-L5/index.html) from condition (1), nor the monodromy of a rank-one local system on a stratum, nor a cancellation between two classes of opposite sign. Cyclicity in $K_0$ is therefore a test that can refute and cannot confirm.\n\n## Proof\n\n**Step 1 — The hedge makes $m_{\\lambda,a}$ an element of $K_0$.**\n\n<details><summary>the argument</summary>\n\n$K_0$ is that of the *small* category of coherent objects ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)), whereas [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) builds $\\Delta_{\\lambda,a}$ in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, asserting neither coherence nor compactness. So $m_{\\lambda,a}$ is defined exactly when $\\Delta_{\\lambda,a}\\in\\mathcal{D}_c(K\\backslash LX)$: every step naming it assumes this.\n\n</details>\n\n**Step 2 — The supposition is an equality of subgroups of $K_0$.**\n\n<details><summary>the argument</summary>\n\n[the Satake subcategories](../../../../appendix/def-satake-subcategory.html) presents $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ as the intersection of $\\mathcal{D}_c(K\\backslash LX)$ with a cocomplete stable subcategory, hence closed under shifts and cones, so the inclusion induces $K_0(\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}})\\rightarrow K_0$. The display says its image is the submodule $\\mathcal{H}\\cdot[\\mathrm{IC}_0]$, defined because $\\mathrm{IC}_0\\in\\mathcal{D}_c(K\\backslash LX)$ ([$\\mathrm{IC}_0$](../../../../appendix/ic-0.html)).\n\n</details>\n\n**Step 3 — Clause (i), first half.**\n\n<details><summary>the argument</summary>\n\nContrapositive: if $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)}\\mathcal{D}_c(K\\backslash LX)$, Step 2's map is the identity of $K_0$ and the supposition reads $\\mathcal{H}\\cdot[\\mathrm{IC}_0] = K_0$. That equality is what [Q1](../../../../dag.html) asks, so its failure is a negative answer for this $X$.\n\n</details>\n\n**Step 4 — GAP: the second half of clause (i).**\n\n<details><summary>the argument</summary>\n\n\"No family as in [Q2-L3](../../../Q2/Q2-L3/index.html)(D) exists\" contraposes \"(D) $\\Rightarrow$ [Q1](../../../../dag.html)'s equality\", what Q2-L3 concludes from (D) with its (A)–(C) and (H1). **GAP:** Q2-L3 is not in `depends-on` and no appendix entry supplies that conclusion; listing it in `depends-on` discharges it.\n\n</details>\n\n**Step 5 — For symmetric $X$ the closure order on $\\Lambda_X^+$ is well-founded.**\n\n<details><summary>the argument</summary>\n\nFor $X = G/G^\\theta$ with $G^\\theta$ connected, [Chen–Yi symmetric orbits](../../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant $\\Lambda_S^+$ and the order with $\\lambda\\le\\mu\\Leftrightarrow\\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+$. Take a Weyl-invariant positive-definite form on $\\Lambda_S\\otimes_{\\mathbb{Z}}\\mathbb{R}$: dominance gives $(\\check\\alpha,\\lambda+\\mu)\\ge0$, the form making $(\\check\\alpha,-)$ a positive multiple of $\\langle\\alpha,-\\rangle$, so $(\\mu,\\mu)-(\\lambda,\\lambda) = (\\mu-\\lambda,\\mu+\\lambda)\\ge0$ and each down-set is a bounded subset of the lattice $\\Lambda_S$, hence finite: $\\le$ is well-founded.\n\n</details>\n\n**Step 6 — Clause (ii): under the displayed system every $m_{\\lambda,a}$ lies in the submodule $\\mathcal{H}\\cdot[\\mathrm{IC}_0]$.**\n\n<details><summary>the argument</summary>\n\nInduct along Step 5's order; the displayed sum is finite, being an equation in $K_0$, and solving it with the unit $u_{\\lambda,a}$ gives\n\n$$\nm_{\\lambda,a} = u_{\\lambda,a}^{-1}\\left(h_{\\lambda,a}\\cdot[\\mathrm{IC}_0] - \\sum_{\\mu<\\lambda,\\ b\\in A_\\mu}c_{\\mu,b}\\,m_{\\mu,b}\\right),\n$$\n\nwhose right side lies in the submodule by induction. Non-symmetric $X$ must assume well-foundedness — hypothesis (A) of [Q2-L3](../../../Q2/Q2-L3/index.html).\n\n</details>\n\n**Step 7 — GAP: from the standard classes to all of $K_0$.**\n\n<details><summary>the argument</summary>\n\nStep 6 gives only $\\mathcal{H}\\cdot[\\mathrm{IC}_0]\\supseteq\\sum_{\\lambda,a}\\mathbb{Z}\\,m_{\\lambda,a}$. **GAP:** the generation in [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html) is by arbitrary colimits, which do not descend to $K_0$; a node asserting $K_0 = \\sum_{\\lambda,a}\\mathbb{Z}\\,m_{\\lambda,a}$ discharges it.\n\n</details>\n\n**Step 8 — GAP: the prediction clause.**\n\n<details><summary>the argument</summary>\n\nSince $[\\mathcal{M}[n]] = (-1)^n[\\mathcal{M}]$, the system fixes $n_{\\lambda,a}$ at most modulo $2$; and $\\pi_\\lambda,\\nu_1,\\dots,\\nu_r$ are [Q2-L5](../../../Q2/Q2-L5/index.html)'s objects, not in `depends-on`. **GAP:** listing Q2-L5 would make the clause a dictionary.\n\n</details>\n\n**Step 9 — Clause (iii): a class lies in $\\mathrm{cl}(\\mathcal{S})$ with its object outside $\\mathcal{S}$.**\n\n<details><summary>the argument</summary>\n\nLet $R = k[t,t^{-1}]$, $\\mathcal{T} = \\mathrm{Perf}(R)$ and, for $c\\in k^\\times$,\n\n$$\nL_c := R/(t-c),\n$$\n\nthe rank-one local system of monodromy $c$: perfect by $0\\rightarrow R\\xrightarrow{t-c}R\\rightarrow L_c\\rightarrow0$, whence $[L_c] = [R]-[R] = 0$. Put\n\n$$\n\\mathcal{S} := \\mathcal{T}\\ \\cap\\ \\left\\langle L_1\\right\\rangle_{D(R)},\n$$\n\nwith $\\left\\langle L_1\\right\\rangle_{D(R)}$ the smallest cocomplete stable subcategory of $D(R)$ containing $L_1$ — the shape [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) gives $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$. The complexes with $(t-1)$-power-torsion cohomology form a cocomplete stable subcategory containing $L_1$, hence containing $\\left\\langle L_1\\right\\rangle_{D(R)}$; $t-1$ acts invertibly on $L_a$ for $a\\neq1$, so $L_a\\notin\\mathcal{S}$ while $[L_a] = 0 = [0]\\in\\mathrm{cl}(\\mathcal{S})$.\n\n</details>\n\n**Step 10 — Clause (iii).**\n\n<details><summary>the argument</summary>\n\nBy Steps 2 and 6, (ii)'s hypothesis puts $m_{\\lambda,a}$ in the image of $K_0(\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}})$, whereas [Q2-L3](../../../Q2/Q2-L3/index.html)(D) asks $\\Delta_{\\lambda,a}$ to *be*, up to a shift, an object of it. Step 9 is a pair of that shape — class inside, object outside — failing on monodromy. So no argument reading the class alone passes from one to the other: the test refutes by Step 3 and cannot confirm.\n\n</details>\n\n## Caveats\n\nStep 9 refutes the entailment, not the conjunction: no standing-class $X$ is claimed to have both.\n\nCancellation obstructs nothing alone: $-[B] = [B[1]]$ and $[A]+[B[1]] = [A\\oplus B[1]]$, so the image of $K_0(\\mathcal{S})$ is $\\mathrm{cl}(\\mathcal{S})$ for $\\mathcal{S}$ stable; opposite signs destroy only which object realises a class.\n\nThe extensions separating conditions (2) and (1) of [Q1-L5](../../Q1-L5/index.html) are an unproved illustration: they need those conditions and [Q2-L3](../../../Q2/Q2-L3/index.html)(B) in the closed world.\n";</script>
