<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-c1</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-c1 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q1-L3-c1 — self-contained prompt: The decategorified cyclicity test in $K_0$\n\n## ⚠ Flagged: the write-up proves the pre-u1 statement\n\nRun `/prove` again: the write-up proves the superseded statement. The record is **u1.md — what changed and why**, in the node's own directory, and says:\n\n> The node sat under [Q2](../../../../dag.html) as though it contributed to that question, when what it actually states is a necessary condition for [Q1](../../../../dag.html)'s equality obtained by contraposition — it *follows from* the argument rather than feeding it, and no id class existed to say so.\n\nThe statement below is the current one; the flag is standing, and nothing in this packet clears it.\n\n## Task\n\nResolve the target claim under exactly the stated hypotheses. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q1: When is $\\mathcal{D}_{c}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_{c}(K\\backslash LX)$?](../../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../key_examples/k4.html), the symplectic period [K6](../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../key_examples/k9.html); and [K6](../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This node records one research obligation. It refines [Q1-L3](../index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-07 — what the migration cost, and what it left behind.** Two `depends-on` edges were dropped, [Q2-L3](../../../Q2/Q2-L3/index.html) and [Q2-L8](../../../Q2/Q2-L8/index.html), because [ADR 0039](../../../../process/decisions/0039-one-graph-for-every-question.html) forbids a node of one question depending on a node of another; the statement was restated so that neither is needed, clause (ii) now naming the convolution maps $m_\\mu$ of [Q1-L3](../index.html)'s own Setup where it used to name $\\pi_\\lambda$ of [Q2-L5](../../../Q2/Q2-L5/index.html). The cost is recorded where it fell: [Q2-L8](../../../Q2/Q2-L8/index.html) was proved solely to feed this node and is now a terminal branch of [Q2](../../../../dag.html) with no dependant, and [Q2](../../../../dag.html)'s Problem statement no longer has a node carrying its **necessary** strength.\n\n## Target statement\n\n**Setup.** Let $K_0 := K_0\\left(\\mathcal{D}_c(K\\backslash LX)\\right)$ and $\\mathcal{H} := K_0\\left(\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right)$, the latter acting on the former through [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html). Write\n\n$$\nm_{\\lambda,a} := \\left[\\Delta_{\\lambda,a}\\right]\\ \\in\\ K_0\n$$\n\nfor the classes of the standard objects of [$\\{E_{\\lambda,a}\\}$, $\\Delta_{\\lambda,a}$](../../../../appendix/not-standard-objects.html), when these are compact. The standard objects are those the recollement hypothesis **(H1)** of [Q1-L5](../../Q1-L5/index.html) produces, and this node assumes that hypothesis wherever it names them.\n\n**(C) The cyclicity hypothesis.** Throughout,\n\n$$\nK_0\\left(\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\right)\\ =\\ \\mathcal{H}\\cdot\\left[\\mathrm{IC}_0\\right]\\ \\subseteq\\ K_0 .\n$$\n\nThis is not free, and it is stated as a hypothesis on purpose: the Satake subcategory of [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) is *cocomplete*, and $K_0$ of a cocompletely generated subcategory is not in general the subgroup generated by the classes of its generators. Making (C) explicit keeps the node honest about what a $K_0$ computation would and would not establish; discharging it needs the compact-generation statement of [Q1-L2](../../Q1-L2/index.html) applied to $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ itself.\n\nIt is also known to *fail* in the standing class, which is why every clause below carries it explicitly. At $X = \\mathrm{Sp}_2\\backslash\\mathrm{GL}_2$, [Q2-e4-L5](../../../Q2/Q2-e4/Q2-e4-L5/index.html)(3) exhibits a stratum whose standard object lies in the Satake subcategory while its class lies outside $\\mathcal{H}\\cdot[\\mathrm{IC}_0]$: the subcategory is closed under retracts and the cyclic module is not. Applying clause (i) to such an $X$ without first checking (C) reports a false negative, so **(C) is a precondition of the test and not a convenience of its proof.**\n\n**(i) A decategorified obstruction.** Assume (C). If $\\mathcal{H}\\cdot[\\mathrm{IC}_0]\\subsetneq K_0$, then\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\ \\neq\\ \\mathcal{D}_c(K\\backslash LX),\n$$\n\nso the answer to [Q1](../../../../dag.html) for this $X$ is no. This is the decategorification of [Q1-L3](../index.html)(iii): that clause contraposes the equality into a statement about the *supports* of the Hecke translates, and this one contraposes it into a statement about their *classes*, with neither clause using the other.\n\n**(ii) Unitriangularity is the decategorified form of Hecke reachability.** Assume (C), and suppose that for every $\\lambda,a$ there is $h_{\\lambda,a}\\in\\mathcal{H}$ with\n\n$$\nh_{\\lambda,a}\\cdot\\left[\\mathrm{IC}_0\\right]\\ =\\ u_{\\lambda,a}\\,m_{\\lambda,a}\\ +\\ \\sum_{\\mu<\\lambda,\\ b\\in A_\\mu}c_{\\mu,b}\\,m_{\\mu,b}, \\qquad u_{\\lambda,a}\\in\\mathcal{H}^\\times .\n$$\n\nThen $\\mathcal{H}\\cdot[\\mathrm{IC}_0] = K_0$. Moreover the Hecke word $h_{\\lambda,a}$ is computable data and not merely an existential: expanding it in the Schubert basis names dominant coweights $\\nu_1,\\dots,\\nu_r$, and those are exactly the $\\mu$ for which the convolution maps $m_\\mu$ of [Q1-L3](../index.html)'s Setup must cover $LX_\\lambda$ if the saturation $LX^{\\mathrm{sat}} = |LX|$ of [Q1-L3](../index.html)(iii) is to hold. A $K_0$ computation therefore predicts *where* to look for the geometry, before any correspondence is built.\n\n**(iii) It is not sufficient.** The converse of (ii) fails. $K_0$ sees neither the extensions that distinguish condition (2) of [Q1-L5](../../Q1-L5/index.html) from condition (1), nor the monodromy of a rank-one local system on a stratum, nor a cancellation between two classes of opposite sign. Cyclicity in $K_0$ is therefore a test that can **refute and cannot confirm**, which is what places this node outside the proof chain rather than inside it.\n\n**What it settles elsewhere.** Clause (i) also refutes, for the same $X$, the existence of the triangular families that [Q2](../../../../dag.html) asks for — the sufficient condition of [Q2-L3](../../../Q2/Q2-L3/index.html)(D), and with it the candidate resolutions of [Q2-L5](../../../Q2/Q2-L5/index.html). That is reported and not relied on: this node is a consequence of [Q1-L3](../index.html) and lists no [Q2](../../../../dag.html) node among its dependencies, so the two questions stay separately auditable.\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../appendix/conj-intro.html) holds for $X$.\n\n### [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) — `defn:coherent_D_mod`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../../appendix/conv-d-shriek-d-star.html)); ratified at [Q1-L1](../../Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../Q1-L3-L4/index.html) was refuted at [r1](../Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n### [Chen–Yi symmetric orbit parametrization and closure relation](../../../../appendix/bb-chenyi-symmetric-orbits.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 17(i) and Thm. 18](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$ whose fixed-point subgroup $G^\\theta$ is connected. Let $S$ be a maximal $\\theta$-split torus of $G$, and let $\\Lambda_S^+$ and $\\check\\Phi^+$ be the dominant coweights of $S$ and the positive coroots, both taken for the restricted root data of §3.1 of the source. Then:\n\n1. *(Prop. 17(i))* The $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$; that is, the index set $\\Lambda_X^+$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) is identified with $\\Lambda_S^+$.\n2. *(Thm. 18)* For every $\\mu\\in\\Lambda_S^+$,\n\n$$\n\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu} LX_\\lambda, \\qquad\\text{where}\\quad \\lambda\\le\\mu \\iff \\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+,\n$$\n\ni.e. $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative integral sum of positive coroots.\n\n- **hypotheses:** $X$ symmetric with $G^\\theta$ connected — **not** general spherical. The proofs run through $\\theta$-twisted $\\mathrm{SL}_2$-computations ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 20, Cor. 21](../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]), and no remark in the source extends them beyond the symmetric case — unlike the placidity theorem (Thm 36 with Rem 37) black-boxed as [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), which the source does extend to general spherical $X$.\n- **note:** *Provenance, verified on the page.* The PDF is on disk as `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025), and both statements were re-checked there on 2026-08-05 by the lead-researcher for `/update Q1-L5`. **Proposition 17(i)**, p. 10: the $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$ — for each $\\mu\\in\\Lambda_S^+$ there is $x_\\mu\\in LX(k) = X(F)$ with $\\tau(x_\\mu) = t^\\mu\\in S(F)$, and $LX_\\mu = L^+G\\cdot x_\\mu$ is the corresponding orbit. **Theorem 18**, p. 10: for every $\\mu\\in\\Lambda_S^+$, $\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$; the order is the one the source fixes on $\\Lambda_S$ just above Prop. 17 on the same page, by restriction from $\\Lambda_T$ — $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative sum of positive coroots. Both check out as transcribed above.\n\n  Same page, Remark 19: for $k = \\mathbb{C}$ the closure relation is the source's [Nad04, Thm. 10.1], proved there through real affine Grassmannians, whereas the source's own argument is algebraic and valid over any algebraically closed field of characteristic $\\ne 2$ — so it covers the blueprint's standing $k$ of characteristic $0$ ([the standing notation](../../../../appendix/subsec-notations.html)). Prop. 17(ii), the bijection $G(F)/K(F)\\cong X(F)$, is the part that needs $G^\\theta$ connected on the page; the reading record in [`papers/guideline.md`](../../../../papers/guideline.html) notes that in [Nad04] part (i) holds without that hypothesis.\n\n### [$\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$, $\\Delta_{\\lambda,a}$ — stratum generating collections and the standard objects](../../../../appendix/not-standard-objects.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Notation** (blueprint notation, coined in the [Q2](../../../../dag.html) framing block and recorded here so that no node coins it again; main.tex names no such objects, and the two ingredients it does supply are the generation operation [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) at main.tex:502 and the locally closed embeddings $i_\\lambda$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html) at main.tex:737). Let $X$ be a smooth affine spherical $G$-variety and $K = L^+G$. The two categories in play are the renormalized categories ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ of the whole loop space and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ of the spherical stratum $LX_\\lambda$ indexed by $\\lambda\\in\\Lambda_X^+$ ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)); both are written out in full wherever they occur, and no abbreviation for either is introduced here or licensed elsewhere.\n\nA **generating collection** for the stratum $\\lambda$ is a small collection $\\{E_{\\lambda,a}\\}_{a\\in A_\\lambda}$ of objects of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, indexed by a set $A_\\lambda$, which generates that category in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html):\n\n$$\n\\left\\langle E_{\\lambda,a}\\ \\middle|\\ a\\in A_\\lambda\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda) .\n$$\n\nLet $i_{\\lambda!}$ denote the left adjoint of the restriction functor $i_\\lambda^!\\colon\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ along the locally closed embedding $i_\\lambda\\colon LX_\\lambda\\rightarrow LX$ of [Iwahori and spherical orbits on $LX$](../../../../appendix/def-orbits-iwahori-spherical.html). Given a generating collection, the **standard objects** of the stratum $\\lambda$ are its images\n\n$$\n\\Delta_{\\lambda,a} := i_{\\lambda!}E_{\\lambda,a}\\ \\in\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX), \\qquad a\\in A_\\lambda .\n$$\n\nWhen a single object suffices — $\\#A_\\lambda = 1$ — the index $a$ is dropped and one writes $E_\\lambda$ and $\\Delta_\\lambda = i_{\\lambda!}E_\\lambda$.\n\n**Two worked examples.** The definitions above fix symbols and settle nothing, so a reader cannot tell from them whether $A_\\lambda$ is ever bigger than a point, or what an $E_{\\lambda,a}$ looks like when it is. The two cases below are written out for that reason alone. Each is an *illustration of the notation*, not a claim this entry makes: the mathematics in both is asserted and proved at the node named, and a proof that needs either fact cites that node and never this paragraph.\n\n*Example 1 — one generator per stratum: $X = G$ under $G\\times G$.* Take $K = L^+G\\times L^+G$, so that $K\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}$ is the ordinary spherical Hecke situation and $\\Lambda_X^+$ is the set $\\Lambda^+$ of dominant coweights ([$\\Lambda_X^+$](../../../../appendix/not-lambda-x-plus.html)), the stratum at $\\nu$ being the orbit $LX_\\nu = \\mathrm{Gr}_\\nu = L^+G\\cdot t^\\nu$. The stabilizer of $t^\\nu$ has connected finite-type reductive quotient — the centralizer $Z_G(\\nu)$, connected because a torus centralizer in a connected reductive group is — so the dualizing object generates the stratum on its own and the collection may be taken to be a single object:\n\n$$\n\\#A_\\nu = 1, \\qquad E_\\nu = \\omega_{K\\backslash LX_\\nu}, \\qquad \\Delta_\\nu = i_{\\nu!}\\,\\omega_{K\\backslash LX_\\nu} .\n$$\n\nThis is [Q2-e1-L1](../../../Q2/Q2-e1/Q2-e1-L1/index.html), resting on [Q2-L2](../../../Q2/Q2-L2/index.html)(i).\n\n*Example 2 — more than one, and the index set named: $X = \\mathrm{GL}_2/\\mathrm{O}_2$.* Here $LX = \\{A\\in\\mathrm{GL}_2(F) : A^t = A\\}$ with $K = \\mathrm{GL}_2(\\mathcal{O})$ acting by $g\\cdot A = gAg^t$ ([$F$, $\\mathcal{O}$](../../../../appendix/conv-ring-of-integers.html)), and the strata are indexed by pairs $\\lambda = (p,q)$ with $p\\ge q$. At a diagonal stratum $\\lambda = (p,p)$ the finite-type quotient of the stabilizer is $\\mathrm{O}_2$, whose component group is $\\mathbb{Z}/2$ with the two characters $\\mathrm{triv}$ and $\\mathrm{sgn} = \\det|_{\\mathrm{O}_2}$. One generator per character is then a generating collection, and two are needed:\n\n$$\nA_\\lambda = \\{\\mathrm{triv},\\ \\mathrm{sgn}\\}, \\qquad E_{\\lambda,\\mathrm{triv}} = \\omega_{K\\backslash LX_\\lambda}, \\qquad E_{\\lambda,\\mathrm{sgn}} = \\omega_{K\\backslash LX_\\lambda}\\otimes\\mathrm{sgn},\n$$\n\nwith $\\Delta_{\\lambda,\\mathrm{triv}} = i_{\\lambda!}E_{\\lambda,\\mathrm{triv}}$ and $\\Delta_{\\lambda,\\mathrm{sgn}} = i_{\\lambda!}E_{\\lambda,\\mathrm{sgn}}$ the two standard objects of that one stratum. The dualizing object alone does not generate: $\\mathrm{sgn}$ is right-orthogonal to it in every shift. This is [Q2-e3-L2](../../../Q2/Q2-e3/Q2-e3-L2/index.html)(B), resting on [Q2-L2](../../../Q2/Q2-L2/index.html)(ii)–(iii); the same node's clause (C) shows $\\#A_\\lambda = 4$ at every off-diagonal stratum, so the size of $A_\\lambda$ varies with $\\lambda$ within one $X$.\n\n- **note:** *The adjoint is named, not asserted.* This entry fixes the symbol $i_{\\lambda!}$ and nothing more: that $i_\\lambda^!$ is continuous and that $i_{\\lambda!}$ exists, is continuous and is fully faithful is hypothesis **(H1)** of [Q1-L5](../../Q1-L5/index.html), which the [Q2](../../../../dag.html) framing puts in force as a standing hypothesis. A node that needs the adjoint to exist cites that hypothesis, never this entry.\n- **note:** *The collection is a choice, and the entry does not discharge it.* Nothing here singles out a generating collection: $A_\\lambda$, the objects $E_{\\lambda,a}$ and hence the standard objects $\\Delta_{\\lambda,a}$ all depend on a choice made stratum by stratum. That the *subcategory* of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ generated by the standard objects is independent of that choice is a claim **about** the notation and no part of it — it is the closing paragraph of [Q2-L1](../../../Q2/Q2-L1/index.html), to be proved there and cited from there. Likewise, whether one object suffices at a given $\\lambda$, and which object may be taken, is the content of [Q2-L2](../../../Q2/Q2-L2/index.html) and is not settled here.\n- **note:** *What this entry does not say.* It does not assert that any $\\Delta_{\\lambda,a}$ lies in the Satake subcategory $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ of [the Satake subcategories](../../../../appendix/def-satake-subcategory.html), nor that any $\\Delta_{\\lambda,a}$ is coherent ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) or compact ([compact objects](../../../../appendix/def-compact-objects.html)). The first of those is exactly the question [Q2](../../../../dag.html) asks; the others are hypotheses a node states for itself.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../appendix/ic-0.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n- **note:** the pointing condition of [unramified relative local Langlands](../../../../appendix/conj-relative-langlands-unramified.html) is exactly the requirement that $\\mathrm{IC}_0\\mapsto\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n  **Ratified reading.** The displayed membership is a genuine finiteness statement — it says the $!$-extension is coherent — and no node in the blueprint derives it. It is imported from main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action, which presupposes it; the same presupposition is what lets [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) accept $\\mathrm{IC}_0$ in the second slot of its module action. Before 2026-08-05 it was carried only by the grammar of those two entries, and round 1 of [Q1-L2-L3](../../Q1-L2/Q1-L2-L3/critiques/r1.html) asked for it to be stated; it is stated here so that a proof may cite it rather than infer it from a typing argument. Anyone who later wants it *proved* wants a node about coherence of $!$-extensions on $K\\backslash LX$, which is not in the closed world.\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) and [the Satake subcategories](../../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n- **note:** main.tex writes the convolution diagram only for the Hecke category itself (main.tex:1096–1102) and describes the action on $LX$ in words — \"which are given by the convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\", main.tex:922. This entry records the reading that the two are the same pull–push construction, which is how every node in the DAG uses $\\ast$.\n\n### [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../appendix/index.html) · [DAG index](../../../../dag.html) · [context](../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n- **note:** **Ratified reading.** main.tex names no ambient cocomplete category for the $\\langle-\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../appendix/def-generation.html), while $\\mathcal{D}_c$ itself is small and not cocomplete, so the definition as printed is incomplete. The blueprint fixes the reading\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\n  the generation being formed inside $\\mathcal{D}^{\\mathrm{ren}}$. This is forced by the essential-image assertion in the proof of [the small Satake comparison](../../../../appendix/thm-f-cstr-sat.html) (main.tex:1391–1392). Ratified in round 2 of [Q1-L1](../../Q1-L1/index.html); every downstream node presupposes it. See [ADR 0001](../../../../process/decisions/0001-satake-generation-ambient-category.html).\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n```\n\n## The key examples this statement is tested against\n\nThe register at [key_examples.md](../../../../key_examples/index.html) fixes the cases where the answer is known. A reading aid, outside the closed world: check the statement against it, never discharge a step with it.\n\n- **K1 — Iwasawa–Tate: $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$** *(`positive`)* — **The variety.** $\\mathbb{G}_m$ scaling the line, the simplest non-homogeneous member of the standing class — smooth affine, open orbit $\\mathbb{A}^1\\smallsetminus\\{0\\}$ with trivial stabilizer. The loop space is $LX(k) = k((t))$, stratified by valuation together with …\n- **K2 — The trivial period: $X = \\mathrm{pt}$** *(`positive`)* — **The variety.** The point, smooth affine spherical for any $G$, with $K\\backslash LX = BL^+G$. Degenerate in size and not in content — the basic object is the constant sheaf and its Hecke translates have …\n- **K3 — Gross–Prasad: $X = \\mathrm{SO}_N$ under $G = \\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$** *(`positive`)* — **The variety.** Homogeneous with reductive stabilizer, hence smooth affine, and spherical. Quotienting by the second factor identifies $K\\backslash LX \\simeq \\mathrm{SO}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$, the presentation Q1-L5-e3 works in.\n- **K4 — Rankin–Selberg: $X = \\mathrm{GL}_N$ under $G = \\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$** *(`positive`)* — **The variety.** The $\\mathrm{GL}$ analogue of K3, homogeneous with $K\\backslash LX \\simeq \\mathrm{GL}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{GL}_N}$. BZSV list it among the cases whose loop space is placid by strata of the affine Grassmannian (p. 156).\n- **K5 — Mirabolic: $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$** *(`positive`)* — **The variety.** The dual of the Godement–Jacquet space, with $(g,v)$ acted on by $(g_1,g_2)\\mapsto(g_1^{-1}gg_2,\\, vg_2)$. Its loop quotient is the mirabolic affine Grassmannian $\\mathrm{Gr}\\times\\mathcal{V}$ with $\\mathcal{V} = \\mathbf{V}\\otimes F$, $\\dim\\mathbf{V} = n$, acted on diagonally …\n- **K6 — Symplectic (Jacquet–Rallis) period: $X = \\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$** *(`positive`)* — **The variety.** Symmetric, hence spherical, and homogeneous with reductive stabilizer, hence smooth affine. Its dual is the Shalika-Whittaker reduction $\\check M = T^*(\\mathrm{GL}_{2n}/\\mathrm{GL}_n\\ltimes U,\\psi)$.\n- **K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m < n-1$** *(`adjacent`)* — **The variety.** The dual is $\\check X = \\mathrm{Mat}_{m\\times n}$ acted on by $\\check G = \\mathrm{GL}_m\\times\\mathrm{GL}_n$; the automorphic side is the Rankin–Selberg period for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$ outside the adjacent range covered by K4.\n- **K8 — Rank-1 affine homogeneous spherical varieties: the weakened form, in print** *(`weak`)* — **Why it is here.** This is the entry that shows the distinction this register turns on is real, and not a reading the blueprint imposed on the literature.\n- **K9 — The group case: $X = H$ under $G = H\\times H$** *(`degenerate`)* — **Why it is here.** To keep it out. BZSV §7.6.2 (pp. 168–169) identify the conjecture here with derived Satake, so the case is as settled as anything in the register — and useless as a …\n- **K10 — The Whittaker period: $M = T^*(G/\\!\\!/_{\\psi}U)$** *(`out-of-class`)* — **Why it is here.** BZSV §7.6.4 (p. 169) settle it — the dual is a point, the automorphic side is Whittaker sheaves on the Grassmannian, and the equivalence is Frenkel–Gaitsgory– Vilonen. It looks like a …\n- **K11 — $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$: the class boundary** *(`out-of-class`)* — **Why it is here.** A spherical root of type $N$ puts it outside the hyperspherical setting (BZSV §7.6.5, pp. 169–170), and the conclusion changes shape rather than merely failing: the local category contains a block …\n- **K12 — $X = (\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$** *(`negative`)* — **Why it is here.** It is the only candidate *negative* on record. Sakellaridis (arXiv:0905.4244, Ex. 8.0.1 with Thm 8.0.2 and pp. 65–66) shows that in the function-theoretic shadow the basic vector generates a proper Hecke …\n\n**No `/check-goal` run is on record for this node.**\n\n## Expected response\n\nProve or disprove. Give a counterexample if it is false, a corrected statement if it needs one, and say how the plan around this node should change. Write as a rigorous mathematician, and search the web for anything you cite.\n";</script>
