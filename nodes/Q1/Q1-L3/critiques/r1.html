onsumes both directions: Step 2 builds $\\mathcal{T}_0$ out of subcategories with $\\mathcal{E}[\\pm1]\\subseteq\\mathcal{E}$, Step 3 needs $\\mathcal{T}=\\bigcup_\\alpha\\mathcal{S}_\\alpha$ closed under $[\\pm1]$, and Step 6 forms $\\mathrm{cofib}(t[-1]\\to t')$.\n\n<details><summary>(Step 3, \"the rest are small colimits of diagrams in the full subcategory $\\mathcal{S}_F$: $\\mathcal{G}[1]$ is the pushout of $0\\leftarrow\\mathcal{G}\\rightarrow 0$\") · the finding</summary>\n\nStep 3 here verifies $[+1]$ only, and its stated mechanism provably cannot reach $[-1]$: desuspension is a limit, not a colimit. The counterexample to the implication is one line — connective spectra inside $\\mathrm{Sp}$ are closed under all small colimits, cofibres, retracts and $[+1]$, and not under $[-1]$. So the quoted lemma's hypothesis is half-checked and the half that is missing is used.\n\nThe fact itself is true and one clause away: the support of [Q1-L3-L2](../Q1-L3-L2/index.html)'s Setup is cut out by vanishing of $!$-restrictions to opens, those restrictions are exact, so $|\\operatorname{supp}\\mathcal{G}[n]|=|\\operatorname{supp}\\mathcal{G}|$ for every $n\\in\\mathbb{Z}$ and $\\mathcal{S}_F$ is shift-stable outright. That makes this an ordinary defect in the write-up, not a want in the closed world — but it is not a defect a reader can repair from what is on the page, because the page gives a reason that does not work.\n\n</details>\n\n**Flaw 2** [MAJOR] [H] — [Q1-L3-L4](../Q1-L3-L4/index.html) is stated as *assume (A) and (B), then …*.\n\n<details><summary>(Step 9, \"so that node's conclusion applies\"; Caveats, \"Hypothesis (B) of that node … is inherited by clause (ii), not discharged here\") · the finding</summary>\n\nStep 9 checks (A) and says nothing about (B), and the Caveat concedes it is undischarged. But (B) is not pure notation: its first half fixes what $\\overline{i}_{\\lambda,*}$ denotes, its second half **asserts base change against $!$-pullback for the $K$-equivariant form**, which is a mathematical claim. Clause (ii) of this node's `## Statement` declares only (C), so as written the write-up establishes clause (ii) under a hypothesis the statement does not carry — \"inherited by clause (ii)\" is a claim about the statement that the statement does not make. Nor is $\\overline{i}_{\\lambda,*}$ defined in this node's own Setup.\n\nThis is dischargeable rather than gap-class, which is why it is a defect and not a want: clause (iv) of [Raskin: pushforward along a finitely presented morphism](../../../../appendix/bb-raskin-fp-pushforward.html), amended 2026-08-08, gives the pushforward and its base change on quotient *prestacks* outright, and its note says what is owed instead is finite presentation of $K\\backslash\\overline{LX}_\\lambda\\to K\\backslash LX$ in the prestack sense — a step from (C1) that the draft never attempts. Either take it, or send clause (ii) to `/update` to declare the hypothesis.\n\n</details>\n\n**Flaw 3** [MAJOR] [G] — Honest, correctly placed, and correctly scoped — I confirm no appendix entry defines $(-)_{\\mathrm{red}}$ for an ind-scheme or asserts density of $k$-points on a placid scheme (grepped `\\mathrm{red}`, \"dense\", \"geometric points\" across `blueprint/appendix/`), and I confirm the prover's reading of [placidity](../../../../appendix/placid-ind-scheme.html).\n\n<details><summary>(Step 13 and the **GAP** marker; [g1](../gaps/g1.html)) · the finding</summary>\n\n**Rescoping, which is the thing asked of me: granting items 1 and 2, clause (iv) finishes, and nothing further is needed.** Item 1 gives $LX$ reduced from the reduced stages of [$\\overline{LX}_\\lambda$](../../../../appendix/def-orbit-closure.html) under [the three standing hypotheses](../../../../appendix/assum-intro.html)(a), hence $(LX)_{\\mathrm{red}}=LX$; item 2 applied to $Y=LX$, $W=Z$ with $|Z|=LX^{\\mathrm{sat}}=|LX|$ from Step 11 gives $Z=LX=(LX)_{\\mathrm{red}}$. The base field is algebraically closed by [context](../../../../context.html), so the \"geometric points $=k$-points\" clause the gap asks for is met. Two remarks on the shape of the ask rather than its sufficiency. (a) The engine is item **4**, not item 2: stagewise, $Z\\cap\\overline{LX}_\\lambda$ is closed in the *reduced* $\\overline{LX}_\\lambda$ and contains all its $k$-points, so very-density on one placid stage plus the colimit gives item 2, and a deliverer who answers 4 and 1 has answered everything. (b) Item 2 is where the doubt actually sits, and the file is right to invite \"false, and stop\".\n\n</details>\n\n**Flaw 4** [MINOR] [B] — Mis-scoped: that entry transcribes main.tex:669 verbatim, so adding surjectivity to it would put the appendix at odds with the manuscript rather than amend a reading.\n\n<details><summary>(gap [g1](../gaps/g1.html), item 3, \"`amends placid-ind-scheme`\") · the finding</summary>\n\nOnly the second alternative the item offers — a separate statement that the presentations arising from [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) have surjective transitions — is admissible; say so, so the deliverer does not rewrite a transcription.\n\n</details>\n\n**Flaw 5** [MINOR] [B] (Caveats, \"Beyond `objects:`: …\") — All six named entries are already in the node's `objects:` line.\nThe list should be empty.\n**Flaw 6** [MINOR] [G] (the **Unconditionality** paragraph of the Lemma) — It is part of the claim and no step discharges it.\nOne sentence does: none of the statements of [Q1-L3-L1](../Q1-L3-L1/index.html), [Q1-L3-L2](../Q1-L3-L2/index.html), [Q1-L3-L4](../Q1-L3-L4/index.html), [Q1-L3-L6](../Q1-L3-L6/index.html) carries [the three standing hypotheses](../../../../appendix/assum-intro.html)(c) as a hypothesis, and no entry cited in Steps 1–12 does either.\n**Flaw 7** [MINOR] [G] (Step 1, \"whose input is small — applying $\\mathrm{Ind}$ presupposes that\"; Step 4, \"the small $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\") — Smallness is read off the appendix's *use* of $\\mathrm{Ind}$ rather than established; it carries both $\\mathcal{C}$ presentable and \"$S$ is a small set\".\nFine as a convention, but say it is one.\n**Flaw 8** [MINOR] [G] (Step 3, \"the colimit of the idempotent diagram $\\mathrm{Idem}\\rightarrow\\mathcal{C}$ at $\\mathcal{G}$\") — Standard (HTT 4.4.5.14–16), but it is the *split* idempotent that extends over $\\mathrm{Idem}$, and fullness of $\\mathcal{S}_F$ is what keeps the diagram inside it.\nBoth belong on the page.\n## Sort of the standing FATAL/MAJOR flaws by owner\n\n- **The closed world coming up short:** Flaw 3 alone.\n- **Ordinary defects:** Flaw 1 (a quoted lemma's hypothesis half-checked, with a reason that cannot supply the other half) and Flaw 2 (a quoted node's hypothesis neither checked nor declared).\n- **The statement's own defect:** Flaw 2 has a second face here — clause (ii) uses $\\overline{i}_{\\lambda,*}$ and its base change without declaring either.\n\n**No: not every standing FATAL/MAJOR is the closed world coming up short.** Two of the three are ordinary defects, both repairable inside the existing closed world. This round is `failing`, not `gapped`.\n\nVERDICT: FAIL\n";</script>
