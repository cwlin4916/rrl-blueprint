<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../index.html">Q1-L3</a><i>›</i><span>g1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Gap g1 — Q1-L3: nothing says a reduced closed ind-subscheme of $LX$ is pinned down by its geometric points</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/gaps/g1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[node](../index.html) · [write-up](../proof.html) · [appendix](../../../../appendix/index.html)\n\n**Opened:** 2026-08-09, from Step 13 of the write-up, which is clause (iv).\n**Wanted:** appendix entries for `blueprint/appendix/placid-geometry/` (or `orbits-and-strata/`), stated for **ind-schemes**, not for schemes.\n\nThis file is a **prompt**. Paste it whole into a model that has never seen this repository. It is append-only and outside the closed world: nothing cites it, and it justifies nothing.\n\n## Statement\n\n**Setup.** For $\\mu\\in\\Lambda^+$ let\n\n$$\nm_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X \\longrightarrow LX\n$$\n\nbe the convolution map, where $\\overline{LG}_\\mu\\subset LG$ is the preimage of $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$; each $m_\\mu$ is ind-proper, since $\\mathrm{Gr}$ is. Write\n\n$$\nLX^{\\mathrm{sat}} := \\bigcup_{\\mu\\in\\Lambda^+}\\left|m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\\right| \\;\\subseteq\\; |LX|\n$$\n\nfor the union of their images on geometric points. This is a $K$-stable subset of $|LX|$ and nothing more: no scheme structure is declared on it, and none is claimed to be closed. Ind-properness of the individual $m_\\mu$ makes each image closed and says nothing about their filtered union.\n\nFor a finite $F\\subseteq\\Lambda^+$ write $Z_F\\subseteq|LX|$ for the closed $K$-stable subset of [Q1-L3-L1](../Q1-L3-L1/index.html)(3), and $j_F$ for the open complement of $Z_F$ in $LX$. Two inputs are used below and established by no clause of this node.\n\n**(A) Coherent objects are compact.** Inside the renormalized category [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html),\n\n$$\n\\mathcal{D}_c(K\\backslash LX) \\;=_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\; \\left(\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\right)^{\\omega} .\n$$\n\nThis is the statement of [Q1-L2-L1](../../Q1-L2/Q1-L2-L1/index.html) at $\\mathcal{Y}=K\\backslash LX$. It is declared here rather than used silently because [Q1-L3-L3](../Q1-L3-L3/index.html) concludes about compact objects while clause (i) quantifies over coherent ones, and (A) is the only thing joining the two.\n\n**(B) Support-bounded subcategories are closed under colimits.** For every finite $F\\subseteq\\Lambda^+$ the full subcategory\n\n$$\n\\mathcal{S}_F := \\left\\{\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\middle|\\ |\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F\\right\\}\n$$\n\nis closed under all small colimits formed in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$. This is hypothesis (B) of [Q1-L3-L3](../Q1-L3-L3/index.html) for the family this node applies it to, and no statement in the repository establishes it.\n\nContinuity of $j_F^{!}$ delivers (B) once $\\mathcal{S}_F=\\ker(j_F^{!})$, and **that identification is a second assumption and not a consequence of the support convention**: writing $|\\operatorname{supp}\\mathcal{G}|\\subseteq Z_F$ says $U_F$ is *covered* by opens on which $\\mathcal{G}$ restricts to zero, which gives $\\ker(j_F^{!})\\subseteq\\mathcal{S}_F$ and not the converse. The converse asks vanishing to be local on $LX$ and to survive the passage to the $K$-quotient. Both halves are the business of [Q1-L3-L3-L1](../Q1-L3-L3/Q1-L3-L3-L1/index.html), where the locality is its hypothesis (A) and the continuity its clause (1). The nearest adjacent statement is the locally closed orbit form at [Q1-L5-L3](../../Q1-L5/Q1-L5-L3/index.html)(2), which is about $i_{\\lambda,Z}^{!}$ and not about an open complement.\n\n**(C) Finite presentation on the range used.** There is a subset $\\Lambda'\\subseteq\\Lambda_X^+$ such that for every $\\lambda\\in\\Lambda'$ the closed embedding $\\overline{\\imath}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$ is finitely presented, and $\\bigcup_{\\lambda\\in\\Lambda'}|\\overline{LX}_\\lambda| = |LX|$.\n\nThis is what clause (ii)'s witness argument consumes, and it is **not** available over all of $\\Lambda_X^+$: for $X=\\mathbb{A}^1$ with $G=\\mathbb{G}_m$ the origin of $L\\mathbb{A}^1$ is a closed orbit equal to its own closure whose embedding is cut out by a non-finitely-generated ideal ([Q1-L3-L4 r1](../Q1-L3-L4/critiques/r1.html)). [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) is stated for all of $\\Lambda_X^+$ and its source establishes it only over the open-$G$-orbit range, so the second half of (C) — that the range still exhausts $|LX|$ — is the part nothing supplies.\n\nThen:\n\n(i) under (A) and (B), every $\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ satisfies $|\\operatorname{supp}\\mathcal{G}|\\subseteq LX^{\\mathrm{sat}}$;\n\n(ii) for every $\\lambda\\in\\Lambda'$ of (C), $\\overline{i}_{\\lambda,*}\\,\\omega_{K\\backslash\\overline{LX}_\\lambda}$ is a nonzero object of $\\mathcal{D}_c(K\\backslash LX)$ with support $\\overline{LX}_\\lambda$ — this clause uses neither (A) nor (B), and is stated on the range (C) supplies;\n\n(iii) hence, under (A), (B) and (C), if $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)$, then $LX^{\\mathrm{sat}} = |LX|$ — every $K$-orbit satisfies $|LX_\\lambda|\\subseteq LX^{\\mathrm{sat}}$, which is set-theoretic Hecke saturation;\n\n(iv) if in addition $LX^{\\mathrm{sat}}$ is the set of geometric points of a reduced closed ind-subscheme $Z\\subseteq LX$, then under the hypothesis of (iii) that ind-subscheme is $Z = (LX)_{\\mathrm{red}}$.\n\n**Unconditionality.** Clauses (i)–(iii) use [the three standing hypotheses](../../../../appendix/assum-intro.html)(a) and (b) alone — the placid presentation and the dimension theory that supplies the dualizing object of [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) — together with the Hecke action, the orbit-closure geometry of [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html), and the two declared hypotheses (A) and (B), which invoke (c) no more than the clauses do. No clause invokes [the three standing hypotheses](../../../../appendix/assum-intro.html)(c), so the necessary condition this node supplies to [Q1](../../../../dag.html) is independent of the unramified conjecture — independent, and conditional on (A), (B) and (C). What (C) costs is stated plainly: clause (iii) exhausts $|LX|$ only over the range (C) supplies, so the necessary condition this node hands [Q1](../../../../dag.html) is weaker than it read before 2026-08-07 ([u3](../updates/u3.html)).\n\n## Where the argument stalls\n\nClauses (i), (ii) and (iii) are proved. Clause (iv) stalls, and it stalls in one place.\n\nStep 11 of the write-up establishes $LX^{\\mathrm{sat}} = |LX|$, where $|Y|$ denotes the set of geometric points of an ind-scheme $Y$ with its Zariski topology — the convention every node of this family uses. Clause (iv) hands us a reduced closed ind-subscheme $Z\\subseteq LX$ whose geometric points are $LX^{\\mathrm{sat}}$, so $|Z| = |LX|$, and asks us to conclude $Z = (LX)_{\\mathrm{red}}$.\n\nTwo things are missing, and both are about ind-schemes rather than schemes.\n\n**(1) $(LX)_{\\mathrm{red}}$ is not defined anywhere.** No appendix entry gives the reduction of an ind-scheme, or says it exists, or says it does not depend on the presentation. The nearest entry is [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../appendix/def-orbit-closure.html), which fixes the *orbit closures* as reduced schemes; that is one stage, and it stops there. With [the three standing hypotheses](../../../../appendix/assum-intro.html)(a) presenting $LX$ as the filtered colimit of those reduced stages, the expected reading is $(LX)_{\\mathrm{red}} = LX$, but \"expected\" is not \"supplied\".\n\n**(2) Nothing lets geometric points detect a closed ind-subscheme.** The inference wanted is: $W\\subseteq Y$ a closed sub-ind-scheme, $Y$ reduced, $|W| = |Y|$, therefore $W = Y$. For schemes *of finite type* over an algebraically closed field this is standard, because closed points are $k$-points and are very dense. The stages here are **not** of finite type: $\\overline{LX}_\\lambda$ is a placid scheme, and [placidity](../../../../appendix/placid-ind-scheme.html) requires only that a placid presentation $\\varprojlim_i X_i$ have transition maps that are smooth and affine. Without surjectivity, a $k$-point of a stage $X_i$ need not lift to a $k$-point of the limit, so the usual argument — take $0\\ne f$ in the ideal, push it down to a stage, find a $k$-point of that stage where it does not vanish — has no last step. The entry is nearly right and stops exactly there.\n\nThis is not a defect peculiar to clause (iv). [Q1-L3-L5](../Q1-L3-L5/index.html)(1) says a specialization-closed $K$-stable subset \"**is** the set of geometric points of **the** reduced closed ind-subscheme $Z := \\dots$\", with a definite article that presupposes exactly fact (2). Whatever is delivered here should be stated so that it serves that node too.\n\n## What to deliver\n\n**Read the list in the order the work actually falls, which is not the order it is numbered.** The engine is item **4**: very-density of $k$-points on one *reduced placid* stage. Granted that, item 2 follows stagewise — $W\\cap\\overline{LX}_\\lambda$ is closed in the reduced $\\overline{LX}_\\lambda$ and contains all its $k$-points — together with the colimit. Item 1 supplies the other half, $(LX)_{\\mathrm{red}} = LX$. And granting items 1 and 2, clause (iv) **finishes**, with nothing further owed: item 2 at $Y = LX$, $W = Z$ closes it. So a deliverer who answers **4 and 1** has answered everything, and item 3 is the hypothesis item 4 is likely to need. Item 2 is also where the doubt sits: if it is false, say so and stop.\n\n1. **`new entry` — the reduction of an ind-scheme.** For $Y = \\varinjlim_i Y_i$ an ind-scheme presented along closed embeddings, define $Y_{\\mathrm{red}}$, show it is independent of the presentation, and state that it is the largest reduced closed sub-ind-scheme of $Y$, with $|Y_{\\mathrm{red}}| = |Y|$. Say explicitly whether \"reduced ind-scheme\" means \"admits a presentation by reduced schemes\" or \"every closed subscheme of it is reduced\", and whether the two agree. Record the consequence for $LX$ under [the three standing hypotheses](../../../../appendix/assum-intro.html)(a): the stages are the reduced orbit closures, so $(LX)_{\\mathrm{red}} = LX$ — or say why not.\n\n2. **`new entry` — geometric points determine a closed sub-ind-scheme.** State: if $Y$ is a reduced ind-scheme whose stages are placid schemes over $k = \\bar k$, and $W\\subseteq Y$ is a closed sub-ind-scheme with $|W| = |Y|$, then $W = Y$. The hypotheses must be about the objects in play — placid stages, $k$ algebraically closed, geometric points meaning $k$-points — and the entry must say which hypothesis does the work. If the statement is **false** without surjective transition maps, say so, give the counterexample, and stop: that answer sends clause (iv) to `/update` for a corrected hypothesis, which is worth more than an entry that hides the difficulty.\n\n3. **`new entry` — the transitions of the presentations in play are surjective.** State, as a **separate** entry: the placid schemes arising from [orbit closures present $LX$ as a placid ind-scheme](../../../../appendix/thm-chen-ti.html)(a) — the orbit closures $\\overline{LX}_\\lambda$ — admit placid presentations $\\varprojlim_i X_i$ whose transition maps are **surjective** as well as smooth and affine. **Do not amend [placidity](../../../../appendix/placid-ind-scheme.html).** That entry transcribes main.tex:669 verbatim, and adding surjectivity to it would put the appendix at odds with the manuscript rather than sharpen a reading; the manuscript's definition is to stand untouched and the extra property is to be asserted of *these* presentations only. Item 2 is very likely false without it and true here because of it, so this item is what carries item 4.\n\n4. **`new entry` or a note on item 2 — density of $k$-points on a placid scheme.** The usable form: for $Y$ a reduced placid scheme over $k = \\bar k$, the set $Y(k)$ is very dense, i.e. a closed subscheme containing $Y(k)$ is $Y$. This is the engine of item 2 at one stage; keep it separate if the ind-level statement is cleaner without it.\n\n**Do not deliver a finite-type or scheme-level statement for items 2 and 4.** A fact about a finite-type scheme is not a fact about a placid scheme, and a fact about a placid scheme is not a fact about an ind-scheme; each transfer must be part of a statement rather than assumed free. That is the trap this gap exists to record.\n\n**Leads, not conclusions.** The reduction of an ind-scheme is treated in Gaitsgory–Rozenblyum, *A study in derived algebraic geometry*, Vol. II, Ch. 2 (no `refs.bib` key — only Volume I has one, `GR17vol1`); ind-schemes and their reduced structure also appear in Beilinson–Drinfeld, *Chiral Algebras*, §7.11 (no key), and placid/pro-finite-type geometry in `drinfeld_infinite_vectorbundle`, which does have a key. None of these has been checked at page level for this gap.\n\n## Rules\n\n**Read locally first.** The source PDFs are in `papers/`, named by their `refs.bib` key and indexed by `papers/guideline.md`. Open the PDF before relying on memory and before searching the web. If the source is not on disk, say so and record what page-level check is owed rather than asserting the statement as verified.\n\n**One file per object**, at `blueprint/appendix/<section>/<anchor>.md`, opening with `# <a id=\"anchor\"></a> <title>`.\n\n**Every entry carries**: the statement in full; a `role:` line (`definition`, `convention`, `black box`, …); a `hypotheses:` line saying what the source actually requires and which hypothesis does the work; and a **dictionary note** reconciling the source's conventions with this repository's — which topology, which notion of point, what base field, and whether the transfer is automatic or declared.\n\n**Citations.** Only bib keys present in `refs.bib`. If the source has no key, carry the full bibliographic data in prose and say the key is absent.\n\n**Markdown, not LaTeX.** Standard KaTeX only, no house macros (`\\cD`, `\\Sat`, … are `.tex`-only). Display math goes in `$$ … $$` blocks with a blank line either side.\n\n**Stop rather than paper over.** If item 2 is false without a hypothesis this node cannot supply, that is the finding, and it is worth more than an entry that conceals it.\n";</script>
