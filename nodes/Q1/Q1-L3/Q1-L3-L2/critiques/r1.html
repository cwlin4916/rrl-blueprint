<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L2</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L3-L2, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nChecks that came back clean, so that the flaws below are read against them.\nThe `## Lemma` block reproduces `Q1-L3-L2_node.md`'s `## Statement` **verbatim**, Setup and all four\nclauses, with the same links — no strengthened hypothesis, no weakened conclusion.\nEvery link resolves: `gr-schubert`, `ic-0`, `conv-hecke-action`, `def-satake-subcategory`,\n`defn-coherent-d-mod`, `def-renormalized`, `ex-sheaf-placid-ind`, `not-dualizing-object`,\n`bb-raskin-fp-pushforward` all exist under `blueprint/appendix/` with the anchors the links use, and\n`key_examples.md#k9` exists. No bib key and no `main.tex` label is cited directly, so there is nothing\nto hallucinate. The closing disclosure line is **accurate**: Q1-L3-L1's Setup is used throughout, its\nclause (3) in Steps 3 and 9, its clause (1) in Step 4, and no other clause of it is used anywhere.\n`gr-schubert`(4) is never invoked — Steps 5–7 run on clauses (1), (2), (3) only — so the third caveat's\ndirectionality ban is respected. Clause (4) is proved as the pair of conditionals it is; Step 11 says\n\"if the letter of [coherent] admits $\\omega_{K\\backslash\\mathrm{Gr}}$\" and closes with \"Neither branch\nis asserted\", so the draft does **not** take a side on the open tension. And clause (3) does supply\nnonvanishing rather than mere support-at-two-points (Step 9, \"nonzero as $\\mathrm{IC}_0\\neq0$ and\n$\\tau_\\mu$ is invertible\"), which is what makes the clause non-vacuous. Length is not counted, per the\norchestrator's instruction.\n\nI verified the Raskin hypothesis on the page myself, not from the entry.\n`papers/raskin_dmodules_infinite_var.pdf` p. 3, Table 1, row 3: hypothesis column\n\"$f$ ind-finitely presented\", functor $f_{*,!-\\mathrm{dR}}\\colon D^!(S)\\rightarrow D^!(T)$, with\nind-properness appearing **only** in the adjunctions column (\"Left adjoint to $f^!$ for $f$ ind-proper\").\np. 34, §6.3: \"We say a morphism $f\\colon T\\rightarrow S$ of indschemes is *finitely presented* if $f$ is\nschematic and its base-change by any scheme is a finitely presented morphism\", and \"For $f\\colon S\n\\rightarrow T$ finitely presented we have the corresponding functors $f_{*,!-\\mathrm{dR}}$ … If $f$ is\nadditionally assumed proper or smooth, we again have the usual adjunctions.\" The draft's reading of the\nentry, and the entry's reading of the source, are both correct.\n\n---\n\n**Flaw 1** [FATAL] — This inference is invalid, and the principle it invokes is false.\n\n<details><summary>(Step 6, \"Noetherianness supplies a maximal $\\mathrm{Gr}_{F_0}$ among the closed\n$\\{\\mathrm{Gr}_F: F\\subseteq S\\text{ finite}\\}$\") · the finding</summary>\n\nA Noetherian topological space\nsatisfies the **descending** chain condition on closed subsets — equivalently the ascending chain\ncondition on *opens* — so every nonempty family of closed subsets has a **minimal** element. Maximal\nelements require ACC on closed subsets, which a Noetherian space does not have: the finite subsets of\n$\\mathbb{A}^1$ form a family of closed subsets, closed under finite unions, with no maximal member. That\nis not a stray counterexample either — it is exactly the shape of the family here in clause (3)'s own\ntorus case, where every $\\overline{\\mathrm{Gr}}_\\mu$ is a reduced point (Step 7) and $\\mathrm{Gr}_F$ is a\nfinite set of points. Run the draft's inference on $\\mathbb{A}^1$ with $S$ its closed points and it\nconcludes that $\\mathbb{A}^1$ is a finite set.\n\nWhat Step 6 actually needs is **finiteness of $S$**, and the draft is right (as the orchestrator's third\ncheck anticipated) not to assume finiteness of the orbit set — but it has not replaced it with anything.\nNote that the alternative finiteness the write-up does have, Step 11's finiteness of the dominance\ninterval, cannot supply it: $S$ is downward closed, and a downward-closed subset of $\\Lambda^+$ with all\nintervals finite may still be all of $\\Lambda^+$. The correct principle in the neighbourhood is a\ndifferent one (a partition of a Noetherian space into locally closed subsets is finite, by Noetherian\ninduction on the generic points), and it needs the orbits to be locally closed and to partition\n$|\\mathrm{Gr}_n|$ — neither of which `gr-schubert`(1) states.\n\nClause (2)'s hard half is therefore unproved, and the damage propagates: Step 7 (\"By Step 6 a stage is a\nfinite set of these\"), Step 10 (\"$\\subseteq\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_{F_0}$ by Step 6\") and\nhence clause (4)'s first branch all rest on it.\n\n</details>\n\n**Flaw 2** [MAJOR] — The inference \"closed in an ind-proper ind-scheme, therefore proper\" is false without\nquasi-compactness of the closed piece, and quasi-compactness of a stage is not in the closed world.\n\n<details><summary>(Step 6, \"A stage is closed in the ind-proper $\\mathrm{Gr}$, so proper over $k$\") · the finding</summary>\n\n`gr-schubert`(3) says only that the $\\mathrm{Gr}_n$ are \"finite-dimensional $K$-invariant schemes\" with\nclosed-embedding transitions. In clause (3)'s own case $\\mathrm{Gr}=\\mathrm{Gr}_{T\\times T}$ is a\ndisjoint union of reduced points, which is itself a $0$-dimensional $K$-invariant scheme and a closed\nsub-ind-scheme of the ind-proper $\\mathrm{Gr}$ — and is not proper. So the entry as written does not\nforce the stages to be quasi-compact, and without that there is no Noetherian $|\\mathrm{Gr}_n|$ and no\nStep 6 at all. (The entry's second note comes close — it speaks of \"a closed subscheme of a stage of an\nind-proper presentation\" — but that licenses properness of $\\overline{\\mathrm{Gr}}_\\lambda$ *given* a\nproper stage, which is the thing at issue.) Whatever repairs Flaw 1 has to discharge this first.\n\n</details>\n\n**Flaw 3** [MAJOR] — The marker is honest, is placed exactly where the argument stops, and names three distinct debts rather\nthan one vague one; that is the right way to fail.\n\n<details><summary>(Step 4, the prover's own **GAP**, and the honest one) · the finding</summary>\n\nBy the rubric it is an automatic FAIL. Adjudicating\nthe three, worst first, since the run's next action depends on which is which:\n\n**(b) finite presentation of $q$ is the worst, and nothing on disk closes it.** Verified on the page\nabove: §6.3's hypothesis is ind-finite presentation, and Table 1 spends ind-properness on the\n*adjunction* and not on the functor or its base change. Q1-L3-L1(1) gives ind-properness and\n`gr-schubert` gives ind-properness of $\\mathrm{Gr}$; no entry in `blueprint/appendix/` asserts that\n$m_\\mu$, or $q$, is schematic with finitely presented base change. This is a **mathematical** flaw, not\na closed-world one: no widening of `objects:` reaches it, and the repair is either a new appendix entry\nor a proof (the fibre of $m_\\mu$ over a point of $LX$ is a closed subscheme of $\\overline{\\mathrm{Gr}}_\\mu$,\nwhich is where such a proof would start).\n\n**(c) the $\\mathcal{D}^*$-to-$\\mathcal{D}^!$ identification of the pushforward is second**, and it is a\nstanding repository debt rather than this node's invention: `bb-raskin-fp-pushforward`'s own note says\nthe identification of $f_{*,!-\\mathrm{dR}}$ with $f_{*,\\mathrm{dR}}$ across the duality is *not*\nlicensed and that \"a node needing that identification still owes it\". Nothing on disk closes it either.\n\n**(a) is the least bad, and the orchestrator's framing of it is not right.**\n`blueprint/appendix/bb-raskin-torsor-descent.md` does **not** close this half, so this is not a\nclosed-world width defect and declaring the entry would not fix the step. That entry's `hypotheses`\nfield requires $S$ quasi-compact quasi-separated **scheme**, $\\mathcal{P}$ a quasi-compact\nquasi-separated $S$-**scheme**; here the would-be base is the stack $K\\backslash LX$. Its first note\nsays so in bold — \"The base is a scheme, never a stack — the gap a user must bridge\" — and its\nindscheme note adds that Prop. 6.7.1 \"moves the base from a scheme to an indscheme and still not to a\nstack, so it closes no part of the gap named above\". Even granting the equivalence\n$\\mathcal{D}^!(K\\backslash LX)\\simeq\\mathcal{D}^!(LX)^K$, Step 4 additionally needs that equivalence to\nintertwine $q_*$ and $j^!$ with their $K$-equivariant counterparts, which no clause of the entry states.\nSo: declaring it is a *necessary* widening and not a sufficient one.\n\nOne observation that may shrink the whole of Step 4: what is needed is base change along an **open**\nimmersion $j$ only, not the general Cartesian square. That is a much weaker demand than\n`bb-raskin-fp-pushforward`(ii), and it may be reachable without (b) and (c) at all.\n\n</details>\n\n**Flaw 4** [MAJOR] — `conv-hecke-action` — the only entry that defines $\\ast$ — defines it \"by $*$-pullback and\n$*$-pushforward along the convolution diagram\".\n\n<details><summary>(notation line, \"$\\ast$ is read in $\\mathcal{D}^!$ by [placid ind]\"; Step 2,\n\"$\\mathcal{F}\\ast\\mathrm{IC}_0=q_*p^!(\\mathcal{F}\\boxtimes\\mathrm{IC}_0)$. By [$\\ast$]\") · the finding</summary>\n\nThe draft computes with $p^!$ and attributes the\nformula to that entry. The swap is disclosed in the `notation:` line, but the licence cited for it does\nnot cover the spaces it is used on: `ex:sheaf_placid_ind` has hypotheses \"$X$ a placid ind-scheme; a\ndimension theory\", and its own `hypotheses` field says the dimension theory is \"supplied for $LX$ by\n`assum:intro`(b)\" — for $LX$ and for nothing else. No entry declares $\\mathrm{Gr}$, the product\n$K\\backslash\\mathrm{Gr}\\times K\\backslash LX$, or the convolution space\n$K\\backslash LG\\times^K LX$ placid, or equips any of them with a dimension theory; and the entry is\nstated for ind-**schemes**, whereas every space in the diagram is a $K$-quotient stack — the same\nstack-versus-scheme gap as Flaw 3(a), invoked here silently rather than declared. This is\nhypothesis-checking, not pedantry: Steps 2–4 are written entirely inside the reading, and Step 4(c)\ndeclares the debt for the *pushforward* only, so the pullback half of the swap is undeclared.\n\n</details>\n\n**Flaw 5** [MAJOR]\n\n<details><summary>(Step 8, \"hence a nonzero finite complex with coherent cohomology\") · the finding</summary>\n\nThe nonvanishing of $\\delta_\\mu$ is load-bearing for all of clause (3) — if $\\omega_{K\\backslash\\{L_\\mu\\}}=0$\nthen $\\mathcal{F}=0$ and the clause has no witness — and the entry the draft cites for it explicitly\ndisclaims it: `not-dualizing-object`'s first note says \"Nothing here asserts that $\\omega_{\\mathcal{Y}}$\nis coherent, **or nonzero**, for an infinite-dimensional $\\mathcal{Y}$\", and\n$K\\backslash\\{L_\\mu\\}=B(L^+G)$ is infinite-dimensional. (The *coherence* half is inside the entry's\nlicence — \"a $K$-quotient of [a placid scheme]\" — and the lowering to a finite-type test is exactly the\nmove the note offers. That half I accept.)\n\nThe argument as written cannot serve both halves at once, and this is the sharp point. Coherence is a\ncondition quantified over all smooth $f\\colon S\\rightarrow K\\backslash\\mathrm{Gr}$ with $S$ finite type,\nso it gets *easier* the fewer such $f$ there are; nonvanishing needs at least one such $f$ with\n$f^{-1}(K\\backslash\\{L_\\mu\\})$ nonempty to exist, and the draft never says that any does — which for an\natlas of $B(L^+G)$, $L^+G$ pro-algebraic and not of finite type, is precisely the delicate point. As\nwritten, \"hence a nonzero finite complex\" is also simply false for the tests whose image misses\n$\\{L_\\mu\\}$, where $f^!\\delta_\\mu=0$.\n\nI record, because it bears on severity, that a repair looks cheap and does not go through smooth tests:\nthe entry supplies $a^!\\omega_{\\mathcal{Y}}\\simeq\\omega_{\\mathcal{Y}'}$ for **every** morphism, so the\natlas $a\\colon\\mathrm{pt}\\rightarrow B(L^+G)$ gives $a^!\\omega=\\omega_{\\mathrm{pt}}=k\\neq0$. That is not\nthe reason the draft gives.\n\n</details>\n\n**Flaw 6** [MINOR] — Step 2 bounds the support by $p^{-1}\\big(\\mathrm{Gr}_F\\times\\overline{|L^+X|}\\big)$; Step 3 then argues\n\"As $q$ is continuous, the closure maps into $\\overline{Z_F}=Z_F$\".\n\n<details><summary>(Steps 1–3, $\\overline{|L^+X|}$ against $|L^+X|$) · the finding</summary>\n\nContinuity gives\n$q(\\overline{E})\\subseteq\\overline{q(E)}$ for $E=p^{-1}(\\mathrm{Gr}_F\\times|L^+X|)$, which is a statement\nabout $\\overline{E}$; the region Step 2 actually produces is\n$E'=p^{-1}(\\mathrm{Gr}_F\\times\\overline{|L^+X|})$, and continuity gives $\\overline{E}\\subseteq E'$ — the\nwrong direction. The two steps compose only if $\\overline{|L^+X|}=|L^+X|$, i.e. only if $L^+X$ is closed\nin $LX$, which is true for affine $X$ and is never said. Saying it in Step 1 deletes the detour.\n\n</details>\n\n**Flaw 7** [MINOR] — The Setup defines $|\\operatorname{supp}\\mathcal{G}|$ only for $\\mathcal{Y}\\in\\{\\mathrm{Gr},LX\\}$.\n\n<details><summary>(Step 2, \"supported in $\\overline{LG}_F\\times^K\\overline{|L^+X|}$\") · the finding</summary>\n\nStep 2\nuses the notion on $K\\backslash\\mathrm{Gr}\\times K\\backslash LX$ and on the convolution space. The\nextension is obviously the same definition, but the statement scoped it deliberately and the write-up\nshould say it is extending it.\n\n</details>\n\n**Flaw 8** [MINOR] — This is an assertion inside the clause being proved, and no step verifies it.\n\n<details><summary>(clause (3), \"a member of the standing class\") · the finding</summary>\n\nIt is true —\n$\\mathbb{G}_m$ is smooth affine and normal, the unique Borel of the torus $T\\times T$ is $T\\times T$\nitself and acts transitively, and the stabilizer of $1$ is the connected diagonal — but the check is the\nnode's to make, and `def:polarized_hyperspherical` is not in `objects:`, so the node cannot presently\ncite the definition it has to check against. A declared widening would fix this one.\n\n</details>\n\n**Flaw 9** [MINOR] — Q1-L3-L1 defines $m_\\mu$ and $Z_F$; it defines no $m_F$, and the identification of $Z_\\mu$ as an image\nis in its Setup, not in clause (3).\n\n<details><summary>(Step 3, \"the $m_F=\\bigcup_{\\mu\\in F}m_\\mu$ of [Q1-L3-L1]\", \"of image $Z_F$ … both\nits clause (3)\") · the finding</summary>\n\nSmall, but the draft's own `notation:` line already coins\n$\\overline{LG}_F$, and $m_F$ belongs there too rather than being attributed to the dependency.\n\n</details>\n\n**Flaw 10** [MINOR] — The letter $T$ is the standing maximal torus in the Setup, where $\\Lambda^+:=X_*(T)^+$, and is redefined\nas $\\mathbb{G}_m$ in clause (3), where the maximal torus of $G=T\\times T$ is $G$.\n\n<details><summary>(Step 7, \"clauses (1)–(2) give $\\Lambda^+=X_*(G)=\\mathbb{Z}^2$\") · the finding</summary>\n\nRead literally the\nSetup then gives $\\Lambda^+=X_*(\\mathbb{G}_m)=\\mathbb{Z}$. The draft silently takes the intended reading,\n$\\Lambda^+=X_*(G)=\\mathbb{Z}^2$, and is right to; but it is a reading of a clash the statement carries,\nand Step 7 should name it rather than resolve it in passing.\n\n</details>\n\n**Flaw 11** [MINOR] — Both steps pass from an object being nonzero to its support being nonempty — for $\\delta_\\mu$ in Step 8\nand for $\\tau_{\\mu*}\\mathrm{IC}_0$ in Step 9.\n\n<details><summary>(Steps 8–9, \"nonzero\" to \"support nonempty\") · the finding</summary>\n\nThat implication is Zariski-locality of the sheaf theory\n(an object with empty support vanishes), which is standard but is not stated anywhere and is not\nformally free on a stack.\n\n</details>\n\n---\n\n**On the split.** Not a flaw, and the orchestrator asked. The prover's proposed cut, (1)+(2) against\n(3)+(4), is the wrong one: it puts the two *independent* hard parts in the same node — clause (1) is the\nconvolution estimate and carries the whole Raskin debt of Flaw 3, clause (2) is ind-scheme combinatorics\nthat touches no sheaf theory at all and carries Flaws 1–2 — while leaving clause (4), which *consumes*\nboth (1) and (2) and adds only the tension bookkeeping, in the other. The fault lines the write-up\nitself draws are Steps 1–4 / Steps 5–6 / Steps 7–9, i.e. clause (1) | clause (2) | clause (3), with\nclause (4) staying where the three meet as the summary that quotes them. If only one cut is wanted, it\nis clause (1) alone against (2)+(3)+(4): everything after Step 4 is about the index set $\\Lambda^+$ and\nthe Schubert stratification, and nothing after Step 4 needs $q_*$, $p^!$ or a base change.\n\nVERDICT: FAIL\n";</script>
