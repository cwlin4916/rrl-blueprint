<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L2</a><i>›</i><span>r2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L3-L2, round 2</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nFlaw numbering continues from r1 (which ended at Flaw 11), so a flaw number is unique across this\nnode's whole trail. Length is not counted, per instruction.\n\nThe `## Lemma` block still reproduces `Q1-L3-L2_node.md`'s `## Statement` verbatim, Setup and all four\nclauses. All appendix links and the `key_examples.md#k9` anchor still resolve. The disclosure line is\nstill accurate: Q1-L3-L1's Setup in Steps 3, 4, 13, its clause (3) in GAP A, its clause (1) in GAP A(b),\nand no other clause of it anywhere.\n\n## A. The orchestrator's repair route: the prover is right, and plainly so\n\nThe route was: stages proper → Noetherian → finitely many irreducible components → $K$ connected, so it\nstabilises each → Chevalley gives each irreducible $K$-stable component a dense orbit → each component\nis a Schubert closure.\n\nEvery link holds except the fifth, and the fifth is **false**, not merely unproved. A connected\nalgebraic group acting on an irreducible variety need not have a dense orbit: the prover's trivial\ngroup on $\\mathbb{A}^1$ is a counterexample, and — closing the one loophole the example leaves, since a\nstage is proper — so is $\\mathbb{G}_m$ acting on $\\mathbb{P}^1\\times\\mathbb{P}^1$ by scaling the first\nfactor, whose orbits are $\\{0\\}\\times\\{y\\}$, $\\{\\infty\\}\\times\\{y\\}$ and\n$(\\mathbb{P}^1\\smallsetminus\\{0,\\infty\\})\\times\\{y\\}$: infinitely many, none dense, on an irreducible\nproper scheme acted on by a connected group.\n\n**The strengthened premise does not rescue it either.** I checked the page the orchestrator's \"finite-type\nquotient\" is on: `papers/mirkovic2007geometric.pdf`, printed p. 4, \"The group $G_{\\mathcal{O}}$ acts on\nthe $\\mathcal{G}r_n$ through a finite dimensional quotient.\" So the premise is real and on the page —\nand it buys nothing here, because the $\\mathbb{P}^1\\times\\mathbb{P}^1$ example already *is* a\nfinite-dimensional connected group acting on a proper irreducible scheme. Chevalley likewise does not\nrescue it: local closedness of orbits is compatible with infinitely many, exactly as the prover says.\n\nI would sharpen one word. The prover calls the route \"circular\". It is not circular in the strict sense\n— it does not assume its conclusion — but the substance of the objection is right and is worth stating\nin the stronger form: **where the dense-orbit step is true here, it is equivalent to the conclusion.**\nIf each irreducible component $C$ of $\\mathrm{Gr}_n$ had a dense orbit $\\mathrm{Gr}^{\\mu_C}$ then\n$C=\\overline{\\mathrm{Gr}}_{\\mu_C}$ and $\\mathrm{Gr}_n=\\mathrm{Gr}_F$ with $F=\\{\\mu_C\\}$, which is GAP B;\nand conversely GAP B gives the dense orbits. So the route replaces GAP B by a statement of exactly the\nsame strength, with nothing on offer to prove it. That is a route that does not close, and the record\nshould say the prover caught it.\n\n**The verdict consequence:** GAP B is a real gap, so r1's FATAL is *not* unrepaired-by-evasion — it is\nwithdrawn and replaced by an honest declaration. That is the right disposition of it.\n\n## B. What would close GAP B — verified on the page\n\nBoth facts the prover names are where the prover says they are, read this run in\n`papers/mirkovic2007geometric.pdf`.\n\nPrinted **p. 4**: \"Note also that the connected components of $\\mathcal{G}r$ are exactly parameterized\nby the component group of $G_{\\mathcal{K}}$ … This latter group is isomorphic to $\\pi_1(G)$, the\ntopological fundamental group of $G$.\" Same page, the torus sentence Step 9 quotes: \"If $G=T$ is torus\nof rank $r$ then, as a reduced ind-scheme, $\\mathcal{G}r\\cong X_*(T)=\\mathrm{Hom}(\\mathbb{C}^*,T)$,\ni.e., in this case the loop Grassmannian is discrete.\"\n\nPrinted **p. 5**: \"if we choose the parameter $\\lambda\\in X_*(T)$ of the orbit $\\mathcal{G}r^\\lambda$ to\nbe dominant, then $\\dim(\\mathcal{G}r^\\lambda)=2\\rho(\\lambda)$\".\n\n**They suffice.** The argument they enable: a stage is quasi-compact (Step 5's properness reading) and\nthe components of $\\mathrm{Gr}$ are open (each stage is of finite type, so has finitely many, all open),\nhence $\\mathrm{Gr}_n$ meets finitely many components — that is $\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$ doing\nits work. Inside one component the dominant $\\mu$ all lie in one coset of the coroot lattice, so their\ncentral components agree; $\\langle2\\rho,\\mu\\rangle\\le\\dim\\mathrm{Gr}_n$ then confines them to a bounded\nregion of the dominant cone, hence to finitely many lattice points. So the set\n$S=\\{\\mu:L_\\mu\\in\\mathrm{Gr}_n\\}$ is finite, and $\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_S$ because the closed\npoints are dense and $\\mathrm{Gr}_S$ is closed. Note this is *not* a dimension argument alone — the\ntorus, where every orbit is $0$-dimensional, is carried entirely by the $\\pi_0$ half, which is why\nneither fact can be dropped.\n\n**Which clauses an entry unblocks.** An appendix entry carrying those two lines from\n`mirkovic2007geometric` pp. 4–5 closes GAP B, hence **clause (2)'s second half**; and, through Step 9,\n**clause (3)**; and **clause (4)'s first branch** so far as GAP B is concerned — but not further, see\nFlaw 14. A cheaper observation, worth the run's attention: **clause (3) alone needs only the torus\nsentence of p. 4**, since for $G=T\\times T$ the components are single points and a quasi-compact stage\nmeets finitely many of them; the dimension formula is not needed for clause (3) at all. So the register\nof what one entry buys is: p. 4's $\\pi_0$ sentence + p. 5's dimension formula → clause (2)(second half);\np. 4's torus sentence alone → clause (3).\n\nThe prover's phrase \"both recorded by [Schubert]'s provenance note as *not carried*\" is exactly right\nfor the dimension formula (\"which this entry does not need and does not carry\") and slightly generous\nfor $\\pi_0$, which that note does not mention at all — it is absent rather than declared absent. See\nFlaw 18.\n\n## C. The two declared readings\n\n**Step 5 (properness of the stages) — not an over-read.** `gr-schubert`(3) asserts the presentation and\nind-properness in one clause, and the entry's second note reasons about \"a closed subscheme of a stage\nof an ind-proper presentation\", which presupposes that the stages it is talking about — the only ones\nthe entry names — belong to an ind-proper presentation. Reading clause (3)'s presentation as that one is\nthe minimal reading under which the entry's own note is coherent. It is a reading and is now declared as\none, which is what r1 Flaw 2 asked for. Accepted.\n\n**Step 2 (the $\\ast$-theory swap) — correctly declared, correctly routed.** It states that\n`conv-hecke-action` defines the action by $*$-pullback and $*$-pushforward, that `ex:sheaf_placid_ind`\ncovers $LX$ alone and ind-schemes rather than stacks, and that Steps 3, 4 and 16 live inside the\nreading, which becomes GAP A(d). That is exactly r1 Flaw 4 converted from a silent move into a declared\ndebt. Accepted as a declaration — it closes nothing, and the draft does not claim it does.\n\n## D. Step 11's nonvanishing — the disclaimer is evaded legitimately\n\nThe argument is sound and does not merely relocate the problem. `not-dualizing-object` supplies\n$g^!\\omega_{\\mathcal{Y}}\\simeq\\omega_{\\mathcal{Y}'}$ **for every morphism**, with the entry's own first\nnote saying this holds \"for every $\\mathcal{Y}$ with no placidity or finiteness hypothesis\"; and it\nsupplies $\\omega_S\\neq0$ for $S$ nonempty of finite type. The atlas $a\\colon\\mathrm{pt}\\to B(L^+G)$\nexists for any group prestack, is not required to be smooth for the compatibility to apply, and gives\n$a^!\\delta_\\mu\\simeq\\omega_{\\mathrm{pt}}=k\\neq0$; hence $\\delta_\\mu\\neq0$, since $a^!$ of the zero object\nis zero. The disclaimer — \"Nothing here asserts that $\\omega_{\\mathcal{Y}}$ is coherent, or nonzero, for\nan infinite-dimensional $\\mathcal{Y}$\" — says the entry does not *assert* nonvanishing, not that\nnonvanishing is unavailable; deriving it from two things the entry does assert is not an over-read. The\nsplitting of the coherence half (Step 10, smooth tests) from the nonvanishing half (Step 11, the atlas)\nis the correct response to r1 Flaw 5, and the sentence \"smooth tests cannot supply this, since coherence\nonly gets easier as they get fewer\" shows the point was understood rather than patched. Closed.\n\nI add that under Step 9's splitting the support computation needs no locality principle at all — the\nopens are the points — so Step 11's closing sentence is belt-and-braces there; it is genuinely needed\nonly where Step 14 reuses it for $\\tau_{\\mu*}\\mathrm{IC}_0$.\n\n## E. Numbered flaws\n\n**Flaw 12** [MAJOR] — An honest GAP marker, and by the rubric an automatic FAIL.\n\n<details><summary>(GAP A, lines 40–46) · the finding</summary>\n\nIt is honest in the strong sense: it names\nfour separable debts, orders them worst-first, and says of (b) that \"no widening of `objects:` reaches\nthis: it needs a new claim\" — which is the r1 adjudication, correctly retained. (d) is new this round\nand is the debt r1 raised as a silent move. The observation that only open-immersion base change is\nneeded is kept and is the most useful line in the block. **Fillable:** (a) by a declared widening plus a\nbridging argument; (c) is a standing repository debt; (b) needs a new appendix entry or a proof that\n$m_\\mu$ is schematic with finitely presented base change, and until it exists **clause (1) is not\nestablished**, which the draft says.\n\n</details>\n\n**Flaw 13** [MAJOR] — An honest GAP marker, automatic FAIL.\n\n<details><summary>(GAP B, line 52) · the finding</summary>\n\nIt restates r1's Flaw 1 correctly (\"a Noetherian space having DCC\nand so minimal rather than maximal members — the finite subsets of $\\mathbb{A}^1$ are union-closed with\nno maximal one\"), deletes the invalid step rather than papering over it, records the failed repair\nroute with its counterexample, and names precisely what would close it. **Fillable, and cheaply**: see\n§B — one appendix entry from `mirkovic2007geometric` pp. 4–5. This is the single highest-value action\nthe run identifies.\n\n</details>\n\n**Flaw 14** [MAJOR] — The ledger records clause (4)'s first branch as conditional on GAP B alone.\n\n<details><summary>(Step 16 and the `## Caveats` ledger: \"Conditional on GAP B: … clause (4)'s first\nbranch\") · the finding</summary>\n\nStep 16 discharges it by\nwriting \"so clause (1) covers the family generating [Satake]\" — and clause (1) is what the same ledger,\ntwo lines later, records as **not established**. On the reading that makes the branch worth stating —\nthat under the stage reading the whole generating family really is bounded inside some $Z_F$ — the\nbranch is conditional on GAP A(b) as well, and neither Step 16's header nor the ledger says so. This is\nthe one place in the write-up where a clause declared unestablished is quietly consumed elsewhere. The\nfix is bookkeeping, not mathematics: \"conditional on GAP B and on clause (1)\". I note the weaker reading\nunder which Step 16 would be sound — that the branch asserts only that clause (1)'s *hypothesis* is met\nby every kernel — but on that reading the branch delivers nothing to the parent, which is what makes it\nthe wrong reading.\n\n</details>\n\n**Flaw 15** [MINOR] — Clause (4)'s second branch asserts three things: that under the pointwise reading\n$\\omega_{K\\backslash\\mathrm{Gr}}$ **is coherent**, that its support is $|\\mathrm{Gr}|$, and that no finite\n$F$ bounds it.\n\n<details><summary>(Step 15, \"If the letter of [coherent] admits $\\omega_{K\\backslash\\mathrm{Gr}}$\") · the finding</summary>\n\nStep 15 proves the second and third and *hypothesises* the first. The missing line is\nStep 10's computation with an arbitrary smooth finite-type test in place of the point stratum, which\ncosts one sentence. So \"established outright\" in the ledger is, for this branch, established-but-for-one\nline.\n\n</details>\n\n**Flaw 16** [MINOR] — Clause (3) is conditional on GAP B *and* on Step 2's reading, since Step 14 computes\n$\\delta_\\mu\\ast\\mathrm{IC}_0$ in the $\\mathcal{D}^!$-theory.\n\n<details><summary>(`## Caveats`, \"Conditional on GAP B: … clause (3) via Step 9\") · the finding</summary>\n\nStep 14's own header says \"conditional on\nSteps 2 and 9\", and the ledger's closing sentence names Step 2 as load-bearing, so this is\nunder-reporting rather than concealment — but the ledger line should read \"via Steps 9 and 2\". Worth\nrecording because it changes the shape of the split: clause (3) is *not* independent of clause (1)'s\nmachinery.\n\n</details>\n\n**Flaw 17** [MINOR] — After the deletion of the old Step 6, Step 5's conclusion — $\\mathrm{Gr}_n$ of finite type,\n$|\\mathrm{Gr}_n|$ Noetherian — is used nowhere in an established step.\n\n<details><summary>(`## Caveats`, \"Two declared readings carry weight — … Step 5 on properness of the\nstages\") · the finding</summary>\n\nIt appears only inside GAP B's\ndiagnosis of what fails. The reading is correct and will carry weight the moment GAP B is closed (it is\nwhat supplies quasi-compactness in §B's argument), but as the draft stands the claim that it \"carries\nweight\" is forward-looking and should say so.\n\n</details>\n\n**Flaw 18** [MINOR] — Two small citation defects. Step 9 quotes `mirkovic2007geometric` p. 4 inside a proof step with no\nmarker that the source is outside the closed world; GAP B, by contrast, does mark it, so the two\npassages treat the same citation differently.\n\n<details><summary>(Step 9's \"[[mirkovic2007geometric](../../../../../../papers/mirkovic2007geometric.pdf)] p. 4\"; GAP B's \"both recorded … as *not\ncarried*\") · the finding</summary>\n\nStep 9 is saved by being explicitly conditional — it\n*grants* the statement and cites the source as orientation for why the granted thing is true — but a\nreader who takes the citation as the licence has been handed a fact with no appendix entry. And GAP B's\n\"both recorded by [Schubert]'s provenance note as *not carried*\" is accurate for\n$\\dim\\mathrm{Gr}^\\lambda=2\\rho(\\lambda)$ and not for $\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$, which that note\nnever mentions: it is absent from the entry, not declared absent by it.\n\n</details>\n\n**Flaw 19** [MINOR] — Two bare backticked object names in a file under `blueprint/` outside the appendix, against the\n\"objects are linked, never named\" guardrail.\n\n<details><summary>(Step 7, \"`def:polarized_hyperspherical` is not in `objects:`\"; GAP A(a),\n\"Declaring `bb-raskin-torsor-descent`\") · the finding</summary>\n\nBoth objects exist on disk, so nothing is hallucinated, and\nthe point of the rule — that a link is what proves the object exists — is met in substance and not in\nform. Not mathematics; recorded because the guardrail is explicit and critiques are the only exempt\nfiles.\n\n</details>\n\n## F. Disposition of r1's Flaws 6–11\n\n**Flaw 6** (closure of $L^+X$, continuity running backwards) — **closed**. Step 1 now proves $L^+X$\nclosed in $LX$ from a closed embedding $X\\subseteq\\mathbb{A}^N$, with $\\mathcal{O}^N$ cut out inside\n$t^{-n}\\mathcal{O}^N$ by the vanishing of the negative-degree coefficients; the argument is correct.\nStep 3 states \"with no closure taken\" and Step 4 no longer invokes continuity. The detour is gone.\n\n**Flaw 7** (support used past $\\{\\mathrm{Gr},LX\\}$) — **closed**, by the declaration in the `notation:`\nline.\n\n**Flaw 8** (membership in the standing class) — **closed**. Step 7 verifies smoothness, affineness,\ntransitivity of the unique Borel and connectedness of the diagonal stabiliser, and declares\n`def:polarized_hyperspherical` a needed widening.\n\n**Flaw 9** ($m_F$ attributed to the dependency) — **closed**, coined in the `notation:` line and Step 4\nnow attributes the image to Q1-L3-L1's Setup.\n\n**Flaw 10** (the $T$ clash) — **closed**. Step 8 names the clash and says which reading it takes.\n\n**Flaw 11** (nonzero $\\Rightarrow$ nonempty support) — **closed** as far as it can be: Step 11 states\nthe locality principle it uses instead of using it silently.\n\n## G. The split — the run's main deliverable\n\nr1 recommended clause (1) alone against (2)+(3)+(4). **That is now wrong**, and this round's own\nstructure says why: Step 14 puts clause (3) inside Step 2's reading, so clause (3) leans on part of\nclause (1)'s functoriality package (GAP A(d)), while being wholly independent of GAP A(b). The\nwrite-up has in effect already partitioned itself, and the split should follow its seams:\n\n- **clause (1)** — Steps 1–4 with Step 2's reading, plus GAP A. This is the whole functoriality debt:\n  finite presentation, torsor descent, $*$-versus-$!$. It is the only part blocked by a *missing claim*.\n- **clause (2)** — Steps 5–6 with Step 5's reading, plus GAP B. Pure Schubert and ind-scheme\n  combinatorics; touches no sheaf theory at all; closed outright by one appendix entry (§B).\n- **clause (3)** — Steps 7–14. The counterexample, and the thing the node's `updates/u1.md` turned on.\n  Depends on clause (2)'s torus instance and on clause (1)'s Step 2 reading, and on nothing else.\n- **clause (4)** — Steps 15–16. Bookkeeping over the other three; its second branch is all but\n  unconditional (Flaw 15), its first branch depends on both GAPs (Flaw 14).\n\nEdges: clause (1) → clause (3), clause (2) → clause (3), clause (1) → clause (4), clause (2) → clause\n(4). If only one cut is affordable, cut **clause (2) off from the rest**: it is the one part that shares\nno object, no reading and no gap with the others, and it is the one part a single appendix entry\nfinishes.\n\nTwo appendix entries the split makes obvious, in priority order: (i) `mirkovic2007geometric` pp. 4–5 —\n$\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$, the torus discreteness sentence, and $\\dim\\mathrm{Gr}^\\lambda\n=2\\rho(\\lambda)$ — which closes GAP B and, on its own, clause (3); (ii) whatever certifies $m_\\mu$\nind-finitely presented, which is the only thing standing between clause (1) and a proof.\n\nVERDICT: FAIL\n";</script>
