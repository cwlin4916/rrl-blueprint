<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L2</a><i>›</i><span>r3</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L3-L2, round 3</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L2/critiques/r3.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nFlaw numbering continues from r2 (which ended at Flaw 19), so a flaw number is unique across this\nnode's whole trail. Length is not counted, per instruction.\n\nThis is an assembly and I judged it as one: I did not ask it to prove a clause. I asked whether the\nfour children cover the parent, whether anything is consumed as established when it is only\nhypothesised, and whether the stated residual debt is the whole debt. Two of those three come back\nwrong.\n\n## A. What came back clean\n\n**Every link resolves, and nothing is hallucinated.** All nine appendix links in `uses:` —\n`gr-schubert`, `ic-0`, `conv-hecke-action`, `def-satake-subcategory`, `defn-coherent-d-mod`,\n`def-renormalized`, `ex-sheaf-placid-ind`, `not-dualizing-object`, `bb-raskin-fp-pushforward` —\nexist under `blueprint/appendix/` with the anchors the links use; the five node links resolve; and\n`key_examples.md#k9` exists and is the entry the Lemma's clause (3) names. No bib key and no\n`main.tex` label is cited anywhere in the write-up, so there is nothing to hallucinate. No entry\noutside the node's declared `objects:` is invoked. The four children's directories sit where the id\nsays. r2's Flaw 19 (bare backticked object names) is **closed**: every backticked label in this draft\nis inside a link.\n\n**The disclosure line is accurate and complete on its own terms.** All five assumed statements are\nnamed — L1, L2, L3, L4 and Q1-L3-L1 — all are marked `status: open`, and I confirm Q1-L3-L1 is used\nfor its clause (3) alone, which is where $Z_F := \\bigcup_{\\mu\\in F}Z_\\mu$ is defined. None is named\nand unused.\n\n**Three of the four clause-matches are verbatim.** L1's conclusion is the parent's clause (1) word\nfor word; L2's (i)+(ii) are the two halves of clause (2); L3's conclusion is clause (3) with\n\"member of the class of [`def:polarized_hyperspherical`]\" for \"member of the standing class\", which\n[context](../../../../../context.html) identifies (see Flaw 31). L4(1)+(2)+its closing\nsentence are clause (4)'s two branches and its closing sentence, and **L4(2) already carries\n\"provided $G\\neq1$\"** — which is exactly what makes Flaws 20, 21 and 24 flaws rather than gaps.\n\n**r2's Flaw 14 is genuinely resolved, and that deserves saying.** Step 5 now writes\n\"grants L1's (A), (B), (C) before bounding the family generating [Satake]: both debts, and clause (1)\nconsumed as hypothesised, not as established.\" That is the exact quiet discharge r2 caught, and it is\nrepaired in the strongest available form. Flaws 15 and 16 are likewise respected: Step 6 asserts all\nthree of coherence, full support and unboundedness, and Step 4 says clause (3) rests on L1's reading\nof $\\ast$ and not on L1's finite-presentation debt.\n\n**The $G\\neq1$ repair itself is mathematically right.** For $G$ connected reductive and $G\\neq1$ the\nmaximal torus is nontrivial, so $X_*(T)^+$ is infinite; $\\mathrm{Gr}_F$ is a finite union of Schubert\nclosures and each closure contains only finitely many strata by the closure order of `gr-schubert`(2);\nso $|\\mathrm{Gr}|\\not\\subseteq\\mathrm{Gr}_F$ for every finite $F$. And at $G=1$, $\\mathrm{Gr}$ is a\npoint and $F=\\{0\\}$ bounds. u2's recomputation is correct. Clauses (1), (2), (3) do not have the same\ndisease — but see Flaw 26 for the part of clause (4) that still does.\n\n## B. Numbered flaws\n\n**Flaw 20** [FATAL] — **The `## Lemma` is not the node's `## Statement`.**\n\n<details><summary>(`## Lemma`, clause (4), line 28: \"and is bounded by no finite $F$\") · the finding</summary>\n\nI diffed the two documents line by line. The\nSetup, the $\\mathrm{Gr}_F$ display, clauses (1), (2), (3), and the $Z_F$ display all match character\nfor character. Clause (4) does not. The node file (line 47) reads\n\n> $\\omega_{K\\backslash\\mathrm{Gr}}$ is then coherent with\n> $|\\operatorname{supp}\\omega_{K\\backslash\\mathrm{Gr}}| = |\\mathrm{Gr}|$ and, **as soon as\n> $G\\neq 1$**, is bounded by no finite $F$.\n\nand the draft (line 28) reads \"… and is bounded by no finite $F$.\" The draft prints the **pre-`u2`\nsentence** — the one `updates/u2.md` was written to delete, and the one u2 shows to be false at\n$G=1$. Two consequences, and both are fatal by the rubric rather than merely untidy:\n\n1. The write-up's own `## Lemma` is **false as printed**, at the one value of $G$ its own Step 6\n   identifies.\n2. The `## Proof` does not establish the `## Lemma` it prints. Step 6 says so in terms: \"so this\n   branch is delivered for $G\\neq1$ only.\" A write-up whose last step announces that it does not\n   reach its own statement is a `GAP` with the marker filed off.\n\nBoth documents are markdown; the diff is two words plus a comma. The rubric's word-for-word\ncomparison exists for exactly this, and there is no excuse for a diff. Cheap to fix — but the round\nwhose central deliverable was the clause-(4) repair shipped a write-up that does not contain it.\n\n</details>\n\n**Flaw 21** [MAJOR] — **Both sentences are false against the record as it now stands, and they point the reader the wrong\nway.**\n\n<details><summary>(Step 6, \"The parent's branch carries no such proviso\"; `## Caveats`, \"Step 6's\nproviso is the one place the children do not reach the parent's words — a defect of clause (4), for\n`/update` and not for a child.\") · the finding</summary>\n\n`/update` has run (`updates/u2.md`, dated the same day, recorded in `Q1-L3-L2_history.md`),\nthe parent's branch does carry the proviso, and L4(2)'s \"provided $G\\neq1$\" now matches it. So:\n\n- the claimed shortfall does not exist — the children reach the parent's clause (4) exactly;\n- the write-up routes a repair to an operator that has already performed it;\n- and the `## Caveats` sentence, which is the node's public statement of what remains wrong with\n  clause (4), asserts a defect that was closed before the round ended.\n\nThis is not the same flaw as 20. Flaw 20 is a stale transcription; this is a stale *finding*, and it\nsurvives even if one repairs only the Lemma block. The correct sentences are the opposite ones: the\nchildren cover the parent's clause (4) exactly, because the prover's own reading of the shortfall was\nadopted by `/update`.\n\n</details>\n\n**Flaw 22** [MAJOR] — **L1's (C) is not a widening.\n\n<details><summary>(Step 8, \"The residual debt of the whole is L1's (B) together with L2's (B)\";\n`## Caveats`, \"L1's **(C)** widens clause (ii) of [Raskin] to the $K$-quotients … Step 8 counts both\nas widenings, not absent facts.\") · the finding</summary>\n\nIt is an absent fact, and the appendix says so twice.** Read L1's own\nwords:\n\n> assumed here is that it holds on the quotient prestacks in the single instance needed … [Raskin:\n> descent for $\\mathcal{D}^!$ along a torsor] is necessary for this and, its base having to be a\n> quasi-compact quasi-separated scheme rather than a stack, **is not sufficient**.\n\nA hypothesis whose own declaration says the nearest appendix entry is *not sufficient* for it is by\ndefinition a fact no appendix entry supplies — the same category as L1's (B) and L2's (B). Two\nentries confirm it independently:\n\n- `bb-raskin-fp-pushforward`, hypotheses line: \"$S$ and $T$ are ind-schemes, **never quotient\n  stacks**, so a node working on $K\\backslash LX$ supplies the descent from the ind-scheme statement\n  itself\".\n- `bb-raskin-torsor-descent`, first note, whose title is \"**The base is a scheme, never a stack — the\n  gap a user must bridge**\", and which spells out that \"assembling those pointwise equivalences … is\n  the citing node's own work\".\n\nA \"declared widening\" is what L2's (C) is: `bb-mv-components-dimension`'s hypotheses line explicitly\nlicenses it (\"For clauses (2) and (3) the widening is the routine one\"). Nothing licenses L1's (C).\nThis is also a regression against r2's own adjudication, which disposed of GAP A(a) as fillable \"by a\ndeclared widening **plus a bridging argument**\" — the bridging argument is the missing part, and a\nmissing argument is not a widening.\n\nSo the closing sentence of Step 8 is wrong: the residual debt is **three** items, not two.\n\n</details>\n\n**Flaw 23** [MAJOR] — **The display drops the load-bearing half of L2's (B).**\n\n<details><summary>(Step 8, the display: \"$\\textbf{(B) of L2:}\\ \\ \\pi_0(\\mathrm{Gr})\\ \\cong\\\nX_*(T)/Q$\") · the finding</summary>\n\nL2's (B) reads: there is an isomorphism\n$\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ \"under which, for every $\\mu\\in X_*(T)$, the connected component of\n$\\mathrm{Gr}$ containing $L_\\mu$ is the class $\\mu + Q$.\" I grepped the draft: the word \"labelling\"\ndoes not occur in it, and neither does any paraphrase of the second clause. The prose after the\ndisplay adds only \"and $Q$ the coroot lattice.\"\n\nThe labelling is not decoration, it is the whole content, and the appendix entry says so in the note\nwritten for this node:\n\n> the step \"inside one component the dominant $\\mu$ lie in a single coset of the coroot lattice\"\n> needs the algebraic identification $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ **under which the component\n> of $L_\\mu$ is the class of $\\mu$**, and clause (1) as printed gives neither the lattice description\n> nor the labelling.\n\nThe bare isomorphism $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ is close to a formality (it is\n$\\pi_1^{\\mathrm{alg}}(G)$ under another name); the labelling is what L2 declares \"cited from\nnothing\". Stating the debt in the weaker form means the node's own record will commission an\nappendix entry that does not discharge it. (I note the task brief quotes the draft as closing on\n\"$\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ **with its labelling**\". It does not. The brief's paraphrase is\nwhat the draft should say, not what it says.)\n\n</details>\n\n**Flaw 24** [MAJOR] — **A conditional delivered in one step is consumed as unconditional in the next.**\n\n<details><summary>(Step 7, \"Steps 5 and 6 answer the question oppositely\", consumed in Step 8's\n\"Steps 2–7 supply clauses (1)–(4)\") · the finding</summary>\n\nStep 6 ends \"so\nthis branch is delivered for $G\\neq1$ only.\" Step 7 then writes, with no proviso, \"Steps 5 and 6\nanswer the question oppositely, and L4 draws what the parent draws\" — and at $G=1$ they do **not**\nanswer oppositely: branch one says every kernel is bounded, and branch two's witness\n$\\omega_{K\\backslash\\mathrm{Gr}}$ is bounded by $F=\\{0\\}$, so both readings agree. Step 7's inference\nis invalid at exactly the value of $G$ Step 6 had just excluded.\n\nThis is the *shape* of r2's Flaw 14 reappearing one step later: not a clause declared unestablished\nand consumed as established, but a clause delivered under a proviso and consumed without it. The\nrepair is one clause (\"for $G\\neq1$, Steps 5 and 6 answer the question oppositely\"), and its absence\nis what lets Step 8 claim \"Steps 2–7 supply clauses (1)–(4)\" without qualification.\n\n</details>\n\n**Flaw 25** [MAJOR] — **The assembly delivers a conditional and the node's `## Statement` is unconditional.\n\n<details><summary>(Step 8, \"the parent is their conjunction\"; Step 2, \"The parent's clause carries\nnone of the three, so all pass undischarged to Step 8\") · the finding</summary>\n\nThat is an\nhonest `GAP` under a new name, and by the rubric an automatic FAIL.** The parent's clauses (1) and\n(2) carry no hypotheses. What the write-up derives is:\n\n$$\n\\textbf{(A)}_{L1}\\wedge\\textbf{(B)}_{L1}\\wedge\\textbf{(C)}_{L1}\\ \\Rightarrow\\ \\text{clause (1)},\n\\qquad\n\\textbf{(A)}_{L2}\\wedge\\textbf{(B)}_{L2}\\wedge\\textbf{(C)}_{L2}\\ \\Rightarrow\\ \\text{clause (2)},\n$$\n\nand correspondingly for (3) and (4). Leaning on an open child's *statement* is legitimate under ADR\n0045, and I do not fault that. What is different here is that the children's statements are\n**themselves conditional on facts no appendix entry supplies**, and the children say so in terms:\nL1's (B) — \"No entry of the appendix asserts this, and it is assumed here and not cited\"; L1's (C) —\n\"is not sufficient\"; L2's (B) — \"this identification is assumed here and is cited from nothing.\" So\nproving all four children *in full* will still not prove the parent. The debt is not deferred to a\nlater round of the DAG; it is outside the DAG.\n\n**I praise the honesty without reservation.** Step 2 says \"all pass undischarged to Step 8\", Step 5\nsays \"consumed as hypothesised, not as established\", and Step 8 names the debt in a display. The old\ndraft's `GAP A`/`GAP B` markers have become the children's declared hypotheses, which is exactly what\nr2 §G asked for. **Fillable**, and the run has narrowed it well: two appendix entries close it —\n(i) the labelled algebraic $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ over the standing $k$, which is\nstandard and on nobody's page in `papers/` (`bb-mv-components-dimension` note (ii) says where the\nnearest thing is); (ii) finite presentation of the convolution morphism, which r2 already named as\n\"the only thing standing between clause (1) and a proof\". The third item, L1's (C), needs the\nbridging argument of `bb-raskin-torsor-descent`'s first note. Until those exist, the honest\ndisposition is `/update` adding the hypotheses to the parent's clauses (1) and (2) — as the children\nalready do — rather than a write-up that asserts them unconditionally and pays for them in a ledger.\n\n</details>\n\n**Flaw 26** [MAJOR] — **The $G=1$ disease is not fully cured by u2, and this is a defect of the statement, not of the\ndraft.**\n\n<details><summary>(`## Lemma` / node `## Statement`, clause (4), first sentence: \"The two readings\n… **answer this clause differently**\"; and its closing sentence) · the finding</summary>\n\nu2 records \"**Verified — nothing else in the clause moves.** … It is only the final 'bounded\nby no finite $F$' that needs $\\mathrm{Gr}$ to have infinitely many stages\". That verification is\nincomplete. At $G=1$:\n\n- the opening sentence \"The two readings … answer this clause differently\" is false — both readings\n  say coherence bounds;\n- the closing \"So boundedness is a hypothesis on the kernel until that tension is settled\" does not\n  follow, there being no tension to settle.\n\nThe proviso was attached to the sub-assertion that spends it, per the repository's convention, but\nthe two sentences that *report* the difference were left unprovisoed, and they are the sentences the\nclause exists to make. This is the same disease in the same clause, one sentence up and one sentence\ndown.\n\n**I considered `REFUTED` and stopped short**, and the record should say why. Under a strict reading —\nevery node statement is quantified over the standing setting, and $G=1$ is admitted (u2 declined\ntwice to exclude it) — clause (4)'s framing sentence is false on an admissible case I can exhibit,\nwhich is the letter of ADR 0046. Against that: the sentence is prefatory rather than assertoric, it\nintroduces the two branches that follow, and the repair's intent is unmistakable. `REFUTED` stops the\nnode, and the node is already stopped by Flaws 20–25. So: `FAIL`, with this recorded as a defect of\nthe **statement** for `/update`, needing one more insertion of the same proviso in the same clause —\nfalse *as stated*, on a scope one sentence too wide, not false in substance.\n\n</details>\n\n**Flaw 27** [MINOR] — **The ledger is presented as an enumeration and misses an item.**\n\n<details><summary>(Step 8, \"Left standing are L1's and L2's (A), (B), (C)\") · the finding</summary>\n\nL3 carries its own **(B)**, a\ndeclared widening of the ground field for clause (2) of `bb-mv-components-dimension` — the torus\ndiscreteness sentence — which is a *different* clause of the entry from the one L2's (C) widens\n(clause (3), the dimension formula). Step 8 names L1's and L2's hypotheses only. The omission does not\nchange the bottom line, because the MV entry's hypotheses line licenses the clause-(2) widening as\nroutine, but a ledger that claims to say what is left standing should be complete. (L3's (A) is\ncovered by Step 4; L4's suppositions by Steps 5–6.)\n\n</details>\n\n**Flaw 28** [MINOR] — **Mis-states the hypothesis it is naming.**\n\n<details><summary>(Step 8, the display: \"$\\textbf{(B) of L1:}\\ \\ q\\ \\text{finitely presented over}\\\n\\mathrm{Gr}_F$\") · the finding</summary>\n\nL1's (B) is about *the restriction of $q$ to\n$\\overline{LG}_F\\times^{K}L^+X$*, and $q$ maps to $K\\backslash LX$ — not to $\\mathrm{Gr}_F$. \"Finitely\npresented over $\\mathrm{Gr}_F$\" reads as relative finite presentation over a base that is not $q$'s\ntarget. What is meant is: for every finite $F$, the restriction of $q$ over the $F$-part is finitely\npresented in the sense of `bb-raskin-fp-pushforward` — schematic, with finitely presented base change\nalong any scheme. In the one display whose job is to state the residual debt exactly, a paraphrase\nthis loose is worth recording.\n\n</details>\n\n**Flaw 29** [MINOR] — \"Restates\" overstates. L1's (A) fixes $\\mathcal{F}\\ast\\mathcal{G}\\simeq q_{*,!-\\mathrm{dR}}\\,p^{!}\n(\\mathcal{F}\\boxtimes\\mathcal{G})$ \"the pushforward being that of [Raskin]\"; L3's (A) says only \"the\npull–push $q_*p^{!}$\", dropping the identification of the pushforward with Raskin's\n$f_{*,!-\\mathrm{dR}}$.\n\n<details><summary>(Step 4, \"Its **(A)** restates L1's **(A)**\") · the finding</summary>\n\nThat identification is not free — the entry's own first note says \"**There is\none pushforward on $\\mathcal{D}^!$, and its name carries a $*$**\", and separately that identification\nacross the $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ duality \"is *not* licensed\". The two (A)s are close but\nnot the same hypothesis, and the assembly asserts they are.\n\n</details>\n\n**Flaw 30** [MINOR] — **A use the entry forbids in terms, undeclared.**\n\n<details><summary>(Step 6, \"the formation of that object as in [$\\omega_{\\mathcal{Y}}$]\") · the finding</summary>\n\n`not-dualizing-object`'s third note closes:\n\"**Until it is settled, use this entry only for $\\mathcal{Y}$ an ind-scheme that is one stage — a\nplacid scheme, or a $K$-quotient of one, such as $K\\backslash\\overline{LX}_\\lambda$ — … and never for\n$\\mathcal{Y} = \\mathrm{Gr}$ or $\\mathcal{Y} = LX$.**\" Clause (4)'s second branch forms\n$\\omega_{K\\backslash\\mathrm{Gr}}$, which is the forbidden case. In substance this is not an over-read:\nthe entry's own note performs exactly this computation to *describe* the tension, and L4 supposes the\nformation rather than citing it. But the standing restriction is a hypothesis in imperative mood, and\nneither the write-up nor L4 records that it is being crossed. A stricter referee would grade this\nMAJOR; I grade it MINOR because the entry itself is the source of the observation being made.\n\n</details>\n\n**Flaw 31** [MINOR] — The parent says \"a member of the standing class\"; L3 concludes \"a member of the class of\n[`def:polarized_hyperspherical`]\".\n\n<details><summary>(Step 4, \"concludes both halves of clause (3): membership in the standing class\") · the finding</summary>\n\nThese agree only because\n[context](../../../../../context.html) line 13 defines the standing class as that entry's.\nThe assembly uses the identification without a word, and `def:polarized_hyperspherical` is not in\nthis node's `objects:`. Discharged by `context.md`, which every node inherits, so this is\nbookkeeping and not mathematics — but the equation is the whole of Step 4's first half. Worth noting\nalso that r2 recorded the old draft as *declaring* `def:polarized_hyperspherical` \"a needed widening\"\n(Flaw 8's disposition); L3 now asserts membership as a conclusion, which is a strengthening the\nparent's ledger does not mention.\n\n</details>\n\n**Flaw 32** [MINOR] — False as phrased, for the reason of Flaw 25: the parent's clauses are unconditional and the children\nare conditionals, so the parent is the conjunction of the children's *consequents*, not of the\nchildren.\n\n<details><summary>(Step 8, \"the parent is their conjunction\") · the finding</summary>\n\nThe next sentence corrects it, so this is phrasing rather than concealment — but it is the\nsentence a reader in a hurry takes away.\n\n</details>\n\n**Flaw 33** [MINOR] — L4(1) names two sources for the stage reading — `gr-schubert`(4) **and** `ex:sheaf_placid_ind`; Step 5\nnames only the second.\n\n<details><summary>(Step 5, \"the shape of [`ex:sheaf_placid_ind`]\") · the finding</summary>\n\nThe one it drops is the one carrying the caveat: `gr-schubert`(4) is printed\nIwahori-equivariantly, and that entry's hypotheses line says a node needing the spherical form\n\"is making the same reduction one parahoric up … and must say that it is doing so.\" Since L4 *supposes*\nthe shape rather than citing the clause, nothing is over-read; but the parent's step drops the half\nthat carries the obligation, and clause (4) of the `## Lemma` names it (\"the shape of that entry's\nclause (4)\"), so the write-up is inconsistent with its own statement.\n\n</details>\n\n**Flaw 34** [MINOR] — Asked whether the `objects:` line needs the new MV entry: **no, on the proof as written.**\n\n<details><summary>(the node's `objects:` line and `bb-mv-components-dimension`) · the finding</summary>\n\nThe\nwrite-up invokes no clause of it; it only *names a debt* in Step 8's display, and naming a debt is\nnot invoking an entry. Only the children invoke it, and L2, L3 declare it. But the node file's own\n`## Decomposition` paragraph links the entry, and `objects:` is where a node declares what it\ninvokes, so the two halves of `Q1-L3-L2_node.md` disagree about whether the entry is in this node's\nworld. Cleanest fix is to add it to `objects:`; that is `/update`'s or the lead-researcher's, not the\nprover's.\n\n</details>\n\n## C. Disposition of r2's standing MAJORs\n\n**Flaw 12** (GAP A, the four functoriality debts) — **relocated, correctly, and then mis-classified.**\n(d) became L1's (A), (b) became L1's (B), (a) became L1's (C). The relocation is the right disposition\nand is what r2 §G asked for. But Step 8's ledger then files (C) as a widening, which it is not\n(Flaw 22), so the parent's public accounting of GAP A is now *smaller* than GAP A was. Not resolved.\n\n**Flaw 13** — **substantially closed, honestly narrowed.** The appendix entry r2 §B\ncommissioned exists (`bb-mv-components-dimension`), was transcribed from the page, and carries both\nfacts.\n\n<details><summary>(GAP B) · the finding</summary>\n\nWhat it cannot carry — the labelled algebraic identification over the standing $k$ — is\ndeclared by L2 as its own (B), \"cited from nothing\", which is the honest disposition. This is the\nrun's best work. It is undone only by Step 8 restating that hypothesis without its labelling\n(Flaw 23).\n\n</details>\n\n**Flaw 14** (clause (4)'s first branch quietly consuming clause (1)) — **genuinely resolved.** Step 5\ngrants L1's (A), (B), (C) explicitly and says \"consumed as hypothesised, not as established\". No\nresidue.\n\n## D. On length\n\n**I agree with the prover, and the point is stronger than the prover makes it.** 1044/1500 fails\nnothing; the 1000-word split signal is a note, and ADR 0060 warns precisely against writing to a\nlimit. Cutting a disclosure to clear a signal is the wrong trade.\n\nBut observe: the material that puts the draft over 1000 is *exactly the material Flaws 20, 21 and 24\nsay is stale*. Deleting the `## Caveats` sentence \"Step 6's proviso is the one place the children do\nnot reach the parent's words\", deleting Step 6's \"The parent's branch carries no such proviso …\" and\ninserting the two words the node file already carries brings the write-up under 1000 **for free**,\nwhile making it correct. The prover's instinct not to cut was right; the round's actual repair cuts\nanyway.\n\n## E. Verdict\n\nThe four children do cover the parent — clause for clause, including the $G\\neq1$ proviso, which\nL4(2) carried before the parent did. That is the run's real deliverable and it stands. What fails is\nthe assembly's own bookkeeping: it prints the superseded clause (4) as its `## Lemma` and declines to\nprove it (Flaw 20); it reports as standing a defect `/update` closed in the same run (Flaw 21); it\nconsumes a $G\\neq1$-conditional branch unconditionally one step later (Flaw 24); and it understates\nthe residual debt in two independent ways, dropping L1's (C) altogether and half of L2's (B)\n(Flaws 22, 23) — so its closing sentence, the one the node's history has already copied out, is\nwrong. Beneath all of that, the assembly establishes a conditional where the statement is\nunconditional (Flaw 25), which is an honest gap and an automatic FAIL.\n\nThe node's statement is true — clauses (1)–(3) are, and clause (4) is except for the framing sentence\nof Flaw 26, whose scope `/update` should narrow the same way it narrowed the branch. So the verdict is\nabout the write-up, not the claim.\n\nVERDICT: FAIL\n";</script>
