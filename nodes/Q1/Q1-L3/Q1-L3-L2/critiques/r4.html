\"facts\" is not a real distinction, and the GAP's remedy list is short by an entry.**\n\n<details><summary>(Step 10, \"the three (A)s are readings the children declare rather than inherit\"; Step 11, \"three entries close it\") · the finding</summary>\n\nL1's **(A)** asserts that the action of [$\\ast$](../../../../../appendix/conv-hecke-action.html) — defined *there* by $*$-pullback and $*$-pushforward — is computed in $\\mathcal{D}^!$ as $q_{*,!-\\mathrm{dR}}\\,p^{!}$. The second note of [Raskin fp](../../../../../appendix/bb-raskin-fp-pushforward.html), the entry Step 5 cites in the same breath, says of exactly this:\n\n> **What is *not* licensed** is the identification of $f_{*,!-\\mathrm{dR}}$ with the $\\mathcal{D}^*$-pushforward $f_{*,\\mathrm{dR}}$ across the duality $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ … A node needing that identification still owes it.\n\nAn owed identification of two functors is a fact, not a reading, and it sits on the same footing as L1's (B). So Step 11's closing sentence fails as arithmetic: writing the three named entries still leaves $H_{L1}\\ni(\\mathrm{A})$, $H_{L2}\\ni(\\mathrm{A}),(\\mathrm{C})$ and $H_{L3}\\ni(\\mathrm{A}),(\\mathrm{B})$ standing, and the parent's clauses are unconditional in those too. A lead-researcher acting on the list as printed would commission three entries and not close the gap.\n\n</details>\n\n**Flaw 36** [MAJOR] [G] — **The GAP is real, honestly placed and correctly located; it is an automatic FAIL by the rubric, and the accounting around it is right except for Flaw 35.**\n\n<details><summary>(Step 11, \"**GAP:** three entries close it …\") · the finding</summary>\n\nI verified the ledger: eight declared child hypotheses (L1 (A)(B)(C), L2 (A)(B)(C), L3 (A)(B)); [MV](../../../../../appendix/bb-mv-components-dimension.html)'s hypotheses line does license L2's (C) (clause (3)) and L3's (B) (clause (2)) as the routine widening, and Step 10 pairs them correctly. The three displayed facts are each real and each precisely enough stated to commission.\n\nAnswering the round's question: this is **situation 2, not 3**. Nothing here says the parent's clauses are unreachable — it says the appendix is thin. Moving the children's hypotheses onto the parent would be the wrong repair, because (B) of L1, (C) of L1 and (B) of L2 are all believed true and none is a restriction on $X$ or $G$. Four commissions close it:\n\n- **E1.** For every finite $F\\subseteq\\Lambda^+$, $\\overline{LG}_F\\times^{K}L^+X\\rightarrow LX$ is finitely presented in the sense of [Raskin fp](../../../../../appendix/bb-raskin-fp-pushforward.html) — schematic, finitely presented base change along any scheme.\n- **E2.** Clause (ii) of that entry on the $K$-quotients: for a $K$-equivariant finitely presented $f$ of ind-schemes and $\\varphi$ an open immersion, $\\varphi^{!}f_{*,!-\\mathrm{dR}}\\simeq f'_{*,!-\\mathrm{dR}}\\psi^{!}$ after $K\\backslash(-)$ — the assembly of pointwise equivalences that the first note of [Raskin descent](../../../../../appendix/bb-raskin-torsor-descent.html) leaves to the citing node.\n- **E3.** Over the standing $k$: $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ carrying the component of $L_\\mu$ to $\\mu+Q$.\n- **E4** (Flaw 35, missing from the draft's list). $\\mathcal{F}\\ast\\mathcal{G}\\simeq q_{*,!-\\mathrm{dR}}p^{!}(\\mathcal{F}\\boxtimes\\mathcal{G})$ for the $\\ast$ of [$\\ast$](../../../../../appendix/conv-hecke-action.html), under [the three standing hypotheses](../../../../../appendix/assum-intro.html)(b)'s dimension theory. Better as a fourth **ratified reading** in [context](../../../../../context.html) than as an entry: it binds L1, L3, and every other node that computes $\\ast$, and `context.md` §Ratified readings is where the repository already keeps facts of this shape.\n\n</details>\n\n**Flaw 37** [MINOR] [N] (Step 4, \"reading the parent's clash of $T$'s as $\\Lambda^+=\\mathbb{Z}^2$\")\nThe Setup binds $\\Lambda^+:=X_*(T)^+$ with $T$ the standing maximal torus, and clause (3) rebinds $T:=\\mathbb{G}_m$, so the range of \"for no $\\mu\\in\\Lambda^+$\" is ambiguous between $\\mathbb{Z}$ and $\\mathbb{Z}^2$; L3's reading is the only coherent one (a $Z_\\mu$ needs $\\mu\\in X_*(T_G)$), but Step 4 adopts it by fiat and the fix — rename clause (3)'s torus, or write $\\Lambda^+=X_*(G)$ there — is `/update`'s.\n**Flaw 38** [MINOR] [N] (clause (4), \"Assume $G\\neq 1$\" against its last sentence; Step 9's \"so it asserts nothing there\")\n[u3](../updates/u3.html)'s repair left the clause asserting a fact about $G=1$ inside a scope that excludes $G=1$, and Step 9 both proves that sentence and then says the clause asserts nothing there; `/update` should lift the degenerate remark out of the clause.\n**Flaw 39** [MINOR] [B] — The node's own `## Decomposition` still says \"the parent is their conjunction\" and \"the residual debt of the whole is exactly hypothesis **(B)** of Q1-L3-L2-L1 together with hypothesis **(B)** of Q1-L3-L2-L2\" — r3's Flaw 22 error, surviving in the record after the draft repaired it, and now contradicting Step 11 outright.\n\n<details><summary>(`Q1-L3-L2_node.md`, `## Decomposition`, last sentence) · the finding</summary>\n\n**Tidy-up.** *(one line each)* The disclosure line gives L1 as used in \"Steps 2 and 6\" though Step 5 and Steps 10–11 quote it too. \"$q|_{\\overline{LG}_F\\times^{K}L^+X}$\" restricts $q$ to a subspace of a space that is not $q$'s source as L1's (A) draws it; write the morphism out. 1395 words is 395 past the split signal, and the overrun is Steps 10–11, which is the material E1–E4 will remove.\n\n</details>\n\nVERDICT: FAIL\n";</script>
