<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L2</a><i>›</i><span>u4</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u4 — clause (3)&#x27;s torus, clause (4)&#x27;s scope, and a decomposition ledger that was wrong</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L2/updates/u4.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n**Date:** 2026-08-07\n**Operator:** `/update Q1-L3-L2`\n**Forced by:** [r4](../critiques/r4.html), Flaws 37, 38, 39 — all three named `/update` as the owner.\n\n## The defects\n\n**(a) Clause (3) rebound a symbol the Setup had already bound.** The Setup fixes $\\Lambda^+ := X_*(T)^+$ with $T$ the standing maximal torus of $G$. Clause (3) then wrote \"Let $T=\\mathbb{G}_m$ and let $X=T$ carry the action of $G = T\\times T$\", rebinding $T$ inside the clause. Its closing quantifier \"for no $\\mu\\in\\Lambda^+$\" was therefore ambiguous between $\\mathbb{Z}$ (the clause's $T$) and $\\mathbb{Z}^2$ (the Setup's). Only the second is coherent — a $Z_\\mu$ needs $\\mu\\in X_*(T_G)$ — but the statement did not say so, and [Q1-L3-L2-L3](../Q1-L3-L2-L3/index.html) adopts the second reading by fiat.\n\n**(b) [u3](u3.html) left clause (4) asserting a fact inside a scope that excludes it.** The clause opens \"Assume $G\\neq 1$\" and closed with a sentence about what happens at $G=1$. A clause cannot assume $G\\neq1$ and also assert something at $G=1$; the write-up then both proved that sentence and said the clause asserts nothing there.\n\n**(c) The `## Decomposition` still carried r3's Flaw 22 error.** It said the residual debt \"is exactly hypothesis **(B)** of Q1-L3-L2-L1 together with hypothesis **(B)** of Q1-L3-L2-L2\", and that \"the parent is their conjunction\". [r3](../critiques/r3.html) Flaw 22 showed the first false, the draft repaired it, and the node file kept the old version — so the node's own account of what it owes contradicted its own write-up.\n\n## What changed\n\n**(a)** Clause (3)'s local torus is renamed $S$, and the clause now says what the standing $T$ and $\\Lambda^+$ are in its situation:\n\n> Let $S=\\mathbb{G}_m$ and let $X=S$ carry the action of $G = S\\times S$ … The standing maximal torus is then $T=S\\times S$, so $\\Lambda^+=X_*(T)^+=\\mathbb{Z}^2$.\n\n$G$ is a torus, so every coweight is dominant and $X_*(T)^+ = X_*(T) = \\mathbb{Z}^2$. The mathematical content of the clause is unchanged; the reading L3 had to supply is now written down.\n\n**(b)** The degenerate remark is lifted out of clause (4) into its own paragraph:\n\n> **Scope of (4).** The hypothesis $G\\neq1$ is what makes the clause non-empty, not a restriction on what it says: at $G=1$ the two readings agree — $\\mathrm{Gr}$ is a point, $\\Lambda^+=\\{0\\}$, and $F=\\{0\\}$ bounds every object — so there is nothing there for the clause to distinguish.\n\nIt declares no hypothesis and no conclusion, which is what a `**Scope.**` paragraph is for.\n\n**(c)** The `## Decomposition` ledger now names **four** facts no appendix entry supplies — L1's **(A)**, **(B)**, **(C)** and L2's **(B)** — and states that the parent is *not* the conjunction of its children, because the children carry hypotheses its clauses do not.\n\n## Three columns\n\n**Verified.** All three defects, each against the file rather than against the referee's paraphrase. (a): the Setup's binding and the clause's rebinding are four lines apart in the same section. (b): the clause's first and last sentences contradict. (c): the `## Decomposition` sentence and [r3](../critiques/r3.html) Flaw 22 are quoted above and disagree.\n\n**Refuted.** Nothing. r4 raised no claim this run could not confirm.\n\n**Unverified.** r4's Flaw 35 — that L1's **(A)** is a fact the appendix names as owed, on the strength of the second note of [Raskin: pushforward along a finitely presented morphism](../../../../../appendix/bb-raskin-fp-pushforward.html). The note says what the critic says it says. Whether the right discharge is a fourth appendix entry or a **ratified reading** in [context](../../../../../context.html) — the critic's own preference, since the identification binds many nodes and not this one — is a judgement this run did not make. It is carried into the commission below rather than decided here.\n\n## Considered and not adopted\n\n**Moving the children's hypotheses onto the parent's clauses.** This was r4's *situation 3*, and it would make the assembly's conditional into the statement, closing the GAP by lowering the claim. The critic ruled explicitly for *situation 2* — \"the parent's clauses are not unreachable, the appendix is thin\" — and the four facts are ordinary functoriality that the sources plausibly carry. Weakening four clauses to avoid writing four entries would spend the statement to save the appendix, and the statement is the thing the question is about.\n\n**Re-proving in this run.** The write-up is now stale against the revised clauses (3) and (4), and the render gate's §11 will say so. That is the gate working, not a defect: the statement moved. The node is `failing` with a real GAP either way, and a fresh prover round buys nothing until the four entries exist.\n\n## Status\n\n`failing`, unchanged. [ADR 0019](../../../../../process/decisions/0019-the-update-operator.html) resets a `drafted` or `proved` node to `open` when its statement materially changes; this one was already `failing` and the GAP that makes it so is untouched by any of (a), (b), (c).\n";</script>
