<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L2</a><i>›</i><span>u2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u2 — clause (4) is false at the trivial group, and gains the proviso it was assuming</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L2/updates/u2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L3-L2](../index.html) · [history](../history.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html)\n\nRun: `/update Q1-L3-L2`, at the user's direction, immediately after the four-way split of the\nsame run and the assembly `/prove` that followed it. The lead was that assembly: asked whether\nthe four children cover the parent, its prover answered **no**, and located the shortfall in\nthe parent's own clause (4) rather than in the split.\n\n## The defect, in one sentence\n\nClause (4)'s closing sentence asserts that $\\omega_{K\\backslash\\mathrm{Gr}}$ \"is bounded by no\nfinite $F$\", and for $G = 1$ it is bounded by $F=\\{0\\}$.\n\n## What was verified\n\n**Verified — the failing case, recomputed.** For $G = 1$ the affine Grassmannian $\\mathrm{Gr}$\nis a point, $\\Lambda^+ = X_*(T)^+ = \\{0\\}$, and the single Schubert closure\n$\\overline{\\mathrm{Gr}}_0$ is all of $\\mathrm{Gr}$. So $F=\\{0\\}$ is a finite subset of\n$\\Lambda^+$ with $\\mathrm{Gr}_F = \\mathrm{Gr} \\supseteq |\\operatorname{supp}\\,\n\\omega_{K\\backslash\\mathrm{Gr}}|$, and $\\omega_{K\\backslash\\mathrm{Gr}}$ is $F$-bounded. The\nsentence is false exactly there.\n\n**Verified — nothing else in the clause moves.** The claim the clause exists to make is that\nthe two readings of $\\mathcal{D}_c$ on an ind-scheme *answer differently*, and that survives:\nunder the stage reading every kernel is bounded, and under the pointwise reading\n$\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support. It is only the final\n\"bounded by no finite $F$\" that needs $\\mathrm{Gr}$ to have infinitely many stages, which is\nwhat $G\\neq 1$ buys.\n\n**Verified — the split is not at fault and needs no change.**\n[Q1-L3-L2-L4](../Q1-L3-L2-L4/index.html)(2) already delivers its branch only under\n$G\\neq 1$; the child was written with the proviso the parent lacked. So this is the parent\ncatching up with its own decomposition, not a defect introduced by it.\n\n## The old sentence, verbatim\n\n> Under the pointwise test-scheme definition of `defn:coherent_D_mod` it does not:\n> $\\omega_{K\\backslash\\mathrm{Gr}}$ is then coherent with\n> $|\\operatorname{supp}\\omega_{K\\backslash\\mathrm{Gr}}| = |\\mathrm{Gr}|$ and is bounded by no\n> finite $F$.\n\n## The new sentence\n\nThe proviso is attached where it is spent, and named rather than hidden in a hypothesis on the\nwhole clause:\n\n> … $\\omega_{K\\backslash\\mathrm{Gr}}$ is then coherent with\n> $|\\operatorname{supp}\\omega_{K\\backslash\\mathrm{Gr}}| = |\\mathrm{Gr}|$ and, as soon as\n> $G\\neq 1$, is bounded by no finite $F$.\n\n## Considered and not adopted\n\n**Hypothesising $G\\neq 1$ for the whole node.** Rejected: clauses (1), (2) and (3) are true at\n$G=1$ — (1) and (2) vacuously or trivially, (3) by exhibiting a $G$ that is not trivial — and a\nhypothesis stated where it is not spent is one an instance checks for nothing. The repository's\nown convention is to attach a hypothesis to the clause that consumes it, which is what\n[Q1-L5-z1's u1](../../../Q1-L5/Q1-L5-z1/updates/u1.html) settled earlier in this run.\n\n**Excluding $G=1$ from the standing class in [context](../../../../../context.html).** Rejected as\nfar out of proportion: a ratified reading or a change to the standing setting is inherited by\nevery node in the repository, and this is one sentence of one clause. The degenerate group is\nalso a case the register of key examples deliberately keeps — it is where $\\mathrm{IC}_0$ is\nthe monoidal unit — so removing it from the setting would cost more than it saves.\n";</script>
