<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L2</a><i>›</i><span>u3</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>u3 — completing u2: the whole of clause (4) needs $G\neq 1$, not only its last sentence</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L2/updates/u3.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L3-L2](../index.html) · [history](../history.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html)\n\nRun: `/update Q1-L3-L2`, at the user's direction, immediately after [r3](../critiques/r3.html)\nreturned `VERDICT: FAIL`. The lead was that critique's Flaw on the incompleteness of\n[u2](u2.html) — recorded there as MAJOR, with the referee explicitly declining `REFUTED` on the\ngrounds that the offending sentence is prefatory and the node was already stopped.\n\n## The defect, in one sentence\n\n[u2](u2.html) attached the proviso $G\\neq 1$ to clause (4)'s **last** sentence only, and the\nclause's opening claim — that the two readings \"answer this clause differently\" — and its\nclosing conclusion both fail at $G=1$ as well.\n\n## What was verified\n\n**Verified — the failure is the same one, in two more places.** At $G=1$ the Grassmannian is a\npoint and $\\Lambda^+=\\{0\\}$, so $F=\\{0\\}$ bounds every object. Under *both* readings every\nkernel is then bounded: the stage reading trivially, and the pointwise reading because\n$\\omega_{K\\backslash\\mathrm{Gr}}$ is bounded by that same $F$. So the two readings **agree** at\n$G=1$, and the sentence saying they answer differently is false there, exactly as the last\nsentence was.\n\n**Verified — the closing sentence inherits it.** \"So boundedness is a hypothesis on the kernel\nuntil that tension is settled\" is the conclusion drawn from a tension that does not exist at\n$G=1$. Harmless in effect — clause (1) may carry a hypothesis that happens to be automatic —\nbut it is asserted as a consequence of something false, and the whole point of clause (4) is\nto be a careful statement about what is and is not settled.\n\n**Verified — the split still covers the parent.** [r3](../critiques/r3.html) checked all four\nchildren's statements against the parent's four clauses and confirms they cover it, the\nproviso included: [Q1-L3-L2-L4](../Q1-L3-L2-L4/index.html)(2) read \"provided\n$G\\neq 1$\" before the parent did. Nothing in this repair reaches a child.\n\n## The new form\n\nThe proviso moves to the **head of the clause**, where it governs all three sentences, and the\ndegenerate case is stated rather than left to be discovered:\n\n> **(4) Whether coherence bounds a kernel is not settled.** Assume $G\\neq 1$. […] So\n> boundedness is a hypothesis on the kernel until that tension is settled, and clause (1) is\n> stated with it. At $G=1$ the two readings agree — $\\mathrm{Gr}$ is a point, $\\Lambda^+=\\{0\\}$\n> and $F=\\{0\\}$ bounds every object — so the clause is empty there rather than false.\n\nThis is the form [u2](u2.html) should have taken. Its reasoning was right and its reach was\nshort: it repaired the sentence the prover named and did not ask which other sentences of the\nsame clause rested on the same fact.\n\n## Considered and not adopted\n\n**Leaving it, on the ground that $G=1$ is degenerate.** Rejected. The register of key examples\nkeeps the degenerate group deliberately — it is where $\\mathrm{IC}_0$ is the monoidal unit —\nand [ADR 0040](../../../../../process/decisions/0040-the-key-example-register.html) turns on\nbeing able to say what a statement does at exactly such a case. A clause that is *empty* at\n$G=1$ and a clause that is *false* there are different, and which one this is should be\nreadable off the statement.\n\n**Hypothesising $G\\neq 1$ for the whole node**, reconsidered now that the proviso governs a\nwhole clause rather than a sentence. Still rejected, for the reason [u2](u2.html) gave: clauses\n(1), (2) and (3) are true at $G=1$, and a hypothesis stated where it is not spent is one an\ninstance checks for nothing.\n\n## A note on the ordering that caused this\n\n[u2](u2.html) was written *after* the assembly `/prove` had already transcribed the statement,\nso the draft's `## Lemma` prints the superseded clause (4) and [r3](../critiques/r3.html) fails\nit on that — the write-up does not establish its own stated Lemma. The mathematics was not at\nfault and neither was the prover. A statement revision that lands between a draft and its\nreferee invalidates the draft, and the operator sequence should be `/update` first, then\n`/prove`, with no revision in between; where a prover *discovers* the defect, as here, the\nredraft has to be re-run rather than patched. Recorded in the node's history as the run's\nprocess lesson.\n";</script>
