<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L3</a><i>›</i><a href="../index.html">Q1-L3-L2</a><i>›</i><span>u1</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L2 — update u1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1/Q1-L3/Q1-L3-L2/updates/u1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[Q1-L3-L2](../index.html) · [history](../history.html) · [DAG index](../../../../../dag.html) · [appendix](../../../../../appendix/index.html)\n\n**Date:** 2026-08-06 · **Operator:** `/update Q1-L3-L2`, on an external referee passage supplied by the user · **Status before:** `open` · **Status after:** `open`\n\n## The defect, in one sentence\n\nClause (1) asserted that every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ has $|\\operatorname{supp}\\mathcal{F}|\\subseteq\\overline{\\mathrm{Gr}}_\\mu$ for a **single** $\\mu\\in\\Lambda^+$, and the closing sentence carried that single index through to $Z_\\mu$; the single index fails outright, because a single Schubert closure lies in one connected component of $\\mathrm{Gr}$; and whether *any* finite bound exists turns on a reading of $\\mathcal{D}_c$ the repository has recorded as unsettled.\n\n## The two objections, recomputed this run\n\n### A single $\\mu$ never suffices once $\\mathrm{Gr}$ is disconnected\n\nTake $T=\\mathbb{G}_m$, $X=T$ under $G=T\\times T$ acting by $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$. This is in the standing class — $T$ is smooth affine, $B=G$ acts transitively with connected (diagonal) stabilizer — and it is the torus sub-case of [K9](../../../../../key_examples/k9.html).\n\nFor a torus there are no positive coroots, so the closure order of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(2) is trivial and each Schubert closure is one orbit. By clause (1) of the same entry the orbits are indexed by $X_*(T\\times T)=\\mathbb{Z}^2$, and each is the reduced point $L_\\mu$, so\n\n$$\n\\overline{\\mathrm{Gr}}_{(a,b)}=\\{L_{(a,b)}\\}.\n$$\n\nLet $\\delta_\\mu$ be the constant $\\mathcal{D}$-module on $K\\backslash\\{L_\\mu\\}$ — coherent, by the second note of [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html), which records exactly that the constant module on a classifying stack is coherent — and put\n\n$$\n\\mathcal{F}=\\delta_{(0,0)}\\oplus\\delta_{(0,1)}.\n$$\n\nCoherence is stable under finite direct sums, since $f^!$ is, so $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$; and $|\\operatorname{supp}\\mathcal{F}|$ is two distinct points, hence lies in no $\\overline{\\mathrm{Gr}}_\\mu$.\n\nThe translate fails the same way. Here $LX=k((t))^\\times$ and $L^+X=k[[t]]^\\times$, a representative of $\\mu=(a,b)$ acts by $u\\mapsto t^{-a}ut^{b}=t^{b-a}u$, and $K$ preserves $L^+X$, so\n\n$$\nZ_{(a,b)}=t^{\\,b-a}\\,k[[t]]^\\times ,\n$$\n\nthe valuation-$(b-a)$ locus. These are pairwise disjoint. Convolution is additive, so $\\mathcal{F}\\ast\\mathrm{IC}_0$ has support $Z_{(0,0)}\\cup Z_{(0,1)}$, inside no single $Z_\\mu$.\n\n### A finite union may not suffice either, and that turns on an open tension\n\nThis is the part the passage does not reach, and it is why its own proposed repair — clause (1) with a finite $S\\subseteq\\Lambda^+$ — cannot simply be adopted. The question was already standing as [P34](../../../../../../blueprint/priorities.md) before this run.\n\n$\\mathcal{D}_c$ is defined by a *pointwise* condition ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)): $\\mathcal{F}$ is coherent when $f^!\\mathcal{F}$ is a finite complex with coherent cohomology for every smooth $f\\colon S\\to K\\backslash\\mathrm{Gr}$ with $S$ a finite-type dg-scheme. That is not the condition \"comes from a stage\".\n\nRead literally it admits $\\omega_{K\\backslash\\mathrm{Gr}}$, since $f^!\\omega=\\omega_S$ for every such $f$, and the support is all of $|\\mathrm{Gr}|$ because $j^!\\omega=\\omega_U\\neq0$ for every nonempty open $U$. As $\\Lambda^+$ is infinite and the orbits are disjoint, $|\\mathrm{Gr}|$ lies in no finite union of Schubert closures.\n\nBut the repository has already refused to settle this. The third note of [$\\omega_{\\mathcal{Y}}$](../../../../../appendix/not-dualizing-object.html) records exactly this as an **open tension**: the Kan-extension reading of $\\mathcal{D}^!$ makes $\\omega_{\\mathcal{Y}}$ coherent with full support, the colimit presentations of [sheaves on a placid ind-scheme](../../../../../appendix/ex-sheaf-placid-ind.html) and [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(4) make every object come from a stage, and the two cannot both be taken literally on an ind-scheme.\n\nThe note ends by forbidding use of the entry for $\\mathcal{Y}=\\mathrm{Gr}$ or $\\mathcal{Y}=LX$ until it is settled. So this run does **not** assert that the passage's repair is false; it asserts that the repair is true under one reading and false under the other, and that the node may not lean on either.\n\nWhat is settled either way is the shape of the fix. Under the colimit reading every kernel is bounded and clause (1) covers everything; under the pointwise reading it does not.\n\nBoth readings agree that clause (1) is correct *for a bounded kernel*, and that is what the node now states, with boundedness a named hypothesis instead of a silent assumption.\n\nThe one thing the old clause (1) got wrong under **both** readings is the single $\\mu$: the torus counterexample above needs no reading of $\\mathcal{D}_c$ at all, only the closure order and a finite direct sum.\n\n## Old statement, verbatim\n\n> **Setup.** In the standing setting of [context](../../../../../context.html), with $\\Lambda^+ := X_*(T)^+$, the Schubert closures $\\overline{\\mathrm{Gr}}_\\mu$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html), and $Z_\\mu\\subseteq|LX|$ the closed $K$-stable subset of [Q1-L3-L1](../../Q1-L3-L1/index.html)(2). For $\\mathcal{Y}\\in\\{\\mathrm{Gr}, LX\\}$ and $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y})$ write $|\\operatorname{supp}\\mathcal{G}|\\subseteq|\\mathcal{Y}|$ for the complement of the union of those open sub-ind-schemes $U\\subseteq\\mathcal{Y}$ whose $!$-restriction of $\\mathcal{G}$ vanishes. Then:\n>\n> **(1) Coherent Hecke kernels have Schubert-bounded support.** For every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ there is $\\mu\\in\\Lambda^+$ with $|\\operatorname{supp}\\mathcal{F}|\\subseteq\\overline{\\mathrm{Gr}}_\\mu$.\n>\n> **(2) Convolution with $\\mathrm{IC}_0$ does not leave $Z_\\mu$.** If $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ satisfies $|\\operatorname{supp}\\mathcal{F}|\\subseteq\\overline{\\mathrm{Gr}}_\\mu$, then the Hecke translate of the basic object [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) satisfies\n>\n> $$\n> \\left|\\operatorname{supp}\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\right|\\ \\subseteq\\ Z_\\mu .\n> $$\n>\n> Consequently every object of the generating family $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\}$ of [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) has its support contained in $Z_\\mu$ for some single $\\mu\\in\\Lambda^+$ depending on the object.\n\n## What changed\n\nThe old clause (2) — the one thing here that was never in doubt — becomes clause **(1)**, with the single $\\mu$ replaced by a finite $F\\subseteq\\Lambda^+$ and $Z_\\mu$ by the $Z_F$ that [Q1-L3-L1](../../Q1-L3-L1/index.html)(3) already defines and proves directed. Nothing about its content moves: it was always a conditional estimate, and the condition is now named — $F$-bounded — instead of being asserted.\n\nThe old clause (1) is **withdrawn**, and what replaces it is clause **(2)**: the bounded kernels are exactly those living on a stage of the presentation of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(3), the $\\mathrm{Gr}_F$ being cofinal among the stages. This is the true statement in the neighbourhood of the false one, and it is what makes clause (1)'s hypothesis checkable.\n\nThe two obstructions become clauses **(3)** and **(4)**, so that the reason the node is stated conditionally is inside the node rather than in a referee's note.\n\nClause (3) is the torus counterexample, which holds outright. Clause (4) is the open tension, stated as the conditional pair it is: under the colimit reading clause (1) covers the whole generating family of [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html), under the pointwise reading it does not.\n\nThe closing \"consequently\" sentence is deleted. It was the sentence [Q1-L3](../../index.html)(i) consumes, and it is false; what now stands in its place is clause (4)'s explicit statement that it is false, and a commissioned node for the reduction that would replace it.\n\nThe `objects:` field gains [sheaves on a placid ind-scheme](../../../../../appendix/ex-sheaf-placid-ind.html) and [$\\omega_{\\mathcal{Y}}$](../../../../../appendix/not-dualizing-object.html), the two sides of clause (4)'s tension, and [Raskin's pushforward entry](../../../../../appendix/bb-raskin-fp-pushforward.html), whose clause (ii) is the base change clause (1)'s proof runs on.\n\n## The three columns\n\n**Verified.**\n\nThe passage's torus counterexample to the single-$\\mu$ form of clause (1), recomputed above from clauses (1)–(2) of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html) rather than from the passage's paraphrase, and independently already on disk in this node's own [examples.md](../examples.html), whose `EVIDENCE: counterexample` verdict predates the passage.\n\nThe passage's computation $Z_{(a,b)}=t^{\\,b-a}L^+X$ and the disjointness of these loci.\n\nThat the passage's clause (2) — the convolution support estimate — is correct, and correct verbatim for a finite union: pullback and external product do not enlarge support, and base change against the open complement of the closed set $Z_F$ kills the restriction. [Q1-L3-L1](../../Q1-L3-L1/index.html)(3) supplies the closedness of $Z_F$, and [Raskin's pushforward entry](../../../../../appendix/bb-raskin-fp-pushforward.html)(ii) the base change.\n\nThat the failure is invisible for $G$ semisimple simply connected: there $\\Lambda^+$ is directed, since a dominant coweight in the coroot lattice is a non-negative combination of simple coroots and $\\mu+2N\\rho^\\vee$ dominates any $\\nu$ in $\\mu$'s coset for $N\\gg0$. This is why the old statement looked true.\n\n**Refuted.**\n\nThe old clause (1), and with it the old closing sentence.\n\nThe passage's §5 closing claim that \"the downstream conclusion needed for [Q1-L3](../../index.html) remains unchanged\". It does not: with (1′) gone, nothing in this node puts an arbitrary generator $\\mathcal{F}\\ast\\mathrm{IC}_0$ inside $LX^{\\mathrm{sat}}$, and [Q1-L3](../../index.html)(i) loses its first input.\n\n**Unverified, and therefore NOT asserted in the new statement.**\n\n**The passage's own proposed repair**, its (1′): that every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is bounded by a *finite* $S\\subseteq\\Lambda^+$, and with it the §5 recommendation to retitle the node \"Every coherent Hecke translate of $\\mathrm{IC}_0$ has finite $Z$-support\". It is true under the colimit reading of $\\mathcal{D}_c$ and false under the pointwise one, and [$\\omega_{\\mathcal{Y}}$](../../../../../appendix/not-dualizing-object.html) records that the repository has not chosen.\n\nThe passage's §4 diagnosis — \"the correct indexing is by finite unions\" — fixes the directedness of the index, which is real, and does not see the second question at all. The new clause (4) states both sides rather than picking one.\n\nWhether the bounded kernels *generate* what all the coherent ones do — i.e. whether\n\n$$\n\\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\ \\text{bounded}\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\nIn $\\mathcal{D}(K\\backslash\\mathrm{Gr})$ the presentation of [sheaves on a placid ind-scheme](../../../../../appendix/ex-sheaf-placid-ind.html) gives\n\n$$\n\\mathcal{F}\\simeq\\varinjlim_n\\iota_{n*}\\iota_n^!\\mathcal{F},\n$$\n\nand $-\\ast\\mathrm{IC}_0$ preserves colimits, which would settle it. But the colimit needed is one in $\\mathcal{D}^{\\mathrm{ren}}=\\mathrm{Ind}(\\mathcal{D}_c)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)), and the two do not agree for free.\n\nCommissioned as a node this run; it is the replacement for the deleted closing sentence, and [Q1-L3](../../index.html)(i) needs it.\n\nWhether $|\\operatorname{supp}(\\omega_{K\\backslash\\mathrm{Gr}}\\ast\\mathrm{IC}_0)|\\subseteq LX^{\\mathrm{sat}}$. A colimit of objects supported in the $Z_{F_n}$ is supported in the *closure* of $\\bigcup_n Z_{F_n}$, and [Q1-L3](../../index.html) is explicit that $LX^{\\mathrm{sat}}$ is not known to be closed. Not asserted anywhere.\n\nWhether the base-change entry, stated for ind-schemes, descends to the quotient stacks clause (1) is stated on. The same debt [Q1-L3-L4](../../Q1-L3-L4/index.html) carries; left to the prover to declare.\n\n## Considered and not adopted\n\n**Keeping a version of the old clause (1) restricted to compact kernels** — replacing $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ by the compacts of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathrm{Gr})$. Rejected: [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) generates from $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and from nothing else, so a node about a different generating family would not be about the Satake subcategory. The honest form of that idea is the generation question above, and it is now its own node.\n\n**Adopting the passage's (1′) with a caveat.** Rejected: a statement known to be false does not become a statement by being annotated.\n\n**Correcting clause (4) of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)**, which carries both defects — a non-directed index $\\alpha\\in\\Lambda^+$ and $\\mathcal{D}_c$ where its sources say compact — inherited from main.tex:1208 and main.tex:1221. Rejected as beyond this operator's reach: the appendix is not `/update`'s to write, and the entry is a faithful transcription of the manuscript. A caveat for its `hypotheses` field is commissioned from the lead-researcher instead, and [P34](../../../../../../blueprint/priorities.md) stays red.\n\n**Renaming $Z_F$.** Rejected: [Q1-L3-L1](../../Q1-L3-L1/index.html)(3) coins it, this node consumes it, and the two now use one symbol for one object.\n";</script>
