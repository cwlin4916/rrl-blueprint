<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L2</a><i>›</i><span>examples</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L2 — examples</h1><p class="lead">Examples illustrate; they never justify. No proof may cite this page.</p><div id="doc"></div></main><script>const SRC = "# Examples and precedent — Q1-L3-L2\n\n[node](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [papers](../../../../papers/guideline.html)\n\nWhat the literature says about the statement of [Q1-L3-L2](index.html), and explicit\ninstances of it, simplest first. This file is outside the closed world: it justifies\nbelieving or doubting the statement and no proof may cite it.\n\n**What a finding here has to match.** Three separable pieces ([ADR 0036](../../../../process/decisions/0036-an-example-says-what-it-matches.html)):\n\n- **(1)** the finiteness clause — every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ has $|\\operatorname{supp}\\mathcal{F}|\\subseteq\\overline{\\mathrm{Gr}}_\\mu$ for a **single** $\\mu\\in\\Lambda^+$;\n- **(2)** the convolution bound — Schubert-bounded $\\mathcal{F}$ gives $|\\operatorname{supp}(\\mathcal{F}\\ast\\mathrm{IC}_0)|\\subseteq Z_\\mu$;\n- **(C)** the closing sentence — every generator $\\mathcal{F}\\ast\\mathrm{IC}_0$ of [the Satake subcategories](../../../../appendix/def-satake-subcategory.html) sits in a single $Z_\\mu$.\n\n**One line of dictionary, in print.** BZSV's §7.3 computations are stated for étale sheaves\n(\"Thus the notation $\\mathrm{Shv}$ denotes, by default, étale sheaves\", p. 156), and the same\npage says \"we will freely use at later points that the same discussion transposes to the de\nRham theory\"; Mirković–Vilonen work with perverse sheaves in the classical topology over\n$\\mathbb{C}$ (p. 4). Every entry below therefore matches the node's *geometry* — the support\nof a convolution — and not its sheaf theory.\n\n## Precedent\n\n**What was searched.** On disk: `mirkovic2007geometric.pdf` pp. 4–5 and 8–16 (§3 dimension\nestimates, §4 *The Convolution product*); `BZSV.pdf` §7.3 pp. 155–159 and §7.5 pp. 162–163;\nmain.tex:1208–1227 (the colimit reduction clause (1) is drawn from). Web: two searches for a\nsupport bound on Hecke translates of the basic sheaf on a spherical loop space, returning\nnothing on point.\n\n**What was found — a contradiction to (1) and (C).** Mirković–Vilonen, *Geometric Langlands\nduality and representations of algebraic groups over commutative rings*, Ann. of Math. **166**\n(2007), p. 4 (read this run) states two things: \"*If $G=T$ is torus of rank $r$ then, as a\nreduced ind-scheme, $\\mathcal{G}r\\cong X_*(T)$, i.e., in this case the loop Grassmannian is\ndiscrete*\", and \"*the connected components of $\\mathcal{G}r$ are exactly parameterized by the\ncomponent group of $G_{\\mathcal{K}}$ … isomorphic to $\\pi_1(G)$*\"; and (2.2), the closure order\n$\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}$ iff $\\lambda-\\mu$ is a sum of positive\ncoroots. Since a sum of positive coroots lies in the coroot lattice, **a single Schubert\nclosure meets only those orbits whose coweight is congruent to $\\mu$ modulo the coroot\nlattice** — it lies in one connected component. So whenever $\\pi_1(G)=X_*(T)/\\mathbb{Z}\\Phi^\\vee\\neq 0$\nthere are coherent objects of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ — a finite direct sum of\nnonzero objects supported on two different components, and $\\mathcal{D}_c$ is closed under\nfinite direct sums — bounded by no single $\\overline{\\mathrm{Gr}}_\\mu$. This **contradicts\nclause (1)** as written, for $G$ any of $\\mathbb{G}_m$, $\\mathrm{GL}_n$, $\\mathrm{PGL}_2$ — the\ngroups of key examples [K1](../../../../key_examples/k1.html), [K4](../../../../key_examples/k4.html),\n[K5](../../../../key_examples/k5.html), [K9](../../../../key_examples/k9.html) — all inside the standing\nclass of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html),\nwhich constrains $X$ and not $\\pi_1(G)$. It leaves **(2)** untouched: (2) is conditional on the\nsupport hypothesis and is not what fails. Instance 4 below carries the failure through to\n**(C)**. For $G$ semisimple *simply connected* the obstruction is absent, $\\Lambda^+$ being\ndirected there ($\\mu_1+\\mu_2\\geq\\mu_i$, a dominant coweight in the coroot lattice being a\nnon-negative combination of simple coroots), so the defect is exactly $\\pi_1(G)\\neq 0$.\n\n**What was found — a partial precedent for (2).** Mirković–Vilonen **Lemma 4.4** with its proof\n(p. 14, read): the multiplication map is written there as\n$m\\colon\\overline{\\tilde{\\mathcal{G}r}}^{\\lambda,\\mu}\\to\\overline{\\mathcal{G}r^{\\lambda+\\mu}}$,\ni.e. the convolution of two Schubert closures lands in one Schubert closure — the group-case\nform of (2), with $Z_\\mu$ replaced by $\\overline{\\mathrm{Gr}}_{\\lambda+\\mu}$. It is stated on\n$\\mathrm{Gr}$ for perverse sheaves in the classical topology and says nothing about (1), about\n$LX$ for $X$ not a group, or about the renormalized de Rham category the node works in.\n\n**What was not found.** No source states (2) for a general smooth affine spherical $X$. The\nnatural home is BZSV §7.3, which computes exactly two cases (instances 1 and 2 below) and\ncarries the boxed caveat on p. 156 declining to state the properties of the placid sheaf\ntheory as theorems. For (1), the only statement in the record is the manuscript's own\nmain.tex:1221 — printed for $\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$, asserted as a \"we may\nassume\", and transcribed as clause (4) of\n[$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html) — and\nit carries the same single-$\\alpha$ defect. Mirković–Vilonen's own (2.1) presents\n$\\mathrm{Gr}=\\varinjlim\\mathrm{Gr}_n$ with the $\\mathrm{Gr}_n$ \"*finite dimensional schemes which\nare $G_{\\mathcal{O}}$-invariant*\" — finite unions of Schubert closures, not single ones. That is\nthe shape [Q1-L3-L1](../Q1-L3-L1/index.html)(3) already uses, and the repair the node\nneeds.\n\n## Instances\n\n### 1. Iwasawa–Tate, $X=\\mathbb{A}^1$ under $G=\\mathbb{G}_m$ — instance; (2) sharp, (1) fails\n\n**What it is.** $LX=k((t))$, $L^+X=\\mathcal{O}$, $K=L^+\\mathbb{G}_m$; BZSV's $X^l=t^{-l}\\mathcal{O}$\nand $\\delta_l=\\underline{k}_{X^l}\\langle l\\rangle$, with $\\delta_0=\\mathrm{IC}_0$.\n\n**Why it is an instance.** Smooth and affine: $\\mathbb{A}^1$ is. Spherical with connected\n$B$-stabilizers: $B=G=\\mathbb{G}_m$, open orbit $\\mathbb{A}^1\\smallsetminus\\{0\\}$, trivial\nstabilizer. Placidity ([the three standing hypotheses](../../../../appendix/assum-intro.html)(a)): BZSV p. 155 list\nIwasawa–Tate among the placid cases. This is [K1](../../../../key_examples/k1.html).\n\n**What it matches.** Clause **(2)** with the bound **attained**, under $G=\\mathbb{G}_m$,\n$\\Lambda^+=X_*(T)=\\mathbb{Z}$ and $\\overline{\\mathrm{Gr}}_\\mu=\\{L_\\mu\\}$ a reduced point (torus\ncase, MV p. 4), so that $Z_{\\mu_V}=t^{-1}\\mathcal{O}$ for the cocharacter $\\mu_V$ at which the\nHecke sheaf $T_V$ sits. It **fails clause (1)**: $\\mathbf{1}\\oplus T_V$ is coherent and\nsupported at two distinct points of the discrete $\\mathrm{Gr}$, so no single\n$\\overline{\\mathrm{Gr}}_\\mu$ contains it. It does not reach **(C)**, which survives here because\nthese $Z_\\mu$ happen to be nested.\n\n**What the statement says here.** BZSV footnote 62 (p. 163, read): with $V$ the standard\nrepresentation, $T_V\\star\\delta_0=\\delta_1\\langle-1\\rangle$ — support exactly\n$X^1=t^{-1}\\mathcal{O}=Z_{\\mu_V}$.\n\n**Source.** Ben-Zvi, Sakellaridis, Venkatesh, *Relative Langlands duality*, arXiv:2409.04677 —\nEx. 7.3.5 with (7.8), p. 158; fn. 62, p. 163. `refs.bib`: `BZSV`.\n\n### 2. Godement–Jacquet, $X=M_n$ under $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — instance; (2) slack\n\n**What it is.** $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$; $\\mathcal{T}_j$ the Hecke sheaf for $\\wedge^j\\mathrm{std}^*$,\nthe intersection complex of the minuscule stratum indexing $j$-dimensional subspaces of\n$t^{-1}\\mathcal{O}^n/\\mathcal{O}^n$.\n\n**Why it is an instance.** Smooth affine, spherical under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ with\nopen orbit $\\mathrm{GL}_n$ and connected generic stabilizer; BZSV p. 155 list it as placid.\n\n**What it matches.** Clause **(2)**, under $\\mathcal{F}=\\mathcal{T}_j$ supported on the closed\nminuscule $\\overline{\\mathrm{Gr}}_{\\mu_j}$. The bound is **slack**: the translate is supported on\n$M_{n,\\mathcal{O}}=L^+X$, strictly inside $Z_{\\mu_j}$. It does not reach (1) or (C), and\n$G=\\mathrm{GL}_n$ here has $\\pi_1(G)=\\mathbb{Z}$, so (1) fails for the same reason as instance 1.\n\n**What the statement says here.** BZSV (7.10): $\\mathcal{T}_j\\star\\delta_X=\\mathrm{I}_j\\langle j(n-j)\\rangle$\nwith $\\mathrm{I}_j$ \"*supported on $M_{n,\\mathcal{O}}$*\".\n\n**Source.** `BZSV`, Ex. 7.3.7 with (7.10), p. 159.\n\n### 3. The group case with $H$ simply connected — instance; both clauses hold\n\n**What it is.** $X=H$ under $G=H\\times H$, $H$ semisimple simply connected (say\n$\\mathrm{SL}_n$); $LX=LH$, $L^+X=L^+H$, $K\\backslash LX=K\\backslash\\mathrm{Gr}_H$ and\n$\\mathrm{IC}_0$ the monoidal unit ([K9](../../../../key_examples/k9.html)).\n\n**Why it is an instance.** $H$ smooth affine; the open $B\\times B^-$-orbit is the big Bruhat\ncell with connected (diagonal-torus) stabilizer.\n\n**What it matches.** **(1)** and **(2)** together, and this is the one entry where (1) holds:\n$\\pi_1(H\\times H)=0$, so $\\Lambda^+$ is directed and every coherent object is Schubert-bounded\nby a single $\\mu$. (2) is Mirković–Vilonen Lemma 4.4, and is **sharp** for\n$\\mathcal{F}=\\mathrm{IC}_\\lambda\\boxtimes\\delta_0$, where $m$ is onto $\\overline{\\mathrm{Gr}}_\\lambda$.\nWhat it does not reach: the case distinguishing (2) from the group convolution, since here\n$\\mathcal{F}\\ast\\mathrm{IC}_0=\\mathcal{F}$ and no clause of the node is exercised beyond\n$\\mathrm{Gr}$ — [K9](../../../../key_examples/k9.html) is `degenerate` for exactly this reason.\n\n**Source.** `mirkovic2007geometric`, Lemma 4.4 with its proof, p. 14; p. 4 for (2.2).\n\n### 4. Boundary — the torus group case $X=T$ under $G=T\\times T$: (C) fails\n\n**What it is.** [K9](../../../../key_examples/k9.html)'s own torus sub-case. $LX=T(F)$,\n$L^+X=T(\\mathcal{O})$, $\\mathrm{Gr}_G=X_*(T)\\times X_*(T)$ discrete, and\n$Z_{(a,b)}=t^{b-a}T(\\mathcal{O})$ — the cosets of $T(\\mathcal{O})$ in $T(F)$, **pairwise disjoint**,\neach open and closed *(constructed, unsourced — a valuation computation on MV p. 4's discrete\n$\\mathcal{G}r$)*.\n\n**Why it is an instance.** $T$ is smooth affine; $B=T\\times T$ acts transitively with connected\n(diagonal) stabilizer. In the standing class, and named in the register.\n\n**What it matches.** The closing sentence **(C)**, negatively. Take $\\mathcal{F}=\\mathbf{1}\\oplus T_V$\nas in instance 1. Then $\\mathcal{F}\\ast\\mathrm{IC}_0$ is supported in two distinct cosets, hence\nin no single $Z_\\mu$ — the family $\\{Z_\\mu\\}$ is not directed once $\\pi_1(G)\\neq 0$. It does not\ntouch (2), and it is not a hypothesis failure: every hypothesis of the node holds here.\n\n**What the statement says here.** (C) asserts a single $\\mu$ with\n$|\\operatorname{supp}(\\mathcal{F}\\ast\\mathrm{IC}_0)|\\subseteq t^{\\mu}T(\\mathcal{O})$, and the\nsupport meets two such cosets. The repair is the finite union\n$Z_F=\\bigcup_{\\mu\\in F}Z_\\mu$ of [Q1-L3-L1](../Q1-L3-L1/index.html)(3), which is directed\nand which nothing downstream needs beyond.\n\n**Source.** `mirkovic2007geometric`, p. 4 (torus case, $\\pi_0(\\mathcal{G}r)\\cong\\pi_1(G)$) and\n(2.2); `BZSV` fn. 62, p. 163 for the coherent Hecke object $T_V$.\n\n## Coverage\n\n**(1)** is contradicted by the precedent above and by instances 1, 2, 4, and holds in instance\n3 alone; **(2)** is matched by instances 1 (sharp), 2 (slack) and 3 (sharp, group case) and by\nMirković–Vilonen Lemma 4.4, in every case for an $X$ that is a vector space or a group; **(C)**\nis contradicted by instance 4. **Nothing found touches** the node's support formalism — the\ndefinition of $|\\operatorname{supp}\\mathcal{G}|$ by vanishing of $!$-restrictions on open\nsub-ind-schemes, and the step \"support of an ind-proper pushforward lies in the image of the\nsupport\" in $\\mathcal{D}^{\\mathrm{ren}}$ — and nothing found states **(2)** for a spherical $X$\nthat is neither a vector space nor a group.\n\nEVIDENCE: counterexample\n";</script>
