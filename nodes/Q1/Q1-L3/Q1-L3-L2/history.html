<header class="bar"><nav class="crumbs"><a href="../../../../dag.html">the DAG</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L2</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L2 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L2 — history\n\n[Q1-L3-L2](index.html) · [Q1-L3](../index.html) · [DAG index](../../../../dag.html) · [appendix](../../../../appendix/index.html) · [context](../../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-06 — created** by `/decompose Q1-L3`: the convolution support estimate that clause (i) of [Q1-L3](../index.html) uses without stating it. The estimate is what buys the bound: a Hecke translate of the basic object is a pushforward along the map [Q1-L3-L1](../Q1-L3-L1/index.html) proves ind-proper, and a pushforward is supported inside the image of the support.\n- **2026-08-06 — the two clauses are separated on purpose.** Clause (2) alone would leave the bound conditional on a support hypothesis about $\\mathcal{F}$ that nothing discharges; clause (1) discharges it, and it is a genuine finiteness statement — it is the reason the family $\\{Z_\\mu\\}$ suffices and no larger family is needed. Its input is the colimit presentation $\\mathcal{D}(\\mathrm{Gr})\\simeq\\varinjlim_\\alpha\\mathcal{D}(\\mathrm{Gr}_{\\le\\alpha})$ recorded as clause (4) of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html), whose printed form at main.tex:1221 is Iwahori-equivariant; that entry's `hypotheses` field says so, and a write-up of clause (1) must say that it is making the same reduction one parahoric up.\n- **2026-08-06 — the support of $\\mathrm{IC}_0$ is the other half of clause (2).** The estimate lands in $Z_\\mu$, and not merely in the image of some larger convolution space, because the basic object is a $!$-extension from $K\\backslash L^+X$ and so is supported in $L^+X$ — which is exactly the second factor of the convolution space defining $Z_\\mu$ in [Q1-L3-L1](../Q1-L3-L1/index.html).\n- **2026-08-06 — the statement was corrected and its closing sentence withdrawn** by `/update Q1-L3-L2`, on an external referee passage supplied by the user ([u1](updates/u1.html)). The old clause (1) claimed every coherent Hecke kernel is bounded by a **single** Schubert closure. It fails twice over. A single $\\overline{\\mathrm{Gr}}_\\mu$ lies in one connected component of $\\mathrm{Gr}$, because the closure order of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(2) moves within a coset of the coroot lattice — the passage's counterexample, and already on disk in this node's own [examples.md](examples.html) with verdict `EVIDENCE: counterexample` before the passage arrived. And, independently, whether *any* finite bound exists turns on which reading of $\\mathcal{D}_c$ is in force — pointwise by [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html), which admits $\\omega_{K\\backslash\\mathrm{Gr}}$ with full support, or \"comes from a stage\" by the colimit presentation, which does not. The old clause (2), the only thing here never in doubt, survives verbatim as the new clause (1) with $\\mu$ widened to a finite $F$ and $Z_\\mu$ to the $Z_F$ that [Q1-L3-L1](../Q1-L3-L1/index.html)(3) already proves directed.\n- **2026-08-06 — the passage's own repair was refuted, and that is the finding worth keeping.** It proposed clause (1) with a finite $S\\subseteq\\Lambda^+$, diagnosing the defect as a non-directed index. That fixes the first failure and does not see the second. Whether a finite union suffices is the coherent-versus-compact question [context](../../../../context.html) names as one of the two conventions that silently break proofs — every \"comes from a stage\" result in print is about compact objects — and the third note of [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html) already records it as an **open tension** that may not be leaned on in either direction, ranked as [P34](../../../../../blueprint/priorities.md) against clause (4) of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html), which is where this node drew clause (1) from. So the passage's repair is not refuted here; it is shown to depend on an open question, and clause (4) now states both sides.\n- **2026-08-06 — what the node no longer supplies, and who now owes it.** The deleted closing sentence is exactly what [Q1-L3](../index.html)(i) consumed. Clause (1) now covers the bounded generators alone, and clause (4) says the generating family is larger under one of the two live readings, so the reduction from the whole family to the bounded ones is a real missing claim rather than a step nobody wrote down; it was commissioned this run as its own node, where it is trivial under the colimit reading and the whole difficulty under the other. Clause (3) and clause (4) are in the statement, and not left in a referee's note, so that the next reader cannot re-introduce the single-$\\mu$ form without meeting the two objects that kill it.\n- **2026-08-07 — decomposed into four sub-lemmas, one per clause**, by `/decompose Q1-L3-L2`. The statement is untouched. The immediate cause is mechanical: the round-2 [draft](proof.html) stands at 1818 words against the 1500-word cap and is the repository's one hard render-gate failure. The shape of the cut is §G of [round 2](critiques/r2.html), \"The split — the run's main deliverable\", which supersedes r1's recommendation of clause (1) against the rest and says why: Step 14 puts clause (3) inside Step 2's reading, so clause (3) leans on part of clause (1)'s functoriality package while being wholly independent of GAP A(b). The children are [Q1-L3-L2-L1](Q1-L3-L2-L1/index.html) (clause (1), Steps 1–4 with Step 2's reading and the whole of GAP A), [Q1-L3-L2-L2](Q1-L3-L2-L2/index.html) (clause (2), Steps 5–6 with Step 5's reading and GAP B), [Q1-L3-L2-L3](Q1-L3-L2-L3/index.html) (clause (3), Steps 7–14) and [Q1-L3-L2-L4](Q1-L3-L2-L4/index.html) (clause (4), Steps 15–16), with edges L1 → L3, L2 → L3, L1 → L4, L2 → L4 exactly as §G gives them, and L1 and L3 additionally declaring the dependency on [Q1-L3-L1](../Q1-L3-L1/index.html) that Steps 3, 4, 13 and GAP A consume.\n- **2026-08-07 — GAP B is closed but for one uncarried identification, and the child says so.** §B of [round 2](critiques/r2.html) verified on the page the two facts that close GAP B; they are now [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../appendix/bb-mv-components-dimension.html), transcribed this run from `papers/mirkovic2007geometric.pdf` pp. 4–5 and cited by Q1-L3-L2-L2 (clauses (1) and (3)) and by Q1-L3-L2-L3 (clause (2) alone, the torus sentence, which §B notes is all clause (3) needs). Two caveats travel with it, and neither is cosmetic: the entry is stated over $\\mathbb{C}$ and the widening of its clause (1) to the standing $k$ is *not* routine, \"the topological fundamental group of $G$\" having no meaning there; and the §B argument needs the labelled form $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ with the component of $L_\\mu$ the class of $\\mu$, which clause (1) as printed gives neither half of. Q1-L3-L2-L2 carries that labelled identification as its own hypothesis **(B)** rather than assuming it, which is what leaves one further appendix entry owed.\n\n- **2026-08-07 — split into four clause-nodes, reassembled in 1044 words, and clause (4) gained the proviso it was assuming.** Three operations in one run, at the user's direction, as part of clearing the red layer.\n\n  **The split.** `/decompose Q1-L3-L2` into [Q1-L3-L2-L1](Q1-L3-L2-L1/index.html) … [Q1-L3-L2-L4](Q1-L3-L2-L4/index.html), one per clause, on the recommendation of this node's own [r2](critiques/r2.html) §G, which supersedes r1's proposed cut and says why: Step 14 puts clause (3) inside Step 2's reading, so clause (3) leans on part of clause (1)'s functoriality package while being wholly independent of GAP A(b). Edges as §G gives them — L1 and L2 into both L3 and L4 — with L1 and L3 additionally depending on [Q1-L3-L1](../Q1-L3-L1/index.html), whose Setup supplies $Z_F$ and $m_\\mu$ and without which their statements cannot be parsed.\n\n  **Why the split was owed twice over.** The write-up was 1818 words against the 1500-word cap — the repository's one hard render-gate failure — and its two live `GAP` markers belonged to different clauses. Both are now the children's, where they can be discharged separately.\n\n  **GAP B is closed but for one uncarried identification.** The entry [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../appendix/bb-mv-components-dimension.html) was written for this in the same run. It carries the source's $\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$ over $\\mathbb{C}$, and the argument needs the *labelled* algebraic form $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ with the component of $L_\\mu$ the class of $\\mu$, over the standing $k$ — which is standard and is on nobody's page here. [Q1-L3-L2-L2](Q1-L3-L2-L2/index.html) therefore declares it as hypothesis **(B)**, marked as cited from nothing, rather than reading it out of a clause that does not say it.\n\n  **The reassembly.** `/prove Q1-L3-L2` rewrote [proof.md](proof.html) as an assembly, 1818 → **1044 words**, with no `GAP` and no step re-proving a clause. It respects the three structural corrections [r2](critiques/r2.html) made to r1's picture: clause (3) rests on clause (1)'s reading of $\\ast$ though not on its finite-presentation debt (Flaw 16); clause (4)'s first branch consumes clause (1) *as hypothesised, not as established*, which is the quiet discharge r2 caught (Flaw 14); and clause (4)'s second branch asserts all three of coherence, full support and unboundedness (Flaw 15). The residual debt of the whole is exactly hypothesis **(B)** of L1 together with hypothesis **(B)** of L2.\n\n  **The defect the reassembly found.** Asked whether the four children cover the parent, the prover answered no and located the shortfall in the parent: clause (4) asserted that $\\omega_{K\\backslash\\mathrm{Gr}}$ \"is bounded by no finite $F$\", and at $G=1$ it is bounded by $F=\\{0\\}$, since $\\mathrm{Gr}$ is then a point and $\\Lambda^+=\\{0\\}$. The clause now reads \"as soon as $G\\neq 1$\" ([u2](updates/u2.html)). [Q1-L3-L2-L4](Q1-L3-L2-L4/index.html)(2) already carried the proviso, so this is the parent catching up with its own decomposition.\n\n- **2026-08-07 — FAIL at r3, on staleness the operator sequence created; clause (4) completes its repair.** [r3](critiques/r3.html), continuing the flaw numbering from r2. The record of the repair is [u3](updates/u3.html).\n\n  **Why it failed, and what was not at fault.** [u2](updates/u2.html) was written *after* the assembly `/prove` had transcribed the statement, so the draft's `## Lemma` prints the superseded clause (4) and the write-up does not establish its own stated Lemma — a FATAL. The mathematics of the assembly was not faulted, and neither was the prover: three of r3's flaws are that one staleness in three places.\n\n  **What u2 got short.** It attached $G\\neq 1$ to clause (4)'s last sentence only. The clause's opening claim — that the two readings \"answer this clause differently\" — fails at $G=1$ for the same reason, both readings agreeing there because $F=\\{0\\}$ bounds every object on a point. [u3](updates/u3.html) moves the proviso to the **head** of the clause, where it governs all three sentences, and adds a closing sentence saying the clause is *empty* at $G=1$ rather than false. A clause empty at a degenerate case and a clause false there are different things, and which one this is should be readable off the statement.\n\n  **Two substantive corrections r3 made to the assembly's own accounting.** The residual debt is three items, not two: hypothesis **(B)** of [Q1-L3-L2-L1](Q1-L3-L2-L1/index.html), hypothesis **(C)** of the same node — which the draft had filed as a declared widening, though L1 itself says [Raskin: descent along a torsor](../../../../appendix/bb-raskin-torsor-descent.html) \"is not sufficient\" for it and that entry's own first note is titled \"The base is a scheme, never a stack — the gap a user must bridge\" — and hypothesis **(B)** of [Q1-L3-L2-L2](Q1-L3-L2-L2/index.html) **with its labelling**, the draft having stated it as a bare isomorphism $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ when the labelling of the component of $L_\\mu$ is the whole content.\n\n  **The split is confirmed sound.** r3 checked all four children's statements against the parent's four clauses and found they cover it, the proviso included; [Q1-L3-L2-L4](Q1-L3-L2-L4/index.html)(2) carried \"provided $G\\neq 1$\" before the parent did. r2's Flaw 14 is genuinely resolved.\n\n  **The process lesson, which is the run's and not this node's.** A statement revision that lands between a draft and its referee invalidates the draft. The operator sequence must be `/update` first and `/prove` second, with no revision in between; and where a prover *discovers* the statement defect mid-round, as happened here, the redraft has to be re-run rather than the statement patched underneath it.\n- **2026-08-07 — round r4: the FATAL was two words, and the gate now catches those before a referee does.** `/prove Q1-L3-L2` under [ADR 0071](../../../../process/decisions/0071-the-closed-world-is-the-appendix.html). The standing FATAL of [r3](critiques/r3.html) was that the write-up's `## Lemma` omitted clause (4)'s \"Assume $G\\neq 1$\" — a two-word transcription drift that cost a full round. `tools/check_render.py` §11 now diffs the `## Lemma` against the `## Statement` before the critic is launched, so that class of failure no longer reaches a referee. The same run's three undeclared appendix entries — [MV](../../../../appendix/bb-mv-components-dimension.html), [Raskin torsor descent](../../../../appendix/bb-raskin-torsor-descent.html) and [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) — were added to `objects:` by the orchestrator as bookkeeping, which is what ADR 0071 makes them. [r4](critiques/r4.html) closes `VERDICT: FAIL` at **878 words**, the first report on this node under the 1000-word cap and a third the length of r3; all five of its flaws carry a kind, both MAJORs are `G`, and none is `S` or `W`.\n- **2026-08-07 — what the node is actually short of is four appendix entries, not an argument.** [r4](critiques/r4.html) Flaws 35–36. The write-up's Step 11 concedes that Steps 2–4 deliver $H_{L1}\\Rightarrow(1)$, $H_{L2}\\Rightarrow(2)$, $H_{L3}\\Rightarrow(3)$ where the clauses are unconditional, so proving all four children in full would still not prove the Lemma. The referee ruled this **situation 2 and not 3** — \"the parent's clauses are not unreachable, the appendix is thin\" — and named the commissions: finite presentation of the convolution morphism over each $\\mathrm{Gr}_F$; the $K$-quotient base change bridging the first note of [Raskin torsor descent](../../../../appendix/bb-raskin-torsor-descent.html); the labelled $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ over the standing $k$; and the $\\mathcal{D}^!$ computation of [$\\ast$](../../../../appendix/conv-hecke-action.html), which it judges better as a fourth ratified reading in [context](../../../../context.html) than as an entry, since it binds many nodes. Step 11's own list said *three*, and was short by that last one.\n- **2026-08-07 — the statement was corrected in three places** by `/update Q1-L3-L2` ([u4](updates/u4.html)), on [r4](critiques/r4.html) Flaws 37, 38 and 39. Clause (3) had rebound $T$ — bound in the Setup as the standing maximal torus — to $\\mathbb{G}_m$, leaving its closing \"for no $\\mu\\in\\Lambda^+$\" ambiguous between $\\mathbb{Z}$ and $\\mathbb{Z}^2$; the local torus is now $S$ and the clause says that $T=S\\times S$ and $\\Lambda^+=\\mathbb{Z}^2$. Clause (4), after [u3](updates/u3.html), asserted a fact about $G=1$ inside a scope opening \"Assume $G\\neq 1$\"; that remark is lifted into its own **Scope of (4)** paragraph. And the `## Decomposition` still carried [r3](critiques/r3.html)'s Flaw 22 error — the residual debt as L1's (B) with L2's (B), and the parent as the conjunction of its children — both false against the repaired write-up; the ledger now names four unsupplied facts and says the parent is not that conjunction. Status stays `failing`: none of the three touches the GAP that makes it so.\n- **2026-08-07 — `## Decomposition` removed** by the repo-wide cleanup of [ADR 0074](../../../../process/decisions/0074-the-decomposition-paragraph-is-removed.html): the section was one unchecked paragraph asserting how the sub-lemmas reassemble, no gate read it, and it drifted. The children's statements and this history carry what it said; git carries the paragraph itself. No claim, status or edge changed. The paragraph's one fact that no other file carries is its residual-debt ledger, kept here: the four children establish clauses (1)–(4) **under** four facts no appendix entry supplies — finite presentation of the convolution morphism over each $\\mathrm{Gr}_F$ and the base change of open immersions on the $K$-quotients (both [Q1-L3-L2-L1](Q1-L3-L2-L1/index.html)'s), the $\\mathcal{D}^!$ reading of $\\ast$ (the same node's), and the labelled $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ over the standing $k$ ([Q1-L3-L2-L2](Q1-L3-L2-L2/index.html)'s) — so the parent is **not** the conjunction of its children ([r4](critiques/r4.html), Flaws 35–36).\n";</script>
