e — and §G supersedes r1's recommendation, which had put clause (1) alone against the other three.\n- **2026-08-07 — why the functoriality debt is carried as hypotheses (A)–(C) rather than left as a gap.** §G names this the one part of the parent blocked by a *missing claim*, and §E Flaw 12 records that GAP A(b) \"needs a new appendix entry or a proof that $m_\\mu$ is schematic with finitely presented base change, and until it exists **clause (1) is not established**\". Stating the three debts as declared hypotheses puts that missing claim in one named place and makes the node provable in a one-page write-up; §G's second recommendation — \"whatever certifies $m_\\mu$ ind-finitely presented, which is the only thing standing between clause (1) and a proof\" — is the appendix entry that will discharge hypothesis **(B)**, at which point the hypothesis is deleted and the entry cited in its place.\n- **2026-08-07 — the dependency on [Q1-L3-L1](../../Q1-L3-L1/index.html) is declared and not inherited.** The statement consumes that node's Setup (the maps $m_\\mu$ and the definition of $Z_F$) and its clause (3) (that $Z_F$ is closed, which is what makes $j$ an open immersion), exactly as the parent's write-up discloses for Steps 3, 4 and GAP A. The parent's own `depends-on` does not pass down, so the edge is written here.\n";</script>
