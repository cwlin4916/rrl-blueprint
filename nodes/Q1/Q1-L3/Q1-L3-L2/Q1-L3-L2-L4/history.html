* The parent's ledger recorded the branch as conditional on GAP B alone, then discharged it by writing \"so clause (1) covers the family generating Satake\" — while recording clause (1) two lines later as **not established**. Flaw 14 calls that \"the one place in the write-up where a clause declared unestablished is quietly consumed elsewhere\", and prescribes the bookkeeping fix: \"conditional on GAP B and on clause (1)\". Branch (1) here therefore names both, citing clause (ii) of [Q1-L3-L2-L2](../Q1-L3-L2-L2/index.html) for the boundedness and granting hypotheses **(A)**, **(B)**, **(C)** of [Q1-L3-L2-L1](../Q1-L3-L2-L1/index.html) for the bound itself. It is stated on the reading Flaw 14 says is the one worth stating — that the whole generating family really is bounded — and not on the weaker one that \"delivers nothing to the parent\".\n- **2026-08-07 — the second branch asserts the coherence it used to hypothesise.** §E Flaw 15 records that the parent's Step 15 proved the support and the unboundedness and only *hypothesised* that $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent, \"established-but-for-one line\" — the missing line being the smooth-test computation with an arbitrary finite-type test in place of the point stratum. Branch (2) puts coherence in the conclusion, where the parent's clause (4) already had it, so the one line is owed by the write-up rather than absorbed into a hypothesis.\n";</script>
