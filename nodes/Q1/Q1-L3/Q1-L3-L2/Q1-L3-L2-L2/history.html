e appendix entry finishes\". It is the split's ready leaf: pure Schubert and ind-scheme combinatorics, touching no sheaf theory at all.\n- **2026-08-07 — GAP B, what closes it, and the one thing left over.** §E Flaw 13 records GAP B as an honest gap and \"fillable, and cheaply\", and §B verifies on the page the two facts that fill it. Both are now in the closed world as [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html), transcribed this run from `papers/mirkovic2007geometric.pdf` pp. 4–5. What the entry does *not* carry is the labelled form the §B argument uses: its clause (1) prints $\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$ over $\\mathbb{C}$, with neither the lattice quotient $X_*(T)/Q$ nor the fact that the component of $L_\\mu$ is the class of $\\mu$ — the entry's second note, item (ii), says so in as many words, and adds that the nearest thing on disk is stated for $LG$ under another entry's own hypotheses. The transcriber further flags that over a general $k$ \"the topological fundamental group of $G$\" has no meaning, so the widening of clause (1) is not routine. Rather than let the write-up assume the labelled identification silently — the move the parent's critiques have twice caught — it is carried here as hypothesis **(B)**, and the ground-field widening of clause (3) alone, which *is* routine, is carried separately as hypothesis **(C)**. So this node proves cofinality from the dimension formula plus a labelled $\\pi_0$ it assumes, and the remaining obligation is one appendix entry supplying $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ with its labelling over the standing $k$.\n- **2026-08-07 — `proved` at [r1](critiques/r1.html), first round, no widening.** The write-up (1273 words, of which 349 are the verbatim statement) establishes the two clauses from [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html) and [MV](../../../../../appendix/bb-mv-components-dimension.html) alone, with the node's three declared hypotheses spent exactly where the statement says: **(A)** carries every use of finite-typeness, **(B)** is used once at Step 5 and **(C)** once at Step 6. The referee read `papers/mirkovic2007geometric.pdf` pp. 4–6 directly and confirmed the two things that make the declarations honest rather than lazy — p. 4 calls the stages \"finite dimensional schemes which are $G_{\\mathcal{O}}$-invariant\" and **not** proper, and its $\\pi_0$ sentence stops at $\\pi_1(G)$ with no lattice description and no labelling. So neither **(A)** nor **(B)** was available to cite, and neither was cited. Four MINOR flaws stand, none of them the statement's.\n\n";</script>
