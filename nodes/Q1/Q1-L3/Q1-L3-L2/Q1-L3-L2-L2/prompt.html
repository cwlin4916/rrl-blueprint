<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L2-L2</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L2-L2 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q1-L3-L2-L2 — self-contained prompt: The finite Schubert unions are cofinal among the stages of $\\mathrm{Gr}$\n\n## Task\n\nProve the target claim rigorously under exactly the stated hypotheses. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q1: When is $\\mathcal{D}_{c}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_{c}(K\\backslash LX)$?](../../../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../../../context.html), which fixes four things.\n\n**(S1) The field and the group.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, and $K = L^+G$.\n\n**(S2) The variety.** $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../../../appendix/assum-intro.html)(a)–(c).\n\n**(S3) The presentation of the loop space.** We use the $K$-placid presentation by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html).\n\n**(S4) The two sides of the equality.** Here [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\nthat is, when the Hecke translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) generate all of $\\mathcal{D}_c(K\\backslash LX)$ and not merely the subcategory [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html).\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$, checked stratum by stratum in the presentation (S3). Three are on record, each stated in full in the node named.\n\n(A1) Set-theoretic Hecke saturation is a **necessary** condition — [Q1-L3](../../index.html)(iii), under that node's hypotheses (A) and (B), of which nothing in the repository establishes (B) (2026-08-07, `/update Q1-L3`).\n\n(A2) Clean costalks along all strata are a **sufficient** condition — [Q1-L6](../../../Q1-L6/index.html).\n\n(A3) Stratumwise generation with support-cutting is **necessary and sufficient**, granted the recollement hypotheses — [Q1-L5](../../../Q1-L5/index.html).\n\nA full answer is (A3) with its hypotheses discharged for the standing class. Failing that, the question takes the bracket (A1)–(A2), with the gap between them stated.\n\n**Which $X$.** The [register](../../../../../key_examples/index.html) settles twelve cases, and its positives fall into two shapes.\n\n$X$ homogeneous with reductive stabilizer, where $K\\backslash LX$ collapses onto a smaller group's orbits on an affine Grassmannian: Gross–Prasad [K3](../../../../../key_examples/k3.html), Rankin–Selberg [K4](../../../../../key_examples/k4.html), the symplectic period [K6](../../../../../key_examples/k6.html). Each source's equivalence is Hecke-linear onto the *whole* equivariant category, which leaves the translates of [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) nothing to miss.\n\n$X$ built from a $G$-representation, where $LX$ is stratified by valuation: Iwasawa–Tate $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ [K1](../../../../../key_examples/k1.html), and the mirabolic $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ [K5](../../../../../key_examples/k5.html). K1 is the only case on the bench where clause (2) of the Conjecture is computed rather than assumed.\n\nThree properties do not decide it. Rank $1$ has the unramified conjecture in print in its weakened form alone, which establishes [the three standing hypotheses](../../../../../appendix/assum-intro.html)(c) and leaves Q1 untouched [K8](../../../../../key_examples/k8.html); the group case $X = H$ under $H\\times H$ satisfies the equality because [$\\mathrm{IC}_0$](../../../../../appendix/ic-0.html) is then the monoidal unit, exercising no clause [K9](../../../../../key_examples/k9.html); and [K6](../../../../../key_examples/k6.html)'s orbits are neither finite-dimensional nor finite-codimensional, so finite-dimensional strata are not needed either.\n\nThe one expected failure is $(\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$ [K12](../../../../../key_examples/k12.html), whose membership of the standing class is itself open ([Q1-e8](../../../Q1-e8/index.html)). Outside the class — a twisted polarization [K10](../../../../../key_examples/k10.html), a spherical root of type $N$ [K11](../../../../../key_examples/k11.html) — no statement here has an instance at all.\n\n**Where this sits.** This is a logical obligation in the proof DAG. It refines [Q1-L3-L2](../index.html). Its conclusion is required directly by [Q1-L3-L2](../index.html), [Q1-L3-L2-L3](../Q1-L3-L2-L3/index.html), [Q1-L3-L2-L4](../Q1-L3-L2-L4/index.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-07 — `proved` at [r1](critiques/r1.html), first round, no widening.** The write-up (1273 words, of which 349 are the verbatim statement) establishes the two clauses from [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html) and [MV](../../../../../appendix/bb-mv-components-dimension.html) alone, with the node's three declared hypotheses spent exactly where the statement says: **(A)** carries every use of finite-typeness, **(B)** is used once at Step 5 and **(C)** once at Step 6. The referee read `papers/mirkovic2007geometric.pdf` pp. 4–6 directly and confirmed the two things that make the declarations honest rather than lazy — p. 4 calls the stages \"finite dimensional schemes which are $G_{\\mathcal{O}}$-invariant\" and **not** proper, and its $\\pi_0$ sentence stops at $\\pi_1(G)$ with no lattice description and no labelling. So neither **(A)** nor **(B)** was available to cite, and neither was cited. Four MINOR flaws stand, none of them the statement's.\n\n## Target statement\n\n**Setup.** In the standing setting of [context](../../../../../context.html), with $G$ connected reductive over $k$, $T\\subseteq B\\subseteq G$, $K = L^+G$ and $\\mathrm{Gr}$ as in [the standing notation](../../../../../appendix/subsec-notations.html). Write $\\Lambda^+ := X_*(T)^+$, let $Q\\subseteq X_*(T)$ be the coroot lattice, let $L_\\mu\\in\\mathrm{Gr}$ and $\\overline{\\mathrm{Gr}}_\\mu$ be the point and the Schubert closure of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(1)–(2), let $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$ be the presentation of that entry's clause (3), and for a finite subset $F\\subseteq\\Lambda^+$ put\n\n$$\n\\mathrm{Gr}_F \\ := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu \\ \\subseteq\\ \\mathrm{Gr}.\n$$\n\nAssume:\n\n**(A) Proper stages.** The presentation $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(3) is an ind-proper one: every stage $\\mathrm{Gr}_n$ is a proper $k$-scheme, hence of finite type over $k$ and quasi-compact. That entry asserts the presentation and the ind-properness in one clause and its second note reasons about \"a stage of an ind-proper presentation\" without saying that the two families of stages are the same; this is the reading taken, declared here rather than inherited.\n\n**(B) Components labelled by the coweight lattice.** There is an isomorphism\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ X_*(T)/Q\n$$\n\nunder which, for every $\\mu\\in X_*(T)$, the connected component of $\\mathrm{Gr}$ containing $L_\\mu$ is the class $\\mu + Q$. Clause (1) of [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html) prints $\\pi_0(\\mathrm{Gr})\\cong G_{\\mathcal{K}}/(G_{\\mathcal{K}})^0\\cong\\pi_1(G)$ over $\\mathbb{C}$ and, as its second note (ii) records, carries neither the lattice description nor the labelling; so this identification is assumed here and is cited from nothing.\n\n**(C) Declared widening of the ground field.** [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html) is stated over $\\mathbb{C}$ and no line of the manuscript re-asserts it; its clause (3), $\\dim\\mathrm{Gr}^\\lambda = \\langle 2\\rho,\\lambda\\rangle$ for $\\lambda$ dominant with respect to $B$, is used here over the standing algebraically closed $k$ of characteristic $0$, reading $k[[t]]$ and $k((t))$ for $\\mathcal{O}$ and $\\mathcal{K}$. This is the routine widening that entry's hypotheses line permits for clause (3); the non-routine one, for clause (1), is not taken, hypothesis **(B)** replacing it.\n\nThen the subsets $\\mathrm{Gr}_F$, over the finite subsets $F\\subseteq\\Lambda^+$, are cofinal among the stages $\\mathrm{Gr}_n$: (i) for every finite $F\\subseteq\\Lambda^+$ there is an $n$ with $\\mathrm{Gr}_F\\subseteq\\mathrm{Gr}_n$, and (ii) for every $n$ there is a finite $F\\subseteq\\Lambda^+$ with $\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_F$.\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the standing notation](../../../../../appendix/subsec-notations.html) — `subsec:notations`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n### [the three standing hypotheses](../../../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../../../appendix/conj-intro.html) holds for $X$.\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda = \\mathrm{Gr}_{\\le\\lambda}$ — the affine Grassmannian by Schubert closures](../../../../../appendix/gr-schubert.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2, p. 4: the paragraph on $G_{\\mathcal{O}}$-orbits, together with (2.1) and (2.2)](../../../../../../papers/mirkovic2007geometric.pdf)] for clauses (1)–(3); main.tex:831 and main.tex:1100 for the ind-properness in clause (3); main.tex:1208 and main.tex:1221 for clause (4)). Let $G$, $T$, $W$, $K = L^+G$ and $\\mathrm{Gr}$ be as in [the standing notation](../../../../../appendix/subsec-notations.html), write $X_*(T)$ for the cocharacter lattice and $\\Lambda^+ := X_*(T)^+$ for the dominant cone.\n\n**(1) Orbits.** The group scheme $K$ acts on $\\mathrm{Gr}$ with finite-dimensional orbits, and the $K$-orbits are parameterized by the $W$-orbits in $X_*(T)$ — equivalently by $\\Lambda^+$. The orbit attached to $\\lambda$ is\n\n$$\n\\mathrm{Gr}^\\lambda = K\\cdot L_\\lambda\\ \\subset\\ \\mathrm{Gr},\n$$\n\nwhere $L_\\lambda$ is the image in $\\mathrm{Gr}$ of the point $\\lambda\\in X_*(T)\\subset LG$.\n\n**(2) Closure order.** For $\\lambda,\\mu\\in\\Lambda^+$,\n\n$$\n\\mathrm{Gr}^\\mu\\subset\\overline{\\mathrm{Gr}^\\lambda}\\quad\\text{if and only if}\\quad \\lambda-\\mu\\ \\text{is a sum of positive coroots.}\n$$\n\nThe blueprint writes $\\overline{\\mathrm{Gr}}_\\lambda := \\overline{\\mathrm{Gr}^\\lambda}$ for the closure, taken reduced.\n\n**(3) Presentation and ind-properness.** $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$, where the $\\mathrm{Gr}_n$ are finite-dimensional $K$-invariant schemes and every transition map is a closed embedding, and $\\mathrm{Gr}$ is ind-proper.\n\n**(4) Coherent sheaves come from a stage.** With $\\mathrm{Gr}_{\\le\\alpha}$ the manuscript's name for $\\overline{\\mathrm{Gr}}_\\alpha$,\n\n$$\n\\mathcal{D}(\\mathrm{Gr})\\simeq\\varinjlim_{\\alpha\\in\\Lambda^+}\\mathcal{D}\\left(\\mathrm{Gr}_{\\le\\alpha}\\right),\n$$\n\nand every $\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})$ may be written $\\mathcal{F} = \\iota_*c$ with $\\iota\\colon\\mathrm{Gr}_{\\le\\alpha}\\hookrightarrow\\mathrm{Gr}$ the closed embedding and $c\\in\\mathcal{D}_c(\\mathrm{Gr}_{\\le\\alpha})^I$, for some $\\alpha\\in\\Lambda^+$.\n\n- **hypotheses:** $G$ connected reductive. Three caveats a citing node must carry. *Ground field.* The source works over $\\mathbb{C}$, with $\\mathcal{O} = \\mathbb{C}[[z]]$ and $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing $k$ is any algebraically closed field of characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html), [$F = k((t))$](../../../../../appendix/conv-ring-of-integers.html)); the presentation in clause (4) is asserted over the standing $k$ by main.tex:1208, and clauses (1)–(3) are used at that generality on the manuscript's authority, not on the source's page. *Equivariance in clause (4).* main.tex:1221 prints the reduction $\\mathcal{F} = \\iota_*c$ for **Iwahori**-equivariant coherent objects. A node needing the spherical form — $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ written as $\\iota_*c$ with $c\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}_{\\le\\alpha})$ — is making the same reduction one parahoric up, out of the same colimit presentation, and must say that it is doing so. *Two defects in the index and the category of clause (4), which a citing node must carry.* The colimit is indexed by $\\alpha\\in\\Lambda^+$ under the closure order of clause (2), and that poset is **not directed** once $\\mathrm{Gr}$ is disconnected: $\\lambda-\\mu$ a sum of positive coroots forces $\\lambda\\equiv\\mu$ modulo the coroot lattice, so a single $\\overline{\\mathrm{Gr}}_\\alpha$ lies in one connected component. Finite unions $\\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu$ are the directed replacement, and they are cofinal among the stages of clause (3) — [Q1-L3-L2](../index.html)(2). Separately, \"$\\mathcal{F} = \\iota_*c$ for some $\\alpha$\" is a statement about **compact** objects, whereas $\\mathcal{D}_c$ is defined pointwise by [coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html) and coherent is not compact on a stack: $\\omega_{K\\backslash\\mathrm{Gr}}$ is coherent with full support and comes from no stage — [Q1-L3-L2](../index.html)(4). So clause (4) may be invoked to move an object *off* a stage, never to put an arbitrary coherent object *onto* one.\n- **note:** *Provenance, verified on the page.* Read in `papers/mirkovic2007geometric.pdf` on 2026-08-06. Printed p. 4 carries: \"For us an ind-scheme means a direct limit of family of schemes where all the maps are closed embeddings\", the display (2.1) $\\mathrm{Gr} = \\varinjlim\\mathrm{Gr}_n$ with \"the $\\mathrm{Gr}_n$ are finite dimensional schemes which are $G_{\\mathcal{O}}$-invariant\"; \"The group scheme $G_{\\mathcal{O}}$ acts on $\\mathrm{Gr}$ with finite dimensional orbits ... the $G_{\\mathcal{O}}$-orbits on $\\mathrm{Gr}$ are parameterized by the $W$-orbits in $X_*(T)$, and given $\\lambda\\in X_*(T)$ the $G_{\\mathcal{O}}$-orbit associated to $W\\lambda$ is $\\mathrm{Gr}^\\lambda = G_{\\mathcal{O}}\\cdot L_\\lambda\\subset\\mathrm{Gr}$\"; and the display (2.2) transcribed above, stated there \"for dominant $\\lambda$ and $\\mu$\". Printed p. 5 adds $\\dim(\\mathrm{Gr}^\\lambda) = 2\\rho(\\lambda)$ for dominant $\\lambda$, and the same printed p. 4 adds, in sentences this entry does not transcribe, that $\\pi_0(\\mathrm{Gr})\\cong\\pi_1(G)$ and that $\\mathrm{Gr}$ is discrete for a torus. **This entry needs and carries none of those three**, and neither the $\\pi_0$ statement nor the torus statement is to be read out of clauses (1)–(4) above: all three are transcribed in [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html), which is where a node wanting them cites.\n- **note:** *Ind-properness is the manuscript's, not the source's.* Mirković–Vilonen's p. 4 states the ind-scheme presentation and finite-dimensionality of the stages, and does not say \"proper\" on that page. The assertion in clause (3) is main.tex's: main.tex:831 states [Campbell–Dhillon: the counit is fully faithful](../../../../../appendix/thm-cd-counit.html) for ind-proper $H/K$ and applies it to $\\mathrm{Gr} = LG/L^+G$, and main.tex:1100 calls the convolution morphism $q$ of [the spherical Hecke action $\\ast$](../../../../../appendix/conv-hecke-action.html) \"the ind-proper convolution morphism\". That each individual $\\overline{\\mathrm{Gr}}_\\lambda$ is therefore a proper scheme — a closed subscheme of a stage of an ind-proper presentation — is a deduction the citing node makes, not a line of this entry.\n\n### [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[mirkovic2007geometric, §2: printed p. 4 for clauses (1) and (2), printed p. 5 for clause (3)](../../../../../../papers/mirkovic2007geometric.pdf)]; external, no main.tex label). Let $G$ be a complex connected reductive algebraic group, $\\mathcal{O} = \\mathbb{C}[[z]]$, $\\mathcal{K} = \\mathbb{C}((z))$, and $\\mathrm{Gr} = G_{\\mathcal{K}}/G_{\\mathcal{O}}$ the affine Grassmannian, taken as a reduced ind-scheme throughout as the source does. Fix a maximal torus $T\\subset G$ and a Borel $B\\supset T$, write $X_*(T)$ for the cocharacter lattice, and let $\\mathrm{Gr}^\\lambda$ be the $G_{\\mathcal{O}}$-orbits of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(1). The three clauses are **separately citable** and are stated at the source's generality; see the hypotheses line for the ground field.\n\n**(1) Components.** The connected components of $\\mathrm{Gr}$ are exactly parameterized by the component group of $G_{\\mathcal{K}}$, and that group is isomorphic to the topological fundamental group of $G$:\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ G_{\\mathcal{K}}/(G_{\\mathcal{K}})^0\\ \\cong\\ \\pi_1(G).\n$$\n\n**(2) The torus case.** If $G = T$ is a torus of rank $r$ then, as a reduced ind-scheme,\n\n$$\n\\mathrm{Gr}\\ \\cong\\ X_*(T) = \\mathrm{Hom}(\\mathbb{C}^*, T),\n$$\n\nthe right-hand side regarded as a discrete ind-scheme — a disjoint union of reduced points indexed by the lattice $X_*(T)$. In the source's words, \"in this case the loop Grassmannian is discrete\".\n\n**(3) Dimension.** If the parameter $\\lambda\\in X_*(T)$ of the orbit $\\mathrm{Gr}^\\lambda$ is chosen dominant, then\n\n$$\n\\dim\\left(\\mathrm{Gr}^\\lambda\\right)\\ =\\ \\langle 2\\rho,\\lambda\\rangle,\n$$\n\nwhere $\\rho\\in X^*(T)$ is half the sum of the positive roots with respect to $B$. (The source writes the right-hand side as $2\\rho(\\lambda)$.)\n\n- **hypotheses:** *Per clause.* Clause (1) needs $G$ connected reductive; it asserts a bijection onto a group and **not** that the group is finite — clause (2) exhibits $\\pi_0(\\mathrm{Gr})\\cong X_*(T)\\cong\\mathbb{Z}^r$, infinite for $r\\ge1$. Clause (2) needs $G = T$ a torus, and is an isomorphism of **reduced** ind-schemes only: p. 4 declares \"it suffices for our purposes to consider the spaces $G_{\\mathcal{O}}$, $G_{\\mathcal{K}}$, and $\\mathcal{G}r$ as reduced ind-schemes. We will do so for the rest of the paper\", so no non-reduced structure is asserted; a product of tori is a torus, so $G = T\\times T$ is covered. Clause (3) needs $G$ connected reductive, a choice of $B\\supset T$, and $\\lambda$ **dominant** for that choice — the formula is false for non-dominant $\\lambda$, whose orbit is $\\mathrm{Gr}^{\\lambda^+}$ for the dominant $W$-conjugate. *Ground field — a genuine narrowing, not a formality.* The source fixes $G$ **complex** with $\\mathcal{O} = \\mathbb{C}[[z]]$, $\\mathcal{K} = \\mathbb{C}((z))$, whereas the blueprint's standing base field is any algebraically closed $k$ of characteristic $0$ ([the standing notation](../../../../../appendix/subsec-notations.html), [$F = k((t))$](../../../../../appendix/conv-ring-of-integers.html)). **This entry is stated over $\\mathbb{C}$, at the source's generality, and is not asserted over the standing $k$**; unlike [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html), no line of main.tex re-asserts any of these three facts at the standing generality, so there is no manuscript authority to lean on. A node citing any clause over $k\\neq\\mathbb{C}$ is making a **declared widening** and must say so. For clauses (2) and (3) the widening is the routine one — read $\\mathbb{G}_m$ for $\\mathbb{C}^*$ and $k[[t]]$, $k((t))$ for $\\mathcal{O}$, $\\mathcal{K}$. For clause (1) it is not routine: \"the topological fundamental group of $G$\" has no meaning over a general $k$, so over $k$ the right-hand side must be replaced by the algebraic fundamental group, equivalently by $X_*(T)/Q$ with $Q$ the coroot lattice — and that replacement is not on the source's page and is **not carried by this entry**.\n- **note:** *Which combination buys what, and why neither half may be dropped.* Clauses (1) and (3) are what a finiteness argument for the stages of $\\mathrm{Gr}$ needs **together**: a quasi-compact stage meets only finitely many components, which is clause (1) doing its work, and inside one component the bound $\\langle2\\rho,\\mu\\rangle\\le\\dim\\mathrm{Gr}_n$ of clause (3) confines the dominant $\\mu$ to a bounded region of the dominant cone. Clause (2) **alone** suffices for a weaker but separately useful conclusion: when $G$ is a torus the components are single reduced points, so a quasi-compact stage meets finitely many of them and the dimension formula is not needed at all. The trap this note exists to close: **this is not a dimension argument alone.** For a torus every orbit is $0$-dimensional, so clause (3) is vacuous there and the finiteness is carried entirely by the $\\pi_0$ half — which is why neither clause (1) nor clause (3) can be dropped from the general argument. Commissioned by [round 2 of Q1-L3-L2's critique](../critiques/r2.html) §B.\n- **note:** *What this entry does not carry, and a citing node must supply.* Four things the clauses above stop short of. (i) **Openness of the components**: clause (1) counts and names them and says nothing about whether they are open, so the step \"a quasi-compact subscheme meets finitely many components\" is the citing node's deduction — the usual route is that each stage is of finite type, hence has finitely many connected components, all open in it. (ii) **The labelling of components by coweights**: the step \"inside one component the dominant $\\mu$ lie in a single coset of the coroot lattice\" needs the algebraic identification $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ **under which the component of $L_\\mu$ is the class of $\\mu$**, and clause (1) as printed gives neither the lattice description nor the labelling. [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(2) supplies only the converse implication — comparable in the closure order forces congruence mod $Q$. The nearest thing the appendix carries is the left-hand column of [Chen–Yi filtered orbit order and $\\pi_0(LX)$](../../../../../appendix/bb-chenyi-filtered-orbit-order.html)(a), $\\pi_0(LG)\\cong\\pi_1(G)\\cong\\Lambda_T/Q$, which is stated there under that entry's own symmetric-variety hypotheses and about $LG$ rather than $\\mathrm{Gr}$. (iii) **Finiteness of $\\pi_0(\\mathrm{Gr})$** — false in general, see the hypotheses line. (iv) **Any statement about $LX$** for a spherical $X$: all three clauses are about $\\mathrm{Gr}$ for a group.\n- **note:** *Provenance, verified on the page.* Read in `papers/mirkovic2007geometric.pdf` on 2026-08-07 by the lead-researcher, pages carrying the printed numbers 4 and 5 (running heads \"I. MIRKOVIĆ AND K. VILONEN\" and \"LANGLANDS DUALITY AND ALGEBRAIC GROUPS\"). Printed p. 4 opens \"Let $G$ be a complex, connected, reductive algebraic group. We write $\\mathcal{O}$ for the formal power series ring $\\mathbb{C}[[z]]$ and $\\mathcal{K}$ for its fraction field $\\mathbb{C}((z))$\", and carries verbatim: \"If $G=T$ is torus of rank $r$ then, as a reduced ind-scheme, $\\mathcal{G}r\\cong X_*(T)=\\mathrm{Hom}(\\mathbb{C}^*,T)$, i.e., in this case the loop Grassmannian is discrete\"; and \"Note also that the connected components of $\\mathcal{G}r$ are exactly parameterized by the component group of $G_{\\mathcal{K}}$, i.e., by $G_{\\mathcal{K}}/(G_{\\mathcal{K}})^0$. This latter group is isomorphic to $\\pi_1(G)$, the topological fundamental group of $G$.\" Printed p. 5 carries: \"If we choose a Borel $B$ containing $T$ and if we choose the parameter $\\lambda\\in X_*(T)$ of the orbit $\\mathcal{G}r^\\lambda$ to be dominant, then $\\dim(\\mathcal{G}r^\\lambda)=2\\rho(\\lambda)$, where $\\rho\\in X^*(T)$, as usual, is half the sum of positive roots with respect to $B$.\" The source writes $\\mathcal{G}r$ where the blueprint writes $\\mathrm{Gr}$ and $G_{\\mathcal{O}}$ where the blueprint writes $K = L^+G$. Two readings are the transcriber's and not the page's: that \"$\\mathcal{G}r\\cong X_*(T)$\" means the discrete ind-scheme on the lattice, and that $2\\rho(\\lambda)$ means the pairing $\\langle2\\rho,\\lambda\\rangle$.\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q1-L3-L4](../../Q1-L3-L4/index.html) was refuted at [r1](../../Q1-L3-L4/critiques/r1.html) on exactly the computation that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../../../appendix/ic-0.html)\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the Satake subcategories](../../../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../../../appendix/index.html) · [DAG index](../../../../../dag.html) · [context](../../../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n\n@article{mirkovic2007geometric,\n  title={Geometric Langlands duality and representations of algebraic groups over commutative rings},\n  author={Mirkovi{\\'c}, Ivan and Vilonen, Kari},\n  journal={Annals of mathematics},\n  volume={166},\n  number={1},\n  pages={95--143},\n  year={2007},\n  publisher={JSTOR}\n}\n```\n\n## The key examples this statement is tested against\n\nThe register at [key_examples.md](../../../../../key_examples/index.html) fixes the cases where the answer is known. A reading aid, outside the closed world: check the statement against it, never discharge a step with it.\n\n- **K1 — Iwasawa–Tate: $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$** *(`positive`)* — **The variety.** $\\mathbb{G}_m$ scaling the line, the simplest non-homogeneous member of the standing class — smooth affine, open orbit $\\mathbb{A}^1\\smallsetminus\\{0\\}$ with trivial stabilizer. The loop space is $LX(k) = k((t))$, stratified by valuation together with …\n- **K2 — The trivial period: $X = \\mathrm{pt}$** *(`positive`)* — **The variety.** The point, smooth affine spherical for any $G$, with $K\\backslash LX = BL^+G$. Degenerate in size and not in content — the basic object is the constant sheaf and its Hecke translates have …\n- **K3 — Gross–Prasad: $X = \\mathrm{SO}_N$ under $G = \\mathrm{SO}_N\\times\\mathrm{SO}_{N-1}$** *(`positive`)* — **The variety.** Homogeneous with reductive stabilizer, hence smooth affine, and spherical. Quotienting by the second factor identifies $K\\backslash LX \\simeq \\mathrm{SO}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{SO}_N}$, the presentation Q1-L5-e3 works in.\n- **K4 — Rankin–Selberg: $X = \\mathrm{GL}_N$ under $G = \\mathrm{GL}_N\\times\\mathrm{GL}_{N-1}$** *(`positive`)* — **The variety.** The $\\mathrm{GL}$ analogue of K3, homogeneous with $K\\backslash LX \\simeq \\mathrm{GL}(N-1,\\mathcal{O})\\backslash\\mathrm{Gr}_{\\mathrm{GL}_N}$. BZSV list it among the cases whose loop space is placid by strata of the affine Grassmannian (p. 156).\n- **K5 — Mirabolic: $X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ under $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$** *(`positive`)* — **The variety.** The dual of the Godement–Jacquet space, with $(g,v)$ acted on by $(g_1,g_2)\\mapsto(g_1^{-1}gg_2,\\, vg_2)$. Its loop quotient is the mirabolic affine Grassmannian $\\mathrm{Gr}\\times\\mathcal{V}$ with $\\mathcal{V} = \\mathbf{V}\\otimes F$, $\\dim\\mathbf{V} = n$, acted on diagonally …\n- **K6 — Symplectic (Jacquet–Rallis) period: $X = \\mathrm{GL}_{2n}/\\mathrm{Sp}_{2n}$** *(`positive`)* — **The variety.** Symmetric, hence spherical, and homogeneous with reductive stabilizer, hence smooth affine. Its dual is the Shalika-Whittaker reduction $\\check M = T^*(\\mathrm{GL}_{2n}/\\mathrm{GL}_n\\ltimes U,\\psi)$.\n- **K7 — Rankin–Selberg for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m < n-1$** *(`adjacent`)* — **The variety.** The dual is $\\check X = \\mathrm{Mat}_{m\\times n}$ acted on by $\\check G = \\mathrm{GL}_m\\times\\mathrm{GL}_n$; the automorphic side is the Rankin–Selberg period for $\\mathrm{GL}_m\\times\\mathrm{GL}_n$ outside the adjacent range covered by K4.\n- **K8 — Rank-1 affine homogeneous spherical varieties: the weakened form, in print** *(`weak`)* — **Why it is here.** This is the entry that shows the distinction this register turns on is real, and not a reading the blueprint imposed on the literature.\n- **K9 — The group case: $X = H$ under $G = H\\times H$** *(`degenerate`)* — **Why it is here.** To keep it out. BZSV §7.6.2 (pp. 168–169) identify the conjecture here with derived Satake, so the case is as settled as anything in the register — and useless as a …\n- **K10 — The Whittaker period: $M = T^*(G/\\!\\!/_{\\psi}U)$** *(`out-of-class`)* — **Why it is here.** BZSV §7.6.4 (p. 169) settle it — the dual is a point, the automorphic side is Whittaker sheaves on the Grassmannian, and the equivalence is Frenkel–Gaitsgory– Vilonen. It looks like a …\n- **K11 — $X = \\mathrm{PSL}_2/\\mathrm{PO}_2$: the class boundary** *(`out-of-class`)* — **Why it is here.** A spherical root of type $N$ puts it outside the hyperspherical setting (BZSV §7.6.5, pp. 169–170), and the conclusion changes shape rather than merely failing: the local category contains a block …\n- **K12 — $X = (\\mathrm{SL}_2\\times\\mathrm{SL}_2\\times\\mathrm{SL}_2)\\backslash(\\mathrm{Sp}_4\\times\\mathrm{Sp}_4)$** *(`negative`)* — **Why it is here.** It is the only candidate *negative* on record. Sakellaridis (arXiv:0905.4244, Ex. 8.0.1 with Thm 8.0.2 and pp. 65–66) shows that in the function-theoretic shadow the basic vector generates a proper Hecke …\n\n**No `/check-goal` run is on record for this node.**\n\n## Expected response\n\nProve or disprove. Give a counterexample if it is false, a corrected statement if it needs one, and say how the plan around this node should change. Write as a rigorous mathematician, and search the web for anything you cite.\n";</script>
