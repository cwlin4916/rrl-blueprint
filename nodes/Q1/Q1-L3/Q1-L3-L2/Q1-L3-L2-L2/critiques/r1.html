./../../../../appendix/bb-mv-components-dimension.html)'s hypotheses line permits for clause (3) and refuses the one it forbids for clause (1). No `M`.\n\nThe prover's three questions, answered. (a) Yes: Step 3 uses only $|\\mathrm{Gr}|=\\bigcup_n|\\mathrm{Gr}_n|$, closedness and $K$-invariance of the stages, plus **(A)** through Step 1 — neither **(B)** nor **(C)**. (b) Yes: **(B)** occurs exactly once, at Step 5, and Step 5's route to \"a quasi-compact stage meets finitely many components\" — finitely many $C_j$, each connected hence inside one component of $|\\mathrm{Gr}|$ — is *better* than the openness route that entry's note (i) anticipated, since it needs no openness at all. (c) The $k$-point reading is legitimate ($k$ algebraically closed, characteristic $0$, stabilisers smooth, so $\\mathrm{Gr}^\\mu(k)=K(k)\\cdot L_\\mu$ and the Cartan decomposition partitions $\\mathrm{Gr}(k)$) — but the argument does need one thing more than it, which is Flaw 1.\n\nI checked Step 7 line by line — $V=V^0\\oplus V_Q$, $\\mu^0=\\nu^0$ constant on the coset, $\\langle2\\rho,\\mu\\rangle=\\langle2\\rho,\\mu^Q\\rangle$, $c_i\\ge0$ from the non-negative inverse Cartan matrix, $\\langle\\rho,\\alpha_i^\\vee\\rangle=1$, compact simplex, discrete lattice — and it is correct, including the $GL_2$ sanity check that drops the coset hypothesis and produces the infinite family $(m,m)$. The Caveats' two degenerations ($G=T$: $\\rho=0$; $G$ semisimple simply connected: $X_*(T)=Q$) are both right. I found no `F`.\n\n**Flaw 1** [MINOR] [G] — The $k$-point criterion is justified for *closed* subsets, but $\\mathrm{Gr}^\\mu$ is only locally closed and it occurs three times — in the definition of $S_n$, in Step 3, and in Step 6.\n\n<details><summary>(location: Step 1, \"Every subset occurring below is closed in $\\mathrm{Gr}$\"; consumed at Step 6, \"$\\mathrm{Gr}^\\mu\\subseteq\\mathrm{Gr}_n$ gives $\\dim\\mathrm{Gr}^\\mu\\le d_n$\") · the finding</summary>\n\nFor Steps 3–4 this is harmless, since the inclusion is into a closed set and only $k$-points are compared. Step 6 is where it bites: $\\dim\\mathrm{Gr}^\\mu\\le d_n$ is a statement about the topological spaces, and Step 1 has licensed only $\\mathrm{Gr}^\\mu(k)\\subseteq\\mathrm{Gr}_n(k)$. The fill is one clause — $\\mathrm{Gr}^\\mu$ is reduced of finite type, hence Jacobson, so $|\\mathrm{Gr}^\\mu|\\subseteq\\overline{\\mathrm{Gr}^\\mu(k)}\\subseteq|\\mathrm{Gr}_n|$ because $|\\mathrm{Gr}_n|$ is closed — but as written the load-bearing half of the semisimple case rests on an inclusion the draft established at a different level than it uses it.\n\n</details>\n\n**Flaw 2** [MINOR] [B] (location: Step 3, \"$n := \\max_{\\mu\\in F}n_\\mu$, finite because $F$ is\") — $F=\\emptyset$ is a finite subset of $\\Lambda^+$ and the maximum is then undefined.\nFix: \"take $n=0$ if $F=\\emptyset$\", or say $F$ may be assumed non-empty since $\\mathrm{Gr}_\\emptyset=\\emptyset$.\n**Flaw 3** [MINOR] [N] — Two notation slips. $\\mathrm{Gr}_F$ is defined in the Setup for *finite* $F$ only, and Step 4 writes $\\mathrm{Gr}_{S_n}$ four steps before $S_n$ is known finite; say once that the union is meant for arbitrary subsets.\n\n<details><summary>(location: Step 4, \"$\\mathrm{Gr}_{S_n}$\"; Step 7, \"$V^0\\subseteq V$ … $V_Q\\subseteq V$\") · the finding</summary>\n\nAnd $V^0$, $V_Q$, $\\mu^0$, $\\mu^Q$ and \"the fundamental coweights\" (which here means the basis of $V_Q$ dual to $\\{\\alpha_i|_{V_Q}\\}$, not of $V$) are all coined inside inline `$…$`, against the house rule that notation is introduced in a display.\n\n</details>\n\n**Flaw 4** [MINOR] [G] — The reading is faithful to the node's `## Statement`, so this is not drift — but all three consumers ([Q1-L3-L2](../../index.html), [Q1-L3-L2-L3](../../Q1-L3-L2-L3/index.html), [Q1-L3-L2-L4](../../Q1-L3-L2-L4/index.html)) will need to push $\\mathcal{D}$-modules along these inclusions, which asks for closed immersions of schemes and not containment of subsets.\n\n<details><summary>(location: Step 1, \"No scheme structure is asserted on either side\") · the finding</summary>\n\nOne free sentence would forestall a downstream gap: every set in sight is a reduced closed subscheme of a stage (the $\\overline{\\mathrm{Gr}}_\\mu$ by [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../../appendix/gr-schubert.html)(2)'s reduced convention, the stages by clause (3)), so a set-theoretic containment between them *is* a closed immersion. Saying so costs nothing here and saves an argument there.\n\n</details>\n\nVERDICT: PASS\n";</script>
