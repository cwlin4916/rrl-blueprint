<header class="bar"><nav class="crumbs"><a href="../../../../../dag.html">the DAG</a><i>›</i><a href="../../../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-L2-L2</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-L2-L2 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-L2-L2 — The finite Schubert unions are cofinal among the stages of $\\mathrm{Gr}$\n\n[node](index.html) · [appendix](../../../../../appendix/index.html) · [context](../../../../../context.html) · [DAG index](../../../../../dag.html)\n\n- **uses:** [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(1)–(3), [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html)(3), [the standing notation](../../../../../appendix/subsec-notations.html); no `depends-on` node, this being a leaf.\n- **notation:** $\\alpha_1,\\dots,\\alpha_r$ are the simple roots of $(G,B,T)$ and $\\alpha_1^\\vee,\\dots,\\alpha_r^\\vee$ the simple coroots, $V := X_*(T)\\otimes_{\\mathbb{Z}}\\mathbb{R}$, and $|Z|$ is the underlying topological space of an (ind-)scheme $Z$ over $k$.\n\n## Lemma\n\n**Setup.** In the standing setting of [context](../../../../../context.html), with $G$ connected reductive over $k$, $T\\subseteq B\\subseteq G$, $K = L^+G$ and $\\mathrm{Gr}$ as in [the standing notation](../../../../../appendix/subsec-notations.html). Write $\\Lambda^+ := X_*(T)^+$, let $Q\\subseteq X_*(T)$ be the coroot lattice, let $L_\\mu\\in\\mathrm{Gr}$ and $\\overline{\\mathrm{Gr}}_\\mu$ be the point and the Schubert closure of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(1)–(2), let $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$ be the presentation of that entry's clause (3), and for a finite subset $F\\subseteq\\Lambda^+$ put\n\n$$\n\\mathrm{Gr}_F \\ := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu \\ \\subseteq\\ \\mathrm{Gr}.\n$$\n\nAssume:\n\n**(A) Proper stages.** The presentation $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(3) is an ind-proper one: every stage $\\mathrm{Gr}_n$ is a proper $k$-scheme, hence of finite type over $k$ and quasi-compact. That entry asserts the presentation and the ind-properness in one clause and its second note reasons about \"a stage of an ind-proper presentation\" without saying that the two families of stages are the same; this is the reading taken, declared here rather than inherited.\n\n**(B) Components labelled by the coweight lattice.** There is an isomorphism\n\n$$\n\\pi_0(\\mathrm{Gr})\\ \\cong\\ X_*(T)/Q\n$$\n\nunder which, for every $\\mu\\in X_*(T)$, the connected component of $\\mathrm{Gr}$ containing $L_\\mu$ is the class $\\mu + Q$. Clause (1) of [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html) prints $\\pi_0(\\mathrm{Gr})\\cong G_{\\mathcal{K}}/(G_{\\mathcal{K}})^0\\cong\\pi_1(G)$ over $\\mathbb{C}$ and, as its second note (ii) records, carries neither the lattice description nor the labelling; so this identification is assumed here and is cited from nothing.\n\n**(C) Declared widening of the ground field.** [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html) is stated over $\\mathbb{C}$ and no line of the manuscript re-asserts it; its clause (3), $\\dim\\mathrm{Gr}^\\lambda = \\langle 2\\rho,\\lambda\\rangle$ for $\\lambda$ dominant with respect to $B$, is used here over the standing algebraically closed $k$ of characteristic $0$, reading $k[[t]]$ and $k((t))$ for $\\mathcal{O}$ and $\\mathcal{K}$. This is the routine widening that entry's hypotheses line permits for clause (3); the non-routine one, for clause (1), is not taken, hypothesis **(B)** replacing it.\n\nThen the subsets $\\mathrm{Gr}_F$, over the finite subsets $F\\subseteq\\Lambda^+$, are cofinal among the stages $\\mathrm{Gr}_n$: (i) for every finite $F\\subseteq\\Lambda^+$ there is an $n$ with $\\mathrm{Gr}_F\\subseteq\\mathrm{Gr}_n$, and (ii) for every $n$ there is a finite $F\\subseteq\\Lambda^+$ with $\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_F$.\n\n## Proof\n\n**Step 1 — Both clauses are inclusions of subsets, and may be tested on $k$-points.**\n\n<details><summary>the argument</summary>\n\nNo scheme structure is asserted on either side of $\\mathrm{Gr}_F\\subseteq\\mathrm{Gr}_n$ or $\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_F$. Every subset occurring below is closed in $\\mathrm{Gr}$ (Step 2 for the stages; $\\mathrm{Gr}_F$ is a finite union of Schubert closures), hence meets each stage in a closed subset of a finite-type $k$-scheme, by **(A)**. Such a scheme is Jacobson, so a closed subset is the closure of its closed points, and $k$ is algebraically closed by [the standing notation](../../../../../appendix/subsec-notations.html), so its closed points are its $k$-points. Below, \"point\" means $k$-point.\n\n</details>\n\n**Step 2 — Each stage is a closed subset of $|\\mathrm{Gr}|$, the stages increase, and their union is $|\\mathrm{Gr}|$.**\n\n<details><summary>the argument</summary>\n\nBy [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../../appendix/gr-schubert.html)(3) all transition maps of $\\mathrm{Gr} = \\varinjlim_n\\mathrm{Gr}_n$ are closed embeddings, so $\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_m$ is closed for $n\\le m$ and $|\\mathrm{Gr}| = \\bigcup_n|\\mathrm{Gr}_n|$ carries the colimit topology. In that topology $|\\mathrm{Gr}_n|$ is closed, since $|\\mathrm{Gr}_n|\\cap|\\mathrm{Gr}_m| = |\\mathrm{Gr}_{\\min(n,m)}|$ is closed in $|\\mathrm{Gr}_m|$ for every $m$.\n\n</details>\n\n**Step 3 — Clause (i).**\n\n<details><summary>the argument</summary>\n\nLet $F\\subseteq\\Lambda^+$ be finite and $\\mu\\in F$. By Step 2 the point $L_\\mu$ lies in $\\mathrm{Gr}_{n_\\mu}$ for some $n_\\mu$. That stage is $K$-invariant by clause (3), so it contains the orbit $\\mathrm{Gr}^\\mu = K\\cdot L_\\mu$ of clause (1); being closed in $\\mathrm{Gr}$ by Step 2, it contains the closure $\\overline{\\mathrm{Gr}}_\\mu$ as well. Setting $n := \\max_{\\mu\\in F}n_\\mu$, finite because $F$ is, Step 2 gives $\\mathrm{Gr}_F\\subseteq\\mathrm{Gr}_n$. Hypotheses **(B)** and **(C)** are not used in this step.\n\n</details>\n\n**Step 4 — For every $n$, $\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_{S_n}$, where**\n\n<details><summary>the argument</summary>\n\n\n\n$$\nS_n\\ :=\\ \\{\\,\\mu\\in\\Lambda^+\\ :\\ \\mathrm{Gr}^\\mu\\subseteq\\mathrm{Gr}_n\\,\\}.\n$$\n\nBy clause (1) the $K$-orbits partition $\\mathrm{Gr}$ and are indexed by $\\Lambda^+$, read on $k$-points: $\\mathrm{Gr}^\\mu(k) = K(k)\\cdot L_\\mu$, and the $\\mathrm{Gr}^\\mu(k)$ partition $\\mathrm{Gr}(k)$. A point $x\\in\\mathrm{Gr}_n$ therefore lies in exactly one $\\mathrm{Gr}^\\mu$, and $K$-invariance of the stage gives $\\mathrm{Gr}^\\mu = K\\cdot x\\subseteq\\mathrm{Gr}_n$, i.e. $\\mu\\in S_n$. Hence $\\mathrm{Gr}_n = \\bigcup_{\\mu\\in S_n}\\mathrm{Gr}^\\mu\\subseteq\\bigcup_{\\mu\\in S_n}\\overline{\\mathrm{Gr}}_\\mu = \\mathrm{Gr}_{S_n}$.\n\n</details>\n\n**Step 5 — The classes $\\{\\mu+Q : \\mu\\in S_n\\}$ form a finite subset of $X_*(T)/Q$.**\n\n<details><summary>the argument</summary>\n\nBy **(A)** the stage $\\mathrm{Gr}_n$ is of finite type over $k$, so $|\\mathrm{Gr}_n|$ is noetherian and has finitely many connected components $C_1,\\dots,C_c$. Each $C_j$ is a connected subset of $|\\mathrm{Gr}|$ and so lies in a single connected component of $\\mathrm{Gr}$; thus $\\mathrm{Gr}_n$ meets at most $c$ elements of $\\pi_0(\\mathrm{Gr})$. For $\\mu\\in S_n$ we have $L_\\mu\\in\\mathrm{Gr}^\\mu\\subseteq\\mathrm{Gr}_n$, and hypothesis **(B)** identifies the component of $\\mathrm{Gr}$ through $L_\\mu$ with $\\mu+Q$. So the displayed set has at most $c$ elements. This is the only use of **(B)**.\n\n</details>\n\n**Step 6 — $\\langle2\\rho,\\mu\\rangle\\le d_n := \\dim\\mathrm{Gr}_n<\\infty$ for every $\\mu\\in S_n$.**\n\n<details><summary>the argument</summary>\n\nFiniteness of $d_n$ holds because $\\mathrm{Gr}_n$ is of finite type over $k$ by **(A)**, and $\\mathrm{Gr}^\\mu\\subseteq\\mathrm{Gr}_n$ gives $\\dim\\mathrm{Gr}^\\mu\\le d_n$. Each $\\mu\\in S_n\\subseteq\\Lambda^+$ is dominant for $B$, which is the hypothesis of clause (3) of [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html); invoked over $k$ under the declared widening **(C)**, it gives $\\dim\\mathrm{Gr}^\\mu = \\langle2\\rho,\\mu\\rangle$.\n\n</details>\n\n**Step 7 — For fixed $\\nu\\in X_*(T)$ and $d\\ge0$ the set $\\{\\mu\\in\\Lambda^+\\cap(\\nu+Q) : \\langle2\\rho,\\mu\\rangle\\le d\\}$ is finite.**\n\n<details><summary>the argument</summary>\n\nLet $V^0\\subseteq V$ be the common kernel of the roots and $V_Q\\subseteq V$ the span of the coroots. These are complementary — $\\dim V_Q = r$, $V^0$ is cut out by the $r$ independent forms $\\alpha_i$, and the pairing between $V_Q$ and the root span is nondegenerate — so $V = V^0\\oplus V_Q$, and we write $\\mu = \\mu^0+\\mu^Q$. Two elements of $\\nu+Q$ differ by an element of $Q\\subseteq V_Q$, so $\\mu^0=\\nu^0$ is fixed by the coset. Every root kills $V^0$; hence $\\langle\\alpha_i,\\mu^Q\\rangle = \\langle\\alpha_i,\\mu\\rangle\\ge0$, so $\\mu^Q$ is dominant in $V_Q$, and $\\langle2\\rho,\\mu\\rangle = \\langle2\\rho,\\mu^Q\\rangle$ because $2\\rho$ is a sum of roots. Write $\\mu^Q = \\sum_i c_i\\alpha_i^\\vee$; a dominant element of $V_Q$ is a non-negative combination of the fundamental coweights, and each of those is a non-negative combination of the simple coroots because the inverse Cartan matrix has non-negative entries, so $c_i\\ge0$. With $\\langle\\rho,\\alpha_i^\\vee\\rangle = 1$,\n\n$$\n\\langle2\\rho,\\mu\\rangle\\ =\\ 2\\sum_{i=1}^r c_i .\n$$\n\nSo $\\langle2\\rho,\\mu\\rangle\\le d$ confines $(c_1,\\dots,c_r)$ to the compact simplex $\\{c_i\\ge0,\\ \\sum_ic_i\\le d/2\\}$ and $\\mu$ to a compact subset of $V$. The lattice $X_*(T)$ is discrete in $V$, so only finitely many such $\\mu$ exist.\n\n</details>\n\n**Step 8 — Clause (ii).**\n\n<details><summary>the argument</summary>\n\nFix $n$. By Step 5 the elements of $S_n$ meet at most $c$ cosets of $Q$; by Steps 6 and 7 each such coset contains finitely many of them. So $S_n$ is finite, $F := S_n$ is a finite subset of $\\Lambda^+$, and $\\mathrm{Gr}_n\\subseteq\\mathrm{Gr}_F$ by Step 4. With Step 3 this gives both clauses. $\\square$\n\n</details>\n\n## Caveats\n\n*Neither half of Step 5 + Step 6 may be dropped*, as the second note of [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html) records. For $G=T$ a torus, $\\rho = 0$ and Step 6 is vacuous, the finiteness resting wholly on **(B)** through Step 5. For $G$ semisimple simply connected, $X_*(T)/Q$ is trivial and Step 5 is vacuous, the finiteness resting wholly on the dimension bound.\n\n*Step 4 reads clause (1)'s word \"orbit\" on $k$-points.* The entry says the $K$-orbits are parameterized by $\\Lambda^+$ with $\\mathrm{Gr}^\\mu = K\\cdot L_\\mu$; the reading used is that $\\mathrm{Gr}^\\mu(k) = K(k)\\cdot L_\\mu$ and that these sets partition $\\mathrm{Gr}(k)$, which is what makes a $K$-invariant subset a union of orbits.\n";</script>
