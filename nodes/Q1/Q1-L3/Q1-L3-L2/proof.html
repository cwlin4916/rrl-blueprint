[Raskin descent](../../../../appendix/bb-raskin-torsor-descent.html), [MV](../../../../appendix/bb-mv-components-dimension.html), [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html); [Q1-L3-L1](../Q1-L3-L1/index.html), [L1](Q1-L3-L2-L1/index.html), [L2](Q1-L3-L2-L2/index.html), [L3](Q1-L3-L2-L3/index.html), [L4](Q1-L3-L2-L4/index.html).\n- **notation:** L1–L4 abbreviate the children Q1-L3-L2-L1 … -L4.\n\n## Lemma\n\n**Setup.** In the standing setting of [context](../../../../context.html), with $\\Lambda^+ := X_*(T)^+$ and the Schubert closures $\\overline{\\mathrm{Gr}}_\\mu$ of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html). For a finite subset $F\\subseteq\\Lambda^+$ write\n\n$$\n\\mathrm{Gr}_F \\ := \\bigcup_{\\mu\\in F}\\overline{\\mathrm{Gr}}_\\mu \\ \\subseteq\\ \\mathrm{Gr},\n$$\n\nand let $Z_F\\subseteq|LX|$ be the closed $K$-stable subset of [Q1-L3-L1](../Q1-L3-L1/index.html)(3). For $\\mathcal{Y}\\in\\{\\mathrm{Gr}, LX\\}$ and $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y})$ write $|\\operatorname{supp}\\mathcal{G}|\\subseteq|\\mathcal{Y}|$ for the complement of the union of those open sub-ind-schemes $U\\subseteq\\mathcal{Y}$ whose $!$-restriction of $\\mathcal{G}$ vanishes. Call $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ *$F$-bounded* when $|\\operatorname{supp}\\mathcal{F}|\\subseteq\\mathrm{Gr}_F$, and *bounded* when it is $F$-bounded for some finite $F\\subseteq\\Lambda^+$. Then:\n\n**(1) An $F$-bounded kernel keeps $\\mathrm{IC}_0$ inside $Z_F$.** For every finite $F\\subseteq\\Lambda^+$ and every $F$-bounded $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, the Hecke translate of the basic object [$\\mathrm{IC}_0$](../../../../appendix/ic-0.html) under [the spherical Hecke action $\\ast$](../../../../appendix/conv-hecke-action.html) satisfies\n\n$$\n\\left|\\operatorname{supp}\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\right|\\ \\subseteq\\ Z_F .\n$$\n\n**(2) The bounding sets are the stages.** The subsets $\\mathrm{Gr}_F$, over the finite subsets $F\\subseteq\\Lambda^+$, are cofinal among the stages $\\mathrm{Gr}_n$ of the presentation of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(3): every $\\mathrm{Gr}_F$ is contained in some $\\mathrm{Gr}_n$, and every $\\mathrm{Gr}_n$ is contained in some $\\mathrm{Gr}_F$.\n\n**(3) One $\\mu$ does not suffice.** Let $T=\\mathbb{G}_m$ and let $X=T$ carry the action of $G = T\\times T$ by $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$ — a member of the standing class, and the torus sub-case of [K9](../../../../key_examples/k9.html). There is an $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ that is $F$-bounded for no singleton $F=\\{\\mu\\}$, and whose translate satisfies $|\\operatorname{supp}(\\mathcal{F}\\ast\\mathrm{IC}_0)|\\subseteq Z_\\mu$ for no $\\mu\\in\\Lambda^+$.\n\n**(4) Whether coherence bounds a kernel is not settled.** Assume $G\\neq 1$. The two readings of $\\mathcal{D}_c$ on an ind-scheme recorded as an open tension at [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html) answer this clause differently. Under the reading on which every object comes from a stage of the presentation of [$\\mathrm{Gr}^\\lambda$, $\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(3) — the shape of that entry's clause (4) and of [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) — clause (2) makes every kernel bounded and clause (1) covers the whole family $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\}$ that generates [the Satake subcategories](../../../../appendix/def-satake-subcategory.html). Under the pointwise test-scheme definition of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) it does not: $\\omega_{K\\backslash\\mathrm{Gr}}$ is then coherent with $|\\operatorname{supp}\\omega_{K\\backslash\\mathrm{Gr}}| = |\\mathrm{Gr}|$ and is bounded by no finite $F$. So boundedness is a hypothesis on the kernel until that tension is settled, and clause (1) is stated with it. At $G=1$ the two readings agree — $\\mathrm{Gr}$ is a point, $\\Lambda^+=\\{0\\}$ and $F=\\{0\\}$ bounds every object — so the clause is empty there rather than false.\n\n## Proof\n\n**Step 1 — The children read the parent's Setup, so no clause needs translating.**\n\n<details><summary>the argument</summary>\n\n[L1](Q1-L3-L2-L1/index.html) repeats it verbatim — $\\mathrm{Gr}_F$, $Z_F$, $|\\operatorname{supp}(-)|$ on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathcal{Y})$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../../appendix/def-renormalized.html)) and $F$-boundedness in $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ ([coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html)); [L2](Q1-L3-L2-L2/index.html) repeats the display defining $\\mathrm{Gr}_F$; [L3](Q1-L3-L2-L3/index.html) and [L4](Q1-L3-L2-L4/index.html) adopt it by name.\n\n</details>\n\n**Step 2 — Clause (1) is L1's conclusion, given L1's declared hypotheses.**\n\n<details><summary>the argument</summary>\n\nWrite\n\n$$\nH_{Li}\\ :=\\ \\text{the conjunction of the hypotheses the child } Li \\text{ declares} .\n$$\n\nL1 concludes $|\\operatorname{supp}(\\mathcal{F}\\ast\\mathrm{IC}_0)|\\subseteq Z_F$ for every finite $F\\subseteq\\Lambda^+$ and every $F$-bounded $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ — clause (1) word for word. The parent's clause carries no part of $H_{L1}$, which therefore passes undischarged to Step 10.\n\n</details>\n\n**Step 3 — Clause (2) is L2's conclusion, given $H_{L2}$.**\n\n<details><summary>the argument</summary>\n\nIts (i) and (ii) — every $\\mathrm{Gr}_F$ inside some $\\mathrm{Gr}_n$, every $\\mathrm{Gr}_n$ inside some $\\mathrm{Gr}_F$ — are the two halves of clause (2), and $H_{L2}$ passes on likewise.\n\n</details>\n\n**Step 4 — Clause (3) is L3's conclusion, given $H_{L3}$.**\n\n<details><summary>the argument</summary>\n\nL3 specialises to $X=\\mathbb{G}_m$ under $G=\\mathbb{G}_m\\times\\mathbb{G}_m$, reading the parent's clash of $T$'s as $\\Lambda^+=\\mathbb{Z}^2$, and concludes membership in the class of [untwisted polarized hyperspherical varieties](../../../../appendix/def-polarized-hyperspherical.html) together with a kernel bounded by no singleton whose translate lies in no $Z_\\mu$. The first half is the parent's \"member of the standing class\": [context](../../../../context.html) fixes the standing class as that entry's.\n\n</details>\n\n**Step 5 — Clause (3) carries neither of L1's remaining hypotheses, L3's (A) being weaker than L1's (A).**\n\n<details><summary>the argument</summary>\n\nL1's (A) fixes $\\mathcal{F}\\ast\\mathcal{G}\\simeq q_{*,!-\\mathrm{dR}}p^{!}(\\mathcal{F}\\boxtimes\\mathcal{G})$, the pushforward that of [Raskin fp](../../../../appendix/bb-raskin-fp-pushforward.html); L3's (A) asks only that [$\\ast$](../../../../appendix/conv-hecke-action.html) be computed as the pull–push $q_*p^!$, naming no functor of that entry. So as stated L3 assumes its own (A) and (B) alone.\n\n</details>\n\n**Step 6 — Clause (4)'s first branch is L4(1), which consumes clause (1) as hypothesised.**\n\n<details><summary>the argument</summary>\n\nUnder the stage reading — every kernel $\\iota_*c$ for $\\iota$ the closed embedding of a stage, the shape of [$\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(4) and of [sheaves on a placid ind-scheme](../../../../appendix/ex-sheaf-placid-ind.html) — L4(1) invokes L2's (ii) to bound every kernel, then grants $H_{L1}$ before bounding the family that generates [the Satake subcategories](../../../../appendix/def-satake-subcategory.html). The branch thus holds under $H_{L1}\\wedge H_{L2}$, clause (1) entering as hypothesised and not as established.\n\n</details>\n\n**Step 7 — Clause (4)'s second branch is L4(2), whose proviso is the clause's own hypothesis.**\n\n<details><summary>the argument</summary>\n\nL4(2) asserts coherence of $\\omega_{K\\backslash\\mathrm{Gr}}$, the equality $|\\operatorname{supp}\\,\\omega_{K\\backslash\\mathrm{Gr}}|=|\\mathrm{Gr}|$, and $F$-boundedness for no finite $F$ \"provided $G\\neq1$\" — the parent's second branch entire, that proviso discharged by the clause's opening \"Assume $G\\neq 1$\". Its suppositions, the pointwise reading of [coherent $\\mathcal{D}$-modules](../../../../appendix/defn-coherent-d-mod.html) and the formation of that object, are hypotheses of neither L1 nor L2.\n\n</details>\n\n**Step 8 — Under the clause's hypothesis the two branches answer oppositely, so clause (4)'s conclusion is L4's.**\n\n<details><summary>the argument</summary>\n\nFor $G\\neq1$ Step 6 bounds every kernel while Step 7 exhibits a coherent kernel bounded by no finite $F$. L4's closing sentence follows, and it is the parent's: boundedness is not a consequence of coherence in the closed world as it stands, but a hypothesis on the kernel — the one clause (1) is stated with.\n\n</details>\n\n**Step 9 — Clause (4)'s last sentence holds, and is proved here because no child carries it.**\n\n<details><summary>the argument</summary>\n\nFor $G=1$ the group schemes $LG$ and $K=L^+G$ are trivial, so $\\mathrm{Gr}$ is a point; $T\\subseteq G$ is trivial, so $\\Lambda^+=X_*(T)^+=\\{0\\}$; and $\\mathrm{Gr}^0=K\\cdot L_0=\\mathrm{Gr}$ by [$\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(1), so $\\mathrm{Gr}_{\\{0\\}}=\\overline{\\mathrm{Gr}}_0=\\mathrm{Gr}$. Every $\\mathcal{G}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\mathrm{Gr})$ has $|\\operatorname{supp}\\mathcal{G}|\\subseteq|\\mathrm{Gr}|$, hence is $\\{0\\}$-bounded: both readings say coherence bounds, and they agree. The clause opens \"Assume $G\\neq 1$\", so it asserts nothing there.\n\n</details>\n\n**Step 10 — Of the children's eight declared hypotheses an appendix entry supplies two, and six it does not.**\n\n<details><summary>the argument</summary>\n\nL2's (C) and L3's (B) widen clauses (3) and (2) of [MV](../../../../appendix/bb-mv-components-dimension.html) from $\\mathbb{C}$ to the standing $k$, which that entry's hypotheses line licenses as the routine widening. The other six are L1's (A), (B), (C), L2's (A), (B) and L3's (A); the three (A)s are readings the children declare rather than inherit, and Step 11 names the rest.\n\n</details>\n\n**Step 11 — GAP: three of those six are facts no appendix entry supplies, and the Lemma is unconditional.**\n\n<details><summary>the argument</summary>\n\nThe children print them as\n\n$$\n\\textbf{(B) of L1:}\\quad q|_{\\overline{LG}_F\\times^{K}L^+X}\\ \\text{ is finitely presented, for every finite } F ;\n$$\n\n$$\n\\textbf{(C) of L1:}\\quad j^{!}q_{*,!-\\mathrm{dR}}\\ \\xrightarrow{\\ \\sim\\ }\\ q'_{*,!-\\mathrm{dR}}\\psi^{!}\\ \\text{ on the } K\\text{-quotients} ;\n$$\n\n$$\n\\textbf{(B) of L2:}\\quad \\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q\\ \\text{ carrying the component of } L_\\mu \\text{ to } \\mu+Q .\n$$\n\nFinite presentation is meant in the sense of [Raskin fp](../../../../appendix/bb-raskin-fp-pushforward.html), and L1 records that no entry of the appendix asserts it. The second is clause (ii) of that entry moved to the quotient prestacks, for which L1 records [Raskin descent](../../../../appendix/bb-raskin-torsor-descent.html) to be necessary and \"not sufficient\", its base having to be a scheme. The third is what note (ii) of [MV](../../../../appendix/bb-mv-components-dimension.html) says that entry's clause (1) does not carry: neither the lattice description nor the labelling. Steps 2–4 deliver $H_{L1}\\Rightarrow(1)$, $H_{L2}\\Rightarrow(2)$ and $H_{L3}\\Rightarrow(3)$ where the Lemma's clauses are unconditional, and Step 6 puts clause (4)'s first branch under $H_{L1}\\wedge H_{L2}$; so proving all four children in full would still not prove the Lemma. **GAP:** three entries close it — finite presentation of the convolution morphism over each $\\mathrm{Gr}_F$ in the sense above; the base change of [Raskin fp](../../../../appendix/bb-raskin-fp-pushforward.html)(ii) for the $K$-quotients, the bridging argument the first note of [Raskin descent](../../../../appendix/bb-raskin-torsor-descent.html) leaves to the citing node; and the labelled algebraic $\\pi_0(\\mathrm{Gr})\\cong X_*(T)/Q$ over the standing $k$.\n\n</details>\n\n## Caveats\n\nTwo entry-level restrictions are crossed by declaration. [$\\overline{\\mathrm{Gr}}_\\lambda$](../../../../appendix/gr-schubert.html)(4) is printed Iwahori-equivariantly, and its hypotheses line asks a node taking the spherical form to say it is making the same reduction one parahoric up: said here, Step 6 supposing the shape rather than citing the clause. The third note of [$\\omega_{\\mathcal{Y}}$](../../../../appendix/not-dualizing-object.html) directs that the entry never be used for $\\mathcal{Y}=\\mathrm{Gr}$; Step 7's object is that case, supposed by L4(2) rather than cited.\n\n**Assumed facts used.** All five dependencies are `status: open`, and this write-up uses their statements: [L1](Q1-L3-L2-L1/index.html) in Steps 2 and 6, [L2](Q1-L3-L2-L2/index.html) in Steps 3 and 6, [L3](Q1-L3-L2-L3/index.html) in Steps 4–5, [L4](Q1-L3-L2-L4/index.html) in Steps 6–9, and [Q1-L3-L1](../Q1-L3-L1/index.html) for its clause (3) alone, which names the Setup's $Z_F$.\n";</script>
