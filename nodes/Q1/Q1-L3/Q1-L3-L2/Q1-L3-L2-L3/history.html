\mu$ lying in one connected component of $\\mathrm{Gr}$ refutes.\n- **2026-08-07 — why the two hypotheses are declared here and not inherited.** §E Flaw 16 records that this clause is conditional on GAP B *and* on the parent's Step 2 reading, since the translate is computed in the $\\mathcal{D}^!$-theory: \"clause (3) is *not* independent of clause (1)'s machinery\", and the ledger under-reported it. So the reading is written out as hypothesis **(A)** and named as the same reading [Q1-L3-L2-L1](../Q1-L3-L2-L1/index.html) declares. The GAP B half is cheaper here than in general: §B observes that \"clause (3) alone needs only the torus sentence of p. 4 … the dimension formula is not needed for clause (3) at all\", and that sentence is now clause (2) of [Mirković–Vilonen: $\\pi_0(\\mathrm{Gr})$, the torus case, and $\\dim\\mathrm{Gr}^\\lambda$](../../../../../appendix/bb-mv-components-dimension.html), whose widening to the standing $k$ is the routine one and is declared as hypothesis **(B)**. The labelled $\\pi_0$ identification that [Q1-L3-L2-L2](../Q1-L3-L2-L2/index.html) has to assume is *not* needed here, the components being single points.\n- **2026-08-07 — the clash of letters, and membership in the standing class.** Two things r1 raised and the parent's Steps 7–8 answered are carried into the statement rather than left to the write-up: that the standing $T$ is the maximal torus of $G$ and so is $G$ itself in this specialisation, giving $\\Lambda^+ = \\mathbb{Z}^2$; and that $X$ is a member of the class of [untwisted polarized hyperspherical varieties](../../../../../appendix/def-polarized-hyperspherical.html), which is now in `objects:` instead of being a declared widening as §F Flaw 8 left it.\n";</script>
