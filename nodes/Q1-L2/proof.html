<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2 — Equality is detected in the renormalized category\n\n[node](index.html) · [appendix](../../appendix/index.html) · [context](../../context.html) · [DAG index](../../dag.html)\n\n- **uses:** [`def:generation`](../../appendix/def-generation.html), [`def:compact_objects`](../../appendix/def-compact-objects.html), [`def:compactly_generated_category`](../../appendix/def-compactly-generated-category.html), [`def:satake_subcategory`](../../appendix/def-satake-subcategory.html); nodes [Q1-L1](../Q1-L1/index.html), [Q1-L2-L1](Q1-L2-L1/index.html), [Q1-L2-L2](Q1-L2-L2/index.html), [Q1-L2-L3](Q1-L2-L3/index.html), [Q1-L2-L4](Q1-L2-L4/index.html).\n- **notation:** $\\mathcal{C} := \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, $S := \\{\\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\}$ (a set of objects), $\\mathcal{A} := \\langle S\\rangle_{\\mathcal{C}}$, and $\\iota\\colon\\mathcal{D}_c(K\\backslash LX)\\hookrightarrow\\mathcal{C}$ the canonical fully faithful functor of [Q1-L2-L1](Q1-L2-L1/index.html).\n\n## Lemma\n\nWith $\\langle-\\rangle_{\\mathcal{C}}$ denoting generation as in [`def:generation`](../../appendix/def-generation.html) inside $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, the following are equivalent:\n\n1.\n\n   $$\n   \\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX);\n   $$\n\n2.\n\n   $$\n   \\langle\\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX);\n   $$\n\n3. for every $0\\neq\\mathcal{M}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ there exist $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and $n\\in\\mathbb{Z}$ with\n\n   $$\n   \\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\left((\\mathcal{F}\\ast\\mathrm{IC}_0)[n], \\mathcal{M}\\right)\\neq 0.\n   $$\n\n## Proof\n\n```\nLemma (TFAE)\n├─ Step 1  (C, S) satisfies the hypotheses of Q1-L2-L2 and Q1-L2-L4\n│          [Q1-L2-L1: C stable, cocomplete, compactly generated, D_c =_C C^ω;\n│           Q1-L2-L3: S small, S ⊂ C^ω, shift-stable]\n├─ (1) ⇔ (2) ..................................... Steps 2–3\n│   ├─ Step 2  Q1-L1 + transport along ι:  (1) ⇔ C^ω =_C C^ω ∩ <S>_C\n│   └─ Step 3  that is clause (3) of Q1-L2-L2 at (C, S) ⇔ <S>_C = C = (2)\n└─ (2) ⇔ (3) ..................................... Step 4\n    └─ Step 4  detection clause of Q1-L2-L4 at (C, S), pulled back along the\n               surjection F ↦ F ∗ IC_0 onto S, is (3)\n```\n\n**Step 1 — the pair $(\\mathcal{C}, S)$ satisfies the hypotheses of [Q1-L2-L2](Q1-L2-L2/index.html) and [Q1-L2-L4](Q1-L2-L4/index.html).** [Q1-L2-L1](Q1-L2-L1/index.html), applied to the prestack $\\mathcal{Y} = K\\backslash LX$ (an instance its statement names), gives: $\\mathcal{C}$ is stable, admits all small colimits, and is compactly generated per [`def:compactly_generated_category`](../../appendix/def-compactly-generated-category.html); and $\\iota$ is fully faithful with essential image the compacts of [`def:compact_objects`](../../appendix/def-compact-objects.html),\n\n$$\n\\mathcal{D}_c(K\\backslash LX)\\ =_{\\mathcal{C}}\\ \\mathcal{C}^{\\omega}.\n$$\n\nObjects of $\\mathcal{D}_c(K\\backslash LX)$ are regarded in $\\mathcal{C}$ via $\\iota$ throughout; in clause (3), the shift and mapping space are those of $\\mathcal{C}$, as the subscript on $\\operatorname{Map}$ dictates. Next, [Q1-L2-L3](Q1-L2-L3/index.html) supplies: $S$ is a small set of objects of $\\mathcal{D}_c(K\\backslash LX)$ (its clause 1); $S\\subset\\mathcal{C}^{\\omega}$ (its clause 3); and $S$ is shift-stable in exactly the form [Q1-L2-L4](Q1-L2-L4/index.html) hypothesizes — for $s=\\mathcal{F}\\ast\\mathrm{IC}_0\\in S$ and $n\\in\\mathbb{Z}$, its clause 2 puts $s' := (\\mathcal{F}[n])\\ast\\mathrm{IC}_0$ in $S$ with $s'\\simeq_{\\mathcal{C}} s[n]$, the coda of that clause asserting outright that $\\{s[n]\\mid s\\in S,\\, n\\in\\mathbb{Z}\\}$ and $S$ have the same objects up to equivalence in $\\mathcal{C}$. So the hypotheses of [Q1-L2-L2](Q1-L2-L2/index.html) ($\\mathcal{C}$ stable, cocomplete, compactly generated; $S\\subset\\mathcal{C}^{\\omega}$ a small set) and of [Q1-L2-L4](Q1-L2-L4/index.html) ($\\mathcal{C}$ stable, cocomplete; $S\\subset\\mathcal{C}^{\\omega}$ a small shift-stable set) all hold. Finally, the bracket of [`def:generation`](../../appendix/def-generation.html) depends only on the set of objects it encloses, so the family-indexed bracket in clause (2) equals $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{A}$: clause (2) reads $\\mathcal{A} = \\mathcal{C}$.\n\n**Step 2 — clause (1) holds iff $\\mathcal{C}^{\\omega} =_{\\mathcal{C}} \\mathcal{C}^{\\omega}\\cap\\mathcal{A}$.** The left side of (1) is the Satake subcategory of [`def:satake_subcategory`](../../appendix/def-satake-subcategory.html), and its ratified reading [Q1-L1](../Q1-L1/index.html) states\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\ =_{\\mathcal{D}_c(K\\backslash LX)}\\ \\mathcal{D}_c(K\\backslash LX)\\cap\\mathcal{A},\n$$\n\nthe intersection formed inside $\\mathcal{C}$ and contained in $\\mathcal{D}_c(K\\backslash LX)$, hence a full subcategory of either ambient. Substituting this identity into (1) — both equalities live in the fixed ambient $\\mathcal{D}_c(K\\backslash LX)$ — clause (1) holds iff\n\n$$\n\\mathcal{D}_c(K\\backslash LX)\\ =_{\\mathcal{D}_c(K\\backslash LX)}\\ \\mathcal{D}_c(K\\backslash LX)\\cap\\mathcal{A}.\n$$\n\nBecause $\\iota$ is fully faithful with essential image exactly $\\mathcal{C}^{\\omega}$ (Step 1), it identifies full subcategories of $\\mathcal{D}_c(K\\backslash LX)$ with full subcategories of $\\mathcal{C}$ contained in $\\mathcal{C}^{\\omega}$, preserving and reflecting equality. Under this dictionary $\\mathcal{D}_c(K\\backslash LX)$ corresponds to $\\mathcal{C}^{\\omega}$, and $\\mathcal{D}_c(K\\backslash LX)\\cap\\mathcal{A}$ — already an intersection of full subcategories of $\\mathcal{C}$ — to $\\mathcal{C}^{\\omega}\\cap\\mathcal{A}$, by rewriting its first factor along Step 1's displayed equality. Hence (1) holds iff $\\mathcal{C}^{\\omega} =_{\\mathcal{C}} \\mathcal{C}^{\\omega}\\cap\\langle S\\rangle_{\\mathcal{C}}$.\n\n**Step 3 — (1) $\\Leftrightarrow$ (2).** The equality closing Step 2 is clause (3) of [Q1-L2-L2](Q1-L2-L2/index.html) instantiated at $(\\mathcal{C}, S)$, its hypotheses discharged in Step 1. That TFAE makes it equivalent to its clause (1), $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$ — by Step 1, clause (2) of the Lemma.\n\n**Step 4 — (2) $\\Leftrightarrow$ (3).** [Q1-L2-L4](Q1-L2-L4/index.html) at $(\\mathcal{C}, S)$, hypotheses from Step 1, asserts: $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$ iff every nonzero $c\\in\\mathcal{C}$ admits $s\\in S$ and $n\\in\\mathbb{Z}$ with $\\operatorname{Map}_{\\mathcal{C}}(s[n], c)\\neq 0$. The former is clause (2), by Step 1. For the latter: by definition of $S$, the assignment $\\mathcal{F}\\mapsto\\mathcal{F}\\ast\\mathrm{IC}_0$ maps the objects of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ onto $S$, so for a fixed nonzero $\\mathcal{M}\\in\\mathcal{C}$, existence of $(s, n)$ with $\\operatorname{Map}_{\\mathcal{C}}(s[n], \\mathcal{M})\\neq 0$ is — substituting $s = \\mathcal{F}\\ast\\mathrm{IC}_0$, whose shift in $\\mathcal{C}$ is the $(\\mathcal{F}\\ast\\mathrm{IC}_0)[n]$ of clause (3) — existence of $(\\mathcal{F}, n)$ as in clause (3). Existence over a set is existence over any surjection onto it, and the range $n\\in\\mathbb{Z}$ is identical on both sides: shift-stability of $S$ was consumed as a hypothesis of [Q1-L2-L4](Q1-L2-L4/index.html), not in this translation. Quantifying over all nonzero $\\mathcal{M}\\in\\mathcal{C}$, the detection clause of [Q1-L2-L4](Q1-L2-L4/index.html), written out for $S$, is clause (3). Hence (2) $\\Leftrightarrow$ (3).\n\nSteps 3 and 4 chain: (1) $\\Leftrightarrow$ (2) $\\Leftrightarrow$ (3). $\\blacksquare$\n\n## Caveats\n\n- Steps 2–3 ride on the ratified $\\mathcal{D}^{\\mathrm{ren}}$-ambient reading of [`def:satake_subcategory`](../../appendix/def-satake-subcategory.html) fixed at [Q1-L1](../Q1-L1/index.html); under any other reading of the manuscript's ambient-free bracket, clause (1) changes meaning and the equivalence would need re-deriving.\n";</script>
