<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-L3</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L3 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-L3 — The Hecke family is small, compact and shift-stable\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html), [module categories](../../../appendix/conv-module-categories.html), [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html), [`def:compact_objects`](../../../appendix/def-compact-objects.html), [cohomological degrees](../../../appendix/conv-cohomological-degrees.html), [`subsec:notations`](../../../appendix/subsec-notations.html); Fact [Q1-L2-L1](../Q1-L2-L1/index.html).\n- **notation:** $\\mathcal{H}_{c,K} := \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and $\\mathcal{M}_c := \\mathcal{D}_c(K\\backslash LX)$, with $K = L^+G$ as in [`subsec:notations`](../../../appendix/subsec-notations.html); $\\iota\\colon\\mathcal{M}_c\\rightarrow\\mathcal{C}$ is the canonical functor of [Q1-L2-L1](../Q1-L2-L1/index.html), and $[n]$ is the cohomological shift of [cohomological degrees](../../../appendix/conv-cohomological-degrees.html).\n\n## Lemma\n\nWrite $\\mathcal{C} := \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ and let\n\n$$\nS := \\left\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\}\n$$\n\nbe the Hecke family generating [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html). Then $S$ is a small set of compact objects of $\\mathcal{C}$, stable under shifts:\n\n1. $S$ is a small set, and\n\n   $$\n   S\\ \\subset\\ \\mathcal{D}_c(K\\backslash LX)\\ =_{\\mathcal{C}}\\ \\mathcal{C}^{\\omega};\n   $$\n\n2. for every $s\\in S$ and every $n\\in\\mathbb{Z}$ there is $s'\\in S$ with $s'\\simeq_{\\mathcal{C}} s[n]$.\n\n## Proof\n\n**Step 1 — $S$ lands in $\\mathcal{M}_c$, and $\\mathcal{M}_c$ is the compacts of $\\mathcal{C}$.** [The spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html) makes $\\mathcal{M}_c$ a left $\\mathcal{H}_{c,K}$-module by pull–push along its convolution diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$, and declares that module action to *be* the $\\ast$ of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html); the second slot of an action bifunctor $\\mathcal{H}_{c,K}\\otimes\\mathcal{M}_c\\rightarrow\\mathcal{M}_c$ accepts $\\mathrm{IC}_0$ because [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) states $\\mathrm{IC}_0\\in\\mathcal{M}_c$ outright ($K = L^+G$ by [`subsec:notations`](../../../appendix/subsec-notations.html)). Its \"in particular\" display at $\\mathcal{G} = \\mathrm{IC}_0$ then gives $\\mathcal{F}\\ast\\mathrm{IC}_0\\in\\mathcal{M}_c$ for every $\\mathcal{F}\\in\\mathcal{H}_{c,K}$, so $S\\subset\\mathcal{M}_c$. By Fact [Q1-L2-L1](../Q1-L2-L1/index.html) at $\\mathcal{Y} = K\\backslash LX$, the canonical $\\iota$ is fully faithful with essential image the compacts, $\\mathcal{M}_c =_{\\mathcal{C}} \\mathcal{C}^{\\omega}$ — compactness in the renormalized $\\mathcal{C}$, in the sense of [`def:compact_objects`](../../../appendix/def-compact-objects.html), and not in $\\mathcal{D}(K\\backslash LX)$, which is the ambient [Q1-L2-L2](../Q1-L2-L2/index.html) and [Q1-L2-L4](../Q1-L2-L4/index.html) read the hypothesis in.\n\n**Step 2 — clause 1.** By Fact [Q1-L2-L1](../Q1-L2-L1/index.html) at $\\mathcal{Y} = K\\backslash\\mathrm{Gr}$, an instance that Fact names, $\\mathcal{H}_{c,K}$ is small, so its objects form a small set. $S$ is the image of that set under $\\mathcal{F}\\mapsto\\mathcal{F}\\ast\\mathrm{IC}_0$ — the action bifunctor of Step 1 on objects — and the image of a small set under a function is small. With the two memberships of Step 1, this is clause 1.\n\n**Step 3 — clause 2.** Fix $s = \\mathcal{F}\\ast\\mathrm{IC}_0\\in S$ and $n\\in\\mathbb{Z}$, and put $s' := (\\mathcal{F}[n])\\ast\\mathrm{IC}_0$. Fact [Q1-L2-L1](../Q1-L2-L1/index.html) at $\\mathcal{Y} = K\\backslash\\mathrm{Gr}$ makes $\\mathcal{H}_{c,K}$ a stable full subcategory of $\\mathcal{D}(K\\backslash\\mathrm{Gr})$, hence closed under the ambient's shifts in both directions and computing its own by them; so $\\mathcal{F}[n]\\in\\mathcal{H}_{c,K}$ and $s'\\in S$. The same Fact at both prestacks makes $\\mathcal{H}_{c,K}$ and $\\mathcal{M}_c$ small, stable and idempotent-complete — the small ambient [module categories](../../../appendix/conv-module-categories.html) requires — with the monoidal and module structures supplied by [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html). That entry's last display, at $a = \\mathcal{F}$ and $m = \\mathrm{IC}_0$, is exactness and $k$-linearity of the action bifunctor and reads\n\n$$\ns'\\ =\\ \\left(\\mathcal{F}[n]\\right)\\ast\\mathrm{IC}_0\\ \\simeq_{\\mathcal{M}_c}\\ \\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n]\\ =\\ s[n] .\n$$\n\nFinally $\\iota$ is exact — it is the ind-completion unit of a stable category, so it preserves finite limits and colimits and commutes with every $[n]$ — and any functor preserves equivalences; transporting the display along $\\iota$ gives $s'\\simeq_{\\mathcal{C}} s[n]$ with $s'\\in S$, which is clause 2. $\\blacksquare$\n\n## Caveats\n\nThe one step that is not formal is the membership $\\mathrm{IC}_0\\in\\mathcal{M}_c$ used in Step 1: it says the $!$-extension of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is coherent over $K\\backslash LX$, a geometric finiteness statement this node does not prove. It is imported, not inferred — that entry ratifies it explicitly on the manuscript's presupposition at main.tex:79–80. Everything else above is a set-theoretic image, one citation of the action's linearity, and one essential-image identification.\n";</script>
