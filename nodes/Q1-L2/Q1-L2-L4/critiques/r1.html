<header class="bar"><nav class="crumbs"><a href="../../../../index.html">blueprint</a><i>›</i><a href="../../../index.html">nodes</a><i>›</i><a href="../../index.html">Q1-L2</a><i>›</i><a href="../index.html">Q1-L2-L4</a><i>›</i><span>r1</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L2-L4, round 1</h1><p class="lead">Generated from <code>blueprint/nodes/Q1-L2/Q1-L2-L4/critiques/r1.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReviewed: `proof.md` against the frozen statement in `node.md`, the appendix entries `def:generation`, `p:compact_generation_stable_case`, `def:compact_objects`, `conv-anima`, `conv-cohomological-degrees`, the Notation section of `context.md`, `refs.bib`, and `main.tex:495–558`.\n\n## Checks that passed (recorded so a later round knows they were made, not skipped)\n\n- **Statement fidelity.** The `## Lemma` section is a word-for-word match with the Statement of `node.md`, including the display, the punctuation, and the final clause. No renotation, no strengthened hypothesis, no weakened conclusion.\n- **Closed world.** Every load-bearing invocation is one of the five permitted appendix entries. The conversion of detection into generation in Step 3 rests on the \"Equivalently\" clause that is part of the `def:generation` entry itself (and is the manuscript's own text at `main.tex:508`), so it closes inside the entry. The external citations (HTT, HA, GR17vol1) annotate standard facts and the ratified clause; all three keys exist in `refs.bib` (lines 524, 548, 350). All five appendix anchors resolve. No `main.tex` label is claimed by the draft. No hallucinated citation, label, or anchor.\n- **Step 1.** $\\mathcal{N}_c := \\{x \\in \\mathcal{C} \\mid \\operatorname{Map}_{\\mathcal{C}}(x[n],c) = 0 \\ \\forall n \\in \\mathbb{Z}\\}$ is correctly shown to contain $0$, to be closed under all shifts (additivity of the shift only), closed under small colimits computed in $\\mathcal{C}$ (shift is an autoequivalence; $\\operatorname{Map}_{\\mathcal{C}}(-,c)$ carries colimits to limits; a small limit of contractible anima is contractible), and closed under cofibers and fibers — the standard criterion for a stable subcategory. So it is legitimately one of the subcategories over which `def:generation` minimizes.\n- **Step 2.** The negation of clause (2) is taken correctly ($\\exists\\, c \\neq 0$ with $\\operatorname{Map}_{\\mathcal{C}}(s[n],c) = 0$ for **all** $s, n$, i.e. $S \\subset \\mathcal{N}_c$); minimality gives $\\langle S\\rangle_{\\mathcal{C}} \\subset \\mathcal{N}_c$; the $n = 0$ instance forces $\\mathrm{id}_c \\simeq 0$, hence $c \\simeq_{\\mathcal{C}} 0$ — a genuine contradiction. The remark that shift-stability is not used here is correct: the defining range of $\\mathcal{N}_c$ already covers all $n \\in \\mathbb{Z}$.\n- **Step 3 and the \"used exactly once\" bookkeeping.** The claim is right. Clause (2) produces $s[n]$ with $n$ of arbitrary sign, while the detection statement of `def:generation` quantifies only over $s[-i]$, $i \\ge 0$; shift-stability is exactly what moves $s[n]$ into $S$ so that the $i = 0$ instance applies. Steps 1, 2 and 4 make no other use of it. The hypotheses under which the detection $\\Rightarrow$ generation direction is imported ($\\mathcal{C}$ stable cocomplete, $S$ a small set of compacts) are the Lemma's standing ones and are verified where invoked; the implication is true in this regime (standard Bousfield-localization argument), and the Caveats honestly refuse the hypothesis-free generality of the appendix clause. This caution is commendable — the clause as printed in the appendix is false for an arbitrary collection in an arbitrary $\\mathcal{C} \\in \\widehat{\\mathrm{Cat}}_\\infty$.\n- **Step 4.** Step 3's output is literally clause (2) of `p:compact_generation_stable_case`; the black box's stated hypotheses ($\\mathcal{C}$ stable and cocomplete, $S$ a small set of compact objects) are checked, not merely cited; the conclusion delivered is exactly the frozen final clause.\n- **Argument-flow tree.** Steps 1–2 feed (1) $\\Rightarrow$ (2); Step 3 alone feeds (2) $\\Rightarrow$ (1); Step 4, consuming Step 3, feeds the final clause. Nothing drawn is false. (See Flaw 2 for a rendering quibble.)\n\n## Flaws\n\n**Flaw 1** [MINOR] (Step 4: \"$\\operatorname{Map}_{\\mathcal{C}}(s[-i],c)\\simeq 0$ … forces $c\\simeq 0$\")\nTwo unsubscripted $\\simeq$ in Step 4, against the Notation rule of `context.md` (\"$=$ and $\\simeq$ carry as a subscript the category in which the assertion is made\"), and internally inconsistent with Step 2, which writes $c \\simeq_{\\mathcal{C}} 0$ for the same assertion. The excuse that Step 4 quotes clause (2) of `p:compact_generation_stable_case` verbatim (the appendix black box also omits the subscripts, and even the ambient on $\\operatorname{Map}$) is plausible but the rule as stated has no quotation exemption. Should read $\\operatorname{Map}_{\\mathcal{C}}(s[-i],c) \\simeq_{\\mathrm{Ani}} 0$ and $c \\simeq_{\\mathcal{C}} 0$.\n\n**Flaw 2** [MINOR] (argument-flow tree, \"(1) ⟹ (2) … Steps 1–2\")\nStep 1 feeds Step 2 — $\\mathcal{N}_c$ is constructed in Step 1 and consumed in Step 2 — but the tree renders the two as independent siblings under the branch \"(1) $\\Rightarrow$ (2)\". The dependency is carried only by the label text (\"then $S \\subset \\mathcal{N}_c$\"), not by the edge structure. Nothing is misstated, and the Step 3 $\\to$ Step 4 dependency *is* stated in Step 4's label, so this is a rendering asymmetry rather than an inaccuracy; nesting Step 1 under Step 2 (as Step 3 is effectively nested under Step 4 via its label) would make the tree self-consistent.\n\n**Flaw 3** [MINOR] (Step 1(iii), citation of [[HTT, Prop. 5.1.3.2](../../../../../papers/HTT.pdf)])\nThe cited proposition states that the Yoneda embedding preserves limits, i.e. controls $\\operatorname{Map}_{\\mathcal{C}}(x, \\lim_i y_i)$; the statement Step 1 uses — $\\operatorname{Map}_{\\mathcal{C}}(\\operatorname{colim}_i x_i, c) \\simeq_{\\mathrm{Ani}} \\lim_{I^{\\mathrm{op}}} \\operatorname{Map}_{\\mathcal{C}}(x_i, c)$ — is its application to $\\mathcal{C}^{\\mathrm{op}}$ (equivalently, the universal property of the colimit). The References section says \"equivalently\", which is honest, but the dualization should be flagged at the point of use. The mathematical content is standard either way; no gap.\n\n**Flaw 4** [MINOR] (References, \"[[GR17vol1, Prop. 5.4.5](../../../../../papers/GR17vol1.pdf)]\")\nGaitsgory–Rozenblyum vol. 1 numbers results per chapter, so \"Prop. 5.4.5\" is not uniquely resolvable without a chapter number; moreover `main.tex:553` cites [[GR17vol1, Lem 7.2.3(4)](../../../../../papers/GR17vol1.pdf)] for the closely related proof of `p:compact_generation_stable_case`, so the manuscript itself points at two different coordinates for this circle of facts. The draft is not hallucinating — it reproduces verbatim the attribution ratified inside the `def:generation` appendix entry (which is `main.tex:508`) — so the defect is appendix-inherited, not the draft's. Recorded here so the appendix maintainer can add the chapter number; the draft's use is in any case backed by `p:compact_generation_stable_case`, whose hypotheses it independently verifies.\n\nNo FATAL or MAJOR flaws: the statement is proved as frozen, every invoked hypothesis is checked at the point of use, the closed world is respected, and the shift-stability bookkeeping claim is accurate.\n\nVERDICT: PASS\n";</script>
