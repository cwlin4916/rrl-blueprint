<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-L4</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L4 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-L4 — Shift-stable compact generators: generation equals detection\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [`def:generation`](../../../appendix/def-generation.html), [`p:compact_generation_stable_case`](../../../appendix/p-compact-generation-stable-case.html), [`def:compact_objects`](../../../appendix/def-compact-objects.html), [anima and mapping objects](../../../appendix/conv-anima.html), [cohomological degrees](../../../appendix/conv-cohomological-degrees.html). No `depends-on` nodes (ready leaf).\n- **notation:** for $c\\in\\mathcal{C}$, $\\mathcal{N}_c\\subset\\mathcal{C}$ is the full subcategory of Step 1; a mapping anima is *zero* ($=0$) if contractible and *nonzero* ($\\neq 0$) otherwise — the reading of [anima and mapping objects](../../../appendix/conv-anima.html) fixed in the node's [History](history.html).\n\n## Lemma\n\nLet $\\mathcal{C}$ be a stable category admitting all small colimits and let $S\\subset\\mathcal{C}^{\\omega}$ be a small set of compact objects which is stable under shifts, i.e. for all $s\\in S$ and $n\\in\\mathbb{Z}$ there is $s'\\in S$ with $s'\\simeq_{\\mathcal{C}} s[n]$. Then the following are equivalent:\n\n1. $\\langle S\\rangle_{\\mathcal{C}} = \\mathcal{C}$;\n2. for every nonzero $c\\in\\mathcal{C}$ there exist $s\\in S$ and $n\\in\\mathbb{Z}$ with\n\n   $$\n   \\operatorname{Map}_{\\mathcal{C}}\\left(s[n], c\\right)\\neq 0 .\n   $$\n\nWhen they hold, $\\mathcal{C}$ is compactly generated by $S$ in the sense of [`p:compact_generation_stable_case`](../../../appendix/p-compact-generation-stable-case.html).\n\n## Proof\n\n```\nLemma\n├─ (1) ⟹ (2) ......................................... Steps 1–2\n│   └─ Step 2  if (2) failed at c ≠ 0, then S ⊂ N_c, so\n│      │       C = <S>_C ⊂ N_c, forcing id_c ≃ 0 — contradiction\n│      └─ Step 1  for any c, the all-shifts orthogonal N_c is a\n│                 cocomplete stable subcategory of C\n├─ (2) ⟹ (1) ......................................... Step 3\n│   └─ Step 3  shift-stability turns (2) into the i ≥ 0\n│              detection statement of def:generation\n└─ final clause ....................................... Step 4\n    └─ Step 4  Step 3's detection + S ⊂ C^ω small feeds\n               p:compact_generation_stable_case\n```\n\n**Step 1 — for every $c\\in\\mathcal{C}$, the full subcategory $\\mathcal{N}_c := \\{x\\in\\mathcal{C}\\mid \\operatorname{Map}_{\\mathcal{C}}(x[n],c)=0\\ \\text{for all}\\ n\\in\\mathbb{Z}\\}$ is a cocomplete stable subcategory of $\\mathcal{C}$.** (i) $0\\in\\mathcal{N}_c$: each $0[n]\\simeq_{\\mathcal{C}}0$ is initial, so $\\operatorname{Map}_{\\mathcal{C}}(0[n],c)$ is contractible. (ii) $\\mathcal{N}_c$ is closed under $x\\mapsto x[m]$ for every $m\\in\\mathbb{Z}$, by $(x[m])[n]\\simeq_{\\mathcal{C}}x[m+n]$; only this additivity of the shift of [cohomological degrees](../../../appendix/conv-cohomological-degrees.html), never its direction, enters. (iii) $\\mathcal{N}_c$ is closed under small colimits computed in $\\mathcal{C}$: each shift $[n]\\colon\\mathcal{C}\\to\\mathcal{C}$ is an autoequivalence, hence preserves colimits, and $\\operatorname{Map}_{\\mathcal{C}}(-,c)\\colon\\mathcal{C}^{\\mathrm{op}}\\to\\mathrm{Ani}$ carries small colimits to small limits ([[HTT, Prop. 5.1.3.2](../../../../papers/HTT.pdf)] applied to $\\mathcal{C}^{\\mathrm{op}}$); so for $x\\simeq_{\\mathcal{C}}\\operatorname{colim}_{I}x_i$ with $I$ small and every $x_i\\in\\mathcal{N}_c$,\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(x[n],c)\\simeq_{\\mathrm{Ani}}\\lim_{I^{\\mathrm{op}}}\\operatorname{Map}_{\\mathcal{C}}(x_i[n],c),\n$$\n\na small limit of contractible anima, hence contractible. (iv) $\\mathcal{N}_c$ is a stable subcategory: it contains $0$, is closed under cofibers (pushouts, by (iii)), and is closed under fibers since $\\operatorname{fib}(f)\\simeq_{\\mathcal{C}}\\operatorname{cofib}(f)[-1]$ in the stable $\\mathcal{C}$ ([[HA, Prop. 1.1.3.4](../../../../papers/HA.pdf)] plus (ii)). Thus $\\mathcal{N}_c$ is one of the cocomplete stable subcategories over which [`def:generation`](../../../appendix/def-generation.html) minimizes.\n\n**Step 2 — (1) $\\Rightarrow$ (2).** Assume (1), and suppose (2) fails: some nonzero $c\\in\\mathcal{C}$ has $\\operatorname{Map}_{\\mathcal{C}}(s[n],c)=0$ for all $s\\in S$, $n\\in\\mathbb{Z}$ — that is, $S\\subset\\mathcal{N}_c$. By Step 1 and minimality in [`def:generation`](../../../appendix/def-generation.html), $\\langle S\\rangle_{\\mathcal{C}}\\subset\\mathcal{N}_c$ as full subcategories of $\\mathcal{C}$; with (1) this gives $\\mathcal{C}\\subset\\mathcal{N}_c$, so $c\\in\\mathcal{N}_c$. Taking $x=c$, $n=0$: $\\operatorname{Map}_{\\mathcal{C}}(c,c)$ is contractible, so its two points $\\mathrm{id}_c$ and the zero map are homotopic; $\\mathrm{id}_c\\simeq 0$ forces $c\\simeq_{\\mathcal{C}}0$, contradicting $c\\neq 0$. Shift-stability of $S$ is not used in this direction — the defining range of $\\mathcal{N}_c$ already runs over all $n$.\n\n**Step 3 — (2) $\\Rightarrow$ (1).** Assume (2). We verify for the family $S$ the detection statement displayed in [`def:generation`](../../../appendix/def-generation.html): if $c\\in\\mathcal{C}$ satisfies $\\operatorname{Map}_{\\mathcal{C}}(s[-i],c)=0$ for all $s\\in S$ and all $i\\ge 0$, then $c=0$. Suppose instead $c\\neq 0$. By (2) there are $s\\in S$, $n\\in\\mathbb{Z}$ with $\\operatorname{Map}_{\\mathcal{C}}(s[n],c)\\neq 0$. Shift-stability of $S$ — used here, and only here — gives $s'\\in S$ with $s'\\simeq_{\\mathcal{C}}s[n]$, whence\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}\\left(s'[-0],c\\right)\\simeq_{\\mathrm{Ani}}\\operatorname{Map}_{\\mathcal{C}}\\left(s[n],c\\right)\\neq 0,\n$$\n\ncontradicting the hypothesis at $i=0$ for $s'$. So $c=0$ and detection holds. The equivalence recorded in [`def:generation`](../../../appendix/def-generation.html) ([[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)]) converts detection into generation: $\\langle S\\rangle_{\\mathcal{C}}=\\mathcal{C}$. It is invoked with $\\mathcal{C}$ stable and cocomplete and $S$ a small set of compact objects in the sense of [`def:compact_objects`](../../../appendix/def-compact-objects.html) — the hypotheses under which [`p:compact_generation_stable_case`](../../../appendix/p-compact-generation-stable-case.html) states the same detection principle.\n\n**Step 4 — when (1)–(2) hold, $\\mathcal{C}$ is compactly generated by $S$.** Assume (1)–(2). Step 3, run from (2), shows $S$ satisfies: $\\operatorname{Map}_{\\mathcal{C}}(s[-i],c)\\simeq_{\\mathrm{Ani}} 0$ for all $i\\ge 0$ and all $s\\in S$ forces $c\\simeq_{\\mathcal{C}} 0$ — precisely clause (2) of [`p:compact_generation_stable_case`](../../../appendix/p-compact-generation-stable-case.html). Its hypotheses are the Lemma's standing ones: $\\mathcal{C}$ stable admitting all small colimits, $S\\hookrightarrow\\mathcal{C}^{\\omega}$ a small set of compact objects ([`def:compact_objects`](../../../appendix/def-compact-objects.html)). Hence its clause (1) holds: $\\mathcal{C}$ is compactly generated, with $S$ the witnessing set. $\\blacksquare$\n\n## Caveats\n\n- The \"Equivalently\" clause of [`def:generation`](../../../appendix/def-generation.html) is stated in the appendix without explicit hypotheses. This proof imports only the implication *detection $\\Rightarrow$ generation*, and only for a small set of compacts in a stable cocomplete ambient — the regime of [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] and of [`p:compact_generation_stable_case`](../../../appendix/p-compact-generation-stable-case.html). The converse implication is not imported: Steps 1–2 prove the (stronger, all-shifts) statement directly.\n- No direction of the shift convention is load-bearing: Steps 1–4 use only $(x[m])[n]\\simeq_{\\mathcal{C}}x[m+n]$ and $x[0]\\simeq_{\\mathcal{C}}x$, so the Lemma is insensitive to the sign fixed in [cohomological degrees](../../../appendix/conv-cohomological-degrees.html).\n\n## References\n\nOrientation only; every load-bearing step closes inside the entries in **uses**.\n\n- [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] — generation by a family is equivalent to the $i\\ge 0$ detection property; the equivalence ratified in [`def:generation`](../../../appendix/def-generation.html) and invoked in Step 3.\n- [[HTT, Prop. 5.1.3.2](../../../../papers/HTT.pdf)] — the Yoneda embedding preserves limits; equivalently $\\operatorname{Map}_{\\mathcal{C}}(-,c)$ turns colimits into limits (Step 1(iii)).\n- [[HA, Prop. 1.1.3.4](../../../../papers/HA.pdf)] — in a stable $\\infty$-category a square is a pushout iff it is a pullback; source of the rotation $\\operatorname{fib}(f)\\simeq_{\\mathcal{C}}\\operatorname{cofib}(f)[-1]$ (Step 1(iv)).\n";</script>
