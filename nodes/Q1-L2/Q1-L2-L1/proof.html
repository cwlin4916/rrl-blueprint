<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L2-L1</a><i>›</i><span>write-up</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L2-L1 — write-up</h1><p class="lead">The one-page proof. Every object it invokes is a link into the appendix — the closed world is that list and nothing else.</p><div id="doc"></div></main><script>const SRC = "# Q1-L2-L1 — Coherent objects are exactly the compacts of $\\mathcal{D}^{\\mathrm{ren}}$\n\n[node](index.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html) · [DAG index](../../../dag.html)\n\n- **uses:** [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html), [`def:renormalized`](../../../appendix/def-renormalized.html), [`def:compact_objects`](../../../appendix/def-compact-objects.html), [`def:compactly_generated_category`](../../../appendix/def-compactly-generated-category.html), [`subsec:notations`](../../../appendix/subsec-notations.html), [$k$-linear categories](../../../appendix/conv-dgcat.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html). No `depends-on` nodes (ready leaf).\n- **notation:** $j\\colon\\mathcal{D}_c(\\mathcal{Y})\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$ is the canonical functor of the ind-completion in [`def:compactly_generated_category`](../../../appendix/def-compactly-generated-category.html); for a test scheme $S$, $\\mathcal{K}_S\\subset\\mathcal{D}(S)$ is the full subcategory of finite complexes with coherent cohomology; *exact* means preserving finite limits and colimits between stable categories.\n\n## Lemma\n\nLet $\\mathcal{Y}$ be a prestack and let $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ be the coherent $\\mathcal{D}$-modules of [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html). Then $\\mathcal{D}_c(\\mathcal{Y})$ is a small, stable, idempotent-complete full subcategory of $\\mathcal{D}(\\mathcal{Y})$, and $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) = \\mathrm{Ind}\\,\\mathcal{D}_c(\\mathcal{Y})$ is stable, admits all small colimits and is compactly generated, the canonical functor $\\mathcal{D}_c(\\mathcal{Y})\\rightarrow\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$ being fully faithful with essential image the compact objects:\n\n$$\n\\mathcal{D}_c(\\mathcal{Y})\\ =_{\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})}\\ \\left(\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})\\right)^{\\omega}.\n$$\n\nConsequently every object of $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$ is the colimit of a small filtered diagram of objects of $\\mathcal{D}_c(\\mathcal{Y})$. This applies in particular to $\\mathcal{Y} = K\\backslash LX$ and to $\\mathcal{Y} = K\\backslash\\mathrm{Gr}$.\n\n## Proof\n\n**Step 1 — the ambient category, smallness, and the test functors.** The sheaf theory in force is $\\mathcal{D}^!\\colon\\mathrm{PreStk}^{op}\\rightarrow\\mathrm{DGCat}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)); with [`subsec:notations`](../../../appendix/subsec-notations.html) and [$k$-linear categories](../../../appendix/conv-dgcat.html) this makes $\\mathcal{D}(\\mathcal{Y})$ a stable presentable $k$-linear category, admitting all small colimits and hence idempotent-complete (standard, [[HTT, §4.4.5](../../../../papers/HTT.pdf)]). Smallness of $\\mathcal{D}_c(\\mathcal{Y})$ is stipulated in [`subsec:notations`](../../../appendix/subsec-notations.html) and presupposed by [`def:renormalized`](../../../appendix/def-renormalized.html) (main.tex:794), not re-derived here. By the same $\\mathrm{DGCat}$-valuedness of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html), each test pullback $f^!\\colon\\mathcal{D}(\\mathcal{Y})\\rightarrow\\mathcal{D}(S)$, for $f\\colon S\\rightarrow\\mathcal{Y}$ smooth with $S$ a finite-type dg-scheme — the ratified reading recorded at [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html) — is a morphism of $\\mathrm{DGCat}$: continuous and $k$-linear, it preserves cofibres and shifts, hence is exact (standard); like any functor it preserves retract diagrams.\n\n**Step 2 — closure of the test condition on schemes.** Fix a test scheme $S$; it is of finite type over $k$. Though $S$ is a dg-scheme, $\\mathcal{D}$-modules are insensitive to derived structure — [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) is generated from classical affine schemes, and $\\mathcal{D}(S)\\simeq\\mathcal{D}(S^{\\mathrm{cl}})$ (standard) — so t-structure and coherence below are read on the underlying classical finite-type scheme. Then $\\mathcal{K}_S$ contains $0$ and is closed in $\\mathcal{D}(S)$ under shifts, cofibres and retracts. Shifts and $0$ are immediate. For a map $\\varphi\\colon\\mathcal{F}\\rightarrow\\mathcal{G}$ in $\\mathcal{K}_S$, the long exact cohomology sequence exhibits each $H^i(\\mathrm{cofib}\\,\\varphi)$ as an extension of $\\ker\\left(H^{i+1}\\mathcal{F}\\rightarrow H^{i+1}\\mathcal{G}\\right)$ by $\\mathrm{coker}\\left(H^i\\mathcal{F}\\rightarrow H^i\\mathcal{G}\\right)$, and shows it vanishes outside the union of the two bounded ranges; the coherent $\\mathcal{D}$-modules on a classical finite-type scheme form an abelian subcategory of the heart closed under kernels, cokernels and extensions (standard noetherianity), so $\\mathrm{cofib}\\,\\varphi\\in\\mathcal{K}_S$. For retracts: each $H^i$ preserves retracts, a direct summand of a coherent module is coherent, and boundedness passes to summands.\n\n**Step 3 — $\\mathcal{D}_c(\\mathcal{Y})$ is stable and idempotent-complete.** By [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html), $\\mathcal{F}\\in\\mathcal{D}_c(\\mathcal{Y})$ iff $f^!\\mathcal{F}\\in\\mathcal{K}_S$ for every test $f$. Steps 1–2 then give: $\\mathcal{D}_c(\\mathcal{Y})$ contains $0$ and is closed in $\\mathcal{D}(\\mathcal{Y})$ under shifts in both directions, cofibres, and retracts. A full subcategory of a stable category containing $0$ and closed under shifts and cofibres is stable with exact inclusion (standard, [[HA, §1.1.3](../../../../papers/HA.pdf)]; fibres are shifted cofibres). For idempotent-completeness: an idempotent on $c\\in\\mathcal{D}_c(\\mathcal{Y})$ splits in the idempotent-complete $\\mathcal{D}(\\mathcal{Y})$ (Step 1); the splitting is a retract of $c$, hence lies in $\\mathcal{D}_c(\\mathcal{Y})$, and a splitting witnessed by a retract diagram inside a full subcategory is a splitting there, splittings of idempotents being absolute colimits (standard, [[HTT, §4.4.5](../../../../papers/HTT.pdf)]).\n\n**Step 4 — $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$: stable, cocomplete, $j$ fully faithful with compact image.** By [`def:renormalized`](../../../appendix/def-renormalized.html), $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) = \\mathrm{Ind}(\\mathcal{D}_c(\\mathcal{Y}))$, defined since $\\mathcal{D}_c(\\mathcal{Y})$ is small (Step 1). $\\mathrm{Ind}$ of a small stable category is stable [[HA, §1.1.3](../../../../papers/HA.pdf)]; it admits small filtered colimits ([`def:compactly_generated_category`](../../../appendix/def-compactly-generated-category.html)) and, since $\\mathcal{D}_c(\\mathcal{Y})$ admits finite colimits (Step 3), all small colimits [[HTT, §5.3](../../../../papers/HTT.pdf)]; $j$ is fully faithful [[HTT, §5.3](../../../../papers/HTT.pdf)]; each $j(c)$ is compact in the sense of [`def:compact_objects`](../../../appendix/def-compact-objects.html), i.e. $\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})}(j(c),-)$ preserves filtered colimits [[HTT, §5.3](../../../../papers/HTT.pdf)].\n\n**Step 5 — essential image $=$ compacts.** Let $x\\in\\left(\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})\\right)^{\\omega}$. Write $x = \\mathrm{colim}_\\alpha\\, j(c_\\alpha)$ as a small filtered colimit ([[HTT, §5.3](../../../../papers/HTT.pdf)]); compactness of $x$ factors $\\mathrm{id}_x$ through some $j(c_\\alpha)$, so $x$ is a retract of $j(c_\\alpha)$ ([[HTT, §5.4](../../../../papers/HTT.pdf)]). The associated idempotent on $j(c_\\alpha)$ lifts along the fully faithful $j$ to an idempotent on $c_\\alpha$, which splits in $\\mathcal{D}_c(\\mathcal{Y})$ by Step 3, with summand $c'$; applying $j$ to the retract diagram and using uniqueness of splittings gives $x\\simeq_{\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})} j(c')$. With Step 4 this proves the displayed equality of full subcategories of $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$, $\\mathcal{D}_c(\\mathcal{Y})$ embedded by $j$.\n\n**Step 6 — compact generation and the consequence.** Every object of $\\mathrm{Ind}(\\mathcal{D}_c(\\mathcal{Y}))$ is a small filtered colimit of objects $j(c)$ ([[HTT, §5.3](../../../../papers/HTT.pdf)]), and these are compact (Step 4); this is condition 1 of [`def:compactly_generated_category`](../../../appendix/def-compactly-generated-category.html), so $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$ is compactly generated, and re-reading the same presentation through Step 5 gives the final clause verbatim.\n\n**Step 7 — specialization.** $K\\backslash LX$ and $K\\backslash\\mathrm{Gr}$, with $K = L^+G$, $LX$ and $\\mathrm{Gr}$ as in [`subsec:notations`](../../../appendix/subsec-notations.html), are quotient prestacks, in particular prestacks; no hypothesis beyond \"prestack\" was used, so the lemma applies to both. $\\blacksquare$\n\n## Caveats\n\n- The finite-type ratified reading in [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html) is load-bearing in Step 2: noetherianity of the (classical truncations of the) test schemes is what closes coherent cohomology under kernels, cokernels, extensions and summands.\n- Of [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html) the proof uses only its $\\mathrm{DGCat}$-valuedness — on objects (Step 1) and on morphisms (exactness of each $f^!$) — never the Kan-extension mechanics. And per [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html), coherent $\\ne$ compact in $\\mathcal{D}(\\mathcal{Y})$: the identification of compacts asserted here is made in $\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y})$.\n";</script>
