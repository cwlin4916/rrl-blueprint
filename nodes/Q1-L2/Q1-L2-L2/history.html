red** during the family-wide formatting pass of `/update Q1-L2-L3`. The proof cited \"the node's own Remark\" three times, in its **uses** line and in Steps 0 and 3(3c) — but [ADR 0027](../../../process/decisions/0027-a-node-carries-its-history.html) retired `## Remark` on 2026-08-04 and folded this node's into the creation entry above, so the citations pointed at a section that no longer existed. They were load-bearing, not decorative: what they invoked is the reading that $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits. That reading is recorded inside the closed world — it is the note on [`def:generation`](../../../appendix/def-generation.html), already in this node's `objects:` — so all three now cite the entry. ADR 0027 forbids a proof citing a History entry, which is why the fix was not a redirected pointer.\n";</script>
