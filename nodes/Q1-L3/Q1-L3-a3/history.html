<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L3-a3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L3-a3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q1-L3-a3 — history\n\n[Q1-L3-a3](index.html) · [Q1](../../../dag.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-04 — created**: promoted from the [Q1-L3 `/examples` run](../examples.html) of the same day (instance 4, candidate 3) at the user's direction. It is BZSV's own decategorification of the Satake subcategory [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html) — \"$\\mathcal{T}_V\\star\\delta_X$ matches with the function obtained by applying the corresponding Hecke operator $T_V$ to $1_{X(\\mathfrak{o})}$\" (§7.5.3) — with $\\mathbf{1}_{X(\\mathfrak{o})}$ the shadow of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and the module structure that of [the Hecke action](../../../appendix/conv-hecke-action.html); it mirrors clause (iii) of [Q1-L3](../index.html) as a cyclicity question. It is loose in that hyperspecial level, $\\mathbb{C}$-coefficients, and the derived phenomena of BZSV (9.15) are dropped. Whether $\\mathbf{1}_{X(\\mathfrak{o})}$ generates is posed at BZSV §9.4 and answered nowhere in print, confirming the shape of [Q1-L3](../index.html): generation by the basic vector is a nontrivial condition, to be tested orbit by orbit. The question-level form of this analogy is [Q1-a1](../../Q1-a1/index.html). Sources: Aizenbud–Avni–Gourevitch, Comment. Math. Helv. 87 (2012) 929–962, as quoted at Sakellaridis–Venkatesh Rem. 5.1.7 (`refs.bib`: `SV17`; AAG12 itself has no key); Ben-Zvi–Sakellaridis–Venkatesh §9.4, (9.15), pp. 200–201 (`refs.bib`: `BZSV`); Sakellaridis, *Spherical functions on spherical varieties*, arXiv:0905.4244.\n- **2026-08-04 — evidence swing** (recorded at [Q1-a1 updates/u1.md](../../../../blueprint/nodes/Q1-a1/updates/u1.md)): the creation entry's \"answered nowhere in print\" is superseded — arXiv:0905.4244 answers the cyclicity question both ways under its §8 hypotheses: Cor. 8.0.4(1), generation iff the restriction map is surjective, and Ex. 8.0.1, a split homogeneous affine counterexample with fiber multiplicity $>1$ at fused parameters. The Statement above already poses exactly that criterion and needs no revision; note the paper's setting is characteristic-zero local fields, and part 1's finite generation (AAG12) is unaffected.\n";</script>
