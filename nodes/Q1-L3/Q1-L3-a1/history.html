. It is loose in that it is decategorified and clause (ii) of [Q1-L3](../index.html) trivializes here. Sources: Mirković–Vilonen, Ann. of Math. 166 (2007), p. 4 and (2.1)–(2.2) (`refs.bib`: `mirkovic2007geometric`); Sakellaridis–Venkatesh, Astérisque 396 (2017), Thm 5.3.3 with p. 78 (`refs.bib`: `SV17`).\n";</script>
