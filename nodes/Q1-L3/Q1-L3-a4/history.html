hich is exactly why the standing class excludes it; item 3 is a constructed witness, not a published one, and item 1 does not contradict [Q1-L3](../index.html), which asserts necessity of saturation, not saturation itself. Sources: Aizenbud–Sayag, arXiv:1709.08214, Thm A and Rem. 1.0.1 (no `refs.bib` key); Hironaka, *Spherical functions and local densities on Hermitian forms*, J. Math. Soc. Japan 51 (1999) 553–581 (no key); Sakellaridis, Algebra & Number Theory 6 (2012), arXiv:0905.4245, Rem. 2.3.9 (no key); pointer at Sakellaridis–Venkatesh, Astérisque 396 (2017), §16.3, p. 243 (`refs.bib`: `SV17`).\n- **2026-08-04 — statement renotated** by `/update` ([u1](../../../../blueprint/nodes/Q1-L3/Q1-L3-a4/updates/u1.md), notation audit): the equal-characteristic toy in clause 3 wrote its ring $\\mathfrak{o} = k[[t]]$ and now writes the blueprint's $\\mathcal{O}$ ([ring of integers](../../../appendix/conv-ring-of-integers.html)); clause 2's $\\mathfrak{o}_F$ is Sakellaridis's own symbol and is now declared as such. No mathematical content changed.\n";</script>
