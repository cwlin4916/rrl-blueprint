under this dictionary, not literal instances. This file is outside the closed world: no proof may cite it.\n\n## Precedent\n\n**What was searched.** On disk: `SV17.pdf` (arXiv:1203.0039v4) §§4–5 in full (pp. 58–80), §16.3 (pp. 243–245), bibliography; `BZSV.pdf` §7.5.2–7.5.5 (pp. 162–163) and §9.3–9.4 (pp. 200–201); `mirkovic2007geometric.pdf` pp. 4–9. Web, read in full: Sakellaridis, *Spherical varieties and integral representations of L-functions*, arXiv:0905.4245v3, §2.3; Aizenbud–Sayag, arXiv:1709.08214. The predecessor `Lin2025tamelocalBZSV` is `@misc` \"In preparation\" in `refs.bib` with no PDF on disk, so it cannot serve as printed precedent.\n\n**What was found.** No source states (i)–(iii) at sheaf level. The closest items: (a) BZSV p. 163 (read): under their Conjecture 7.5.1, \"*all sheaves on $X_F/G_O$ can be generated from the basic object through the action of Hecke functors*\" — the **converse** direction, asserted as a consequence of the conjecture, with no unconditional support bound accompanying it; §7.5.3 (p. 162) introduces exactly the generating family $\\mathcal{T}_V\\star\\delta_X$ and its function-theoretic match $T_V(1_{X(\\mathfrak{o})})$. (b) A set-theoretic special case of the saturation geometry in print: for the group, every point of $\\mathrm{Gr}$ lies in a $G_{\\mathcal{O}}$-orbit $\\mathcal{G}r^\\lambda$, $\\lambda$ dominant, with closures given by (2.2) — Mirković–Vilonen, *Geometric Langlands duality and representations of algebraic groups over commutative rings*, Ann. of Math. 166 (2007), p. 4 and (2.1)–(2.2) (read) — which is $LX^{\\mathrm{sat}}=LG$ in the group case. (c) At the level of $F$-points over $\\mathcal{K}=\\mathbb{C}((t))$: Sakellaridis, ANT 6 (2012), **Theorem 2.3.1** (read; attributed to Luna–Vust [LV83], reproved by Gaitsgory–Nadler [GN10]): $G(\\mathfrak{O})$-orbits on $X^+(\\mathcal{K})$ are parametrized by $\\Lambda_X^+$, via $\\check\\lambda\\mapsto\\check\\lambda(t)\\in A_X(\\mathcal{K})$. Nothing found entails (i)–(iii), and nothing contradicts them.\n\n**What was not found.** The natural home is BZSV §7.5: it poses generation from the basic object but never raises the support obstruction — the observation that Hecke translates of $\\mathrm{IC}_0$ cannot leave $LX^{\\mathrm{sat}}$, so that saturation is a *necessary* condition for the conjecture's \"all sheaves\" clause, is absent there (their Lemma 7.5.13 concerns equivariantization, not support). Gaitsgory–Nadler (Mosc. Math. J. 10 (2010)) and Sakellaridis's Theorem 2.3.1 live on the open-orbit loop space $X^+(\\mathcal{K})$, where the boundary strata of $LX$ that make saturation nontrivial are absent by construction. Chen–Yi (arXiv:2310.20006, symmetric case; read in earlier runs, recorded in [papers/guideline.md](../../papers/guideline.html)) take the full category $\\mathrm{Perv}(L^+G\\backslash LX)$ as primitive rather than a Hecke-generated subcategory, so the question does not arise. The classical analogues below are abundant in print; the sheaf-level statement is not.\n\n## Instances\n\n### 1. The group case $X=H$ under $G=H\\times H$ — a genuine sheaf-level instance\n\n**What it is.** $H$ connected reductive, $X=H$ with the two-sided action; $LX=LH$, $K$-orbits indexed by $\\Lambda^+$ per [`def:orbits_iwahori_spherical`](../../appendix/def-orbits-iwahori-spherical.html) (group case, main.tex:317).\n\n**Why it is an instance.** Smooth affine: $H$ is. Spherical with connected $B$-stabilizer: the open Bruhat cell gives the open $B\\times B^-$-orbit with diagonal-torus stabilizer. Placidity input of [`thm:chen_Ti`](../../appendix/thm-chen-ti.html): the group case is the affine Grassmannian itself.\n\n**What the statement says here.** $LX^{\\mathrm{sat}}=\\bigcup_\\mu\\overline{LH}_\\mu\\cdot L^+H=LH$, because every point of $\\mathrm{Gr}_H$ lies in some $\\mathcal{G}r^\\lambda$ (Mirković–Vilonen p. 4, orbits parametrized by dominant coweights; closures by (2.2); read). So (i) is vacuous, (ii) is the standard nonvanishing of $\\overline{i}_{\\lambda,*}\\omega$, and the necessary condition in (iii) holds — consistent with the group case being the known extreme of Q1. Classical shadow: the Cartan decomposition $H(F)=\\coprod_{\\mu\\in\\Lambda^+}K\\varpi^\\mu K$ — Sakellaridis–Venkatesh's Theorem 5.3.3 \"generalizes the Cartan and Iwasawa decompositions\" (p. 78, read) — and $C_c^\\infty(K\\backslash H(F))^K=\\mathcal{H}(H,K)$ is cyclic on $\\mathbf{e}=\\mathbf{1}_K$, the unit.\n\n**Source.** Mirković–Vilonen 2007, p. 4, (2.1)–(2.2) (`refs.bib`: `mirkovic2007geometric`); Sakellaridis–Venkatesh, Astérisque 396 (2017), §5.3 p. 78 (`refs.bib`: `SV17`).\n\n### 2. Tate's case $X=\\mathbb{A}^1$, $G=\\mathbb{G}_m$ — degenerate classical analogue\n\n**What it is.** $X(F)=F$, $K=\\mathfrak{o}^\\times$, $\\mathcal{H}=\\mathbb{C}[\\Lambda]=\\mathbb{C}[t^{\\pm1}]$, $\\mathbf{e}=\\mathbf{1}_{\\mathfrak{o}}$.\n\n**Why it is an analogue.** Smooth affine spherical with trivial (connected) generic stabilizer; the standing hypotheses of [context](../../context.html) hold for its sheaf-level parent (BZSV's placid list, and Q1-e2's Iwasawa–Tate node). Mirrors (i) and (iii) positively: $\\varpi^{-n}\\cdot\\mathbf{1}_{\\mathfrak{o}}=\\mathbf{1}_{\\varpi^{-n}\\mathfrak{o}}$ up to normalization, so $\\mathcal{H}\\cdot\\mathbf{e}=\\operatorname{span}\\{\\mathbf{1}_{\\varpi^n\\mathfrak{o}}\\}=C_c^\\infty(F)^{\\mathfrak{o}^\\times}$, matching $F=F^\\times\\cdot\\mathfrak{o}$, i.e. saturation *(constructed, unsourced — a routine specialisation of the framework of BZSV §9.4, p. 200, read)*.\n\n**What the statement says here — and a disanalogy.** Saturation holds and the module is cyclic. But the closed orbit $\\{0\\}$ supports **no** element of $C_c^\\infty$ ($\\mathbf{1}_{\\{0\\}}$ is not locally constant), while clause (ii)'s object $\\overline{i}_{\\lambda,*}\\,\\omega$ on a positive-codimension closed stratum is nonzero. Clause (ii) is genuinely sheaf-theoretic; the function-theoretic side cannot even state it. This is why the classical ladder illustrates but cannot prove Q1-L3.\n\n**Source.** BZSV §9.4, p. 200–201 (read). `refs.bib`: `BZSV`.\n\n### 3. The Cartan decomposition for spherical varieties — the classical form of (ii)\n\n**What it is.** $X$ spherical over a $p$-adic field, $K=G(\\mathfrak{o})$ hyperspecial: every $K$-orbit on $X(F)$ (resp. $X^+(F)$) is represented in $A_X(F)^+$, and points with distinct image in $\\Lambda_X^+$ lie in distinct orbits.\n\n**Why it is an analogue.** This is the function-theoretic shadow of the node's input that the $K$-orbits $LX_\\lambda$ are indexed by $\\Lambda_X^+$ ([`thm:chen_Ti`](../../appendix/thm-chen-ti.html) posets). Hypotheses of the classical results, discharged: $G$ split (SV17 §1.1, read); smooth integral models with $x_0\\in\\mathring{X}(\\mathfrak{o})$ (SV17 p. 78, read); *wavefront* for the finiteness statements — SV17 Lemma 5.3.1 ($A_X^+U=X$ for compact $U$) and its consequence (p. 77, read): finitely many $x_1,\\dots,x_n\\in\\mathring{X}$ with $\\bigcup_i x_iA^+U=X$.\n\n**What the classical statement concludes.** SV17 **Theorem 5.3.3** (read): $A_X^+$ contains a complete set of representatives for $K$-orbits on $X$, separated by $\\Lambda_X^+$. Proved in Sakellaridis, ANT 6 (2012) — **Theorem 2.3.8** (read): moreover *\"the orbits contained in $X(\\mathfrak{o}_F)$ are precisely those mapping to $\\Lambda_X^+\\cap\\mathcal{C}(X)$\"*, the classical interface between clauses (ii) and (iii); bijective onto $\\Lambda_X^+$ when $\\mathcal{X}(A)/\\mathcal{X}(X)$ is torsion-free. Symmetric case: Delorme–Sécherre, Pacific J. Math. 251 (2011) 1–21; Benoist–Oh, IMRN 2007, rnm121 (both cited at SV17 p. 76, 78, read). Over $\\mathcal{K}=\\mathbb{C}((t))$ the splitting disappears: Theorem 2.3.1 (Luna–Vust) gives orbits $\\leftrightarrow\\Lambda_X^+$ exactly — the direction relevant to the node's residue field $k=\\bar{k}$.\n\n**Source.** `refs.bib`: `SV17`; Sakellaridis, *Spherical varieties and integral representations of L-functions*, ANT 6 (2012) 611–667, arXiv:0905.4245, `refs.bib`: absent.\n\n### 4. The Hecke module of the basic function — the classical form of the Satake subcategory\n\n**What it is.** The submodule $\\mathcal{H}(G(F),K)\\cdot\\mathbf{e}\\subseteq C_c^\\infty(X(F))^K$ and its ambient module.\n\n**Why it is an analogue.** It is BZSV's own decategorification of [`def:satake_subcategory`](../../appendix/def-satake-subcategory.html): \"$\\mathcal{T}_V\\star\\delta_X$ matches with the function obtained by applying the corresponding Hecke operator $T_V$ to $1_{X(\\mathfrak{o})}$\" (§7.5.3, p. 162, read).\n\n**What the classical results say.** Aizenbud–Avni–Gourevitch (Comment. Math. Helv. 87 (2012) 929–962; quoted at SV17 Remark 5.1.7, read): $C_c^\\infty(X)^J$ is **finitely generated** over $\\mathcal{H}(G,J)$ for any open compact $J$ — finite generation, not cyclicity. For $k=\\mathbb{C}$, BZSV p. 201 (read) deduce from [Sak13] an isomorphism of Hecke modules with distinguished vector, $C_c^\\infty(X_F/G_O)\\simeq\\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$, $\\mathbf{e}\\mapsto1$; whether $\\mathbf{e}$ *generates* — clause (iii)'s classical hypothesis — is posed (§9.4) and answered nowhere. So the classical literature confirms exactly the shape of Q1-L3: generation by $\\mathbf{e}$ is a nontrivial condition, to be tested orbit by orbit.\n\n**Source.** `refs.bib`: `SV17`, `BZSV`; AAG12 `refs.bib`: absent.\n\n### 5. Boundary: saturation fails when a hypothesis fails\n\n**What it is.** Two specimens. **(a) Toy, char 0:** $X=\\mathbb{G}_m$ with $G=\\mathbb{G}_m$ acting by $t\\cdot x=t^2x$ — smooth affine spherical, but the generic stabilizer is $\\mu_2$, **disconnected**, so the standing connectedness hypothesis of [context](../../context.html) fails. Over $k((t))$: $L^+X=\\mathfrak{o}^\\times$, $\\overline{LG}_\\mu=t^\\mu\\mathfrak{o}^\\times$, so $LX^{\\mathrm{sat}}=\\bigsqcup_\\mu t^{2\\mu}\\mathfrak{o}^\\times$ = the even-valuation locus $\\subsetneq LX$, while the $K$-orbits are $LX_n=t^n\\mathfrak{o}^\\times$, $n\\in\\Lambda_X=\\mathbb{Z}$: every odd orbit lies outside $LX^{\\mathrm{sat}}$, so by (i)–(ii) the objects $\\overline{i}_{2k+1,*}\\omega$ are not in the Satake subcategory *(constructed, unsourced — a two-line valuation computation)*. The mechanism of (iii) fires; this is **not** a counterexample to the node (the node asserts necessity, not saturation), and the failing hypothesis is exactly the one the standing class imposes. The published form of the mechanism: Sakellaridis, ANT 2012, **Remark 2.3.9** (read) — for $X^+=H\\backslash G$ with $H$ **connected**, $G(\\mathfrak{o}_F)\\to X^+(\\mathfrak{o}_F)$ is surjective by Lang's theorem, \"but it is also not always the case … when $H$ is not connected\". **(b) Published, $p$-adic:** $X$ = Hermitian forms of determinant 1 on $E^n$, $E/F$ unramified quadratic, $G=SL_n(E)$: $C_c^\\infty(X)^{K_0}$ (the source's Schwartz space; the two agree for smooth affine $X$ over a $p$-adic field) is a **free $\\mathcal{H}(G,K_0)$-module of rank $2^{n-1}$** — Aizenbud–Sayag, arXiv:1709.08214, **Theorem A** (read), the $GL_n$-version being Hironaka's (J. Math. Soc. Japan 51 (1999) 553–581; Remark 1.0.1 of loc. cit., and the pointer at SV17 §16.3, p. 243, read). A free module of rank $\\geq2$ over a commutative ring is not cyclic, so no single vector — in particular no basic function — generates: the classical Satake submodule is proper.\n\n**Which hypotheses of the loop-space setting fail here.** In (b): the residue field is finite (over $k=\\bar{k}$ the splitting mode of Remark 2.3.9 is absent — Theorem 2.3.1 gives clean $\\Lambda_X^+$-indexing) and the pair is a non-split form ($\\mathrm{Res}_{E/F}$), outside SV17's own split standing hypothesis. In (a): disconnectedness survives base change to $k=\\bar{k}$ — the one classical failure mode that **does** transfer to $\\mathbb{C}((t))$, which is why the standing class excludes it.\n\n**Source.** Aizenbud–Sayag arXiv:1709.08214; Hironaka, *Spherical functions and local densities on Hermitian forms*, J. Math. Soc. Japan 51 (1999); Sakellaridis ANT 6 (2012) Rem. 2.3.9; `refs.bib`: all absent except `SV17`.\n\nEVIDENCE: instances\n\n## Promotion candidates\n\nSimplest first; each entry is meant to be materializable verbatim as an `analogy` node ([ADR 0018](../../process/decisions/0018-example-and-analogy-nodes.html), [ADR 0021](../../process/decisions/0021-example-and-analogy-nodes-nest.html)). Tate's case (instance 2) is deliberately not proposed: Q1-e2 already covers Iwasawa–Tate and the classical content is one line.\n\n1. **Q1-L3-a1 — Cartan decomposition of the group; the Hecke module is cyclic.** Role: `analogy`. *Statement:* Let $H$ be a split connected reductive group over a nonarchimedean local field $F$, $K=H(\\mathfrak{o})$ hyperspecial. Then $H(F)=\\coprod_{\\mu\\in\\Lambda^+}K\\mu(\\varpi)K$, and consequently $C_c^\\infty(K\\backslash H(F))^K=\\mathcal{H}(H(F),K)$ is cyclic as a module over itself, generated by the basic function $\\mathbf{1}_K$; over $\\mathcal{K}=\\mathbb{C}((t))$ the same decomposition reads $\\mathrm{Gr}_H=\\bigcup_{\\lambda\\in\\Lambda^+}\\mathcal{G}r^\\lambda$ with closures given by the dominance order. *Sources:* Mirković–Vilonen, Ann. of Math. 166 (2007), p. 4 and (2.1)–(2.2); Sakellaridis–Venkatesh, Astérisque 396 (2017), Thm 5.3.3 with p. 78. *Mirrors:* clause (iii) in the positive direction ($LX^{\\mathrm{sat}}=LG$); loose in that it is decategorified and clause (ii) trivializes.\n2. **Q1-L3-a2 — the Cartan decomposition for spherical varieties.** Role: `analogy`. *Statement:* For $X$ spherical under split $G$ over a $p$-adic field, with smooth integral models, $x_0\\in\\mathring{X}(\\mathfrak{o})$, $K=G(\\mathfrak{o})$: every $K$-orbit on $X(F)$ meets $A_X(F)^+$, orbits with distinct image in $\\Lambda_X^+$ are distinct, the map to $\\Lambda_X^+$ is a bijection when $\\mathcal{X}(A)/\\mathcal{X}(X)$ is torsion-free, and the orbits inside $X(\\mathfrak{o})$ are exactly those over $\\Lambda_X^+\\cap\\mathcal{C}(X)$; over $\\mathbb{C}((t))$, $G(\\mathfrak{O})$-orbits on $X^+(\\mathcal{K})$ are $\\Lambda_X^+$ exactly (Luna–Vust). If $X$ is wavefront, finitely many base points suffice: $\\bigcup_ix_iA^+U=X$. *Sources:* Sakellaridis, ANT 6 (2012), Thms 2.3.1, 2.3.8, Rem. 2.3.9; SV17 Lemma 5.3.1, Cor. 5.3.2, Thm 5.3.3 (pp. 76–78); Delorme–Sécherre, Pacific J. Math. 251 (2011); Benoist–Oh, IMRN 2007 rnm121. *Mirrors:* clause (ii)'s $\\Lambda_X^+$-indexing and the integrality interface of (iii); loose: it lives on $X^+(F)$, and over $p$-adic $F$ orbits split by finite Galois data absent over $k((t))$.\n3. **Q1-L3-a3 — finite generation and the $k=\\mathbb{C}$ model of the Hecke module.** Role: `analogy`. *Statement:* For $X$ a wavefront spherical variety with $\\mathcal{Z}(G)^0\\twoheadrightarrow\\mathcal{Z}(X)$ over a $p$-adic field, $C_c^\\infty(X(F))^J$ is finitely generated over $\\mathcal{H}(G(F),J)$ for every open compact $J$ (Aizenbud–Avni–Gourevitch); for $k=\\mathbb{C}$ and $X$ in the range of [Sak13], $C_c^\\infty(X_F/G_O)\\simeq\\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$ as Hecke modules with $\\mathbf{1}_{X(\\mathfrak{o})}\\mapsto1$, so the saturation question becomes: is the (twisted) restriction $\\mathbb{C}[\\check{G}]^{\\check{G}}\\to\\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$ surjective? *Sources:* Aizenbud–Avni–Gourevitch, Comment. Math. Helv. 87 (2012) 929–962 (as quoted at SV17 Rem. 5.1.7); BZSV §9.4, (9.15), pp. 200–201. *Mirrors:* the definition of the Satake subcategory and clause (iii) as a cyclicity question; loose: hyperspecial level, $\\mathbb{C}$-coefficients, and the derived phenomena of (9.15) are dropped.\n4. **Q1-L3-a4 — failure of saturation: disconnected stabilizers and non-cyclic Hecke modules.** Role: `analogy`. *Statement:* (i) For $E/F$ unramified quadratic, residual characteristic $\\neq2$, $X$ = determinant-one Hermitian forms on $E^n$, $G=SL_n(E)$: $\\mathcal{S}(X)^{K_0}$ is a free $\\mathcal{H}(G,K_0)$-module of rank $2^{n-1}$, hence not cyclic for $n\\geq2$ — no basic function generates (Aizenbud–Sayag Thm A; $GL$-version Hironaka 1999). (ii) For $X^+=H\\backslash G$, surjectivity of $G(\\mathfrak{o}_F)\\to X^+(\\mathfrak{o}_F)$ holds for $H$ connected by Lang's theorem and can fail for $H$ disconnected (Sakellaridis ANT 2012, Rem. 2.3.9). (iii) Toy witness over any $k=\\bar{k}$: $X=\\mathbb{G}_m$ under the square action of $\\mathbb{G}_m$ (stabilizer $\\mu_2$): $LX^{\\mathrm{sat}}$ is the even-valuation locus, a proper closed subset, so the Satake subcategory omits every odd orbit *(constructed, unsourced)*. *Sources:* arXiv:1709.08214, Thm A and Rem. 1.0.1; Hironaka, J. Math. Soc. Japan 51 (1999) 553–581; Sakellaridis ANT 6 (2012), Rem. 2.3.9; SV17 §16.3 p. 243. *Mirrors:* the contrapositive of clause (iii) — it shows the connected-stabilizer standing hypothesis is load-bearing for Q1's hoped-for equality; loose: (i) is non-split with finite residue field, and only mechanism (iii) survives over $k((t))$.\n";</script>
