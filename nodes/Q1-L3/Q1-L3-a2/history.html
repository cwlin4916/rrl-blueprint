due field is the Luna–Vust one. Sources: Sakellaridis, *Spherical varieties and integral representations of L-functions*, Algebra & Number Theory 6 (2012) 611–667, arXiv:0905.4245, Thms 2.3.1 and 2.3.8, Rem. 2.3.9 (no `refs.bib` key); Sakellaridis–Venkatesh, Astérisque 396 (2017), Lemma 5.3.1, Cor. 5.3.2, Thm 5.3.3, pp. 76–78 (`refs.bib`: `SV17`); symmetric case: Delorme–Sécherre, Pacific J. Math. 251 (2011) 1–21; Benoist–Oh, IMRN 2007, rnm121.\n- **2026-08-04 — statement renotated** by `/update` ([u1](../../../../blueprint/nodes/Q1-L3/Q1-L3-a2/updates/u1.md), notation audit): $\\mathfrak{o}$ entered undeclared; the statement now names it — “its ring of integers $\\mathfrak{o}$” — per the new appendix convention ([ring of integers](../../../appendix/conv-ring-of-integers.html)). No mathematical content changed.\n";</script>
