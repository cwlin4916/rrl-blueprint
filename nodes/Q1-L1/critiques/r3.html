<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="../index.html">Q1-L1</a><i>›</i><span>r3</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Critique: Q1-L1, round 3</h1><p class="lead">Generated from <code>blueprint/nodes/Q1-L1/critiques/r3.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nReviewed: the condensed `blueprint/nodes/Q1-L1/Q1-L1.tex` (92 lines, one page) against the frozen statement in `blueprint/nodes/Q1-L1/node.md`, `blueprint/appendix.md`, `blueprint/context.md`, `docs/pipeline.md` (I1, I6, I9), `milton_commands.tex`, and the two earlier critiques `Q1-L1-r1.md`, `Q1-L1-r2.md`. The long draft (`drafts/lemmas/Q1-L1.tex`) no longer exists, so the \"was it dropped or delegated?\" question was answered by matching each of r1's audited steps against the surviving text and against the appendix.\n\n## Verification performed (hostile sweep)\n\n- **Hallucination — citations.** The draft contains no `\\cite` at all, so nothing to check against `refs.bib`; no v2.tex `\\label` and no v2.tex line number is quoted. Vacuously clean.\n- **Hallucination — appendix keys.** All six keys named in the \"Uses\" line resolve to real anchors: `def:satake_subcategory` (#def-satake-subcategory), `def:generation` (#def-generation), `defn:coherent_D_mod` (#defn-coherent-d-mod), `def:renormalized` (#def-renormalized), `def:small_relative_tensor` (#def-small-relative-tensor), `p:compact_generation_stable_case` (#p-compact-generation-stable-case). The line is prefixed \"Appendix entries\", which keeps `def:renormalized` legitimate — it is a blueprint-only key for the unlabelled v2.tex:794 definition, and the draft correctly does not present it as a manuscript label.\n- **Macros.** `\\bs`, `\\ra`, `\\hra`, `\\anbr`, `\\crbr`, `\\from` are in `milton_commands.tex`; `\\cA`–`\\cU` come from the `\\mathcal` loop (line 152–154), `\\Sat`, `\\IC`, `\\perf`, `\\ren`, `\\Ind`, `\\Map`, `\\Gr` from the operator/text lists (lines 177, 185–188). `\\Thick` is defined locally rather than invented. No stray house vocabulary.\n- **I6 scope.** Naming labels in `\\texttt{}` inside a `.tex` file under `blueprint/` is *not* an I6 violation: I6 is scoped to blueprint **markdown**. No flaw here.\n- **Do the cited entries say what they are used for?** Yes, in each case I checked the entry text, not the label:\n  - `def:satake_subcategory`'s note carries verbatim the ratified display $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\cap\\langle\\cdots\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$ that step (3) invokes in its last sentence;\n  - `def:generation` gives exactly \"smallest cocomplete stable subcategory\", which is what steps (2)–(3) use (the entry's alternative \"$\\operatorname{Map}(c_\\alpha[-i],c)=0\\Rightarrow c=0$\" clause, which would be a different and hypothesis-laden characterisation, is correctly *not* used);\n  - `def:small_relative_tensor`(1) supplies $\\mathrm{Cat}^{\\mathrm{perf}}$, and (2) — the adjoint equivalence $\\mathrm{Ind}\\colon\\mathrm{Cat}^{\\mathrm{perf}}\\rightleftarrows\\mathrm{Pr}^L_{\\mathrm{st},\\omega}$ — is genuinely what licenses \"so $L:=\\mathrm{Ind}(j)$ preserves small colimits\" in step (2). This is a correct and non-obvious delegation;\n  - `def:renormalized` supplies $\\mathcal{N}=\\mathrm{Ind}\\,\\mathcal{M}_c$;\n  - `defn:coherent_D_mod` supplies the test-functor definition — see Flaw 1 for the one place where the draft's paraphrase of it slips.\n- **Step (2), full faithfulness.** The displayed formula is correct and each equivalence is licensed: $L\\tilde y = \\varinjlim_i j(y_i)$ because $L$ preserves filtered colimits; the interchange $\\varprojlim_i\\varinjlim_{i'}$ uses compactness of $j(y_i)$ in $\\mathcal{N}$, which is exactly what step (1) delivers; $\\operatorname{Map}_{\\mathcal{N}}(jy_i,jy'_{i'})\\simeq\\operatorname{Map}_{\\mathcal{T}}(y_i,y'_{i'})$ uses fullness of $\\mathcal{T}\\subset\\mathcal{M}_c$ and Yoneda full faithfulness of $\\mathcal{M}_c\\to\\mathrm{Ind}\\,\\mathcal{M}_c$ (standard, I1-admissible). The essential-image argument is correct: a diagram in $\\mathcal{L}$ lifts because $L$ is an equivalence onto $\\mathcal{L}$, and $\\mathrm{Ind}\\,\\mathcal{T}$ is cocomplete. Closure under $[\\pm 1]$ plus finite colimits does give a *stable* subcategory ($\\mathrm{fib}(f)=\\mathrm{cofib}(f)[-1]$), so $\\langle S\\rangle\\subseteq\\mathcal{L}$ is legitimate against `def:generation`.\n- **Step (3), the compactness transport — the step flagged as at risk.** It survives condensation intact. All four links are present or immediately licensed by the preceding sentence: (a) $c\\in\\mathcal{M}_c=\\mathcal{N}^\\omega$ is compact in $\\mathcal{N}$; (b) *hence compact in $\\mathcal{L}$* — licensed by step (2)'s \"closed under small colimits of $\\mathcal{N}$\", so filtered colimits in $\\mathcal{L}$ are computed in $\\mathcal{N}$; (c) $L$ is an equivalence onto $\\mathcal{L}$, so $c$ comes from $(\\mathrm{Ind}\\,\\mathcal{T})^\\omega$; (d) $(\\mathrm{Ind}\\,\\mathcal{T})^\\omega=\\mathcal{T}$ needs idempotent-completeness of $\\mathcal{T}$, which step (2) established via \"$\\mathcal{T}$ lies in $\\mathrm{Cat}^{\\mathrm{perf}}$\". The HTT citation of the long version is gone but the hypothesis it needed is still proved, so this is delegation to standard mathematics, not a dropped step. The parenthetical \"closed under small colimits of a cocomplete category, hence under retracts\" is the $\\mathrm{Idem}$-colimit argument and is standard.\n- **Steps (4)–(5).** Sound. Preimage of a thick subcategory under an exact retract-preserving functor is thick; associativity plus monoidality of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ gives $S\\subseteq\\mathcal{U}$; minimality closes it. The conclusion $\\mathcal{T}\\subseteq\\mathcal{U}$ is the submodule assertion of the frozen statement, not a weaker one.\n- **Circularity.** `depends-on` is empty and no node is invoked. The ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, though ratified *at* this node, is now carried by the appendix entry `def:satake_subcategory` and by `context.md`'s ratified-readings list, so citing it is inside the closed world rather than self-licensing. `thm:F_cstr_Sat` — the evidence for the reading — is invoked only in `node.md`'s Remark, never in the proof. No circularity.\n- **Migration of the long version's three remarks.** `rem:nonren` → caveat (i); `rem:general_tests` → caveat (ii); `rem:reading` (the evidence for the $\\mathcal{D}^{\\mathrm{ren}}$ ambient: v2.tex:1391–1392 and Q1-L2's phrasing) → `node.md`'s Remark plus the note on `def:satake_subcategory` plus ADR 0001 (`docs/decisions/0001-satake-generation-ambient-category.md` exists). Delegated, not dropped. Neither caveat is a `GAP` in disguise: (i) declines a claim about a reading the frozen statement does not make, and (ii) describes the cost of a reading that `context.md` has ratified away. There is no `GAP` marker anywhere in the file.\n- **r1/r2 resolution.** r1's single MAJOR (the literal `GAP` marker) is genuinely resolved — no marker survives, and the ambiguity it flagged is settled at blueprint level. r2's two MINORs are moot: the passages they targeted (`ntn:test`'s stale \"should be ratified\", `de:reading`'s \"unique cocompletion\") were deleted wholesale. See Flaw 7 on the missing response block.\n\n## Flaws\n\n**Flaw 1** [MINOR] (location: lines 43–46, \"$\\mathcal{D}(S')^\\omega$ is closed under finite colimits, shifts and retracts, and these properties pass to the intersection of the preimages, which is $\\mathcal{M}_c$\")\n\nThe draft substitutes the *compact* objects $\\mathcal{D}(S')^\\omega$ for the subcategory the definition actually names. `defn:coherent_D_mod` tests whether $f^!\\mathcal{F}$ \"is a finite complex of $\\mathcal{D}$-modules with coherent cohomology\", i.e. whether $f^!\\mathcal{F}\\in\\mathcal{D}_c(S')$. So the intersection of the preimages of $\\mathcal{D}(S')^\\omega$ is $\\mathcal{M}_c$ only if $\\mathcal{D}(S')^\\omega=\\mathcal{D}_c(S')$ for finite-type $S'$ — a fact that has **no appendix entry**. It is precisely the identification the blueprint's standing warning forbids making silently (`context.md` line 35, \"Coherent is not compact\"; `defn:coherent_D_mod` note (ii), which asserts only *safe* $=$ *coherent* on finite-type schemes and says nothing about compactness). As literally written, the sentence proves the thickness of the wrong subcategory and then names it $\\mathcal{M}_c$.\n\nNot fatal, because the repair is one symbol and the repaired claim is I1-admissible standard mathematics: $\\mathcal{D}_c(S')$ itself is closed under cofibres, shifts and retracts (coherent cohomology is preserved by the long exact sequence over a Noetherian base, and a direct summand of a coherent module is coherent), which is exactly what the preimage-intersection argument consumes. But note that caveat (ii) at line 88–90 concedes the general reading \"would need the coherent objects on each to form a thick subcategory\" — that property is needed for finite-type $S'$ *too*, and $(-)^\\omega$ is silently standing in for it. Either write $\\mathcal{D}_c(S')$ and say why it is thick, or add an appendix entry for compact $=$ coherent on finite-type schemes.\n\n**Flaw 2** [MINOR] (location: \"Uses\" line 21–24, versus steps (3), (4), (5))\n\nThe convolution facts are load-bearing and undeclared. Step (3) needs $S\\subseteq\\mathcal{M}_c$, i.e. $\\mathcal{F}\\ast\\mathrm{IC}_0$ coherent — without it $\\mathcal{T}=\\mathrm{Thick}_{\\mathcal{M}_c}(S)$ is not even well-formed. Step (5) needs $\\mathcal{F}'\\ast(-)$ to be an endofunctor of $\\mathcal{M}_c$ (it forms a preimage *inside* $\\mathcal{M}_c$), plus associativity and $\\mathcal{F}'\\ast\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$. Step (4) needs unitality and $\\delta\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$. None of this is standard mathematics needing no citation: r1 established that v2.tex *asserts* coherence-preservation without proof (v2.tex:1383), and the long version carried it explicitly as \"Fact 5(a)–(c)\". It is in the closed world — appendix entry [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) says \"The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left\", which supplies the action on the *small* categories, the unit and associativity — but neither the draft's \"Uses\" line nor `node.md`'s `objects:` field names it, and the entry's own `used by` line therefore does not back-link Q1-L1. So the proof's single most fragile input is invisible to the dependency ledger: an edit to the `IC_0` entry would silently break this node.\n\n**Flaw 3** [MINOR] (location: line 47, \"thick in the presentable category $\\mathcal{D}(K\\backslash LX)$\"; line 48, \"it is essentially small\"; line 44, \"with $S'$ of finite type\")\n\nThree further undeclared inputs, all venial but all real. Presentability and stability of $\\mathcal{D}(K\\backslash LX)$ come from `conv-d-shriek-d-star` ($\\mathcal{D}^!\\colon\\mathrm{PreStk}^{op}\\to\\mathrm{DGCat}$) together with `conv-dgcat` ($\\mathrm{DGCat}=\\mathrm{LMod}_{\\mathrm{LMod}_k}(\\mathrm{Pr}^L)$, so its objects are presentable and stable) — in the long version this was Fact 3, and r1 spent a MINOR flaw getting its justification right. Essential smallness of $\\mathcal{D}_c$ is `subsec:notations` (\"its small full subcategory of coherent $\\mathcal{D}$-modules\"), and is a genuine hypothesis of $\\mathcal{M}_c\\simeq\\mathcal{N}^\\omega$. The finite-type restriction on test schemes is ratified reading 1 of `context.md`, whose justification is `conv-d-shriek-d-star`. All three are in the appendix; none is cited.\n\n**Flaw 4** [MINOR] (location: \"Uses\" line 24, `p:compact_generation_stable_case`)\n\nDeclared and not used. Nowhere in (1)–(5) is the detection criterion of that proposition invoked: compact generation of $\\mathcal{N}$ is automatic from $\\mathcal{N}=\\mathrm{Ind}\\,\\mathcal{M}_c$ (`def:compactly_generated_category`(2)), and $(\\mathrm{Ind}\\,\\mathcal{T})^\\omega=\\mathcal{T}$ is the Ind-completion fact, not this proposition. Consistently, the appendix entry's `used by` line lists only Q1-L2. Over-declaration is a mild defect but it is the mirror image of Flaws 2–3 and corrupts the same ledger.\n\n**Flaw 5** [MINOR] (location: `node.md` line 11 versus draft lines 21–24)\n\nThree-way mismatch of the object ledger, as anticipated. `node.md`'s `objects:` names 3 entries; the draft's \"Uses\" names 6; the set the proof actually consumes is a third list (add $\\mathrm{IC}_0$, `subsec:notations`, `conv-dgcat`, `conv-d-shriek-d-star`; remove `p:compact_generation_stable_case`). Since `objects:` is what the DAG exposes and `used by` is what the appendix exposes, both are now wrong in both directions. This is a lead-researcher/orchestrator fix, not a prover fix, but it is a defect of the node as it stands.\n\n**Flaw 6** [MINOR] (location: lines 84–87, \"which holds in $\\mathcal{D}^\\mathrm{ren}(K\\backslash LX)$ by construction but **fails** in $\\mathcal{D}(K\\backslash LX)$\")\n\nOverstatement. What the closed world supports (`defn:coherent_D_mod` note (ii), with the $BG$ counterexample) is that coherent objects on a stack *need not* be compact — the draft's own relative clause says exactly that. It does not establish that the particular generators $\\mathcal{F}\\ast\\mathrm{IC}_0$ fail to be compact in $\\mathcal{D}(K\\backslash LX)$. \"Fails\" should read \"is not available\". The caveat's conclusion (\"no claim is made for the non-renormalized reading\") is unaffected.\n\n**Flaw 7** [MINOR] (location: lines 32–40, the lemma environment, versus the frozen statement in `node.md` lines 15–25)\n\nThe statement is paraphrased rather than reproduced. \"smallest thick (stable, idempotent-complete) **full** subcategory\" loses \"full\" (recoverable from the Notation line, so harmless); \"$\\mathcal{F}\\ast\\mathrm{IC}_0$ for all $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\" becomes \"all $\\mathcal{F}\\ast\\mathrm{IC}_0$\"; and \"where $\\delta\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is the monoidal unit\" becomes \"for $\\delta$ the monoidal unit\". The last is not purely cosmetic: step (4) concludes $\\delta\\ast\\mathrm{IC}_0\\simeq\\mathrm{IC}_0\\in S$, and membership in the indexed family $S$ requires $\\delta\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ — the draft deleted the clause of the frozen statement that supplied it and then used it. (It is recoverable from the $\\mathrm{IC}_0$ entry's \"monoidal category\", so no gap; see Flaw 2.) Nothing is strengthened or weakened, so this is not an I2 violation in substance, but r2 could certify verbatim reproduction and I cannot.\n\n**Flaw 8** [MINOR] (location: whole file — no `% Response to critique` block)\n\nA round-3 draft carries no record that r1's MAJOR and r2's two MINORs were considered. I verified independently that all three are in fact resolved or moot (see the sweep above), but the audit trail now lives only in the critiques, and a reader of the `.tex` alone cannot tell that the deleted `de:reading` / `ntn:test` / `rem:nonren` material was retired deliberately rather than lost in the condensation. One commented paragraph would fix this.\n\n## Assessment\n\nThe condensation is honest. The two steps most at risk — thickness of $\\mathcal{D}_c$ with $\\mathcal{M}_c=\\mathcal{N}^\\omega$, and the compactness transport $\\langle S\\rangle\\cap\\mathcal{M}_c\\subseteq\\mathcal{T}$ — both survive: every hypothesis their long-version arguments needed is still established in the one-page text (idempotent-completeness before $(\\mathrm{Ind}\\,\\mathcal{T})^\\omega=\\mathcal{T}$, compactness of the generators before the interchange of $\\varprojlim$ and $\\varinjlim$, closure of $\\mathcal{L}$ under ambient colimits before \"hence compact in $\\mathcal{L}$\"). The one place where condensation actually damaged the mathematics is Flaw 1, and there the damaged sentence is repaired by writing $\\mathcal{D}_c(S')$ for $\\mathcal{D}(S')^\\omega$. The rest of the findings are ledger defects: the proof leans on the $\\mathrm{IC}_0$ entry throughout without naming it, and names a proposition it never uses.\n\nVERDICT: PASS\n";</script>
