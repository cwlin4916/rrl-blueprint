this block.\n     r4 Flaw 5 (unsubscripted relations): statement re-copied from the corrected node.md;\n       Step 4's filtered presentations now carry the ambient subscript.\n     r4 Flaw 7 (IC_0 in D_c read off as presupposition): now cited to conv:hecke_action.\n     r4 Flaw 6 was appendix bookkeeping; nothing to do here.\n-->\n\n# Q1-L1 — Satake subcategory is thick and Hecke-stable\n\n[node](index.html) · [appendix](../../appendix/index.html) · [context](../../context.html) · [DAG index](../../dag.html)\n\n- **uses:** [`def:satake_subcategory`](../../appendix/def-satake-subcategory.html), [`def:generation`](../../appendix/def-generation.html), [`defn:coherent_D_mod`](../../appendix/defn-coherent-d-mod.html), [`def:renormalized`](../../appendix/def-renormalized.html), [`def:small_relative_tensor`](../../appendix/def-small-relative-tensor.html), [$\\mathrm{IC}_0$](../../appendix/ic-0.html), [module categories](../../appendix/conv-module-categories.html), [the spherical Hecke action $\\ast$](../../appendix/conv-hecke-action.html), [`subsec:notations`](../../appendix/subsec-notations.html), [$k$-linear categories](../../appendix/conv-dgcat.html), [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../appendix/conv-d-shriek-d-star.html); no `depends-on`.\n- **notation:** $\\mathcal{H}_c := \\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{M}_c := \\mathcal{D}_c(K\\backslash LX)$, $\\mathcal{N} := \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) = \\mathrm{Ind}\\,\\mathcal{M}_c$, $S := \\{\\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{H}_c\\}$, $\\mathcal{V} := \\mathrm{Thick}_{\\mathcal{M}_c}(S)$ the smallest thick full subcategory of $\\mathcal{M}_c$ containing $S$, and $y\\colon\\mathcal{M}_c\\hookrightarrow\\mathcal{N}$ the Yoneda embedding.\n\n## Lemma\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\\cap\\langle\\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\nwhere the generation operation $\\langle-\\rangle_{\\mathcal{C}}$ of [`def:generation`](../../appendix/def-generation.html) is formed inside the cocomplete ambient category $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) = \\mathrm{Ind}\\,\\mathcal{D}_c(K\\backslash LX)$.\n\nThis intersection equals the smallest thick (stable, idempotent-complete) full subcategory of $\\mathcal{D}_c(K\\backslash LX)$ containing $\\mathcal{F}\\ast\\mathrm{IC}_0$ for all $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$; it contains $\\mathrm{IC}_0 =_{\\mathcal{D}_c(K\\backslash LX)} \\delta\\ast\\mathrm{IC}_0$, where $\\delta\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is the monoidal unit, and it is a $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$-submodule:\n\n$$\n\\mathcal{F}'\\ast\\mathcal{G} \\in \\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} \\quad\\text{for every } \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}.\n$$\n\n## Proof\n\nThe first display is definitional ([`def:satake_subcategory`](../../appendix/def-satake-subcategory.html), ratified reading).\n\n**Step 1 — $\\mathcal{D}_c(\\mathcal{Y})\\in\\mathrm{Cat}^{\\mathrm{perf}}$ for any prestack $\\mathcal{Y}$; hence $\\mathcal{M}_c,\\mathcal{H}_c\\in\\mathrm{Cat}^{\\mathrm{perf}}$.**\n[`subsec:notations`](../../appendix/subsec-notations.html): $\\mathcal{D}_c(\\mathcal{Y})$ is a *small* full subcategory of $\\mathcal{D}(\\mathcal{Y})\\in\\mathrm{DGCat}$, and $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$. [$k$-linear categories](../../appendix/conv-dgcat.html): objects of $\\mathrm{DGCat}$ are presentable and $k$-linear, so $\\mathcal{D}(\\mathcal{Y})$ is cocomplete, stable and idempotent-complete. [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../appendix/conv-d-shriek-d-star.html): $\\mathcal{D}^!$ lands in $\\mathrm{DGCat}$, so each $f^!$ is exact and preserves retract diagrams. By [`defn:coherent_D_mod`](../../appendix/defn-coherent-d-mod.html) (ratified finite-type reading), $\\mathcal{D}_c(\\mathcal{Y}) =_{\\mathcal{D}(\\mathcal{Y})} \\bigcap_f (f^!)^{-1}\\mathcal{D}_c(S')$ over smooth $f\\colon S'\\rightarrow\\mathcal{Y}$ with $S'$ a finite-type dg-scheme. Each $\\mathcal{D}_c(S')\\subseteq\\mathcal{D}(S')$ contains $0$ and is closed under shifts, cofibres and retracts ($S'$ Noetherian: coherence is a Serre condition, and summands of coherent modules are coherent). So $\\mathcal{D}_c(\\mathcal{Y})$ is stable and retract-closed in $\\mathcal{D}(\\mathcal{Y})$, hence idempotent-complete; being small, it lies in $\\mathrm{Cat}^{\\mathrm{perf}}$ ([`def:small_relative_tensor`](../../appendix/def-small-relative-tensor.html)(1)).\n\n**Step 2 — the action is a $\\mathrm{Cat}^{\\mathrm{perf}}$-module structure; $\\mathrm{IC}_0\\in S\\subseteq\\mathcal{M}_c$; $\\mathcal{V}\\in\\mathrm{Cat}^{\\mathrm{perf}}$.**\nBy [the spherical Hecke action $\\ast$](../../appendix/conv-hecke-action.html), $\\mathcal{H}_c$ is monoidal, $\\mathcal{M}_c$ is a left $\\mathcal{H}_c$-module in the sense of [module categories](../../appendix/conv-module-categories.html), and $\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{M}_c$; both categories lie in $\\mathrm{Cat}^{\\mathrm{perf}}$ (Step 1), so the ambient of that entry is $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$ and the action is a morphism $\\mathcal{H}_c\\otimes\\mathcal{M}_c\\rightarrow\\mathcal{M}_c$ there. [$\\mathrm{IC}_0$](../../appendix/ic-0.html) is an object of the module $\\mathcal{M}_c$, its Hecke orbit $S$ being formed by this action; unit coherence gives $\\mathrm{IC}_0\\simeq_{\\mathcal{M}_c}\\delta\\ast\\mathrm{IC}_0\\in S$ for the unit $\\delta\\in\\mathcal{H}_c$. As $\\mathcal{M}_c$ is small, $S$ is a set and $\\mathcal{V}$ — the intersection of the thick full subcategories of $\\mathcal{M}_c$ containing $S$ — is thick and minimal; an idempotent of $t\\in\\mathcal{V}$ splits in $\\mathcal{M}_c$ (Step 1), its splitting a retract of $t$ there, hence in $\\mathcal{V}$; being small, $\\mathcal{V}\\in\\mathrm{Cat}^{\\mathrm{perf}}$.\n\n**Step 3 — $\\mathcal{V}\\subseteq\\mathcal{M}_c\\cap\\langle S\\rangle_{\\mathcal{N}}$.**\nBy [`def:renormalized`](../../appendix/def-renormalized.html) and [`def:small_relative_tensor`](../../appendix/def-small-relative-tensor.html)(2) at $\\mathcal{M}_c\\in\\mathrm{Cat}^{\\mathrm{perf}}$, $y$ is fully faithful and exact with image $\\mathcal{N}^{\\omega}$. By [`def:generation`](../../appendix/def-generation.html), $\\langle S\\rangle_{\\mathcal{N}}$ is stable and closed under small colimits of $\\mathcal{N}$, hence under retracts (a retract of $t$ is the colimit of the idempotent diagram at $t$). So $y^{-1}\\langle S\\rangle_{\\mathcal{N}} =_{\\mathcal{M}_c} \\mathcal{M}_c\\cap\\langle S\\rangle_{\\mathcal{N}}$ is full in $\\mathcal{M}_c$, contains $S$, and is closed in $\\mathcal{M}_c$ under shifts, cofibres ($y$ exact) and retracts ($y$ preserves retract diagrams); minimality concludes.\n\n**Step 4 — $\\mathcal{M}_c\\cap\\langle S\\rangle_{\\mathcal{N}}\\subseteq\\mathcal{V}$.**\nFor $j\\colon\\mathcal{V}\\hookrightarrow\\mathcal{M}_c$ put $L := \\mathrm{Ind}(j)\\colon\\mathrm{Ind}\\,\\mathcal{V}\\rightarrow\\mathcal{N}$: it preserves filtered colimits, is exact ($j$ is), hence preserves all small colimits, and is fully faithful — for filtered $\\tilde y\\simeq_{\\mathrm{Ind}\\,\\mathcal{V}}\\varinjlim_i y_i$ and $\\tilde y'\\simeq_{\\mathrm{Ind}\\,\\mathcal{V}}\\varinjlim_{i'}y'_{i'}$ with $y_i,y'_{i'}\\in\\mathcal{V}$, compactness of $jy_i$ in $\\mathcal{N}$ (Step 3) gives $\\operatorname{Map}_{\\mathcal{N}}(L\\tilde y,L\\tilde y')\\simeq_{\\mathrm{Ani}}\\varprojlim_i\\varinjlim_{i'}\\operatorname{Map}_{\\mathcal{N}}(jy_i,jy'_{i'})$, which equals $\\operatorname{Map}_{\\mathrm{Ind}\\,\\mathcal{V}}(\\tilde y,\\tilde y')$ by full faithfulness of $y$ and fullness of $\\mathcal{V}\\subseteq\\mathcal{M}_c$. Its image $\\mathcal{L}$ is then full, stable and closed under small colimits of $\\mathcal{N}$ ($\\mathrm{Ind}\\,\\mathcal{V}$ is cocomplete stable; a diagram in $\\mathcal{L}$ lifts along $L\\colon\\mathrm{Ind}\\,\\mathcal{V}\\simeq\\mathcal{L}$, its colimit carried to one in $\\mathcal{N}$). As $S\\subseteq\\mathcal{V}$, minimality gives $\\langle S\\rangle_{\\mathcal{N}}\\subseteq\\mathcal{L}$. For $c\\in\\mathcal{M}_c\\cap\\langle S\\rangle_{\\mathcal{N}}\\subseteq\\mathcal{L}$: $c$ is compact in $\\mathcal{N}$ (Step 3), hence in $\\mathcal{L}$, whose filtered colimits are those of $\\mathcal{N}$; transport along $L$ and $(\\mathrm{Ind}\\,\\mathcal{V})^{\\omega}\\simeq_{\\mathrm{Cat}^{\\mathrm{perf}}}\\mathcal{V}$ ([`def:small_relative_tensor`](../../appendix/def-small-relative-tensor.html)(2), $\\mathcal{V}\\in\\mathrm{Cat}^{\\mathrm{perf}}$ by Step 2) give $c\\simeq_{\\mathcal{N}}y(t)$ with $t\\in\\mathcal{V}$. With Step 3, $\\mathcal{M}_c\\cap\\langle S\\rangle_{\\mathcal{N}} =_{\\mathcal{M}_c} \\mathcal{V}$.\n\n**Step 5 — $\\mathcal{V}$ is an $\\mathcal{H}_c$-submodule.**\nPut $\\mathcal{U} := \\{\\mathcal{G}\\in\\mathcal{M}_c \\mid \\mathcal{F}'\\ast\\mathcal{G}\\in\\mathcal{V}\\ \\text{for all}\\ \\mathcal{F}'\\in\\mathcal{H}_c\\}$. By [module categories](../../appendix/conv-module-categories.html) the action functor $\\mathcal{F}'\\ast(-)\\colon\\mathcal{M}_c\\rightarrow\\mathcal{M}_c$ of $\\mathcal{F}'\\in\\mathcal{H}_c$ on the module of Step 2 is exact; every functor preserves retract diagrams, so $\\mathcal{U}$, an intersection of preimages of the thick $\\mathcal{V}$, is thick in $\\mathcal{M}_c$. It contains $S$: $\\mathcal{F}'\\ast(\\mathcal{F}\\ast\\mathrm{IC}_0)\\simeq_{\\mathcal{M}_c}(\\mathcal{F}'\\ast\\mathcal{F})\\ast\\mathrm{IC}_0\\in S$ by associativity coherence, $\\mathcal{F}'\\ast\\mathcal{F}\\in\\mathcal{H}_c$. Minimality gives $\\mathcal{V}\\subseteq\\mathcal{U}$; by Steps 3–4 this $\\mathcal{V}$ is $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$, which is the claim. $\\blacksquare$\n";</script>
