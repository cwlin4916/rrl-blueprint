decisions/0001-satake-generation-ambient-category.html).\n- **2026-08-03 — re-refereed** ([r3](critiques/r3.html), PASS): the write-up had been condensed to one page, so `proved` was attached to a text no referee had read. The round repaired a compact-vs-coherent conflation on test schemes and reconciled the three diverging lists of what the proof uses.\n- **2026-08-03 — statement renotated** in the tree-wide convention pass: every relation now names the category it holds in ($=_{\\mathcal{D}_c(K\\backslash LX)}$). The one relation the pass missed, $\\mathrm{IC}_0 = \\delta\\ast\\mathrm{IC}_0$, was caught by the r5 referee.\n- **2026-08-03 — re-proved** from scratch after the renotation ([r4](critiques/r4.html)–[r5](critiques/r5.html), continuing the numbering). The r4 FAIL was closed-world, not mathematical: the submodule step consumed the convolution-action conventions without declaring them, and the disposal was to widen `objects:` deliberately — five entries, each checked against what the flaw needed — rather than let the proof reach outside its declared world.\n- **2026-08-04 — literature weighed**: `/examples` returned `EVIDENCE: precedent` ([examples.md](examples.html)) — BZSV state the construction this node ratifies, word-for-word at the three spot-checked citations — and nine promotion candidates from that run became the first question-level example and analogy nodes.\n- **2026-08-04 — write-up renotated** (notation audit): the proof's local symbol for the thick closure, $\\mathcal{T}$, collided with the appendix's §4 shorthand prohibition ([§4 local shorthand](../../appendix/conv-mapping-space-shorthand.html): do not use $\\mathcal{S}$, $\\mathcal{T}$ outside quotations from §4) and is now $\\mathcal{V}$ throughout [proof.md](proof.html). The critiques quote the old letter and stand unchanged, as records. No step of the proof changed.\n";</script>
