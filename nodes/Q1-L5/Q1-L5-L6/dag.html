<script>DAG.mount({"scope": {"kind": "question", "short": "Q1", "title": "Q1: When is $\\mathcal{D}_{c}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_{c}(K\\backslash LX)$?", "body": "*(v2 — 2026-08-04.)* For $X$ in the standing class, with orbits, closures and embeddings $i_\\lambda$ as in [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html), the equality\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\n$$\n\nholds if and only if the Satake subcategory generates stratum by stratum and cuts supports — the exact criterion of [Q1-L5](../index.html). Under the recollement hypotheses of that node — each $i_\\lambda^!$ continuous on $\\mathcal{D}^{\\mathrm{ren}}$ ([`def:renormalized`](../../../appendix/def-renormalized.html)) with a fully faithful continuous left adjoint $i_{\\lambda!}$, and the family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$ jointly conservative — the two conditions read: **(1) stratumwise generation** — for every $\\lambda\\in\\Lambda_X^+$ the objects $i_\\lambda^!(\\mathcal{F}\\ast\\mathrm{IC}_0)$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [`def:generation`](../../../appendix/def-generation.html); **(2) support-cutting** — for every such $\\lambda$ and $\\mathcal{F}$,\n\n$$\ni_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right) \\in \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}.\n$$\n\n*The bracket.* The conjectured criterion sits between two one-sided conditions. Necessary — [Q1-L3](../../Q1-L3/index.html)(iii): equality forces **Hecke saturation** $LX^{\\mathrm{sat}} = LX$, where\n\n$$\nLX^{\\mathrm{sat}} := \\bigcup_{\\mu\\in\\Lambda^+} m_\\mu\\left(\\overline{LG}_\\mu\\times^{K} L^+X\\right)\n$$\n\nis the union of the Hecke translates of $L^+X$, with $\\overline{LG}_\\mu\\subset LG$ the preimage of $\\overline{\\mathrm{Gr}}_\\mu\\subset\\mathrm{Gr}$ and $m_\\mu\\colon \\overline{LG}_\\mu\\times^{K} L^+X\\to LX$ the ind-proper convolution map of [Q1-L3](../../Q1-L3/index.html). Sufficient — [Q1-L6](../../Q1-L6/index.html): equality follows, again under the recollement hypotheses of [Q1-L5](../index.html), if **clean costalks** hold along all strata — for every $\\lambda\\in\\Lambda_X^+$ there exist $\\mathcal{F}_\\lambda\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and $n_\\lambda\\in\\mathbb{Z}$ with (a) $\\operatorname{supp}(\\mathcal{F}_\\lambda\\ast\\mathrm{IC}_0)\\subseteq\\overline{LX}_\\lambda$ and (b) $i_\\lambda^!(\\mathcal{F}_\\lambda\\ast\\mathrm{IC}_0)\\simeq\\omega_{K\\backslash LX_\\lambda}[n_\\lambda]$ in $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$.\n\n*Route status (2026-08-04).* [Q1-L1](../../Q1-L1/index.html) ⟹ [Q1-L2](../../Q1-L2/index.html) is proved, so equality is decided by generation in $\\mathcal{D}^{\\mathrm{ren}}$; [Q1-L2](../../Q1-L2/index.html) + [Q1-L4](../../Q1-L4/index.html) ⟹ [Q1-L5](../index.html) assembles the exact criterion but waits on [Q1-L4](../../Q1-L4/index.html), the weak link since its per-closure finiteness clause was withdrawn on 2026-08-04 ([its updates](../../../../blueprint/nodes/Q1-L4/updates/u1.md)); [Q1-L4](../../Q1-L4/index.html) + [Q1-L5](../index.html) + [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html) ⟹ [Q1-L6](../../Q1-L6/index.html) assembles sufficiency, the finiteness now entering through [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html) at symmetric scope, so the assembled route reaches the sufficient condition for symmetric $X$ only, until a finiteness-free derivation is found; the necessary condition [Q1-L3](../../Q1-L3/index.html) is ready and unproved. The group case is corroborated outside the assembly by the example [Q1-e7](../../Q1-e7/index.html).\n\n*Versions.* v2 — 2026-08-04: ed": "2026-08-04", "deps": [], "reqby": [], "statement": "Let $X$ be a spherical variety under a split reductive group $G$ over a $p$-adic field $F$, with smooth integral models over its ring of integers $\\mathfrak{o}$, base point $x_0\\in\\mathring{X}(\\mathfrak{o})$, and $K = G(\\mathfrak{o})$ hyperspecial. Write $A_X$ for the universal Cartan of $X$ realized as a subvariety of $X$, $\\mathcal{V}$ for the cone of $G$-invariant valuations, $\\Lambda_X^+\\subset\\Lambda_X$ for the coweights of $A_X$ lying in $\\mathcal{V}$, and $A_X(F)^+\\subset A_X(F)$ for the preimage of $\\Lambda_X^+$ under the valuation map (notation of Sakellaridis–Venkatesh §5.3). Then:\n\n1. every $K$-orbit on $X(F)$ meets $A_X(F)^+$, and orbits with distinct image in $\\Lambda_X^+$ are distinct;\n2. the induced map on orbits to $\\Lambda_X^+$ is a bijection when $\\mathcal{X}(A)/\\mathcal{X}(X)$ is torsion-free, and the orbits inside $X(\\mathfrak{o})$ are exactly those over $\\Lambda_X^+\\cap\\mathcal{C}(X)$ (notation of Sakellaridis, ANT 6 (2012), §2.3);\n3. over $\\mathcal{K} = \\mathbb{C}((t))$, with $\\mathfrak{O} = \\mathbb{C}[[t]]$, the $G(\\mathfrak{O})$-orbits on the open-orbit loop space $X^+(\\mathcal{K})$ are parametrized by $\\Lambda_X^+$ exactly, via $\\check{\\lambda}\\mapsto\\check{\\lambda}(t)$ (Luna–Vust);\n4. if $X$ is wavefront, finitely many base points suffice: there are $x_1,\\dots,x_n\\in\\mathring{X}$ and a compact subset $U\\subset G$ with $\\bigcup_i x_i A^+ U = X$, where $A^+$ is the antidominant part of the maximal torus $A$.\n\nSpeaks to: [Q1-L3](../../Q1-L3/index.html).", "history": "- **2026-08-04 — created**: promoted from the [Q1-L3 `/examples` run](../../Q1-L3/examples.html) of the same day (instance 3, candidate 2) at the user's direction. It is the function-theoretic shadow of clause (ii) of [Q1-L3](../../Q1-L3/index.html) — the $\\Lambda_X^+$-indexing of the $K$-orbit stratification [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-s {1}_{X(\\mathfrak{o})}\\mapsto 1,\n$$\n\nwhere $\\check{G}_X\\subseteq\\check{G}$ is the dual group of $X$; so the saturation question — does the basic vector generate the whole module? — becomes: is the (twisted) restriction $\\mathbb{C}[\\check{G}]^{\\check{G}}\\to\\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$ surjective? Speaks to: [Q1-L3](../../Q1-L3/index.html).", "history": "- **2026-08-04 — created**: promoted from the [Q1-L3 `/examples` run](../../Q1-L3/examples.html) of the same day (instance 4, candidate 3) at the user's direction. It is BZSV's own decategorification of the Satake subcategory [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html) — \"$\\mathcal{T}_V\\star\\delta_X$ matches with the function obtained by applying the corresponding Hecke operator $T_V$ to $1_{X(\\mathfrak{o})}$\" (§7.5.3) — with $\\mathbf{1}_{X(\\mathfrak{o})}$ the shadow of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and the module structure that of [the Hecke action](../../../appendix/conv-hecke-action.html); it mirrors clause (iii) of [Q1-L3](../../Q1-L3/index.html) as a cyclicity question. It is loose in that hyperspecial level, $\\mathbb{C}$-coefficients, and the derived phenomena of BZSV (9.15) are dropped. Whether $\\mathbf{1}_{X(\\mathfrak{o})}$ generates is posed at BZSV §9.4 and answered nowhere in print, confirming the shape of [Q1-L3](../../Q1-L3/index.html): generation by the basic vector is a nontrivial condition, to be tested orbit by orbit. The question-level form of this analogy is [Q1-a1](../../Q1-a1/index.html). Sources: Aizenbud–Avni–Gourevitch, Comment. Math. Helv. 87 (2012) 929–962, as quoted at Sakellaridis–Venkatesh Rem. 5.1.7 (`refs.bib`: `SV17`; AAG12 itself has no key); Ben-Zvi–Sakellaridis–Venkatesh §9.4, (9.15), pp. 200–201 (`refs.bib`: `BZSV`); Sakellaridis, *Spherical functions on spherical varieties*, arXiv:0905.4244.\n- **2026-08-04 — evidence swing** (recorded at [Q1-a1 updates/u1.md](../../../../blueprint/nodes/Q1-a1/update ", "deps": [], "reqby": [], "statement": "Three failures of the saturation mechanism when a hypothesis of the setting of [Q1-L3](../../Q1-L3/index.html) fails.\n\n1. For $E/F$ an unramified quadratic extension of $p$-adic fields, residual characteristic $\\neq 2$, $X$ the space of Hermitian forms of determinant $1$ on $E^n$, and $G = SL_n(E)$ with standard maximal compact $K_0$: the Schwartz space $\\mathcal{S}(X)^{K_0}$ is a free $\\mathcal{H}(G,K_0)$-module of rank $2^{n-1}$, hence not cyclic for $n\\geq 2$ — no single vector, in particular no basic function, generates (Aizenbud–Sayag Thm A; the $GL_n$-version is Hironaka's).\n\n2. For $X^+ = H\\backslash G$, surjectivity of $G(\\mathfrak{o}_F)\\to X^+(\\mathfrak{o}_F)$ ($\\mathfrak{o}_F$ the ring of integers, in Sakellaridis's notation) holds for $H$ connected by Lang's theorem, and can fail for $H$ disconnected (Sakellaridis, ANT 2012, Rem. 2.3.9).\n\n3. Toy witness over $k$ algebraically closed of characteristic $0$, with $\\mathcal{O} = k[[t]]$: $X = \\mathbb{G}_m$ under the square action of $G = \\mathbb{G}_m$, $t\\cdot x = t^2x$, whose generic stabilizer $\\mu_2$ is disconnected — outside the standing class of [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html). Here $LX^{\\mathrm{sat}}$ (as defined in [Q1-L3](../../Q1-L3/index.html)) is the even-valuation locus $\\bigsqcup_{\\mu\\in\\mathbb{Z}} t^{2\\mu}\\mathcal{O}^\\times\\subsetneq LX$, a proper closed subset, while the $K$-orbits ([`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html)) are $LX_n = t^n\\mathcal{O}^\\times$, $n\\in\\Lambda_X=\\mathbb{Z}$; so by clauses (i)–(ii) of [Q1-L3](../../Q1-L3/index.html) the Satake subcategory ([`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html)) omits every odd orbit *(constructed, unsourced — a two-line valuation computation)*.\n\nSpeaks to: [Q1-L3](../../Q1-L3/index.html).", "history": "- **2026-08-04 — created**: promoted from the [Q1-L3 `/examples` run](../../Q1-L3/examples.html) of the same day (instance 5, candidate 4) at the user's direction. This is a boundary analogy, stated as such and worth as much as a positive one: it mirrors the contrapositive of clause (iii) of [Q1-L3](../../Q1-L3/index.html) — where saturation fails, the classical Satake submodule is proper and no shadow of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) generates — and it shows the connected-stabilizer hypothesis of the standing class [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html) load-bearing for the hoped-for equality of Q1. It is loose in that item 1 is a non-split pair over a finite residue field, item 2's splitting mode is absent over algebraically closed residue fields, and only mechanism 3 — disconnectedness — survives base change to $\\mathbb{C}((t))$, which is exactly why the standing class excludes it; item 3 is a constructed witness, not a published one, and item 1 does not contradict [Q1-L3](../../Q1-L3/index.html), which asserts necessity of saturation, not saturation itself. Sources: Aizenbud–Sayag, arXiv:1709.08214, Thm A and Rem. 1.0.1 (no `refs.bib` key); Hironaka, *Spherical functions and local densities on Hermitian forms*, J. Math. Soc. Japan 51 (1999) 553–581 (no key); Sakellaridis, Algebra & Number Theory 6 (2012), arXiv:0905.4245, Rem. 2.3.9 (no key); pointer at Sakellaridis–Venkatesh, Astérisque 396 (2017), §16.3, p. 243 (`refs.bib`: `SV17`).\n- **2026-08-04 — statement renotated** by `/update` ([u1](../../../../blueprint/nodes/Q1-L3/Q1-L3-a4/updates/u1.md), notation audit): the equal-characteristic toy in clause 3 wrote its ring $\\mathfrak{o} = k[[t]]$ and now writes the blueprint's $\\mathcal{O}$ ([ring of integers](../../../appendix/conv-ring-of-integers.html)); clause 2's $\\mathfrak{o}_F$ is Sakellaridis's own symbol and is now declared as such. No mathematical content changed.", "historyfile": "Q1-L3-a4_history.md", "decomposition": "", $ such that $G_\\lambda := K_\\lambda/U_\\lambda$ is an affine group scheme of finite type over $k$;\n\n(iii) pullback induces equivalences\n\n$$\n\\mathcal{D}_c(K\\backslash LX_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}}),\n$$\n\nwhere $G_\\lambda^{\\mathrm{red}}$ is the quotient of $G_\\lambda$ by its unipotent radical.", "history": "- **2026-08-02 — created** by `/decompose` of [Q1](../../../dag.html): the structure of the strata — classifying stacks with finite-type reductive quotients — that both the exact criterion ([Q1-L5](../index.html)) and the sufficiency induction ([Q1-L6](../../Q1-L6/index.html)) consume. As created the statement carried a fourth clause: finiteness of $\\{\\mu\\in\\Lambda_X^+ \\mid LX_\\mu\\subseteq\\overline{LX}_\\lambda\\}$ for every $\\lambda$.\n- **2026-08-04 — counterexample recorded**: the first `/examples` run returned `EVIDENCE: counterexample` against clause (iv) — it fails inside the standing class, for $X = M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ ([Q1-L5-e4](../Q1-L5-e4/index.html)), where one orbit closure contains infinitely many orbits — turning the card red at −25%.\n- **2026-08-04 — statement revised** by `/update` ([u1](../../../../blueprint/nodes/Q1-L4/updates/u1.md)): clause (iv) withdrawn. The operator recomputed the $X = \\mathbb{A}^1$ under $\\mathbb{G}_m$ counterexample supplied by a user review passage rather than adopting it, and re-derived (i)–(ii) far enough to keep clauses (i)–(iii) at the standing generality. The finiteness is a theorem for $X$ symmetric, and that scoped claim was commissioned as its own node, [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html), under the induction that consumes it — tracked in [priorities](../../../../blueprint/priorities.md). Considered and rejected: restricting the whole node to symmetric $X$ (weakening true clauses to rescue a withdrawn one), renaming $G_\\lambda^{\\mathrm{red}}$, and a replacement clause restating the tisfies [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html), and [`assum:intro`](../../../appendix/assum-intro.html)(c) is [`exam:hyperspherical_duality`](../../../appendix/exam-hyperspherical-duality.html)(1) applied to $T$. Here $K = L^+T\\times L^+T$ acts on $LX = LT$ by left and right translation, and clauses (i)–(iii) of [Q1-L4](../../Q1-L4/index.html) hold for this $X$ with the same witnesses on every stratum of [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html):\n\n1. $\\Lambda_X^+ = X_*(T)$ and $LX_\\lambda = t^\\lambda L^+T$, each stratum open and closed in $LT$;\n\n2. $K_\\lambda = \\operatorname{Stab}_K(t^\\lambda) = \\{(u,u)\\mid u\\in L^+T\\}\\cong L^+T$, a placid group scheme ([`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html)), so clause (i) gives $K\\backslash LX_\\lambda\\simeq BL^+T$;\n\n3. $U_\\lambda = \\ker(\\mathrm{ev}_0\\colon L^+T\\to T)$ is normal and pro-unipotent with $G_\\lambda = G_\\lambda^{\\mathrm{red}} = T$, so clause (iii) gives, for every $\\lambda\\in X_*(T)$,\n\n   $$\n   \\mathcal{D}_c(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}_c(BT),\n   $$\n\n   the second equivalence of (iii) being the identity since $T$ is already reductive.", "history": "- **2026-08-04 — created**: records instance 2 of [examples.md](../../Q1-L4/examples.html) (*constructed, routine* there), promoted at the user's request so the corroboration is addressable on [Q1-L4](../../Q1-L4/index.html)'s page (ADR 0021). It is the simplest instance in which the witnesses of clause (ii) are nontrivial on every stratum — in [Q1-L4-e1](../../Q1-L4/Q1-L4-e1/index.html) they are nontrivial only at the zero section — while every $G_\\lambda$ is still reductive, so the second equivalence of (iii) remains untested; [Q1-L4-e3](../../Q1-L4/Q1-L4-e3/index.html) tests it. The same $X$ at the level of [Q1-L5](../index.html)'s recollement criterion is [Q1-L5-e1](../Q1-L5-e1/index.html).", "historyfi us — so the second equivalence of clause (iii), $\\mathcal{D}_c(BG_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}})$, is genuinely tested here: it asserts contractibility of the unipotent radical of $P_\\mu$ rather than an identity. Clause 1 and the fibration behind clause 2 are `zhu2016introduction` Prop. 2.1.5 and §2.1; the mod-$t$ identification is *constructed* in [examples.md](../../Q1-L4/examples.html), not cited. The same $X$ at the level of [Q1-L5](../index.html)'s criterion is [Q1-L5-e2](../Q1-L5-e2/index.html).", "historyfile": "Q1-L4-e3_history.md", "decomposition": "", "objects": [{"label": "def:polarized_hyperspherical", "href": "../../../appendix/def-polarized-hyperspherical.html"}, {"label": "assum:intro", "href": "../../../appendix/assum-intro.html"}, {"label": "exam:hyperspherical_duality", "href": "../../../appendix/exam-hyperspherical-duality.html"}, {"label": "def:orbits_iwahori_spherical", "href": "../../../appendix/def-orbits-iwahori-spherical.html"}], "writeup": null, "critique": null, "examples": false, "prompts": [], "updates": [], "rounds": [], "flaws": [], "verdicts": [], "parent": "Q1-L4", "eff": "ready", "chue": "var(--paper)", "ctint": "0%", "cnote": "0% — record open · human — · literature —", "cpct": "0%", "upd": "", "core": "$$\n   \\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr}_\\mu)\\simeq\\mathcal{D}_c(BP_\\mu)\\simeq\\mathcal{D}_c(BL_\\mu).\n   $$", "href": "../../Q1-L4/Q1-L4-e3/index.html", "kids": 0, "kidsProved": 0, "x": 280.0, "y": 1554.0, "ea": {"host": "Q1-L4", "side": "r"}, "pages": [{"label": "node page", "href": "../../Q1-L4/Q1-L4-e3/index.html", "note": "statement, dependencies, objects"}, {"label": "self-contained prompt", "href": "../../Q1-L4/Q1-L4-e3/prompt.html", "note": "generated problem packet"}, {"label": "history", "href": "../../Q1-L4/Q1-L4-e3/history.html", "note": "every dated entry in this node's life"}]}, {"id": "Q1-L4-e4", "dir": "Q1-L4/Q1-L4-e4", "title": "Symmetric linear periods: X = (GL_n × GL_n)∖GL_2n", "type": "prop", "role": "example", "status": "open", "human": "—", "evidence": "—", "created": "2026-08-04", "deps": [], "reqby": [], "statement": "Let $G = \\mathrm{GL}_{2n}$ with the involution $\\theta = \\mathrm{Ad}(\\mathrm{diag}(1_n,-1_n))$, so $G^\\theta = \\mathrm{GL}_n\\times\\mathrm{GL}_n$ is connected, and let $X = G^\\theta\\backslash G$ — the linear-periods symmetric variety, smooth affine and spherical, with $K = L^+G$. The hypotheses of the [Chen–Yi orbit parametrization](../../../appendix/bb-chenyi-symmetric-orbits.html) hold verbatim, and [`assum:intro`](../../../appendix/assum-intro.html)(a) is supplied by [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html). Then:\n\n1. in print: the stratification of [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html) is indexed by $\\Lambda_X^+ = \\Lambda_S^+$ for a maximal $\\theta$-split torus $S$, of rank $n$, with closure relation the coroot order — $LX_\\lambda\\subseteq\\overline{LX}_\\mu$ iff $\\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+$ — so each orbit closure contains finitely many strata (`chenyi_2025singularitiesorbitclosuresloop` Prop. 17, Thm. 18);\n\n2. in print, the abelian shadow of clause (iii): $L^+G$-equivariant local systems on each $LX_\\lambda$ are equivalent to representations of the finite group $\\pi_0(K_\\lambda)$, where $K_\\lambda = \\operatorname{Stab}_K(x_\\lambda)$ (`chenyi_2025singularitiesorbitclosuresloop` Cor. 9(ii), §1.2.3) — a statement only a finite-type quotient $G_\\lambda$ as in clause (ii) of [Q1-L4](../../Q1-L4/index.html) can deliver;\n\n3. clauses (i)–(iii) of [Q1-L4](../../Q1-L4/index.html) specialize here to: $K\\backslash LX_\\lambda\\simeq BK_\\lambda$ for every $\\lambda\\in\\Lambda_S^+$, with $K_\\lambda$ placid admitting a normal pro-unipotent subgroup $U_\\lambda$ such that $G_\\lambda = K_\\lambda/U_\\lambda$ is affine of finite type, and\n\n   $$\n   \\mathcal{D}_c(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}}).\n   $$", "history": "- **2026-08-04 — created**: records instance 4 of [examples.md](../../Q1-L4/examples.html), promoted at the user's request so the corroboration is addressable on [Q1-L4](../../Q1-L4/index.html)'s page (ADR 0021). It is the symmetric instance: the orbit geometry of clause 1 is unconditionally in print, but [`assum:intro`](../../../appendix/assum-intro.html)(c) is **not discharged** for this $X$ — the unramified equivalence is recorded only as upcoming work of Chen–Yi in the appendix entry it cites ([`exam:hyperspherical_duality`](../../../appendix/exam-hyperspherical-duality.html)(3)) — so membership in the standing class is conditional here, and clause 3 is stated as what [Q1-L4](../../Q1-L4/index.html) claims at this $X$ rather than as verified. The finiteness in clause 1 is exactly the property withdrawn from Q1-L4 as its former clause (iv) ([updates/u1.md](../../../../blueprint/nodes/Q1-L4/updates/u1.md)): symmetric $X$ is where it survives as a theorem, the scoped claim commissioned under [Q1-L6](../../Q1-L6/index.html). Provenance: the Chen–Yi PDF is not in `papers/`; result numbers are v4's, per the black-box entry's own caveat.", "historyfile": "Q1-L4-e4_history.md", "decomposition": "", "objects": [{"label": "Chen–Yi orbit parametrization", "href": "../../../appendix/bb-chenyi-symmetric-orbits.html"}, {"label": "thm:chen_Ti", "href": "../../../appendix/thm-chen-ti.html"}, {"label": "assum:intro", "href": "../../../appendix/assum-intro.html"}, {"label": "exam:hyperspherical_duality", "href": "../../../appendix/exam-hyperspherical-duality.html"}, {"label": "def:orbits_iwahori_spherical", "href": "../../../appendix/def-orbits-iwahori-spherical.html"}], "writeup": null, "critique": null, "examples": false, "prompts": [], "updates": [], "rounds": [], "flaws": [], "verdicts": [], "parent": "Q1-L4", "eff": "ready", "chue": "var(--paper)", "ctint": "0%", "cnote": "0% — record open · human — · literature —", "cpct": "0%", "upd": "", "core": "$$\n   \\mathcal{D}_c(K\\backslash LX_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda)\\simeq\\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}}).\n   $$", "href": "../../Q1-L4/Q1-L4-e4/index.html", "kids": 0, "kidsProved": 0, "x": 280.0, "y": 1638.0, "ea": {"host": "Q1-L4", "side": "r"}, "pages": [{"label": "node page", "href": "../../Q1-L4/Q1-L4-e4/index.html", "note": "statement, dependencies, objects"}, {"label": "self-contained prompt", "href": "../../Q1-L4/Q1-L4-e4/prompt.html", "note": "generated problem packet"}, {"label": "history", "href": "../../Q1-L4/Q1-L4-e4/history.html", "note": "every dated entry in this node's life"}]}, {"id": "Q1-L5", "dir": "Q1-L5", "title": "Dévissage: equality ⟺ stratumwise generation + support-cutting", "type": "prop", "role": "proof", "status": "open", "human": "—", "evidence": "gap", "created": "2026-08-02", "deps": ["Q1-L2", "Q1-L4", "Q1-L5-L1", "Q1-L5-L2", "Q1-L5-L3", "Q1-L5-L4", "Q1-L5-L5", "Q1-L5-L6"], "reqby": ["Q1-L6"], "statement": "Let $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ be the embeddings of [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html), and let $LX = \\varinjlim_{\\mu\\in\\Lambda_X^+}\\overline{LX}_\\mu$ be the presentation of [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html). For $LX_\\lambda\\subseteq\\overline{LX}_\\mu$ write $i_{\\lambda,\\overline{LX}_\\mu}$ for the locally closed embedding through which $i_\\lambda$ factors, so that $i_\\lambda = \\overline{i}_\\mu\\circ i_{\\lambda,\\overline{LX}_\\mu}$. Assume:\n\n**(H1)** each induced functor\n\n$$\ni_\\lambda^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n$$\n\nis continuous and admits a fully faithful continuous left adjoint $i_{\\lambda!}$;\n\n**(H2)** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ of the presentation identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX) \\simeq \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$ — the presentation read through [`ex:sheaf_placid_ind`](../../../appendix/ex-sheaf-placid-ind.html);\n\n**(H3)** for every $\\mu\\in\\Lambda_X^+$ the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\mu)$.\n\nThen\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\n$$\n\nholds **if and only if both** of the following hold:\n\n1. *(stratumwise generation)* for every $\\lambda\\in\\Lambda_X^+$, the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [`def:generation`](../../../appendix/def-generation.html);\n\n2. *(support-cutting)* for every $\\lambda\\in\\Lambda_X^+$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\n\n   $$\n   i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right) \\in \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}.\n   $$\n\nMoreover the forward direction — equality implies (1), and trivially (2) — uses only the continuity of each $i_\\lambda^!$ and the section $i_\\lambda^!\\, i_{\\lambda!} \\simeq \\mathrm{id}$, so (H2) and (H3) are needed only for \"(1) and (2) imply equality\". What that direction uses of them is joint conservativity of the global family $\\{i_\\lambda^!\\}_{\\lambda\\in\\Lambda_X^+}$, which they supply: if $i_\\lambda^!\\mathcal{M} = 0$ for every $\\lambda$ then, since $i_\\lambda^! = i_{\\lambda,\\overline{LX}_\\mu}^!\\,\\overline{i}_\\mu^!$ whenever $LX_\\lambda\\subseteq\\overline{LX}_\\mu$, (H3) gives $\\overline{i}_\\mu^!\\mathcal{M} = 0$ for every $\\mu$, and (H2) then gives $\\mathcal{M} = 0$.\n\n### Why condition (2) is there\n\n**Setting.** Write $\\mathcal{A} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\mid \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}$ for the subcategory the Hecke family generates, so that by [Q1-L2](../../Q1-L2/index.html) the equality to be proved is $\\mathcal{A} = \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$.\n\nThe $\\perp$-criterion of [`def:generation`](../../../appendix/def-generation.html) tests that equality one object at a time: it holds if and only if the only object satisfying the following hypothesis is $0$.\n\n**(⊥)** the object $\\mathcal{M}\\in\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ satisfies\n\n$$\n\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\left(\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n],\\ \\mathcal{M}\\right) = 0 \\qquad\\text{for all } \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ n\\in\\mathbb{Z}.\n$$\n\n**Step 1 — conservativity moves the problem to the strata.** Assume (⊥). By the joint conservativity that (H2) and (H3) supply, it is enough to prove $i_\\lambda^!\\mathcal{M} = 0$ for every $\\lambda\\in\\Lambda_X^+$.\n\n**Step 2 — condition (1) tests that stratum by stratum.** By (1) the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$ generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, so the same $\\perp$-criterion turns $i_\\lambda^!\\mathcal{M} = 0$ into the vanishing, for all $\\mathcal{F}$ and all $n\\in\\mathbb{Z}$, of\n\n$$\n\\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)}\\left(i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n],\\ i_\\lambda^!\\mathcal{M}\\right)\\ \\simeq\\ \\operatorname{Map}_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)}\\left(i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)[n],\\ \\mathcal{M}\\right),\n$$\n\nthe identification being the adjunction $i_{\\lambda!}\\dashv i_\\lambda^!$ of (H1).\n\n**The gap, and what closes it.** Hypothesis (⊥) is vanishing against the generators $\\mathcal{F}\\ast\\mathrm{IC}_0$, while Step 2 consumes vanishing against their stratum truncations $i_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$ — objects (⊥) says nothing about.\n\nCondition (2) is exactly that bridge. It places the truncations inside $\\mathcal{A}$, and (⊥) propagates from the generators to all of $\\mathcal{A}$, because the objects right-orthogonal to $\\mathcal{M}$ in every shift form a cocomplete stable subcategory.\n\n**(2) does not follow from (1).** At recollement generality the implication already fails with two strata, which is the defect that [u1](../../../../blueprint/nodes/Q1-L5/updates/u1.md) corrected.\n\n**The example.** Let $\\mathcal{E}$ be the category of arrows $V_1\\to V_2$ in $D(k)$, with restrictions\n\n$$\nj^!\\left(V_1\\to V_2\\right) = V_1, \\qquad i^!\\left(V_1\\to V_2\\right) = V_2,\n$$\n\nwhose left adjoints $j_!W = \\left(W\\xrightarrow{\\ \\mathrm{id}\\ }W\\right)$ and $i_!W = \\left(0\\to W\\right)$ are fully faithful and whose pair $\\{j^!,i^!\\}$ is jointly conservative — the two-stratum form of (H1) and (H3).\n\nTake the single object $P := j_!k$. Its restrictions $j^!P = k$ and $i^!P = k$ each generate $D(k)$, so $P$ satisfies (1).\n\n**What (⊥) fails to see here.** By the adjunction $j_!\\dashv j^!$,\n\n$$\n\\operatorname{Map}_{\\mathcal{E}}\\left(P[n],\\ i_!k\\right)\\ \\simeq\\ \\operatorname{Map}_{D(k)}\\left(k[n],\\ j^!i_!k\\right)\\ =\\ \\operatorname{Map}_{D(k)}\\left(k[n],\\ 0\\right)\\ =\\ 0\n$$\n\nfor every $n\\in\\mathbb{Z}$, so $\\mathcal{M} := i_!k$ satisfies (⊥) for the family $\\{P\\}$ while $\\mathcal{M}\\neq 0$. Hence $\\langle P\\rangle_{\\mathcal{E}} \\neq \\mathcal{E}$: stratumwise generation holds and global generation fails.\n\nWhat fails is precisely (2), since that same computation exhibits $i_!\\, i^!P = i_!k$ as a nonzero object right-orthogonal to $\\langle P\\rangle_{\\mathcal{E}}$, so $i_!\\, i^!P \\notin \\langle P\\rangle_{\\mathcal{E}}$.\n\n**The reading.** Condition (1) sees each stratum in isolation and records nothing of how the strata are glued, and (2) is that missing gluing datum.\n\nWhether Hecke-stability of $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\}$ forces (2) from (1) in the present setting — which would restore the criterion to (1) alone — is open, and tracked as P4 in [priorities](../../../../blueprint/priorities.md).", "history": "- **2026-08-02 — created** by `/decompose` of [Q1](../../../dag.html): the exact criterion of the bracket — the dévissage reducing equality to stratum-level conditions, resting on [Q1-L2](../../Q1-L2/index.html) and [Q1-L4](../../Q1-L4/index.html). As created it asserted equality ⟺ stratumwise generation alone.\n- **2026-08-03 — statement renotated** in the tree-wide convention pass: every relation names the category it holds in.\n- **2026-08-04 — gap recorded**: the first run of the two-purpose `/examples` returned `EVIDENCE: gap` ([examples.md](../examples.html)) — not a missing example but a false premise in the dependency [Q1-L4](../../Q1-L4/index.html), whose per-closure finiteness the dévissage's induction would consume; the card went 0 to −12% on the first build after the commit.\n- **2026-08-04 — statement revised** by `/update` ([u1](../../../../blueprint/nodes/Q1-L5/updates/u1.md)), from a user-supplied review passage verified before adoption: the unqualified ⟸ fails at recollement generality — in the two-stratum recollement of arrow categories, $j_!k$ generates both strata stratumwise yet $\\operatorname{Map}(j_!k,\\, i_!k) = 0$ with $i_!k \\neq 0$ — so condition (2), support-cutting, is exactly the gluing datum the restrictions of a generating family do not see, and the three recollement hypotheses are now recorded in the statement. Both directions of the corrected criterion were re-proved by the operator before adoption. Whether the Hecke-stability of the family $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\}$ forces (2) given (1) in the present setting — which would restore the old statement — is open and tracked in [priorities](../../../../blueprint/priorities.md). The three hypotheses are expected from $K$-placidity ([`thm:chen_Ti`](../../../appendix/thm-chen-ti.html), [`ex:sheaf_placid_ind`](../../../appendix/ex-sheaf-placid-ind.html)) together with the finite-type strata of [Q1-L4](../../Q1-L4/index.html); a proof must discharge them or a `/decompose` must isolate them.\n- **2026-08-04 — the run's four instances became children** [Q1-L5-e1](../Q1-L5-e1/index.html)–[Q1-L5-e4](../Q1-L5-e4/index.html) (ADR 0021), materialized by the lead-researcher against the corrected statement; the commission surfaced that joint conservativity of $\\{i_\\lambda^!\\}$ is not automatic even for the torus, so the third recollement hypothesis is genuinely load-bearing.\n- **2026-08-05 — statement revised** by `/update` ([u2](../../../../blueprint/nodes/Q1-L5/updates/u2.md)), from a user review of the closure level, verified against the local Chen–Yi PDF before adoption: the third hypothesis had been joint conservativity of $\\{i_\\lambda^!\\}$ over the whole infinite $\\Lambda_X^+$ — indexed by the strata, which are the steps of no presentation, so no child could reach it. The setting presents $LX$ by orbit **closures** ([`thm:chen_Ti`](../../../appendix/thm-chen-ti.html)), and over one closure with finitely many orbits joint conservativity is already the \"In particular\" of [Q1-L5-L5](../Q1-L5-L5/index.html). The hypotheses are now (H1) as before, (H2) that $!$-restriction along the $\\overline{i}_ nstance, not bookkeeping. Both sides of the equivalence are separately expected true here, as in the group case [Q1-L5-e2](../Q1-L5-e2/index.html).\n- **2026-08-04 — statement renotated** by `/update` ([u1](../../../../blueprint/nodes/Q1-L5/Q1-L5-e1/updates/u1.md), notation audit): clause 2 cited “hypothesis (iv) of Q1-L4” as live after that clause was withdrawn ([Q1-L4/updates/u1.md](../../../../blueprint/nodes/Q1-L4/updates/u1.md)); the citation now routes through the withdrawal and names the surviving scoped claim [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html). The singleton-set fact itself is unchanged.\n- **2026-08-05 — examined and unchanged** by `/update` of the parent ([Q1-L5/u2](../../../../blueprint/nodes/Q1-L5/updates/u2.md)): clause 4 still grants joint conservativity of $\\{i_\\lambda^!\\}_{\\lambda\\in X_*(T)}$, which the parent now derives from (H2)+(H3) rather than assuming. For this $X$ the strata are open and closed, so (H3) is trivial and the whole of what clause 4 grants is the parent's (H2): the tail mechanism this instance carries is now attached to the hypothesis that names it.", "historyfile": "Q1-L5-e1_history.md", "decomposition": "", "objects": [{"label": "def:polarized_hyperspherical", "href": "../../../appendix/def-polarized-hyperspherical.html"}, {"label": "assum:intro", "href": "../../../appendix/assum-intro.html"}, {"label": "exam:hyperspherical_duality", "href": "../../../appendix/exam-hyperspherical-duality.html"}, {"label": "def:orbits_iwahori_spherical", "href": "../../../appendix/def-orbits-iwahori-spherical.html"}, {"label": "$\\mathrm{IC}_0$", "href": "../../../appendix/ic-0.html"}, {"label": "the Hecke action", "href": "../../../appendix/conv-hecke-action.html"}, {"label": "def:satake_subcategory", "href": "../../../appendix/def-satake-subcategory.html"}], "writeup": null, "critique": null, "examples": false, "prompts": [], "updates": ["u1.md"], "rounds": [], "flaws": [], "verdicts": [], "parent": "Q1-L5", "eff": "ready", "chue": "var(--paper)", "ctint": "0%", "cnote": "0% — record open · human — · literature —", "cpct": "0%", "upd": "revised (u1) and not yet re-proved", "core": "$$\n   \\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX)\n   $$", "href": "../Q1-L5-e1/index.html", "kids": 0, "kidsProved": 0, "x": 280.0, "y": 378.0, "ea": {"host": "Q1-L5", "side": "r"}, "pages": [{"label": "node page", "href": "../Q1-L5-e1/index.html", "note": "statement, dependencies, objects"}, {"label": "self-contained prompt", "href": "../Q1-L5-e1/prompt.html", "note": "generated problem packet"}, {"label": "history", "href": "../Q1-L5-e1/history.html", "note": "every dated entry in this node's life"}]}, {"id": "Q1-L5-e2", "dir": "Q1-L5/Q1-L5-e2", "title": "The group case: X = G under G × G", "type": "prop", "role": "example", "status": "open", "human": "—", "evidence": "—", "created": "2026-08-04", "deps": [], "reqby": [], "statement": "Let $G$ be a connected reductive group over $k$, let $G' := G\\times G$ act on $X = G$, the symmetric variety of the swap involution, and write $K' := L^+G' = L^+G\\times L^+G$ — the explicit convention of [Q1-e7](../../Q1-e7/index.html) — so that $K'\\backslash LX = L^+G\\backslash LG/L^+G$ and, under the identification $K'\\backslash LX\\simeq L^+G\\backslash\\mathrm{Gr}_G$, the [Hecke action](../../../appendix/conv-hecke-action.html) is the monoidal self-action with unit $\\mathrm{IC}_0 = \\delta_e$ ([$\\mathrm{IC}_0$](../../../appendix/ic-0.html)). Then:\n\n1. [`assum:intro`](../../../appendix/assum-intro.html)(c) holds for this $X$: it is [`exam:hyperspherical_duality`](../../../appendix/exam-hyperspherical-duality.html)(1);\n\n2. $\\Lambda_X^+ = \\Lambda^+$, the dominant coweights of $G$ in the dominance order, with $\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu} LX_\\lambda$ ([`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html)); each set $\\{\\lambda\\in\\Lambda^+\\mid\\lambda\\le\\mu\\}$ is finite — the per-closure orbit finiteness withdrawn from [Q1-L4](../../Q1-L4/index.html) as its former clause (iv) ([u1](../../../../blueprint/nodes/Q1-L4/updates/u1.md)), scoped symmetric as [Q1-L6-L1](../../Q1-L6/Q1-L6-L1/index.html) — so that finiteness holds for this $X$;\n\n3. $\\mathcal{F}\\ast\\mathrm{IC}_0\\simeq\\mathcal{F}$ for every $\\mathcal{F}\\in\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr}_G)$, and consequently ([`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html), ratified reading)\n\n   $$\n   \\mathcal{D}_c(K'\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K'\\backslash LX)} \\mathcal{D}_c(K'\\backslash LX),\n   $$\n\n   with $\\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}'\\in\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr}_G)\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K'\\backslash LX)} = \\mathcal{D}^{\\mathrm{ren}}(K'\\backslash LX)$ ([`def:generation`](../../../appendix/def-generation.html)): the equality side of the equivalence of [Q1-L5](../index.html) is true unconditionally;\n\n4. granting the three recollement hypotheses of [Q1-L5](../index.html) for this $X$, conditions (1) and (2) there hold as well — so both sides of the parent's equivalence are true, the known extreme of the seed question ([context](../../../context.html)).", "history": "- **2026-08-04 — created**: records instance 2 of [examples.md](../examples.html), promoted at the user's request (ADR 0021): the consistency check at the known extreme. Clause 3 needs only that $\\mathrm{IC}_0$ is the unit of convolution, not derived Satake; clause 1 is the derived Satake theorem quoted through the appendix catalogue. In clause 4, condition (2) is immediate from clause 3 (the receiving subcategory is everything), and condition (1) is the section $i_\\lambda^!\\, i_{\\lambda!}\\simeq\\mathrm{id}$ applied to compact objects of the stratum categories — one-line arguments that are the intended proof; [examples.md]  the three recollement hypotheses of [Q1-L5](../index.html) for this $X$, condition (1) of [Q1-L5](../index.html) holds if and only if, for every $\\lambda\\in\\Lambda_X^+$, the costalks $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ ([Hecke action](../../../appendix/conv-hecke-action.html), [$\\mathrm{IC}_0$](../../../appendix/ic-0.html)), generate $\\mathcal{D}^{\\mathrm{ren}}(BG_\\lambda)$ in the sense of [`def:generation`](../../../appendix/def-generation.html), where $G_\\lambda$ is the finite-type quotient of the $K$-stabiliser of a point of $LX_\\lambda$ — one finite-dimensional generation question per orbit.", "history": "- **2026-08-04 — created**: records instance 3 of [examples.md](../examples.html), promoted at the user's request (ADR 0021). Epistemic status, per that file and the reading list: clause 2 is invoked there through Chen–Yi's closure theorem, which `papers/guideline.md` records as licensed only for symmetric $X = G/G^\\theta$ — and the diagonal $\\mathrm{SO}_{N-1}$ is not evidently of that form, an automorphism of $G$ preserving the two factors — so clause 2 is a claim this node must prove or source, not a quotation; the catalogue attribution behind clause 1 was flagged in [examples.md](../examples.html) as not independently verified against the source. Condition (2) of [Q1-L5](../index.html) is untouched by the instance, which predates the corrected statement ([updates/u1.md](../../../../blueprint/nodes/Q1-L5/updates/u1.md)). Chen–Yi's semisimplicity corollary (v4, Cor. 9) computes the abelian shadow of the generation question in clause 3.\n- **2026-08-04 — statement renotated** by `/update` ([u1](../../../../blueprint/nodes/Q1-L5/Q1-L5-e3/updates/u1.md), notation audit): clause 2 cited “hypothesis (iv) of Q1-L4” as live after its withdrawal ([Q1-L4/updates/u1.md](../../../../blueprint/nodes/Q1-L4/updates/u1.md)); the citation now routes through the withdrawal and name _subcategory", "href": "../../../appendix/def-satake-subcategory.html"}], "writeup": null, "critique": null, "examples": false, "prompts": [], "updates": ["u1.md"], "rounds": [], "flaws": [], "verdicts": [], "parent": null, "eff": "blocked", "chue": "var(--confneg)", "ctint": "6%", "cnote": "-6% — limited by Q1-L5", "cpct": "-6%", "upd": "revised (u1) and not yet re-proved", "core": "$$\n\\operatorname{supp}\\left(\\mathcal{F}_\\lambda\\ast\\mathrm{IC}_0\\right)\\subseteq\\overline{LX}_\\lambda;\n$$", "href": "../../Q1-L6/index.html", "kids": 1, "kidsProved": 0, "x": 240.0, "y": 252, "ea": null, "pages": [{"label": "node page", "href": "../../Q1-L6/index.html", "note": "statement, dependencies, objects"}, {"label": "self-contained prompt", "href": "../../Q1-L6/prompt.html", "note": "generated problem packet"}, {"label": "history", "href": "../../Q1-L6/history.html", "note": "every dated entry in this node's life"}], "fold": 1}, {"id": "Q1-a1", "dir": "Q1-a1", "title": "The Hecke module of the basic function", "type": "prop", "role": "analogy", "status": "open", "human": "—", "evidence": "counterexample", "created": "2026-08-04", "deps": [], "reqby": [], "statement": "Let $X$ be a smooth affine spherical $G$-variety over $F = \\mathbb{F}_q((t))$, split with all colors defined over $\\mathbb{F}_q$, with $\\mathfrak{o} = \\mathbb{F}_q[[t]]$ and $K = G(\\mathfrak{o})$. The unramified Hecke algebra $\\mathcal{H}(G(F),K)$ acts on $C_c^\\infty(X(F))^K$, and the basic vector $\\mathbf{e} = \\mathbf{1}_{X(\\mathfrak{o})}$ generates a submodule $\\mathcal{H}(G(F),K)\\cdot\\mathbf{e}$ — the trace-of-Frobenius shadow of the Satake subcategory [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html), with $\\mathbf{e}$ the shadow of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html). BZSV (arXiv:2409.04677) §9.4, (9.15), pp. 200–201, predict $C_c^\\infty(X_{\\mathfrak{f}};k)^{G_{\\mathfrak{o}}}$ as derived functions on the $q^{-1/2}$-twisted inertia of $\\check{M}/\\check{G}$, and for complex coefficients, where Sakellaridis (*Spherical functions on spherical varieties*, arXiv:0905.4244) applies, deduce an isomorphism of Hecke modules with distinguished vector,\n\n$$\nC_c^\\infty(X_F/G_O)\\;\\simeq\\;\\mathbb{C}[\\check{G}_X]^{\\check{G}_X},\\qquad \\mathbf{e}\\mapsto 1.\n$$\n\nWhether $\\mathbf{e}$ generates the whole module $C_c^\\infty(X(F))^K$ is the function-theoretic form of Q1's seed equality, and in print it is answered **both ways**, over local fields of characteristic zero. In the setting of arXiv:0905.4244 — $G$ split reductive with simply connected derived group, $X = H\\backslash G$ homogeneous affine spherical ($H$ reductive) with a unique open $B$-orbit over the field, no spherical root of type $N$, every Levi $L_\\gamma$ classical, and his Statement 7.1.5 for the weighted-color set — his Theorem 8.0.2 identifies $(C_c^\\infty(X)^K, \\mathbf{e}) \\simeq (\\mathbb{C}[\\delta_{(X)}^{1/2}A_X^*]^{W_X}, 1)$ with $\\mathcal{H}(G(F),K)$ acting through its image $\\mathcal{H}_X$ under the restriction map\n\n$$\n\\mathbb{C}[A^*]^{W} \\longrightarrow \\mathbb{C}[\\delta_{(X)}^{1/2}A_X^*]^{W_X}\n$$\n\n— for trivial $\\delta_{(X)}$ the restriction of class functions $\\mathbb{C}[\\check{G}]^{\\check{G}} \\to \\mathbb{C}[\\check{G}_X]^{\\check{G}_X}$. Hence $\\mathcal{H}(G(F),K)\\cdot\\mathbf{e} = \\mathcal{H}_X$, and $\\mathbf{e}$ generates **if and only if the restriction map is surjective**. It is surjective — generation, with multiplicity one and good test vectors — when $\\check{G}_X = \\check{G}$, e.g. split Gross–Prasad $SO_n\\backslash(SO_n\\times SO_{n+1})$ (his Cor. 8.0.4, Ex. 7.2.5). It fails for $X = (SL_2\\times SL_2\\times SL_2)\\backslash(Sp_4\\times Sp_4)$ (his Ex. 8.0.1): distinct $W_X$-orbits on $A_X^*$ fuse under $W$, at a fused Satake parameter the fiber of $C_c^\\infty(X)^K$ over $\\mathcal{H}_X$ has dimension $>1$ (his pp. 65–66), and a cyclic module over a commutative algebra has fibers of dimension $\\le 1$ — so there $\\mathbf{e}$ generates the proper submodule $\\mathcal{H}_X$ and *no* vector generates. Two transfers to this node's setting are not in print: equal characteristic (the paper's §1.1 fixes characteristic zero), and membership of the counterexample in the standing class [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html) — likely, since its no-type-$N$ roots give connected open-orbit $B$-stabilizers. Speaks to: [Q1-L1](../../Q1-L1/index.html), [Q1-L6](../../Q1-L6/index.html), [Q1-e7](../../Q1-e7/index.html).", "history": "- **2026-08-04 — created** by the lead-researcher from the [Q1-L1 `/examples` run](../../Q1-L1/examples.html) on the function-theoretic analogue, one of the nine first question-level example and analogy nodes (ADR 0018): the decategorified shadow of the seed equality — does the basic vector generate the Hecke module — which the run observed is posed nowhere in print, so the analogy carries the question's shape rather than an answer.\n- **2026-08-04 — references retargeted**: the group-case node this speaks to was reclassified [Q1-L7 → Q1-e7](../../Q1-e7/index.html) at the user's direction (ADR 0025), and the *Speaks to* line followed the rename; no mathematical content changed.\n- **2026-08-04 — statement revised** ([updates/u1.md](../../../../blueprint/nodes/Q1-a1/updates/u1.md)): the closing claim \"not answered in print\" was refuted — the [`/examples` run](../../Q1-a1/examples.html) surfaced, and the operator verified on the paper's own pages, that arXiv:0905.4244 answers generation both ways: Cor. 8.0.4(1) positively when the restriction map is surjective, Ex. 8.0.1 + Thm. 8.0.2 + pp. 65–66 negatively in general, the fusion mechanism confirmed by an independent computation. The statement now carries the paper's exact hypotheses, the surjectivity criterion, both outcomes, and the two conditions the transfer to this node's setting still lacks in print (equal characteristic; standing-class membership of the counterexample, commissioned as its own node). Status stays `open` — the node was never drafted.", "historyfile": "Q1-a1_history.md", "decomposition": "", "objects": [{"label": "def:satake_subcategory", "href": "../../../appendix/def-satake-subcategory.html"}, {"label": "$\\mathrm{IC}_0$", "href": "../../../appendix/ic-0.html"}, {"label": "def:polarized_hyperspherical", "href": "../../../appendix/def-polarized-hyperspherical.html"}], "writeup": null, "critique": null, "examples": true, "prompts": [], "updates": ["u1.md"], "rounds": [], "flaws": [], "verdicts": [], "parent": null, "eff": "ready", "chue": "var(--confneg)", "ctint": "25%", "cnote": "-25% — record open · human — · literature counterexample", "cpct": "-25%", "upd": "a published counterexample is on record", "core": "$$\nC_c^\\infty(X_F/G_O)\\;\\simeq\\;\\mathbb{C}[\\check{G}_X]^{\\check{G}_X},\\qquad \\mathbf{e}\\mapsto 1.\n$$", "href": "../../Q1-a1/index.html", "kids": 0, "kidsProved": 0, "x": -480, "y": -299.0, "ea": {"host": "__scope", "side": "l"}, "pages": [{"label": "node page", "href": "../../Q1-a1/index.html", "note": "statement, dependencies, objects"}, {"label": "self-contained prompt", "href": "../../Q1-a1/prompt.html", "note": "generated problem packet"}, {"label": "history", "href": "../../Q1-a1/history.html", "note": "every dated entry in this node's life"}, {"label": "examples", "href": "../../Q1-a1/examples.html", "note": "instances from the literature"}]}, {"id": "Q1-a2", "dir": "Q1-a2", "title": "The unramified Plancherel formula as decategorified conjecture", "type": "prop", "role": "analogy", "status": "open", "human": "—", "evidence": "—", "created": "2026-08-04", "deps": [], "reqby": [], "statement": "The Plancherel density of the basic vector $\\mathbf{e}$ in $L^2(X(F))$ is the measure\n\n$$\n\\frac{1}{|W_X|}\\,\\frac{\\det\\!\\left(I - t \\mid \\check{\\mathfrak{g}}_X/\\check{\\mathfrak{a}}_X\\right)}{\\det\\!\\left(I - (t,\\,q^{-1/2}) \\mid V_X\\right)}\\,dt\n$$\n\no
