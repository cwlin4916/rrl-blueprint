rded in the parent's statement by [u1](../../../../blueprint/nodes/Q1-L5/updates/u1.md).\n- **2026-08-05 — examined and unchanged** by `/update` of the parent ([Q1-L5/u2](../../../../blueprint/nodes/Q1-L5/updates/u2.md)): its \"In particular\" clause is now, verbatim, the parent's hypothesis (H3), so this node discharges a hypothesis instead of approximating one. The passage from all closures to $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ that this node's creation entry explicitly declined to claim is now the parent's (H2), and a child for it was commissioned the same run.\n";</script>
