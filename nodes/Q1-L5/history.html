 unqualified ⟸ fails at recollement generality — in the two-stratum recollement of arrow categories, $j_!k$ generates both strata stratumwise yet $\\operatorname{Map}(j_!k,\\, i_!k) = 0$ with $i_!k \\neq 0$ — so condition (2), support-cutting, is exactly the gluing datum the restrictions of a generating family do not see, and the three recollement hypotheses are now recorded in the statement. Both directions of the corrected criterion were re-proved by the operator before adoption. Whether the Hecke-stability of the family $\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\}$ forces (2) given (1) in the present setting — which would restore the old statement — is open and tracked in [priorities](../../../blueprint/priorities.md). The three hypotheses are expected from $K$-placidity ([`thm:chen_Ti`](../../appendix/thm-chen-ti.html), [`ex:sheaf_placid_ind`](../../appendix/ex-sheaf-placid-ind.html)) together with the finite-type strata of [Q1-L4](../Q1-L4/index.html); a proof must discharge them or a `/decompose` must isolate them.\n- **2026-08-04 — the run's four instances became children** [Q1-L5-e1](Q1-L5-e1/index.html)–[Q1-L5-e4](Q1-L5-e4/index.html) (ADR 0021), materialized by the lead-researcher against the corrected statement; the commission surfaced that joint conservativity of $\\{i_\\lambda^!\\}$ is not automatic even for the torus, so the third recollement hypothesis is genuinely load-bearing.\n- **2026-08-05 — statement revised** by `/update` ([u2](../../../blueprint/nodes/Q1-L5/updates/u2.md)), from a user review of the closure level, verified against the local Chen–Yi PDF before adoption: the third hypothesis had been joint conservativity of $\\{i_\\lambda^!\\}$ over the whole infinite $\\Lambda_X^+$ — indexed by the strata, which are the steps of no presentation, so no child could reach it. The setting presents $LX$ by orbit **closures** ([`thm:chen_Ti`](../../appendix/thm-chen-ti.html)), and over one closure with finitely many orbits joint conservativity is already the \"In particular\" of [Q1-L5-L5](Q1-L5-L5/index.html). The hypotheses are now (H1) as before, (H2) that $!$-restriction along the $\\overline{i}_\\mu$ identifies $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ with the limit over the closures, and (H3) the per-closure form of joint conservativity; the old hypothesis is derived from (H2)+(H3) in one line inside the statement, so the criterion proves what it proved before. Conditions (1) and (2) are untouched, so [Q1-L5-L1](Q1-L5-L1/index.html), [Q1-L5-L2](Q1-L5-L2/index.html) and [Q1-L6](../Q1-L6/index.html) still cite them by number. (H2) is now the node's one undischarged hypothesis, and the run commissioned a child for it.\n- **2026-08-05 — motivation added for condition (2)**, at the user's request: the node stated support-cutting without saying why it is there, so the reason recorded in [u1](../../../blueprint/nodes/Q1-L5/updates/u1.md) now sits in the statement itself as \"Why condition (2) is there\" — what the backward direction consumes it for (orthogonality against the stratum truncations $i_{\\lambda!}\\,i_\\lambda^!$, not against the generators), and the two-stratum $A_2$ counterexample showing (2) does not follow from (1). No hypothesis, condition or claim changed; prose only.\n";</script>
