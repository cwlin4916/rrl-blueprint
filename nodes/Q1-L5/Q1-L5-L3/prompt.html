<header class="bar"><nav class="crumbs"><a href="../../../index.html">blueprint</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q1-L5-L3</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q1-L5-L3 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, appendix.md, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q1-L5-L3 — self-contained prompt: Costalk restriction preserves coherence and induces continuous functors\n\n## Task\n\nProve the target claim rigorously under exactly the stated hypotheses.\n\nIn plain terms: resolve **Costalk restriction preserves coherence and induces continuous functors** without weakening the conclusion, strengthening the hypotheses, or changing notation.\n\nUse only the definitions and conventions reproduced below, the direct prerequisites whose status permits their use, and standard mathematics. If an essential step needs anything else, write `GAP:` and name the missing input.\n\n## Context and purpose\n\n**Question.** [Q1: When is $\\mathcal{D}_{c}(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_{c}(K\\backslash LX)$?](../../../dag.html)\n\n**Standing setting.** The standing setting of [context](../../../context.html): $k$ algebraically closed of characteristic $0$, $G$ connected reductive, $K = L^+G$, and $X$ a smooth affine spherical $G$-variety satisfying [`assum:intro`](../../../appendix/assum-intro.html)(a)–(c). We use the $K$-placid presentation of the loop space by orbit closures,\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda,\n$$\n\nsupplied by [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html), with orbits, closures and embeddings $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$ as in [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html). Here [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) is the $!$-extension of the constant $\\mathcal{D}$-module on $K\\backslash L^+X$, the Satake subcategory is [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html) under its ratified $\\mathcal{D}^{\\mathrm{ren}}$ reading, and $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [`def:renormalized`](../../../appendix/def-renormalized.html).\n\n**Repository problem.** For $X$ in the standing class, decide when\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} =_{\\mathcal{D}_c(K\\backslash LX)} \\mathcal{D}_c(K\\backslash LX),\n$$\n\ni.e. when the Satake subcategory [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html) — the subcategory the Hecke translates of [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) generate — is all of $\\mathcal{D}_c(K\\backslash LX)$.\n\n*Sought.* A condition on the orbit geometry of $LX$, checkable stratum by stratum in the presentation of the Setting, of one of three declared strengths: **necessary** — Hecke saturation, [Q1-L3](../../Q1-L3/index.html); **sufficient** — clean costalks along all strata, [Q1-L6](../../Q1-L6/index.html); or **necessary and sufficient** — stratumwise generation together with support-cutting under recollement hypotheses, [Q1-L5](../index.html). A full answer is the exact criterion with its hypotheses discharged for the standing class; failing that, the question accepts the necessary/sufficient bracket, with the gap between the two stated.\n\n**Purpose in the DAG.** This is a logical obligation in the proof DAG. It refines [Q1-L5](../index.html). Its conclusion is required directly by [Q1-L5](../index.html), [Q1-L5-L4](../Q1-L5-L4/index.html), [Q1-L5-L5](../Q1-L5-L5/index.html), [Q1-L5-L6](../Q1-L5-L6/index.html).\n\n**Purpose and provenance from the node record.**\n\n- **2026-08-04 — created** by `/decompose` of [Q1-L5](../index.html): isolates the parent's first recollement hypothesis, per the \"discharge them or isolate them\" demand of [u1](../../../../blueprint/nodes/Q1-L5/updates/u1.md) — the content is clause 1, coherence of costalks, which the finite-type strata of [Q1-L4](../../Q1-L4/index.html) are expected to supply; clause 2 is formal. Stated for every closed union of closures, not only $Z=LX$, because the per-closure conservativity node [Q1-L5-L5](../Q1-L5-L5/index.html) consumes exactly that generality.\n- **2026-08-05 — examined and unchanged** by `/update` of the parent ([Q1-L5/u2](../../../../blueprint/nodes/Q1-L5/updates/u2.md)): stated over a closed union of orbit closures $Z$, so it discharges the parent's (H1) at $Z = LX$ and supplies the same package over a single $\\overline{LX}_\\mu$ for (H3). The parent's revision moved towards this node's indexing, not away from it.\n\n## Target statement\n\nLet $Z\\subseteq LX$ be a closed $K$-stable sub-ind-scheme which is a union of orbit closures $\\overline{LX}_\\mu$ of [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html) — for instance a single $\\overline{LX}_\\mu$, a finite union, or $LX$ itself via the presentation of [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html). For $LX_\\lambda\\subseteq Z$ let $i_{\\lambda,Z}\\colon LX_\\lambda\\hookrightarrow Z$ denote the locally closed embedding through which $i_\\lambda$ factors, so $i_{\\lambda,LX}=i_\\lambda$. Then:\n\n1. $!$-restriction along $i_{\\lambda,Z}$ sends $\\mathcal{D}_c(K\\backslash Z)$ into $\\mathcal{D}_c(K\\backslash LX_\\lambda)$ ([`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html));\n\n2. consequently its ind-extension\n\n   $$\n   i_{\\lambda,Z}^!\\colon \\mathcal{D}^{\\mathrm{ren}}(K\\backslash Z)\\longrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\n   $$\n\n   is a continuous exact functor ([`def:renormalized`](../../../appendix/def-renormalized.html)) whose restriction to compact objects is the $!$-restriction of clause 1.\n\nFor $Z=LX$ this realizes the induced functor $i_\\lambda^!$ of [Q1-L5](../index.html) and discharges its first recollement hypothesis: each $i_\\lambda^!$ is continuous.\n\n## Direct prerequisites\n\n### [Q1-L4](../../Q1-L4/index.html) — Strata are classifying stacks with finite-type reductive quotients\n\n- **current effective status:** blocked\n- **use policy:** This prerequisite is not proved; keep any result conditional on it or discharge it separately.\n\nFor each $\\lambda\\in\\Lambda_X^+$ fix $x_\\lambda\\in LX_\\lambda(k)$ and set $K_\\lambda := \\operatorname{Stab}_K(x_\\lambda)$. Then:\n\n(i) $K\\backslash LX_\\lambda \\simeq BK_\\lambda$;\n\n(ii) $K_\\lambda$ is a placid group scheme admitting a normal pro-unipotent subgroup $U_\\lambda\\trianglelefteq K_\\lambda$ such that $G_\\lambda := K_\\lambda/U_\\lambda$ is an affine group scheme of finite type over $k$;\n\n(iii) pullback induces equivalences\n\n$$\n\\mathcal{D}_c(K\\backslash LX_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda) \\simeq \\mathcal{D}_c(BG_\\lambda^{\\mathrm{red}}),\n$$\n\nwhere $G_\\lambda^{\\mathrm{red}}$ is the quotient of $G_\\lambda$ by its unipotent radical.\n\n## Terms, definitions, and standing inputs\n\nThe entries below are reproduced from the canonical [appendix](../../../appendix/index.html). Their source attributions, roles, hypotheses, and caveats are part of the prompt. The generated copy is for self-contained reading and is not a second authority.\n\n### [`subsec:notations`](../../../appendix/subsec-notations.html) — the standing notation\n\n**Convention** (main.tex:207–228). $k$ is an algebraically closed field of characteristic $0$. $G$ is a connected reductive group over $k$ with a chosen Borel $B$ and maximal torus $T\\subset B$; $I$ is the Iwahori subgroup corresponding to $B$; $\\mathbb{X}^*(T)$ is the character lattice and $X_*(T)$ the cocharacter lattice (blueprint form for the latter; main.tex itself writes $\\mathbb{X}_*(T)$ at line 212 and $\\mathbb{X}_*(T)^+$ at line 1221, with the variant $\\mathbb{X}_\\bullet^+$ for the dominant cone once at line 1208); $W := N_G(T)/T$ is the finite Weyl group. $\\check G$ is the Langlands dual group and $\\check{\\mathfrak{g}}$ its Lie algebra.\n\nFor a finite-type $k$-scheme $X$, $L^+X$ is the positive loop space and $LX$ the loop space; we write $K = L^+G$. $\\mathrm{Gr}$ and $\\mathrm{Fl}$ denote the affine Grassmannian and the affine flag variety of $G$.\n\n$\\mathcal{D}(-)$ is the DG-category of $\\mathcal{D}$-modules, $\\mathcal{D}_c(-)$ its small full subcategory of coherent $\\mathcal{D}$-modules ([`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html)), and\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(-) := \\mathrm{Ind}\\left(\\mathcal{D}_c(-)\\right)\n$$\n\nthe renormalized category ([`def:renormalized`](../../../appendix/def-renormalized.html)).\n\nThe Hecke categories are $\\mathcal{H}_I := \\mathcal{D}(I\\backslash LG/I)$ (affine), $\\mathcal{H}_K := \\mathcal{D}(L^+G\\backslash\\mathrm{Gr})$ (spherical), with small variants $\\mathcal{H}_{c,I}$, $\\mathcal{H}_{c,K}$ and renormalized variants $\\mathcal{H}_I^{\\mathrm{ren}}$, $\\mathcal{H}_K^{\\mathrm{ren}}$.\n\n- **role:** convention\n\n### [`assum:intro`](../../../appendix/assum-intro.html) — the three standing hypotheses\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [`Conj:intro`](../../../appendix/conj-intro.html) holds for $X$.\n\n- **role:** standing hypothesis — in force for every node of the DAG unless a node says otherwise\n- **note:** (a) is exactly the conclusion of [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html) for $X$ smooth affine spherical, so it is not an extra restriction in that generality; it is stated as an assumption because main.tex wants it available before the sheaf-theoretic section. (b) is what makes $\\mathcal{D}^!$ and $\\mathcal{D}^*$ agree ([`ex:sheaf_placid_ind`](../../../appendix/ex-sheaf-placid-ind.html)). (c) is the input the whole paper is conditional on.\n\n**Key spherical varieties.** The class these hypotheses carve out is abstract, so the rows below fix the concrete $(G,X)$ this project keeps in mind — simplest first, then the two instructive ways to fall out of the class. \"(c)\" is hypothesis (c) above. The rows are orientation pointers, at the user's direction (2026-08-04): each writes its action out and its period name links to where the case is developed — the example node when the tree has one, the catalogue [`exam:hyperspherical_duality`](../../../appendix/exam-hyperspherical-duality.html) otherwise — but the duals, the hypotheses and the sources live in the catalogue and the nodes, never in a row, and no proof may cite one. [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html) fixes right actions; the two rows presented as left quotients say so and act by left translation.\n\n| $X$ | acted on by — the action | period | where (c) stands | in the tree |\n|---|---|---|---|---|\n| $G$ | $G\\times G$ — two-sided translation, $x\\cdot(g_1,g_2)=g_1^{-1}x\\,g_2$ | [group case](../../Q1-e1/index.html) | **proved** — derived Satake [[bezrukavnikov2008equivariant, Thm 5](../../../../papers/bezrukavnikov2008equivariant.pdf)] | [Q1-e1](../../Q1-e1/index.html) |\n| $\\mathbb{A}^1$ | $\\mathbb{G}_m$ — scaling, $x\\cdot t=tx$ | [Iwasawa–Tate](../../Q1-e2/index.html) | **verified by hand** — [[BZSV, Ex. 7.6.1](../../../../papers/BZSV.pdf)] | [Q1-e2](../../Q1-e2/index.html) |\n| $M_n$ | $\\mathrm{GL}_n\\times\\mathrm{GL}_n$ — two-sided translation on $n\\times n$ matrices, $m\\cdot(g_1,g_2)=g_1^{-1}m\\,g_2$ | [Godement–Jacquet](../../Q1-e4/index.html) | **proved** — [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)] | [Q1-e4](../../Q1-e4/index.html) |\n| $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation on cosets, $\\mathrm{Sp}_{2n}x\\cdot g=\\mathrm{Sp}_{2n}xg$ | [symplectic (Jacquet–Rallis)](../../Q1-e5/index.html); its dual is the Shalika side | **proved** — quaternionic Satake [[chen2022quaternionic](../../../../papers/chen2022quaternionic.pdf)]; the $B$-stabilizer connectedness of the standing class is not discharged in those sources | [Q1-e5](../../Q1-e5/index.html) |\n| $(\\mathrm{GL}_n\\times\\mathrm{GL}_n)\\backslash\\mathrm{GL}_{2n}$ | $\\mathrm{GL}_{2n}$ — right translation, $Hx\\cdot g=Hxg$ for $H=\\mathrm{GL}_n\\times\\mathrm{GL}_n$ block-diagonal | [linear periods](../../../appendix/exam-hyperspherical-duality.html) | **upcoming** work of Chen–Yi; the orbit geometry is already in print ([Chen–Yi orbit parametrization](../../../appendix/bb-chenyi-symmetric-orbits.html)) | — |\n| $\\mathrm{SO}_{n-1}\\backslash(\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n)$ | $\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n$ — right translation, $Hx\\cdot g=Hxg$, where $H=\\mathrm{SO}_{n-1}$ sits diagonally, $h\\mapsto(h,h)$, via $\\mathrm{SO}_{n-1}\\subset\\mathrm{SO}_n$ | [Gan–Gross–Prasad / theta](../../../appendix/exam-hyperspherical-duality.html) | **proved** — [[BFT_orthosymplectic_satake](../../../../papers/BFT_orthosymplectic_satake.pdf)] | — |\n| rank-$1$ affine homogeneous $X=H\\backslash G$ | various $G$ — right translation, $Hx\\cdot g=Hxg$ | [rank one](../../../appendix/exam-hyperspherical-duality.html) | **proved under hypotheses** — [[devalapurkar2024kutheoreticspectraldecompositionsspheres, Table 4](../../../../papers/devalapurkar2024kutheoreticspectraldecompositionsspheres.pdf)] | — |\n| $G/_{\\psi}U$ | $G$ — left translation through $G/U$, $g:xU\\mapsto gxU$, $U$ maximal unipotent; the twist is the generic character $\\psi$ of $U$ | [Whittaker](../../Q1-e3/index.html) | *outside the untwisted class* — twisted polarization; the equivalence per [[BZSV, §7.6.4](../../../../papers/BZSV.pdf)]; kept because it supplies [ABG](../../../appendix/bb-abg.html) at Iwahori level | [Q1-e3](../../Q1-e3/index.html) |\n| $\\mathrm{PSL}_2/\\mathrm{PO}_2$ | $\\mathrm{PSL}_2$ — left translation, $g:x\\,\\mathrm{PO}_2\\mapsto gx\\,\\mathrm{PO}_2$ | [boundary case](../../Q1-e6/index.html) | *outside the class* — a type-$N$ spherical root breaks connected stabilizers, and the expected statement itself changes shape | [Q1-e6](../../Q1-e6/index.html) |\n\nThe first four rows are where (c) is a theorem or a verified computation — the working instances of the standing class — with the linear periods next in line. $\\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, the linear periods and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ are symmetric, the territory where the [Chen–Yi orbit machinery](../../../appendix/bb-chenyi-symmetric-orbits.html) applies and [Q1-L6](../../Q1-L6/index.html)'s induction closes. The last two rows are kept deliberately: Whittaker for the Iwahori-level black box it supplies, and $\\mathrm{PSL}_2/\\mathrm{PO}_2$ because it shows clause (2) of [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html) is load-bearing.\n\n### [`Conj:intro`](../../../appendix/conj-intro.html) — unramified conjecture, de Rham setting\n\n**Conjecture** (main.tex:84; the detailed form is [`conj:relative_Langlands_unramified`](../../../appendix/conj-relative-langlands-unramified.html)). There is an equivalence of categories\n\n$$\n\\mathcal{D}_c(L^+G\\backslash LX)^{\\mathrm{Sat}}\\simeq \\mathrm{Perf}\\left(\\mathrm{sh}^{1/2}(\\check M)/\\check G\\right),\n$$\n\nsatisfying the *pointing condition* — $\\mathrm{IC}_0$ is sent to $\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$ — and compatible with the action coming from the Bezrukavnikov–Finkelberg derived geometric Satake equivalence [[bezrukavnikov2008equivariant](../../../../papers/bezrukavnikov2008equivariant.pdf)]\n\n$$\n\\mathcal{D}_c(L^+G\\backslash LG/L^+G)\\simeq \\mathrm{Perf}\\left(\\check{\\mathfrak{g}}^*[2]/\\check G\\right).\n$$\n\n- **role:** standing hypothesis, via [`assum:intro`](../../../appendix/assum-intro.html)(c)\n\n### [`conj:relative_Langlands_unramified`](../../../appendix/conj-relative-langlands-unramified.html) — unramified relative local Langlands\n\n**Conjecture** (main.tex:934). Let $M = T^*(2)X$ be a polarized hyperspherical $G$-variety with hyperspherical dual $(\\check G,\\check M)$. Then there is an equivalence\n\n$$\n\\mathcal{D}_c(L^+G\\backslash LX)^{\\mathrm{Sat}} \\simeq \\mathrm{Perf}\\left(\\mathrm{sh}^{1/2}(\\check M)/\\check G\\right)\n$$\n\nsuch that\n\n1. the equivalence is compatible with the action of derived geometric Satake [[bezrukavnikov2008equivariant](../../../../papers/bezrukavnikov2008equivariant.pdf)], $\\mathcal{D}_c(L^+G\\backslash LG/L^+G)\\simeq \\mathrm{Perf}(\\check{\\mathfrak{g}}^*[2]/\\check G)$;\n2. the pointing condition holds: the unramified basic object $\\mathrm{IC}_0$, the $!$-extension of the constant $\\mathcal{D}$-module on $L^+X$, is sent to $\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n- **role:** standing hypothesis (the expanded form of [`Conj:intro`](../../../appendix/conj-intro.html))\n- **note:** known cases are catalogued in [`exam:hyperspherical_duality`](../../../appendix/exam-hyperspherical-duality.html).\n\n### [`DGCat`](../../../appendix/conv-dgcat.html) — $k$-linear categories\n\n**Convention** (main.tex:249–258). For $R$ an $\\mathbb{E}_\\infty$-ring spectrum, $\\mathrm{LMod}_R\\in\\mathrm{CAlg}(\\mathrm{Pr}^L)$ and $\\mathrm{LinCat}_R := \\mathrm{LMod}_{\\mathrm{LMod}_R}(\\mathrm{Pr}^L)$ is the $\\infty$-category of $R$-linear categories. Following [[GR17vol1](../../../../papers/GR17vol1.pdf)] we write\n\n$$\n\\mathrm{DGCat} := \\mathrm{LinCat}_k, \\qquad \\mathrm{Vect} := \\mathrm{LMod}_k,\n$$\n\nthe latter being the unit object.\n\n- **role:** convention\n\n### [`def:generation`](../../../appendix/def-generation.html) — the generation operation $\\langle-\\rangle_{\\mathcal{C}}$\n\n**Definition** (main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../context.html). Equivalently, by [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)],\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0 \\ \\ \\forall i\\ge 0 \\implies c = 0 .\n$$\n\n- **role:** definition\n- **note:** *the ambient $\\mathcal{C}$ is part of the data and main.tex does not name it at the point of use, which is why the blueprint writes it as a subscript everywhere.* See the ratification recorded at [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html) and in [Q1-L1](../../Q1-L1/index.html): for Satake subcategories the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$. \"Cocomplete stable\" is strictly stronger than \"thick\"; $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits, not merely finite ones and retracts.\n\n### [`def:small_relative_tensor`](../../../appendix/def-small-relative-tensor.html) — small relative tensor product\n\n**Definition** (main.tex:562).\n\n1. $\\mathrm{Cat}^{\\mathrm{perf}}\\hookrightarrow\\mathrm{Cat}$ is the subcategory of small idempotent-complete stable $\\infty$-categories with exact functors.\n2. $\\mathrm{Cat}^{\\mathrm{perf}}$ is symmetric monoidal via $\\mathcal{A}\\otimes\\mathcal{B}\\simeq(\\mathrm{Ind}\\,\\mathcal{A}\\otimes\\mathrm{Ind}\\,\\mathcal{B})^\\omega$, giving a symmetric monoidal adjoint equivalence\n\n$$\n\\mathrm{Ind}\\colon (\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)\\rightleftarrows \\mathrm{Pr}^L_{\\mathrm{st},\\omega}\\colon (-)^\\omega .\n$$\n\n3. The relative tensor product in $\\mathrm{Cat}^{\\mathrm{perf}}$ is\n\n$$\n\\mathcal{M}\\otimes_{\\mathcal{A}}\\mathcal{N} := \\left(\\mathrm{Ind}\\,\\mathcal{M}\\otimes_{\\mathrm{Ind}\\,\\mathcal{A}}\\mathrm{Ind}\\,\\mathcal{N}\\right)^\\omega .\n$$\n\n4. For $R$ an $\\mathbb{E}_\\infty$-ring spectrum, $\\mathrm{Perf}(R)\\in\\mathrm{CAlg}(\\mathrm{Cat}^{\\mathrm{perf}})$ and $\\mathrm{Cat}^{\\mathrm{perf}}_R := \\mathrm{LMod}_{\\mathrm{Perf}(R)}(\\mathrm{Cat}^{\\mathrm{perf}})$.\n\n- **role:** definition\n- **note:** $\\mathrm{Cat}^{\\mathrm{perf}}_R\\rightarrow\\mathrm{Cat}^{\\mathrm{perf}}$ preserves finite limits and colimits but *not* the monoidal structures.\n\n### [module categories over a monoidal category](../../../appendix/conv-module-categories.html)\n\n**Convention** (main.tex:589–602, an unlabelled subsection; cite by line). Following [[HA](../../../../papers/HA.pdf)], a *monoidal category* is an algebra object of $\\mathrm{DGCat}$ ([`DGCat`](../../../appendix/conv-dgcat.html), [`Vect`](../../../appendix/conv-dgcat.html)). For $\\mathcal{A}$ monoidal, $\\mathrm{LMod}_{\\mathcal{A}}$ (resp. $\\mathrm{RMod}_{\\mathcal{A}}$) is the category of left (resp. right) $\\mathcal{A}$-module objects in $\\mathrm{DGCat}$ [[HA, §4.2–4.3](../../../../papers/HA.pdf)], and\n\n$$\n\\mathrm{LMod}_{\\mathcal{A}}\\simeq\\mathrm{RMod}_{\\mathcal{A}^{\\mathrm{rev}}},\\qquad {}_{\\mathcal{A}}\\mathrm{BMod}_{\\mathcal{B}}\\simeq\\mathrm{LMod}_{\\mathcal{A}\\otimes\\mathcal{B}^{\\mathrm{rev}}};\n$$\n\nfor $\\mathcal{M}\\in{}_{\\mathcal{A}}\\mathrm{BMod}_{\\mathcal{B}}$, Lurie's relative tensor product [[HA, §4.8.1](../../../../papers/HA.pdf)] gives $\\mathcal{M}\\otimes_{\\mathcal{B}}(-)\\colon\\mathrm{LMod}_{\\mathcal{B}}\\rightarrow\\mathrm{LMod}_{\\mathcal{A}}$. The same definitions are used with $\\mathrm{DGCat}$ replaced by $(\\mathrm{Cat}^{\\mathrm{perf}},\\otimes)$ for the small categories ([`def:small_relative_tensor`](../../../appendix/def-small-relative-tensor.html)), the two matching under $\\mathrm{Ind}$. In either ambient the action functor of an object $a\\in\\mathcal{A}$ on a module $\\mathcal{M}$ is $k$-linear and exact, so for $m\\in\\mathcal{M}$ and $n\\in\\mathbb{Z}$\n\n$$\na\\ast(m[n])\\ \\simeq_{\\mathcal{M}}\\ (a\\ast m)[n]\\ \\simeq_{\\mathcal{M}}\\ (a[n])\\ast m .\n$$\n\n- **role:** convention\n- **note:** the last display is only $k$-linearity of the action bifunctor $\\mathcal{A}\\otimes\\mathcal{M}\\rightarrow\\mathcal{M}$, but it is what makes a Hecke-generated family stable under shifts, so it is recorded here rather than re-derived at each use.\n\n### [$\\mathcal{D}^!$, $\\mathcal{D}^*$ — Kan extension to prestacks](../../../appendix/conv-d-shriek-d-star.html)\n\n**Convention** (main.tex:651–668). $\\mathrm{AffSch}$ is the $(1,1)$-category of classical affine $k$-schemes, $\\mathrm{AffSch}^{f.t.}$ its full subcategory of finite-type ones, and $\\mathrm{PreStk} := \\mathrm{Hom}(\\mathrm{AffSch},\\mathrm{Gpd})$. Let $\\mathcal{D}\\colon\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{DGCat}$ send a finite-type affine scheme to its DG-category of $\\mathcal{D}$-modules and a morphism to $f^!$. Left Kan extension gives $\\mathcal{D}^!$ on $\\mathrm{AffSch}^{op}$, and right Kan extension then gives\n\n$$\n\\mathcal{D}^!\\colon \\mathrm{PreStk}^{op}\\longrightarrow\\mathrm{DGCat}.\n$$\n\nDually, right Kan extending the $f_*$-variant along $\\mathrm{AffSch}^{f.t.}\\rightarrow\\mathrm{AffSch}$ and then left extending produces $\\mathcal{D}^*\\colon\\mathrm{PreStk}\\rightarrow\\mathrm{DGCat}$.\n\n- **role:** convention\n- **note:** the test category is $\\mathrm{AffSch}^{f.t.}$. This is what forces the finite-type reading of the test schemes in [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html), ratified at [Q1-L1](../../Q1-L1/index.html).\n\n### [`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html) — placidity\n\n**Definition** (main.tex:669).\n\n- A scheme/algebraic space $X$ *admits a placid presentation* if $X\\simeq\\varprojlim_i X_i$ is a cofiltered limit of finite-type schemes/algebraic spaces whose transition maps $X_i\\rightarrow X_j$ are smooth and affine; such an $X$ is a *placid* scheme/algebraic space.\n- An ind-scheme $X$ is *placid* if $X = \\varinjlim_i X_i$ is a filtered colimit of placid schemes along closed embeddings of finite presentation. If a placid group scheme $H$ acts on a placid ind-scheme $X$ and each $X_i$ in the presentation is $H$-stable, $X$ is an *$H$-placid ind-scheme*.\n\n- **role:** definition\n- **note:** $H$-placidity is a property *of a chosen presentation*, not of $X$ alone. Two presentations of the same $LX$ — the $K$-orbit-closure one and the $I$-orbit-closure one — are both supplied by [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html).\n\n### [loops, jets and positive loops are placid — $L^nX$, $L^+X$, $LX$](../../../appendix/ex-loops-placid.html)\n\n**Example** (main.tex:694–718, unlabelled; cite by line). Let $X\\in\\mathrm{AffSch}^{f.t.}$ be smooth affine of finite type. The $n$-jets $L^nX$, defined on $k$-algebras by\n\n$$\nL^nX(R) := X\\left(R[t]/t^n\\right),\n$$\n\nare represented by affine schemes of finite type, and the presentation $L^+X\\simeq\\varprojlim_n L^nX$ exhibits the positive loop space $L^+X$ as a placid scheme ([`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html)). The loop space $LX$ is a placid ind-scheme: for a closed embedding $X\\subset\\mathbb{A}^n$, the pieces $LX^i := LX\\cap t^{-i}L^+\\mathbb{A}^n$ are placid schemes and $LX\\simeq\\varinjlim_i LX^i$ is an ind-placid presentation.\n\n- **role:** proved in main.tex — usable as a black box\n- **hypotheses:** $X$ smooth affine of finite type\n- **note:** applied to $X = G$ this presents $K = L^+G$ ([`subsec:notations`](../../../appendix/subsec-notations.html)) as $\\varprojlim_m L^mG$ with the jet groups $L^mG$ as levels and homomorphic transitions; $L^1G = G$, so the level-one evaluation is evaluation at $t = 0$. Caveat transcribed from main.tex:710–717: if placid presentations are required to have *surjective* transitions, as in [[raskin_dmodules_infinite_var, §4.2](../../../../papers/raskin_dmodules_infinite_var.pdf)], the pieces $LX^i$ need not be placid in that stricter sense (see [[BZSV, Example 7.2.2](../../../../papers/BZSV.pdf)]).\n\n### [`ex:sheaf_placid_ind`](../../../appendix/ex-sheaf-placid-ind.html) — sheaves on a placid ind-scheme\n\n**Example** (main.tex:730). Let $X = \\varinjlim_i X_i$ be a placid ind-scheme. Then\n\n$$\n\\mathcal{D}^!(X) = \\varinjlim_i\\mathcal{D}^!(X_i), \\qquad \\mathcal{D}^*(X) = \\varinjlim_i\\mathcal{D}^*(X_i),\n$$\n\nwith connecting morphisms the left adjoint of $!$-pullback, respectively the right adjoint of $*$-pushforward. If $X$ admits a dimension theory there is a canonical duality $\\mathcal{D}^!(X)\\simeq\\mathcal{D}^*(X)$ [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)], and we then do not distinguish the $!$- and $*$-versions.\n\n- **role:** black box\n- **hypotheses:** $X$ a placid ind-scheme; a dimension theory for the identification $\\mathcal{D}^!\\simeq\\mathcal{D}^*$ — supplied for $LX$ by [`assum:intro`](../../../appendix/assum-intro.html)(b)\n\n### [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html) — Iwahori and spherical orbits on $LX$\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n- **role:** definition\n- **note:** the notation is explained by the group case, spelled out — with the footnote reference — in the entry [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html) below. The closures $\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ that this entry names but does not define are the entry [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n- **note:** **Ratified reading ([ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html)).** main.tex:737 posits the posets of $I$- and $L^+G$-orbits with their locally closed embeddings but never defines \"orbit\". The blueprint fixes the reading here, self-contained and on the manuscript's own terms — not by appeal to any source's sense of the word.\n\n  *The reading.* For a $k$-point $x$ of $LX$, the **orbit** of $H \\in \\{I, L^+G\\}$ through $x$ is the fpqc-sheaf image of the orbit map $h \\mapsto h\\cdot x$, a subsheaf of $LX$. The definitional content of this entry is that these image sheaves are representable by the locally closed sub-ind-schemes named above: the strata $LX_\\lambda$ (for $H = L^+G$) and $\\mathcal{O}_v$ (for $H = I$) *are* the orbit images through their $k$-points.\n\n  *What the reading does not include.* It does not identify the image sheaf with any pro-scheme presentation, such as Chen–Yi's $L^+Gx_v \\cong \\varprojlim_j L^+_jG/H_j$ ([[chenyi_2025singularitiesorbitclosuresloop](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)], p. 22, unnumbered, inside the proof of Thm 36). Any such identification remains a theorem to be proved where a node needs it, never definitional.\n\n  *Provenance.* The published consistency statement for this reading — that orbit images of jet-group actions are representable and locally closed in this setting — is Sakellaridis–Wang (arXiv:2009.03943), Prop. 2.3.7 with Lem. 2.3.10; that source has no `refs.bib` key and is **not citable**, so it is named here for provenance only. It was verified at page level by the [Q1-L4-L1](../../Q1-L4/Q1-L4-L1/index.html) `/examples` run (see [papers/guideline.md](../../../papers/guideline.html)), and Chen–Yi's Remark 37 — the source of the spherical generality of [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html) — itself rests on [SW22, Lem. 2.3.10] on the page.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../appendix/def-orbit-closure.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html).\n\n- **role:** definition\n- **note:** **What the reading does not include: placidity.** That $\\overline{LX}_\\lambda$ is a placid scheme is no part of taking a closure, and it does not follow from placidity of the stratum $LX_\\lambda$. In the proof of [[chenyi_2025singularitiesorbitclosuresloop, Thm. 36](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)] (pp. 21–22, read 2026-08-05) the closure is produced as the middle term of a factorization $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ i_\\lambda\\ }L^iX$ obtained by Noetherian descent for finitely presented morphisms **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$ of Drinfeld's presentation (the source's Thm. 35, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html)), with $j_\\lambda$ a placid fp-open embedding and $i_\\lambda$ a placid fp-closed embedding. So placidity of the closure — and the finite presentation of $\\overline{i}_\\lambda$ — is imported from [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html)(a) and from nowhere else; this entry supplies only what the closure *is*.\n- **note:** *Companion to the orbit reading.* [ADR 0028](../../../process/decisions/0028-orbit-strata-are-fpqc-images.html), recorded on [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html), fixes what an *orbit* is — the fpqc-sheaf image of an orbit map, represented by the locally closed stratum — and says nothing about closures. This entry is the missing half: the closure of that stratum, reduced. Neither reading claims a pro-scheme presentation of either object.\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../appendix/not-lambda-x-plus.html)\n\n**Notation** (main.tex:734–747, inside [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n- **role:** notation\n- **note:** one identification is in force beyond the group case: for a symmetric variety $X = G/G^\\theta$, [Chen–Yi](../../../appendix/bb-chenyi-symmetric-orbits.html) identifies $\\Lambda_X^+$ with the dominant coweights $\\Lambda_S^+$ of a maximal $\\theta$-split torus $S$.\n\n### [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html) — orbit closures present $LX$ as a placid ind-scheme\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures, finite presentation of the embeddings** (the source's Theorem 36).\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([`placid_ind_scheme`](../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **role:** black box\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and a node must say which it uses.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n- **note:** this is what makes [`assum:intro`](../../../appendix/assum-intro.html)(a) automatic in the paper's generality, and it is the source of every stratification argument in Q1. Which clause the citing nodes actually consume: [Q1-L5-L3](index.html), [Q1-L5-L4](../Q1-L5-L4/index.html) and [Q1-L5-L6](../Q1-L5-L6/index.html) need the finite presentation of $j_\\lambda$, of $\\overline{i}_\\mu$ and of $\\overline{LX}_\\mu\\hookrightarrow\\overline{LX}_{\\mu'}$ — that is clause (a) — while the indexing of the limit in [Q1-L5](../index.html)(H2) is clause (b).\n- **note:** *Provenance, checked at page level on 2026-08-05 against `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025).* In v4, Theorem 36 (§5.2, p. 21) is clause (a) above and **not** the presentation; the presentation is Proposition 39(ii) (§5.3, p. 23), whose part (i) is the $I_0$-statement. Proposition 39 states the steps as the $\\pi_0$-wise disjoint unions $\\overline{LX}_{\\underline{\\lambda}} = \\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$, indexed by tuples $\\underline{\\lambda} = \\{\\lambda_\\beta\\}_{\\beta\\in\\pi_0(LX)}$ and called *locally equidimensional* placid presentations; the single-index form displayed above is the manuscript's (main.tex:772), and the two agree when $LX$ is connected. The proof of Thm 36 (pp. 21–22) also fixes the mechanism: $\\eta_\\lambda\\colon LX_\\lambda\\xrightarrow{j_\\lambda}\\overline{LX}_\\lambda\\xrightarrow{i_\\lambda}L^iX$ is the Noetherian-descent factorization of a finitely presented morphism **inside** the placid scheme $L^iX = LX\\cap t^iL^+V$, with $j_\\lambda$ a placid fp-open and $i_\\lambda$ a placid fp-closed embedding.\n\n  *The manuscript's numbers are another version's.* main.tex:772 cites the presentation as \"[Theorem 36]\" and main.tex:1227 cites $K$-placidity of $\\overline{LX}_\\beta$ as \"[Prop. 29.(ii)]\"; neither matches v4, where those are Prop. 39(ii) and Thm 36(i). Recorded as provenance for whoever reads the source alongside the manuscript — not as a correction to main.tex, which no agent edits.\n\n### [`defn:coherent_D_mod`](../../../appendix/defn-coherent-d-mod.html) — coherent $\\mathcal{D}$-modules\n\n**Definition** (main.tex:779). For $\\mathcal{Y}$ a prestack, the full subcategory $\\mathcal{D}_c(\\mathcal{Y})\\subset\\mathcal{D}(\\mathcal{Y})$ of *coherent* $\\mathcal{D}$-modules consists of the $\\mathcal{F}$ such that $f^!\\mathcal{F}$ is a finite complex of $\\mathcal{D}$-modules with coherent cohomology for every smooth morphism $f\\colon S\\rightarrow\\mathcal{Y}$ with $S$ a dg-scheme.\n\n- **role:** definition\n- **note:** two things a proof must respect. (i) *Ratified reading:* the test schemes $S$ are taken of **finite type** — the reading forced by the Kan-extension construction of $\\mathcal{D}^!$ from $\\mathrm{AffSch}^{f.t.}$ ([$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../../appendix/conv-d-shriek-d-star.html)); ratified at [Q1-L1](../../Q1-L1/index.html). (ii) *Coherent $\\ne$ compact on stacks:* for a finite-type scheme the safe $\\mathcal{D}$-modules $\\mathcal{D}_s(X)\\hookrightarrow\\mathcal{D}_c(X)$ exhaust the coherent ones, but on stacks they do not — the constant $\\mathcal{D}$-module on $BG$, $G$ reductive, is coherent and not compact (main.tex:786–793). Since $f^!$ and $f^*$ differ only by a degree shift, coherence may equivalently be tested with $f^*$.\n\n### [`def:renormalized`](../../../appendix/def-renormalized.html) — the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n- **role:** definition\n- **note:** this definition carries **no `\\label` in main.tex** — cite it as `main.tex:794`, never as a label, and do not invent one. It is the ambient category in which every Satake generation is formed; see [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html) and [Q1-L1](../../Q1-L1/index.html).\n\n---\n\n<a id=\"s6\"></a>\n\n## 6. Categorical actions\n\n### [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html) — untwisted polarized hyperspherical varieties\n\n**Definition** (main.tex:875). A *spherical $G$-variety* is a normal $G$-variety $X$ over $k$ with a right $G$-action such that for every Borel $B\\subset G$, $X$ has a Zariski-open $B$-orbit. We further assume\n\n1. $X$ is smooth and affine;\n2. the $B$-stabilizers of points in the open $B$-orbit are connected.\n\nUnder these conditions $M = T^*(2)X$ is a *polarized hyperspherical $G$-variety*, with the weight-$2$ $\\mathbb{G}_m$-action on fibres, in the sense of [[BZSV, §3.5.1](../../../../papers/BZSV.pdf)] (proof: [[BZSV, Prop. 3.7.4](../../../../papers/BZSV.pdf)]). In particular $M$ is a *graded Hamiltonian $G$-variety*.\n\n- **role:** definition — this is the $X$ of every node in the DAG\n- **note:** condition (2) holds for example when $X$ has no roots of type $N$ in the sense of [[BZSV, Rmk 4.2.1](../../../../papers/BZSV.pdf)].\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../appendix/ic-0.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n- **role:** definition\n- **note:** the pointing condition of [`conj:relative_Langlands_unramified`](../../../appendix/conj-relative-langlands-unramified.html) is exactly the requirement that $\\mathrm{IC}_0\\mapsto\\mathcal{O}_{\\mathrm{sh}^{1/2}(\\check M)}$.\n\n  **Ratified reading.** The displayed membership is a genuine finiteness statement — it says the $!$-extension is coherent — and no node in the blueprint derives it. It is imported from main.tex:79–80, where the Satake subcategory is introduced as a subcategory *of* $\\mathcal{D}_c(L^+G\\backslash LX)$ generated by $\\mathrm{IC}_0$ under the Hecke action, which presupposes it; the same presupposition is what lets [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html) accept $\\mathrm{IC}_0$ in the second slot of its module action. Before 2026-08-05 it was carried only by the grammar of those two entries, and round 1 of [Q1-L2-L3](../../Q1-L2/Q1-L2-L3/critiques/r1.html) asked for it to be stated; it is stated here so that a proof may cite it rather than infer it from a typing argument. Anyone who later wants it *proved* wants a node about coherence of $!$-extensions on $K\\backslash LX$, which is not in the closed world.\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../appendix/conv-hecke-action.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [`subsec:notations`](../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([`def:small_relative_tensor`](../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n- **role:** convention\n- **note:** main.tex writes the convolution diagram only for the Hecke category itself (main.tex:1096–1102) and describes the action on $LX$ in words — \"which are given by the convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$\", main.tex:922. This entry records the reading that the two are the same pull–push construction, which is how every node in the DAG uses $\\ast$.\n\n### [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html) — the Satake subcategories\n\n**Definition** (main.tex:917). Let $X$ be as in [`def:polarized_hyperspherical`](../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [`def:generation`](../../../appendix/def-generation.html), by the convolution action of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$:\n\n$$\n\\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n- **role:** definition\n- **note:** **Ratified reading.** main.tex names no ambient cocomplete category for the $\\langle-\\rangle_{\\mathcal{C}}$ of [`def:generation`](../../../appendix/def-generation.html), while $\\mathcal{D}_c$ itself is small and not cocomplete, so the definition as printed is incomplete. The blueprint fixes the reading\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)},\n$$\n\n  the generation being formed inside $\\mathcal{D}^{\\mathrm{ren}}$. This is forced by the essential-image assertion in the proof of [`thm:F_cstr_Sat`](../../../appendix/thm-f-cstr-sat.html) (main.tex:1391–1392). Ratified in round 2 of [Q1-L1](../../Q1-L1/index.html); every downstream node presupposes it. See [ADR 0001](../../../process/decisions/0001-satake-generation-ambient-category.html).\n\n### [`exam:hyperspherical_duality`](../../../appendix/exam-hyperspherical-duality.html) — known cases of the unramified equivalence\n\n**Example** (main.tex:961).\n\n1. **Group case.** $X = G$ acted on by $G\\times G$: then $\\check M = T^*(2)\\check X$ with $\\check X = \\check G$. This is derived geometric Satake [[bezrukavnikov2008equivariant, Thm 5](../../../../papers/bezrukavnikov2008equivariant.pdf)].\n2. **Non-homogeneous.** Godement–Jacquet/Gaiotto for $m = n$: $X = M_n$ with $G = \\mathrm{GL}_n\\times\\mathrm{GL}_n$ gives $\\check M = T^*(2)\\check X$, $\\check X = \\mathrm{GL}_n\\times\\mathbb{A}^n$ with $(g,v)\\cdot(g_1,g_2) = (g_1^{-1}gg_2, vg_2)$. Proved by Braverman–Finkelberg–Ginzburg–Travkin [[BravermanFinkelbergGinzburgTravkin_2021, Thm 3.6.1](../../../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)].\n3. **Homogeneous spherical varieties.**\n   - *Shalika model.* $X = \\mathrm{Sp}_{2n}\\backslash\\mathrm{GL}_{2n}$, $\\check M = T^*((\\mathrm{GL}_n^{\\mathrm{diag}}U,\\psi)\\backslash\\mathrm{GL}_{2n}) = \\mathrm{GL}_{2n}\\times^{\\mathrm{GL}_n}\\mathfrak{gl}_n^*$ [[chen2022quaternionic, §1.6](../../../../papers/chen2022quaternionic.pdf)].\n   - *Linear periods.* $X = \\mathrm{GL}_n\\times\\mathrm{GL}_n\\backslash\\mathrm{GL}_{2n}$, $\\check X = \\mathrm{GL}_{2n}\\times_{\\mathrm{Sp}_{2n}}\\mathbb{A}^{2n}$; unramified equivalence is upcoming work of Chen–Yi.\n   - *Gan–Gross–Prasad, theta correspondence.* $G = \\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n$, $X = \\mathrm{SO}_{n-1}\\backslash(\\mathrm{SO}_{n-1}\\times\\mathrm{SO}_n)$, $\\check G = \\mathrm{SO}(V_0)\\times\\mathrm{Sp}(V_1)$ with $\\dim V_0 = n-1$ ($n$ odd) or $n$ ($n$ even) and $\\dim V_1 = n-1$ ($n$ odd) or $n-2$ ($n$ even); $\\check M = (V_0\\otimes V_1)(1)$. Proved by Braverman–Finkelberg–Travkin [[BFT_orthosymplectic_satake](../../../../papers/BFT_orthosymplectic_satake.pdf)].\n   - *Rank $1$ affine homogeneous spherical $X$.* $\\check M$ is tabulated in [[devalapurkar2024kutheoreticspectraldecompositionsspheres, Table 4](../../../../papers/devalapurkar2024kutheoreticspectraldecompositionsspheres.pdf)], where the unramified equivalence is also proved under hypotheses.\n\n- **role:** catalogue of cases in which [`assum:intro`](../../../appendix/assum-intro.html)(c) is a theorem rather than a hypothesis\n\n### [Chen–Yi symmetric orbit parametrization and closure relation](../../../appendix/bb-chenyi-symmetric-orbits.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 17(i) and Thm. 18](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; external, no main.tex label). Let $X = G/G^\\theta$ be a symmetric variety: $\\theta$ an involution of the connected reductive group $G$ whose fixed-point subgroup $G^\\theta$ is connected. Let $S$ be a maximal $\\theta$-split torus of $G$, and let $\\Lambda_S^+$ and $\\check\\Phi^+$ be the dominant coweights of $S$ and the positive coroots, both taken for the restricted root data of §3.1 of the source. Then:\n\n1. *(Prop. 17(i))* The $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$; that is, the index set $\\Lambda_X^+$ of [`def:orbits_iwahori_spherical`](../../../appendix/def-orbits-iwahori-spherical.html) is identified with $\\Lambda_S^+$.\n2. *(Thm. 18)* For every $\\mu\\in\\Lambda_S^+$,\n\n$$\n\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu} LX_\\lambda, \\qquad\\text{where}\\quad \\lambda\\le\\mu \\iff \\mu-\\lambda\\in\\mathbb{Z}_{\\ge0}\\check\\Phi^+,\n$$\n\ni.e. $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative integral sum of positive coroots.\n\n- **role:** external black box\n- **hypotheses:** $X$ symmetric with $G^\\theta$ connected — **not** general spherical. The proofs run through $\\theta$-twisted $\\mathrm{SL}_2$-computations ([[chenyi_2025singularitiesorbitclosuresloop, Prop. 20, Cor. 21](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]), and no remark in the source extends them beyond the symmetric case — unlike the placidity theorem (Thm 36 with Rem 37) black-boxed as [`thm:chen_Ti`](../../../appendix/thm-chen-ti.html), which the source does extend to general spherical $X$.\n- **note:** *Provenance, verified on the page.* The PDF is on disk as `papers/chenyi_2025singularitiesorbitclosuresloop.pdf` (arXiv:2310.20006**v4**, 10 Jul 2025), and both statements were re-checked there on 2026-08-05 by the lead-researcher for `/update Q1-L5`. **Proposition 17(i)**, p. 10: the $L^+G$-orbits on $LX$ are represented by $\\Lambda_S^+$ — for each $\\mu\\in\\Lambda_S^+$ there is $x_\\mu\\in LX(k) = X(F)$ with $\\tau(x_\\mu) = t^\\mu\\in S(F)$, and $LX_\\mu = L^+G\\cdot x_\\mu$ is the corresponding orbit. **Theorem 18**, p. 10: for every $\\mu\\in\\Lambda_S^+$, $\\overline{LX}_\\mu = \\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$; the order is the one the source fixes on $\\Lambda_S$ just above Prop. 17 on the same page, by restriction from $\\Lambda_T$ — $\\lambda\\le\\mu$ exactly when $\\mu-\\lambda$ is a non-negative sum of positive coroots. Both check out as transcribed above.\n\n  Same page, Remark 19: for $k = \\mathbb{C}$ the closure relation is the source's [Nad04, Thm. 10.1], proved there through real affine Grassmannians, whereas the source's own argument is algebraic and valid over any algebraically closed field of characteristic $\\ne 2$ — so it covers the blueprint's standing $k$ of characteristic $0$ ([`subsec:notations`](../../../appendix/subsec-notations.html)). Prop. 17(ii), the bijection $G(F)/K(F)\\cong X(F)$, is the part that needs $G^\\theta$ connected on the page; the reading record in [`papers/guideline.md`](../../../papers/guideline.html) notes that in [Nad04] part (i) holds without that hypothesis.\n\n---\n\n<a id=\"s8\"></a>\n\n## 8. Results established inside main.tex\n\nThese are proved in the manuscript. A node may invoke them without reproof, but must check the stated hypotheses.\n\n### [`thm:F_cstr_Sat`](../../../appendix/thm-f-cstr-sat.html) — the small Satake comparison\n\n**Theorem** (main.tex:1028). The functor `equation:I-equiv-functor` (main.tex:1019) induces an equivalence\n\n$$\nF_c^{\\mathrm{Sat}}\\colon \\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\otimes_{\\mathcal{H}_{c,K}}\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}\\simeq \\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}} .\n$$\n\n- **role:** proved in main.tex\n- **hypotheses:** [`assum:intro`](../../../appendix/assum-intro.html)\n- **note:** the essential-image step in its proof (main.tex:1391–1392) is what pins the ambient category in [`def:satake_subcategory`](../../../appendix/def-satake-subcategory.html).\n\n### [ABG / Iwahori–Whittaker spectral descriptions](../../../appendix/bb-abg.html)\n\n**Theorem** ([[arkhipov2004quantum](../../../../papers/arkhipov2004quantum.pdf)], [[gaitsgory-semiinfinite-intersection-coh](../../../../papers/gaitsgory-semiinfinite-intersection-coh.pdf)]). Iwahori–Whittaker and spherical spectral descriptions, as cited in main.tex.\n\n- **role:** external black box\n- **hypotheses:** as cited — check the precise form in the source before use\n\n## Relevant references\n\n- **canonical node:** [Q1-L5-L3_node.md](index.html)\n- **question and DAG:** [main_dag.md](../../../dag.html)\n- **standing context:** [context.md](../../../context.html)\n- **object registry:** [appendix.md](../../../appendix/index.html)\n- **bibliography:** [refs.bib](../../../../refs.bib)\n- **direct prerequisite:** [Q1-L4](../../Q1-L4/index.html)\n\nAll source references without a `refs.bib` key remain written verbatim in the provenance or appendix text above; none is silently promoted into the closed world.\n\n### Bibliography records\n\n```bibtex\n@article{chen2022quaternionic,\n  title={Quaternionic Satake equivalence},\n  author={Chen, Tsao-Hsien and Macerato, Mark and Nadler, David and O'Brien, John},\n  journal={arXiv preprint arXiv:2207.04078},\n  year={2022}\n}\n\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@article{BravermanFinkelbergGinzburgTravkin_2021,\n   title={Mirabolic Satake equivalence and supergroups},\n   volume={157},\n   ISSN={1570-5846},\n   url={http://dx.doi.org/10.1112/S0010437X21007387},\n   DOI={10.1112/s0010437x21007387},\n   number={8},\n   journal={Compositio Mathematica},\n   publisher={Wiley},\n   author={Braverman, Alexander and Finkelberg, Michael and Ginzburg, Victor and Travkin, Roman},\n   year={2021},\n   month=jul, pages={1724–1765} }\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primaryClass={math.RT},\n      url={https://arxiv.org/abs/2310.20006},\n}\n\n@misc{devalapurkar2024kutheoreticspectraldecompositionsspheres,\n      title={ku-theoretic spectral decompositions for spheres and projective spaces},\n      author={Sanath K. Devalapurkar},\n      year={2024},\n      eprint={2402.03995},\n      archivePrefix={arXiv},\n      primaryClass={math.AT},\n      url={https://arxiv.org/abs/2402.03995},\n}\n\n@article{GR17vol1,\n    author = {Dennis Gaitsgory and Nick Rozenblyum},\n    title = {A study in Derived Algebraic Geometry, volume 1},\n    year = {2017}\n}\n\n@article {gaitsgory-semiinfinite-intersection-coh,\n    AUTHOR = {Gaitsgory, D.},\n     TITLE = {The semi-infinite intersection cohomology sheaf},\n   JOURNAL = {Adv. Math.},\n  FJOURNAL = {Advances in Mathematics},\n    VOLUME = {327},\n      YEAR = {2018},\n     PAGES = {789--868},\n      ISSN = {0001-8708,1090-2082},\n   MRCLASS = {14F05 (14D24 14M15 20J06)},\n  MRNUMBER = {3762003},\nMRREVIEWER = {Anthony\\ Henderson},\n       DOI = {10.1016/j.aim.2017.08.007},\n       URL = {https://doi.org/10.1016/j.aim.2017.08.007},\n}\n\n@article{HA,\n    author = {Lurie, Jacob},\n    title ={Higher Algebra} ,\n    year = {2009}\n}\n\n@misc{raskin_dmodules_infinite_var,\ntitle={D-modules on infinite dimentional varieties},\nauthor={Sam Raskin},\nurl={https://gauss.math.yale.edu/~sr2532/dmod.pdf},\n}\n\n@article{bezrukavnikov2008equivariant,\n  title={Equivariant Satake category and Kostant--Whittaker reduction},\n  author={Bezrukavnikov, Roman Vladimirovich and Finkel'berg, Mikhail Vladlenovich},\n  journal={Moscow Mathematical Journal},\n  volume={8},\n  number={1},\n  pages={39--72},\n  year={2008},\n  publisher={Независимый Московский университет--МЦНМО}\n}\n\n@article{BFT_orthosymplectic_satake,\n   title={Orthosymplectic Satake equivalence},\n   volume={16},\n   ISSN={1931-4531},\n   url={http://dx.doi.org/10.4310/CNTP.2022.v16.n4.a2},\n   DOI={10.4310/cntp.2022.v16.n4.a2},\n   number={4},\n   journal={Communications in Number Theory and Physics},\n   publisher={International Press of Boston},\n   author={Braverman, Alexander and Finkelberg, Michael and Travkin, Roman},\n   year={2022},\n   pages={695–732} }\n\n@article{arkhipov2004quantum,\n  title={Quantum groups, the loop Grassmannian, and the Springer resolution},\n  author={Arkhipov, Sergey and Bezrukavnikov, Roman and Ginzburg, Victor},\n  journal={Journal of the American Mathematical Society},\n  volume={17},\n  number={3},\n  pages={595--678},\n  year={2004}\n}\n```\n\n## Expected response\n\nProve the claim in a standalone argument.\n\n1. State the strategy and identify exactly which supplied inputs it uses.\n2. Check every hypothesis at the point where it is applied.\n3. Keep every equality or equivalence in its named ambient category.\n4. Separate proved conclusions from `GAP:` items.\n5. End with a concise statement of what has and has not been established.\n";</script>
