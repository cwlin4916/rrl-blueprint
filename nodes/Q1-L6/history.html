gation is stated honestly: derive both conditions from (a)+(b), the support-cutting one by induction over the orbit poset.\n- **2026-08-04 — dependency gained**: the per-closure finiteness that induction needs was withdrawn from [Q1-L4](../Q1-L4/index.html) the same day ([Q1-L4/updates/u1.md](../../../blueprint/nodes/Q1-L4/updates/u1.md)) — it fails in the standing class ([Q1-L5-e4](../Q1-L5/Q1-L5-e4/index.html)) and is a theorem for $X$ symmetric — and the scoped claim was commissioned by the `/update` failure audit as the sub-lemma [Q1-L6-L1](Q1-L6-L1/index.html), so the induction route proves the conclusion at symmetric scope until a finiteness-free derivation of support-cutting is found.\n- **2026-08-05 — examined and unchanged** by `/update` of [Q1-L5](../Q1-L5/index.html) ([u2](../../../blueprint/nodes/Q1-L5/updates/u2.md)): this node cites conditions (1) and (2) of Q1-L5 by number and its conclusion is routed \"under the recollement hypotheses of Q1-L5\", both of which survive the revision — the conditions verbatim, the routing clause because it names the parent's hypotheses rather than restating them. Its hypothesis (a), $\\operatorname{supp}(\\mathcal{F}_\\lambda\\ast\\mathrm{IC}_0)\\subseteq\\overline{LX}_\\lambda$, was until now the only place in the chain where an orbit closure appeared in a statement; the parent's revision puts the closure level into Q1-L5 as well, so the two nodes are indexed alike.\n";</script>
