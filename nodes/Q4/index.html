<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">nodes</a><i>›</i><span>Q4_node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q4 — Do stratumwise generation and support-cutting imply one another?</h1><p class="lead">Generated from <code>blueprint/nodes/Q4/Q4_node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[DAG index](../../dag.html) · [appendix](../../appendix/index.html) · [context](../../context.html) · [key examples](../../key_examples/index.html) · [history](history.html)\n\n- **type:** question\n- **created:** 2026-08-08\n- **human:** —\n\n## Feeds\n\n[Q1](../Q1/index.html) and [Q2](../Q2/index.html). To [Q1](../Q1/index.html): the criterion it advertises at strength *necessary and sufficient*, [Q1-L5](../Q1/Q1-L5/index.html), has two clauses, and an answer here says whether one of them may be dropped — that is, whether [Q1](../Q1/index.html) has one geometric condition to check at each stratum or two. To [Q2](../Q2/index.html): its membership is strictly stronger than clause **(2)** below, and an answer here says at which strata the two are the same question.\n\nThe relation is between the *questions*. No Q4 node lists a Q1, Q2 or Q3 node in **depends-on**, so the four arguments stay separately auditable.\n\n## Setting\n\n$k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../appendix/assum-intro.html)(a)–(c) and [untwisted polarized hyperspherical varieties](../../appendix/def-polarized-hyperspherical.html). This is the standing class of [context](../../context.html) and of [Q1](../Q1/index.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../appendix/def-orbits-iwahori-spherical.html); $LX$ carries the $K$-placid presentation of [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html). The renormalized category $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../appendix/conv-hecke-action.html).\n\n### The recollement package, in force throughout\n\nNothing here proves it. [Q3](../Q3/index.html) asks for which $X$ it holds and states it canonically; it is repeated in full because Q4's nodes spend its clauses one at a time and each says at the point of use which it spends.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n### The two conditions the question compares\n\n**(1) Stratumwise generation.** For every $\\lambda\\in\\Lambda_X^+$ the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, with $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../appendix/def-generation.html). It is said to hold *at $\\lambda$* when the displayed generation holds for that one $\\lambda$.\n\n**(2) Support-cutting.** For every $\\lambda\\in\\Lambda_X^+$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\n\n$$\ni_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\ \\in\\ \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} ,\n$$\n\nand it is said to hold *at $\\lambda$* when this holds for that one $\\lambda$ and every $\\mathcal{F}$.\n\n## Problem statement\n\nFor $X$ in the standing class, granted **(H1)**–**(H3)**, decide whether either of the two conditions implies the other:\n\n$$\n\\textbf{(1)}\\ \\Longrightarrow\\ \\textbf{(2)}\\ ? \\qquad\\qquad \\textbf{(2)}\\ \\Longrightarrow\\ \\textbf{(1)}\\ ?\n$$\n\nA positive answer in the first direction collapses [Q1](../Q1/index.html)'s criterion to *equality $\\Longleftrightarrow$ stratumwise generation*; a positive answer in the second collapses it to *equality $\\Longleftrightarrow$ support-cutting*. A negative answer in either direction is a **separating instance**: an $X$ in the standing class together with a $\\lambda\\in\\Lambda_X^+$ at which one condition holds and the other fails. An abstract stratified situation satisfying the package, or an $X$ outside the standing class, answers strictly less and is recorded as answering less.\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$ at one stratum, or an instance. Four are on record, each stated in full in the node named.\n\nConditions **sufficient** for a separation at $\\lambda$: vanishing of every Hecke costalk at $\\lambda$ gives **(2)** there without **(1)** — [Q4-L1](Q4-L1/index.html); a screening subcategory at $\\lambda$ makes the two mutually exclusive there, so that **(1)** forces the failure of **(2)** — [Q4-L3](Q4-L3/index.html).\n\nA reformulation **necessary and sufficient** for each condition separately, and not a condition on $X$: through the reached subcategory $\\mathcal{R}_\\lambda$, condition **(1)** at $\\lambda$ says $\\mathcal{R}_\\lambda$ is the whole stratum category and condition **(2)** at $\\lambda$ says $i_{\\lambda!}\\mathcal{R}_\\lambda$ lands in the Satake subcategory — [Q4-L2](Q4-L2/index.html).\n\nThe position of **(2)** relative to [Q2](../Q2/index.html): granted **(1)** at $\\lambda$, condition **(2)** at $\\lambda$ is **necessary and sufficient** for the membership [Q2](../Q2/index.html) asks at $\\lambda$, and without **(1)** it is strictly weaker — [Q4-L4](Q4-L4/index.html).\n\nA full answer settles both directions for the standing class, by a proof or by a separating instance with $X$ in the class. Failing that, the question takes the two mechanisms together with the instances that realise them, and says how far outside the class those instances sit.\n\n## Conjecture\n\n*(v1 — 2026-08-08.)* **Neither implication holds, and the criterion of [Q1-L5](../Q1/Q1-L5/index.html) is irredundant.** The two conditions are demands of different kinds on the Satake subcategory — that it *surject* onto each stratum, and that it be *closed* under the projectors $i_{\\lambda!}i_\\lambda^!$ — and by [Q4-L2](Q4-L2/index.html) the only thing that ties them together is the size of $\\mathcal{R}_\\lambda$, which nothing in **(H1)**–**(H3)** controls.\n\n**(2) does not imply (1),** by [Q4-L1](Q4-L1/index.html): at a stratum no Hecke translate reaches, **(2)** is asked of nothing and holds, while **(1)** demands that the stratum category be zero, which it is not. The mechanism is realised geometrically at $X = \\mathrm{GL}_2/\\mathrm{O}_2$ ([Q4-e3](Q4-e3/index.html)) and abstractly at a split family ([Q4-e1](Q4-e1/index.html)). The prediction is that inside the standing class this half disappears — for homogeneous $X$ a connected generic stabilizer should leave no obstruction to $LG$ acting transitively on $LX$, so no stratum is unreached — and that it disappears for that reason rather than because the two conditions coincide.\n\n**(1) does not imply (2),** by [Q4-L3](Q4-L3/index.html): if every Hecke translate is $!$-extended from the complement of a closed stratum while its costalk there is nonzero, then **(1)** can hold at every stratum and **(2)** must fail at that one. This is the half expected to survive inside the standing class, and it is the half least secure: the instance on record is abstract ([Q4-e2](Q4-e2/index.html)) and no $X$ carrying a screen is known.\n\n**What the answer buys.** If both halves stand, [Q1](../Q1/index.html) checks two clauses and not one, and [Q2](../Q2/index.html)'s membership is strictly stronger than **(2)** at exactly the strata where **(1)** fails — [Q4-L4](Q4-L4/index.html) — so the two questions coincide precisely on the stratumwise-generating part of $LX$.\n\n## Pipeline\n\nThe next five actions, ranked by what each buys this question's confidence. Authored, not derived: which missing fact clears a defect is a judgement no gate can compute. Each row names the operator, its target and the record it reads; the site prints the target's current status and confidence beside it.\n\nQ4 is the youngest question and nothing in it is proved, so the ranking is by which node the rest of the argument is stated through.\n\n- **1.** `/prove Q4-L2` · [Q4-L2](Q4-L2/index.html) — a `ready` leaf, and the hinge: both halves of the Conjecture are stated through the reached subcategory $\\mathcal{R}_\\lambda$ it introduces, and [Q4-L3](Q4-L3/index.html) and [Q4-L4](Q4-L4/index.html) both depend on it.\n- **2.** `/prove Q4-L1` · [Q4-L1](Q4-L1/index.html) — a `ready` leaf carrying the whole of the **(2)** $\\nRightarrow$ **(1)** direction. It is the cheaper of the two halves because an unreached stratum makes **(2)** vacuous, and vacuity needs no geometry.\n- **3.** `/examples Q4-L3` · [Q4-L3](Q4-L3/index.html) — the **(1)** $\\nRightarrow$ **(2)** half is the one expected to survive inside the standing class and the one least secure: the only instance on record is abstract, and no $X$ carrying a screen is known. A literature pass decides whether the node is provable before a prover spends a round on it.\n- **4.** `/prove Q4-L3` · [Q4-L3](Q4-L3/index.html) — with row 1 proved and row 3 reporting, this closes the second half and with it the Conjecture's claim that the criterion of [Q1-L5](../Q1/Q1-L5/index.html) is irredundant.\n- **5.** `/prove Q4-L4` · [Q4-L4](Q4-L4/index.html) — it settles where [Q2](../Q2/index.html)'s membership and clause **(2)** are the same question, which is the only thing this question owes the other two beyond the irredundancy answer itself.\n";</script>
