e instance sits at the class boundary and shows only that the mechanism is geometric, not that it survives the hypotheses [Q4](../../../dag.html) stands under.\n- **2026-08-08 — the computation is not new here.** The discriminant obstruction is [Q2-e3-L3](../../Q2/Q2-e3/Q2-e3-L3/index.html), written there against [Q2](../../../dag.html)'s membership; this node reads the same three facts — component decomposition, even shift, nonzero stratum — against the pair of conditions of [Q1-L5](../../Q1/Q1-L5/index.html), where they say something different, namely that the two conditions come apart. Nothing is imported: [ADR 0039](../../../process/decisions/0039-one-graph-for-every-question.html) forbids the dependency, so the facts are restated and are this node's own to defend.\n- **2026-08-08 — what would upgrade it.** An $X$ with connected generic stabilizer and a component of $LX$ that the Hecke action cannot reach, or a proof that no such $X$ exists. The second is what [Q4](../../../dag.html)'s conjecture bets against for the homogeneous case and is the first thing `/examples` should look for in print: over $F = k((t))$ with $k$ algebraically closed, the vanishing of Galois cohomology for connected stabilizers is the fact that would settle it, and no appendix entry carries it.\n";</script>
