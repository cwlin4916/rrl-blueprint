fies nothing about the standing class.\n- **2026-08-08 — why a product, and why it can only do this one direction.** In a product with the projection family condition **(2)** is automatic: for $s = (s_\\alpha)_\\alpha$ the endomorphism that is the identity in the $\\beta$-th coordinate and zero elsewhere has cofibre the complementary tuple, so every coordinate piece of $s$ already lies in $\\langle S\\rangle_{\\mathcal{C}}$. That is why the split model separates the conditions in one direction and can never separate them in the other, and it is what forces the glued model of [Q4-e2](../Q4-e2/index.html).\n";</script>
