<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q4-e1</a><i>›</i><span>prompt</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q4-e1 — self-contained prompt</h1><p class="lead">A generated, portable problem packet: canonical statement, question context, direct prerequisites, all required appendix vocabulary and source records. It is a readout, not a citable input.</p><div id="doc"></div></main><script>const SRC = "<!-- GENERATED by tools/build_dag_site.py from <id>_node.md, main_dag.md, the appendix entry files, direct prerequisite node files, and refs.bib. Do not edit by hand. This file is a non-citable readout, not a new source of mathematical facts. -->\n\n# Q4-e1 — self-contained prompt: A split family in which support-cutting holds and stratumwise generation fails\n\n## Task\n\nVerify the example and explain precisely which hypotheses and conclusions it realizes. Do not weaken the conclusion, strengthen the hypotheses, or change notation. Use only what is reproduced below and standard mathematics; if an essential step needs anything else, write `GAP:` and name it.\n\n## Setting\n\n**Question.** [Q4: Do stratumwise generation and support-cutting imply one another?](../../../dag.html)\n\n**Standing setting.** $k$ is algebraically closed of characteristic $0$, $G$ is connected reductive, $K = L^{+}G$, and $X$ is a smooth affine spherical $G$-variety satisfying [the three standing hypotheses](../../../appendix/assum-intro.html)(a)–(c) and [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html). This is the standing class of [context](../../../context.html) and of [Q1](../../Q1/index.html).\n\nOrbits $LX_\\lambda$ are indexed by [$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html), closures [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html) are taken reduced, and the embeddings factor as $i_\\lambda = \\overline{i}_\\lambda\\circ j_\\lambda$, all as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html); $LX$ carries the $K$-placid presentation of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html). The renormalized category $\\mathcal{D}^{\\mathrm{ren}}(-) = \\mathrm{Ind}\\,\\mathcal{D}_c(-)$ is [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html), the Satake subcategory is [the Satake subcategories](../../../appendix/def-satake-subcategory.html), the basic object is [$\\mathrm{IC}_0$](../../../appendix/ic-0.html), and the action is [the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html).\n\n### The recollement package, in force throughout\n\nNothing here proves it. [Q3](../../Q3/index.html) asks for which $X$ it holds and states it canonically; it is repeated in full because Q4's nodes spend its clauses one at a time and each says at the point of use which it spends.\n\n**(H1) Each stratum is a recollement.** For every $\\lambda\\in\\Lambda_X^+$, $!$-restriction to the stratum is continuous and admits a fully faithful continuous left adjoint:\n\n$$\ni_\\lambda^!\\colon\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\longrightarrow\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda), \\qquad i_{\\lambda!}\\ \\dashv\\ i_\\lambda^! .\n$$\n\n**(H2) The orbit closures present the whole category.** $!$-restriction along the closed embeddings $\\overline{i}_\\mu$ identifies\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)\\ \\simeq\\ \\varprojlim_{\\mu\\in\\Lambda_X^+}\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right),\n$$\n\nthe transition functors being $!$-restriction along $\\overline{LX}_\\mu\\subseteq\\overline{LX}_{\\mu'}$.\n\n**(H3) Strata are jointly conservative on one closure.** For every $\\mu$, the family $\\left\\{i_{\\lambda,\\overline{LX}_\\mu}^!\\right\\}_{LX_\\lambda\\subseteq\\overline{LX}_\\mu}$ of restrictions to the strata of that one closure is jointly conservative on $\\mathcal{D}^{\\mathrm{ren}}\\left(K\\backslash\\overline{LX}_\\mu\\right)$.\n\n### The two conditions the question compares\n\n**(1) Stratumwise generation.** For every $\\lambda\\in\\Lambda_X^+$ the objects $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)$, with $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, generate $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html). It is said to hold *at $\\lambda$* when the displayed generation holds for that one $\\lambda$.\n\n**(2) Support-cutting.** For every $\\lambda\\in\\Lambda_X^+$ and every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$,\n\n$$\ni_{\\lambda!}\\, i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\ \\in\\ \\left\\langle \\mathcal{F}'\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}'\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} ,\n$$\n\nand it is said to hold *at $\\lambda$* when this holds for that one $\\lambda$ and every $\\mathcal{F}$.\n\n**Repository problem.** For $X$ in the standing class, granted **(H1)**–**(H3)**, decide whether either of the two conditions implies the other:\n\n$$\n\\textbf{(1)}\\ \\Longrightarrow\\ \\textbf{(2)}\\ ? \\qquad\\qquad \\textbf{(2)}\\ \\Longrightarrow\\ \\textbf{(1)}\\ ?\n$$\n\nA positive answer in the first direction collapses [Q1](../../Q1/index.html)'s criterion to *equality $\\Longleftrightarrow$ stratumwise generation*; a positive answer in the second collapses it to *equality $\\Longleftrightarrow$ support-cutting*. A negative answer in either direction is a **separating instance**: an $X$ in the standing class together with a $\\lambda\\in\\Lambda_X^+$ at which one condition holds and the other fails. An abstract stratified situation satisfying the package, or an $X$ outside the standing class, answers strictly less and is recorded as answering less.\n\n**What counts as an answer.** A condition on the orbit geometry of $LX$ at one stratum, or an instance. Four are on record, each stated in full in the node named.\n\nConditions **sufficient** for a separation at $\\lambda$: vanishing of every Hecke costalk at $\\lambda$ gives **(2)** there without **(1)** — [Q4-L1](../Q4-L1/index.html); a screening subcategory at $\\lambda$ makes the two mutually exclusive there, so that **(1)** forces the failure of **(2)** — [Q4-L3](../Q4-L3/index.html).\n\nA reformulation **necessary and sufficient** for each condition separately, and not a condition on $X$: through the reached subcategory $\\mathcal{R}_\\lambda$, condition **(1)** at $\\lambda$ says $\\mathcal{R}_\\lambda$ is the whole stratum category and condition **(2)** at $\\lambda$ says $i_{\\lambda!}\\mathcal{R}_\\lambda$ lands in the Satake subcategory — [Q4-L2](../Q4-L2/index.html).\n\nThe position of **(2)** relative to [Q2](../../Q2/index.html): granted **(1)** at $\\lambda$, condition **(2)** at $\\lambda$ is **necessary and sufficient** for the membership [Q2](../../Q2/index.html) asks at $\\lambda$, and without **(1)** it is strictly weaker — [Q4-L4](../Q4-L4/index.html).\n\nA full answer settles both directions for the standing class, by a proof or by a separating instance with $X$ in the class. Failing that, the question takes the two mechanisms together with the instances that realise them, and says how far outside the class those instances sit.\n\n**Where this sits.** This node is a concrete instance and illustrates rather than justifies the argument. It corroborates the question [Q4](../../../dag.html).\n\n**Latest entry of the node’s own history.**\n\n- **2026-08-08 — why a product, and why it can only do this one direction.** In a product with the projection family condition **(2)** is automatic: for $s = (s_\\alpha)_\\alpha$ the endomorphism that is the identity in the $\\beta$-th coordinate and zero elsewhere has cofibre the complementary tuple, so every coordinate piece of $s$ already lies in $\\langle S\\rangle_{\\mathcal{C}}$. That is why the split model separates the conditions in one direction and can never separate them in the other, and it is what forces the glued model of [Q4-e2](../Q4-e2/index.html).\n\n## Target statement\n\n**Polarity: negative**, for the implication *support-cutting $\\Rightarrow$ stratumwise generation*. The instance satisfies the recollement package in the abstract form it takes when the geometry is stripped away, and refutes the implication there.\n\n**The claim being instantiated.** From [Q4-L1](../Q4-L1/index.html), quoted so that this node stands on its own: *if $i_\\lambda^!\\left(\\mathcal{F}\\ast\\mathrm{IC}_0\\right)\\simeq 0$ for every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ and $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)\\neq 0$, then condition (2) of [Q4](../../../dag.html) holds at $\\lambda$ and condition (1) fails at $\\lambda$.*\n\n**The dictionary.** Under the correspondence $\\mathcal{C}\\leftrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, $\\alpha\\in A\\leftrightarrow\\lambda\\in\\Lambda_X^+$, $\\mathcal{C}_\\alpha\\leftrightarrow\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX_\\lambda)$, $r_\\alpha\\leftrightarrow i_\\lambda^!$, $e_\\alpha\\leftrightarrow i_{\\lambda!}$ and $S\\leftrightarrow\\left\\{\\mathcal{F}\\ast\\mathrm{IC}_0\\right\\}_{\\mathcal{F}}$, hypothesis (H1) of [Q4](../../../dag.html) becomes a coreflective family and hypotheses (H2)–(H3) become joint conservativity of $\\{r_\\alpha\\}_\\alpha$ — the package of [Q1-L5-z1](../../Q1/Q1-L5/Q1-L5-z1/index.html), whose clauses (A), (B) and (C) the three verifications below are the verifications of.\n\n**The instance.** Take $\\mathcal{C} := \\mathrm{Vect}\\times\\mathrm{Vect}$ with $\\mathrm{Vect}$ as in [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html), take $A := \\{1,2\\}$ and $\\mathcal{C}_1 = \\mathcal{C}_2 := \\mathrm{Vect}$, take $r_1, r_2$ to be the two projections and $e_1(V) := (V,0)$, $e_2(V) := (0,V)$, and take the one-element set\n\n$$\nS\\ :=\\ \\left\\{\\,(k,0)\\,\\right\\} .\n$$\n\n**(A) The family is coreflective.** Each $r_\\alpha$ preserves colimits, each $e_\\alpha$ preserves colimits and is fully faithful, and $e_\\alpha\\dashv r_\\alpha$ with unit an equivalence $\\mathrm{id}_{\\mathrm{Vect}}\\simeq r_\\alpha e_\\alpha$.\n\n**(B) The family is jointly conservative.** An object $(V_1,V_2)$ with $r_1(V_1,V_2)\\simeq 0$ and $r_2(V_1,V_2)\\simeq 0$ is zero.\n\n**(C) The ambient is presentable and stable.** $\\mathcal{C}$ is stable by clause (2) of [functor categories and products of stable categories are stable](../../../appendix/bb-ha-functor-stable.html), and presentable because a product is a small limit and clause (1) of [Colimits of presentable categories, and the subcategory generated by a small set](../../../appendix/bb-prl-colimits.html) computes small limits of presentable categories in $\\widehat{\\mathrm{Cat}}_\\infty$; $\\mathrm{Vect}$ itself lies in $\\mathrm{Pr}^L$ ([presentable categories](../../../appendix/conv-prl.html)).\n\n**(D) What the two conditions do here.** $r_2 s\\simeq 0$ for the unique $s\\in S$, so $e_2 r_2 s\\simeq 0$ lies in $\\langle S\\rangle_{\\mathcal{C}}$ and $e_1 r_1 s\\simeq s$ does too, whence condition (2) holds at both members; whereas $\\langle r_2 s\\rangle_{\\mathcal{C}_2} = 0\\neq\\mathrm{Vect}$ in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), so condition (1) fails at the second member.\n\n**What it does not reach.** There is no spherical variety, no loop space, no orbit stratification and no Hecke action in the instance, so it refutes the implication for the *package* and leaves open whether any $X$ in the standing class has a stratum no Hecke translate reaches; that question is what [Q4-e3](../Q4-e3/index.html) takes up, and answers only outside the standing class.\n\n## Direct prerequisites\n\nThis node has no DAG prerequisites; it is a leaf obligation.\n\n## Definitions and standing inputs\n\nReproduced from the canonical [appendix](../../../appendix/index.html); their attributions, hypotheses and caveats are part of the prompt, and the copy is not a second authority. Entries this node did not declare are here to decode the ones it did, and are given without their notes.\n\n### [the three standing hypotheses](../../../appendix/assum-intro.html) — `assum:intro`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Assumption** (main.tex:105). Let $X$ be a smooth affine spherical $G$-variety. We assume:\n\n**(a)** the colimit of $L^+G$-orbit closures in $LX$ gives rise to a presentation of $LX$ as an $L^+G$-placid ind-scheme;\n\n**(b)** $LX$ admits a dimension theory in the sense of [[raskin_dmodules_infinite_var](../../../../papers/raskin_dmodules_infinite_var.pdf)];\n\n**(c)** the unramified local relative Langlands conjecture [unramified conjecture, de Rham setting](../../../appendix/conj-intro.html) holds for $X$.\n\n### [presentable categories](../../../appendix/conv-prl.html) — `Pr^L`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:243–249). $(\\mathrm{Pr}^L,\\otimes,\\mathrm{Ani})$ is the subcategory of $\\widehat{\\mathrm{Cat}}_\\infty$ spanned by presentable $\\infty$-categories and colimit-preserving functors, with the symmetric monoidal structure of [[HA, §4.8.1](../../../../papers/HA.pdf)] and unit $\\mathrm{Ani}$. $\\mathrm{Pr}^L_{\\mathrm{st}}\\hookrightarrow\\mathrm{Pr}^L$ is the full subcategory of presentable stable categories, whose induced structure is lax monoidal [[HA, Prop. 4.8.2.18](../../../../papers/HA.pdf)].\n\n### [Colimits of presentable categories, and the subcategory generated by a small set](../../../appendix/bb-prl-colimits.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[HTT, Prop. 5.5.3.13 and Thm. 5.5.3.18](../../../../papers/HTT.pdf)]; [[HA, Thm. 1.1.4.4, Prop. 1.1.4.6 and Prop. 1.4.4.11](../../../../papers/HA.pdf)]; external, no main.tex label). Write $\\mathrm{Pr}^L$ as in [presentable categories](../../../appendix/conv-prl.html), $\\mathrm{Pr}^R$ for the $\\infty$-category of presentable $\\infty$-categories and accessible limit-preserving functors, and $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty$ for the $\\infty$-category of small stable $\\infty$-categories and exact functors. Then:\n\n**(1) Limits of presentables** *([[HTT, Prop. 5.5.3.13](../../../../papers/HTT.pdf)], p. 470)*. The $\\infty$-category $\\mathrm{Pr}^L$ admits all small limits, and the inclusion functor $\\mathrm{Pr}^L\\subseteq\\widehat{\\mathrm{Cat}}_\\infty$ preserves all small limits.\n\n**(2) Colimits of presentables** *([[HTT, Thm. 5.5.3.18](../../../../papers/HTT.pdf)], p. 472)*. The $\\infty$-category $\\mathrm{Pr}^R$ admits small limits, and the inclusion functor $\\mathrm{Pr}^R\\subseteq\\widehat{\\mathrm{Cat}}_\\infty$ preserves small limits. The source states its purpose on p. 470: proving the analogue of (1) for $\\mathrm{Pr}^R$ \"will show that $\\mathrm{Pr}^L$ is equipped with all small *colimits* as well as all small limits\", the passage between the two being by right adjoints. So a small colimit in $\\mathrm{Pr}^L$ exists and is computed in $\\widehat{\\mathrm{Cat}}_\\infty$ as the limit of the diagram of right adjoints.\n\n**(3) Limits and filtered colimits of stable categories** *([[HA, Thm. 1.1.4.4 and Prop. 1.1.4.6](../../../../papers/HA.pdf)], p. 35)*. The $\\infty$-category $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty$ admits small limits, and the inclusion $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty\\subseteq\\mathrm{Cat}_\\infty$ preserves small limits. The $\\infty$-category $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty$ admits small filtered colimits, and the inclusion $\\mathrm{Cat}^{\\mathrm{Ex}}_\\infty\\subseteq\\mathrm{Cat}_\\infty$ preserves small filtered colimits.\n\n**(4) The subcategory generated by a small set** *([[HA, Prop. 1.4.4.11](../../../../papers/HA.pdf)], p. 160)*. Let $\\mathcal{C}$ be a presentable stable $\\infty$-category.\n\n1. If $\\mathcal{C}'\\subseteq\\mathcal{C}$ is a full subcategory which is presentable, closed under small colimits, and closed under extensions, then there exists a t-structure on $\\mathcal{C}$ such that $\\mathcal{C}' = \\mathcal{C}_{\\ge 0}$.\n2. Let $\\{X_\\alpha\\}$ be a small collection of objects of $\\mathcal{C}$, and let $\\mathcal{C}'$ be the smallest full subcategory of $\\mathcal{C}$ which contains each $X_\\alpha$ and is closed under extensions and small colimits. Then $\\mathcal{C}'$ is presentable.\n\n- **hypotheses:** for (1) and (2), nothing beyond presentability — the diagrams are small and indexed arbitrarily. For (3), the objects are **small** stable categories: a node applying it to large ones (as every category in this blueprint is) works in $\\widehat{\\mathrm{Cat}}_\\infty$ and supplies the size bookkeeping itself. For (4), $\\mathcal{C}$ presentable *and* stable, and the collection $\\{X_\\alpha\\}$ genuinely **small**.\n- **note:** **What (4)(2) generates is not $\\langle-\\rangle_{\\mathcal{C}}$.** The subcategory Lurie produces is the smallest one closed under *extensions and small colimits*, which is the connective half of a t-structure by (4)(1) and is in general strictly smaller than the $\\langle X_\\alpha\\rangle_{\\mathcal{C}}$ of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), that being the smallest *cocomplete stable* subcategory and so closed under desuspension as well. Passing from one to the other — by feeding the small collection $\\{X_\\alpha[-n] \\mid n\\ge 0\\}$ to (4)(2), or by exhausting $\\langle X_\\alpha\\rangle_{\\mathcal{C}}$ by the shifts of the connective piece — is the citing node's own work, not part of what this entry licenses.\n- **note:** **\"$\\mathrm{Pr}^L_{\\mathrm{st}}$ is closed under small colimits in $\\mathrm{Pr}^L$\" is not printed as a numbered result in either source.** It is the combination of (2) with (3): a colimit in $\\mathrm{Pr}^L$ is the limit in $\\widehat{\\mathrm{Cat}}_\\infty$ of the right adjoints, the right adjoint of a colimit-preserving functor between stable presentables is exact, and a limit of stable categories along exact functors is stable. The entry records the three ingredients separately, each as printed, so that a node making the combination says that it is making it.\n- **note:** *Provenance, verified on the page.* Read in `papers/HTT.pdf` and `papers/HA.pdf` on 2026-08-06: HTT Prop. 5.5.3.13 and the paragraph of purpose are on printed p. 470, HTT Thm. 5.5.3.18 on p. 472; HA Thm. 1.1.4.4 and Prop. 1.1.4.6 are both on printed p. 35, HA Prop. 1.4.4.11 on p. 160 with the proof of its part (2) deferred to p. 161. Both bib keys, `HTT` and `HA`, are present in `refs.bib`.\n\n### [functor categories and products of stable categories are stable](../../../appendix/bb-ha-functor-stable.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[HA, Prop. 1.1.3.1 and Prop. 1.1.4.3](../../../../papers/HA.pdf)]; external, no main.tex label).\n\n**(1) Functor categories** *([[HA, Prop. 1.1.3.1](../../../../papers/HA.pdf)], printed p. 30)*. Let $\\mathcal{C}$ be a stable $\\infty$-category, and let $K$ be a simplicial set. Then the $\\infty$-category $\\mathrm{Fun}(K,\\mathcal{C})$ is stable. The source's proof is one sentence: *\"This follows immediately from the fact that fibers and cofibers in $\\mathrm{Fun}(K,\\mathcal{C})$ can be computed pointwise (Proposition HTT.5.1.2.2).\"*\n\n**(2) Products** *([[HA, Prop. 1.1.4.3](../../../../papers/HA.pdf)], printed p. 34)*. Let $\\{\\mathcal{C}_\\alpha\\}_{\\alpha\\in A}$ be a collection of stable $\\infty$-categories. Then the product\n\n$$\n\\mathcal{C} = \\prod_{\\alpha\\in A}\\mathcal{C}_\\alpha\n$$\n\nis stable. Moreover, for any stable $\\infty$-category $\\mathcal{D}$, a functor $F\\colon\\mathcal{D}\\rightarrow\\mathcal{C}$ is exact if and only if each of the compositions $\\mathcal{D}\\xrightarrow{F}\\mathcal{C}\\rightarrow\\mathcal{C}_\\alpha$ is an exact functor. The source's proof is again one sentence: *\"This follows immediately from the fact that limits and colimits in $\\mathcal{C}$ are computed pointwise.\"*\n\n- **hypotheses:** for (1), $\\mathcal{C}$ stable and $K$ an arbitrary simplicial set — no smallness of $K$, no presentability of $\\mathcal{C}$, and no hypothesis on $\\mathcal{C}$ beyond stability. For (2), each $\\mathcal{C}_\\alpha$ stable, with the index set $A$ arbitrary.\n- **note:** **Neither clause supplies presentability, and for a functor category this appendix cannot.** That $\\mathrm{Fun}(K,\\mathcal{C})$ is presentable when $K$ is small and $\\mathcal{C}$ is presentable is [[HTT, Prop. 5.5.3.6](../../../../papers/HTT.pdf)], and the key `HTT` has **no entry in `refs.bib`** — a gap recorded in the \"Known gaps\" section of [`papers/guideline.md`](../../../papers/guideline.html) — so no entry here may carry it. A node needing a functor category to be presentable owes that hypothesis and must say so at the point of use. For a **product** the situation is different and presentability is available: a product is a small limit, and clause (1) of [Colimits of presentable categories, and the subcategory generated by a small set](../../../appendix/bb-prl-colimits.html) states that $\\mathrm{Pr}^L$ admits all small limits with the inclusion $\\mathrm{Pr}^L\\subseteq\\widehat{\\mathrm{Cat}}_\\infty$ preserving them, so a product of presentable categories, formed in $\\widehat{\\mathrm{Cat}}_\\infty$, is presentable.\n- **note:** **What the two clauses are for.** Clause (1) is what makes the arrow category $\\mathrm{Fun}(\\Delta^1,\\mathcal{C})$ — the smallest category carrying a genuinely glued two-member coreflective family, as against a split one — available as a model; clause (2) is what makes a product available as the split model against which the glued one is contrasted. Colimits in both are computed pointwise, which is the same sentence the source's two proofs use, so cocompleteness of either transfers from $\\mathcal{C}$ without further citation.\n- **note:** *Provenance.* Read in `papers/HA.pdf` on 2026-08-08. In that file the printed page number and the PDF page number coincide: Prop. 1.1.3.1 is on p. 30, in §1.1.3 *Closure Properties of Stable $\\infty$-Categories*, and Prop. 1.1.4.3 on p. 34, in §1.1.4 *Exact Functors*. The bib key `HA` is present in `refs.bib`.\n\n### [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) — $k$-linear categories\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:249–258). For $R$ an $\\mathbb{E}_\\infty$-ring spectrum, $\\mathrm{LMod}_R\\in\\mathrm{CAlg}(\\mathrm{Pr}^L)$ and $\\mathrm{LinCat}_R := \\mathrm{LMod}_{\\mathrm{LMod}_R}(\\mathrm{Pr}^L)$ is the $\\infty$-category of $R$-linear categories. Following [[GR17vol1](../../../../papers/GR17vol1.pdf)] we write\n\n$$\n\\mathrm{DGCat} := \\mathrm{LinCat}_k, \\qquad \\mathrm{Vect} := \\mathrm{LMod}_k,\n$$\n\nthe latter being the unit object.\n\n### [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) — `def:generation`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** ([[GR17vol1, Def. 5.4.1 and Prop. 5.4.5](../../../../papers/GR17vol1.pdf)]; main.tex:502). Let $\\mathcal{C}\\in\\widehat{\\mathrm{Cat}}_\\infty$ and let $\\{c_\\alpha\\}$ be a collection of objects of $\\mathcal{C}$. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ denotes the smallest cocomplete stable subcategory of $\\mathcal{C}$ containing all $c_\\alpha$. The ambient is written as a subscript in every use; see the Notation section of [context](../../../context.html).\n\n**The orthogonality criterion.** Assume in addition that $\\mathcal{C}$ is **presentable**. Then $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ if and only if\n\n$$\n\\operatorname{Map}_{\\mathcal{C}}(c_\\alpha[-i], c) = 0, \\ \\ \\forall\\alpha, \\ \\forall i\\ge 0 \\implies c = 0 ,\n$$\n\nwhere $[-i]$ denotes the shift functor on $\\mathcal{C}$, i.e. the $i$-fold loop functor $\\Omega^i$ — so the display tests non-positive shifts alone.\n\n**Which half consumes the hypothesis.** The minimality description of the first paragraph *is* the definition of $\\langle-\\rangle_{\\mathcal{C}}$ and carries no hypothesis beyond the colimits it names: a node that forms $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ and appeals to its being the *smallest* cocomplete stable subcategory containing the $c_\\alpha$ spends nothing. Presentability is spent by the criterion, and there by one direction only — *orthogonality $\\Rightarrow$ generation*, the direction that concludes $\\langle c_\\alpha\\rangle_{\\mathcal{C}} = \\mathcal{C}$ from the displayed vanishing. The converse direction is free of it.\n\n- **hypotheses:** for the minimality description, none beyond $\\mathcal{C}$ admitting the colimits involved. For the criterion in the direction *orthogonality $\\Rightarrow$ generation*, $\\mathcal{C}$ **presentable** — a node invoking it in a $\\mathcal{C}$ merely assumed stable and cocomplete owes the presentability, or must argue the direction by hand. Every ambient of [`DGCat`, `Vect`](../../../appendix/conv-dgcat.html) is presentable, so a node working there discharges this by naming the ambient.\n- **note:** *the ambient $\\mathcal{C}$ is part of the data and main.tex does not name it at the point of use, which is why the blueprint writes it as a subscript everywhere.* See the ratification recorded at [the Satake subcategories](../../../appendix/def-satake-subcategory.html) and in [Q1-L1](../../Q1/Q1-L1/index.html): for Satake subcategories the generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$. \"Cocomplete stable\" is strictly stronger than \"thick\"; $\\langle-\\rangle_{\\mathcal{C}}$ is closed under arbitrary colimits, not merely finite ones and retracts.\n- **note:** **Where the presentability comes from, verified on the page.** GR's standing convention is footnote 8 to §5.1.5 of [[GR17vol1](../../../../papers/GR17vol1.pdf)] (printed p. 51, PDF p. 88), attached to the sentence defining \"cocomplete\": *\"When talking about cocomplete categories we will always assume that they are presentable.\"* So GR's \"cocomplete stable category\" means \"presentable stable category\", and §5.4.1 opens \"Let $\\mathbf{C}$ be an object of $1\\text{-Cat}^{\\mathrm{St,cocmpl}}$\". The convention is load-bearing rather than decorative: the printed proof of Prop. 5.4.5 (p. 55, PDF p. 92) forms the smallest cocomplete stable full subcategory $\\mathbf{C}'\\subseteq\\mathbf{C}$ and continues *\"The inclusion $\\iota\\colon\\mathbf{C}'\\to\\mathbf{C}$ admits an (a priori non-continuous) right adjoint\"*, which is the Adjoint Functor Theorem in GR's form: Thm. 2.5.4(a) (printed p. 32, PDF p. 69), *\"Any morphism in $1\\text{-Cat}_{\\mathrm{Prs}}$, viewed as a functor between $(\\infty,1)$-categories, admits a right adjoint\"*, stated there for **presentable** categories. Footnote 3 of that page, hanging off §2.5.1 where $1\\text{-Cat}_{\\mathrm{Prs}}$ is introduced, says presentability *\"is necessary for the Adjoint Functor Theorem to hold\"* and adds that they *\"will omit the adjective 'presentable' even when it should properly be there\"*. It is that right adjoint the proof uses to pass from the vanishing to $\\mathbf{C}'=\\mathbf{C}$, so the hypothesis is consumed exactly in the direction *orthogonality $\\Rightarrow$ generation*.\n- **note:** **Why the converse direction is free.** *Generation $\\Rightarrow$ orthogonality* needs only minimality: by [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html), applied with $\\mathcal{D}=\\mathcal{C}$, $T=\\{c_\\alpha\\}$ and $M=c$, the displayed vanishing puts every $c_\\alpha$ in ${}^{\\perp_{\\mathcal{C}}}c$, hence puts $\\langle c_\\alpha\\rangle_{\\mathcal{C}}$ there; if that is all of $\\mathcal{C}$ then $c\\in{}^{\\perp_{\\mathcal{C}}}c$, so $\\operatorname{Map}_{\\mathcal{C}}(c,c)=0$ and $c=0$. No presentability, and no circularity — that entry invokes this one through the minimality description alone.\n- **note:** **Two discrepancies with the printed sources, and the readings in force.** (a) The attribution is to both numbers because the entry carries both halves: the display is verbatim [[GR17vol1, Def. 5.4.1](../../../../papers/GR17vol1.pdf)], which is GR's *definition* of \"generate\", while the biconditional with the smallest-subcategory description is [[GR17vol1, Prop. 5.4.5](../../../../papers/GR17vol1.pdf)] (\"A collection $\\{c_\\alpha\\}$ of objects generates $\\mathbf{C}$ if and only if $\\mathbf{C}$ does not properly contain a cocomplete stable subcategory that contains all $c_\\alpha$\"). (b) main.tex:511–513 prints the vanishing as \"$\\forall i\\ge 0$\" with no quantifier on $\\alpha$; GR print \"$\\forall\\alpha$, $\\forall i=0,1,\\dots$\", and the reading in force is GR's, restored in the display above. GR write the vanishing itself as $\\mathrm{Maps}_{\\mathbf{C}}(c_\\alpha[-i],c)=\\ast$ in Def. 5.4.1 and as $=0$ inside the proof of Prop. 5.4.5, main.tex writing $=0$; by [`Ani`, `Map`, `underline-Map`](../../../appendix/conv-anima.html) the value is an anima, and both notations say that it is contractible. What is *not* settled by notation is the **range of shifts**: this display tests $i\\ge 0$ only, so an argument needing closure under all of $\\mathbb{Z}$ must reconcile the two ranges, which is clause (1) of [${}^{\\perp_{\\mathcal{D}}}M$ is cocomplete stable](../../../appendix/left-orthogonal-closure.html).\n\n### [the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html) — `def:renormalized`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:794, unlabelled in the source; cited by line). For $\\mathcal{Y}$ a prestack, the *renormalized* category of $\\mathcal{D}$-modules is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(\\mathcal{Y}) := \\mathrm{Ind}\\left(\\mathcal{D}_c(\\mathcal{Y})\\right).\n$$\n\n### [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html) — `thm:chen_Ti`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Theorem** ([[chenyi_2025singularitiesorbitclosuresloop, Thm. 36 for (a) and Prop. 39 for (b)](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]; main.tex:772). Let $X$ be a smooth affine spherical $G$-variety, with orbits and embeddings as in [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) and closures as in [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$](../../../appendix/def-orbit-closure.html).\n\n**(a) Placidity of the closures and finite presentation of the embeddings, over the open-$G$-orbit range** (the source's Theorem 36, quantified as its proof quantifies it).\n\nWrite $\\mathring{X}\\subseteq X$ for the open $G$-orbit and $L\\mathring{X}\\subseteq LX$ for its loop space, and set\n\n$$\n\\Lambda_X^{+,\\circ} := \\{\\lambda\\in\\Lambda_X^+ \\mid LX_\\lambda\\subseteq L\\mathring{X}\\},\\qquad W_{X,\\mathrm{ext}}^{\\circ} := \\{v\\in W_{X,\\mathrm{ext}} \\mid \\mathcal{O}_v\\subseteq L\\mathring{X}\\},\n$$\n\nthe indices ([$\\Lambda_X^+$](../../../appendix/not-lambda-x-plus.html)) whose stratum consists of loops landing in the open $G$-orbit. When $X$ is homogeneous — in particular when $X$ is symmetric, the setting of §5 of the source — one has $\\mathring{X} = X$, and these are all of $\\Lambda_X^+$ and all of $W_{X,\\mathrm{ext}}$. Then, for indices $v,v'\\in W_{X,\\mathrm{ext}}^{\\circ}$ and $\\lambda,\\lambda'\\in\\Lambda_X^{+,\\circ}$:\n\n1. The orbit closures $\\overline{\\mathcal{O}}_v$, respectively $\\overline{LX}_\\lambda$, are irreducible placid schemes ([placidity](../../../appendix/placid-ind-scheme.html)), and the closed embeddings $\\overline{i}_v\\colon\\overline{\\mathcal{O}}_v\\rightarrow LX$, respectively $\\overline{i}_\\lambda\\colon\\overline{LX}_\\lambda\\rightarrow LX$, are finitely presented.\n2. The open embeddings $j_v\\colon\\mathcal{O}_v\\rightarrow\\overline{\\mathcal{O}}_v$, respectively $j_\\lambda\\colon LX_\\lambda\\rightarrow\\overline{LX}_\\lambda$, and the closed embeddings $\\overline{\\mathcal{O}}_v\\rightarrow\\overline{\\mathcal{O}}_{v'}$ for $v\\le v'$, respectively $\\overline{LX}_\\lambda\\rightarrow\\overline{LX}_{\\lambda'}$ for $\\lambda\\le\\lambda'$, are finitely presented.\n\nNothing is asserted at an index outside $\\Lambda_X^{+,\\circ}$ or $W_{X,\\mathrm{ext}}^{\\circ}$, and such indices exist exactly when $X$ is not homogeneous.\n\n**(b) The presentations** (the source's Proposition 39, deduced there from (a) together with the filtered structure of its §5.3). The presentations\n\n$$\nLX = \\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda, \\qquad LX = \\varinjlim_{v\\in W_{X,\\mathrm{ext}}}\\overline{\\mathcal{O}}_v\n$$\n\nmake $LX$ an $L^+G$-placid, respectively $I$-placid, ind-scheme.\n\n- **hypotheses:** $X$ smooth affine spherical — but the two clauses do not stand on the same ground, and each is qualified along two independent axes, the *variety class* and the *index range*. A node must say which clause it uses, and at which indices.\n\n  *(a) is general spherical.* Remark 37 of the source (p. 22) states that since [SW22, Lem. 2.3.10] and the source's Theorem 35 — Drinfeld's placidity of loop spaces, the content of [loops, jets and positive loops are placid](../../../appendix/ex-loops-placid.html) — are valid for general spherical varieties, Theorem 36 remains true for them. What this widens is the class of $X$: the remark names two inputs of the proof, and revisits neither the construction of §5.1 nor the quantifier the proof runs over.\n\n  *(a) is over the open-$G$-orbit range only, whatever the class.* Covered on a page of the source: the indices of $\\Lambda_X^{+,\\circ}$ and $W_{X,\\mathrm{ext}}^{\\circ}$, because Lemma 34 (p. 20) describes $LX_\\lambda$ as arcs into the open-$G$-orbit locus $L^+\\mathcal{X}^\\bullet_\\lambda$ of the degeneration, and the proof of Theorem 36 (p. 21) takes the finitely presented locally closed embedding $\\eta_\\lambda$ from that description. Covered on no page: an index whose stratum lies over the boundary $X\\setminus\\mathring{X}$. For homogeneous $X$ — in particular symmetric $X$ — there are no such indices, so the restriction costs nothing there and clause (b), symmetric-only for the reason below, is untouched by it.\n\n  A node invoking (a) at a boundary index is leaning on main.tex:770–772, which asserts the presentations over all of $\\Lambda_X^+$ and $W_{X,\\mathrm{ext}}$, and hence asserts through [placidity](../../../appendix/placid-ind-scheme.html) that every $\\overline{LX}_\\lambda$ is placid and every transition $\\overline{LX}_\\lambda\\hookrightarrow\\overline{LX}_{\\lambda'}$ finitely presented. That leaning is not idle: [Q3-L2](../../Q3/Q3-L2/index.html) states that for $X$ with a $G$-fixed point the closed stratum has $\\overline{i}_{\\lambda_0}$ **not** finitely presented, and [Q1-L3-L4](../../Q1/Q1-L3/Q1-L3-L4/index.html) was refuted at [r1](../../Q1/Q1-L3/Q1-L3-L4/critiques/r1.html) on exactly that computation for $X = \\mathbb{A}^1$ under $G = \\mathbb{G}_m$.\n\n  *(b) was not established for general spherical $X$ by this reading.* The source deduces Prop. 39 from Thm 36 **together with** the filteredness of the closure order (its Lemma 38, p. 22), and Lemma 38 is proved in the symmetric setting: through the restricted coweight lattice $\\Lambda_S$ and the exact sequences (7) of p. 22, which assume $G^\\theta$ connected. Remark 37 extends Theorem 36 and says nothing about Lemma 38. So a node invoking clause (b) for general spherical $X$ is leaning on main.tex:772, which asserts it in that generality, and not on a page of the source; a node invoking it for symmetric $X$ with $G^\\theta$ connected is covered.\n\n### [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html) — `def:orbits_iwahori_spherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:737). Let $X$ be a smooth affine spherical $G$-variety. Let $\\{\\mathcal{O}_v\\}_{v\\in W_{X,\\mathrm{ext}}}$ and $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$ be the posets of $I$-orbits, respectively $L^+G$-orbits, of $LX$, with orbit closures $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$. The embeddings are\n\n$$\ni_v\\colon \\mathcal{O}_v\\xrightarrow{\\ j_v\\ }\\overline{\\mathcal{O}}_v\\xrightarrow{\\ \\overline{i}_v\\ } LX, \\qquad i_\\lambda\\colon LX_\\lambda\\xrightarrow{\\ j_\\lambda\\ }\\overline{LX}_\\lambda\\xrightarrow{\\ \\overline{i}_\\lambda\\ } LX,\n$$\n\nwhere for $\\bullet$ in $W_{X,\\mathrm{ext}}$ or $\\Lambda_X^+$ the maps $j_\\bullet$, $\\overline{i}_\\bullet$, $i_\\bullet = \\overline{i}_\\bullet\\circ j_\\bullet$ are open, closed and locally closed embeddings respectively.\n\n### [$\\overline{LX}_\\lambda$, $\\overline{\\mathcal{O}}_v$ — the orbit closures, taken reduced](../../../appendix/def-orbit-closure.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:748–751, unlabelled — \"Denote their orbit closures to be $\\overline{\\mathcal{O}}_v$ and $\\overline{LX}_\\lambda$ correspondingly\", which fixes no scheme structure; the reading is transcribed from [[chenyi_2025singularitiesorbitclosuresloop, §3.2, p. 10](../../../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)]). For $\\lambda\\in\\Lambda_X^+$, the orbit closure $\\overline{LX}_\\lambda$ is the closure of the stratum $LX_\\lambda$ in $LX$ **with the reduced scheme structure**, and likewise $\\overline{\\mathcal{O}}_v$ is the reduced closure of $\\mathcal{O}_v$ in $LX$. These carry the closed embeddings $\\overline{i}_\\lambda$, $\\overline{i}_v$ of [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html).\n\n### [$\\Lambda_X^+$ — the index poset of spherical orbits](../../../appendix/not-lambda-x-plus.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Notation** (main.tex:734–747, inside [Iwahori and spherical orbits on $LX$](../../../appendix/def-orbits-iwahori-spherical.html)). Let $X$ be a smooth affine spherical $G$-variety. Then $\\Lambda_X^+$ is the partially ordered set indexing the $L^+G$-orbits of $LX$: the spherical strata are $\\{LX_\\lambda\\}_{\\lambda\\in\\Lambda_X^+}$, so choosing $\\lambda\\in\\Lambda_X^+$ is exactly choosing one stratum $LX_\\lambda$.\n\nmain.tex introduces $\\Lambda_X^+$ as an abstract index set. No lattice or monoid structure on it is defined or used; all the pipeline relies on is the indexing itself, together with the closure order carried by the presentation $LX=\\varinjlim_{\\lambda\\in\\Lambda_X^+}\\overline{LX}_\\lambda$ of [orbit closures present $LX$ as a placid ind-scheme](../../../appendix/thm-chen-ti.html).\n\nThe superscript $+$ is explained by the group case (main.tex:747, footnote). For $X = G$ under $G\\times G$, the Cartan decomposition identifies the index set of $L^+G$-orbits, $L^+G\\backslash LG/L^+G$, with the dominant coweights $\\Lambda^+$ — and $W_{X,\\mathrm{ext}}$ likewise recovers the extended affine Weyl group $W_{\\mathrm{ext}}$ indexing $I\\backslash LG/I$.\n\n### [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html) — `def:polarized_hyperspherical`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:875). A *spherical $G$-variety* is a normal $G$-variety $X$ over $k$ with a right $G$-action such that for every Borel $B\\subset G$, $X$ has a Zariski-open $B$-orbit. We further assume\n\n1. $X$ is smooth and affine;\n2. the $B$-stabilizers of points in the open $B$-orbit are connected.\n\nUnder these conditions $M = T^*(2)X$ is a *polarized hyperspherical $G$-variety*, with the weight-$2$ $\\mathbb{G}_m$-action on fibres, in the sense of [[BZSV, §3.5.1](../../../../papers/BZSV.pdf)] (proof: [[BZSV, Prop. 3.7.4](../../../../papers/BZSV.pdf)]). In particular $M$ is a *graded Hamiltonian $G$-variety*.\n\n### [$\\mathrm{IC}_0$ — the unramified basic object](../../../appendix/ic-0.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:79–80, 952–953). $\\mathrm{IC}_0$ is the $!$-extension of the constant $\\mathcal{D}$-module on $L^+G\\backslash L^+X$ to $L^+G\\backslash LX$. The monoidal category $\\mathcal{D}_c(L^+G\\backslash\\mathrm{Gr})$ acts on $\\mathcal{D}_c(L^+G\\backslash LX)$ by convolution from the left, and $\\mathrm{IC}_0$ is the object whose Hecke orbit generates the Satake subcategory. In particular\n\n$$\n\\mathrm{IC}_0\\in\\mathcal{D}_c(L^+G\\backslash LX).\n$$\n\n### [the spherical Hecke action $\\ast$ on $\\mathcal{D}_c(K\\backslash LX)$](../../../appendix/conv-hecke-action.html)\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Convention** (main.tex:922 and main.tex:1096–1102, unlabelled; cite by line). The monoidal structure on the spherical Hecke categories $\\mathcal{H}_K$, $\\mathcal{H}_{c,K} = \\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, $\\mathcal{H}_K^{\\mathrm{ren}}$ of [the standing notation](../../../appendix/subsec-notations.html) is induced by $*$-pullback and $*$-pushforward along the convolution diagram\n\n$$\nK\\backslash\\mathrm{Gr}\\times K\\backslash\\mathrm{Gr}\\ \\xleftarrow{\\ p\\ }\\ K\\backslash LG\\times^{K}\\mathrm{Gr}\\ \\xrightarrow{\\ q\\ }\\ K\\backslash\\mathrm{Gr},\n$$\n\nwhere $p$ exhibits the middle term as a $K$-torsor over the product and $q$ is the ind-proper convolution morphism. The same pull–push along the diagram with the right-hand $\\mathrm{Gr}$ replaced by $LX$ makes $\\mathcal{D}_c(K\\backslash LX)$ a left $\\mathcal{H}_{c,K}$-module ([module categories](../../../appendix/conv-module-categories.html)); this is the action written $\\mathcal{F}\\ast\\mathcal{G}$ in [$\\mathrm{IC}_0$](../../../appendix/ic-0.html) and [the Satake subcategories](../../../appendix/def-satake-subcategory.html). In particular\n\n$$\n\\mathcal{F}\\ast\\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX)\\qquad\\text{for }\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr}),\\ \\mathcal{G}\\in\\mathcal{D}_c(K\\backslash LX),\n$$\n\nand applying $\\mathrm{Ind}$ ([small relative tensor product](../../../appendix/def-small-relative-tensor.html)(2)) extends the action to an $\\mathcal{H}_K^{\\mathrm{ren}}$-module structure on $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$, as used at main.tex:1091.\n\n### [the Satake subcategories](../../../appendix/def-satake-subcategory.html) — `def:satake_subcategory`\n\n[appendix](../../../appendix/index.html) · [DAG index](../../../dag.html) · [context](../../../context.html)\n\n**Definition** (main.tex:917). Let $X$ be as in [untwisted polarized hyperspherical varieties](../../../appendix/def-polarized-hyperspherical.html).\n\n1. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the full subcategory generated, in the sense of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html), by the convolution action ([the spherical Hecke action $\\ast$](../../../appendix/conv-hecke-action.html)) of $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ on $\\mathrm{IC}_0$. The generated subcategory itself — the manuscript's $\\mathrm{Sat}$ superscript carried by the ambient renormalized category ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)) rather than by $\\mathcal{D}_c$ — is\n\n$$\n\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}} := \\left\\langle \\mathcal{F}\\ast\\mathrm{IC}_0 \\ \\middle|\\ \\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})\\right\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)} .\n$$\n\n2. $\\mathcal{D}_c(I\\backslash LX)^{\\mathrm{Sat}}\\subset\\mathcal{D}_c(I\\backslash LX)$ is the full subcategory generated by $\\langle\\mathcal{F}\\ast\\mathrm{IC}_0\\mid\\mathcal{F}\\in\\mathcal{D}_c(I\\backslash\\mathrm{Gr})\\rangle_{\\mathcal{D}^{\\mathrm{ren}}(I\\backslash LX)}$.\n\n**The two spherical symbols name different objects.** $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$ is the *cocomplete* one: a cocomplete stable subcategory of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ ([the renormalized category $\\mathcal{D}^{\\mathrm{ren}}$](../../../appendix/def-renormalized.html)), closed under arbitrary colimits and under retracts, since that is what the generation operation of [the generation operation $\\langle-\\rangle_{\\mathcal{C}}$](../../../appendix/def-generation.html) produces. $\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}}$ is the *small* one: by the ratified reading recorded below it is the intersection\n\n$$\n\\mathcal{D}_c(K\\backslash LX)^{\\mathrm{Sat}} = \\mathcal{D}_c(K\\backslash LX)\\ \\cap\\ \\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}},\n$$\n\nthe coherent objects ([coherent $\\mathcal{D}$-modules](../../../appendix/defn-coherent-d-mod.html)) of $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)^{\\mathrm{Sat}}$. So a statement about one is not a statement about the other: the superscript is the same in both, and it is the category it is attached to — renormalized or coherent — that says which of the two is meant. Neither object is abbreviated: both are written out wherever they occur. The distinction is drawn here for the spherical case of clause 1; clause 2's Iwahori generation is recorded in its small form alone.\n\n## Bibliography\n\nThe `refs.bib` records named above. A source cited without a key is written out verbatim where it appears and is not in the closed world.\n\n```bibtex\n@article{BZSV,\n    author = { David Ben-Zvi and Yiannis Sakellaridis and Akshay Venkatesh },\n    title ={Relative Langlands duality} ,\n    year = {2024}\n}\n\n@misc{chenyi_2025singularitiesorbitclosuresloop,\n      title={Singularities of orbit closures in loop spaces of symmetric varieties},\n      author={Tsao-Hsien Chen and Lingfei Yi},\n      year={2025},\n      eprint={2310.20006},\n      archivePrefix={arXiv},\n      primar
