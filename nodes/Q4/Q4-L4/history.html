ot a dependency.** [ADR 0039](../../../process/decisions/0039-one-graph-for-every-question.html) forbids a node of one question depending on a node of another, so $\\mathbf{(M)}_\\lambda$ is restated here in full rather than imported from [Q2-L1](../../Q2/Q2-L1/index.html)(iii). The relation between the two questions is carried by Q4's **Feeds.** paragraph, and what this node buys Q2 is a licence: at a stratum where **(1)** is known, Q2's question and Q1's clause **(2)** are literally the same question.\n- **2026-08-08 — clause (iii) is where the dependency on [Q4-L1](../Q4-L1/index.html) is spent.** Only the half \"condition **(2)** holds\" is taken from there; the failure of $\\mathbf{(M)}_\\lambda$ is proved here from clause (i) of [Q4-L2](../Q4-L2/index.html), since a nonzero $E$ with $i_{\\lambda!}E$ Satake would put $E\\simeq i_\\lambda^!\\,i_{\\lambda!}E$ inside $\\mathcal{R}_\\lambda = 0$.\n";</script>
