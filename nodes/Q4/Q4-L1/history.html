<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q4-L1</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q4-L1 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q4-L1 — history\n\n[Q4-L1](index.html) · [Q4](../../../dag.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-08 — created** by `/decompose Q4` as the first of the two separation mechanisms the question is cut along. [Q1-L5](../../Q1/Q1-L5/index.html)'s criterion pairs a *generation* demand with a *membership* demand, and the two have visibly different vacuity behaviour: at a stratum no Hecke translate reaches, membership is asked of nothing and generation is asked of everything. This node is that observation made precise and quantified, so that the question of whether **(2)** implies **(1)** reduces to whether such a stratum can occur.\n- **2026-08-08 — why the nonzero-stratum clause is a hypothesis and not a lemma.** Clause **(C)** is what makes (ii) a failure rather than a triviality, and it is not free: it says the stratum is a nonempty piece of $LX$ carrying sheaves. In Q1 it would follow from the identification of the stratum quotient with a classifying stack, but [ADR 0039](../../../process/decisions/0039-one-graph-for-every-question.html) forbids a Q4 node depending on a Q1 node, so the fact is carried here as a declared hypothesis and discharged by whatever instance is put under the node.\n- **2026-08-08 — what clause (iii) buys.** Without it, hypothesis **(B)** looks like a statement about one chosen generating family of the Satake subcategory and invites the objection that a larger family might reach the stratum. Clause (iii) closes that off: the objects killed by $i_\\lambda^!$ form a cocomplete stable subcategory, so **(B)** already says the whole subcategory is killed. That is also the form in which the geometric instances verify it — a support or component obstruction kills every translate at once.\n";</script>
