aimed because the source for it has no `refs.bib` key.\n- **2026-08-08 — why the arrow category and not a product.** A split family cannot separate the conditions this way: the coordinate pieces of any $s$ already lie in $\\langle S\\rangle_{\\mathcal{C}}$, as the second entry of [Q4-e1](../Q4-e1/index.html)'s history records. The arrow category is the smallest ambient carrying a two-member coreflective family that is genuinely glued rather than split, and the gluing is exactly what makes $e_Zr_Zs$ escape $\\langle S\\rangle_{\\mathcal{C}}$.\n- **2026-08-08 — the open literature question this leaves.** Whether a *presentable* model exists is not idle: the geometric ambient always is presentable, so a critic may reasonably ask whether presentability rules screens out. The candidate already in the reading trail is the non-quasi-compact scheme of Drinfeld–Gaitsgory recorded under Q1-L5 in [`papers/guideline.md`](../../../papers/guideline.html), whose category of compact-generated objects is proper and restricts to a non-generating subcategory on an open stratum. Confirming or refuting that reading is the first thing `/examples` should do on this node.\n";</script>
