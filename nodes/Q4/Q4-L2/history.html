8-08 — why clause (i) is worth the line.** As written in [Q1-L5](../../Q1/Q1-L5/index.html), condition **(1)** quantifies over a *chosen* family of objects, the Hecke translates. Clause (i) says the subcategory they reach is the same as the one the whole Satake subcategory reaches, so neither condition is an artefact of the generating family — the same move [Q2-L1](../../Q2/Q2-L1/index.html)(iii) makes on the other side of the adjunction, for the choice of stratum generators.\n- **2026-08-08 — clause (iv) is the scoping remark, kept inside the node.** It says that a separating $X$ must be one for which the answer to [Q1](../../../dag.html) is negative, so no case on the [key-example register](../../../key_examples/index.html) that is positive for Q1 can separate the two conditions. It re-proves the forward half of [Q1-L5](../../Q1/Q1-L5/index.html) rather than importing it, since a Q4 node may not depend on a Q1 node; the re-proof costs two lines and uses only the section $i_\\lambda^!\\,i_{\\lambda!}\\simeq\\mathrm{id}$ of **(A)**.\n";</script>
