<header class="bar"><nav class="crumbs"><a href="../../../dag.html">the DAG</a><i>›</i><a href="../../index.html">nodes</a><i>›</i><a href="index.html">Q4-L3</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Q4-L3 — history</h1><p class="lead">What created this node and everything that has happened to it since, oldest first. Append-only: an entry is never rewritten.</p><div id="doc"></div></main><script>const SRC = "# Q4-L3 — history\n\n[Q4-L3](index.html) · [Q4](../../../dag.html) · [DAG index](../../../dag.html) · [appendix](../../../appendix/index.html) · [context](../../../context.html)\n\nEvery dated entry in this node's life, oldest first: what created it, what each `/prove` round settled, what the literature returned, and every statement revision — each linking the record that forced it.\n\n## History\n\n- **2026-08-08 — created** by `/decompose Q4` as the second separation mechanism, the one running the other way. Its sibling [Q4-L1](../Q4-L1/index.html) makes **(2)** hold and **(1)** fail by emptying the stratum of Hecke translates; this node makes **(1)** hold and **(2)** fail by putting the Hecke translates inside a subcategory that no nonzero $!$-extension from the stratum can enter. The two are the only shapes the abstract dévissage leaves, and they are what the question's conjecture rests on.\n- **2026-08-08 — why the screen is a hypothesis rather than a construction.** In the six-functor picture the intended screen is \"$!$-extended from the open complement of a closed stratum\", and clause (iii) records exactly the properties of $\\overline{i}_\\lambda^*$ that construction needs. Those properties are not in the closed world — hypotheses **(H1)**–**(H3)** give $i_\\lambda^!$ and $i_{\\lambda!}$ and nothing else — so the node takes the screen as data and clause (iii) says what would produce one. That keeps the mechanism provable in one page and pushes the geometry into the instances.\n- **2026-08-08 — clause (iv) records the price.** A screen is incompatible with [Q1](../../../dag.html)'s equality, exactly as clause (iv) of [Q4-L2](../Q4-L2/index.html) says of any separation. So this mechanism can only fire on an $X$ where the Satake subcategory is proper — which is where the interest of Q1 lies, and which is why the mechanism is worth stating rather than dismissing.\n";</script>
