<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>dag</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>DAG — how the claims depend on each other</h1><p class="lead">Generated from <code>blueprint/concepts/dag/dag.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [node](../node/index.html) · [confidence](../confidence/index.html) · [role](../role/index.html) · [the index](../../dag.html)\n\n## In one sentence\n\nEach node lists the nodes its proof is allowed to assume; those edges form a directed acyclic graph, and almost everything the pipeline reports is read off it.\n\n## Why it exists\n\nTwo reasons, and the second is the one people miss.\n\nThe obvious one is **order of work**: a node whose dependencies are all proved can be attempted now; one whose dependencies are not must wait. Without the edges, choosing what to prove next is guesswork.\n\nThe one that matters more is **blast radius**. When something turns out to be false — and things do; see [Q1-L4](../../nodes/Q1/Q1-L4/index.html), whose clause (iv) was refuted in print — the question is immediately \"what else falls?\". With the edges written down, the answer is a graph traversal instead of a judgement call. The same traversal is what lets [confidence](../confidence/index.html) propagate: a doubted node drags down everything resting on it, automatically, whether or not anyone remembered the connection.\n\n## The shape\n\n- **`depends-on:`** — the nodes this one's proof may assume. **`required-by:`** — the transpose. Both are stored, and the gate checks they agree; storing both is redundancy bought deliberately, because each direction is the one you want when reading from that end.\n- **Acyclic**, and checked. A cycle means a node assumes itself, transitively, which is not an argument.\n- **`ready` is never stored.** It is derived: a node is `ready` when every dependency is `proved`. A stored derived field is a field that goes stale, and this one would go stale on every status change.\n\n- **There is no `blocked`** ([ADR 0045](../../process/decisions/0045-there-is-no-blocked-node.html)). An unproved dependency is not a lock. It contributes its *statement*, and a statement is as usable before it is established as after — so every operator runs anywhere in the graph, and what a proof leaning on an unproved dependency owes is to say so. The dependency edge still does its real work: confidence caps a node by the weakest node beneath it, so the argument is scored as what it is.\n- **A proof node may depend only on proof nodes.** Corroboration cannot become load-bearing by accident — see [role](../role/index.html).\n- **Containment is not dependency.** A sub-lemma's directory sits inside its parent's, and an example node's inside the node it illustrates, but the directory nesting is about *where things live*, not about what assumes what. An example node never appears in anyone's `depends-on:`.\n\n## An example\n\nThe [Q1-L2](../../nodes/Q1/Q1-L2/index.html) family is the cleanest instance in the repository.\n\nQ1-L2 claims that three conditions are equivalent. Proving it directly would have been one long argument; instead it was decomposed into four sub-lemmas, and the split is honest about where the content sits:\n\n- [Q1-L2-L1](../../nodes/Q1/Q1-L2/Q1-L2-L1/index.html) — coherent objects are the compacts of $\\mathcal{D}^{\\mathrm{ren}}$. A ready leaf, and the only one with real content.\n- [Q1-L2-L2](../../nodes/Q1/Q1-L2/Q1-L2-L2/index.html) and [Q1-L2-L4](../../nodes/Q1/Q1-L2/Q1-L2-L4/index.html) — two abstract lemmas about compact generation. Ready leaves, provable with no knowledge of the geometry at all.\n- [Q1-L2-L3](../../nodes/Q1/Q1-L2/Q1-L2-L3/index.html) — the hypothesis check: the Hecke family really is small, compact and shift-stable. Depends on L1, and supplies exactly what L2 and L4 consume.\n\nThen Q1-L2 itself is assembly: every hypothesis of the two abstract lemmas discharged verbatim from the sub-lemmas' statements. The graph made the order obvious — the three leaves first, then L3, then the parent — and it makes the exposure obvious too. Q1-L2-L1 sits beneath everything, so its two undisposed referee flaws currently cap the whole family's confidence, including the one node a human has approved.\n\n## In the literature\n\n- **Build systems.** `make`, Bazel, Nix: a DAG of targets, derived readiness, and rebuild-what-changed. The invariant that derived state is never stored comes straight from here.\n- **Proof dependency graphs.** `leanblueprint` renders exactly this graph for a formalization project, colour-coded by whether a node is stated, proved informally, or formalized; the Liquid Tensor Experiment and the polynomial Freiman–Ruzsa project were both run off one.\n- **Argumentation frameworks** (Dung, 1995) study directed graphs of claims with attack and support edges, and ask which sets of claims can stand together. The blueprint uses only support edges, and settles conflict with a referee rather than a semantics — but the propagation intuition is the same.\n- **Critical-path scheduling** is where \"ready\" and \"what is the bottleneck\" come from as a vocabulary. The borrowing stops short of the scheduler's *precedence constraint*: a task that may not start until its predecessor finishes. A lemma has no such constraint, which is what ADR 0045 is about.\n\n## Where it lives\n\n- The edges: `depends-on:` and `required-by:` in each `<id>_node.md`.\n- The index: the generated block in [`main_dag.md`](../../dag.html), between the `BEGIN INDEX` and `END INDEX` markers — never hand-edited.\n- The picture: the generated DAG page, and a local graph on every node page.\n- The rules: [ADR 0007](../../process/decisions/0007-generated-dag-view.html) (the generated view), [ADR 0024](../../process/decisions/0024-one-graph-with-side-branched-corroboration.html) (one graph, corroboration on side branches), [ADR 0026](../../process/decisions/0026-sub-lemma-families-fold-into-their-parent.html) (families fold into the parent).\n- The gate: `tools/build_dag_site.py --check` verifies the transpose, the acyclicity and the index block.\n";</script>
