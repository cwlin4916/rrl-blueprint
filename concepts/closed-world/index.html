<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>closed-world</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Closed world — the list of what a proof may use</h1><p class="lead">Generated from <code>blueprint/concepts/closed-world/closed-world.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [node](../node/index.html) · [appendix](../appendix/index.html) · [gate](../gate/index.html) · [appendix of objects](../../appendix/index.html)\n\n## In one sentence\n\nBefore a proof is written, the things it is allowed to invoke are listed; anything not on the list may not be used, however true it is.\n\n## The name is borrowed, and the borrowing is imperfect\n\n\"Closed world\" here does **not** mean Reiter's closed-world assumption from database logic, where anything not provable is taken to be *false*. Nothing in this repository infers falsity from absence. It means the narrower and more boring thing:\n\n> **A whitelist.** A proof of node $v$ may invoke exactly three things: the entries of [`blueprint/appendix/`](../../appendix/index.html) that $v$ declares in its `objects:` field, the nodes in $v$'s `depends-on:` list, and standard mathematics that needs no citation. Nothing else — not a theorem the prover remembers, not a paper in `papers/`, not another node's proof, not an [example](../../../blueprint/nodes), not a page in `process/`.\n\nIf you find that confusing, the useful mental model is not logic but **access control**: each node is granted a set of capabilities, and the gate refuses a proof that reached outside its grant. \"Closed\" describes the *world the prover works in*, not a policy about negation.\n\n## Why it exists\n\nBecause the prover is a language model, and the characteristic failure of a language model doing mathematics is not a wrong deduction — it is a **fluent citation of something that does not exist**, or of something real that does not say what it was claimed to say. That failure is invisible on the page: the sentence reads like every other sentence.\n\nA whitelist makes it visible. If a proof may only cite what is written out in full in one file, then a hallucinated reference is not a subtle error of judgement; it is a name that is not in the file, and a mechanical check finds it. The cost is real and deliberate: when a proof genuinely needs something new, the answer is to **write the appendix entry** — stating the result in full, with its hypotheses and its source — not to argue that the result is well known. Every widening is therefore a visible, dated, reviewable act.\n\nThere is a second effect that turned out to matter as much. Writing the entry forces someone to decide *what exactly is being assumed*. Several of this repository's real findings came out of that step rather than out of any proof.\n\n## The shape\n\nThree layers, and it is worth keeping them apart:\n\n1. **What is in force everywhere** — the setting, standing hypotheses and ratified readings of [`context.md`](../../context.html). Every node inherits these.\n2. **What this node may invoke** — its `objects:` line, a list of links into [`blueprint/appendix/`](../../appendix/index.html), plus its `depends-on:` nodes. This is per-node, and it is the part that is checked.\n3. **What needs no citation** — standard mathematics. Deliberately not enumerated; the critic's judgement decides, and a dispute is settled by adding an entry.\n\nTwo rules keep the layers from leaking:\n\n- **Objects are linked, never named.** No file under `blueprint/` outside `blueprint/appendix/` may write a bare label like [orbit closures present $LX$ as a placid ind-scheme](../../appendix/thm-chen-ti.html); every mention is a link into the entry. A bare label is a claim that a reader knows what it says; a link is a claim that they can go and read it.\n- **Widening is an act, not a slip.** Only the lead-researcher adds an appendix entry or extends a node's `objects:`. A prover who needs more says so and stops.\n\n## An example\n\n[Q1-L2-L1](../../nodes/Q1/Q1-L2/Q1-L2-L1/index.html) was drafted, refereed, and **failed** on round 1 — not for a mathematical error. The draft used exactness of the test pullbacks $f^!$, which is true, standard, and used correctly. But the entry that says so, [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../../appendix/conv-d-shriek-d-star.html), was not in the node's `objects:` line. The referee's verdict was FAIL on closed-world grounds alone.\n\nWhat happened next is the process working as designed: the lead-researcher checked that the entry really does say what the draft needed, widened `objects:` by that one entry, and the round-2 referee verified the disposal rather than taking it on trust. Read it in [`critiques/r1.md`](../../nodes/Q1/Q1-L2/Q1-L2-L1/critiques/r1.html) and [`r2.md`](../../nodes/Q1/Q1-L2/Q1-L2-L1/critiques/r2.html).\n\nA second example shows the rule catching something subtler. [Q1-L2-L3](../../nodes/Q1/Q1-L2/Q1-L2-L3/index.html)'s proof rested on $\\mathrm{IC}_0$ lying in $\\mathcal{D}_c(K\\backslash LX)$ — a genuine geometric finiteness statement. No entry asserted it; the draft reconstructed it from the *grammar* of two entries that presupposed it. The referee let the draft pass but recorded the defect, and the fix was to make [the entry](../../appendix/ic-0.html) say it outright, with its source. The fact did not change. What changed is that it is now on the list, so a proof cites it instead of inferring it.\n\n## In the literature\n\n- **Proof assistants** work exactly this way and always have: in Lean, Coq or Isabelle, a theorem may refer only to declarations already in the environment, and there is no mechanism for \"as is well known\". The appendix is this repository's environment, and it is maintained by hand because the objects are $\\infty$-categorical and no assistant has them.\n- **Reiter, *On Closed World Data Bases* (1978)** is the source of the phrase and, as above, not of the meaning. Worth reading precisely so the two do not get conflated.\n- **Capability-based security** — Dennis and Van Horn's 1966 supervisor design, and the object-capability line after it — is the closer formal analogue: authority is an explicit, unforgeable grant rather than an ambient permission, and the whole point is that reaching outside the grant is detectable.\n- **Retrieval-grounded generation** in the LLM literature attacks the same failure from the other side: constrain a model to answer from supplied documents. The difference is what happens on a miss. Grounded generation degrades — the model answers anyway, from memory. Here a miss is a hard FAIL, which is the only reason the guarantee is worth anything.\n- **Hilbert-style formal systems** are the ancestor of the idea that a proof is a finite object over a *fixed, listed* set of axioms, and that the list being finite and explicit is what makes checking mechanical.\n\n## Where it lives\n\n- The list itself: [`blueprint/appendix/`](../../appendix/index.html) — see [appendix](../appendix/index.html).\n- The per-node grant: the `objects:` field of each `<id>_node.md` — see [node](../node/index.html).\n- The rules: the Guardrails section of [`CLAUDE.md`](../../../CLAUDE.md) (\"The appendix is the closed world\", \"Objects are linked, never named\").\n- The gate: `python3 tools/check_render.py` resolves every link and anchor; `tools/build_dag_site.py --check` reports dangling objects. The referee checks the rest by reading — see [gate](../gate/index.html).\n";</script>
