<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>role</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Role — what a node is for</h1><p class="lead">Generated from <code>blueprint/concepts/role/role.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [node](../node/index.html) · [DAG](../dag/index.html) · [confidence](../confidence/index.html)\n\n## In one sentence\n\nEvery node declares whether it is part of the argument or merely supports believing it, and the two are never allowed to mix.\n\n## Why it exists\n\nA worked example is genuinely useful: it shows a statement is not vacuous, that its hypotheses are load-bearing, that the notation means what you think. What it cannot do is discharge an obligation in a proof — and the danger is that, sitting in the same tree, looking like the same kind of object, it eventually does. Somebody cites the example as a step, nobody notices, and the argument now rests on an illustration.\n\nDeclaring the role makes the distinction structural instead of a matter of care. A `proof` node may depend only on `proof` nodes, so corroboration cannot become load-bearing even by accident, and the tallies that say how much of the argument is done range over the proof chain alone.\n\n## The shape\n\nFive values, set by the lead-researcher at creation and changed only by the user:\n\n| role | what it is | may the argument rest on it? |\n|---|---|---|\n| `proof` | a claim the argument needs | **yes** — this is the argument |\n| `evidence` | something that supports believing a claim | no |\n| `example` | a concrete instance making a claim vivid | no |\n| `analogy` | the same phenomenon in a neighbouring setting | no |\n| `thought` | exploration, not yet a claim | no — `/prove` refuses it |\n\nTwo consequences:\n\n- **Ids say the role.** An example or analogy node's id ends in a terminal `-e<k>` or `-a<k>` segment: `Q1-e1` at question level, `Q1-L5-e1` inside the lemma it illustrates.\n- **Containment without dependency.** An `e`/`a` node lives inside the directory of the node it illustrates, and is drawn as a dashed side branch on that node's local graph — but it appears in nobody's `depends-on:`, and the parent does not list it in `required-by:`. It is *about* the node; it is not *under* it.\n\nThe companion rule: **examples illustrate, never justify.** `examples.md` is outside the closed world. And an example with no verifiable source is worse than no example — when the literature search comes back empty, `/examples` writes a self-contained question under the node's `prompts/` rather than inventing an instance.\n\n## An example\n\n[Q1-a1](../../nodes/Q1/Q1-a1/index.html) is the case that shows why the separation earns its keep.\n\nIt is an **analogy** node: the function-theoretic shadow of Q1's question, asking whether the basic vector generates the unramified Hecke module $C_c^\\infty(X(F))^K$. Running `/examples` on it found that Sakellaridis answered the question in print in 2009 — and answered it **negatively** for a specific $X$, where the basic vector generates a proper submodule and no single vector generates.\n\nNow: that is a genuine counterexample, in print, verified against the paper. If Q1-a1 were a `proof` node, it would be a refutation sitting inside the argument. It is not, because the analogy is over functions and the conjecture is over categories: BZSV's generation is under colimits in a cocomplete category, and the function-theoretic statement is module generation. The two are compatible, and the update record for that node [says so explicitly](../../nodes/Q1/Q1-a1/updates/u1.html) rather than letting the reader infer it.\n\nSo the finding does what corroboration should: it moves the node's literature channel to `counterexample`, turns its card red, and warns anyone reading Q1 that the naive form of the statement is false — without touching the confidence of a single proof node.\n\n## In the literature\n\n- **Lakatos, *Proofs and Refutations* (1976)** is the text on this exact boundary: the dialectic of a conjecture, its monsters and its exception-barring, and the difference between an example that refines a statement and one that refutes it. The `example`/`analogy` layer is where the monsters are kept.\n- **Pólya's *Mathematics and Plausible Reasoning* (1954)** is the systematic treatment of evidence that raises belief without being proof — analogy, specialization, verification of consequences — which is precisely the set of things these roles name.\n- **Typed dependency edges** in argumentation and in provenance models (PROV-O's distinction between derivation and attribution) make the same move: an edge's *kind* determines what may flow along it.\n- The practical ancestor is the **test suite versus the proof** distinction in verified software: tests raise confidence, are kept beside the code, and are never a lemma.\n\n## Where it lives\n\n- The field: `role:` in each `<id>_node.md`.\n- The rules: [ADR 0015](../../process/decisions/0015-every-node-declares-its-role.html) (every node declares its role), [ADR 0018](../../process/decisions/0018-example-and-analogy-nodes.html) (example and analogy nodes), [ADR 0021](../../process/decisions/0021-example-and-analogy-nodes-nest.html) (they nest), [ADR 0024](../../process/decisions/0024-one-graph-with-side-branched-corroboration.html) (drawn as side branches).\n- The gate: `tools/build_dag_site.py --check` fails a `proof` node that depends on a non-`proof` node, and the tallies aggregate over the proof chain alone.\n";</script>
