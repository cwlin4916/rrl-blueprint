<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>history</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>History — how a statement got to be the way it is</h1><p class="lead">Generated from <code>blueprint/concepts/history/history.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [node](../node/index.html) · [operator](../operator/index.html) · [confidence](../confidence/index.html)\n\n## In one sentence\n\nEvery node carries a dated, append-only list of everything that has happened to it, and no entry is ever rewritten.\n\n## Why it exists\n\nThe state of a node answers \"what does it claim now\". It cannot answer \"why does it claim that\", and that second question is the one that matters when a statement looks odd, when a proof seems to prove something adjacent to what was asked, or when someone wants to know whether an objection was considered and dismissed or simply never raised.\n\nBefore this existed, the story of a node was scattered across four places — a free-form remark, the `updates/` seams, the critique rounds and the build journal — and no page assembled it. Reconstructing it meant reading git. Now the node's own page answers it.\n\nThe append-only rule is what makes it evidence rather than narrative. A record that can be tidied is a record that will be tidied, and what gets tidied away is exactly the embarrassing part: the wrong turn, the withdrawn clause, the round that failed. Those are the parts with information in them. A past entry is corrected by a **new** entry, never by editing the old one.\n\n## The shape\n\n`<id>_history.md`, dated bullets, oldest first:\n\n```\n- **YYYY-MM-DD — <event>** <why, linking the primary record>\n```\n\n- **The first entry is always the creation**: which operator cut the node out, and why it exists.\n- **Entries link the record, never restate it** — a revision entry cites its `updates/u<k>.md`, a proof entry its `critiques/r<k>.md`, an evidence entry its `examples.md`, a schema change its ADR.\n- **Events are the node's identity and statement life**: creation, statement revisions, role or id changes, decompositions, relocations, proof outcomes, evidence swings.\n- **Standing commentary lives inside the entry it belongs to**, not in a section of its own. This is why there is no `## Remark`.\n- **Outside the closed world.** No proof may cite a history entry, exactly as for `examples.md`. If a proof needs a reading that a history entry records, the reading belongs in the [appendix](../appendix/index.html) and the proof cites it there.\n\nThe same append-only discipline governs `critiques/r<n>.md` and `updates/u<n>.md`. Critique numbering **never restarts**: a node re-opened and re-proved continues at the next free round, so the directory shows how it reached its current state rather than only where it ended.\n\n## An example\n\n[Q1-L2-L3](../../nodes/Q1-L2/Q1-L2-L3/history.html) — six entries, and the shape of them is the argument for the mechanism:\n\n- **2026-08-03 — created** by `/decompose`, as the concrete half of the Q1-L2 expansion.\n- **2026-08-04 — relocated** inside its parent's directory under [ADR 0012](../../process/decisions/0012-sub-lemmas-nest-in-their-parent.html).\n- **2026-08-04 — proved** in one round.\n- **2026-08-05 — statement revised**, linking [`updates/u1.md`](../../../blueprint/nodes/Q1-L2/Q1-L2-L3/updates/u1.md): a clause had been asserting something *different in shape* from what its two consumers take as a hypothesis.\n- **2026-08-05 — re-proved** at [r2](../../nodes/Q1-L2/Q1-L2-L3/critiques/r2.html), six steps down to three, with the three flaws standing from r1 disposed at source.\n- **2026-08-05 — `human: approved`.**\n\nNote what is still there. Round 1 is not deleted, though its draft was superseded; its three flaws are still counted against the node by the confidence derivation, and r2 had to dispose of them explicitly rather than inherit a clean slate. And the entry recording the approval also records what still limits the node — the dependency beneath it — so the reader is not left to infer that approval settled everything.\n\n## In the literature\n\n- **Event sourcing** and the **append-only log** (Kleppmann, *Designing Data-Intensive Applications*) are the engineering form: state is a fold over an immutable sequence, and the sequence, not the state, is the source of truth.\n- **Version control** is the obvious ancestor, and the obvious question is why not just use git. The answer is granularity and audience: git records *file* changes with commit messages aimed at a developer, while this records *claim* changes with entries aimed at a mathematician, and the two do not line up — one commit often touches five nodes, and one statement revision often spans several commits.\n- **Laboratory notebooks**, and the regulated version of them (GLP, FDA 21 CFR Part 11), enforce the same rule for the same reason: entries are dated, corrections are additive, and an erasure is itself the finding.\n- **Architecture decision records** (Michael Nygard, 2011) apply the pattern one level up, to the repository rather than the node — which is what [`process/decisions/`](../../../process/decisions) is.\n- **Lakatos** again: *Proofs and Refutations* is, in form, the history of one statement's revisions, and its argument is that the revisions *are* the mathematics rather than noise on the way to it.\n\n## Where it lives\n\n- The files: `<id>_history.md` in every node directory; `updates/u<n>.md` and `critiques/r<n>.md` beside them.\n- One level up: [`process/journal.md`](../../process/journal.html) for the repository's own history, and [`process/decisions/`](../../../process/decisions) for the choices that would be expensive to reverse.\n- The rules: [ADR 0027](../../process/decisions/0027-a-node-carries-its-history.html) (a node carries its history), [ADR 0019](../../process/decisions/0019-the-update-operator.html) (`updates/`), [ADR 0009](../../process/decisions/0009-one-tree-per-kind.html) (critiques are an audit trail and are never rewritten).\n- The gate: `tools/build_dag_site.py --check` requires a `created:` date on every node; the test suite walks the histories and fails an undisclosed statement edit.\n";</script>
