<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>appendix</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Appendix — where the closed world is kept</h1><p class="lead">Generated from <code>blueprint/concepts/appendix/appendix.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [closed world](../closed-world/index.html) · [node](../node/index.html) · [the appendix itself](../../appendix/index.html)\n\n## In one sentence\n\nOne file holding every mathematical object the pipeline may invoke, each stated in full, so that a proof can link to a statement instead of asserting one.\n\n## Why it exists\n\nBecause the alternative — a table of names — does not carry hypotheses. A row reading \"`thm:chen_Ti` — orbit closures are normal\" tells a prover the name of a theorem and nothing about when it applies, which is exactly the information a proof needs and exactly the information a fluent draft will invent. So: **no tables of mathematical objects**. An object gets a full entry or it is not available.\n\nThe second reason is drift. If a result is restated wherever it is used, the copies diverge, and the divergence is silent. One authority, linked from everywhere, cannot diverge from itself.\n\n## The shape\n\nEntries are grouped by subject in the order `main.tex` introduces them. Each is:\n\n```\n### <a id=\"<anchor>\"></a> `<main.tex label>` — <short title>\n\n**<Kind>** (<attribution>; main.tex:<line>).  <the full statement>\n\n- **role:** definition | convention | black box | proved in main.tex | external\n- **hypotheses:** <what must be checked at each use>   # black boxes only\n- **used by:** <the nodes that cite it>\n- **note:** <caveats, ratified readings, warnings>\n```\n\nThe **anchor** is the label lowercased with `:` and `_` mapped to `-`, so `thm:chen_Ti` becomes `thm-chen-ti`. Headings carry maths and backticks and do not slugify predictably, so the explicit `<a id=\"…\"></a>` is mandatory.\n\nThe **role** field is the one that decides how freely a prover may lean on the entry: `black box` means usable without reproof *subject to the stated hypotheses*; `standing hypothesis` is in force for every node; a `definition` fixes what a symbol means and nothing more.\n\nThe **note** field is where a *ratified reading* is recorded — a place where `main.tex` is ambiguous and the blueprint has fixed one meaning. A ratified reading binds every node, and changing one invalidates the proofs downstream of it.\n\n## An example\n\n[`def:satake_subcategory`](../../appendix/def-satake-subcategory.html) is the entry that earned the whole mechanism.\n\nThe manuscript defines the Satake subcategory as the subcategory *generated by* the Hecke orbit of $\\mathrm{IC}_0$ — but the generation operation of [`def:generation`](../../appendix/def-generation.html) takes its ambient cocomplete category as part of its data, and `main.tex` names no ambient at the point of use. Since $\\mathcal{D}_c$ is itself small and not cocomplete, the definition as printed does not determine a subcategory.\n\nThis was found by a referee in round 2 of [Q1-L1](../../nodes/Q1-L1/index.html), not by anyone reading the manuscript. The prover had silently picked a reading; the critic caught that the choice was unjustified rather than wrong. The entry now carries the ratified reading — generation is formed inside $\\mathcal{D}^{\\mathrm{ren}}$ — with the line of `main.tex` that forces it, and [ADR 0001](../../process/decisions/0001-satake-generation-ambient-category.html) records the decision. Every downstream node presupposes it.\n\nThat is the appendix doing its job: an ambiguity that was invisible in prose became a required field that somebody had to fill in.\n\n## In the literature\n\n- **Lean's `Mathlib`** is the same object at a different scale: a single curated library of stated results, where using something means naming a declaration that exists. The appendix is a hand-maintained `Mathlib` of about seventy entries, restricted to what one paper needs.\n- **`leanblueprint`** (Massot) keeps the analogous role for informal blueprints, with `\\uses{}` pointing at labelled statements rather than at prose.\n- **Literate programming** (Knuth) is the older instance of the same discipline — one authority for each definition, referenced from wherever it is needed, never copied.\n- **The \"well known\" problem** is discussed in the formalization literature as the main cost of formalizing published mathematics: papers routinely invoke results they do not state, and the invocation is where the hypotheses go missing. Requiring an entry converts that cost from a surprise at the end into a decision at the start.\n\n## Where it lives\n\n- [`blueprint/appendix.md`](../../appendix/index.html) — schema in the comment at the top of the file.\n- What is in force globally, as opposed to per node: [`blueprint/context.md`](../../context.html).\n- The rules: [ADR 0003](../../process/decisions/0003-appendix-of-objects.html) (the appendix), [ADR 0008](../../process/decisions/0008-one-page-per-object.html) (one page per object).\n- Write discipline: only the lead-researcher adds an entry. The checker may reformat one; it may never restate one.\n";</script>
