<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>node</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Node — the unit of the argument</h1><p class="lead">Generated from <code>blueprint/concepts/node/node.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [closed world](../closed-world/index.html) · [DAG](../dag/index.html) · [role](../role/index.html) · [history](../history/index.html) · [appendix](../../appendix/index.html)\n\n## In one sentence\n\nA **node** is one mathematical claim, together with everything the repository knows about it, kept in a directory of its own.\n\n## Why it exists\n\nA research argument fails in pieces, not all at once. If the argument is one document, a defect anywhere makes the whole thing suspect and there is no way to say which parts survived. Cutting it into named claims makes failure local: a node can be refuted while its siblings stand, and the damage is exactly the set of nodes downstream of it. Everything else in the blueprint — the [DAG](../dag/index.html), the [gates](../gate/index.html), the [confidence](../confidence/index.html) numbers — is machinery for keeping that locality honest.\n\n## The shape\n\nA node is a **directory** whose name is the node's **id**. Inside it:\n\n| file | who writes it | what it is |\n|---|---|---|\n| `<id>_node.md` | lead-researcher; `/update` for the statement | the fields below, then `## Statement` |\n| `<id>_history.md` | every operator, append-only | dated bullets: how the statement got this way |\n| `<id>_prompt.md` | **generated** — `tools/build_dag_site.py` | the self-contained packet: statement, prerequisites, the appendix vocabulary it needs |\n| `proof.md` | prover | the write-up, at most 900 words |\n| `critiques/r<n>.md` | critic, append-only | referee reports, numbering never restarts |\n| `updates/u<n>.md` | `/update`, append-only | one record per statement revision |\n| `examples.md` | example-finder | what the literature has, with an `EVIDENCE:` verdict |\n| `prompts/*.md` | example-finder | a question to ask elsewhere, when the search came back empty |\n\nThe fields at the top of `<id>_node.md`:\n\n- **type** — `lemma`, `def-check`, and so on: what kind of claim it is.\n- **role** — `proof | evidence | example | analogy | thought`. See [role](../role/index.html).\n- **created** — an ISO date, set once and never changed.\n- **status** — `open | drafted | proved | failing`. `ready` is *not* stored: it is derived from whether the dependencies are proved. There is no `blocked` ([ADR 0045](../../process/decisions/0045-there-is-no-blocked-node.html)).\n- **human** — `approved | endorsed | — | doubted | refuted`. The one field no agent may write.\n- **depends-on** / **required-by** — the [DAG](../dag/index.html) edges, each the transpose of the other.\n- **objects** — the appendix entries this node may invoke. This *is* its [closed world](../closed-world/index.html).\n\n### The id is the path\n\nSplit the id at each `-L`, take the successive prefixes, join with `/`. So `Q1-L2-L1` lives at `blueprint/nodes/Q1/Q1-L2/Q1-L2-L1/` — inside the lemma it refines. A sub-lemma's directory sits **within its parent's**, which is why decomposing a node only ever adds directories and never moves one.\n\nTwo consequences worth knowing before you write a link. Depth varies, so a relative path copied from a neighbouring node will be wrong; work it out from the node's own depth. And a directory contains its children's directories, so a path with a *further* node id in it belongs to a different node.\n\n## An example\n\n[Q1-L2-L3](../../nodes/Q1/Q1-L2/Q1-L2-L3/index.html) — \"The Hecke family is small, compact and shift-stable\". Two `-L`s in the id, so it sits two levels down, at `blueprint/nodes/Q1/Q1-L2/Q1-L2-L3/`. Its directory holds:\n\n- [`Q1-L2-L3_node.md`](../../nodes/Q1/Q1-L2/Q1-L2-L3/index.html) — `status: proved`, `human: approved`, one dependency ([Q1-L2-L1](../../nodes/Q1/Q1-L2/Q1-L2-L1/index.html)), seven appendix objects, and a two-clause statement;\n- [`proof.md`](../../nodes/Q1/Q1-L2/Q1-L2-L3/proof.html) — three paragraphs, 421 words;\n- [`critiques/r1.md`](../../nodes/Q1/Q1-L2/Q1-L2-L3/critiques/r1.html) and [`r2.md`](../../nodes/Q1/Q1-L2/Q1-L2-L3/critiques/r2.html) — two rounds, the second disposing of the three flaws the first raised;\n- [`updates/u1.md`](../../nodes/Q1/Q1-L2/Q1-L2-L3/updates/u1.html) — why the statement was rewritten on 2026-08-05;\n- [`Q1-L2-L3_history.md`](../../nodes/Q1/Q1-L2/Q1-L2-L3/history.html) — six dated bullets, from `/decompose` cutting it out to the user approving it.\n\nOpen the history and the story is legible without git: created, relocated, proved, revised, re-proved, approved.\n\n## In the literature\n\nThe shape is not original, and the ancestors are worth knowing.\n\n- **Formalization blueprints.** Patrick Massot's `leanblueprint`, built for Kevin Buzzard's Liquid Tensor Experiment and Terence Tao's polynomial Freiman–Ruzsa project, is the closest relative: a LaTeX document cut into `\\begin{lemma}` nodes with `\\uses{}` and `\\proves{}` edges, rendered as a colour-coded dependency graph where green means formalized. This repository is the same idea with the target changed — the leaf obligation is a referee's PASS rather than a Lean kernel's, so a node carries a critique trail instead of a proof term.\n- **Thomas Hales' Flyspeck project** ran the pattern at scale on the Kepler conjecture, and produced the observation that survives here: the decomposition *is* the strategy, and a wrong decomposition wastes every proof downstream of it.\n- **Literate and structured proof documents** — Leslie Lamport's *How to Write a 21st Century Proof* argues for hierarchical, numbered, locally-checkable proof steps for exactly the locality reason above.\n- **Issue trackers and build graphs.** The field list is a work-item schema and the dependency edges are a build DAG; `ready` being derived rather than stored is the rule every dependency-driven build system converges on, because a stored derived field is a field that goes stale. Where the analogy breaks is the *blocking*: a build system must not compile against a target that does not exist yet, and a lemma may perfectly well be proved from a statement nobody has established.\n\nNone of this is citable in a proof — see [closed world](../closed-world/index.html).\n\n## Where it lives\n\n- The directories: [`blueprint/nodes/`](../../../blueprint/nodes), indexed in [`main_dag.md`](../../dag.html).\n- The write-up template: [`blueprint/nodes/_template.md`](../../../blueprint/nodes/_template.md).\n- The rules: the Guardrails section of [`CLAUDE.md`](../../../CLAUDE.md); [ADR 0002](../../process/decisions/0002-one-file-per-node.html) (one file per node), [ADR 0005](../../process/decisions/0005-node-directories.html) (a directory), [ADR 0012](../../process/decisions/0012-sub-lemmas-nest-in-their-parent.html) (nesting), [ADR 0027](../../process/decisions/0027-a-node-carries-its-history.html) (history, not remark), [ADR 0032](../../process/decisions/0032-a-nodes-own-file-is-named-for-the-node.html) (a node's file is named for the node).\n- The gate: `python3 tools/build_dag_site.py --check` fails a node whose directory disagrees with its id.\n";</script>
