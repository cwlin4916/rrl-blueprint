<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>operator</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Operator — the commands that change the repository</h1><p class="lead">Generated from <code>blueprint/concepts/operator/operator.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [gate](../gate/index.html) · [node](../node/index.html) · [history](../history/index.html)\n\n## In one sentence\n\nFive commands, each a map from the repository's state to a new state, each with a fixed set of files it is allowed to touch.\n\n## Why it exists\n\nBecause \"an agent works on the repository\" is not a specification, and what is not specified drifts. If any operator may write any file, then who wrote a statement, who decided it was proved, and who judged it are all unanswerable — and those are precisely the questions the audit trail has to answer for the [confidence](../confidence/index.html) number to mean anything.\n\nNaming the commands and fixing their write sets makes the record self-describing. A `VERDICT: PASS` was written by a critic, because nothing else may write one. A `## Statement` changed only under `/update`, because nothing else may change one. This is separation of duties, and the reason for it is the same as everywhere else it is used: an actor that both does the work and certifies it certifies its own work.\n\n## The shape\n\n| command | what it does | what it may write |\n|---|---|---|\n| `/decompose <question>` \\| `<node-id>` | cuts a question into lemma **statements**, or expands one lemma into sub-lemmas | new node directories, appendix entries, `main_dag.md` |\n| `/prove <node-id>` | prover → gate → critic loop, at most two rounds | `proof.md`, `critiques/r<n>.md`, the node's status field |\n| `/examples <node-id>` | researches the literature on one node | `examples.md` with an `EVIDENCE:` verdict, or `prompts/*.md` |\n| `/update [id] [with input …]` | revises statements against the whole repo | `## Statement`, `updates/u<n>.md`, `<id>_history.md`, `priorities.md` |\n| `/research-status` | reports; changes nothing | nothing |\n\nThe discipline that makes them typed:\n\n- **Only the lead-researcher creates node directories and appendix entries.** Only the prover writes `proof.md`. Only the critic writes `critiques/`. Only the `/prove` orchestrator changes a status. Only `/update` revises a `## Statement`. **Only the user writes `human:`.**\n- **Readouts are separated from commands**, because only a command changes what is true. `/research-status`, the site generator and the gates report; they never write a fact.\n- **Every command ends the same way**: the presentation pass, then regenerating the prompts and the site, then the gates. No operation may leave a stale readout behind.\n- **An external passage is a lead, never a source.** `/update` must independently verify a claim before adopting a word of it, and records what it verified, what it refuted, and what it could not check.\n\n## An example\n\nThe best illustration is `/update` refusing to do the obvious thing.\n\nOn 2026-08-04 an `/examples` run on [Q1-L4](../../nodes/Q1-L4/index.html) came back with a source contradicting clause (iv) of the node's statement — a finiteness claim about the support poset. The naive response is to delete the clause. What the operator is required to do instead is: verify the source itself rather than the summary of it, record the defect against the current statement in one sentence, write the old statement verbatim into `updates/u<n>.md` beside the new one, reset the node from `proved` to `open` because a proved statement materially changed, append a dated entry to the node's history, and then re-read every neighbour whose statement cites the revised one.\n\nIt also has to do something less obvious. Where the verified claim was strictly *more general* than the node, the rule is a **new general node with the old one left standing as its specialization** — never a widened statement in place. The proved work under the old statement stays proved, and the record shows a theorem gained rather than a statement quietly moved.\n\nThe whole of that is visible in [`Q1-L4/updates/`](../../../blueprint/nodes/Q1-L4/updates) and the node's history, which is the point: the change is reconstructable without git, and the thing that was withdrawn is still readable.\n\n## In the literature\n\n- **Separation of duties** in auditing and access control is the direct ancestor: the actor who performs a transaction is not the actor who approves it.\n- **Command–query separation** (Meyer) is the readouts-versus-commands rule: an operation either changes state or reports it, never both.\n- **Event sourcing** describes the shape the record takes — state as the fold of an append-only sequence of events, which is what `updates/`, `critiques/` and the histories are.\n- **Typed state machines and refinement.** [`process/operations.md`](../../process/operations.html) states the repository as a dependently-typed schema over the directory tree and each command as a typed map with a domain and a codomain, with laws the state must satisfy after each step; the framing is standard refinement calculus, applied to a filesystem.\n- **Blackboard architectures** (Hearsay-II, 1980) are the older multi-agent pattern: specialist agents that may only write to designated regions of a shared structure. That is nearly exactly the write discipline above.\n\n## Where it lives\n\n- The workflows: [`.claude/skills/`](../../../.claude/skills) — the semantic source of truth — with thin adapters in `.agents/skills/` so Codex runs the same ones.\n- The design: [`process/pipeline.md`](../../process/pipeline.html) (the loop, the agents, the invariants) and [`process/operations.md`](../../process/operations.html) (the formal layer).\n- The rules: the Research protocol and write-discipline paragraphs of [`CLAUDE.md`](../../../CLAUDE.md); [ADR 0019](../../process/decisions/0019-the-update-operator.html), [ADR 0022](../../process/decisions/0022-update-proposes-nodes-from-failures.html), [ADR 0030](../../process/decisions/0030-the-prove-budget-cap.html), [ADR 0031](../../process/decisions/0031-presentation-is-a-stage-not-a-command.html).\n";</script>
