<header class="bar"><nav class="crumbs"><a href="../../index.html">blueprint</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>confidence</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Confidence — how much the record supports a node</h1><p class="lead">Generated from <code>blueprint/concepts/confidence/confidence.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [node](../node/index.html) · [DAG](../dag/index.html) · [gate](../gate/index.html)\n\n## In one sentence\n\nA signed number between $-1$ and $+1$, computed from the audit trail — referee rounds, literature verdicts, human judgement — and stored nowhere.\n\n## Why it exists\n\nBecause `status: proved` is a single bit and the bit lies by omission. A node proved on its first round with nobody looking hard, and a node that survived five rounds and twenty-two disposed objections, both read `proved`. So does a node whose dependency was later refuted.\n\nThe rule that keeps the number honest is that **it is derived, never declared**. There is no `confidence:` field. Nothing may cite the number, and no gate passes or fails on it — it is a reading aid computed *from* the audit trail, so letting it back into the trail would be circular.\n\n## The shape\n\nThree channels, each valued in $[-1,+1]$ or **silent**:\n\n$$\nC(v)\\ =\\ \\min\\left(\\mathrm{cap}(v),\\ \\tfrac{1}{4}H(v) + \\tfrac{1}{2}D(v) + \\tfrac{1}{4}L(v)\\right)\n$$\n\n- **$H$, human judgement (weight 25).** The `human:` field: `approved` $= +1$, `endorsed` $= +\\tfrac12$, `doubted` $= -\\tfrac12$, `refuted` $= -1$, `—` silent. The only field in the repository no agent may write.\n- **$D$, the mathematical record (weight 50).** Derived from the critique rounds, then capped by the weakest node beneath it.\n- **$L$, the literature (weight 25).** From the `EVIDENCE:` line of `examples.md`: `precedent` $= +1$, `instances` $= +\\tfrac12$, `gap` $= -\\tfrac12$, `counterexample` $= -1$.\n\nThree details decide how it behaves:\n\n**A silent channel costs nothing.** Its weight goes unclaimed rather than being renormalized away, so a node nobody has weighed sits at $0$ with an empty card — not at \"doubted\". Absence of evidence and evidence against are different states, which is the entire reason the range is signed.\n\n**$D$ is Baconian, and never reaches 1.** With $e$ flaws eliminated in earlier rounds and $s$ still standing,\n\n$$\nD_{\\mathrm{own}}\\ =\\ \\frac{e+1}{e+s+2},\n$$\n\nso a node that passed its first round with nothing found sits at $\\tfrac12$, and one that eliminated twenty-two objections outscores it. The $+1$ and $+2$ stand for the defeaters nobody has looked for yet. **Certainty is unreachable by construction** — 100% is not a number this scheme can produce from the mathematical channel, and asking for it is asking to change the formula.\n\n**Weakest link.** $D(v)$ is the minimum of $D_{\\mathrm{own}}(v)$ and the *full* confidence $C(u)$ of every dependency $u$. A refuted sub-lemma propagates all the way up.\n\nThe **cap** is 80% until the user writes `human: approved`, at which point it is 100%.\n\n## An example\n\n[Q1-L2-L3](../../nodes/Q1-L2/Q1-L2-L3/index.html), after being approved by the user on 2026-08-05, reads **+39%**. Working it out shows what each channel is doing:\n\n- $H = +1$ — the user approved it, which also lifts the cap from 80% to 100%.\n- Its own record is strong: two rounds, three flaws raised in [r1](../../nodes/Q1-L2/Q1-L2-L3/critiques/r1.html) and all three disposed in [r2](../../nodes/Q1-L2/Q1-L2-L3/critiques/r2.html), so $D_{\\mathrm{own}} = \\tfrac{3+1}{3+0+2} = 0.8$.\n- But it depends on [Q1-L2-L1](../../nodes/Q1-L2/Q1-L2-L1/index.html), which sits at $+29\\%$ — two flaws still standing under its PASS, and no human has judged it. Weakest link: $D = \\min(0.8,\\ 0.29) = 0.29$.\n- $L$ is silent; nobody has run `/examples` on it.\n\n$$\nC = \\min\\left(1.00,\\ 0.25 \\cdot 1 + 0.50 \\cdot 0.29 + 0.25 \\cdot 0\\right) = 0.39 .\n$$\n\nThe reading is exact and slightly uncomfortable, which is the point: approving a node does not make the thing underneath it any better supported. The cheapest way to lift this number is not more approval — it is an `r3` on Q1-L2-L1 disposing of its two standing flaws.\n\n## In the literature\n\n- **Eliminative induction**, from Francis Bacon's *Novum Organum* through **L. Jonathan Cohen's** *The Probable and the Provable* (1977), is the direct source. Cohen's \"Baconian probability\" grades a hypothesis by how many *relevant tests it has survived*, not by a frequency — which is exactly what a referee round is. It also supplies the asymmetry above: passing tests raises support, but never to certainty, because the untried tests are still out there.\n- **Popper's corroboration** carries the same warning against reading a survived test as confirmation.\n- **Dempster–Shafer theory** is the standard formalism for distinguishing \"no evidence\" from \"evidence against\"; the signed-plus-silent design here is a cheap stand-in for its distinction between ignorance and disbelief.\n- **Weakest-link aggregation** is the standard treatment of a chain of inferences in the argumentation literature, and matches the engineering intuition that a system is as reliable as its worst serial component.\n- Deliberately **not** Bayesian: there is no prior anyone could defend for \"is this lemma about loop spaces true\", and a number with a fake prior in it invites exactly the false precision the derived-never-declared rule exists to prevent.\n\n## Where it lives\n\n- The computation: `confidence()` and `support()` in [`tools/build_dag_site.py`](../../../tools/build_dag_site.py).\n- The inputs: `human:` in each `<id>_node.md`, the `**Flaw n**` counts and `VERDICT:` lines in `critiques/`, the `EVIDENCE:` line in `examples.md`.\n- The rules: [ADR 0014](../../process/decisions/0014-confidence-is-three-signed-channels.html), superseding [ADR 0013](../../process/decisions/0013-confidence-is-derived-baconian-and-weakest-link.html).\n- The display: every node card on the generated site, and the repository's own figure on the site home — the weakest proof node in it.\n";</script>
