<header class="bar"><nav class="crumbs"><a href="../../dag.html">the DAG</a><i>›</i><a href="../index.html">concepts</a><i>›</i><span>gate</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="../../dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="../../appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="../../philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="../../todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Gate — the checks that run after every command</h1><p class="lead">Generated from <code>blueprint/concepts/gate/gate.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[concepts](../index.html) · [operator](../operator/index.html) · [closed world](../closed-world/index.html) · [node](../node/index.html)\n\n## In one sentence\n\nA gate is a mechanical check that refuses work which violates a stated rule, so that the rule holds because it is enforced rather than because everyone remembered it.\n\n## Why it exists\n\nEvery rule in this repository was written after something went wrong. That is not incidental — a rule with no failure behind it is decoration, and the way to tell the difference is to ask what the gate would have caught.\n\nThe specific hazard is that the operators are language models. A model asked to follow twenty conventions will follow most of them most of the time, which is exactly the failure mode that produces a repository nobody can trust: mostly consistent, with drift you find six weeks later. The gates are the parts of the discipline that do not depend on anyone's attention.\n\nThe clearest evidence that this is needed is in this repository's own history. A page shipped that did not render, because nothing checked that it rendered. The check exists now.\n\n## The shape\n\n**Invariants** are the rules, numbered, each stating the failure it prevents; they live in [`process/pipeline.md`](../../process/pipeline.html). **Gates** are the programs that enforce the mechanizable ones.\n\n```\npython3 tools/check_render.py           # everything, eight checks\npython3 tools/build_dag_site.py --check # the blueprint half alone\n```\n\n`check_render.py` runs:\n\n1. **markdown math** — every `$…$` and `$$…$$` fragment through KaTeX.\n2. **house macros** — no `.tex`-only macro leaked into a `.md` file.\n3. **math fences** — `$$` blocks balanced and standing alone.\n4. **links** — every relative link and `#anchor` resolves.\n5. **write-ups** — every `proof.md` within the 900-word budget, and no `.tex` under `blueprint/`.\n6. **readouts** — the blueprint self-consistent, every generated prompt and page current, the graph actually running in a DOM.\n7. **the site** — every generated page renders, every internal link lands.\n8. **notation** — every generation bracket names its ambient category as a subscript.\n\nBeyond the programs, two gates are human-shaped and worth naming as gates anyway: the **critic**, which is an adversarial read ending in `VERDICT: PASS` or `FAIL`, and the **content-preservation check** the orchestrator runs itself over the presentation pass — a `git diff` filtered for status fields, verdicts and anchors, where every matching line is a violation and the fix is to revert.\n\nTwo design rules keep gates from rotting:\n\n- **Derived state is never stored**, so it cannot disagree with what it is derived from. `ready` and confidence are computed at build time.\n- **Everything generated is regenerated by every command**, so a stale readout is impossible rather than merely unlikely. Deleting the whole generated tree and rebuilding reproduces it exactly.\n\n## An example\n\nOn 2026-08-03 a blueprint page shipped broken: the maths did not render in a browser. Nothing had lied — every file was correct as a file — but the page a reader would actually open was unusable, and no check looked at it.\n\nThe response was check 1, and then, when that proved insufficient, checks 6 and 7: not \"is the markdown well-formed\" but \"does the *generated page* render, and does every link between generated pages land\". The distinction is the lesson. A gate that checks the source rather than the artefact passes exactly when the artefact is broken in a way the source cannot see.\n\nA second example, from this repository's most recent run, shows the current gap. [Q1-L2-L2](../../nodes/Q1/Q1-L2/Q1-L2-L2/index.html)'s proof cited \"the node's own Remark\" three times — but `## Remark` had been retired months earlier by [ADR 0027](../../process/decisions/0027-a-node-carries-its-history.html), and the content had moved. The *link* resolved, because it pointed at the node file, which exists. The *section* it named did not. Check 4 passed it, because check 4 checks link targets and not prose claims about what is inside them. That one is still uncaught, and it is recorded rather than quietly fixed.\n\n## In the literature\n\n- **Continuous integration** is the parent idea: run the checks on every change, not before release, because a check that runs late is a check whose failures are expensive.\n- **Design by contract** (Meyer, *Eiffel*) supplies the framing of an invariant as a stated property that must hold at every stable point, with a named consequence for violating it.\n- **Linters and type checkers** are the direct analogue for the mechanizable rules — the whole argument for them is that consistency enforced by tooling is cheaper than consistency enforced by review.\n- **The Twelve-Factor App**'s \"dev/prod parity\" is the general form of the artefact-versus-source lesson above: check the thing you ship.\n- **Property-based testing** (QuickCheck) is where \"state the invariant, then have a machine hunt for violations\" comes from as a discipline distinct from writing examples.\n\n## Where it lives\n\n- The programs: [`tools/check_render.py`](../../../tools/check_render.py), [`tools/build_dag_site.py`](../../../tools/build_dag_site.py), `tools/dag_smoke.js`, `tools/site_smoke.js`.\n- The invariants: [`process/pipeline.md`](../../process/pipeline.html).\n- The rules: [ADR 0030](../../process/decisions/0030-the-prove-budget-cap.html) (the round cap), [ADR 0031](../../process/decisions/0031-presentation-is-a-stage-not-a-command.html) (presentation is a stage, gated mechanically).\n- Every command ends by running the gates and regenerating the prompts and the site.\n";</script>
