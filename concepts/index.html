<header class="bar"><nav class="crumbs"><a href="../index.html">blueprint</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost" id="home" href="../dag.html" title="back to the DAG">⌂</a><a class="ghost" id="hub" href="../index.html" title="all pages">☰</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>Concepts — the blueprint in plain terms</h1><p class="lead">Generated from <code>blueprint/concepts/README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[blueprint index](../dag.html) · [appendix of objects](../appendix/index.html) · [context](../context.html) · [process notes](../process/index.html)\n\nThe blueprint is a small machine with about nine moving parts. Every other document here assumes you know them: `main_dag.md` indexes them, `CLAUDE.md` legislates them, the decision records argue about them. Nothing until now *explained* them.\n\nOne directory per concept, one page each, all the same shape:\n\n- **In one sentence** — what it is, in words that assume nothing.\n- **Why it exists** — the failure it prevents. A rule with no failure behind it is decoration.\n- **The shape** — the data: what fields, what files, what values are legal.\n- **An example** — a real one, from this repository, with a link you can open.\n- **In the literature** — where the idea comes from, and who else built one. Outside the closed world: nothing here is citable in a proof.\n- **Where it lives** — the files, gates and commands that implement it.\n\n## The concepts\n\n| | |\n|---|---|\n| **[node](node/index.html)** | the unit of the argument: one claim, one directory, one page |\n| **[closed world](closed-world/index.html)** | the finite list of things a proof is allowed to invoke |\n| **[appendix](appendix/index.html)** | where that list is kept, one full entry per object |\n| **[DAG](dag/index.html)** | how nodes depend on each other, and what `ready` and `blocked` mean |\n| **[confidence](confidence/index.html)** | how much the record supports a node, derived and never declared |\n| **[role](role/index.html)** | whether a node argues, corroborates, illustrates or explores |\n| **[gate](gate/index.html)** | the checks that run after every command, and the invariants they enforce |\n| **[operator](operator/index.html)** | the commands, each a typed map from repository state to repository state |\n| **[history](history/index.html)** | the append-only trail: how a statement got to be the way it is |\n\n## How they fit together\n\nAn **operator** creates or changes a **node**. A node states a claim and declares its **role**; the claim may be argued only from the **closed world**, which is the **appendix** plus the node's own dependencies in the **DAG**. A **gate** refuses the result if any of that is violated. What survives is written into the node's **history**, and the accumulated record — rounds survived, flaws disposed, literature found, human judgement given — is what the **confidence** derives from.\n\nRead [node](node/index.html) first. The rest make sense once you know what a node is.\n\n## Not a source of facts\n\nThese pages describe the machine; they never add to it. A proof may cite the appendix, its dependencies and standard mathematics — never a page here. If a concept page and [`CLAUDE.md`](../../CLAUDE.md) disagree, `CLAUDE.md` is right and the page is stale; say so in [`process/journal.md`](../process/journal.html) and fix it.\n";</script>
