G}r=\\varinjlim\\mathcal{G}r_n$ with the $\\mathcal{G}r_n$ finite dimensional and\n  $G_\\mathcal{O}$-invariant, \"The group $G_\\mathcal{O}$ acts on the $\\mathcal{G}r_n$ via a finite\n  dimensional quotient\"; (2.2) the closure relation. This is what makes\n  $L^+G\\backslash\\overline{\\mathrm{Gr}}_\\mu$ carry genuine finite-type smooth tests, and hence the one\n  instance of the node where every hypothesis is discharged and the conclusion has content.\n\n### Added by `/examples` — Q1-L3-L2 (does a *coherent* object on $\\mathrm{Gr}$ come from a stage?)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\nThe run's question was whether \"every $\\mathcal{F}\\in\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$ is supported\nin one $\\overline{\\mathrm{Gr}}_\\mu$\" is in print. It is — for *compact* objects, and for the *abelian*\nperverse category. Nothing was found for $\\mathcal{D}_c$.\n\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — printed **p. 6**, the definition\n  $\\mathrm{P}_{G_{\\mathcal{O}}}(\\mathcal{G}r,\\Bbbk):=_{\\mathrm{def}}\\varinjlim_n\\mathrm{P}_{G_{\\mathcal{O}}}(\\mathcal{G}r_n,\\Bbbk)$\n  as a $1$-categorical filtered colimit of abelian categories along the fully faithful\n  $\\mathcal{G}r_n\\subset\\mathcal{G}r_m$, with **Prop. 2.1** identifying it with the\n  $\\mathcal{S}$-constructible version. This is the classical form of the support bound, true *by\n  construction of the category*; pp. 4–5 also carry (2.1), (2.2) and the $I$-orbit cell decomposition.\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — **§4.3, printed p. 20**: for placid $T$, \"in the $D^!$-case,\n  compact objects are !-pullbacks of compact objects from finite type schemes\". **Rem. 5.1.1, p. 30**:\n  \"many 'standard' $D$-modules in infinite type are not compact (e.g., the delta $D$-module concentrated\n  at a point in an infinite type placid scheme)\", with **fn. 6, p. 31** — allowing them \"completely ruins\n  all the nice finiteness conditions that 'usual' (coherent) holonomic complexes satisfy\". **Warning\n  4.9.2, p. 23**: a closed embedding of infinite codimension has $f_{*,\\mathrm{ren}}$ not preserving\n  compacts. **§6.5, (6.5.1), p. 35** and **Rem. 6.8.3, p. 36** for the ind-scheme colimit and compact\n  generation. Every \"comes from a stage\" statement located here is about compacts, never about\n  coherent objects.\n- **[`zhu2025tamecategoricallocallanglands`](../../papers/zhu2025tamecategoricallocallanglands.pdf)** — **Ex. 10.134, p. 376**, verified on the page:\n  $\\mathrm{Shv}_c(\\mathbb{B}H)$ is generated by $\\omega_{\\mathbb{B}H}$, \"$\\omega_{\\mathbb{B}H}$ is in\n  general not compact (e.g. $H=\\mathbb{G}_m$)\", hence \"constructible sheaves … on a quasi-placid stack\n  $X$ are usually not compact in $\\mathrm{Shv}(X)$\". Also §10.5.4 pp. 376–377 ($\\mathrm{IndShv}_{f.g.}$,\n  (10.55)–(10.57): the $\\mathrm{Ind}\\,\\mathcal{D}_c$ construction, and the continuous right adjoint to\n  $f^!$ that it makes available) and Prop. 10.144 p. 378.\n- **`bouthier_kazhdan_varshavsky_2022perversesheavesinfinitedimensionalstacks`** — Bouthier, Kazhdan,\n  Varshavsky, Adv. Math. **408** (2022), arXiv:2003.01428. **PDF not in `papers/`**; read this run from\n  the authors' copy at `math.huji.ac.il/~vyakov/springer.pdf`, pp. 2–5. **§0.1.4(a), p. 3**: \"for every\n  prestack $\\mathcal{X}$ we have a dualizing sheaf $\\omega_{\\mathcal{X}}\\in\\mathcal{D}(\\mathcal{X})$,\n  defined to be the !-pullback of $\\overline{\\mathbb{Q}}_l\\in\\mathcal{D}(\\mathrm{pt})$\"; **§0.1.4(c)**:\n  the affine Grothendieck–Springer sheaf is $(\\overline{\\mathfrak{p}}_\\bullet)_!(\\omega_{[\\widetilde{\\mathfrak{C}}_\\bullet/\\mathcal{L}G]})$\n  — $\\omega$ of an ind-infinite quotient stack, used as a genuine perverse object. This is the published\n  existence of the object at the heart of the candidate counterexample to Q1-L3-L2(1). Fetching the PDF\n  into `papers/` is worth it if that clause is revisited.\n- **[`BZSV`](../../papers/BZSV.pdf)** — **§7.3, pp. 155–158** re-read for this node. §7.3.1 p. 155 (the placid case);\n  the **caveat box p. 156** (\"we don't state them as theorems, because … sheaf theory in these contexts\n  is not clearly documented\"); **§7.3.3 p. 157**, the functors **(7.6)** $\\mathrm{Shv}^l_n\\to\\mathrm{Shv}(X_F/G_O)$,\n  which \"permit us to think of objects of $\\mathrm{Shv}^l_n$ as objects in $\\mathrm{Shv}(X_F/G_O)$\" —\n  one direction only, no converse anywhere; p. 158, the mapping space as $\\varinjlim_K\\varprojlim_N$.\n  This is the natural home for a support bound at spherical level and it does not contain one.\n- **`NP01`** — §9 opening p. 22 ($m_{\\mu_\\bullet}$ \"un morphisme propre\"), Lemme 9.3, **Prop. 9.4**:\n  $\\mathcal{A}_{\\mu_1}\\ast\\cdots\\ast\\mathcal{A}_{\\mu_n}=\\bigoplus_{\\lambda\\le|\\mu_\\bullet|}\\mathcal{A}_\\lambda\\otimes V^\\lambda_{\\mu_\\bullet}$.\n  The group-case computation of the convolution support bound; record carried over from the Q2-L6 run\n  and used here for clause (2).\n\n### Added by `/examples` — Q1-L3-L1 (properness of the spherical convolution map onto $LX$)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\n\n- **[`chen2024real`](../../papers/chen2024real.pdf)** — Chen, Nadler, arXiv:2403.13995v1. **The precedent hit of the run**, and it is\n  inside a proof rather than in a numbered statement: the **proof of Theorem 13.3** (printed p. 57)\n  asserts that the spherical action map $a\\colon Y^i\\times^{G(\\mathcal{O})}\\overline{G(\\mathcal{O})t^\\lambda\n  G(\\mathcal{O})}\\to Y^{i'}$ \"is a proper morphism\", after finding a stage $Y^{i'}$ of the placid\n  presentation that its image \"lands in\". That is Q1-L3-L1(1) and the closed half of (2) at spherical\n  level, for $X=K\\backslash G$ **symmetric** over $\\mathbb{C}$. Supporting pages read: §8.1 pp. 33–34\n  (placid / ind-placid definitions, placid presentation (8.1) with placid *closed* transitions;\n  **Prop. 8.1** = Drinfeld/Bouthier, $Y(\\mathcal{K})$ ind-placid for smooth affine $Y$ of finite type,\n  and $G(\\mathcal{K})/H(\\mathcal{K})\\simeq(G/H)(\\mathcal{K})$; **Prop. 8.3** orbit closures\n  $G(\\mathcal{O})$-placid; **Cor. 8.4**); §11.1 p. 51 (the Hecke action is convolution on the right\n  along $X(\\mathcal{K})\\times^{G(\\mathcal{O})}\\mathrm{Gr}$); §13.1 p. 56 (Thm. 13.1, Thm. 13.3);\n  §13.2–13.3 pp. 57–59 (Def. 13.6, Prop. 13.7). Setting confirmed on p. 3: $G_\\mathbb{R}$ a real form,\n  $X=K\\backslash G$ symmetric, $\\mathbb{C}$-constructible complexes — **symmetric, not spherical**.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, pp. 37–44 and 50–53 read this run. New relative\n  to the records above: **§8.1.1** (p. 37) — the affine Hecke action on $D(I_0\\backslash LX)$ defined by\n  $LG/I_0\\times LX\\leftarrow LG\\times LX\\to LG\\times^{I_0}LX\\xrightarrow{a}LX$ with\n  $\\mathcal{M}\\star\\mathcal{F}:=a_!(\\mathcal{M}\\widetilde\\boxtimes\\mathcal{F})$, formula (21); the\n  **proof of Prop. 70** (pp. 38–39) — its opening fixes $v\\le v'$ with\n  $\\mathcal{M}\\star\\mathcal{F}\\in D(I_0\\backslash\\overline{\\mathcal{O}}_{v'})$, and its part (ii) says\n  \"since $a$ proper it follows from [Gro65, Theorem 8.10.5] that each $a_j^{[n]}$ is proper\" — the\n  Iwahori-level form of Q1-L3-L1(1)+(2); **§10.2** (p. 52) — the spherical Hecke action is defined\n  \"similarly as in Section 8.1.1 (replacing $I_0$ by $L^+G$)\", and $e_{L^+X}$ is the constant sheaf on\n  \"the closed $L^+G$-orbit $LX_0=L^+X$\"; **§11(2)** (p. 53) — for disconnected $K$, $LX_{\\mathcal{L}}\n  =\\pi(LG)$ is an $LG$-invariant union of components with $L^+X\\subset LX_{\\mathcal{L}}$, and\n  $\\mathrm{IC}_V\\star e_{L^+X}$ lands in $D(L^+G\\backslash LX_{\\mathcal{L}})$ — a published support\n  bound of exactly clause (2)/(3)'s shape. Also Thm. 87 with Ex. 88 and Rem. 89/91 (pp. 51–52).\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 13–15 read this run (§4, *The convolution product*). Diagram (4.1)\n  and the definition (4.2) of $\\mathcal{A}_1*\\mathcal{A}_2$; the definition of a *stratified semi-small\n  map* (4.4), whose clause **(a)** is \"for any $T\\in\\mathcal{T}$ the map $f|\\overline{T}$ is proper\";\n  **Lemma 4.4** (p. 14) asserting $m\\colon G_{\\mathcal{K}}\\times_{G_{\\mathcal{O}}}\\mathcal{G}r\\to\n  \\mathcal{G}r$ is stratified semi-small for the strata $\\widetilde{\\mathcal{G}r}^{\\lambda,\\mu}=\n  p^{-1}(\\mathcal{G}r^\\lambda)\\times_{G_\\mathcal{O}}\\mathcal{G}r^\\mu$, its proof naming the target\n  $\\overline{\\mathcal{G}r^{\\lambda+\\mu}}$; Prop. 4.2, Lemma 4.3, Prop. 4.6. The group-case anchor for\n  clauses (1)–(2) — properness is *asserted* through (4.4)(a) and the page verifies only the dimension\n  estimate (4.6).\n- **[`BZSV`](../../papers/BZSV.pdf)** — pp. 155–156 and 161–163 re-read this run as the **informative negative**. §7.3.1 p. 155\n  defines *the placid case* and lists the $X$ satisfying it (Godement–Jacquet and Iwasawa–Tate\n  $X=M_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_n$; any vectorial case; the group period; Rankin–Selberg;\n  Gross–Prasad) — and asserts placidity only. p. 156 carries the boxed caveat that the properties of\n  that sheaf theory are deliberately not stated as theorems, and the remark that placidity of $X_F$ for\n  all smooth $X$ \"seems possible … by the techniques of Drinfeld [Dri06], cf. [CN24, §8.1]\", details\n  not in print. §7.5.3 pp. 162–163 states the Hecke desideratum, (7.16), and \"all sheaves on $X_F/G_O$\n  can be generated from the basic object\" — as a *consequence* of Conj. 7.5.1. **No properness of a\n  convolution map and no closed-image or support statement anywhere in either section.**\n\n### Added by `/examples` — Q1-L3-L3 (compacts of a subcategory generated by a directed family)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\nThis node is abstract DG/stable category theory, so the sources are the foundations volumes and the\ntriangulated literature rather than anything relative-Langlands.\n\n- **(no `refs.bib` key)** — A. Neeman, *The connection between the K-theory localization theorem of\n  Thomason, Trobaugh and Yao and the smashing subcategories of Bousfield and Ravenel*,\n  Ann. Sci. É.N.S. (4) **25** (1992) 547–566, [numdam.org, doi:10.24033/asens.1659]. **The precedent.**\n  Full text fetched from Numdam and §§0–2 read on the page (printed pp. 547–558). **Lemma 2.2**\n  (p. 555): \"*The category $\\mathcal{R}^{c}$ is contained in $\\mathcal{S}^{c}$. In fact, more is true.\n  The category $\\mathcal{R}^{c}$ is the smallest épaisse subcategory containing R.*\" — i.e.\n  $\\mathrm{Loc}(R)^{c}=\\mathrm{thick}(R)$, which is the whole non-formal content of Q1-L3-L3.\n  **Lemma 2.3** (p. 556) is the engine and is stated with *no* compact-generation hypothesis on the\n  ambient: only \"$\\mathcal{S}$ triangulated closed under formation of coproducts, R a set of objects in\n  $\\mathcal{S}^{c}$ closed under suspension\". Theorem 2.1 (p. 555) *does* carry the ambient hypothesis\n  ($\\mathcal{S}^{c}$ small and localising-generating), but Lemma 2.2's printed proof uses only\n  Construction 1.6, Lemma 1.5 and Lemma 2.3. Also read: Def. 0.1–0.2 (compact, $\\mathcal{S}^{c}$\n  épaisse), Def. 1.3–1.4 (localising; hocolim), Lemma 1.5, Construction 1.6 (Adams–Bousfield),\n  Lemma 2.4–2.6. **An appendix entry built from Lemma 2.2/2.3 would make Q1-L3-L3 a two-line corollary.**\n- **[`GR17vol1`](../../papers/GR17vol1.pdf)** — Ch. 1 read at page level this run: **§5.4** (printed p. 55) Def. 5.4.1 of *generate*\n  and **Prop. 5.4.5**, the criterion the appendix's generation entry already cites; **§7.1.1** (p. 64)\n  compactness, $\\mathbf{C}^{c}$; **Lemma 7.2.4** (p. 65), whose **(1'')** (\"*any compact object in\n  $\\mathrm{Ind}(\\mathbf{C}^{0})$ is a direct summand of one in the essential image*\") and **(3)**\n  (\"*$\\mathbf{C}^{0}\\subset\\mathbf{C}^{c}$ full and generating $\\Rightarrow\\mathrm{Ind}(\\mathbf{C}^{0})\n  \\to\\mathbf{C}$ an equivalence*\") together give the same content ∞-categorically; **Cor. 7.2.7**\n  (p. 66), the *filtered colimit of categories* form, which is the analogue and not the statement.\n  *Caveat found while reading:* footnote 8 on printed p. 51 fixes the standing convention \"*when\n  talking about cocomplete categories we will always assume that they are presentable*\", so the GR17\n  route to Q1-L3-L3 silently wants $\\langle S\\rangle_{\\mathcal{C}}$ presentable; Neeman's route wants\n  only coproducts.\n- **[`HTT`](../../papers/HTT.pdf)** — §4.4.5 read (printed pp. 305–313). **Cor. 4.4.5.7** (weak retraction diagrams extend to\n  strong ones), **Prop. 4.4.5.12** with **Prop. 4.4.5.17** and **Rem. 4.4.5.18** (the retract is the\n  colimit of $X\\xrightarrow{e}X\\xrightarrow{e}\\cdots$), **Cor. 4.4.5.15** (idempotent complete\n  $\\Leftrightarrow$ all Idem-indexed colimits exist), **Counterexample 4.4.5.19**. Consequence recorded\n  in the node's `examples.md`: hypothesis (B)'s *retract-closure* clause is **redundant** given closure\n  under the sequential colimits formed in $\\mathcal{C}$. Also §5.1.4 (p. 321), where Prop. 5.1.4.2's\n  proof is the printed use of Cor. 4.4.5.15 in exactly this way.\n- **Stacks Project, §13.37 *Compact objects*** (tags 09SM, 09SN, 09SP; **no `refs.bib` key**) — fetched,\n  not on disk. **Lemma 13.37.3** (09SN): \"$\\mathcal{D}$ a triangulated category with direct sums, $E_i$,\n  $i\\in I$, a family of compact objects such that $\\bigoplus E_i$ generates $\\mathcal{D}$\", giving the\n  hocolim presentation. **Lemma 13.37.4** (09SP): a map from a compact $C$ into a stage factors through\n  \"*an object of $\\langle E_{i_1}\\oplus\\ldots\\oplus E_{i_t}\\rangle$ for some $i_1,\\ldots,i_t\\in I$*\" —\n  the *finitely many generators* half of Q1-L3-L3 in print, as a factorisation rather than a membership,\n  and with the ambient assumed compactly generated by the $E_i$. Also **§15.80** (tag 07LQ),\n  *Characterizing perfect complexes*, used for \"perfect $=$ compact in $D(R)$\" in the $k[x]$ instance.\n\n### Added by `/examples` — Q1-L5-L3-L1 (does a closed-immersion chart transfer coherence?)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\nThe run came back **negative**, and the source that settles it was not in `papers/` and had never\nbeen opened by any run.\n\n- **Hotta, Takeuchi, Tanisaki, *D-Modules, Perverse Sheaves, and Representation Theory*, Progress in\n  Math. **236**, Birkhäuser 2008** (**no `refs.bib` key**, PDF not in `papers/`; read from the copy at\n  `irma.math.unistra.fr/~lfu/Activities/supporting files/`). **⚠ Naming trap: the key [`HTT`](../../papers/HTT.pdf) in\n  `refs.bib:524` and the file `papers/HTT.pdf` are Lurie's *Higher Topos Theory*, not this book.**\n  Pages 33–34, 64–70, 83–84 read at page level. **Remark 1.5.10** (p. 33) is the counterexample of the\n  run, and it is stated for a closed embedding: \"*If $f$ is a closed embedding with $\\dim X<\\dim Y$,\n  then the $D_X$-module $D_{X\\rightarrow Y}$ is locally free of infinite rank. We see from this that\n  the functor $Lf^{*}$ … does not necessarily send $D^b_c(D_Y)$ to $D^b_c(D_X)$.*\" **Prop. 1.5.13**\n  (p. 34): for $f$ **smooth**, $f^{*}$ is exact and preserves coherence — the true half, and what\n  makes [coherent $\\mathcal{D}$-modules](../appendix/defn-coherent-d-mod.html) well behaved. **Ex. 1.5.12**\n  (p. 34): $j^{\\dagger}=j^{-1}$ for an open embedding. **Prop. 1.5.16** (p. 37): $i^{\\dagger}\\simeq Ri^{\\flat}$\n  for a closed embedding — the identification of HTT's $Lf^{*}[\\text{shift}]$ with the $!$-pullback of\n  [$\\mathcal{D}^!$, $\\mathcal{D}^*$](../appendix/conv-d-shriek-d-star.html). **§2.4 opening**\n  (p. 64), **Def. 2.4.2**, **Ex. 2.4.5** and **Thm. 2.4.6** (pp. 65–67): the *non-characteristic*\n  condition, which is the published sufficient hypothesis for a non-smooth $f^{\\dagger}$ to preserve\n  coherence. **Thm. 2.5.1** (p. 69): proper direct image preserves $D^b_c$. **§3.2.1 and Thm. 3.2.3(ii)**\n  (p. 84): \"*neither $\\int_f$ nor $f^{\\dagger}$ preserves the coherency for general morphisms $f$*\",\n  and holonomicity is preserved by both for **any** $f$. Whoever repairs\n  [Q1-L5-L3](../nodes/Q1/Q1-L5/Q1-L5-L3/index.html) wants an appendix entry built from\n  Thm. 3.2.3(ii) or Thm. 2.4.6, and wants this book to get a `refs.bib` key that is **not** [`HTT`](../../papers/HTT.pdf).\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — **Table 1, p. 3** re-read on this run's own eyes: $f^{!}\\colon\n  D^{!}(T)\\rightarrow D^{!}(S)$ is listed under \"Hypotheses: **None**\", with columns for adjunctions and\n  base change and **no column and no row concerning coherence**. The confirmation, at page level, of\n  Flaw 2(ii) of the parent's round-1 critique: the source the draft pointed at is silent on\n  $\\mathcal{D}_c$, and the reason it is silent is that the assertion is false.\n- **[`GR17vol1`](../../papers/GR17vol1.pdf)** — contents only (Ch. 4 §6 *Closed embeddings*, p. 201, and Ch. 5 §3 *The functor of\n  !-pullback*, p. 228 are the natural homes for an ind-coherent analogue). **Not** read at page level\n  this run; the D-module statement was settled before it was needed, and the ind-coherent statement is\n  a different assertion that no node currently asks for.\n\n### Added by `/examples` — Q1-L3-L5, second reader (finite orbit intervals)\n\nAppended, not substituted for the block above: a concurrent `/examples Q1-L3-L5` run read these pages\nindependently on 2026-08-06. Its Corollary 27 find is confirmed verbatim on p. 17; the entries below\nare what that block does not record.\n\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 4–9 read this run. *Correction to the Q1-L3-L5 block above,\n  which states that \"the finiteness of the dominance interval is not on the page\":* it is.\n  **Remark 3.3** (p. 9) reads \"*by (2.2), $L_\\nu\\in\\overline{\\mathcal{G}r^\\lambda}$ if and only if\n  $\\nu$ is a weight of the irreducible representation of $\\check G_{\\mathbb{C}}$ of highest weight\n  $\\lambda$*\", and a finite-dimensional representation has finitely many weights — so the interval\n  $\\{\\nu\\in\\Lambda^+\\mid\\nu\\le\\lambda\\}$ is finite *on the source's own page*, and the group-case\n  discharge of hypothesis (A) needs no unsourced step. **Prop. 3.1(a)** (p. 7) is the calibrating\n  contrast: $\\overline{S_\\nu}=\\bigcup_{\\eta\\le\\nu}S_\\eta$ with $\\eta$ over *all* of $X_*(T)$, and the\n  same page saying these $N_{\\mathcal{K}}$-orbits are \"neither of finite dimension nor of finite\n  codimension\" — an orbit stratification of the *same* ind-scheme with infinite intervals, so\n  finiteness in (A) is a property of the $L^+G$-action and not of $\\mathrm{Gr}$. Also **Thm. 3.2** and\n  (3.6) (pp. 8–9), not used.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, pp. 9–11 and 16–18, 21–24 read this run.\n  **§3.1** (p. 10) is the sentence that licenses the phrase \"dominance interval\" in the node's clause\n  (2): \"$\\Lambda_S^+=\\Lambda_S\\cap\\Lambda_T^+$ … $\\Lambda_S$ is naturally ordered by the restriction of\n  the ordering from the coweights $\\Lambda_T$\" — so the interval sits inside the dominant cone of an\n  honest root datum. The **proof of Cor. 21** (p. 11) then transports the containment from the\n  Grassmannian (\"*by the orbits closure relation in affine Grassmannian we know\n  $\\overline{LX}_\\mu\\subset\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$*\"), which is what makes MV Rem. 3.3\n  applicable and gives (A) for symmetric $X$ a second sourced route beside Cor. 27. **Lemma 38** (p. 22)\n  re-verified: it asserts *filteredness* (upward directedness) of $\\Lambda_{S,\\beta}^+$ and\n  $\\mathcal{V}_\\beta$, which is logically independent of the downward finiteness in (A) — but it is what\n  makes each finite union $\\bigcup_{\\lambda\\in E}\\overline{LX}_\\lambda$ a **scheme**, since a finite $E$\n  is dominated by one $\\gamma$ and the union then sits inside the placid $\\overline{LX}_\\gamma$.\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — §6.2–6.8, pp. 34–36 read this run as the local library's home for\n  the general principle Q1-L3-L5(1) turns on, and it demonstrably does not contain it. **§6.2** (p. 34)\n  defines an indscheme as a filtered colimit of qcqs schemes along closed embeddings; **Def. 6.4.1** and\n  **Lemma 6.4.6** (pp. 34–35) treat *reasonable* subschemes; **(6.5.1)** (p. 35) the two sheaf\n  categories; **Prop. 6.6.1–6.6.2** descent; **Prop. 6.7.1** the equivariant setting; **Def. 6.8.1**,\n  **Rem. 6.8.2–6.8.3** (p. 36) placidity. Nowhere is there a statement about a *subset* of the\n  underlying space whose trace on each stage is closed. Anyone wanting that citable should look outside\n  this paper — Beilinson–Drinfeld §7, which Def. 6.4.1 is taken from, is the next place to try.\n- **[`BZSV`](../../papers/BZSV.pdf)** — pp. 155–159 read this run for the boundary case. **§7.3.1** (p. 155) with footnote 57\n  (\"*the situation is quite rich even in the case when $X$ is a vector space, because $G_O$-orbit\n  closures can be singular even though $X_F$ is very simple*\"); **Ex. 7.3.5** (p. 158),\n  $X^l_n(R)=t^{-l}R[t]/t^n$ — so the exhaustion of $L\\mathbb{A}^1$ is by $t^{-l}\\mathcal{O}$, and\n  p. 159's chain $\\underline{k}_{X^l}\\to\\underline{k}_{X^{l-1}}$ whose colimit is the Dirac object\n  $\\delta_0$ is the printed form of the infinite descending chain of $\\mathcal{O}^\\times$-stable closed\n  subschemes $t^{m}\\mathcal{O}$. **Ex. 7.3.7** (p. 159): for Godement–Jacquet $X=M_n$ the Hecke\n  translates $\\mathrm{I}_j$ are \"*supported on $M_{n,\\mathcal{O}}$*\" — the closed set that is\n  $\\overline{LX}_0$ and carries the infinitely many Smith-normal-form orbits. Together these source the\n  boundary finding that **hypothesis (A) fails for the two non-homogeneous key examples**, K1 and\n  Godement–Jacquet, both inside the standing class.\n\n### Added by `/examples` — Q2-L1 (standard generators: one condition replaces the two)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\nThe run looked for the recollement/dévissage generation principle — *a cocomplete stable subcategory\nof a category glued from a stratification is everything iff it contains the $!$-extensions of\ngenerators of every stratum* — and found the **hypotheses** in print and the **criterion** nowhere.\n\n- **[`chen2024real`](../../papers/chen2024real.pdf)** — Chen, Nadler, arXiv:2403.13995v1, **pp. 36–38 read this run** (new relative to\n  the Q1-L3-L1 and Q1-L3-L4 records above, which took §8.1 and §13). **§8.4, p. 38** is the find and\n  it is the printed form of Q1-L5's whole hypothesis package: following [BKV, §2.4.8] an ind-stack is\n  *placid stratified* when each stratum is a placid stack with **fp-locally closed** inclusion and\n  there is a presentation $\\mathcal{Y}=\\mathrm{colim}_j\\mathcal{Y}^j$ by closed substacks each a\n  **finite** union of strata — i.e. (H2) with (H3) — and the same page concludes from Prop. 8.3,\n  Cor. 8.4 and Lemma 8.7 that $K(\\mathcal{K})\\backslash\\mathrm{Gr}\\simeq X(\\mathcal{K})/G(\\mathcal{O})$\n  with its orbit stratification \"is a placid stratified stack, admitting gluing of sheaves\", which is\n  (H1); their $j^\\lambda_{X,!}$, used on that page to build $\\mathrm{IC}^\\lambda_X$, is the $i_{\\lambda!}$\n  of the blueprint. Also read: **p. 36**, the proof that $\\eta_*$ is continuous with left adjoint\n  $\\eta^*$ and satisfies Beck–Chevalley (8.3), and **Prop. 8.11**; **Prop. 8.12, p. 38** (the\n  $t$-structure on a placid stratified stack, = [BKV, Prop. 6.4.2]). *Two limits, both on the page:*\n  the setting is $X=K\\backslash G$ **symmetric** over $\\mathbb{C}$ in the $\\mathbb{C}$-constructible\n  BKV formalism, not $\\mathrm{Ind}\\,\\mathcal{D}_c$; and the **finiteness** clause excludes the\n  non-homogeneous key examples, whose closures contain infinitely many orbits. Verified again this\n  run at **pp. 57–60**: Thm. 13.4, Thm. 13.5, **Def. 13.6** ($Q_X$ = summands of\n  $\\omega_{X(\\mathcal{O})/G(\\mathcal{O})}\\star\\mathrm{IC}_V$), **Prop. 13.7(1)** (irreducibles are ICs\n  on orbit closures of strata $S^\\lambda$, $\\lambda\\in\\sigma(\\Lambda_T)$, *trivial local systems*),\n  **Cor. 13.8** ($Q_X\\simeq Q_K\\simeq\\mathrm{Rep}(H^\\vee_{real})$).\n- **[`BZSV`](../../papers/BZSV.pdf)** — pp. 164–169 read this run. **Lemma 7.5.13, p. 167**, and its proof: \"*The Lemma follows\n  from the observation (§7.5.3) that in the presence of the local conjecture, the entire automorphic\n  category is generated in this way.*\" That is generation asserted as a *consequence* of Conj. 7.5.1\n  and never as a criterion; no standard object appears in §7.5. **Ex. 7.6.1, p. 168** is the hand\n  computation the run's best instance rests on: \"*the sheaf $\\delta_n$ introduced in Example 7.3.5\n  corresponds to $[n]\\otimes\\mathcal{O}^{/\\!\\!/}_{\\check M}$*\" (so the $k_{X^l}$ are the Hecke\n  translates) and \"*The skyscraper at $0$ corresponds to taking a limit as $l\\to-\\infty$*\" — the\n  standard object of the closed stratum inside the **cocomplete** Satake subcategory, in print.\n  Also **§7.6.2, p. 168** (group case = derived Satake [BF08]) and **§7.6.3, p. 169** (the point).\n- **[`chen2022quaternionic`](../../papers/chen2022quaternionic.pdf)** — Chen, Macerato, Nadler, O'Brien, arXiv:2207.04078, **pp. 5–6 read this\n  run**. **Thm. 1.3** and **Rem. 1.4** (p. 5): \"*In general, the $\\mathfrak{L}\\mathrm{Sp}_{2n}$-orbits\n  on $\\mathrm{Gr}_{2n}$ are neither finite-dimensional nor finite-codimensional. Thus there is not a\n  naive approach to sheaves on $\\mathfrak{L}\\mathrm{Sp}_{2n}\\backslash\\mathrm{Gr}_{2n}$ with\n  traditional methods.*\" The published statement that (H1) is unavailable by traditional means for a\n  member of the standing class whose equality is nevertheless a theorem.\n- **(no `refs.bib` key)** — Drinfeld, Gaitsgory, *Compact generation of the category of D-modules on\n  the stack of $G$-bundles on a curve*, arXiv:1112.2402. Full text scanned this run as the natural\n  home of a stratified generation lemma. **It is not one:** the paper is organized around truncative /\n  co-truncative open substacks (Prop. 4.1.6) and §3.2.1 states that truncativeness \"never occurs for\n  schemes, unless $\\mathcal{Z}$ is a union of connected components\". Nothing of the form \"$D(\\mathcal{Y})$\n  is generated by the $i_{\\alpha!}$ of generators of the strata\" was located.\n- **[`HA`](../../papers/HA.pdf)** (Lurie, *Higher Algebra*), **§A.8 *Digression: Recollement*** — located by search and\n  **not read at page level this run**, so nothing from it is cited. Wanted for whether the recollement\n  axioms there (fully faithful $i_*$, $j_*$ with adjoints, $j^*i_*\\simeq0$, and joint conservativity of\n  $j^*,i^*$ — the two-stratum shape of (H1)+(H3)) are anywhere accompanied by a generation statement.\n- **Ayala, Mazel-Gee, Rozenblyum, *Stratified noncommutative geometry*, Memoirs AMS 297 (2024),\n  arXiv:1910.14602** (**no `refs.bib` key**, not on disk) — the reconstruction theorem for\n  stratifications of presentable stable $\\infty$-categories is the right level of generality for\n  (H2)–(H3) as an abstract statement. The arXiv HTML build is broken and the PDF was not fetched, so\n  no numbered statement was read; fetching it is the single highest-value acquisition for anyone who\n  wants the dévissage of Q2-L1 to rest on something \n  dimensional schemes which are $G_{\\mathcal{O}}$-invariant\" and that \"$G_{\\mathcal{O}}$ acts on\n  the $\\mathcal{G}r_n$ via a finite dimensional quotient\" — the source never calls a stage proper.\n\n### Added by `/examples` — Q2-L8 (decategorified dévissage: standard classes span $K_0$)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\nTwo of the three are outside the current `refs.bib`, and the run's conclusion is negative, so the\nreading trail matters more than usual.\n\n- **(no `refs.bib` key)** — D. Quillen, *Higher algebraic K-theory: I*, in Algebraic K-theory I,\n  Lecture Notes in Math. **341**, Springer 1973, pp. 85–147. Scan read at page level (printed\n  pp. 104–115). §5 *Devissage and localization in abelian categories*: **Theorem 4 (Devissage)**,\n  p. 112 — every object of $\\underline A$ having a finite filtration with subquotients in\n  $\\underline B$ gives $K_i\\underline B\\xrightarrow{\\sim}K_i\\underline A$, the abelian precedent for\n  the *shape* of [Q2-L8-L1](../nodes/Q2/Q2-L8/Q2-L8-L1/index.html)'s **(F)** + clause\n  (i); **Theorem 4, Corollary 1**, p. 112 — for $\\underline A$ of finite length,\n  $K_i\\underline A\\simeq\\coprod_j K_iD_j$ over the simple objects with\n  $D_j=\\mathrm{End}(X_j)^{\\mathrm{op}}$, which is the sourced form of \"the stratum's $K_0$ is free on\n  the irreducibles\" used at a disconnected stabilizer; **Theorem 5 (Localization)**, p. 113 — the\n  long exact sequence ending $K_0\\underline B\\to K_0\\underline A\\to K_0(\\underline A/\\underline B)\\to0$,\n  i.e. the node's conclusion in the abelian setting, *with the analogue of hypothesis **(D)** proved\n  rather than assumed*. Worth an appendix entry if any node wants decategorified dévissage citable.\n- **(no `refs.bib` key)** — D. Orlov, *Formal completions and idempotent completions of triangulated\n  categories of singularities*, arXiv:0901.1859 (Adv. Math. 226 (2011) 206–217). **Theorem 4.1**,\n  read this run through the ar5iv HTML: Thomason's classification — the strictly full *dense*\n  triangulated subcategories of an essentially small $\\mathcal{T}$ correspond one-to-one to the\n  subgroups of $K_0(\\mathcal{T})$. Primary source, **not** read on its own pages: R. W. Thomason,\n  *The classification of triangulated subcategories*, Compositio Math. **105** (1997) 1–27,\n  Theorem 2.1. This is the published form of the retract obstruction that\n  [`updates/u1.md`](../nodes/Q2/Q2-L8/updates/u1.html) found by hand: generation never implies\n  hypothesis **(E)**, and the deficiency is exactly a subgroup of $K_0$.\n- **[`bezrukavnikov2016two`](../../papers/bezrukavnikov2016two.pdf)** — pp. 1–4 read this run. §1.1, p. 2: $\\overline{\\mathbb{H}}$ = finitely\n  supported functions on $I\\backslash G(F)/I$ under convolution = the Iwahori–Matsumoto Hecke\n  algebra. p. 3, unnumbered prose: \"the space of functions on the set of $\\mathbb{F}_q$-points … is\n  a quotient of the Grothendieck group of the category\" — the sheaf–function line of the dictionary,\n  in print, and the only place located where the node's conclusion appears at all in the group case\n  at Iwahori level. It is prose, not a theorem, and it is a *quotient*, so it is weaker than the\n  node.\n- **[`BZSV`](../../papers/BZSV.pdf)** — p. 168 read this run: §7.6 opening (\"examples where at least some parts of Conjecture\n  7.5.1 are known\"), Ex. 7.6.1 ($X=\\mathbb{A}^1$, verified by hand), **§7.6.2 the group case**\n  (\"the conjecture is precisely the derived Satake theorem of [BF08], in the case of\n  $\\mathbb{F}=\\mathbb{C}$\"). *Correction to the Q1-L1 record above:* $X=\\mathrm{pt}$ was **not**\n  located on p. 168; the catalogue there begins with $\\mathbb{A}^1$ and the group case.\n- **Wanted and not found.** No source states or assumes anything like hypothesis **(D)** of\n  [Q2-L8](../nodes/Q2/Q2-L8/index.html) — the peeling triangle at a maximal stratum whose\n  third term acquires *no new stratum*. Every stratification argument located inducts on the strata\n  of a **closed** set instead, precisely because the third term does acquire them. `BBDG18` §1.4\n  (recollement, $i^!j_*=0$) is what makes the failure visible; the condition **(D)** implicitly\n  demands at singleton supports is Lusztig's *cleanness* (Lusztig, *Intersection cohomology\n  complexes on a reductive group*, Invent. Math. **75** (1984) 205–272 — **no `refs.bib` key**, not\n  read at page level, named for orientation only), which is exceptional rather than generic.\n\n### Added by `/prove` — Q1-L5-L3-L4 (finite orbits and equivariant $!$-restriction)\n\nAppended, not substituted for the entries above. Nothing was opened on this run; these are the two\nstatements the write-up needed and could not cite, recorded so the next run knows where to look.\n\n- **Hotta, Takeuchi, Tanisaki, *D-Modules, Perverse Sheaves, and Representation Theory*, Progress in\n  Math. **236**, Birkhäuser 2008** (**no `refs.bib` key**, PDF not in `papers/` — see the Q1-L5-L3-L1\n  block above for the naming trap and the pages already read). Wanted for the **singular** half of\n  [Q1-L5-L3-L4](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/index.html), whose closed\n  world covers only the case of a smooth $S$: (i) **Kashiwara's equivalence**, §1.6 — for a closed\n  immersion $c\\colon S\\hookrightarrow\\tilde S$ with $\\tilde S$ smooth, $\\int_c$ identifies\n  $\\mathcal{D}$-modules on $S$ with those on $\\tilde S$ supported on $S$, which is what would give\n  $\\mathcal{D}_c(S)$ a meaning for singular $S$; (ii) **Thm. 3.2.3(i)** (p. 84), $\\int_f$ preserves\n  holonomicity for **any** $f$ — applied to the open complement $j\\colon\\tilde S\\setminus\n  S\\hookrightarrow\\tilde S$ it makes $R\\Gamma_{[S]}M$ holonomic for $M$ holonomic, which is the\n  missing preservation statement. Both would have to become appendix entries before any node may use\n  them; the existing entry\n  [$!$-restriction preserves holonomicity](../appendix/bb-htt-holonomic-shriek.html)\n  carries only clause (ii) of Thm. 3.2.3, for $f^{\\dagger}$ between **smooth** varieties.\n\n- **[`GR17vol1`](../../papers/GR17vol1.pdf)** — Ch. 1 §5.4 re-read at page level for [Q1-L5-z1](../nodes/Q1/Q1-L5/Q1-L5-z1/index.html)\n  (printed pp. 51–55, PDF pages 88–92, offset $+37$). Wanted for the *notation* inside the criterion\n  the generation entry records, which that entry does not spell out: **Def. 5.4.1** defines \"generate\"\n  by \"$\\mathrm{Maps}_{\\mathbf{C}}(c_\\alpha[-i],c)=\\ast$, $\\forall\\alpha$, $\\forall i=0,1,\\ldots\n  \\Rightarrow c=0$\" and then says in the same breath \"*where $[-i]$ denotes the shift functor on\n  $\\mathbf{C}$, i.e., the $i$-fold loop functor $\\Omega^i$*\". That identification is what makes the\n  criterion's one-sided range $i\\ge0$ equivalent to orthogonality in *all* shifts, and hence what lets\n  the orthogonal of an object be a **stable** subcategory — the step the backward direction of the\n  dévissage turns on. Also re-confirmed: **Prop. 5.4.5**'s printed proof gets its right adjoint\n  $\\iota^{R}$ to the inclusion $\\langle c_\\alpha\\rangle\\hookrightarrow\\mathbf{C}$ with no hypothesis\n  beyond GR's footnote-8 convention that cocomplete means presentable, so that convention is exactly\n  where the converse half of the criterion is paid for.\n\n### Added by `/prove` — Q1-L3-L4 (the orbit-closure witness)\n\n- **Hotta, Takeuchi, Tanisaki, *D-Modules, Perverse Sheaves, and Representation Theory*, Progress in\n  Math. **236**, Birkhäuser 2008** (no `refs.bib` key; not in `papers/` — see the naming trap recorded\n  above). Wanted for **Thm. 2.5.1**, *proper direct image preserves $D^b_c$*, already transcribed in\n  the Q1-L5-L3-L1 entry above: it is the finite-type statement Step 7 of\n  [Q1-L3-L4](../nodes/Q1/Q1-L3/Q1-L3-L4/proof.html) spends when it pushes $\\omega_{Z_T}$\n  forward along the closed immersion $Z_T\\hookrightarrow T$. The write-up invokes it as standard\n  finite-type $\\mathcal{D}$-module theory because the appendix has no entry for it; an entry built\n  from Thm. 2.5.1 (closed, hence proper, case) would put it inside the closed world.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, pp. 20–23 read this run for the **range** of\n  Theorem 36, not its content. **Lemma 34** (p. 20) describes $LX_\\lambda$ as\n  $LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^{+}\\mathcal{X}^{\\bullet}_\\lambda$, with\n  $\\mathcal{X}^{\\bullet}\\subset\\mathcal{X}$ the locus whose fibres are the **open $G$-orbit**, and the\n  proof of Thm. 36 (p. 21) quantifies over $\\lambda\\in\\Lambda_S^{+}$; Remark 37 (p. 22) extends that\n  and nothing wider. So the finite presentation of $\\overline{i}_\\lambda$ is available for the orbits\n  of arcs generically in the open orbit, and the degenerate orbits of a non-homogeneous $X$ — the\n  origin of $L\\mathbb{A}^1$ — are outside it, which is the scope caveat of that write-up.\n\n### Added by `/prove` — Q1-e4 (Godement–Jacquet: what BFGT Thm 3.6.1 is actually about)\n\n- **[`BravermanFinkelbergGinzburgTravkin_2021`](../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)** — arXiv:1909.11492v3, PDF **now on disk**; pp. 1–9,\n  16–23 read at page level 2026-08-07. *Correction, by addition, to the entry above that recorded\n  \"the appendix's Thm 3.6.1 citation for $X=M_n$ not independently verified\":* it is now verified,\n  and it does **not** say what the appendix and Q1-e4 read it as saying. **Theorem 3.6.1** (p. 22)\n  gives three monoidal equivalences $\\Phi^{2,0},\\Phi^{1,1},\\Phi^{0,2}$ whose *constructible* sides\n  are $D^{!}_{G_\\mathcal{O}}(\\mathrm{Gr}\\times\\mathcal{V})$, $D^{!*}_{G_\\mathcal{O}}(\\mathrm{Gr}\\times\\mathcal{V})$,\n  $D^{*}_{G_\\mathcal{O}}(\\mathrm{Gr}\\times\\mathcal{V})$ with $\\mathcal{V}=V\\otimes F$, and whose\n  *coherent* sides are $D^{\\bar G_0}_{\\mathrm{perf}}(\\mathcal{G}^\\bullet_{?,?})$. **§3.4, p. 19**:\n  $\\mathcal{G}^\\bullet_{1,1}=\\mathrm{Sym}(\\mathfrak{g}_{\\bar1}[-1])$,\n  $\\mathfrak{g}_{\\bar1}=\\Pi\\mathrm{Hom}(V_1,V_2)\\oplus\\Pi\\mathrm{Hom}(V_2,V_1)$,\n  $\\bar G_0=\\mathrm{GL}(V_1)\\times\\mathrm{GL}(V_2)$ — i.e. $T^*M_n$ in degree 1. **§3.2, p. 17**:\n  $\\mathrm{Gr}\\times\\mathcal{V}=(G_F\\times\\mathcal{V})/G_\\mathcal{O}$ with residual action\n  $h\\cdot[g,v]=[hg,v]$, so $G_\\mathcal{O}\\backslash(\\mathrm{Gr}\\times\\mathcal{V})$ is the loop\n  quotient of $\\mathrm{GL}_n\\times\\mathbb{A}^n$, **not** of $M_n$. **§1.7, p. 8** is the authors' own\n  dictionary, casting the constructible side as $D_{G(O)}(X(F))$ and the coherent side as the dual\n  datum. So Thm 3.6.1 is the unramified conjecture for $\\check X=\\mathrm{GL}_n\\times\\mathbb{A}^n$;\n  it leaves `assum:intro`(c) for $X=M_n$ open. Also read: **§1.3, p. 5** (the same three equivalences\n  in the loop-rotation form, with Thm 5.1.1), **Rem. 1.3.2, p. 5** (mirabolic $\\to$ ordinary Satake\n  by localization along $\\mathrm{Gr}\\times\\{0\\}$ — a localization, not an identification of the two\n  automorphic categories), **Conj. 1.4.1, p. 6** (the conjectural Iwahori version, $D_I(\\mathrm{Fl}\\times\\mathcal{V})$\n  vs. the mirabolic Steinberg scheme), **§3.1, pp. 16–17** (bisignature parametrization of the orbits).\n- **[`BZSV`](../../papers/BZSV.pdf)** — pp. 155, 158–159, 169–170 re-read this run, and p. 170 is the decisive corroboration:\n  BZSV list the [BFGT21]/[BFT22a] cases as \"$X=\\mathrm{GL}_n$ as $G=\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$-space,\n  $X=\\mathrm{GL}_n\\times\\mathbb{A}^n$ as $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$-space,\n  $X=\\mathrm{SO}_n$ as $G=\\mathrm{SO}_n\\times\\mathrm{SO}_{n-1}$-space\", with $M_n$ absent; and the\n  Travkin–Yang case there is $\\mathrm{GL}_m\\times\\mathrm{GL}_n$, $m<n-1$, \"the dual is then\n  $\\check X=\\mathrm{Mat}_{m\\times n}$\". **Ex. 7.3.7 with (7.10), p. 159**, by contrast, *is* stated\n  for $X=M_n$, $G=\\mathrm{GL}_n\\times\\mathrm{GL}_n$, $x\\cdot(g_1,g_2)=g_1^{-1}xg_2$:\n  $T_j\\star\\delta_X=\\mathrm{I}_j\\langle j(n-j)\\rangle$, $\\mathrm{I}_j$ supported on $M_{n,\\mathcal{O}}$,\n  pulled back from $M_{n,\\mathcal{O}}/tM_{n,\\mathcal{O}}$, fibre at $S$ the cohomology of\n  $\\{E\\subset k^n:\\dim E=j,\\ S|_E=0\\}$. **§7.3.1, p. 155** lists $X=M_n$ among the placid cases.\n  *Wanted and not citable:* an appendix entry for Ex. 7.3.7 — the write-up uses it only as reportage.\n\n### Added by `/examples` — Q1-e4 (literature pass of the refutation branch, 2026-08-07)\n\nAppended, not substituted for the entries above. Confirms the `/prove` block immediately above on\nthis run's own eyes, and adds the pages it did not reach.\n\n- **[`BravermanFinkelbergGinzburgTravkin_2021`](../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)** — pp. 1–9 and 16–22 read. New beyond the block\n  above: the **abstract and §1.2, p. 3** (the mirabolic affine Grassmannian is *defined* as\n  $\\mathbf{Gr}\\times\\mathbf{V}$, $\\mathbf{V}=V\\otimes\\mathbf{F}$ — the $\\mathbf{V}$-factor is in the\n  object, not an artefact of a proof); **§1.3, p. 4** ($\\mathfrak{D}^\\bullet$ = graded differential\n  operators *on $\\mathfrak{gl}_N$*, specializing at $\\hbar=0$ to $\\mathbb{C}[T^*\\mathfrak{gl}_N]$ —\n  so $M_N$ is the base of the coherent side throughout); **§1.7, p. 8** in full, the authors' own\n  BZSV translation, written out only for $\\overline\\Phi$ ($X=\\mathrm{GL}_N$ as a\n  $\\mathrm{GL}_{N-1}\\times\\mathrm{GL}_N$-space, $V_X^\\vee=\\mathrm{Hom}(\\mathbb{C}^{N-1},\\mathbb{C}^N)[1]\\oplus\\mathrm{Hom}(\\mathbb{C}^N,\\mathbb{C}^{N-1})[1]$)\n  and **never for the mirabolic $\\Phi^{1,1}$** — which is the omission in print that made the\n  misattribution easy; **Conj. 2.6.2, p. 16** (the $M=N$ and $M=N-1$ cases are what the paper\n  proves). Also **Rem. 1.3.2, p. 5**: the open embedding $\\mathrm{GL}_N\\subset\\mathfrak{gl}_N$ is\n  realized on the *coherent* side, matched to $\\mathbf{Gr}\\subset\\mathbf{Gr}\\times\\mathbf{V}$ on the\n  constructible side — the cleanest single sentence putting $M_n$ on the spectral side.\n- **[`BZSV`](../../papers/BZSV.pdf)** — **§8.3–8.5, pp. 180–189**, read for the question the pages above do not answer:\n  is there a weaker published verification for $M_n$? **Rem. 8.3.2, p. 180** — [BFN19] construct the\n  ring object $\\mathfrak{A}=\\Gamma_*\\omega_{\\mathrm{Gr}^X}$ for $X$ a vector space (so, for $M_n$),\n  but agreeing it with the Plancherel algebra \"would be interesting to prove\"; **§8.4, pp. 183–186**\n  computes Plancherel algebras for $H\\backslash G$, $\\mathrm{PGL}_2^3/\\Delta\\mathrm{PGL}_2$,\n  Whittaker and $\\mathrm{PGL}_2/T$ (the last with $\\check M=M_2$ — the matrix space again spectral),\n  and **not** for $M_n$. So even Conjecture 8.1.8 is unverified for this $X$. Also **fn. 57, p. 155**:\n  \"$G_O$-orbit closures can be singular even though $X_F$ is very simple, cf. Example 7.3.7\" — the\n  sourced form of \"genuinely singular orbit closures\", and the reason BZSV's placid presentation\n  (by lattices) and `assum:intro`(a) (by orbit closures) are different statements about $M_n$.\n- **`travkinYang_untwistedgaiottoequivalence_2024`** — Travkin, Yang, *Untwisted Gaiotto\n  equivalence*, arXiv:2201.10462. **Abstract only, read on the web — a lead, not a page-level\n  reading.** The constructible side is $(\\mathrm{GL}_M(O)\\ltimes U_{M,N}(F),\\chi_{M,N})$-equivariant\n  $D$-modules on $\\mathrm{Gr}_N$, and $D$-modules on the mirabolic subgroup $\\mathrm{Mir}_L(F)$ —\n  never a matrix space. Corroborates BZSV p. 170's \"the dual is $\\check X=\\mathrm{Mat}_{m\\times n}$\".\n- **(no `refs.bib` key)** — B. da Silveira Dias, *Rankin-Selberg duality via gluing*,\n  arXiv:2607.22965 (25 Jul 2026). **Abstract only, from the web — a lead.** Computes the relative\n  Langlands dual of the hyperspherical $(\\mathrm{GL}_n\\times\\mathrm{GL}_m)$-variety\n  $T^*(\\mathrm{Hom}(\\mathbb{C}^m,
