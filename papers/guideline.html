pp. 21–22 (§1.6 Thm. 1.6.1 over $\\mathbb{C}$, §1.7 Thm. 1.7.1 Witt-vector case);\n  **p. 23** (the §2 standing setting — $F=k((t))$, $\\mathcal{O}=k[[t]]$, $k$ algebraically closed,\n  $\\underline{G}=G\\otimes_k\\mathcal{O}$ constant reductive — with (2.1.1), (2.1.2) and the definition\n  of $t^\\mu$); **pp. 24–25** (**Prop. 2.1.5**: $\\mathrm{Gr}_\\mu$ a single $L^+G$-orbit, smooth\n  quasi-projective of dimension $(2\\rho,\\mu)$; $\\mathrm{Gr}_{\\le\\mu}$ its Zariski closure and a\n  projective variety; both with the reduced structure, defined on p. 24); **p. 26** ((2.1.10) and\n  **Cor. 2.1.11**, the parity of components; Ex. 2.1.8, Lem. 2.1.13); pp. 29–31 (§2.2 sub-ind-schemes,\n  §2.3 Birkhoff decomposition); pp. 58–61 (§5.1–§5.2, the Satake category); **pp. 93–95** (the\n  bibliography). *Taken into the closed world:* the new entry\n  [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](../appendix/bb-zhu-pi0-cartan.html), five clauses; and\n  Rem. 1.3.8 as the one page-level citation inside\n  [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../appendix/fp-convolution-morphism.html).\n  **What was hunted for and not found** — the labelling of the connected components of $\\mathrm{Gr}$\n  by coweights, i.e. that the component of $t^\\mu$ is $\\mu+Q$. Thm. 1.3.11(1) asserts a *canonical*\n  isomorphism and never says what it does to $t^\\mu$; (2.1.10) with Cor. 2.1.11 is only its mod-$2$\n  shadow. Zhu's bibliography (p. 94) resolves the reference he calls ultimate for Thm. 1.3.11 to\n  **G. Pappas, M. Rapoport, *Twisted loop groups and their affine flag varieties*, Adv. Math. 219\n  (2008) 118–198** (appendix by Haines–Rapoport) — where the isomorphism is the Kottwitz homomorphism\n  and the normalization on a split torus can be checked. **Not on disk, no `refs.bib` key**, and note\n  that `pappas2013local` is Pappas–**Zhu** on local models of Shimura varieties and is not it. That\n  fetch is the page-level check still owed on\n  [Zhu: the Cartan decomposition, $\\dim\\mathrm{Gr}^\\mu$ and $\\pi_0(\\mathrm{Gr})$, over the standing $k$](../appendix/bb-zhu-pi0-cartan.html).\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — printed **pp. 15–16** read this run: **§3.16 *Correspondences\n  for prestacks*** (the prestack definition of *finitely presented*, and the base-change-compatible\n  $f_{*,!-dR}$ for any finitely presented morphism of prestacks) with **Rem. 3.16.1** (schematic is\n  meant *classically*, a more forgiving notion than the derived one), and §3.17 with Prop. 3.17.2 on\n  the same pages. §3.16 is now clause (iv) of\n  [Raskin: pushforward along a finitely presented morphism of ind-schemes](../appendix/bb-raskin-fp-pushforward.html),\n  and it **withdrew** that entry's previous claim that the statement never reaches quotient stacks.\n\n### Added by `/examples` — Q1-L3, second run (hypothesis (C): finite presentation and exhaustion)\n\nAppended, not substituted for the entries above: the pages read on 2026-08-08 for the post-u3\nstatement, whose new declared hypothesis (C) was the target.\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4 **pp. 9–10 and 20–23** read in full this run.\n  Settles the range question u3 raised. §2.1 (p. 9): the standing $X=G/K$ is **homogeneous**; §5.1\n  (p. 20) constructs the affine degeneration with $\\mathcal{X}^\\bullet\\subset\\mathcal{X}$ the\n  fibrewise **open $G$-orbit**, and states that the preimages of $\\pi_\\lambda$ *and* $\\pi^\\bullet_\\lambda$\n  over $\\mathbb{G}_m$ are both $X\\times\\mathbb{G}_m$ — i.e. $X=X^\\bullet$ in their setting.\n  **Lemma 34** (p. 20): $LX_\\lambda\\cong LX\\times_{f_\\lambda,L\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$,\n  proved from [SW22, Lem. 2.3.10]. **Thm 36** (p. 21) is proved \"For any $\\lambda\\in\\Lambda_S^+$\" —\n  so over the source's *full* index set, which for a homogeneous $X$ is all orbits; the restriction\n  is in the variety class, not the quantifier. **Rem. 37** (p. 22) verbatim widens the class only.\n  **Prop. 39(ii)** (p. 23): $LX\\cong\\operatorname{colim}_{\\underline\\lambda}\\overline{LX}_{\\underline\\lambda}$\n  over the full $\\underline\\Lambda_S^+$ — this is the printed form of the exhaustion half of\n  Q1-L3's (C), for homogeneous $X$, and it rests on **Lemma 38** (symmetric, $K$ connected).\n- **(no `refs.bib` key)** — Bouthier, Ngô, Sakellaridis, *On the formal arc space of a reductive\n  monoid*, Amer. J. Math. **138** (2016) 81–108, arXiv:1412.6174. Pp. 1–4 and 9–12 read. **p. 3**:\n  Def. 1.1 (finite-dimensional formal model) and, above it, the definition of a **non-degenerate**\n  arc — one generically mapping into a smooth dense open $X^\\circ$ — with\n  $\\mathscr{L}^\\circ X(k)=\\mathscr{L}X(k)-\\mathscr{L}Z(k)$, $Z=X\\setminus X^\\circ$ **(1.3)**. **p. 12**\n  (§3, toric case): $\\mathscr{L}^\\circ X$ \"is represented by an open subscheme of $\\mathscr{L}X$\n  which is the complement of $\\mathscr{L}(X-T)$\", with (3.5) $\\mathscr{L}^\\circ X(k)=X(\\mathcal{O})\\cap T(F)$\n  and (3.6) $X(\\mathcal{O})\\cap T(F)=\\bigsqcup_{\\lambda\\in\\mathfrak{c}}T(\\mathcal{O})t^\\lambda$.\n  This is the sourced name for the locus Q1-L3's (C2) must absorb. **Footnote 1, p. 3**: the\n  perverse-sheaf foundations of Bouthier–Kazhdan are likewise built on non-degenerate arcs only —\n  so both natural homes for a (C2)-type statement exclude the boundary locus by construction.\n  Prop. 1.2, Prop. 2.1, Prop. 2.2 also read.\n- **[`BZSV`](../../papers/BZSV.pdf)** — **pp. 155–158** read this run. §7.3.1 p. 155: the *placid case* exhaustion\n  $X_F=\\varinjlim X^l$, $X^l=\\varprojlim_nX^l_n$, the bullet list of cases ($M_n$, $\\mathbb{A}^2$\n  under $\\mathrm{SL}_2$, the group period, $\\mathrm{GL}_n$ under $\\mathrm{GL}_n\\times\\mathrm{GL}_{n-1}$,\n  $\\mathrm{GL}_n\\times\\mathbb{A}^n$, $\\mathrm{SO}_n$), and the remark that for $X=H$ \"we can take the\n  $X^l$ to come from strata of the affine Grassmannian\"; **footnote 57** ($G_O$-orbit closures can\n  be singular even for $X$ a vector space). **p. 156**: placidity of $X_F$ for all smooth $X$ \"seems\n  possible\" by Drinfeld's techniques, \"cf. [CN24, §8.1]\", and \"the details of this have not appeared\n  in print at the time of typing this sentence\" — the named home of the general statement, and it is\n  not in print. **Ex. 7.3.5 p. 158**: $X^l_n(R)=t^{-l}R[t]/t^n$ for Iwasawa–Tate, i.e. the exhaustion\n  of $L\\mathbb{A}^1$ by the orbit closures $t^{-l}\\mathcal{O}$.\n- **(no `refs.bib` key)** — Aizenbud, Sayag, arXiv:1709.08214. **pp. 1–2 re-read this run** and\n  **Theorem A quoted verbatim**: rank $2^{\\dim(V)-1}$, confirming the rank recorded in the Q1-L3 and\n  Q1-a1 entries above. §1.2: \"One can not expect that the conclusion of the Theorem holds for any\n  spherical space.\"\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — p. 4 re-verified this run: (2.1) $\\mathcal{G}r=\\varinjlim\\mathcal{G}r_n$\n  with $\\mathcal{G}r_n$ finite-dimensional and $G_{\\mathcal{O}}$-invariant; orbits $\\mathcal{G}r^\\lambda=G_{\\mathcal{O}}\\cdot L_\\lambda$\n  indexed by $W$-orbits in $X_*(T)$; (2.2) $\\mathcal{G}r^\\mu\\subset\\overline{\\mathcal{G}r^\\lambda}$\n  iff $\\lambda-\\mu$ is a sum of positive coroots.\n\n### Added for gap g1 — Q1-L5-L3 (a *stack-level* source for finite orbits ⟹ holonomic), 2026-08-09\n\nFetched at the user's instruction in answer to\n[`gaps/g1.md`](../nodes/Q1/Q1-L5/Q1-L5-L3/gaps/g1.html), which asked for\ncoherence-preservation stated about the quotient stack and not about the ind-scheme. This\nis the source that states it there.\n\n- **[`gunningham2017deriveddecompositionequivariant`](../../papers/gunningham2017deriveddecompositionequivariant.pdf)** — Gunningham, *A Derived Decomposition\n  for Equivariant $D$-modules*, arXiv:1705.04297**v4**, 7 Jul 2025, 37 pp. Key added to\n  `refs.bib` on this run; the PDF is on disk under that key. Read at page level 2026-08-09.\n\n  **Rem. 2.28 (p. 18)** — quoted: \"When $X$ is a finite orbit stack (for example, a quotient\n  stack $Y/K$ where $K$ acts on $Y$ with finitely many orbits), every coherent complex on $X$\n  is regular holonomic.\" This is the clause\n  [equivariant coherent with finitely many orbits is holonomic](../appendix/bb-equivariant-finite-orbits-holonomic.html)\n  currently leaves to \"the citing node's own work\": that entry is HTT §11.6, about equivariant\n  coherent modules on a *variety*, and says in as many words that nothing is asserted about\n  $\\mathcal{D}_c$ on a quotient prestack. Gunningham asserts it about the stack.\n\n  **Rem. 2.25 (p. 17)** — quoted: \"Although coherent complexes are not always preserved by the\n  $D$-module functors, the holonomic subcategory is preserved (for safe morphisms)\", giving the\n  six functors and the adjoint pairs $(f^*,f_*)$, $(f_!,f^!)$ on holonomic complexes for any\n  safe $f$. Same shape as\n  [$!$-restriction preserves holonomicity](../appendix/bb-htt-holonomic-shriek.html),\n  one level up.\n\n  **What carries the two together.** On a finite-orbit stack Rem. 2.28 gives\n  $\\mathcal{D}_c=\\mathcal{D}_{\\mathrm{hol}}$, Rem. 2.25 carries $f^!$ across, and\n  $\\mathcal{D}_{\\mathrm{hol}}\\subseteq\\mathcal{D}_{\\mathrm{coh}}$ holds by the definition\n  Rem. 2.25 opens with — so the composite lands back in $\\mathcal{D}_c$. Finiteness of the\n  orbit set is needed on the **target** only.\n\n  **Three hypotheses a citing entry owes, none of them free.**\n\n  *Safe is not proved to include representable here.* p. 16 defers to [DG13, Def. 10.2.2] and\n  says only that \"the safe morphisms appearing in this paper will always be composites of a\n  representable morphism and a unipotent gerbe\" — a sentence about this paper's scope, not a\n  theorem. An entry wanting *representable ⟹ safe* cites Drinfeld–Gaitsgory directly.\n\n  *Prop. 2.20 (p. 16) does **not** give what is wanted.* It gives $f^!$ preserving coherence for\n  $f$ **smooth** of relative dimension $d$, and $f_*$ preserving it for $f$ proper. The closed\n  immersion is absent, which is the whole point: it is reachable only through Rem. 2.28, never\n  through 2.20.\n\n  *Finite type throughout, and over $\\mathbb{C}$.* $G$ is a connected complex reductive group\n  (§1.1, p. 1); every stack here is a finite-type quotient stack. Nothing reaches an\n  $L^+G$-quotient of a placid ind-scheme, where the step\n  $\\mathcal{D}_{\\mathrm{hol}}\\subseteq\\mathcal{D}_{\\mathrm{coh}}$ fails — Raskin's\n  $\\mathcal{D}_{\\mathrm{hol}}:=\\mathrm{Ind}(\\mathcal{D}_{\\mathrm{coh},\\mathrm{hol}})$ with\n  Rem. 5.1.1, p. 30. So this source discharges the **chart-level** obligation of\n  [Q1-L5-L3-L4](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L4/index.html) and\n  leaves the placid ambient case exactly where it was.\n\n  **Rem. 2.26 and Ex. 2.27 (p. 18)** corroborate the repository's own convention: $\\mathcal{D}_{\\mathrm{com}}\\subseteq\\mathcal{D}_{\\mathrm{coh}}$\n  strictly for a non-safe stack, with $\\mathrm{pt}/T$ the witness — note (ii) of\n  [coherent $\\mathcal{D}$-modules](../appendix/defn-coherent-d-mod.html) says the\n  same with $BG$.\n\n### Added for gap g1 — the two Drinfeld–Gaitsgory papers, and which one defines *safe*, 2026-08-09\n\nFetched at the user's instruction, immediately after the Gunningham entry above, because\nthat paper defers the definition of a **safe** morphism to \"[DG13, Definition 10.2.2]\" and\nthe closed world had no such definition. The first thing the fetch established is that the\nrepository was pointing at the wrong paper.\n\n**They are two different papers and the literature cites them a year apart.** Gunningham's\n`[DG13]` is *On Some Finiteness Questions for Algebraic Stacks* (GAFA 2013) — verified in\nhis bibliography, p. 34 of the arXiv PDF — and **not** the compact-generation paper, which\nis [DG15]. The compact-generation paper does not define safety either: it cites\n\"[DrGa, Sect. 9.2]\" and \"[DrGa, Proposition 9.2.3]\" for it, `[DrGa]` being the GAFA paper.\n\n- **[`drinfeld2013some`](../../papers/drinfeld2013some.pdf)** — Drinfeld–Gaitsgory, *On some finiteness questions for algebraic\n  stacks*, GAFA **23** (2013) 149–294, arXiv:1108.5351**v3**, 26 Oct 2012, 124 pp. Key was\n  already in `refs.bib`; the **PDF is new on this run**. Read at page level 2026-08-09.\n\n  **Def. 10.2.2, p. 112** — quoted: \"(a) An algebraic stack $\\mathcal{Y}$ is *locally safe*\n  if for every geometric point $y$ of $\\mathcal{Y}$ the neutral connected component of its\n  automorphism group, $\\mathrm{Aut}(y)$, is unipotent. (b) A morphism of algebraic stacks is\n  locally safe if all its geometric fibers are. (c) An algebraic stack (resp. a morphism of\n  algebraic stacks) is *safe* if it is quasi-compact and locally safe.\"\n\n  **§11.2.1, p. 122** — quoted: \"In particular, **a quasi-compact representable morphism is\n  safe**.\" This is the sentence Gunningham deferred to, and it is what the response pasted\n  on 2026-08-08 asserted without a citation. A representable morphism has trivial geometric-fibre\n  automorphism groups, hence is locally safe; quasi-compactness is the second half of (c) and is\n  a hypothesis, not a freebie.\n\n  **Thm. 10.2.4, p. 112**: for $\\pi$ quasi-compact, $\\pi_{dR,*}$ is continuous **iff** $\\pi$ is\n  safe — so safety is not a technical convenience but exactly the continuity condition.\n\n  **Cor. 10.2.7, p. 113**: for a quasi-compact stack $\\mathcal{Y}$, the conditions\n  $\\mathcal{D}\\text{-mod}(\\mathcal{Y})^c=\\mathcal{D}\\text{-mod}_{\\mathrm{coh}}(\\mathcal{Y})$,\n  $k_{\\mathcal{Y}}$ compact, $\\Gamma_{dR}$ continuous, and $\\mathcal{Y}$ safe are all\n  equivalent. This is the **sourced** form of note (ii) of\n  [coherent $\\mathcal{D}$-modules](../appendix/defn-coherent-d-mod.html),\n  which currently asserts *coherent $\\ne$ compact on stacks* from main.tex:786–793 alone,\n  and it is also what stands behind Gunningham's Rem. 2.26 and Ex. 2.27.\n\n- **[`drinfeld2015compactgeneration`](../../papers/drinfeld2015compactgeneration.pdf)** — Drinfeld–Gaitsgory, *Compact generation of the\n  category of $D$-modules on the stack of $G$-bundles on a curve*, Camb. J. Math. **3**\n  (2015) 19–125, arXiv:1112.2402**v5**, 11 Jan 2013, 77 pp. **Key added to `refs.bib` on this\n  run**, which retires the \"(no `refs.bib` key)\" the Q1-L5 entry above carried; that entry's\n  findings are unchanged. Not the safety source — see above. What it does carry, and what the\n  earlier entry already recorded, is the negative control for stratumwise generation over an\n  infinite stratification (Thm. 12.1.1 with Ex. 12.1.2).\n\n### Added by `/prove` — Q1-L3 (round 1, clause (iv): reduced structures on an ind-scheme)\n\nThree sources were wanted and **none is on disk**; they are recorded here as the reading list for\n[gap g1](../nodes/Q1/Q1-L3/gaps/g1.html), not as anything checked.\n\n- **Gaitsgory–Rozenblyum, *A study in derived algebraic geometry*, Vol. II, Ch. 2 (ind-schemes)** —\n  wanted for the reduction $Y_{\\mathrm{red}}$ of an ind-scheme: that it exists, does not depend on\n  the presentation, and is the largest reduced closed sub-ind-scheme. Only Volume I has a\n  `refs.bib` key ([`GR17vol1`](../../papers/GR17vol1.pdf)) and only Volume I is in `papers/`.\n- **Beilinson–Drinfeld, *Chiral Algebras*, §7.11** — the same material in the older idiom; no\n  `refs.bib` key.\n- **`drinfeld_infinite_vectorbundle`** — has a key, is *not* in `papers/`. Wanted for the point\n  that clause (iv) actually turns on: whether the transition maps of a placid presentation may be\n  taken surjective, which is what would let a $k$-point of a stage lift to the limit and so make\n  geometric points detect a closed sub-ind-scheme. [placidity](../appendix/placid-ind-scheme.html)\n  currently asks only \"smooth and affine\".\n\n### Added by `/examples` — Q2-L5-L2 (the pushforward along $\\pi_\\lambda$ is the Hecke word)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-09.\n\n- **[`zhu2016introduction`](../../papers/zhu2016introduction.pdf)** — arXiv:1603.05593, pp. 10–13, 27–28, 58–62 read this run. **The classical\n  form of the node's clauses (1)–(3), in the group case.** (1.2.12)–(1.2.15): the convolution\n  Grassmannian, the untwisting isomorphism $(\\mathrm{pr}_1,m)\\colon\\mathrm{Gr}\\widetilde\\times\\mathrm{Gr}\n  \\cong\\mathrm{Gr}\\times\\mathrm{Gr}$, the $n$-fold convolution map and its stagewise projections —\n  the tower of Q2-L5-L1, and clause (1). **(5.1.3)** with the sentence after it (p. 58):\n  $\\mathcal{A}_1\\star\\mathcal{A}_2 := m_!(\\mathcal{A}_1\\widetilde\\boxtimes\\mathcal{A}_2)$, \"*Similarly,\n  one can define the $n$-fold convolution product … using the $n$-fold convolution map (1.2.15). Note\n  that since $m$ is ind-proper, $m_! = m_*$*\" — clause (3); p. 60, the associativity constraints from\n  identifying $(\\mathcal{A}_1\\star\\mathcal{A}_2)\\star\\mathcal{A}_3$ with the three-fold product —\n  clause (2). Neither is stated as a proposition: on ind-schemes of ind-finite type the composition\n  of $*$-pushforwards that is the node's hypothesis **(A)** is free, which is the whole gap. Also\n  **Cor. 5.1.5** (multiplicity spaces as $H_c^\\bullet$ of the fibres of $m$, a computation that uses\n  the $n$-fold formula), **Lemma 2.1.13** (minuscule $\\Rightarrow\\mathrm{Gr}_{\\le\\mu}\\cong G/P_\\mu$),\n  **Ex. 2.1.16** ($\\mathrm{SL}_2$: $\\mathrm{Gr}_{\\le\\alpha^\\vee}$ is the projective cone over a conic),\n  **(2.1.17)** with **Ex. 2.1.18** and (2.1.19)–(2.1.20) (\"*the convolution map $m$ in this case\n  extends the Springer resolution for $\\mathrm{GL}_n$*\") — the sourced $\\mathrm{GL}_2$ Bott–Samelson\n  word.\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 12–16 read this run. **(4.1)–(4.2)**: the convolution diagram and\n  $\\mathcal{A}_1*\\mathcal{A}_2 = Rm_*\\widetilde{\\mathcal{A}}$ with $q^*\\widetilde{\\mathcal{A}} =\n  p^*({}^p\\!H^0(\\mathcal{A}_1\\boxtimes^L\\mathcal{A}_2))$ — the node's hypothesis **(C)** in print as a\n  *construction* by descent along the free $G_{\\mathcal{O}}$-action, and with $p^*$ rather than $p^!$.\n  **Remark 4.5** with **Prop. 4.6**: the three-fold product and the canonical isomorphisms\n  $\\mathcal{A}_1*\\mathcal{A}_2*\\mathcal{A}_3\\cong\\mathcal{A}_1*(\\mathcal{A}_2*\\mathcal{A}_3)$ — clause\n  (2) at $r=2$, again asserted rather than proved. Lemma 4.4 (semismallness of $m$) is not what this\n  node needs and was not used.\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — pp. 8–16 and 33–34 read this run, for hypothesis **(A)**.\n  **§3.8 with Prop. 3.8.1**: $\\widetilde D^{!,\\mathrm{enh}}$ is a functor out of qcqs schemes *under\n  correspondences* with finitely presented right leg, so composition holds by functoriality; **§6.3**\n  says the same upgrade holds \"*from the categories of indschemes under correspondences*\". **§3.16,\n  titled \"Correspondences for prestacks\", states only existence and base-change compatibility** — no\n  correspondence category, no composition. The nearest miss is inside the proof of **Lemma 3.13.1**\n  (p. 14), where for an *affine* finitely presented morphism of prestacks $f_{*,!-\\mathrm{dR}}$ is said\n  to be **characterized** by base change plus agreement in finite type; a characterization would force\n  composition, but the node's $q$ and $\\theta_i$ are not affine. This is the precise home of hypothesis\n  **(A)** and it demonstrably does not contain it, exactly as\n  [Raskin: pushforward along a finitely presented morphism of ind-schemes](../appendix/bb-raskin-fp-pushforward.html)\n  records.\n- **Raskin, *Homological methods in semi-infinite contexts*, arXiv:2002.01395** (**no `refs.bib` key**,\n  not on disk) — located by web search as the plausible next home for a six-functor package on placid\n  stacks strong enough to give hypothesis **(A)**. Abstract only; nothing verified at page level, and\n  nothing from it is used.\n\n### Added by `/examples` — Q2-L5-L1 (every stage of the convolution tower is finitely presented)\n\nAppended, not substituted for the entries above — including the Q2-L5-L2 block immediately above,\nwhich read some of the same Zhu pages for a different clause. Pages read 2026-08-09.\n\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — printed **pp. 15–17, 33–36, 37–40** read this run. **§6.13\n  (p. 40) is the trap, and it is real**: *ind-finitely presented* is defined there as a\n  colimit-level condition (\"$T=\\operatorname{colim}T_i$ with each $T_i\\to T$ a reasonable subscheme\n  such that $T_i\\to S$ factors through a reasonable subscheme $S_i$ of $S$ with $T_i\\to S_i$ finite\n  presentation\"), introduced only to transport a dimension theory, and it is **not** the schematic\n  condition of §6.3/§3.16. Table 1 (p. 3) uses §6.13's word for the row that §3.9/§6.3 prove under\n  §6.3's word. A node citing\n  [Raskin: pushforward along a finitely presented morphism of ind-schemes](../appendix/bb-raskin-fp-pushforward.html)(iv)\n  is citing §3.16 and does **not** inherit §6.13's hypothesis — verified on the page. Also\n  **Lemma 6.4.6 (p. 34)**, whose proof invokes the two-out-of-three principle for finite presentation,\n  \"[Gro] Proposition 1.6.2\" — the cancellation clauses (2)–(3) of the node will need, in print in\n  this exact setting; and **§6.4** (reasonable subschemes: the embeddings of finite-type closed\n  subschemes of an ind-scheme of ind-finite type are finitely presented). *Negative half:* the paper\n  has no affine-Grassmannian, loop-group or convolution material anywhere in §1–§6, so it is the home\n  of the notion and of no verification.\n- **[`chen2024real`](../../papers/chen2024real.pdf)** — Chen–Nadler, arXiv:2403.13995, printed **pp. 1–2, 51–52, 55–58** read this run.\n  **The closest thing in print to the node's clauses (1)–(2), and it is inside a proof.** In the proof\n  of **Thm. 13.3 (p. 57)**: for a placid presentation $X(\\mathcal{K})=\\operatorname{colim}_i\\lim_jY^i_j$,\n  the action map $a\\colon Y^i\\times^{G(\\mathcal{O})}\\overline{G(\\mathcal{O})t^\\lambda G(\\mathcal{O})}\\to\n  X(\\mathcal{K})$ lands in a later stage $Y^{i'}$, the induced map \"*is a proper morphism*\", and by\n  [EGA-IV, Thm. 8.10.5] it is the base change along a Cartesian square of a **proper morphism of\n  finite-type schemes** $\\bar a\\colon Z_j\\to Y^{i'}_j$. That is the stagewise geometric content of\n  clause (1). What it is not: a numbered statement; a finite-presentation statement (properness plus\n  Noetherian descent is what is asserted); a statement about the unbounded $\\overline{m}_F$, about the\n  tower $\\rho_i$ for $i<r$, about $\\theta_i$, or about $\\mathcal{D}^!$. Setting: $X$ a **complex\n  symmetric** variety (abstract, p. 1), narrower than the node's smooth affine $X$ of finite type.\n  Also **§11.1 (p. 51)**, the convolution/action diagrams on $K(\\mathcal{K})\\backslash G(\\mathcal{K})\n  \\times^{G(\\mathcal{O})}\\mathrm{Gr}$ — the diagram written down with no representability or\n  finiteness claim attached. *Note:* the paper has **two** keys in `refs.bib`, [`chen2024real`](../../papers/chen2024real.pdf)\n  (line 923) and `chen2024realgroupssymmetricvarieties` (line 1622); the PDF on disk is the former.\n- **[`zhu2016introduction`](../../papers/zhu2016introduction.pdf)** — printed **pp. 10–13, 27–29, 58–62** read this run (overlapping the\n  Q2-L5-L2 block above; the findings taken here are different). For this node: **(1.2.14)** (p. 13),\n  the untwisting isomorphism $(\\mathrm{pr}_1,m)\\colon\\mathrm{Gr}\\widetilde\\times\\mathrm{Gr}\\cong\n  \\mathrm{Gr}\\times\\mathrm{Gr}$ — the printed group-case form of step (b) of\n  [$L^+X\\hookrightarrow LX$ and the bounded convolution morphism $m_F$ are finitely presented](../appendix/fp-convolution-morphism.html),\n  and the mechanism of clause (1) **and** of the boundary case (with $F$ infinite the same untwisting\n  turns the base change into $\\mathrm{Gr}\\times S\\to S$, not schematic by **Thm. 1.2.2**, p. 10);\n  **p. 28**, \"$\\mathrm{Gr}_{\\le\\mu_1}\\widetilde\\times\\mathrm{Gr}_{\\le\\mu_2}$ … *is closed in\n  $\\mathrm{Gr}\\widetilde\\times\\mathrm{Gr}$ and therefore is representable*\" with the iterated\n  $\\mathrm{Gr}_{\\le\\mu_\\bullet}$ and **(2.1.17)** — representability of every stage $Z^{(i)}$, and the\n  quotient half of clause (2) at $X=H$ under $H\\times H$; **Prop. 1.3.2(2)** (p. 13), $L^+\\underline X\n  \\subset LX$ a closed subscheme, the closedness (not the finite presentation) of clause (1) of the\n  appendix entry. *Negative half, worth recording:* Zhu never applies the words *finitely presented*\n  to any of these maps, and his target is always $\\mathrm{Gr}$, ind-of-**finite** type — so the step\n  that costs work for a loop space of a variety is absent from the group-case source.\n- **(no `refs.bib` key)** — Cautis, Williams, *Tamely presented morphisms and coherent pullback*,\n  arXiv:2306.03119v2, Math. Z. (2025), doi:10.1007/s00209-025-03872-x. Abstract only. Introduces\n  *tamely presented* as a weakening of finitely presented \"*motivated by the study of convolution\n  products in the double affine Hecke category and related categories in the theory of Coulomb\n  branches*\" — independent evidence that finite presentation is known to be delicate for convolution\n  in infinite type. Coherent sheaves, not $\\mathcal{D}$-modules; nothing about $\\overline{m}_F$ was\n  located, and nothing from it is used.\n\n### Added by `/examples` — Q2-L5-L4 (the coherence of the Hecke letters; GAP (Coh))\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-09.\n**This run found the missing coherence fact in print**, for algebraic stacks, and the two sources\nbelow are what a `/decompose` writing the appendix entries should transcribe.\n\n- **[`drinfeld2013some`](../../papers/drinfeld2013some.pdf)** — Drinfeld–Gaitsgory, GAFA **23** (2013) 149–294, arXiv:1108.5351. PDF on\n  disk; pp. 1–4, 14–15, 76–82, 120–122 read this run. **§7.3.1, p. 80** is\n  [coherent $\\mathcal{D}$-modules](../appendix/defn-coherent-d-mod.html)\n  verbatim, and adds that it suffices to test on quasi-compact or affine $S$, and **on one smooth\n  atlas alone**. **§7.3.2, p. 80**, first sentence: \"*The object $k_{\\mathcal{Y}}\\in$ D-mod$(\\mathcal{Y})$\n  is always in D-mod$_{\\mathrm{coh}}(\\mathcal{Y})$*\" — clause (1) of Q2-L5-L4, with no smoothness,\n  finite-orbit or quasi-compactness hypothesis on $\\mathcal{Y}$. **Prop. 10.6.2, p. 120**: proper\n  pushforward between algebraic stacks preserves coherence — clause (2). **§7.1.1, p. 76** defines\n  $k_{\\mathcal{Y}}$ by $g^{*}_{\\mathrm{dR}}k_{\\mathcal{Y}} = k_Z$, the construction the blueprint's\n  constant-object entry records. **§7.1.4, p. 77 and §7.2.4, p. 78** are the source of main.tex:788's\n  \"coherent but not compact\" example, which the manuscript states with no citation. **Def. 1.1.3,\n  p. 14** is the hypothesis a citing node must transport: an algebraic stack has a *smooth* DG-scheme\n  atlas, and $\\overline{\\mathrm{Gr}}_\\nu\\to L^{+}G\\backslash\\overline{\\mathrm{Gr}}_\\nu$ is only\n  pro-smooth. Also Lemma 7.3.3 (compact $\\subset$ coherent) and Cor. 10.2.7 (equality iff safe).\n- **[`gunningham2017deriveddecompositionequivariant`](../../papers/gunningham2017deriveddecompositionequivariant.pdf)** — arXiv:1705.04297v4. PDF on disk; pp. 1–3,\n  15–18 read this run. **Prop. 2.20(1), p. 16**: for a safe morphism of quotient stacks, \"*If $f$ is\n  proper, then $f_{*}\\simeq\\mathbb{D}_Yf_{*}\\mathbb{D}_X$ preserves coherence and is right adjoint to\n  $f^{!}$. We sometimes write $f_!$ instead of $f_*$ in that case*\" — clause (2) again, and the printed\n  identification of $\\overline{\\iota}_{\\nu!}$ with $\\overline{\\iota}_{\\nu,\\mathrm{dR},*}$. Its proof\n  cites DG for part (1) as \"Theorem 10.6.2\"; DG print it as a **Proposition** — a numbering\n  discrepancy worth carrying. **§2.5, p. 18**: \"*the functor $p^{!}\\colon\\mathbf{Vect}\\to\\mathbf{D}(X)$\n  does not preserve compact objects, but it does preserve coherent objects*\" — the same fact for\n  $\\omega_X$; it passes to $k_X$ only through $p^{*} = p^{!}[-2\\dim X]$, so unlike DG §7.3.2 it does\n  **not** reach a singular $X$. Ex. 2.18, p. 15 and Ex. 2.27, p. 18 give $\\mathbf{D}_{coh}(pt/K)$\n  explicitly. Checked and **negative** as a home for the convolution clauses (3a)/(4a): the paper is\n  about blocks of the adjoint equivariant category on a reductive Lie algebra (Thms A–E, pp. 1–3).\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — contents p. 1, Table 1 p. 3, §5 pp. 30–33 reread. The\n  informative negative, confirming the 2026-08-06 record: the paper has **no coherence subcategory in\n  infinite type at all**. §5.2, p. 30 defines $D_{coh}(S)$ only for $S$ of finite type, as \"the compact\n  objects in $D(S)$\", and Kan-extends *holonomicity* instead; footnote 6, p. 31 says the infinite-type\n  holonomic condition \"completely ruins all the nice finiteness conditions that 'usual' (coherent)\n  holonomic complexes satisfy\". Cor. 5.5.2, p. 33 ($f_{*,ren}$, $f^{!,ren}$ preserve holonomic objects\n  for placid schemes) is the nearest preservation statement and is not about $\\mathcal{D}_c$.\n- **[`zhu2016introduction`](../../papers/zhu2016introduction.pdf)** — pp. 26–29 reread for the instances: **Lemma 2.1.13, p. 27** (minuscule\n  $\\Rightarrow\\mathrm{Gr}_{\\le\\mu}\\cong G/P_\\mu$, \"*Examples include the usual Grassmannians\n  $\\mathrm{Gr}(r,n)$, smooth quadrics …*\"), **Ex. 2.1.16, p. 27** ($\\mathrm{SL}_2$: the projective cone\n  over $\\{x^2 = yz\\}$), **Lemma 2.1.14, p. 27** (the cone description and the resolution\n  $\\mathbb{P}(\\mathcal{L}_\\theta\\oplus\\mathcal{O})$), **Thm. 2.1.21, p. 28** (normal, Cohen–Macaulay,\n  Gorenstein, rational singularities), Ex. 2.1.8 and Ex. 2.1.12 (the $\\mathrm{GL}_n$ lattice picture).\n- **[`BZSV`](../../papers/BZSV.pdf)** — pp. 165–167 read this run. **Lemma 7.5.13, p. 167** and its proof argue about \"*the full\n  subcategory [the basic object] generates under the Hecke action*\", which is the target of\n  Q2-L5-L4(4b) as a construction in print; §7.5.10, p. 166 mentions \"safe\" sheaves. Nothing there\n  asserts coherence of a Hecke translate, so clause (4a) is untouched.\n\n### Added by `/examples` — Q2-L5-L3 (base change to a stratum, support, and the costalk)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-09.\n**The run's find is the fibrewise-to-costalk bridge, located in two halves at two generalities.**\n\n- **Thomas J. Haines, *Equidimensionality of convolution morphisms and applications to saturation\n  problems*, Adv. Math. **207** (2006) 297–327** (**no `refs.bib` key** — the two `haines*` keys there\n  are the test-function papers; **not on disk**, read from\n  [math.umd.edu/~tjh/equidim10.pdf](https://www.math.umd.edu/~tjh/equidim10.pdf), printed pp. 1–8).\n  **§2.1, p. 5**, verbatim: \"*The projection onto the last coordinate gives the proper surjective\n  birational morphism $m_{\\mu_\\bullet}:\\widetilde{\\mathcal{Q}}_{\\mu_\\bullet}\\to\\overline{\\mathcal{Q}}_{|\\mu_\\bullet|}$*\"\n  — the group-case verification of Q2-L5's hypothesis **(a)**, image included, and the birationality\n  that pins $n_\\lambda=0$. **Lemma 2.1, p. 6** with definition (2.2.1), p. 6: $m_{\\mu_\\bullet}$ is\n  \"*Zariski-locally trivial in the stratified sense*\", i.e. $m^{-1}(V)\\cong F\\times V$ over a\n  Zariski-open $V$ of each stratum — **the printed form of the passage from fibrewise cohomology to a\n  costalk on a stratum**, which [r1](../nodes/Q2/Q2-L5/critiques/r1.html) (Flaw 8) records as\n  missing. It is finite type and group case only. Also p. 2 (\"projective, birational, and semi-small\n  and locally-trivial in the stratified sense; see [MV1], [NP] and §2.2\"), Thm. 2.2 (p. 7, geometric\n  Satake weak form: $\\dim V^\\lambda_{\\mu_\\bullet}$ = number of top-dimensional components of the fibre),\n  Thm. 3.1 (p. 8, equidimensionality for minuscule tuples).\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, printed **pp. 1–9, 51–53, 56–62** read this run.\n  **Example 108, p. 62 is the other half of the bridge and is the answer to \"what is a local system on\n  an infinite-dimensional orbit\":** for $H$ placid and $\\mathcal{O}=H\\cdot y$ with stabilizer $S$,\n  $\\mathcal{O}\\cong\\varprojlim_j H_j/S_j$ is a placid scheme and\n  $\\mathrm{Rep}(\\pi_0(S_j))\\cong\\mathrm{Perv}(H\\backslash\\mathcal{O})\\cong\\mathrm{Shv}(H\\backslash\\mathcal{O})$,\n  $\\xi\\mapsto\\mathcal{L}_{\\xi,\\mathcal{O}}=\\pi_j^{*}\\mathcal{L}_\\xi$; (48)–(53) give the standard,\n  costandard and IC objects and their Verdier duals. **Lemma 106, p. 59**: $f^{!}\\mathbb{D}_Y\\cong\n  \\mathbb{D}_Sf^{*}\\langle2\\dim_f\\rangle$ and $\\mathbb{D}_Yf_!\\cong f_*\\mathbb{D}_S\\langle2\\dim_f\\rangle$\n  for finitely presented $f$ between locally equidimensional $H$-placid schemes — the $*$/$!$ exchange\n  Flaw 5 of that critique asks for. **A.5(3), p. 58** is the natural home for base change on placid\n  stacks and *demonstrably does not contain it*: it asserts $f_*,f_!,f^{*},f^{!}$ for finitely presented\n  representable morphisms and no compatibility at all. Also **§1.2.3, p. 7** ($L^{+}G$-equivariant local\n  systems on $LX_\\lambda$ indexed by representations of the component groups of stabilizers;\n  $\\mathrm{IC}_{\\chi,\\lambda}$; $\\delta(\\lambda)$ as the substitute for the dimension), **Cor. 14(iv),\n  p. 7** (parity vanishing), **Thm. 2 with (1), p. 4** (dimension theory), **Thm. 87 with Remark 89,\n  pp. 51–52** ($X=\\mathrm{SL}_2/\\mathrm{SO}_2$: odd-codimension orbits, $\\mathrm{Perv}_\\delta$ not\n  semisimple, IC-complexes with non-trivial coefficients), **Remark 13, p. 7** (disconnected stabilizers\n  or odd codimensions ⟹ objects outside $\\mathrm{Rep}(\\check G_X)$), **§10.2, p. 52** (\"*the constant\n  sheaf on the closed $L^{+}G$-orbit $LX_0=L^{+}X$*\"), **§1.2.5, p. 8** (Mars–Springer slices use\n  $\\theta$ essentially; purity does not directly generalize to spherical $X$). A.4(9)–(11), pp. 57–58,\n  is their dimension theory.\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — printed **pp. 14–16 and 39–41** read this run. **Inside the proof\n  of Lemma 3.13.1, p. 14**: for an *affine* finitely presented morphism of prestacks, $f_{*,!-dR}$ is\n  \"*characterized by the fact that it satisfies base-change with the upper-! functors, and coincides\n  with the usual pushforward functor in the finite type setting*\" — the strongest printed form of\n  Q2-L5-L3 clause (1), and it makes that clause the definition of $\\Pi$'s formation rather than a\n  theorem about it. **§3.16 with Rem. 3.16.1, p. 15** is the prestack statement the appendix already\n  transcribes. *Negative half, verified this run:* §6.14 \"Renormalization\" (p. 40) and §6.16 with\n  Ex. 6.16.4 (p. 41) are the $\\tau$-renormalized functors against a **dimension theory** and have\n  nothing to do with $\\mathrm{Ind}(\\mathcal{D}_c)$ — so **clause (3) of the node is touched by nothing\n  in this paper**, confirming Flaw 13 of the Q2-L5 critique. Prop. 6.11.3, p. 39 (dimension theories a\n  torsor under locally constant functions) is why the shift is a choice.\n- **[`zhu2016introduction`](../../papers/zhu2016introduction.pdf)** — p. 58 (\"*since $m$ is ind-proper, $m_!=m_*$*\") and **Cor. 5.1.5 with\n  Rem. 5.1.6, p. 59** reread: the stalk of $\\mathrm{IC}_{\\mu_1}\\star\\cdots\\star\\mathrm{IC}_{\\mu_n}$ at\n  $t^\\lambda$ is $H^{2d}_c(\\mathrm{Gr}_{\\mu_\\bullet}\\cap m^{-1}(t^\\lambda))$ — clause (1) as an actual\n  computation, in the $*$-form, in the group case.\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 8–17 read this run. **Lemma 4.4, p. 14** (stratified semi-smallness\n  of $m:\\mathrm{Gr}_{\\mathcal{K}}\\times_{G_{\\mathcal{O}}}\\mathrm{Gr}\\to\\mathrm{Gr}$, stated for\n  $m:\\widetilde{\\mathrm{Gr}}^{\\lambda,\\mu}\\to\\overline{\\mathrm{Gr}^{\\lambda+\\mu}}$, so the target is the\n  Schubert closure) with §4's definitions (4.4)–(4.5) of stratified semi-small and small; **Thm. 3.5,\n  p. 10** and **Lemma 3.9, p. 12**, the hyperbolic-localization computation on the semi-infinite orbits\n  $S_\\nu$, kept as the one *analogue* found for a costalk-type statement over strata that are neither of\n  finite dimension nor of finite codimension.\n\n### Added by `/examples` — Q2-e3-L5 (the sign twist of the Satake subcategory at $\\mathrm{GL}_2/\\mathrm{O}_2$)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-09.\n\n- **Macerato, Taylor, *The real affine Grassmannian and quantum SL(2)***, arXiv:2408.00931v2 (**no\n  `refs.bib` key**, PDF not in `papers/`). The closest thing in print to this node's question. $G=\\mathrm{PGL}(2,\\mathbb{R})$,\n  $G_O$-orbits $\\mathrm{Gr}^n$ ($n\\ge0$), $\\pi_0(\\mathrm{stab}_G(t^n))=\\mathbb{Z}/2$ at **every** orbit,\n  so each carries $k^{+}$ and $k^{-}=\\mathrm{sgn}$ and $\\Delta(n)^{\\pm}:=i_{n!}k^{\\pm}[n/2]$ — literally\n  the $\\Delta_{\\lambda,\\mathrm{triv}}/\\Delta_{\\lambda,\\mathrm{sgn}}$ of the blueprint's notation. **§1.1**\n  (two components $\\mathrm{Gr}^{\\mathrm{even}},\\mathrm{Gr}^{\\mathrm{odd}}$; the category is *not*\n  semisimple); **Prop. 2.3.1** (the $-$ objects are the $+$ objects tensored by the sign representation);\n  **§2.4 (2.2) with Prop. 2.4.1 and (2.3)** — Nadler's nearby-cycles/Satake functor sends $L(n)_\\mathbb{C}\n  \\mapsto L(2n)^{+}$, and the $L(2n)^{+}$ are closed under convolution, so the Hecke image is *even orbits,\n  trivial local system only*; **Prop. 4.4.1, p. 8**, with the sentence after it: the odd component splits\n  into $\\pm$ blocks and \"*On the even component there is no such splitting*\"; **Thm. 5.3.1**\n  ($\\mathrm{Perv}_{G_O}(\\mathrm{Gr}^{\\mathrm{odd}})^{+}\\simeq\\mathrm{Rep}_i(\\mathrm{SL}(2))^{\\mathrm{even}}$).\n  **§1.3** invokes [`chen2024real`](../../papers/chen2024real.pdf) to read all of this as $X=\\mathrm{PGL}_2/\\mathrm{PO}_2$ — *past* Chen–Nadler's\n  standing hypothesis that $G_\\mathbb{R}$ be connected, which $\\mathrm{PGL}_2(\\mathbb{R})$ is not.\n- **Corato-Zanarella, *Spherical functions of symmetric forms and a conjecture of Hironaka***,\n  arXiv:2311.00147v2 (**no `refs.bib` key**, PDF not in `papers/`). The classical shadow at the node's own\n  $X$: $X=\\mathrm{Sym}_{r\\times r}(F)\\cap\\mathrm{GL}_r(F)$, $K=\\mathrm{GL}_r(\\mathcal{O}_F)$, $x\\cdot k=k^{\\mathsf T}xk$,\n  $p>2$. **Theorem A** (p. 2): $\\mathcal{S}(X/K,R)$ is a **free** $\\mathcal{H}(G,K,R)$-module of rank $4^{r}$\n  whenever $2\\in R^{\\times}$; **Cor. 5.9** gives the explicit basis, indexed by a sign function\n  $s\\colon\\{1,\\dots,r\\}\\to\\mathrm{Sign}=\\mathbb{F}_q^{\\times}/(\\mathbb{F}_q^{\\times})^{2}$ and a vector $e$;\n  **Rem. 5.10**: at $r=2$ — the blueprint's case — this is Hironaka, *Spherical functions of Hermitian and\n  symmetric forms II*, Japan. J. Math. (N.S.) **15** (1989) 15–51, §4 Thm. 4. Also **p. 2**, two sentences\n  worth keeping: this $X$ \"*has roots of type $N$*\", so [Sak13, Thm 1.4.1] does not apply — the same\n  hypothesis failure [`BZSV`](../../papers/BZSV.pdf) §7.6.5 names for $\\mathrm{PSL}_2/\\mathrm{PO}_2$, and an *independent, published*\n  reason the node's $X$ is out of class; and the dual object is expected, after Jacquet (C. R. Acad. Sci.\n  **312** (1991) 957–961), to be governed by the **metaplectic double cover** $\\widetilde{\\mathrm{GL}}_r(F)$.\n  §1.3 fixes $\\mathrm{Sign}$; Appendix A relates the answer to Sakellaridis's inverse Satake transform.\n- **[`BZSV`](../../papers/BZSV.pdf)** — **§7.6.5, pp. 169–170**, reread on this run's own eyes: the list of proved cases, and the\n  sentence that $X=\\mathrm{PSL}_2/\\mathrm{PO}_2$ \"*is outside of our hyperspherical setting due to the\n  presence of Type N roots*\" and that its local category \"*contains a block equivalent to representations\n  of quantum $SL_2$ at a fourth root of unity*\", attributed to Macerato–Taylor with Chen–Nadler. The\n  source of [K11](../key_examples/k11.html), now traced to its two primary papers.\n- **[`chen2024real`](../../papers/chen2024real.pdf)** — pp. 1–6 and 41–45 read this run. **p. 4**: \"*In this paper we will assume\n  $G_\\mathbb{R}$ is connected (equivalently, $K$ is connected)*\" — so every disconnected-stabilizer case in\n  this file, including $\\mathrm{PGL}_2/\\mathrm{PO}_2$ and $\\mathrm{GL}_2/\\mathrm{O}_2$, is **outside** the\n  stated hypothesis of Thm. 1.1, which is nevertheless the dictionary MT24 §1.3 and [`BZSV`](../../papers/BZSV.pdf) §7.6.5 use.\n  **§9.2, Lemma 9.2 and Lemma 9.3** (pp. 41–43) are a bijection between local systems on the symmetric and\n  real orbits, and **§9.3** the standard/costandard sheaves $\\mathcal{S}^{\\pm}_{*}(\\lambda,\\tau)$ — all\n  stated for the *whole* category and silent on the Hecke-generated part.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4 pp. 59–62 reread. **Example 108, p. 62**, verified\n  verbatim: $\\mathrm{Rep}(\\pi_0(S_j))\\cong\\mathrm{Perv}(H\\backslash\\mathcal{O})\\cong\\mathrm{Shv}(H\\backslash\\mathcal{O})$,\n  $\\xi\\mapsto\\mathcal{L}_{\\xi,\\mathcal{O}}=\\pi_j^{*}\\mathcal{L}_\\xi$, with (48)–(50) the standard, costandard\n  and IC objects and (51)–(53) their Verdier duals exchanging $\\xi\\leftrightarrow-\\xi$. The vocabulary of\n  the sign twist, and nothing about whether the Hecke action reaches it.\n- **Gaitsgory–Lysenko, arXiv:1608.00284; Reich, arXiv:1012.5782** (**no `refs.bib` keys**, not on disk;\n  abstracts and search summaries only). Recorded as the *negative* half of the search: metaplectic and\n  twisted geometric Satake twist by a **factorizable gerbe on $\\mathrm{Gr}$**, giving a different monoidal\n  category with a different dual group, and nowhere ask whether a twist of a Satake-type **sub**category\n  lands inside the untwisted one. Anyone reopening this question should not expect that literature to\n  answer it.\n";</script>
