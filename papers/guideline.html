t say that has not been read yet, and\n   should be in the reading list instead.\n\n## a. What is here\n\nOne entry per PDF, added in the same commit as the PDF. Reading notes on a paper are a\n`<key>.md` beside it in this directory — one file per paper, so that what a source\ncontributes is written once instead of once per node that uses it.\n\nSince 2026-08-04 the reading-list PDFs of §b are also on disk under their keys, fetched\nahead of reading so the operators can open them locally. A paper moves up into this\nsection when something has actually been taken from it, not when the file arrives.\n\n### `BZSV.pdf` — Ben-Zvi, Sakellaridis, Venkatesh, *Relative Langlands duality*\n\narXiv:2409.04677v1, 7 Sep 2024. `refs.bib` key [`BZSV`](../../papers/BZSV.pdf). The paper the project assumes:\nConjecture 7.5.1 is the standing hypothesis, and the duality pairing a Hamiltonian space\nfor $G$ with one for $\\check G$ is where $M$, its grading, and $\\check M$ come from.\n\n*Used by:* the standing hypotheses in [`blueprint/context.md`](../context.html), and\nthe appendix entries for the hyperspherical setting.\n\n### `SV17.pdf` — Sakellaridis, Venkatesh, *Periods and harmonic analysis on spherical varieties*\n\narXiv:1203.0039v4, 9 Mar 2017. **No `refs.bib` key**, though `main.tex` cites [`SV17`](../../papers/SV17.pdf) — see\nthe gaps below. The classical-side source for what a spherical variety $X$ is and what a\nperiod is, underneath the categorical statement the manuscript proves.\n\n### `WB26.pdf` — Wang and Buehler, agentic discovery systems\n\narXiv:2606.01444. **Not mathematics, and not citable by anything in the blueprint.** It is\nthe source of the idiom [`process/operations.md`](../process/operations.html) uses to describe\nthis pipeline: a schema of artifact types, a state that is a $\\mathbf{Set}$-valued\ncopresheaf on it, provenance as the category of elements, and discovery as a change of\nschema with explicit transport. Deliberately has no `refs.bib` key — `refs.bib` is the\nmanuscript's bibliography, and a process reference has no business in it.\n\n*Used by:* `process/operations.md`, on the shape of the formalism only.\n\n## b. The reading list\n\nRanked, most worth reading first. The ranking is derived from two things and maintained by\nhand: how often the manuscript cites a source, and whether the appendix black-boxes a\nresult from it — a black box is a place where the pipeline has agreed to assume something,\nwhich makes reading the source the only way to check the hypotheses are really discharged.\n\n### Tier 1 — the conjecture and the two papers on either side of it\n\n| key | what | why first |\n|---|---|---|\n| [`BZSV`](../../papers/BZSV.pdf) | Ben-Zvi, Sakellaridis, Venkatesh, *Relative Langlands duality* (2024) | Conjecture 7.5.1 is the standing hypothesis of the whole project: the main theorem assumes it and upgrades it to Iwahori level. Everything in [`blueprint/context.md`](../context.html) about hyperspherical $M$, the grading, and the duality $X \\mapsto \\check M$ is read off this. |\n| `Lin2025tamelocalBZSV` | Lin, Pham, Yu, *A tamely ramified relative local Langlands from the local unramified relative Langlands conjecture* (2025) | The authors' own predecessor. Read it for what the manuscript takes as already established rather than re-derived. |\n| [`zhu2025tamecategoricallocallanglands`](../../papers/zhu2025tamecategoricallocallanglands.pdf) | Zhu, *Tame categorical local Langlands correspondence* (2025), arXiv:2504.07482 | The Iwahori-level categorical target. The shape of the equivalence the main theorem states is the shape this paper sets up. |\n\n### Tier 2 — where the appendix's black boxes come from\n\n| key | what | why |\n|---|---|---|\n| [`bezrukavnikov2008equivariant`](../../papers/bezrukavnikov2008equivariant.pdf) | Bezrukavnikov, Finkelberg, *Equivariant Satake category and Kostant–Whittaker reduction* (2008) | The most-cited source in the manuscript. The Satake side of every comparison. |\n| [`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf) | Raskin, *D-modules on infinite dimensional varieties* | Where $\\mathcal{D}^{\\mathrm{ren}}$, $\\mathcal{D}_c$, placidity and the ind-completion conventions come from — the ones [Q1-L1](../nodes/Q1-L1/index.html) and [Q1-L2](../nodes/Q1-L2/index.html) turn on. Highest value per page for anyone proving a node in the current frontier. |\n| [`arkhipov2004quantum`](../../papers/arkhipov2004quantum.pdf) | Arkhipov, Bezrukavnikov, Ginzburg, *Quantum groups, the loop Grassmannian, and the Springer resolution* (2004) | The Iwahori–Whittaker input the appendix cites as a black box with hypotheses \"as cited\". |\n| [`ben2010integral`](../../papers/ben2010integral.pdf) | Ben-Zvi, Francis, Nadler, *Integral transforms and Drinfeld centers in derived algebraic geometry* (2010) | The base-change and integral-transform formalism used without comment throughout. |\n| [`bezrukavnikov2016two`](../../papers/bezrukavnikov2016two.pdf) | Bezrukavnikov, *On two geometric realizations of an affine Hecke algebra* (2016) | The Iwahori-level statement the main theorem is modelled on. |\n\n### Tier 3 — foundations, to consult rather than to read\n\n[`HA`](../../papers/HA.pdf) (Lurie, *Higher Algebra*) for the monoidal- and module-category conventions the\nappendix cites by section; [`GR17vol1`](../../papers/GR17vol1.pdf) (Gaitsgory–Rozenblyum) and `SAG` for the derived\nalgebraic geometry; [`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf) for geometric Satake proper. Look up the\nnumbered statement, check the hypothesis, and stop.\n\n### Added by `/examples` — Q1-L5 (dévissage: equality ⟺ stratumwise generation)\n\nAppended, not substituted for the entries above: these are the pages actually read for that node.\n\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — Raskin, *D-modules on infinite dimensional varieties*,\n  [samraskin.net/dmod.pdf](https://www.samraskin.net/dmod.pdf). §6.5, formula (6.5.1): for a\n  *reasonable* ind-scheme $T=\\varinjlim_i T_i$, $\\mathcal{D}^!(T)=\\varinjlim_i\\mathcal{D}^!(T_i)$ along\n  the left adjoints of $!$-pullback and $\\mathcal{D}^*(T)=\\varinjlim_{\\mathcal{I}^{\\mathrm{op}}}\\mathcal{D}^*(T_i)$\n  along $\\alpha^!$; Def. 6.4.1 (reasonable), Def. 6.8.1 (placid ind-scheme), Rem. 6.8.3 (both categories\n  compactly generated and canonically dual), Prop. 6.7.1 (equivariant setting). The sourced form of the\n  appendix's example on sheaves on a placid ind-scheme, and the ind-half of every stratification argument\n  in Q1.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — Chen–Yi, *Singularities of orbit closures in loop\n  spaces of symmetric varieties*, arXiv:2310.20006v3. Thm 17: $\\overline{LX}_\\mu=\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$,\n  with index set the dominant coweights of the maximal $\\theta$-split torus in the dominance order;\n  §5 *Placidness of orbit closures*; Prop. 62 (dimension theory, relative codimension). Cor. 8 (= Thm 86):\n  for even orbit codimensions the relative Satake category $\\mathrm{Perv}(L^+G\\backslash LX)$ is semisimple\n  and equivalent to $\\mathrm{Rep}(\\check G_X)$. Cor. 6 (= Thm 92): formality of the de-equivariantised Ext\n  algebra. *Caveat found while reading:* the standing setting is $X=G/K$ **symmetric** over\n  $k=\\overline{\\mathbb{F}}_p$ with $p\\neq2$, and §1.2.5 states that the slice construction uses the\n  involution essentially — while the appendix records the hypothesis of the black box drawn from this\n  paper as \"$X$ smooth affine spherical\".\n  *Correction, added the same day:* the numbers above are v3's, and the numbering moved in v4 (10 Jul\n  2025) — the closure theorem is Thm 18 and the semisimplicity corollary Cor. 9 there — while v4's\n  comment reads \"We remove most assumptions on the characteristic\", so the characteristic clause above\n  should not be relied on. What the title and the definition of $X=G/K$ do establish, in every version,\n  is that the setting is **symmetric**, not general spherical; the abstract's \"spherical orbit closures\"\n  means the $L^+G$-orbits, as against the Iwahori orbits, on a symmetric $X$. No \"Thm 36\" was located in\n  v3 or v4.\n- **(no `refs.bib` key)** — Drinfeld–Gaitsgory, *Compact generation of the category of D-modules on the\n  stack of $G$-bundles on a curve*, Camb. J. Math. 3 (2015), arXiv:1112.2402. Thm 0.1.2; §0.2 for\n  truncative / co-truncative / truncatable; and, as the negative control for stratumwise generation over\n  an infinite stratification, Thm 12.1.1 with Ex. 12.1.2, Lem. 12.2.6 and Cor. 12.2.7 — a smooth\n  non-quasi-compact scheme whose $\\mathcal{D}$-module category is not compactly generated, where the\n  subcategory generated by all compact objects is proper *and* restricts to a non-generating subcategory\n  on the open stratum. Note `drinfeld2013some` in `refs.bib` is the *other* Drinfeld–Gaitsgory paper\n  (GAFA 2013); this one has no key.\n\n### Added by `/examples` — Q1-L4 (orbit stacks are classifying stacks of placid groups)\n\nAppended, not substituted for the entries above.\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — Chen–Yi, arXiv:2310.20006**v4**. *Correction to\n  the block above, added 2026-08-04:* **Theorem 36 does exist in v4** — it is the placidity theorem\n  (\"$\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ are irreducible placid schemes; the closed\n  embeddings into $LX$ are finitely presented\"), which is exactly what the appendix black-boxes, and\n  **Remark 37** states it \"remains true for general spherical varieties\" because it only uses\n  [SW22, Lem. 2.3.10] and Drinfeld's Thm 35. That licenses the appendix's hypothesis \"smooth affine\n  spherical\" for the placidity clause. What is *not* licensed for general spherical $X$: **Prop. 17**\n  (orbits represented by $\\Lambda_S^+$, $S$ a maximal $\\theta$-split torus) and **Thm. 18**\n  ($\\overline{LX}_\\mu=\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$, order = non-negative sums of positive\n  coroots), whose proofs run through $\\theta$-twisted $\\mathrm{SL}_2$/$\\mathrm{SL}_3$ computations\n  (Prop. 20, Cor. 21). Also used: Prop. 39 (the placid presentations of $LX$), §1.2.3 and Cor. 9(ii)\n  (equivariant local systems on $LX_\\lambda$ indexed by $\\pi_0$ of the $L^+G$-stabiliser), Rem. 19\n  (over $\\mathbb{C}$ the closure relation is [Nad04, Thm 10.1]), Appendix A.1 (placid schemes/stacks).\n- **(no `refs.bib` key)** — Sakellaridis, Wang, *Intersection complexes and unramified $L$-factors*,\n  J. Amer. Math. Soc. **35** (2022) 799–910, arXiv:2009.03943. §2.3 holds for **any** affine spherical\n  $X$ (the extra hypotheses start \"from Section 3 onwards\"). **Thm. 2.3.5** — the $L^+G$-orbits on\n  $\\mathsf{L}^\\bullet X$ are $\\mathcal{V}\\cap\\mathring\\Lambda_X\\cong X^\\bullet(F)/G(\\mathfrak{o})$,\n  restricting to the monoid $\\mathfrak{c}_X^-\\cong(X(\\mathfrak{o})\\cap X^\\bullet(F))/G(\\mathfrak{o})$;\n  **Prop. 2.3.7** — those orbits stratify $\\mathsf{L}^\\bullet X$, each is $\\mathsf{L}^+G/S$ for its\n  stabiliser $S$, each is open in its closure, and the proof exhibits $S$ through its finite-type\n  images $S_n$ with smooth unipotent congruence kernels. This is the published form of both halves\n  the node needs: the stabiliser structure of clauses (i)–(ii), **and** the failure of clause (iv) —\n  $\\mathfrak{c}_X^-$ is a monoid, hence infinite once nonzero, and all of it sits inside the closed\n  $\\mathsf{L}^+X$. Also Thm. 2.2.5 (local structure), §2.2 (affine degeneration, the source Chen–Yi\n  cite), Rem. 2.3.6 ($\\mathfrak{c}_X^-=\\mathcal{C}_0(X)\\cap\\mathcal{V}\\cap\\mathring\\Lambda_X$).\n- **`zhu2016introduction`** — Zhu, arXiv:1603.05593. **Prop. 2.1.5**: $\\mathrm{Gr}_\\mu$ is a single\n  $L^+G$-orbit with stabiliser $L^ nd the statement behind proposed nodes Q1-a1/Q1-a2.\n- **[`SV17`](../../papers/SV17.pdf)** (no `refs.bib` key, recorded below) — §16 (pp. 238–246): Conj. 16.2.2 (the unitary local\n  conjecture over $X$-distinguished Arthur parameters), §16.3 pp. 243–244 quoting [Sak13, Thm 9.0.1]\n  (unramified $L^2$-spectrum supported on $X$-distinguished unramified parameters; conditions:\n  homogeneous affine or Whittaker-induced, combinatorial assumptions), and the pointer to Hironaka and\n  Offen for non-split analogues. Hyperspecial level throughout — no Iwahori function theory here.\n- **(no `refs.bib` key)** — Sakellaridis, *Spherical functions on spherical varieties*, Amer. J. Math.\n  **135** (2013) 1291–1381, arXiv:0905.4244. Not opened; cited through BZSV §9.3 and SV17 §16.3, both\n  of which attribute Thm 9.0.1 (unramified Plancherel for $X$) to it. The primary source for Q1-a2 if\n  it is materialized; fetching the PDF is worth it then.\n- **[`bezrukavnikov2008equivariant`](../../papers/bezrukavnikov2008equivariant.pdf)** — Thm 5 (p. 7): monoidal equivalences\n  $D^{\\check G}_{perf}(U^{[]}_\\hbar)\\cong D_{\\mathbf{G_O}\\rtimes\\mathbb{G}_m}(\\mathrm{Gr})$,\n  $D^{\\check G}_{perf}(\\mathrm{Sym}^{[]}(\\check{\\mathfrak{g}}))\\cong D_{\\mathbf{G_O}}(\\mathrm{Gr})$ —\n  the group-case instance, and the derived-Satake compatibility named in the unramified conjecture.\n- **[`bezrukavnikov2016two`](../../papers/bezrukavnikov2016two.pdf)** — Thm 1 (p. 5), equivalences (2)–(4): $D_{I^0I^0}$, $D_{I^0I}$, $D_{II}$\n  vs coherent categories of the Steinberg variety, e.g.\n  $\\Phi_{II}\\colon D_{II}\\cong DGCoh^{G^\\vee}(\\tilde{\\mathcal{N}}\\times^L_{\\mathfrak{g}^\\vee}\\tilde{\\mathcal{N}})$\n  — the Iwahori-level group case the main theorem is modelled on.\n- **[`arkhipov2004quantum`](../../papers/arkhipov2004quantum.pdf)** — diagram (1.1.1) and (1.1.2) (pp. 2–3): the three-way equivalence\n  $D^b\\mathrm{block}^{\\mathrm{mix}}(\\mathsf{U})\\cong D^b\\mathrm{Coh}^{G\\times\\mathbb{C}^*}(\\tilde{\\mathcal{N}})\\cong D^b\\mathrm{Perv}^{\\mathrm{mix}}(\\mathrm{Gr})$\n  and $\\mathrm{block}(\\mathsf{U})\\simeq\\mathrm{Perv}(\\mathrm{Gr})$ — the Iwahori–Whittaker instance.\n- **[`zhu2025tamecategoricallocallanglands`](../../papers/zhu2025tamecategoricallocallanglands.pdf)** — §1.1 (pp. 2–5): aims and setting only (categorical\n  arithmetic local Langlands via $\\mathrm{Shv}(\\mathrm{Isoc}_G)$; proof of the tame case for\n  quasi-split unramified $G$ announced as the paper's second aim). Main-theorem numbers not yet\n  extracted — a targeted read is still owed before any node cites one.\n- **[`BravermanFinkelbergGinzburgTravkin_2021`](../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)** — arXiv:1909.11492, Compositio **157** (2021)\n  1724–1765. Abstract only (mirabolic Satake; $GL(N-1,\\mathcal{O})$-equivariant sheaves on\n  $\\mathrm{Gr}_{GL_N}$ vs supergroup representations; placed in the Gaiotto/BZSV framework). The\n  appendix's Thm 3.6.1 citation for $X=M_n$ not independently verified — PDF not on disk.\n- **[`chen2022quaternionic`](../../papers/chen2022quaternionic.pdf)** — arXiv:2207.04078. Abstract only: derived Satake for $GL_n(\\mathbb{H})$\n  and for the symmetric variety $GL_{2n}/Sp_{2n}$, framed within relative Langlands duality; BZSV\n  §7.6.5 report it proves the local conjecture for the symplectic period.\n\n### Added by `/examples` — Q1-L4, second run (Iwasawa–Tate focus, post-u1 three-clause statement)\n\nAppended, not substituted for the entries above: the pages actually read for the 2026-08-04 rerun.\n\n- **[`BZSV`](../../papers/BZSV.pdf)** — pages newly read for this node: §7.3.1 (p. 155, the *placid case* — exhaustion\n  $X_F = \\varinjlim X^l$, $X^l = \\varprojlim_n X^l_n$ with unipotent-torsor transitions and the\n  $G_O$-action through finite-type $G_N$; bullet list of cases satisfying it, including \"the\n  Godement–Jacquet and Iwasawa–Tate periods, $X = M_n$\"); the boxed caveat p. 156 (properties of\n y Lang; fails for $H$\n  disconnected — the mechanism behind Q1-L3's boundary example), Thm 2.3.10 (congruence level).\n- **(no `refs.bib` key)** — Aizenbud, Sayag, *A short proof of Hironaka's theorem on freeness of\n  some Hecke modules*, arXiv:1709.08214. **Thm A**: $E/F$ unramified quadratic, res. char ≠ 2,\n  $X$ = det-1 Hermitian forms on $E^n$, $G=SL_n(E)$: $\\mathcal{S}(X)^{K_0}$ free over\n  $\\mathcal{H}(G,K_0)$ of **rank $2^{n-1}$** — hence not cyclic, no basic function generates;\n  Rem. 1.0.1 ($GL$-version = Hironaka, *Spherical functions and local densities on Hermitian\n  forms*, J. Math. Soc. Japan **51** (1999) 553–581); §1.2 (freeness not expected for all\n  spherical $X$). The published classical failure of Hecke saturation.\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — p. 4: $G_{\\mathcal{O}}$-orbits on $\\mathcal{G}r$ parametrized by\n  dominant coweights, (2.1) ind-presentation, **(2.2)** closure = dominance order; Rem. 3.3\n  ($L_\\nu\\in\\overline{\\mathcal{G}r^\\lambda}$ ⟺ $\\nu$ a weight of $V_\\lambda$). The group-case\n  saturation $LX^{\\mathrm{sat}}=LG$, sourced.\n- **[`BZSV`](../../papers/BZSV.pdf)** — pp. 162–163 (§7.5.3: $\\mathcal{T}_V\\star\\delta_X\\leftrightarrow T_V(1_{X(\\mathfrak{o})})$,\n  (7.16); p. 163 \"all sheaves … generated from the basic object\" *as a consequence of Conj. 7.5.1* —\n  the converse of Q1-L3(iii), with no unconditional support bound stated); pp. 200–201 (§9.4,\n  (9.15), derived invariants remark, $k=\\mathbb{C}$ Hecke-module isomorphism with distinguished\n  vector). Re-verified on this run's own eyes.\n\n### Added by `/examples` — Q1-a1 (the Hecke module of the basic function)\n\nAppended, not substituted for the entries above: the pages actually read for that node.\n\n- **(no `refs.bib` key)** — Sakellaridis, *Spherical functions on spherical varieties*, Amer. J.\n  Math. **135** (2013) 1291–1381, arXiv:0905.4244v3. **Now opened** (earlier entries above record\n  it as \"not opened\"): pp. 1–5 and 63–68 read. **Thm 1.4.1 = Thm 8.0.2** (p. 64): canonical\n  isomorphism $C_c^\\infty(X)^K\\simeq\\mathbb{C}[\\delta_{(X)}^{1/2}A_X^*]^{W_X}$ compatible with the\n  $\\mathcal{H}(G,K)$-structure and Satake, $\\mathbf{1}_{X(\\mathfrak{o})}\\mapsto 1$ — the precedent\n  for the display of Q1-a1, a decade before BZSV §9.4. §8 p. 63: $\\mathcal{H}(G,K)$ acts through\n  $\\mathcal{H}_X$ = image of the restriction map (8.2). **Cor. 8.0.4(1)**: (8.2) surjective ⟹ the\n  module is principal, generated by $\\mathbf{1}_{X(\\mathfrak{o})}$. **Ex. 8.0.1**: for split\n  $X=(SL_2)^3\\backslash Sp_4\\times Sp_4$ the restriction map \"is not surjective in this case\"\n  (fusion of $W_X$-orbits under $W$; pp. 65–66: fiber multiplicity $>1$) — the published failure\n  of generation for a *split* affine homogeneous spherical variety, and the counterexample to\n  Q1-a1's closing sentence. Also Ex. 7.2.5 (split Gross–Prasad, $\\check G_X=\\check G$), Thm 9.0.1\n  with (9.2) (unramified Plancherel), and the quote of [Sa08, Thm 6.2.1] (torsion-freeness over\n  $\\mathcal{H}_X$) on p. 64.\n- **(no `refs.bib` key)** — Aizenbud, Sayag, *A short proof of Hironaka's theorem on freeness of\n  some Hecke modules*, arXiv:1709.08214, read on its own pages 1–5 this run (the Q1-L3 record\n  above is confirmed): **Thm A = Thm 3.0.1** — $\\mathcal{S}(X)^{K_0}$ free of rank $2^{n-1}$ over\n  $\\mathcal{H}(SL_n(E),SL_n(\\mathcal{O}_E))$, $X$ = det-1 Hermitian forms, $E/F$ unramified\n  quadratic, res. char $\\neq 2$; **Rem. 1.0.1** ($GL$-version = Hironaka [Hir99]); §1.2 verbatim:\n  \"One can not expect that the conclusion of the Theorem holds for any spherical space\"; Cartan\n  ingredients Lem. 3.0.3, Cor. 3.0.4, key Prop. 3.0.6 (the action shifts by $2\\lambda$).\n- **[`SV17`](../../papers/SV17.pdf)** — Rem. 5.1.7 (printed p. 68) verified on this run's own eyes: [AAG12] ⟹\n  $C_c^\\infty(X)^J$ finitely generated over $\\mathcal{H}(G,J)$; Thm 5.1.5 (finiteness of\n  multiplicities, wavefront), Rem. 5.1.6 (pointer to [Sak08, Thm 5.3.2], generic multiplicity of\n  unramified principal series). Bibliography p. 287: **[AAG12]** = Aizenbud, Avni, Gourevitch,\n  *Spherical pairs over close local fields*, Comment. Math. Helv. **87** (2012) 929–962,\n  doi:10.4171/CMH/274.\n- **[`BZSV`](../../papers/BZSV.pdf)** — §9 re-verified for this node on pp. 189–202: p. 189 ($\\mathbf{e}$ = characteristic\n  function of $X(\\mathfrak{o})$), p. 190 (contents: §9.4 = the *algebraic* Hecke-module question),\n  p. 191 (§9.1: the split condition — every even-sphere-type root gives $SO_{2n}\\backslash SO_{2n+1}$\n  with $SO_{2n}$ split, \"all colors of $X$ are defined over $\\mathbb{F}_q$\"), p. 192 (Prop. 9.2.1 =\n  Plancherel density (9.5), conditional on Conj. 8.1.8 — *not* a density-of-Hecke-translates\n  statement), pp. 193–194 (§9.3 boxed summary; conditions; [Sak13, Thm 9.0.1] / [SW22, (1.11)]),\n  pp. 200–201 (§9.4, (9.15) with its question mark, the $k=\\mathbb{C}$ isomorphism, the\n  distinguished-vector-and-inner-product display). pp. 162–163: (7.16) and p. 163 \"all sheaves …\n  generated from the basic object\" (consequence of Conj. 7.5.1); fn. 62 (Iwasawa–Tate Hecke\n  translate of $\\delta_0$). No statement on function-level generation anywhere in §9.4.\n\n### Added by `/examples` — Q1-L4-L1 (orbit presentation $LX_\\lambda\\simeq K/K_\\lambda$)\n\nAppended, not substituted for the entries above: the pages actually read for that node,\n2026-08-04. The SW22 and Zhu records above are hereby verified at page level on this run's\nown eyes (both PDFs fetched from the web; neither is in `papers/`, and SW22 still has no\n`refs.bib` key).\n\n- **(no `refs.bib` key)** — Sakellaridis–Wang, arXiv:2009.03943 (PDF at\n  jonathanpwang.com/papers/sphericalL.pdf), pp. 22–25 read. **Prop. 2.3.7** verbatim, with\n  proof: the orbit is \"*a priori* … defined as the fpqc sheaf quotient $\\mathsf{L}^+G/S$\",\n  and $\\mathsf{L}^{\\check\\theta}X\\cong\\mathsf{L}^+G/S\\cong\\varprojlim_n\\mathsf{L}^+_nG/S_n$,\n  $S_n$ = jet-images of the stabilizer, transitions smooth affine with smooth unipotent\n  kernels; formally smooth, open in its closure. Char-$p$ hypothesis: $B$-stabilizer on\n  $X^\\circ$ smooth (empty in char 0). **Lemma 2.3.10**: $\\mathsf{L}^{\\check\\theta}X\\cong\n  \\mathsf{L}X\\times_{\\mathsf{L}\\mathscr{X}}\\mathsf{L}^+(\\mathscr{X}^\\bullet)$ — the locally\n  closed realization. **Cor. 2.3.13**: stabilizer connected when $B$ acts simply\n  transitively on $X^\\circ$, via $\\mathrm{Stab}\\cong\\varprojlim_n\\mathrm{Sect}(\\mathsf{D}_n,\\mathfrak{J}_n)$\n  with unipotent-kernel transitions contracting to $\\mathrm{Stab}_G(\\gamma(0),X_I^\\bullet)$.\n  The published form of Q1-L4-L1(a)+(b); (c) is formal descent, stated nowhere numbered.\n- **`zhu2016introduction`** — arXiv:1603.05593, pp. 24–27 read. **Prop. 2.1.5** with proof:\n  stabilizer $L^+G\\cap t^\\mu L^+Gt^{-\\mu}$, and $L^+G/(L^+G\\cap t^\\mu L^+Gt^{-\\mu})\\to LG/L^+G$\n  a locally closed embedding with image $\\mathrm{Gr}_\\mu$; tangent space\n  $\\bigoplus_{(\\alpha,\\mu)>0}\\mathfrak{g}_\\alpha(\\mathcal{O})/t^{(\\alpha,\\mu)}\\mathfrak{g}_\\alpha(\\mathcal{O})$,\n  $\\dim=(2\\rho,\\mu)$. p. 26: $(LG)_{\\leq\\mu},(LG)_\\mu$ are schemes; $p_\\mu:\\mathrm{Gr}_\\mu\\to G/P_\\mu$,\n  affine-space fibres. **Lemma 2.1.13** (minuscule: $\\mathrm{Gr}_{\\leq\\mu}=\\mathrm{Gr}_\\mu\\cong G/P_\\mu$).\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4 pp. 10–14, 20–24 reread. **Prop. 17**\n  ($k$-point parametrization, proof cites [GN10, Thm 8.2.9], [Nad04, Thm 4.2/4.3]; in\n  [Nad04] part (i) holds without $K$ connected); **Rem. 19** (closure theorem over any\n  alg. closed field of char $\\neq2$); §3.2.1 ($\\mathrm{GL}_2/\\mathrm{O}_2$ worked case,\n  $g\\cdot t^\\lambda=gt^\\lambda g^t$); **Lemma 34** (stratum = $LX\\times_{L\\mathcal{X}}L^+\\mathcal{X}^\\bullet$,\n  via [SW22, Lem 2.3.10]); **Thm. 35** (= [Dri06, Thm 6.3]); and, *inside the proof of*\n  **Thm. 36** (p. 22, unnumbered), the Cartesian diagram\n  $\\mathcal{O}_v\\cong\\varprojlim_j(I_0)_j/H_j'\\to L^+Gx_v\\cong\\varprojlim_j L_j^+G/H_j$ —\n  the orbit presentation for spherical and Iwahori strata at once, the exact content of\n  Q1-L4-L1 with no number to cite.\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 4–8 read. p. 4: \"$G_{\\mathcal{O}}$ acts on the\n  $\\mathcal{G}r_n$ via a finite dimensional quotient\" (the finite-level mechanism, 2007);\n  p. 5: $G\\cdot L_\\lambda\\cong G/P_\\lambda$, $\\mathrm{Gr}^\\lambda$ a $G$-equivariant vector\n  bundle over it, $\\dim=2\\rho(\\lambda)$; §3 p. 7: semi-infinite orbits $S_\\nu=N_{\\mathcal{K}}\\cdot L_\\nu$\n  \"neither of finite dimension nor of finite codimension\", **Prop. 3.1(a)**\n  $\\overline{S_\\nu}=\\bigcup_{\\eta\\leq\\nu}S_\\eta$ — the boundary contrast when the acting\n  group is an ind-group rather than $L^+G$.\n\n### Added by `/prove` — Q1-L4-L1 (round 1)\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4 pp. 20–24 reread by the prover, 2026-08-04,\n  confirming the `/examples` record above: Thm 35 (p. 21), Thm 36(i)–(ii) (p. 21), Rem. 37 (p. 22),\n  and the unnumbered presentation $L^+Gx_v\\cong\\varprojlim_j L_j^+G/H_j$ inside the proof of Thm 36\n  (p. 22). Wanted and not citable: a closed-world entry identifying the fpqc orbit sheaf with the\n  locally closed stratum of `def:orbits_iwahori_spherical` — the published form is Sakellaridis–Wang\n  Prop. 2.3.7 + Lem. 2.3.10 (still no `refs.bib` key); the proof's Step 4 instead adopts the\n  orbit-as-fpqc-image reading and flags it for ratification.\n\n### Added by `/prove` — Q1-L4-L2 (round 1)\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4 pp. 21–22 read for orientation only,\n  2026-08-05: the jet-image ed). **p. 23**: **Prop. 39**(i)–(ii), the locally equidimensional $I_0$- and\n  $L^+G$-placid presentations, \"following immediately from Theorem 36\", with steps the $\\pi_0$-wise\n  disjoint unions $\\overline{LX}_{\\underline{\\lambda}}=\\bigsqcup_\\beta\\overline{LX}_{\\lambda_\\beta}$.\n  *Numbering:* the manuscript's citation numbers do not match v4 — the presentation cited at\n  main.tex:772 as \"[Theorem 36]\" is v4's Prop. 39(ii), and the placidity cited at main.tex:1227 as\n  \"[Prop. 29.(ii)]\" is v4's Thm 36(i). Two page corrections to the records above: Rem. 37 is on\n  p. 22 and Prop. 39 on p. 23.\n\n### Known gaps in `refs.bib`\n\nFour keys are cited in the sources but have no entry in [`refs.bib`](../../refs.bib):\n[`HTT`](../../papers/HTT.pdf), [`SV17`](../../papers/SV17.pdf), `cohn2016differentialgradedcategoriesklinear` and\n[`gaitsgory-semiinfinite-intersection-coh`](../../papers/gaitsgory-semiinfinite-intersection-coh.pdf) — and [`SV17.pdf`](../../papers/SV17.pdf) is sitting in this directory\nwith no entry to point at. The last one is also cited from\n[`blueprint/appendix.md`](../appendix/index.html), which makes it a live violation of the\nrule that the blueprint cites only keys that exist. Fixing `refs.bib` and the manuscript is\na human job; recorded here so it is not rediscovered a fourth time.\n\n## c. Adding a reference\n\nThe prover and the example-finder both read the literature, and both hit the same failure\nwithout this file: a source is consulted, the useful sentence is copied into a draft, and\nthe reason that source was the right one is lost. So:\n\n- **During `/prove`** — when a proof needed a source that is not already an appendix entry,\n  the prover does not cite it. It reports the gap, and adds the source to the reading list\n  above with one line on what was wanted from it. Turning that into something citable is\n  the lead-researcher's job, and is a change to the closed world.\n- **During `/examples`** — every example carries its source. When that source is worth\n  keeping, it goes in section (a) with the PDF, or in the reading list when the PDF is not\n  to hand. An example's citation must resolve without this directory, so nothing here is\n  load-bearing for the example — it is the reading trail, not the evidence.\n- **Never rewrite someone else's entry.** Correct it by adding a line to it, the way\n  [`process/journal.md`](../process/journal.html) is corrected. An entry that turned out to be\n  wrong is more useful than a missing one.\n\n### Added by `/prove` — Q1-L4-L3 (unipotent de Rham contractibility)\n\n- **`drinfeld2013some`** — Drinfeld–Gaitsgory, *On some finiteness questions for algebraic stacks*,\n  GAFA 2013. Wanted as the likely theorem-status home in print of the mechanism Q1-L4-L3 proves\n  internally ($\\mathcal{D}^!(B(H/N))\\simeq\\mathcal{D}^!(BH)$ for $N$ unipotent, char 0); PDF not on\n  disk this run, so nothing was verified at page level and the node's write-up cites nothing from it.\n\n### Added by `/prove` — Q1-L4-L4 (pro-unipotent descent along a placid presentation)\n\n- **[`beraldo2017loop`](../../papers/beraldo2017loop.pdf)** — Beraldo, *Loop group actions on categories and Whittaker invariants*.\n  PDF on disk. Wanted as the home of the one input Q1-L4-L4 could not derive inside the closed\n  world, recorded there as the GAP (Lim): $\\mathcal{D}^!(BH)\\simeq\\varprojlim_m\\mathcal{D}^!(BH_m)$\n  for a placid group scheme, i.e. descent along the placid atlas $\\mathrm{pt}\\to BH$ together with\n  the $\\mathrm{Tot}_\\Delta$ / $\\varprojlim_m$ interchange. Read at page level this run: p. 4\n  Ex. 1.3.2 ($\\mathcal{D}(X)^G\\simeq\\mathcal{D}(X/G)$ for $X$ of finite type, \"immediately from\n  smooth descent\"; the strong-invariants half is Thm. 2.3.12, p. 13), and p. 25 Cor. 4.3.1 with\n  Thm. 4.3.2 (for pro-unipotent $H$: $\\mathrm{oblv}^H$ fully faithful and invariants $\\simeq$\n  coinvariants, proved from cohomological contractibility $\\Gamma_{\\mathrm{dR}}(H,k_H)\\simeq k$).\n  Everything there is stated for group actions on categories, so an appendix entry would also have\n  to carry the dictionary with $\\mathcal{D}^!(BH)$. Nothing from it is cited in the write-up.\n- *Correction (round 2, same entry).* The GAP (Lim) named above is closed: the descent half by the\n  commissioned appendix entry from [`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf) (§3.17, Prop. 3.17.2; companion\n  checks Ex. 4.2.2, Ex. 4.2.3, Rem. 4.2.7, pp. 19–20, read this run and used to discharge the\n  quasi-compactness hypotheses), the interchange half by an argument now written out in the node.\n  So [`beraldo2017loop`](../../papers/beraldo2017loop.pdf) is no longer wanted even as orientation here, and its hypotheses do not in\n  any case match this node: Cor. 4.3.1 and Thm. 4.3.2 assume $H$ pro-unipotent, and §4.2 assumes a\n  Levi decomposition $H\\simeq H^r\\ltimes H^u$.\n";</script>
