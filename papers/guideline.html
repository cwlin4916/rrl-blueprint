and\n   standard mathematics. A paper in this directory buys a proof exactly nothing until the\n   lead-researcher writes an appendix entry for the result being used, with its\n   hypotheses. Reading is upstream of the closed world, never inside it.\n3. **What was taken is written down.** Every entry below says what the project uses the\n   source *for*. A reference whose entry cannot say that has not been read yet, and\n   should be in the reading list instead.\n\n## a. What is here\n\nOne entry per PDF, added in the same commit as the PDF. Reading notes on a paper are a\n`<key>.md` beside it in this directory — one file per paper, so that what a source\ncontributes is written once instead of once per node that uses it.\n\nSince 2026-08-04 the reading-list PDFs of §b are also on disk under their keys, fetched\nahead of reading so the operators can open them locally. A paper moves up into this\nsection when something has actually been taken from it, not when the file arrives.\n\n### `BZSV.pdf` — Ben-Zvi, Sakellaridis, Venkatesh, *Relative Langlands duality*\n\narXiv:2409.04677v1, 7 Sep 2024. `refs.bib` key [`BZSV`](../../papers/BZSV.pdf). The paper the project assumes:\nConjecture 7.5.1 is the standing hypothesis, and the duality pairing a Hamiltonian space\nfor $G$ with one for $\\check G$ is where $M$, its grading, and $\\check M$ come from.\n\n*Used by:* the standing hypotheses in [`blueprint/context.md`](../context.html), and\nthe appendix entries for the hyperspherical setting.\n\n### `SV17.pdf` — Sakellaridis, Venkatesh, *Periods and harmonic analysis on spherical varieties*\n\narXiv:1203.0039v4, 9 Mar 2017. **No `refs.bib` key**, though `main.tex` cites [`SV17`](../../papers/SV17.pdf) — see\nthe gaps below. The classical-side source for what a spherical variety $X$ is and what a\nperiod is, underneath the categorical statement the manuscript proves.\n\n### `WB26.pdf` — Wang and Buehler, agentic discovery systems\n\narXiv:2606.01444. **Not mathematics, and not citable by anything in the blueprint.** It is\nthe source of the idiom [`archive/operations_v2.md`](../process/archive/operations_v2.html)\nused to describe this pipeline: a schema of artifact types, a state that is a\n$\\mathbf{Set}$-valued copresheaf on it, provenance as the category of elements, and\ndiscovery as a change of schema with explicit transport. That version is archived — the\nidiom is true of the repository and does not say which file an agent may write, so the\ncurrent [`operations.md`](../process/operations.html) states the same content as tables and\nkeeps only the law table's last column, which says what enforces each rule. Deliberately\nhas no `refs.bib` key — `refs.bib` is the manuscript's bibliography, and a process\nreference has no business in it.\n\n*Used by:* `process/archive/operations_v2.md`, on the shape of the formalism only.\n\n## b. The reading list\n\nRanked, most worth reading first. The ranking is derived from two things and maintained by\nhand: how often the manuscript cites a source, and whether the appendix black-boxes a\nresult from it — a black box is a place where the pipeline has agreed to assume something,\nwhich makes reading the source the only way to check the hypotheses are really discharged.\n\n### Tier 1 — the conjecture and the two papers on either side of it\n\n| key | what | why first |\n|---|---|---|\n| [`BZSV`](../../papers/BZSV.pdf) | Ben-Zvi, Sakellaridis, Venkatesh, *Relative Langlands duality* (2024) | Conjecture 7.5.1 is the standing hypothesis of the whole project: the main theorem assumes it and upgrades it to Iwahori level. Everything in [`blueprint/context.md`](../context.html) about hyperspherical $M$, the grading, and the duality $X \\mapsto \\check M$ is read off this. |\n| `Lin2025tamelocalBZSV` | Lin, Pham, Yu, *A tamely ramified relative local Langlands from the local unramified relative Langlands conjecture* (2025) | The authors' own predecessor. Read it for what the manuscript takes as already established rather than re-derived. |\n| [`zhu2025tamecategoricallocallanglands`](../../papers/zhu2025tamecategoricallocallanglands.pdf) | Zhu, *Tame categorical local Langlands correspondence* (2025), arXiv:2504.07482 | The Iwahori-level categorical target. The shape of the equivalence the main theorem states is the shape this paper sets up. |\n\n### Tier 2 — where the appendix's black boxes come from\n\n| key | what | why |\n|---|---|---|\n| [`bezrukavnikov2008equivariant`](../../papers/bezrukavnikov2008equivariant.pdf) | Bezrukavnikov, Finkelberg, *Equivariant Satake category and Kostant–Whittaker reduction* (2008) | The most-cited source in the manuscript. The Satake side of every comparison. |\n| [`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf) | Raskin, *D-modules on infinite dimensional varieties* | Where $\\mathcal{D}^{\\mathrm{ren}}$, $\\mathcal{D}_c$, placidity and the ind-completion conventions come from — the ones [Q1-L1](../nodes/Q1/Q1-L1/index.html) and [Q1-L2](../nodes/Q1/Q1-L2/index.html) turn on. Highest value per page for anyone proving a node in the current frontier. |\n| [`arkhipov2004quantum`](../../papers/arkhipov2004quantum.pdf) | Arkhipov, Bezrukavnikov, Ginzburg, *Quantum groups, the loop Grassmannian, and the Springer resolution* (2004) | The Iwahori–Whittaker input the appendix cites as a black box with hypotheses \"as cited\". |\n| [`ben2010integral`](../../papers/ben2010integral.pdf) | Ben-Zvi, Francis, Nadler, *Integral transforms and Drinfeld centers in derived algebraic geometry* (2010) | The base-change and integral-transform formalism used without comment throughout. |\n| [`bezrukavnikov2016two`](../../papers/bezrukavnikov2016two.pdf) | Bezrukavnikov, *On two geometric realizations of an affine Hecke algebra* (2016) | The Iwahori-level statement the main theorem is modelled on. |\n\n### Tier 3 — foundations, to consult rather than to read\n\n[`HA`](../../papers/HA.pdf) (Lurie, *Higher Algebra*) for the monoidal- and module-category conventions the\nappendix cites by section; [`GR17vol1`](../../papers/GR17vol1.pdf) (Gaitsgory–Rozenblyum) and `SAG` for the derived\nalgebraic geometry; [`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf) for geometric Satake proper. Look up the\nnumbered statement, check the hypothesis, and stop.\n\n### Added by `/examples` — Q1-L5 (dévissage: equality ⟺ stratumwise generation)\n\nAppended, not substituted for the entries above: these are the pages actually read for that node.\n\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — Raskin, *D-modules on infinite dimensional varieties*,\n  [samraskin.net/dmod.pdf](https://www.samraskin.net/dmod.pdf). §6.5, formula (6.5.1): for a\n  *reasonable* ind-scheme $T=\\varinjlim_i T_i$, $\\mathcal{D}^!(T)=\\varinjlim_i\\mathcal{D}^!(T_i)$ along\n  the left adjoints of $!$-pullback and $\\mathcal{D}^*(T)=\\varinjlim_{\\mathcal{I}^{\\mathrm{op}}}\\mathcal{D}^*(T_i)$\n  along $\\alpha^!$; Def. 6.4.1 (reasonable), Def. 6.8.1 (placid ind-scheme), Rem. 6.8.3 (both categories\n  compactly generated and canonically dual), Prop. 6.7.1 (equivariant setting). The sourced form of the\n  appendix's example on sheaves on a placid ind-scheme, and the ind-half of every stratification argument\n  in Q1.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — Chen–Yi, *Singularities of orbit closures in loop\n  spaces of symmetric varieties*, arXiv:2310.20006v3. Thm 17: $\\overline{LX}_\\mu=\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$,\n  with index set the dominant coweights of the maximal $\\theta$-split torus in the dominance order;\n  §5 *Placidness of orbit closures*; Prop. 62 (dimension theory, relative codimension). Cor. 8 (= Thm 86):\n  for even orbit codimensions the relative Satake category $\\mathrm{Perv}(L^+G\\backslash LX)$ is semisimple\n  and equivalent to $\\mathrm{Rep}(\\check G_X)$. Cor. 6 (= Thm 92): formality of the de-equivariantised Ext\n  algebra. *Caveat found while reading:* the standing setting is $X=G/K$ **symmetric** over\n  $k=\\overline{\\mathbb{F}}_p$ with $p\\neq2$, and §1.2.5 states that the slice construction uses the\n  involution essentially — while the appendix records the hypothesis of the black box drawn from this\n  paper as \"$X$ smooth affine spherical\".\n  *Correction, added the same day:* the numbers above are v3's, and the numbering moved in v4 (10 Jul\n  2025) — the closure theorem is Thm 18 and the semisimplicity corollary Cor. 9 there — while v4's\n  comment reads \"We remove most assumptions on the characteristic\", so the characteristic clause above\n  should not be relied on. What the title and the definition of $X=G/K$ do establish, in every version,\n  is that the setting is **symmetric**, not general spherical; the abstract's \"spherical orbit closures\"\n  means the $L^+G$-orbits, as against the Iwahori orbits, on a symmetric $X$. No \"Thm 36\" was located in\n  v3 or v4.\n- **[`drinfeld2015compactgeneration`](../../papers/drinfeld2015compactgeneration.pdf)** (key added 2026-08-09; this entry read it before the key existed) — Drinfeld–Gaitsgory, *Compact generation of the category of D-modules on the\n  stack of $G$-bundles on a curve*, Camb. J. Math. 3 (2015), arXiv:1112.2402. Thm 0.1.2; §0.2 for\n  truncative / co-truncative / truncatable; and, as the negative control for stratumwise generation over\n  an infinite stratification, Thm 12.1.1 with Ex. 12.1.2, Lem. 12.2.6 and Cor. 12.2.7 — a smooth\n  non-quasi-compact scheme whose $\\mathcal{D}$-module category is not compactly generated, where the\n  subcategory generated by all compact objects is proper *and* restricts to a non-generating subcategory\n  on the open stratum. Note [`drinfeld2013some`](../../papers/drinfeld2013some.pdf) in `refs.bib` is the *other* Drinfeld–Gaitsgory paper\n  (GAFA 2013); this one has no key.\n\n### Added by `/examples` — Q1-L4 (orbit stacks are classifying stacks of placid groups)\n\nAppended, not substituted for the entries above.\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — Chen–Yi, arXiv:2310.20006**v4**. *Correction to\n  the block above, added 2026-08-04:* **Theorem 36 does exist in v4** — it is the placidity theorem\n  (\"$\\overline{\\mathcal{O}}_v$, $\\overline{LX}_\\lambda$ are irreducible placid schemes; the closed\n  embeddings into $LX$ are finitely presented\"), which is exactly what the appendix black-boxes, and\n  **Remark 37** states it \"remains true for general spherical varieties\" because it only uses\n  [SW22, Lem. 2.3.10] and Drinfeld's Thm 35. That licenses the appendix's hypothesis \"smooth affine\n  spherical\" for the placidity clause. What is *not* licensed for general spherical $X$: **Prop. 17**\n  (orbits represented by $\\Lambda_S^+$, $S$ a maximal $\\theta$-split torus) and **Thm. 18**\n  ($\\overline{LX}_\\mu=\\bigsqcup_{\\lambda\\le\\mu}LX_\\lambda$, order = non-negative sums of positive\n  coroots), whose proofs run through $\\theta$-twisted $\\mathrm{SL}_2$/$\\mathrm{SL}_3$ computations\n  (Prop. 20, Cor. 21). Also used: Prop. 39 (the placid presentations of $LX$), §1.2.3 and Cor. 9(ii)\n  (equivariant local systems on $LX_\\lambda$ indexed by $\\pi_0$ of the $L^+G$-stabiliser), Rem. 19\n  (over $\\mathbb{C}$ the closure relation is [Nad04, Thm 10.1]), Appendix A.1 (placid schemes/stacks).\n- **(no `refs.bib` key)** — Sakellaridis, Wang, *Intersection complexes and unramified $L$-factors*,\n  J. Amer. Math. Soc. **35** (2022) 799–910, arXiv:2009.03943. §2.3 holds for **any** affine spherical\n  $X$ (the extra hypotheses start \"from Section 3 onwards\"). **Thm. 2.3.5** — the $L^+G$-orbits on\n  $\\mathsf{L}^\\bullet X$ are $\\mathcal{V}\\cap\\mathring\\Lambda_X\\cong X^\\bullet(F)/G(\\mathfrak{o})$,\n  restricting to the monoid $\\mathfrak{c}_X^-\\cong(X(\\mathfrak{o})\\cap X^\\bullet(F))/G(\\mathfrak{o})$;\n  **Prop. 2.3.7** — those orbits stratify $\\mathsf{L}^\\bullet X$, each is $\\mathsf{L}^+G/S$ for its\n  stabiliser $S$, each is open in its closure, and the proof exhibits $S$ through its finite-type\n  images $S_n$ with smooth unipotent congruence kernels. This is the published form of both halves\n  the node needs: the stabiliser structure of clauses (i)–(ii), **and** the failure of clause (iv) —\n  $\\mathfrak{c}_X^-$ is a monoid, hence infinite once nonzero, and all of it sits inside the closed\n  $\\mathsf{L}^+X$. Also Thm. 2.2.5 (local structure), §2.2 (affine degeneration, the source Chen–Yi\n  cite), Rem. 2.3.6 ($\\mathfrak{c}_X^-=\\mathcal{C}_0(X)\\cap\\mathcal{V}\\cap\\mathring\\Lambda_X$).\n- **[`zhu2016introduction`](../../papers/zhu2016introduction.pdf)** — Zhu, arXiv:1603.05593. **Prop. 2.1.5**: $\\mathrm{Gr}_\\mu$ is a single\n  $L^+G$-orbit with stabiliser $L^+G\\cap t^\\mu L^+Gt^{-\\mu}$, smooth of dimension $\\langle2\\rho,\\mu\\rangle$,\n  and $\\mathrm{Gr}_{\\le\\mu}$ is its closure; §2.1 p. 26 gives $p_\\mu:\\mathrm{Gr}_\\mu\\to G/P_\\mu$ with\n  affine-space fibres. The group-case anchor for clauses (i)–(iv).\n- **(no `refs.bib` key)** — Nadler, *Matsuki correspondence for the affine Grassmannian*, Duke Math. J.\n  **124** (2004) 421–457. Thm. 4.2/4.3 (orbit parametrization), **Thm. 10.1** (the closure relation over\n  $\\mathbb{C}$). The older source for the symmetric-case closure theorem.\n\n### Added by `/examples` — Q1-L1 (function-theoretic analogue; known cases of the equivalence)\n\nAppended, not substituted for the entries above: the pages actually read for that node.\n\n- **[`BZSV`](../../papers/BZSV.pdf)** — the pages of record for both halves of the run. §7.3 (pp. 155–159): the placid case,\n  the basic object $\\delta_X$ with $D\\delta_X=\\delta_X$, Ex. 7.3.5 (Iwasawa–Tate $\\delta_l$, Hom (7.9)),\n  Ex. 7.3.7 (Godement–Jacquet, (7.10)). §7.5 (pp. 161–167): Conj. 7.5.1, pointing §7.5.2, Hecke\n  desideratum §7.5.3 with (7.16) and p. 163 (\"all sheaves … generated from the basic object\"),\n  Lemma 7.5.13 (the Hecke-generated subcategory, equivariantizable). §7.6 (pp. 168–171): the catalogue\n  of known cases — pt, $\\mathbb{A}^1/\\mathbb{G}_m$, group, Whittaker [[FGV01](../../papers/FGV01.pdf)], [HR23], [CMNO22]\n  $GL_{2n}/Sp_{2n}$, [BFGT21]/[BFT22a] Rankin–Selberg and Gross–Prasad, [MT24]+[CN24] $PSL_2/PO_2$\n  (type-$N$ boundary, quantum-$SL_2$ block). §8 opening (p. 171): Plancherel algebra = inner\n  endomorphisms of the basic object. §9 (pp. 189–201): $\\mathbf{e}=\\mathbf{1}_{X(\\mathfrak{o})}$,\n  (9.1)–(9.2), Prop. 9.2.1 (density (9.5)), §9.3 boxed match with [Sak13, Thm 9.0.1] and [SW22,\n  (1.11)], §9.4 (9.15) and the $k=\\mathbb{C}$ Hecke-module isomorphism\n  $C_c^\\infty(X_F/G_O)\\simeq\\mathbb{C}[\\check G_X]^{\\check G_X}$ — the function-theoretic analogue of\n  the Satake subcategory, and the statement behind proposed nodes Q1-a1/Q1-a2.\n- **[`SV17`](../../papers/SV17.pdf)** (no `refs.bib` key, recorded below) — §16 (pp. 238–246): Conj. 16.2.2 (the unitary local\n  conjecture over $X$-distinguished Arthur parameters), §16.3 pp. 243–244 quoting [Sak13, Thm 9.0.1]\n  (unramified $L^2$-spectrum supported on $X$-distinguished unramified parameters; conditions:\n  homogeneous affine or Whittaker-induced, combinatorial assumptions), and the pointer to Hironaka and\n  Offen for non-split analogues. Hyperspecial level throughout — no Iwahori function theory here.\n- **(no `refs.bib` key)** — Sakellaridis, *Spherical functions on spherical varieties*, Amer. J. Math.\n  **135** (2013) 1291–1381, arXiv:0905.4244. Not opened; cited through BZSV §9.3 and SV17 §16.3, both\n  of which attribute Thm 9.0.1 (unramified Plancherel for $X$) to it. The primary source for Q1-a2 if\n  it is materialized; fetching the PDF is worth it then.\n- **[`bezrukavnikov2008equivariant`](../../papers/bezrukavnikov2008equivariant.pdf)** — Thm 5 (p. 7): monoidal equivalences\n  $D^{\\check G}_{perf}(U^{[]}_\\hbar)\\cong D_{\\mathbf{G_O}\\rtimes\\mathbb{G}_m}(\\mathrm{Gr})$,\n  $D^{\\check G}_{perf}(\\mathrm{Sym}^{[]}(\\check{\\mathfrak{g}}))\\cong D_{\\mathbf{G_O}}(\\mathrm{Gr})$ —\n  the group-case instance, and the derived-Satake compatibility named in the unramified conjecture.\n- **[`bezrukavnikov2016two`](../../papers/bezrukavnikov2016two.pdf)** — Thm 1 (p. 5), equivalences (2)–(4): $D_{I^0I^0}$, $D_{I^0I}$, $D_{II}$\n  vs coherent categories of the Steinberg variety, e.g.\n  $\\Phi_{II}\\colon D_{II}\\cong DGCoh^{G^\\vee}(\\tilde{\\mathcal{N}}\\times^L_{\\mathfrak{g}^\\vee}\\tilde{\\mathcal{N}})$\n  — the Iwahori-level group case the main theorem is modelled on.\n- **[`arkhipov2004quantum`](../../papers/arkhipov2004quantum.pdf)** — diagram (1.1.1) and (1.1.2) (pp. 2–3): the three-way equivalence\n  $D^b\\mathrm{block}^{\\mathrm{mix}}(\\mathsf{U})\\cong D^b\\mathrm{Coh}^{G\\times\\mathbb{C}^*}(\\tilde{\\mathcal{N}})\\cong D^b\\mathrm{Perv}^{\\mathrm{mix}}(\\mathrm{Gr})$\n  and $\\mathrm{block}(\\mathsf{U})\\simeq\\mathrm{Perv}(\\mathrm{Gr})$ — the Iwahori–Whittaker instance.\n- **[`zhu2025tamecategoricallocallanglands`](../../papers/zhu2025tamecategoricallocallanglands.pdf)** — §1.1 (pp. 2–5): aims and setting only (categorical\n  arithmetic local Langlands via $\\mathrm{Shv}(\\mathrm{Isoc}_G)$; proof of the tame case for\n  quasi-split unramified $G$ announced as the paper's second aim). Main-theorem numbers not yet\n  extracted — a targeted read is still owed before any node cites one.\n- **[`BravermanFinkelbergGinzburgTravkin_2021`](../../papers/BravermanFinkelbergGinzburgTravkin_2021.pdf)** — arXiv:1909.11492, Compositio **157** (2021)\n  1724–1765. Abstract only (mirabolic Satake; $GL(N-1,\\mathcal{O})$-equivariant sheaves on\n  $\\mathrm{Gr}_{GL_N}$ vs supergroup representations; placed in the Gaiotto/BZSV framework). The\n  appendix's Thm 3.6.1 citation for $X=M_n$ not independently verified — PDF not on disk.\n- **[`chen2022quaternionic` o point at. The last one is also cited from\n[`blueprint/appendix/`](../appendix/index.html), which makes it a live violation of the\nrule that the blueprint cites only keys that exist. Fixing `refs.bib` and the manuscript is\na human job; recorded here so it is not rediscovered a fourth time.\n\n## c. Adding a reference\n\nThe prover and the example-finder both read the literature, and both hit the same failure\nwithout this file: a source is consulted, the useful sentence is copied into a draft, and\nthe reason that source was the right one is lost. So:\n\n- **During `/prove`** — when a proof needed a source that is not already an appendix entry,\n  the prover does not cite it. It reports the gap, and adds the source to the reading list\n  above with one line on what was wanted from it. Turning that into something citable is\n  the lead-researcher's job, and is a change to the closed world.\n- **During `/examples`** — every example carries its source. When that source is worth\n  keeping, it goes in section (a) with the PDF, or in the reading list when the PDF is not\n  to hand. An example's citation must resolve without this directory, so nothing here is\n  load-bearing for the example — it is the reading trail, not the evidence.\n- **Never rewrite someone else's entry.** Correct it by adding a line to it, the way\n  [`process/journal.md`](../process/journal.html) is corrected. An entry that turned out to be\n  wrong is more useful than a missing one.\n\n### Added by `/prove` — Q1-L4-L3 (unipotent de Rham contractibility)\n\n- **[`drinfeld2013some`](../../papers/drinfeld2013some.pdf)** — Drinfeld–Gaitsgory, *On some finiteness questions for algebraic stacks*,\n  GAFA 2013. Wanted as the likely theorem-status home in print of the mechanism Q1-L4-L3 proves\n  internally ($\\mathcal{D}^!(B(H/N))\\simeq\\mathcal{D}^!(BH)$ for $N$ unipotent, char 0); PDF not on\n  disk this run, so nothing was verified at page level and the node's write-up cites nothing from it.\n\n## ring relations of $\\Lambda_S^+$)\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4 pp. 9–13 read this run. Verified for the\n  write-up: §3.1 fixes the order on $\\Lambda_S$ by restriction from $\\Lambda_T$ (\"$\\lambda-\\mu$ a\n  non-negative sum of positive coroots\", the coroots being those of the $\\theta$-split Borel pair,\n  not of the restricted datum); Prop. 17(i) and Thm. 18 are as the appendix entry transcribes them.\n  What the entry does **not** carry, and what Q2-L6 needed: the proof of Thm. 18 (p. 13) reduces a\n  degeneration to $\\mu-\\lambda=\\alpha\\in\\Lambda_S^+\\cap\\check\\Phi^+$ or $\\mu-\\lambda=\\alpha-\\theta(\\alpha)$\n  — positive coroots, never simple ones — and the rank-one input is the $\\theta$-twisted\n  $\\mathrm{SL}_2(\\mathcal{O})$ computation Prop. 20 / Cor. 21 (pp. 11–12). An appendix entry for\n  Prop. 20 and Cor. 21 is what would give the \"rank one move\" of Q2-L6(i) any content.\n- **Nadler, *Perverse sheaves on real loop Grassmannians*** (the source's [Nad04]/[Nad05]; **no\n  `refs.bib` key**, not on disk) — wanted for the minimal-degeneration lemma [Nad05, Lem. 2.1.1]\n  that Chen–Yi invoke on p. 13 to cut a general closure relation into single steps. That lemma, not\n  a \"simple coroot\" claim, is the correct combinatorial input for a repaired Q2-L6(i).\n- **Stembridge, *The partial order of dominant weights*, Adv. Math. 136 (1998)** (**no `refs.bib`\n  key**, not on disk) — wanted for the exact shape of the covering relations of the dominance order\n  on dominant (co)weights. Q2-L6 refutes \"covering $\\Rightarrow$ simple coroot\" by an elementary\n  $\\mathrm{SL}_3$ computation and needs nothing further, but a node that wants the positive\n  statement (\"covering $\\Rightarrow$ positive root, with listed exceptions\") wants this paper.\n\n### Added by `/prove` — Q2-L5 (ind-proper pushforward, base change, and the costalk on one orbit)\n\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — Raskin, *D-modules on infinite dimensional varieties*. PDF on\n  disk, and it is the home of the functoriality package Q2-L5 records as GAP (Prop): Table 1, p. 3\n  (\"D-module functors in infinite type\") states, for $f$ a morphism of indschemes, that\n  $f_{*,!-dR}\\colon D^!(S)\\to D^!(T)$ is defined for $f$ ind-finitely-presented, is **left adjoint to\n  $f^!$ when $f$ is ind-proper**, and \"always satisfies base-change with upper-! functors\"\n  (references there: §3.9, §6.3); the renormalized $f_{*,\\mathrm{ren}}$ for placid $S,T$ with\n  dimension theories is §6.16 with Prop. 6.18.1. Read at page level this run (pp. 1–3). An appendix\n  entry built from it would give Q2-L5 clauses (i), (iii), (iv) of GAP (Prop) and, with §6.12.6's\n  dimension-theory normalization, the $\\omega$ half of GAP (Loc). Nothing from it is cited in the\n  write-up, which has no entry to cite.\n- **Coherence of the Hecke generators** — GAP (Coh): wanted is a statement that the extension to\n  $K\\backslash\\mathrm{Gr}$ of the constant object on a Schubert closure $K\\backslash\\overline{\\mathrm{Gr}}_\\nu$\n  lies in $\\mathcal{D}_c(K\\backslash\\mathrm{Gr})$, the exact analogue of the $\\mathrm{IC}_0$\n  membership the appendix ratifies as an import. `bouthier_kazhdan_varshavsky_2022perversesheavesinfinitedimensionalstacks`\n  (in `refs.bib`, PDF **not** on disk) is the likely home; nothing was verified at page level.\n- **Parity/decomposition input** — GAP (Par): wanted is the splitting an even ind-proper map\n  produces. Juteau–Mautner–Williamson (*Parity sheaves*) and Mirković–Vilonen's stratified\n  semismallness of convolution are the classical statements, flagged in this node's history as\n  orientation; **neither has a `refs.bib` key** and neither is on disk, and both are stated for\n  finite-dimensional constructible settings, so an entry would also have to carry the transport to\n  renormalized de Rham categories on placid ind-schemes.\n\n### Added by `/prove` — Q2-L2 ($\\mathcal{D}$-modules on a classifying stack of finite type)\n\n- **Bernstein–Lunts, *Equivariant sheaves and functors*, Springer LNM 1578 (1994)** (**no `refs.bib`\n  key**, not on disk) — wanted for the structure of the equivariant derived category of a point,\n  which is Q2-L2's GAP: for $H$ of finite type, $\\mathcal{D}_c(BH)$ is bounded for the $t$-structure\n  induced by $!$-restriction along $\\mathrm{pt}\\to BH$, with heart the finite-dimensional\n  representations of $\\pi_0(H)$ and $\\omega_{BH}$ the trivial one up to shift (§12.7 for the\n  connected case, where the category is modules over $H^*_H(\\mathrm{pt})$). This is the statement\n  that makes connectedness load-bearing in Q2-L2(i)–(iii); nothing from it is cited in the write-up,\n  which has no entry to cite.\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** (PDF on disk) — supplies only the *descent* half of that GAP,\n  and the appendix already carries it as the torsor-descent entry: $!$-pullback along a\n  $\\mathcal{G}$-torsor identifies $\\mathcal{D}^!$ of the base with the $\\mathcal{G}$-equivariant\n  category of the total space, so $\\mathcal{D}^!(BH)$ is the limit of the bar complex of\n  $\\mathrm{pt}$. It is **not** in Q2-L2's `objects:` field, and on its own it does not identify the\n  heart of that limit with $\\mathrm{Rep}\\,\\pi_0(H)$ — that identification is the missing ingredient.\n\n### Added by `/prove` — Q2-L4 (generation across a filtered colimit in $\\mathrm{Pr}^L$)\n\n- **[`HTT`](../../papers/HTT.pdf) (Lurie, *Higher Topos Theory*)** (`refs.bib` key exists, PDF on disk; listed at \"Known\n  gaps in `refs.bib`\" above as lacking a full entry) — wanted for the two presentable-category\n  facts Q2-L4 flags as its GAP, both used but not available from any appendix entry: (i) that\n  $\\mathrm{Pr}^L_{\\mathrm{st}}$ is closed under small colimits in $\\mathrm{Pr}^L$ (§5.5. hcal{D}^{\\mathrm{ren}}(K\\backslash LX)$ rather than inside\n  $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash\\overline{LX}_\\lambda)$, where as stated it is unusable.\n  Nothing from it is cited in the write-up, which has no entry to cite.\n\n### Added by `/examples` — Q2-L6 (which $X$ admit the Hecke–Bott–Samelson package)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\n\n- **(no `refs.bib` key)** — Nadler, *Perverse sheaves on real loop Grassmannians*, Invent. Math.\n  **159** (2005) 1–73, arXiv:math/0202150v6. §2.1.1–2.1.2 read on the page. **Lemma 2.1.1**:\n  \"$\\Lambda_S\\cap Q^{\\mathrm{pos}}$ is generated by the elements $\\alpha\\in\\Lambda_S\\cap R^{\\mathrm{pos}}$,\n  and $\\sigma(\\alpha)\\in\\Lambda_S$, for $\\alpha\\in R^{\\mathrm{pos}}$\", with $\\sigma(\\lambda)=\\theta(\\lambda)+\\lambda$\n  and $\\Lambda_S=\\Lambda_T^\\theta$ (§2.1.2). This is the published generating set for the differences\n  allowed by the closure order — the positive form of Q2-L6's rider that a covering difference need\n  not be a *simple* restricted coroot — and it is the lemma Chen–Yi invoke on their p. 13. Also\n  Thm. 1.2.2 (main theorem, $\\mathbf{Q}(\\mathrm{Gr}_{\\mathbb{R}})\\simeq\\mathrm{Rep}(\\check H)$),\n  Cor. 1.2.1 (semisimplicity), Thm. 1.2.3 ($t$-exactness iff quasi-split), Table 1 (the associated\n  $\\check{\\mathfrak{h}}$ for each real form). No Bott–Samelson or resolution statement anywhere in it.\n- **[`chen2024real`](../../papers/chen2024real.pdf)** (= `chen2024realgroupssymmetricvarieties`) — Chen, Nadler, *Real groups,\n  symmetric varieties and Langlands duality*, arXiv:2403.13995v1. **PDF now on disk** as\n  `papers/chen2024real.pdf`, fetched from arXiv and saved during the `/examples Q2-L6`\n  verification pass on 2026-08-06. pp. 56–60 read. **Thm. 13.3** (the Hecke action on the real and relative\n  Satake categories satisfies the conclusion of the decomposition theorem); **Thm. 13.4** (formality\n  and commutativity of $A_X\\simeq A_{\\mathbb{R}}$, citing [CY] for the formality of $A_X$);\n  **Thm. 13.5** ($M_X^\\vee\\simeq M_{\\mathbb{R}}^\\vee$ and $D_c(X(\\mathcal{K})/G(\\mathcal{O}))_0\\simeq\n  \\mathrm{Coh}(M_X^\\vee/G^\\vee)$); **Def. 13.6** — $Q_X\\subset\\mathrm{Perv}(X(\\mathcal{K})/G(\\mathcal{O}))$\n  is the summands of $\\omega_{X(\\mathcal{O})/G(\\mathcal{O})}\\star\\mathrm{IC}_V$, i.e. the abelian\n  shadow of `def:satake_subcategory`; **Prop. 13.7**; **Cor. 13.8** — $Q_X\\simeq Q_K\\simeq\n  \\mathrm{Rep}(H^\\vee_{real})$, semisimple with irreducibles $\\mathrm{IC}_X^\\lambda$ for\n  $\\lambda\\in\\sigma(\\Lambda_T)$. Cor. 13.8 is the sharpest thing in print on which orbits spherical\n  Hecke convolution actually reaches, and it says $\\sigma(\\Lambda_T)$ and not $\\Lambda_S^+$.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, pp. 10–14 and 17–19 and 51–54 read this run.\n  New relative to the records above: the proof of **Thm. 18** (§3.2.5, p. 13) reduces to\n  $\\mu-\\lambda=\\alpha\\in\\Lambda_S^+\\cap\\check\\Phi^+$ or $\\alpha-\\theta(\\alpha)$ *by [Nad05, Lemma 2.1.1]*,\n  and realizes each by the explicit $\\mathrm{SL}_2(\\mathcal{O})$ family of **Prop. 20** / **Cor. 21**\n  (Case 3 applies Prop. 20 twice, in $\\mathrm{SL}_3$); **Lemma 28** with **Lemma 29** (pp. 18–19) —\n  the affine Mars–Springer classification $I_0\\backslash P_\\alpha\\mathcal{O}_v\\simeq\\mathbb{P}^1/H_{\\alpha,v}$\n  into seven types, the rank-one parahoric move *at Iwahori level*; **Thm. 87** with **Ex. 88**\n  (evenness + connected stabilizers $\\Rightarrow$ $\\mathrm{Perv}_\\delta(L^+G\\backslash LX)$ semisimple\n  $\\simeq\\mathrm{Rep}(\\check G_X)$; the cases $\\mathrm{SL}_{2n}/\\mathrm{Sp}_{2n}$,\n  $\\mathrm{Spin}_{2n}/\\mathrm{Spin}_{2n-1}$, $E_6/F_4$ with $\\check G_X=\\mathrm{PGL}_{2n},\\mathrm{PGL}_2,\\mathrm{PGL}_3$);\n  **Lemma 90** (evenness $\\Rightarrow$ every element of $\\ _dmodules_infinite_var.pdf), §6.3 and §6.16** — with the appendix entry now in place, the\n  residue of the old GAP (Prop) splits in two, and both halves want this source at page level.\n  (FP): §6.3's *finitely presented* means schematic with finitely presented base change along any\n  scheme, and the node's hypothesis (a) gives ind-properness only — wanted is whatever in §6.3\n  (or in the Chen–Yi presentation of $\\overline{LX}_\\lambda$) certifies an iterated convolution map\n  $Z_\\lambda\\to LX$ as ind-finitely-presented. (Eq): the entry is about ind-schemes and $\\mathcal{D}^!$,\n  so wanted alongside it is coherence-preservation for $f_{*,!-\\mathrm{dR}}$ — §6.16 with\n  Prop. 6.18.1 for the renormalized $f_{*,\\mathrm{ren}}$ — which is what would let it ind-extend to\n  $\\mathcal{D}^{\\mathrm{ren}}(K\\backslash Z_\\lambda)\\to\\mathcal{D}^{\\mathrm{ren}}(K\\backslash LX)$\n  once §3.17's torsor descent supplies the $K$-equivariance. Nothing beyond the declared entry is\n  cited in the write-up.\n\n### Added by `/prove` — Q1-L5-L3 (round 1)\n\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf), Table 1 (p. 3) row 1 and §6.16 with Prop. 6.18.1** — wanted for\n  the GAP at Step 4 of [Q1-L5-L3](../nodes/Q1/Q1-L5/Q1-L5-L3/index.html): that\n  $!$-restriction along a *finitely presented closed embedding* of $K$-placid ind-schemes carries\n  coherent $\\mathcal{D}$-modules to coherent ones. Table 1 was read this run: row 1 gives\n  $f^!\\colon D^!(T)\\to D^!(S)$ under **no** hypothesis on $f$ (§3.6), and rows 5–6 give the\n  renormalized $f_{*,\\mathrm{ren}}$ and $f^{!,\\mathrm{ren}}$ for $S,T$ placid **with dimension\n  theories** (§6.16, Prop. 6.18.1) — but the table records adjunctions and base change only, and\n  says nothing about $\\mathcal{D}_c$. So what is wanted is whichever statement in §6.16 (or a\n  chart-lifting statement: that every smooth finite-type test of $K\\backslash\\overline{LX}_\\lambda$\n  is, after a smooth surjective base change, the restriction of one of $K\\backslash Z$) certifies\n  coherence-preservation. Nothing beyond the declared entries is cited in the write-up.\n\n### Added by `/examples` — Q2-L9 (the Iwahori Bott–Samelson tower, read against its refutation)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, pp. 2–4, 17–20, 43–46, 48–49 read this run.\n  The natural home for Q2-L9, and the source of every precedent hit. **Cor. 27** (p. 17): (i) each\n  $I_0$-orbit closure contains finitely many $I_0$-orbits; (ii) each $L^+G$-orbit is a union of\n  finitely many $I_0$-orbits. **Lemma 28** (p. 18): $P_\\alpha=I_0\\sqcup I_0s_\\alpha I_0$, so\n  $P_\\alpha/I_0\\simeq\\mathbb{P}^1$, with the affine Mars–Springer classification\n  $I_0\\backslash P_\\alpha\\mathcal{O}_v\\simeq\\mathbb{P}^1/H_{\\alpha,v}$ into types I, IIa/b, IIIa/b,\n  IVa/b, and **Lemma 29** for which type occurs — the published form of the node's hypothesis (B),\n  minus its properness and its birationality clause. **Lemma 31** (p. 19): $\\mathcal{O}_v$ closed\n  $\\iff$ $n_v$ normalizes $I_0$ $\\iff$ the twisted involution $w_v\\in\\Omega$ has *length zero*\n  $\\iff$ no type-b simple reflection; **Remark 32**: for $G$ simply connected the closed $I_0$-orbits\n  are the base changes of the closed $B_0$-orbits on $X$, a bijection, and they lie in $L^+X$;\n  **Remark 33**: the equivalence is *not* expected for general spherical $X$. **Prop. 63** (announced\n  p. 4 with (1)): the dimension theory $\\delta$ with\n  $\\delta(v)-\\delta(u)=\\mathrm{codim}_{\\overline{\\mathcal{O}}_v}(\\overline{\\mathcal{O}}_u)$.\n  **Prop. 74**, formula (29) (p. 44): the simple-reflection Hecke action, whose type-IVa line\n  carries the open orbit with *two* local systems. **§8.5** (p. 46): the descent \"if closed …\n  otherwise by Lemma 31 there is $\\alpha$ with $\\mathcal{O}_v$ of type b\", with **Lemma 77**.\n  **§8.5.3** with (35) (p. 48): the unique open $I_0$-orbit $\\mathcal{O}_{v_\\lambda}\\subset LX_\\lambda$\n  and $\\mathrm{IC}_{\\chi,\\lambda}=\\mathrm{IC}_{\\xi_\\chi,v_\\lambda}$ — hypothesis (C) in print.\n  **Remark 83** (p. 49): the $I_0$-orbits on $L^+G/L^+K$ biject with the $B_0$-orbits on $X=G/K$.\n  *What the paper does not contain, checked on the page:* any resolution or convolution tower for\n  $\\overline{\\mathcal{O}}_v$ or $\\overline{LX}_\\lambda$ — the singularity results (Thm. 81, Thm. 82,\n  pp. 48–49) go through contracting transversal slices (Props. 47, 58, 113), which is the\n  Mars–Springer route chosen to avoid resolutions.\n- **(no `refs.bib` key)** — P. Achinger, N. Perrin, *Spherical multiple flags*, arXiv:1307.7236.\n  Full text read this run for the finite-dimensional shadow of the corrected statement: Theorem 1\n  ($G$ simply laced, $P_1,P_2$ cominuscule, $X=G/P_1\\times G/P_2$ — $B$-orbit closures normal,\n  Cohen–Macaulay, with a rational resolution), **Theorem 2.13** (the minimal $B$-orbits for the weak\n  order are the $B\\times B$-orbits), and the §4 tower\n  $P_{\\gamma_r}\\times^B\\cdots\\times^B P_{\\gamma_1}\\times^B Z\\to\\overline{\\mathcal{O}}$, proper and\n  birational, based on a resolution $Z$ of a **minimal** orbit closure. This is the shape the\n  critique of Q2-L9 prescribes, in print, in the finite-dimensional case; the loop-space statement\n  is nowhere.\n- **`NP01`** (Ngô–Polo, *Résolutions de Demazure affines…*) — abstract re-read only this run; the\n  Q2-L6 record above stands and nothing new was taken. Wanted, and still not verified on the page\n  here: whether the paper's affine Demazure resolutions are built in the affine *flag* variety (base\n  the point $I/I$) as well as in the affine Grassmannian (base $\\mathrm{Gr}_0$).\n- **[`HTT`](../../papers/HTT.pdf)** (Lurie, *Higher Topos Theory*) — wanted by the Q2-L4 round-2 prove run for the provenance\n  of the colimits-of-presentables black box (Prop. 5.5.3.13 and the paragraph of purpose on printed\n  p. 470, Thm. 5.5.3.18 on p. 472; in `papers/HTT.pdf` the PDF page is the printed page $+18$).\n  *Correction to the record above:* the \"Known gaps in `refs.bib`\" section lists [`HTT`](../../papers/HTT.pdf) among the keys\n  with no entry, but it does have one — `refs.bib:524`, `@book {HTT, ...}`. Verified by the Q2-L4\n  round-1 critique; the three other keys named there are untouched by this note.\n\n### Added by `/examples` — Q1-L3-L4 (the orbit-closure witness $\\overline{i}_{\\lambda,*}\\omega$)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\nThis run was also asked to test the open $\\omega$-tension recorded on the appendix's dualizing-object\nentry, and the four sources below are what bears on it.\n\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)** — pp. 1–7, 20–23, 33–42 read on the page. **§2.3, p. 5**: $D^!$\n  on prestacks is the **right** Kan extension, so $D^!(\\mathcal{Y})=\\varprojlim_i D^!(Y_i)$ for any\n  presentation; **§6.5, (6.5.1), p. 35**: for a reasonable indscheme the *same* category is\n  $\\varinjlim_i D^!(T_i)$ along $\\alpha_{*,!-\\mathrm{dR}}$ — so the colimit presentation carries no\n  \"every object comes from a stage\" content, which is a statement about compacts only. **§4.7 with\n  Ex. 4.7.1, Ex. 4.7.2 and Prop. 4.8.1 (p. 22)**: the renormalized dualizing sheaf\n  $\\omega_T^{\\mathrm{ren}}\\in D^*(T)$ of a placid scheme, equal to $k_T$ when the stages are smooth,\n  and identified with $\\omega_T\\in D^!(T)$ under $\\eta_T$. **§6.14–6.15 (pp. 40–41)**: the\n  $\\tau$-renormalized $\\omega_T^\\tau\\in D^*(T)$ of a placid *indscheme* with a dimension theory,\n  characterized by $\\iota^!\\omega_T^\\tau=\\omega_S^{\\mathrm{ren}}[2\\tau_S]$ — so a dualizing object on\n  $\\mathrm{Gr}$ and on $LX$ does exist in print. **Warning 4.9. ly as in Section 8.1.1\n  (replacing $I_0$ by $L^+G$)\" — and names $e_{L^+X}$ the constant sheaf on the **closed** $L^+G$-orbit\n  $LX_0=L^+X$. **Prop. 70** (p. 38) restricts $a$ to $\\overline{LG}_w\\times^{I_0}\\overline{\\mathcal{O}}_v\n  \\to\\overline{\\mathcal{O}}_{v'}$, and the proof (pp. 39–40) reads \"since $a$ proper it follows from\n  [Gro65, Theorem 8.10.5] that each $a^{[n]}_j$ is proper\". *So properness of the convolution map is in\n  print, asserted inside a proof and nowhere proved* — the same parenthesis main.tex was carrying. Two\n  limits of the match: the setting is $X=G/K$ **symmetric homogeneous**, where $L^+X$ is a single orbit\n  closure (for non-homogeneous spherical $X$ it is not), and §1.2.6 transfers the proofs to\n  $\\mathcal{D}$-modules over $\\mathbb{C}$ only.\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 7–8 and 13–14 read this run. **§4 (p. 13)**, diagram (4.1) and the\n  convolution (4.2); **definition (4.4)** of a stratified semi-small map, whose clause (a) is \"for any\n  $T\\in\\mathcal{T}$ the map $f|\\overline{T}$ is proper\"; **Lemma 4.4 (p. 14)**, \"the multiplication map\n  $G_{\\mathcal{K}}\\times_{G_{\\mathcal{O}}}\\mathrm{Gr}\\to\\mathrm{Gr}$ is a stratified semi-small map\" —\n  the numbered form of the group-case properness, with only the dimension estimate proved. **§3, p. 7**:\n  $S_\\nu=N_{\\mathcal{K}}\\cdot L_\\nu$ \"neither of finite dimension nor of finite codimension\", and\n  **Prop. 3.1(a)** $\\overline{S_\\nu}=\\bigcup_{\\eta\\leq\\nu}S_\\eta$ with the proof (pp. 7–8) exhibiting\n  $S_{\\nu-\\check\\alpha}\\subseteq\\overline{S_\\nu}$ — the published boundary case where the acting family\n  is an ind-group instead of a proper Schubert closure and the image of the action map is *not* closed.\n- **`NP01`** (Ngô–Polo) — **not re-read this run**; the Q2-L6 record above (\"§9 opening, p. 22:\n  $m_{\\mu_\\bullet}$ is *un morphisme propre*\") is cited in Q1-L3-L1's `examples.md` on that record's\n  authority and flagged there as such.\n\n### Added by `/examples` — Q1-L3-L3, second pass (compacts of a subcategory generated by compacts)\n\nAppended, not substituted for the entries above: the pages actually read on 2026-08-06 for the\npurely category-theoretic leaf of Q1-L3. Confirms and corrects the first pass's record inside that\nnode's `examples.md`; nothing here is citable.\n\n- **(no `refs.bib` key)** — A. Neeman, *The connection between the K-theory localization theorem of\n  Thomason, Trobaugh and Yao and the smashing subcategories of Bousfield and Ravenel*, Ann. Sci.\n  É.N.S. (4) **25** (1992) 547–566, doi:10.24033/asens.1659 (full text on Numdam at\n  <https://www.numdam.org/item/10.24033/asens.1659.pdf>); PDF **not** in `papers/`. Printed pp. 550–557 read on the page. **Thm 2.1** (stated twice, pp. 550\n  and 555) carries the standing hypothesis that $\\mathcal{S}^c$ is small and generates $\\mathcal{S}$,\n  i.e. ambient compact generation. **Lemma 2.2** (p. 555): \"$\\mathcal{R}^c$ … is the smallest épaisse\n  subcategory containing R\". **Lemma 2.3** (p. 556) is the hypothesis-minimal form and does **not**\n  assume ambient compact generation — only $\\mathcal{S}$ closed under coproducts and $R\\subseteq\n  \\mathcal{S}^c$ closed under suspension — and p. 556 reads \"Thus Lemma 2.2 is an immediate\n  consequence of Lemma 2.3\". This is the precedent for Q1-L3-L3's conclusion at the thick closure.\n  Also taken: **Def. 1.1** (compact objects — the first pass had cited a non-existent \"Def. 0.1–0.2\";\n  corrected in the node file), **Ex. 1.2** (p. 551: compacts of spectra are the finite spectra;\n  compacts of $D_{qc}(X)$ for $X$ quasi-compact separated are the perfect complexes), **Def. 1.3**\n  (localising), **Lemma 1.5** (p. 552, $\\mathrm{colim}\\,\\mathrm{Hom}(t,X_n)\\simeq\\mathrm{Hom}(t,\n  \\mathrm{hocolim}\\,X_n)$ for $t$ compact), **Constr. 1.6** (p. 553: every localising subcategory is\n  épaisse, by the hocolim swindle ng $E$), **Lemma 13.37.3** (hocolim presentation of any object,\n  under $\\bigoplus E_i$ compact and generating) and **Lemma 13.37.4** (a map from a compact $C$ into a\n  stage factors through an object of $\\langle E_{i_1}\\oplus\\cdots\\oplus E_{i_t}\\rangle$ for finitely\n  many indices) — the \"finitely many generators\" half of the same argument, in the form closest to\n  Q1-L3-L3's directedness step, but assuming the $E_i$ compactly generate the ambient.\n\n### Added by `/examples` — Q1-L3-L2 (convolution support bound; the counterexample to a single $\\mu$)\n\nAppended, not substituted for the entries above: the pages actually read for that node,\n2026-08-06.\n\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 4–5 and 8–16 read this run. **p. 4** carries, besides (2.1)\n  and (2.2) already recorded above, two sentences the earlier records did not extract and which\n  are what refutes the single-$\\mu$ form of the Schubert bound: \"*If $G=T$ is torus of rank $r$\n  then, as a reduced ind-scheme, $\\mathcal{G}r\\cong X_*(T)=\\mathrm{Hom}(\\mathbb{C}^*,T)$, i.e., in\n  this case the loop Grassmannian is discrete*\", and \"*the connected components of $\\mathcal{G}r$\n  are exactly parameterized by the component group of $G_{\\mathcal{K}}$ … isomorphic to\n  $\\pi_1(G)$*\". With (2.2) (closure order = sum of positive **coroots**) this says a single\n  Schubert closure lies in one connected component, so the family $\\{\\overline{\\mathrm{Gr}}_\\mu\\}$\n  is directed only when $\\pi_1(G)=0$. Note also that (2.1)'s stages $\\mathcal{G}r_n$ are described\n  only as \"*finite dimensional schemes which are $G_{\\mathcal{O}}$-invariant*\" — finite unions of\n  Schubert closures, which is the correct index. **§4 *The Convolution product*, pp. 13–15**:\n  (4.1)–(4.2) (the convolution diagram and $\\mathcal{A}_1*\\mathcal{A}_2=Rm_*\\tilde{\\mathcal{A}}$),\n  Prop. 4.2, the stratified semi-small definitions (4.4)–(4.5), Lemma 4.3, and **Lemma ts involution fixed\n  points $L^\\lambda$; $L^\\lambda_{\\le\\mu}$ **of finite type, affine, connected**), **Def. 46**\n  ($S^\\lambda\\subset LX$ by pullback along $\\tau$, $S^\\lambda_{\\le\\mu}=S^\\lambda\\cap\\overline{LX}_\\mu$),\n  **Prop. 47** — (i) $S^\\lambda\\cong L^\\lambda$, (iii) $m\\colon L^+G\\times S^\\lambda\\to LX$ formally\n  smooth, (iv) $S^\\lambda\\cap LX_\\lambda=\\{x_\\lambda\\}$ and transversality — and **Cor. 49(i)**,\n  $m\\colon L^+G\\times S^\\lambda_{\\le\\mu}\\to\\overline{LX}_\\mu$ formally smooth, whose proof is one\n  line of base change along $\\overline{LX}_\\mu\\hookrightarrow LX$ and therefore applies verbatim to\n  a **finite union** of closures. **Prop. 51** and **Ex. 52** (p. 28): for $X=\\mathrm{GL}_2/\\mathrm{O}_2$,\n  $S^0_{\\le\\omega_2}\\cong\\mathcal{N}_{\\mathfrak p}\\cong\\{xy=0\\}\\subset k^2$, reducible and non-normal.\n  Appendix A: **A.1(1)–(2)** (placid presentation; a finitely presented morphism into a placid scheme\n  descends to finite type — compatible models at scheme level), **A.1(7)** (placid *stack* = a\n  pro-smooth representable covering by a placid scheme; $H\\backslash Y$ is an example), **footnote 8\n  p. 54** (BKV and FKV write \"smooth\" for what this paper calls *pro-smooth*), **Lemma 100**\n  (formally smooth between placid schemes $\\Rightarrow$ placid, not pro-smooth), **A.5(2)–(3)**\n  ($D(\\mathcal{Y})$ for a placid stack via the Čech nerve of a covering by a scheme with a placid\n  presentation; six functors along a finitely presented representable morphism of placid stacks).\n  *What is not there:* any slice for general spherical $X$ — all of §6 uses the involution, and\n  Rem. 37 extends Theorem 36 only — and any joint-surjectivity or finitely-many-charts-suffice claim.\n- **[`zhu2025tamecategoricallocallanglands`](../../papers/zhu2025tamecategoricallocallanglands.pdf)** — §10.5, pp. 371–374 read this run. **Def. 10.114(1)**:\n  a *quasi-placid atlas* is a family of representable coh. pro r. 8.4(3)** ($K(\\mathcal{K})\\backslash\\overline{\\mathcal{O}}^\\lambda_K\\simeq\\overline{X(\\mathcal{K})^\\lambda}/G(\\mathcal{O})$);\n  **Def. 8.5, Lemma 8.6, Lemma 8.7** (= [BKV, §5.4.4, Lemma 5.5.3, Prop. 5.5.7]) — a quotient of an\n  ind-placid scheme by an ind-placid group *admits gluing of sheaves*: $\\eta_*$ well defined and\n  continuous with left adjoint $\\eta^*$ for every fp-locally closed embedding of **stacks**, plus\n  recollement; **Lemma 8.10(2)** (base change $\\eta^*_\\mathcal{S}f^!\\simeq f^!_\\mathcal{S}\\eta^*$ for\n  $f$ strongly pro-smooth). This is the *equivariant* form of the Raskin pushforward, in print, for\n  constructible sheaves. **§8.4, p. 38**: \"$\\omega_{X(\\mathcal{K})^\\lambda/G(\\mathcal{O})}\\in\n  \\mathrm{Perv}(X(\\mathcal{K})^\\lambda/G(\\mathcal{O}))$\" and\n  $\\mathrm{IC}^\\lambda_X=\\mathrm{IC}(\\omega_{X(\\mathcal{K})^\\lambda/G(\\mathcal{O})})$ — the closest\n  thing in print to the whole of Q1-L3-L4. **§13.2, p. 57**: $\\omega_{X(\\mathcal{O})/G(\\mathcal{O})}$,\n  the dualizing complex on the closed $G(\\mathcal{O})$-orbit, is the basic object of the relative\n  Satake category and the source of $A_X$.\n- **`bouthier_kazhdan_varshavsky_2022perversesheavesinfinitedimensionalstacks`** — BKV,\n  arXiv:2003.01428v7 (103 pp.). **PDF not on disk; not opened.** Wanted as the primary source for the\n  equivariant six-functor package Chen–Nadler quote as §5.4.4, Lemma 5.5.3, Prop. 5.5.7 and §6.4.2 —\n  the only place in print where the pushforward along an fp-locally closed embedding *of stacks* is\n  constructed. Anyone making Q1-L3-L4's hypothesis (B) citable should read those sections first.\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, pp. 2–5, 21–23, 57–62 read this run. New\n  relative to the records above: **Appendix A.5(2)–(3)** — $D$ of a placid stack via the Čech nerve of\n  a smooth covering, $D$ of a placid ind-stack as $\\mathrm{colim}_{i,!}D(\\mathcal{Y}^i)$ along\n  $!$-pushforward, and $f_*,f_!,f^*,f^!$ for $f$ a finitely presented *representable* morphism of\n  placid stacks; **Lemma 103 / Prop. 104** (Verdier duality $\\mathbb{D}_\\delta$ from a dimension\n  theory); **Lemma 107** and **Example 108** (standard $j_!\\mathcal{L}$, costandard $j_*\\mathcal{L}$,\n  and $\\mathrm{IC}_{\\xi,\\mathcal{O}}\\in\\mathrm{Perv}_\\delta(H\\backslash Y)$ (50)); **Thm. 3(i)** and\n  **Thm. 4** (pp. 4–5: the IC complexes of orbit closures in $LX$ are nonzero with computed stalks\n  along every smaller orbit). *Also confirmed on the page:* the proof of **Thm. 36** (p. 21) obtains\n  finite presentation through $LX_\\lambda\\cong L^iX\\times_{L^{i'}\\mathcal{X}_\\lambda}L^+\\mathcal{X}^\\bullet_\\lambda$\n  (its Lemma 34 = [SW22, Lem. 2.3.10]), i.e. through the **open-orbit** locus, and **Rem. 37** extends\n  Thm. 36 to general spherical $X$ on exactly that input — so for a non-homogeneous $X$ the orbits\n  missing the open orbit are not covered by the black box.\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 4–5 re-verified: $\\mathrm{Gr}=\\varinjlim\\mathrm{Gr}_n$ with the\n  $\\mathrm{Gr}_n$ finite-dimensional and $G_\\mathcal{O}$-invariant, $\\dim\\mathrm{Gr}^\\lambda=2\\rho(\\lambda)$,\n  $\\mathrm{Gr}^\\lambda$ a $G$-equivariant vector bundle over $G/P_\\lambda$ — the group-case\n  finite-dimensionality that collapses Q1-L3-L4 to a classical statement.\n\n### Added by `/examples` — Q1-L3-L5 (is the Hecke saturation of $L^+X$ closed?)\n\nAppended, not substituted for the entries above: the pages actually read for that node, 2026-08-06.\n\n- **[`chenyi_2025singularitiesorbitclosuresloop`](../../papers/chenyi_2025singularitiesorbitclosuresloop.pdf)** — v4, pp. 10, 16–18, 22–23 read this run.\n  **Corollary 27** (p. 17) is the find: \"(i) The closure of each $I_0$-orbit contains only finitely\n  many $I_0$-orbits. (ii) Each $L^+G$-orbit on $LX$ is a union of finitely many $I_0$-orbits.\"\n  Two lines turn this into *per-closure finiteness of $L^+G$-orbits* — the hypothesis of\n  [Q1-L3-L5](../nodes/Q1/Q1-L3/Q1-L3-L5/index.html) and, verbatim, the statement of\n  [Q1-L6-L1](../nodes/Q1/Q1-L6/Q1-L6-L1/index.html); **one source answers both nodes**,\n  by a route independent of Thm. 18 and of any dominance-interval argument. Setting: symmetric $X$\n  with $K$ connected (Cor. 27 runs through Lemma 26 and Lemma 23(iii), the latter using\n  Prop. 17(ii)). Also verified on the page: **Lemma 38** (p. 22) proves filteredness of the closure\n  order with the parenthesis \"note that we assume $K$ is connected\"; **Prop. 39(ii)** (p. 23) is the\n  $L^+G$-placid presentation, i.e. the $\\Sigma=\\Lambda_X^+$ case of Q1-L3-L5(1) and nothing beyond\n  it; **Prop. 17(ii)** (p. 10) gives $G(F)/K(F)\\cong X(F)$, whence $LG$ is transitive on $LX(k)$ and\n  the saturation $LX^{\\mathrm{sat}}$ of [Q1-L3](../nodes/Q1/Q1-L3/index.html) is *all* of\n  $|LX|$ in the symmetric case — the closedness question is degenerate exactly where Cor. 27 bites.\n- **[`SV17`](../../papers/SV17.pdf)** — printed pp. 76–78 (PDF pages 80–82; the offset is $+4$) read this run. §5.3\n  *Cartan decomposition*: **Lemma 5.3.1** ($A_X^+U=X$ for a compact $U$), **Cor. 5.3.2** (Wavefront\n  Lemma), **Thm. 5.3.3** — \"the set $A_X^+\\subset X$ contains a complete set of representatives for\n  $K$-orbits on $X$\", under the additional assumptions stated just above it, including\n  $x_0\\in\\mathring{\\mathbf{X}}(\\mathfrak{o})$ and $K=\\mathbf{G}(\\mathfrak{o})$ hyperspecial. That is\n  the function-theoretic form of $X(F)=G(F)\\cdot X(\\mathfrak{o})$: the classical shadow of\n  \"the Hecke saturation is everything\", over a $p$-adic field. Attributed there to [Sak12] via an\n  argument of [GN10]; symmetric case [DS11].\n- **[`mirkovic2007geometric`](../../papers/mirkovic2007geometric.pdf)** — pp. 4–5 re-verified on this run's own eyes: (2.1), the\n  $G_{\\mathcal{O}}$-orbit parametrization lacid scheme,\n  $D(\\mathcal{Y})=\\varprojlim^*_{[n]}D(X^{[n]})$ over the Čech nerve of a pro-smooth covering for a\n  placid stack, and — the one that matters — $D(\\mathcal{Y})=\\mathrm{colim}_{i,!}D(\\mathcal{Y}^i)$ for a\n  placid **ind**-stack, with $f_*,f_!,f^*,f^!$ available for every finitely presented representable $f$.\n  Also **Lemma 103**, **Prop. 104**, **Lemma 106** (Verdier duality on $D(H\\backslash Y)$), **A.7** (the\n  $*$-adapted perverse $t$-structure, following [BKV11, §6]). Consequence recorded for whoever writes\n  the appendix entry: in this framework \"the object lives on a step\" is *definitional*, so no hypothesis\n  of the shape of Q1-L5-L3-L3's **(A)** is ever needed.\n- **[`zhu2025tamecategoricallocallanglands`](../../papers/zhu2025tamecategoricallocallanglands.pdf)** — §10.5, pp. 371–378, re-read this run for the reading\n  question rather than for the $BH$ facts the earlier record took. **Def. 10.114** (quasi-placid stack:\n  an atlas by standard placid algebraic spaces along representable **coh. pro-smooth** maps, with every\n  perfect test covered by a *finite* subfamily — structurally the same shape as hypothesis (B) of\n  [Q1-L5-L3-L1](../nodes/Q1/Q1-L5/Q1-L5-L3/Q1-L5-L3-L1/index.html)); **Ex. 10.117**\n  ($X/H$ placid and $(X/H)_{\\mathrm{fpqc}}$ quasi-placid for $H$ a cofiltered limit of smooth group\n  schemes acting on a standard placid space, with $X\\rightarrow(X/H)_{\\mathrm{fpqc}}$ representable\n  strongly coh. pro-smooth); **§10.5.2**, p. 373 — constructibility tested on \"some, equivalently any\"\n  quasi-placid atlas, and \"By definition, the constructible categories are preserved by $!$-pullback\n  along **any** morphism\"; **Prop. 10.124**; p. 377, \"$f^!$ always preserves constructible subcategories\".\n  What is **not** in these pages: any treatment of an ind-placid stack, so $K\\backslash LX$ is outside\n  the class as stated.\n- **[`raskin_dmodules_infinite_var`](../../papers/raskin_dmodules_infinite_var.pdf)**
