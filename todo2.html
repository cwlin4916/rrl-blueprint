<header class="bar"><nav class="crumbs"><a href="dag.html">the DAG</a><i>›</i><span>todo2</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>To do 2 — write the `/tighten` specification</h1><p class="lead">Generated from <code>process/todo2.md</code>.</p><div id="doc"></div></main><script>const SRC = "\n[the four questions](todo1.html) · [README](readme.html) · [writing a skill](process/pipeline/writing-a-skill.html) · [the operator page](process/pipeline/operators/tighten.html) · [pipeline](process/pipeline.html) · [decisions](process/decisions/README.html)\n\nThis is the one item on the collaborator's list that ends in a file that runs. It is under\ndevelopment on purpose: the goal is settled and the specification is empty, and we would\nrather have it written by somebody who is not us.\n\n## The goal is settled: a node a reader can understand\n\nSomeone opens `blueprint/nodes/<id>/proof.md` cold, reads it once, and comes away knowing\nwhat the node claims and why it holds. Where they cannot, `/tighten` is the operator that\nfixes it.\n\n## How a run achieves that is not settled\n\nThe version that was there measured word count — cut what restates the appendix, freeze\nthe argument's skeleton so the count could not be gamed, fail if the count did not fall.\nThe gate was sound. It was gating a proxy, and shortening and comprehensibility come apart\nin both directions\n([ADR 0092](process/decisions/0092-tightens-goal-is-comprehension-and-its-specification-is-open.html)).\nIt is in git if you want it: `git log -- .claude/skills/tighten/SKILL.md`.\n\nRead these three, in this order:\n\n```\nprocess/pipeline/operators/tighten.md ....... the goal, and the four constraints\nprocess/pipeline/writing-a-skill.md ......... how a skill file is built\n.claude/skills/decompose/SKILL.md ........... the worked example — a specified operator\n```\n\nThen write `.claude/skills/tighten/SKILL.md`, or write the part of it you are sure of.\nThe four constraints, from [the operator page](process/pipeline/operators/tighten.html):\n\n- define **comprehensible** so that a run can *fail* against it;\n- leave every claim that was on the page still on it;\n- let something **other than the run** check both of those;\n- touch no `## Statement` — that is [`/update`](process/pipeline/operators/update.html)'s.\n\nThe first is the hard one and the other three are nearly forced. What would you measure?\n\n## The shape of a skill, in four steps\n\n[`writing-a-skill.md`](process/pipeline/writing-a-skill.html) is dense — it reads as a post-mortem\nof what went wrong rather than as a manual. Here is the same thing as a procedure. The\nphilosophy under all of it: **a skill has exactly one job, and it ends in mechanical proof\nthat the job is done, without taking the agent's word for it.**\n\n**1 — the basics.** The *signature*: what the command is and what argument it takes\n(`/tighten <node-id>`). The *goal*: exactly one sentence stating what must be true when\nthe run is over.\n\n**2 — the boundaries.** A *guard*, the pre-check that makes the skill refuse to start —\nthe node is claimed by another run, the write-up does not exist, the status forbids it. And\n*stops*, a table of symptoms saying when this skill must stop and hand over to a different\noperator: a wrong claim is `/update`'s, a write-up doing two nodes' work is\n`/decompose`'s.\n\n**3 — the steps.** A strict numbered sequence, purely mechanical. Do not ask the agent to\nweigh prose or make a subjective judgement in the middle of a step. State exactly which\nfile paths the run may write to and which it may not.\n\n**4 — the gate.** A strict external check that can **FAIL** — a Python script, a `git\ndiff` over frozen lines, a count against a file on disk. If the checker does not print\n`OK`, the run did not pass.\n\n### What an LLM can draft for you, and what it cannot\n\nDrafting the numbered steps from your one-sentence goal, writing the gate *script*,\nbrainstorming the guard and the stops table by asking it for the failure modes, and\nreformatting your rough notes into the required shape — all fine, and faster than doing it\nby hand.\n\nTwo things it cannot do, and they are the two the framework exists to protect. **The\nverification itself:** an LLM prompt may not *be* the gate. The agent grading its own\noutput is the failure mode this whole design is built against, so the check stays a\nseparate mechanical script. And **path resolution:** a subagent is never asked to\nreconstruct or guess a file path. The orchestrator works the target directory out once, in\nthe main thread, and hands it over.\n\n## What comes back\n\n`.claude/skills/tighten/SKILL.md`, or the part of it you are sure of, or a paragraph\nsaying the operator should not exist and what should happen instead. All three are useful\nanswers; the third is the one nobody here can give.\n";</script>
