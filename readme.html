<header class="bar"><nav class="crumbs"><a href="dag.html">the DAG</a><i>›</i><span>README</span></nav><div class="spacer"></div><a class="ghost wide" id="home" href="dag.html" title="the DAG — every question, side by side">⌂ DAG</a><a class="ghost wide" id="appendix" href="appendix/index.html" title="the appendix of objects — the closed world a proof may cite">appendix</a><a class="ghost wide" id="philosophy" href="philosophy/index.html" title="why the machine is shaped this way — the working note behind it">philosophy</a><a class="ghost wide" id="todo" href="todo1.html" title="what a collaborator is being asked to read and write">to&nbsp;do</a><button class="ghost" id="theme" title="light / dark">◐</button></header><main class="prose"><h1>RamifiedRelativeLanglands</h1><p class="lead">Generated from <code>README.md</code>.</p><div id="doc"></div></main><script>const SRC = "\nThis repository holds two things, and confusing them is the one mistake worth warning about up front.\n\n**The paper** — *On a tamely ramified local relative Langlands conjecture via categorical representations* (Milton Lin, Toan Pham, Jize Yu) — is written by hand in [`main.tex`](../main.tex).\n\n**The pipeline** is a machine that takes a research question, splits it into precisely stated lemmas, proves them one at a time, and has every proof refereed by a hostile critic. It writes only into [`blueprint/`](../blueprint), and nothing crosses from there into the paper without a person moving it.\n\nEverything the pipeline does is a file in git. That is the point: every claim can be traced to what justified it, and every referee report that ever ran is still on disk.\n\n## What the pipeline does\n\nYou give it a question. It produces a **DAG of lemmas** — one directory per lemma, each with a statement sharp enough to be proved or refuted on its own, and edges recording which lemma needs which.\n\nThen, on any one lemma: a **prover** writes a one-page write-up; a **critic** — an agent with no ability to edit a single file — reads it against the sources and files a report ending in `VERDICT: PASS` or `VERDICT: FAIL`; the session orchestrating the run writes the resulting status back to the lemma. A `FAIL` sends the write-up round again, at most once.\n\nOne rule makes the output auditable. **A proof may cite exactly three things**: an entry in [`blueprint/appendix/`](appendix/index.html), one of the node's own proved dependencies, and standard mathematics needing no citation.\n\nA statement that is true but has no appendix entry is *not available* to a proof. Widening what may be assumed is a deliberate, recorded act — never something a prover does mid-argument to get past a gap.\n\n## Start here\n\nYou need **python3** — standard library only, there is nothing to install — and **[Claude Code](https://claude.com/claude-code)** or **Codex** to run the workflows. `latexmk` is needed only to build the paper's PDF.\n\nThe site is tracked, so a fresh clone already has it — open it directly. Rebuild first if you have changed anything under `blueprint/`:\n\n```\npython3 tools/build_dag_site.py\nopen blueprint_site/dag.html\n```\n\n[`dag.html`](dag.html) is the front door and the graph itself — one box per lemma, coloured by confidence, each clicking through to its statement, its write-up and its referee reports. Its `▾ menu` lists every other page. If somebody has handed you this repository and asked you to do something with it, [`todo1.html`](todo1.html) — generated from [`process/todo1.md`](todo1.html) — is what they are asking for: three questions, twenty minutes each, and it is the `to do` tab in the top right of every page. The one piece of actual work, writing the `/tighten` specification, has a page of its own at [`todo2.html`](todo2.html), and the reading behind the two design questions is [`process/references/`](process/references/index.html) — twenty entries, seventeen PDFs, published with the site.\n\nThen read one lemma end to end, because the shape of a node is the thing everything else in this repo is arranged around. [`blueprint/nodes/Q1/Q1-L1/`](nodes/Q1/Q1-L1/index.html) is the smallest complete one: a statement, a proof that passed, the critiques it passed against, and instances from the literature.\n\nFor the live tally — how many lemmas are proved, ready, open or failing — run `/research-status`, or read the generated block in [`blueprint/main_dag.md`](dag.html). Those numbers are stored in exactly one place and are deliberately not repeated here.\n\n## The words this repo uses\n\n| Term | Meaning |\n|---|---|\n| **node** | one lemma, and one directory; the unit of work |\n| **statement** | a node's frozen claim — set at creation, revised only by `/update`, which logs the revision |\n| **the appendix** | [`blueprint/appendix/`](appendix/index.html), the closed world of objects a proof may invoke |\n| **status** | `open`, `drafted`, `gapped`, `failing`, `proved` — stored on the node; `ready` is *derived* from its dependencies, never stored. There is no `blocked`: an unproved dependency contributes its statement, which a proof may assume as long as it says so ([ADR 0045](process/decisions/0045-there-is-no-blocked-node.html)) |\n| **gapped** | the statement stands and the *appendix* is short a fact the proof needs. Not a failure — it scores the same as `open`, and the prover leaves a `gaps/g<n>.md` that is itself a ready-to-paste commission ([ADR 0076](process/decisions/0076-a-gap-is-a-prompt.html)) |\n| **role** | `proof`, `evidence`, `example`, `analogy`, `consequence`, `thought` — only `proof` nodes carry the argument; the others corroborate it, and differ by *direction* ([ADR 0015](process/decisions/0015-every-node-declares-its-role.html), [ADR 0073](process/decisions/0073-a-consequence-is-a-node-class.html)) |\n| **confidence** | a signed number in $[-1,+1]$, derived — see below |\n\n### How confidence is computed\n\nFour questions, each worth some points. That is the whole formula ([ADR 0081](process/decisions/0081-confidence-is-a-weighted-sum.html)).\n\n| | the question it answers | worth | where the answer lives |\n|---|---|---|---|\n| $H$ | *Has a person vouched for this?* | 20 | the `human:` line — **the user's alone**, no agent writes it |\n| $D$ | *Did a referee accept the proof?* | 35 | the rounds in the node's `critiques/` |\n| $L$ | *Does the literature back it up?* | 15 | the `EVIDENCE:` line of `examples.md` |\n| $R$ | *Is what it rests on healthy?* | 30 | the confidence of the weakest dependency |\n\nEach answer is itself a number in $[-1,+1]$. Multiply, add, and cap once against the key-example bench ([ADR 0040](process/decisions/0040-the-key-example-register.html)):\n\n$$\nC \\ = \\ \\min\\Bigl(\\ \\mathrm{goalcap},\\ \\ 0.20\\,H + 0.35\\,D + 0.15\\,L + 0.30\\,R \\ \\Bigr)\n$$\n\nThree properties are worth knowing before reading any node page. **Silence costs nothing** — a channel nobody has answered scores $0$ and keeps its weight unclaimed rather than sharing it out, so an untouched node sits at exactly $0$: unweighed, not doubted. **The user is the last 20 points** — with $H$ silent the rest sum to at most $0.80$, so full confidence is unreachable until someone writes `human: approved`; that is arithmetic, not a special rule. And **a leaf skips $R$** — with no dependencies there is nothing for it to measure, so its 30 points are shared over the other three, because having no children is not a reason to believe a claim less.\n\n$R$ is a **term and not a ceiling**: a strong node resting on a refuted one reads positive-but-discounted rather than simply refuted, and the panel says which dependency took the points. That reverses [ADR 0068](process/decisions/0068-the-weakest-link-is-a-ceiling.html), under which one red descendant floored every node above it — five nodes read exactly $-50\\%$ for reasons that had nothing to do with them, and a display where five nodes carry the same number has stopped carrying information.\n\nConfidence is computed, never written down — no file has a `confidence:` field, and nothing may cite the number. It is derived from the audit trail, so it can never become evidence inside it. Every node page shows the arithmetic: one row per channel, what it scored, what it contributed, and a link to the record it scored ([ADR 0042](process/decisions/0042-confidence-shows-its-working.html)).\n\n## Your first session\n\n```\n/research-status                      # what exists, and what is worth doing next\n/decompose \"When is D_c(K\\LX)^Sat = D_c(K\\LX)?\"\n                                      # → one directory per lemma; now READ them\n/prove Q1-L1                          # start at a leaf, where nothing is assumed\n/examples Q1-L1                       # instances of the statement in the literature\n/research-status                      # Q1-L2 has just become ready\n```\n\nRun every command from the repository root.\n\n**Reading the decomposition is the step you cannot delegate.** It is the research strategy in full, and a wrong one quietly wastes every proof underneath it.\n\n**Read the critique, not the verdict.** `PASS` means one hostile reader with the appendix in hand found no gap — it is evidence, not a certificate. Repeated `FAIL`s on one node are usually telling you something about the *statement*, not the proof.\n\nFor a hands-off run, after you have read the decomposition:\n\n> Run /prove on every ready node, in dependency order, until none are ready or one fails. Commit after each.\n\nEach success unblocks its dependents, so the loop walks the DAG on its own. Every outcome is committed, so you can stop and resume whenever.\n\n## The commands\n\nTen workflows. Claude Code runs the canonical definitions in [`.claude/skills/`](../.claude/skills) with the six agents in [`.claude/agents/`](../.claude/agents); Codex runs the thin adapters in [`.agents/skills/`](../.agents/skills) as `$name`, over the same instructions, gates and commit discipline.\n\n| Command | Input | Output |\n|---|---|---|\n| `/research-status` | nothing | every node as proved / ready / open / failing, plus the next thing worth doing |\n| `/decompose \"<question>\"` | a question in prose | one directory per new lemma, a question section in the index, and any appendix entries they need |\n| `/decompose <node-id>` | a node id | sub-lemmas `<id>-L1`, `<id>-L2`, … nested inside it as its dependencies |\n| `/prove <node-id>` | a node whose dependencies are all proved | `proof.md`, one or two reports under `critiques/`, and the node's new status |\n| `/examples <node-id>` | a node id | exactly one of `examples.md` or `prompts/examples.md` |\n| `/check-goal <node-id>` | a node id | `goalcheck.md` — what the statement says on each case where the answer is known, and a `GOALCHECK:` verdict that can only lower the node's confidence |\n| `/update [id] [with input <passage>]` | nothing, a question, or a node — optionally a passage, verified before adoption | sharpened problem statements, corrected node statements logged in `updates/`, and a re-ranked `## Pipeline` on each question |\n| `/generalize <node-id>` | a node, optionally with a passage | a new abstraction node `<id>-z<k>` that the target specializes — never a widened statement in place, and the honest outcome of most invocations is that one of its three tests fails ([ADR 0078](process/decisions/0078-generalize-is-its-own-operator.html)) |\n| `/tighten <node-id>` | a node with a write-up | **nothing — the specification is open.** Its goal is a write-up a reader can follow; the version that measured word count was gating a proxy, and a collaborator writes the replacement ([ADR 0092](process/decisions/0092-tightens-goal-is-comprehension-and-its-specification-is-open.html), superseding [ADR 0083](process/decisions/0083-tightening-is-its-own-operator.html)) |\n| `/create \"<claim>\"` | a claim that re-presents the problem rather than refining a node | one node at **the deepest layer whose statement still holds** under the new presentation, and a history entry naming which of the objects, morphisms, ambient category, equivalence, invariants or notion of solution moved ([ADR 0088](process/decisions/0088-create-records-a-change-of-presentation.html)) |\n| `/why <node-id> \"<question>\"` | a node **and a question a reader actually asked** | `why/w<n>.md` — under 300 words that delegate to references, drawn as an expandable panel above the node's statement. Outside the closed world, and it moves no number |\n\n`/prove` runs at most **two rounds and one widening per invocation** ([ADR 0030](process/decisions/0030-the-prove-budget-cap.html)). The cap is a spending decision measured on real runs, not a claim about mathematics: a node that passes in one round costs about 270k subagent tokens, a second round roughly triples that, and a third round has never yet turned a `FAIL` into a `PASS`.\n\nEach command that writes prose ends with a **presentation pass** — one `checker` subagent per file it wrote, under a content-preservation gate the orchestrator runs itself and never takes the checker's word for ([ADR 0031](process/decisions/0031-presentation-is-a-stage-not-a-command.html)). Tidying is never a step anyone has to remember.\n\nOn Codex, start a fresh session if `/skills` does not list all ten.\n\n### Branching off a node\n\n`/decompose <node-id>` adds children inside the parent's directory, wires them in as dependencies, and gives the parent its own graph page. The parent's `## Statement` stays frozen throughout — expanding a lemma changes how it is proved, never what it claims.\n\nTwo cautions. Expanding an already-`proved` node leaves a write-up that no longer stands on its own, so the command asks first.\n\nAnd the sideways move — a lemma raising a question it does not itself answer — has no command: write `blueprint/questions/<slug>.md` by hand and `/decompose` that.\n\n## What is in this repo\n\n```\nRamifiedRelativeLanglands/\n├── main.tex  preamble.tex  refs.bib  other_sections/   MANUSCRIPT — humans only\n├── blueprint/                                          REASONING  — agents write here\n├── papers/                                             REFERENCES — what we read\n├── process/                                            PROCESS    — how and why\n├── tools/  .claude/  .agents/  .codex/  tests/         MACHINERY  — the pipeline\n└── blueprint_site/  build/                             GENERATED  — never edit by hand\n```\n\nEvery directory is one of six kinds, and its kind decides who may write in it.\n\n| Path | Kind | Who writes |\n|---|---|---|\n| `main.tex`, `preamble.tex`, `refs.bib`, `other_sections/` | **manuscript** | humans only, never an agent |\n| `blueprint/` | **reasoning** | agents, each in its own lane |\n| `papers/` | **references** | humans; prover and example-finder append to `guideline.md` |\n| `process/` | **process** | humans, and the checker for presentation |\n| `tools/`, `.claude/`, `.agents/`, `.codex/`, `tests/` | **machinery** | humans |\n| `blueprint_site/`, `build/` | **generated** | nobody — one command reproduces each; `blueprint_site/` is tracked, `build/` is not |\n\nThe sources the project actually reads live in [`papers/`](../papers) as PDFs named by their `refs.bib` key, with `guideline.md` as the index. An agent that needs to know what a source says reads the PDF on disk before its own memory and before the web ([ADR 0017](process/decisions/0017-operators-read-the-local-library.html)). Being in `papers/` is not the same as being citable — that is the appendix.\n\n### Inside `blueprint/`\n\n| Path | What it is |\n|---|---|\n| `blueprint/appendix/` | the closed world: every object a proof may invoke, one full entry each |\n| `context.md` | what is in force — setting, standing hypotheses, ratified readings |\n| `key_examples.md` | the bench: the cases where the answer to the goal question is settled in print, each saying what it reaches and what it does not |\n| `main_dag.md` | the per-question index, its tree generated; the framing lives in `nodes/Q<n>/Q<n>_node.md` |\n| `nodes/<id>/` | one directory per node, the unit of work |\n| `priorities.md` | superseded tombstone; the ranked next actions are each question's `## Pipeline`, five at most, written by `/update` |\n| `questions/` | seed questions not yet decomposed |\n\nA node directory:\n\n```\nblueprint/nodes/Q1/Q1-L1/\n├── Q1-L1_node.md       the lemma: its fields, and the frozen ## Statement\n├── Q1-L1_history.md    every dated entry in its life, oldest first\n├── Q1-L1_prompt.md     generated self-contained packet; never edit or cite it\n├── proof.md            the write-up, at most 1500 words\n├── goalcheck.md        what the key examples say about this statement (when /check-goal has run)\n├── critiques/          r1.md, r2.md, … append-only, never renumbered\n├── updates/            u1.md, u2.md, … one per statement revision\n├── gaps/               g1.md, g2.md, … each a paste-ready commission for the appendix\n├── why/                w1.md, w2.md, … one reader's question each, answered in under 300 words\n└── examples.md         instances from the literature (or prompts/ when none)\n```\n\nThe three files named for the node *are* the node — its fields, its life, its packet, one of each. Everything else is work done on it, numbered or singular within the directory ([ADR 0032](process/decisions/0032-a-nodes-own-file-is-named-for-the-node.html)).\n\n**A node's id is its path.** `Q1-L2-L1` lives inside its parent at `blueprint/nodes/Q1/Q1-L2/Q1-L2-L1/`, so decomposing only ever adds directories and never moves one.\n\nA write-up restates the frozen statement, then proves it in numbered steps, linking appendix entries instead of restating them; copy [`blueprint/nodes/_template.md`](../blueprint/nodes/_template.md).\n\n`<id>_prompt.md` is a portable view of a node — statement, question context, prerequisites, appendix inputs and their transitive vocabulary, matching bibliography — refreshed by the site build, rejected when stale, and citable by nobody ([ADR 0029](process/decisions/0029-every-node-has-a-generated-self-contained-prompt.html)).\n\n### Two things that surprise people\n\n**`blueprint_site/` is tracked, but still generated.** It ships with the repository so a clone carries the readable form of the blueprint without a rebuild ([ADR 0033](process/decisions/0033-the-generated-site-is-tracked-again.html), reversing the first clause of [ADR 0010](process/decisions/0010-site-untracked-and-renamed.html)). Being in git does not make it a source: one command reproduces every page, `--check` rejects a stale one, and nobody edits it by hand. Note that github.com serves `.html` as source rather than rendering it, so reading the site still means opening [`blueprint_site/dag.html`](dag.html) from a checkout.\n\n**Nothing authoritative is read back out of a generated readout.** A fact that lives only in a generated page belongs in `<id>_node.md`, the question framing, a dependency, the appendix or `refs.bib`.\n\n## The six actors\n\n| Actor | Writes | Never |\n|---|---|---|\n| **lead-researcher** | lemma statements, new appendix entries | a proof, or a generated index bullet |\n| **prover** | one file, `blueprint/nodes/<id>/proof.md` | the DAG |\n| **critic** | one file, a report ending in `VERDICT:` | anything else — it has no edit and no shell tools, the most load-bearing choice in the repo |\n| **checker** | reformatted prose | a status, a verdict, an anchor, any manuscript `.tex` |\n| **example-finder** | `examples.md` or `prompts/examples.md`, plus an append to `papers/guideline.md` | `<id>_node.md`, the appendix, `refs.bib`, any status |\n| **goal-checker** | one file, `blueprint/nodes/<id>/goalcheck.md` | the register it is judged against, a statement, a field — and it has no web access |\n\nThe host session orchestrates. It re-runs the gates itself, shuttles critiques back, writes every status, regenerates the prompts and site, and commits.\n\n```\nquestion ──/decompose──> node directories ──/prove──> prover ─> render ─> critic ─> VERDICT\n                                                        ^                              │\n                                                        └────── FAIL, ≤2 rounds ───────┘\n                                                                                       │ PASS\n                                                                   status write-back + commit\n```\n\n## What makes it auditable\n\n- **The appendix is the closed world** — a proof may invoke any appendix entry, its own dependencies and standard mathematics, and nothing else, *even when the claim is true*. A fact no entry supplies is a `GAP` that stops the prover, and writing the entry is the only way the world grows. A node's `objects:` field records what its write-up used and gates nothing; the render gate recomputes it ([ADR 0071](process/decisions/0071-the-closed-world-is-the-appendix.html)).\n- **One node, one directory, one page** — a page suffices only because proofs cite their ingredients instead of restating them, so a node that will not fit is several nodes.\n- **Every fact is stored once** — anything that repeats a status, title or dependency is generated, so nothing can drift.\n- **Examples illustrate, never justify** — `examples.md` sits outside the closed world; it argues that a statement is worth believing and never discharges an obligation in a proof. When the literature yields nothing, `/examples` writes an honest open prompt under `prompts/` rather than inventing an instance.\n- **Nobody grades their own work** — statements freeze before proofs start, the orchestrator re-runs the gates itself, and critiques are append-only.\n- **`human:` is the user's field and no agent's** — the one field in the repository that not even the `/prove` orchestrator writes. It is worth 20 of the 100 points of confidence, so nothing the machine can do on its own reaches full marks.\n- **A negative node says what would clear it** — a one-line `needs:` field naming the missing facts and what the repair is worth, authored because which fact would clear a defect is a judgement no gate can compute, and carried out with the generated prompt ([ADR 0077](process/decisions/0077-the-ask-is-a-line-on-the-node.html)).\n\nThe rest, each rule paired with the failure it prevents, is in [`process/pipeline.md`](process/pipeline.html).\n\n## Checking the repo against itself\n\n```\npython3 tests/run_tests.py               # the invariants, the laws, the tool contracts\npython3 tools/build_dag_site.py --check  # the DAG and readouts: status drift, stale prompts/pages\npython3 tools/check_render.py            # everything renders, every write-up fits the page\n```\n\nThree offline checks, fastest first, none subsuming another — *do the rules still hold*, *does the DAG agree with itself*, *does it render* — with `--slow` adding the rebuild-from-nothing run ([`tests/README.md`](../tests/README.md)).\n\n## Building the paper\n\n```\nlatexmk -pdf -interaction=nonstopmode -halt-on-error main.tex\n```\n\nAlways from the repository root, since `\\input{preamble}` and `\\addbibresource{refs.bib}` are relative; everything lands in gitignored `build/`.\n\nNode write-ups are markdown in standard KaTeX, so they render on GitHub, in the VS Code preview and on the site with no LaTeX pass at all.\n\n## Where to read next\n\n| | |\n|---|---|\n| **What each operator does, and every condition under which it stops** | [`process/pipeline/operators/`](process/pipeline/operators/index.html) |\n| **Who may write what, actor by actor** | [`process/pipeline/actors/`](process/pipeline/actors/index.html) |\n| **What a referee report is actually saying** — the eight kinds of flaw | [`process/pipeline/flaws.md`](process/pipeline/flaws.html) |\n| What the pipeline has actually done, counted from disk | [`process/pipeline/statistics.md`](process/pipeline/statistics.html), `python3 tools/stats.py` |\n| The whole machine on one page, as tables | [`process/operations.md`](process/operations.html) |\n| How the pipeline is designed, each rule with its failure | [`process/pipeline.md`](process/pipeline.html) |\n| The same design with the mathematics removed | [`process/problem_generation_pipeline.md`](process/problem_generation_pipeline.html) |\n| Why each choice was made, one record per decision | [`process/decisions/`](../process/decisions) |\n| What happened, in order | [`process/journal.md`](process/journal.html) |\n| What is still undecided | [`thoughts.md`](thoughts.html) |\n| Conventions for agents working in this repo | [`CLAUDE.md`](../CLAUDE.md), [`AGENTS.md`](../AGENTS.md) |\n";</script>
